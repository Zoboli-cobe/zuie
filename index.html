）", "options": ["A.α-酸性糖蛋白与碱性药物结合率通常不受CKD影响", "B.白蛋白与酸性药物结合率升高", "C.α-酸性糖蛋白与碱性药物结合率明显升高", "D.所有药物蛋白结合率均不变", "E.蛋白结合率升高使Vd升高"], "answer": "A", "explanation": "CKD时白蛋白与酸性药物结合率下降，而α-酸性糖蛋白与碱性药物的结合率通常不受影响；蛋白结合率下降使Vd升高，药物清除增加，无显著临床意义。"}, {"text": "CKD5期患者地高辛的表观分布容积（Vd）变化是（  ）", "options": ["A.升高50%", "B.下降50%", "C.升高100%", "D.不变", "E.下降80%"], "answer": "B", "explanation": "地高辛在CKD5期组织亲和力下降、Vd下降50%，应减少给药剂量以达到安全血药浓度范围。"}, {"text": "CKD时细胞外液和总体液量增加，对低中度Vd药物的影响是（  ）", "options": ["A.Vd下降", "B.Vd升高", "C.Vd不变", "D.Vd先降后升", "E.无法判断"], "answer": "B", "explanation": "CKD时体液潴留、细胞外液增加、总体液量增加，对低中度Vd（小于0.7L/kg）的药物影响大，可使Vd升高，如氨基糖苷类、头孢菌素类。"}, {"text": "肾功能不全患者应用常规剂量吗啡容易出现毒性反应，其主要原因是（  ）", "options": ["A.吗啡原型经肾排泄增多", "B.活性代谢产物3-葡萄糖醛酸吗啡、6-葡萄糖醛酸吗啡经肾排泄蓄积", "C.吗啡肝脏代谢加快", "D.吗啡血浆蛋白结合率升高", "E.吗啡表观分布容积下降"], "answer": "B", "explanation": "吗啡有5种代谢产物，仅4%以原型从肾脏排出；主要代谢产物3-葡萄糖醛酸吗啡、6-葡萄糖醛酸吗啡经肾排泄，其中6-葡萄糖醛酸吗啡活性比吗啡更强，故肾功不全时易蓄积中毒。"}, {"text": "CKD对PK参数影响的总体结果是（  ）", "options": ["A.生物利用度升高、清除率升高", "B.生物利用度下降、Vd升高、清除率下降、半衰期延长", "C.表观分布容积下降、清除率下降", "D.半衰期缩短、清除率升高", "E.各参数均无变化"], "answer": "B", "explanation": "CKD时生物利用度（F）下降、血浆蛋白结合率下降、表观分布容积升高、清除率下降、半衰期延长，总体表现为药物蓄积增加。"}, {"text": "药物吸收后从体循环到达机体各组织、器官的过程称为（  ）", "options": ["A.吸收", "B.分布", "C.代谢", "D.排泄", "E.消除"], "answer": "B", "explanation": "分布是药物吸收后从体循环到达机体各个组织、器官的过程，与药物的理化性质、组织血流量、药物与组织的亲和力以及一些特殊屏障有关。"}, {"text": "CKD患者需要减量的药物，其肾清除百分数（Fe）一般为（  ）", "options": ["A.Fe&gt;10%", "B.Fe&gt;20%", "C.Fe&gt;30%", "D.Fe&gt;50%", "E.Fe&gt;70%"], "answer": "C", "explanation": "肾清除百分数Fe&gt;30%时，CKD患者需要减量。"}, {"text": "根据肌酐清除率粗略估算维持剂量，当Ccr为10~40ml/min时，药物剂量应为（  ）", "options": ["A.75%~100%正常剂量", "B.50%~75%正常剂量", "C.25%~50%正常剂量", "D.无需调整", "E.停用"], "answer": "B", "explanation": "粗略估算中，Ccr为40~60ml/min时用75%~100%正常剂量；10~40ml/min时用50%~75%；小于10ml/min时用25%~50%。"}, {"text": "根据Luzius Dettli公式，若药物半衰期增加到5倍且给药间隔不变，给药剂量可减少到（  ）", "options": ["A.1/2", "B.1/3", "C.1/4", "D.1/5", "E.1/10"], "answer": "D", "explanation": "根据Luzius Dettli公式，给药间隔不变时，半衰期增加到5倍，给药剂量可以减少到1/5。"}, {"text": "根据Calvin Kunin公式调整给药方案，维持剂量和给药间隔的正确描述是（  ）", "options": ["A.维持剂量为初始剂量的2倍，间隔为2个半衰期", "B.维持剂量为初始剂量的一半，间隔为1个半衰期", "C.维持剂量等于初始剂量，间隔为1个半衰期", "D.维持剂量为初始剂量的1/4，间隔为2个半衰期", "E.维持剂量为初始剂量的一半，间隔为2个半衰期"], "answer": "B", "explanation": "根据Calvin Kunin公式，初始剂量同正常初始剂量，维持剂量为初始剂量的一半，给药间隔为半衰期，用于病重患者迅速达到有效血药浓度。"}, {"text": "透析患者药物的总清除率（CLT）等于（  ）", "options": ["A.CLEC+CLR", "B.CLEC+CLRN", "C.CLEC+CLR+CLRN", "D.CLR+CLRN", "E.CLEC+CLR-CLRN"], "answer": "C", "explanation": "透析患者药物的总清除率CLT=CLEC+CLR+CLRN，即体外清除率加肾脏清除率和肾脏外清除率。"}, {"text": "影响血液透析体外清除率（CLEC）的药物因素中，血浆蛋白结合率高于80%时（  ）", "options": ["A.CLEC升高", "B.CLEC降低", "C.CLEC不变", "D.CLEC先升后降", "E.CLEC无法评价"], "answer": "B", "explanation": "只有游离药物才能被清除，药物血浆蛋白结合率大于80%时CLEC低，如钙通道阻滞剂。"}, {"text": "就体外清除率而言，不同透析膜由高到低的排序是（  ）", "options": ["A.醋酸纤维膜&gt;聚丙烯腈&gt;聚砜膜", "B.聚砜膜&gt;聚丙烯腈&gt;醋酸纤维膜", "C.聚丙烯腈&gt;醋酸纤维膜&gt;聚砜膜", "D.醋酸纤维膜&gt;聚砜膜&gt;聚丙烯腈", "E.三者无差别"], "answer": "B", "explanation": "体外清除率（CLEC）由高到低为聚砜膜&gt;聚丙烯腈&gt;醋酸纤维膜。"}, {"text": "关于血液净化方式对药物清除的影响，正确的表述是（  ）", "options": ["A.各种血液净化方式对药物清除的影响可以准确预测", "B.各种血液净化方式对药物清除的影响难以明确预测", "C.仅血液透析可以准确预测", "D.仅血液灌流可以准确预测", "E.与药物性质完全无关"], "answer": "B", "explanation": "各种血液净化方式对药物清除的影响难以明确预测，需结合药物与净化方式多方面因素综合判断。"}, {"text": "哌拉西林/他唑巴坦注射剂在血液透析时的用法是（  ）", "options": ["A.2.25g q6h", "B.2.25g q8h", "C.2.25g q12h（透析后额外给0.75g）", "D.2.25g q24h", "E.无需调整"], "answer": "C", "explanation": "哌拉西林/他唑巴坦注射剂在血液透析时给予2.25g q12h，并在透析后额外给0.75g。"}, {"text": "哌拉西林/他唑巴坦注射剂在连续肾脏替代治疗（CRRT）时的用法是（  ）", "options": ["A.2.25g q6h", "B.2.25g q8h", "C.2.25g q12h", "D.2.25g q24h", "E.无须调整"], "answer": "A", "explanation": "哌拉西林/他唑巴坦注射剂在CRRT时给予2.25g q6h，血液透析时为2.25g q12h（透析后额外给0.75g）。"}, {"text": "头孢唑肟注射剂用于血液透析患者时的用法是（  ）", "options": ["A.0.5g qd", "B.1g qd", "C.2g qd（透析后额外1g）", "D.2g q12h", "E.0.25g q24h"], "answer": "C", "explanation": "头孢唑肟注射剂用于血液透析患者时给予2g qd，并在透析后额外1g。"}, {"text": "万古霉素注射剂用于血液透析患者，透析间隔为3天时给药剂量为（  ）", "options": ["A.15mg/kg", "B.25mg/kg", "C.35mg/kg", "D.500mg", "E.1000mg"], "answer": "C", "explanation": "万古霉素注射剂用于血液透析患者时，1天内透析给15mg/kg，2天内透析给25mg/kg，3天内透析给35mg/kg。"}, {"text": "下列药物中，终末期肾病（ESRD）因经肝脏清除而无需调整剂量的是（  ）", "options": ["A.卡托普利", "B.万古霉素", "C.胺碘酮", "D.庆大霉素", "E.哌拉西林/他唑巴坦"], "answer": "C", "explanation": "胺碘酮经肝脏清除，ESRD时无需调整剂量；其Vd为60L，血液透析和腹膜透析也无需调整剂量。"}, {"text": "兰索拉唑在ESRD和血液透析时均无需调整剂量的主要原因是（  ）", "options": ["A.经肾脏清除", "B.经肝脏清除且血浆蛋白结合率为97%", "C.半衰期极短", "D.表观分布容积极小", "E.口服不吸收"], "answer": "B", "explanation": "兰索拉唑经肝脏清除，且血浆蛋白结合率为97%，故ESRD和血液透析时均无需调整剂量。"}, {"text": "低分子肝素（LMWH）的分子量范围是（  ）", "options": ["A.1000~10000Da", "B.5000~35000Da", "C.35000~50000Da", "D.500~1000Da", "E.10000~50000Da"], "answer": "A", "explanation": "LMWH的分子量为1000~10000Da，UFH的分子量为5000~35000Da。"}, {"text": "普通肝素（UFH）的抗Xa活性与抗IIa活性之比为（  ）", "options": ["A.1", "B.2", "C.3", "D.4", "E.0.5"], "answer": "A", "explanation": "UFH的抗Xa/抗IIa=1，影响APTT；LMWH的抗Xa/抗IIa=2~4，不影响APTT。"}, {"text": "UFH半衰期较短的主要原因是（  ）", "options": ["A.与ATIII结合减少", "B.与巨噬细胞结合后被其清除", "C.经肝脏代谢迅速", "D.肾小球滤过率增高", "E.血浆蛋白结合率高"], "answer": "B", "explanation": "UFH可与巨噬细胞结合并被其清除，故半衰期较短，约为1h；LMWH与巨噬细胞结合力下降，半衰期延长。"}, {"text": "在UFH、LMWH与萘莫司他中，半衰期极短（约5~8min）的是（  ）", "options": ["A.UFH", "B.LMWH", "C.萘莫司他", "D.依诺肝素钠", "E.那屈肝素钙"], "answer": "C", "explanation": "萘莫司他的半衰期极短，约5~8min，为丝氨酸蛋白酶抑制剂。"}, {"text": "体外循环抗凝使用萘莫司他时，动脉端持续泵入的剂量是（  ）", "options": ["A.5~10mg/h", "B.10~20mg/h", "C.20~50mg/h", "D.50~100mg/h", "E.100~200mg/h"], "answer": "C", "explanation": "萘莫司他用于体外循环抗凝时，动脉端持续泵入20~50mg/h；适用人群为高出血风险患者及活动性出血患者。"}, {"text": "不能使用UFH、LMWH的患者是（  ）", "options": ["A.血浆ATIII活性大于50%者", "B.血浆ATIII活性小于50%者", "C.无出血性疾病者", "D.存在潜在出血风险者", "E.脂代谢和骨代谢异常程度较重者"], "answer": "B", "explanation": "血浆ATIII活性小于50%的患者、有肝素或低分子肝素过敏史者、曾诊断过HIT者、合并明显出血性疾病者均不宜使用UFH、LMWH。"}, {"text": "慢性肾脏病患者高血压管理指南（2023年版）中，血液透析患者透析前血压目标值，年龄小于60岁者应低于（  ）", "options": ["A.140/90mmHg", "B.150/90mmHg", "C.160/90mmHg", "D.130/80mmHg", "E.120/80mmHg"], "answer": "A", "explanation": "血液透析患者透析前血压目标值：小于60岁者低于140/90mmHg，大于或等于60岁者低于160/90mmHg；腹膜透析患者低于140/90mmHg。"}, {"text": "难治性高血压通常定义为在改善生活方式基础上，合理应用至少几种不同类别降压药物治疗超过1个月血压仍未达标（  ）", "options": ["A.1种", "B.2种", "C.3种", "D.4种", "E.5种"], "answer": "C", "explanation": "难治性高血压指在改善生活方式的基础上，合理应用至少3种不同类别降压药物治疗超过1个月血压仍未达标，或服用至少4种降压药物血压才能有效控制。"}, {"text": "血液净化患者降压药物使用的首选药物不包括（  ）", "options": ["A.ACEI/ARB", "B.二氢吡啶类钙通道阻滞剂", "C.β受体阻断剂", "D.袢利尿剂作为首选", "E.α/β受体阻断剂"], "answer": "D", "explanation": "血液净化患者降压首选ACEI/ARB、二氢吡啶类钙通道阻滞剂、β受体阻断剂、α/β受体阻断剂；袢利尿剂为备选，对无残肾功能者无效且可能有耳毒性。"}, {"text": "ACEI的PK特点中，福辛普利在终末期肾病（ESRD）时的初始剂量（  ）", "options": ["A.需要减量", "B.无需减量", "C.需要加倍", "D.需要停用", "E.仅血液透析时减量"], "answer": "B", "explanation": "福辛普利经肾和肝双通道清除、血浆蛋白结合率大于95%，ESRD时初始剂量无需减量；卡托普利、依那普利、培哚普利等需减量。"}, {"text": "DHD-CCB在ESRD时初始剂量的调整原则是（  ）", "options": ["A.均需减量", "B.多数无需减量", "C.均需加倍", "D.均需停药", "E.仅血液透析时减量"], "answer": "B", "explanation": "二氢吡啶类钙通道阻滞剂血浆蛋白结合率大于95%，硝苯地平、非洛地平、氨氯地平等在ESRD时初始剂量均无需减量；乐卡地平因亲脂性高、作用时间长而ESRD禁用。"}, {"text": "肾性贫血的治疗目标为（  ）", "options": ["A.血红蛋白大于90g/L", "B.血红蛋白大于等于110g/L，不推荐大于130g/L", "C.血红蛋白大于等于130g/L", "D.血红蛋白大于等于150g/L", "E.血红蛋白维持100~120g/L"], "answer": "B", "explanation": "肾性贫血治疗目标为血红蛋白（Hb）大于等于110g/L，不推荐大于130g/L。"}, {"text": "HD-CKD患者铁剂治疗的目标值是（  ）", "options": ["A.TSAT大于20%且SF大于200ug/L", "B.20%小于TSAT小于40%，且200ug/L小于SF小于700ug/L", "C.TSAT大于40%且SF大于700ug/L", "D.TSAT小于20%且SF小于200ug/L", "E.TSAT大于50%"], "answer": "B", "explanation": "HD-CKD患者铁剂治疗的目标值为20%小于TSAT小于40%，且200ug/L小于SF小于700ug/L；TSAT大于等于40%或SF大于等于700ug/L时应暂停补铁。"}, {"text": "维持性血液透析患者静脉铁剂的给药途径，正确的是（  ）", "options": ["A.仅口服", "B.优先静脉", "C.仅皮下注射", "D.仅肌内注射", "E.口服与静脉同等推荐"], "answer": "B", "explanation": "HD-CKD患者铁剂给药途径优先静脉；口服剂量为铁200mg/d，1~3个月后评估。"}, {"text": "维持性血液透析合并肾性贫血患者启动红细胞生成刺激剂治疗的时机是（  ）", "options": ["A.Hb小于110g/L时", "B.Hb小于100g/L时", "C.Hb小于90g/L时", "D.Hb小于80g/L时", "E.Hb小于70g/L时"], "answer": "B", "explanation": "在纠正绝对铁缺乏后，透析患者Hb小于100g/L时即可启动红细胞生成刺激剂治疗；非透析患者也在Hb小于100g/L时启动。"}, {"text": "罗沙司他作为低氧诱导因子脯氨酰羟化酶抑制剂，其作用是（  ）", "options": ["A.直接补充促红细胞生成素", "B.通过抑制脯氨酰羟化酶稳定HIF-α蛋白，促进内源性促红细胞生成素生成", "C.促进铁的吸收", "D.抑制骨髓造血", "E.降低血清磷"], "answer": "B", "explanation": "罗沙司他通过抑制脯氨酰羟化酶，稳定HIF-α蛋白，促进内源性促红细胞生成素生成；透析患者半衰期10~12h，口服一周三次。"}, {"text": "慢性肾脏病高磷血症临床管理中国专家共识（2025版）中，透析患者的血清磷目标值是（  ）", "options": ["A.0.87~1.45mmol/L", "B.1.13~1.78mmol/L", "C.1.50~2.00mmol/L", "D.2.00~2.50mmol/L", "E.1.00~1.50mmol/L"], "answer": "B", "explanation": "透析患者血清磷目标值为1.13~1.78mmol/L；血清校正钙目标值为2.10~2.50mmol/L。"}, {"text": "慢性肾脏病高磷血症临床管理中国专家共识（2025版）中，透析患者血清校正钙的目标值是（  ）", "options": ["A.1.90~2.30mmol/L", "B.2.10~2.50mmol/L", "C.2.50~2.80mmol/L", "D.2.00~2.20mmol/L", "E.2.20~2.60mmol/L"], "answer": "B", "explanation": "透析患者血清校正钙目标值为2.10~2.50mmol/L；血清磷目标值为1.13~1.78mmol/L。"}, {"text": "属于非含钙非金属磷结合剂的是（  ）", "options": ["A.碳酸钙", "B.醋酸钙", "C.司维拉姆", "D.碳酸镧", "E.蔗糖羟基氧化铁"], "answer": "C", "explanation": "磷结合剂分为含钙磷结合剂（碳酸钙、醋酸钙）、非含钙磷结合剂（司维拉姆、碳酸镧、蔗糖羟基氧化铁），其中司维拉姆为非金属磷结合剂，碳酸镧、蔗糖羟基氧化铁为含金属磷结合剂。"}, {"text": "碳酸钙作为磷结合剂的缺点是（  ）", "options": ["A.费用高", "B.潜在高钙血症风险，可致骨外钙化、PTH抑制", "C.需静脉给药", "D.不能餐中服用", "E.完全不能降磷"], "answer": "B", "explanation": "碳酸钙为含钙磷结合剂，通过形成难溶物磷酸钙降磷，优点是费用低、疗效确切，缺点是潜在高钙血症风险（骨外钙化、PTH抑制）。"}, {"text": "蔗糖羟基氧化铁的降磷机制是（  ）", "options": ["A.形成难溶物磷酸钙", "B.非吸收磷酸结合交联聚合体", "C.形成难溶物磷酸镧", "D.形成难溶物磷酸铁", "E.抑制肠道钙吸收"], "answer": "D", "explanation": "蔗糖羟基氧化铁为含金属（铁）磷结合剂，通过形成难溶物磷酸铁降磷，服用方法为嚼服、碾碎，消化道不良反应为早期腹泻、后期可耐受。"}]}, {"type": "multiple", "questions": [{"text": "药物代谢动力学（PK）涉及的体内过程包括（  ）", "options": ["Ａ.吸收", "Ｂ.分布", "Ｃ.代谢", "Ｄ.排泄", "Ｅ.药物与受体的结合方式"], "answer": "ABCD", "explanation": "药物的体内过程包括吸收、分布、代谢和排泄，代谢与排泄合称消除；药物与受体的结合方式属于药物效应动力学的研究内容。"}, {"text": "关于表观分布容积（Vd），正确的表述有（  ）", "options": ["Ａ.Vd是药物在体内达动态平衡后体内药物按血浆药物浓度所需体液的容积", "Ｂ.Vd是一个假想的容积", "Ｃ.Vd反映药物分布的广泛程度", "Ｄ.Vd越大药物排泄越慢、体内存留时间越长", "Ｅ.Vd越小药物排泄越慢、体内存留时间越长"], "answer": "ABCD", "explanation": "Vd为药物在体内达动态平衡后，体内药物按血浆药物浓度在体内分布所需体液容积，是假想容积，反映药物分布的广泛程度或与组织中大分子的结合程度；Vd越大排泄越慢、存留时间越长，Vd越小则相反。"}, {"text": "关于半衰期（T1/2）的临床意义，正确的有（  ）", "options": ["Ａ.用于确定给药的间隔时间", "Ｂ.用于预测达到稳态血药浓度的时间", "Ｃ.用于预测药物基本消除的时间", "Ｄ.Vd升高时T1/2延长", "Ｅ.CL升高时T1/2延长"], "answer": "ABCD", "explanation": "半衰期可用于确定给药间隔时间，预测达稳态血药浓度的时间（约5个半衰期）和药物基本消除的时间；T1/2=0.693×Vd/CL，Vd升高或CL下降均使T1/2延长。"}, {"text": "CKD对药物吸收的影响包括（  ）", "options": ["Ａ.多数药物生物利用度下降", "Ｂ.唾液高尿素经胃脲酶转化为氨使pH增高", "Ｃ.合并使用抗酸药、H2受体拮抗剂、PPI可使pH升高", "Ｄ.金属螯合物（磷结合剂）影响吸收", "Ｅ.血浆蛋白结合率升高"], "answer": "ABCD", "explanation": "CKD时多数药物生物利用度下降，其机制包括尿素转化氨致pH增高而改变药物解离特性、合并使用抗酸药或H2受体拮抗剂或PPI使pH升高、金属螯合物（磷结合剂）的影响；血浆蛋白结合率属于分布环节的参数。"}, {"text": "CKD时影响表观分布容积（Vd）的因素有（  ）", "options": ["Ａ.总体液量", "Ｂ.组织亲和力", "Ｃ.血浆蛋白结合率", "Ｄ.胃排空速度", "Ｅ.肝药酶活性"], "answer": "ABC", "explanation": "CKD时影响Vd的因素包括总体液量、组织亲和力和血浆蛋白结合率；胃排空速度影响吸收，肝药酶活性影响代谢。"}, {"text": "CKD时药物剂量调整的方法包括（  ）", "options": ["Ａ.参照药品说明书", "Ｂ.参照文献等参考资料", "Ｃ.治疗范围窄的药物进行血药浓度监测", "Ｄ.依据Ccr、T1/2、Ke等参数估算", "Ｅ.一律按成人常规剂量给药"], "answer": "ABCD", "explanation": "CKD时减量或延长给药间隔的依据包括药品说明书、文献等参考资料、治疗范围窄药物的血药浓度监测、Ccr或T1/2或Ke等参数估算，以及整合研究药物的PK/PD。"}, {"text": "关于CKD时负荷剂量的估算，正确的有（  ）", "options": ["Ａ.负荷剂量=Cinitial×Vd", "Ｂ.病人的负荷剂量=正常负荷剂量×病人Vd/正常Vd", "Ｃ.首剂量增大可尽快达到有效血药浓度", "Ｄ.维持剂量使血药浓度维持在一定有效范围", "Ｅ.负荷剂量与Vd无关"], "answer": "ABCD", "explanation": "负荷剂量=Cinitial×Vd，病人的负荷剂量=正常负荷剂量×病人Vd/正常Vd；临床常首剂量增大以尽快达到有效血药浓度，再按给药周期给维持剂量以维持有效血药浓度范围。"}, {"text": "影响血液透析体外清除率（CLEC）的药物因素有（  ）", "options": ["Ａ.分子量", "Ｂ.血浆蛋白结合率", "Ｃ.表观分布容积", "Ｄ.药物所带电荷", "Ｅ.药物价格"], "answer": "ABCD", "explanation": "影响CLEC的药物因素包括分子量、血浆蛋白结合率、表观分布容积和电荷；药物价格不属于药学清除相关因素。"}, {"text": "影响血液透析体外清除率（CLEC）的透析膜/滤膜因素有（  ）", "options": ["Ａ.膜面积", "Ｂ.膜孔径", "Ｃ.超滤率", "Ｄ.膜的化学成分", "Ｅ.透析中心地理位置"], "answer": "ABCD", "explanation": "影响CLEC的膜因素包括膜面积、孔径、超滤率以及膜的材质，体外清除率为聚砜膜大于聚丙烯腈大于醋酸纤维膜；透析中心地理位置与药物清除无关。"}, {"text": "下列药物在终末期肾病（ESRD）无需调整剂量的有（  ）", "options": ["Ａ.胺碘酮", "Ｂ.阿米替林", "Ｃ.氨氯地平", "Ｄ.卡托普利", "Ｅ.万古霉素"], "answer": "ABC", "explanation": "胺碘酮、阿米替林、氨氯地平在ESRD无需调整剂量，主要原因均为肝脏清除；卡托普利和万古霉素在ESRD需要减量或延长给药间隔。"}, {"text": "下列药物在血液透析、腹膜透析均无需调整剂量的有（  ）", "options": ["Ａ.胺碘酮", "Ｂ.地西泮", "Ｃ.阿托伐他汀", "Ｄ.头孢唑肟", "Ｅ.亚胺培南-西司他丁钠"], "answer": "ABC", "explanation": "胺碘酮、地西泮、阿托伐他汀在血液透析和腹膜透析均无需调整剂量，其共同原因为血浆蛋白结合率高或表观分布容积大；头孢唑肟、亚胺培南-西司他丁钠在血液透析时需要调整剂量。"}, {"text": "关于UFH与LMWH特点的比较，正确的有（  ）", "options": ["Ａ.UFH分子量为5000~35000Da", "Ｂ.LMWH分子量为1000~10000Da", "Ｃ.UFH抗Xa/抗IIa=1，影响APTT", "Ｄ.LMWH抗Xa/抗IIa=2~4，不影响APTT", "Ｅ.LMWH与巨噬细胞结合增加而半衰期缩短"], "answer": "ABCD", "explanation": "UFH分子量为5000~35000Da，抗Xa/抗IIa=1，影响APTT；LMWH分子量为1000~10000Da，抗Xa/抗IIa=2~4，不影响APTT。LMWH与巨噬细胞结合力下降，主要经肾脏清除，半衰期延长。"}, {"text": "LMWH较UFH不良反应减少的方面有（  ）", "options": ["Ａ.自发性出血", "Ｂ.肝素诱导的血小板减少", "Ｃ.骨质疏松", "Ｄ.对脂质代谢的影响", "Ｅ.过敏反应"], "answer": "ABCD", "explanation": "与UFH相比，LMWH自发性出血风险较低，肝素诱导的血小板减少减少，骨质疏松减少，对脂质代谢的影响小；过敏反应方面两者均为禁忌，不属于不良反应减少的方面。"}, {"text": "关于萘莫司他的特点，正确的有（  ）", "options": ["Ａ.属于丝氨酸蛋白酶抑制剂", "Ｂ.可逆性抑制凝血酶（IIa因子）", "Ｃ.半衰期极短约5~8min", "Ｄ.适用于高出血风险患者和活动性出血患者", "Ｅ.体外循环抗凝时需静脉推注给药"], "answer": "ABCD", "explanation": "萘莫司他为丝氨酸蛋白酶抑制剂，可逆性抑制凝血酶（IIa因子）、Xa因子、XIIa因子及纤溶酶，半衰期极短约5~8min，适用于高出血风险患者（如术后、血小板低）和活动性出血患者；体外循环抗凝时经动脉端持续泵入20~50mg/h。"}, {"text": "中国慢性肾脏病患者高血压管理指南（2023年版）中血液净化患者的血压目标值包括（  ）", "options": ["Ａ.血液透析透析前小于60岁者低于140/90mmHg", "Ｂ.血液透析透析前大于等于60岁者低于160/90mmHg", "Ｃ.腹膜透析患者低于140/90mmHg", "Ｄ.血液透析透析前小于60岁者低于120/80mmHg", "Ｅ.腹膜透析患者低于130/80mmHg"], "answer": "ABC", "explanation": "血液透析患者透析前血压目标值小于60岁者低于140/90mmHg、大于等于60岁者低于160/90mmHg；腹膜透析患者低于140/90mmHg。"}, {"text": "血液净化患者降压药的使用原则包括（  ）", "options": ["Ａ.个体化选择治疗药物", "Ｂ.根据血压分级和心血管风险分层选择单药或联合起始", "Ｃ.起始剂量从标准剂量逐渐滴定至耐受剂量", "Ｄ.优先选择长效制剂", "Ｅ.净化前给药以避免药物透析清除"], "answer": "ABCD", "explanation": "血液净化患者降压药使用原则为个体化选择、根据血压分级和心血管风险分层选择单药或联合起始、从标准剂量逐渐滴定至耐受剂量、优先选择长效制剂（依从性好、血压平稳）；给药时机为净化后给药，以避免净化中低血压和药物被透析清除。"}, {"text": "肾性贫血的治疗药物包括（  ）", "options": ["Ａ.铁剂", "Ｂ.红细胞生成刺激剂", "Ｃ.低氧诱导因子脯氨酰羟化酶抑制剂", "Ｄ.磷结合剂", "Ｅ.活性维生素D"], "answer": "ABC", "explanation": "肾性贫血的治疗药物包括铁剂、红细胞生成刺激剂（短效重组人促红素、长效培莫沙肽）和低氧诱导因子脯氨酰羟化酶抑制剂（罗沙司他）；磷结合剂与活性维生素D用于慢性肾脏病矿物质和骨异常的治疗。"}, {"text": "关于静脉铁剂，正确的表述有（  ）", "options": ["Ａ.蔗糖铁溶媒为生理盐水", "Ｂ.蔗糖铁可经透析器的静脉端给药", "Ｃ.右旋糖酐铁溶媒可用生理盐水或5%葡萄糖", "Ｄ.铁剂在血液透析、血液透析滤过和腹膜透析均不能清除", "Ｅ.蔗糖铁过敏反应发生率高于右旋糖酐铁"], "answer": "ABCD", "explanation": "蔗糖铁的溶媒为生理盐水，可经静脉注射、静脉滴注及透析器静脉端给药；右旋糖酐铁溶媒可用生理盐水或5%葡萄糖；铁剂在血液透析、血液透析滤过和腹膜透析均不能清除。右旋糖酐铁过敏反应发生率为0.6%~1.5%，而蔗糖铁罕见且无引起死亡的报道。"}, {"text": "慢性肾脏病矿物质和骨异常（CKD-MBD）降磷治疗中，属非含钙磷结合剂的有（  ）", "options": ["Ａ.司维拉姆", "Ｂ.碳酸镧", "Ｃ.蔗糖羟基氧化铁", "Ｄ.碳酸钙", "Ｅ.醋酸钙"], "answer": "ABC", "explanation": "非含钙磷结合剂包括司维拉姆、碳酸镧、蔗糖羟基氧化铁；碳酸钙、醋酸钙属于含钙磷结合剂，有潜在高钙血症风险。"}, {"text": "关于磷结合剂的服用方法与时间，正确的有（  ）", "options": ["Ａ.碳酸钙需碾碎、嚼服", "Ｂ.司维拉姆需吞服", "Ｃ.碳酸镧需碾碎、嚼服", "Ｄ.蔗糖羟基氧化铁需嚼服、碾碎", "Ｅ.各类磷结合剂均在餐前1小时服用"], "answer": "ABCD", "explanation": "碳酸钙、碳酸镧需碾碎、嚼服，司维拉姆需吞服，蔗糖羟基氧化铁需嚼服、碾碎；各类磷结合剂均应在餐中服用。"}]}, {"type": "short", "questions": [{"text": "简述药物代谢动力学（PK）的体内过程及其主要PK参数。", "options": [], "answer": "药物的体内过程包括吸收、分布、代谢和排泄四个环节，代谢与排泄合称消除。主要PK参数按环节分类：①与吸收有关的参数为生物利用度（F），即药物经血管外途径给药后吸收进入体循环的药量占总给药量的百分比，是评价制剂吸收程度的指标；②与分布有关的参数包括血浆蛋白结合率（BRPP）和表观分布容积（Vd），Vd=给药量×生物利用度/血药浓度，是假想容积，反映药物分布的广泛程度；③与消除有关的参数包括消除速率常数（Ke）、清除率（CL）和半衰期（T1/2），CL=CLR+CLNR=Vd×Ke，T1/2=0.693/Ke=0.693×Vd/CL。", "explanation": "理解PK参数有助于科学计算临床用药剂量、维持有效血药浓度，从而减少不良反应并达到临床最佳疗效。Vd约为5L提示药物大部分分布于血浆，约10~20L提示分布于细胞外液，约40L提示分布于全身体液，大于100L提示集中分布至某个组织器官或大范围组织内；Vd越小药物排泄越快、体内存留时间越短。"}, {"text": "简述慢性肾脏病（CKD）患者药物剂量调整的原则。", "options": [], "answer": "CKD时PK参数总体表现为生物利用度下降、血浆蛋白结合率下降、表观分布容积升高、清除率下降、半衰期延长，药物蓄积增加。剂量调整原则：①明确何药需要减量——肾清除百分数Fe大于30%时CKD患者需要减量；②明确如何减量——减少剂量或减少频次（延长给药间隔），依据药品说明书、文献等参考资料，治疗范围窄的药物进行血药浓度监测，并通过Ccr、T1/2、Ke等参数估算，整合研究药物的PK/PD；③负荷剂量=Cinitial×Vd，病人的负荷剂量=正常负荷剂量×病人Vd/正常Vd，首剂量增大以尽快达到有效血药浓度，随后给予维持剂量；④维持剂量可按Ccr调节（粗略估算或简化公式DREM）：Ccr为40~60ml/min时用75%~100%正常剂量，10~40ml/min时用50%~75%，小于10ml/min时用25%~50%；也可按半衰期调节（Luzius Dettli公式、Calvin Kunin公式）。", "explanation": "粗略估算中，给药剂量不变、延长给药间隔适用于治疗范围宽、半衰期较短的药物；给药间隔不变、减少给药剂量适用于治疗范围窄、半衰期较长的药物。根据Luzius Dettli公式，半衰期增加到5倍时，给药间隔可延长到5倍，或给药剂量可减少到1/5。根据Calvin Kunin公式，初始剂量同正常初始剂量，维持剂量为初始剂量的一半，给药间隔为半衰期，用于病重患者迅速达到有效血药浓度。"}, {"text": "简述影响血液透析体外清除率（CLEC）的因素。", "options": [], "answer": "CLEC指单位时间内多少ml血浆中的药物被透析清除，CLEC=Qp[(Ap-Vp)/Ap]，其中Qp为通过透析器的血浆流量、Ap为流入透析器的血药浓度、Vp为流出透析器的血药浓度；透析患者药物的总清除率CLT=CLEC+CLR+CLRN。影响因素分三类：①药物因素——分子量，血滤时超过膜截留量则不被清除，血透时分子量越高CLEC越低（如万古霉素约1500Da）；血浆蛋白结合率，游离药物才能被清除，大于80%时CLEC低；表观分布容积大于0.7L/kg时CLEC低（如胺碘酮、地高辛）；电荷，阳离子药物CLEC降低（如庆大霉素）；②透析膜/滤膜因素——膜面积、孔径、超滤率增加均使CLEC升高，CLEC为聚砜膜大于聚丙烯腈大于醋酸纤维膜；③其它因素——血流量、透析液流量、超滤量增加均使CLEC升高。", "explanation": "血液透析时药物剂量调整较单独的CKD更复杂：应先评估药物是否通过血液透析清除，若可被清除，则在血液透析后补充一定剂量（或安排在血液透析后给药）；调剂依据为药品说明书和参考资料。需注意各种血液净化方式对药物清除的影响难以明确预测。"}, {"text": "简述低分子肝素（LMWH）与普通肝素（UFH）在临床药学特点上的主要区别。", "options": [], "answer": "主要区别：①分子量不同——LMWH为1000~10000Da，UFH为5000~35000Da，分子量差异导致与其他物质结合能力不同，进而产生PK、药效学、不良反应的差异。②抗凝活性比不同——UFH抗Xa/抗IIa=1，影响APTT；LMWH抗Xa/抗IIa=2~4，不影响APTT。③清除与半衰期不同——UFH与巨噬细胞结合可被其清除，半衰期约1h，游离药物浓度个体差异大；LMWH与巨噬细胞结合力下降，主要经肾脏清除，半衰期延长（依诺肝素钠约4h），PK和抗凝效果个体差异小。④不良反应不同——UFH有自发性出血、肝素诱发的血小板减少（HIT）、高脂血症、骨质疏松；LMWH自发性出血风险较低、HIT风险减少、对脂质代谢和骨盐沉积影响小。⑤LMWH使用方便、安全性更好。", "explanation": "禁忌症方面，两者共同禁忌包括肝素或低分子肝素过敏史、曾诊断过HIT、合并明显出血性疾病、血浆ATIII活性小于50%的患者。适用人群方面，UFH适用于血浆ATIII活性大于50%且没有出血性疾病的发生和风险者；LMWH适用于血浆ATIII活性大于50%、无活动性出血、存在潜在出血风险（脂代谢和骨代谢异常程度较重）者；萘莫司他半衰期极短（约5~8min），适用于高出血风险患者和活动性出血患者。"}, {"text": "简述慢性肾脏病-矿物质和骨异常（CKD-MBD）中磷结合剂的分类与常用药物的药学特点。", "options": [], "answer": "磷结合剂分为含钙磷结合剂、非含钙磷结合剂，后者又分为非金属磷结合剂和含金属磷结合剂。①含钙磷结合剂：碳酸钙、醋酸钙，金属成分为钙，通过形成难溶物磷酸钙降磷，优点是费用低、疗效确切，缺点是潜在高钙血症风险（骨外钙化、PTH抑制）；碳酸钙需碾碎、嚼服，小剂量开始逐渐加量、分2~3次口服，钙元素每日小于1.5g。②司维拉姆：非金属磷结合剂，为非吸收的磷酸结合交联聚合体，有效降磷且不影响钙代谢，缺点是费用高、消化道不良反应（便秘）最严重，需吞服。③碳酸镧：含金属（镧）磷结合剂，通过形成难溶物磷酸镧降磷，需碾碎、嚼服，消化道不良反应为恶心。④蔗糖羟基氧化铁：含金属（铁）磷结合剂，通过形成难溶物磷酸铁降磷，需嚼服、碾碎，消化道不良反应早期为腹泻、后期可耐受。", "explanation": "各类磷结合剂均应在餐中服用，采用小剂量开始、逐渐加量、根据血磷调整剂量的原则。慢性肾脏病高磷血症临床管理中国专家共识（2025版）提出，透析患者血清磷的目标值为1.13~1.78mmol/L，血清校正钙的目标值为2.10~2.50mmol/L。"}]}]}, {"num": 28, "title": "血液透析中心静脉导管的上下机流程理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析中心静脉导管维护上机用物准备中的消毒溶液是", "options": ["A.聚维酮碘溶液", "B.封管液", "C.生理盐水（10ml）", "D.肝素帽", "E.胶布卷"], "answer": "A", "explanation": "中心静脉导管维护上机用物准备包括一次性使用换药盒、无菌注射器（5ml、10ml、20ml）、聚维酮碘溶液、一次性使用透析护理包和胶布卷；封管液、生理盐水（10ml）、肝素帽属于下机用物准备。"}, {"text": "血液透析中心静脉导管维护上机用物准备中，无菌注射器除5ml、10ml规格外，还包括", "options": ["A.1ml", "B.2ml", "C.20ml", "D.50ml", "E.100ml"], "answer": "C", "explanation": "中心静脉导管维护上机用物准备列出的无菌注射器规格为5ml、10ml和20ml三种。"}, {"text": "血液透析中心静脉导管维护操作前自身准备的内容是", "options": ["A.戴护目镜", "B.戴口罩", "C.头偏向导管对侧", "D.铺无菌治疗巾", "E.打开伤口敷料"], "answer": "A", "explanation": "自身准备为洗手、戴围裙、戴护目镜、戴清洁手套；戴口罩和头偏向一侧（导管对侧）属于患者准备，铺无菌治疗巾与打开伤口敷料属于操作步骤。"}, {"text": "血液透析中心静脉导管维护操作中，患者准备的头位要求是", "options": ["A.头偏向一侧（导管对侧）", "B.头偏向一侧（导管置管侧）", "C.头后仰", "D.头前屈", "E.去枕平卧"], "answer": "A", "explanation": "中心静脉导管维护的患者准备为戴口罩、头偏向一侧，且偏向导管对侧，以充分暴露置管部位。"}, {"text": "中心静脉导管置管创面护理中打开包裹纱布时，正确的做法是", "options": ["A.打开包裹导管外露部分的纱布", "B.撤走纱布", "C.连同敷料一起揭除", "D.剪断纱布后丢弃", "E.用镊子夹除纱布"], "answer": "A", "explanation": "置管创面护理打开包裹纱布时，只打开包裹导管外露部分的纱布，不撤走纱布，以保护导管外露段。"}, {"text": "血液净化标准操作规程（2021版）规定，根据医嘱从导管静脉端推注首剂量抗凝剂后应连接的操作是", "options": ["A.体外循环", "B.回血装置", "C.置换液管路", "D.空气探测器", "E.肝素泵"], "answer": "A", "explanation": "根据医嘱从导管静脉端推注首剂量抗凝剂后连接体外循环；回血装置、置换液管路、空气探测器和肝素泵均为透析机上的其他部件或装置，不是此时需要连接的对象。"}, {"text": "中心静脉导管置管创面护理中，检查临时导管缝线有无脱落时需要测量的内容是", "options": ["A.导管外露长度", "B.导管内径", "C.导管容积", "D.穿刺点直径", "E.敷料面积"], "answer": "A", "explanation": "检查导管是否固定妥善、临时导管缝线有无脱落时，需要测量导管外露长度。"}, {"text": "中心静脉导管置管创面护理的检查项目中，对导管开关的要求是", "options": ["A.导管开关是否夹闭", "B.导管开关是否润滑", "C.导管开关是否标记", "D.导管开关是否更换", "E.导管开关是否加热"], "answer": "A", "explanation": "仔细检查需确认导管开关是否夹闭，防止空气进入或血液外流。"}, {"text": "中心静脉导管置管创面护理中脱去清洁手套后的手卫生要求是", "options": ["A.速干手消毒双手", "B.流动水洗手2分钟", "C.更换围裙", "D.戴护目镜", "E.更换无菌治疗巾"], "answer": "A", "explanation": "脱去清洁手套后应速干手消毒双手，随后再佩戴无菌手套进行无菌操作。"}, {"text": "中心静脉导管置管创面护理中，将用纱布包裹单手提起的导管放置于无菌治疗巾的", "options": ["A.第一层", "B.第二层", "C.第三层", "D.第四层", "E.纱布上"], "answer": "A", "explanation": "垫无菌治疗巾时将导管置于治疗巾第一层，并注意不污染治疗巾内面。"}, {"text": "中心静脉导管置管创面护理中消毒导管出口处，消毒范围直径要求达到", "options": ["A.5厘米以上", "B.8厘米以上", "C.10厘米以上", "D.15厘米以上", "E.20厘米以上"], "answer": "C", "explanation": "消毒导管出口处时以穿刺点为中心螺旋消毒局部皮肤及导管，消毒范围直径10厘米以上。"}, {"text": "中心静脉导管置管创面护理中消毒导管出口处的消毒方式是", "options": ["A.以穿刺点为中心顺时针/逆时针螺旋消毒", "B.由上向下直线擦拭", "C.由外向内环形涂抹", "D.来回往复涂抹", "E.用棉球按压消毒"], "answer": "A", "explanation": "消毒导管出口处用碘伏棉签以穿刺点为中心顺时针或逆时针螺旋消毒局部皮肤及导管。"}, {"text": "中心静脉导管置管创面护理中消毒导管出口处时，需要特别注意消毒的部位是", "options": ["A.导管与皮肤之间的缝隙", "B.导管外露段全长", "C.敷料边缘", "D.穿刺点近心端", "E.导管保护帽"], "answer": "A", "explanation": "消毒导管出口处时要注意消毒导管与皮肤之间的缝隙，此处易藏匿细菌。"}, {"text": "血液透析中心静脉导管上机接管技术中，消毒导管外壁所用的材料是", "options": ["A.碘伏纱布", "B.碘伏棉签", "C.生理盐水纱布", "D.无菌干纱布", "E.酒精棉片"], "answer": "A", "explanation": "上机接管技术中用碘伏纱布包裹揉搓消毒导管螺旋帽根部至导管小夹子处，时间大于15秒。"}, {"text": "中心静脉导管上机接管技术中，碘伏纱布包裹揉搓消毒导管的范围是", "options": ["A.螺旋帽根部至导管小夹子处", "B.导管全程", "C.穿刺点至导管末端", "D.仅螺旋帽", "E.仅导管小夹子"], "answer": "A", "explanation": "消毒导管时用碘伏纱布包裹揉搓，范围自导管螺旋帽根部至导管小夹子处。"}, {"text": "中心静脉导管上机接管技术中，碘伏纱布包裹揉搓消毒导管的时间要求是", "options": ["A.大于3秒", "B.大于5秒", "C.大于8秒", "D.大于10秒", "E.大于15秒"], "answer": "E", "explanation": "用碘伏纱布包裹揉搓消毒导管的时间要求大于15秒，以保证消毒效果。"}, {"text": "中心静脉导管上机接管技术中，消毒导管口及螺纹口的消毒遍数是", "options": ["A.1遍", "B.2遍", "C.3遍", "D.4遍", "E.5遍"], "answer": "B", "explanation": "消毒导管口及螺纹口采用顺逆2遍消毒，时间大于15秒。"}, {"text": "中心静脉导管上机接管技术中评估导管时，负压抽吸封管肝素及血液的量约为", "options": ["A.1ml", "B.2ml", "C.3ml", "D.5ml", "E.10ml"], "answer": "B", "explanation": "评估导管时负压抽吸封管肝素及血液2ml，以“Z”字型推注至纱布上观察有无凝血块。"}, {"text": "中心静脉导管上机接管技术中评估导管时，将抽吸液推注至纱布的距离要求是", "options": ["A.距纱布大于10厘米", "B.距纱布大于5厘米", "C.距纱布小于5厘米", "D.紧贴纱布推注", "E.距纱布大于2厘米"], "answer": "A", "explanation": "将抽吸液推注至纱布时，推注距离需大于10厘米，以便观察有无凝血块。"}, {"text": "中心静脉导管上机接管技术中评估导管时发现凝血块，正确的处理是", "options": ["A.更换空针后负压抽吸1ml", "B.加压快速推注溶解血凝块", "C.直接连接透析管路开始治疗", "D.回抽2ml后立即封管", "E.将凝血块推回导管内"], "answer": "A", "explanation": "如有凝血块需再次消毒导管口及螺纹口，更换空针，负压抽吸1ml，直至无血凝块为止。"}, {"text": "血液透析中心静脉导管回血不畅时的处理原则是", "options": ["A.查找原因，严禁用力推注导管腔", "B.用力推注导管腔以疏通导管", "C.加压冲洗导管", "D.立即拔除导管", "E.改为对侧肢体直接穿刺"], "answer": "A", "explanation": "导管回血不畅时应认真查找原因，严禁使用注射器用力推注导管腔，以免血栓脱落造成栓塞。"}, {"text": "中心静脉导管上机接管技术中，冲洗导管所用的生理盐水量为", "options": ["A.5ml", "B.10ml", "C.20ml", "D.50ml", "E.100ml"], "answer": "B", "explanation": "上机接管技术中用10ml生理盐水脉冲式冲洗导管。"}, {"text": "中心静脉导管上机接管技术中，生理盐水冲洗导管的方式是", "options": ["A.脉冲式冲洗", "B.持续匀速冲洗", "C.快速推注", "D.负压回抽", "E.弹丸式推注"], "answer": "A", "explanation": "冲洗导管采用脉冲式，可形成湍流，减少导管内血液残留。"}, {"text": "中心静脉导管上机接管操作完毕后，导管放置于无菌治疗巾的", "options": ["A.第一层", "B.第二层", "C.第三层", "D.第四层", "E.无菌纱布上"], "answer": "C", "explanation": "动脉端操作完毕后将导管置于无菌治疗巾第三层，等待连接透析回路。"}, {"text": "中心静脉导管上机接管技术中，导管静脉端的操作与动脉端的关系是", "options": ["A.操作同动脉端", "B.仅需消毒不需冲管", "C.仅需冲管不需消毒", "D.需更换导管", "E.需另行穿刺"], "answer": "A", "explanation": "静脉端操作同动脉端，根据医嘱推注首剂量抗凝剂前需再次消毒导管口及螺纹口。"}, {"text": "血液透析中心静脉导管上机接管时，根据医嘱推注首剂量抗凝剂前必须完成的操作是", "options": ["A.再次消毒导管口及螺纹口", "B.更换导管保护帽", "C.再次冲管20ml", "D.测量导管外露长度", "E.更换无菌敷料"], "answer": "A", "explanation": "根据医嘱从导管静脉端推注首剂量抗凝剂前，需再次消毒导管口及螺纹口，然后再连接体外循环。"}, {"text": "血液透析中心静脉导管连接透析回路管前，对导管的处理要求是", "options": ["A.分别消毒导管动静脉端", "B.仅消毒动脉端", "C.仅消毒静脉端", "D.无需消毒", "E.用生理盐水浸泡"], "answer": "A", "explanation": "连接透析回路管前分别消毒导管动静脉端，以降低感染风险。"}, {"text": "血液透析中心静脉导管与透析管路连接后的包扎要求是", "options": ["A.无菌纱布包裹透析管路与导管连接部位", "B.普通纱布包裹即可", "C.无需包裹", "D.用胶布直接粘贴连接口", "E.用止血钳夹闭连接口"], "answer": "A", "explanation": "连接后用无菌纱布包裹透析管路与导管连接部位，并更换无菌治疗巾包裹。"}, {"text": "血液透析中心静脉导管维护的操作顺序原则是", "options": ["A.先观察，再换药、上机", "B.先换药，再观察、上机", "C.先上机，再观察、换药", "D.先封管，再观察、换药", "E.先冲管，再观察、换药"], "answer": "A", "explanation": "中心静脉导管维护的原则之一是先观察，再换药、上机。"}, {"text": "中心静脉导管维护注意事项中，对导管接触面的要求是", "options": ["A.避免导管接触非无菌面", "B.允许导管短暂放置于治疗车台面", "C.导管可接触患者衣物", "D.导管可置于床单位上", "E.导管可接触非无菌手套"], "answer": "A", "explanation": "中心静脉导管维护需避免导管接触非无菌面，并尽可能减少导管在空气中暴露的时间。"}, {"text": "中心静脉导管维护中“放下即翻面”所对应的要求是", "options": ["A.断开即消毒、放下即翻面", "B.连接后才消毒", "C.放置后再消毒", "D.每日消毒一次", "E.仅在封管时消毒"], "answer": "A", "explanation": "中心静脉导管维护的原则包括断开即消毒、放下即翻面，以减少污染和感染风险。"}, {"text": "血液透析中心静脉导管下机时的回血方式是", "options": ["A.密闭式回血下机", "B.开放式回血下机", "C.空气回血下机", "D.自然重力回血", "E.负压回血下机"], "answer": "A", "explanation": "中心静脉导管下机采用密闭式回血下机。"}, {"text": "血液透析中心静脉导管回血下机时，对导管夹子和透析管路夹子的处理是", "options": ["A.夹闭导管和透析管路夹子", "B.打开导管和透析管路夹子", "C.仅夹闭导管夹子", "D.仅夹闭透析管路夹子", "E.全部取下夹子"], "answer": "A", "explanation": "回血下机时打开治疗巾及纱布，并夹闭导管和透析管路夹子。"}, {"text": "血液透析中心静脉导管下机更换治疗巾的做法是", "options": ["A.取新无菌治疗巾置于导管下方", "B.将原治疗巾翻面继续使用", "C.用纱布代替治疗巾", "D.在治疗巾上喷洒消毒液", "E.取消治疗巾铺垫"], "answer": "A", "explanation": "下机时取新无菌治疗巾置于导管下方，导管置于治疗巾第一层。"}, {"text": "血液透析中心静脉导管下机消毒局部皮肤及导管所用的材料是", "options": ["A.碘伏棉球", "B.碘伏棉签", "C.碘伏纱布块", "D.酒精棉球", "E.无菌干纱布"], "answer": "A", "explanation": "下机消毒用碘伏棉球以穿刺点为中心顺时针或逆时针螺旋消毒局部皮肤及导管；上机消毒导管出口处用的是碘伏棉签，消毒导管外壁用的是碘伏纱布。"}, {"text": "血液透析中心静脉导管下机消毒局部皮肤及导管时，消毒范围直径要求达到", "options": ["A.5厘米以上", "B.8厘米以上", "C.10厘米以上", "D.15厘米以上", "E.20厘米以上"], "answer": "C", "explanation": "下机消毒局部皮肤及导管时消毒范围直径10厘米以上，并注意消毒导管与皮肤之间的缝隙。"}, {"text": "血液透析中心静脉导管下机粘贴敷贴的要求是", "options": ["A.根据导管形状塑形、无张力粘贴", "B.张力绷紧粘贴", "C.仅覆盖穿刺点", "D.用胶布条代替敷贴", "E.敷贴中央剪孔"], "answer": "A", "explanation": "粘贴敷贴时应根据导管形状塑形并采用无张力粘贴，避免牵拉导管。"}, {"text": "血液透析中心静脉导管下机时，松动管路螺旋帽后用纱布包裹消毒的部位是", "options": ["A.导管与管路连接处至导管管夹", "B.穿刺点周围5厘米", "C.导管全程", "D.仅管路螺旋帽", "E.仅导管保护帽"], "answer": "A", "explanation": "下机时松动管路螺旋帽，用纱布包裹消毒导管与管路连接处至导管管夹。"}, {"text": "血液透析中心静脉导管下机时，用碘伏纱布包裹消毒导管与管路连接处后，导管应放置于无菌治疗巾的", "options": ["A.第一层", "B.第二层", "C.第三层", "D.第四层", "E.导管夹上"], "answer": "B", "explanation": "下机消毒导管与管路连接处后将导管放于无菌治疗巾第二层，随后消毒导管口并冲洗。"}, {"text": "血液透析中心静脉导管下机冲管时，使用10ml生理盐水脉冲式冲洗导管，每频幅推注量约为", "options": ["A.1ml", "B.2ml", "C.3ml", "D.5ml", "E.10ml"], "answer": "A", "explanation": "下机冲管采用脉冲式，每次推注1ml为宜，可形成湍流以清除导管内残留血液。"}, {"text": "血液透析中心静脉导管下机冲管前，断开管路后对导管口的消毒要求是", "options": ["A.顺逆2遍消毒，时间大于15秒", "B.消毒1遍，时间大于5秒", "C.消毒2遍，时间大于5秒", "D.仅用生理盐水冲洗", "E.无需消毒"], "answer": "A", "explanation": "下机断开管路后顺逆2遍消毒导管口，时间大于15秒，再用10ml生理盐水脉冲式冲洗导管。"}, {"text": "血液透析中心静脉导管下机封管前需要评估的内容是", "options": ["A.导管容积", "B.导管外露长度", "C.患者体重", "D.血流速度", "E.透析器面积"], "answer": "A", "explanation": "封管前评估导管容积，根据医嘱进行正压封管，使封管液充满导管腔。"}, {"text": "血液透析中心静脉导管下机封管采取的方式是", "options": ["A.正压封管", "B.负压封管", "C.常压封管", "D.脉冲式封管", "E.弹丸式封管"], "answer": "A", "explanation": "下机封管采取正压式，根据管路容积，空针内预留所需封管液量再推注。"}, {"text": "血液透析中心静脉导管下机封管时，连接肝素帽后导管放置于无菌治疗巾的", "options": ["A.第一层", "B.第二层", "C.第三层", "D.第四层", "E.无菌敷料上"], "answer": "C", "explanation": "下机再次消毒后连接肝素帽，并将导管置于无菌治疗巾第三层。"}, {"text": "血液透析中心静脉导管下机的固定方法是", "options": ["A.无菌纱布包裹导管后高举平抬法固定", "B.普通纱布包裹后直接粘贴于皮肤", "C.用止血钳固定于床单", "D.用绷带加压包扎", "E.不固定自然放置"], "answer": "A", "explanation": "下机固定时用无菌纱布包裹导管，采用高举平抬法固定，避免牵拉导管。"}, {"text": "血液透析中心静脉导管下机用物准备中，用于封闭导管口的物品是", "options": ["A.肝素帽", "B.胶布条", "C.碘伏棉签", "D.生理盐水（10ml）", "E.无菌纱布块"], "answer": "A", "explanation": "下机用物准备包括无菌手套、无菌治疗巾、封管液、无菌纱布块、生理盐水（10ml）、肝素帽、胶布条、碘伏纱布块和碘伏棉签，其中肝素帽用于封闭导管口。"}, {"text": "血液透析中心静脉导管下机封管时，在空针内预留封管液再推注的目的是", "options": ["A.避免负压吸引过多肝素至患者体内", "B.加快推注速度", "C.减少消毒次数", "D.便于观察回血", "E.延长封管时间"], "answer": "A", "explanation": "封管采取正压式，根据管路容积在空针内预留所需封管液量再推注，避免负压吸引过多肝素进入患者体内。"}, {"text": "血液净化标准操作规程（2021版）推荐使用预充式导管冲洗装置，其目的是", "options": ["A.减少污染及感染风险", "B.加快透析速度", "C.减少抗凝剂用量", "D.延长导管使用寿命", "E.降低耗材成本"], "answer": "A", "explanation": "血液净化标准操作规程（2021版）推荐使用预充式导管冲洗装置，以减少污染及感染风险。"}, {"text": "血液透析中心静脉导管使用分隔膜接头时，正确的处理是", "options": ["A.螺旋断开与透析机管路连接", "B.直接推注封管液", "C.用剪刀剪开接头", "D.将接头浸泡于消毒液中", "E.无需消毒直接连接"], "answer": "A", "explanation": "如导管使用分隔膜接头，则螺旋断开与透析机管路连接，按规范进行分隔膜接头表面消毒后连接注射器或预充式导管冲洗装置，进行冲管封管操作。"}, {"text": "血液净化标准操作规程（2021版）推荐使用的无针接头应具备的特点是", "options": ["A.无色透明、表面光滑闭合严密", "B.有色不透明、表面粗糙", "C.带侧孔且可拆卸", "D.金属材质、螺纹接口较长", "E.需每日更换的开放式接头"], "answer": "A", "explanation": "推荐使用无色透明，表面光滑闭合严密、具有直通结构的无针接头，以形成导管封闭系统，减少外接口频繁暴露于空气中的机会。"}]}, {"type": "multiple", "questions": [{"text": "血液透析中心静脉导管维护上机用物准备包括下列哪些物品", "options": ["Ａ.一次性使用换药盒", "Ｂ.聚维酮碘溶液", "Ｃ.无菌注射器（10ml）", "Ｄ.胶布卷", "Ｅ.肝素帽"], "answer": "ABCD", "explanation": "上机用物准备包括一次性使用换药盒、无菌注射器（5ml、10ml、20ml）、聚维酮碘溶液、一次性使用透析护理包和胶布卷；肝素帽属于下机用物准备，不在上机用物之列。"}, {"text": "血液透析中心静脉导管维护操作前的自身准备包括", "options": ["Ａ.洗手", "Ｂ.戴围裙", "Ｃ.戴护目镜", "Ｄ.戴清洁手套", "Ｅ.铺无菌治疗巾"], "answer": "ABCD", "explanation": "自身准备为洗手、戴围裙、戴护目镜、戴清洁手套；铺无菌治疗巾属于操作步骤，不是自身准备内容。"}, {"text": "血液透析中心静脉导管维护操作前的患者准备包括", "options": ["Ａ.戴口罩", "Ｂ.头偏向一侧（导管对侧）", "Ｃ.去枕平卧", "Ｄ.头偏向导管置管侧", "Ｅ.禁食禁水"], "answer": "AB", "explanation": "患者准备为戴口罩、头偏向一侧且偏向导管对侧；去枕平卧、头偏向置管侧和禁食禁水均不是中心静脉导管维护的患者准备要求。"}, {"text": "中心静脉导管置管创面护理中，打开敷料后仔细检查的项目包括", "options": ["Ａ.局部皮肤有无红肿、破溃", "Ｂ.局部皮肤有无渗血、渗液", "Ｃ.导管缝线有无脱落", "Ｄ.导管开关是否夹闭", "Ｅ.患者有无发热"], "answer": "ABCD", "explanation": "仔细检查包括局部皮肤有无红肿、破溃、渗血、渗液，导管是否固定妥善、临时导管缝线有无脱落，导管开关是否夹闭，管道有无扭曲打折；患者体温不属于置管创面护理的检查内容。"}, {"text": "中心静脉导管置管创面护理中消毒导管出口处的要求包括", "options": ["Ａ.用碘伏棉签消毒", "Ｂ.以穿刺点为中心", "Ｃ.顺时针/逆时针螺旋消毒", "Ｄ.消毒范围直径10厘米以上", "Ｅ.消毒范围直径5厘米以上"], "answer": "ABCD", "explanation": "消毒导管出口处用碘伏棉签以穿刺点为中心顺时针或逆时针螺旋消毒局部皮肤及导管，消毒范围直径10厘米以上；5厘米以上的消毒范围过小，不符合要求。"}, {"text": "中心静脉导管上机接管技术中用碘伏纱布消毒导管的要求包括", "options": ["Ａ.包裹揉搓消毒", "Ｂ.范围自导管螺旋帽根部至导管小夹子处", "Ｃ.消毒时间大于15秒", "Ｄ.消毒后导管置于治疗巾第二层", "Ｅ.消毒时间大于5秒"], "answer": "ABCD", "explanation": "用碘伏纱布包裹揉搓消毒导管螺旋帽根部至导管小夹子处，时间大于15秒，消毒后导管放置于无菌治疗巾第二层；大于5秒的时间要求过短，不能达到消毒效果。"}, {"text": "中心静脉导管上机接管过程中，导管放置于无菌治疗巾的分层要求包括", "options": ["Ａ.创面护理阶段置于治疗巾第一层", "Ｂ.碘伏纱布消毒后置于治疗巾第二层", "Ｃ.操作完毕后置于治疗巾第三层", "Ｄ.全程仅需一层治疗巾", "Ｅ.治疗巾内面允许被污染"], "answer": "ABC", "explanation": "导管先置于治疗巾第一层，碘伏纱布消毒后置于第二层，操作完毕后置于第三层；无菌操作要求铺设无菌治疗巾且内面不得污染，仅用一层不能完成分层无菌操作。"}, {"text": "中心静脉导管上机接管技术中消毒导管口的要求包括", "options": ["Ａ.顺逆2遍消毒", "Ｂ.时间大于15秒", "Ｃ.消毒导管口", "Ｄ.消毒螺纹口", "Ｅ.仅消毒1遍"], "answer": "ABCD", "explanation": "导管口及螺纹口需顺逆2遍消毒，时间大于15秒；仅消毒1遍不能达到消毒要求。"}, {"text": "中心静脉导管上机接管技术中评估导管的做法包括", "options": ["Ａ.负压抽吸封管肝素及血液2ml", "Ｂ.以“Z”字型推注至纱布", "Ｃ.推注时距纱布大于10厘米", "Ｄ.发现凝血块时更换空针抽吸", "Ｅ.导管回血不畅时用力推注导管腔"], "answer": "ABCD", "explanation": "评估导管时负压抽吸封管肝素及血液2ml，以“Z”字型推注至纱布，推注距离大于10厘米；发现凝血块需再次消毒后更换空针，负压抽吸1ml直至无血凝块；导管回血不畅时严禁使用注射器用力推注导管腔。"}, {"text": "血液透析中心静脉导管维护上机流程的注意事项包括", "options": ["Ａ.先观察，再换药、上机", "Ｂ.避免导管接触非无菌面", "Ｃ.尽可能减少导管在空气中暴露的时间", "Ｄ.断开即消毒、放下即翻面", "Ｅ.导管可暂时放置在非无菌台面上"], "answer": "ABCD", "explanation": "上机流程注意事项为先观察再换药、上机，避免导管接触非无菌面，尽可能减少导管在空气中暴露的时间，断开即消毒、放下即翻面；导管不能放置在非无菌台面上。"}, {"text": "血液透析中心静脉导管下机用物准备包括", "options": ["Ａ.封管液", "Ｂ.无菌纱布块", "Ｃ.生理盐水（10ml）", "Ｄ.肝素帽", "Ｅ.无菌注射器（20ml）"], "answer": "ABCD", "explanation": "下机用物准备包括无菌手套、无菌治疗巾、封管液、无菌纱布块、生理盐水（10ml）、肝素帽、胶布条、碘伏纱布块和碘伏棉签；无菌注射器属于上机用物准备。"}, {"text": "血液透析中心静脉导管回血下机的操作包括", "options": ["Ａ.采用密闭式回血下机", "Ｂ.打开治疗巾及纱布", "Ｃ.夹闭导管和透析管路夹子", "Ｄ.采用开放式回血下机", "Ｅ.回血前先断开导管与管路的连接"], "answer": "ABC", "explanation": "下机采用密闭式回血下机，回血时打开治疗巾及纱布，夹闭导管和透析管路夹子；开放式回血下机会增加污染和感染风险，回血前断开导管与管路连接则属于顺序错误，断开连接是在回血完毕后进行。"}, {"text": "血液透析中心静脉导管下机消毒局部皮肤及导管的要求包括", "options": ["Ａ.用碘伏棉球消毒", "Ｂ.以穿刺点为中心", "Ｃ.顺时针/逆时针螺旋消毒", "Ｄ.消毒范围直径10厘米以上", "Ｅ.消毒范围直径5厘米以上"], "answer": "ABCD", "explanation": "下机用碘伏棉球以穿刺点为中心顺时针或逆时针螺旋消毒局部皮肤及导管，消毒范围直径10厘米以上；5厘米以上的消毒范围偏小，不符合要求。"}, {"text": "血液透析中心静脉导管下机粘贴敷贴的要求包括", "options": ["Ａ.根据导管形状塑形", "Ｂ.无张力粘贴", "Ｃ.张力绷紧粘贴", "Ｄ.仅覆盖穿刺点不覆盖导管", "Ｅ.用胶布条代替无菌敷贴"], "answer": "AB", "explanation": "粘贴敷贴时应根据导管形状塑形并采用无张力粘贴；张力绷紧粘贴、仅覆盖穿刺点以及用胶布条代替敷贴均不符合要求。"}, {"text": "血液透析中心静脉导管下机消毒导管与管路连接处的操作包括", "options": ["Ａ.先松动管路螺旋帽", "Ｂ.用纱布包裹消毒导管与管路连接处", "Ｃ.消毒时间大于15秒", "Ｄ.消毒后将导管放于治疗巾第二层", "Ｅ.消毒时间大于3秒"], "answer": "ABCD", "explanation": "下机时松动管路螺旋帽，用纱布包裹消毒导管与管路连接处至导管管夹，时间大于15秒，消毒后将导管放于治疗巾第二层；大于3秒的时间过短，达不到消毒要求。"}, {"text": "血液透析中心静脉导管下机冲管的操作包括", "options": ["Ａ.断开管路", "Ｂ.顺逆2遍消毒导管口", "Ｃ.消毒时间大于15秒", "Ｄ.使用10ml生理盐水脉冲式冲洗", "Ｅ.使用5ml生理盐水持续冲洗"], "answer": "ABCD", "explanation": "下机冲管时断开管路，顺逆2遍消毒导管口，时间大于15秒，使用10ml生理盐水脉冲式冲洗，每次推注1ml为宜；5ml持续冲洗既不符合生理盐水量要求，也不能形成脉冲式湍流。"}, {"text": "血液透析中心静脉导管下机封管的操作包括", "options": ["Ａ.再次消毒", "Ｂ.评估导管容积", "Ｃ.根据医嘱正压封管", "Ｄ.连接肝素帽", "Ｅ.采用负压封管"], "answer": "ABCD", "explanation": "下机封管时再次消毒，评估导管容积，根据医嘱正压封管并连接肝素帽；负压封管会吸入过多肝素和血液，不符合正压封管的要求。"}, {"text": "血液透析中心静脉导管下机固定与导管保护的要求包括", "options": ["Ａ.用无菌纱布包裹导管", "Ｂ.采用高举平抬法固定", "Ｃ.连接肝素帽后导管置于治疗巾第三层", "Ｄ.将导管打折后固定", "Ｅ.固定时不使用无菌纱布"], "answer": "ABC", "explanation": "下机固定时用无菌纱布包裹导管，采用高举平抬法固定，连接肝素帽后导管置于治疗巾第三层；导管打折会阻断血流，固定时不使用无菌纱布也不符合要求。"}, {"text": "血液透析中心静脉导管下机流程的注意事项包括", "options": ["Ａ.冲洗管路采用脉冲式", "Ｂ.脉冲式冲洗每次推注1ml为宜", "Ｃ.封管采取正压式", "Ｄ.空针内预留所需封管液量再推注", "Ｅ.采用负压封管以减少肝素用量"], "answer": "ABCD", "explanation": "下机注意事项为冲洗管路采用脉冲式且每次推注1ml为宜，封管采取正压式，根据管路容积在空针内预留所需封管液量再推注，以避免负压吸引过多肝素至患者体内；负压封管并非减少肝素用量的措施。"}, {"text": "血液净化标准操作规程（2021版）关于中心静脉留置导管保护帽取下与接头处理的要求包括", "options": ["Ａ.先检查导管夹子处于夹闭状态", "Ｂ.再取下导管保护帽", "Ｃ.辅助人员协助消毒导管接头", "Ｄ.避免导管接触非无菌表面", "Ｅ.尽可能延长导管在空气中暴露的时间"], "answer": "ABCD", "explanation": "操作前先检查导管夹子处于夹闭状态，再取下导管保护帽，辅助人员协助消毒导管接头，并避免导管接触非无菌表面，尽可能减少导管在空气中暴露的时间；延长导管在空气中暴露时间会增加污染和感染风险。"}]}, {"type": "short", "questions": [{"text": "简述血液透析中心静脉导管维护上机的用物准备与患者准备内容。", "options": [], "answer": "用物准备：一次性使用换药盒、无菌注射器（5ml、10ml、20ml）、聚维酮碘溶液、一次性使用透析护理包、胶布卷。患者准备：①戴口罩；②头偏向一侧，且偏向导管对侧。", "explanation": "上机用物准备需满足换药、消毒、冲管与固定的全部需要，注射器规格为5ml、10ml、20ml；患者戴口罩可减少呼吸道污染，头偏向导管对侧可充分暴露置管部位，便于无菌操作。"}, {"text": "简述中心静脉导管置管创面护理中仔细检查的内容。", "options": [], "answer": "①局部皮肤有无红肿、破溃、渗血、渗液；②导管是否固定妥善、临时导管缝线有无脱落，并测量导管外露长度；③导管开关是否夹闭；④管道有无扭曲打折。", "explanation": "仔细检查应在打开敷料后、换药与上机之前完成，先观察再处理，可及时发现感染、渗血、脱管、开关未夹闭和管路打折等问题；测量导管外露长度有助于判断导管是否移位或脱出。"}, {"text": "简述血液透析中心静脉导管上机接管时消毒导管及导管口的操作要点。", "options": [], "answer": "①用碘伏纱布包裹揉搓消毒导管，范围自导管螺旋帽根部至导管小夹子处，时间大于15秒，消毒后导管置于无菌治疗巾第二层；②脱手套、速干手消毒双手后更换无菌手套；③顺逆2遍消毒导管口及螺纹口，时间大于15秒；④如有凝血块再次消毒导管口及螺纹口，更换空针，负压抽吸1ml直至无血凝块；⑤再次顺逆2遍消毒导管中心及螺旋口，时间大于15秒；⑥用10ml生理盐水脉冲式冲洗导管，操作完毕后将导管置于无菌治疗巾第三层；⑦静脉端操作同动脉端，根据医嘱推注首剂量抗凝剂前需再次消毒导管口及螺纹口。", "explanation": "上机接管全程遵循断开即消毒、放下即翻面，避免导管接触非无菌面并尽可能减少导管在空气中暴露的时间；消毒范围、消毒遍数与消毒时间均有明确要求，各步骤消毒时间均大于15秒；导管回血不畅时严禁使用注射器用力推注导管腔。"}, {"text": "简述血液透析中心静脉导管下机从回血至固定的主要操作步骤。", "options": [], "answer": "①密闭式回血下机；②打开治疗巾及纱布，夹闭导管和透析管路夹子；③脱去清洁手套、速干手消毒双手；④取新无菌治疗巾置于导管下方，导管置于治疗巾第一层；⑤速干手消毒双手并佩戴无菌手套；⑥用碘伏棉球以穿刺点为中心顺时针/逆时针螺旋消毒局部皮肤及导管，消毒范围直径10厘米以上，注意消毒导管与皮肤之间的缝隙；⑦根据导管形状塑形、无张力粘贴敷贴；⑧松动管路螺旋帽，用纱布包裹消毒导管与管路连接处至导管管夹，时间大于15秒，导管放于治疗巾第二层；⑨断开管路，顺逆2遍消毒导管口，时间大于15秒，用10ml生理盐水脉冲式冲洗导管，每频幅1ml；⑩再次消毒并按医嘱正压封管，评估导管容积；⑪再次消毒后连接肝素帽，导管置于治疗巾第三层；⑫用无菌纱布包裹导管，采用高举平抬法固定。", "explanation": "下机全过程要求保持导管封闭与无菌，消毒范围直径10厘米以上，各消毒环节时间大于15秒；更换治疗巾、重新洗手戴无菌手套是为了保证无菌区域不被污染，固定采用高举平抬法可避免牵拉导管。"}, {"text": "简述中心静脉导管下机冲管与封管的操作要点及其理由。", "options": [], "answer": "冲管要点：断开管路后顺逆2遍消毒导管口，时间大于15秒；使用10ml生理盐水脉冲式冲洗导管，每频幅推注1ml为宜。封管要点：再次消毒并评估导管容积，根据医嘱正压封管；封管采取正压式，根据管路容积在空针内预留所需封管液量再推注；再次消毒后连接肝素帽，导管置于治疗巾第三层。", "explanation": "脉冲式冲洗每次推注1ml可形成湍流，有利于清除导管腔内残留血液和微小血栓；正压封管并在空针内预留封管液再推注，可避免负压吸引过多肝素至患者体内，同时使封管液充满导管腔，减少导管内凝血与感染风险。"}]}]}, {"num": 29, "title": "血液透析安全防护理论考试题库", "sections": [{"type": "single", "questions": [{"text": "职业暴露的定义是指？", "options": ["A.因职业关系暴露于危险因素中", "B.仅指工作中发生的意外伤害", "C.仅指接触传染病病原体", "D.指长期工作引起的身心疾病", "E.指工作中的医患纠纷"], "answer": "A", "explanation": "职业暴露是指由于职业关系而暴露在危险因素中，从而有可能损害健康或危及生命的一种情况。"}, {"text": "职业暴露的分类不包括下列哪项？", "options": ["A.生物因素", "B.物理因素", "C.化学因素", "D.心理危害", "E.遗传因素"], "answer": "E", "explanation": "职业暴露分为生物因素、物理因素、化学因素、心理危害和高传染性呼吸道传染病五类，遗传因素不属于职业暴露的分类。"}, {"text": "血液透析室在职业防护方面的特点是？", "options": ["A.频繁血液暴露的医疗场所", "B.无职业暴露风险", "C.不接收传染性疾病患者", "D.无需执行标准预防", "E.仅需防范化学损伤"], "answer": "A", "explanation": "血液透析室是医院感染管理的重要部门之一，是频繁血液暴露的医疗场所，血透护士是被感染的高度危险人群，极易受到血源性感染。"}, {"text": "下列哪项不属于造成操作护士眼睛、皮肤、黏膜污染的血液污染环节？", "options": ["A.护士直接接触患者的血液", "B.透析前穿刺", "C.透析中处理穿刺处渗血及更换管路、透析器", "D.透析后的血液回输", "E.测量患者血压"], "answer": "E", "explanation": "血液污染环节包括护士直接接触患者的血液，透析前穿刺，透析中处理患者穿刺处渗血及更换管路、透析器等操作，以及透析后的血液回输；测量患者血压等体检操作不属于血液污染环节。"}, {"text": "透析患者并发肺部感染或心力衰竭时，较常见的表现是？", "options": ["A.咳嗽、咳痰", "B.咯血", "C.呕血", "D.黄疸", "E.抽搐"], "answer": "A", "explanation": "患者并发肺部感染或心力衰竭时咳嗽、咳痰较多见，属于容易造成体液污染的环节之一。"}, {"text": "生物性职业暴露的暴露前预防措施是？", "options": ["A.标准预防、预防接种、增强体质", "B.局部紧急处理、特异性预防、随访", "C.洗手、通风、消毒", "D.报告、登记、报销", "E.隔离、观察、治疗"], "answer": "A", "explanation": "生物性职业暴露的暴露前预防包括标准预防、预防接种和增强体质三项；局部紧急处理、特异性预防、随访属于暴露后预防。"}, {"text": "生物性职业暴露的暴露后预防措施是？", "options": ["A.局部紧急处理、特异性预防、随访", "B.标准预防、预防接种、增强体质", "C.洗手、戴手套、戴口罩", "D.消毒、灭菌、隔离", "E.体检、建档、报销"], "answer": "A", "explanation": "生物性职业暴露的暴露后预防包括局部紧急处理、特异性预防和随访三项；标准预防、预防接种、增强体质属于暴露前预防。"}, {"text": "职业暴露后局部紧急处理原则的正确顺序是？", "options": ["A.一挤、二冲、三消毒、四报告", "B.一冲、二挤、三消毒、四报告", "C.一消毒、二冲、三挤、四报告", "D.一挤、二消毒、三冲、四报告", "E.一报告、二挤、三冲、四消毒"], "answer": "A", "explanation": "职业暴露后局部紧急处理按一挤、二冲、三消毒、四报告的顺序进行。"}, {"text": "职业暴露后如皮肤有伤口，正确的挤压方法是？", "options": ["A.在伤口旁端轻轻挤压并挤出血液", "B.直接挤压伤口局部", "C.在伤口中央用力挤压", "D.由远心端向近心端挤压", "E.不做任何挤压和处理"], "answer": "A", "explanation": "如有伤口，应当在伤口旁端轻轻挤压，尽可能挤出损伤处的血液，再用肥皂液和流动水进行冲洗；禁止进行伤口的局部挤压。"}, {"text": "职业暴露后受伤部位伤口冲洗干净后，应使用的消毒剂是？", "options": ["A.75%乙醇或0.5%碘伏", "B.95%乙醇", "C.2%碘酊", "D.3%过氧化氢", "E.含氯消毒液"], "answer": "A", "explanation": "受伤部位的伤口冲洗后，应当用75%乙醇或者0.5%碘伏进行消毒，并包扎伤口；被暴露的黏膜应反复用生理盐水冲洗干净。"}, {"text": "被HBV或HCV阳性患者血液、体液污染的锐器刺伤后，建议在多长时间内注射乙肝免疫高价球蛋白？", "options": ["A.24小时内", "B.48小时内", "C.72小时内", "D.1周内", "E.1个月内"], "answer": "A", "explanation": "被HBV或HCV阳性患者血液、体液污染的锐器刺伤，建议在24小时内注射乙肝免疫高价球蛋白，同时进行血液乙肝标志物检查。"}, {"text": "乙肝标志物检查阴性的暴露者，应在其后多长时间再检查？", "options": ["A.1～3个月", "B.1～2周", "C.4～6个月", "D.6～12个月", "E.1～2年"], "answer": "A", "explanation": "血液乙肝标志物检查阴性者，于其后1～3个月再检查，仍为阴性可给予皮下注射乙肝疫苗。"}, {"text": "被HIV阳性患者血液、体液污染的锐器刺伤后，应在多长时间内抽血查HIV抗体？", "options": ["A.24小时之内", "B.48小时之内", "C.72小时之内", "D.1周之内", "E.2周之内"], "answer": "A", "explanation": "被HIV阳性患者血液、体液污染的锐器刺伤后，应在24小时之内抽血查HIV抗体，并定期做血清学监测。"}, {"text": "被HIV阳性患者血液污染的锐器刺伤后，监测HIV抗体的时间点是？", "options": ["A.刺伤后即刻、第6周、第12周、第6个月", "B.刺伤后即刻、第2周、第4周、第8周", "C.刺伤后1个月、3个月、6个月", "D.刺伤后第1周、第2周、第4周", "E.刺伤后3个月、6个月、12个月"], "answer": "A", "explanation": "HIV暴露后应于刺伤后即刻、第6周、第12周、第6个月监测HIV抗体，必要时抽患者血液做对比，并预防性使用药物。"}, {"text": "职业暴露后最初多长时间内不要献血、捐赠器官及母乳喂养？", "options": ["A.6-12周", "B.24小时", "C.1-2周", "D.3-6个月", "E.1年"], "answer": "A", "explanation": "职业暴露后在最初6-12周内不要献血、捐赠器官及母乳喂养。"}, {"text": "HBV、HCV职业暴露后的随访时间是？", "options": ["A.暴露后立即、1个月、3个月、6个月", "B.暴露后1周、2周、1个月、3个月", "C.暴露后立即、2个月、4个月、8个月", "D.暴露后3个月、6个月、12个月", "E.暴露后立即、1个月、2个月、3个月"], "answer": "A", "explanation": "HBV、HCV职业暴露应在暴露后立即、1个月、3个月、6个月进行随访。"}, {"text": "梅毒职业暴露后的随访时间是？", "options": ["A.暴露后立即、3个月", "B.暴露后立即、1个月、3个月、6个月", "C.暴露后1周、2周", "D.暴露后立即、1个月、2个月、3个月、6个月", "E.暴露后6个月、12个月"], "answer": "A", "explanation": "梅毒职业暴露应在暴露后立即、3个月进行随访。"}, {"text": "医院职业暴露后处理流程中，伤口挤压的方向是？", "options": ["A.近心端向远心端挤压", "B.远心端向近心端挤压", "C.由伤口四周向中心挤压", "D.垂直伤口用力挤压", "E.不需挤压伤口"], "answer": "A", "explanation": "伤口处理时由近心端向远心端挤压，避免挤压伤口局部，尽量挤出伤口处的血液。"}, {"text": "乙肝暴露者若从未接种过乙肝疫苗，其接种方案是？", "options": ["A.按0、1、3个月接种乙肝疫苗各10ug", "B.按0、1、6个月接种乙肝疫苗各10ug", "C.按0、1、3个月接种各30ug", "D.按0、1、6个月接种各30ug", "E.只需注射乙肝免疫球蛋白"], "answer": "A", "explanation": "未接种过乙肝疫苗的乙肝暴露者应肌注HBIG200u（24小时内），并按0、1、3个月接种乙肝疫苗各10ug。"}, {"text": "乙肝疫苗全程接种后无抗体产生者的再接种方案是？", "options": ["A.按0、1、3个月分别接种30ug、20ug、10ug", "B.按0、1、3个月接种各10ug", "C.按0、1、6个月接种各10ug", "D.按0、1、3个月接种各30ug", "E.按0、1、6个月接种各30ug"], "answer": "A", "explanation": "接种后无抗体产生者应肌注HBIG200u（24小时内），并按0、1、3个月分别接种乙肝疫苗30ug、20ug、10ug。"}, {"text": "丙肝职业暴露后的预防用药情况是？", "options": ["A.目前尚无统一预防用药标准", "B.常规注射长效青霉素", "C.常规注射乙肝免疫球蛋白", "D.常规口服抗病毒药物", "E.常规注射丙种球蛋白"], "answer": "A", "explanation": "丙肝职业暴露后目前尚无统一预防用药标准，应追踪肝功能、丙肝抗体及HCV-RNA。"}, {"text": "丙肝职业暴露后应追踪的指标是？", "options": ["A.肝功能、丙肝抗体及HCV-RNA", "B.乙肝两对半", "C.梅毒抗体", "D.血常规", "E.血糖"], "answer": "A", "explanation": "丙肝职业暴露后应追踪肝功能、丙肝抗体及HCV-RNA，定期复查以早期发现感染。"}, {"text": "梅毒职业暴露后的预防用药方案是？", "options": ["A.长效青霉素240万U/次肌注，每周1次，连续2周", "B.长效青霉素240万U/次肌注1次即可", "C.青霉素80万U/次肌注，连续1周", "D.头孢曲松1g每日静脉滴注", "E.阿奇霉素口服1周"], "answer": "A", "explanation": "梅毒职业暴露后使用长效青霉素240万U/次肌注，每周1次，连续2周。"}, {"text": "梅毒职业暴露停药后追踪梅毒抗体的时间是？", "options": ["A.停药1、3个月", "B.停药1、2、3个月", "C.停药1、3、6个月", "D.停药2周、4周", "E.停药6个月"], "answer": "A", "explanation": "梅毒职业暴露者应在停药1、3个月追踪梅毒抗体。"}, {"text": "HIV职业暴露后的随访时间是？", "options": ["A.暴露后立即、1个月、2个月、3个月、6个月", "B.暴露后立即、1个月、3个月、6个月", "C.暴露后1周、2周、1个月", "D.暴露后立即、3个月、6个月", "E.暴露后6个月、12个月"], "answer": "A", "explanation": "HIV职业暴露应在暴露后立即、1个月、2个月、3个月、6个月进行随访。"}, {"text": "职业暴露后处理的四项原则是及时处理、及时报告、知情同意和？", "options": ["A.保密原则", "B.公开原则", "C.自愿原则", "D.免费原则", "E.优先原则"], "answer": "A", "explanation": "职业暴露后处理原则包括及时处理、及时报告、知情同意和保密原则。"}, {"text": "血源性病原体的定义是？", "options": ["A.血液中携带的、能导致人体患病的微生物", "B.血液中携带的营养物质", "C.血液中的凝血因子", "D.血液中的红细胞", "E.血液中的抗体"], "answer": "A", "explanation": "血源性病原体是指血液中携带的、能导致人体患病的微生物，包括病毒、细菌、寄生虫及其他微生物。"}, {"text": "职业暴露的传染源中最常见的病原体是？", "options": ["A.HIV、HBV、HCV、梅毒", "B.麻疹病毒", "C.水痘病毒", "D.腮腺炎病毒", "E.流感病毒"], "answer": "A", "explanation": "职业暴露的传染源为血液和体液，最常见的病原体是HIV、HBV、HCV和梅毒。"}, {"text": "职业暴露的传染源中，血液和体液包括精液、阴道分泌物、脑脊液、滑膜、胸膜、腹膜、心包液及？", "options": ["A.羊水", "B.尿液", "C.汗液", "D.粪便", "E.乳汁"], "answer": "A", "explanation": "职业暴露的传染源为血液和体液，体液包括精液、阴道分泌物、脑脊液、滑膜、胸膜、腹膜、心包液、羊水等。"}, {"text": "HIV感染后多长时间才能确诊？", "options": ["A.3-6个月", "B.1-2周", "C.2-4周", "D.1年", "E.2年"], "answer": "A", "explanation": "HIV感染后3-6个月才能确诊；HIV感染能导致艾滋病（AIDS），破坏免疫系统而继发感染。"}, {"text": "HIV对外界环境的抵抗力特点是？", "options": ["A.离开血液后立刻死亡", "B.离开血液后可存活数月", "C.耐干燥", "D.耐高温", "E.可在物体表面长期存活"], "answer": "A", "explanation": "HIV离开血液后立刻死亡，其传播主要依赖血液、体液直接进入人体。"}, {"text": "医务人员在手术、注射、穿刺、清洗和处理污染医疗器具时被携带病毒的锐器刺伤而感染，属于HIV医院感染的哪种传播途径？", "options": ["A.锐器伤", "B.输血感染", "C.暴露性接触感染", "D.医疗器具传播", "E.其他方式"], "answer": "A", "explanation": "HIV医院感染传播途径中的锐器伤，指医务人员在实施手术、注射、穿刺、清洗和处理污染的医疗器具时被携带病毒的锐器刺伤，病原体直接进入人体导致感染。"}, {"text": "通过器官移植、血液净化、母婴垂直传播等途径感染HIV，属于HIV医院感染的哪种传播途径？", "options": ["A.其他方式", "B.输血感染", "C.锐器伤", "D.暴露性接触感染", "E.医疗器具传播"], "answer": "A", "explanation": "HIV医院感染的传播途径包括输血感染、暴露性接触感染、锐器伤、医疗器具和其他方式，其中器官移植、血液净化、母婴垂直传播属于其他方式。"}, {"text": "手卫生在医院感染控制中的地位是？", "options": ["A.最经济、简便、有效的措施", "B.效果最差的措施", "C.仅在传染病区需要执行", "D.可替代全部消毒灭菌", "E.属于非必要措施"], "answer": "A", "explanation": "手卫生是医院感染控制最经济、简便、有效的措施。"}, {"text": "手卫生包括下列哪项内容？", "options": ["A.卫生洗手、手消毒、外科手消毒", "B.仅卫生洗手", "C.仅外科手消毒", "D.洗手和戴手套", "E.洗手和穿隔离衣"], "answer": "A", "explanation": "手卫生包括卫生洗手、手消毒和外科手消毒。"}, {"text": "卫生洗手的定义是？", "options": ["A.将手上污垢和微生物清除的过程", "B.用消毒剂擦手的过程", "C.外科手术前的手消毒", "D.戴手套进行护理操作的过程", "E.用干手机吹干双手的过程"], "answer": "A", "explanation": "卫生洗手是指将手上污垢和微生物清除的过程。"}, {"text": "手消毒的定义是？", "options": ["A.用含抗菌剂肥皂或皂液清洗或消毒剂擦手的过程", "B.用流动水冲洗双手的过程", "C.外科手术前的刷手过程", "D.戴无菌手套的过程", "E.用无菌毛巾擦干双手的过程"], "answer": "A", "explanation": "手消毒是指用含抗菌剂肥皂或皂液清洗或消毒剂擦手的过程。"}, {"text": "七步洗手法的口诀是？", "options": ["A.内外夹弓大立腕", "B.内外上下左右中", "C.前后左右上下腕", "D.掌心掌背指缝指", "E.一洗二冲三消毒"], "answer": "A", "explanation": "七步洗手法口诀为内外夹弓大立腕，洗手时间不少于15秒。"}, {"text": "七步洗手法洗手时间应不少于？", "options": ["A.15秒", "B.5秒", "C.30秒", "D.60秒", "E.2分钟"], "answer": "A", "explanation": "七步洗手法口诀为内外夹弓大立腕，洗手时间不少于15秒。"}, {"text": "洗手用水的水温以多少为宜？", "options": ["A.30-40℃", "B.20-25℃", "C.45-50℃", "D.55-60℃", "E.60-70℃"], "answer": "A", "explanation": "采用流动水洗手，水温以30-40℃为宜，合适的水温可提高去污力并可增加洗手者的舒适感。"}, {"text": "手卫生设施中，水龙头开关最好采用？", "options": ["A.非手触式", "B.旋转式", "C.扳手式", "D.手拧式", "E.按压式"], "answer": "A", "explanation": "水龙头要位于洗手池的适当位置，开关最好为非手触式。"}, {"text": "关于手卫生清洁剂的使用，正确的是？", "options": ["A.最好使用皂液，固体肥皂应保持干燥", "B.固体肥皂可长期浸泡放置", "C.皂液容器不必清洁", "D.皂液可直接添加无需更换容器", "E.固体肥皂优于皂液"], "answer": "A", "explanation": "清洁剂可为肥皂或皂液，使用固体肥皂应保持干燥，最好使用皂液；皂液应在洁净的容器内，容器应定期清洁消毒或在更换皂液时清洁消毒或使用一次容器。"}, {"text": "下列哪项不属于手消毒剂？", "options": ["A.生理盐水", "B.乙醇", "C.洗必泰", "D.碘伏", "E.乙醇和洗必泰的复合制剂"], "answer": "A", "explanation": "目前最常用于手部皮肤消毒的有乙醇、洗必泰、碘伏以及乙醇和洗必泰和苯扎溴铵的复合制剂等，生理盐水不属于手消毒剂。"}, {"text": "最好的干手方法是？", "options": ["A.纸巾", "B.干手机", "C.小毛巾", "D.工作服擦拭", "E.自然晾干"], "answer": "A", "explanation": "纸巾是最好的一种干手方法，简便、快捷、无二次污染。"}, {"text": "关于干手小毛巾的使用要求，正确的是？", "options": ["A.一用一消毒，消毒前彻底清洗", "B.可多人重复使用", "C.无需消毒直接使用", "D.容器盖采用手触式", "E.放置在潮湿密闭容器内"], "answer": "A", "explanation": "干手小毛巾应一用一消毒，并在消毒前彻底清洗；盛装毛巾的容器应干燥洁净，容器盖应采用非手触式如脚踏式。"}, {"text": "下列哪项属于手卫生的时机？", "options": ["A.接触病人环境之后", "B.交班之前", "C.下班之后", "D.更换工作服时", "E.进入科室时"], "answer": "A", "explanation": "手卫生的时机包括接触病人之前、接触病人之后、接触病人体液血液和分泌物后、接触病人环境之后。"}, {"text": "护理免疫力低下的病人或新生儿之前，护士应？", "options": ["A.进行手消毒", "B.无需处理", "C.仅更换手套", "D.仅更换工作服", "E.仅开窗通风"], "answer": "A", "explanation": "手消毒指征之一是护理免疫力低下的病人或新生儿之前，此时应进行手消毒。"}, {"text": "护理具有传染性或多种抗药性细菌定植的病人后，护士应？", "options": ["A.进行手消毒", "B.无需处理", "C.仅更换手套", "D.仅更换口罩", "E.仅更换隔离衣"], "answer": "A", "explanation": "护理具有传染性或有多种抗药性细菌定植的病人后属于手消毒的指征之一，应进行手消毒。"}, {"text": "关于戴手套的目的，下列叙述正确的是？", "options": ["A.预防医务人员手上的病原微生物传给病人", "B.戴手套后可替代洗手", "C.戴手套后无需再做手卫生", "D.仅用于保护医务人员本人", "E.主要用于手部保暖"], "answer": "A", "explanation": "戴手套的目的包括预防医务人员手上的病原微生物传给病人、预防病人身体的病原微生物传给医务人员、预防医务人员手上的病原微生物污染环境。"}, {"text": "进行深静脉置管、拔管和连接血管通路以及移植物内瘘穿刺时，应戴？", "options": ["A.无菌手套", "B.清洁手套", "C.薄膜手套", "D.棉手套", "E.可不戴手套"], "answer": "A", "explanation": "进行深静脉置管、拔管和连接血管通路以及移植物内瘘穿刺时应戴无菌手套。"}, {"text": "复用透析器的工作人员应戴？", "options": ["A.清洁手套", "B.无菌手套", "C.可不戴手套", "D.棉手套", "E.防辐射手套"], "answer": "A", "explanation": "复用透析器的工作人员应戴清洁手套。"}, {"text": "下列哪种情况不得使用手套？", "options": ["A.测量患者血压等体检操作", "B.处理血标本", "C.处理医疗废物", "D.清洗透析机", "E.复用透析器"], "answer": "A", "explanation": "透析前准备、测量患者血压等体检操作、离开透析单元、触摸门把手和电话及电脑键盘等、配制各种药品时不得使用手套；处理血标本、医疗废物、清洗透析机、复用透析器时应戴清洁手套。"}, {"text": "复用透析器时为隔离血液等污染物，应使用？", "options": ["A.塑料围裙", "B.棉布围裙", "C.无菌治疗巾", "D.防护面罩", "E.医用帽子"], "answer": "A", "explanation": "复用透析器应使用塑料围裙，以隔离血液等污染物。"}, {"text": "进行可能引起血液、体液、分泌物或排泄物喷溅的操作时，应戴？", "options": ["A.面罩或护目镜", "B.棉纱口罩", "C.帽子", "D.鞋套", "E.布制围裙"], "answer": "A", "explanation": "当进行可能引起血液、体液、分泌物或排泄物喷溅的操作时应戴面罩或护目镜，使用后应进行适当消毒处置。"}, {"text": "使用后的针头或锐器应放于？", "options": ["A.锐器盒内", "B.感染性废物袋内", "C.治疗盘内", "D.生活垃圾桶内", "E.治疗车台面上"], "answer": "A", "explanation": "使用后的针头或锐器应放于锐器盒内，以预防针刺伤和锐器伤。"}, {"text": "关于针头使用的注意事项，正确的是？", "options": ["A.严禁用后回套针头帽或弯曲毁形", "B.用后可回套针头帽", "C.可将针头弯曲毁形后丢弃", "D.可徒手分离针头与注射器", "E.可将针头暂放于治疗车台面"], "answer": "A", "explanation": "使用后的针头或锐器应放于锐器盒内，严禁用后回套针头帽或弯曲毁形。"}, {"text": "对传染病患者实施穿刺等创伤性操作时，护士应戴？", "options": ["A.双手套", "B.单层清洁手套", "C.可不戴手套", "D.棉手套", "E.指套"], "answer": "A", "explanation": "对传染病患者实施穿刺等创伤性操作时应戴双手套。"}, {"text": "我国对医院环境噪音标准的理想值为？", "options": ["A.35dB", "B.50dB", "C.60dB", "D.73dB", "E.80dB"], "answer": "A", "explanation": "我国对医院环境噪音标准的理想值为35dB，而透析机单机报警噪音就有35～73dB。"}, {"text": "透析机单机报警噪音的强度范围是？", "options": ["A.35～73dB", "B.20～35dB", "C.50～73dB", "D.73～90dB", "E.35～50dB"], "answer": "A", "explanation": "透析机单机报警噪音为35～73dB，护士长时间处于高噪音环境可出现头痛、头晕、失眠、情绪烦躁、听力下降、注意力不集中等症状。"}, {"text": "透析室噪音防护中的四轻是指说话轻、走路轻、操作轻和？", "options": ["A.关门轻", "B.开灯轻", "C.打电话轻", "D.取物轻", "E.咳嗽轻"], "answer": "A", "explanation": "护士做到四轻，即说话轻、走路轻、操作轻、关门轻，以降低透析室噪音。"}, {"text": "为减少噪音，水处理设备的安装要求是？", "options": ["A.安装在独立房间并尽量远离透析室", "B.安装在透析大厅中央", "C.安装在护士站旁", "D.安装在候诊区", "E.无需固定安装位置"], "answer": "A", "explanation": "水处理设备应安装在独立房间，尽量远离透析室，并关闭水处理间门窗及通往透析室通道的门，以减少噪音。"}, {"text": "用于空气消毒的紫外线灯发出的紫外线波长为？", "options": ["A.180～290nm", "B.290～400nm", "C.100～180nm", "D.400～500nm", "E.500～600nm"], "answer": "A", "explanation": "用紫外线灯进行空气消毒时发出的紫外线波长为180～290nm，这种波长极易损害眼睛和皮肤。"}, {"text": "紫外线灯工作期间，工作人员应？", "options": ["A.禁止入内，必要时戴防护眼镜", "B.可正常入内长时间工作", "C.无需任何防护", "D.只需开窗即可入内", "E.可戴普通眼镜入内"], "answer": "A", "explanation": "紫外线灯工作期间禁止入内，必要时戴防护眼镜；每天室内通风2～3次，每次20～30min或通过中心通风装置换新鲜空气。"}, {"text": "采用通风减少室内空气污染时，每天通风次数和每次时间是？", "options": ["A.2～3次，每次20～30min", "B.1～2次，每次10～15min", "C.3～4次，每次5min", "D.1次，每次2小时", "E.5次以上，每次1小时"], "answer": "A", "explanation": "每天室内通风2～3次，每次20～30min，或通过中心通风装置换新鲜空气。"}, {"text": "透析室常用的化学消毒剂有？", "options": ["A.过氧乙酸、柠檬酸、含氯消毒剂", "B.葡萄糖、维生素C", "C.生理盐水、注射用水", "D.复方氨基酸", "E.人血白蛋白"], "answer": "A", "explanation": "常用的消毒剂有过氧乙酸、柠檬酸、含氯消毒剂等，大量化学消毒剂用于机器、空气、地面、物体表面的消毒。"}, {"text": "长时间接触挥发性的化学消毒剂，可导致？", "options": ["A.结膜炎、眼胀痛、呼吸道黏膜损伤", "B.听力明显增强", "C.关节强直", "D.骨质疏松", "E.甲状腺功能亢进"], "answer": "A", "explanation": "消毒剂具有挥发性，单位空间内浓度较高时长时间接触可导致结膜炎、眼胀痛、呼吸道黏膜损伤，引起呼吸道不适，甚至有致癌、致畸作用。"}, {"text": "透析用A粉（液）的组成成分是？", "options": ["A.氯化钠、氯化钾、氯化钙、氯化镁及冰醋酸", "B.碳酸氢钠", "C.葡萄糖", "D.乳酸钠", "E.枸橼酸钠"], "answer": "A", "explanation": "A粉（液）由氯化钠、氯化钾、氯化钙、氯化镁及冰醋酸等组成；B粉是碳酸氢钠粉，属纯碱。"}, {"text": "透析用B粉的成分及其性质是？", "options": ["A.碳酸氢钠，属纯碱", "B.氯化钠，属盐类", "C.氯化钙，属钙盐", "D.冰醋酸，属有机酸", "E.氯化镁，属镁盐"], "answer": "A", "explanation": "B粉是碳酸氢钠粉，属纯碱，长期直接接触对皮肤刺激性大，会引起皮肤灼痛或过敏，损伤手部皮肤。"}, {"text": "护士检查和配制化学消毒剂时应？", "options": ["A.戴口罩、帽子及手套，必要时戴护目镜", "B.徒手操作即可", "C.仅戴帽子", "D.仅穿工作服", "E.无需任何防护"], "answer": "A", "explanation": "护士检查和配制化学消毒剂时要戴口罩、帽子及手套，必要时可穿防水围裙、戴护目镜，避免直接接触。"}, {"text": "化学消毒剂溅到眼睛、皮肤上应？", "options": ["A.反复用水冲洗干净", "B.用干毛巾擦拭", "C.用75%乙醇消毒", "D.不予处理", "E.涂抹肥皂液"], "answer": "A", "explanation": "消毒剂应放置在阴凉通风处，如不小心溅到眼睛、皮肤上应反复用水冲洗干净，透析室应配备洗眼装置。"}, {"text": "心理社会因素中，给血透护士带来很大心理压力的操作是？", "options": ["A.高难度的动静脉穿刺", "B.测量血压", "C.更换床单", "D.记录体温", "E.发放健康教育手册"], "answer": "A", "explanation": "高难度的动静脉穿刺会给护士带来很大的心理压力；透析中并发症随时可能危及生命、机器随时可能出现故障也是重要的心理压力来源。"}, {"text": "针对护理人力资源的心理社会防护措施是？", "options": ["A.合理配置护理人力资源，缓解长期超负荷工作的身心压力", "B.减少护理人员数量", "C.延长连续工作时间", "D.取消轮休制度", "E.减少培训学习"], "answer": "A", "explanation": "心理社会因素安全防护措施包括建立护理人员心理支持系统、创造宽松和谐的工作氛围、合理配置护理人力资源、合理安排工作学习减少加班、保持良好人际关系以及自我调整提高心理承受能力。"}, {"text": "高传染性呼吸道传染病流行期间，建议由哪个部门指定设置定点血液透析治疗医院？", "options": ["A.各级卫生健康行政部门", "B.药品监督管理部门", "C.医疗保障部门", "D.疾病预防控制机构", "E.红十字会"], "answer": "A", "explanation": "建议各级卫生健康行政部门依据本地区维持性血液透析治疗患者数量及呼吸道传染病的流行情况，指定设置定点血液透析治疗医院。"}, {"text": "下列哪类患者不属于定点血液透析治疗医院的主要收治对象？", "options": ["A.慢性胃炎患者", "B.传染性结核患者", "C.合并流行性呼吸道传染病的血液透析患者", "D.合并传染性较强呼吸道传染病的血液透析患者", "E.维持性血液透析合并结核的患者"], "answer": "A", "explanation": "定点血液透析治疗医院主要收治传染性结核，以及合并流行性、传染性较强的呼吸道传染病的血液透析患者；慢性胃炎与呼吸道传染病防控无关。"}, {"text": "高传染性呼吸道传染病疫期，预检分诊关卡应设置在？", "options": ["A.进入血透室候诊区前", "B.透析大厅内", "C.水处理间内", "D.治疗室门口", "E.医院大门口"], "answer": "A", "explanation": "在进入血透室候诊区前设置预检分诊关卡，预检分诊人员根据疫情调整防护措施。"}, {"text": "预检分诊人员的常规防护不包括下列哪项？", "options": ["A.N95口罩", "B.一次性帽子", "C.外科口罩", "D.隔离衣", "E.橡胶手套"], "answer": "A", "explanation": "常规防护为一次性帽子、外科口罩、隔离衣、橡胶手套、防护面屏或护目镜；N95口罩属于特殊防护用品。"}, {"text": "疑似高传染性呼吸道传染病患者应？", "options": ["A.单人隔离治疗", "B.与其他患者同室透析", "C.在普通候诊区等候", "D.无需隔离", "E.集中在透析大厅透析"], "answer": "A", "explanation": "疑似高传染性呼吸道传染病患者应单人隔离治疗；无紧急透析适应症的患者可延缓透析，存在紧急透析适应症的患者采用床旁透析。"}, {"text": "处于高传染性呼吸道传染病隔离观察期的患者建议？", "options": ["A.集中在指定机构进行隔离观察和床旁透析", "B.在普通透析室常规透析", "C.居家观察并自行服药", "D.每日往返医院门诊透析", "E.不作特殊处理"], "answer": "A", "explanation": "处于高传染性呼吸道传染病隔离观察期的患者建议集中在指定机构进行隔离观察和床旁透析。"}, {"text": "高传染性呼吸道传染病防控的特殊防护中，应佩戴的口罩是？", "options": ["A.N95口罩", "B.外科口罩", "C.普通棉纱口罩", "D.一次性医用口罩", "E.不戴口罩"], "answer": "A", "explanation": "特殊防护为一次性帽子、N95口罩、防护衣、橡胶手套、靴套、防护面屏或护目镜；常规防护使用外科口罩。"}, {"text": "透析患者自进院起应如何管理口罩？", "options": ["A.全程佩戴口罩", "B.仅在透析时佩戴口罩", "C.仅在候诊时佩戴口罩", "D.无需佩戴口罩", "E.仅在离院时佩戴口罩"], "answer": "A", "explanation": "患者自进院起应全程佩戴口罩，可选择一次性医用口罩、外科口罩或N95口罩；透析期间不脱下口罩进食，可口含糖果；学会手卫生，出入血透室洗手。"}]}, {"type": "multiple", "questions": [{"text": "职业暴露的分类包括下列哪些？", "options": ["Ａ.生物因素", "Ｂ.物理因素", "Ｃ.化学因素", "Ｄ.饮食因素", "Ｅ.遗传因素"], "answer": "ABC", "explanation": "职业暴露分为生物因素、物理因素、化学因素、心理危害和高传染性呼吸道传染病五类；饮食因素和遗传因素不属于职业暴露的分类。"}, {"text": "生物性职业暴露的暴露前预防包括哪些措施？", "options": ["Ａ.标准预防", "Ｂ.预防接种", "Ｃ.增强体质", "Ｄ.局部紧急处理", "Ｅ.随访监测"], "answer": "ABC", "explanation": "生物性职业暴露的暴露前预防包括标准预防、预防接种和增强体质；局部紧急处理、随访属于暴露后预防的内容。"}, {"text": "生物性职业暴露的暴露后预防包括哪些措施？", "options": ["Ａ.局部紧急处理", "Ｂ.特异性预防", "Ｃ.随访", "Ｄ.标准预防", "Ｅ.预防接种"], "answer": "ABC", "explanation": "生物性职业暴露的暴露后预防包括局部紧急处理、特异性预防和随访；标准预防、预防接种属于暴露前预防的内容。"}, {"text": "职业暴露后局部紧急处理的四项原则包括？", "options": ["Ａ.一挤", "Ｂ.二冲", "Ｃ.三消毒", "Ｄ.四报告", "Ｅ.五隔离"], "answer": "ABCD", "explanation": "职业暴露后局部紧急处理原则为一挤、二冲、三消毒、四报告，不包括五隔离。"}, {"text": "下列哪些属于可能造成操作护士眼睛、皮肤、黏膜污染的血液污染环节？", "options": ["Ａ.护士直接接触患者的血液", "Ｂ.透析前穿刺", "Ｃ.透析中处理穿刺处渗血及更换管路、透析器", "Ｄ.透析后的血液回输", "Ｅ.病室通风换气"], "answer": "ABCD", "explanation": "血液污染环节包括护士直接接触患者血液、透析前穿刺、透析中处理穿刺处渗血及更换管路和透析器、透析后血液回输；病室通风换气不属于血液污染环节。"}, {"text": "透析患者出现下列哪些情况时容易造成体液污染？", "options": ["Ａ.透析前因体内毒素高引起恶心、呕吐", "Ｂ.透析中发生失衡综合征时呕吐", "Ｃ.透析中发生低血压时呕吐", "Ｄ.并发肺部感染或心力衰竭时咳嗽、咳痰", "Ｅ.病室噪音过大"], "answer": "ABCD", "explanation": "体液污染常见于患者透析前因体内毒素高出现恶心呕吐、透析中发生失衡综合征或低血压时呕吐、并发肺部感染或心力衰竭时咳嗽咳痰，以及个别患者大小便失禁；病室噪音过大属于物理因素，不造成体液污染。"}, {"text": "职业暴露后的处理原则包括？", "options": ["Ａ.及时处理", "Ｂ.及时报告", "Ｃ.知情同意", "Ｄ.保密原则", "Ｅ.公开通报"], "answer": "ABCD", "explanation": "职业暴露后的处理原则为及时处理、及时报告、知情同意和保密原则，不包括公开通报。"}, {"text": "HIV医院感染的传播途径包括？", "options": ["Ａ.输血感染", "Ｂ.暴露性接触感染", "Ｃ.锐器伤", "Ｄ.医疗器具", "Ｅ.饮食传播"], "answer": "ABCD", "explanation": "HIV医院感染的传播途径包括输血感染、暴露性接触感染、锐器伤、医疗器具和其他方式；HIV不通过饮食传播。"}, {"text": "手卫生包括下列哪些内容？", "options": ["Ａ.卫生洗手", "Ｂ.手消毒", "Ｃ.外科手消毒", "Ｄ.戴手套", "Ｅ.穿隔离衣"], "answer": "ABC", "explanation": "手卫生包括卫生洗手、手消毒和外科手消毒；戴手套和穿隔离衣属于个人防护用品的使用，不属于手卫生的内容。"}, {"text": "下列哪些属于手卫生的时机？", "options": ["Ａ.接触病人之前", "Ｂ.接触病人之后", "Ｃ.接触病人体液、血液和分泌物后", "Ｄ.接触病人环境之后", "Ｅ.下班回家之后"], "answer": "ABCD", "explanation": "手卫生的时机包括接触病人之前、接触病人之后、接触病人体液血液和分泌物后、接触病人环境之后；下班回家之后不属于诊疗护理相关的手卫生时机。"}, {"text": "手消毒的指征包括下列哪些？", "options": ["Ａ.实施侵入性医疗护理操作前", "Ｂ.接触伤口前后", "Ｃ.接触黏膜、血液、体液和分泌物之后", "Ｄ.接触被致病微生物污染的物品后", "Ｅ.更换工作服时"], "answer": "ABCD", "explanation": "手消毒指征包括实施侵入性医疗护理操作前，接触伤口前后，接触黏膜、血液、体液和分泌物之后，接触被致病微生物污染的物品后，护理免疫力低下的病人或新生儿之前，以及护理具有传染性或有多种抗药性细菌定植的病人后；更换工作服时不列为手消毒指征。"}, {"text": "戴手套的目的包括？", "options": ["Ａ.预防医务人员手上的病原微生物传给病人", "Ｂ.预防病人身体的病原微生物传给医务人员", "Ｃ.预防医务人员手上的病原微生物污染环境", "Ｄ.替代洗手", "Ｅ.用于手部保暖"], "answer": "ABC", "explanation": "戴手套的目的有预防医务人员手上的病原微生物传给病人、预防病人身体的病原微生物传给医务人员、预防医务人员手上的病原微生物污染环境；手套不能替代洗手，也不是用来保暖的。"}, {"text": "下列哪些操作时护士应戴无菌手套？", "options": ["Ａ.深静脉置管", "Ｂ.拔管", "Ｃ.连接血管通路", "Ｄ.移植物内瘘穿刺", "Ｅ.测量患者血压"], "answer": "ABCD", "explanation": "进行深静脉置管、拔管、连接血管通路以及移植物内瘘穿刺时应戴无菌手套；测量患者血压等体检操作不得使用手套。"}, {"text": "下列哪些情况不得使用手套？", "options": ["Ａ.透析前准备，如透析机检测、安装及冲洗管路和透析器", "Ｂ.测量患者血压等体检操作", "Ｃ.触摸门把手、电话、电脑键盘等", "Ｄ.配制各种药品", "Ｅ.处理医疗废物"], "answer": "ABCD", "explanation": "不得使用手套的情况包括透析前准备、测量患者血压等体检操作、离开透析单元时、触摸门把手电话电脑键盘电梯按钮楼梯扶手手推车手柄办公用品医疗文件等、配制各种药品；处理医疗废物时应戴清洁手套。"}, {"text": "个人防护用品包括下列哪些？", "options": ["Ａ.手套", "Ｂ.护目镜或面罩", "Ｃ.围裙", "Ｄ.防护服", "Ｅ.听诊器"], "answer": "ABCD", "explanation": "个人防护用品包括手套、护目镜或面罩、围裙、防护服、靴或鞋套、帽子或头发罩；听诊器属于诊疗器具，不属于个人防护用品。"}, {"text": "化学因素的安全防护措施包括？", "options": ["Ａ.检查和配制化学消毒剂时戴口罩、帽子及手套", "Ｂ.必要时穿防水围裙、戴护目镜", "Ｃ.严格掌握消毒剂有效浓度和剂量，现配现用并加盖密闭保存", "Ｄ.透析室配备通风设备和洗眼装置", "Ｅ.将消毒剂放置在阳光直射处"], "answer": "ABCD", "explanation": "化学因素安全防护措施包括检查配制消毒剂时戴口罩帽子手套、必要时穿防水围裙戴护目镜、严格掌握有效浓度和剂量并现配现用加盖密闭保存、保持通风净化空气、消毒剂放置阴凉通风处并配备洗眼装置；化学消毒剂应放置在阴凉通风处而非阳光直射处。"}, {"text": "噪音的安全防护措施包括？", "options": ["Ａ.说话轻、走路轻、操作轻、关门轻", "Ｂ.做好仪器保养与维修，调整机器报警声音，减少报警发生率", "Ｃ.水处理设备安装在独立房间，尽量远离透析室", "Ｄ.谢绝家属进入，保持透析环境整洁、安静", "Ｅ.提高透析机报警音量以便及时发现"], "answer": "ABCD", "explanation": "噪音防护措施包括做到四轻、仪器保养维修并调整报警声音、加强巡视减少报警发生率、水处理设备安装独立房间并关闭相关门窗、谢绝家属进入保持环境整洁安静、电视配备耳机插孔；提高报警音量会加重噪音危害。"}, {"text": "紫外线的安全防护措施包括？", "options": ["Ａ.紫外线灯工作期间禁止入内", "Ｂ.必要时戴防护眼镜", "Ｃ.每天室内通风2～3次，每次20～30min", "Ｄ.紫外线消毒时可正常在室内工作", "Ｅ.消毒后关闭门窗不再通风"], "answer": "ABC", "explanation": "紫外线灯工作期间禁止入内，必要时戴防护眼镜；每天室内通风2～3次，每次20～30min或通过中心通风装置换新鲜空气。紫外线消毒时在室内工作会损害眼睛和皮肤，消毒后应通风换气。"}, {"text": "心理社会因素的安全防护措施包括？", "options": ["Ａ.建立护理人员心理支持系统", "Ｂ.创造宽松和谐的工作氛围", "Ｃ.合理配置护理人力资源", "Ｄ.合理安排工作学习，尽量减少加班，保证足够休息和睡眠", "Ｅ.片面增加工作强度以提升效率"], "answer": "ABCD", "explanation": "心理社会因素防护措施包括建立护理人员心理支持系统、创造宽松和谐的工作氛围、合理配置护理人力资源、合理安排工作学习减少加班、保持良好人际关系、自我调整提高心理适应和心理承受能力；片面增加工作强度会加重身心压力。"}, {"text": "高传染性呼吸道传染病疫期的常规防护用品包括？", "options": ["Ａ.一次性帽子", "Ｂ.外科口罩", "Ｃ.隔离衣", "Ｄ.橡胶手套", "Ｅ.普通棉纱口罩"], "answer": "ABCD", "explanation": "常规防护为一次性帽子、外科口罩、隔离衣、橡胶手套、防护面屏或护目镜；普通棉纱口罩不在常规防护用品之列。"}, {"text": "高传染性呼吸道传染病防控中的特殊防护用品包括？", "options": ["Ａ.一次性帽子", "Ｂ.N95口罩", "Ｃ.防护衣", "Ｄ.橡胶手套", "Ｅ.外科口罩"], "answer": "ABCD", "explanation": "特殊防护为一次性帽子、N95口罩、防护衣、橡胶手套、靴套、防护面屏或护目镜；外科口罩属于常规防护用品。"}, {"text": "疑似高传染性呼吸道传染病患者的处理措施包括？", "options": ["Ａ.单人隔离治疗", "Ｂ.无紧急透析适应症者可延缓透析", "Ｃ.存在紧急透析适应症者采用床旁透析", "Ｄ.与其他患者同区集中透析", "Ｅ.无需隔离观察"], "answer": "ABC", "explanation": "疑似高传染性呼吸道传染病患者应单人隔离治疗；无紧急透析适应症的患者可延缓透析，存在紧急透析适应症的患者采用床旁透析。与其他患者同区集中透析和无需隔离观察都会增加传播风险。"}, {"text": "高传染性呼吸道传染病疫期患者管理的要求包括？", "options": ["Ａ.患者自进院起全程佩戴口罩", "Ｂ.透析期间不脱下口罩进食，可口含糖果", "Ｃ.学会手卫生，出入血透室洗手", "Ｄ.透析期间取下口罩正常用餐", "Ｅ.家属可随意进入透析单元"], "answer": "ABC", "explanation": "患者自进院起应全程佩戴口罩，透析期间不脱下口罩进食、可口含糖果，并学会手卫生、出入血透室洗手；透析期间取下口罩进餐会增加传播风险，透析室应谢绝家属进入。"}, {"text": "对一般手卫生设施的要求包括？", "options": ["Ａ.采用流动水洗手，水温以30-40℃为宜", "Ｂ.水龙头开关最好为非手触式", "Ｃ.清洁剂最好使用皂液，固体肥皂应保持干燥", "Ｄ.皂液容器无须清洁消毒", "Ｅ.洗手水源越少越节约"], "answer": "ABC", "explanation": "洗手应采用流动水，水温以30-40℃为宜；水龙头开关最好为非手触式；清洁剂最好使用皂液，固体肥皂应保持干燥，皂液容器应定期清洁消毒；洗手时水源应充足，以保证彻底、干净地冲洗手。"}, {"text": "常用的干手设施包括？", "options": ["Ａ.纸巾", "Ｂ.干手机", "Ｃ.小毛巾", "Ｄ.工作服", "Ｅ.公用毛巾"], "answer": "ABC", "explanation": "干手设施主要有纸巾、干手机和小毛巾，其中纸巾是最好的一种干手方法；工作服和公用毛巾不能用于干手，容易造成再污染。"}, {"text": "关于干手小毛巾的要求，正确的有？", "options": ["Ａ.大小以30厘米×30厘米左右为宜", "Ｂ.有一定厚度并具有良好的吸水性和坚实度", "Ｃ.一用一消毒，并在消毒前彻底清洗", "Ｄ.盛装毛巾的容器应干燥洁净，容器盖采用非手触式", "Ｅ.可多人重复使用同一毛巾"], "answer": "ABCD", "explanation": "小毛巾多采用纯棉小毛巾，大小以30厘米×30厘米左右为宜，要有一定厚度和良好的吸水性、坚实度；毛巾应一用一消毒并在消毒前彻底清洗，盛装毛巾的容器应干燥洁净，容器盖采用非手触式如脚踏式；多人重复使用会造成交叉感染。"}, {"text": "乙肝暴露后，从未接种过乙肝疫苗者的处理包括？", "options": ["Ａ.肌注HBIG200u（24小时内）", "Ｂ.按0、1、3个月接种乙肝疫苗各10ug", "Ｃ.按0、1、6个月接种乙肝疫苗各10ug", "Ｄ.按0、1、3个月分别接种30ug、20ug、10ug", "Ｅ.无需任何预防处理"], "answer": "AB", "explanation": "未接种过乙肝疫苗的乙肝暴露者应肌注HBIG200u（24小时内），并按0、1、3个月接种乙肝疫苗各10ug；按0、1、6个月的剂次安排与按30ug、20ug、10ug递减的方案均与本情境不符，后者为接种后无抗体产生者的方案。"}, {"text": "预防针刺伤和锐器伤的措施包括？", "options": ["Ａ.使用后的针头或锐器应放于锐器盒内", "Ｂ.严禁用后回套针头帽", "Ｃ.严禁弯曲毁形", "Ｄ.使用针或锐器时严格按操作规程进行", "Ｅ.使用后的针头直接丢入感染性废物袋"], "answer": "ABCD", "explanation": "预防针刺伤和锐器伤要求使用针或锐器时严格按操作规程进行，使用后的针头或锐器应放于锐器盒内，严禁用后回套针头帽或弯曲毁形；使用后的针头直接丢入感染性废物袋容易造成刺伤。"}, {"text": "血液透析中心的通道设置包括？", "options": ["Ａ.普通患者通道", "Ｂ.阳性患者通道", "Ｃ.工作人员通道", "Ｄ.污物通道", "Ｅ.外来探视通道"], "answer": "ABCD", "explanation": "血液透析中心设有普通患者通道、阳性患者通道、工作人员通道和污物通道，实现人流与物流分开；外来探视通道不在设置之列。"}, {"text": "医务人员发生HBV、HCV、梅毒职业暴露后，上报环节的要求包括？", "options": ["Ａ.上报科室负责人", "Ｂ.上报感染管理科", "Ｃ.填报杏林院感信息系统", "Ｄ.上报财务处", "Ｅ.上报药学部"], "answer": "ABC", "explanation": "发生HBV、HCV、梅毒职业暴露后应上报科室负责人和感染管理科，并填报杏林院感信息系统；财务处、药学部不属于职业暴露的上报对象。"}]}, {"type": "short", "questions": [{"text": "简述职业暴露和医务人员职业暴露的定义。", "options": [], "answer": "职业暴露是指由于职业关系而暴露在危险因素中，从而有可能损害健康或危及生命的一种情况。医务人员职业暴露是指医务人员在从事诊疗、护理活动过程中接触有毒、有害物质，或传染病病原体，从而损害健康或危及生命的一类职业暴露。", "explanation": "血液透析室是频繁血液暴露的医疗场所，血透护士是被感染的高度危险人群，明确职业暴露的定义是开展职业防护的前提。"}, {"text": "简述职业暴露的分类，并说明生物性职业暴露中血液污染和体液污染的主要环节。", "options": [], "answer": "职业暴露分为生物因素、物理因素、化学因素、心理危害和高传染性呼吸道传染病五类。血液污染环节包括：护士直接接触患者的血液；透析前穿刺，透析中处理患者穿刺处渗血及更换管路、透析器等操作；透析后的血液回输，这些环节都可能造成操作护士眼睛、皮肤、黏膜的污染。体液污染常见于：患者透析前因体内毒素高出现恶心、呕吐；透析过程中发生失衡综合征或低血压时也有呕吐；并发肺部感染或心力衰竭时咳嗽、咳痰较多见；个别患者出现大小便失禁。", "explanation": "在护理过程中不小心接触这些体液、分泌物而污染破损皮肤，也可感染乙肝、丙肝、艾滋病等，因此血液和体液污染环节都需要重点防护。"}, {"text": "简述血液透析护士发生职业暴露后局部紧急处理的四项原则及其具体做法。", "options": [], "answer": "局部紧急处理原则为一挤、二冲、三消毒、四报告。一挤：如有伤口，应当在伤口旁端轻轻挤压，尽可能挤出损伤处的血液，禁止进行伤口的局部挤压。二冲：用肥皂液和流动水进行冲洗，用肥皂液和流动水清洗污染的皮肤，用生理盐水冲洗黏膜。三消毒：受伤部位的伤口冲洗后，用75%乙醇或者0.5%碘伏进行消毒并包扎伤口，被暴露的黏膜应当反复用生理盐水冲洗干净。四报告：必要时进行外科伤口处理，并进行血源性传播疾病的检查和随访，同时按规定报告。", "explanation": "该原则强调先局部处理、后报告随访，是降低血源性感染风险的关键环节。"}, {"text": "简述被HBV或HCV阳性患者血液、体液污染的锐器刺伤后的特异性预防与随访要求。", "options": [], "answer": "被HBV或HCV阳性患者血液、体液污染的锐器刺伤，建议在24小时内注射乙肝免疫高价球蛋白，同时进行血液乙肝标志物检查，阴性者于其后1～3个月再检查，仍为阴性可给予皮下注射乙肝疫苗。随访方面，HBV、HCV应在暴露后立即、1个月、3个月、6个月进行随访。丙肝目前尚无统一预防用药标准，应追踪肝功能、丙肝抗体及HCV-RNA。", "explanation": "乙肝暴露后应尽早注射乙肝免疫高价球蛋白、复查乙肝标志物并按需接种乙肝疫苗；丙肝暴露以追踪肝功能、丙肝抗体及HCV-RNA为主。"}, {"text": "简述被HIV阳性患者血液、体液污染的锐器刺伤后的处理与随访要求。", "options": [], "answer": "被HIV阳性患者血液、体液污染的锐器刺伤后，应该在24小时之内抽血查HIV抗体，定期做血清学监测，于刺伤后即刻、第6周、第12周、第6个月监测HIV抗体，必要时抽患者血液做对比，并预防性使用药物；在最初6-12周内不要献血、捐赠器官及母乳喂养。随访时间为暴露后立即、1个月、2个月、3个月、6个月。", "explanation": "HIV暴露后应及时抽血检测抗体并进行血清学监测和必要的预防性用药，同时限制献血、捐赠器官及母乳喂养。"}, {"text": "简述手卫生的定义、七步洗手法要点以及洗手用水和清洁剂的要求。", "options": [], "answer": "手卫生包括卫生洗手、手消毒和外科手消毒：卫生洗手是将手上污垢和微生物清除的过程；手消毒是指用含抗菌剂肥皂或皂液清洗或消毒剂擦手的过程。七步洗手法口诀为内外夹弓大立腕，时间不少于15秒。洗手采用流动水，水温以30-40℃为宜，水源应充足；水龙头开关最好为非手触式；清洁剂可为肥皂或皂液，使用固体肥皂应保持干燥，最好使用皂液，皂液应盛放在洁净的容器内，容器定期清洁消毒或在更换皂液时清洁消毒或使用一次容器。", "explanation": "手卫生是医院感染控制最经济、简便、有效的措施，正确的手卫生设施和洗手方法是保证洗手质量的基础。"}, {"text": "简述血液透析室物理因素和化学因素对护士的主要危害及安全防护措施。", "options": [], "answer": "物理因素方面：噪音主要来自治疗机器、水处理装置、电视机、空调、电冰箱等设备，我国对医院环境噪音标准的理想值为35dB，而透析机单机报警噪音就有35～73dB，长期处于高噪音环境可出现头痛、头晕、失眠、情绪烦躁、身心紧张、听力下降、注意力不集中等症状；紫外线灯空气消毒时发出的紫外线波长为180～290nm，极易损害眼睛和皮肤，可引起电光性眼炎、皮肤红斑反应、光感性皮炎，甚至诱发癌变。化学因素方面：过氧乙酸、柠檬酸、含氯消毒剂等挥发性消毒剂浓度较高时长时间接触可导致结膜炎、眼胀痛、呼吸道黏膜损伤，甚至有致癌、致畸作用；A粉（液）由氯化钠、氯化钾、氯化钙、氯化镁及冰醋酸等组成，B粉是碳酸氢钠粉，属纯碱，长期直接接触对皮肤刺激性大，可引起皮肤灼痛或过敏。防护措施：护士做到四轻，做好仪器保养与维修并调整机器报警声音、加强巡视减少报警发生率，水处理设备安装在独立房间并尽量远离透析室，谢绝家属进入保持环境整洁安静；紫外线灯工作期间禁止入内，必要时戴防护眼镜，每天室内通风2～3次、每次20～30min；检查和配制化学消毒剂时戴口罩、帽子及手套，必要时穿防水围裙、戴护目镜，严格掌握有效浓度和剂量，取用后及时加盖密闭保存、现配现用，保持通风，消毒剂放置阴凉通风处，溅到眼睛或皮肤时反复用水冲洗干净，透析室配备洗眼装置。", "explanation": "物理因素和化学因素是血透室护士常见的职业危害，应通过环境管理、设备管理和个人防护综合防控。"}, {"text": "简述高传染性呼吸道传染病疫期血液透析室的安全防控措施。", "options": [], "answer": "一是设置定点血液透析治疗医院：各级卫生健康行政部门依据本地区维持性血液透析治疗患者数量及呼吸道传染病的流行情况指定，主要收治传染性结核以及合并流行性、传染性较强的呼吸道传染病的血液透析患者。二是设置预检分诊关卡：在进入血透室候诊区前设置，预检分诊人员根据疫情调整防护措施，常规防护为一次性帽子、外科口罩、隔离衣、橡胶手套、防护面屏或护目镜。三是患者隔离防控：疑似患者应单人隔离治疗，无紧急透析适应症的患者可延缓透析，存在紧急透析适应症的患者采用床旁透析；处于隔离观察期的患者建议集中在指定机构进行隔离观察和床旁透析；特殊防护为一次性帽子、N95口罩、防护衣、橡胶手套、靴套、防护面屏或护目镜。四是患者管理：患者自进院起全程佩戴口罩，透析期间不脱下口罩进食、可口含糖果，学会手卫生，出入血透室洗手。", "explanation": "疫期防控应做到定点收治、关口前移、分类管理和患者自我防护相结合。"}]}]}, {"num": 30, "title": "血液透析机日常维护理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析机维护的目的是保持透析机的什么，并保持液路和机器外部的清洁、消毒维护以确保患者透析安全？", "options": ["A.低成本", "B.小体积", "C.低噪音", "D.高转速", "E.高性能"], "answer": "E", "explanation": "血液透析机维护的目的包括保持透析机的高性能，以及保持液路和机器外部的清洁、消毒维护，以确保患者的透析安全。"}, {"text": "血液透析机维护原则要求为每台透析机做什么？", "options": ["A.编号并建立档案", "B.统一挂牌停用", "C.集中封存保管", "D.定期整机更换", "E.单独配置电源"], "answer": "A", "explanation": "维护原则要求为每台透析机编号并建立档案，档案内容应包括透析机的相关信息、维修记录、保养记录等。"}, {"text": "血液透析机档案的内容应包括透析机的相关信息、维修记录以及什么？", "options": ["A.采购合同", "B.出厂价格", "C.折旧年限", "D.保养记录", "E.报废审批单"], "answer": "D", "explanation": "透析机档案内容应包括透析机的相关信息、维修记录、保养记录等。"}, {"text": "血液透析机使用要求的环境温度范围是？", "options": ["A.5-35℃", "B.10-30℃", "C.15-35℃", "D.20-40℃", "E.0-25℃"], "answer": "B", "explanation": "透析机应在设备规定的环境下使用，环境温度为10-30℃，给水温度为5-35℃。"}, {"text": "血液透析机使用要求的给水温度范围是？", "options": ["A.5-35℃", "B.10-30℃", "C.15-40℃", "D.0-20℃", "E.25-45℃"], "answer": "A", "explanation": "透析机使用要求给水温度为5-35℃，环境温度为10-30℃。"}, {"text": "血液透析机使用环境的相对湿度要求是？", "options": ["A.≤30%", "B.≤50%", "C.≤70%", "D.70%-90%", "E.≥70%"], "answer": "C", "explanation": "透析机应在相对湿度≤70%的环境下使用。"}, {"text": "血液透析机使用要求的交流电电压是？", "options": ["A.110V±11V", "B.220V±22V", "C.220V±11V", "D.380V±38V", "E.240V±24V"], "answer": "B", "explanation": "透析机使用要求交流电为220V±22V、50HZ±1HZ。"}, {"text": "血液透析机使用要求的交流电频率是？", "options": ["A.50HZ±5HZ", "B.60HZ±1HZ", "C.50HZ±0.5HZ", "D.50HZ±1HZ", "E.60HZ±5HZ"], "answer": "D", "explanation": "透析机使用要求交流电为220V±22V、50HZ±1HZ。"}, {"text": "血液透析机使用要求的直流电使用时间是？", "options": ["A.必须≥10min", "B.必须≥20min", "C.必须≥30min", "D.必须≥48min", "E.必须≥15min"], "answer": "E", "explanation": "透析机使用要求直流电使用时间必须≥15min。"}, {"text": "血液透析机使用要求的反渗水流量是？", "options": ["A.≥500ml/min", "B.≥300ml/min", "C.≥200ml/min", "D.≥700ml/min", "E.≥1000ml/min"], "answer": "A", "explanation": "透析机使用要求反渗水流量≥500ml/min，并按照要求进行操作。"}, {"text": "更改消毒程序、改变消毒液原液浓度或吸入量时，应在消毒完成后于透析机排水口取样，使用什么检测水路中的残留浓度？", "options": ["A.pH试纸", "B.硬度试纸", "C.消毒剂残留量试纸（试剂）", "D.电导率仪", "E.比重计"], "answer": "C", "explanation": "更改消毒程序、改变消毒液原液浓度或吸入量时，应在消毒完成后使用消毒剂残留量试纸（试剂）在透析机排水口取样，检测水路中的残留浓度。"}, {"text": "在透析机排水口取样检测消毒剂残留浓度的目的是？", "options": ["A.确认细菌培养阴性", "B.确保水路中无消毒液残留", "C.排除水路中的气泡", "D.确认水质硬度达标", "E.确认反渗水流量达标"], "answer": "B", "explanation": "检测消毒剂残留浓度的目的是确保水路中无消毒液残留。"}, {"text": "血液透析机的维护应由什么人负责？", "options": ["A.当班责任护士", "B.科室行政主任", "C.设备销售人员", "D.经过专业培训的临床工程技师", "E.患者本人"], "answer": "D", "explanation": "透析机的维护需有经过专业培训的临床工程技师负责，并作好维护记录。"}, {"text": "所有血液透析机维护工作必须在什么情况下进行？", "options": ["A.人机分离", "B.机器通电运行", "C.透析治疗进行中", "D.连接患者状态下", "E.满负荷运转时"], "answer": "A", "explanation": "所有的透析机维护工作必须在人机分离的情况下进行，以确保患者安全。"}, {"text": "备用血液透析机停用多长时间后，使用前应进行一次完整的水路消毒？", "options": ["A.≥6小时", "B.≥12小时", "C.≥24小时", "D.≥72小时", "E.≥48小时"], "answer": "E", "explanation": "建议透析室配备备用透析机，备用透析机停用≥48小时后，使用前应进行一次完整的水路消毒。"}, {"text": "外观检查要求透析机标识完整，标识内容包括名称、型号、制造厂商以及什么？", "options": ["A.采购价格", "B.折旧率", "C.出厂编号", "D.使用年限", "E.责任人姓名"], "answer": "C", "explanation": "透析机应标识完整，包括名称、型号、制造厂商、出厂编号等。"}, {"text": "外观检查要求透析机外壳应无什么？", "options": ["A.任何颜色的变化", "B.影响其正常工作或电气安全的机械损伤", "C.轻微的表面灰尘", "D.标识褪色", "E.轻微划痕"], "answer": "B", "explanation": "透析机外壳应无影响其正常工作或电气安全的机械损伤。"}, {"text": "工作正常性检查中，除各种按键和旋钮外，还应检查什么？", "options": ["A.血泵流量和透析液流量", "B.电导率和温度", "C.超滤精度和肝素泵精度", "D.声光报警系统和备用电池", "E.漏血探测器和气泡探测器"], "answer": "D", "explanation": "工作正常性检查内容包括各种按键和旋钮、声光报警系统、备用电池。"}, {"text": "定期清洁机器防尘滤网的目的是？", "options": ["A.利于机器内部的空气流通和散热", "B.降低机器运行噪音", "C.防止患者过敏", "D.提高电导率准确度", "E.延长透析器寿命"], "answer": "A", "explanation": "定期清洁机器的防尘滤网，以利于机器内部的空气流通和散热。"}, {"text": "电路部件维护中要求电源插头的三极插片应处于什么状态？", "options": ["A.略带焦痕", "B.有打火痕迹", "C.轻微松动", "D.表面发黑", "E.光亮、无氧化"], "answer": "E", "explanation": "电源插头的三极插片应光亮、无氧化。"}, {"text": "电路部件维护中检查电源（总线、插头和插座）是否接触良好，需观察有无松动、过热、焦痕以及什么现象？", "options": ["A.锈蚀", "B.结晶", "C.打火", "D.渗漏", "E.结垢"], "answer": "C", "explanation": "检查电源时应确认是否接触良好，有无松动、过热、焦痕以及打火现象。"}, {"text": "电路部件维护要求定期进行什么操作？", "options": ["A.水路脱钙", "B.电路系统除尘", "C.更换血泵泵管", "D.校准血泵流量", "E.更换备用电池"], "answer": "B", "explanation": "电路部件维护要求定期进行电路系统除尘，并检查电路部件有无老化灼烧痕迹、电路连接线有无老化破损。"}, {"text": "血泵模组维护中，泵门打开时血泵应处于什么状态？", "options": ["A.继续按原速运转", "B.低速运转不停机", "C.自动反转", "D.停止并有声光报警", "E.保持运转但不报警"], "answer": "D", "explanation": "检查泵门开关状态时，泵门打开时血泵应停止，并有声光报警。"}, {"text": "血泵模组维护中，需要根据厂家维修说明书检查调整什么？", "options": ["A.泵管间隙", "B.电机电压", "C.泵门弹簧", "D.转子直径", "E.皮带张力"], "answer": "A", "explanation": "血泵模组维护应依据厂家维修说明书检查调整泵管间隙（如果需要）。"}, {"text": "肝素泵模组维护中应及时清除什么？", "options": ["A.泵壳内的血渍", "B.光学探测器的污渍", "C.电磁阀的锈蚀", "D.滤网的钙盐", "E.丝杠与丝母之间的结晶"], "answer": "E", "explanation": "肝素泵模组维护需及时清除肝素泵丝杠、丝母之间的结晶。"}, {"text": "肝素泵的丝杠、丝母出现锈蚀时，可如何处理？", "options": ["A.用砂纸打磨除锈", "B.直接更换整个模组", "C.用少量润滑油润滑生锈部分", "D.用清水反复冲洗", "E.用消毒液浸泡"], "answer": "C", "explanation": "如有锈蚀可用少量的润滑油润滑生锈部分，同时检查齿轮有无缺齿。"}, {"text": "空气监测器模组维护中，需检查空气监测器与什么部件的联动功能？", "options": ["A.血泵", "B.静脉夹", "C.肝素泵", "D.透析液泵", "E.电导率电极"], "answer": "B", "explanation": "空气监测器模组维护需检查空气监测器和静脉夹的联动功能。"}, {"text": "清洁空气监测器光学探测器应使用什么？", "options": ["A.酒精", "B.含氯消毒剂", "C.柠檬酸溶液", "D.清水", "E.过氧乙酸溶液"], "answer": "D", "explanation": "空气监测器模组维护要求使用清水清洁光学探测器。"}, {"text": "动、静脉压力传感器通大气检测零点值时，误差应在什么范围内？", "options": ["A.±10mmHg", "B.±5mmHg", "C.±15mmHg", "D.±20mmHg", "E.±30mmHg"], "answer": "A", "explanation": "分别将静（动）脉压力传感器通大气，检测零点值是否漂移，误差应在±10mmHg范围内；示值误差也应在±10mmHg范围内。"}, {"text": "透析机的压力参数包括A、V压力、透析液压力和什么？", "options": ["A.URR", "B.Kt/V", "C.iPTH", "D.CRRT", "E.TMP"], "answer": "E", "explanation": "透析机重要参数中的压力包括A、V压力，透析液压力，TMP。"}, {"text": "水路部件日常维护中，浸泡透析器接头可用什么溶液？", "options": ["A.浓含氯消毒剂溶液", "B.过氧乙酸原液", "C.柠檬酸加温水混合溶液", "D.生理盐水", "E.无水酒精"], "answer": "C", "explanation": "可用柠檬酸加温水混合溶液浸泡透析器接头，再用反渗水洗净。"}, {"text": "用柠檬酸加温水混合溶液浸泡透析器接头后，应使用什么洗净？", "options": ["A.自来水", "B.反渗水", "C.软化水", "D.生理盐水", "E.桶装纯净水"], "answer": "B", "explanation": "用柠檬酸加温水混合溶液浸泡透析器接头后，需再用反渗水洗净。"}, {"text": "清除A、B液吸管把柄的结晶应使用什么？", "options": ["A.钢丝球", "B.硬毛刷", "C.砂纸", "D.软湿布", "E.金属刮刀"], "answer": "D", "explanation": "使用软湿布清除A、B液吸管把柄的结晶。"}, {"text": "水路部件日常维护中需检查或更换A、B吸液管的什么？", "options": ["A.密封圈和过滤网", "B.电容和电阻", "C.电池和保险丝", "D.血泵转子和泵管", "E.压力传感器和电磁阀"], "answer": "A", "explanation": "水路部件日常维护需检查或更换A、B吸液管的密封圈和过滤网。"}, {"text": "水路部件日常维护中应定期检查透析机的自检记录和什么记录？", "options": ["A.患者体重记录", "B.用药记录", "C.护理排班记录", "D.耗材领用记录", "E.清洗消毒记录"], "answer": "E", "explanation": "水路部件日常维护需定期检查透析机自检记录和清洗消毒记录（如果有此功能）。"}, {"text": "透析机流量参数的示值误差要求是？", "options": ["A.＜±5%", "B.＜±15%", "C.＜±10%", "D.＜±20%", "E.＜±0.5%"], "answer": "C", "explanation": "流量（血泵流量、透析液流量）示值误差＜±10%，检测采用电子秒表计时3 min。"}, {"text": "检测血泵流量时选取的三个测试点是？", "options": ["A.300、500、700 mL/min", "B.100、200、400 mL/min", "C.100、300、500 mL/min", "D.200、400、600 mL/min", "E.500、600、700 mL/min"], "answer": "B", "explanation": "血泵流量选取100 mL/min、200 mL/min、400 mL/min三个测试点。"}, {"text": "检测透析液流量时选取的三个测试点是？", "options": ["A.100、200、400 ml/min", "B.100、300、500 ml/min", "C.200、400、600 ml/min", "D.300、500、700 ml/min", "E.400、500、600 ml/min"], "answer": "D", "explanation": "透析液流量选取300ml/min、500ml/min、700ml/min三个测试点。"}, {"text": "检测血泵流量或透析液流量时，采用电子秒表计时多长时间？", "options": ["A.3 min", "B.1 min", "C.2 min", "D.5 min", "E.10 min"], "answer": "A", "explanation": "血泵流量和透析液流量检测均采用电子秒表计时3 min。"}, {"text": "透析液温度示值误差要求是？", "options": ["A.＜±0.2 ℃", "B.＜±1.0 ℃", "C.＜±1.5 ℃", "D.＜±2.0 ℃", "E.＜±0.5 ℃"], "answer": "E", "explanation": "透析液温度示值误差＜±0.5 ℃。"}, {"text": "检查透析液温度时，应将透析液流量调至多少？", "options": ["A.300mL/min", "B.700mL/min", "C.500mL/min", "D.800mL/min", "E.1000mL/min"], "answer": "C", "explanation": "检查透析液温度时将透析液流量调至500mL/min，依次选择35℃、36℃和37℃作为温度检测点。"}, {"text": "检查透析液温度时依次选择的温度检测点是？", "options": ["A.33℃、35℃、37℃", "B.35℃、36℃、37℃", "C.35℃、37℃、39℃", "D.36℃、37℃、38℃", "E.34℃、36℃、38℃"], "answer": "B", "explanation": "温度检测点依次为35℃、36℃和37℃，检查时透析液流量调至500mL/min。"}, {"text": "透析液电导率示值误差要求是？", "options": ["A.＜±0.5mS/cm", "B.＜±0.1mS/cm", "C.＜±1.0mS/cm", "D.＜±0.3mS/cm", "E.＜±0.05mS/cm"], "answer": "D", "explanation": "透析液电导率示值误差＜±0.3mS/cm。"}, {"text": "检查电导率示值误差时选取的三个检测点是？", "options": ["A.13.5、14.0、14.5 mS/cm", "B.12.5、13.0、13.5 mS/cm", "C.13.0、14.0、15.0 mS/cm", "D.14.0、14.5、15.0 mS/cm", "E.12.0、13.0、14.0 mS/cm"], "answer": "A", "explanation": "电导率示值误差检查选取13.5mS/cm、14.0mS/cm、14.5 mS/cm三个检测点。"}, {"text": "检查电导率超限监测功能时，当电导率超出设定限值，透析机应发出声光警报，并且？", "options": ["A.继续透析并记录报警", "B.自动降低透析液流量", "C.自动提高温度补偿", "D.关闭血泵", "E.阻止透析液流向透析器"], "answer": "E", "explanation": "电导率超出设定限值时，透析机应发出声光警报，并阻止透析液流向透析器。"}, {"text": "透析机超滤精度的允许误差是？", "options": ["A.＜±10％或±100mL/h", "B.＜±2％或±20mL/h", "C.＜±5％或±50mL/h", "D.＜±5％或±500mL/h", "E.＜±1％或±10mL/h"], "answer": "C", "explanation": "超滤精度允许误差为＜±5％或±50mL/h。"}, {"text": "透析机肝素泵精度的允许误差是？", "options": ["A.＜±0.5ml/h或读数的±10％", "B.＜±0.2ml/h或读数的±5％", "C.＜±0.1ml/h或读数的±2％", "D.＜±1.0ml/h或读数的±5％", "E.＜±0.2ml/h或读数的±10％"], "answer": "B", "explanation": "肝素泵精度允许误差为＜±0.2ml/h或读数的±5 %。"}, {"text": "苏丹黑B染色呈蓝黑色说明管道内存在什么物质？", "options": ["A.糖链成分", "B.氨基酸残基", "C.蛋白质", "D.脂类物质", "E.钙盐沉积"], "answer": "D", "explanation": "苏丹黑B染色呈蓝黑色说明有脂类物质存在；PAS染色呈紫色说明有糖链成分。"}, {"text": "使用成品消毒液的优点之一是减少浓度差，另一个优点是什么？", "options": ["A.降低透析机内部零件的故障率", "B.提高透析液流量", "C.可取代反渗水", "D.提高电导率准确度", "E.缩短单次透析时间"], "answer": "A", "explanation": "使用成品消毒液可减少浓度差、降低透析机内部零件的故障率。"}, {"text": "目前血液透析机维护现状的特点之一是？", "options": ["A.以预防性维修为主", "B.维护保养规范统一", "C.检测工具齐全", "D.有统一的方法和标准", "E.以故障维修为主"], "answer": "E", "explanation": "目前血液透析机维护的现状包括疏于维护保养、缺少检测工具、无统一标准、无统一方法、以故障维修为主。"}]}, {"type": "multiple", "questions": [{"text": "血液透析机维护的目的包括？", "options": ["Ａ.保持透析机的高性能", "Ｂ.保持液路和机器外部的清洁消毒维护", "Ｃ.降低透析器采购成本", "Ｄ.缩短单次透析时间", "Ｅ.减少透析室人员配置"], "answer": "AB", "explanation": "维护目的包括保持透析机的高性能，以及保持液路和机器外部的清洁、消毒维护以确保患者的透析安全；降低耗材采购成本、缩短透析时间、减少人员配置均不属于透析机维护的目的。"}, {"text": "血液透析机应在设备规定的环境下使用，其要求包括？", "options": ["Ａ.环境温度为10-30℃", "Ｂ.给水温度为5-35℃", "Ｃ.相对湿度≤70%", "Ｄ.反渗水流量≥1000ml/min", "Ｅ.交流电为110V±11V"], "answer": "ABC", "explanation": "环境温度10-30℃、给水温度5-35℃、相对湿度≤70%均为规定要求；要求反渗水流量≥500ml/min，故反渗水流量≥1000ml/min错误；交流电为220V±22V、50HZ±1HZ，故110V±11V错误。"}, {"text": "血液透析机档案的内容应包括？", "options": ["Ａ.透析机的相关信息", "Ｂ.维修记录", "Ｃ.患者的透析病历", "Ｄ.保养记录", "Ｅ.科室排班记录"], "answer": "ABD", "explanation": "透析机档案内容包括透析机的相关信息、维修记录、保养记录等；患者的透析病历和科室排班记录不属于透析机档案的内容。"}, {"text": "血液透析机的维护内容包括？", "options": ["Ａ.外观检查", "Ｂ.工作正常性检查", "Ｃ.电路部件的维护", "Ｄ.血路部件的维护及参数的检测和校准", "Ｅ.透析器复用次数登记"], "answer": "ABCD", "explanation": "维护内容包括外观检查、工作正常性检查、电路部件的维护、血路部件的维护及参数的检测和校准、水路部件的维护及参数的检测和校准、有效的水路清洗消毒和机器表面消毒；透析器复用次数登记不属于透析机维护内容。"}, {"text": "电路部件的维护内容包括？", "options": ["Ａ.定期清洁机器的防尘滤网", "Ｂ.检查电源总线、插头和插座接触是否良好", "Ｃ.检查电路部件有无老化灼烧痕迹", "Ｄ.定期进行电路系统除尘", "Ｅ.检测并校准血泵流量"], "answer": "ABCD", "explanation": "清洁防尘滤网、检查电源接触情况、检查电路部件老化灼烧痕迹和电路系统除尘均属于电路部件维护内容；检测并校准血泵流量属于血路部件的维护及参数检测校准。"}, {"text": "血液透析机的血路部件维护包括？", "options": ["Ａ.血泵模组", "Ｂ.肝素泵模组", "Ｃ.空气监测器模组", "Ｄ.动、静脉压力传感器", "Ｅ.漏血探测器"], "answer": "ABCD", "explanation": "血路部件维护包括血泵模组、肝素泵模组、空气监测器模组、动、静脉压力传感器的维护；漏血探测器属于重要参数的检查和校准内容。"}, {"text": "血泵模组的维护内容包括？", "options": ["Ａ.清洁血泵壳体和血泵转子", "Ｂ.根据厂家维修说明书检查调整泵管间隙", "Ｃ.检查泵门开关状态", "Ｄ.检测并校准血泵流量", "Ｅ.检测并校准肝素泵注入量"], "answer": "ABCD", "explanation": "血泵模组维护包括清洁血泵壳体和转子、检查调整泵管间隙、检查泵门开关状态、检测并校准血泵流量；检测并校准肝素泵注入量属于肝素泵模组的维护内容。"}, {"text": "肝素泵模组的维护内容包括？", "options": ["Ａ.检查肝素泵移动顺畅性和限位", "Ｂ.及时清除丝杠、丝母之间的结晶", "Ｃ.使用清水清洁光学探测器", "Ｄ.检测并校准肝素泵注入量", "Ｅ.检查空气监测器与静脉夹联动功能"], "answer": "ABD", "explanation": "肝素泵模组维护包括检查移动顺畅性和限位、清除丝杠与丝母之间的结晶、检测并校准肝素泵注入量；使用清水清洁光学探测器属于空气监测器模组维护，检查空气监测器与静脉夹联动功能也属于空气监测器模组维护。"}, {"text": "空气监测器模组的维护内容包括？", "options": ["Ａ.检查空气监测器和静脉夹的联动功能", "Ｂ.定期调整空气监测器灵敏度", "Ｃ.使用清水清洁光学探测器", "Ｄ.检测并校准血泵流量", "Ｅ.检测并校准肝素泵注入量"], "answer": "ABC", "explanation": "空气监测器模组维护包括检查与静脉夹的联动功能、定期调整灵敏度、使用清水清洁光学探测器；检测并校准血泵流量属于血泵模组维护，检测并校准肝素泵注入量属于肝素泵模组维护。"}, {"text": "动、静脉压力传感器的维护内容包括？", "options": ["Ａ.通大气检测压力传感器零点漂移", "Ｂ.检查静（动）脉压力示值误差", "Ｃ.检查静（动）脉压力限值报警功能", "Ｄ.超差时按厂家要求校准传感器", "Ｅ.使用清水清洁光学探测器"], "answer": "ABCD", "explanation": "压力传感器维护包括通大气检测零点漂移、检查示值误差、检查限值报警功能、超差时按厂家要求校准；使用清水清洁光学探测器属于空气监测器模组的维护内容。"}, {"text": "水路部件日常维护的内容包括？", "options": ["Ａ.清除水路部件表面的灰尘", "Ｂ.检查水路管夹是否松动、有无液体渗漏", "Ｃ.检查电磁阀有无锈蚀", "Ｄ.按说明书定期更换密封圈、滤网等老化件", "Ｅ.校准透析液电导率"], "answer": "ABCD", "explanation": "水路部件日常维护包括清除表面灰尘、检查管夹松动与液体渗漏、检查电磁阀锈蚀、定期更换老化部件；电导率的校准属于透析机重要参数的检查和校准。"}, {"text": "透析机重要参数的检查和校准项目包括？", "options": ["Ａ.流量（血泵流量、透析液流量）", "Ｂ.温度", "Ｃ.电导率", "Ｄ.压力（A、V压力，TMP）", "Ｅ.患者干体重"], "answer": "ABCD", "explanation": "重要参数的检查和校准项目包括流量、温度、电导率、压力、超滤精度、肝素泵精度、漏血报警、气泡报警；患者干体重不属于透析机参数的检查校准项目。"}, {"text": "透析机常用的清洗消毒液包括？", "options": ["Ａ.含氯消毒剂（次氯酸钠）", "Ｂ.含过氧乙酸消毒剂", "Ｃ.柠檬酸热化学消毒", "Ｄ.戊二醛消毒液", "Ｅ.甲醛消毒液"], "answer": "ABC", "explanation": "透析机常用清洗消毒液包括含氯消毒剂（次氯酸钠）、含过氧乙酸消毒剂和柠檬酸热化学消毒；戊二醛消毒液和甲醛消毒液不属于透析机常用清洗消毒液。"}, {"text": "关于含氯消毒剂（次氯酸钠）的说法正确的有？", "options": ["Ａ.对脂类等有机物清除效果好", "Ｂ.对设备有腐蚀性", "Ｃ.需要单独除钙", "Ｄ.对环境有一定损害", "Ｅ.适合加热消毒"], "answer": "ABCD", "explanation": "含氯消毒剂对脂类等有机物清除效果好，但具有对设备有腐蚀性、对环境有一定损害、需要单独除钙等缺点；加热消毒不适用于含氯消毒剂的使用要求。"}, {"text": "关于含过氧乙酸消毒剂的说法正确的有？", "options": ["Ａ.消毒效果良好", "Ｂ.对设备有腐蚀性", "Ｃ.纯过氧乙酸不能清除钙盐和脂类", "Ｄ.可以加热消毒", "Ｅ.复合制剂有一定除钙、脱脂作用"], "answer": "ABCE", "explanation": "含过氧乙酸消毒剂消毒效果良好，但对设备有腐蚀性，纯过氧乙酸不能清除钙盐沉淀和脂类等有机物，复合制剂有一定除钙、脱脂作用；此类消毒剂不能加热消毒，故可以加热消毒是错误的。"}, {"text": "关于柠檬酸热化学消毒的说法正确的有？", "options": ["Ａ.对设备损害小", "Ｂ.消毒除钙一次完成", "Ｃ.具有除铁的效果", "Ｄ.对脂类等有机物清除效果一般", "Ｅ.普通柠檬酸即可彻底清除脂类"], "answer": "ABCD", "explanation": "柠檬酸热化学消毒对设备损害小、消毒除钙一次完成、具有除铁效果，但对脂类等有机物清除效果一般；使用复合柠檬酸才可达到清除脂类等有机物、抑菌、缓蚀等效果，故使用普通柠檬酸即可彻底清除脂类等有机物是错误的。"}, {"text": "关于漏血探测器的说法正确的有？", "options": ["Ａ.漏血监测通过测量废液管路透光强度实现", "Ｂ.漏血监测通过测量红细胞对红光吸收实现", "Ｃ.校准前应先对机器清洗消毒", "Ｄ.漏血探测器属于电路部件的维护内容", "Ｅ.校准前应先拆下并更换漏血探测器"], "answer": "ABC", "explanation": "透析机对漏血的监测是利用漏血探测器测量透析液废液管路里的透光强度或红细胞对红光的吸收来实现，校准漏血探测器前应先对机器进行清洗消毒；漏血报警属于重要参数的检查和校准内容，校准也不要求先拆下更换探测器。"}, {"text": "管道内有机物沉积的危害包括？", "options": ["Ａ.小分子物质可透过膜进入透析液侧", "Ｂ.严重时导致机器出现假漏血报警", "Ｃ.血液透析滤过时会出现过敏反应", "Ｄ.出现内毒素检测阳性反应", "Ｅ.显著降低透析液流量示值误差"], "answer": "ABCD", "explanation": "有机物沉积时脂肪、糖链、氨基酸等小分子物质可透过膜进入透析液侧，严重时导致机器出现假漏血报警，血液透析滤过（HDF）时会出现过敏反应，还会出现内毒素检测阳性反应；有机物沉积与透析液流量示值误差的降低无关。"}, {"text": "关于透析机表面清洁的说法正确的有？", "options": ["Ａ.屏幕一般用清水或者酒精擦拭", "Ｂ.无血渍用500mg/l含氯毛巾擦拭", "Ｃ.有血渍先用1500mg/l含氯毛巾擦", "Ｄ.后续再用500mg/l含氯毛巾擦", "Ｅ.只用1000mg/l含氯毛巾擦一次"], "answer": "ABCD", "explanation": "屏幕一般用清水或者酒精擦拭；其它部位无血渍时可用500mg/l的含氯制剂毛巾擦拭，有血渍时先用1500mg/l的含氯制剂毛巾擦拭，再用500mg/l的含氯制剂毛巾擦拭；用1000mg/l含氯制剂毛巾一次性擦拭不符合要求的浓度和步骤。"}, {"text": "透析室常见的污染途径包括？", "options": ["Ａ.穿刺污染手套", "Ｂ.手套污染机器操作界面", "Ｃ.操作界面污染第二双手套", "Ｄ.污染的手套污染患者穿刺部位", "Ｅ.反渗水污染储水罐"], "answer": "ABCD", "explanation": "常见污染途径为穿刺污染手套、手套污染机器操作界面、操作界面污染第二双手套、污染的手套污染患者穿刺部位，最终导致患者污染；反渗水污染储水罐不属于该污染途径的内容。"}]}, {"type": "short", "questions": [{"text": "简述血液透析机维护的目的和基本原则，并说明对维护人员和维护时机的要求。", "options": [], "answer": "答：（1）维护目的：保持透析机的高性能；保持液路和机器外部的清洁、消毒维护，以确保患者的透析安全。（2）基本原则：为每台透析机编号并建立档案，档案内容应包括透析机的相关信息、维修记录、保养记录等；透析机应在设备规定的环境下使用，环境温度10-30℃、给水温度5-35℃，相对湿度≤70%，交流电220V±22V、50HZ±1HZ，直流电使用时间必须≥15min，反渗水流量≥500ml/min，并按照要求进行操作；参照透析机使用说明书要求定期对透析机进行技术安全检查和常规维护保养；当更改消毒程序、改变消毒液原液浓度或吸入量时，应在消毒完成后使用消毒剂残留量试纸（试剂）在透析机排水口取样，检测水路中的残留浓度，确保水路中无消毒液残留。（3）人员要求：透析机的维护需有经过专业培训的临床工程技师负责，并作好维护记录。（4）时机要求：所有的维护工作必须在人机分离的情况下进行，以确保患者安全；建议透析室配备备用透析机，备用透析机停用≥48小时，使用前应进行一次完整的水路消毒。", "explanation": "解析：维护工作的核心是保持透析机的高性能并保证患者透析安全，因此环境条件、档案管理、人员资质、人机分离及备用机管理都是基本原则的组成部分，其中各项数字指标必须与设备规定的使用条件一致。"}, {"text": "简述血液透析机外观检查和工作正常性检查的主要内容。", "options": [], "answer": "答：（1）外观检查：目视检查透析机的外观及附件；透析机应标识完整，包括名称、型号、制造厂商、出厂编号等；透析机外壳应无影响其正常工作或电气安全的机械损伤；同时检查控制面板、消毒液吸入管等部位。（2）工作正常性检查：检查各种按键和旋钮；检查声光报警系统；检查备用电池。", "explanation": "解析：外观检查关注标识是否完整和外壳有无影响正常工作或电气安全的机械损伤，工作正常性检查关注各种按键和旋钮、声光报警系统和备用电池，两者都是透析机维护内容中的基础检查环节。"}, {"text": "简述血液透析机常用清洗消毒液的种类，并写出其水路有效浓度、维持时间和最大残留量的要求。", "options": [], "answer": "答：（1）含氯消毒剂（次氯酸钠）：水路有效浓度1000~1500mg/L，维持时间≥20min，最大残留≤0.1mg/L；对脂类等有机物清除效果好，但对设备有腐蚀性、对环境有一定损害，需要单独除钙。（2）含过氧乙酸消毒剂：水路有效浓度1500~3000mg/L，维持时间≥15min，最大残留≤1mg/L；消毒效果良好，但对设备有腐蚀性，纯过氧乙酸不能清除钙盐沉淀和脂类等有机物，复合制剂有一定除钙、脱脂作用，不能加热消毒。（3）柠檬酸热化学消毒：有效浓度0.8%-2%，温度83-92℃，维持时间≥15min；对设备损害小，消毒除钙一次完成，具有除铁的效果，但对脂类等有机物清除效果一般，要求透析机具有加热消毒功能，使用复合柠檬酸可达到清除脂类等有机物、抑菌、缓蚀等效果。", "explanation": "解析：三种清洗消毒液的浓度、温度、维持时间和最大残留量是透析机消毒质量控制的关键指标；使用成品消毒液还可减少浓度差、降低透析机内部零件的故障率。"}, {"text": "简述透析机流量参数的示值误差要求及检测点，并写出透析液温度和电导率的检测点及示值误差要求。", "options": [], "answer": "答：（1）流量：示值误差＜±10%；血泵流量选取100 mL/min、200 mL/min、400 mL/min三个测试点，透析液流量选取300ml/min、500ml/min、700ml/min三个测试点，均采用电子秒表计时3 min。（2）温度：透析液温度示值误差＜±0.5 ℃；将透析液流量调至500mL/min，依次选择35℃、36℃和37℃作为温度检测点。（3）电导率：透析液电导率示值误差＜±0.3mS/cm；选取13.5mS/cm、14.0mS/cm、14.5 mS/cm三个检测点，并检查电导率超限监测功能。", "explanation": "解析：流量、温度、电导率均属于透析机重要参数的检查和校准项目；检查电导率超限监测功能时，当电导率超出设定限值，透析机应发出声光警报并阻止透析液流向透析器。"}, {"text": "简述管道内有机物沉积的危害，并说明常用的染色鉴别方法及其结果判断。", "options": [], "answer": "答：（1）危害：脂肪、糖链、氨基酸是小分子物质，可以透过膜进入到透析液侧；严重时导致机器出现假漏血报警；血液透析滤过（HDF）时会出现过敏反应；还会出现内毒素检测阳性反应。（2）染色鉴别方法：苏丹黑B染色呈蓝黑色，说明有脂类物质存在；PAS染色呈紫色，说明有糖链成分；丽春红3R染色时，丽春红可以与蛋白结合，同时也可以与氨基酸残基相结合，从而形成红色的条带。", "explanation": "解析：有机物沉积是透析机水路清洗消毒不彻底的重要后果，通过不同染色方法的显色结果可以判断沉积物的成分，从而有针对性地选择清洗消毒方案。"}]}]}, {"num": 31, "title": "透析液成份及质量控制理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析的三要素中，除透析器和透析机外还包括？", "options": ["A.置换液", "B.透析液", "C.血泵", "D.动静脉内瘘", "E.水处理设备"], "answer": "B", "explanation": "血液透析的三要素为透析器、透析机和透析液；置换液、血泵、动静脉内瘘和水处理设备都不属于这三大要素。"}, {"text": "透析中每个病人一年将承受多少升水的滤过？", "options": ["A.5000～10000 L", "B.10000～15000 L", "C.15000～30000 L", "D.30000～50000 L", "E.50000 L以上"], "answer": "C", "explanation": "透析中每个病人一年将承受15000～30000 L水的滤过，按每小时约30 L、每次约120 L、每周约360 L累计并加上置换液计算，因此透析液被视为一种药物。"}, {"text": "1912年首次对活体动物进行弥散实验并开创血液透析事业的是？", "options": ["A.荷兰考尔夫", "B.德国哈斯", "C.美国John Abel", "D.法国阿贝尔", "E.英国科尔夫"], "answer": "C", "explanation": "1912年美国Johns Hopkins医学院John Abel及其同事第一次对活体动物进行弥散实验，开创了血液透析事业。"}, {"text": "首次被命名为人工肾脏的管状透析器由什么材料制成？", "options": ["A.火棉胶", "B.赛璐珞", "C.铜仿膜", "D.聚砜膜", "E.醋酸纤维膜"], "answer": "A", "explanation": "John Abel及其同事用火棉胶制成的管状透析器，并首次命名为人工肾脏（artificial kidney）。"}, {"text": "1912年对兔进行2小时血液透析时所用的抗凝剂是？", "options": ["A.肝素", "B.枸橼酸钠", "C.低分子肝素", "D.阿加曲班", "E.水蛭素"], "answer": "E", "explanation": "该实验将火棉胶透析器放在生理盐水中，以水蛭素作为抗凝剂对兔进行了2小时血液透析。"}, {"text": "1943年首先使用碳酸氢盐作为缓冲碱进行血液透析的医生是？", "options": ["A.哈斯", "B.Abel", "C.Eschbach", "D.考尔夫", "E.Henderson"], "answer": "D", "explanation": "1943年荷兰医生考尔夫根据病人的需要调整透析液，首先使用碳酸氢盐作为缓冲碱进行血液透析，透析液不再是单纯的生理盐水。"}, {"text": "20世纪60年代开始广泛用作透析液缓冲碱的是？", "options": ["A.碳酸氢盐", "B.乳酸盐", "C.枸橼酸盐", "D.琥珀酸盐", "E.醋酸盐"], "answer": "E", "explanation": "20世纪60年代开始使用醋酸盐作为透析液的缓冲碱，该溶液稳定性好、可避免微生物污染且价格低廉，很快在透析中被广泛使用。"}, {"text": "20世纪80年代重新开始使用碳酸盐透析液的原因是？", "options": ["A.醋酸盐价格大幅上涨", "B.高效透析技术出现使醋酸盐的缺点更明显", "C.碳酸氢盐浓缩液不易生长细菌", "D.碳酸盐原料更容易获得", "E.碳酸氢盐透析液性质更稳定"], "answer": "B", "explanation": "20世纪80年代由于高效透析技术出现，使醋酸盐透析液的缺点更加明显，因此重新开始使用碳酸盐透析液。"}, {"text": "将碳酸盐浓缩液分隔在两个容器中的主要目的是？", "options": ["A.便于运输和储存", "B.降低生产成本", "C.减少细菌污染", "D.解决碳酸钙和碳酸镁结晶沉淀问题", "E.便于调节透析液pH"], "answer": "D", "explanation": "将碳酸盐浓缩液分隔在两个容器中，是为了解决碳酸钙和碳酸镁结晶沉淀的问题。"}, {"text": "20世纪80年代后期出现在线干粉桶的主要目的是？", "options": ["A.降低透析液成本", "B.提高透析液pH值", "C.减少细菌污染和碳酸氢根挥发", "D.便于集中供液", "E.增加超滤量"], "answer": "C", "explanation": "液体碳酸盐浓缩液容易被细菌污染，碳酸氢根容易挥发，因而出现在线干粉桶，以减少细菌污染和碳酸氢根的挥发。"}, {"text": "下列哪一项不属于透析液的作用？", "options": ["A.排除肌酐、尿素等代谢废物", "B.排除毒物或过量药物", "C.调节水-电解质平衡", "D.调节酸碱平衡", "E.提高血浆白蛋白浓度"], "answer": "E", "explanation": "透析液的作用包括排除体内代谢废物（如肌酐、尿素）、排除体内毒物或过量药物、调节体液的水-电解质平衡和酸碱平衡；提高血浆白蛋白浓度不属于透析液的作用。"}, {"text": "评价理想透析液时应考虑的因素是？", "options": ["A.生理学因素、细菌学因素、毒性因素", "B.经济学因素、运输因素、储存因素", "C.温度因素、流速因素、压力因素", "D.成本因素、包装因素、品牌因素", "E.人员因素、设备因素、场地因素"], "answer": "A", "explanation": "理想的透析液应从生理学因素、细菌学因素和毒性因素三个方面评价。"}, {"text": "理想透析液的生理学因素中，补充患者缺乏的物质所举的例子是？", "options": ["A.铝离子", "B.钙离子", "C.铜离子", "D.氟离子", "E.钠离子"], "answer": "B", "explanation": "生理学因素要求补充患者缺乏的物质，如钙离子；同时要求离子种类、比例、浓度与人体血液电解质浓度接近。"}, {"text": "中国标准YY0572-2015规定透析用水的细菌标准是？", "options": ["A.＜10 cfu/ml", "B.＜25 cfu/ml", "C.＜50 cfu/ml", "D.＜100 cfu/ml", "E.＜200 cfu/ml"], "answer": "D", "explanation": "中国标准YY0572-2015规定透析用水细菌标准为＜100 cfu/ml。"}, {"text": "中国标准YY0572-2015规定透析用水的内毒素标准是？", "options": ["A.＜0.05 EU/ml", "B.＜0.125 EU/ml", "C.＜0.25 EU/ml", "D.＜0.5 EU/ml", "E.＜2 EU/ml"], "answer": "C", "explanation": "中国标准YY0572-2015规定透析用水内毒素标准为＜0.25 EU/ml。"}, {"text": "中国标准YY0572-2015规定透析用水细菌的干预水平是？", "options": ["A.≥10 cfu/ml", "B.≥25 cfu/ml", "C.≥50 cfu/ml", "D.≥100 cfu/ml", "E.≥200 cfu/ml"], "answer": "C", "explanation": "透析用水细菌的干预水平为≥50 cfu/ml，达到该水平应及时采取干预措施。"}, {"text": "中国标准YY0572-2015规定透析用水内毒素的干预水平是？", "options": ["A.≥0.05 EU/ml", "B.≥0.125 EU/ml", "C.≥0.25 EU/ml", "D.≥0.5 EU/ml", "E.≥1.0 EU/ml"], "answer": "B", "explanation": "透析用水内毒素的干预水平为≥0.125 EU/ml。"}, {"text": "透析用水细菌检测的频率为？", "options": ["A.每月至少1次", "B.每周至少1次", "C.每季度至少1次", "D.每半年至少1次", "E.每年至少1次"], "answer": "A", "explanation": "透析用水细菌检测频率为至少每月1次。"}, {"text": "透析用水内毒素检测的频率为？", "options": ["A.每周至少1次", "B.每月至少1次", "C.每季度至少1次", "D.每半年至少1次", "E.每年至少1次"], "answer": "C", "explanation": "透析用水内毒素检测频率为至少每季度1次。"}, {"text": "透析用水采样时，样本取样口应保持开启并放水至少多久？", "options": ["A.10秒", "B.20秒", "C.40秒", "D.60秒", "E.120秒"], "answer": "D", "explanation": "取样点至少应包括供水回路的末端，样本取样口应保持开启并放水至少60 s后再进行消毒和采样。"}, {"text": "透析用水采样时，可用于消毒取样口外表面的消毒剂是？", "options": ["A.含氯消毒剂", "B.75%乙醇", "C.0.33%过氧乙酸", "D.碘伏", "E.戊二醛"], "answer": "B", "explanation": "可使用75%乙醇消毒擦拭出水口外表面3次，待乙醇完全挥发后方可采样，不能使用其他消毒剂。"}, {"text": "碳酸氢盐透析液中碳酸氢盐的浓度范围是？", "options": ["A.22～28毫当量/升", "B.28～32毫当量/升", "C.32～38毫当量/升", "D.38～42毫当量/升"
