高铁血红蛋白、抑止抗氧化途径、溶血和溶血性贫血、胸痛、心律失常、气促、恶心、呕吐，还会破坏反渗膜，进入除离子（DI）装置中可能产生亚硝胺，故第五项不对。"}, {"text": "关于水处理系统的日常监测与维护，说法正确的有？", "options": ["Ａ.每日记录电导度与流量", "Ｂ.每日记录余氯与总氯", "Ｃ.每日记录软水罐后硬度", "Ｄ.细菌培养每月一次", "Ｅ.化学污染物检测每半年一次"], "answer": "ABCD", "explanation": "每日监测并记录进水压力、进出水电导度、废水流量、纯水流量和纯水压力；每日取样记录活性炭罐后水样的余氯及总氯水平、软水罐后的硬度水平；每月进行反渗水的细菌培养，每季度进行内毒素检测，每年进行化学污染物的检测，故第五项不对。"}, {"text": "关于水处理系统的场地、供电与供水要求，说法正确的有？", "options": ["Ａ.水处理间面积1.5倍以上", "Ｂ.门净宽≥1.5米、净高≥2.5米", "Ｃ.供电为380V三相五线制", "Ｄ.原水压力≥2kg/cm²", "Ｅ.反渗水宜单管直供"], "answer": "ABCD", "explanation": "水处理间面积应为水处理装置占地面积的1.5倍以上；水处理的门建议为双开门，净宽度一般不小于1.5米、净高度一般不低于2.5米；供电为380V三相五线制，三相AC 380V±5%、频率50Hz±1Hz；原水端正常用水流量下供水压力不小于2kg/cm²且压力稳定；反渗水的送水管路需采取闭合回路形式供水，单管直供易形成死腔，故第五项不对。"}]}, {"type": "short", "questions": [{"text": "简述血液透析机机箱的分层结构以及高层系统和低层系统的主要组成。", "options": [], "answer": "机箱分层：自上而下依次为机箱高层、机箱超滤层、机箱配液层和机箱进水层。高层系统组成：通信模块、高层控制单元TLC（主板）、小型闪存卡CFC和选配件；通过高层系统可实现用户与机器之间的通信，并与数字板DB(LLD)上的低层控制单元和监测单元双向传输数据。低层系统组成：数字板DB(LLD)、模拟板AB(LLA)、马达电源板PBM和阀门电源板PBV；低层控制单元可控制和监控所有功能，与低层监测单元之间传输和接收消息、数据和命令。信号与驱动关系：所有传感器数据均通过模拟板到数字板，经过两个串行总线系统单独发送至监测单元和控制单元；执行机构、监控器和阀门通过阀门电源板PBV和马达电源板PBM驱动。机器通过触摸屏（TFT液晶屏）实现操作，并采用两个微处理器系统控制及监控机器。", "explanation": "机箱分层与高层、低层系统的划分体现了血透机以双微处理器系统实现控制与监控的设计：高层系统负责人机通信与数据处理，低层系统负责信号采集、执行机构驱动与安全监控，两者通过数字板交换数据。"}, {"text": "简述血透机进水层水路中进水、除气和加热的控制流程。", "options": [], "answer": "进水控制：DMV进水调压→VVBE进水阀→NSVB水箱液位传感器反馈控制→冷水箱；血透机进水要求压力0.5～6bar、流量≥800ml/min、温度10～30℃，其中减压阀DMV出口压力为0.9±0.1bar。除气控制：冷水箱→VEB旁路阀（治疗时关闭，消毒时打开）→PE除气压力传感器→EK除气室→EP除气泵；PE监测除气压并反馈调节EP除气泵的转速，EK除气室收集负压分离的微小气泡，使气泡在颗粒表面形成大气泡。加热控制：EP除气泵→H加热棒→TSE加热后温度传感器，并由TSD和TSDE共同参与反馈控制加热功率；H的加热功率受TSE、TSD、TSDE反馈调节，TSH为高温保险，熔断点为152℃。", "explanation": "进水、除气和加热三个环节串联构成进水层的基本水路，每个环节均设有相应传感器实现反馈控制，并通过高温保险等措施保证运行安全。"}, {"text": "简述血透机平衡腔系统的组成及其主要作用。", "options": [], "answer": "组成：1对平衡腔BK1/BK2；8个平衡腔电磁阀，即VEBK1/VEBK2、VDEBK1/VDEBK2、VABK1/VABK2、VDABK1/VDABK2；1对平衡腔膜片位置传感器MSBK1/2。作用：一用一备运行，BK1准备透析液的同时BK2使用透析液，两者交替，从而提供连续稳定的透析液；保证进出平衡腔的液体流量平衡；保证进出透析器的液体流量平衡。流速调节：透析液流向中由FBK1过滤网经VEBK1/2进平衡腔阀、膜片位移传感器MSBK1/2、BK1/2平衡腔、VDEBK1/2出平衡腔阀到DDE节流阀，MSBK1/2反馈控制FPE透析液泵和FPA废液泵的泵速以调节流速，实现透析液流速及超滤精度控制。", "explanation": "平衡腔是透析液容量控制和超滤精度控制的核心部件，通过膜片位移传感器的反馈实现泵速调节，从而保证容量平衡并达到设定的超滤目标。"}, {"text": "简述血液透析用水处理系统中预处理各构件（前置过滤器、多介质过滤器、树脂软化器、活性炭过滤器、精密保安过滤器）的原理与作用。", "options": [], "answer": "前置过滤器：过滤自来水中的固体杂质，采用7支30英寸、20-50微米孔径的PP过滤芯，一般1-3个月更换，或者前后压力差值大于0.5bar时强制更换，具有旁路功能。多介质过滤器（砂罐）：滤料含石英砂、无烟煤和锰砂；水中的铁能使交换树脂失效、污染反渗透膜，除铁常用锰砂过滤法，天然锰砂的主要成分是二氧化锰（MnO2），铁离子与锰砂接触即可将Fe2+氧化成Fe3+，生成的Fe3+立即水解生成絮状氢氧化铁沉淀而被过滤除去，维护上需定时进行反清洗除去沉淀物。树脂软化器：滤料为树脂，交换剂是钠型阳离子交换树脂，除去水中钙、镁离子的过程称为软化，交换剂失效后可用再生液（常用的为饱和盐溶液）再生，需定时或定量冲洗再生，每天透析前监测水的硬度和盐箱的盐量和液位。活性炭过滤器：活性炭有非常多的微孔和巨大的表面积，物理吸附能力强并与氯发生化学反应，可除去水中的有机物、致热源、残余氯和色素；活性炭不可再生、一般定期更换，游离氯接触时间要求在6分钟以上，氯胺要求在10分钟以上。精密保安过滤器：过滤水中大于5微米的固体杂质，是保护反渗装置的最后一道物理防线，采用2支20英寸、1-5微米孔径的PP过滤芯，一般1-3个月更换或者前后压力差值大于0.5bar时强制更换，具有旁路功能。", "explanation": "预处理各构件按顺序承担去除固体杂质、铁、钙镁硬度和残余氯（氯胺）等任务，是保证反渗透系统长期稳定运行和透析用水达标的前置保障。"}, {"text": "简述水处理系统日常监测与维护的主要内容。", "options": [], "answer": "监测方面：每日监测并记录进水压力、进出水电导度、废水流量、纯水流量、纯水压力等参数；每日取样并记录活性炭罐后水样的余氯及总氯水平、软水罐后的硬度水平；每月进行反渗水的细菌培养，每季度进行内毒素检测，每年进行化学污染物的检测；样品的采集时机通常为水处理系统正常运转15分钟后，而硬度在每个工作日结束临近关机时采样检测，以监测再生是否完全。维护方面：定期校正自动反冲阀头的时间，以避免在治疗时进入自动反冲程序；定期更换各类材料，锰砂颗粒、活性炭粒、树脂和反渗透膜均建议2年更换，反渗水循环管路根据监测指标更换，一般材质寿命50年；每半年请厂商对设备进行参数技术校对；用过氧乙酸或甲醛进行化学消毒的时间按厂家说明书进行，在反复冲洗后应在产水端和各个回水端进行消毒液残留监测，确保无残留才能停止冲洗；定期对设备表面进行除尘，同时注意防止漏电事故。", "explanation": "以水质指标和运行参数监测为核心，配合定期更换材料与厂商技术校对，是保证透析用水长期安全稳定运行的关键环节。"}]}]}, {"num": 24, "title": "血液净化护理操作规范之透析器规范预冲再认识理论考试题库", "sections": [{"type": "single", "questions": [{"text": "透析器预冲中“预充”的含义是（  ）", "options": ["A.清除微小颗粒", "B.充分排气、湿化", "C.消毒透析膜", "D.检测膜完整性", "E.补充肝素剂量"], "answer": "B", "explanation": "透析器预冲的含义包括两部分：预充指充分排气、湿化；冲洗指清除微小颗粒。"}, {"text": "透析器预冲中“冲洗”的含义是（  ）", "options": ["A.充分排气", "B.膜内湿化", "C.清除微小颗粒", "D.调节跨膜压", "E.预充肝素"], "answer": "C", "explanation": "透析器预冲的含义包括两部分：预充指充分排气、湿化；冲洗指清除微小颗粒。"}, {"text": "下列属于天然纤维素膜的是（  ）", "options": ["A.血仿膜", "B.三醋酸膜", "C.聚砜膜", "D.醋酸膜、铜仿膜", "E.AN69"], "answer": "D", "explanation": "按透析膜的发展，天然纤维素膜包括醋酸膜、铜仿膜；改良纤维素膜包括血仿膜、三醋酸膜；合成膜包括聚砜膜、AN69等。"}, {"text": "下列属于改良纤维素膜的是（  ）", "options": ["A.醋酸膜", "B.铜仿膜", "C.血仿膜、三醋酸膜", "D.聚砜膜", "E.PMMA"], "answer": "C", "explanation": "改良纤维素膜包括血仿膜、三醋酸膜；醋酸膜、铜仿膜为天然纤维素膜。"}, {"text": "按照透析膜的分类，AN69属于（  ）", "options": ["A.天然纤维素膜", "B.改良纤维素膜", "C.合成膜中的对称膜", "D.合成膜中的不对称膜", "E.复合膜"], "answer": "C", "explanation": "合成膜分为不对称膜（PS、PA即聚砜膜）和对称膜（AN69、PMMA）。"}, {"text": "按照透析膜的分类，PS和PA（聚砜膜）属于（  ）", "options": ["A.天然纤维素膜", "B.改良纤维素膜", "C.合成膜中的不对称膜", "D.合成膜中的对称膜", "E.纤维素膜"], "answer": "C", "explanation": "合成膜中，不对称膜包括PS和PA（聚砜膜），对称膜包括AN69和PMMA。"}, {"text": "在生物相容性方面，合成膜的特点是（  ）", "options": ["A.差", "B.改善", "C.好", "D.与天然纤维素膜相同", "E.无差别"], "answer": "C", "explanation": "天然纤维素膜生物相容性差，改良纤维素膜生物相容性改善，合成膜生物相容性好。"}, {"text": "在生物相容性方面，改良纤维素膜的特点是（  ）", "options": ["A.差", "B.改善", "C.好", "D.优于合成膜", "E.无法评价"], "answer": "B", "explanation": "天然纤维素膜生物相容性差，改良纤维素膜生物相容性改善，合成膜生物相容性好。"}, {"text": "按照透析膜的特性，吸附能力“很小”的膜是（  ）", "options": ["A.天然纤维素膜", "B.改良纤维素膜", "C.合成膜", "D.聚砜膜", "E.AN69"], "answer": "A", "explanation": "天然纤维素膜吸附能力很小，改良纤维素膜有吸附能力，合成膜吸附能力高。"}, {"text": "按照透析膜的特性，中大分子清除能力“很少”的膜是（  ）", "options": ["A.合成膜", "B.改良纤维素膜", "C.天然纤维素膜", "D.聚砜膜", "E.PMMA"], "answer": "C", "explanation": "天然纤维素膜对中大分子的清除很少；改良纤维素膜有吸附能力，合成膜吸附能力高。"}, {"text": "按照不同合成膜对β2微球蛋白的清除数据，总清除率最高的膜是（  ）", "options": ["A.PS", "B.AN69", "C.PMMA", "D.PAN", "E.醋酸膜"], "answer": "A", "explanation": "不同合成膜对β2微球蛋白的总清除率（mg/m²·24h）中，PS为154.7±12.3，AN69为137.8±28.4，PMMA为138.0。"}, {"text": "按照不同合成膜对β2微球蛋白的清除数据，吸附清除率最高的膜是（  ）", "options": ["A.PS", "B.AN69", "C.PMMA", "D.PA", "E.血仿膜"], "answer": "C", "explanation": "不同合成膜对β2微球蛋白的吸附清除率（mg/m²·24h）中，PMMA（湿膜型）为130.8，AN69为83.1±29.0，PS仅为26.7±4.3。"}, {"text": "不同合成膜对β2微球蛋白的跨膜清除率（mg/m²·24h）中，PS的数值是（  ）", "options": ["A.26.7±4.3", "B.54.7±8.1", "C.83.1±29.0", "D.128.0±18.1", "E.130.8"], "answer": "D", "explanation": "PS对β2微球蛋白的跨膜清除率为128.0±18.1（mg/m²·24h），吸附清除率为26.7±4.3，总清除率为154.7±12.3。"}, {"text": "不同合成膜对β2微球蛋白的跨膜清除率（mg/m²·24h）中，AN69的数值是（  ）", "options": ["A.26.7±4.3", "B.54.7±8.1", "C.83.1±29.0", "D.128.0±18.1", "E.154.7±12.3"], "answer": "B", "explanation": "AN69对β2微球蛋白的跨膜清除率为54.7±8.1（mg/m²·24h），吸附清除率为83.1±29.0，总清除率为137.8±28.4。"}, {"text": "不同合成膜对β2微球蛋白的总清除率（mg/m²·24h）中，PMMA的数值是（  ）", "options": ["A.128.0", "B.137.8", "C.138.0", "D.154.7", "E.130.8"], "answer": "C", "explanation": "PMMA（湿膜型）的β2微球蛋白总清除率为138.0（mg/m²·24h），吸附清除率为130.8。"}, {"text": "关于低通量和高通量透析治疗的风险，正确的说法是（  ）", "options": ["A.仅高通量治疗存在该风险", "B.仅低通量治疗存在该风险", "C.两者都有细菌片段进入血液侧的风险", "D.两者都不会有细菌片段进入", "E.细菌片段只能停留在透析液侧"], "answer": "C", "explanation": "低通量和高通量治疗都有细菌片段和内毒素进入血液侧的风险，因此需要规范的预冲。"}, {"text": "部分聚砜膜透析器设计的褶皱海绵结构，其主要作用是（  ）", "options": ["A.增大有效膜面积", "B.降低跨膜压", "C.更好阻滞透析液侧的细菌", "D.提高小分子清除", "E.减少肝素用量"], "answer": "C", "explanation": "部分聚砜膜透析器为减少细菌及内毒素进入血液侧的风险，设计了褶皱海绵结构，对内毒素的滞留、吸收效果更好，能更有效阻滞来自透析液侧的细菌，但对透析器规范预冲也有更高的要求。"}, {"text": "透析器预冲的目的之一是（  ）", "options": ["A.增大透析器膜面积", "B.降低凝血概率、减少回血残余血量", "C.提高透析液温度", "D.延长透析器使用年限", "E.降低跨膜压"], "answer": "B", "explanation": "透析器预冲的目的包括：降低透析器凝血概率，减少回血后透析器的残余血量；降低首次使用综合征发生概率；提高透析效率。"}, {"text": "关于透析器在透析装置中的地位，正确的表述是（  ）", "options": ["A.可省略的部件", "B.仅起过滤水分作用", "C.是透析装置的核心组成部分", "D.只影响透析费用", "E.只与透析器凝血有关"], "answer": "C", "explanation": "透析器是透析装置中的核心组成部分；其性能或者性能的发挥对透析效果有着重要的影响；充分预冲对保持患者状态的平稳起重要作用。"}, {"text": "关于透析器预冲液的选择，可采用的方案是（  ）", "options": ["A.仅可使用生理盐水", "B.仅可使用肝素生理盐水", "C.生理盐水或肝素生理盐水", "D.仅可使用葡萄糖溶液", "E.仅可使用透析液"], "answer": "C", "explanation": "透析器预冲液可选择生理盐水，若需要进行肝素生理盐水预冲，应在生理盐水预冲量达到后再进行。"}, {"text": "辅助预冲模式所依照的预冲程序的制定依据是（  ）", "options": ["A.血液净化标准化操作规程", "B.透析器生产厂家说明书", "C.透析液生产厂家说明书", "D.医院感染管理制度", "E.患者个体情况"], "answer": "A", "explanation": "辅助预冲模式是严格按照血液净化标准化操作规程制定的一种预冲程序，具有定量、定时、泵速自动调节由慢至快等特点。"}, {"text": "按照标准操作规程，预冲第一阶段血泵的速度应为（  ）", "options": ["A.50～80ml/min", "B.80～100ml/min", "C.100～200ml/min", "D.200～300ml/min", "E.300～400ml/min"], "answer": "B", "explanation": "标准操作规程要求：血泵80～100ml/min低速排气，用生理盐水先排净透析管路和透析器血室（膜内）气体，此时透析器静脉端朝上。"}, {"text": "按照标准操作规程，透析器血室（膜内）排气时透析器的摆放方向是（  ）", "options": ["A.静脉端朝上", "B.静脉端朝下", "C.动脉端朝上", "D.水平放置", "E.倾斜45度"], "answer": "A", "explanation": "预冲第一阶段要求血泵80～100ml/min低速排气，用生理盐水先排净透析管路和透析器血室（膜内）气体，透析器静脉端朝上。"}, {"text": "按照标准操作规程，预冲时生理盐水的正确流向是（  ）", "options": ["A.静脉端→透析器→动脉端", "B.动脉端→透析器→静脉端", "C.透析液室→血室", "D.可逆向预冲", "E.双向同时预冲"], "answer": "B", "explanation": "生理盐水流向为动脉端→透析器→静脉端，不得逆向预冲。"}, {"text": "关于预冲时的生理盐水流向，正确的做法是（  ）", "options": ["A.可逆向预冲以提高排气效果", "B.动脉端→透析器→静脉端，不得逆向", "C.由静脉端进入更利于排气", "D.可任意选择方向", "E.先逆向再顺向预冲"], "answer": "B", "explanation": "标准操作规程明确：生理盐水流向为动脉端→透析器→静脉端，不得逆向预冲。"}, {"text": "按照标准操作规程，预冲中快速冲洗阶段泵速应调至（  ）", "options": ["A.80～100ml/min", "B.100～200ml/min", "C.200～300ml/min", "D.300～400ml/min", "E.400～500ml/min"], "answer": "C", "explanation": "标准操作规程要求将泵速调至200～300ml/min进行快速冲洗，并连接透析液接头与透析器旁路。"}, {"text": "按照标准操作规程，预冲中排净透析器透析液室（膜外）气体的时机是（  ）", "options": ["A.在膜内预冲之前", "B.在快速冲洗并接旁路后", "C.在闭式循环之后", "D.在上机之后", "E.无需排膜外气体"], "answer": "B", "explanation": "标准操作规程要求：将泵速调至200～300ml/min快速冲洗，连接透析液接头与透析器旁路，再排净透析器透析液室（膜外）气体。"}, {"text": "若需要进行闭式循环或肝素生理盐水预冲，正确的时机是（  ）", "options": ["A.生理盐水预冲量达到后", "B.预冲开始时立即进行", "C.连接患者后进行", "D.膜内排气之前进行", "E.冲洗微粒之前进行"], "answer": "A", "explanation": "标准操作规程要求：若需要进行闭式循环或肝素生理盐水预冲，应在生理盐水预冲量达到后再进行。"}, {"text": "关于透析液在线预冲量，标准操作规程的要求是（  ）", "options": ["A.≥1000ml", "B.≥2000ml", "C.≥3000ml", "D.≥4000ml", "E.≥5000ml"], "answer": "D", "explanation": "标准操作规程要求：透析液在线预冲量≥4000ml，透析监视装置（血液透析机）自动采用逆超滤，膜外、膜内、动脉端、静脉端分别预冲。"}, {"text": "透析液在线预冲时，透析监视装置（血液透析机）自动采用的方式是（  ）", "options": ["A.正超滤", "B.逆超滤", "C.单纯重力引流", "D.间歇冲洗", "E.不需超滤"], "answer": "B", "explanation": "透析液在线预冲量≥4000ml，透析监视装置（血液透析机）自动采用逆超滤，膜外、膜内、动脉端、静脉端分别预冲。"}, {"text": "关于预冲量的控制，正确的做法是（  ）", "options": ["A.统一按1000ml执行", "B.按透析器说明书要求执行", "C.由护士凭经验决定", "D.按患者体重决定", "E.越多越好不设上限"], "answer": "B", "explanation": "标准操作规程要求：预冲量应严格按照透析器说明书要求执行。"}, {"text": "按照血液透析专科护理操作指南，预冲推荐使用的生理盐水的包装是（  ）", "options": ["A.500ml瓶装", "B.1000ml袋装", "C.1000ml瓶装", "D.3000ml袋装", "E.自行配制"], "answer": "B", "explanation": "血液透析专科护理操作指南推荐使用1000ml的袋装生理盐水，避免用瓶装生理盐水，以减少管路暴露机会。"}, {"text": "按照血液透析专科护理操作指南，推荐使用袋装生理盐水的目的是（  ）", "options": ["A.降低费用", "B.缩短预冲时间", "C.减少管路暴露机会", "D.便于加温", "E.便于计量"], "answer": "C", "explanation": "推荐使用1000ml的袋装生理盐水，避免用瓶装生理盐水，以减少管路暴露机会。"}, {"text": "按照血液透析专科护理操作指南，预冲时应使用的管路类型是（  ）", "options": ["A.不带液体收集袋的管路", "B.带有液体收集袋的管路", "C.不带废液袋的管路", "D.单向引流管路", "E.开放式引流管路"], "answer": "B", "explanation": "血液透析专科护理操作指南要求使用带有液体收集袋的管路。"}, {"text": "按照血液透析专科护理操作指南，排气阶段血泵的速度是（  ）", "options": ["A.50ml/min", "B.100ml/min", "C.200ml/min", "D.300ml/min", "E.400ml/min"], "answer": "B", "explanation": "血液透析专科护理操作指南要求：启动血泵，以100ml/min排气；排净透析器膜内气体后，安装透析液旁路。"}, {"text": "按照血液透析专科护理操作指南，安装透析液旁路的时机是（  ）", "options": ["A.排净膜内气体后", "B.开始排气前", "C.冲洗微粒前", "D.闭式循环后", "E.连接患者后"], "answer": "A", "explanation": "排气阶段以100ml/min启动血泵，排净透析器膜内气体后，再安装透析液旁路。"}, {"text": "按照血液透析专科护理操作指南，安装透析液旁路后将透析器翻转的角度和方向是（  ）", "options": ["A.90度，静脉向上", "B.180度，静脉向下", "C.180度，动脉向下", "D.45度，静脉向下", "E.不需翻转"], "answer": "B", "explanation": "血液透析专科护理操作指南要求：排净透析器膜内气体后安装透析液旁路，将透析器翻转180度，静脉向下，再以200～300ml/min冲洗。"}, {"text": "按照血液透析专科护理操作指南，翻转透析器后的冲洗泵速是（  ）", "options": ["A.50～80ml/min", "B.100ml/min", "C.200～300ml/min", "D.300～400ml/min", "E.400ml/min以上"], "answer": "C", "explanation": "血液透析专科护理操作指南要求：透析器翻转180度、静脉向下后，以200～300ml/min冲洗。"}, {"text": "按照血液透析专科护理操作指南，预冲总使用液体量应不少于（  ）", "options": ["A.500ml", "B.600ml", "C.800ml", "D.1000ml", "E.1500ml"], "answer": "C", "explanation": "血液透析专科护理操作指南要求：总使用液体不少于800ml。"}, {"text": "按照血液透析专科护理操作指南，闭式循环进行的时机是（  ）", "options": ["A.排气、冲洗完毕后", "B.排气之前", "C.冲洗微粒之前", "D.安装旁路之前", "E.连接患者之后"], "answer": "A", "explanation": "血液透析专科护理操作指南要求：如果需要进行闭式循环，在排气、冲洗完毕后可进行。"}, {"text": "密闭式预冲操作流程中，管路安装时透析器的方向是（  ）", "options": ["A.静脉端向上", "B.静脉端向下", "C.动脉端向上", "D.水平放置", "E.倾斜45度"], "answer": "A", "explanation": "密闭式预冲操作流程的管路安装环节要求：安装透析器，静脉端向上；管路动脉端安装；管路静脉端安装；管路动脉端连接预冲生理盐水1000ml。"}, {"text": "密闭式预冲操作流程中，管路动脉端连接的预冲生理盐水量是（  ）", "options": ["A.500ml", "B.800ml", "C.1000ml", "D.1500ml", "E.2000ml"], "answer": "C", "explanation": "密闭式预冲操作流程要求管路动脉端连接预冲生理盐水1000ml。"}, {"text": "密闭式预冲操作流程中，管路动脉端排气时的血流量是（  ）", "options": ["A.50ml/min", "B.100ml/min", "C.200ml/min", "D.300ml/min", "E.400ml/min"], "answer": "B", "explanation": "密闭式预冲操作流程中，启动血泵引生理盐水，血流量100ml/min，调节动脉壶液面，预冲管路动脉端。"}, {"text": "密闭式预冲操作流程中，膜内排气的方法是（  ）", "options": ["A.用力拍打透析器", "B.轻轻转动透析器", "C.提高泵速至300ml/min", "D.抬高静脉壶", "E.反向连接管路"], "answer": "B", "explanation": "密闭式预冲操作流程中，膜内排气要求轻轻转动透析器，排尽膜内气体；切忌用力拍打透析器。"}, {"text": "密闭式预冲操作流程中，连接旁路进行膜外排气时透析器的方向是（  ）", "options": ["A.静脉端向上", "B.动脉端向上", "C.水平放置", "D.倾斜30度", "E.不需调整方向"], "answer": "B", "explanation": "密闭式预冲操作流程中，连接旁路、膜外排气时要求透析器倒转，动脉端向上，进行膜外排气。"}, {"text": "密闭式预冲操作流程中，膜内冲洗的血流量应调至（  ）", "options": ["A.100ml/min", "B.150ml/min", "C.200ml/min以上", "D.300ml/min以上", "E.不超过80ml/min"], "answer": "C", "explanation": "密闭式预冲操作流程中，膜内冲洗要求血流量调至200ml/min以上，约300ml。"}, {"text": "密闭式预冲操作流程中，闭路循环时设置的超滤量和超滤速度是（  ）", "options": ["A.超滤1500ml/h，超滤200ml", "B.超滤200ml/h，超滤1500ml", "C.超滤500ml/h，超滤100ml", "D.超滤1000ml/h，超滤300ml", "E.超滤800ml/h，超滤800ml"], "answer": "A", "explanation": "密闭式预冲操作流程中，闭路循环要求关闭废液袋主干夹子，输液器连接至动脉补液端，连接管路动静脉端，打开生理盐水补液通路，设置超滤1500ml/h，超滤200ml。"}, {"text": "密闭式预冲操作流程中，闭路循环前需要关闭的是（  ）", "options": ["A.动脉补液端", "B.废液袋主干夹子", "C.透析液旁路", "D.血泵", "E.静脉壶侧管"], "answer": "B", "explanation": "闭路循环时先关闭废液袋主干夹子，再将输液器连接至动脉补液端，连接管路动静脉端，打开生理盐水补液通路，设置超滤1500ml/h、超滤200ml。"}, {"text": "关于预冲完毕到连接患者的间隔，正确的做法是（  ）", "options": ["A.可长时间放置待用", "B.尽快连接患者透析", "C.需放置10分钟后再连接", "D.需重新预冲后再连接", "E.需冷藏保存后连接"], "answer": "B", "explanation": "密闭式预冲操作流程要求：预冲完毕，尽快连接患者透析。"}, {"text": "密闭式预冲操作流程中，物品准备的预冲液为（  ）", "options": ["A.NS500ml", "B.NS800ml", "C.NS1000ml", "D.NS1500ml", "E.NS2000ml"], "answer": "C", "explanation": "密闭式预冲操作流程的物品准备包括预冲液NS1000ml、透析器、管路。"}, {"text": "关于辅助预冲模式的特点，下列说法正确的是（  ）", "options": ["A.泵速固定不变", "B.泵速由慢至快自动调节", "C.泵速由快至慢自动调节", "D.预冲液量不可控", "E.无需超滤功能"], "answer": "B", "explanation": "辅助预冲模式的优点包括：定量（预冲液根据需要定量控制）、定时（预冲每阶段的时间控制）、泵速自动调节由慢至快，以及省时、省力、省液，并保证透析器的充分预冲。"}, {"text": "关于辅助预冲模式中“定量”的含义，正确的是（  ）", "options": ["A.固定预冲时间", "B.预冲液按需定量控制", "C.固定血泵速度", "D.固定超滤量", "E.固定透析液流量"], "answer": "B", "explanation": "辅助预冲模式的特点是：定量指预冲液根据需要定量控制；定时指预冲每阶段的时间控制；泵速自动调节，由慢至快。"}, {"text": "关于辅助预冲模式中“定时”的含义，正确的是（  ）", "options": ["A.预冲液量固定", "B.预冲每阶段的时间控制", "C.泵速固定不变", "D.透析时间固定", "E.超滤时间随机"], "answer": "B", "explanation": "辅助预冲模式中，定时指预冲每阶段的时间控制；定量指预冲液根据需要定量控制。"}, {"text": "关于辅助预冲模式的“省力”特点，其含义是（  ）", "options": ["A.预冲液用量减少", "B.护士不用全程看着预冲", "C.预冲时间缩短一半", "D.不需要连接管路", "E.不需要超滤"], "answer": "B", "explanation": "辅助预冲模式的优点中，省力指护士不用整个过程看着做预冲；省时指操作是流水作业；省液指护士不用担心液体会走空。"}, {"text": "辅助预冲模式保证透析器充分预冲，依靠的是（  ）", "options": ["A.机器默认自动超滤功能", "B.手动控制超滤", "C.单纯重力引流", "D.定时器报警", "E.压力报警功能"], "answer": "A", "explanation": "辅助预冲模式严格按照血液净化标准化操作规程制定预冲程序，能保证透析器的充分预冲，机器默认自动超滤功能。"}, {"text": "关于透析器预冲与透析效率的关系，正确的表述是（  ）", "options": ["A.预冲与透析效率无关", "B.规范预冲可提高透析效率", "C.预冲只影响凝血", "D.预冲只影响透析器寿命", "E.预冲只影响患者体温"], "answer": "B", "explanation": "透析器预冲的目的之一是提高透析效率。"}, {"text": "透析器预充过程中，关于排除透析血室空气的方法，正确的是（  ）", "options": ["A.用力拍打透析器", "B.轻柔搓动和倾斜透析器", "C.重力敲打透析器两端", "D.用止血钳敲击", "E.大幅振摇透析器"], "answer": "B", "explanation": "在预充透析器过程中，轻柔搓动和倾斜透析器，有助于排除透析血室的空气；一定切忌重力敲打，务必温柔以待，避免使用外力拍打透析器。"}, {"text": "透析器预充过程中，关于拍打透析器，正确的做法是（  ）", "options": ["A.为加快排气可重力敲打", "B.避免使用外力拍打透析器", "C.用钳子轻敲透析器两端", "D.拍打有助于湿润透析膜", "E.拍打可减少预冲液用量"], "answer": "B", "explanation": "预冲注意事项明确：避免使用外力拍打透析器，轻柔搓动和倾斜透析器有助于排除血室空气，一定切忌重力敲打。"}, {"text": "预充过程中，对透析器透析液进出口的处理是（  ）", "options": ["A.保持敞开以便排气", "B.用保护帽或无菌帽封闭", "C.连接旁路后再封闭", "D.用止血带扎紧", "E.无需特殊处理"], "answer": "B", "explanation": "预冲注意事项要求用保护帽或无菌帽把透析器的透析液进出口封闭。"}, {"text": "预冲过程中，对管路的动脉壶和静脉壶应（  ）", "options": ["A.保持低液面", "B.关注并及时调整液平面", "C.排空液体", "D.连接压力传感器后不再调整", "E.完全充满不留空气"], "answer": "B", "explanation": "预冲注意事项要求关注管路的动脉壶和静脉壶，及时调整液平面。"}, {"text": "若预冲过程中透析器进入空气，正确的处理是（  ）", "options": ["A.继续使用并加大泵速", "B.需重新预冲", "C.用注射器抽吸后继续", "D.仅记录不需处理", "E.更换透析液即可"], "answer": "B", "explanation": "预冲注意事项要求：根据生产厂家的指引应用正确的预冲液量，谨记准备充足的预冲液，若出现预冲过程中透析器进入空气，需重新预冲。"}, {"text": "为减少透析器预冲相关不良反应，正确的做法是（  ）", "options": ["A.按SOP预冲并增加预冲量、时间、超滤量", "B.减少预冲量", "C.缩短预冲时间", "D.降低预冲超滤量", "E.免预冲直接上机"], "answer": "A", "explanation": "透析器预冲相关的不良反应包括胸痛和背痛、皮肤瘙痒、透析器反应、发热；严格按照SOP操作规程预冲，增加预冲量、预冲时间、预冲超滤量，可减少以上不良反应。"}, {"text": "膜外预冲时，连接透析器旁路（透析液侧）的前提是（  ）", "options": ["A.血液侧已排尽空气", "B.透析液已加温", "C.血泵已停止30分钟", "D.静脉壶液面已排空", "E.超滤已完成"], "answer": "A", "explanation": "膜外预冲注意事项要求：透析器血液侧没排尽空气前，不要接旁路（透析液侧）。"}, {"text": "膜外预冲时，连接透析器旁路并调整后的透析器方向是（  ）", "options": ["A.静脉端向上", "B.动脉端向上，进液口向下出液口向上", "C.水平放置", "D.动脉端向下", "E.倾斜90度"], "answer": "B", "explanation": "确认透析器血室已经预充完成后停止血泵，连接透析器旁路，将透析器动脉端向上，让透析器液室进液口向下、出液口向上。"}, {"text": "膜外预冲开始前需要先确认（  ）", "options": ["A.透析液温度达标", "B.血室已经预充完成", "C.患者已连接", "D.超滤量已设置", "E.动脉壶液面已排空"], "answer": "B", "explanation": "膜外预冲注意事项要求：确认透析器血室已经预充完成，停止血泵，连接透析器旁路，将透析器动脉端向上，液室进液口向下、出液口向上。"}, {"text": "启动透析液旁路预充键后，为使液室空气从旁路排出，透析器动脉端旁路应倾斜（  ）", "options": ["A.15度", "B.30度", "C.45度", "D.90度", "E.180度"], "answer": "C", "explanation": "膜外预冲时，启动透析液旁路预充键，将透析器动脉端旁路倾斜45度，让液室的空气从旁路排出，目视液室内空气排尽。"}, {"text": "膜外预冲结束的判断标准是（  ）", "options": ["A.血泵停止转动", "B.目视液室内空气排尽", "C.透析液压力为零", "D.动脉壶液面升高", "E.超滤量达到100ml"], "answer": "B", "explanation": "膜外预冲要求将透析器动脉端旁路倾斜45度，让液室的空气从旁路排出，目视液室内空气排尽。"}, {"text": "关于超滤预冲，时间和超滤量的设置应避免（  ）", "options": ["A.导致透析器凝血", "B.过高过快超滤导致破膜", "C.导致血泵停转", "D.导致透析液温度下降", "E.导致动脉壶液面下降"], "answer": "B", "explanation": "超滤预冲注意事项要求：时间和超滤量的设置应避免过高过快的超滤导致的破膜。"}, {"text": "关于超滤预冲的作用，下列说法正确的是（  ）", "options": ["A.可缩短透析时间", "B.不能清除膜内空气", "C.是清除膜内空气的好方法", "D.会降低透析效率", "E.只能用于高通量透析"], "answer": "C", "explanation": "超滤预冲要求：间断的夹闭放开透析管路可以增加透析器中的压力，可促进空气的清除，应用超滤也是清除透析器膜内空气的好方法。"}, {"text": "超滤预冲时，间断夹闭放开透析管路的目的是（  ）", "options": ["A.降低跨膜压", "B.增加透析器压力以促进排气", "C.减少预冲液用量", "D.排净膜外气体", "E.防止管路凝血"], "answer": "B", "explanation": "超滤预冲时，间断的夹闭放开透析管路可以增加透析器中的压力，可促进空气的清除。"}, {"text": "一定时间内超滤预冲的作用是促使（  ）", "options": ["A.每个膜孔打开并排尽气泡", "B.透析膜孔径缩小", "C.透析器容积缩小", "D.膜外气体排尽", "E.跨膜压下降"], "answer": "A", "explanation": "超滤预冲要求：在一定时间内的超滤预冲可使纤维丝的每个膜孔都打开，确保气泡的完全排出，充分发挥透析器的效能。"}, {"text": "关于预冲时提高冲洗速度的效果，正确的说法是（  ）", "options": ["A.可清除气体", "B.可提高管路压力以冲脱微粒", "C.可减少不溶性微粒生成", "D.与微粒清除无关", "E.可减少预冲液用量"], "answer": "B", "explanation": "用300ml/min的速度冲洗，微粒的清除效果明显优于100ml/min；冲洗速度提高后，对体外循环的管路压力也会随之提高，利用外力冲击冲脱管路内的微粒。"}, {"text": "关于冲洗速度与气体清除的关系，正确的说法是（  ）", "options": ["A.速度越快清除越彻底", "B.低速冲洗气泡清除更优", "C.速度与气体清除无关", "D.300ml/min气泡清除最好", "E.500ml/min可完全清除气泡"], "answer": "B", "explanation": "以100ml/min的速度冲洗，气泡的清除效果明显优于300ml/min的速度冲洗，提示微小气泡在较低速度的冲洗中可以达到较好的清除效果。"}, {"text": "能同时清除体外循环管路和血液透析器中气体和微粒的冲洗方法是（  ）", "options": ["A.100ml/min持续冲洗", "B.300ml/min持续冲洗", "C.100～300ml/min序贯式冲洗", "D.200ml/min持续冲洗", "E.单纯超滤冲洗"], "answer": "C", "explanation": "100ml/min冲洗速度对清除气体效果好，300ml/min的冲洗速度对微粒清除效果好，100～300ml/min序贯式冲洗方法则能够同时清除气体和微粒。"}, {"text": "血液透析器和管路冲洗时，检测到残余微小气泡最少的方法是（  ）", "options": ["A.100ml/min持续冲洗", "B.300ml/min持续冲洗", "C.100～300ml/min序贯式冲洗", "D.50ml/min持续冲洗", "E.单纯超滤预冲"], "answer": "C", "explanation": "用100ml/min的速度冲洗气泡清除效果优于300ml/min，100～300ml/min的序贯式冲洗方法检测到的残余微小气泡最少，是适用于血液透析器和管路冲洗的有效方法。"}, {"text": "关于透析器中空纤维的构造，正确的描述是（  ）", "options": ["A.由数百根直管构成", "B.数万根弯曲中空纤维以增大面积", "C.由数万根实心纤维构成", "D.由单层平板膜构成", "E.由螺旋盘管构成"], "answer": "B", "explanation": "血液透析器由数万根中空纤维构成，为了增加透析面积，中空纤维做成弯曲的形状；生理盐水快速通过时力度过大、速度过快，不能确保冲到每根中空纤维内。"}, {"text": "快速冲洗时，微小气泡易残留于个别中空纤维内的部位是（  ）", "options": ["A.纤维开口处", "B.弯曲弧度大的部位", "C.纤维直线段", "D.外壳与纤维束之间", "E.出液口附近"], "answer": "B", "explanation": "生理盐水快速通过时力度过大、速度过快，不能确保生理盐水冲到每根中空纤维内，尤其在弯曲弧度大的部位易存留微小气泡，加上静电的作用，导致贴壁的微小气泡残留在个别中空纤维内。"}, {"text": "体外血液循环开始后，残留在中空纤维角落的微气泡会（  ）", "options": ["A.自行排出", "B.缓慢进入人体造成危害", "C.被透析膜滤除", "D.溶解于血液中无害", "E.滞留在透析器内"], "answer": "B", "explanation": "在体外血液循环开始后，残留在角落的微气泡会缓慢进入人体，给患者造成危害，因此透析器低速排气非常必要且重要。"}, {"text": "2005版《中国药典》二部附录规定，进入人体血液不溶性微粒中微粒直径大于10μm的数量应（  ）", "options": ["A.≤3个", "B.≤10个", "C.≤25个", "D.≤50个", "E.≤100个"], "answer": "C", "explanation": "2005版《中国药典》二部附录规定：进入人体血液不溶性微粒数量，微粒直径&gt;10μm数量≤25个；微粒直径&gt;25μm数量≤3个。"}, {"text": "2005版《中国药典》二部附录规定，进入人体血液不溶性微粒中微粒直径大于25μm的数量应（  ）", "options": ["A.≤1个", "B.≤3个", "C.≤25个", "D.≤30个", "E.≤50个"], "answer": "B", "explanation": "2005版《中国药典》二部附录规定：微粒直径&gt;10μm数量≤25个，微粒直径&gt;25μm数量≤3个。"}]}, {"type": "multiple", "questions": [{"text": "透析器预冲的含义包括（  ）", "options": ["Ａ.预充指充分排气、湿化", "Ｂ.冲洗指清除微小颗粒", "Ｃ.预充指清除微小颗粒", "Ｄ.冲洗指对透析液加热", "Ｅ.预冲指消毒透析膜"], "answer": "AB", "explanation": "透析器预冲的含义包括两方面：预充指充分排气、湿化，冲洗指清除微小颗粒。C项将两个含义颠倒，D、E项内容不属于预冲的含义。"}, {"text": "关于透析膜的分类归属，下列表述正确的有（  ）", "options": ["Ａ.醋酸膜、铜仿膜属于天然纤维素膜", "Ｂ.血仿膜、三醋酸膜属于改良纤维素膜", "Ｃ.PS、PA（聚砜膜）属于不对称合成膜", "Ｄ.AN69、PMMA属于对称合成膜", "Ｅ.血仿膜、三醋酸膜属于天然纤维素膜"], "answer": "ABCD", "explanation": "透析膜分为天然纤维素膜（醋酸膜、铜仿膜）、改良纤维素膜（血仿膜、三醋酸膜）和合成膜；合成膜中不对称膜包括PS、PA（聚砜膜），对称膜包括AN69、PMMA。E项归类错误。"}, {"text": "按照透析膜的特性，下列表述正确的有（  ）", "options": ["Ａ.合成膜生物相容性好", "Ｂ.改良纤维素膜生物相容性改善", "Ｃ.天然纤维素膜生物相容性差", "Ｄ.天然纤维素膜吸附能力高", "Ｅ.合成膜对中大分子清除很少"], "answer": "ABC", "explanation": "生物相容性由差到好依次为天然纤维素膜、改良纤维素膜、合成膜；吸附能力方面天然纤维素膜很小、改良纤维素膜有、合成膜高，故D、E错误。"}, {"text": "按照不同合成膜对β2微球蛋白的清除数据（mg/m²·24h），下列表述正确的有（  ）", "options": ["Ａ.PS总清除率为154.7±12.3", "Ｂ.PS跨膜清除率为128.0±18.1", "Ｃ.AN69吸附清除率为83.1±29.0", "Ｄ.PMMA吸附清除率为130.8", "Ｅ.PMMA跨膜清除率为128.0±18.1"], "answer": "ABCD", "explanation": "PS总清除率154.7±12.3、吸附清除率26.7±4.3、跨膜清除率128.0±18.1；AN69总清除率137.8±28.4、吸附清除率83.1±29.0、跨膜清除率54.7±8.1；PMMA（湿膜型）总清除率138.0、吸附清除率130.8。E项数值与本材料所载数据不符。"}, {"text": "按照不同合成膜对β2微球蛋白的清除数据，关于吸附清除率的表述正确的有（  ）", "options": ["Ａ.PS为26.7±4.3", "Ｂ.AN69为83.1±29.0", "Ｃ.PMMA（湿膜型）为130.8", "Ｄ.三种膜中PS吸附清除率最高", "Ｅ.AN69低于PS"], "answer": "ABC", "explanation": "PS的吸附清除率为26.7±4.3（mg/m²·24h），AN69为83.1±29.0，PMMA（湿膜型）为130.8。三种膜中PMMA吸附清除率最高、PS最低，故D、E错误。"}, {"text": "关于透析治疗中细菌片段和内毒素进入血液侧的风险，下列表述正确的有（  ）", "options": ["Ａ.低通量治疗有该风险", "Ｂ.高通量治疗有该风险", "Ｃ.聚砜膜褶皱海绵结构可阻滞透析液侧细菌", "Ｄ.褶皱海绵结构对内毒素滞留吸收更好", "Ｅ.该结构对预冲没有更高要求"], "answer": "ABCD", "explanation": "低通和高通治疗都有细菌片段和内毒素进入血液侧的风险；部分聚砜膜透析器设计了褶皱海绵结构，对内毒素的滞留、吸收效果更好，能更有效阻滞来自透析液侧的细菌，但对透析器的规范预冲也有更高的要求，故E错误。"}, {"text": "透析器预冲的目的包括（  ）", "options": ["Ａ.降低透析器凝血概率", "Ｂ.减少回血后的残余血量", "Ｃ.降低首次使用综合征概率", "Ｄ.提高透析效率", "Ｅ.增加透析器膜面积"], "answer": "ABCD", "explanation": "透析器预冲的目的包括：降低透析器凝血概率、减少回血后透析器的残余血量；降低首次使用综合征发生概率；提高透析效率。增加膜面积不属于预冲的目的。"}, {"text": "关于透析器预冲的意义，下列表述正确的有（  ）", "options": ["Ａ.透析器是透析装置的核心组成部分", "Ｂ.其性能发挥对透析效果影响重要", "Ｃ.预冲是透析准备的重要步骤", "Ｄ.预冲影响到透析质量", "Ｅ.预冲仅影响透析费用"], "answer": "ABCD", "explanation": "透析器预冲的意义包括：透析器是透析装置中的核心组成部分；其性能或者性能的发挥对透析效果有重要影响；预冲是透析准备的重要步骤，影响透析器性能充分发挥；充分预冲对保持患者状态平稳起重要作用；预冲影响透析质量。E项不属于其意义。"}, {"text": "关于组合式血液灌流灌流器预冲与连接的注意事项，下列表述正确的有（  ）", "options": ["Ａ.严格无菌操作，严禁液体滴洒和空气进入", "Ｂ.灌流器必须独立预冲后再与透析器串联", "Ｃ.严格按照预冲剂量和顺序进行", "Ｄ.推荐使用有多功能连接装置和2个废液收集袋的管路", "Ｅ.灌流器与透析器可先连接后一次完成预冲"], "answer": "ABCD", "explanation": "灌流操作注意事项包括：组合式血液灌流采用普通连接管操作复杂、断开连接环节多，要严格无菌操作，严禁出现液体滴洒和空气进入现象；灌流器必须独立预冲后，再将灌流器与透析器连接进行串联预冲，严格按照预冲剂量和顺序进行；推荐使用有多功能连接装置和2个废液收集袋的管路，实现灌流器、透析器分别密闭式独立预冲，避免预冲和撤出灌流器过程中的断开环节。E项与独立预冲要求不符。"}, {"text": "关于灌流器回血及回血后继续透析的操作，下列表述正确的有（  ）", "options": ["Ａ.预冲结束后保持串联状态", "Ｂ.血液流量调至50-100 mL/min", "Ｃ.用200 mL生理盐水对灌流器回血", "Ｄ.回血后关闭红色、蓝色夹子继续透析", "Ｅ.用1000 mL生理盐水对灌流器回血"], "answer": "ABCD", "explanation": "血液灌流治疗结束，保持灌流治疗后串联的状态，调节血液流量至50-100 mL/min，用200 mL生理盐水对灌流器进行回血；回血完毕后，打开白色④号、白色⑤号夹子，关闭红色、蓝色夹子，继续透析的治疗。回血用量为200 mL生理盐水，故E错误。"}, {"text": "按照标准操作规程，关于预冲的要求下列表述正确的有（  ）", "options": ["Ａ.血泵80～100ml/min低速排气", "Ｂ.先用盐水排净血室（膜内）气体", "Ｃ.透析器静脉端朝上", "Ｄ.流向为动脉端→透析器→静脉端", "Ｅ.可以逆向预冲"], "answer": "ABCD", "explanation": "标准操作规程要求：血泵80～100ml/min低速排气，用生理盐水先排净透析管路和透析器血室（膜内）气体，透析器静脉端朝上；生理盐水流向为动脉端→透析器→静脉端，不得逆向预冲。"}, {"text": "按照标准操作规程，预冲中快速冲洗阶段的要求包括（  ）", "options": ["Ａ.泵速调至200～300ml/min", "Ｂ.连接透析液接头与旁路", "Ｃ.再排净透析液室（膜外）气体", "Ｄ.生理盐水应逆向流动", "Ｅ.透析器应静脉端朝下"], "answer": "ABC", "explanation": "标准操作规程要求：将泵速调至200～300ml/min快速冲洗，连接透析液接头与透析器旁路，再排净透析器透析液室（膜外）气体；生理盐水不得逆向预冲。"}, {"text": "按照标准操作规程，关于预冲量及在线预冲的表述正确的有（  ）", "options": ["Ａ.预冲量按透析器说明书要求执行", "Ｂ.透析液在线预冲量≥4000ml", "Ｃ.透析监视装置自动采用逆超滤", "Ｄ.膜外、膜内、动静脉端分别预冲", "Ｅ.闭式循环应在连接患者后进行"], "answer": "ABCD", "explanation": "标准操作规程要求：预冲量应严格按照透析器说明书要求执行；透析液在线预冲量≥4000ml，透析监视装置（血液透析机）自动采用逆超滤，膜外、膜内、动脉端、静脉端分别预冲；若需要进行闭式循环或肝素生理盐水预冲，应在生理盐水预冲量达到后再进行，故E错误。"}, {"text": "按照血液透析专科护理操作指南，关于预冲的下列做法正确的有（  ）", "options": ["Ａ.使用带有液体收集袋的管路", "Ｂ.推荐1000ml袋装盐水以减少管路暴露", "Ｃ.100ml/min排气，排净膜内气体后装旁路", "Ｄ.翻转180度静脉向下，快速冲洗", "Ｅ.排气阶段血泵设为300ml/min"], "answer": "ABCD", "explanation": "血液透析专科护理操作指南要求：使用带有液体收集袋的管路；推荐使用1000ml的袋装生理盐水，避免用瓶装生理盐水减少管路暴露机会；启动血泵以100ml/min排气，排净透析器膜内气体后安装透析液旁路；将透析器翻转180度、静脉向下，以200～300ml/min冲洗；如需闭式循环，在排气、冲洗完毕后进行；总使用液体不少于800ml。排气阶段血泵应为100ml/min，故E错误。"}, {"text": "密闭式预冲操作流程的准备阶段包括（  ）", "options": ["Ａ.护士准备：衣帽整洁、洗手、戴口罩", "Ｂ.环境准备：安静、整洁、无人员流动", "Ｃ.物品准备：NS1000ml、透析器、管路", "Ｄ.查对制度与医嘱，选择正确耗材", "Ｅ.透析器和管路无需检查有效期"], "answer": "ABCD", "explanation": "密闭式预冲操作流程的准备阶段包括护士准备（衣帽整洁、洗手、戴口罩）、环境准备（安静、整洁、无人员流动）、物品准备（预冲液NS1000ml、透析器、管路），并严格查对制度、根据医嘱选择正确的透析器和管路、检查耗材质量和有效期，故E错误。"}, {"text": "密闭式预冲操作流程中，预冲环节的操作包括（  ）", "options": ["Ａ.血流量100ml/min预冲动脉端", "Ｂ.轻轻转动透析器排尽膜内气体", "Ｃ.透析器倒转、动脉端向上行膜外排气", "Ｄ.膜内冲洗200ml/min以上，约300ml", "Ｅ.闭路循环时先打开废液袋夹子"], "answer": "ABCD", "explanation": "密闭式预冲操作流程的预冲环节包括：管路动脉端排气（100ml/min、调节动脉壶液面）、膜内排气（轻轻转动透析器）、连接旁路行膜外排气（透析器倒转、动脉端向上）、膜内冲洗（200ml/min以上，约300ml）、闭路循环（先关闭废液袋主干夹子，再设置超滤1500ml/h、超滤200ml），故E错误。"}, {"text": "预冲注意事项中，关于“低速排气，快速冲洗”，下列做法正确的有（  ）", "options": ["Ａ.避免使用外力拍打透析器", "Ｂ.轻柔搓动和倾斜透析器排气", "Ｃ.用保护帽或无菌帽封闭透析液进出口", "Ｄ.关注动脉壶静脉壶并调整液平面", "Ｅ.预冲进入空气可继续使用"], "answer": "ABCD", "explanation": "预冲注意事项要求：避免使用外力拍打透析器，轻柔搓动和倾斜透析器有助于排除透析血室空气，切忌重力敲打；用保护帽或无菌帽封闭透析器透析液进出口；关注管路动脉壶和静脉壶并及时调整液平面；根据生产厂家指引应用正确的预冲液量并准备充足预冲液，若预冲过程中透析器进入空气需重新预冲，故E错误。"}, {"text": "关于膜外预冲的注意事项，下列表述正确的有（  ）", "options": ["Ａ.血室没排尽空气前不接旁路", "Ｂ.确认血室预充完成后停泵接旁路", "Ｃ.动脉端向上，进液口向下出液口向上", "Ｄ.启动旁路预充键，旁路倾斜45度", "Ｅ.接旁路前先用肝素盐水浸泡透析器"], "answer": "ABCD", "explanation": "膜外预冲注意事项要求：透析器血液侧没排尽空气前不要接旁路；确认血室已预充完成，停止血泵，连接透析器旁路，透析器动脉端向上、液室进液口向下、出液口向上；启动透析液旁路预充键，将透析器动脉端旁路倾斜45度，让液室空气从旁路排出，目视液室内空气排尽。故E错误。"}, {"text": "关于超滤预冲的注意事项，下列表述正确的有（  ）", "options": ["Ａ.避免过高过快超滤导致破膜", "Ｂ.间断夹闭放开管路可增加压力", "Ｃ.间断夹闭放开管路可促进排气", "Ｄ.超滤是清除膜内空气的好方法", "Ｅ.超滤预冲时间越长排气越差"], "answer": "ABCD", "explanation": "超滤预冲注意事项要求：时间和超滤量的设置应避免过高过快的超滤导致的破膜；间断的夹闭放开透析管路可以增加透析器中的压力，可促进空气的清除；应用超滤也是清除透析器膜内空气的好方法；在一定时间内的超滤预冲可使纤维丝的每个膜孔都打开，确保气泡完全排出。故E错误。"}, {"text": "透析器预冲相关的不良反应包括（  ）", "options": ["Ａ.胸痛和背痛", "Ｂ.皮肤瘙痒", "Ｃ.透析器反应", "Ｄ.发热", "Ｅ.血压升高"], "answer": "ABCD", "explanation": "透析器预冲相关的不良反应包括胸痛和背痛、皮肤瘙痒、透析器反应、发热；严格按照SOP操作规程预冲，增加预冲量、预冲时间、预冲超滤量，可减少以上不良反应。E项不属于所列不良反应。"}, {"text": "灌流器肝素化的方式包括（  ）", "options": ["Ａ.动态肝素化", "Ｂ.静态肝素化", "Ｃ.超声肝素化", "Ｄ.干式肝素化", "Ｅ.蒸汽肝素化"], "answer": "AB", "explanation": "灌流器肝素化包括动态肝素化和静态肝素化两种方式。C、D、E项均不属于所列方式。"}, {"text": "关于灌流器静态肝素化预冲的优势，下列表述正确的有（  ）", "options": ["Ａ.肝素充分浸泡并充分吸附", "Ｂ.预防管路与灌流器凝血", "Ｃ.联合透析可省时、提高安全性", "Ｄ.简化回血与预冲排气、降低工作强度", "Ｅ.会增加交叉感染的风险"], "answer": "ABCD", "explanation": "静态肝素化预冲采用肝素充分浸泡灌流器，确保肝素充分吸附，预防管路与灌流器发生凝血；采用灌流器静态肝素化联合血液透析治疗可节省时间、提高安全性，并在治疗过程中减少凝血现象出现；可简化护士回血操作与预冲排气操作，降低护士工作强度、提高工作效率，降低交叉感染。故E错误。"}, {"text": "按照灌流器静态肝素化的操作要求，下列做法正确的有（  ）", "options": ["Ａ.注射器抽取肝素注射液100mg", "Ｂ.打开上端保护螺帽，肝素去针后注入保存液", "Ｃ.拧紧螺帽并在标签注明药名、剂量、时间", "Ｄ.上下180°反转10次，静置30分钟", "Ｅ.上下180°缓慢反转30次"], "answer": "ABCD", "explanation": "灌流器静态肝素化操作要求：使用一次性注射器抽取肝素注射液100mg；轻拍灌流器后打开上端保护螺帽并置于无菌治疗巾内；将肝素去除针头后直接注入灌流器内保存液中，取出保护螺帽覆盖拧紧；在标签上注明加入抗凝剂的药名、剂量、时间；将灌流器上、下180°，缓慢反转10次；如注射遇阻可以回抽再试；放置于无菌治疗巾内静置30分钟待用，全程注意无菌操作、及时盖帽。E项反转次数应为10次。"}, {"text": "以组合型人工肾为例，灌流器预冲操作规程的要求包括（  ）", "options": ["Ａ.静态肝素化后用盐水排净动脉端气体", "Ｂ.连接管路与灌流器，再接静脉端与透析器", "Ｃ.用1000mL盐水冲洗灌流器", "Ｄ.用1000mL盐水冲洗透析器", "Ｅ.用2000mL盐水冲洗透析器和灌流器"], "answer": "ABCD", "explanation": "灌流器预冲操作规程要求：采用灌流器静态肝素化方法后，用生理盐水排净透析管路动脉端气体后，连接管路与灌流器，然后连接灌流器与管路静脉端；连接透析器与管路；用生理盐水1000mL冲洗灌流器、1000mL冲洗透析器、1000mL冲洗透析器和灌流器。故E错误。"}, {"text": "灌流器预冲与排气时，对预冲废液的处理要求包括（  ）", "options": ["Ａ.盐水直接流入废液收集袋中", "Ｂ.废液收集袋放于机器液体架上", "Ｃ.不建议流入开放式废液桶", "Ｄ.废液可直接排入洗手池", "Ｅ.废液应先回输给患者"], "answer": "ABC", "explanation": "灌流器预冲操作规程要求：预冲（排气与冲洗）生理盐水直接流入废液收集袋中，并且废液收集袋放于机器液体架上；不建议预冲生理盐水直接流入开放式废液桶中。D、E项做法均不符合要求。"}, {"text": "采用健帆一体化管路单独预冲灌流器时，下列做法正确的有（  ）", "options": ["Ａ.启动血泵100mL/min", "Ｂ.动脉端充满后开红①黄②黄③号夹子", "Ｃ.关闭白色、蓝色夹子", "Ｄ.血泵调至200mL/min冲洗灌流器", "Ｅ.冲洗时将血泵关闭"], "answer": "ABCD", "explanation": "采用健帆一体化管路单独预冲灌流器时：启动血泵100mL/min，待动脉端充满生理盐水后打开红色①号、黄色②号、黄色③号夹子，关闭白色、蓝色夹子，血泵调至200mL/min，用1000mL生理盐水冲洗灌流器（同时进行排气），将空气和肝素冲洗干净。故E错误。"}, {"text": "灌流器单独预充一分钟排气法中，关于灌流器动脉端排气，下列表述正确的有（  ）", "options": ["Ａ.放置角度为水平放置", "Ｂ.敲击点为0-3点钟", "Ｃ.敲击频率为每秒2～3下", "Ｄ.敲击力度为适中（10N）", "Ｅ.敲击力度为轻敲（2N）"], "answer": "ABCD", "explanation": "灌流器动脉端排气要求：水平放置，敲击点0-3点钟，敲击频率每秒2～3下，敲击力度适中（10N）。E项轻敲（2N）是静脉端排气的力度。"}, {"text": "灌流器单独预充一分钟排气法中，关于灌流器静脉端排气，下列表述正确的有（  ）", "options": ["Ａ.放置角度为竖直放置", "Ｂ.敲击方式为水平敲击", "Ｃ.敲击频率为每秒2～3下", "Ｄ.敲击力度为轻敲（2N）", "Ｅ.放置角度为倾斜30度左右"], "answer": "ABCD", "explanation": "灌流器静脉端排气要求：竖直放置，水平敲击，敲击频率每秒2～3下，敲击力度轻敲（2N）。E项倾斜30度左右是端盖中央气泡排除的放置角度。"}, {"text": "灌流器单独预充一分钟排气法中，关于端盖中央气泡排除，下列表述正确的有（  ）", "options": ["Ａ.放置角度为倾斜30度左右", "Ｂ.敲击点为11～1点钟", "Ｃ.敲击频率为每秒2～3下", "Ｄ.敲击力度为适中（10N）", "Ｅ.放置角度为水平放置"], "answer": "ABCD", "explanation": "端盖中央气泡排除要求：倾斜30度左右放置，敲击点11～1点钟，敲击频率每秒2～3下，敲击力度适中（10N）。E项水平放置是动脉端排气的放置角度。"}, {"text": "采用健帆一体化管路单独预冲透析器时，下列做法正确的有（  ）", "options": ["Ａ.冲洗结束关泵并撤掉废液袋", "Ｂ.打开白色④号、白色⑤号夹子", "Ｃ.关闭红色、黄色、蓝色夹子", "Ｄ.血泵100mL/min，1000mL盐水冲洗", "Ｅ.使用肝素盐水2000mL冲洗"], "answer": "ABCD", "explanation": "单独预冲透析器时：灌流器冲洗结束，关掉血泵，撤掉黄色夹子连接管的废液袋；打开白色④号、白色⑤号夹子，关闭红色、黄色、蓝色夹子，打开血泵至100mL/min，用1000mL生理盐水冲洗透析器，排尽透析器膜内空气后连接透析器旁路，排尽膜外气体。故E错误。"}]}, {"type": "short", "questions": [{"text": "简述透析器预冲的含义及预冲的目的。", "options": [], "answer": "【预冲的含义】预冲包括两部分：预充指充分排气、湿化；冲洗指清除微小颗粒。【预冲的目的】①降低透析器凝血概率，减少回血后透析器的残余血量；②降低首次使用综合征发生概率；③提高透析效率。", "explanation": "【预冲的含义】预冲=预充（充分排气、湿化）+冲洗（清除微小颗粒）。【预冲的目的】共三项：降低透析器凝血概率、减少回血后透析器的残余血量；降低首次使用综合征发生概率；提高透析效率。预冲是透析准备的一个重要步骤，影响透析器性能的充分发挥，充分预冲对保持患者状态平稳起重要作用，直接关系到透析质量。"}, {"text": "简述血液透析器预冲的标准操作规程要点（含泵速、流向、膜内与膜外排气及预冲量要求）。", "options": [], "answer": "【低速排气】血泵80～100ml/min，用生理盐水先排净透析管路和透析器血室（膜内）气体，透析器静脉端朝上。【流向要求】生理盐水流向为动脉端→透析器→静脉端，不得逆向预冲。【快速冲洗】将泵速调至200～300ml/min，连接透析液接头与透析器旁路。【膜外排气】再排净透析器透析液室（膜外）气体。【闭式循环或肝素预冲】若需要进行闭式循环或肝素生理盐水预冲，应在生理盐水预冲量达到后再进行。【在线预冲】透析液在线预冲量≥4000ml，透析监视装置（血液透析机）自动采用逆超滤，膜外、膜内、动脉端、静脉端分别预冲。【预冲量】应严格按照透析器说明书要求执行。", "explanation": "【要点依据】标准操作规程把预冲分为低速排气与快速冲洗两个阶段：低速排气用80～100ml/min排净透析管路和透析器血室（膜内）气体，此时透析器静脉端朝上；生理盐水流向为动脉端→透析器→静脉端，不得逆向预冲；快速冲洗用200～300ml/min并连接透析液接头与透析器旁路，再排净透析器透析液室（膜外）气体。若需闭式循环或肝素生理盐水预冲，应在生理盐水预冲量达到后再进行；透析液在线预冲量≥4000ml，机器自动采用逆超滤，膜外、膜内、动脉端、静脉端分别预冲；预冲量应严格按透析器说明书要求执行。"}, {"text": "简述密闭式预冲操作的完整流程（从准备到预冲完毕）。", "options": [], "answer": "【准备】护士准备：衣帽整洁、洗手、戴口罩；环境准备：安静、整洁、无人员流动；物品准备：预冲液NS1000ml、透析器、管路；严格查对制度，根据医嘱选择正确的透析器和管路，检查耗材质量和有效期。【管路安装】安装透析器，静脉端向上；管路动脉端安装；管路静脉端安装；管路动脉端连接预冲生理盐水1000ml。【预冲】①管路动脉端排气：启动血泵引生理盐水，血流量100ml/min，调节动脉壶液面，预冲管路动脉端；②膜内排气：轻轻转动透析器，排尽膜内气体；③连接旁路，膜外排气：透析器倒转，动脉端向上，膜外排气；④膜内冲洗：血流量调至200ml/min以上，约300ml；⑤闭路循环：关闭废液袋主干夹子，输液器连接至动脉补液端，连接管路动静脉端，打开生理盐水补液通路，设置超滤1500ml/h，超滤200ml。【结束】预冲完毕，尽快连接患者透析。", "explanation": "【流程要点】密闭式预冲操作流程按“准备—管路安装—预冲”顺序进行。准备阶段强调护士准备（衣帽整洁、洗手、戴口罩）、环境准备（安静、整洁、无人员流动）、物品准备（预冲液NS1000ml、透析器、管路）以及查对耗材质量和有效期。管路安装阶段要求透析器静脉端向上，动脉端连接预冲生理盐水1000ml。预冲阶段依次为：动脉端排气（100ml/min、调节动脉壶液面）、膜内排气（轻轻转动透析器）、连接旁路行膜外排气（透析器倒转、动脉端向上）、膜内冲洗（200ml/min以上，约300ml）、闭路循环（先关闭废液袋主干夹子，超滤1500ml/h、超滤200ml）。预冲完毕应尽快连接患者透析。"}, {"text": "简述透析器预冲中的主要注意事项（低速排气与快速冲洗的相关要点）。", "options": [], "answer": "①避免使用外力拍打透析器；在预充透析器过程中，轻柔搓动和倾斜透析器，有助于排除透析血室的空气，一定切忌重力敲打。②用保护帽或无菌帽把透析器的透析液进出口封闭。③关注管路的动脉壶和静脉壶，及时调整液平面。④根据生产厂家的指引应用正确的预冲液量，谨记准备充足的预冲液；若出现预冲过程中透析器进入空气，需重新预冲。", "explanation": "【要点依据】预冲注意事项中“低速排气，快速冲洗”相关要点共四项：一是避免使用外力拍打透析器，轻柔搓动和倾斜透析器有助于排除透析血室空气，切忌重力敲打；二是用保护帽或无菌帽封闭透析器的透析液进出口；三是关注管路动脉壶和静脉壶并及时调整液平面；四是根据生产厂家指引应用正确的预冲液量并准备充足预冲液，若预冲过程中透析器进入空气需重新预冲。"}, {"text": "简述膜外预冲与超滤预冲的注意事项。", "options": [], "answer": "【膜外预冲】①透析器血液侧没排尽空气前，不要接旁路（透析液侧）；②确认透析器血室已经预充完成，停止血泵，连接透析器旁路，将透析器动脉端向上，让透析器液室进液口向下、出液口向上；③启动透析液旁路预充键，将透析器动脉端旁路倾斜45度，让液室的空气从旁路排出，目视液室内空气排尽。【超滤预冲】①时间和超滤量的设置应避免过高过快的超滤导致的破膜；②间断的夹闭放开透析管路可以增加透析器中的压力，可促进空气的清除，应用超滤也是清除透析器膜内空气的好方法；③在一定时间内的超滤预冲可使纤维丝的每个膜孔都打开，确保气泡的完全排出，充分发挥透析器的效能。", "explanation": "【膜外预冲】核心是“血室排尽空气后才可接旁路（透析液侧）”：确认血室预充完成→停止血泵→连接旁路→透析器动脉端向上、液室进液口向下出液口向上→启动透析液旁路预充键→旁路倾斜45度使液室空气排出→目视液室内空气排尽。【超滤预冲】时间与超滤量的设置应避免过高过快导致破膜；间断夹闭放开透析管路可增加透析器内压力、促进空气清除；一定时间内的超滤预冲可使纤维丝的每个膜孔都打开，确保气泡完全排出，充分发挥透析器效能。"}, {"text": "简述透析器预冲相关的不良反应，以及为减少这些不良反应在预冲方面应采取的措施。", "options": [], "answer": "【预冲相关的不良反应】包括：胸痛和背痛；皮肤瘙痒；透析器反应；发热。【预冲方面的措施】严格按照SOP操作规程预冲，增加预冲量、预冲时间、预冲超滤量，可减少以上不良反应。", "explanation": "【不良反应】透析器预冲相关的不良反应包括胸痛和背痛、皮肤瘙痒、透析器反应、发热。【减少措施】严格按照SOP操作规程预冲，增加预冲量、预冲时间、预冲超滤量，可减少上述不良反应。这也提示规范预冲是保障透析安全与质量的重要环节。"}, {"text": "简述以组合型人工肾为例的灌流器操作流程，及灌流器预冲（排气与冲洗）的剂量与顺序要求。", "options": [], "answer": "【操作流程】准备工作→管路的连接→预冲与排气→建立血管通路，静推首剂抗凝剂→建立体外循环（灌流器串联在透析器前面）→治疗开始→2h卸罐→继续透析至结束。【预冲剂量与顺序】采用灌流器静态肝素化方法后，用生理盐水排净透析管路动脉端气体后，连接管路与灌流器，然后连接灌流器与管路静脉端；连接透析器与管路；①用生理盐水1000mL冲洗灌流器；②用生理盐水1000mL冲洗透析器；③用生理盐水1000mL冲洗透析器和灌流器。预冲（排气与冲洗）生理盐水直接流入废液收集袋中，废液收集袋放于机器液体架上，不建议预冲生理盐水直接流入开放式废液桶中。", "explanation": "【流程要点】以组合型人工肾为例的操作流程为：准备工作→管路的连接→预冲与排气→建立血管通路并静推首剂抗凝剂→建立体外循环（灌流器串联在透析器前面）→治疗开始→2h卸罐→继续透析至结束。【预冲要求】灌流器必须独立预冲后，再将灌流器与透析器连接进行串联预冲，严格按照预冲剂量和顺序进行：先用1000mL生理盐水冲洗灌流器，再用1000mL冲洗透析器，最后用1000mL冲洗透析器和灌流器；预冲生理盐水直接流入废液收集袋并置于机器液体架上，不建议直接流入开放式废液桶。推荐使用有多功能连接装置和2个废液收集袋的管路，实现灌流器、透析器分别密闭式独立预冲，避免预冲和撤出灌流器过程中的断开环节。"}, {"text": "简述灌流器单独预充“一分钟排气法”的操作要点。", "options": [], "answer": "【灌流器动脉端排气】①放置角度：水平放置；②敲击点：0-3点钟；③敲击频率：每秒2～3下；④敲击力度：适中（10N）。【灌流器静脉端排气】①放置角度：竖直放置；②敲击方式：水平敲击；③敲击频率：每秒2～3下；④敲击力度：轻敲（2N）。【端盖中央气泡排除】①放置角度：倾斜30度左右；②敲击点：11～1点钟；③敲击频率：每秒2～3下；④敲击力度：适中（10N）。", "explanation": "【要点依据】灌流器单独预充一分钟排气法按三个部位进行：动脉端排气为水平放置、敲击点0-3点钟、每秒2～3下、力度适中（10N）；静脉端排气为竖直放置、水平敲击、每秒2～3下、力度轻敲（2N）；端盖中央气泡排除为倾斜30度左右放置、敲击点11～1点钟、每秒2～3下、力度适中（10N）。采用健帆一体化管路时，灌流器单独预冲以100mL/min启动血泵、待动脉端充满生理盐水后打开相应夹子，再将血泵调至200mL/min用1000mL生理盐水冲洗灌流器并排气。"}]}]}, {"num": 25, "title": "血液净化病人血管通路的使用与护理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析过程中，将血液从患者身体引出、滤掉大部分废物及多余水分后再回输人体所借助的装置是？", "options": ["A.体外半透膜透析装置", "B.中心静脉双腔导管", "C.自体动静脉内瘘", "D.移植物动静脉内瘘", "E.深静脉留置导管"], "answer": "A", "explanation": "血液透析是将血液从患者身体引出经体外半透膜的透析装置，滤掉大部分废物及多余水分，将血液再回输入人体的过程。"}, {"text": "为完成血液透析过程从人体引出及回输血液的人体血管路径称为？", "options": ["A.体外循环管路", "B.血管通路", "C.透析液通路", "D.血液灌流回路", "E.腹膜透析通路"], "answer": "B", "explanation": "血管通路是为完成血液透析过程从人体引出及回输血液的人体血管路径，是透析患者的生命线。"}, {"text": "建立血管通路的方法，原则上要求是？", "options": ["A.手术时间尽可能缩短", "B.尽量使用人造血管", "C.危险性小和严重并发症发生率低", "D.优先选择深静脉导管", "E.优先采用区域穿刺"], "answer": "C", "explanation": "建立血管通路的方法，原则上要求危险性小和严重并发症发生率低。"}, {"text": "临时性血管通路区别于永久性血管通路的主要要求是？", "options": ["A.能长期维持血管通畅率", "B.皮下静脉吻合后有广泛穿刺部位", "C.手术方法尽可能简单", "D.建立所需时间短，可很快开始使用", "E.不加重心脏负荷"], "answer": "D", "explanation": "临时性血管通路要求建立所需时间短，可以很快开始使用；永久性血管通路则要求能长期维持通畅率，皮下静脉吻合后有广泛的穿刺部位。"}, {"text": "下列属于半永久性血管通路的是？", "options": ["A.不带涤纶套隧道双腔深静脉导管", "B.直接动脉穿刺", "C.自体动静脉内瘘", "D.人造血管移植物动静脉内瘘", "E.带涤纶套隧道双腔深静脉导管"], "answer": "E", "explanation": "半永久性血管通路为带cuff的中心静脉导管，即带涤纶套隧道双腔深静脉导管。"}, {"text": "按类型分类，血液透析血管通路中的留置导管分为？", "options": ["A.临时性和半永久性", "B.自体和移植物", "C.单腔和双腔", "D.带隧道和不带隧道", "E.股静脉和颈静脉"], "answer": "A", "explanation": "按类型分类，血管通路分为留置导管和动静脉内瘘，留置导管又分为临时性和半永久性。"}, {"text": "已淘汰的血管通路类型是？", "options": ["A.不带涤纶套双腔深静脉导管", "B.带涤纶套隧道双腔深静脉导管", "C.直接动脉穿刺", "D.自体动静脉内瘘", "E.人造血管移植物内瘘"], "answer": "C", "explanation": "按使用时间分类，临时性血管通路包括不带涤纶套隧道双腔深静脉导管和直接动脉穿刺，其中直接动脉穿刺已淘汰。"}, {"text": "移植物动静脉内瘘按移植物来源分为？", "options": ["A.临时性和半永久性", "B.单腔和双腔", "C.带隧道和不带隧道", "D.自体血管移植和人造血管移植", "E.U形管和直形管"], "answer": "D", "explanation": "移植物动静脉内瘘包括自体血管移植和人造血管移植两种。"}, {"text": "我国某些地区诱导透析患者的血液净化治疗中心静脉导管使用率可达？", "options": ["A.33%", "B.47%", "C.65%", "D.10%", "E.100%"], "answer": "E", "explanation": "我国某些地区的诱导透析，血液净化治疗中心静脉导管使用率可达100%。"}, {"text": "不带涤纶套不带隧道导管（临时导管）的留置时间，血管通路专家共识要求为？", "options": ["A.不超过1个月", "B.不超过1周", "C.不超过3个月", "D.不超过6个月", "E.不超过12个月"], "answer": "A", "explanation": "不带涤纶套不带隧道导管留置时间较短，血管通路专家共识要求不超过1个月。"}, {"text": "带涤纶套带隧道导管（半永久导管）的留置时间为？", "options": ["A.不超过1个月", "B.不超过2周", "C.留置时间较长，据深静脉管说明而定", "D.不超过3个月", "E.不超过6个月"], "answer": "C", "explanation": "带涤纶套带隧道导管留置时间较长，根据深静脉管说明而定。"}, {"text": "透析用深静脉留置导管常选用的深静脉是？", "options": ["A.贵要静脉、头静脉、肘正中静脉", "B.颈内静脉、股静脉、锁骨下静脉", "C.大隐静脉、小隐静脉", "D.肱动脉、桡动脉、尺动脉", "E.门静脉、肝静脉、脾静脉"], "answer": "B", "explanation": "常选用的深静脉有颈内静脉、股静脉、锁骨下静脉；半永久性导管常选用右侧颈内静脉。"}, {"text": "关于深静脉留置导管置管的禁忌症，正确的是？", "options": ["A.穿刺局部有感染属绝对禁忌症", "B.凝血功能障碍属绝对禁忌症", "C.无绝对禁忌症，仅有相对禁忌症", "D.广泛腔静脉系统血栓形成属绝对禁忌症", "E.患者不合作属绝对禁忌症"], "answer": "C", "explanation": "深静脉留置导管置管无绝对禁忌症，其相对禁忌症为广泛腔静脉系统血栓形成、穿刺局部有感染、凝血功能障碍、患者不合作。"}, {"text": "下列属于深静脉留置导管置管相对禁忌症的是？", "options": ["A.有透析指征的急性肾损伤", "B.急性药物或毒物中毒", "C.内瘘成熟前需要透析", "D.广泛腔静脉系统血栓形成", "E.腹膜透析患者临时透析"], "answer": "D", "explanation": "深静脉留置导管置管的相对禁忌症为广泛腔静脉系统血栓形成、穿刺局部有感染、凝血功能障碍、患者不合作。"}, {"text": "下列属于临时性深静脉留置导管适应证的是？", "options": ["A.肢体血管条件差无法建立内瘘", "B.心功能较差不能耐受内瘘分流", "C.有透析指征的急性肾损伤", "D.预期生命有限的患者", "E.短期可以肾移植的患者"], "answer": "C", "explanation": "临时导管适应证包括有透析指征的急性肾损伤、急性药物或毒物中毒需急诊血液净化、有可逆因素的慢性肾衰竭基础上的急性加重、内瘘成熟前需要透析、内瘘栓塞或感染需临时通路过渡、腹膜透析或肾移植患者因病情需要的临时血液透析等。"}, {"text": "下列属于长期深静脉留置导管适应证的是？", "options": ["A.有透析指征的急性肾损伤", "B.心功能较差不能耐受动静脉内瘘分流", "C.急性药物中毒需急诊血液净化", "D.内瘘栓塞需临时通路过渡", "E.内瘘成熟前需要透析"], "answer": "B", "explanation": "长期导管适应证包括肢体血管条件差无法建立自体动静脉内瘘、心功能较差不能耐受动静脉内瘘分流、部分腹膜透析患者需暂停腹膜透析或短期可以肾移植需用血液透析过渡、病情较重或合并其他系统严重疾患预期生命有限的患者。"}, {"text": "深静脉留置导管中，作为长期通路一般选择、病人较为舒适的血管是？", "options": ["A.颈静脉", "B.股静脉", "C.锁骨下静脉", "D.肱动脉", "E.头静脉"], "answer": "A", "explanation": "颈静脉是长期通路一般选择的血管，病人较为舒适。"}, {"text": "股静脉作为紧急通路的特点为？", "options": ["A.易于插入，但易狭窄、扭折，不易压迫", "B.易于插入，血流条件好，但易扭结、感染", "C.位置表浅，长期留置最舒适", "D.长期使用通畅率最高", "E.不易感染，压迫止血容易"], "answer": "B", "explanation": "股静脉为紧急通路，易于插入，具有良好的血流条件，但易扭结、感染。"}, {"text": "锁骨下静脉作为深静脉留置导管入路的特点为？", "options": ["A.易于插入，血流条件好，但易感染", "B.长期通路一般选择的血管", "C.病人较为舒适，不易狭窄", "D.易于插入，但易狭窄、扭折，不易压迫", "E.不易狭窄，压迫止血容易"], "answer": "D", "explanation": "锁骨下静脉易于插入，但易狭窄、扭折，不易压迫。"}, {"text": "深静脉留置导管使用前评估中，需重点查看缝线有无脱落的是？", "options": ["A.临时导管", "B.半永久导管", "C.人造血管内瘘", "D.自体动静脉内瘘", "E.长期导管"], "answer": "A", "explanation": "深静脉留置导管使用前评估包括置管处有无红肿热痛等感染征象、缝线有无脱落（临时导管）、管道有无扭曲打折、导管开关是否夹闭。"}, {"text": "深静脉留置导管上机准备时，无菌治疗巾垫于中心静脉双腔导管下需打开其？", "options": ["A.1/4面", "B.1/2面", "C.3/4面", "D.全部展开", "E.不需打开"], "answer": "A", "explanation": "戴手套后打开无菌治疗巾1/4面，垫于中心静脉双腔导管下。"}, {"text": "对中心静脉导管保护帽、导管管口及导管管夹的消毒方法是？", "options": ["A.由内向外环形消毒1遍", "B.螺旋式消毒2遍", "C.上下擦拭消毒3遍", "D.螺旋式消毒1遍", "E.浸泡消毒5分钟"], "answer": "B", "explanation": "应分别螺旋式消毒导管保护帽及导管管口、导管管夹2遍。"}, {"text": "深静脉留置导管上机时回抽封管肝素液的方法是？", "options": ["A.用10ml注射器回抽5ml", "B.用2ml注射器回抽1ml", "C.用5ml注射器回抽2ml", "D.用20ml注射器回抽2ml", "E.用5ml注射器回抽5ml"], "answer": "C", "explanation": "操作前再次消毒管口，用5ml注射器回抽2ml导管内封管肝素液，推注在纱布上。"}, {"text": "回抽封管液推注于纱布上时，注射器距纱布的距离要求为？", "options": ["A.大于2cm", "B.大于5cm", "C.无距离要求", "D.大于10cm", "E.大于20cm"], "answer": "D", "explanation": "推注距纱布距离应大于10cm，以便观察纱布上有无凝血块。"}, {"text": "深静脉留置导管上机时，若纱布上发现血凝块应？", "options": ["A.立即拔除导管", "B.直接连接体外循环管路", "C.向导管内推注生理盐水冲开", "D.再次回抽1ml并推注后观察", "E.加大肝素用量后继续使用"], "answer": "D", "explanation": "检查纱布上是否有凝血块，如有血凝块，再次回抽1ml并推注后再行判断；严禁向导管内推注液体。"}, {"text": "中心静脉导管换药的正确顺序是？", "options": ["A.先更换新敷贴再消毒皮肤", "B.去除旧敷料后直接更换新敷贴", "C.去除旧敷料后消毒皮肤再更换新敷贴", "D.仅更换敷贴不需消毒", "E.先消毒皮肤再去除旧敷料"], "answer": "C", "explanation": "中心静脉导管换药应先去除旧敷料，充分暴露中心静脉导管，再消毒置管处皮肤，然后更换新敷贴。"}, {"text": "血液透析患者深静脉留置导管一般不宜用于？", "options": ["A.血液净化引血", "B.血液净化回血", "C.导管封管", "D.导管内溶栓", "E.抽血、输液等其他用途"], "answer": "E", "explanation": "血液透析患者深静脉留置导管一般不宜做抽血、输液等他用，应禁止导管作为他用。"}, {"text": "股静脉置管患者护理上应尽量避免？", "options": ["A.平卧位", "B.屈髋90°", "C.屈膝30°", "D.侧卧位", "E.抬高下肢"], "answer": "B", "explanation": "股静脉置管者应尽量避免屈髋90°，不宜过多活动或过多坐位，置管部位注意制动。"}, {"text": "中心静脉导管的并发症是？", "options": ["A.导管堵塞、感染、移动脱出、渗血", "B.心力衰竭、心律失常", "C.低血压、肌肉痉挛", "D.空气栓塞、溶血反应", "E.失衡综合征、透析骨病"], "answer": "A", "explanation": "中心静脉导管并发症包括导管堵塞、导管感染、导管移动或脱出、局部渗血。"}, {"text": "导管堵塞原因中，血栓性因素所占比例为？", "options": ["A.42%", "B.58%", "C.65%", "D.30%", "E.50%"], "answer": "B", "explanation": "导管堵塞原因中血栓性占58%，非血栓性（机械性因素）占42%。"}, {"text": "部分堵塞的导管表现是？", "options": ["A.既不能回抽血也不能回输血液", "B.能回抽血但不能回输血液", "C.回抽和回输均正常", "D.能通过导管回输血液而不能回抽血", "E.仅回抽阻力增大"], "answer": "D", "explanation": "部分堵塞指能通过导管回输血液而不能回抽血；完全堵塞指既不能回抽血也不能回输血液。"}, {"text": "确认导管不通后，处理导管内液体的原则是？", "options": ["A.抽出导管内残存液体", "B.向导管内推注生理盐水冲开", "C.向导管内推注尿激酶后加压推入", "D.向导管内注入空气加压", "E.反复推注与回抽交替进行"], "answer": "A", "explanation": "确认导管不通后应抽吸导管内液体，将导管内残存液体抽出，严禁向导管内推注液体，避免血栓脱落导致栓塞。"}, {"text": "DOQI溶栓治疗建议中，注入导管的尿激酶浓度为？", "options": ["A.1000U/ml", "B.5000U/ml", "C.500U/ml", "D.10000U/ml", "E.50000U/ml"], "answer": "B", "explanation": "DOQI溶栓治疗建议尿激酶5000U/ml注入导管，钳夹保留5min，每隔5min抽吸回血一次，持续约30分钟。"}, {"text": "DOQI溶栓治疗中，尿激酶注入导管后钳夹保留的时间为？", "options": ["A.1min", "B.10min", "C.5min", "D.20min", "E.30min"], "answer": "C", "explanation": "尿激酶5000U/ml注入导管后钳夹保留5min，每隔5min抽吸回血一次，持续约30分钟。"}, {"text": "导管溶栓治疗的注意事项是？", "options": ["A.尿激酶可提前配制备用", "B.溶栓时向导管内推注液体", "C.无需严格无菌操作", "D.尿激酶应现配现用，导管内用量准确", "E.血栓脱落不会造成栓塞"], "answer": "D", "explanation": "溶栓注意事项包括严格无菌操作确保安全、严禁向导管内推注液体以避免血栓脱落导致栓塞、尿激酶应现配现用且导管内用量准确。"}, {"text": "透析患者的第二大死因是？", "options": ["A.心血管疾病", "B.脑血管意外", "C.营养不良", "D.消化道出血", "E.导管感染"], "answer": "E", "explanation": "导管感染是透析患者的第二大死因，会增加住院时间、医疗费用及病死率。"}, {"text": "导管出口感染是指导管出口多大范围内的红斑、硬结和/或压痛？", "options": ["A.2cm内", "B.5cm内", "C.10cm内", "D.1cm内", "E.3cm内"], "answer": "A", "explanation": "出口感染指导管出口2cm内的红斑、硬结和/或压痛等，可有或无伴发的血性感染。"}, {"text": "沿皮下隧道导管径路出现触痛、红斑或硬结，属于？", "options": ["A.出口感染", "B.隧道感染", "C.导管定植", "D.导管相关性菌血症", "E.局部渗血"], "answer": "B", "explanation": "隧道感染指沿皮下隧道导管径路的触痛、红斑或硬结等，可有或无伴发的血性感染。"}, {"text": "导管感染途径中，皮肤定植的微生物从置管部位迁移到皮下隧道并定植于导管尖端所占比例为？", "options": ["A.30%", "B.5%", "C.65%", "D.42%", "E.58%"], "answer": "C", "explanation": "导管感染途径中，65%为皮肤定植的微生物从置管部位迁移到皮下隧道并定植于导管尖端。"}, {"text": "导管感染途径中，导管接头污染导致长期留置导管管腔内细菌定植所占比例为？", "options": ["A.65%", "B.5%", "C.42%", "D.30%", "E.58%"], "answer": "D", "explanation": "导管感染途径中，30%为导管接头污染导致长期留置导管的管腔内细菌定植；另有5%为感染部位血行播散及少见的输液污染等其他途径。"}, {"text": "带涤纶套导管使用12个月因感染导致的拔管率约为？", "options": ["A.30%", "B.65%", "C.10%", "D.5%", "E.50%"], "answer": "E", "explanation": "导管感染率取决于时间，带涤纶套导管使用12个月因感染导致的拔管率约50%。"}, {"text": "下列属于中心静脉导管感染临床表现的是？", "options": ["A.置管部位红肿硬结、寒战高热", "B.单纯血压下降", "C.皮肤瘙痒、皮疹", "D.肌肉痉挛、抽搐", "E.透析器凝血"], "answer": "A", "explanation": "中心静脉导管感染的临床表现为置管部位疼痛、红肿、硬结，寒战、高热，脓液渗出，还可出现获得性心内膜炎、骨髓炎及其他迁徙性感染。"}, {"text": "下列属于中心静脉导管感染危险因素的是？", "options": ["A.肝素用量不足", "B.皮肤鼻腔细菌定植、中性粒细胞减少", "C.导管末端未夹闭完全", "D.穿刺针角度过大", "E.患者血液呈高凝状态"], "answer": "B", "explanation": "感染危险因素包括皮肤和鼻腔的细菌定植、中性粒细胞减少、住院时间延长、患者临床状态、医护人员经验及教育、导管留置时间。"}, {"text": "怀疑导管感染时，导管口应如何处理？", "options": ["A.立即更换敷料即可", "B.涂抗生素软膏后观察", "C.拭子采样送验培养和敏感试验", "D.用生理盐水反复冲洗", "E.拔除后直接丢弃导管尖端"], "answer": "C", "explanation": "导管感染后处理包括导管口拭子采样送验培养和敏感试验、外周和导管采血培养、适当使用抗生素并根据化验结果调整用药。"}, {"text": "患者出现伴全身感染迹象时，应优先考虑？", "options": ["A.保留导管继续观察", "B.仅局部消毒处理", "C.加大肝素用量", "D.导管是最有可能的感染源，优先考虑拔除", "E.更换敷料后继续使用"], "answer": "D", "explanation": "伴全身感染迹象时，导管是最有可能的感染源，优先考虑拔除，并将导管尖端送验及培养。"}, {"text": "中心静脉导管感染预防的手卫生要求中，对插管部位进行消毒处理后应？", "options": ["A.不应再触摸该部位", "B.用手再次触摸确认位置", "C.可用无菌镊轻触", "D.可戴手套触摸", "E.触摸后再次消毒"], "answer": "A", "explanation": "在接触插管部位前后及插入、重置、触碰、维护导管及更换敷料时，均应严格执行手卫生程序；对插管部位进行消毒处理后，不应再触摸该部位。"}, {"text": "深静脉留置导管穿刺处渗血的处理方法是？", "options": ["A.立即拔管", "B.局部敷云南白药或加压止血", "C.局部冷敷后不必处理", "D.立即溶栓", "E.加大抗凝剂用量"], "answer": "B", "explanation": "渗血及血肿多因穿刺中伤及动脉系统或损伤小血管、皮肤松弛插管处渗血所致，渗血局部可敷云南白药或加压止血。"}, {"text": "导管置管处形成血肿时，正确处理是？", "options": ["A.立即热敷促进吸收", "B.立即拔除导管", "C.直接压迫，压迫时间取决于患者凝血功能", "D.无需处理继续透析", "E.局部切开引流"], "answer": "C", "explanation": "对于血肿应直接压迫，压迫时间取决于患者的凝血功能，最好当天不透析并注意抗凝剂的使用。"}, {"text": "一旦导管滑脱或自行拔出，护士应立即？", "options": ["A.重新插入导管", "B.消毒后继续透析", "C.更换敷料后观察", "D.局部压迫并报告医生", "E.立即溶栓"], "answer": "D", "explanation": "一旦导管滑脱或自行拔出，应立即局部压迫，并报告医生。"}, {"text": "更换导管敷料时为避免导管牵拉，正确做法是？", "options": ["A.离心方向揭开敷料", "B.平行快速撕拉敷料", "C.从任意方向快速撕开", "D.用剪刀剪开敷料", "E.向心方向揭开敷料"], "answer": "E", "explanation": "预防导管移动或脱出的措施包括妥善固定导管、更换敷料时向心方向揭开敷料，固定胶布松脱时及时重新固定。"}, {"text": "自体动静脉内瘘手术成功后，内瘘血管的成熟期为？", "options": ["A.4-6周", "B.1-2周", "C.2-3周", "D.6-8周", "E.8-12周"], "answer": "A", "explanation": "内瘘手术成功后4-6周的成熟期，确认内瘘血管已成熟，前5-10次的穿刺期为早期内瘘启用期。"}, {"text": "早期内瘘的特点是？", "options": ["A.静脉血管壁已具备动脉管壁的弹性", "B.穿刺失败风险明显降低", "C.病人对痛觉不敏感", "D.静脉壁增厚但仍未达动脉壁弹性", "E.血管壁厚且不易破损"], "answer": "D", "explanation": "早期内瘘血管血流量增加，在压力冲击下静脉血管壁逐渐增厚，但还难以达到动脉管壁的厚度和弹性，易发生穿刺失败、血管破损导致出血或皮下血肿。"}, {"text": "早期内瘘病人穿刺前，关于压脉带使用正确的是？", "options": ["A.必须常规使用压脉带", "B.压脉带应系得尽量紧", "C.压脉带可长时间保留", "D.压脉带系在瘘口近心端", "E.穿刺前尽量避免使用压脉带"], "answer": "E", "explanation": "早期内瘘穿刺前应尽量避免使用压脉带，如果血管不清晰，使用压脉带不要系得过紧，以免压力过高导致皮下出血。"}, {"text": "早期内瘘患者拔针时，建议由谁操作？", "options": ["A.穿刺者拔针", "B.患者家属", "C.任意护士", "D.值班医生", "E.患者本人"], "answer": "A", "explanation": "拔针时建议由穿刺者拔针，穿刺护士熟悉进针角度和方向，可避免造成血管的二次伤害。"}, {"text": "内瘘穿刺术后患者在透析中心留观的时间为？", "options": ["A.5分钟", "B.30分钟", "C.10分钟", "D.15分钟", "E.60分钟"], "answer": "B", "explanation": "在透析中心留观30分钟，无出血可适当放松止血弹力绷带或压迫胶布，再观察10分钟后无异常，病人方可离开医院。"}, {"text": "新瘘（前三次）穿刺的建议是？", "options": ["A.穿刺两针，用16G针", "B.穿刺两针，用15G针", "C.只穿刺一针，用17G针", "D.只穿刺一针，用14G针", "E.穿刺三针，用17G针"], "answer": "C", "explanation": "新瘘前三次只穿刺内瘘一针，用17G针；第四次起穿刺两针。"}, {"text": "新瘘前三次穿刺时，静脉端建议使用？", "options": ["A.外周浅静脉留置针", "B.内瘘静脉端穿刺", "C.内瘘动脉端单针", "D.中心静脉导管CVC，枸橼酸钠封管", "E.人造血管穿刺"], "answer": "D", "explanation": "内瘘使用早期建议前三次只穿刺内瘘一针，用17G针，静脉使用CVC，且CVC宜用枸橼酸钠封管。"}, {"text": "新瘘从第几次穿刺起可穿刺两针？", "options": ["A.第二次", "B.第三次", "C.第五次", "D.第六次", "E.第四次"], "answer": "E", "explanation": "新瘘（前三次）只穿刺一针，第四次起穿刺两针。"}, {"text": "采用绳梯法（阶梯法）穿刺时，穿刺点距瘘口的要求是？", "options": ["A.≥3cm", "B.≥1cm", "C.≥5cm", "D.≤3cm", "E.紧邻瘘口"], "answer": "A", "explanation": "绳梯法穿刺点从距瘘口≥3cm开始穿刺，每次穿刺点相隔0.5-1cm，同向移动，达到一定高度后返回最初穿刺点，如此往返重复。"}, {"text": "绳梯法穿刺时，两个针眼之间的距离约为？", "options": ["A.两个针尖斜面，约1cm", "B.一个针尖斜面，约0.5cm", "C.三个针尖斜面，约1.5cm", "D.约2cm", "E.约3cm"], "answer": "B", "explanation": "绳梯法两个针眼距离为一个针尖斜面（约0.5cm），一个针眼有2-3周愈合时间。"}, {"text": "区域法穿刺的特点是？", "options": ["A.穿刺点相隔&gt;3cm", "B.每次均为同一进针点", "C.穿刺点相隔&lt;1cm，呈蜂窝状", "D.对血管长度要求最高", "E.可防止血管瘤形成"], "answer": "C", "explanation": "区域法是在内瘘血管区域内反复穿刺，穿刺点相隔&lt;1cm，呈蜂窝状，易形成血管瘤、血管狭窄、血栓等并发症。"}, {"text": "扣眼法穿刺要求每次进针保持？", "options": ["A.同一区域、不同角度", "B.同一点、不同深度", "C.不同点、同一角度", "D.同一穿刺点、角度和深度均相同", "E.不同点、不同角度"], "answer": "D", "explanation": "扣眼法要求每次进针都是同样的进针点、进针角度、进针深度。"}, {"text": "扣眼法穿刺形成皮下隧道通常需反复穿刺的次数为？", "options": ["A.2-3次", "B.3-5次", "C.10-12次", "D.15次以上", "E.6-8次"], "answer": "E", "explanation": "扣眼法经反复穿刺6-8次左右形成皮下隧道，然后采用钝针穿刺，可减少出血及痛苦。"}, {"text": "自体动静脉内瘘首选的穿刺方法是？", "options": ["A.绳梯法", "B.区域法", "C.扣眼法", "D.直接动脉穿刺法", "E.单针法"], "answer": "A", "explanation": "绳梯法为首选穿刺方法，可有效保护血管、防止动脉瘤的形成。"}, {"text": "区域穿刺法血管瘤的出现率可高达？", "options": ["A.50%", "B.85%", "C.100%", "D.65%", "E.42%"], "answer": "B", "explanation": "区域穿刺法血管瘤出现率高达85%，而血管狭窄发生率甚至高达100%。"}, {"text": "内瘘穿刺前消毒的范围要求是？", "options": ["A.以穿刺点为中心，直径大于5cm", "B.以穿刺点为中心，直径大于8cm", "C.以穿刺点为中心，直径大于10cm", "D.以瘘口为中心，直径大于10cm", "E.以穿刺点为中心，直径大于15cm"], "answer": "C", "explanation": "内瘘穿刺前应使用含碘消毒剂，以穿刺点为中心，消毒直径大于10cm。"}, {"text": "扣眼法穿刺前湿热敷痂皮应在穿刺前多久进行？", "options": ["A.5分钟", "B.10分钟", "C.30分钟", "D.20分钟", "E.40分钟"], "answer": "D", "explanation": "扣眼法应在穿刺前20分钟，由护士采用无菌生理盐水纱布进行湿热敷（40℃左右）痂皮30分钟，用无菌棉签直接提出痂皮后再消毒扣眼。"}, {"text": "人造血管内瘘（移植物内瘘）术后多久即可使用？", "options": ["A.1周", "B.2周", "C.3天", "D.4周", "E.2-3周"], "answer": "E", "explanation": "人造血管内瘘术后2-3周即可使用，推荐至6-8周后开始穿刺则更理想。"}, {"text": "人造血管内瘘穿刺时，初次使用的穿刺针规格为？", "options": ["A.17G", "B.15G", "C.16G", "D.14G", "E.18G"], "answer": "A", "explanation": "人造血管内瘘穿刺以薄壁的穿刺针为最佳选择，初次用17G，3次以后视血管情况用15G-16G穿刺针。"}, {"text": "人造血管内瘘穿刺时，同一血管两针相距应为？", "options": ["A.＞2cm", "B.＞3cm", "C.＞5cm", "D.＞8cm", "E.＞10cm"], "answer": "C", "explanation": "人造血管内瘘穿刺时，同一血管两针相距应大于5cm。"}, {"text": "人造血管内瘘穿刺应不断改换穿刺点，至少应给同一穿刺点的愈合时间为？", "options": ["A.1周", "B.2周", "C.1个月", "D.2-3周", "E.3个月"], "answer": "D", "explanation": "人造血管内瘘至少给同一穿刺点2-3周的愈合时间，必须循环使用穿刺点。"}, {"text": "自体内瘘拔针后，拇指迅速按压针眼处的时间为？", "options": ["A.1-5秒", "B.5-10秒", "C.30-60秒", "D.1-2分钟", "E.10-30秒"], "answer": "E", "explanation": "自体内瘘拔针后，拇指迅速按压针眼处，按压时间10-30秒。"}, {"text": "自体内瘘拔针瞬间按压力度要大，持续多久后逐渐减轻按压力度？", "options": ["A.5-15秒", "B.1-5秒", "C.15-30秒", "D.30-60秒", "E.1分钟以上"], "answer": "A", "explanation": "自体内瘘拔针瞬间按压力度要大，持续5-15秒后逐渐减轻按压力度，以既不出血、又能触及震颤为宜。"}, {"text": "人造血管内瘘拔针后宜用指压法止血，正确的按压部位是？", "options": ["A.轻压皮肤表面即可", "B.轻压人工血管的位置而非皮肤的位置", "C.按压人工血管近心端动脉", "D.按压穿刺点远心端", "E.按压吻合口部位"], "answer": "B", "explanation": "人造血管内瘘拔针宜用指压法止血，用手指压住伤口止血，用柔和的压力轻压人工血管的位置而非皮肤的位置，能有效止血。"}, {"text": "动静脉内瘘护理中，内瘘血管禁止的操作是？", "options": ["A.输液、采血、测血压", "B.超声检查内瘘", "C.听诊内瘘杂音", "D.触诊内瘘震颤", "E.抬高造瘘侧肢体"], "answer": "A", "explanation": "动静脉内瘘护理要求内瘘血管禁止输液、采血、测血压。"}, {"text": "血液透析结束后压迫止血力度适中，视情况在压迫多久后松解棉球？", "options": ["A.5-10分钟", "B.15-20分钟", "C.30-40分钟", "D.1小时", "E.2小时"], "answer": "B", "explanation": "血液透析结束后压迫止血力度适中，视情况在压迫15-20分钟后松解棉球。"}, {"text": "观察内瘘是否通畅时，“看”的内容是？", "options": ["A.血管是否充盈", "B.杂音是否清晰", "C.有无震颤感", "D.皮肤温度是否升高", "E.有无疼痛"], "answer": "A", "explanation": "观察内瘘是否通畅的方法为：看血管是否充盈、听内瘘杂音是否清晰、摸血管有无震颤感。"}, {"text": "动静脉内瘘穿刺点当天（24小时内）应注意？", "options": ["A.不要碰水", "B.热敷促进愈合", "C.用力按压", "D.涂抹药膏", "E.反复按摩"], "answer": "A", "explanation": "动静脉内瘘穿刺点当天（24小时内）不要碰水。"}, {"text": "动静脉内瘘侧肢体出现肿胀时，24小时内的处理是？", "options": ["A.热敷消肿", "B.按摩消肿", "C.冰袋冷敷", "D.土豆片外敷", "E.立即穿刺引流"], "answer": "C", "explanation": "有肿胀时24小时内冰袋冷敷；24小时后确认不再渗血时可热敷消肿，也可用新鲜土豆片敷肿胀部位消肿。"}, {"text": "一旦发现内瘘血管有红、肿、发热、疼痛等感染迹象时，应？", "options": ["A.先观察数日", "B.自行涂药", "C.热敷处理", "D.立即报告医生", "E.继续穿刺使用"], "answer": "D", "explanation": "一旦发现内瘘血管有红、肿、发热、疼痛等感染迹象时，要立即报告医生。"}]}, {"type": "multiple", "questions": [{"text": "中心静脉导管上机操作的注意事项包括？", "options": ["Ａ.严格无菌操作", "Ｂ.注意消毒范围", "Ｃ.双消毒", "Ｄ.减少导管管口暴露时间", "Ｅ.消毒后用手触摸管口确认位置"], "answer": "ABCD", "explanation": "中心静脉导管上机操作注意事项为严格无菌操作、注意消毒范围、双消毒、减少导管管口暴露时间；E错误，对管口消毒后不应再触摸该部位。"}, {"text": "中心静脉导管的并发症包括？", "options": ["Ａ.导管堵塞", "Ｂ.导管感染", "Ｃ.导管移动或脱出", "Ｄ.局部渗血", "Ｅ.心力衰竭"], "answer": "ABCD", "explanation": "中心静脉导管并发症为导管堵塞、导管感染、导管移动或脱出、局部渗血；心力衰竭不属于中心静脉导管并发症。"}, {"text": "深静脉留置导管置管的相对禁忌症包括？", "options": ["Ａ.广泛腔静脉系统血栓形成", "Ｂ.穿刺局部有感染", "Ｃ.凝血功能障碍", "Ｄ.患者不合作", "Ｅ.有透析指征的急性肾损伤"], "answer": "ABCD", "explanation": "深静脉留置导管置管无绝对禁忌症，相对禁忌症为广泛腔静脉系统血栓形成、穿刺局部有感染、凝血功能障碍、患者不合作；有透析指征的急性肾损伤是置管适应证而非禁忌症。"}, {"text": "临时性深静脉留置导管的适应证包括？", "options": ["Ａ.有透析指征的急性肾损伤", "Ｂ.急性药物或毒物中毒需急诊血液净化", "Ｃ.内瘘成熟前需要透析的患者", "Ｄ.内瘘栓塞或感染需临时通路过渡", "Ｅ.预期生命有限的患者"], "answer": "ABCD", "explanation": "临时导管适应证包括有透析指征的急性肾损伤、急性药物或毒物中毒需急诊血液净化、有可逆因素的慢性肾衰竭基础上的急性加重、内瘘成熟前需要透析、内瘘栓塞或感染需临时通路过渡、腹膜透析或肾移植患者因病情需要的临时血液透析等；预期生命有限属于长期导管适应证。"}, {"text": "长期深静脉留置导管的适应证包括？", "options": ["Ａ.肢体血管条件差无法建立自体动静脉内瘘", "Ｂ.心功能较差不能耐受动静脉内瘘分流", "Ｃ.病情较重、预期生命有限", "Ｄ.短期可以肾移植需血液透析过渡", "Ｅ.急性药物中毒需急诊血液净化"], "answer": "ABCD", "explanation": "长期导管适应证包括肢体血管条件差无法建立自体动静脉内瘘、心功能较差不能耐受动静脉内瘘分流、部分腹膜透析患者需暂停腹膜透析或短期可以肾移植需用血液透析过渡、病情较重或合并其他系统严重疾患预期生命有限的患者；急性药物中毒需急诊血液净化属临时导管适应证。"}, {"text": "内瘘成熟可穿刺的标准包括？", "options": ["Ａ.内瘘伤口愈合、皮肤完好", "Ｂ.血管扩张均匀、有弹性", "Ｃ.内瘘处听诊杂音清晰", "Ｄ.手掌心轻触内瘘处有震颤", "Ｅ.内瘘处可触及明显硬结"], "answer": "ABCD", "explanation": "内瘘成熟可穿刺的标准为内瘘伤口愈合、皮肤完好，血管扩张均匀、有弹性，内瘘处听诊杂音清晰，手掌心轻触内瘘处有震颤；触及硬结提示异常，不是成熟标准。"}, {"text": "扣眼法穿刺的优点包括？", "options": ["Ａ.疼痛减轻，避免麻药使用", "Ｂ.更低的误穿率", "Ｃ.渗出和血肿减少", "Ｄ.穿刺耗时缩短", "Ｅ.穿刺操作最容易"], "answer": "ABCD", "explanation": "扣眼法优点是疼痛减轻（避免麻药使用从而减少感染）、更低的误穿率、渗出和血肿减少、穿刺耗时缩短；E错误，扣眼法操作度较难，区域法操作最容易。"}, {"text": "绳梯法穿刺的优点包括？", "options": ["Ａ.有效保护血管", "Ｂ.防止动脉瘤形成", "Ｃ.对血管长度要求不高", "Ｄ.适用于血管走行不清者", "Ｅ.穿刺耗时最短"], "answer": "AB", "explanation": "绳梯法优点是有效保护血管、防止动脉瘤的形成；C、D错误，绳梯法适用于血管分支少、长度＞5cm、血管表浅且走形清楚者；E错误，穿刺耗时最短是扣眼法的优点。"}, {"text": "中心静脉导管感染的临床表现包括？", "options": ["Ａ.置管部位疼痛、红肿、硬结", "Ｂ.寒战、高热", "Ｃ.脓液渗出", "Ｄ.获得性心内膜炎", "Ｅ.单纯血压下降"], "answer": "ABCD", "explanation": "中心静脉导管感染表现为置管部位疼痛、红肿、硬结，寒战、高热，脓液渗出，还可出现获得性心内膜炎、骨髓炎及其他迁徙性感染；单纯血压下降不是其临床表现。"}, {"text": "中心静脉导管感染的危险因素包括？", "options": ["Ａ.皮肤和鼻腔的细菌定植", "Ｂ.中性粒细胞减少", "Ｃ.住院时间延长", "Ｄ.导管留置时间延长", "Ｅ.肝素用量不足"], "answer": "ABCD", "explanation": "感染危险因素包括皮肤和鼻腔的细菌定植、中性粒细胞减少、住院时间延长、患者临床状态、医护人员经验及教育、导管留置时间；肝素用量不足是导管内血栓形成的原因。"}, {"text": "导管堵塞的血栓形成原因包括？", "options": ["Ａ.留置导管时间过长", "Ｂ.肝素用量不足", "Ｃ.病人血液呈高凝状态", "Ｄ.导管活动夹未夹闭或管道受压扭曲", "Ｅ.穿刺局部皮肤感染"], "answer": "ABCD", "explanation": "导管内血栓形成的原因包括留置导管时间过长、肝素用量不足、病人血液呈高凝状态、导管活动夹未夹闭或管道受压扭曲、导管末端未夹闭完全致血液回流至管腔内；穿刺局部皮肤感染是导管感染的相关因素。"}, {"text": "中心静脉导管溶栓治疗的注意事项包括？", "options": ["Ａ.严格无菌操作，确保安全", "Ｂ.严禁向导管内推注液体", "Ｃ.尿激酶应现配现用", "Ｄ.导管内用量准确", "Ｅ.尿激酶可提前配制备用"], "answer": "ABCD", "explanation": "溶栓注意事项为严格无菌操作确保安全、严禁向导管内推注液体以避免血栓脱落导致栓塞、尿激酶应现配现用、导管内用量准确；E错误，提前配制不符合现配现用的要求。"}, {"text": "中心静脉导管感染后的处理措施包括？", "options": ["Ａ.导管口拭子采样送验培养和敏感试验", "Ｂ.外周和导管采血培养", "Ｃ.适当使用抗生素", "Ｄ.根据化验结果使用抗生素", "Ｅ.一律保留导管继续使用"], "answer": "ABCD", "explanation": "感染后处理包括导管口拭子采样送验培养和敏感试验、外周和导管采血培养、适当使用抗生素并根据化验结果调整；E错误，伴全身感染迹象时导管是最有可能的感染源，应优先考虑拔除。"}, {"text": "中心静脉导管感染的预防措施包括？", "options": ["Ａ.严格手卫生", "Ｂ.消毒与隔离", "Ｃ.消毒穿刺点", "Ｄ.选择适宜的导管部位并评估置管部位", "Ｅ.仅在置管时评估导管一次"], "answer": "ABCD", "explanation": "感染预防要采取最大限度消毒隔离，实施手卫生、消毒、隔离、消毒穿刺点、合适的导管部位、置管部位评估等要素捆绑措施，并每次评估导管（红、肿、分泌物、气味、插管口等）；E错误，应每次评估而非仅置管时评估一次。"}, {"text": "血液透析患者深静脉留置导管的常规护理措施包括？", "options": ["Ａ.注意个人卫生", "Ｂ.置管部位注意制动", "Ｃ.导管滑脱后立即局部压迫并报告医生", "Ｄ.禁止导管作为抽血、输液等他用", "Ｅ.导管可常规用于输液"], "answer": "ABCD", "explanation": "留置导管常规护理包括注意个人卫生、置管部位注意制动、紧急压迫（导管滑脱或自行拔出立即局部压迫并报告医生）、禁止导管作为他用、局部保持清洁干燥避免潮湿与污染；E错误，导管不宜做抽血、输液等他用。"}, {"text": "静脉留置导管渗血及血肿的处理包括？", "options": ["Ａ.血肿直接压迫", "Ｂ.压迫时间取决于患者凝血功能", "Ｃ.血肿当天最好不透析并注意抗凝剂使用", "Ｄ.渗血局部可敷云南白药或加压止血", "Ｅ.立即拔除导管"], "answer": "ABCD", "explanation": "渗血及血肿多因穿刺中伤及动脉系统或损伤小血管、皮肤松弛所致；处理包括血肿直接压迫、压迫时间取决于患者凝血功能、最好当天不透析并注意抗凝剂的使用、渗血局部可敷云南白药或加压止血；E错误，渗血血肿并非立即拔管的指征。"}, {"text": "预防深静脉留置导管移动或脱出的措施包括？", "options": ["Ａ.妥善固定导管", "Ｂ.更换敷料时向心方向揭开敷料", "Ｃ.固定胶布松脱时及时重新固定", "Ｄ.床尾悬挂防导管滑脱标识", "Ｅ.换药时不检查导管缝线情况"], "answer": "ABCD", "explanation": "预防措施包括妥善固定导管、更换敷料时向心方向揭开敷料、指导患者穿脱衣服时保护导管、固定胶布松脱时及时重新固定、记录护理记录单并床尾悬挂防导管滑脱标识、交接并测量记录血透管刻度、换药时注意缝线情况并及时汇报医生；E错误，换药时必须检查缝线情况。"}, {"text": "早期内瘘的穿刺注意事项包括？", "options": ["Ａ.穿刺前做好解释工作，消除紧张情绪", "Ｂ.仔细评估血管走向，避免反复穿刺找血管", "Ｃ.穿刺前尽量避免使用压脉带", "Ｄ.穿刺时动作轻柔，角度方向与血管顺应", "Ｅ.拔针时建议由非穿刺者拔针"], "answer": "ABCD", "explanation": "早期内瘘注意事项包括穿刺前解释消除紧张、仔细评估血管走向避免反复在皮下组织穿刺找血管、动作轻柔并使穿刺针角度方向与皮肤血管顺应一致、尽量避免使用压脉带且系带不过紧、由穿刺者拔针、留观30分钟等；E错误，应由熟悉进针角度和方向的穿刺者拔针。"}, {"text": "自体动静脉内瘘的穿刺方法主要有？", "options": ["Ａ.绳梯法", "Ｂ.区域法", "Ｃ.扣眼法", "Ｄ.直接动脉穿刺法", "Ｅ.单针法"], "answer": "ABC", "explanation": "自体动静脉内瘘的穿刺方法主要有绳梯法（阶梯法）、区域法和扣眼法；直接动脉穿刺法为已淘汰的血管通路类型，不是内瘘穿刺方法。"}, {"text": "理想的血管通路的要求包括？", "options": ["Ａ.血流量充分，适合血液净化的需要", "Ｂ.不浪费，副作用少", "Ｃ.建立时间短", "Ｄ.不限制活动", "Ｅ.需要限制患者活动"], "answer": "ABCD", "explanation": "理想的血管通路要求血流量充分、适合血液净化的需要，不浪费、副作用少，建立时间短，不限制活动；E与不限制活动的要求相反，为错误选项。"}, {"text": "关于扣眼穿刺方法（常规锐型穿刺针法），正确的有？", "options": ["Ａ.第1次用普通锐型针确定针眼", "Ｂ.第2-8次保持同点同角同深度", "Ｃ.有条件的血管可形成2-3个隧道", "Ｄ.隧道形成后改用14-16G钝穿刺针", "Ｅ.隧道形成后继续使用锐型穿刺针"], "answer": "ABCD", "explanation": "扣眼穿刺方法第1次穿刺时使用普通锐型穿刺针确定穿刺针眼，第2-8次穿刺在隧道形成前确保同一穿刺点、同一穿刺角度、同一穿刺深度，使用普通锐型穿刺针进针，有条件的血管可形成2-3个隧道，隧道形成后改用14-16G钝穿刺针；E错误，隧道形成后应改用钝穿刺针。"}, {"text": "自体内瘘拔针的注意事项包括？", "options": ["Ａ.根据病人血压及内瘘情况控制按压时间", "Ｂ.使用弹力绷带，先紧后松", "Ｃ.10-15分钟后适应放松弹力绷带", "Ｄ.拔静脉针时注意上端静脉按压力度", "Ｅ.老年病人肘正中静脉穿刺点应嘱其屈肘"], "answer": "ABCD", "explanation": "自体内瘘拔针应根据病人血压及内瘘情况控制按压时间，使用弹力绷带先紧后松，10-15分钟后适应放松弹力绷带，30-40分钟不出血可撤掉；拔静脉针需注意静脉与动脉同根血管，上端静脉按压力度过大会致动脉处渗血；E错误，老年病人静脉穿刺点为肘正中静脉时应提醒不要屈肘，防止出血。"}, {"text": "内瘘穿刺前评估的内容包括？", "options": ["Ａ.视有无红肿、硬结、皮肤破损", "Ｂ.触摸清血管走向和搏动", "Ｃ.听杂音大小、震颤强度", "Ｄ.测量患者体温", "Ｅ.询问患者饮食情况"], "answer": "ABC", "explanation": "内瘘穿刺前评估包括视（有无红肿、硬结、皮肤破损）、触（摸清血管走向和搏动）、听（杂音大小、震颤强度）；测量体温和询问饮食情况不属于内瘘穿刺前评估内容。"}, {"text": "内瘘穿刺前的消毒要求包括？", "options": ["Ａ.使用含碘消毒剂", "Ｂ.以穿刺点为中心", "Ｃ.消毒直径大于10cm", "Ｄ.扣眼法穿刺前20分钟湿热敷痂皮", "Ｅ.扣眼法无需去除痂皮"], "answer": "ABCD", "explanation": "内瘘穿刺前使用含碘消毒剂，以穿刺点为中心，消毒直径大于10cm；如为扣眼法则应在穿刺前20分钟用无菌生理盐水纱布湿热敷（40℃左右）痂皮30分钟，用无菌棉签直接提出痂皮后再消毒扣眼；E错误，扣眼法必须先去除痂皮再消毒。"}, {"text": "顺血流穿刺的优点包括？", "options": ["Ａ.减少再循环", "Ｂ.动脉端顺血流易进针省力", "Ｃ.拔针时容易压迫止血", "Ｄ.形成膨出性血管瘤的概率明显降低", "Ｅ.易引起血栓、血管壁受损"], "answer": "ABCD", "explanation": "顺血流穿刺可减少再循环，早期动脉端顺血流穿刺操作易掌握进针角度、易进针且省力、穿刺成功率高，拔针时容易压迫止血，形成膨出性血管瘤的概率明显降低，还可延长内瘘使用时间、减少血栓形成及内瘘狭窄闭塞；E是逆血流穿刺的缺点。"}, {"text": "内瘘穿刺使用压脉带的理由包括？", "options": ["Ａ.缩小针眼", "Ｂ.减轻疼痛", "Ｃ.增大血管横切面", "Ｄ.减少误穿至皮下", "Ｅ.减轻血液再循环"], "answer": "ABCD", "explanation": "内瘘穿刺使用压脉带的四大理由为缩小针眼、减轻疼痛、消毒穿刺点、增大血管横切面、减少误穿至皮下；E错误，减少再循环是顺血流穿刺的优点，与使用压脉带无关。"}, {"text": "人造血管内瘘穿刺技术的要求包括？", "options": ["Ａ.薄壁的穿刺针为最佳选择", "Ｂ.初次使用17G穿刺针", "Ｃ.3次以后视血管情况用15G-16G", "Ｄ.穿刺针斜角向上以45度进针", "Ｅ.同一血管两针相距3cm"], "answer": "ABCD", "explanation": "人造血管内瘘穿刺应选薄壁穿刺针，初次17G，3次以后视血管情况用15G-16G，穿刺针斜角向上以45度进针；E错误，同一血管两针应相距大于5cm。"}, {"text": "人造血管内瘘U型管的穿刺要求包括？", "options": ["Ａ.动静脉穿刺点均在人造血管上", "Ｂ.由远心端到近心端绳梯式穿刺", "Ｃ.动脉穿刺点距吻合口＞3cm", "Ｄ.不宜在血管转弯、弧形及皱褶部位穿刺", "Ｅ.每次穿刺点相隔2cm以上"], "answer": "ABCD", "explanation": "U型人造血管内瘘动静脉穿刺点均在人造血管上，穿刺部位由远心端到近心端进行绳梯式穿刺，动脉穿刺点距吻合口＞3cm，不宜在血管转弯、弧形及皱褶部位穿刺；E错误，每次穿刺点应相隔0.5-1cm。"}, {"text": "人造血管内瘘拔针的注意事项包括？", "options": ["Ａ.透析完成后小心拔出穿刺针", "Ｂ.宜用指压法止血", "Ｃ.柔和轻压人工血管而非皮肤", "Ｄ.棉球纱布轻压20-30分钟", "Ｅ.按压用力越大越好"], "answer": "ABCD", "explanation": "人造血管内瘘拔针应在透析完成后小心拔出，宜用指压法止血，用柔和的压力轻压人工血管的位置而非皮肤的位置，用棉球或纱布轻压直至出血完全消失（通常20到30分钟），并记录穿刺点和日期；E错误，压力过大会压迫血管造成血栓。"}, {"text": "动静脉内瘘的日常护理与观察内容包括？", "options": ["Ａ.每日检查内瘘是否通畅", "Ｂ.看血管是否充盈", "Ｃ.听内瘘杂音是否清晰", "Ｄ.摸血管有无震颤感", "Ｅ.穿刺点24小时内可正常沾水"], "answer": "ABCD", "explanation": "动静脉内瘘日常护理要求每日检查内瘘是否通畅，观察方法为看血管是否充盈、听内瘘杂音是否清晰、摸血管有无震颤感；E错误，穿刺点当天（24小时内）不要碰水。"}]}, {"type": "short", "questions": [{"text": "简述血液透析血管通路的概念及理想的血管通路应具备的条件。", "options": [], "answer": "（1）概念：血管通路是为完成血液透析过程从人体引出及回输血液的人体血管路径，是透析患者的生命线；血液透析是将血液从患者身体引出经体外半透膜的透析装置，滤掉大部分废物及多余水分，再将血液回输入人体的过程。（2）理想的血管通路应具备：血流量充分，适合血液净化的需要；不浪费，副作用少；建立时间短；不限制活动。（3）建立血管通路的原则性要求：危险性小和严重并发症发生率低；建立和使用安全（手术方法尽可能简单、手术难度低）；尽可能不浪费血管，不引起局部缺血，不加重心脏负荷；成功率高；永久性血管通路能长期维持通畅率，皮下静脉吻合后有广泛的穿刺部位。（4）临时性血管通路要求建立所需时间短，可以很快开始使用。", "explanation": "血管通路的定义强调其是引出及回输血液的人体血管路径；理想的血管通路从血流量、副作用、建立时间、活动限制四个方面提出要求。建立血管通路还需兼顾安全性、成功率、通畅率及穿刺部位条件，并要求不浪费血管、不引起局部缺血、不加重心脏负荷；临时性通路另强调建立时间短、可很快使用。"}, {"text": "简述血液透析用深静脉留置导管的分类及留置时间要求。", "options": [], "answer": "（1）按是否带涤纶套、是否带隧道分为两类。（2）不带涤纶套不带隧道导管（临时导管）：留置时间较短，血管通路专家共识要求不超过1个月；常选用的深静脉有颈内静脉、股静脉、锁骨下静脉。（3）带涤纶套带隧道导管（半永久导管，即带cuff的中心静脉导管）：留置时间较长，根据深静脉管说明而定；常选用右侧颈内静脉。", "explanation": "深静脉留置导管的分类依据是涤纶套和隧道的有无；临时导管强调留置不超过1个月并首选颈内静脉、股静脉、锁骨下静脉，半永久导管留置时间依深静脉管说明而定，首选右侧颈内静脉。"}, {"text": "简述深静脉留置导管行血液净化治疗前的使用前评估内容。", "options": [], "answer": "（1）置管处：有无红肿热痛等感染征象。（2）缝线处：缝线有无脱落（临时导管）。（3）管道：管道有无扭曲打折。（4）导管开关：开关是否夹闭。（5）同时应评估置管部位敷料及局部清洁、干燥情况。", "explanation": "使用前评估围绕置管处、缝线处、管道三个方面进行，重点排查感染征象、缝线脱落、管道扭曲打折及导管开关是否夹闭，以保证上机引血安全。"}, {"text": "简述深静脉留置导管行血液净化治疗上机时的导管消毒与回抽要点。", "options": [], "answer": "（1）戴手套，打开无菌治疗巾1/4面，垫于中心静脉双腔导管下。（2）分别螺旋式消毒导管保护帽及导管管口、导管管夹2遍。（3）检查导管夹子处于夹闭状态，取下螺帽并弃掉；如使用无针连接接头，消毒接头平面后，将消毒后导管置于治疗巾1/2无菌面。（4）操作前再次消毒管口。（5）用5ml注射器回抽2ml导管内封管肝素液，推注在纱布上，推注距纱布距离大于10cm。（6）检查纱布上是否有凝血块，如有血凝块，再次回抽1ml并推注。（7）判断导管畅通后，连接体外循环的动、静脉管路，建立体外循环，更换新的治疗巾。", "explanation": "上机操作的核心是严格无菌、双消毒、减少管口暴露时间；回抽封管液需用5ml注射器回抽2ml并距纱布10cm以上推注以便观察凝血块，发现血凝块再次回抽1ml，确认通畅后方可连接体外循环并更换新治疗巾。"}, {"text": "简述中心静脉导管堵塞的溶栓处理方法及注意事项。", "options": [], "answer": "（1）确认导管不通：打开肝素小帽，抽吸不畅或完全不能抽出，经反复调整导管位置无效，明确抽吸出凝血块。（2）抽吸导管内液体：将导管内残存液体抽出，严禁向导管内推注液体。（3）按DOQI溶栓治疗建议：尿激酶5000U/ml注入导管，钳夹保留5min，每隔5min抽吸回血一次，持续约30分钟。（4）溶栓注意事项：严格无菌操作，确保安全；严禁向导管内推注液体，避免血栓脱落导致栓塞；尿激酶应现配现用，导管内用量准确。", "explanation": "导管堵塞按原因分为血栓性（58%）和非血栓性（机械性因素，42%）；溶栓前必须确认导管不通并抽出导管内残存液体，严禁向导管内推注液体以防血栓脱落导致栓塞，尿激酶浓度为5000U/ml、钳夹保留5min、每5min抽吸回血一次、持续约30分钟，且须现配现用、用量准确。"}, {"text": "简述中心静脉导管感染的预防措施。", "options": [], "answer": "（1）最大限度消毒隔离，落实手卫生、消毒、隔离、消毒穿刺点、选择合适导管部位、置管部位评估等要素捆绑措施。（2）每次评估导管，包括红、肿、分泌物、气味、插管口等。（3）用适宜的消毒液进行皮肤消毒及消毒穿刺点。（4）在接触插管部位前后及插入、重置、触碰、维护导管及更换敷料时，均应严格执行手卫生程序。（5）对插管部位进行消毒处理后，不应再触摸该部位。", "explanation": "导管感染是透析患者的第二大死因，会增加住院时间、医疗费用及病死率；预防以最大限度消毒隔离为核心，采用手卫生、消毒、隔离、消毒穿刺点、合适的导管部位、置管部位评估等要素捆绑措施，并每次评估导管、严格手卫生，消毒后不再触摸插管部位。"}, {"text": "简述自体动静脉内瘘三种穿刺方法（绳梯法、区域法、扣眼法）的要点。", "options": [], "answer": "（1）绳梯法（阶梯法，首选穿刺方法）：穿刺点从距瘘口≥3cm开始，每次穿刺点相隔0.5-1cm，同向移动，达到一定高度后返回最初穿刺点，如此往返重复；两个针眼距离为一个针尖斜面（约0.5cm），一个针眼有2-3周愈合时间；适用于血管分支少、长度＞5cm、血管表浅、走形清楚者；优点为有效保护血管、防止动脉瘤形成，对血管长度要求高。（2）区域法：在内瘘血管区域内反复穿刺，穿刺点相隔&lt;1cm，呈蜂窝状，易形成血管瘤、血管狭窄、血栓等并发症；优点是易穿刺、疼痛感轻，血管瘤出现率高达85%，血管狭窄发生率甚至高达100%。（3）扣眼法：每次进针均为同样的进针点、进针角度、进针深度，反复穿刺6-8次左右形成皮下隧道，然后采用钝针穿刺；有糖尿病、血管硬化明显者可增加至12次以上；优点是疼痛减轻、误穿率低、渗出和血肿减少、穿刺耗时缩短，可延长内瘘使用寿命，但操作较难。", "explanation": "三种穿刺方法中绳梯法为首选，可保护血管并防止动脉瘤；区域法并发症最多，血管瘤出现率高达85%、血管狭窄发生率高达100%；扣眼法需同一穿刺点、同一角度、同一深度反复穿刺6-8次形成隧道后改用钝针，可减少出血及痛苦。扣眼式适合内瘘充盈不佳、血管长度＜5cm、血管较深及肥胖患者，绳梯式适合内瘘扩张均匀、分支少、血管长度＞5cm、血管表浅及体型正常或瘦弱的患者。"}, {"text": "简述动静脉内瘘穿刺前评估与消毒的要点。", "options": [], "answer": "（1）穿刺前评估：视——有无红肿、硬结、皮肤破损；触——摸清血管走向和搏动；听——杂音大小、震颤强度。（2）穿刺前消毒：使用含碘消毒剂，以穿刺点为中心，消毒直径大于10cm。（3）扣眼法额外要求：在穿刺前20分钟，由护士采用无菌生理盐水纱布进行湿热敷（40℃左右）痂皮30分钟，用无菌棉签直接提出痂皮后再消毒扣眼。", "explanation": "穿刺前评估通过视、触、听三方面判断血管条件；消毒以穿刺点为中心、直径大于10cm；扣眼法必须先在穿刺前20分钟湿热敷（40℃左右）痂皮30分钟并去除痂皮后再消毒，以免痂皮影响穿刺和增加感染风险。"}]}]}, {"num": 26, "title": "肾脏病的危险因素及预防-2026.3.12理论考试题库", "sections": [{"type": "single", "questions": [{"text": "国外慢性肾脏病的发病率为（  ）", "options": ["A.5%～8%", "B.8%～10%", "C.11%～16.2%", "D.17%～20%", "E.21%～25%"], "answer": "C", "explanation": "慢性肾脏病的发病率在世界范围内呈上升趋势，国外慢性肾脏病发病率为11%～16.2%。"}, {"text": "我国国内慢性肾脏病的发病率为（  ）", "options": ["A.6.8%", "B.8.8%", "C.10.8%", "D.12.8%", "E.14.3%"], "answer": "C", "explanation": "国内慢性肾脏病发病率为10.8%，低于国外11%～16.2%的发病率，但同样呈上升趋势。"}, {"text": "全球一般人群慢性肾脏病的患病率高达（  ）", "options": ["A.8.2%", "B.10.8%", "C.14.3%", "D.16.2%", "E.18.6%"], "answer": "C", "explanation": "全球一般人群慢性肾脏病患病率高达14.3%；我国18岁以上人群慢性肾脏病患病率为10.8%。"}, {"text": "我国18岁以上人群慢性肾脏病的患病率为（  ）", "options": ["A.8.2%", "B.10.8%", "C.11.3%", "D.13.5%", "E.14.3%"], "answer": "B", "explanation": "我国18岁以上人群慢性肾脏病患病率为10.8%，是慢性肾脏病防治的重点人群。"}, {"text": "预计到2040年，慢性肾脏病将在全球导致死亡的主要原因中排名（  ）", "options": ["A.第一位", "B.第三位", "C.第五位", "D.第七位", "E.第十位"], "answer": "C", "explanation": "预计到2040年，慢性肾脏病将在全球导致死亡的主要原因中排名第五。"}, {"text": "截止2021年底，我国血液透析患者数量约为（  ）", "options": ["A.44.9万人", "B.54.9万人", "C.64.9万人", "D.74.9万人", "E.84.9万人"], "answer": "D", "explanation": "截止2021年底，我国血液透析患者数量约74.9万人，近年来我国透析患者人数增长迅速，慢性肾脏病引起的透析人数逐年增多。"}, {"text": "世界肾脏病日的日期是（  ）", "options": ["A.每年3月份的第一个星期四", "B.每年3月份的第二个星期四", "C.每年3月份的第三个星期四", "D.每年3月份的第二个星期三", "E.每年10月份的第二个星期四"], "answer": "B", "explanation": "世界肾脏病日定为每年3月份的第二个星期四。"}, {"text": "世界肾脏病日由下列哪两个机构联合提议设立（  ）", "options": ["A.国际肾脏病学会和国际肾脏基金联盟", "B.世界卫生组织和国际肾脏病学会", "C.世界卫生组织和国际肾脏基金联盟", "D.中华医学会肾脏病学分会和国际肾脏病学会", "E.中华医学会肾脏病学分会和国际肾脏基金联盟"], "answer": "A", "explanation": "世界肾脏病日由国际肾脏病学会和国际肾脏基金联盟联合提议设立。"}, {"text": "慢性肾脏病已成为继下列哪一组疾病之后又一个威胁人类健康的疾病（  ）", "options": ["A.心脑血管病、肿瘤、糖尿病", "B.高血压、肿瘤、糖尿病", "C.心脑血管病、高血压、糖尿病", "D.心脑血管病、肿瘤、高尿酸血症", "E.高血压、高脂血症、糖尿病"], "answer": "A", "explanation": "慢性肾脏病已成为继心脑血管病、肿瘤、糖尿病之后又一个威胁人类健康的疾病，其发病率、患病率明显上升。"}, {"text": "我国高血压的诊断标准是未服用抗高血压药情况下（  ）", "options": ["A.收缩压≥130mmHg或舒张压≥80mmHg", "B.收缩压≥140mmHg或舒张压≥90mmHg", "C.收缩压≥150mmHg或舒张压≥95mmHg", "D.收缩压≥160mmHg或舒张压≥100mmHg", "E.收缩压≥120mmHg或舒张压≥80mmHg"], "answer": "B", "explanation": "我国高血压诊断标准为未服用抗高血压药情况下，收缩压≥140mmHg或舒张压≥90mmHg。"}, {"text": "美国采用的高血压诊断标准是（  ）", "options": ["A.收缩压≥120mmHg或舒张压≥80mmHg", "B.收缩压≥130mmHg或舒张压≥80mmHg", "C.收缩压≥140mmHg或舒张压≥90mmHg", "D.收缩压≥140mmHg或舒张压≥85mmHg", "E.收缩压≥150mmHg或舒张压≥95mmHg"], "answer": "B", "explanation": "美国采用的高血压诊断标准为收缩压≥130mmHg或舒张压≥80mmHg，低于我国收缩压≥140mmHg或舒张压≥90mmHg的标准。"}, {"text": "1959—1979年我国高血压患者每年增加（  ）", "options": ["A.50万", "B.100万", "C.200万", "D.300万", "E.700万"], "answer": "B", "explanation": "1959—1979年我国高血压患者每年增加100万，此后增长速度明显加快。"}, {"text": "1991—2002年我国高血压患者每年增加约（  ）", "options": ["A.100万", "B.300万", "C.500万", "D.700万", "E.900万"], "answer": "D", "explanation": "1991—2002年我国高血压患者每年增加约700万，同期增速高于1980—1990年的每年增加约300万。"}, {"text": "2002年我国高血压患者的治疗率为（  ）", "options": ["A.6.1%", "B.12.2%", "C.24.7%", "D.26.6%", "E.30.2%"], "answer": "C", "explanation": "2002年我国高血压患者治疗率为24.7%，高于1991年的12.2%。"}, {"text": "2002年我国高血压患者的控制率为（  ）", "options": ["A.2.9%", "B.6.1%", "C.12.2%", "D.24.7%", "E.30.2%"], "answer": "B", "explanation": "2002年我国高血压患者控制率为6.1%，虽高于1991年的2.9%，但整体控制率仍很低。"}, {"text": "高血压肾损害是指（  ）", "options": ["A.高血压造成的肾脏结构和功能的损害", "B.高血压引起的心肌肥厚", "C.高血压引起的视网膜病变", "D.高血压引起的脑血管病变", "E.高血压引起的下肢动脉硬化"], "answer": "A", "explanation": "高血压肾损害是指高血压造成的肾脏结构和功能的损害，属于高血压的重要靶器官损害。"}, {"text": "高血压患者中最终出现肾功能不全的比例约为（  ）", "options": ["A.8%", "B.12%", "C.18%", "D.28%", "E.49%"], "answer": "C", "explanation": "高血压患者中约18%最终出现肾功能不全，说明高血压肾损害危害性大。"}, {"text": "在美国，尿毒症患者由高血压引起的比例为（  ）", "options": ["A.18%", "B.25%", "C.33%", "D.49%", "E.58%"], "answer": "D", "explanation": "在美国，49%的尿毒症患者是由于高血压引起的，高血压是导致尿毒症的重要原因。"}, {"text": "高血压肾损害的早期表现是（  ）", "options": ["A.夜尿增多，尿分析中有蛋白尿", "B.肉眼血尿伴剧烈腰痛", "C.少尿伴全身水肿", "D.尿频、尿急、尿痛", "E.尿中出现大量白细胞"], "answer": "A", "explanation": "高血压肾损害的早期表现为夜尿增多，尿分析中有蛋白尿，出现这些表现应尽早干预。"}, {"text": "血压水平为120/80～130/85mmHg时，患者进展为尿毒症的相对危险度是（  ）", "options": ["A.1.00", "B.1.62", "C.1.98", "D.2.59", "E.3.86"], "answer": "B", "explanation": "血压120/80～130/85mmHg时尿毒症相对危险度为1.62，提示血压轻度升高即增加尿毒症风险。"}, {"text": "血压水平为140/90～160/100mmHg时，患者进展为尿毒症的相对危险度是（  ）", "options": ["A.1.62", "B.1.98", "C.2.59", "D.3.86", "E.3.88"], "answer": "C", "explanation": "血压140/90～160/100mmHg时尿毒症相对危险度为2.59，随着血压增高，慢性肾脏病进展为尿毒症的风险不断增加。"}, {"text": "血压水平大于210/120mmHg时，患者进展为尿毒症的相对危险度是（  ）", "options": ["A.1.98", "B.2.59", "C.3.86", "D.3.88", "E.4.25"], "answer": "E", "explanation": "血压＞210/120mmHg时尿毒症相对危险度高达4.25，是血压＜120/80mmHg时的4倍以上。"}, {"text": "治疗高血压的药物品种繁多，但其治疗高血压的共同目标是（  ）", "options": ["A.降低血压", "B.减慢心率", "C.降低血糖", "D.降低血脂", "E.减轻体重"], "answer": "A", "explanation": "治疗高血压的药物品种繁多，但其治疗高血压的共同目标为降低血压；对每一个体，凡能有效控制血压并适宜长期治疗的药物就是合理的选择。"}, {"text": "高血压药物治疗中强调个体化，其含义是（  ）", "options": ["A.所有患者使用同一种首选药物", "B.没有适合每一个人的“好药”", "C.血压正常后即可停用药物", "D.只根据血压数值选药，不考虑肾脏", "E.一律从最大剂量开始用药"], "answer": "B", "explanation": "高血压药物治疗强调个体化，即没有适合每一个人的“好药”；在平稳降压的同时应保护肾脏等靶器官。"}, {"text": "阻断慢性肾脏病疾病进展的关键是（  ）", "options": ["A.尽早控制高血压和蛋白尿", "B.长期卧床休息", "C.限制所有蛋白质摄入", "D.定期输血", "E.常规使用抗生素"], "answer": "A", "explanation": "早期肾功能可逆，尽早控制高血压和蛋白尿是阻断慢性肾脏病疾病进展的关键。"}, {"text": "预计2010年糖尿病的发病率约比2000年高（  ）", "options": ["A.25%", "B.37%", "C.47%", "D.57%", "E.67%"], "answer": "D", "explanation": "近十年来糖尿病发病率明显增高，特别是在亚洲，预计2010年糖尿病的发病率约比2000年高57%。"}, {"text": "预计2010年患糖尿病的人数约为（  ）", "options": ["A.0.3亿人", "B.0.8亿人", "C.1.3亿人", "D.2.3亿人", "E.3.3亿人"], "answer": "C", "explanation": "预计2010年约1.3亿人患有糖尿病，糖尿病发病率明显增高，特别是在亚洲。"}, {"text": "我国慢性肾病的首位住院病因是（  ）", "options": ["A.糖尿病相关慢性肾病", "B.原发性肾小球肾炎", "C.高血压肾损害", "D.多囊肾", "E.尿路感染"], "answer": "A", "explanation": "糖尿病相关慢性肾病（DM-CKD）已成为我国慢性肾病的首位住院病因，其住院比例持续上升。"}, {"text": "关于我国新增血液透析患者的病因，糖尿病相关慢性肾病的作用是（  ）", "options": ["A.是导致我国新增血透患者的主要原因且比例持续上升", "B.对新增血透患者没有影响", "C.仅在老年患者中起作用", "D.仅在1型糖尿病患者中起作用", "E.随年份延长比例不断下降"], "answer": "A", "explanation": "糖尿病相关慢性肾脏病是导致我国新增血透患者的主要原因，且比例持续上升。"}, {"text": "糖尿病患者中可能进展到糖尿病肾病的比例约为（  ）", "options": ["A.10%", "B.20%", "C.30%", "D.40%", "E.50%"], "answer": "C", "explanation": "糖尿病患者中有30%可能会进展到糖尿病肾病，糖尿病肾病是糖尿病的重要靶器官损害。"}, {"text": "由糖尿病蛋白尿发展到尿毒症，10年内约达（  ）", "options": ["A.25%", "B.35%", "C.50%", "D.65%", "E.75%"], "answer": "C", "explanation": "由糖尿病蛋白尿发展到尿毒症，6年内约达25%、10年约达50%、15年约达75%。"}, {"text": "糖尿病肾病早期常表现为（  ）", "options": ["A.大量蛋白尿", "B.微量白蛋白尿", "C.肉眼血尿", "D.白细胞尿", "E.脓尿"], "answer": "B", "explanation": "糖尿病肾病早期常表现为微量白蛋白尿，大多数早期糖尿病肾病是通过肾脏常规筛查发现后诊断的。"}, {"text": "推荐作为糖尿病肾病早期筛查指标的检查是（  ）", "options": ["A.尿白蛋白/肌酐比值（UACR）", "B.尿比重", "C.尿pH值", "D.尿糖定性", "E.尿红细胞计数"], "answer": "A", "explanation": "白蛋白尿筛查方法简单、易操作，可敏感且特异地反映肾小球通透性改变，因此推荐以尿白蛋白/肌酐比值（UACR）作为糖尿病肾病的早期筛查指标。"}, {"text": "评价肾脏功能的重要指标是（  ）", "options": ["A.估算肾小球滤过率（eGFR）", "B.尿比重", "C.血尿酸", "D.血红蛋白", "E.尿白细胞"], "answer": "A", "explanation": "估算肾小球滤过率（eGFR）是评价肾脏功能的重要指标。"}, {"text": "所有2型糖尿病患者以及病程≥5年的1型糖尿病患者，至少多长时间进行一次肾脏病的筛查（  ）", "options": ["A.每半年一次", "B.每年一次", "C.每2年一次", "D.每3年一次", "E.每5年一次"], "answer": "B", "explanation": "所有2型糖尿病患者以及病程≥5年的1型糖尿病患者至少每年进行一次肾脏病的筛查，建议采用UACR（mg/g）和eGFR。"}, {"text": "糖尿病患者UACR&gt;300mg/g和/或eGFR为30～60ml/min/1.73m²时，应每年监测至少（  ）", "options": ["A.1次", "B.2次", "C.3次", "D.4次", "E.6次"], "answer": "B", "explanation": "糖尿病患者UACR&gt;300mg/g和/或eGFR 30～60ml/min/1.73m²时，应每年监测≥2次以指导治疗。"}, {"text": "糖尿病治疗总策略强调的原则是（  ）", "options": ["A.早期、长期、综合、个体化", "B.短期、单一、统一、标准化", "C.仅药物降糖，无需长期管理", "D.以手术为主，药物为辅", "E.只在出现肾脏损害后开始治疗"], "answer": "A", "explanation": "糖尿病治疗总策略强调早期、长期、综合、个体化的原则，并应尽早注意有无肾脏损害。"}, {"text": "糖尿病的综合治疗措施不包括（  ）", "options": ["A.宣传教育", "B.自我监测", "C.药物治疗", "D.体育锻炼", "E.手术切除胰腺"], "answer": "E", "explanation": "糖尿病的综合治疗措施包括宣传教育、自我监测、药物治疗、体育锻炼和饮食治疗；手术切除胰腺不属于糖尿病的综合治疗措施。"}, {"text": "糖尿病肾病药物治疗中，除血糖、血压、血脂控制和管理外，还应（  ）", "options": ["A.积极控制蛋白尿", "B.长期使用抗生素", "C.常规使用利尿剂减轻水肿", "D.严格限制饮水", "E.常规输血"], "answer": "A", "explanation": "糖尿病肾病药物治疗包括血糖控制和管理、血压控制和管理、血脂控制和管理，同时应积极控制蛋白尿。"}, {"text": "据流行病学统计，目前我国高尿酸血症患者接近（  ）", "options": ["A.0.7亿", "B.1.1亿", "C.1.3亿", "D.1.7亿", "E.3.3亿"], "answer": "D", "explanation": "据流行病学统计，目前我国高尿酸血症患者接近1.7亿，且持续上升。"}, {"text": "目前我国高尿酸血症的患病率为（  ）", "options": ["A.5.3%", "B.8.3%", "C.10.3%", "D.13.3%", "E.16.3%"], "answer": "D", "explanation": "目前我国高尿酸血症患病率达到了13.3%，且持续上升，已成为继高血压、高血糖、高血脂后的“第四高”。"}, {"text": "高尿酸血症已成为继高血压、高血糖、高血脂后的（  ）", "options": ["A.“第四高”", "B.“第五高”", "C.“第一高”", "D.“新三高”", "E.“继发高”"], "answer": "A", "explanation": "高尿酸血症已成为继高血压、高血糖、高血脂后的“第四高”，同时痛风病人也已超过了7800万。"}, {"text": "我国痛风病人的人数已超过（  ）", "options": ["A.1800万", "B.3800万", "C.5800万", "D.7800万", "E.9800万"], "answer": "D", "explanation": "目前我国痛风病人已超过7800万，而高尿酸血症患者接近1.7亿。"}, {"text": "高尿酸血症正在成为我国居民健康的（  ）", "options": ["A.“新危险因素”", "B.“唯一危险因素”", "C.“保护因素”", "D.“非致病因素”", "E.“次要检验指标”"], "answer": "A", "explanation": "随着生活水平迅速提高和饮食结构改变，高尿酸血症正在成为我国居民健康的“新危险因素”，除了可引发痛风发作，还有可能引起肾脏病变。"}, {"text": "与高尿酸血症发病密切相关的饮食变化是（  ）", "options": ["A.蛋白质、富有嘌呤食物和富含果糖饮食及饮酒（特别是啤酒）增加", "B.长期素食", "C.饮水量明显增加", "D.蛋白质摄入明显减少", "E.果糖摄入减少"], "answer": "A", "explanation": "随着生活水平迅速提高和饮食结构改变，蛋白质、富有嘌呤食物和富含果糖饮食以及饮酒（特别是啤酒）增加，与高尿酸血症发病密切相关。"}, {"text": "血尿酸水平升高沉积于肾脏可引起（  ）", "options": ["A.痛风性肾病、尿酸结石", "B.痛风性关节炎", "C.动脉粥样硬化", "D.诱发或加重糖尿病", "E.关节变形"], "answer": "A", "explanation": "血尿酸水平升高沉积于肾脏可引起痛风性肾病、尿酸结石，严重时可导致尿毒症。"}, {"text": "血尿酸水平升高沉积于胰腺B细胞可引起（  ）", "options": ["A.诱发或加重糖尿病", "B.痛风性关节炎", "C.尿酸性结石", "D.动脉粥样硬化", "E.关节变形"], "answer": "A", "explanation": "血尿酸水平升高沉积于胰腺B细胞可诱发或加重糖尿病，属于高尿酸血症的代谢并发症。"}, {"text": "长期高尿酸血症可导致的肾脏病变是（  ）", "options": ["A.尿酸肾病（痛风肾）", "B.肾淀粉样变", "C.肾脏脂肪变", "D.肾结核", "E.急性肾小球肾炎"], "answer": "A", "explanation": "长期高尿酸可导致尿酸肾病（痛风肾），其病理改变为慢性尿酸盐肾病。"}, {"text": "慢性尿酸盐肾病的结石在影像学上可表现为（  ）", "options": ["A.阳性结石", "B.阴性结石", "C.混合性结石", "D.感染性结石", "E.胱氨酸结石"], "answer": "B", "explanation": "长期高尿酸可导致尿酸肾病（痛风肾），慢性尿酸盐肾病在影像学上可表现为阴性结石，其结晶成分为单钠尿酸盐结晶。"}, {"text": "慢性尿酸盐肾病的特征性病理改变是（  ）", "options": ["A.单钠尿酸盐结晶沉积", "B.淀粉样物质沉积", "C.胆固醇结晶沉积", "D.草酸钙结晶沉积", "E.含铁血黄素沉积"], "answer": "A", "explanation": "长期高尿酸可导致尿酸肾病（痛风肾），其病理改变为慢性尿酸盐肾病，特征性表现为单钠尿酸盐结晶沉积。"}]}, {"type": "multiple", "questions": [{"text": "关于高血压肾损害的危害性与早期表现，下列表述正确的有（  ）", "options": ["Ａ.高血压患者中约18%最终出现肾功能不全", "Ｂ.在美国，49%的尿毒症患者由高血压引起", "Ｃ.高血压肾损害的早期表现为夜尿增多", "Ｄ.高血压肾损害早期尿分析中有蛋白尿", "Ｅ.高血压肾损害只发生于舒张压升高者"], "answer": "ABCD", "explanation": "高血压肾损害的危害性表现为高血压患者中约18%最终出现肾功能不全，在美国49%的尿毒症患者是由于高血压引起的；其早期表现为夜尿增多、尿分析中有蛋白尿。收缩压与舒张压升高均可造成肾脏损害，故E错误。"}, {"text": "关于不同血压水平与尿毒症的相对危险度，下列数值正确的有（  ）", "options": ["Ａ.血压120/80～130/85mmHg时为1.62", "Ｂ.血压135/85～140/90mmHg时为1.98", "Ｃ.血压140/90～160/100mmHg时为2.59", "Ｄ.血压160/100～180/110mmHg时为3.86", "Ｅ.血压＞210/120mmHg时为3.88"], "answer": "ABCD", "explanation": "不同血压水平对应的尿毒症相对危险度为：＜120/80mmHg为1，120/80～130/85mmHg为1.62，135/85～140/90mmHg为1.98，140/90～160/100mmHg为2.59，160/100～180/110mmHg为3.86，180/110～210/120mmHg为3.88，＞210/120mmHg为4.25。故E中＞210/120mmHg的相对危险度应为4.25，而不是3.88。"}, {"text": "高血压药物控制与随访的要点包括（  ）", "options": ["Ａ.平稳降压", "Ｂ.强调个体化，没有适合每一个人的“好药”", "Ｃ.保护肾脏等靶器官", "Ｄ.高血压患者尽早在肾内科门诊随访", "Ｅ.所有高血压患者必须使用同一种降压药物"], "answer": "ABCD", "explanation": "高血压的药物控制包括平稳降压，并强调个体化，即没有适合每一个人的“好药”；同时应保护肾脏等靶器官，高血压患者应尽早在肾内科门诊随访。药物选择因人而异，故E错误。"}, {"text": "关于慢性肾脏病的常见认识误区与早期发现，下列表述正确的有（  ）", "options": ["Ａ.不肿不代表没有肾脏病", "Ｂ.腰不痛不代表没有肾脏病", "Ｃ.慢性肾脏病多起病隐匿，不肿、腰不痛并不代表不存在肾脏病", "Ｄ.通过定期尿分析和肾功能检查有助于早期发现慢性肾脏病", "Ｅ.只有出现明显水肿时才需要排查慢性肾脏病"], "answer": "ABCD", "explanation": "不肿、腰不痛并不代表没有肾脏病，慢性肾脏病多起病隐匿，公众对不肿、腰不痛就没有肾脏病的认识存在误区；通过定期尿分析和肾功能检查有助于早期发现。仅凭是否出现水肿判断有无肾脏病是错误的，故E错误。"}, {"text": "慢性肾脏病的其他危险因素包括（  ）", "options": ["Ａ.蛋白尿", "Ｂ.营养不良", "Ｃ.高脂血症", "Ｄ.吸烟", "Ｅ.高钾血症"], "answer": "ABCD", "explanation": "慢性肾脏病的其他危险因素包括蛋白尿、营养不良、高脂血症、吸烟、贫血及其他因素；高钾血症不属于所列的其他危险因素，故E错误。"}, {"text": "关于世界肾脏病日与慢性肾脏病的现状，下列表述正确的有（  ）", "options": ["Ａ.世界肾脏病日由国际肾脏病学会和国际肾脏基金联盟联合提议设立", "Ｂ.世界肾脏病日定为每年3月份的第二个星期四", "Ｃ.慢性肾脏病已成为继心脑血管病、肿瘤、糖尿病之后又一个威胁人类健康的疾病", "Ｄ.全球一般人群慢性肾脏病患病率高达14.3%", "Ｅ.预计到2040年慢性肾脏病将在全球导致死亡的主要原因中排名第十位"], "answer": "ABCD", "explanation": "世界肾脏病日由国际肾脏病学会和国际肾脏基金联盟联合提议设立，定为每年3月份的第二个星期四；慢性肾脏病已成为继心脑血管病、肿瘤、糖尿病之后又一个威胁人类健康的疾病，全球一般人群患病率高达14.3%。预计到2040年慢性肾脏病在全球导致死亡的主要原因中排名第五，故E错误。"}, {"text": "关于糖尿病相关慢性肾病，下列表述正确的有（  ）", "options": ["Ａ.糖尿病相关慢性肾病已成为我国慢性肾病的首位住院病因", "Ｂ.糖尿病相关慢性肾病是导致我国新增血透患者的主要原因", "Ｃ.糖尿病相关慢性肾病的住院比例持续上升", "Ｄ.大多数早期糖尿病肾病是通过肾脏常规筛查发现后诊断的", "Ｅ.糖尿病肾病早期常表现为大量蛋白尿"], "answer": "ABCD", "explanation": "糖尿病相关慢性肾病已成为我国慢性肾病的首位住院病因，也是导致我国新增血透患者的主要原因，其比例持续上升；大多数早期糖尿病肾病是通过肾脏常规筛查发现后诊断的，早期常表现为微量白蛋白尿，故E错误。"}, {"text": "关于糖尿病患者的肾脏病筛查建议，下列表述正确的有（  ）", "options": ["Ａ.所有2型糖尿病患者以及病程≥5年的1型糖尿病患者至少每年进行一次肾脏病的筛查", "Ｂ.筛查建议采用UACR（mg/g）和eGFR", "Ｃ.糖尿病患者UACR&gt;300mg/g和/或eGFR 30～60ml/min/1.73m²应每年监测≥2次以指导治疗", "Ｄ.有条件的基层医疗卫生机构应设立并正确报告UACR、eGFR检测项目", "Ｅ.糖尿病患者只要血糖控制良好，就无需进行肾脏病筛查"], "answer": "ABCD", "explanation": "所有2型糖尿病患者以及病程≥5年的1型糖尿病患者至少每年进行一次肾脏病的筛查，建议采用UACR（mg/g）和eGFR；UACR&gt;300mg/g和/或eGFR 30～60ml/min/1.73m²的患者应每年监测≥2次；有条件的基层医疗卫生机构应设立并正确报告UACR、eGFR检测项目。定期筛查是早期发现糖尿病肾病的基础，故E错误。"}, {"text": "关于糖尿病的治疗总策略与综合治疗措施，下列表述正确的有（  ）", "options": ["Ａ.治疗原则强调早期、长期、综合、个体化", "Ｂ.应尽早注意有无肾脏损害", "Ｃ.综合治疗措施包括宣传教育", "Ｄ.综合治疗措施包括自我监测", "Ｅ.糖尿病治疗以药物为主，不需要饮食治疗和体育锻炼"], "answer": "ABCD", "explanation": "糖尿病治疗总策略强调早期、长期、综合、个体化的原则，并尽早注意有无肾脏损害；综合治疗措施包括宣传教育、自我监测、药物治疗、体育锻炼和饮食治疗，故E错误。"}, {"text": "关于糖尿病肾病的药物治疗，下列表述正确的有（  ）", "options": ["Ａ.包括血糖控制和管理", "Ｂ.包括血压控制和管理", "Ｃ.包括血脂控制和管理", "Ｄ.应积极控制蛋白尿", "Ｅ.只需控制血糖，无须控制血压和血脂"], "answer": "ABCD", "explanation": "糖尿病肾病的药物治疗包括血糖控制和管理、血压控制和管理、血脂控制和管理，同时应积极控制蛋白尿；仅控制血糖不能延缓糖尿病肾病进展，故E错误。"}, {"text": "2型糖尿病的易患人群相关因素包括（  ）", "options": ["Ａ.有糖尿病家族史", "Ｂ.肥胖", "Ｃ.缺乏体力活动", "Ｄ.曾经分娩过巨大胎儿的妇女", "Ｅ.年龄因素与2型糖尿病的发病无关"], "answer": "ABCD", "explanation": "容易患2型糖尿病的人群相关因素包括有糖尿病家族史、疾病和生活压力、肥胖、既往有妊娠的妇女、不良的饮食及生活习惯、缺乏体力活动、年龄因素以及曾经分娩过巨大胎儿的妇女；年龄因素是其中之一，故E错误。"}, {"text": "关于糖尿病蛋白尿进展到尿毒症及糖尿病肾病的比例，下列表述正确的有（  ）", "options": ["Ａ.由糖尿病蛋白尿发展到尿毒症6年内约达25%", "Ｂ.由糖尿病蛋白尿发展到尿毒症10年约达50%", "Ｃ.由糖尿病蛋白尿发展到尿毒症15年约达75%", "Ｄ.糖尿病患者中有30%可能会进展到糖尿病肾病", "Ｅ.糖尿病患者不会进展为糖尿病肾病"], "answer": "ABCD", "explanation": "据统计，由糖尿病蛋白尿发展到尿毒症6年内约达25%、10年约达50%、15年约达75%；糖尿病患者中有30%可能会进展到糖尿病肾病。糖尿病肾病是糖尿病的重要靶器官损害，故E错误。"}, {"text": "高尿酸血症对人体的危害包括（  ）", "options": ["Ａ.沉积于关节可引起痛风性关节炎、关节变形", "Ｂ.沉积于血管可引起动脉粥样硬化", "Ｃ.沉积于血管可加重冠心病和高血压", "Ｄ.沉积于胰腺B细胞可诱发或加重糖尿病", "Ｅ.高尿酸血症对关节、血管和胰腺均无影响"], "answer": "ABCD", "explanation": "血尿酸水平升高沉积于关节可引起痛风性关节炎、关节变形；沉积于血管可引起动脉粥样硬化，加重冠心病和高血压；沉积于胰腺B细胞可诱发或加重糖尿病。高尿酸血症危害广泛，故E错误。"}, {"text": "关于长期高尿酸导致的肾脏损害，下列表述正确的有（  ）", "options": ["Ａ.长期高尿酸可导致尿酸肾病（痛风肾）", "Ｂ.慢性尿酸盐肾病可见尿酸盐结晶沉积的病理改变", "Ｃ.其结晶成分为单钠尿酸盐结晶", "Ｄ.影像学上可表现为阴性结石", "Ｅ.高尿酸血症不会引起肾脏病变"], "answer": "ABCD", "explanation": "长期高尿酸可导致尿酸肾病（痛风肾），其病理改变为慢性尿酸盐肾病，可见单钠尿酸盐结晶沉积，影像学上可表现为阴性结石。血尿酸沉积于肾脏可引起痛风性肾病、尿酸结石，严重时导致尿毒症，故E错误。"}, {"text": "痛风的治疗策略包括（  ）", "options": ["Ａ.饮食治疗", "Ｂ.药物控制尿酸", "Ｃ.早期检测和保护肾功能", "Ｄ.根据肾脏排泄能力选择降尿酸药物", "Ｅ.仅在关节疼痛时止痛，平时不监测和保护肾功能"], "answer": "ABCD", "explanation": "痛风的治疗策略包括饮食治疗、药物控制尿酸、早期检测和保护肾功能；缓解期以降尿酸为主，应根据肾脏排泄能力选择药物。不坚持治疗是我国痛风患者常见的认识误区，故E错误。"}, {"text": "关于痛风不同病程分期的药物治疗原则，下列表述正确的有（  ）", "options": ["Ａ.急性期以镇痛为主", "Ｂ.急性期前期未用降尿酸药物者不使用降尿酸药物", "Ｃ.缓解期以降尿酸为主", "Ｄ.缓解期根据肾脏排泄能力选择降尿酸药物", "Ｅ.急性期应立即大剂量加用降尿酸药物"], "answer": "ABCD", "explanation": "痛风急性期以阵痛为主，前期未用降尿酸药物者不使用降尿酸药物；缓解期以降尿酸为主，根据肾脏排泄能力选择药物；慢性期镇痛与降尿酸同时进行，镇痛药小剂量联合长期用药。急性期立即大剂量加用降尿酸药物不符合分期治疗原则，故E错误。"}, {"text": "关于治疗期间出现痛风发作（转移性关节炎），下列表述正确的有（  ）", "options": ["Ａ.治疗期间痛风发作并非治疗不当", "Ｂ.治疗过程中随着尿酸水平降低，沉积在关节周围组织中的尿酸盐结晶会脱落或者降解", "Ｃ.尿酸盐结晶脱落或者降解可引发新的痛风性关节炎发作", "Ｄ.这种发作称为转移性关节炎", "Ｅ.出现这种发作应立即停止全部治疗"], "answer": "ABCD", "explanation": "治疗期间痛风发作，并非治疗不当，而是治疗过程中随着尿酸水平的降低，沉积在关节周围组织中的尿酸盐结晶会脱落或者降解，引发新的痛风性关节炎发作，称为转移性关节炎。出现该情况应调整治疗而非停止全部治疗，故E错误。"}, {"text": "痛风及高尿酸血症治疗现状中，患者常见的认识误区包括（  ）", "options": ["Ａ.浑然不知", "Ｂ.不痛不治", "Ｃ.痛止不治", "Ｄ.不坚持治", "Ｅ.定期随访并长期规范降尿酸治疗"], "answer": "ABCD", "explanation": "数据研究证实我国痛风治疗率整体偏低，患者疾病认识往往存在浑然不知、不痛不治、痛止不治、不坚持治等误区。定期随访并长期规范降尿酸治疗是正确做法，不是误区，故E错误。"}, {"text": "关于我国高尿酸血症与痛风的流行情况，下列表述正确的有（  ）", "options": ["Ａ.我国高尿酸血症患者接近1.7亿", "Ｂ.我国高尿酸血症患病率达到13.3%", "Ｃ.高尿酸血症已成为继高血压、高血糖、高血脂后的“第四高”", "Ｄ.我国痛风病人已超过7800万", "Ｅ.近年来我国高尿酸血症患病率持续下降"], "answer": "ABCD", "explanation": "据流行病学统计，我国高尿酸血症患者接近1.7亿，患病率达到13.3%且持续上升，已成为继高血压、高血糖、高血脂后的“第四高”；痛风病人已超过7800万。患病率持续上升而非下降，故E错误。"}, {"text": "关于糖尿病肾病早期筛查相关指标，下列表述正确的有（  ）", "options": ["Ａ.UACR指尿白蛋白/肌酐比值", "Ｂ.eGFR指估算肾小球滤过率", "Ｃ.白蛋白尿筛查方法简单、易操作", "Ｄ.UACR可敏感且特异地反映肾小球通透性改变", "Ｅ.eGFR不能用于评价肾脏功能"], "answer": "ABCD", "explanation": "UACR指尿白蛋白/肌酐比值，eGFR指估算肾小球滤过率；白蛋白尿筛查方法简单、易操作，可敏感且特异地反映肾小球通透性改变，故推荐UACR作为糖尿病肾病的早期筛查指标；eGFR是评价肾脏功能的重要指标，故E错误。"}]}, {"type": "short", "questions": [{"text": "简述慢性肾脏病的流行病学现状。", "options": [], "answer": "【国外发病率】慢性肾脏病的发病率在世界范围内呈上升趋势，国外慢性肾脏病发病率为11%～16.2%。【国内发病率】国内慢性肾脏病发病率为10.8%。【患病率】全球一般人群慢性肾脏病患病率高达14.3%；我国18岁以上人群慢性肾脏病患病率为10.8%。【死亡排名预测】预计到2040年，慢性肾脏病将在全球导致死亡的主要原因中排名第五。【透析患者数量】截止2021年底，我国血液透析患者数量约74.9万人，近年来我国透析患者人数增长迅速，慢性肾脏病引起的透析人数逐年增多。", "explanation": "慢性肾脏病已成为继心脑血管病、肿瘤、糖尿病之后又一个威胁人类健康的疾病，其发病率、患病率明显上升，带来严重的社会经济问题，已成为全球共同关注事件。世界肾脏病日由国际肾脏病学会和国际肾脏基金联盟联合提议设立，定为每年3月份的第二个星期四，用以提高公众对慢性肾脏病的认识。"}, {"text": "简述高血压与肾脏损害的关系及高血压肾损害的防控要点。", "options": [], "answer": "【高血压诊断标准】未服用抗高血压药情况下，收缩压≥140mmHg或舒张压≥90mmHg；美国为收缩压≥130mmHg或舒张压≥80mmHg。【定义】高血压肾损害是指高血压造成的肾脏结构和功能的损害。【危害性】高血压患者中约18%最终出现肾功能不全；在美国，49%的尿毒症患者是由于高血压引起的。【早期表现】夜尿增多；尿分析中有蛋白尿。【风险随血压升高】随着血压增高，慢性肾脏病进展为尿毒症的风险不断增加，如血压120/80～130/85mmHg时相对危险度为1.62，140/90～160/100mmHg时为2.59，＞210/120mmHg时达4.25。【防控要点】平稳降压，强调个体化，没有适合每一个人的“好药”；保护肾脏等靶器官，高血压患者尽早在肾内科门诊随访；早期肾功能可逆，尽早控制高血压和蛋白尿是阻断慢性肾脏病疾病进展的关键。", "explanation": "高血压是我国尿毒症的重要病因之一，高血压肾损害早期症状隐匿，可仅表现为夜尿增多和尿分析中蛋白尿，因此高血压患者应定期检查尿分析和肾功能。降压治疗应在平稳降压的同时兼顾靶器官保护，个体化选择适宜长期治疗的药物。"}, {"text": "简述糖尿病相关慢性肾病的筛查建议及糖尿病治疗总策略。", "options": [], "answer": "【筛查对象与频次】所有2型糖尿病患者以及病程≥5年的1型糖尿病患者至少每年进行一次肾脏病的筛查，建议采用UACR（mg/g）和eGFR。【加强监测】糖尿病患者UACR&gt;300mg/g和/或eGFR 30～60ml/min/1.73m²应每年监测≥2次以指导治疗。【基层能力建设】在有条件的基层医疗卫生机构设立并正确报告UACR、eGFR检测项目。【早期发现】大多数早期糖尿病肾病是通过肾脏常规筛查发现后诊断的，早期常表现为微量白蛋白尿；白蛋白尿筛查方法简单、易操作，可敏感且特异地反映肾小球通透性改变，因此推荐以UACR作为早期筛查指标，eGFR是评价肾脏功能的重要指标。【治疗总策略】强调早期、长期、综合、个体化的原则，并尽早注意有无肾脏损害。【药物治疗】血糖、血压、血脂控制和管理，同时积极控制蛋白尿。", "explanation": "糖尿病相关慢性肾病已成为我国慢性肾病的首位住院病因，也是导致我国新增血透患者的主要原因且比例持续上升。糖尿病患者中有30%可能会进展到糖尿病肾病，由糖尿病蛋白尿发展到尿毒症6年内约达25%、10年约达50%、15年约达75%，因此早期筛查和综合干预对延缓疾病进展至关重要。"}, {"text": "简述高尿酸血症的危害、痛风的治疗策略及不同病程分期的药物治疗原则。", "options": [], "answer": "【危害】血尿酸水平升高沉积于关节可引起痛风性关节炎、关节变形；沉积于肾脏可引起痛风性肾病、尿酸结石，严重时导致尿毒症；沉积于血管可引起动脉粥样硬化，加重冠心病和高血压；沉积于胰腺B细胞可诱发或加重糖尿病。长期高尿酸可导致尿酸肾病（痛风肾），慢性尿酸盐肾病的病理改变可见单钠尿酸盐结晶沉积，影像学上可表现为阴性结石。【治疗策略】①饮食治疗；②药物控制尿酸；③早期检测和保护肾功能。【分期治疗原则】急性期以阵痛为主，前期未用降尿酸药物者不使用降尿酸药物；缓解期以降尿酸为主，根据肾脏排泄能力选择药物；慢性期镇痛与降尿酸同时进行，镇痛药小剂量联合长期用药。【转移性关节炎】治疗期间痛风发作并非治疗不当，而是治疗过程中随着尿酸水平的降低，沉积在关节周围组织中的尿酸盐结晶会脱落或者降解，引发新的痛风性关节炎发作。", "explanation": "我国高尿酸血症患者接近1.7亿、患病率达到13.3%，已成为继高血压、高血糖、高血脂后的“第四高”，痛风病人已超过7800万。随着生活水平迅速提高和饮食结构改变，蛋白质、富有嘌呤食物和富含果糖饮食以及饮酒（特别是啤酒）增加，高尿酸血症正在成为我国居民健康的“新危险因素”。我国痛风治疗率整体偏低，患者常存在浑然不知、不痛不治、痛止不治、不坚持治等误区。"}, {"text": "简述慢性肾脏病的其他危险因素，并说明阻断慢性肾脏病疾病进展的关键。", "options": [], "answer": "【其他危险因素】①蛋白尿；②营养不良；③高脂血症；④吸烟；⑤贫血；⑥其他。不肿、腰不痛并不代表没有肾脏病，慢性肾脏病存在多种高危因素，应加以识别。【阻断进展的关键】早期肾功能可逆，尽早控制高血压和蛋白尿是阻断慢性肾脏病疾病进展的关键。【随访与治疗要求】高血压患者应尽早在肾内科门诊随访，做到平稳降压、个体化治疗并保护肾脏等靶器官；糖尿病患者应强调早期、长期、综合、个体化的治疗原则，尽早注意有无肾脏损害。", "explanation": "蛋白尿既是肾脏损害的标志，也是促进肾功能恶化的危险因素，因此控制蛋白尿与控制高血压同为延缓慢性肾脏病进展的核心措施。慢性肾脏病多起病隐匿，公众对不肿、腰不痛就没有肾脏病的认识存在误区，应通过定期尿分析和肾功能检查实现早期发现。"}]}]}, {"num": 27, "title": "血液净化相关的药物应用2026理论考试题库", "sections": [{"type": "single", "questions": [{"text": "药物代谢动力学（PK）的定义是（  ）", "options": ["A.研究药物对机体作用规律", "B.定量研究药物体内过程及血药浓度随时间变化规律", "C.研究药物制剂工艺", "D.研究药物不良反应", "E.研究药物化学结构"], "answer": "B", "explanation": "药物代谢动力学（PK）是定量研究药物的体内过程以及血药浓度随时间而变化的规律。"}, {"text": "PK的重要参数中，评价制剂吸收程度的指标是（  ）", "options": ["A.表观分布容积", "B.生物利用度（F）", "C.血浆蛋白结合率", "D.消除速率常数", "E.半衰期"], "answer": "B", "explanation": "生物利用度（F）指药物经血管外途径给药后吸收进入体循环的药量占总给药量的百分比，是评价制剂吸收程度的指标。"}, {"text": "与分布有关的PK参数中，血浆蛋白结合率（BRPP）指的是（  ）", "options": ["A.药物在肝脏代谢的速率", "B.药物在血浆内与血浆蛋白结合的比率", "C.药物经肾排泄的比例", "D.药物在体内的总清除率", "E.药物吸收的速度"], "answer": "B", "explanation": "血浆蛋白结合率是药物在血浆内与血浆蛋白结合的比率，结合型药物不能穿透血管分布到组织。"}, {"text": "按照表观分布容积（Vd）大小的常见规律，Vd约为5L时提示（  ）", "options": ["A.药物大部分分布于血浆", "B.药物分布于细胞外液", "C.药物分布于全身体液", "D.药物集中分布至某个组织器官", "E.药物主要分布于细胞内液"], "answer": "A", "explanation": "Vd约为5L时药物大部分分布于血浆；Vd约为10~20L时分布于细胞外液；Vd约为40L时分布于全身体液；Vd大于100L时集中分布到某个组织器官或大范围组织内。"}, {"text": "关于表观分布容积（Vd）与药物排泄的关系，正确的是（  ）", "options": ["A.Vd越大药物排泄越快", "B.Vd越小药物排泄越快、体内存留时间越短", "C.Vd大小与排泄无关", "D.Vd越大体内存留时间越短", "E.Vd越小体内存留时间越长"], "answer": "B", "explanation": "Vd越小药物排泄越快、在体内存留时间越短；Vd越大药物排泄越慢、在体内存留时间越长。"}, {"text": "反映药物本身理化性质和消除器官功能的PK参数是（  ）", "options": ["A.生物利用度", "B.表观分布容积", "C.消除速率常数（Ke）", "D.血浆蛋白结合率", "E.半衰期"], "answer": "C", "explanation": "消除速率常数（Ke）是单位时间内药物的消除量与体内总量的比值，健康人其数值基本恒定，反映药物本身的理化性质和消除器官的功能。"}, {"text": "半衰期（T1/2）指的是（  ）", "options": ["A.药物吸收一半所需时间", "B.血浆药物浓度降低一半所需时间", "C.药物排泄至血药浓度为零所需时间", "D.药物达到最大效应所需时间", "E.药物与血浆蛋白结合一半所需时间"], "answer": "B", "explanation": "半衰期（T1/2）是药物在体内分布达到平衡状态后血浆药物浓度降低一半所需的时间，T1/2=0.693/Ke=0.693×Vd/CL。"}, {"text": "预测药物达到稳态血药浓度所需的时间，通常需要（  ）", "options": ["A.1个半衰期", "B.2个半衰期", "C.3个半衰期", "D.4个半衰期", "E.5个半衰期"], "answer": "E", "explanation": "通常经5个半衰期可预测达到稳态血药浓度；停药时间达到5个半衰期时药量消除大于95%。"}, {"text": "CKD患者多数药物生物利用度下降的原因之一是（  ）", "options": ["A.胃内pH降低", "B.唾液尿素转化为氨致pH增高、改变药物解离特性", "C.胃排空加快", "D.肝血流量增加", "E.血浆白蛋白升高"], "answer": "B", "explanation": "CKD时唾液高尿素通过胃脲酶转化为氨，使pH增高，改变药物的解离特性；合并使用抗酸药、H2受体拮抗剂、PPI也使pH升高，金属螯合物也影响吸收，并使呕吐增多。"}, {"text": "关于CKD时蛋白结合率变化，正确的是（
