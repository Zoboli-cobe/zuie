, "E.42～48毫当量/升"], "answer": "C", "explanation": "碳酸氢盐透析液中碳酸氢盐浓度为32～38毫当量/升。"}, {"text": "碳酸氢盐透析液pH小于7.10时会出现什么情况？", "options": ["A.血中二氧化碳分压升高", "B.透析液中出现沉淀", "C.血中二氧化碳分压降低", "D.碳酸氢根浓度升高", "E.透析液变为无色透明"], "answer": "A", "explanation": "碳酸氢盐透析液若pH小于7.10，会引起血中二氧化碳分压升高。"}, {"text": "碳酸氢盐透析液pH大于7.50时会出现什么情况？", "options": ["A.透析液中出现沉淀", "B.血中二氧化碳分压升高", "C.碳酸氢根浓度下降", "D.血pH显著升高", "E.透析液颜色变深"], "answer": "A", "explanation": "碳酸氢盐透析液若pH大于7.50，透析液中会出现沉淀，因此需要控制透析液的pH。"}, {"text": "常用透析液中钠离子的浓度范围是？", "options": ["A.110～120 mmol/L", "B.120～130 mmol/L", "C.130～140 mmol/L", "D.135～145 mmol/L", "E.145～155 mmol/L"], "answer": "D", "explanation": "常用透析液中钠离子浓度为135～145 mmol/L，正常血浆钠浓度为136～145 mmol/L。"}, {"text": "决定透析液渗透压的主要因素是哪种离子？", "options": ["A.钾离子", "B.钙离子", "C.镁离子", "D.氯离子", "E.钠离子"], "answer": "E", "explanation": "透析液钠离子浓度是决定透析液渗透压的主要因素，并直接影响透析患者的血清钠浓度。"}, {"text": "透析液中钾离子的通常浓度是？", "options": ["A.1.0 mmol/L", "B.1.25 mmol/L", "C.1.5 mmol/L", "D.2.0 mmol/L", "E.3.0 mmol/L"], "answer": "D", "explanation": "透析液钾浓度范围为1.5～3.0 mmol/L，通常浓度为2 mmol/L。"}, {"text": "透析液钙浓度的范围是？", "options": ["A.1.0～1.25 mmol/L", "B.1.25～1.75 mmol/L", "C.1.75～2.0 mmol/L", "D.2.0～2.25 mmol/L", "E.2.2～2.6 mmol/L"], "answer": "B", "explanation": "透析液钙浓度为1.25～1.75 mmol/L，其中低钙透析液为1.25 mmol/L、中等钙浓度为1.5 mmol/L、高钙透析液为1.75 mmol/L。"}, {"text": "大多数患者可以接受的中等钙浓度透析液，其钙浓度是？", "options": ["A.1.0 mmol/L", "B.1.25 mmol/L", "C.1.35 mmol/L", "D.1.5 mmol/L", "E.1.75 mmol/L"], "answer": "D", "explanation": "中等钙浓度透析液为1.5 mmol/L，为大多数患者所接受。"}, {"text": "透析液镁浓度一般为？", "options": ["A.0.25～0.5 mmol/L", "B.0.5～0.75 mmol/L", "C.0.75～1.0 mmol/L", "D.1.0～1.25 mmol/L", "E.1.25～1.5 mmol/L"], "answer": "B", "explanation": "透析液镁浓度一般为0.5～0.75 mmol/L，而正常血镁浓度为0.8～1.2 mmol/L。"}, {"text": "慢性肾衰患者血清镁浓度达到多少时，可出现神经-肌肉及循环系统的明显改变？", "options": ["A.0.8～1.2 mmol/L", "B.1.2～2.0 mmol/L", "C.2～4 mmol/L", "D.4～6 mmol/L", "E.6～8 mmol/L"], "answer": "C", "explanation": "慢性肾衰患者一般为高镁血症，当血清镁浓度达2～4 mmol/L时，可出现神经-肌肉及循环系统的明显改变。"}, {"text": "透析液中氯离子的浓度范围是？", "options": ["A.85～95 mmol/L", "B.90～100 mmol/L", "C.100～115 mmol/L", "D.115～125 mmol/L", "E.125～135 mmol/L"], "answer": "C", "explanation": "氯离子是主要的阴离子，透析液氯离子浓度与细胞外液氯离子浓度相同，为100～115 mmol/L。"}, {"text": "透析液中加入葡萄糖的主要目的是？", "options": ["A.补充能量供应", "B.纠正低血糖", "C.降低渗透压", "D.延长保存时间", "E.提高渗透压、增加超滤"], "answer": "E", "explanation": "透析液中加糖主要是为了提高渗透压、增加超滤；含糖透析液易污染，临床常用无糖透析液，需要时可静脉补糖。"}, {"text": "临床上透析液常用的含糖方式是？", "options": ["A.无糖透析液", "B.高糖透析液", "C.低糖透析液", "D.必须使用含糖透析液", "E.含糖透析液不易污染"], "answer": "A", "explanation": "含糖透析液易污染，临床常用无糖透析液，需要时可静脉补糖；透析液中的葡萄糖有高糖、低糖和无糖三种。"}, {"text": "透析液中醋酸根的浓度范围是？", "options": ["A.0.5～1 mmol/L", "B.1～2 mmol/L", "C.2～5 mmol/L", "D.5～8 mmol/L", "E.8～10 mmol/L"], "answer": "C", "explanation": "透析液中醋酸根浓度为2～5 mmol/L，加入醋酸根是为了调节透析液的pH值，并防止钙镁离子发生沉淀。"}, {"text": "A浓缩液主要由下列哪组成分构成？", "options": ["A.氯化钠、氯化钾、氯化钙、氯化镁等", "B.碳酸氢钠和氯化钠", "C.碳酸氢钠和氯化钙", "D.葡萄糖和氯化钠", "E.碳酸氢钠和氯化钾"], "answer": "A", "explanation": "A浓缩液主要由氯化钠、氯化钾、氯化钙、氯化镁、醋酸组成，pH为3～4。"}, {"text": "B浓缩液的pH范围是？", "options": ["A.1～2", "B.3～4", "C.5～6", "D.7.7～7.9", "E.8.0～8.5"], "answer": "D", "explanation": "B浓缩液由碳酸氢钠（NaHCO3）和氯化钠（NaCl）组成，pH为7.7～7.9。"}, {"text": "液体浓缩液（成品浓缩液）的缺点是？", "options": ["A.随时可以使用", "B.不需要溶解", "C.浓度稳定", "D.体积和重量大、运输费用高", "E.稀释比例可调"], "answer": "D", "explanation": "液体浓缩液的优点是随时可以使用、不需要溶解、浓度稳定；缺点是体积和重量大，增加运输费用、占用大量储存空间、有一定量的浪费且费用贵。"}, {"text": "干粉浓缩液最大的优势是？", "options": ["A.可以随时使用", "B.经济成本低、运输成本小", "C.浓度稳定不需配制", "D.便于集中供液", "E.有利于减少细菌污染"], "answer": "B", "explanation": "干粉浓缩液的最大优势是经济成本低、运输成本小、产品价格较低；缺点是使用前必须配制成浓缩液，给工作带来不便且容易发生细菌超标。"}, {"text": "浓缩液配制室每月做一次细菌培养，细菌数应不超过多少？", "options": ["A.不超过100 cfu/平方米", "B.不超过300 cfu/平方米", "C.不超过400 cfu/平方米", "D.不超过500 cfu/平方米", "E.不超过1000 cfu/平方米"], "answer": "D", "explanation": "浓缩液配制室每日空气消毒60分钟，每月做一次细菌培养，细菌数不能超过500 cfu/平方米。"}, {"text": "浓缩液配制桶消毒时须在桶外悬挂什么标示？", "options": ["A.“消毒中”", "B.“已消毒”", "C.“待使用”", "D.“配制中”", "E.“清洁区”"], "answer": "A", "explanation": "配制桶消毒时，须在桶外悬挂“消毒中”警示牌，以防止工作人员误用。"}, {"text": "浓缩液配制桶滤芯的更换要求是？", "options": ["A.每周至少更换1次", "B.每日更换1次", "C.每2日更换1次", "D.每月更换1次", "E.每季度更换1次"], "answer": "A", "explanation": "浓缩液配制桶滤芯每周至少更换1次。"}, {"text": "用干粉配制浓缩液（A液、B液）应由谁实施？", "options": ["A.透析室医生", "B.患者家属", "C.经过培训的血透室护士或技术员", "D.厂家工程师", "E.医院药剂师"], "answer": "C", "explanation": "用干粉配制浓缩液应由经过培训的血透室护士或技术员实施，并做好配制记录、有专人核查登记。"}, {"text": "配制浓缩液时，倒入透析粉后应搅拌多长时间？", "options": ["A.5分钟", "B.10分钟", "C.20分钟", "D.30分钟", "E.60分钟"], "answer": "D", "explanation": "配制流程要求先开机，再按数倒入透析粉，搅拌30分钟。"}, {"text": "标准碳酸透析液处方的pH范围是？", "options": ["A.6.9～7.1", "B.7.1～7.3", "C.7.3～7.5", "D.7.35～7.45", "E.7.5～7.7"], "answer": "B", "explanation": "标准碳酸透析液处方的pH为7.1～7.3，而正常血浆pH为7.35～7.45。"}, {"text": "判断透析粉已完全溶解的标准是？", "options": ["A.液面静止不动", "B.出现少量沉淀", "C.溶液略有浑浊", "D.有细小气泡产生", "E.溶液无色透明无杂质"], "answer": "E", "explanation": "开机搅拌至完全溶解，以溶液无色透明、无杂质为合格标准。"}, {"text": "配制完成的透析液装入清洁透析液桶后应标记什么？", "options": ["A.配制时间及配制者姓名", "B.患者姓名", "C.透析器型号", "D.透析机编号", "E.透析液生产批号"], "answer": "A", "explanation": "配制完成后装入清洁的透析液桶中备用，并标记配制时间及配制者姓名。"}, {"text": "集中供A液、单独在线B干粉桶的供液方式，其主要目的是？", "options": ["A.实现个体化治疗", "B.降低人力成本", "C.便于储存运输", "D.减少用水量", "E.防止细菌污染"], "answer": "E", "explanation": "集中供A液、单独在线B干粉桶的目的是防止细菌污染；集中供B液、单独供A液的方式则用于实现个体化治疗。"}, {"text": "内毒素检测取样前，对透析液出口应如何处理？", "options": ["A.用75%乙醇消毒", "B.用含氯消毒剂消毒", "C.用过氧乙酸消毒", "D.无需消毒", "E.用无菌水冲洗"], "answer": "D", "explanation": "内毒素检测取样前无需对透析液出口消毒，否则会出现假阴性结果；取样时让透析液自由流出1分钟后，用专用吸液管或注射器从透析器快速接头出液口取样。"}, {"text": "用于血气分析的透析液样品应采用何种送检方式？", "options": ["A.室温放置后送检", "B.冷冻后送检", "C.离心后取上清送检", "D.密封注射器立即送检", "E.加入防腐剂后送检"], "answer": "D", "explanation": "用于血气分析的样品要求用密封注射器立即送检；其他生化检测样品用注射器在透析机取样口取样后也应尽快送检。"}]}, {"type": "multiple", "questions": [{"text": "集中供液系统的组成部分包括哪些？", "options": ["Ａ.A浓缩液搅拌罐", "Ｂ.A浓缩液储存罐", "Ｃ.B浓缩液储存罐", "Ｄ.滤过器", "Ｅ.血泵"], "answer": "ABCD", "explanation": "集中供液系统由A浓缩液搅拌罐、A浓缩液储存罐、B浓缩液储存罐、滤过器和搅拌器等组成；血泵属于透析机上的部件，不属于供液系统。"}, {"text": "理想的透析液所要求的生理学因素包括哪些？", "options": ["Ａ.能维护恒定的溶质清除率和超滤作用", "Ｂ.补充患者缺乏的物质，如钙离子", "Ｃ.供给营养物质而不增加代谢并发症", "Ｄ.渗透性物质吸收极少或不吸收", "Ｅ.含有致热原以激活免疫功能"], "answer": "ABCD", "explanation": "生理学因素要求能维护恒定的溶质清除率和超滤作用、补充患者缺乏的物质（如钙离子）、供给营养物质而不增加代谢并发症、渗透性物质吸收极少或不吸收，并纠正酸中毒、保持生理性pH；含致热原属于应被排除的情况。"}, {"text": "理想的透析液所要求的细菌学因素包括哪些？", "options": ["Ａ.无致热原", "Ｂ.无病原体", "Ｃ.不损害人体的防御机制", "Ｄ.允许含毒性微量元素", "Ｅ.对血管有不良刺激"], "answer": "ABC", "explanation": "细菌学因素要求无致热原、无病原体，且不损害人体的防御机制；允许含毒性微量元素和对血管有不良刺激属于毒性因素中不被允许的情况。"}, {"text": "理想的透析液所要求的毒性因素包括哪些？", "options": ["Ａ.不含对人体有害的物质", "Ｂ.不含毒性微量元素，如铝、铜、铬", "Ｃ.无毒性渗透物质", "Ｄ.在储存过程中不产生毒性分解产物", "Ｅ.允许含微量铜以增强导电性"], "answer": "ABCD", "explanation": "毒性因素要求不含对人体有害的物质、不含毒性微量元素（如铝、铜、铬）、无毒性渗透物质、储存过程中化学性或渗透性物质不产生毒性分解产物，并对血管无不良刺激；允许含铜与要求相违背。"}, {"text": "碳酸氢盐透析液的优点包括哪些？", "options": ["Ａ.更符合患者的生理状态", "Ｂ.迅速纠正代谢性酸中毒，心血管稳定性好", "Ｃ.可避免醋酸盐透析时常出现的头痛等不适", "Ｄ.性质稳定，不易生长细菌", "Ｅ.价格低廉，便于长期储存"], "answer": "ABC", "explanation": "碳酸氢盐透析液更符合患者的生理状态，能迅速纠正代谢性酸中毒、避免低氧血症、心血管稳定性好，并可避免醋酸盐透析时常出现的头痛等不适；其缺点恰恰是很不稳定、浓缩液易生长细菌，所以性质稳定和廉价并不是它的优点。"}, {"text": "碳酸氢盐透析液的缺点包括哪些？", "options": ["Ａ.很不稳定", "Ｂ.碳酸氢盐浓缩液易生长细菌", "Ｃ.碳酸氢根易挥发，浓度下降", "Ｄ.能迅速纠正代谢性酸中毒", "Ｅ.心血管稳定性好"], "answer": "ABC", "explanation": "碳酸氢盐透析液很不稳定，碳酸氢盐浓缩液易生长细菌，且碳酸氢根易挥发而使其浓度下降；迅速纠正代谢性酸中毒和心血管稳定性好是它的优点而非缺点。"}, {"text": "按碱基不同，透析液可以分为哪些种类？", "options": ["Ａ.乳酸盐透析液", "Ｂ.醋酸盐透析液", "Ｃ.碳酸氢盐透析液", "Ｄ.枸橼酸钠透析液", "Ｅ.葡萄糖透析液"], "answer": "ABCD", "explanation": "根据碱基的不同，透析液分为乳酸盐透析液、醋酸盐透析液、碳酸氢盐透析液和枸橼酸钠透析液四种，其中碳酸氢盐透析液最常用，枸橼酸钠透析液未来可期；葡萄糖是按含糖量区分的成分，不是按碱基划分的种类。"}, {"text": "透析液的生化检测项目包括哪些？", "options": ["Ａ.钾、钠、氯、钙、镁等离子检测", "Ｂ.血气分析", "Ｃ.渗透压测定", "Ｄ.细菌检测", "Ｅ.内毒素检测"], "answer": "ABC", "explanation": "生化检测包括钾、钠、氯、钙、镁等离子检测，血气分析（碳酸氢根、pH）和渗透压测定；细菌检测和内毒素检测属于微生物检测。"}, {"text": "透析液的微生物检测项目包括哪些？", "options": ["Ａ.细菌检测", "Ｂ.内毒素检测", "Ｃ.渗透压测定", "Ｄ.离子检测", "Ｅ.血气分析"], "answer": "AB", "explanation": "微生物检测包括细菌检测和内毒素检测；渗透压测定、离子检测和血气分析都属于生化检测。"}, {"text": "超纯透析液的临床获益包括哪些？", "options": ["Ａ.明显降低和改善微炎症反应", "Ｂ.改善营养状态", "Ｃ.增加对EPO的敏感度，减少EPO用量", "Ｄ.降低β2微球蛋白水平及透析淀粉样变", "Ｅ.升高β2微球蛋白水平"], "answer": "ABCD", "explanation": "超纯透析液可明显降低和改善病人的微炎症反应、改善透析病人的营养状态、增加对EPO的敏感度（减少EPO用量）、降低β2微球蛋白水平及透析淀粉样变（腕管综合症），并保护残余肾功能；升高β2微球蛋白水平与事实相反。"}, {"text": "液体浓缩液（成品浓缩液）的缺点包括哪些？", "options": ["Ａ.体积和重量大", "Ｂ.增加运输费用", "Ｃ.占用大量储存空间", "Ｄ.有一定浪费且费用贵", "Ｅ.需要临用前现配现溶"], "answer": "ABCD", "explanation": "液体浓缩液的缺点是体积和重量大，增加运输费用，占用大量储存空间，有一定量的浪费且费用贵；它的优点才是随时可以使用、不需要溶解，所以需要现配现溶不属于液体浓缩液的缺点。"}, {"text": "干粉浓缩液的缺点包括哪些？", "options": ["Ａ.使用前必须配制成浓缩液", "Ｂ.给工作带来不便", "Ｃ.容易发生细菌超标", "Ｄ.经济成本低", "Ｅ.运输成本小"], "answer": "ABC", "explanation": "干粉浓缩液的缺点是使用前必须配制成浓缩液后方可使用，给工作带来不便，且容易发生细菌超标；经济成本低和运输成本小是它最大的优势。"}, {"text": "关于原装干粉（干粉浓缩液配置机），正确的叙述包括哪些？", "options": ["Ａ.安装于机器的干粉支架上", "Ｂ.机器自动稀释配比、现配现用", "Ｃ.可跳过配制工序、减少污染几率", "Ｄ.成本较高", "Ｅ.需要人工称量透析粉并长时间搅拌"], "answer": "ABCD", "explanation": "原装干粉安装于机器的干粉支架上，由机器自动稀释配比、现配现用，具有方便、便于管理、跳过配制工序、减少污染几率的优点，缺点是成本高；因机器自动配比，无需人工称量和长时间搅拌。"}, {"text": "浓缩液配制室（三类环境）的要求包括哪些？", "options": ["Ａ.应位于透析室清洁区内相对独立区域", "Ｂ.周围无污染原、保持环境清洁", "Ｃ.每日空气消毒60分钟", "Ｄ.每月细菌培养≤500 cfu/平方米", "Ｅ.每日做一次细菌培养"], "answer": "ABCD", "explanation": "浓缩液配制室应位于透析室清洁区内相对独立的区域，周围无污染原并保持环境清洁，每日空气消毒60分钟，每月做一次细菌培养且细菌数不能超过500 cfu/平方米；细菌培养是每月一次而非每日一次。"}, {"text": "浓缩液配制人员的要求包括哪些？", "options": ["Ａ.由经过培训的血透室护士或技术员实施", "Ｂ.做好配制记录并有专人核查登记", "Ｃ.穿工作服，换鞋或鞋套进入配制室", "Ｄ.操作时戴口罩、手套", "Ｅ.配制室无需加锁，可自由出入"], "answer": "ABCD", "explanation": "用干粉配制浓缩液应由经过培训的血透室护士或技术员实施，做好配制记录并有专人核查登记；进入配制室须穿工作服、换鞋或鞋套，操作时戴口罩、手套；配制室应加锁，防止非工作人员进入。"}, {"text": "浓缩液配制流程中的正确做法包括哪些？", "options": ["Ａ.用反渗水刷洗搅拌桶3次", "Ｂ.注入2/3剂量的反渗水于搅拌桶内", "Ｃ.双人核对透析粉数量与种类", "Ｄ.先开机，再按数倒入透析粉搅拌30分钟", "Ｅ.将A粉与B粉混合后同时倒入配制"], "answer": "ABCD", "explanation": "配制流程要求接通电源后用反渗水刷洗搅拌桶3次，注入2/3剂量的反渗水，双人核对透析粉数量、种类（A、B粉分开放置分别配制），先开机再按数倒入透析粉并搅拌30分钟；A粉与B粉应分开配制，不能混合同时倒入。"}, {"text": "浓缩液配制的监测内容包括哪些？", "options": ["Ａ.搅拌桶和透析液桶涮洗消毒到位", "Ｂ.透析粉双人核对有记录", "Ｃ.透析液桶标识清楚、分开放置", "Ｄ.每月透析液有相关的检测记录单", "Ｅ.配制室可随意出入，无需按时消毒"], "answer": "ABCD", "explanation": "浓缩液配制监测包括搅拌桶和透析液桶涮洗消毒到位、透析粉双人核对有记录、透析液桶标识清楚并分开放置、配液室清洁无污染且每日按时消毒有记录、每月透析液有相关的检测记录单；配制室随意出入且不消毒不符合监测要求。"}, {"text": "配制和使用透析浓缩液、干粉应符合哪些要求？", "options": ["Ａ.由浓缩液或干粉加合格透析用水配制", "Ｂ.购买的浓缩液和干粉证件应齐全有效", "Ｃ.制剂室自行生产应取得相应生产许可", "Ｄ.可用自来水代替透析用水配制", "Ｅ.可使用工业级原料配制"], "answer": "ABC", "explanation": "透析液应由浓缩液（或干粉）加符合质控要求的透析用水配制；购买的浓缩液和干粉应具有国家相关部门颁发的注册证、生产许可证或经营许可证、卫生许可证；医疗机构制剂室生产血液透析浓缩液应取得《医疗器械生产企业许可证》后按标准生产；用自来水或工业级原料配制均不符合要求。"}, {"text": "关于透析液中的葡萄糖，正确的叙述包括哪些？", "options": ["Ａ.有高糖、低糖和无糖三种", "Ｂ.高糖为1～2 g/dl", "Ｃ.低糖为0.1～0.2 g/dl", "Ｄ.加糖主要是提高渗透压、增加超滤", "Ｅ.含糖透析液不易污染"], "answer": "ABCD", "explanation": "透析液中的葡萄糖有高糖（1～2 g/dl）、低糖（0.1～0.2 g/dl）和无糖三种，加糖主要是提高渗透压、增加超滤；含糖透析液易污染，临床常用无糖透析液并可静脉补糖。"}, {"text": "关于透析液的取样检测方法，正确的叙述包括哪些？", "options": ["Ａ.生化检测用注射器在透析机取样口取样", "Ｂ.血气分析样品要求密封注射器立即送检", "Ｃ.细菌检测使用无菌试管取样", "Ｄ.内毒素检测取样前无需对透析液出口消毒", "Ｅ.内毒素取样前必须严格消毒出液口"], "answer": "ABCD", "explanation": "生化检测用注射器在透析机取样口取样，取样后尽快送检，血气分析样品要求密封注射器立即送检；细菌检测使用无菌试管在透析器快速接头出液口或透析器透析液出口取样；内毒素检测取样前无需对透析液出口消毒，否则会出现假阴性结果。"}]}, {"type": "short", "questions": [{"text": "简述理想的透析液应从哪几个方面评价，并写出生理学因素的具体要求。", "options": [], "answer": "理想的透析液应从三个方面评价：①生理学因素；②细菌学因素；③毒性因素。生理学因素的具体要求包括：能维护恒定的溶质清除率和超滤作用；补充患者缺乏的物质（如钙离子）；供给营养物质而不增加代谢并发症；渗透性物质吸收极少或不吸收；能纠正酸中毒；pH为生理性；离子种类、比例、浓度与人体血液电解质浓度接近。", "explanation": "评价理想透析液的三个维度是生理学因素、细菌学因素和毒性因素，其中生理学因素强调溶质清除率与超滤作用恒定、补充缺乏物质、营养供给不增加代谢并发症、渗透性物质吸收极少或不吸收、纠正酸中毒和生理性pH，并要求离子种类、比例、浓度接近人体血液电解质浓度。"}, {"text": "简述碳酸氢盐透析液的优点和缺点。", "options": [], "answer": "优点：①更符合患者的生理状态；②能迅速纠正代谢性酸中毒，避免低氧血症，心血管稳定性好；③可避免醋酸盐透析时常出现的不适反应（如头痛）。缺点：①很不稳定；②碳酸氢盐浓缩液易生长细菌；③碳酸氢根易挥发，可致碳酸氢根离子浓度下降。", "explanation": "碳酸氢盐透析液生理相容性好、纠正代谢性酸中毒迅速、心血管稳定性好，且可避免醋酸盐透析常见的头痛等不适；但其稳定性差、浓缩液易被细菌污染、碳酸氢根易挥发使其浓度下降，因此需现配现用或采用在线干粉桶等方式保证质量。"}, {"text": "简述中国标准YY0572-2015对透析用水细菌与内毒素的标准值、干预水平和监测频率的要求。", "options": [], "answer": "细菌：标准＜100 cfu/ml，干预水平≥50 cfu/ml，监测频率至少每月1次；内毒素：标准＜0.25 EU/ml，干预水平≥0.125 EU/ml，监测频率至少每季度1次。取样点至少应包括供水回路的末端，样本取样口应保持开启并放水至少60 s后进行消毒采样，可使用75%乙醇消毒擦拭出水口外表面3次，待乙醇完全挥发后方可采样，不能使用其他消毒剂。", "explanation": "中国标准YY0572-2015规定透析用水细菌限值为＜100 cfu/ml、内毒素限值为＜0.25 EU/ml，干预水平分别为≥50 cfu/ml和≥0.125 EU/ml，细菌至少每月检测1次、内毒素至少每季度检测1次，并对取样点的选择、放水时间与取样口消毒方法作出了统一要求。"}, {"text": "简述浓缩液配制室的环境要求及浓缩液配制人员的要求。", "options": [], "answer": "环境要求：浓缩液配制室应位于透析室清洁区内相对独立的区域，周围无污染原，保持环境清洁；每日空气消毒60分钟；每月做一次细菌培养，细菌数不能超过500 cfu/平方米。人员要求：用干粉配制浓缩液（A液、B液）应由经过培训的血透室护士或技术员实施，应做好配制记录并有专人核查登记；穿工作服，换鞋或鞋套进入配制室，操作时戴口罩、手套；配制室加锁，防止非工作人员进入。", "explanation": "浓缩液配制室属于三类环境，要求区域相对独立、周围无污染原、环境清洁，每日空气消毒60分钟，每月做一次细菌培养且细菌数不超过500 cfu/平方米；配制人员须经培训后实施操作，穿工作服并换鞋或鞋套进入，戴口罩、手套，配制记录需双人核对并由专人核查登记，配制室须加锁管理。"}, {"text": "简述透析液生化检测、细菌检测和内毒素检测的取样方法及注意事项。", "options": [], "answer": "生化检测：用注射器在透析机取样口取样，取样后尽快送检；用于血气分析的样品要求密封注射器立即送检。细菌检测：让透析液自由流出1分钟，使用无菌试管在透析器快速接头出液口或透析器透析液出口取样。内毒素检测：让透析液自由流出1分钟，使用专用吸液管或注射器从透析器快速接头出液口取样；注意取样前无需对透析液出口消毒，否则会出现假阴性结果。", "explanation": "三类检测在取样部位、容器与送检时限上各有要求：生化与血气样品强调尽快、密封立即送检；细菌检测与内毒素检测取样前均让透析液自由流出1分钟，细菌检测使用无菌试管，内毒素检测使用专用吸液管或注射器，若对透析液出口进行消毒会造成内毒素检测的假阴性结果。"}]}]}, {"num": 32, "title": "彩色多普勒超声在血管通路中的应用理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血管通路被称为接受血液透析的终末期肾病患者的（  ）", "options": ["A.“生命线”", "B.“警示线”", "C.“备用线”", "D.“辅助线”", "E.“过渡线”"], "answer": "A", "explanation": "血管通路是接受血液透析的终末期肾病患者的“生命线”，直接关系透析治疗能否顺利实施。"}, {"text": "理想血管通路应满足的三大标准是（  ）", "options": ["A.穿刺容易、价格低廉、无需抗凝", "B.血流量充足、使用寿命长、并发症发生率低", "C.内径粗大、位置表浅、无静脉瓣", "D.建立迅速、即刻可用、无需成熟", "E.流量固定、无搏动、无需监测"], "answer": "B", "explanation": "理想的血管通路应该满足血流量充足、使用寿命长、并发症发生率低三大标准。"}, {"text": "下列不属于血管通路常见类型的是（  ）", "options": ["A.动静脉内瘘", "B.中心静脉导管", "C.外周静脉留置针", "D.动静脉移植物", "E.人工血管移植物"], "answer": "C", "explanation": "血管通路包括动静脉内瘘、中心静脉导管、动静脉移植物等类型，外周静脉留置针不属于透析用血管通路。"}, {"text": "以肱动脉为供血动脉、头静脉为流出静脉的动静脉内瘘属于（  ）", "options": ["A.前臂头静脉内瘘", "B.前臂静脉移位内瘘", "C.贵要静脉移位内瘘", "D.上臂头静脉内瘘", "E.人工血管内瘘"], "answer": "D", "explanation": "上臂头静脉内瘘以肱动脉为动脉、头静脉为静脉；前臂头静脉内瘘以桡动脉为动脉、头静脉为静脉。"}, {"text": "前臂头静脉动静脉内瘘的血管组合是（  ）", "options": ["A.肱动脉与头静脉", "B.肱动脉与贵要静脉", "C.桡动脉与尺静脉背侧或掌侧", "D.尺动脉与头静脉", "E.桡动脉与头静脉"], "answer": "E", "explanation": "前臂头静脉内瘘以桡动脉为动脉、头静脉为静脉，是最常用的自体动静脉内瘘类型。"}, {"text": "贵要静脉移位动静脉内瘘的血管组合是（  ）", "options": ["A.肱动脉与贵要静脉", "B.桡动脉与头静脉", "C.肱动脉与头静脉", "D.桡动脉与尺静脉背侧或掌侧", "E.尺动脉与贵要静脉"], "answer": "A", "explanation": "贵要静脉移位内瘘以肱动脉为动脉、贵要静脉为静脉。"}, {"text": "前臂静脉移位动静脉内瘘的血管组合是（  ）", "options": ["A.桡动脉与头静脉", "B.桡动脉与尺静脉背侧或掌侧", "C.肱动脉与头静脉", "D.肱动脉与贵要静脉", "E.尺动脉与尺静脉"], "answer": "B", "explanation": "前臂静脉移位内瘘以桡动脉为动脉、尺静脉背侧或掌侧为静脉。"}, {"text": "动静脉内瘘临床中常见的四大问题是（  ）", "options": ["A.感染、出血、血栓、钙化", "B.低血压、高血压、贫血、瘙痒", "C.造瘘失败、成熟不良、穿刺失败、流量不够", "D.发热、寒战、心悸、气促", "E.水肿、疼痛、麻木、苍白"], "answer": "C", "explanation": "动静脉内瘘常见问题包括造瘘失败、内瘘成熟不良、内瘘穿刺失败和流量不够。"}, {"text": "关于血管通路的体格检查与超声检查，说法正确的是（  ）", "options": ["A.两者均简便易行", "B.体格检查全面直观、超声检查简便", "C.两者均对操作者技术要求极高", "D.体格检查简便但局限，超声全面、直观", "E.体格检查可替代超声检查"], "answer": "D", "explanation": "体格检查简便、依赖经验、有局限性；超声检查技术要求高，但全面、直观。"}, {"text": "超声属性中“无回声”对应的声像特点是（  ）", "options": ["A.均匀的强亮回声", "B.灰白相间回声", "C.点状强回声后方伴声影", "D.弥漫性回声增强", "E.黑色、无反射信号区"], "answer": "E", "explanation": "无回声表现为黑色无反射信号区，是管腔内血液等液性成分的典型表现。"}, {"text": "超声伪影主要包括（  ）", "options": ["A.回声增强与回声减弱（衰减）", "B.无回声与低回声", "C.高回声与中等回声", "D.三相血流与单相血流", "E.横断面与纵断面"], "answer": "A", "explanation": "伪影包括回声增强和回声减弱（衰减）等，判断血管时应避免将其误认为真实病变。"}, {"text": "使用彩色多普勒超声判断血流方向时，红色代表的血流方向是（  ）", "options": ["A.背离探头", "B.靠近探头", "C.垂直于探头", "D.平行于探头", "E.与方向无关"], "answer": "B", "explanation": "彩色多普勒判断方向时红色代表血流靠近探头，蓝色代表血流背离探头。"}, {"text": "下列关于动脉与静脉血流频谱特点的描述，正确的是（  ）", "options": ["A.动脉为无空窗血流图，静脉为空窗血流图", "B.两者均为空窗血流图", "C.动脉为空窗血流图，静脉为无空窗血流图", "D.两者均为无空窗血流图", "E.两者均呈连续平坦频谱"], "answer": "C", "explanation": "频谱可提示血管性质：动脉为脉搏节律的空窗血流图，静脉为节律不规则、无空窗的血流图。"}, {"text": "穿刺时常用的角度为（  ）", "options": ["A.30°", "B.40°", "C.60°", "D.45°", "E.90°"], "answer": "D", "explanation": "穿刺常用角度为45°，此时深度换算系数为1.414。"}, {"text": "穿刺角度为30°时对应的深度换算系数是（  ）", "options": ["A.1.414", "B.1.732", "C.2.000", "D.1.155", "E.1.555"], "answer": "E", "explanation": "角度为30°时深度换算系数为1.555，角度为45°时换算系数为1.414。"}, {"text": "穿刺角度为40°时对应的深度换算系数是（  ）", "options": ["A.1.155", "B.1.414", "C.1.732", "D.2.000", "E.2.500"], "answer": "A", "explanation": "深度换算系数随穿刺角度而变化：45°对应1.414，40°对应1.155，30°对应1.555。"}, {"text": "超声测量显示距离为1.77cm，换算系数为1.414，实际深度为（  ）", "options": ["A.1.8cm", "B.2.5cm", "C.2.0cm", "D.2.2cm", "E.2.8cm"], "answer": "B", "explanation": "按深度=测量值×换算系数计算，1.77cm×1.414=2.5cm。"}, {"text": "正常四肢血管的二维超声表现是（  ）", "options": ["A.左右不对称，管径粗细不一", "B.左右对称，管径均匀不变", "C.左右对称，管径清晰，逐渐变细", "D.左右对称，自近心端至远心端逐渐增粗", "E.走行迂曲，管径无法分辨"], "answer": "C", "explanation": "正常四肢血管左右对称、管径清晰，自近心端至远心端逐渐变细。"}, {"text": "正常四肢动脉与静脉管壁的超声特点是（  ）", "options": ["A.动脉管壁较薄，静脉管壁较厚", "B.两者管壁厚度相同", "C.动脉管壁无弹性，静脉管壁有搏动", "D.动脉壁厚有弹性，静脉壁薄可压缩", "E.动脉管壁有压缩性，静脉管壁有弹性"], "answer": "D", "explanation": "正常四肢血管中动脉管壁较厚、有弹性，静脉管壁较薄、有压缩性。"}, {"text": "使用高分辨率探头观察正常四肢血管时，可见静脉管腔内的哪种回声随血流流动（  ）", "options": ["A.“条索状”回声", "B.“斑点状”强回声", "C.“双轨状”回声", "D.“网格状”回声", "E.“雾状”回声"], "answer": "E", "explanation": "使用高分辨率探头可见动脉管壁呈三层结构，并可见静脉瓣膜及管腔内“雾状”回声随血流流动。"}, {"text": "正常四肢动脉在每个心动周期中呈现的血流形式是（  ）", "options": ["A.快速的三相血流", "B.单一方向持续血流", "C.缓慢的连续血流", "D.双向摆动血流", "E.随呼吸变化的血流"], "answer": "A", "explanation": "正常四肢动脉在每一个心动周期中呈快速的三相血流，其意义与脉冲多普勒所显示的三相血流频谱一致。"}, {"text": "挤压远端肢体静脉放松或做Valsalva试验时，正常四肢静脉的血流变化是（  ）", "options": ["A.血流速度加快", "B.血流信号中断或出现短暂反流", "C.血流信号增强", "D.血流方向逆转且持续存在", "E.血流信号完全消失且不再恢复"], "answer": "B", "explanation": "挤压远端肢体静脉时管腔内血流信号增强；放松挤压或做Valsalva试验时，血流信号中断或出现短暂反流。"}, {"text": "上肢动脉主干自近心端向远心端的排列顺序是（  ）", "options": ["A.腋、锁骨下、肱、桡、尺动脉", "B.肱、腋、锁骨下、桡、尺动脉", "C.锁骨下、腋、肱、尺、桡动脉", "D.锁骨下、肱、腋、桡、尺动脉", "E.腋、肱、锁骨下、尺、桡动脉"], "answer": "C", "explanation": "上肢动脉的主干依次为锁骨下动脉、腋动脉、肱动脉、尺动脉和桡动脉，头臂干为其近心端来源。"}, {"text": "头静脉起于手背静脉网的哪一侧（  ）", "options": ["A.尺侧", "B.掌侧中央", "C.背侧中央", "D.桡侧", "E.指侧"], "answer": "D", "explanation": "头静脉起于手背静脉网的桡侧，逐渐转至前臂前面，经肘部在肱二头肌外侧上行。"}, {"text": "在肘窝处与头静脉相通的静脉是（  ）", "options": ["A.肱静脉", "B.尺静脉", "C.桡静脉", "D.腋静脉", "E.贵要静脉"], "answer": "E", "explanation": "在肘窝处头静脉借肘正中静脉与贵要静脉相通。"}, {"text": "成熟动静脉内瘘的超声评估应包括的要素是（  ）", "options": ["A.动脉流入道、静脉流出道、瘘口、血流量", "B.静脉流入道、动脉流出道、瘘口、血压", "C.吻合口、静脉瓣、动脉瘤、血肿", "D.流入道、流出道、侧支循环、心率", "E.瘘口、穿刺点、止血带、流量计读数"], "answer": "A", "explanation": "成熟动静脉内瘘的评估内容包括动脉端流入道、静脉端流出道、瘘口和血流量。"}, {"text": "动静脉内瘘成形术的术后评价内容包括（  ）", "options": ["A.患者准备与血管标记", "B.成熟情况与并发症", "C.血管内径与充血反应性", "D.静脉走形与静脉瓣", "E.流量与再循环"], "answer": "B", "explanation": "动静脉内瘘成形术的术后评价包括成熟情况和并发症两个方面。"}, {"text": "动静脉内瘘成形术术前动脉评估的目标血管是（  ）", "options": ["A.从肱动脉到肘部的尺动脉", "B.从腕部到指端的掌动脉", "C.从锁骨下动脉到腕部的桡动脉", "D.从腋动脉到肘部的肱动脉", "E.从锁骨下动脉到肘部的腋静脉"], "answer": "C", "explanation": "动脉评估的目标血管为从锁骨下动脉到腕部的桡动脉。"}, {"text": "动静脉内瘘成形术术前静脉评估的目标静脉是（  ）", "options": ["A.桡静脉、尺静脉、肱静脉", "B.锁骨下静脉、颈内静脉、头臂静脉", "C.大隐静脉、小隐静脉、股静脉", "D.头静脉、贵要静脉、腋静脉", "E.股静脉、髂外静脉、下腔静脉"], "answer": "D", "explanation": "静脉评估的目标静脉为头静脉、贵要静脉和腋静脉。"}, {"text": "动静脉内瘘成形术术前血管标记的内容包括（  ）", "options": ["A.瘘口位置、流出道长度、流入道压力、血流量", "B.患者准备、评价方法、血管标记、并发症", "C.内径、走形、分支、静脉瓣", "D.狭窄、血栓、窃血、动脉瘤", "E.静脉走行与分支、动静脉深度、动脉与肌群关系"], "answer": "E", "explanation": "术前血管标记包括静脉的“归途”、静脉的“岔路”、动静脉的深度以及动脉与前臂肌群的关系。"}, {"text": "正常动静脉内瘘中流入道动脉的超声表现是（  ）", "options": ["A.低阻血流频谱，血流速度可增高", "B.高阻血流频谱，血流速度减低", "C.三相血流频谱，速度正常", "D.管腔内无血流信号", "E.双向摆动血流频谱"], "answer": "A", "explanation": "正常动静脉内瘘流入道动脉呈低阻血流频谱，血流速度可增高。"}, {"text": "正常动静脉内瘘中动静脉瘘口的血流速度相对流入道动脉（  ）", "options": ["A.减低", "B.增高", "C.相等", "D.无变化", "E.无法比较"], "answer": "B", "explanation": "正常动静脉内瘘中动静脉瘘口呈低阻血流频谱，可出现频谱紊乱，血流速度较流入道动脉增高。"}, {"text": "正常动静脉内瘘流出道静脉的超声表现是（  ）", "options": ["A.高阻三相频谱，向远心端流速逐渐增高", "B.管腔内无明显血流信号", "C.动脉样低阻频谱，向近心端流速逐渐减低", "D.双向高速血流频谱", "E.随呼吸变化的间歇血流"], "answer": "C", "explanation": "正常动静脉内瘘流出道静脉呈动脉样低阻血流频谱，由动静脉内瘘处向近心端方向血流速度逐渐减低。"}, {"text": "正常动静脉内瘘探头加压后出现的表现是（  ）", "options": ["A.动脉管腔消失", "B.出现高速血流", "C.出现反向血流", "D.静脉管腔消失", "E.流速明显增高"], "answer": "D", "explanation": "正常动静脉内瘘的流出道静脉为动脉样低阻血流频谱，探头加压后静脉管腔消失。"}, {"text": "美国关于瘘口适用透析治疗的标准是（  ）", "options": ["A.每月6-8次200-250ml/min", "B.每月10-12次300-350ml/min", "C.每月4-6次400-450ml/min", "D.每月8-10次150-200ml/min", "E.每月6-8次300-350ml/min"], "answer": "E", "explanation": "美国的标准是瘘口可适用于每月6-8次300-350ml/min流量的透析治疗。"}, {"text": "内瘘出现震颤、杂音减弱或消失时，建议的处理是（  ）", "options": ["A.进行超声检查", "B.立即拔除内瘘", "C.改用中心静脉导管", "D.增加抗凝剂剂量", "E.立即行球囊扩张"], "answer": "A", "explanation": "内瘘的震颤、杂音减弱或消失是建议进行超声检查的指征之一。"}, {"text": "出现不可解释的Kt/V下降时，建议的处理是（  ）", "options": ["A.直接判定为透析器复用问题", "B.进行超声检查", "C.降低血流量", "D.缩短透析时间", "E.更换透析液配方"], "answer": "B", "explanation": "出现不可解释的Kt/V（透析充分性的一项指标）异常是建议进行超声检查的指征之一。"}, {"text": "下列属于不适合进行B超检查的情况是（  ）", "options": ["A.内瘘震颤减弱", "B.透析时血流量下降", "C.检查区域溃疡或针孔处出血使用绷带", "D.不可解释的Kt/V下降", "E.疑诊内瘘狭窄"], "answer": "C", "explanation": "检查区域溃疡或针刺后针孔处出血使用绷带、极严重的低血压不适合进行B超检查。"}, {"text": "内瘘并发症中与狭窄密切相关、常发于静脉侧，且静脉管腔压瘪可除外的是（  ）", "options": ["A.狭窄", "B.窃血", "C.血肿", "D.血栓", "E.动脉瘤"], "answer": "D", "explanation": "血栓与狭窄密切相关，常发于静脉侧，静脉管腔压瘪可除外血栓形成。"}, {"text": "内瘘狭窄多发生的部位是（  ）", "options": ["A.流入道动脉近心端", "B.上臂肌群内", "C.锁骨下静脉", "D.手背静脉网", "E.动静脉瘘口及流出道静脉"], "answer": "E", "explanation": "内瘘狭窄多发生在动静脉瘘口及流出道静脉。"}, {"text": "超声检查内瘘狭窄时应测量流入道动脉血流速度的部位是（  ）", "options": ["A.近瘘口处", "B.近心端远离瘘口处", "C.腋动脉起始处", "D.腕部掌侧", "E.手背静脉网"], "answer": "A", "explanation": "超声检查内瘘狭窄时应测量流入道动脉（近瘘口处）、动静脉瘘口处血流速度，并分段测量流出道静脉血流速度。"}, {"text": "关于端侧及侧侧吻合动静脉内瘘的窃血综合征，判断依据是（  ）", "options": ["A.瘘口近心端动脉血流反向且无症状", "B.瘘口远心端动脉血流反向并出现手部缺血症状", "C.流出道静脉血流速度减低", "D.瘘口处出现频谱紊乱", "E.静脉管腔压瘪后血流消失"], "answer": "B", "explanation": "对于端侧及侧侧吻合的动静脉内瘘，瘘口远心端动脉血流反向并出现手部缺血症状，应考虑窃血综合征。"}, {"text": "关于内瘘远心端动脉血流反向与手部缺血症状的关系，正确的是（  ）", "options": ["A.血流反向必然伴手部缺血症状", "B.无缺血症状即可排除血流反向", "C.部分病人血流反向时手部可无缺血症状", "D.血流反向与手部症状无关", "E.血流反向仅见于端端吻合"], "answer": "C", "explanation": "部分病人内瘘远心端动脉血流反向时手部可无缺血症状，因此需结合症状综合判断。"}, {"text": "静脉瘤样扩张的超声表现是（  ）", "options": ["A.流入道动脉内径弥漫性增粗", "B.瘘口处管腔闭塞", "C.吻合口周围出现液性暗区", "D.流出道静脉上常可出现局部内径膨大", "E.管壁出现强回声伴声影"], "answer": "D", "explanation": "静脉瘤样扩张表现为流出道静脉上常可出现局部内径膨大。"}, {"text": "超声对于血管通路评估的价值在于（  ）", "options": ["A.可替代所有其他检查", "B.可减少透析次数", "C.可降低患者血压", "D.可使内瘘即刻成熟", "E.提高内瘘通畅率"], "answer": "E", "explanation": "超声对于血管通路的评估具有较好的价值，可提高内瘘通畅率。"}, {"text": "超声应用于血管通路评估的特点是（  ）", "options": ["A.便捷、快速、互动性", "B.昂贵、耗时、侵入性", "C.只能一次成像、不可重复", "D.仅能评估动脉", "E.需要开刀取材"], "answer": "A", "explanation": "超声具有便捷、快速、互动性的特点，便于对血管通路反复动态评估。"}, {"text": "利用超声评估血管通路的优势之一是（  ）", "options": ["A.可替代外科手术", "B.及早发现并发症，利于处理方案制定", "C.可直接溶解血栓", "D.可治愈血管钙化", "E.可避免使用抗凝剂"], "answer": "B", "explanation": "利用超声可及时、早期发现并发症，有利于处理方案的制定。"}, {"text": "超声无创性评价动静脉内瘘时可提供的解剖信息是（  ）", "options": ["A.仅血流量数值", "B.仅血栓有无", "C.狭窄、静脉最小直径、走行、深度等", "D.仅心功能参数", "E.仅透析充分性指标"], "answer": "C", "explanation": "超声可提供动静脉内瘘的解剖信息，包括是否存在狭窄、静脉最小直径、静脉走行、深度等。"}, {"text": "术前评估中超声测量狭窄程度的示例如（  ）", "options": ["A.狭窄段0.55cm，正常段0.15cm", "B.狭窄段0.29cm，正常段0.27cm", "C.狭窄段0.60cm，正常段0.55cm", "D.狭窄段0.15cm，正常段0.55cm", "E.狭窄段0.25cm，正常段0.30cm"], "answer": "D", "explanation": "超声可测量狭窄段与正常段内径，如狭窄段0.15cm、正常段0.55cm，据此判断狭窄程度。"}, {"text": "人工血管动静脉移植物的术后评估内容之一是（  ）", "options": ["A.静脉瓣膜功能测定", "B.心脏射血分数测量", "C.肝脏大小的测量", "D.肾动脉阻力指数测定", "E.人工血管的内径测量"], "answer": "E", "explanation": "人工血管的术后评估需测量人工血管的内径等指标，以判断其通畅与并发症情况。"}]}, {"type": "multiple", "questions": [{"text": "血管通路的常见类型包括（  ）", "options": ["Ａ.动静脉内瘘", "Ｂ.中心静脉导管", "Ｃ.动静脉移植物", "Ｄ.外周静脉留置针", "Ｅ.动脉留置导管"], "answer": "ABC", "explanation": "血管通路包括动静脉内瘘、中心静脉导管和动静脉移植物等类型。选项D外周静脉留置针与选项E动脉留置导管均不属于透析用血管通路类型。"}, {"text": "动静脉内瘘常见的临床问题包括（  ）", "options": ["Ａ.造瘘失败", "Ｂ.内瘘成熟不良", "Ｃ.内瘘穿刺失败", "Ｄ.流量不够", "Ｅ.患者依从性过高"], "answer": "ABCD", "explanation": "动静脉内瘘常见问题包括造瘘失败、内瘘成熟不良、内瘘穿刺失败和流量不够。选项E患者依从性过高不属于常见问题。"}, {"text": "关于血管通路检查方法，下列正确的有（  ）", "options": ["Ａ.体格检查简便", "Ｂ.体格检查依赖经验并存在局限", "Ｃ.超声检查技术要求高", "Ｄ.超声检查全面、直观", "Ｅ.超声检查对人体有创伤"], "answer": "ABCD", "explanation": "体格检查简便、依赖经验、有局限性；超声检查技术要求高，但全面、直观。选项E错误，超声检查为无创检查。"}, {"text": "判断血管类型及走行方向可借助的方法包括（  ）", "options": ["Ａ.彩色多普勒超声", "Ｂ.探头压迫", "Ｃ.频谱超声", "Ｄ.“蓝”“红”颜色判断血流方向", "Ｅ.测量患者血压"], "answer": "ABCD", "explanation": "判断血管类型及走行方向的方法包括彩色多普勒超声、压迫、频谱超声以及“蓝”“红”判断血流方向。选项E测量血压与判断血管走行方向无关。"}, {"text": "关于动脉与静脉血流频谱特点，下列正确的有（  ）", "options": ["Ａ.动脉为脉搏节律的血流图", "Ｂ.动脉血流频谱存在空窗", "Ｃ.静脉血流频谱节律不规则", "Ｄ.静脉血流频谱无空窗", "Ｅ.动脉血流频谱节律完全不规则"], "answer": "ABCD", "explanation": "频谱可提示血管性质：动脉为脉搏节律的空窗血流图，静脉为节律不规则的无空窗血流图。选项E错误，动脉血流频谱具有脉搏节律而非完全不规则。"}, {"text": "正常四肢血管的二维超声表现包括（  ）", "options": ["Ａ.左右对称", "Ｂ.管径清晰", "Ｃ.自近心端至远心端逐渐变细", "Ｄ.动脉管壁较厚、有弹性", "Ｅ.静脉管壁较厚、无压缩性"], "answer": "ABCD", "explanation": "正常四肢血管左右对称、管径清晰，自近心端至远心端逐渐变细；动脉管壁较厚、有弹性，静脉管壁较薄、有压缩性。选项E错误，静脉管壁较薄且有压缩性。"}, {"text": "正常四肢血管的彩色多普勒表现包括（  ）", "options": ["Ａ.管腔内彩色血流充盈良好", "Ｂ.彩色血流边缘整齐", "Ｃ.动脉呈快速的三相血流", "Ｄ.静脉为单一方向的回心血流信号", "Ｅ.静脉挤压后出现持续高速反流"], "answer": "ABCD", "explanation": "正常四肢血管管腔内彩色血流充盈良好、边缘整齐；动脉在每个心动周期呈快速的三相血流；静脉为单一方向的回心血流信号，持续性充盈于整个管腔。选项E错误，挤压远端肢体静脉时管腔内血流信号增强，而非出现持续高速反流。"}, {"text": "正常四肢静脉在下列哪些情况下可出现血流信号改变（  ）", "options": ["Ａ.挤压远端肢体静脉时血流信号增强", "Ｂ.放松挤压时血流信号中断", "Ｃ.做Valsalva试验时血流信号中断", "Ｄ.放松挤压时出现短暂反流", "Ｅ.做Valsalva试验时血流速度持续升高"], "answer": "ABCD", "explanation": "挤压远端肢体静脉时管腔内血流信号增强，放松挤压或做Valsalva试验时血流信号中断或出现短暂反流。选项E错误，Valsalva试验时血流信号中断而非速度持续升高。"}, {"text": "上肢动脉的主干包括（  ）", "options": ["Ａ.锁骨下动脉", "Ｂ.腋动脉", "Ｃ.肱动脉", "Ｄ.尺动脉与桡动脉", "Ｅ.贵要静脉"], "answer": "ABCD", "explanation": "上肢动脉主干包括锁骨下动脉、腋动脉、肱动脉、尺动脉和桡动脉。选项E贵要静脉属静脉，不属于动脉主干。"}, {"text": "关于头静脉的解剖特点，下列正确的有（  ）", "options": ["Ａ.起于手背静脉网的桡侧", "Ｂ.逐渐转至前臂的前面", "Ｃ.经肘部在肱二头肌外侧上行", "Ｄ.经三角肌胸大肌间沟穿深筋膜注入腋静脉或锁骨下静脉", "Ｅ.起于手背静脉网的尺侧"], "answer": "ABCD", "explanation": "头静脉起于手背静脉网的桡侧，逐渐转至前臂的前面，经肘部在肱二头肌的外侧上行，再经三角肌胸大肌间沟穿深筋膜注入腋静脉或锁骨下静脉。选项E错误，起于手背静脉网尺侧的是贵要静脉。"}, {"text": "关于贵要静脉的解剖特点，下列正确的有（  ）", "options": ["Ａ.起于手背静脉网的尺侧", "Ｂ.沿前臂尺侧上行", "Ｃ.在肘部转到前面并接受正中静脉", "Ｄ.穿深筋膜注入肱静脉或与肱静脉伴行汇入腋静脉", "Ｅ.经三角肌胸大肌间沟注入锁骨下静脉"], "answer": "ABCD", "explanation": "贵要静脉起于手背静脉网的尺侧，沿前臂尺侧上行，在肘部转到前面并接受正中静脉，经肱二头肌内侧沟到前臂中点平面，穿深筋膜注入肱静脉或与肱静脉伴行汇入腋静脉。选项E描述的是头静脉的走行。"}, {"text": "动静脉内瘘成形术的术前评价内容包括（  ）", "options": ["Ａ.患者准备", "Ｂ.评价方法", "Ｃ.血管标记", "Ｄ.成熟情况", "Ｅ.并发症"], "answer": "ABC", "explanation": "动静脉内瘘成形术的术前评价包括患者准备、评价方法和血管标记。选项D成熟情况与选项E并发症属于术后评价的内容。"}, {"text": "动静脉内瘘成形术术前动脉评估的内容包括（  ）", "options": ["Ａ.血管内径", "Ｂ.管壁形态", "Ｃ.充血反应性", "Ｄ.血流量", "Ｅ.静脉瓣功能"], "answer": "ABCD", "explanation": "动脉评估内容包括血管内径、管壁形态、充血反应性和血流量。选项E静脉瓣功能属于术前静脉评估的内容。"}, {"text": "动静脉内瘘成形术术前静脉评估的内容包括（  ）", "options": ["Ａ.血管内径", "Ｂ.血管的走形情况", "Ｃ.血管的分支", "Ｄ.血管的静脉瓣", "Ｅ.充血反应性"], "answer": "ABCD", "explanation": "静脉评估内容包括血管内径、血管的走形情况、血管的分支和血管的静脉瓣。选项E充血反应性属于术前动脉评估的内容。"}, {"text": "超声可作为无创性评价方法，为动静脉内瘘提供的解剖信息包括（  ）", "options": ["Ａ.是否存在狭窄", "Ｂ.静脉最小直径", "Ｃ.静脉走行", "Ｄ.静脉深度", "Ｅ.血培养结果"], "answer": "ABCD", "explanation": "超声可提供动静脉内瘘的解剖信息，包括是否存在狭窄、静脉最小直径、静脉走行、深度等。选项E血培养结果需通过微生物培养获得，不属于超声提供的解剖信息。"}, {"text": "建议进行超声检查的内瘘相关情形包括（  ）", "options": ["Ａ.内瘘的震颤、杂音减弱或消失", "Ｂ.术后引流静脉属支过多致瘘难以成熟", "Ｃ.透析时针刺困难", "Ｄ.透析时血流量下降、动态静脉压增高、通路再循环增大", "Ｅ.检查区域溃疡或针刺后针孔处出血使用绷带"], "answer": "ABCD", "explanation": "建议进行超声检查的情形包括内瘘震颤、杂音减弱或消失，术后引流静脉属支过多致瘘难以成熟，透析时针刺困难，透析时血流量下降、动态静脉压增高、通路再循环增大，瘘侧肢体水肿和（或）疼痛、穿刺后出血时间延长，不可解释的Kt/V，以及疑诊狭窄、血栓、窃血、血肿、动脉瘤或静脉瘤样扩张等并发症。选项E属于不适合进行检查的情况。"}, {"text": "超声检查内瘘狭窄时应测量的血流速度部位包括（  ）", "options": ["Ａ.流入道动脉近瘘口处", "Ｂ.动静脉瘘口处", "Ｃ.分段测量流出道静脉血流速度", "Ｄ.仅测量瘘口远端静脉", "Ｅ.仅测量锁骨下动脉"], "answer": "ABC", "explanation": "超声检查内瘘狭窄时应测量流入道动脉（近瘘口处）、动静脉瘘口处血流速度，并分段测量流出道静脉血流速度。选项D、E错误，测量范围不包括仅测瘘口远端静脉或仅测锁骨下动脉。"}, {"text": "关于内瘘相关并发症的超声表现，下列正确的有（  ）", "options": ["Ａ.静脉瘤样扩张为流出道静脉局部内径膨大", "Ｂ.血肿是内瘘并发症之一", "Ｃ.动脉瘤是内瘘并发症之一", "Ｄ.血管钙化是内瘘并发症之一", "Ｅ.流出道静脉局部内径膨大属于血栓表现"], "answer": "ABCD", "explanation": "静脉瘤样扩张表现为流出道静脉上常可出现局部内径膨大；内瘘并发症还包括血栓、狭窄、闭塞、窃血、血肿、动脉瘤和血管钙化。选项E错误，流出道静脉局部内径膨大是静脉瘤样扩张的表现而非血栓。"}, {"text": "关于动静脉内瘘成形术的术前与术后评价，下列正确的有（  ）", "options": ["Ａ.术前评价包括患者准备、评价方法与血管标记", "Ｂ.术后评价包括成熟情况与并发症", "Ｃ.术前动脉评估目标血管为从锁骨下动脉到腕部的桡动脉", "Ｄ.术前静脉评估目标静脉为头静脉、贵要静脉、腋静脉", "Ｅ.术前动脉评估目标血管为腋动脉到指端的掌动脉"], "answer": "ABCD", "explanation": "术前评价包括患者准备、评价方法和血管标记，术后评价包括成熟情况和并发症；术前动脉评估的目标血管为从锁骨下动脉到腕部的桡动脉，术前静脉评估的目标静脉为头静脉、贵要静脉和腋静脉。选项E错误，动脉评估目标血管不包括由腋动脉到指端的掌动脉。"}, {"text": "关于血液透析患者血管通路，下列正确的有（  ）", "options": ["Ａ.是终末期肾病患者的“生命线”", "Ｂ.理想通路应血流量充足", "Ｃ.理想通路应使用寿命长", "Ｄ.理想通路应并发症发生率低", "Ｅ.理想通路应完全无需护理与监测"], "answer": "ABCD", "explanation": "血管通路是接受血液透析的终末期肾病患者的“生命线”，理想的血管通路应满足血流量充足、使用寿命长、并发症发生率低三大标准。选项E错误，理想通路仍需规范的护理与监测。"}]}, {"type": "short", "questions": [{"text": "简述彩色多普勒超声用于血管通路评估的临床价值与适用范围。", "options": [], "answer": "（1）超声具有便捷、快速、互动性的特点。（2）超声对于血管通路的评估具有较好的价值，可提高内瘘通畅率。（3）利用超声可及时、早期发现并发症，有利于处理方案的制定。（4）超声作为无创性评价方法，可提供动静脉内瘘的解剖信息，包括是否存在狭窄、静脉最小直径、静脉走行、深度等。", "explanation": "与体格检查相比，体格检查简便但依赖经验、存在局限，超声检查技术要求高但全面、直观。超声检查指征包括内瘘的震颤、杂音减弱或消失，术后引流静脉属支过多致瘘难以成熟，透析时针刺困难，透析时血流量下降、动态静脉压增高、通路再循环增大，瘘侧肢体水肿和（或）疼痛、穿刺后出血时间延长，不可解释的Kt/V，以及疑诊狭窄、血栓、窃血、血肿、动脉瘤或静脉瘤样扩张等并发症。检查区域溃疡或针刺后针孔处出血使用绷带、极严重的低血压时不适合进行B超检查。"}, {"text": "简述正常四肢血管的二维超声与彩色多普勒表现。", "options": [], "answer": "（1）二维超声表现：正常四肢血管左右对称，管径清晰，自近心端至远心端逐渐变细；动脉管壁较厚、有弹性，静脉管壁较薄、有压缩性；管腔内均为无回声；使用高分辨率的探头，可见动脉管壁呈三层结构，可见静脉管壁上的瓣膜及管腔内的“雾状”回声随血流流动。（2）彩色多普勒表现：管腔内彩色血流充盈良好、边缘整齐；动脉在每一个心动周期中呈快速的三相血流，其意义与脉冲多普勒所显示的三相血流频谱一致；静脉为单一方向的回心血流信号，持续性充盈于整个管腔，挤压远端肢体静脉时管腔内血流信号增强，放松挤压或做Valsalva试验时血流信号中断或出现短暂反流。", "explanation": "血流频谱可提示血管性质：动脉为脉搏节律的空窗血流图，静脉为节律不规则的无空窗血流图。判断血管类型及走行方向可借助彩色多普勒超声、压迫、频谱超声以及“蓝”“红”颜色判断血流方向，其中红色代表血流靠近探头、蓝色代表血流背离探头。"}, {"text": "简述动静脉内瘘成形术的术前评价内容。", "options": [], "answer": "（1）术前评价包括患者准备、评价方法和血管标记。（2）动脉评估：目标血管为从锁骨下动脉到腕部的桡动脉；评估内容包括血管内径、管壁形态、充血反应性和血流量。（3）静脉评估：目标静脉为头静脉、贵要静脉、腋静脉；评估内容包括血管内径、血管的走形情况、血管的分支和血管的静脉瓣。（4）术前血管标记包括静脉的“归途”、静脉的“岔路”、动静脉的深度以及动脉与前臂肌群的关系。", "explanation": "动静脉内瘘成形术的术后评价则包括成熟情况与并发症。成熟动静脉内瘘的评估要素包括动脉端流入道、静脉端流出道、瘘口和血流量。术前充分评估血管内径、管壁形态、充血反应性、血流量以及静脉走行、分支、静脉瓣与动静脉深度，有助于血管标记和提高造瘘成功率。"}, {"text": "简述正常动静脉内瘘的超声表现。", "options": [], "answer": "（1）流入道动脉：低阻血流频谱，血流速度可增高。（2）动静脉瘘：低阻血流频谱，可出现频谱紊乱，血流速度较流入道动脉增高。（3）流出道静脉：呈动脉样低阻血流频谱，由动静脉内瘘处向近心端方向血流速度逐渐减低，探头加压后静脉管腔消失。", "explanation": "成熟动静脉内瘘的评估要素包括动脉端流入道、静脉端流出道、瘘口和血流量。美国标准认为瘘口可适用于每月6-8次300-350ml/min流量的透析治疗，欧洲等其他国家采用较低流量并由有经验的护士进行手法评估；超声可作为无创性评价方法，提供是否存在狭窄、静脉最小直径、静脉走行、深度等解剖信息。"}, {"text": "简述动静脉内瘘常见并发症的超声评估要点。", "options": [], "answer": "（1）血栓：与狭窄密切相关，常发于静脉侧，静脉管腔压瘪可除外血栓形成。（2）狭窄：多发生在动静脉瘘口及流出道静脉；超声检查时应测量流入道动脉（近瘘口处）、动静脉瘘口处血流速度，并分段测量流出道静脉血流速度。（3）窃血：对于端侧及侧侧吻合的动静脉内瘘，瘘口远心端动脉血流反向并出现手部缺血症状时应考虑窃血综合征；部分病人内瘘远心端动脉血流反向时手部可无缺血症状。（4）静脉瘤样扩张：流出道静脉上常可出现局部内径膨大。（5）其他并发症还包括闭塞、血肿、动脉瘤和血管钙化。", "explanation": "内瘘并发症包括血栓、狭窄、闭塞、窃血、静脉瘤样扩张、血肿、动脉瘤和血管钙化。建议在出现内瘘震颤或杂音减弱或消失、术后引流静脉属支过多致瘘难以成熟、透析时针刺困难、透析时血流量下降伴动态静脉压增高和通路再循环增大、瘘侧肢体水肿和（或）疼痛及穿刺后出血时间延长、不可解释的Kt/V下降、疑诊上述并发症等情形时进行超声检查。"}]}]}, {"num": 33, "title": "血液净化患者治疗慢性并发症之难治性甲旁亢内外科治疗与围手术期的管理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "到2022年底，中国血液透析（HD）患者数量达到（  ）", "options": ["A.44.4万", "B.64.4万", "C.74.4万", "D.84.4万", "E.94.4万"], "answer": "D", "explanation": "到2022年底，中国HD患者数量达到84.4万，并以每年复合增长率8%-13%的速度快速增长。"}, {"text": "按近3年平均增长率10.12%计算，中国HD患者到2025年将增加到（  ）", "options": ["A.93万", "B.103万", "C.113万", "D.123万", "E.133万"], "answer": "C", "explanation": "按近3年的平均增长率10.12%计算，中国HD患者到2025年将增加到113万。"}, {"text": "透析患者中完整甲状旁腺激素（iPTH）升高的比例高达（  ）", "options": ["A.30%", "B.50%", "C.70%", "D.90%", "E.95%"], "answer": "D", "explanation": "透析患者iPTH升高的比例高达90%，继发性甲旁亢发病率居高不下。"}, {"text": "最新调查显示我国慢性肾脏病（CKD）的总患病率及预计患者数分别为（  ）", "options": ["A.8.8%，约0.995亿", "B.10.8%，约1.195亿", "C.12.8%，约1.395亿", "D.9.8%，约1.095亿", "E.11.8%，约1.295亿"], "answer": "B", "explanation": "最新调查显示我国CKD的总患病率为10.8%，预计有1.195亿患者。"}, {"text": "成人CKD患者推荐开始监测血清钙、磷、iPTH及ALP水平，并建议检测25(OH)D水平的时期是（  ）", "options": ["A.CKD G1期", "B.CKD G2期", "C.CKD G3a期", "D.CKD G4期", "E.CKD G5期"], "answer": "C", "explanation": "成人CKD患者推荐从CKD G3a期开始监测血清钙、磷、iPTH及ALP水平，并建议检测25(OH)D水平。"}, {"text": "CKD患者血钙、血磷在肾小球滤过率高于多少之前常无明显异常（  ）", "options": ["A.20ml/(min·1.73m²)", "B.30ml/(min·1.73m²)", "C.40ml/(min·1.73m²)", "D.60ml/(min·1.73m²)", "E.80ml/(min·1.73m²)"], "answer": "C", "explanation": "钙、磷在GFR&gt;40ml/(min·1.73m²)前常无明显异常，在GFR&gt;20ml/(min·1.73m²)前相对稳定。"}, {"text": "CKD患者中，约有近60%在肾小球滤过率高于多少时出现iPTH升高（  ）", "options": ["A.40ml/(min·1.73m²)", "B.50ml/(min·1.73m²)", "C.60ml/(min·1.73m²)", "D.70ml/(min·1.73m²)", "E.80ml/(min·1.73m²)"], "answer": "C", "explanation": "近60%的患者在GFR&gt;60ml/(min·1.73m²)时有iPTH升高；约12%患者在GFR&gt;80ml/(min·1.73m²)时iPTH已接近正常高限。"}, {"text": "CKD G5期患者血清碱性磷酸酶（ALP）的监测频率是（  ）", "options": ["A.每1-3个月", "B.每3-6个月", "C.每6-12个月", "D.每12个月", "E.每2年"], "answer": "C", "explanation": "CKD G5期患者ALP的监测频率为每6-12个月；血磷、血钙为每1-3个月，iPTH为每3-6个月（如iPTH升高可缩短）。"}, {"text": "CKD G3a/G3b期患者血清iPTH的监测频率确定原则是（  ）", "options": ["A.根据基线水平和CKD进展情况决定", "B.固定每3个月1次", "C.固定每6个月1次", "D.固定每12个月1次", "E.无需监测"], "answer": "A", "explanation": "CKD G3a/G3b期患者iPTH的监测频率为根据基线水平和CKD进展情况决定；G4期为每6-12个月，G5期为每3-6个月（如iPTH升高可缩短）。"}, {"text": "具有生物学活性的离子钙占血清总钙的比例为（  ）", "options": ["A.10%-20%", "B.20%-30%", "C.30%-40%", "D.40%-50%", "E.50%-60%"], "answer": "D", "explanation": "具有生物学活性的离子钙仅占血清总钙的40%-50%。"}, {"text": "血清PTH检测中片段PTH对结果的影响以及PTH水平的解读原则是（  ）", "options": ["A.片段PTH不影响结果，单个数值即可代表水平", "B.变化趋势比单个数值更有意义", "C.片段PTH使检测结果恒定偏低", "D.第三代PTH检测已在临床广泛替代iPTH", "E.PTH正常参考范围与普通人群一致"], "answer": "B", "explanation": "PTH检测的主要困难在于片段PTH的影响，PTH变化趋势比单个数值更有意义；第二代PTH检测（免疫法）检测的是iPTH，第三代PTH检测为真正的1-84氨基酸全长PTH（wPTH，全PTH），但临床上尚未广泛使用，仍以iPTH作为甲状旁腺激素水平主要参考指标。"}, {"text": "第二代PTH检测（免疫法）所测iPTH的组成是（  ）", "options": ["A.仅1-84氨基酸全长PTH", "B.1-84PTH与7-84PTH之和", "C.仅有7-84PTH片段", "D.1-34PTH与7-84PTH之和", "E.1-84PTH与1-34PTH之和"], "answer": "B", "explanation": "iPTH=1-84PTH+7-84PTH，其中7-84PTH可减弱1-84PTH升高血钙及增加尿磷排泄的作用；第三代PTH检测为真正的1-84氨基酸全长PTH（wPTH，全PTH），但临床上尚未广泛使用。"}, {"text": "血清碱性磷酸酶（ALP）的主要来源及其升高的解读要点是（  ）", "options": ["A.仅来源于骨骼，升高即提示骨病", "B.主要来源于肝脏和骨骼，数值偏高需排除肝病的影响", "C.仅来源于肝脏，升高即提示肝病", "D.主要来源于肾脏，升高提示肾小管损伤", "E.主要来源于肠道，升高提示吸收不良"], "answer": "B", "explanation": "血清的ALP主要来源于肝脏和骨骼，肝脏疾病和骨骼疾病时都会出现升高，若数值偏高需排除肝病对总碱性磷酸酶（t-ALP）的影响。"}, {"text": "关于CKD-MBD患者骨密度测定的临床意义，下列叙述正确的是（  ）", "options": ["A.骨密度能准确预测肾性骨营养不良的类型", "B.骨密度对骨折风险的预测价值已十分明确", "C.在可能根据骨密度结果选择治疗措施时建议行骨密度检测", "D.骨密度测定可替代骨活检作为诊断金标准", "E.CKD G5D期患者应每3个月常规检测骨密度"], "answer": "C", "explanation": "对于有CKD-MBD证据的CKD G3a-G5期患者，骨密度不能预测肾性骨营养不良的类型，其对骨折发生风险的预测价值还需进一步评估；在可能根据骨密度结果选择治疗措施时，建议行骨密度检测。"}, {"text": "关于磷在体内的分布以及多室模型对透析清除磷的限制，下列叙述正确的是（  ）", "options": ["A.循环中的磷占人体总体磷的绝大部分", "B.磷从细胞内进入细胞外的转运速率快，透析可迅速清除", "C.循环中的磷只占人体总体磷的1%，磷从细胞内转运至细胞外的速率缓慢", "D.透析时磷由透析液进入血清", "E.透析可直接清除组织细胞内的磷"], "answer": "C", "explanation": "循环中的磷只占人体总体磷量的1%，其余约99%存在于组织细胞内和骨骼或牙齿中；磷从细胞内通过跨膜主动运输至细胞外（外周室至中央室）的速率缓慢。透析刚开始时循环中的磷从血清进入透析液速率高，随着血磷水平明显下降，透析除磷开始受限于磷从组织进入血清的速度。"}, {"text": "当血清白蛋白低于40g/L时，校正钙(mg/dl)的正确计算方法是血清总钙(mg/dl)（  ）", "options": ["A.+0.8×[4-血清白蛋白(g/dl)]", "B.+[4-血清白蛋白(g/dl)]", "C.-0.8×[4-血清白蛋白(g/dl)]", "D.+0.8×[40-血清白蛋白(g/L)]", "E.+2.0×[4-血清白蛋白(g/dl)]"], "answer": "A", "explanation": "当血清白蛋白浓度低于40g/L时建议采用校正钙，校正钙(mg/dl)=血清总钙(mg/dl)+0.8×[4-血清白蛋白(g/dl)]；日本的公式为血清总钙(mg/dl)+[4-血清白蛋白(g/dl)]。"}, {"text": "心脏瓣膜和血管钙化的筛查监测与防治，应从CKD哪一期着手（  ）", "options": ["A.CKD G1期", "B.CKD G2期", "C.CKD G3a期", "D.CKD G3b期", "E.CKD G4期"], "answer": "A", "explanation": "血管钙化的宣教、筛查、监测和防治应从CKD G1期着手，至少应从CKD G3a期开始对患者进行血管钙化的筛查和监测。"}, {"text": "建议定义25(OH)D低于多少为维生素D缺乏（  ）", "options": ["A.5ng/ml", "B.10ng/ml", "C.15ng/ml", "D.20ng/ml", "E.30ng/ml"], "answer": "C", "explanation": "建议定义25(OH)D&lt;15ng/ml为维生素D缺乏，≥15ng/ml且&lt;30ng/ml为维生素D不足。"}, {"text": "25(OH)D水平处于维生素D不足的区间是（  ）", "options": ["A.&lt;15ng/ml", "B.≥15ng/ml且&lt;30ng/ml", "C.≥30ng/ml且&lt;50ng/ml", "D.≥50ng/ml", "E.&lt;30ng/ml且≥10ng/ml"], "answer": "B", "explanation": "25(OH)D&lt;15ng/ml为维生素D缺乏，≥15ng/ml且&lt;30ng/ml为维生素D不足。"}, {"text": "25(OH)D检测的金标准方法是（  ）", "options": ["A.放免法", "B.高效液相色谱", "C.液相色谱串联质谱法", "D.化学发光法", "E.酶联免疫法"], "answer": "B", "explanation": "25(OH)D检测的金标准是高效液相色谱；放免法仅检测血清总25(OH)D，液相色谱串联质谱法能同时检测25(OH)D2、25(OH)D3和总25(OH)D，但成本高、需熟练工，未广泛推广。"}, {"text": "骨特异性碱性磷酸酶（b-ALP）由哪种细胞产生、反映什么状态（  ）", "options": ["A.成骨细胞；骨形成状态", "B.破骨细胞；骨吸收状态", "C.肝细胞；肝功能状态", "D.肾小管上皮细胞；肾小管损伤", "E.甲状旁腺主细胞；PTH分泌状态"], "answer": "A", "explanation": "b-ALP由成骨细胞产生，是反映成骨细胞活性的指标，能准确反映骨形成的状态；b-ALP需放免法测定。"}, {"text": "CKD-MBD诊断的金标准检查是（  ）", "options": ["A.骨密度测定", "B.骨活检", "C.血清iPTH测定", "D.血磷测定", "E.侧位腹部X线片"], "answer": "B", "explanation": "骨活检是CKD-MBD诊断的金标准，但临床实施困难，不推荐常规进行。"}, {"text": "下列不属于建议进行骨活检指征的是（  ）", "options": ["A.不明原因骨折", "B.持续性骨痛", "C.不明原因高钙血症", "D.不明原因低磷血症", "E.轻度贫血"], "answer": "E", "explanation": "建议进行骨活检的指征包括不明原因骨折、持续性骨痛、不明原因高钙血症、不明原因低磷血症、可能的铝中毒及使用双膦酸盐治疗CKD-MBD之前；轻度贫血不属于上述指征。"}, {"text": "评估CKD G3-G5D期患者是否存在血管钙化，可采用（  ）", "options": ["A.正位胸部X线片", "B.侧位腹部X光片", "C.头颅CT", "D.颈部超声", "E.腹部B超"], "answer": "B", "explanation": "对于CKD G3-G5D期患者，可采用侧位腹部X光片检查是否存在血管钙化，并使用超声心动图检查是否存在心脏瓣膜钙化。"}, {"text": "评估CKD G3-G5D期患者是否存在心脏瓣膜钙化，可采用（  ）", "options": ["A.侧位腹部X光片", "B.超声心动图", "C.电子束CT", "D.冠状动脉造影", "E.心电图"], "answer": "B", "explanation": "超声心动图用于检测心脏瓣膜钙化；有条件时可采用电子束CT及多层螺旋CT评估心血管钙化情况。"}, {"text": "心血管钙化评估建议的复查间隔是（  ）", "options": ["A.每1-3个月", "B.每3-6个月", "C.每6-12个月", "D.每2年", "E.每3年"], "answer": "C", "explanation": "建议每6-12个月进行一次心血管钙化评估。"}, {"text": "非透析CKD3-5期患者血磷每升高1mg/dL，心血管死亡风险增加（  ）", "options": ["A.16%", "B.26%", "C.36%", "D.50%", "E.62%"], "answer": "D", "explanation": "血磷水平每升高1mg/dL，心血管死亡风险上升50%，全因死亡风险上升26%。"}, {"text": "成人正常血清磷的范围是（  ）", "options": ["A.0.67-1.25mmol/L", "B.0.87-1.45mmol/L", "C.1.13-1.78mmol/L", "D.1.45-1.78mmol/L", "E.0.87-1.78mmol/L"], "answer": "B", "explanation": "成人正常血清磷范围为0.87-1.45mmol/L；旧版指南建议CKD 5D期维持血清磷在1.13-1.78mmol/L。"}, {"text": "新版指南建议CKD G3a-G5D期患者血磷超过目标值时，限制饮食磷摄入的量是（  ）", "options": ["A.400-600mg/天", "B.600-800mg/天", "C.800-1000mg/天", "D.1000-1200mg/天", "E.1200-1500mg/天"], "answer": "C", "explanation": "血磷超过目标值，建议应限制饮食磷摄入（800-1000mg/天）或/和联合其他降磷措施。"}, {"text": "降磷治疗推荐的3D原则是（  ）", "options": ["A.饮食限磷、充分透析、合理使用磷结合剂", "B.限磷、补钙、使用活性维生素D", "C.限磷、使用拟钙剂、甲状旁腺切除", "D.充分透析、静脉补钙、使用磷结合剂", "E.限磷、降钙、甲状旁腺手术"], "answer": "A", "explanation": "降磷治疗推荐3D原则，即饮食限磷、充分透析、合理使用磷结合剂。"}, {"text": "通常建议选择磷/蛋白比低于多少的食物（  ）", "options": ["A.5mg/g", "B.10mg/g", "C.12mg/g", "D.15mg/g", "E.20mg/g"], "answer": "C", "explanation": "通常选择磷/蛋白比小于12mg/g的食物；在确定蛋白质摄入足够时，摄入磷越少越好。"}, {"text": "加工食品中作为添加剂的无机磷，其吸收率为（  ）", "options": ["A.10%-20%", "B.30%-50%", "C.40%-60%", "D.70%-80%", "E.大于90%"], "answer": "E", "explanation": "食品添加剂中的无机磷大于90%被吸收，磷是加工食品中许多防腐剂与添加剂的主要成分。"}, {"text": "相较于未添加含磷添加剂的食物，添加含磷添加剂的食物中磷含量显著增加将近（  ）", "options": ["A.30%", "B.50%", "C.70%", "D.90%", "E.100%"], "answer": "C", "explanation": "相较于未添加含磷添加剂的食物，添加含磷添加剂的食物中的磷含量显著增加将近70%。"}, {"text": "使用磷酸盐作为赋形剂的药物所占比例为（  ）", "options": ["A.2.5%", "B.12.5%", "C.25.5%", "D.40.2%", "E.59.8%"], "answer": "B", "explanation": "12.5%的药物使用磷酸盐作为赋形剂，属于医源性磷，是易被忽略的“隐藏磷”。"}, {"text": "KDOQI推荐的透析患者蛋白摄入量是（  ）", "options": ["A.0.6g/kg", "B.0.8g/kg", "C.1.0g/kg", "D.1.2g/kg", "E.1.5g/kg"], "answer": "D", "explanation": "根据KDOQI推荐的透析患者蛋白摄入量（1.2g/kg）计算，正常蛋白质摄入的体重60kg透析患者每周可经肠道吸收近3900mg的磷酸盐。"}, {"text": "夜间透析每周清除磷的总量约为（  ）", "options": ["A.2356mg", "B.2452mg", "C.3900mg", "D.8000mg", "E.12500mg"], "answer": "D", "explanation": "除夜间透析外（每周清除磷总量为8000mg），其他透析方式如高通量血透等每周清除的磷总量均低于3900mg。"}, {"text": "指南建议CKD G5D期患者的iPTH水平应维持在正常上限的（  ）", "options": ["A.1-2倍", "B.2-4倍", "C.2-9倍", "D.5-10倍", "E.9-15倍"], "answer": "C", "explanation": "指南建议CKD G5D期患者的iPTH水平应维持在正常上限的2-9倍。"}, {"text": "中国透析患者中继发性甲状旁腺功能亢进（SHPT）的发病率约为（  ）", "options": ["A.15%", "B.25%", "C.45%", "D.65%", "E.90%"], "answer": "C", "explanation": "中国透析患者中SHPT的发病率高（约45%），控制率低。"}, {"text": "拟钙剂引起血钙降低的程度通常为（  ）", "options": ["A.轻度到中度", "B.中度到重度", "C.重度", "D.无变化", "E.显著升高"], "answer": "A", "explanation": "拟钙剂变构激活钙敏感受体、减少PTH释放，引起的血钙降低仅为轻度到中度。"}, {"text": "西那卡塞给药初期测定血钙的频率是（  ）", "options": ["A.每周1次", "B.每2周1次", "C.每月1次", "D.每3个月1次", "E.每半年1次"], "answer": "A", "explanation": "拟钙剂给药初期每周测定1次血钙，维持期2周测定1次血钙。"}, {"text": "使用西那卡塞时，iPTH降至什么水平应减量或停用（  ）", "options": ["A.正常上限以下", "B.正常上限两倍以下", "C.正常上限3倍以下", "D.正常上限5倍以下", "E.正常上限9倍以下"], "answer": "B", "explanation": "使用拟钙剂时，iPTH在正常上限两倍以下时应减量或停用。"}, {"text": "应用西那卡塞治疗继发性甲状旁腺功能亢进时，需要重点关注的不良反应是（  ）", "options": ["A.高钙血症和便秘", "B.低钙血症、恶心呕吐、腹泻和上呼吸道感染", "C.高磷血症和皮肤瘙痒", "D.高血压和心动过速", "E.白细胞减少和血小板减少"], "answer": "B", "explanation": "西那卡塞治疗患者低钙血症、恶心呕吐、腹泻、上呼吸道感染的发生率显著增高，因此治疗期间应监测血钙并及时调整剂量；西那卡塞引起的血钙降低仅为轻度到中度。"}, {"text": "继发性甲状旁腺功能亢进时甲状旁腺腺体由正常演变为单结节（腺瘤样）腺体的顺序是（  ）", "options": ["A.正常→早期结节→弥漫性增生→结节性增生→单结节（腺瘤样）腺体", "B.正常→弥漫性增生→早期结节→结节性增生→单结节（腺瘤样）腺体", "C.正常→结节性增生→弥漫性增生→单结节（腺瘤样）腺体", "D.正常→单结节（腺瘤样）腺体→弥漫性增生→结节性增生", "E.正常→弥漫性增生→结节性增生→早期结节→单结节（腺瘤样）腺体"], "answer": "B", "explanation": "在低血钙、高血磷、低1,25(OH)2D3以及VDR、CaSR减少的刺激下，甲状旁腺由正常经弥漫性增生、早期结节、结节性增生发展为单结节（腺瘤样）腺体，增殖方式由多克隆增殖转变为单克隆增殖。"}, {"text": "甲状旁腺核素显像（MIBI）检查所采用的延迟显像时相是（  ）", "options": ["A.5分钟、10分钟、15分钟", "B.15分钟、60分钟、120分钟", "C.30分钟、90分钟、180分钟", "D.1小时、4小时、8小时", "E.6小时、12小时、24小时"], "answer": "B", "explanation": "甲状旁腺核素显像（MIBI）采用15分钟、60分钟、120分钟时相进行延迟显像，与超声、颈部CT、增强CT及SPECT/CT等检查共同用于甲状旁腺结节或异位腺体的定位。"}, {"text": "正常甲状旁腺的异位部位主要包括（  ）", "options": ["A.气管食管陷窝、食管后部、胸骨后胸腺附近与前纵膈等", "B.仅甲状腺实质内", "C.仅颈部皮下组织", "D.仅锁骨上窝与腋窝", "E.仅纵膈内"], "answer": "A", "explanation": "正常甲状旁腺异位比例约16%-20%，异位部位包括甲状腺实质内、气管食管陷窝、食管后部、胸骨后胸腺附近、前纵膈等。"}, {"text": "关于甲状旁腺激素（PTH）分泌的调节，下列叙述正确的是（  ）", "options": ["A.低血钙刺激PTH分泌，高血钙抑制PTH分泌", "B.高血钙刺激PTH分泌，低血钙抑制PTH分泌", "C.1,25(OH)2D3刺激PTH分泌", "D.降钙素刺激PTH分泌", "E.血磷水平不影响PTH分泌"], "answer": "A", "explanation": "低血钙刺激PTH分泌，高血钙、1,25(OH)2D3和降钙素抑制PTH分泌；PTH可促进肾脏对钙的重吸收、促进骨溶解释放钙，并抑制肾脏对磷的重吸收、促进骨溶解释放磷。"}, {"text": "现有常规药物治疗方案用于继发性甲状旁腺功能亢进存在的主要缺陷是（  ）", "options": ["A.可导致血钙、血磷浓度升高", "B.可导致血钙、血磷浓度降低", "C.完全不能降低血清PTH浓度", "D.仅在非透析患者中有效", "E.需终身静脉给药才能起效"], "answer": "A", "explanation": "现有常规药物治疗方案（活性维生素D制剂、含钙磷结合剂、调整透析液中的钙浓度等）存在的缺陷是会导致血Ca、P浓度升高；维生素D制剂还可导致钙磷乘积（Ca×P）升高、血管钙化风险增加。"}, {"text": "活性维生素D小剂量持续疗法的给药方案是骨化三醇（  ）", "options": ["A.0.25μg，每天一次", "B.0.5μg，每天一次", "C.1μg，每天一次", "D.2μg，每天一次", "E.4μg，每天一次"], "answer": "A", "explanation": "小剂量持续疗法适用于轻度SHPT（iPTH&lt;300pg/ml）或中重度SHPT维持期（CKD3、4期），骨化三醇0.25μg，每天一次。"}, {"text": "帕立骨化醇用于血浆PTH 300-600pg/mL患者时，每次血液透析的起始剂量为（  ）", "options": ["A.2μg，一周三次", "B.3μg，一周三次", "C.5μg，一周三次", "D.10μg，一周三次", "E.15μg，一周三次"], "answer": "C", "explanation": "血浆PTH 300-600pg/mL时，帕立骨化醇每次血液透析起始剂量为5μg、一周三次。"}, {"text": "术前B超定位与术中切除甲状旁腺结节的符合率为（  ）", "options": ["A.63.3%", "B.73.3%", "C.77.8%", "D.83.3%", "E.95%"], "answer": "D", "explanation": "术前B超定位与术中切除甲状旁腺结节符合率为83.3%，颈部CT检查符合率为77.8%，增强CT检查符合率为95%，MIBI延迟显像符合率为88.9%。"}]}, {"type": "multiple", "questions": [{"text": "慢性肾脏病矿物质和骨异常（CKD-MBD）的异常包括下列哪些方面（  ）", "options": ["Ａ.钙、磷、PTH以及维生素D代谢异常", "Ｂ.骨转化、骨矿化、骨量、骨线性生长或骨强度异常", "Ｃ.血管和其他软组织钙化", "Ｄ.血清白蛋白水平降低", "Ｅ.空腹血糖升高"], "answer": "ABC", "explanation": "CKD-MBD包括三方面异常：钙、磷、PTH以及维生素D代谢异常；骨转化、骨矿化、骨量、骨线性生长或骨强度异常；血管和其他软组织钙化。选项D血清白蛋白降低和选项E血糖升高不属于CKD-MBD的范畴。"}, {"text": "血磷升高可导致下列哪些并发症（  ）", "options": ["Ａ.皮肤瘙痒", "Ｂ.继发性甲状旁腺功能亢进", "Ｃ.甲状腺功能减退", "Ｄ.血管钙化与心血管事件", "Ｅ.肾性骨病与骨折"], "answer": "ABDE", "explanation": "血磷升高可导致皮肤瘙痒、继发性甲状旁腺功能亢进、血管钙化与心血管事件、肾性骨病与骨折、肾病进展甚至死亡。选项C甲状腺功能减退与血磷升高无直接关系。"}, {"text": "关于血管钙化的类型及其临床后果，下列正确的有（  ）", "options": ["Ａ.甲状腺结节形成是血管钙化的直接后果", "Ｂ.血管内膜钙化局限于管腔或血管内皮，主要与动脉粥样硬化相关", "Ｃ.血管内膜钙化可导致血管狭窄、管腔狭窄和血压升高", "Ｄ.血管中层钙化使血管壁硬度增加、血泵和顺应性降低", "Ｅ.血管中层钙化表现为高血压、外周动脉疾病甚至心室肥大"], "answer": "BCDE", "explanation": "血管内膜钙化局限于管腔或血管内皮，主要与动脉粥样硬化相关，导致血管狭窄和血压升高；血管中层钙化影响由血管平滑肌细胞组成的血管壁中层，导致血管壁硬度增加、顺应性降低，表现为高血压、外周动脉疾病甚至心室肥大。选项A甲状腺结节形成不是血管钙化的后果。"}, {"text": "关于CKD患者生化指标的监测频率，下列正确的有（  ）", "options": ["Ａ.CKD G1-G2期血磷每6-12个月监测", "Ｂ.CKD G3a/G3b期血磷每6-12个月监测", "Ｃ.CKD G4期血磷每6-12个月监测", "Ｄ.CKD G4期血磷每3-6个月监测", "Ｅ.CKD G5期血磷每1-3个月监测"], "answer": "ABDE", "explanation": "血磷、血钙的监测频率为CKD G1-G2期每6-12个月、G3a/G3b期每6-12个月、G4期每3-6个月、G5期每1-3个月。选项C错误，G4期血磷的监测频率应为每3-6个月。"}, {"text": "关于血清钙的评估，下列正确的有（  ）", "options": ["Ａ.具有生物学活性的离子钙仅占血清总钙40%-50%", "Ｂ.血清钙只占体内总钙的1%左右", "Ｃ.血清白蛋白浓度低于40g/L时建议采用校正钙", "Ｄ.校正钙(mg/dl)=血清总钙(mg/dl)-0.8×[4-血清白蛋白(g/dl)]", "Ｅ.大部分钙沉积在骨中"], "answer": "ABCE", "explanation": "离子钙仅占血清总钙40%-50%，血清钙只占体内总钙的1%左右，大部分钙沉积在骨中；血清白蛋白低于40g/L时建议采用校正钙，校正钙(mg/dl)=血清总钙(mg/dl)+0.8×[4-血清白蛋白(g/dl)]。选项D错误，公式中应为加号。"}, {"text": "建议进行骨活检的指征包括（  ）", "options": ["Ａ.不明原因骨折", "Ｂ.持续性骨痛", "Ｃ.轻度贫血", "Ｄ.不明原因高钙血症", "Ｅ.不明原因低磷血症"], "answer": "ABDE", "explanation": "建议进行骨活检的指征包括不明原因骨折、持续性骨痛、不明原因高钙血症、不明原因低磷血症、可能的铝中毒及使用双膦酸盐治疗CKD-MBD之前。选项C轻度贫血不属于骨活检指征。"}, {"text": "建议进行心血管钙化评估的患者包括（  ）", "options": ["Ａ.所有CKD G1期患者", "Ｂ.有显著高磷血症需个体化高剂量磷结合剂治疗者", "Ｃ.等待肾移植者", "Ｄ.CKD G5D期患者", "Ｅ.医师评估后认为需要检查的患者"], "answer": "BCDE", "explanation": "建议对显著高磷血症需要个体化高剂量磷结合剂治疗者、等待肾移植患者、CKD G5D期患者和医师评估后认为需要检查的患者，进行心血管钙化评估。选项A错误，并非所有CKD G1期患者均需评估，血管钙化的筛查监测至少应从CKD G3a期开始。"}, {"text": "血管钙化的危险因素包括（  ）", "options": ["Ａ.高血压", "Ｂ.糖尿病", "Ｃ.血脂紊乱", "Ｄ.吸烟", "Ｅ.血清白蛋白升高"], "answer": "ABCD", "explanation": "防治血管钙化应从控制或纠正危险因素入手，危险因素包括高血压、糖尿病、血脂紊乱、营养不良、肥胖、吸烟以及矿物质与骨代谢异常。选项E血清白蛋白升高不是血管钙化的危险因素。"}, {"text": "关于血磷与临床不良结局的关系，下列正确的有（  ）", "options": ["Ａ.非透析CKD患者血磷每升高1mg/dL，进展至肾衰风险增加36%", "Ｂ.非透析CKD患者血磷每升高1mg/dL，心血管死亡风险增加16%", "Ｃ.非透析CKD患者血磷每升高1mg/dL，全因死亡风险增加26%", "Ｄ.血液透析患者血磷每升高1mmol/L，出血性卒中风险升高26%", "Ｅ.磷酸盐与全因死亡率的关系呈U型，存在最低风险范围"], "answer": "ACDE", "explanation": "血磷每升高1mg/dL，非透析CKD患者进展至肾衰风险增加36%、心血管死亡风险增加50%、全因死亡风险增加26%；血液透析患者血磷每升高1mmol/L，出血性卒中风险升高26%；磷酸盐、iPTH与全因死亡率的关系呈U型，存在最低风险范围。选项B错误，心血管死亡风险增加的是50%。"}, {"text": "关于降磷治疗的措施，下列正确的有（  ）", "options": ["Ａ.限制饮食磷的摄入", "Ｂ.充分透析，考虑延长透析时间或增加透析频率", "Ｃ.合理使用磷结合剂", "Ｄ.对所有患者严格限制蛋白质摄入以降低血磷", "Ｅ.采用专业化的强化教育以改善血磷控制"], "answer": "ABCE", "explanation": "降磷治疗遵循3D原则：饮食限磷、充分透析、合理使用磷结合剂，并强调专业化的强化教育。选项D错误，蛋白摄入受限时即使血磷水平降低，患者死亡率仍然较高，通过限制蛋白质来降磷可能抵消降磷带来的获益。"}, {"text": "合理控制饮食以降低血磷的措施包括（  ）", "options": ["Ａ.选择磷蛋白比相对较低的食物", "Ｂ.避免含磷的添加剂", "Ｃ.鼓励大量饮用肉汤以补充营养", "Ｄ.采用合理的烹饪方法", "Ｅ.警惕医源性磷摄入"], "answer": "ABDE", "explanation": "合理控制饮食包括选择磷蛋白比相对较低的食物、避免含磷的添加剂、采用合理的烹饪方法、警惕医源性磷摄入。选项C错误，水煮时间越长汤中磷含量越高，饮食习惯（例如喝肉汤习惯）可能是血磷控制不理想的原因之一。"}, {"text": "关于不同来源磷的吸收特点，下列正确的有（  ）", "options": ["Ａ.动物蛋白中40%-60%的磷被吸收", "Ｂ.植物蛋白中30%-50%的磷被吸收", "Ｃ.食品添加剂中的无机磷大于90%被吸收", "Ｄ.植物蛋白中磷的吸收率高于动物蛋白", "Ｅ.添加含磷添加剂的食物磷含量较未添加者显著增加将近70%"], "answer": "ABCE", "explanation": "动物蛋白（肉类、蛋类及乳制品）中40%-60%的磷被吸收，植物蛋白（如豆类）中30%-50%的磷被吸收，食品添加剂中的无机磷大于90%被吸收；添加含磷添加剂的食物磷含量较未添加者显著增加将近70%。选项D错误，植物蛋白中磷的吸收低于动物蛋白。"}, {"text": "关于磷结合剂的临床应用，下列正确的有（  ）", "options": ["Ａ.非含钙磷结合剂可用于禁忌使用含钙磷结合剂的患者", "Ｂ.需要限制含钙磷结合剂剂量时，非含钙磷结合剂可作为降磷治疗的药物选择", "Ｃ.CKD G3a-G5D期患者应限制含钙磷结合剂的使用", "Ｄ.合并动脉钙化、无动力性骨病或血清iPTH持续过低时，建议限制含钙磷结合剂的使用", "Ｅ.CKD G3a-G5D期患者均应常规以含钙磷结合剂作为首选"], "answer": "ABCD", "explanation": "当禁忌使用含钙磷结合剂，或需要限制含钙磷结合剂剂量时，非含钙磷结合剂应作为降磷治疗的药物选择；CKD G3a-G5D期患者应限制含钙磷结合剂的使用；若高钙血症持续存在或反复发生，或合并动脉钙化和/或无动力性骨病和/或血清iPTH水平持续过低，建议限制含钙磷结合剂的使用。选项E错误，指南强调非含钙磷结合剂作为一线磷结合剂选择并限制含钙磷结合剂的使用。"}, {"text": "关于拟钙剂的临床作用与问题，下列正确的有（  ）", "options": ["Ａ.有确切证据表明西那卡塞可显著降低患者死亡风险、心血管事件风险和骨折风险", "Ｂ.变构激活钙敏感受体，减少PTH释放", "Ｃ.不增加肠道对钙磷的吸收", "Ｄ.明确降低iPTH以及改善其他矿物质代谢异常生化指标", "Ｅ.血钙降低仅为轻度到中度"], "answer": "BCDE", "explanation": "拟钙剂变构激活钙敏感受体、减少PTH释放，不增加肠道对钙磷的吸收，可明确降低iPTH以及改善其他矿物质代谢异常生化指标，引起的血钙降低仅为轻度到中度。选项A错误，目前无确切证据表明西那卡塞可降低患者死亡风险、心血管事件风险、骨折风险。"}, {"text": "关于西那卡塞的使用与监测，下列正确的有（  ）", "options": ["Ａ.建议从小剂量开始，调整间期3周或以上", "Ｂ.治疗期间无需监测血钙", "Ｃ.给药初期每周测定1次血钙", "Ｄ.维持期2周测定1次血钙", "Ｅ.iPTH在正常上限两倍以下时减量或停用"], "answer": "ACDE", "explanation": "拟钙剂建议从小剂量开始、调整间期3周或以上，给药初期每周测定1次血钙、维持期2周测定1次血钙，iPTH在正常上限两倍以下时减量或停用。选项B错误，西那卡塞可导致低钙血症，治疗期间必须监测血钙。"}, {"text": "关于1,25-(OH)2D3的作用机制，下列正确的有（  ）", "options": ["Ａ.抑制甲状旁腺细胞的增殖", "Ｂ.降低PTH基因的转录，抑制PTH的合成与分泌", "Ｃ.直接升高血磷水平并加重血管钙化", "Ｄ.增加甲状旁腺VDR数目和对钙的敏感性，恢复钙调定点正常", "Ｅ.促进小肠对钙的吸收，提高血钙水平，反馈抑制PTH分泌"], "answer": "ABDE", "explanation": "1,25-(OH)2D3可直接抑制甲状旁腺细胞增殖、降低PTH基因转录而抑制PTH合成与分泌、增加甲状旁腺VDR数目和对钙的敏感性以恢复钙调定点正常，并间接促进小肠对钙的吸收、提高血钙水平反馈抑制PTH分泌以及促进FGF23分泌降低血磷。选项C错误，其作用是降低血磷而非升高血磷。"}, {"text": "继发性甲状旁腺功能亢进的临床表现包括（  ）", "options": ["Ａ.骨骼系统可出现骨痛、病理骨折、骨骼畸形与身高缩短", "Ｂ.心脑血管系统可出现血管钙化、瓣膜钙化、心功能衰竭", "Ｃ.血液系统可出现贫血、凝血功能异常、骨髓纤维化", "Ｄ.皮肤表现以多毛症为主", "Ｅ.神经精神方面可出现周围神经炎、失眠、抑郁"], "answer": "ABCE", "explanation": "SHPT的临床表现涉及骨骼系统（骨痛、行走困难、骨质疏松、病理骨折、骨骼畸形、身高缩短）、心脑血管系统（血管钙化、瓣膜钙化、动脉硬化、心功能衰竭、尿毒症心肌病）、血液系统（贫血、凝血功能异常、骨髓纤维化）、神经精神损害（周围神经炎、失眠、精力不集中、抑郁、易激惹）以及皮肤瘙痒、皮肤及软组织肿瘤样钙化。选项D错误，皮肤表现以瘙痒为主而非多毛。"}, {"text": "关于正常甲状旁腺的解剖特点，下列正确的有（  ）", "options": ["Ａ.正常甲状旁腺分上下2对，共4个腺体", "Ｂ.甲状旁腺均位于甲状腺实质内", "Ｃ.平均大小约5mm×3mm×1mm", "Ｄ.细胞主要为主细胞与嗜酸细胞", "Ｅ.异位比例约16%-20%"], "answer": "ACDE", "explanation": "正常甲状旁腺分上下2对，共4个腺体，平均大小约5mm×3mm×1mm，细胞主要为主细胞和嗜酸细胞，异位比例约16%-20%，异位部位包括甲状腺实质内、气管食管陷窝、食管后部、胸骨后胸腺附近、前纵膈等。选项B错误，甲状旁腺并非均位于甲状腺实质内。"}, {"text": "关于甲状旁腺影像定位的符合率，下列正确的有（  ）", "options": ["Ａ.术前超声定位与术中切除甲状旁腺结节的符合率为83.3%", "Ｂ.颈部CT检查的符合率为77.8%", "Ｃ.增强CT检查的符合率为95%", "Ｄ.MIBI延迟显像的符合率为88.9%", "Ｅ.术前超声定位的符合率高于增强CT检查"], "answer": "ABCD", "explanation": "术前B超定位与术中切除甲状旁腺结节符合率为83.3%，颈部CT检查符合率为77.8%，增强CT检查符合率为95%，MIBI延迟显像符合率为88.9%。选项E错误，增强CT检查符合率（95%）高于术前超声定位（83.3%）。"}, {"text": "关于继发性甲状旁腺功能亢进的手术与微创治疗，下列正确的有（  ）", "options": ["Ａ.甲状旁腺切除手术的并发症包括低钙血症与喉返神经损伤", "Ｂ.SHPT术后存在复发可能", "Ｃ.手术治疗受患者条件局限", "Ｄ.开放式外科手术可应用于所有SHPT患者", "Ｅ.微创治疗方式包括射频消融、微波消融、无水酒精注射与腔镜手术"], "answer": "ABCE", "explanation": "SHPT手术治疗存在的问题包括患者无手术条件等局限性，以及低钙血症、喉返神经损伤、围手术期死亡、SHPT术后复发等手术并发症；微创治疗方式包括药物注射、腔镜手术、射频消融、微波消融和机器人手术。选项D错误，开放式外科手术因其局限性不能应用于所有患者。"}]}, {"type": "short", "questions": [{"text": "简述成人CKD患者矿物质和骨代谢异常相关生化指标的监测时机与监测频率要点。", "options": [], "answer": "（1）监测时机：成人CKD患者推荐从CKD G3a期开始监测血清钙、磷、iPTH及ALP水平，并建议检测25(OH)D水平。（2）监测频率：血磷、血钙在CKD G1-G2期、G3a/G3b期均为每6-12个月，G4期为每3-6个月，G5期为每1-3个月；ALP在各期均为每6-12个月；iPTH在G1-G2期、G3a/G3b期根据基线水平和CKD进展情况决定，G4期为每6-12个月，G5期为每3-6个月（如iPTH升高可缩短）；25(OH)D根据基线水平和治疗干预措施决定。", "explanation": "钙、磷在GFR&gt;40ml/(min·1.73m²)前常无明显异常，在GFR&gt;20ml/(min·1.73m²)前相对稳定；iPTH在GFR&gt;80ml/(min·1.73m²)时约12%患者已接近正常高限，近60%患者在GFR&gt;60ml/(min·1.73m²)出现升高；ALP与CKD死亡率线性相关，25(OH)D水平与CKD严重程度相关。因此临床上强调根据生化指标变化趋势而非单个实验室检测结果制定治疗决策。"}, {"text": "简述继发性甲状旁腺功能亢进的临床表现（按系统分述）。", "options": [], "answer": "（1）骨骼系统：骨痛、行走困难、瘫痪卧床、骨质疏松、病理骨折、骨骼畸形、身高缩短；重度可出现退缩人综合征、面部畸形、骨痛和关节不适、瘙痒、骨溶解，体征可有骨骼触痛。轻中度常无症状，重度才出现明显症状。（2）心脑血管系统：血管钙化、瓣膜钙化、动脉硬化、心功能衰竭、尿毒症心肌病、异位钙化。（3）血液系统：贫血、凝血功能异常、骨髓纤维化。（4）神经精神损害：周围神经炎、失眠、精力不集中、抑郁、脑电波异常、辨识能力差、易激惹。（5）其它：皮肤瘙痒、皮肤及软组织肿瘤样钙化。", "explanation": "SHPT以PTH升高为核心，常伴血钙升高或降低、血磷升高。实验室指标异常与临床表现密切相关：CKD患者出现1,25(OH)2D3下降、FGF23升高、低钙、高磷与PTH升高，进而导致血管钙化、骨质疏松、骨折与肾性骨病。严重者可出现退缩人综合征与反复病理性骨折。"}, {"text": "简述降磷治疗的3D原则以及饮食限磷的具体措施。", "options": [], "answer": "降磷治疗遵循3D原则：饮食限磷、充分透析、合理使用磷结合剂。饮食限磷的具体措施包括：（1）选择磷蛋白比相对较低的食物，通常选择磷/蛋白比小于12mg/g的食物；（2）避免含磷的添加剂；（3）采用合理的烹饪方法；（4）警惕医源性磷摄入。新版指南建议CKD G3a-G5D期患者血磷超过目标值时限制饮食磷摄入800-1000mg/天，或/和联合其他降磷措施；并强调专业化的强化教育以改善血磷控制。", "explanation": "加工食品中的无机磷（食品添加剂）大于90%被吸收，远高于动物蛋白的40%-60%和植物蛋白的30%-50%；添加含磷添加剂的食物磷含量较未添加者显著增加将近70%。水煮可使食物磷蛋白比降低，但会使汤中含有大量的磷，喝肉汤习惯可能是血磷控制不理想的原因之一。12.5%的药物使用磷酸盐作为赋形剂，属于易被忽略的“隐藏磷”。此外，通过限制蛋白质来降磷可能抵消降磷带来的获益，蛋白摄入降低后患者死亡风险明显升高。"}, {"text": "简述活性维生素D及其类似物治疗继发性甲状旁腺功能亢进的给药方案。", "options": [], "answer": "（1）小剂量持续疗法：适用于轻度SHPT（iPTH&lt;300pg/ml）或中重度SHPT维持期（CKD3、4期），骨化三醇0.25μg，每天一次；若iPTH降至目标范围，可减少原剂量的25%-50%甚至隔日服用，最终以最小剂量维持。（2）大剂量间歇疗法（冲击疗法）：适用于中重度SHPT，iPTH 300-500pg/ml给予1-2μg、每周2-3次；iPTH 500-1000pg/ml给予2-4μg、每周2-3次；iPTH&gt;1000pg/ml给予4-6μg、每周2-3次；治疗4-8周无明显下降者每周剂量增加25%-50%。（3）帕立骨化醇（选择性维生素D受体激动剂）：血浆PTH 300-600pg/mL者每次血透起始5μg、一周三次；600-1000pg/mL者起始5-10μg；1000-1500pg/mL者起始10μg；&gt;1500pg/mL者起始15μg，均一周三次；以2-4周为间隔进行剂量调整。", "explanation": "活性维生素D的直接作用为抑制甲状旁腺细胞增殖、降低PTH基因转录、增加甲状旁腺VDR数目和对钙的敏感性并恢复钙调定点正常；间接作用为促进小肠对钙的吸收、提高血钙水平反馈抑制PTH分泌以及促进FGF23分泌降低血磷；骨骼作用为增加骨骼VDR数目与敏感性、改善PTH抵抗、促进骨形成。治疗过程中应监控血钙和血磷水平，避免高钙血症和高磷血症并防止过度抑制甲状旁腺功能。"}, {"text": "简述继发性甲状旁腺功能亢进的手术治疗方式、常见并发症，以及微创治疗途径。", "options": [], "answer": "（1）手术治疗方式：甲状旁腺切除术（包括甲状旁腺次全切除术、甲状旁腺全切除加自体移植术等）以及甲状旁腺介入治疗。（2）手术并发症与问题：低钙血症、喉返神经损伤、围手术期死亡、SHPT术后复发；此外手术治疗还受患者无手术条件等局限性的影响。（3）微创治疗途径：药物注射（如超声引导下无水酒精硬化治疗、帕立骨化醇药物腺体局部注射治疗）、腔镜手术、射频消融、微波消融、机器人手术。", "explanation": "开放式外科手术因其局限性不能应用于所有患者，微创治疗是可行的方案之一，并将成为继发性甲旁亢治疗的探索方向。超声引导下经皮微波消融可作为不能手术或不愿手术的透析患者的非手术微创替代选择；治疗SHPT的同时应防止甲状旁腺功能低下，继发性甲旁亢治疗方案多样，个体化治疗及随访是关键。"}]}]}, {"num": 34, "title": "血管通路的介入治疗理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血管通路是接受血液透析的终末期肾病患者的（ ）。", "options": ["A.备用通道", "B.生命线", "C.营养通路", "D.输液通道", "E.康复指标"], "answer": "B", "explanation": "血管通路是接受血液透析的终末期肾病患者的生命线，是完成血液透析治疗的基本条件。"}, {"text": "血管通路常见的临床问题不包括（ ）。", "options": ["A.造瘘失败", "B.内瘘成熟不良", "C.内瘘穿刺失败", "D.左心室肥厚", "E.流量不够"], "answer": "D", "explanation": "血管通路常见问题包括造瘘失败、内瘘成熟不良、内瘘穿刺失败和流量不够；左心室肥厚属心血管结构改变，不属于血管通路常见问题。"}, {"text": "动静脉内瘘失功时可出现的表现不包括（ ）。", "options": ["A.震颤减弱", "B.条索物感", "C.皮下包块", "D.止血困难", "E.血糖升高"], "answer": "E", "explanation": "动静脉内瘘失功表现为震颤减弱、成熟不良、仅能触及搏动、流量不足、条索物感、肢体肿胀、假性动脉瘤形成、静脉侧支扩张显露、血栓形成、皮下包块、内瘘狭窄、穿刺困难及止血困难；血糖升高与内瘘失功无直接关系。"}, {"text": "内瘘血管狭窄触诊时的典型表现是（ ）。", "options": ["A.狭窄部位柔软松弛", "B.狭窄远端变细", "C.狭窄部位僵硬、变细", "D.狭窄近端搏动消失", "E.局部皮温降低"], "answer": "C", "explanation": "内瘘血管狭窄触诊表现为狭窄部位僵硬、变细，其远端血管扩张、搏动增强，近端可触及震颤。"}, {"text": "内瘘血管狭窄时，狭窄部位听诊所闻及的杂音特点是（ ）。", "options": ["A.高尖非连续杂音", "B.持续隆隆样杂音", "C.柔和低调杂音", "D.完全无杂音", "E.单一收缩期杂音"], "answer": "A", "explanation": "内瘘血管狭窄时狭窄部位可闻及高尖非连续的杂音，近端可闻及连续性杂音；持续、隆隆样杂音见于功能正常的内瘘。"}, {"text": "内瘘血管狭窄的症状指标中，透析血流量的界值是（ ）。", "options": ["A.≤120ml/min", "B.≤150ml/min", "C.≤180ml/min", "D.≤250ml/min", "E.≤300ml/min"], "answer": "C", "explanation": "内瘘血管狭窄的症状指标包括透析血流量≤180ml/min、静脉压≥150mmHg等。"}, {"text": "内瘘血管狭窄的症状指标中，静脉压的界值是（ ）。", "options": ["A.≥100mmHg", "B.≥150mmHg", "C.≥120mmHg", "D.≥180mmHg", "E.≥200mmHg"], "answer": "B", "explanation": "内瘘血管狭窄时静脉压≥150mmHg，或较基础值增高≥50mmHg。"}, {"text": "用于血管通路介入治疗的Invatec球囊，其工作压力是（ ）。", "options": ["A.5bar", "B.6bar", "C.10bar", "D.8bar", "E.17bar"], "answer": "D", "explanation": "血管通路介入治疗所用Invatec球囊的工作压力为8bar，爆破压为17bar。"}, {"text": "内瘘血管狭窄的手术指征中，血管内径的界值是（ ）。", "options": ["A.&lt;1.0mm", "B.&lt;1.5mm", "C.&lt;2.0mm", "D.&lt;2.5mm", "E.&lt;3.0mm"], "answer": "C", "explanation": "内瘘血管狭窄的手术指征为血管狭窄程度≥50%或血管内径&lt;2.0mm，并伴有相关临床情况之一。"}, {"text": "内瘘血管狭窄的手术指征中，血管狭窄程度的界值是（ ）。", "options": ["A.≥20%", "B.≥30%", "C.≥40%", "D.≥70%", "E.≥50%"], "answer": "E", "explanation": "血管狭窄程度≥50%或血管内径&lt;2.0mm，并有血流下降伴血管瘤形成、静脉压上升、重复循环率上升或BUN异常增高等情况之一者，具备手术指征。"}, {"text": "关于内瘘血管狭窄的治疗，下列描述正确的是（ ）。", "options": ["A.PTA创伤大、恢复慢", "B.PTA推荐作为首选方法", "C.PTA不能重复进行", "D.外科手术应作为首选", "E.均需立即外科手术"], "answer": "B", "explanation": "经皮穿刺腔内血管成形术（PTA）创伤小，可较好地保持血管的解剖完整性，且可反复进行，推荐作为内瘘血管狭窄的首选治疗方法。"}, {"text": "内瘘血管狭窄时，外科手术的适用情况是（ ）。", "options": ["A.PTA失败或PTA不适宜", "B.所有狭窄病例", "C.仅用于I型狭窄", "D.仅用于内瘘血栓", "E.血流量正常者"], "answer": "A", "explanation": "外科手术适用于经皮穿刺腔内血管成形术（PTA）失败或PTA不适宜的内瘘血管狭窄病例。"}, {"text": "I型内瘘狭窄的部位是（ ）。", "options": ["A.动静脉内瘘血管穿刺部位", "B.内瘘相关静脉汇入深静脉处", "C.供给内瘘血流的动脉", "D.吻合口及距吻合口2cm内静脉", "E.中心静脉导管尖端"], "answer": "D", "explanation": "I型内瘘狭窄见于动静脉吻合口及距吻合口2cm内的静脉血管，处理推荐重造或经皮穿刺腔内血管成形术（PTA）。"}, {"text": "II型内瘘狭窄的部位是（ ）。", "options": ["A.吻合口及距吻合口2cm内静脉", "B.内瘘相关静脉汇入深静脉处", "C.动静脉内瘘血管穿刺部位", "D.供给内瘘血流的动脉", "E.上腔静脉"], "answer": "C", "explanation": "II型内瘘狭窄位于动静脉内瘘血管穿刺部位，处理首选经皮穿刺腔内血管成形术（PTA）。"}, {"text": "III型内瘘狭窄的部位是（ ）。", "options": ["A.吻合口及距吻合口2cm内静脉", "B.内瘘血管穿刺部位", "C.供给内瘘血流的动脉", "D.肱动脉近端", "E.内瘘静脉汇入深静脉处"], "answer": "E", "explanation": "III型内瘘狭窄指动静脉内瘘相关静脉汇入深静脉处的狭窄，处理首选经皮穿刺腔内血管成形术（PTA）。"}, {"text": "IV型内瘘狭窄的部位是（ ）。", "options": ["A.供给内瘘血流的动脉", "B.吻合口及距吻合口2cm内静脉", "C.内瘘血管穿刺部位", "D.静脉汇入深静脉处", "E.中心静脉及右心房"], "answer": "A", "explanation": "IV型内瘘狭窄指供给动静脉内瘘血流的动脉狭窄，处理首选经皮穿刺腔内血管成形术（PTA）。"}, {"text": "内瘘血栓形成最主要的病因是（ ）。", "options": ["A.高磷血症", "B.血管狭窄", "C.高血糖", "D.贫血", "E.低蛋白血症"], "answer": "B", "explanation": "血管狭窄是造成内瘘血栓形成的最主要原因；低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染也是常见原因。"}, {"text": "自体内瘘发生血栓形成时，血栓最常位于（ ）。", "options": ["A.静脉穿刺点", "B.动脉穿刺点", "C.内瘘吻合口", "D.中心静脉", "E.肘部静脉"], "answer": "C", "explanation": "自体内瘘血栓形成中，内瘘吻合口部位占75%，为最常受累部位。"}, {"text": "移植血管内瘘发生血栓形成时，血栓最常位于（ ）。", "options": ["A.内瘘吻合口", "B.动脉吻合口", "C.穿刺部位", "D.静脉吻合口", "E.中心静脉"], "answer": "D", "explanation": "移植血管内瘘血栓形成中，静脉吻合口部位占85%，为最常受累部位。"}, {"text": "内瘘血栓形成后行溶栓治疗，最好在多长时间内进行（ ）。", "options": ["A.24小时内", "B.6小时内", "C.12小时内", "D.36小时内", "E.72小时内"], "answer": "A", "explanation": "内瘘血栓的溶栓治疗最好在24小时内进行；超过24小时者，在48小时内仍有希望。"}, {"text": "尿激酶溶栓时，药物经生理盐水稀释后的泵入速度是（ ）。", "options": ["A.1~5ml/H", "B.15~25ml/H", "C.5~15ml/H", "D.25~35ml/H", "E.35~50ml/H"], "answer": "C", "explanation": "尿激酶溶栓的用法为尿激酶10~20单位加入生理盐水50ml中，以5~15ml/H速度泵入。"}, {"text": "尿激酶溶栓治疗内瘘血栓的合并用药是（ ）。", "options": ["A.华法林", "B.阿司匹林", "C.氯吡格雷", "D.低分子肝素", "E.利伐沙班"], "answer": "D", "explanation": "尿激酶溶栓治疗内瘘血栓时的合并用药为低分子肝素。"}, {"text": "尿激酶溶栓的禁忌症中，对内瘘建立时间的要求是（ ）。", "options": ["A.小于7天", "B.小于14天", "C.小于21天", "D.小于60天", "E.小于30天"], "answer": "E", "explanation": "动静脉内瘘小于30天者为尿激酶溶栓的禁忌症之一。"}, {"text": "下列不属于尿激酶溶栓禁忌症的是（ ）。", "options": ["A.有活动性出血者", "B.血小板计数为200×10⁹/L", "C.合并严重肝脏疾病", "D.2周内有消化道及泌尿道出血", "E.血小板低于100×10⁹/L"], "answer": "B", "explanation": "尿激酶溶栓的禁忌症包括有活动性出血者、合并严重肝脏疾病、2周内有消化道及泌尿道出血、血小板低于100×10⁹/L等；血小板计数为200×10⁹/L属正常范围，不是禁忌症。"}, {"text": "尿激酶溶栓的禁忌症中，凝血酶原时间的判定标准是（ ）。", "options": ["A.较正常对照组延长3s者", "B.较正常对照组延长1s者", "C.较正常对照组缩短3s者", "D.与正常对照组相等者", "E.无需参考凝血酶原时间"], "answer": "A", "explanation": "凝血酶原时间较正常对照组延长3s者为尿激酶溶栓的禁忌症之一。"}, {"text": "尿激酶溶栓通路时可选择的穿刺部位是（ ）。", "options": ["A.仅动脉入路", "B.仅静脉入路", "C.仅瘘口", "D.动脉入路、静脉入路或瘘口", "E.仅对侧肢体静脉"], "answer": "D", "explanation": "尿激酶溶栓通路的穿刺部位可选择动脉入路、静脉入路或瘘口，留置针可选用单针或双针。"}, {"text": "尿激酶溶栓通路操作中的注意事项不包括（ ）。", "options": ["A.防止脱针", "B.防止气体进入", "C.监测血糖变化", "D.注意压迫", "E.妥善固定留置针"], "answer": "C", "explanation": "尿激酶溶栓通路操作的注意事项包括防止脱针、防止气体进入和注意压迫；监测血糖变化与该项操作无直接关系。"}, {"text": "内瘘假性动脉瘤的处理方法是（ ）。", "options": ["A.单纯加压包扎", "B.立即结扎内瘘", "C.长期留置导管", "D.口服止血药物", "E.球囊封堵+凝血酶凝固"], "answer": "E", "explanation": "内瘘假性动脉瘤可采用球囊封堵联合凝血酶凝固的方法处理。"}, {"text": "内瘘介入治疗后的定期随访时间间隔是（ ）。", "options": ["A.1~2周", "B.3~6个月", "C.1个月", "D.12个月", "E.24个月"], "answer": "B", "explanation": "内瘘介入治疗后应定期随访，随访时间间隔为3~6个月。"}, {"text": "内瘘介入治疗后的注意事项不包括（ ）。", "options": ["A.压迫止血并注意压力、时间", "B.超声评估血管内径、内膜损伤", "C.应用抗凝、活血药物", "D.术后立即结扎内瘘", "E.术后3~6个月定期随访"], "answer": "D", "explanation": "内瘘介入治疗后的注意事项包括压迫止血（注意压力、时间）、超声术后评估（血管内径、内膜损伤、血栓形成等）、抗凝和活血药物应用以及术后3~6个月定期随访；术后立即结扎内瘘不属于术后注意事项。"}, {"text": "内瘘介入治疗后超声评估的内容包括血管内径、内膜损伤和（ ）。", "options": ["A.血栓形成", "B.肝功能", "C.肾功能", "D.血糖水平", "E.心功能"], "answer": "A", "explanation": "内瘘介入治疗后的超声评估内容包括血管内径、内膜损伤、血栓形成等。"}, {"text": "DSA引导在血管通路介入治疗中的优势是（ ）。", "options": ["A.无射线摄入", "B.费用最低", "C.通过血管造影清晰显示血管整体情况", "D.无需造影剂", "E.可清晰显示血管内皮细节"], "answer": "C", "explanation": "DSA引导可通过血管造影清晰显示血管的整体情况，包括血管分支、狭窄程度和流量情况；其不足为存在射线摄入、需使用造影剂、血管细节显示较差且对设备要求高。"}, {"text": "DSA引导的不足不包括（ ）。", "options": ["A.射线摄入", "B.需要使用造影剂", "C.血管细节显示较差", "D.对设备要求高", "E.检查费用低廉"], "answer": "E", "explanation": "DSA引导的不足包括射线摄入、需要使用造影剂、血管细节显示较差（内皮显示不佳、血管影重叠）以及对设备要求高；该项检查的费用并不低廉。"}, {"text": "超声引导在血管通路介入治疗中的优势是（ ）。", "options": ["A.可清晰评估中心静脉", "B.无射线摄入、便捷且费用较低", "C.需使用造影剂", "D.对设备要求极高", "E.可显示血管内皮细节"], "answer": "B", "explanation": "超声引导的优势为无射线摄入、操作便捷、费用较低；其不足是无法评估中心静脉。"}, {"text": "超声引导在血管通路介入治疗中的主要不足是（ ）。", "options": ["A.存在射线摄入", "B.需使用造影剂", "C.费用高昂", "D.无法评估中心静脉", "E.无法显示血管管腔"], "answer": "D", "explanation": "超声引导的不足是无法评估中心静脉；其优势为无射线摄入、操作便捷、费用较低。"}, {"text": "中心静脉评估的常用影像学方法包括超声评估、CTV评估和（ ）。", "options": ["A.DSA评估", "B.超声心动图", "C.胸部X线平片", "D.PET-CT", "E.核素肾图"], "answer": "A", "explanation": "中心静脉评估的常用方法包括超声评估、CTV评估和DSA评估。"}, {"text": "中心静脉超声评估时，部分血管无法显示的主要原因是（ ）。", "options": ["A.血管内径过大", "B.血流速度过快", "C.未使用造影剂", "D.患者年龄偏大", "E.位置过深或骨性结构遮挡"], "answer": "E", "explanation": "中心静脉超声评估时，部分血管可通过调整探头位置显示，部分血管因位置过深或骨性结构遮挡而无法显示。"}, {"text": "判定中心静脉导管功能不良时，导管有效血流量的界值是（ ）。", "options": ["A.小于100ml/min", "B.小于150ml/min", "C.小于200ml/min", "D.小于250ml/min", "E.小于300ml/min"], "answer": "C", "explanation": "中心静脉导管功能不良的判定标准之一为导管有效血流量小于200ml/min。"}, {"text": "判定中心静脉导管功能不良时，导管再循环率应大于（ ）。", "options": ["A.5%", "B.10%", "C.15%", "D.20%", "E.25%"], "answer": "B", "explanation": "中心静脉导管功能不良的判定标准之一为导管再循环大于10%。"}, {"text": "特别低体质量的患者或儿童患者，判定中心静脉导管功能不良时其流量应低于体质量的（ ）。", "options": ["A.1倍", "B.2倍", "C.3倍", "D.4倍", "E.5倍"], "answer": "D", "explanation": "特别低体质量的患者或儿童患者，透析流量低于体质量4倍即提示中心静脉导管功能不良。"}, {"text": "中心静脉导管功能不良处理流程中，考虑导管血栓时应首先采取的措施是（ ）。", "options": ["A.尿激酶溶栓", "B.立即拔除导管", "C.直接外科手术", "D.改行腹膜透析", "E.输血治疗"], "answer": "A", "explanation": "中心静脉导管功能不良处理流程中，考虑导管血栓时首先给予尿激酶溶栓，溶栓失败后再行导管造影拍片等处理。"}, {"text": "中心静脉导管出现纤维蛋白鞘时，处理方法是（ ）。", "options": ["A.加大尿激酶剂量", "B.调整导管位置", "C.使用剥离器剥离", "D.行血栓摘除术", "E.引导钢丝更换导管"], "answer": "C", "explanation": "中心静脉导管功能不良处理流程中，纤维蛋白鞘采用剥离器剥离的方法处理。"}, {"text": "中心静脉导管功能不良处理流程中，导管移位时应采取的措施是（ ）。", "options": ["A.剥离器剥离", "B.调整导管位置", "C.血栓摘除术", "D.立即拔管", "E.继续观察"], "answer": "B", "explanation": "中心静脉导管功能不良处理流程中，导管造影拍片确认导管移位后应调整导管位置。"}, {"text": "中心静脉的介入治疗包括中心静脉评估、中心静脉导管更换和（ ）。", "options": ["A.内瘘结扎术", "B.腹膜透析置管", "C.血液灌流", "D.肾移植", "E.中心静脉狭窄球囊扩张及支架置入"], "answer": "E", "explanation": "中心静脉的介入治疗包括中心静脉评估、中心静脉导管更换以及中心静脉狭窄的球囊扩张与支架置入。"}, {"text": "移植血管内瘘成形术的绝对禁忌证是（ ）。", "options": ["A.血压偏高", "B.血肌酐升高", "C.年龄大于70岁", "D.左室射血分数小于30%", "E.血红蛋白偏低"], "answer": "D", "explanation": "移植血管内瘘成形术的绝对禁忌证之一为左室射血分数小于30%。"}, {"text": "移植血管内瘘成形术的适应证是（ ）。", "options": ["A.自身血管无法建立自体动静脉内瘘者", "B.所有首次透析患者", "C.内瘘功能良好者", "D.血流量充足者", "E.仅限糖尿病肾病患者"], "answer": "A", "explanation": "移植血管内瘘成形术适用于利用自身血管无法建立自体动静脉内瘘者，包括反复制作内瘘致上肢动静脉血管耗竭、糖尿病或周围血管病等致上肢自身血管严重破坏以及原有内瘘血管瘤或狭窄切除后需用移植血管搭桥。"}, {"text": "内瘘听诊为持续、隆隆样杂音，提示（ ）。", "options": ["A.内瘘血管狭窄", "B.内瘘血栓形成", "C.内瘘功能正常", "D.内瘘假性动脉瘤形成", "E.中心静脉狭窄"], "answer": "C", "explanation": "内瘘听诊听到持续、隆隆样杂音属于正常表现；若为短促、吹风样杂音或伴有哨子样高调声音则提示异常。"}, {"text": "用于血管通路介入治疗的普通球囊扩张管，其推送杆长度是（ ）。", "options": ["A.40cm", "B.60cm", "C.100cm", "D.150cm", "E.80cm"], "answer": "E", "explanation": "普通球囊扩张管的推送杆长度为80cm，球囊长度为4cm，直径有4mm和6mm两种。"}, {"text": "在血管通路狭窄的处理中，具有一定优势并值得推广的治疗方式是（ ）。", "options": ["A.单纯药物治疗", "B.超声引导下腔内治疗", "C.内瘘结扎", "D.长期中心静脉导管透析", "E.单纯外科切除"], "answer": "B", "explanation": "在血管狭窄的处理方面，超声引导下腔内治疗具有一定优势，值得推广；该治疗仍存在支架应用、球囊选择、扩张目标等争议，有待进一步研究及长期随访观察。"}, {"text": "球囊扩张治疗内瘘狭窄的术中步骤顺序是（ ）。", "options": ["A.置入钢丝→置入球囊→球囊加压", "B.置入球囊→置入钢丝→球囊加压", "C.球囊加压→置入钢丝→置入球囊", "D.置入钢丝→球囊加压→置入球囊", "E.置入球囊→球囊加压→置入钢丝"], "answer": "A", "explanation": "球囊扩张治疗内瘘狭窄的术中步骤为：先置入引导钢丝，再顺导丝置入球囊，最后球囊加压以扩张狭窄段。"}]}, {"type": "multiple", "questions": [{"text": "理想的血管通路应满足的标准包括（ ）。", "options": ["Ａ.血流量充足", "Ｂ.并发症发生率低", "Ｃ.使用寿命长", "Ｄ.穿刺完全无痛", "Ｅ.无需任何监测"], "answer": "ABC", "explanation": "理想血管通路的标准为血流量充足、使用寿命长、并发症发生率低；穿刺疼痛程度与监测方式不属于这三项标准，故D、E错误。"}, {"text": "血管通路常见的临床问题包括（ ）。", "options": ["Ａ.造瘘失败", "Ｂ.内瘘穿刺失败", "Ｃ.左心室肥厚", "Ｄ.流量不够", "Ｅ.内瘘成熟不良"], "answer": "ABDE", "explanation": "血管通路常见问题为造瘘失败、内瘘成熟不良、内瘘穿刺失败和流量不够；左心室肥厚属于心血管结构改变，故C错误。"}, {"text": "动静脉内瘘失功时可出现的表现包括（ ）。", "options": ["Ａ.震颤减弱", "Ｂ.条索物感", "Ｃ.血糖升高", "Ｄ.假性动脉瘤形成", "Ｅ.静脉侧支扩张显露"], "answer": "ABDE", "explanation": "内瘘失功表现为震颤减弱、成熟不良、仅能触及搏动、流量不足、条索物感、肢体肿胀、假性动脉瘤形成、静脉侧支扩张显露、血栓形成、皮下包块、内瘘狭窄、穿刺困难及止血困难；血糖升高与内瘘失功无关，故C错误。"}, {"text": "内瘘血管狭窄的症状性指标包括（ ）。", "options": ["Ａ.透析血流量≥300ml/min", "Ｂ.透析血流量≤180ml/min", "Ｃ.静脉压≥150mmHg", "Ｄ.静脉压较基础值增高≥50mmHg", "Ｅ.重复循环率增加致透析效果下降≥10%"], "answer": "BCDE", "explanation": "内瘘血管狭窄的症状指标为透析血流量≤180ml/min、静脉压≥150mmHg或较基础值增高≥50mmHg、重复循环率增加使透析效果下降≥10%；血流量≥300ml/min高于异常阈值，故A错误。"}, {"text": "内瘘血管狭窄的常用诊断方法包括（ ）。", "options": ["Ａ.检测血清白蛋白", "Ｂ.望诊观察血管形状与走向", "Ｃ.触诊判断狭窄部位质地", "Ｄ.听诊判断杂音性质", "Ｅ.观察血流量与静脉压等指标"], "answer": "BCDE", "explanation": "内瘘血管狭窄可通过望诊、触诊、听诊、症状指标及影像学检查诊断；血清白蛋白与内瘘狭窄诊断无关，故A错误。"}, {"text": "内瘘血管狭窄的手术指征包括（ ）。", "options": ["Ａ.血流量大于400ml/min", "Ｂ.血管狭窄程度≥50%", "Ｃ.血管内径&lt;2.0mm", "Ｄ.血流下降并有血管瘤形成", "Ｅ.静脉压上升"], "answer": "BCDE", "explanation": "血管狭窄程度≥50%或血管内径&lt;2.0mm，并有血流下降伴血管瘤形成、静脉压上升、重复循环率上升或BUN异常增高等之一者具有手术指征；血流量大于400ml/min不属于手术指征，故A错误。"}, {"text": "关于内瘘狭窄分型及部位，下列描述正确的有（ ）。", "options": ["Ａ.I型为吻合口及距吻合口2cm内静脉", "Ｂ.II型位于动静脉内瘘血管穿刺部位", "Ｃ.III型为内瘘相关静脉汇入深静脉处", "Ｄ.I型位于内瘘相关静脉汇入深静脉处", "Ｅ.IV型为供给内瘘血流的动脉"], "answer": "ABCE", "explanation": "I型狭窄位于动静脉吻合口及距吻合口2cm内的静脉血管，II型位于内瘘血管穿刺部位，III型为内瘘相关静脉汇入深静脉处的狭窄，IV型为供给内瘘血流的动脉狭窄；D与I型的定义不符，故错误。"}, {"text": "球囊技术在内瘘中可以应用的情况包括（ ）。", "options": ["Ａ.内瘘狭窄", "Ｂ.内瘘感染", "Ｃ.内瘘血栓形成", "Ｄ.内瘘发育不良", "Ｅ.内瘘假性动脉瘤形成"], "answer": "ACDE", "explanation": "球囊技术可应用于内瘘狭窄、内瘘血栓形成、内瘘发育不良和内瘘假性动脉瘤形成；内瘘感染不在其中，故B错误。"}, {"text": "DSA引导在血管通路介入治疗中的优势包括（ ）。", "options": ["Ａ.清晰显示血管整体情况", "Ｂ.显示血管分支", "Ｃ.无射线摄入", "Ｄ.判断狭窄程度", "Ｅ.评估流量情况"], "answer": "ABDE", "explanation": "DSA引导通过血管造影可清晰显示血管整体情况、血管分支、狭窄程度和流量情况；其不足之一是存在射线摄入，故C错误。"}, {"text": "DSA引导在血管通路介入治疗中的不足包括（ ）。", "options": ["Ａ.射线摄入", "Ｂ.需要使用造影剂", "Ｃ.费用低廉", "Ｄ.血管细节显示较差", "Ｅ.对设备要求高"], "answer": "ABDE", "explanation": "DSA引导的不足包括射线摄入、需要使用造影剂、血管细节显示较差以及对设备要求高；该项检查费用并不低廉，故C错误。"}, {"text": "关于超声引导在血管通路介入治疗中的特点，下列正确的有（ ）。", "options": ["Ａ.无射线摄入", "Ｂ.操作便捷", "Ｃ.费用较低", "Ｄ.无法评估中心静脉", "Ｅ.可清晰显示血管内皮细节"], "answer": "ABCD", "explanation": "超声引导的优势为无射线摄入、操作便捷、费用较低，其不足是无法评估中心静脉；血管内皮等细节显示较差是DSA引导的不足，故E错误。"}, {"text": "内瘘血栓形成的常见原因包括（ ）。", "options": ["Ａ.血管狭窄", "Ｂ.低血压", "Ｃ.血糖控制良好", "Ｄ.脱水", "Ｅ.高凝状态"], "answer": "ABDE", "explanation": "血管狭窄是内瘘血栓形成的最主要原因，低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染也是常见原因；血糖控制良好不是血栓形成的原因，故C错误。"}, {"text": "内瘘血栓形成的治疗措施包括（ ）。", "options": ["Ａ.病因治疗与狭窄处理", "Ｂ.溶栓治疗", "Ｃ.导管取栓", "Ｄ.立即结扎内瘘", "Ｅ.取栓后行PTA"], "answer": "ABCE", "explanation": "内瘘血栓的治疗包括病因治疗与狭窄处理、溶栓治疗、导管取栓、取栓后行PTA，上述措施失败后行外科手术再吻合或搭桥；立即结扎内瘘不属于常规治疗措施，故D错误。"}, {"text": "尿激酶溶栓的禁忌症包括（ ）。", "options": ["Ａ.内瘘流量充足", "Ｂ.血小板低于100×10⁹/L", "Ｃ.有活动性出血者", "Ｄ.合并严重肝脏疾病", "Ｅ.2周内需行各种手术治疗"], "answer": "BCDE", "explanation": "尿激酶溶栓禁忌症包括血小板低于100×10⁹/L、凝血酶原时间较正常对照组延长3s、有活动性出血、合并严重肝脏疾病、动静脉内瘘小于30天、2周内有消化道及泌尿道出血、2周内需行各种手术治疗；内瘘流量充足不是禁忌症，故A错误。"}, {"text": "尿激酶溶栓通路的操作要点包括（ ）。", "options": ["Ａ.留置针可选单针或双针", "Ｂ.穿刺部位可选动脉入路", "Ｃ.无需固定留置针", "Ｄ.穿刺部位可选静脉入路", "Ｅ.穿刺部位可选瘘口"], "answer": "ABDE", "explanation": "尿激酶溶栓通路的留置针可选单针或双针，穿刺部位可选动脉入路、静脉入路或瘘口，操作中须注意脱针、气体和压迫；不固定留置针会增加脱针风险，故C错误。"}, {"text": "内瘘介入治疗后的注意事项包括（ ）。", "options": ["Ａ.术后立即结扎内瘘", "Ｂ.压迫止血并注意压力、时间", "Ｃ.超声评估血管内径与内膜损伤", "Ｄ.应用抗凝、活血药物", "Ｅ.术后3~6个月定期随访"], "answer": "BCDE", "explanation": "内瘘介入治疗后的注意事项包括压迫止血并注意压力和时间、超声评估血管内径与内膜损伤及血栓形成、应用抗凝和活血药物、术后3~6个月定期随访；术后立即结扎内瘘不属于术后注意事项，故A错误。"}, {"text": "动静脉内瘘随访的内容包括（ ）。", "options": ["Ａ.内瘘侧肢体是否肿胀", "Ｂ.内瘘震颤情况", "Ｃ.内瘘听诊杂音性质", "Ｄ.抬手过头时内瘘血管是否塌陷", "Ｅ.血清转氨酶水平"], "answer": "ABCD", "explanation": "动静脉内瘘随访内容包括内瘘侧肢体肿胀、内瘘震颤情况、内瘘听诊杂音性质以及抬手过头时内瘘血管是否塌陷；血清转氨酶水平与本项随访无关，故E错误。"}, {"text": "中心静脉评估的常用方法包括（ ）。", "options": ["Ａ.超声评估", "Ｂ.CTV评估", "Ｃ.DSA评估", "Ｄ.核素肾图", "Ｅ.胸部X线平片"], "answer": "ABC", "explanation": "中心静脉评估的常用方法为超声评估、CTV评估和DSA评估；核素肾图与胸部X线平片不作为中心静脉评估的常规方法，故D、E错误。"}, {"text": "血泵流速达到200ml/min时，判定中心静脉导管功能不良的标准包括（ ）。", "options": ["Ａ.动脉压小于-250mmHg", "Ｂ.静脉压大于250mmHg", "Ｃ.导管有效血流量大于300ml/min", "Ｄ.导管有效血流量小于200ml/min", "Ｅ.导管再循环大于10%"], "answer": "ABDE", "explanation": "中心静脉导管功能不良的判定标准包括导管有效血流量小于200ml/min、血泵流速达200ml/min时动脉压小于-250mmHg和/或静脉压大于250mmHg、导管再循环大于10%、低体质量或儿童患者流量低于体质量4倍以及无法达到充分性透析；导管有效血流量大于300ml/min不符合功能不良的判定，故C错误。"}, {"text": "移植血管内瘘成形术的适应证包括（ ）。", "options": ["Ａ.反复制作内瘘致上肢动静脉血管耗竭", "Ｂ.糖尿病使上肢自身血管严重破坏", "Ｃ.周围血管病使上肢自身血管严重破坏", "Ｄ.内瘘血管瘤或狭窄切除后需搭桥", "Ｅ.上肢血管条件良好者"], "answer": "ABCD", "explanation": "移植血管内瘘成形术适用于利用自身血管无法建立自体动静脉内瘘者，包括反复制作内瘘致上肢动静脉血管耗竭、糖尿病或周围血管病等使上肢自身血管严重破坏、原有内瘘血管瘤或狭窄切除后需用移植血管搭桥；上肢血管条件良好者应建立自体内瘘，故E错误。"}]}, {"type": "short", "questions": [{"text": "简述理想血管通路应满足的标准，以及血管通路常见的临床问题。", "options": [], "answer": "理想血管通路应满足三大标准：血流量充足、使用寿命长、并发症发生率低。血管通路常见的临床问题包括造瘘失败、内瘘成熟不良、内瘘穿刺失败和流量不够。", "explanation": "血管通路是接受血液透析的终末期肾病患者的生命线，其质量直接影响透析能否顺利实施，因此理想通路须同时满足血流量充足、使用寿命长和并发症发生率低三项要求；临床上则以造瘘失败、内瘘成熟不良、内瘘穿刺失败和流量不够最为常见，需要及时识别与处理。"}, {"text": "简述内瘘血管狭窄的诊断要点。", "options": [], "answer": "①望诊：观察血管的形状和走向。②触诊：狭窄部位僵硬、变细，其远端扩张、搏动增强，近端可触及震颤。③听诊：狭窄部位可闻及高尖非连续杂音，近端可闻及连续杂音。④症状指标：透析血流量≤180ml/min，静脉压≥150mmHg或较基础值增高≥50mmHg，因重复循环率增加使透析效果下降≥10%。⑤影像学检查：辅助判断狭窄的部位与程度。", "explanation": "内瘘血管狭窄的诊断依靠望诊、触诊、听诊、症状指标及影像学检查综合判断，其中血流量、静脉压和透析效果下降幅度是关键客观指标，影像学检查可进一步明确狭窄的位置和程度，为选择治疗方案提供依据。"}, {"text": "简述内瘘血管狭窄的手术指征，以及经皮穿刺腔内血管成形术（PTA）的优点和外科手术的适用情况。", "options": [], "answer": "手术指征：血管狭窄程度≥50%或血管内径&lt;2.0mm，并具备下列情况一项以上者：①血流下降并有血管瘤形成；②静脉压上升；③重复循环率上升或BUN异常增高。PTA的优点：创伤小，可较好地保持血管的解剖完整性，可反复进行，推荐作为首选方法。外科手术的适用情况：PTA失败或PTA不适宜者。", "explanation": "内瘘血管狭窄选择治疗方式时须先判断是否具备手术指征，即狭窄程度≥50%或内径&lt;2.0mm并伴有血流下降伴血管瘤形成、静脉压上升、重复循环率上升或BUN异常增高等情况之一；PTA因创伤小、可保持血管解剖完整性且可反复进行而作为首选，外科手术仅在PTA失败或PTA不适宜时采用。"}, {"text": "简述内瘘血栓形成的病因及治疗措施。", "options": [], "answer": "病因：血管狭窄是造成血栓形成的最主要原因，此外低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染也是常见原因；自体内瘘血栓以内瘘吻合口部位最多见，占75%，移植血管内瘘血栓以静脉吻合口部位最多见，占85%。治疗：①病因治疗及狭窄处理；②溶栓治疗，最好在24小时内进行，48小时内仍有希望；③导管取栓；④取栓后行PTA；⑤上述措施失败则行外科手术再吻合或搭桥。", "explanation": "内瘘血栓形成以血管狭窄为最主要病因，同时与低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染有关；治疗遵循病因治疗与狭窄处理、溶栓、取栓、取栓后行PTA的顺序，若均失败再行外科手术再吻合或搭桥。"}, {"text": "简述中心静脉导管功能不良的判定标准及处理流程。", "options": [], "answer": "判定标准：①导管有效血流量小于200ml/min；②血泵流速达到200ml/min时动脉压小于-250mmHg和/或静脉压大于250mmHg；③导管再循环大于10%；④特别低体质量的患者或儿童患者流量低于体质量4倍；⑤无法达到充分性透析。处理流程：考虑导管血栓时先行尿激酶溶栓，失败后行导管造影拍片；导管移位时调整导管位置；纤维蛋白鞘用剥离器剥离；导管位置异常、腔内血栓行血栓摘除术；亦可经引导钢丝更换导管，并连续6小时于导管内滴注尿激酶。", "explanation": "中心静脉导管功能不良的判定以血流量、压力、再循环率、低体质量患者流量倍数及透析充分性为核心指标；处理时按导管血栓先行尿激酶溶栓、失败后造影拍片的顺序进行，再针对导管移位、纤维蛋白鞘、腔内血栓等分别采取调整导管位置、剥离器剥离、血栓摘除术等措施，必要时经引导钢丝更换导管。"}]}]}, {"num": 35, "title": "老年血液透析患者特点理论考试题库", "sections": [{"type": "single", "questions": [{"text": "老年血液透析患者的特点不包括下列哪项？", "options": ["A.个体差异大", "B.开始肾替代治疗晚", "C.合并症和并发症多", "D.生存率低", "E.血管通路并发症少"], "answer": "E", "explanation": "老年血液透析患者的特点包括个体差异大、开始肾替代治疗晚、合并症和并发症多、生存率低四项，血管通路并发症少不符合老年血液透析患者的实际。"}, {"text": "老年血液透析患者开始肾脏替代治疗的时间特点是？", "options": ["A.开始肾替代治疗晚", "B.开始肾替代治疗早", "C.与中青年患者相同", "D.全部在肾功能正常时开始", "E.多数在透析指征出现前开始"], "answer": "A", "explanation": "老年血液透析患者的特点之一是开始肾替代治疗晚，而多数老年慢性肾衰竭患者病情进展缓慢，过早开始血液透析对生活质量的改善有限。"}, {"text": "多数老年慢性肾衰竭患者病情进展缓慢，进入血液透析后反而容易出现的并发症是？", "options": ["A.高钾血症", "B.低血压", "C.严重代谢性酸中毒", "D.严重电解质紊乱", "E.高钙血症"], "answer": "B", "explanation": "多数老年慢性肾衰竭患者病情进展缓慢，出现严重代谢性酸中毒、电解质紊乱的情况相对较少，进入血液透析后反而容易出现低血压、失衡综合征、血管内瘘闭塞以及出血等并发症。"}, {"text": "关于老年患者过早开始血液透析的影响，正确的说法是？", "options": ["A.对生活质量的改善有限", "B.可显著延长生存期", "C.可完全避免并发症", "D.可减少低血压的发生", "E.可降低病死率"], "answer": "A", "explanation": "老年患者过早开始血液透析容易出现低血压、失衡综合征、血管内瘘闭塞及出血等并发症，对生活质量的改善有限；但透析时间过晚则可能引起多器官功能失调，导致病死率增加。"}, {"text": "老年患者血液透析开始过晚可能导致的后果是？", "options": ["A.多器官功能失调，病死率增加", "B.生活质量明显提高", "C.并发症明显减少", "D.内瘘成熟加快", "E.透析充分性提高"], "answer": "A", "explanation": "血液透析时间过晚可能引起多器官功能失调，导致病死率增加，因此老年患者透析时机的选择需要综合考虑。"}, {"text": "导致老年血液透析患者预后不良的重要因素是？", "options": ["A.肾脏专科治疗介入过晚", "B.透析液温度过低", "C.透析器面积过小", "D.血流量过大", "E.抗凝剂用量不足"], "answer": "A", "explanation": "由于慢性肾衰竭患者并非始终在专科诊治，肾脏专科治疗介入过晚常常是老年血液透析患者预后不良的重要因素。"}, {"text": "老年慢性肾衰竭患者的血清肌酐水平常表现为？", "options": ["A.低于应有水平", "B.高于应有水平", "C.与实际肾功能完全相符", "D.不受年龄和肌肉量影响", "E.随肾功能下降成比例升高"], "answer": "A", "explanation": "老年人血清肌酐水平常低于应有水平，因此许多医师并不清楚老年患者的肾功能需要采用相关公式估算肾小球滤过率等多种手段来综合评估。"}, {"text": "评估老年患者肾功能时，除血清肌酐外常需采用的手段是？", "options": ["A.公式估算肾小球滤过率", "B.仅观察尿量", "C.仅测定血尿素氮", "D.仅测量血压", "E.仅做肾脏超声"], "answer": "A", "explanation": "老年患者的血清肌酐水平常低于应有水平，其肾功能需要采用相关公式估算肾小球滤过率等多种手段来综合评估。"}, {"text": "仅根据血肌酐水平选择血液透析时机对老年终末期肾病患者的影响是？", "options": ["A.并不合适", "B.最为准确", "C.优于公式估算", "D.可替代核素测定", "E.可准确反映营养状态"], "answer": "A", "explanation": "根据血肌酐水平选择血液透析时机对老年终末期肾病患者并不合适，应依据公式计算肌酐清除率或肾小球滤过率、核素测定肾小球滤过率来选择开始血液透析的时机。"}, {"text": "可用于计算肌酐清除率或肾小球滤过率以选择血液透析时机的公式是？", "options": ["A.C-G公式", "B.MELD公式", "C.Child-Pugh公式", "D.Wells评分", "E.GCS评分"], "answer": "A", "explanation": "可依据C-G公式、MDRD或MDRD简化公式计算肌酐清除率或肾小球滤过率，也可通过核素测定肾小球滤过率来选择开始血液透析的时机。"}, {"text": "核素测定在老年患者血液透析时机选择中的作用是？", "options": ["A.测定肾小球滤过率", "B.测定血流量", "C.测定残血量", "D.测定透析液电导度", "E.测定心输出量"], "answer": "A", "explanation": "选择老年患者开始血液透析的时机时，可依据公式计算肾小球滤过率，也可通过核素测定肾小球滤过率来确定。"}, {"text": "老年患者出现严重或极度营养不良时，血液透析时机应？", "options": ["A.宜尽早开始", "B.尽量延迟", "C.等待内瘘成熟后再考虑", "D.待血肌酐进一步升高后开始", "E.不予考虑"], "answer": "A", "explanation": "严重或极度营养不良，反复发生高钾血症、代谢性酸中毒，严重肾性贫血，高度浮肿等临床情况，宜尽早开始血液透析治疗。"}, {"text": "高龄老人开始血液透析时机的选择需要综合考虑的因素不包括？", "options": ["A.患者预后的判定", "B.社会和家庭的支持情况", "C.治疗负担与生活质量", "D.患者本人的意愿", "E.医护人员的排班方便"], "answer": "E", "explanation": "高龄老人开始血液透析时机的选择需要根据患者预后的判定、社会和家庭的支持情况、治疗负担、生活质量以及患者本人的意愿等多方面综合考虑，排班方便不属于考虑因素。"}, {"text": "普通人群选择血管通路时，按使用寿命、血流量和并发症评价的优劣顺序是？", "options": ["A.内瘘优于长期置管优于临时置管", "B.临时置管优于长期置管优于内瘘", "C.长期置管优于内瘘优于临时置管", "D.临时置管优于内瘘优于长期置管", "E.三者无差别"], "answer": "A", "explanation": "从使用寿命、血流量、并发症方面评价，普通人群血管通路的优劣顺序为内瘘优于长期置管，长期置管优于临时置管。"}, {"text": "老年血液透析患者血管通路的选择主要考虑的因素不包括？", "options": ["A.通路使用时间", "B.并发症发生率和死亡率", "C.从建立到开始使用的时间", "D.患者的意愿和医生的倾向性", "E.血管通路的费用排行"], "answer": "E", "explanation": "老年血液透析患者血管通路的选择主要考虑通路使用时间、并发症发生率和死亡率，从建立到开始使用的时间、患者的意愿和医生的倾向性，费用排行不作为主要考虑因素。"}, {"text": "老年血液透析患者首选的血管通路是？", "options": ["A.自体动静脉内瘘", "B.临时中心静脉置管", "C.长期中心静脉置管", "D.人造血管移植内瘘", "E.外周静脉穿刺"], "answer": "A", "explanation": "自体动静脉内瘘仍是老年血液透析患者首选的血管通路；但老年患者建立自体动静脉内瘘血管通路相对困难。"}, {"text": "老年患者建立自体动静脉内瘘相对困难的原因不包括？", "options": ["A.年龄大", "B.合并症多", "C.外周血管病变", "D.血管弹性减退", "E.血流量需求过低"], "answer": "E", "explanation": "老年患者建立自体动静脉内瘘相对困难与年龄大、合并症多、外周血管病变有关，而不是因为血流量需求过低。"}, {"text": "老年血液透析患者临时置管存在的主要问题是？", "options": ["A.感染、栓塞、留置时间", "B.血流量过大", "C.再循环不足", "D.穿刺疼痛轻微", "E.不影响日常活动"], "answer": "A", "explanation": "老年血液透析患者临时置管存在感染、栓塞、留置时间短等问题，需要关注。"}, {"text": "老年患者可选择的血管通路方式包括？", "options": ["A.长期留置导管或人造血管植入", "B.仅自体动静脉内瘘", "C.仅临时置管", "D.仅外周静脉穿刺", "E.仅股静脉置管"], "answer": "A", "explanation": "老年患者的血管通路可选择颈内静脉、锁骨下静脉长期留置导管以及人造血管植入等方式。"}, {"text": "老年患者最常见的血管病变是？", "options": ["A.冠状动脉粥样硬化和外周动脉病", "B.主动脉夹层", "C.雷诺现象", "D.血栓性静脉炎", "E.静脉曲张"], "answer": "A", "explanation": "老年人血管病变多，最常见的是冠状动脉粥样硬化和外周动脉病，发生率较高，尤其在伴有糖尿病、高血压、冠心病、高血脂的患者更容易出现。"}, {"text": "老年患者血管病变导致的血管改变是？", "options": ["A.动脉壁增厚、狭窄、弹性差、脆性增加", "B.管壁变薄、管腔扩张、弹性增强", "C.血管脆性降低", "D.血流量增加", "E.血管阻力下降"], "answer": "A", "explanation": "老年患者血管病变可导致动脉壁增厚、管腔狭窄、血管弹性差、脆性增加，建立内瘘后失败率高，并有可能增加远端肢体缺血的危险。"}, {"text": "存在血管病变的老年患者建立自体动静脉内瘘的特点是？", "options": ["A.内瘘往往难以建立，建立后失败率高", "B.内瘘容易成熟", "C.内瘘使用时间长于年轻人", "D.内瘘并发症少于年轻人", "E.远端肢体缺血风险下降"], "answer": "A", "explanation": "存在血管病变的老年患者，自体动静脉内瘘往往难以建立，建立内瘘后失败率高，并有可能增加远端肢体缺血的危险。"}, {"text": "老年血液透析患者出现心力衰竭的常见原因是？", "options": ["A.糖尿病、淀粉样变、高血压心脏病等", "B.透析液温度过低", "C.透析器膜面积过大", "D.抗凝剂用量不足", "E.穿刺技术不熟练"], "answer": "A", "explanation": "老年血液透析患者常有糖尿病、淀粉样变或高血压心脏病等多种原因引起严重心律失常或心力衰竭。"}, {"text": "自体动静脉内瘘或移植血管内瘘的分流对老年患者心脏的影响是？", "options": ["A.导致心脏的额外负荷，加重病情", "B.减轻心脏负荷", "C.对心脏没有影响", "D.提高心肌收缩力", "E.降低心力衰竭的发生率"], "answer": "A", "explanation": "自体动静脉内瘘或移植血管内瘘的分流可导致心脏的额外负荷，加重病情，因此对此类患者不主张选择动静脉内瘘、尤其上臂内瘘。"}, {"text": "对容易出现心力衰竭的老年血液透析患者，血管通路选择的原则是？", "options": ["A.不主张选择动静脉内瘘，尤其上臂内瘘", "B.首选上臂内瘘", "C.首选人造血管内瘘", "D.首选前臂内瘘", "E.尽早建立内瘘"], "answer": "A", "explanation": "对有心力衰竭的老年血液透析患者，自体动静脉内瘘或移植血管内瘘的分流可加重病情，因此不主张选择动静脉内瘘、尤其上臂内瘘。"}, {"text": "老年患者血管栓塞发生率高的原因不包括？", "options": ["A.动脉粥样硬化使血流减慢", "B.血液粘稠度高", "C.感染与脱水", "D.促红细胞生成素使血液粘稠度增加", "E.血压长期偏低"], "answer": "E", "explanation": "老年患者由于动脉粥样硬化使血流减慢、血液粘稠度高、感染、脱水以及终末期肾病导致的其他血管损害，促红细胞生成素改善贫血后血液粘稠度也会增加，均可致血管栓塞，血压偏低不是栓塞的常见原因。"}, {"text": "老年血液透析患者血管栓塞发生率高的机制中，促红细胞生成素的作用是？", "options": ["A.改善贫血后血液粘稠度增加", "B.降低血液粘稠度", "C.抑制血小板聚集", "D.减少纤维蛋白原", "E.扩张外周血管"], "answer": "A", "explanation": "促红细胞生成素改善贫血后血液粘稠度会增加，加之动脉粥样硬化使血流减慢、感染、脱水等因素，老年患者血管栓塞发生率高。"}, {"text": "老年患者在血液透析时低血压发生率高于年轻患者的原因是？", "options": ["A.心血管并发症多、自主神经病变明显", "B.血流量过大", "C.透析液钠浓度过低", "D.抗凝剂过量", "E.穿刺针过细"], "answer": "A", "explanation": "老年患者心血管并发症多，自主神经病变明显，血液透析时透析器和透析管路的体外血液循环以及透析超滤，使低血压发生的概率多于年轻患者。"}, {"text": "老年患者血压通常在90/60 mmHg以下时，前臂内瘘的情况是？", "options": ["A.经常闭塞，内瘘失败率很高", "B.成熟更快", "C.血流量更大", "D.并发症更少", "E.使用时间更长"], "answer": "A", "explanation": "临床上低血压的老年患者前臂内瘘经常闭塞，如果患者血压通常在90/60 mmHg以下，内瘘失败率很高。"}, {"text": "老年透析患者对血管通路自我维护能力差的表现是？", "options": ["A.对血管通路的问题不能及时发现和处理", "B.能自行处理内瘘杂音改变", "C.每日自行评估内瘘震颤", "D.主动学习内瘘护理知识", "E.定期门诊随访血管通路"], "answer": "A", "explanation": "老年透析患者由于各种原因对血管通路的问题不能及时发现和处理，对血管通路的自我维护能力较差。"}, {"text": "老年患者血管通路选择需要考虑存活期短的原因是？", "options": ["A.预期寿命短，内瘘成熟可能超过存活期", "B.内瘘成熟时间过短", "C.血管通路并发症过少", "D.患者排斥内瘘", "E.医疗费用过高"], "answer": "A", "explanation": "老年患者预期寿命短，特别是80岁以上的患者，在一些病例自体动静脉内瘘成熟的时间可能超过患者的存活期，使得制作内瘘失去意义。"}, {"text": "关于桡动脉-头静脉内瘘与肱动脉-头静脉内瘘的成功率，正确的是？", "options": ["A.桡动脉-头静脉内瘘成功率较低", "B.桡动脉-头静脉内瘘成功率更高", "C.两者成功率完全相同", "D.肱动脉-头静脉内瘘无法建立", "E.两种内瘘均不适用于老年患者"], "answer": "A", "explanation": "桡动脉-头静脉内瘘的成功率可能低于肱动脉-头静脉内瘘，在老年患者血管通路选择时应予考虑。"}, {"text": "移植血管内瘘适合的老年人群和特点是？", "options": ["A.部分较年轻的老年肥胖患者可采用", "B.所有高龄患者均可采用", "C.感染机会多于长期导管", "D.只适用于非肥胖患者", "E.成熟时间短于自体内瘘"], "answer": "A", "explanation": "移植血管内瘘对于部分年龄相对较轻的老年肥胖患者可以采用，其感染机会少于长期导管。"}, {"text": "永久性带涤纶套的双腔导管的长度一般为？", "options": ["A.36～40cm", "B.18～22cm", "C.25～30cm", "D.42～50cm", "E.12～16cm"], "answer": "A", "explanation": "永久性带涤纶套的双腔导管即长期留置导管一般长36～40cm，质地柔软，动静脉端开口均在顶端，且两个开口相距2cm以上，另外动脉端还有两个侧孔开口。"}, {"text": "永久性带涤纶套双腔导管动静脉端两个开口的间距要求是？", "options": ["A.2cm以上", "B.不足1cm", "C.5cm以上", "D.10cm以上", "E.0.5cm以上"], "answer": "A", "explanation": "永久性带涤纶套双腔导管动静脉端开口均在顶端，且两个开口相距2cm以上，另外动脉端还有两个侧孔开口，以保证充足的血流量并减少血液再循环。"}, {"text": "永久性带涤纶套双腔导管的设计目的不包括？", "options": ["A.保证充足的血流量", "B.减少血液再循环", "C.防止细菌感染", "D.防止导管移位", "E.保证导管尖端肝素盐水存留"], "answer": "E", "explanation": "永久性带涤纶套双腔导管的设计目的包括保证充足的血流量、减少血液再循环、防止细菌感染、防止导管移位、避免穿刺疼痛；保证导管尖端肝素盐水存留是肝素封管操作的要求，不属于导管结构设计目的。"}, {"text": "长期中心静脉导管的并发症不包括？", "options": ["A.血栓形成", "B.导管脱出和（或）断裂", "C.出口感染及菌血症", "D.感染", "E.动脉瘤形成"], "answer": "E", "explanation": "长期中心静脉导管有许多并发症，包括血栓形成、导管脱出和（或）断裂、出口感染及菌血症等，动脉瘤形成不在其列。"}, {"text": "高龄老年人使用长期中心静脉导管时需要加强护理的原因是？", "options": ["A.常有意识错失，不自主拔除或剪断导管", "B.血流量需求过大", "C.导管口径过小", "D.封管液浓度过低", "E.透析时间过长"], "answer": "A", "explanation": "高龄老年人时常有意识错失，不自主拔除导管，甚至剪断导管，因此需要加强护理。"}, {"text": "在防止导管内血栓形成方面，可能优于肝素封管液的是？", "options": ["A.高浓度枸橼酸盐封管", "B.生理盐水封管", "C.低分子右旋糖酐封管", "D.尿激酶封管", "E.葡萄糖封管"], "answer": "A", "explanation": "在防止导管内血栓形成方面，高浓度枸橼酸盐封管可能好于肝素封管液。"}, {"text": "留置长期带涤纶套双腔导管最常见的并发症是？", "options": ["A.血流不畅", "B.导管脱出", "C.导管断裂", "D.出口感染", "E.菌血症"], "answer": "A", "explanation": "留置长期带涤纶套双腔导管最常见的并发症是血流不畅，其原因常见是导管内血栓形成、导管贴壁或纤维蛋白鞘形成。"}, {"text": "留置长期带涤纶套双腔导管发生血流不畅的常见原因不包括？", "options": ["A.导管内血栓形成", "B.导管贴壁", "C.纤维蛋白鞘形成", "D.导管顶端位置异常", "E.患者体重下降"], "answer": "E", "explanation": "长期带涤纶套双腔导管血流不畅常见的原因是导管内血栓形成、导管贴壁或纤维蛋白鞘形成，患者体重下降不是常见原因。"}, {"text": "为防止导管内血栓形成，封管前应先在动静脉导管内分别注入？", "options": ["A.适量生理盐水", "B.浓肝素盐水", "C.高浓度枸橼酸盐", "D.尿激酶溶液", "E.抗生素溶液"], "answer": "A", "explanation": "封管前动静脉导管内应分别注入适量生理盐水，以保证管腔内无血后再用浓肝素盐水封管，同时在推注肝素盐水时应迅速夹闭导管。"}, {"text": "推注肝素盐水封管时应迅速夹闭导管，其目的是？", "options": ["A.保证导管尖端肝素盐水存留", "B.减少患者疼痛", "C.防止空气进入", "D.加快推注速度", "E.减少肝素用量"], "answer": "A", "explanation": "推注肝素盐水时应迅速夹闭导管，这对保留导管尖端肝素盐水存留十分重要，是防止血栓形成的重要环节。"}, {"text": "导管退出使用的最主要原因是？", "options": ["A.导管相关感染", "B.血流不畅", "C.导管脱出", "D.导管断裂", "E.患者要求"], "answer": "A", "explanation": "国外资料表明，导管退出使用的最主要原因是导管相关感染。"}, {"text": "长期中心静脉导管相关感染的治疗上强调？", "options": ["A.全身和局部同时使用抗生素2周", "B.仅全身使用抗生素1周", "C.仅局部使用抗生素3天", "D.仅拔除导管不作抗感染", "E.口服抗生素1个月"], "answer": "A", "explanation": "导管相关感染的治疗上强调全身和局部同时使用抗生素2周，同时应教育患者及家属注意对导管的保护和护理。"}, {"text": "对于局部渗血或血肿形成的导管置入患者，建议？", "options": ["A.术后当天不行透析", "B.术后当天立即透析", "C.术后当天加大抗凝", "D.术后当天拔除导管", "E.术后当天局部热敷并透析"], "answer": "A", "explanation": "对于局部渗血或血肿形成者，建议术后当天不行透析，以减少出血和血肿加重的风险。"}, {"text": "年龄超过75岁的血液透析患者一般选择的透析治疗形式和理由是？", "options": ["A.以住院为基础的血液透析治疗", "B.以家庭为单位的透析治疗", "C.门诊高频短时透析", "D.腹膜透析为主", "E.夜间长时透析"], "answer": "A", "explanation": "年龄超过75岁的患者一般选择以住院为基础的血液透析治疗，可以和其他肾友交流，建立友情，有助于克服因疾病导致的孤独。"}, {"text": "老年血液透析患者透析间期进食过多的水果、果汁和菜汤，最需要警惕的血钾变化是（  ）", "options": ["A.血钾升高", "B.血钾降低", "C.血钾无明显变化", "D.血钙升高", "E.血钠降低"], "answer": "A", "explanation": "水果、果汁和菜汤含钾丰富，老年血液透析患者反复发生高钾血症时可触发紧急透析，而高钾血症正是宜尽早开始血液透析治疗的临床情况之一，因此透析间期必须限制此类食物的摄入。"}, {"text": "老年血液透析患者合并心力衰竭时，较常引起严重心律失常或心力衰竭的疾病是（  ）", "options": ["A.高血压心脏病", "B.甲状腺功能亢进", "C.肝硬化", "D.慢性支气管炎", "E.类风湿关节炎"], "answer": "A", "explanation": "老年血液透析患者常有糖尿病、淀粉样变或高血压心脏病等多种原因引起严重心律失常或心力衰竭，而自体动静脉内瘘或移植血管内瘘的分流会进一步增加心脏负荷、加重病情。"}, {"text": "永久性带涤纶套双腔导管的动脉端除顶端主开口外，还带有的开口是（  ）", "options": ["A.两个侧孔开口", "B.一个侧孔开口", "C.三个侧孔开口", "D.四个侧孔开口", "E.不带侧孔开口"], "answer": "A", "explanation": "永久性带涤纶套双腔导管即长期留置导管的动静脉端开口均在顶端，且两个开口相距2cm以上，另外动脉端还有两个侧孔开口，以保证充足的血流量并减少血液再循环。"}]}, {"type": "multiple", "questions": [{"text": "老年血液透析患者的特点包括下列哪些？", "options": ["Ａ.个体差异大", "Ｂ.开始肾替代治疗晚", "Ｃ.合并症和并发症多", "Ｄ.生存率低", "Ｅ.血管通路并发症少"], "answer": "ABCD", "explanation": "老年血液透析患者的特点是个体差异大、开始肾替代治疗晚、合并症和并发症多、生存率低；血管通路并发症少与老年患者血管病变多、内瘘失败率高的事实不符。"}, {"text": "老年患者透析时机选择中，宜尽早开始血液透析治疗的临床情况包括？", "options": ["Ａ.严重或极度营养不良", "Ｂ.反复发生高钾血症", "Ｃ.反复发生代谢性酸中毒", "Ｄ.严重肾性贫血和高度浮肿", "Ｅ.轻度贫血伴血压正常"], "answer": "ABCD", "explanation": "严重或极度营养不良，反复发生高钾血症、代谢性酸中毒，严重肾性贫血，高度浮肿等临床情况，宜尽早血液透析治疗；轻度贫血伴血压正常不属于宜尽早透析的指征。"}, {"text": "高龄老人开始血液透析时机的选择需要考虑的方面包括？", "options": ["Ａ.患者预后的判定", "Ｂ.社会和家庭的支持情况", "Ｃ.治疗负担", "Ｄ.生活质量和患者本人意愿", "Ｅ.血液透析中心的排班方便"], "answer": "ABCD", "explanation": "高龄老人开始血液透析时机的选择需要根据对患者预后的判定、社会和家庭的支持情况、治疗负担、生活质量以及患者本人的意愿等多方面综合考虑，透析中心排班方便不属于考虑因素。"}, {"text": "老年血液透析患者血管通路选择主要考虑的因素包括？", "options": ["Ａ.通路使用时间", "Ｂ.并发症发生率", "Ｃ.死亡率", "Ｄ.从建立到开始使用的时间", "Ｅ.血管通路的厂家品牌"], "answer": "ABCD", "explanation": "老年血液透析患者血管通路的选择主要考虑通路使用时间、并发症发生率和死亡率，从建立到开始使用的时间、患者的意愿和医生的倾向性；血管通路厂家品牌不是选择依据。"}, {"text": "老年患者建立自体动静脉内瘘相对困难的原因包括？", "options": ["Ａ.年龄大", "Ｂ.合并症多", "Ｃ.外周血管病变", "Ｄ.血管弹性差", "Ｅ.外周血流量过高"], "answer": "ABCD", "explanation": "老年患者建立自体动静脉内瘘血管通路相对困难，与年龄大、合并症多、外周血管病变，以及动脉壁增厚、管腔狭窄、血管弹性差、脆性增加有关；外周血流量过高不是其原因。"}, {"text": "老年患者临时置管存在的主要问题包括？", "options": ["Ａ.感染", "Ｂ.栓塞", "Ｃ.留置时间受限", "Ｄ.导管脱出和（或）断裂", "Ｅ.血流量长期过大"], "answer": "ABCD", "explanation": "老年血液透析患者临时置管存在感染、栓塞、留置时间受限以及导管脱出和（或）断裂等问题，这也是其不作为长期通路首选的原因；血流量长期过大不是临时置管的问题。"}, {"text": "老年患者血管栓塞发生率高的原因包括？", "options": ["Ａ.动脉粥样硬化使血流减慢", "Ｂ.血液粘稠度高", "Ｃ.感染与脱水", "Ｄ.促红细胞生成素使血液粘稠度增加", "Ｅ.长期低血压"], "answer": "ABCD", "explanation": "老年患者血管栓塞发生率高与动脉粥样硬化使血流减慢、血液粘稠度高、感染、脱水以及促红细胞生成素改善贫血后血液粘稠度增加有关；长期低血压主要表现为内瘘闭塞，不是栓塞发生的直接机制。"}, {"text": "老年血液透析患者低血压常见的原因包括？", "options": ["Ａ.心血管并发症多", "Ｂ.自主神经病变明显", "Ｃ.透析器和透析管路的体外血液循环", "Ｄ.透析超滤", "Ｅ.透析液钠浓度过高"], "answer": "ABCD", "explanation": "老年患者心血管并发症多、自主神经病变明显，血液透析时透析器和透析管路的体外血液循环以及透析超滤，使低血压发生概率多于年轻患者；高钠透析液可补偿血浆晶体渗透压下降而起到稳定血压的作用，不是低血压的原因。"}, {"text": "长期中心静脉导管的并发症包括？", "options": ["Ａ.血栓形成", "Ｂ.导管脱出和（或）断裂", "Ｃ.出口感染", "Ｄ.菌血症", "Ｅ.动静脉瘤形成"], "answer": "ABCD", "explanation": "长期中心静脉导管有许多并发症，包括血栓形成、导管脱出和（或）断裂、出口感染及菌血症等；动静脉瘤形成不属于其常见并发症。"}, {"text": "留置长期带涤纶套双腔导管发生血流不畅的常见原因包括？", "options": ["Ａ.导管内血栓形成", "Ｂ.导管贴壁", "Ｃ.纤维蛋白鞘形成", "Ｄ.导管内血栓脱落致栓塞", "Ｅ.患者依从性差"], "answer": "ABC", "explanation": "长期带涤纶套双腔导管血流不畅常见的原因是导管内血栓形成、导管贴壁或纤维蛋白鞘形成；导管内血栓脱落致栓塞属于栓塞并发症，患者依从性差也不是血流不畅的直接原因。"}, {"text": "永久性带涤纶套双腔导管的结构特点包括？", "options": ["Ａ.一般长36～40cm，质地柔软", "Ｂ.动静脉端开口均在顶端", "Ｃ.两个开口相距2cm以上", "Ｄ.动脉端有两个侧孔开口", "Ｅ.导管长度一般为50～60cm"], "answer": "ABCD", "explanation": "永久性带涤纶套双腔导管一般长36～40cm，质地柔软，动静脉端开口均在顶端，两个开口相距2cm以上，动脉端还有两个侧孔开口，以达到充足的血流量并减少血液再循环；50～60cm的长度描述与材料不符。"}, {"text": "关于肝素封管防止导管内血栓形成的操作要求，正确的有？", "options": ["Ａ.封管前导管内分别注入适量生理盐水", "Ｂ.保证管腔内无血后再用浓肝素盐水封管", "Ｃ.推注肝素盐水时应迅速夹闭导管", "Ｄ.保留导管尖端肝素盐水存留", "Ｅ.封管前应先回抽使管腔充满血液"], "answer": "ABCD", "explanation": "肝素封管应做到封管前动静脉导管内分别注入适量生理盐水，保证管腔内无血后再用浓肝素盐水封管，推注肝素盐水时
