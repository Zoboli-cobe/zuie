、滤器破膜漏血等；超净滤器到期属于建议性报警。"}, {"text": "下列属于警示性报警情形的有（ ）", "options": ["Ａ.超滤量偏差", "Ｂ.透析液已空", "Ｃ.电导度超限", "Ｄ.温度超限", "Ｅ.自检失败"], "answer": "ABCD", "explanation": "警示性报警指暂时中止治疗是应对当前情况的最佳对策且血泵可继续安全运转，如超滤量偏差、透析液已空、电导度、温度超限等；自检失败属于机器故障报警。"}, {"text": "机器故障报警的特点包括（ ）", "options": ["Ａ.机器自身出了问题", "Ｂ.系统因故不能监控病人安全时发生", "Ｃ.可表现为自检失败、软件错误或硬件故障", "Ｄ.需专业人员维修维护后才能恢复正常", "Ｅ.操作员简单处理即可消除"], "answer": "ABCD", "explanation": "机器故障报警是机器自身出了问题，系统因故不能监控病人安全时发生，如自检失败、软件错误或硬件故障等，需专业人员进行维修维护后才能恢复正常；操作员简单处理即可消除的说法不成立。"}, {"text": "血液透析机按其结构划分包括的组成部分有（ ）", "options": ["Ａ.水路系统", "Ｂ.电路系统", "Ｃ.血路系统", "Ｄ.透析液供给系统", "Ｅ.超滤控制系统"], "answer": "ABC", "explanation": "血液透析机按其结构可划分为水路系统、电路系统和血路系统三大部分；透析液供给系统和超滤控制系统是按功能划分的组成部分。"}, {"text": "血循环控制系统的组成部分有（ ）", "options": ["Ａ.血泵", "Ｂ.动、静脉壶及压力监测器", "Ｃ.空气探测器和静脉夹", "Ｄ.肝素泵", "Ｅ.内毒素过滤器"], "answer": "ABCD", "explanation": "血循环控制系统包括血泵，动、静脉壶及压力监测器，空气探测器和静脉夹（预冲探测器）以及肝素泵；内毒素过滤器属于透析液供给系统。"}, {"text": "关于定压超滤与定容超滤的描述，正确的有（ ）", "options": ["Ａ.定压超滤通过控制透析液的负压直接改变跨膜压大小", "Ｂ.定容超滤通过独立的超滤泵直接从水路中抽取所需超滤量", "Ｃ.定容超滤时跨膜压的大小随透析液负压的改变而变化", "Ｄ.两种方式都通过跨膜压来实现超滤液的产生", "Ｅ.定容超滤不需要独立的超滤泵"], "answer": "ABCD", "explanation": "定压超滤通过控制透析液的负压直接改变跨膜压的大小从而产生相应超滤量；定容超滤通过独立的超滤泵直接从水路中抽取所需超滤量，跨膜压大小则随透析液负压的改变而变化；两种方式均通过跨膜压实现超滤液的产生，定容超滤需要独立超滤泵。"}, {"text": "影响电导度的因素有（ ）", "options": ["Ａ.配比是否正确", "Ｂ.流量是否稳定", "Ｃ.传感器灵敏度漂移及显示误差", "Ｄ.酸洗是否彻底", "Ｅ.患者干体重是否准确"], "answer": "ABCD", "explanation": "影响电导度的因素包括配比是否正确、流量是否稳定、传感器灵敏度漂移及显示误差、酸洗是否彻底、管路内是否有铁附着、零部件损坏；患者干体重与电导度无关。"}, {"text": "电导度高报警的原因有（ ）", "options": ["Ａ.浓缩液问题", "Ｂ.水压及水流量异常", "Ｃ.水处理问题", "Ｄ.报警设定", "Ｅ.浓缩液吸管滤网堵塞"], "answer": "ABCD", "explanation": "电导度高报警的原因为浓缩液问题、水压及水流量异常、水处理问题和报警设定；浓缩液吸管滤网堵塞是电导度低报警的原因。"}, {"text": "电导度低报警的原因有（ ）", "options": ["Ａ.浓缩液错误或不足或用完", "Ｂ.吸液管连接不良", "Ｃ.浓缩液吸管接头漏气", "Ｄ.浓缩液吸管滤网堵塞", "Ｅ.浓缩液泵注入设定错误致浓度过高"], "answer": "ABCD", "explanation": "电导度低报警原因包括浓缩液错误或不足或用完、吸液管连接不良、浓缩液吸管接头漏气、浓缩液吸管滤网堵塞、水流量不足或水压过低、报警限设置过高；浓缩液泵注入设定错误属电导度警报的排查线索之一，并非低报警的典型原因。"}, {"text": "温度低报警的原因有（ ）", "options": ["Ａ.水压或水流量过高", "Ｂ.温度传感器故障引起加热器长时间不工作或显示不良", "Ｃ.加热控制电路故障", "Ｄ.空烧保护器跳开", "Ｅ.温度传感器故障引起加热器长时间工作"], "answer": "ABCD", "explanation": "温度低报警原因为水压或水流量过高，温度传感器故障引起加热器长时间不工作或显示不良，加热控制电路故障，空烧保护器跳开，供电电压偏低时也可触发；加热器长时间工作属于温度高报警的情形。"}, {"text": "流量警报的相关因素有（ ）", "options": ["Ａ.水处理供水不足或压力降低", "Ｂ.透析机排水不畅", "Ｃ.透析机需要清洗除钙", "Ｄ.硬件故障", "Ｅ.静脉针脱落"], "answer": "ABCD", "explanation": "流量警报的相关因素包括水处理供水不足或压力降低、透析机排水不畅、透析机需要清洗除钙、硬件故障；静脉针脱落是静脉压低报警的原因。"}, {"text": "细菌滤器报警的原因有（ ）", "options": ["Ａ.使用时间到期", "Ｂ.滤器破膜", "Ｃ.滤器堵塞", "Ｄ.机器显示压力检测不通过", "Ｅ.透析液温度过高"], "answer": "ABCD", "explanation": "细菌滤器报警原因为使用时间到期、滤器破膜、滤器堵塞；若机器显示压力检测不通过，可能是破膜或漏气引起；透析液温度过高属于温度高报警的情形。"}, {"text": "影响血泵工作的因素有（ ）", "options": ["Ａ.血泵门未关严或泵管移动导致泵卡死", "Ｂ.滚轮污染后相对运动受阻", "Ｃ.血泵间隙过大或过小", "Ｄ.血泵直径设置错误", "Ｅ.透析液电导度过高"], "answer": "ABCD", "explanation": "影响血泵工作的因素包括体外循环系统警报、血泵门未关严或泵管移动导致泵卡死、滚轮污染后相对运动受阻、血泵间隙过大或过小、血泵直径设置错误、零部件损坏；电导度属于透析液供给系统的监控内容。"}, {"text": "漏血报警的处理措施包括（ ）", "options": ["Ａ.观察出口处透析液颜色是否有云片状红色，必要时取样测定", "Ｂ.如破膜应立即关闭透析液并更换透析器", "Ｃ.检查空气或气泡产生部位", "Ｄ.管道变黄引起假报警时可冲洗清洁，否则校正传感器", "Ｅ.立即加大超滤率冲洗滤器"], "answer": "ABCD", "explanation": "漏血报警处理包括观察出口处透析液颜色是否有云片状红色并必要时取样测定，如破膜立即关闭透析液并更换透析器，检查空气或气泡产生部位，管道变黄引起漏血假报警时冲洗清洁后仍不正常则校正传感器；加大超滤率会加重破膜，不是正确处理。"}, {"text": "透析器破膜的原因包括（ ）", "options": ["Ａ.透析器质量问题", "Ｂ.透析器储存不当，如冬天储存在温度过低的环境中", "Ｃ.透析中凝血导致跨膜压过高", "Ｄ.透析中大量超滤导致跨膜压过高", "Ｅ.透析液流量设置为500ml/min"], "answer": "ABCD", "explanation": "透析器破膜的原因包括透析器质量问题，透析器储存不当如冬天储存在温度过低的环境中，透析中因凝血或大量超滤等而导致跨膜压过高；透析液流量500ml/min为常规设置，与破膜无关。"}, {"text": "预防透析器破膜的措施包括（ ）", "options": ["Ａ.透析前仔细检查透析器", "Ｂ.透析中严密监测跨膜压，避免出现过高跨膜压", "Ｃ.透析机漏血报警等装置应定期检测", "Ｄ.漏血后充分消毒后才重新开始新的透析治疗", "Ｅ.透析前将透析器储存于低温环境"], "answer": "ABCD", "explanation": "透析器破膜的预防措施包括透析前仔细检查透析器，透析中严密监测跨膜压避免出现过高跨膜压，透析机漏血报警等装置应定期检测；漏血后一定要充分消毒后才重新开始新的透析治疗；低温储存是破膜的原因，不是预防措施。"}, {"text": "影响空气监测的因素有（ ）", "options": ["Ａ.血路管安装位置不妥或变形", "Ｂ.管路与空气探测器不匹配", "Ｃ.传感器污染", "Ｄ.透析器内部除气不足", "Ｅ.透析液pH值偏低"], "answer": "ABCD", "explanation": "影响空气监测的因素包括血路管安装位置不妥或变形、管路与空气探测器不匹配、传感器污染、透析器内部除气不足、血流提速过快或高血流速使动脉压过低、动脉穿刺针的位置欠佳、传感器故障；透析液pH值与空气监测无关。"}, {"text": "影响跨膜压的因素有（ ）", "options": ["Ａ.静脉压", "Ｂ.透析器的选择", "Ｃ.超滤率及时间的设置", "Ｄ.透析器除气不足、抗凝不足", "Ｅ.透析液pH值升高"], "answer": "ABCD", "explanation": "影响跨膜压的因素包括静脉压、透析器的选择、超滤率及时间的设置、透析器除气不足、抗凝不足、透析液侧压力；透析液pH值不是影响跨膜压的因素。"}]}, {"type": "short", "questions": [{"text": "简述透析机报警处理的原则。", "options": [], "answer": "①报警装置应按要求定期校准精度，发现问题及时处理；②不得废除报警装置或随意改变报警参数；③对透析治疗安全产生影响的报警为红色，必须有操作人员处理。", "explanation": "报警是保证透析治疗绝对安全所必须的，因此对其处理有严格原则：定期校准报警装置精度并及时处理问题，禁止废除报警装置或随意改变报警参数，红色报警必须由操作人员处理。"}, {"text": "简述发生透析机报警后的处理流程及注意事项。", "options": [], "answer": "①处理流程为按消音键、查找原因、正确处理、按复位键、继续透析治疗；②原因不明或报警原因未解决的，不得进入透析治疗状态；③透析治疗中如果透析机故障，原则上下机回血，由工程师维修。", "explanation": "发生报警后应按消音键、查找原因、正确处理、按复位键、继续透析治疗的顺序处理；原因不明或未解决时不得进入透析治疗状态；机器故障时应下机回血后由工程师维修。对某些报警做出响应时应认真按照报警内容和相关提示处理，确定不影响病人安全时方可人为干预，且不可重复忽略或人为干预同一报警。"}, {"text": "简述透析器破膜的紧急处理、原因及预防措施。", "options": [], "answer": "紧急处理：①一旦发现应立即夹闭透析管路的动脉端和静脉端，丢弃体外循环中血液；②更换新的透析器和透析管路进行透析；③严密监测患者生命体征、症状和体征情况，一旦出现发热、溶血等表现，应采取相应处理措施。原因：①透析器质量问题；②透析器储存不当，如冬天储存在温度过低的环境中；③透析中因凝血或大量超滤等而导致跨膜压过高。预防：①透析前应仔细检查透析器；②透析中严密监测跨膜压，避免出现过高跨膜压；③透析机漏血报警等装置应定期检测，避免发生故障。", "explanation": "透析器破膜的紧急处理关键是夹闭动静脉端并丢弃体外循环血液，更换透析器和管路后继续透析，同时严密监测生命体征。其原因主要与透析器质量、储存条件及跨膜压过高有关，预防重点为透析前检查、透析中严密监测跨膜压和定期检测漏血报警装置。漏血后一定要充分消毒后才重新开始新的透析治疗，尽量选用化学消毒，然后再柠檬酸脱钙。"}, {"text": "简述漏血报警的常见原因及处理要点。", "options": [], "answer": "常见原因：①透析器破膜；②空气大量进入透析液（超滤率过大、透析液管与透析器接头未接紧、透析液除气不良）；③漏血探测器污染或有脏物沉积；④探测器故障。处理要点：①观察出口处透析液颜色是否有云片状红色，必要时取样测定，如破膜应立即关闭透析液并更换透析器；②检查空气或气泡产生部位，超滤率过大引起者通常在透析器内形成小气泡，重装透析液管接头必要时更换密封垫圈，透析液除气不良时透析液进水管内即可见气泡；③管道变黄、消毒清洗不良引起漏血假报警一般冲洗清洁后正常，否则校正传感器；④若无漏血亦未见空气或气泡，暂停透析冲洗机器，必要时卸下漏血探测器清洗；⑤仍不能排除时联系工程师或维修人员进行漏血定标或更换元器件。", "explanation": "漏血检测利用测量透析液管路里的透光强度实现，一般漏血大于0.5ml/min时机器发出声光报警并关断血泵、阻止透析液进入透析器，并采用红绿双光源抗干扰措施。造成漏血报警的因素包括透析器破膜、漏血传感器进入空气、漏血报警传感器污染、漏血传感器工作点漂移，处理时可按上述要点逐项排查。"}, {"text": "简述空气监测的工作原理、报警条件及空气报警的原因和处理。", "options": [], "answer": "工作原理：空气监测是建立在超声波传递原理基础上的防止空气进入血液的防护系统，超声波在液体和固体内传播速度比在气体内快，因此在静脉血液管路的两侧分别装上超声波发射器和接收器来捕捉经过静脉管路的气泡。报警条件：当静脉管路出现超过0.05ml气泡时应发出报警；当静脉壶液面低于检测器下端时应发出报警。原因：①管道外空气进入血路，如管道破损、与穿刺针接头松脱、动脉测压口漏气、输液口未夹紧；②动脉压低产生气泡；③透析液气泡进入血中；④静脉管路与超声探头之间有空隙；⑤静脉管路老化。处理：①大量空气从泵前进入血路多由血流不足、空气从针口吸入，应检查泵前接头、夹子是否松开；②输液结束时分离静脉回路用预冲程序排完空气后接着透析治疗；③少量空气可减慢血流速并用手将空气弹回静脉壶，用空针抽出；④若空气从透析液区进入应停止治疗并对机器进行维修；⑤如无空气可能是静脉壶或静脉管与空气传感器有空隙，重新安装并改变探测部位使两者贴妥，也可用酒精清洗或用凡士林充填空隙；⑥校正空气传感器或更换；⑦静脉管路老化或不匹配时重新更换血路管道。", "explanation": "空气监测采用超声波原理监测静脉管路气泡，报警条件为气泡超过0.05ml或静脉壶液面低于检测器下端。影响空气监测的因素包括血路管安装位置不妥或变形、管路与空气探测器不匹配、传感器污染、透析器内部除气不足、血流提速过快或高血流速使动脉压过低、动脉穿刺针的位置欠佳、传感器故障。透析器血液腔室和透析液腔室残余空气进入静脉血路管会形成微小气泡，因此规范预冲透析器的操作很重要，必须确保将透析器膜内膜外的空气除掉。"}]}]}, {"num": 15, "title": "血液透析患者心血管并发症及防治20260917理论考试题库", "sections": [{"type": "single", "questions": [{"text": "慢性肾脏病患者中合并心血管疾病的比例约为（  ）", "options": ["A.约25%", "B.约30%", "C.约50%", "D.约75%", "E.约90%"], "answer": "C", "explanation": "慢性肾脏病患者中约一半（约50%）合并心血管疾病；超过一半的慢性肾脏病患者死亡由心血管疾病导致，心血管疾病是透析患者的头号杀手。"}, {"text": "透析患者死亡中死于原发性心血管疾病的比例约为（  ）", "options": ["A.22.4%", "B.42%", "C.59%", "D.73%", "E.90%"], "answer": "B", "explanation": "透析患者死亡中约42%死于原发性心血管疾病；每10位死亡的透析患者中超过5位死于心血管疾病，远超感染等其他死因。"}, {"text": "维持性透析患者脑卒中风险约为普通人群的（  ）", "options": ["A.1～2倍", "B.2～3倍", "C.5～10倍", "D.10～20倍", "E.20～30倍"], "answer": "C", "explanation": "维持性透析患者脑卒中风险约为普通人群的5～10倍，且出血性卒中占比高于普通人群，卒中后死亡风险更高、功能恢复更慢。"}, {"text": "美国3万余例长期透析患者统计，心肌梗死后第1年死亡率为（  ）", "options": ["A.12%", "B.26%", "C.42%", "D.59%", "E.90%"], "answer": "D", "explanation": "透析患者心肌梗死后第1年死亡率为59%，第2年为73%，第5年为90%，长期预后极差。"}, {"text": "美国3万余例长期透析患者统计，心肌梗死后第5年死亡率为（  ）", "options": ["A.42%", "B.59%", "C.73%", "D.85%", "E.90%"], "answer": "E", "explanation": "透析患者心肌梗死后第5年死亡率达90%，说明心肌梗死对透析患者的长期生存威胁极大，必须高度重视。"}, {"text": "加拿大报告显示，透析患者开始透析后每年因心梗或心绞痛住院的比例为（  ）", "options": ["A.2%/年", "B.3.6%/年", "C.8%/年", "D.12%/年", "E.26%/年"], "answer": "C", "explanation": "开始透析后每年8%的透析患者因心梗或心绞痛住院，提示缺血性心脏病在透析人群中的负担很重。"}, {"text": "透析前无缺血性心脏病的患者，透析41个月后新发缺血性心脏病的比例为（  ）", "options": ["A.3.6%", "B.8%", "C.12%", "D.26%", "E.59%"], "answer": "C", "explanation": "透析前无缺血性心脏病者透析41个月后12%新发缺血性心脏病，年发病率为3.6%。"}, {"text": "透析过程中最常见的急性心血管并发症是（  ）", "options": ["A.高血压", "B.低血压", "C.心律失常", "D.心绞痛", "E.心脏骤停"], "answer": "B", "explanation": "低血压是透析过程中最常见的急性心血管并发症；心梗、心衰、猝死则是威胁透析患者长期生存的主要问题。"}, {"text": "9013例次血液透析观察中，全龄组透析中低血压的发生率约为（  ）", "options": ["A.2%～4%", "B.5%～10%", "C.20%～30%", "D.30%～40%", "E.40%～50%"], "answer": "C", "explanation": "9013例次血液透析观察显示，全龄组低血压发生率约20%～30%，为最常见并发症；老年组约30%～40%，显著更高。"}, {"text": "透析过程中心血管并发症最常发生的时段是（  ）", "options": ["A.透析第0～1小时", "B.透析第2～4小时", "C.透析第5～6小时", "D.透析结束后2小时", "E.透析结束后24小时"], "answer": "B", "explanation": "透析中心血管并发症多发生在透析第2～4小时，该时段应加强巡视与血压监测。"}, {"text": "透析间期体重增长应控制在干体重的（  ）", "options": ["A.1%～2%", "B.3%～5%", "C.5%～8%", "D.8%～10%", "E.10%～15%"], "answer": "B", "explanation": "透析间期体重增长应控制在干体重的3%～5%（干体重以内约2～3 kg）；体重增长过多者心血管死亡率明显升高。"}, {"text": "诊断缺血性心脏病的金标准检查是（  ）", "options": ["A.静息心电图", "B.动态心电图", "C.负荷试验", "D.冠脉CTA", "E.冠脉造影"], "answer": "E", "explanation": "冠脉造影是诊断缺血性心脏病的金标准，用于拟介入治疗前；静息心电图、动态心电图、负荷试验、冠脉CTA均不能替代冠脉造影。"}, {"text": "无创筛查冠脉狭窄程度与钙化积分宜选用的检查是（  ）", "options": ["A.静息心电图", "B.动态心电图", "C.心脏彩超", "D.冠脉CTA", "E.冠脉造影"], "answer": "D", "explanation": "冠脉CTA是无创筛查手段，可显示冠脉狭窄程度与钙化积分；冠脉造影为有创检查，是诊断金标准。"}, {"text": "透析中胸痛随呼吸、体位变化并伴发热，最可能的原因是（  ）", "options": ["A.心肌缺血", "B.心包炎", "C.透析低血压", "D.主动脉夹层", "E.失衡综合征"], "answer": "B", "explanation": "心包炎所致胸痛随呼吸、体位变化，可伴发热；心肌缺血多为胸闷胸痛、大汗淋漓并可放射至左臂；透析低血压先有头晕、出汗再出现胸闷；主动脉夹层为突发撕裂样剧痛。"}, {"text": "透析中突发撕裂样剧痛，最可能的原因是（  ）", "options": ["A.心肌缺血", "B.心包炎", "C.透析低血压", "D.主动脉夹层", "E.肌肉痉挛"], "answer": "D", "explanation": "主动脉夹层少见但凶险，表现为突发撕裂样剧痛，一旦怀疑须立即报告医生并处理。"}, {"text": "透析中心绞痛发作、血压正常时，硝酸甘油舌下含服的剂量是（  ）", "options": ["A.0.1 mg", "B.0.25 mg", "C.0.5 mg", "D.1 mg", "E.5 mg"], "answer": "C", "explanation": "透析中心绞痛发作、血压正常时，硝酸甘油0.5 mg舌下含服；血压偏低者应先补液升压，不可直接使用硝酸甘油。"}, {"text": "透析中心绞痛发作时，硝酸甘油舌下含服最多可重复的次数是（  ）", "options": ["A.1次", "B.2次", "C.3次", "D.4次", "E.5次"], "answer": "C", "explanation": "硝酸甘油0.5 mg舌下含服，5分钟可重复一次，最多3次。"}, {"text": "透析中心绞痛持续多长时间不缓解，应按急性冠脉综合征转急诊（  ）", "options": ["A.&gt;5分钟", "B.&gt;10分钟", "C.&gt;15分钟", "D.&gt;30分钟", "E.&gt;60分钟"], "answer": "C", "explanation": "心绞痛持续&gt;15分钟不缓解，应给予心电监护、查肌钙蛋白，并按急性冠脉综合征转急诊。"}, {"text": "开始维持性透析的患者中已存在左心室肥厚的比例约为（  ）", "options": ["A.25%", "B.42%", "C.59%", "D.75%", "E.90%"], "answer": "D", "explanation": "开始维持性透析的患者中约75%已存在左心室肥厚，左室肥厚在透析开始时就已普遍存在。"}, {"text": "对透析患者而言，比冠状动脉疾病更重要的死亡提示因素是（  ）", "options": ["A.左室肥厚", "B.瓣膜钙化", "C.心包积液", "D.高血压", "E.贫血"], "answer": "A", "explanation": "对透析患者，左室肥厚是比冠状动脉疾病更重要的死亡提示因素，故应定期关注超声心动图结果并严格控制透析间期体重增长。"}, {"text": "判断左室肥厚分级的主要依据是（  ）", "options": ["A.射血分数", "B.左室壁厚度与左室质量指数", "C.E/A比值", "D.心胸比例", "E.瓣膜钙化程度"], "answer": "B", "explanation": "左室壁厚度与左室质量指数（LVMI）是左室肥厚的分级依据；射血分数用于判断心脏泵血功能；心脏瓣膜钙化在透析患者中常见且进展快。"}, {"text": "纠正贫血可逆转左室肥厚，血红蛋白需提升至（  ）", "options": ["A.8 g/dl以上", "B.9 g/dl以上", "C.10 g/dl以上", "D.12 g/dl以上", "E.13 g/dl以上"], "answer": "C", "explanation": "循证证据显示，血红蛋白提升至10 g/dl以上后，左室重量与容量降低，X线胸片心胸比例缩小，即纠正贫血可逆转左室肥厚。"}, {"text": "透析或血液滤过过程中早搏的发生率约为（  ）", "options": ["A.10%", "B.15%", "C.25%", "D.50%", "E.79%"], "answer": "C", "explanation": "透析或血液滤过过程中早搏发生率约25%，易发生于治疗最后2小时。"}, {"text": "血透患者在透析第3～5小时或透析后出现室性心律失常的比例为（  ）", "options": ["A.25%", "B.42%", "C.59%", "D.79%", "E.90%"], "answer": "D", "explanation": "79%的血透患者在透析第3～5小时或透析后出现室性心律失常；该时段及透析后2小时内应加强心电监护与巡视。"}, {"text": "透析患者最常见的心律失常之一是（  ）", "options": ["A.窦性心动过速", "B.房性早搏", "C.心房颤动", "D.室性早搏", "E.房室传导阻滞"], "answer": "C", "explanation": "心房颤动是透析患者最常见的心律失常之一，表现为节律绝对不齐、无P波，其卒中风险显著升高。"}, {"text": "透析患者心房颤动的患病率为（  ）", "options": ["A.1%～5%", "B.5%～10%", "C.10%～30%", "D.30%～50%", "E.50%～70%"], "answer": "C", "explanation": "透析患者心房颤动患病率为10%～30%，并随年龄升高；抗凝需个体化权衡卒中风险与出血风险。"}, {"text": "高钾血症最早期的心电图改变是（  ）", "options": ["A.T波高尖", "B.U波明显", "C.ST段抬高", "D.P波高尖", "E.QT间期缩短"], "answer": "A", "explanation": "高钾血症的心电图改变依次为T波高尖、PR延长与P波消失、QRS增宽，最终可发生室颤或心脏骤停；血钾越高，心电图改变越典型。"}, {"text": "高钾血症紧急处理中起效最快、可迅速保护心肌的措施是（  ）", "options": ["A.胰岛素加葡萄糖静滴", "B.碳酸氢钠静滴", "C.10%葡萄糖酸钙静注", "D.口服降钾树脂", "E.紧急透析"], "answer": "C", "explanation": "10%葡萄糖酸钙10～20 ml静注起效最快，可迅速保护心肌；但其只护心、不降钾，必须联合排钾措施。"}, {"text": "透析前血钾达到多少即属高危，需紧急处理并加强心电监护（  ）", "options": ["A.≥4.5 mmol/L", "B.≥5.0 mmol/L", "C.≥5.5 mmol/L", "D.≥6.0 mmol/L", "E.≥7.0 mmol/L"], "answer": "D", "explanation": "透析患者血钾应常规维持在5.0 mmol/L以下；透析前血钾≥6.0 mmol/L属高危，需紧急处理并加强心电监护。"}, {"text": "高钾血症降钾最根本、最彻底的措施是（  ）", "options": ["A.10%葡萄糖酸钙静注", "B.胰岛素加葡萄糖静滴", "C.碳酸氢钠静滴", "D.口服降钾树脂", "E.紧急透析"], "answer": "E", "explanation": "紧急透析是降钾最根本、最彻底的措施；药物处理只是为透析争取时间，透析患者的高钾最终多需透析解决。"}, {"text": "每年约有多少透析患者因肺水肿住院并需行单纯超滤（  ）", "options": ["A.2%", "B.7.6%", "C.10%", "D.26%", "E.42%"], "answer": "C", "explanation": "每年约10%的透析患者因肺水肿住院，需行单纯超滤；水钠潴留、容量控制不佳是最多见的原因。"}, {"text": "原无心衰的透析患者透析41个月后出现心衰的比例为（  ）", "options": ["A.10%", "B.12%", "C.18%", "D.26%", "E.59%"], "answer": "D", "explanation": "原无心衰者透析41个月后26%出现心衰，年发病率7.6%；心肌病和缺血性疾病是主要原因。"}, {"text": "透析后出现心力衰竭者的平均存活期为（  ）", "options": ["A.6个月", "B.12个月", "C.18个月", "D.24个月", "E.36个月"], "answer": "C", "explanation": "透析后出现心衰者的平均存活期约18个月，说明心力衰竭在透析患者中常见且致命。"}, {"text": "急性肺水肿患者特征性的咳痰性状是（  ）", "options": ["A.白色泡沫痰", "B.黄色脓痰", "C.粉红色泡沫痰", "D.铁锈色痰", "E.血丝痰"], "answer": "C", "explanation": "急性肺水肿表现为突发严重气促、端坐呼吸、咳粉红色泡沫痰、血氧饱和度下降、大汗淋漓、双肺满布湿啰音。"}, {"text": "NYHA心功能分级中「轻微活动即气促」属于（  ）", "options": ["A.I级", "B.II级", "C.III级", "D.IV级", "E.V级"], "answer": "C", "explanation": "NYHA心功能分级：I级日常活动不受限，II级活动后气促，III级轻微活动即气促，IV级休息时也有症状。"}, {"text": "我国透析患者贫血的患病率约为（  ）", "options": ["A.50%", "B.75%", "C.86.5%", "D.98.2%", "E.100%"], "answer": "D", "explanation": "我国透析患者贫血患病率约98.2%，明显高于透析前慢性肾脏病患者（超过50%）；贫血经心脏代偿性高输出、左心室扩张与肥厚最终走向心衰。"}, {"text": "透析患者死亡中与心跳骤停和心律失常有关的比例为（  ）", "options": ["A.12%", "B.22.4%", "C.42%", "D.59%", "E.79%"], "answer": "B", "explanation": "透析患者死亡中22.4%与心跳骤停和心律失常有关；283015例血液透析死亡患者中128861例死于心脏病，其中45940例为猝死。"}, {"text": "周一、三、五透析的患者，死亡最易发生的两天是（  ）", "options": ["A.周一、周二", "B.周二、周三", "C.周三、周四", "D.周五、周六", "E.周日、周一"], "answer": "E", "explanation": "周一、三、五透析者死亡易发生在周日、周一；原因是周末透析间隔时间最长，血容量和血钾蓄积最多，心脏负担最重。"}, {"text": "周二、四、六透析的患者，死亡最易发生的两天是（  ）", "options": ["A.周一、周二", "B.周二、周三", "C.周三、周四", "D.周五、周六", "E.周六、周日"], "answer": "A", "explanation": "周二、四、六透析者死亡易发生在周一、周二，同样与周末长透析间隔导致的血容量和血钾蓄积有关。"}, {"text": "尿毒症性心包炎多发生于（  ）", "options": ["A.开始透析前", "B.透析过程中", "C.透析后即刻", "D.透析后1年", "E.各时期均等"], "answer": "A", "explanation": "尿毒症性心包炎见于开始透析前，因尿毒症毒素蓄积刺激心包产生无菌性炎症与纤维素渗出，典型表现为发热、胸痛并可闻及心包摩擦音。"}, {"text": "出血性心包积液较多见的心包炎类型是（  ）", "options": ["A.尿毒症性心包炎", "B.透析相关性心包炎", "C.病毒性心包炎", "D.结核性心包炎", "E.肿瘤性心包炎"], "answer": "B", "explanation": "透析相关性心包炎多见于透析中或透析后，透析不充分、液体负荷过多、感染、反复炎症、高分解代谢状态均可诱发，出血性心包积液较多见。"}, {"text": "尿毒症性心包炎经强化充分透析后，多数在多长时间内吸收（  ）", "options": ["A.2～3天", "B.1～2周", "C.3～4周", "D.1～2个月", "E.3个月以上"], "answer": "B", "explanation": "尿毒症性心包炎经强化充分透析，多数1～2周吸收；开始透析后经强化透析超滤2～4周，约90%心包积液消失。"}, {"text": "开始透析后经强化透析超滤2～4周，心包积液消失的比例约为（  ）", "options": ["A.30%", "B.50%", "C.70%", "D.90%", "E.100%"], "answer": "D", "explanation": "约30%～35%的尿毒症患者存在心包疾患；开始透析后经强化透析超滤2～4周，约90%心包积液消失。"}, {"text": "透析患者高血压的核心因素是（  ）", "options": ["A.肾素-血管紧张素激活", "B.交感神经兴奋", "C.钠水潴留", "D.促红素使用", "E.内皮素蓄积"], "answer": "C", "explanation": "钠水潴留是透析患者高血压的核心因素；此外还有缩血管因子过多、舒血管因子缺乏、血管舒张反应异常等机制参与。"}, {"text": "舒张压持续升高10～20 mmHg，冠脉病变风险提高（  ）", "options": ["A.0.5～1.0倍", "B.1.0～1.5倍", "C.1.6～2.5倍", "D.2.5～3.5倍", "E.3.5～5.0倍"], "answer": "C", "explanation": "舒张压持续升高10～20 mmHg，冠脉病变风险提高1.6～2.5倍，充血性心衰风险提高1.8～3.0倍，故须积极控制血压。"}, {"text": "舒张压持续升高10～20 mmHg，充血性心衰风险提高（  ）", "options": ["A.0.8～1.5倍", "B.1.6～2.5倍", "C.1.8～3.0倍", "D.3.0～4.0倍", "E.4.0～5.0倍"], "answer": "C", "explanation": "舒张压持续升高10～20 mmHg时，充血性心衰风险提高1.8～3.0倍。"}, {"text": "透析中低血压的定义之一是透析中收缩压下降（  ）", "options": ["A.≥5 mmHg", "B.≥10 mmHg", "C.≥15 mmHg", "D.≥20 mmHg", "E.≥30 mmHg"], "answer": "D", "explanation": "透析中低血压指透析中收缩压下降≥20 mmHg，或平均动脉压下降≥10 mmHg，并伴有头晕、出汗、恶心、打哈欠等症状。"}, {"text": "缺血性脑卒中静脉溶栓的时间窗是（  ）", "options": ["A.1小时", "B.3小时", "C.4.5小时", "D.6小时", "E.12小时"], "answer": "C", "explanation": "缺血性脑卒中静脉溶栓时间窗为4.5小时，发现即计时；部分患者可机械取栓，时间窗可至24小时。"}, {"text": "短暂性脑缺血发作的ABCD2评分判断为高危的分值是（  ）", "options": ["A.≥1分", "B.≥2分", "C.≥3分", "D.≥4分", "E.≥6分"], "answer": "D", "explanation": "短暂性脑缺血发作ABCD2评分≥4分为高危；其症状通常在数分钟至1小时内完全缓解，是卒中的最强预警信号。"}, {"text": "透析中患者出现意识改变、胸闷、抽搐等异常，按心跳骤停急救预案在心肺复苏前应采取的措施是（  ）", "options": ["A.停止超滤、回血并保留血管通路", "B.继续超滤脱水至透析结束", "C.拔除穿刺针后再开始抢救", "D.立即口服降钾树脂并观察", "E.加大超滤量尽快减轻心脏负荷"], "answer": "A", "explanation": "按透析室心跳骤停、意识障碍急救预案，发现意识改变、胸闷、抽搐等异常应立即呼救并记录时间，评估意识、呼吸、脉搏，停止超滤、回血并保留血管通路，再行心肺复苏并将AED就位，遵医嘱给药，转运交接时带好透析记录；透析室常备抢救车、除颤仪、氧气、简易呼吸器与心电监护仪，应定期演练确保人人过关。"}]}, {"type": "multiple", "questions": [{"text": "血透患者常见的心血管并发症有（  ）", "options": ["Ａ.缺血性心脏病", "Ｂ.左室肥厚扩大", "Ｃ.心律失常与心力衰竭", "Ｄ.猝死与心包炎", "Ｅ.睡眠呼吸暂停"], "answer": "ABCD", "explanation": "血透患者常见的八类心血管并发症为缺血性心脏病、左室肥厚扩大、心律失常、心力衰竭、猝死、心包炎、心内膜炎和血压异常；睡眠呼吸暂停是心血管危险因素，不属于心血管并发症。"}, {"text": "透析患者心脑血管风险评估中，护士可协助完成的观察与检查有（  ）", "options": ["Ａ.病史与症状询问", "Ｂ.血压心率全程监测", "Ｃ.冠脉造影常规普查", "Ｄ.心电图与动态心电图", "Ｅ.心脏彩超与颈动脉超声"], "answer": "ABDE", "explanation": "风险评估手段包括病史与症状询问（胸痛、气促、黑朦、晕厥）、透析前中后全程血压心率监测、心电图与动态心电图、心脏彩超、颈动脉超声，以及血钾、BNP、肌钙蛋白、血磷等化验；冠脉造影是诊断金标准，用于拟介入治疗前，不作为常规普查手段。"}, {"text": "关于缺血性心脏病的检查，下列说法正确的有（  ）", "options": ["Ａ.静息心电图可见ST-T改变", "Ｂ.冠脉造影属无创筛查手段", "Ｃ.动态心电图可发现无痛性心肌缺血", "Ｄ.冠脉CTA可评估狭窄与钙化", "Ｅ.冠脉造影是诊断金标准"], "answer": "ACDE", "explanation": "静息心电图看ST-T改变与陈旧心梗痕迹，胸痛发作时立即做；动态心电图用于症状不典型者，可发现无痛性心肌缺血与阵发心律失常；冠脉CTA是无创筛查，评估冠脉狭窄程度与钙化积分；冠脉造影是诊断金标准。冠脉造影为有创检查，故「属无创筛查手段」说法错误。"}, {"text": "关于动静脉内瘘对心脏的影响及护理评估，下列说法正确的有（  ）", "options": ["Ａ.吻合口内径宜6～8mm", "Ｂ.内瘘血流量宜200～300", "Ｃ.高流量内瘘可诱发高排量心衰", "Ｄ.内瘘血流量越高对心脏越有利", "Ｅ.缩瘘或限流手术可减轻心脏负荷"], "answer": "ABC", "explanation": "内瘘使部分动脉血直接分流入静脉，回心血量增加；内瘘吻合口内径宜6～8mm，血流量宜200～300ml/min，高流量内瘘（超过1500～2000ml/min）可诱发或加重高排量心力衰竭。内瘘血流量过高会加重心脏负荷，并非越高越好；对高流量内瘘合并心衰者应及时报告医生，必要时行缩瘘或限流手术、难治性慢性心衰改腹透时可考虑关闭内瘘，故缩瘘或限流手术是医生决策的处理手段而非「减轻心脏负荷」的常规护理措施。"}, {"text": "透析中心绞痛发作的处理要点有（  ）", "options": ["Ａ.立即暂停超滤、减慢血流量", "Ｂ.血压低者先补液升压", "Ｃ.血压低者立即舌下含服硝酸甘油", "Ｄ.吸氧并测血压心率", "Ｅ.血压正常者硝酸甘油舌下含服"], "answer": "ABDE", "explanation": "处理流程为立即暂停超滤、减慢血流量；吸氧并测血压、心率；血压低者先补液升压，血压正常者硝酸甘油0.5 mg舌下含服；5分钟可重复一次，最多3次。血压偏低时使用硝酸甘油会进一步降低血压，故该做法错误。"}, {"text": "左室肥厚的潜在致病因素有（  ）", "options": ["Ａ.高血压", "Ｂ.高钾血症", "Ｃ.水负荷过多", "Ｄ.贫血", "Ｅ.动静脉内瘘"], "answer": "ACDE", "explanation": "左室肥厚的潜在致病因素包括高血压、水负荷过多、贫血、缺血性心脏病、动静脉内瘘、心肌钙化、尿毒症及系统性疾病；高钾血症主要表现为心律失常，不是左室肥厚的致病因素。"}, {"text": "透析患者心脏超声重点观察的内容有（  ）", "options": ["Ａ.左室壁厚度", "Ｂ.左室质量指数（LVMI）", "Ｃ.冠状动脉狭窄程度", "Ｄ.射血分数（EF）", "Ｅ.心脏瓣膜钙化"], "answer": "ABDE", "explanation": "心脏超声主要看左室壁厚度与左室质量指数（左室肥厚的分级依据）、射血分数（判断心脏泵血功能）以及心脏瓣膜钙化；冠状动脉狭窄程度需通过冠脉CTA或冠脉造影评估。"}, {"text": "透析患者心律失常的常见诱因有（  ）", "options": ["Ａ.左室肥厚", "Ｂ.缺血性心脏病", "Ｃ.充分透析", "Ｄ.离子浓度波动与低氧血症", "Ｅ.高磷血症与钙化性心肌病"], "answer": "ABDE", "explanation": "心律失常的常见诱因包括基础病变（左室肥厚、缺血性心脏病）、离子浓度波动、低氧血症、高磷血症、钙化性心肌病；充分透析可改善心肌功能，是保护因素而非诱因。"}, {"text": "高钾血症可出现的心电图改变有（  ）", "options": ["Ａ.T波高尖", "Ｂ.血压明显升高", "Ｃ.PR延长", "Ｄ.P波消失", "Ｅ.QRS增宽"], "answer": "ACDE", "explanation": "高钾血症的心电图改变依次为T波高尖、PR延长与P波消失、QRS增宽，可进展至室颤与心脏骤停；血压升高不是高钾血症的心电图改变。"}, {"text": "高钾血症的紧急处理措施有（  ）", "options": ["Ａ.10%葡萄糖酸钙静注", "Ｂ.单纯超滤快速脱水", "Ｃ.胰岛素加葡萄糖静滴", "Ｄ.碳酸氢钠静滴", "Ｅ.口服降钾树脂"], "answer": "ACDE", "explanation": "高钾血症的紧急处理包括心电监护、10%葡萄糖酸钙10～20 ml静注、胰岛素加葡萄糖静滴、碳酸氢钠静滴、口服降钾树脂以及紧急透析；单纯超滤快速脱水是急性肺水肿的急救措施，不用于纠正高钾血症。"}, {"text": "透析患者心力衰竭的常用评估工具有（  ）", "options": ["Ａ.BNP或NT-proBNP", "Ｂ.6分钟步行试验", "Ｃ.冠状动脉造影", "Ｄ.心脏超声看射血分数", "Ｅ.每日体重、血压与出入量"], "answer": "ABDE", "explanation": "心衰常用评估工具包括BNP或NT-proBNP（需结合容量状态解读）、6分钟步行试验、心脏超声看射血分数与心脏结构、每日体重加血压加出入量记录；冠状动脉造影用于评估冠脉病变，不是心力衰竭的常规评估工具。"}, {"text": "急性肺水肿的识别信号有（  ）", "options": ["Ａ.突发严重气促、端坐呼吸", "Ｂ.心包摩擦音", "Ｃ.咳粉红色泡沫痰", "Ｄ.血氧饱和度下降、大汗", "Ｅ.双肺满布湿啰音"], "answer": "ACDE", "explanation": "急性肺水肿的识别信号为突发严重气促、端坐呼吸、咳粉红色泡沫痰、血氧饱和度下降、大汗淋漓、双肺满布湿啰音；心包摩擦音是心包炎的体征。"}, {"text": "急性左心衰、肺水肿的急救措施有（  ）", "options": ["Ａ.端坐位、双腿下垂", "Ｂ.高流量吸氧", "Ｃ.立即单纯超滤快速脱水", "Ｄ.收缩压&gt;100 mmHg可用硝酸酯类", "Ｅ.快速大量静脉补液"], "answer": "ABCD", "explanation": "急性左心衰、肺水肿的急救流程为端坐位双腿下垂、高流量吸氧、立即单纯超滤快速脱水、收缩压&gt;100 mmHg时用硝酸酯类舌下或静脉给药、心电监护必要时无创通气、缓解后重新评估干体重；快速大量静脉补液会加重容量超负荷，故错误。"}, {"text": "关于透析患者猝死，下列表述正确的有（  ）", "options": ["Ａ.死亡中22.4%与心跳骤停等有关", "Ｂ.猝死与透析间隔时间无关", "Ｃ.周一、三、五透析者易在周日、周一死亡", "Ｄ.周二、四、六透析者易在周一、周二死亡", "Ｅ.周末透析间隔最长、血钾蓄积最多"], "answer": "ACDE", "explanation": "透析患者死亡中22.4%与心跳骤停和心律失常有关；周一、三、五透析者死亡易发生在周日、周一，周二、四、六透析者死亡易发生在周一、周二，原因是周末透析间隔时间最长，血容量和血钾蓄积最多，心脏负担最重。猝死与透析间隔密切相关，故「与透析间隔无关」的说法错误。"}, {"text": "透析相关性心包炎的常见诱因有（  ）", "options": ["Ａ.透析不充分", "Ｂ.液体负荷过多", "Ｃ.感染", "Ｄ.高钾血症", "Ｅ.反复炎症、高分解代谢状态"], "answer": "ABCE", "explanation": "透析相关性心包炎多见于透析中或透析后，透析不充分、液体负荷过多、感染、反复炎症、高分解代谢状态均可诱发，出血性心包积液较多见；高钾血症是心律失常与猝死的重要推手，不是心包炎的诱因。"}, {"text": "透析患者高血压的发生机制有（  ）", "options": ["Ａ.钠水潴留致容量负荷增加", "Ｂ.肾素-血管紧张素系统激活", "Ｃ.高钾血症", "Ｄ.交感神经兴奋", "Ｅ.一氧化氮生成减少"], "answer": "ABDE", "explanation": "透析患者高血压的发生机制包括钠水潴留（最主要）、肾素-血管紧张素系统激活、缩血管因子过多、舒血管因子缺乏、一氧化氮生成减少、交感神经兴奋，以及促红素使用可升高血压等；高钾血症主要表现为心律失常，不是高血压的发生机制。"}, {"text": "引起透析中低血压的常见原因有（  ）", "options": ["Ａ.低温透析液", "Ｂ.超滤过快、过量脱水", "Ｃ.透析液钠浓度过低", "Ｄ.常温或高温透析液", "Ｅ.透析过程中进餐"], "answer": "BCDE", "explanation": "透析中低血压的常见原因有超滤过快过量脱水、透析液钠浓度过低、常温或高温透析液致血管扩张、透析过程中进餐使血液重新分布、营养不良与贫血、透析前服用降压药等；低温透析是预防透析中低血压的措施，不是诱因。"}, {"text": "脑卒中急救的关键环节有（  ）", "options": ["Ａ.识别FAST症状", "Ｂ.先溶栓再转运", "Ｃ.停止脱水并回血下机", "Ｄ.呼叫卒中中心或120", "Ｅ.急查头颅CT平扫"], "answer": "ACDE", "explanation": "脑卒中急救的关键环节为识别FAST症状、停止脱水、回血下机、呼叫卒中中心或120、保持气道并监测生命体征、急查头颅CT、专科转运交接；透析患者用溶栓药需医生权衡出血风险，不能在转运前先溶栓。"}, {"text": "出血性脑卒中在透析患者中更高危的原因有（  ）", "options": ["Ａ.长期高血压使脑血管壁受损", "Ｂ.贫血", "Ｃ.透析中肝素抗凝", "Ｄ.尿毒症血小板功能障碍", "Ｅ.血管钙化"], "answer": "ACDE", "explanation": "透析患者出血性卒中更高危与长期高血压使脑血管壁受损、透析中肝素抗凝致出血更难止住、尿毒症血小板功能障碍致止血能力差以及血管钙化有关；贫血主要经左心室扩张与肥厚损害心脏，不是出血性卒中的直接高危原因。"}, {"text": "卒中二级预防的ABCD内容包括（  ）", "options": ["Ａ.抗血小板或抗凝治疗", "Ｂ.立即停用所有抗血小板药物", "Ｃ.血压与血糖管理", "Ｄ.胆固醇控制与他汀治疗", "Ｅ.饮食与运动管理"], "answer": "ACDE", "explanation": "卒中二级预防的ABCD为抗血小板或抗凝（阿司匹林或氯吡格雷，房颤者抗凝治疗）、血压血糖管理（透析前血压&lt;140/90 mmHg）、胆固醇控制与他汀治疗、饮食与运动（限盐限钾、循序渐进康复锻炼）；透析患者存在出血风险也应按医嘱用药，不能一律停用抗血小板药物。"}]}, {"type": "short", "questions": [{"text": "简述血液透析患者心脑血管并发症的三类高危因素及其具体内容。", "options": [], "answer": "【传统危险因素（患者自身）】高血压、糖尿病；脂质代谢紊乱；吸烟、年龄、种族；原有的心脏病变；肥胖、缺乏运动；淀粉样变性、硬皮病、小血管炎等特殊疾病。【尿毒症相关因素】贫血、甲旁亢；电解质紊乱、酸中毒；尿毒症毒素、胰岛素拮抗；细胞外液量过多；CKD-MBD（钙磷代谢紊乱）；慢性炎症、氧化应激。【透析相关因素】透析中低血压；心律失常、低氧血症；动静脉内瘘；透析膜生物不相容性；透析液成分不当；超滤波动、抗凝相关出血。", "explanation": "三类因素长期叠加可导致心肌功能下降、心肌缺血、心瓣膜钙化、心包炎等心脏损害。护理中应在透析前评估症状、血压、体重与血钾并制定个体化超滤方案，透析中巡视监护、识别前兆，透析间期做好限水限盐限钾与居家测压宣教，长期随访中每月化验、每季复查心脏彩超与心电图。"}, {"text": "简述透析中心绞痛发作的六步处理流程及预防要点。", "options": [], "answer": "【六步处理流程】①立即暂停超滤，减慢血流量；②吸氧，测量血压、心率；③血压低者先补液升压，血压正常者硝酸甘油0.5 mg舌下含服；④5分钟可重复一次，最多3次；⑤持续超过15分钟不缓解，给予心电监护、查肌钙蛋白，按急性冠脉综合征转急诊；⑥记录上报，分析诱因（如脱水过快）。【预防要点】易发作患者透析前可遵医嘱预防性使用硝酸酯类药物；控制单次超滤量，避免脱水过快诱发心肌缺血。", "explanation": "处理的关键是先停超滤、评估血压后再决定是否使用硝酸甘油，血压偏低时用硝酸甘油会进一步降低血压。透析中胸痛还需与心包炎（胸痛随呼吸、体位变化，可伴发热）、透析低血压（先头晕出汗再胸闷）、主动脉夹层（突发撕裂样剧痛）鉴别；透析患者肌钙蛋白基线可升高，诊断心梗要看动态变化。"}, {"text": "简述透析中高钾血症的紧急处理措施及护理监测要点。", "options": [], "answer": "【紧急处理（遵医嘱）】①心电监护，持续监测T波、QRS波群与心律变化；②10%葡萄糖酸钙10～20 ml缓慢静推，数分钟起效，保护心肌；③胰岛素10 U加50%葡萄糖静滴，30分钟起效，促进钾进入细胞；④碳酸氢钠静滴，适用于伴代谢性酸中毒者；⑤口服降钾树脂，起效较慢，通过肠道排钾，作为辅助手段；⑥紧急透析，是降钾最彻底的手段。【护理监测要点】血钾≥5.0 mmol/L即需警惕，透析前血钾≥6.0 mmol/L属高危；长透析间隔后上机的患者（每周一、周二上机前最危险）上机前先了解近期血钾结果；高钾患者上机后加强心电监护；关注透析间期饮食，水果、果汁、菜汤摄入过多最常见。", "explanation": "钙剂起效最快但只护心、不降钾，必须联合排钾措施；药物处理只是争取时间，透析患者的高钾最终多需透析解决。高钾可无任何前兆即诱发致命性心律失常，与室性心律失常、猝死直接相关，因此识别早期心电图改变（T波高尖、QRS增宽）可以救命。"}, {"text": "简述透析中低血压的预防措施及SOP处理流程。", "options": [], "answer": "【预防八条】①防止过快、过量脱水，超滤量小于干体重的5%；②可调钠，或提高透析液钠浓度；③使用低温透析；④有低血压倾向者避免透析中进餐；⑤纠正贫血、改善营养；⑥合理安排降压药、镇静药、β受体阻滞剂的用药时机；⑦高龄患者选用低效率、小面积、血路容量少的透析器；⑧选用生物相容性好的透析膜。【SOP处理流程】①立即停止超滤；②取头低足高位；③快速补液，生理盐水100～200 ml或高渗葡萄糖；④吸氧，监测血压、心率；⑤血压不恢复则回血、结束透析；⑥记录上报，重新评估干体重与降压药。", "explanation": "透析中低血压的定义是透析中收缩压下降≥20 mmHg，或平均动脉压下降≥10 mmHg，并伴有头晕、出汗、恶心、打哈欠等症状，它是透析过程中最常见的急性心血管并发症。处理原则是停超滤、摆体位、补液吸氧，血压不恢复就回血下机，之后须重新评估干体重与降压药使用时机。"}, {"text": "简述缺血性脑卒中与出血性脑卒中在临床表现、头颅CT表现和处理原则上的鉴别要点。", "options": [], "answer": "【临床表现】缺血性卒中多安静或睡眠中起病、进展较缓，头痛呕吐少见，意识障碍多较轻，血压多正常或轻度升高；出血性卒中多在活动或激动时突发，剧烈头痛、呕吐常见，意识障碍常较重并可迅速昏迷，血压常显著升高。【头颅CT】缺血性卒中表现为低密度影，超早期可正常；出血性卒中表现为高密度影，立即可见。【处理原则】缺血性卒中行溶栓或取栓、抗血小板治疗；出血性卒中需控制血压、止血，必要时外科处理。", "explanation": "两类卒中的共同第一步是立即行头颅CT平扫，先分清是「堵」还是「破」，再决定治疗方案。透析患者出血性卒中占比高于普通人群，与长期高血压、透析中肝素抗凝、尿毒症血小板功能障碍及血管钙化有关；缺血性卒中静脉溶栓时间窗为4.5小时，部分患者可机械取栓，护士的关键是早识别、早呼叫、记录发病时间。"}]}]}, {"num": 16, "title": "血液透析患者的充分性评估与临床优化理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析发展史上被称为\"救命阶段\"的时期是（  ）", "options": ["A.1960年代", "B.1970年代", "C.1980年代", "D.1990年代", "E.2000年代"], "answer": "A", "explanation": "1960年代透析仅用于纠正急性高血钾、严重肺水肿和极度尿毒症昏迷，属于救命阶段；1970年代为平衡阶段，1980年代进入定量阶段。"}, {"text": "尿素动力学模型（UKM）提出、Kt/V概念问世的年代是（  ）", "options": ["A.1960年代", "B.1970年代", "C.1980年代", "D.1990年代", "E.21世纪初"], "answer": "C", "explanation": "1980年代为定量阶段，NCDS研究与Gotch提出的尿素动力学模型（UKM）使Kt/V概念问世，开启小分子定量清除时代。"}, {"text": "\"广义充分性\"理念的核心含义是（  ）", "options": ["A.尿素清除率越高越好", "B.单纯小分子清除达标不等于预后良好", "C.单次透析时间越长越好", "D.血流量达标即代表充分", "E.无临床症状即代表充分"], "answer": "B", "explanation": "广义充分性理念强调单纯小分子达标不等于预后好，还需关注中大分子清除、容量与血压、钙磷骨代谢与贫血、营养状态以及血管通路与心理社会适应。"}, {"text": "透析不充分在消化系统出现的最早期表现是（  ）", "options": ["A.皮肤瘙痒", "B.夜间不能平卧", "C.食欲不振", "D.不宁腿综合征", "E.肌肉抽搐"], "answer": "C", "explanation": "透析不充分的消化系统表现包括食欲不振（最早期表现）、晨起恶心呕吐、口中有尿臭味；专科护士往往在化验单异常之前就已发现这些症状。"}, {"text": "不宁腿综合征（RLS）属于透析不充分在（  ）方面的表现", "options": ["A.消化系统", "B.神经与肌肉", "C.皮肤系统", "D.循环系统", "E.骨骼系统"], "answer": "B", "explanation": "透析不充分的神经与肌肉表现包括疲乏无力、注意力不集中、不宁腿综合征（RLS）和肌肉抽搐。"}, {"text": "专科护士最容易捕捉到的透析不充分预警信号是（  ）", "options": ["A.血清肌酐轻度升高", "B.血钾轻度波动", "C.尿量暂时减少", "D.皮肤瘙痒与夜间不能平卧", "E.血红蛋白轻度下降"], "answer": "D", "explanation": "皮肤瘙痒与夜间不能平卧是护士最容易捕捉到的预警信号；顽固性皮肤瘙痒与中大分子及钙磷、PTH蓄积有关。"}, {"text": "在透析不充分的早期识别中，专科护士的定位是（  ）", "options": ["A.第一观察者", "B.最终决策者", "C.处方制定者", "D.设备维修者", "E.通路手术者"], "answer": "A", "explanation": "专科护士是第一观察者，患者往往在化验单异常之前就已出现临床症状。"}, {"text": "血液净化中心PDCA质控循环的计划（Plan）阶段，设定的全科Kt/V达标率目标为（  ）", "options": ["A.≥60%", "B.≥70%", "C.≥75%", "D.≥85%", "E.≥95%"], "answer": "D", "explanation": "PDCA的计划阶段设定科室月度质控目标，如全科Kt/V达标率≥85%，并制定采血与通路评估SOP。"}, {"text": "β₂-微球蛋白的分子量是（  ）", "options": ["A.60 Da", "B.113 Da", "C.168 Da", "D.9.5 kDa", "E.11.8 kDa"], "answer": "E", "explanation": "β₂-微球蛋白分子量为11.8 kDa，属于中大分子毒素，是透析相关淀粉样变（DRA）的主要致病因子。"}, {"text": "蛋白结合毒素的理化特性是（  ）", "options": ["A.分子量小、易被弥散清除", "B.亲水性强、分布容积小", "C.与白蛋白紧密结合、表观分子量大", "D.仅在中性pH下存在", "E.可被高效对流清除"], "answer": "C", "explanation": "蛋白结合毒素以硫酸吲哚酚（IS）和对酚硫酸（PCS）为代表，与血清白蛋白紧密结合、表观分子量大，可加速血管钙化与内皮损伤，传统透析极难清除。"}, {"text": "硫酸吲哚酚（IS）与对酚硫酸（PCS）属于（  ）", "options": ["A.小分子水溶性毒素", "B.中大分子毒素", "C.蛋白结合毒素", "D.炎性细胞因子", "E.电解质代谢产物"], "answer": "C", "explanation": "硫酸吲哚酚（IS）与对酚硫酸（PCS）属于蛋白结合毒素，与白蛋白紧密结合，需依赖吸附等模式清除。"}, {"text": "弥散清除的驱动力是（  ）", "options": ["A.浓度梯度", "B.跨膜压", "C.渗透压", "D.静水压", "E.电荷引力"], "answer": "A", "explanation": "弥散是溶质顺浓度梯度从高浓度一侧（血液）向低浓度一侧（透析液）的无序分子运动，驱动力为浓度梯度（ΔC）。"}, {"text": "对流清除的驱动力是（  ）", "options": ["A.浓度梯度", "B.膜面积", "C.跨膜压（TMP）", "D.透析液流量", "E.白蛋白结合率"], "answer": "C", "explanation": "对流是在跨膜压（TMP）作用下水分子大量跨膜移动，产生溶质拖拽效应，将溶质一并拉出。"}, {"text": "低通量血液透析（LF-HD）主要依赖的毒素清除机制是（  ）", "options": ["A.弥散", "B.对流", "C.吸附", "D.置换", "E.超滤"], "answer": "A", "explanation": "弥散主要清除小分子毒素（如尿素、肌酐），其临床应用即低通量血液透析（LF-HD）。"}, {"text": "血液灌流（HP）主要应用的毒素清除机制是（  ）", "options": ["A.弥散", "B.对流", "C.超滤", "D.吸附", "E.置换"], "answer": "D", "explanation": "吸附利用树脂、活性炭或特异性膜材的疏水作用及静电引力，将毒素结合在微球表面，常用于血液灌流（HP）。"}, {"text": "钙磷与骨代谢管理中，血磷的控制目标是（  ）", "options": ["A.0.65~1.05 mmol/L", "B.0.85~1.45 mmol/L", "C.1.45~1.78 mmol/L", "D.1.78~2.25 mmol/L", "E.2.10~2.50 mmol/L"], "answer": "B", "explanation": "CKD-MBD管理目标为血磷0.85~1.45 mmol/L、血钙2.10~2.50 mmol/L，血磷是控制血管钙化的核心。"}, {"text": "URR的计算公式是（  ）", "options": ["A.(Cpost−Cpre)/Cpre×100%", "B.(Cpre−Cpost)/Cpre×100%", "C.(Cpre−Cpost)/Cpost×100%", "D.(Cpre+Cpost)/Cpre×100%", "E.Cpost/Cpre×100%"], "answer": "B", "explanation": "URR=(Cpre−Cpost)/Cpre×100%，其中Cpre为透析前血BUN，Cpost为透析后血BUN。"}, {"text": "某患者透析前BUN为20 mmol/L、透析后BUN为6 mmol/L，其URR为（  ）", "options": ["A.30%", "B.60%", "C.70%", "D.76%", "E.90%"], "answer": "C", "explanation": "URR=(20−6)/20×100%=70%，属于目标优秀水平（≥70%）。"}, {"text": "URR的主要缺陷是（  ）", "options": ["A.计算过于复杂", "B.必须依赖专业软件", "C.不能用于临床筛查", "D.未考虑超滤脱水对BUN的浓缩效应", "E.未纳入血流量参数"], "answer": "D", "explanation": "URR的缺陷包括未考虑超滤脱水对BUN的浓缩效应、未考虑内源性尿素生成，容易低估实际清除效果。"}, {"text": "单室spKt/V公式中R代表（  ）", "options": ["A.单次超滤脱水量", "B.透析前后BUN比值（Cpost/Cpre）", "C.单次透析时间", "D.干体重", "E.透析液流量"], "answer": "B", "explanation": "R=Cpost/Cpre，为透析前后BUN比值；t为单次透析时间（小时），UF为单次超滤脱水量（升），W为透析后体重/干体重（千克）。"}, {"text": "单室spKt/V公式中W代表（  ）", "options": ["A.单次超滤脱水量", "B.单次透析时间", "C.透析液流量", "D.透析后体重/干体重（千克）", "E.尿素分布体积"], "answer": "D", "explanation": "spKt/V公式中W为透析后体重/干体重（千克），UF为单次超滤脱水量（升）。"}, {"text": "尿素再冲高（Rebound）的特点是（  ）", "options": ["A.透析中BUN迅速下降50%", "B.透析后30~60分钟再升高10%~20%", "C.透析后BUN持续下降", "D.透析前BUN突然升高", "E.与细胞内尿素外移无关"], "answer": "B", "explanation": "尿素再冲高指透析停止后细胞内尿素向血管内弥散，导致透析后30~60分钟血BUN再次升高10%~20%。"}, {"text": "双室eKt/V的Tattersall修正公式是（  ）", "options": ["A.spKt/V+(0.6×spKt/V/t)−0.03", "B.spKt/V×0.6/t+0.03", "C.spKt/V−(0.6×spKt/V/t)+0.03", "D.spKt/V+0.03", "E.spKt/V−0.03"], "answer": "C", "explanation": "eKt/V=spKt/V−(0.6×spKt/V/t)+0.03，为Tattersall修正公式，能更准确反映全身细胞内外的真实毒素清除。"}, {"text": "按指南推荐，spKt/V的\"目标优秀\"标准是（  ）", "options": ["A.≥1.0", "B.≥1.2", "C.≥1.4", "D.≥1.6", "E.≥1.8"], "answer": "C", "explanation": "spKt/V未达标为&lt;1.2，合格为1.2~1.39，目标优秀为≥1.4。"}, {"text": "按指南推荐，URR的\"目标优秀\"标准是（  ）", "options": ["A.≥50%", "B.≥60%", "C.≥65%", "D.≥68%", "E.≥70%"], "answer": "E", "explanation": "URR未达标为&lt;65%，合格为65%~69%，目标优秀为≥70%。"}, {"text": "按指南推荐，eKt/V的\"合格\"范围是（  ）", "options": ["A.&lt;1.0", "B.1.0~1.19", "C.1.2~1.39", "D.1.4~1.59", "E.≥1.6"], "answer": "B", "explanation": "eKt/V未达标为&lt;1.0，合格为1.0~1.19，目标优秀为≥1.2。"}, {"text": "每周2次透析的患者，其spKt/V必须达到（  ）", "options": ["A.≥1.2", "B.≥1.4", "C.≥1.6", "D.≥1.7", "E.≥1.8"], "answer": "E", "explanation": "每周2次透析患者spKt/V必须≥1.8，该标准仅适用于有显著残余肾功能（RRF）者。"}, {"text": "实际血流量（Qb）的建议范围是（  ）", "options": ["A.100~150 mL/min", "B.150~200 mL/min", "C.250~350 mL/min", "D.400~450 mL/min", "E.500~600 mL/min"], "answer": "C", "explanation": "影响清除率的要素中，实际血流量（Qb）建议250~350 mL/min，透析液流量（Qd）建议500~800 mL/min。"}, {"text": "全段甲状旁腺素的目标范围是（  ）", "options": ["A.正常上限1~2倍", "B.正常上限2~9倍（150~600 pg/mL）", "C.正常上限10~15倍", "D.维持正常范围内", "E.越低越好"], "answer": "B", "explanation": "CKD-MBD管理中全段PTH目标为正常上限2~9倍，约150~600 pg/mL，钙磷代谢紊乱是透析患者心血管事件的重要推手。"}, {"text": "标准化采血4步法中的第1步是（  ）", "options": ["A.关闭超滤（UF Rate=0）", "B.立即停泵夹管", "C.从动脉端取血", "D.降低血泵流速", "E.从静脉端取血"], "answer": "A", "explanation": "标准化采血4步法第1步为关超滤：治疗达到规定时间后，关闭超滤（UF Rate=0）。"}, {"text": "标准化采血4步法中\"减血泵\"的具体要求是（  ）", "options": ["A.立即停泵", "B.降至50~100 mL/min维持15~20秒", "C.降至150 mL/min维持1分钟", "D.维持原流速30秒", "E.提升至350 mL/min冲洗管路"], "answer": "B", "explanation": "减血泵时将血泵流速降至50~100 mL/min，维持运行15~20秒，以冲洗掉动脉管路内再循环及被稀释的血液。"}, {"text": "透析后BUN的正确采血部位是（  ）", "options": ["A.静脉端（透析器后）", "B.外周静脉", "C.动脉端BOP（透析器前）", "D.透析液出口", "E.中心静脉导管"], "answer": "C", "explanation": "应从动脉端采血入口（BOP，位于透析器之前）抽取血样，该处抽取的是进入透析器前的真实血液。"}, {"text": "在静脉端（透析器后）采血会导致（  ）", "options": ["A.Kt/V严重假达标", "B.Kt/V假不达标", "C.血流量偏低", "D.再循环率升高", "E.尿素再冲高加重"], "answer": "A", "explanation": "静脉端采到的是刚经透析器净化后的血液，BUN极低，结果使Kt/V严重假达标。"}, {"text": "透析结束后延迟10~15分钟采血会导致（  ）", "options": ["A.Kt/V严重假达标", "B.血流量偏低", "C.采血点位于透析器后", "D.Kt/V假不达标", "E.超滤量偏大"], "answer": "D", "explanation": "透析结束后延迟10~15分钟采血，受尿素再冲高（Rebound）影响此时BUN已升高，结果使Kt/V假不达标。"}, {"text": "小分子未达标排查树中，Step 4针对的问题是（  ）", "options": ["A.采血是否规范", "B.通路是否通畅（再循环率&gt;5%）", "C.透析时间是否满4小时", "D.透析器膜面积是否偏小", "E.血流量是否达到医嘱预设"], "answer": "B", "explanation": "排查树Step 4为通路是否通畅，包括是否存在再循环（再循环率&gt;5%）、双针间距是否&lt;5cm；Step 5再检查透析器是否有严重凝血或膜面积偏小。"}, {"text": "容量过负荷是透析患者（  ）的第一诱因", "options": ["A.心脑血管死亡", "B.消化道出血", "C.感染性休克", "D.贫血加重", "E.骨痛"], "answer": "A", "explanation": "容量过负荷是透析患者心脑血管死亡（心衰、脑出血）的第一诱因，干体重与超滤速率是透析生存的另一根支柱。"}, {"text": "评估容量最基本、最有效的临床手段是（  ）", "options": ["A.胸部X线", "B.心脏彩超", "C.血清脑钠肽", "D.生物电阻抗分析", "E.临床体格检查（视、触、叩、听）"], "answer": "E", "explanation": "临床体格检查永远是评估容量的最基本、最有效手段，包括问诊、视诊、听诊和血压特征判断。"}, {"text": "营养改善、肌肉与脂肪增加的患者，其干体重应（  ）", "options": ["A.上调", "B.下调", "C.保持不变", "D.每次透析后递减", "E.按透析前体重直接设定"], "answer": "A", "explanation": "营养改善者食欲好、肌肉与脂肪增加，若仍按原干体重脱水会发生低血压，应上调干体重。"}, {"text": "超滤速率（UFR）的安全红线是（  ）", "options": ["A.&lt;5 mL/kg/h", "B.&lt;8 mL/kg/h", "C.&lt;13 mL/kg/h", "D.&lt;18 mL/kg/h", "E.&lt;20 mL/kg/h"], "answer": "C", "explanation": "UFR安全红线为&lt;13 mL/kg/h，最佳&lt;10 mL/kg/h；超滤过快可造成心肌震荡、脑缺血、肠道缺血。"}, {"text": "干体重60 kg的患者透析4小时，其最大安全脱水量为（  ）", "options": ["A.2.40 L", "B.3.12 L", "C.3.90 L", "D.4.50 L", "E.5.20 L"], "answer": "B", "explanation": "最大安全脱水量=13×干体重(kg)×时间(h)/1000=13×60×4/1000=3.12 L。"}, {"text": "按评估目标，单次透析β₂-微球蛋白的下降率应达到（  ）", "options": ["A.&gt;10%", "B.&gt;20%", "C.&gt;30%", "D.&gt;50%", "E.&gt;80%"], "answer": "D", "explanation": "评估指标为血清β₂-MG浓度，单次透析下降率目标&gt;50%，以降低透析相关淀粉样变风险。"}, {"text": "目前清除中大分子最强的血液净化模式是（  ）", "options": ["A.低通量血液透析", "B.高通量血液透析", "C.血液透析滤过（HDF）", "D.单纯超滤", "E.血液灌流"], "answer": "C", "explanation": "血液透析滤过（HDF）外加大量生理性置换液，是目前清除中大分子最强的模式。"}, {"text": "后稀释HDF的置换量必须达到（  ）才能显著降低全因死亡率", "options": ["A.≥8 L/session", "B.≥12 L/session", "C.≥18 L/session", "D.≥20 L/session", "E.≥23 L/session"], "answer": "E", "explanation": "后稀释HDF置换量必须≥23 L/session（含超滤量），才能显著降低全因死亡率。"}, {"text": "血管通路再循环率的合格标准是（  ）", "options": ["A.&lt;1%", "B.&lt;5%", "C.&lt;10%", "D.&lt;15%", "E.&lt;20%"], "answer": "B", "explanation": "合格通路标准为有效血流量Qb≥250~350 mL/min、通路内再循环率&lt;5%，再循环率&gt;5%提示存在严重再循环。"}, {"text": "正常的动静脉瘘触诊震颤（Thrill）表现为（  ）", "options": ["A.全收缩期连续柔和震颤", "B.高调断续震颤", "C.仅有舒张期震颤", "D.无震颤", "E.抬举后消失"], "answer": "A", "explanation": "震颤（Thrill）正常为全收缩期连续柔和震颤；高调、断续粗糙的杂音则提示狭窄。"}, {"text": "某维持性血透患者干体重60 kg、透析间期体重增长4.5 kg、每次透析4小时，其超滤速率约为（  ）", "options": ["A.9.38 mL/kg/h", "B.12.50 mL/kg/h", "C.15.00 mL/kg/h", "D.18.75 mL/kg/h", "E.22.50 mL/kg/h"], "answer": "D", "explanation": "超滤速率=4500 mL÷60 kg÷4 h=18.75 mL/kg/h，远超13 mL/kg/h的安全红线，是该患者透析中低血压与抽搐的重要原因。"}, {"text": "保护残余肾功能（RRF）的\"四不要\"中，正确的是（  ）", "options": ["A.避免使用促红素", "B.避免使用高生物相容性透析器", "C.不要个体化透析处方", "D.不要使用肾毒性药物（如NSAIDs）", "E.不要控制血压"], "answer": "D", "explanation": "RRF保护的\"四不要\"包括不要过度脱水导致低血压/肾缺血、不要使用肾毒性药物（NSAIDs等）、不要使用高渗透析液等。"}, {"text": "按营养评估要求，血清白蛋白（Alb）应维持在（  ）", "options": ["A.≥40 g/L", "B.≥35 g/L", "C.≥30 g/L", "D.≥25 g/L", "E.≥20 g/L"], "answer": "A", "explanation": "营养评估的生化指标为血清白蛋白（Alb）≥40 g/L、前白蛋白&gt;0.3 g/L，同时结合人体测量与SGA评估。"}, {"text": "按肾性贫血管理目标，血红蛋白（Hb）应维持在（  ）", "options": ["A.60~80 g/L", "B.90~100 g/L", "C.110~120 g/L", "D.130~140 g/L", "E.150~160 g/L"], "answer": "C", "explanation": "肾性贫血管理目标为血红蛋白110~120 g/L、转铁蛋白饱和度&gt;20%、血清铁蛋白&gt;100 ng/mL。"}, {"text": "高通量血液透析（HF-HD）所用的高通量透析器，其超滤系数（Kuf）应满足（  ）", "options": ["A.&gt; 5 mL/mmHg/h", "B.&gt; 10 mL/mmHg/h", "C.&gt; 15 mL/mmHg/h", "D.&gt; 20 mL/mmHg/h", "E.&gt; 40 mL/mmHg/h"], "answer": "D", "explanation": "高通量血液透析依靠膜内对流清除中分子，高通量透析器的超滤系数Kuf需大于20 mL/mmHg/h，与低通量透析器相比具有更大膜孔径与更强对流清除能力。"}]}, {"type": "multiple", "questions": [{"text": "尿毒症毒素中属于中大分子毒素的有（  ）", "options": ["Ａ.β₂-微球蛋白", "Ｂ.甲状旁腺素（PTH）", "Ｃ.白介素-6", "Ｄ.尿素", "Ｅ.硫酸吲哚酚"], "answer": "ABC", "explanation": "β₂-微球蛋白（11.8 kDa）、PTH（9.5 kDa）、白介素-6（24 kDa）都属于中大分子毒素，需依赖对流清除。尿素属于小分子水溶性毒素；硫酸吲哚酚属于蛋白结合毒素，故两项均不选。"}, {"text": "钙磷与骨代谢（CKD-MBD）的管理目标包括（  ）", "options": ["Ａ.血磷0.85~1.45 mmol/L", "Ｂ.血钙2.10~2.50 mmol/L", "Ｃ.全段PTH为正常上限2~9倍", "Ｄ.血红蛋白110~120 g/L", "Ｅ.转铁蛋白饱和度&gt;20%"], "answer": "ABC", "explanation": "CKD-MBD管理目标为血磷0.85~1.45 mmol/L、血钙2.10~2.50 mmol/L、全段PTH为正常上限2~9倍（150~600 pg/mL）。血红蛋白110~120 g/L与转铁蛋白饱和度&gt;20%属于肾性贫血管理目标，故不选。"}, {"text": "蛋白结合毒素的特点包括（  ）", "options": ["Ａ.与血清白蛋白紧密结合", "Ｂ.表观分子量大", "Ｃ.传统透析极难清除", "Ｄ.易被弥散高效清除", "Ｅ.分子量小于200 Da"], "answer": "ABC", "explanation": "蛋白结合毒素（硫酸吲哚酚、对酚硫酸）与白蛋白紧密结合、表观分子量大，可加速血管钙化与内皮损伤，传统透析极难清除。易被弥散高效清除、分子量小于200 Da是尿素等小分子水溶性毒素的特点，故不选。"}, {"text": "关于弥散清除，正确的描述有（  ）", "options": ["Ａ.顺浓度梯度由血液向透析液运动", "Ｂ.驱动力是浓度梯度", "Ｃ.主要清除小分子毒素", "Ｄ.常用于低通量血液透析（LF-HD）", "Ｅ.是清除中大分子的主要机制"], "answer": "ABCD", "explanation": "弥散是溶质顺浓度梯度从血液向透析液的无序分子运动，驱动力为浓度梯度，主要清除小分子毒素，临床应用为低通量血液透析。清除中大分子的主要机制是对流，故\"是清除中大分子的主要机制\"错误。"}, {"text": "关于对流清除，正确的描述有（  ）", "options": ["Ａ.驱动力是跨膜压（TMP）", "Ｂ.通过溶质拖拽效应带出溶质", "Ｃ.受超滤量/置换量与超滤系数影响", "Ｄ.主要清除小分子毒素", "Ｅ.驱动力是浓度梯度"], "answer": "ABC", "explanation": "对流在跨膜压作用下使水分子大量跨膜移动，产生溶质拖拽效应，受超滤量/置换量与膜超滤系数（Kuf）影响，主要清除中大分子毒素。\"主要清除小分子毒素\"与小分子毒素不符，\"驱动力是浓度梯度\"是弥散的特点，故两项不选。"}, {"text": "关于吸附清除机制，正确的描述有（  ）", "options": ["Ａ.利用树脂、活性炭或特异性膜材", "Ｂ.通过疏水作用与静电引力结合毒素", "Ｃ.常用于血液灌流（HP）", "Ｄ.主要清除小分子水溶性毒素", "Ｅ.驱动力为跨膜压"], "answer": "ABC", "explanation": "吸附利用树脂、活性炭或特异性膜材的疏水作用及静电引力，将毒素结合在微球表面，主导清除蛋白结合毒素与炎性介质，常用于血液灌流。吸附不主要清除小分子水溶性毒素，其机制也不是跨膜压驱动，故两项不选。"}, {"text": "URR的优势包括（  ）", "options": ["Ａ.概念直观，计算简单", "Ｂ.无需复杂计算软件", "Ｃ.已校正超滤浓缩效应", "Ｄ.适合双室模型计算", "Ｅ.需要检测透析液流量"], "answer": "AB", "explanation": "URR概念直观、计算简单，无需复杂计算软件，适合快速临床筛查。URR未考虑超滤脱水对BUN的浓缩效应、也未考虑内源性尿素生成，属于单室概念，也不需要检测透析液流量，故其余选项错误。"}, {"text": "URR的缺陷包括（  ）", "options": ["Ａ.未考虑超滤脱水对BUN的浓缩效应", "Ｂ.未考虑内源性尿素生成", "Ｃ.容易低估实际清除效果", "Ｄ.必须依赖专业软件才能计算", "Ｅ.必须依赖双室模型"], "answer": "ABC", "explanation": "URR的缺陷为未考虑超滤脱水对BUN的浓缩效应、未考虑内源性尿素生成，容易低估实际清除效果。URR计算简单、无需软件，也不需要双室模型，故后两项错误。"}, {"text": "标准化采血4步法的操作要点包括（  ）", "options": ["Ａ.治疗达规定时间后关闭超滤", "Ｂ.血泵降至50~100 mL/min并维持15~20秒", "Ｃ.停止血泵并迅速夹闭动脉管路", "Ｄ.从动脉端BOP（透析器前）取血", "Ｅ.从静脉端（透析器后）取血"], "answer": "ABCD", "explanation": "标准化采血4步法为关超滤、减血泵（降至50~100 mL/min维持15~20秒）、停泵夹管、动脉端采血（BOP位于透析器前）。从静脉端采血会因血液刚被净化而使Kt/V严重假达标，属于采血误区，故不选。"}, {"text": "透析后BUN采血的常见误区包括（  ）", "options": ["Ａ.未关超滤或未减血泵直接采血", "Ｂ.在静脉端（透析器后）采血", "Ｃ.透析结束后延迟10~15分钟采血", "Ｄ.从动脉端BOP取血", "Ｅ.治疗达规定时间后关闭超滤"], "answer": "ABC", "explanation": "三大采血误区为未关超滤或未减血泵直接采血（Kt/V虚高假达标）、在静脉端采血（Kt/V严重假达标）、透析结束后延迟10~15分钟采血（受尿素再冲高影响致Kt/V假不达标）。从动脉端BOP取血与关闭超滤都是规范操作，不属于误区。"}, {"text": "小分子未达标排查树中，属于设备因素排查的有（  ）", "options": ["Ａ.通路是否通畅", "Ｂ.透析器是否正常", "Ｃ.采血是否规范", "Ｄ.实际透析时间是否充足", "Ｅ.患者依从性是否良好"], "answer": "AB", "explanation": "排查树先排除人为因素（采血、时间），再检查设备因素（血流），其中通路是否通畅（Step 4）与透析器是否正常（Step 5）属于通路与设备因素排查。采血规范、透析时间充足属于人为因素，患者依从性影响透析时间，均不属于设备因素。"}, {"text": "容量过负荷的临床表现包括（  ）", "options": ["Ａ.顽固性高血压", "Ｂ.左心室肥厚（LVH）", "Ｃ.急性左心衰竭", "Ｄ.急性肺水肿", "Ｅ.透析中低血压"], "answer": "ABCD", "explanation": "容量过负荷可导致顽固性高血压、左心室肥厚（LVH）、急性左心衰竭和急性肺水肿。透析中低血压属于容量不足的表现，故不选。"}, {"text": "容量不足可导致的后果包括（  ）", "options": ["Ａ.透析中低血压（IDH）", "Ｂ.心肌节段性缺血（心肌震荡）", "Ｃ.残余肾功能加速丢失", "Ｄ.急性肺水肿", "Ｅ.左心室肥厚"], "answer": "ABC", "explanation": "容量不足可导致透析中低血压（IDH）、心肌节段性缺血（心肌震荡）和残余肾功能加速丢失。急性肺水肿与左心室肥厚是容量过负荷的表现，故两项不选。"}, {"text": "干体重评估中\"视、触、叩、听\"的内容包括（  ）", "options": ["Ａ.双下肢凹陷性水肿", "Ｂ.肺底湿啰音", "Ｃ.颈静脉怒张", "Ｄ.夜间阵发性呼吸困难", "Ｅ.透析液电导度"], "answer": "ABCD", "explanation": "干体重评估以临床体格检查为核心：问诊夜间阵发性呼吸困难、端坐呼吸；视诊双下肢凹陷性水肿、眼睑水肿、颈静脉怒张；听诊肺底湿啰音、奔马律。透析液电导度属于透析液质量指标，与容量评估无关。"}, {"text": "干体重的客观辅助测量工具包括（  ）", "options": ["Ａ.生物电阻抗分析（BIA）", "Ｂ.便携式肺部超声（LUS）", "Ｃ.下腔静脉超声（IVCD）", "Ｄ.全段甲状旁腺素测定", "Ｅ.动态血压监测"], "answer": "ABC", "explanation": "客观辅助工具包括生物电阻抗分析（BIA）测量细胞外水分与总水分、便携式肺部超声（LUS）监测双肺B线、下腔静脉超声（IVCD）测量下腔静脉呼气末内径及吸气塌陷率。全段甲状旁腺素测定与动态血压监测不属于干体重的客观容量测量工具。"}, {"text": "超滤速率过快可导致的危害包括（  ）", "options": ["Ａ.心肌震荡", "Ｂ.脑缺血", "Ｃ.肠道缺血", "Ｄ.腕管综合征", "Ｅ.透析相关淀粉样变"], "answer": "ABC", "explanation": "超滤过快的危害包括心肌震荡、脑缺血和肠道缺血，因此UFR应控制在&lt;13 mL/kg/h。腕管综合征与透析相关淀粉样变属于β₂-微球蛋白等中大分子蓄积导致的远期危害，故两项不选。"}, {"text": "透析相关淀粉样变（DRA）的临床表现包括（  ）", "options": ["Ａ.骨痛", "Ｂ.腕管综合征", "Ｃ.顽固性皮肤瘙痒", "Ｄ.病理性骨折", "Ｅ.急性左心衰竭"], "answer": "ABCD", "explanation": "DRA由β₂-微球蛋白蓄积引起，表现为骨痛（淀粉样物质沉积于骨关节）、腕管综合征（正中神经受压）、顽固性皮肤瘙痒和病理性骨折（骨囊性病变）。急性左心衰竭主要与容量过负荷有关，故不选。"}, {"text": "保护残余肾功能（RRF）的\"四要\"包括（  ）", "options": ["Ａ.控制超滤速率（&lt;10~13 mL/kg/h）", "Ｂ.使用高生物相容性透析器", "Ｃ.严格控制血压", "Ｄ.个体化透析处方", "Ｅ.使用高渗透析液"], "answer": "ABCD", "explanation": "RRF保护的\"四要\"为控制超滤速率（&lt;10~13 mL/kg/h）、使用高生物相容性透析器、严格控制血压和个体化透析处方。使用高渗透析液属于\"四不要\"，故不选。"}, {"text": "动静脉瘘（AVF）物理检查（VPE）的内容包括（  ）", "options": ["Ａ.视诊血管走形与瘤样扩张", "Ｂ.触诊震颤（Thrill）", "Ｃ.听诊杂音（Bruit）", "Ｄ.抬举试验", "Ｅ.透析器膜面积测量"], "answer": "ABC", "explanation": "VPE包括视诊血管走形、瘤样扩张、皮肤红肿破溃及缺血苍白，触诊震颤（正常为全收缩期连续柔和震颤），听诊杂音（正常为连续低沉吹风样）。抬举试验虽为通路评估方法，但常规VPE要素为视、触、听三步；透析器膜面积与通路物理检查无关。"}, {"text": "血液透析充分性管理的核心要求包括（  ）", "options": ["Ａ.小分子清除以spKt/V≥1.4为目标", "Ｂ.超滤速率不超过13 mL/kg/h", "Ｃ.后稀释HDF置换量达到≥23 L", "Ｄ.保证血流量Qb≥250 mL/min", "Ｅ.充分性只需关注小分子溶质清除"], "answer": "ABCD", "explanation": "充分性管理核心要求为小分子spKt/V≥1.4、UFR不超过13 mL/kg/h安全红线、后稀释HDF置换量≥23 L、通路血流量Qb≥250 mL/min并穿刺前做视触听VPE。充分性是\"溶质-容量-营养-生活质量\"的全方位管理，只关注小分子清除是错误的。"}]}, {"type": "short", "questions": [{"text": "简述透析后BUN标准化采血的4步法及其操作机制。", "options": [], "answer": "（1）关超滤：治疗达到规定时间后，关闭超滤（UF Rate=0）；（2）减血泵：将血泵流速降至50~100 mL/min，维持运行15~20秒，以冲洗掉动脉管路内再循环及被稀释的血液；（3）停泵夹管：停止血泵，迅速夹闭动脉管路；（4）动脉端采血：从动脉端采血入口（BOP）抽取血样，该处位于透析器之前、动脉端，抽取的是进入透析器前的真实血液。", "explanation": "采血规范是充分性评估的\"命脉环节\"，采血不规范会导致数据严重失真，出现假达标或假不达标。未关超滤或未减血泵直接采血，采到的是受超滤和血管通路再循环稀释的血液，BUN偏低使Kt/V虚高假达标；在静脉端采血，BUN极低使Kt/V严重假达标；透析结束后延迟10~15分钟采血，受尿素再冲高影响使Kt/V假不达标。"}, {"text": "简述URR的计算公式、主要优势与缺陷。", "options": [], "answer": "URR=(Cpre−Cpost)/Cpre×100%，其中Cpre为透析前血BUN，Cpost为透析后血BUN。优势：概念直观、计算简单，无需复杂计算软件，适合快速临床筛查。缺陷：未考虑超滤脱水对BUN的浓缩效应，未考虑内源性尿素生成，容易低估实际清除效果。例如透析前BUN 20 mmol/L、透析后BUN 6 mmol/L时，URR=(20−6)/20×100%=70%。", "explanation": "URR的达标分层为：目标优秀≥70%、合格65%~69%、未达标&lt;65%。它与spKt/V、eKt/V共同构成小分子清除的核心评估指标，推荐标准参照KDOQI与中国血液净化标准操作规程（SOP）。"}, {"text": "简述干体重的临床定义、评估方法与动态调整原则。", "options": [], "answer": "临床定义为：患者在透析后既无水钠潴留（无水肿、血压正常），又不发生低血压、抽搐、头晕等不适时的理想体重，是设定超滤目标与评估容量的基准。评估方法：以临床体格检查（视、触、叩、听）为最基本、最有效手段，问诊夜间阵发性呼吸困难、端坐呼吸、透析后极度乏力或头晕抽搐，视诊双下肢凹陷性水肿、眼睑水肿、颈静脉怒张，听诊肺底湿啰音、奔马律，并关注透析前高血压与透析中难治性高血压；客观辅助工具包括生物电阻抗分析（BIA）、便携式肺部超声（LUS，双肺B线/彗星尾征）与下腔静脉超声（IVCD）。动态调整：营养改善者应上调干体重，消耗消瘦者应下调干体重。", "explanation": "干体重需要动态调整：营养改善者食欲好、肌肉与脂肪增加，若仍按原干体重脱水会发生低血压，应上调干体重；疾病消耗、干物质减少者在原干体重下仍高血压或水肿，应下调干体重。容量过负荷是透析患者心脑血管死亡（心衰、脑出血）的第一诱因，而容量不足会导致透析中低血压、心肌震荡与残余肾功能加速丢失。"}, {"text": "简述超滤速率（UFR）的安全红线、最大安全脱水量的计算及临床意义。", "options": [], "answer": "安全红线为UFR&lt;13 mL/kg/h，最佳&lt;10 mL/kg/h；最大安全脱水量(L)=13×干体重(kg)×时间(h)/1000。举例：干体重60 kg、透析4小时，最大安全脱水量=13×60×4/1000=3.12 L；若患者透析间期增重4.5 kg，实际需要脱水4.5 L已超过3.12 L，强行脱水必出低血压、抽搐甚至心肌缺血。超滤过快的危害包括心肌震荡、脑缺血、肠道缺血。", "explanation": "容量管理是透析生存的另一根支柱，与溶质清除同等重要。透析间期体重增长（IDWG）应控制在&lt;5%干体重；若控水未达标，可临时增加透析频次或延长透析时间以分散超滤压力。案例中干体重60 kg、IDWG 4.5 kg、透析4小时的患者，其UFR为18.75 mL/kg/h，远超13 mL/kg/h红线。"}, {"text": "简述血管通路充分性评估的合格标准与动静脉瘘物理检查（VPE）的内容。", "options": [], "answer": "合格通路标准：有效血流量Qb≥250~350 mL/min、通路内再循环率&lt;5%。通路再循环测定采用三采血法，再循环率=(Cs−Ca)/(Cs−Cv)×100%，其中Ca为动脉端BUN、Cv为静脉端BUN、Cs为外周静脉BUN，再循环率&gt;5%提示存在严重再循环。VPE内容：视诊观察血管走形、有无瘤样扩张、皮肤红肿破溃及缺血苍白；触诊震颤（Thrill），正常为全收缩期连续柔和震颤，抬举试验抬高后仍充盈提示流出道狭窄；听诊杂音（Bruit），正常为连续低沉吹风样，高调、断续粗糙音提示狭窄。专科护士每次穿刺前必须进行视、触、听三步检查。", "explanation": "血管通路是血透的\"命门\"，通路功能不良直接导致血流量受限，使小分子和中分子清除全面不达标。通路再循环率高常见于双针间距&lt;5cm或导管动静脉端反接，处理措施为规范穿刺间距（≥5cm）并纠正导管连接方式；若存在狭窄，可行通路超声评估及PTA血管扩张术。"}]}]}, {"num": 17, "title": "急性并发症2026理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析过程中，发作性低血压是指伴有症状的收缩压突然下降（  ）", "options": ["A.10mmHg", "B.15mmHg", "C.20mmHg", "D.25mmHg", "E.30mmHg"], "answer": "C", "explanation": "发作性低血压指伴有症状的收缩压突然下降20mmHg，或平均动脉压下降10mmHg。发作性低血压的发生率为30%～40%。"}, {"text": "血液透析中体外循环凝血达到Ⅲ度时，应将血泵速度逐渐降至（  ）", "options": ["A.40ml/min", "B.60ml/min", "C.80ml/min", "D.100ml/min", "E.150ml/min"], "answer": "D", "explanation": "发现透析器或管路达到Ⅲ度凝血时，应在不停血泵的情况下，立刻打开动脉管路上的补液通路回输生理盐水，停止引血，并将血泵速度逐渐降至100ml/min，更换透析器和管路；停血泵会造成整个体外循环凝血。"}, {"text": "慢性持续性低血压的患者，透析过程中收缩压通常不超过（  ）", "options": ["A.80mmHg", "B.90mmHg", "C.100mmHg", "D.110mmHg", "E.120mmHg"], "answer": "C", "explanation": "慢性持续性低血压表现为透析过程中收缩压通常不超过100mmHg，透析间期亦出现低血压，其发生率为5%～10%。"}, {"text": "血液透析中低血压（IDH）的发生率高达（  ）", "options": ["A.5%～10%", "B.10%～15%", "C.15%～30%", "D.30%～40%", "E.40%～50%"], "answer": "C", "explanation": "血液透析中低血压的发生率高达15%～30%。随着血液透析患者老龄化、高血压和糖尿病肾病患者增加，其发生率有增加趋势。"}, {"text": "平均动脉压（MAP）的计算公式是（  ）", "options": ["A.（收缩压+2×舒张压）/2", "B.（收缩压+舒张压）/2", "C.（收缩压+2×舒张压）/3", "D.（收缩压+舒张压）/3", "E.收缩压−舒张压"], "answer": "C", "explanation": "平均动脉压可按（收缩压+2×舒张压）/3计算，也可写作舒张压+1/3脉压差。"}, {"text": "维持性血液透析患者发生透析中低血压的独立危险因素是（  ）", "options": ["A.低龄", "B.高龄", "C.高钾血症", "D.高磷血症", "E.贫血纠正"], "answer": "B", "explanation": "研究发现，高龄与发生透析中低血压的机率成正相关，特别是伴有慢性持续性低血压的情况，高龄是维持性血液透析患者发生透析中低血压的独立危险因素。"}, {"text": "维持血压的三要素是（  ）", "options": ["A.心排量、外周血管阻力、血容量", "B.心率、血氧饱和度、血容量", "C.心排量、血浆渗透压、心率", "D.外周血管阻力、血浆渗透压、血红蛋白", "E.血容量、血红蛋白、外周血管阻力"], "answer": "A", "explanation": "维持血压的三要素是心排量（CO）、外周血管阻力（TVR）和血容量（Q）；透析中低血压的发生与有效血容量降低、心排出量降低、血管扩张等环节有关。"}, {"text": "血液透析过程中进食液体，低血压的发生率将升高（  ）", "options": ["A.1倍", "B.2倍", "C.3倍", "D.4倍", "E.5倍"], "answer": "C", "explanation": "研究证实，如果患者在血液透析过程中摄入液体，低血压的发生率将升高3倍；若进食大于200大卡，低血压的发生率将提高1倍。"}, {"text": "血液透析过程中进食下列哪类食物对患者血压影响较小（  ）", "options": ["A.高盐食物", "B.蛋白质类食物", "C.高糖食物", "D.高脂食物", "E.含液体较多的食物"], "answer": "B", "explanation": "若进食蛋白质类食物，则对患者的血压影响较小；而在透析中进食液体、进食同时摄入液体均会明显增加低血压的发生。"}, {"text": "透析间期体重增加过多，超滤总量超过干体重多少时易引起有效血容量不足而发生低血压（  ）", "options": ["A.2%～3%", "B.3%～5%", "C.4%～5%", "D.6%～7%", "E.8%～10%"], "answer": "D", "explanation": "脱水速度大于再充盈率，超滤总量超过干体重6%～7%时，易引起有效血容量不足，从而发生低血压。"}, {"text": "血液透析过程中出现胸痛、背痛的常见原因是（  ）", "options": ["A.心绞痛（心肌缺血）", "B.高钙血症", "C.贫血", "D.高钾血症", "E.低血糖"], "answer": "A", "explanation": "胸痛、背痛的常见原因有心绞痛（心肌缺血）、透析中溶血、低血压、空气栓塞、透析失衡综合征以及心包炎、胸膜炎等。"}, {"text": "为减少低血压的发生，可将透析液钠浓度增加至（  ）", "options": ["A.135mmol/L", "B.138mmol/L", "C.140mmol/L", "D.142mmol/L", "E.145mmol/L"], "answer": "E", "explanation": "将透析液钠浓度增加至145mmol/L可减少低血压的发生，但又要防止高钠血症，对此类原因引起的低血压患者可以采用序贯钠透析。"}, {"text": "低温透析时，透析液温度一般设置为（  ）", "options": ["A.33℃～34℃", "B.34℃～35℃", "C.35℃～36℃", "D.36℃～37℃", "E.37℃～38℃"], "answer": "C", "explanation": "低温透析采用35℃～36℃的透析液温度，通过刺激交感神经系统，增加外周血管阻力及心肌收缩力，从而避免低血压发生。"}, {"text": "低温透析可降低透析中低血压发生率（  ）", "options": ["A.2.1倍", "B.4.1倍", "C.5.1倍", "D.7.1倍", "E.9.1倍"], "answer": "D", "explanation": "低温透析可使血管代偿性收缩，增加超滤耐受，可降低透析中低血压发生率7.1倍。"}, {"text": "需要透析中进餐的患者，进餐时间应选在血液透析开始（  ）", "options": ["A.前30分钟内", "B.1～2小时内", "C.2～3小时内", "D.3～4小时内", "E.透析结束时"], "answer": "B", "explanation": "透析中进餐时间应选在血透开始1～2小时内，切忌透析后期进餐，尤其是超滤病人。"}, {"text": "应避免透析中进餐的患者，其血压水平低于（  ）", "options": ["A.80/50mmHg", "B.90/60mmHg", "C.100/60mmHg", "D.110/70mmHg", "E.120/80mmHg"], "answer": "C", "explanation": "血压低于100/60mmHg者应避免透析中进餐，以免腹部器官血流需求增加、血液在消化系统重新分布，从而诱发或加重低血压。"}, {"text": "可用于治疗透析中低血压的药物是（  ）", "options": ["A.硝苯地平", "B.米多君", "C.卡托普利", "D.氨氯地平", "E.缬沙坦"], "answer": "B", "explanation": "治疗透析中低血压的药物有米多君、加压素、多巴胺等；硝苯地平、卡托普利等含服用于透析中高血压的紧急处理。"}, {"text": "透析中发生低血压时，首先应采取的措施是（  ）", "options": ["A.采取头低位", "B.立即终止透析", "C.静脉推注多巴胺", "D.更换透析器", "E.快速输血"], "answer": "A", "explanation": "低血压的急性处理首先采取头低位，然后暂停超滤、调低血流量、吸氧、改善心功能，并补充生理盐水或高渗糖、白蛋白、低分子右旋糖酐溶液等。"}, {"text": "透析中低血压发作时患者常见的主诉是（  ）", "options": ["A.持续高热、寒战", "B.皮肤黄染、瘙痒", "C.皮下瘀点、瘀斑", "D.头痛、头晕、恶心、打哈欠、肌肉痉挛", "E.少尿、水肿"], "answer": "D", "explanation": "低血压患者主诉头痛、头晕、恶心、打哈欠、肌肉痉挛，可见黑蒙、反应迟钝；部分患者初始无症状，直到血压低至极限才发觉。"}, {"text": "血液透析中肌肉痛性痉挛的发生率为（  ）", "options": ["A.1%～5%", "B.5%～20%", "C.20%～30%", "D.30%～40%", "E.40%～50%"], "answer": "B", "explanation": "肌肉痉挛时伴有疼痛，称痛性痉挛，其发生率为5%～20%，一般发生在透析中、后期，持续几秒至数十秒。"}, {"text": "透析中肌肉痛性痉挛最常发生的部位是（  ）", "options": ["A.足部、双手指、腓肠肌和腹壁", "B.面颊和舌肌", "C.颈部和肩部", "D.腰背部和胸壁", "E.大腿前侧"], "answer": "A", "explanation": "肌肉痛性痉挛多见于足部、双手指、腓肠肌和腹壁，一般发生在透析中、后期。"}, {"text": "引起透析中肌肉痛性痉挛最常见的原因是（  ）", "options": ["A.低镁血症", "B.低钙血症", "C.低钾血症", "D.L-肉碱缺乏", "E.肌肉血流灌注降低"], "answer": "E", "explanation": "血液透析中低血压、低血容量、超滤速度过快及应用低钠透析液治疗等导致的肌肉血流灌注降低，是引起透析中肌肉痛性痉挛最常见的原因；低镁血症、低钙血症、低钾血症等电解质紊乱和酸碱失衡也可引起。"}, {"text": "透析中发生肌肉痉挛时，可输注等渗生理盐水（  ）", "options": ["A.50～100ml", "B.100～200ml", "C.200～300ml", "D.300～400ml", "E.400～500ml"], "answer": "B", "explanation": "肌肉痉挛的紧急处理包括停止超滤、降低血流速度、降低超滤量，输注等渗生理盐水100～200ml；高渗盐水、高渗糖、50%右旋糖酐、甘露醇也可有效缓解症状。"}, {"text": "血液透析导致的哪种物质丢失也可引起肌肉痛性痉挛（  ）", "options": ["A.L-肉碱", "B.白蛋白", "C.铁", "D.叶酸", "E.维生素B12"], "answer": "A", "explanation": "血液透析导致的L-肉碱丢失也可引起肌肉痛性痉挛；此外，低镁血症、低钙血症、低钾血症等电解质紊乱和酸碱失衡同样可以引起肌肉痉挛。"}, {"text": "尿毒症患者自主神经功能损害中受损最严重、导致心律失常发生阈值降低的是（  ）", "options": ["A.心迷走神经", "B.心交感神经", "C.舌咽神经", "D.三叉神经", "E.坐骨神经"], "answer": "A", "explanation": "心律失常与尿毒症本身导致的电解质紊乱、酸碱失衡及自主神经功能损害有关，其中以心迷走神经受损最严重，心律失常发生阈值降低。"}, {"text": "高血钾引起的心律失常，应给予的药物是（  ）", "options": ["A.10%氯化钾", "B.地高辛", "C.5%碳酸氢钠、葡萄糖酸钙、葡萄糖加胰岛素", "D.肾上腺素", "E.阿托品"], "answer": "C", "explanation": "高血钾引起的心律失常应紧急透析，并给予5%碳酸氢钠、葡萄糖酸钙、葡萄糖加胰岛素；必要时终止透析。"}, {"text": "反复发生严重心律失常且不能纠正的血液透析患者，宜改行（  ）", "options": ["A.腹膜透析", "B.血液灌流", "C.血液吸附", "D.单纯超滤", "E.每日短时透析"], "answer": "A", "explanation": "反复严重心律失常不能纠正者，改行腹膜透析；其余预防措施包括去除病因，纠正电解质、酸碱失衡，改善贫血和营养不良，避免过快、过多超滤。"}, {"text": "失衡综合征的临床特征是（  ）", "options": ["A.皮肤瘙痒及皮疹", "B.肝功能异常", "C.持续高热寒战", "D.血压持续升高", "E.脑电图异常及全身和神经系统症状"], "answer": "E", "explanation": "失衡综合征是指发生于透析中或透析后早期，以脑电图异常及全身和神经系统症状为特征的一组病症，轻者可表现为头痛、恶心、呕吐及躁动，重者出现抽搐、意识障碍甚至昏迷。"}, {"text": "失衡综合征的常见诱因是（  ）", "options": ["A.低钠透析、无糖透析", "B.高钠透析、含糖透析", "C.低温透析", "D.高钙透析", "E.低流量透析"], "answer": "A", "explanation": "失衡综合征的原因包括血液透析快速清除溶质致血浆渗透压下降、血液和脑组织液渗透压差增大使水向脑组织转移，引起颅内压增高、颅内pH改变；脑缺氧；以及低钠透析、无糖透析。"}, {"text": "失衡综合征轻症患者处理时，减慢血流速度的目的是（  ）", "options": ["A.减少超滤量", "B.减少溶质清除，减轻血浆渗透压和pH过度变化", "C.降低透析液温度", "D.提高透析液钠浓度", "E.增加血流量"], "answer": "B", "explanation": "轻症患者处理为减慢血流速度以减少溶质清除，减轻血浆渗透压和pH过度变化，并输注高张盐水或高渗葡萄糖；对伴肌肉痉挛者予相应对症处理，仍无缓解则提前终止透析。"}, {"text": "失衡综合征重症患者出现抽搐、意识障碍和昏迷时，应采取的措施是（  ）", "options": ["A.减慢血流速度继续透析", "B.加快血流速度", "C.增加超滤量", "D.立即终止透析并输注甘露醇", "E.口服止痛药后观察"], "answer": "D", "explanation": "重症患者出现抽搐、意识障碍和昏迷时应立即终止透析，排除脑血管意外，同时予输注甘露醇，并根据治疗反应予其它相应处理。"}, {"text": "失衡综合征引起的昏迷一般在多长时间内好转（  ）", "options": ["A.4小时内", "B.12小时内", "C.24小时内", "D.48小时内", "E.72小时内"], "answer": "C", "explanation": "失衡综合征引起的昏迷一般于24小时内好转。"}, {"text": "透析器反应包括的两种类型是（  ）", "options": ["A.过敏型（A型）和非特异型（B型）", "B.急性型和慢性型", "C.局部型和全身型", "D.早期型和晚期型", "E.感染型和免疫型"], "answer": "A", "explanation": "透析器反应包括过敏型（A型）和非特异型（B型）两种，过去这些反应常出现于使用新透析器时，故称首次使用综合征。"}, {"text": "透析器破膜时，透析机的表现是（  ）", "options": ["A.空气报警，静脉壶见气泡", "B.温度报警，透析液变冷", "C.漏血报警，透析液颜色变淡红", "D.电导报警，电导度下降", "E.跨膜压报警，压力为零"], "answer": "C", "explanation": "透析器破膜的症状为透析机漏血报警（Blood Leak），透析液颜色变淡红。"}, {"text": "透析器破膜后，判断可以回输血液的跨膜压（TMP）条件是（  ）", "options": ["A.TMP在0以上", "B.TMP等于0", "C.TMP在0以下", "D.TMP低于−50mmHg", "E.TMP高于100mmHg"], "answer": "A", "explanation": "破膜时是否回输血液应根据跨膜压的变化判断：如果TMP在0以上说明破膜较小，膜内仍为正压，透析液不会进入膜内，可回输血液；如果TMP在0或0以下说明破膜较大、有反超的危险，宁可废弃血液而不应还输给患者。"}, {"text": "透析器复用时应严格进行（  ）", "options": ["A.细菌培养", "B.热原检测", "C.血型鉴定", "D.压力衰减试验", "E.破膜试验"], "answer": "E", "explanation": "透析器复用时应严格进行破膜试验；透析前应仔细检查透析器，透析中严密监测跨膜压，避免出现过高跨膜压。"}, {"text": "致热源反应引起的发热多发生于透析后1～2小时，一般持续多久消退（  ）", "options": ["A.1小时内", "B.2～4小时", "C.6～8小时", "D.12小时", "E.24小时"], "answer": "B", "explanation": "致热源反应多发生于透析后1～2小时，表现为发热、寒战，体温38℃左右，也可超过39℃，持续2～4小时消退。"}, {"text": "提示透析后发热由感染引起而非致热源反应的表现是（  ）", "options": ["A.血白细胞及中性粒细胞升高，血培养可阳性", "B.血白细胞及中性粒细胞不高，血培养阴性", "C.体温38℃左右", "D.多发生于透析后1～2小时", "E.一般无需治疗，对症处理即可"], "answer": "A", "explanation": "感染引起的发热多发生于透析结束前或后，或透析后2～3天，体温39℃以上，血白细胞及中性粒细胞升高，血培养可阳性，应选用有效抗菌素并对症处理。"}, {"text": "透析患者发生出血时，用于中和体内肝素的是（  ）", "options": ["A.维生素K1", "B.鱼精蛋白", "C.氨甲环酸", "D.葡萄糖酸钙", "E.硫酸镁"], "answer": "B", "explanation": "出血时应立即终止血液透析，应用鱼精蛋白中和体内肝素，低分子肝素可以部分被鱼精蛋白中和。"}, {"text": "透析中发生急性溶血时，静脉管路的颜色呈（  ）", "options": ["A.鲜红色", "B.暗紫色", "C.乳白色", "D.葡萄酒色", "E.棕褐色"], "answer": "D", "explanation": "急性溶血时检查可见皮肤色素沉着加重，静脉管路颜色呈葡萄酒色，患者可有胸闷、心悸、心绞痛、气急、烦躁、腰痛、腹痛、发冷、寒战、低血压、心律失常等表现。"}, {"text": "透析中发生急性溶血时，对溶解血液的正确处理是（  ）", "options": ["A.因含高钾而丢弃，不能回输", "B.立即回输给患者", "C.加温后回输", "D.过滤后回输", "E.与生理盐水混合后回输"], "answer": "A", "explanation": "发生急性溶血应立即停止血泵，夹住血路导管，溶解的血因高钾丢弃，不能回输；明确原因后更换透析器、管路或透析机开始透析，并对症治疗高钾血症、低血压、脑水肿等。"}, {"text": "可引起透析中急性溶血的透析液相关因素是（  ）", "options": ["A.透析液温度过高", "B.透析液温度过低", "C.透析液钙浓度过低", "D.透析液流量过小", "E.透析液流量过大"], "answer": "A", "explanation": "透析液相关因素引起溶血的原因有透析液钠过低、透析液温度过高、透析液污染以及消毒剂、氯胺、漂白粉、铜、锌、甲醛、氟化物、过氧化氢、硝酸盐等；血路管狭窄或梗阻引起的红细胞机械性损伤也可致溶血。"}, {"text": "透析患者出现头痛的原因之一是（  ）", "options": ["A.长期吸烟", "B.长期饮酒", "C.长期素食", "D.长期饮浓茶", "E.长期饮用咖啡者透析中咖啡血浓度降低"], "answer": "E", "explanation": "头痛的常见原因有透析失衡综合征、严重高血压、脑血管意外等；长期饮用咖啡者由于透析中咖啡血浓度降低，也可出现头痛。"}, {"text": "血液透析中恶心、呕吐的常见原因是（  ）", "options": ["A.高钙血症", "B.低磷血症", "C.高钾血症", "D.透析失衡综合征", "E.贫血"], "answer": "D", "explanation": "恶心、呕吐的常见原因有透析器反应、糖尿病导致的胃轻瘫、透析失衡综合征、透析低血压、透析液受污染或电解质成份异常。"}, {"text": "空气进入体内即可引起死亡的最小量约为（  ）", "options": ["A.1毫升", "B.2毫升", "C.3毫升", "D.5毫升", "E.10毫升"], "answer": "D", "explanation": "5毫升空气进入体内即可引起死亡，取决于空气进入体内的速度、到达部位及患者的体位；小量可无症状，空气进入动脉可栓塞脑血管和冠状动脉，造成致命性损害。"}, {"text": "发生空气栓塞时，患者应采取的体位是（  ）", "options": ["A.左侧卧位头低脚高", "B.右侧卧位头高脚低", "C.平卧位", "D.半坐卧位", "E.俯卧位"], "answer": "A", "explanation": "发生空气栓塞时患者应取左侧卧位头低脚高，使空气积存在右心房顶端，切忌按摩心脏，并给予氧气吸入。"}, {"text": "空气栓塞处理中明确禁止的操作是（  ）", "options": ["A.立即夹闭静脉血路管", "B.按摩心脏", "C.停止血泵", "D.吸氧", "E.静脉应用地塞米松"], "answer": "B", "explanation": "空气栓塞处理包括嘱患者镇静、深呼吸，立即夹闭静脉血路管、停止血泵，左侧卧位头低脚高，切忌按摩心脏，给予氧气吸入及心肺支持，必要时行右心房或右心室穿刺抽气，静脉应用地塞米松、低分子右旋糖酐减轻脑水肿。"}, {"text": "预防空气栓塞最关键的操作要求是（  ）", "options": ["A.提高透析液温度", "B.增大超滤量", "C.加快血泵速度", "D.减少抗凝剂用量", "E.严禁空气回血"], "answer": "E", "explanation": "预防空气栓塞应严格操作规程操作，严禁空气回血；开始透析前细心检查血管通路、穿刺针、导管、透析器等连接部位，务必连接紧密；避免在透析管路上输液，如必须输液则派专人看护；透析过程中认真、按时巡视。"}, {"text": "为减轻尿毒症透析患者的皮肤瘙痒，应控制患者血清（  ）", "options": ["A.钠、钾和氯", "B.钙、磷和iPTH", "C.铁和转铁蛋白", "D.白蛋白和总蛋白", "E.血糖和糖化血红蛋白"], "answer": "B", "explanation": "皮肤瘙痒的处理包括对因采取预防手段和对症处理，控制患者血清钙、磷和iPTH，使用生物相容性好的透析器和管路，应用保湿护肤品保持皮肤湿度，穿全棉制品衣服，外用含镇痛剂的皮肤润滑油、抗组胺药物等。"}, {"text": "血液透析过程中发生的高血压，最广泛接受的概念是透析开始或进程中平均动脉压较透析前升高超过（  ）", "options": ["A.5mmHg", "B.10mmHg", "C.15mmHg", "D.20mmHg", "E.25mmHg"], "answer": "C", "explanation": "透析中高血压是指一部分血液透析患者在透析过程中平均动脉压较透析前不但没有下降反而升高，且不能随着超滤的增加得到有效改善；最广泛接受的概念是透析开始或进程中平均动脉压较透析前升高超过15mmHg。"}]}, {"type": "multiple", "questions": [{"text": "血液净化治疗急性并发症包括（  ）", "options": ["Ａ.低血压", "Ｂ.肌肉痉挛", "Ｃ.失衡综合征", "Ｄ.肾性骨病", "Ｅ.体外循环凝血"], "answer": "ABCE", "explanation": "血液净化治疗急性并发症包括低血压、高血压、肌肉痉挛、心律失常、失衡综合征、透析器反应、透析器破膜、发热、出血、溶血、头痛、空气栓塞、恶心呕吐、胸痛和背痛、皮肤瘙痒、体外循环凝血等；肾性骨病属于远期并发症。"}, {"text": "血液净化治疗的远期并发症包括（  ）", "options": ["Ａ.贫血", "Ｂ.空气栓塞", "Ｃ.透析相关淀粉样变", "Ｄ.继发性甲状旁腺功能亢进病变", "Ｅ.慢性炎症反应"], "answer": "ACDE", "explanation": "远期并发症包括贫血、心血管系统疾病、透析相关淀粉样变、继发性甲状旁腺功能亢进病变、慢性炎症反应、肾性骨病、心理问题；空气栓塞属于急性并发症。"}, {"text": "透析中低血压的患者自身因素有（  ）", "options": ["Ａ.高龄", "Ｂ.透析液钠离子浓度过低", "Ｃ.合并慢性疾病", "Ｄ.微炎状态及营养不良", "Ｅ.干体重不准确"], "answer": "ACDE", "explanation": "患者自身因素包括合并慢性疾病、高龄、透析中进食、微炎状态及营养不良、干体重不准确；透析液钠离子浓度过低属于透析相关因素。"}, {"text": "透析中低血压的透析相关因素有（  ）", "options": ["Ａ.高龄", "Ｂ.超滤率过大", "Ｃ.透析液钠离子浓度过低", "Ｄ.透析液钙离子浓度过低", "Ｅ.透析液温度过高"], "answer": "BCDE", "explanation": "透析相关因素包括超滤率过大、透析液钠离子浓度过低、透析液钙离子浓度过低、透析液温度过高以及透析膜的生物相容性和过敏毒素等；高龄属于患者自身因素。"}, {"text": "透析中低血压的防治策略包括（  ）", "options": ["Ａ.密切监测血压", "Ｂ.透析中随意进餐", "Ｃ.准确评估干体重", "Ｄ.调节透析液钠浓度", "Ｅ.采用低温透析"], "answer": "ACDE", "explanation": "防治策略包括密切监测血压以及时发现低血压先兆、准确评估干体重、改善营养纠正贫血、调节透析液钠浓度、个性化超滤曲线、调节透析液钙浓度、采用低温透析、治疗前合理安排降压药、输注高渗糖或琥珀酰明胶、补充复方氨基酸、避免透析中进餐以及药物治疗等；透析中进食会显著增加低血压发生，不应随意进餐。"}, {"text": "透析中高血压的常见原因有（  ）", "options": ["Ａ.干体重设定过低", "Ｂ.透析液Na浓度过高", "Ｃ.失衡综合征脑水肿发生", "Ｄ.超滤过度引起肾素分泌过高", "Ｅ.患者精神紧张、焦虑"], "answer": "BCDE", "explanation": "常见原因有透析液Na浓度过高、失衡综合征脑水肿发生、超滤过度引起肾素分泌过高、患者精神紧张焦虑、透析水处理故障造成硬水综合征、红细胞生成素应用贫血纠正后、透析对降压药物的清除、透析液温度过低等；干体重设定过低是透析中肌肉痉挛的诱因。"}, {"text": "透析中高血压的紧急处理措施有（  ）", "options": ["Ａ.含服硝苯地平", "Ｂ.采用高钠透析液", "Ｃ.含服卡托普利", "Ｄ.严重者硝酸甘油微量泵入", "Ｅ.避免迅速和过度超滤，进行较慢和较长时间的透析"], "answer": "ACDE", "explanation": "紧急处理包括含服硝苯地平、卡托普利等，对严重高血压者可用硝酸甘油微量泵入，避免迅速和过度超滤并采用较慢、较长时间的透析，调整透析液钠浓度并采用低钠透析液，调整红细胞生成素用量；采用高钠透析液会升高血压，故不正确。"}, {"text": "透析中肌肉痛性痉挛的常见原因有（  ）", "options": ["Ａ.长期应用高钠透析液", "Ｂ.低血压、低血容量", "Ｃ.超滤速度过快", "Ｄ.应用低钠透析液", "Ｅ.低镁血症、低钙血症、低钾血症"], "answer": "BCDE", "explanation": "低血压、低血容量、超滤速度过快及应用低钠透析液治疗等导致的肌肉血流灌注降低是最常见的原因，L-肉碱丢失以及低镁、低钙、低钾等电解质紊乱和酸碱失衡也可引起；高钠透析或序贯钠浓度透析是预防肌肉痉挛的措施，不是其发生原因。"}, {"text": "透析中肌肉痉挛的紧急处理措施有（  ）", "options": ["Ａ.加快血流量以缩短透析时间", "Ｂ.停止超滤，降低血流速度", "Ｃ.输注等渗生理盐水100～200ml", "Ｄ.输注高渗盐水、高渗糖或甘露醇", "Ｅ.对痉挛肌肉进行挤压按摩"], "answer": "BCDE", "explanation": "紧急处理包括停止超滤、降低血流速度和超滤量，输注等渗生理盐水100～200ml，输注高渗盐水、高渗糖、50%右旋糖酐或甘露醇，对痉挛肌肉进行挤压按摩；仍无缓解者遵医嘱停止治疗，并测量干体重、检测电解质。加快血流量会加重症状，处理上应降低血流速度。"}, {"text": "透析中心律失常的预防措施有（  ）", "options": ["Ａ.去除病因，纠正电解质、酸碱失衡", "Ｂ.反复严重心律失常者继续坚持血液透析", "Ｃ.改善贫血和营养不良", "Ｄ.避免过快、过多超滤", "Ｅ.避免透析中发生低血压、高血压"], "answer": "ACDE", "explanation": "预防措施包括去除病因，纠正电解质、酸碱失衡，改善贫血和营养不良以加强冠状动脉供血及心肌营养，血液透析中避免过快、过多超滤，防止血流动力学过大变化，避免低血压、高血压；反复严重心律失常不能纠正者应改行腹膜透析，而不是继续坚持血液透析。"}, {"text": "失衡综合征的常见原因有（  ）", "options": ["Ａ.高钠透析", "Ｂ.快速清除溶质致血浆渗透压下降", "Ｃ.血液和脑组织液渗透压差增大，水向脑组织转移", "Ｄ.脑缺氧", "Ｅ.低钠透析"], "answer": "BCDE", "explanation": "失衡综合征的原因包括血液透析快速清除溶质，导致外周血液溶质浓度快速下降、血浆渗透压下降，血液和脑组织液渗透压差增大、水向脑组织转移，引起颅内压增高和颅内pH改变，还包括脑缺氧以及低钠透析、无糖透析；高钠透析不是其诱因。"}, {"text": "关于透析器反应，正确的有（  ）", "options": ["Ａ.包括过敏型（A型）", "Ｂ.仅发生于透析器复用后", "Ｃ.包括非特异型（B型）", "Ｄ.过去常出现于使用新透析器时", "Ｅ.曾称为首次使用综合征"], "answer": "ACDE", "explanation": "透析器反应包括过敏型（A型）和非特异型（B型）两种，过去这些反应常出现于使用新透析器时，故称首次使用综合征，目前统称为透析器反应；透析器反应并非仅发生于复用之后。"}, {"text": "透析器破膜的紧急处理及预防措施有（  ）", "options": ["Ａ.立即夹闭透析管路的动脉端和静脉端", "Ｂ.继续使用原透析器完成本次治疗", "Ｃ.丢弃体外循环血液", "Ｄ.更换新的透析器和透析管路", "Ｅ.透析中严密监测跨膜压，避免出现过高跨膜压"], "answer": "ACDE", "explanation": "破膜后应立即夹闭透析管路的动脉端和静脉端，丢弃体外循环血液，更换新的透析器和透析管路，严密监测生命体征、症状和体征，一旦出现发热、溶血等表现采取相应处理；透析中应严密监测跨膜压、避免过高跨膜压，漏血报警等装置定期检测，透析器复用时应严格进行破膜试验。继续使用原透析器不正确。"}, {"text": "透析中发热的常见原因有（  ）", "options": ["Ａ.致热源反应", "Ｂ.低钠透析", "Ｃ.感染", "Ｄ.急性溶血", "Ｅ.高温透析"], "answer": "ACDE", "explanation": "透析中发热的常见原因有致热源反应（透析管路、透析器复用过程消毒不严格，透析液污染、透析供水管路污染等）、感染（无菌操作不严格，感染或原有感染透析后扩散）以及急性溶血、高温透析等；低钠透析不属于发热的原因。"}, {"text": "透析患者出血的常见原因有（  ）", "options": ["Ａ.尿毒症患者血小板功能障碍、凝血因子异常", "Ｂ.透析中血小板计数升高", "Ｃ.尿毒症患者毛细血管通透性异常", "Ｄ.长期使用肝素，或肝素过量", "Ｅ.患者血管硬化弹性下降"], "answer": "ACDE", "explanation": "出血的常见原因有尿毒症患者血小板功能障碍、凝血因子异常，毛细血管通透性异常，长期使用肝素或肝素过量，以及患者血管硬化弹性下降；处理时应根据不同出血部位实施相应措施，并立即终止血液透析，应用鱼精蛋白中和体内肝素。血小板计数升高不是出血的原因。"}, {"text": "透析中急性溶血的常见原因有（  ）", "options": ["Ａ.血路管狭窄或梗阻引起红细胞机械性损伤", "Ｂ.透析液钙浓度过低", "Ｃ.透析液钠过低", "Ｄ.透析液温度过高", "Ｅ.透析液污染"], "answer": "ACDE", "explanation": "溶血原因包括血路管相关因素（狭窄或梗阻等引起的红细胞机械性损伤）、透析液相关因素（透析液钠过低、透析液温度过高、透析液污染以及消毒剂、氯胺、漂白粉、铜、锌、甲醛、氟化物、过氧化氢、硝酸盐等）以及透析中错误输血；透析液钙浓度过低是引起低血压的原因，不是溶血的原因。"}, {"text": "空气栓塞的常见原因有（  ）", "options": ["Ａ.忘记预冲透析器及回路", "Ｂ.透析液温度过低", "Ｃ.管道连接不严", "Ｄ.用空气回血操作失误", "Ｅ.设备故障"], "answer": "ACDE", "explanation": "空气栓塞的常见原因有忘记预冲透析器及回路、管道连接不严、动脉补液时液体输完未及时夹住、用空气回血操作失误、冷的透析用水经加温后空气释出并通过透析膜进入血液、设备故障、静脉检测器污染或与静脉壶接触不紧密以及违规操作；透析液温度过低不是空气栓塞的原因。"}, {"text": "发生空气栓塞的处理措施有（  ）", "options": ["Ａ.立即夹闭静脉血路管、停止血泵", "Ｂ.取右侧卧位并按摩心脏", "Ｃ.患者左侧卧位头低脚高", "Ｄ.给予氧气吸入", "Ｅ.切忌按摩心脏"], "answer": "ACDE", "explanation": "处理包括嘱患者镇静并进行深呼吸，立即夹闭静脉血路管、停止血泵，患者取左侧卧位头低脚高使空气积存在右心房顶端并切忌按摩心脏，给予氧气吸入，必要时心肺支持、右心房或右心室穿刺抽气，并静脉应用地塞米松、低分子右旋糖酐减轻脑水肿、改善微循环。右侧卧位并按摩心脏会加重栓塞，绝对禁止。"}, {"text": "体外循环凝血的征象有（  ）", "options": ["Ａ.管路血液较原来颜色加深", "Ｂ.透析液颜色变淡红", "Ｃ.透析器变花，出现线条或阴影", "Ｄ.动、静脉滴壶出现泡沫、分层、血凝块形成", "Ｅ.动静脉壶中血液起伏弧度大"], "answer": "ACDE", "explanation": "体外循环凝血的征象有管路血液较原来颜色加深、透析器变花并出现线条或阴影、动静脉滴壶出现泡沫分层及血凝块形成、动静脉壶中血液起伏弧度大、血液迅速充满传感监测器；透析液颜色变淡红是透析器破膜的表现。"}, {"text": "透析液异常的临床表现有（  ）", "options": ["Ａ.高钠导致细胞内脱水、干咳、头痛", "Ｂ.低钾导致硬水综合征", "Ｃ.低钠导致急性溶血、血液呈葡萄酒色", "Ｄ.高钾导致心前区不适、心电图高尖T波", "Ｅ.高钙高镁导致硬水综合征"], "answer": "ACDE", "explanation": "高钠使血浆渗透压增高、细胞内脱水，患者出现干咳、头痛、恶心、呕吐、痉挛；低钠使血浆渗透压下降（低于120mOsm），导致急性溶血、头痛、恶心、呕吐、胸闷，血液变成葡萄酒色；高钾表现为心前区不适、心率减慢、血压下降、四肢麻木、心电图高尖T波、心律失常；高钙、高镁表现为硬水综合征，有恶心、呕吐、痉挛、全身烧灼感、血压升高、头痛、嗜睡。硬水综合征由高钙、高镁引起，与低钾无关。"}]}, {"type": "short", "questions": [{"text": "简述血液净化治疗并发症的分类，并分别列举急性并发症与远期并发症。", "options": [], "answer": "【分类】血液净化治疗并发症分为急性并发症和远期并发症两大类。【急性并发症（16项）】低血压、高血压、肌肉痉挛、心律失常、失衡综合征、透析器反应、透析器破膜、发热、出血、溶血、头痛、空气栓塞、恶心呕吐、胸痛和背痛、皮肤瘙痒、体外循环凝血。【远期并发症（7项）】贫血、心血管系统疾病、透析相关淀粉样变、继发性甲状旁腺功能亢进病变、慢性炎症反应、肾性骨病、心理问题。", "explanation": "由于血液透析的复杂性以及技术发展的局限，血液净化治疗过程中很有可能出现很多意外，这些在治疗中或治疗后出现的急性并发症统称为血液净化治疗急性并发症；它们通常非致命，但部分并发症仍可严重影响患者的预后并威胁生命，临床医务工作者应对其发生原因、症状体征有系统的了解，并知道如何做出正确的处理及预防。"}, {"text": "简述血液透析中低血压的防治策略。", "options": [], "answer": "①密切监测血压，及时发现低血压先兆；②准确评估干体重；③改善营养、纠正贫血；④调节透析液钠浓度，可将钠浓度增加至145mmol/L并防止高钠血症，必要时采用序贯钠透析；⑤个性化超滤曲线；⑥调节透析液钙浓度；⑦采用低温透析，透析液温度35℃～36℃；⑧治疗前合理安排降压药的服用；⑨输注高渗糖、琥珀酰明胶或白蛋白以提高胶体渗透压；⑩补充复方氨基酸；⑪避免透析中进餐，确需进餐者应选在血透开始1～2小时内，血压低于100/60mmHg者应避免进餐；⑫药物治疗可选用米多君、加压素、多巴胺等，并注意改变血液净化模式、做好机器维护和管路连接紧密无渗漏。", "explanation": "低血压急性发作时先采取头低位，暂停超滤、调低血流量、吸氧、改善心功能，补充生理盐水或高渗糖、白蛋白、低分子右旋糖酐溶液；处理后血压好转者逐步恢复超滤并密切监测血压变化，无好转者再次扩容治疗、减慢血流速度并立即寻找可纠正的诱因；症状严重者应停止透析。对初次血透、年老体弱病人可选用生物相容性好的小面积透析器、适当预充，血透应缓慢进行，血流量由小到大逐步增加，脱水不宜过多、过快。"}, {"text": "简述透析器破膜的临床表现、处理及预防要点。", "options": [], "answer": "【临床表现】透析机漏血报警（Blood Leak），透析液颜色变淡红。【紧急处理】立即夹闭透析管路的动脉端和静脉端，丢弃体外循环血液；更换新的透析器和透析管路；严密监测患者生命体征及症状、体征，一旦出现发热、溶血等表现应采取相应处理措施；发生破膜应立即下机后进行机器消毒，消毒后的机器方可再次使用。【是否回输血液】破膜较小、TMP在0以上时膜内仍为正压，透析液不会进入膜内，可回输血液；TMP在0或0以下说明破膜较大、有反超的危险，宁可废弃血液也不应还输给患者。【预防】透析前仔细检查透析器；透析中严密监测跨膜压，避免出现过高跨膜压；漏血报警等装置应定期检测，避免发生故障；透析器复用时应严格进行破膜试验。", "explanation": "破膜是血液净化治疗的急性并发症之一，其核心风险在于破膜较大时发生反超，使透析液进入血液；因此是否回输血液必须依据跨膜压（TMP）的变化来判断，不能一概回输或一概丢弃。处理完成后还需对机器进行消毒，避免污染影响后续治疗。"}, {"text": "简述体外循环凝血的征象与处理方法。", "options": [], "answer": "【征象】①管路血液较原来颜色加深；②透析器变花，出现线条或阴影；③动、静脉滴壶出现泡沫、分层、血凝块形成；④动静脉壶中血液起伏弧度大；⑤血液迅速充满传感监测器。【处理】轻度凝血常可通过追加抗凝剂用量、调高血流速度解决，治疗中严密监测体外循环凝血变化，一旦凝血程度加重应立即回血；当透析器或管路达到Ⅲ度凝血时，应在不停血泵的情况下立刻打开动脉管路上的补液通路回输生理盐水，停止引血，并将血泵速度逐渐降至100ml/min，更换透析器和管路。重度凝血常需立即回血，如凝血重而不能回血，则建议直接丢弃体外循环管路和透析器，不主张强行回血，以免凝血块进入体内发生栓塞事件；如继续治疗，可更换透析器或血管通路后继续治疗。【预防】保持良好的血流量；严密监测生命体征及参数；治疗过程中禁止输血和脂肪乳；抗凝剂正确使用；提高预冲质量，治疗前给予500U/dl（4mg/dl）的肝素生理盐水预冲、保留灌注管路和透析器/滤器20min后，再给予生理盐水500ml冲洗，存在肝素类药物禁忌的患者仅用生理盐水充分冲洗；透析前确保预冲质量、排尽空气，防止空气进入体外循环通路，保证连续充分的血流量，避免不必要的机器报警和血泵停转。【记录】下机时需评估患者透析器及管路凝血情况并记录。", "explanation": "凝血发生常与不用抗凝剂或抗凝剂用量不足有关，寻找体外循环发生凝血的原因，是预防以后再次发生及调整抗凝剂用量的重要依据。体外循环发生凝血是一个激链的过程，任何细小的血丝、小的凝血块、动静脉壶气血液面及小气泡等都可能导致凝血；用生理盐水冲洗的目的是观察管路和透析器有无凝血现象，冲洗结束恢复血流量时，应按生理盐水冲洗量调整超滤量。"}, {"text": "简述空气栓塞的临床表现、处理与预防。", "options": [], "answer": "【临床表现】急性呼吸困难、咳嗽、胸痛、胸闷、气喘和发绀，重者出现抽搐、昏迷、死亡；5毫升空气进入体内即可引起死亡，取决于空气进入体内的速度、到达部位及患者的体位；小量空气可无症状，空气进入动脉可栓塞脑血管和冠状动脉，造成致命性损害。【处理】①嘱患者镇静、进行深呼吸；②立即夹闭静脉血路管，停止血泵；③患者左侧卧位头低脚高，使空气积存在右心房顶端，切忌按摩心脏，给予氧气吸入；④心肺支持，包括吸纯氧，采用面罩或气管插管；⑤如空气量较多，有条件者可予右心房或右心室穿刺抽气；⑥静脉应用地塞米松、低分子右旋糖酐，减轻脑水肿、改善微循环。【预防】严格操作规程操作，严禁空气回血；开始透析前细心检查血管通路、穿刺针、导管、透析器等连接部位，务必连接紧密；避免在透析管路上输液，如必须输液则派专人看护；做好新工作人员的培训，熟悉掌握各种操作；透析过程中认真、按时巡视。", "explanation": "空气进入体内引起血管栓塞称为空气栓塞，常引起致命性危险，是严重的透析事故，治疗困难、预后差，预防是关键。常见原因包括忘记预冲透析器及回路、管道连接不严、动脉补液时液体输完未及时夹住、用空气回血操作失误、冷的透析用水加温后空气释出并通过透析膜进入血液、设备故障、静脉检测器污染或与静脉壶接触不紧密以及违规操作等。"}]}]}, {"num": 18, "title": "腹膜透析概述理论考试题库", "sections": [{"type": "single", "questions": [{"text": "腹膜被覆于腹壁、盆腔壁内表面以及腹腔、盆腔脏器表面，其总面积约为（  ）", "options": ["A.12000cm²", "B.18000cm²", "C.22000cm²", "D.26000cm²", "E.30000cm²"], "answer": "C", "explanation": "腹膜总面积达22000cm²，约与人体表面积相等，是人体面积最大、分布最复杂的浆膜囊。"}, {"text": "腹膜壁层所获得的血供约占腹膜总血供的（  ）", "options": ["A.10%", "B.20%", "C.40%", "D.60%", "E.80%"], "answer": "B", "explanation": "腹膜壁层血供占腹膜总血供的20%，腹膜脏层血供占80%。"}, {"text": "腹膜壁层的静脉血液回流至（  ）", "options": ["A.门静脉", "B.下腔静脉", "C.上腔静脉", "D.肺静脉", "E.髂内静脉"], "answer": "B", "explanation": "腹膜壁层静脉引流至下腔静脉，而腹膜脏层静脉引流入门静脉。"}, {"text": "腹膜壁层的血液供应来源于（  ）", "options": ["A.各内脏器官的动脉", "B.腹壁和盆壁的体壁动脉", "C.肠系膜上动脉", "D.脾动脉", "E.肾动脉"], "answer": "B", "explanation": "腹膜壁层血液供应来自腹壁和盆壁的体壁动脉，腹膜脏层血液供应则来自各内脏器官的动脉。"}, {"text": "腹膜间皮细胞腔面覆盖的微绒毛可使腹膜的表面积增大（  ）", "options": ["A.4倍", "B.10倍", "C.20倍", "D.40倍", "E.80倍"], "answer": "D", "explanation": "间皮细胞腔面覆盖微绒毛，使腹膜的表面积增大40倍。"}, {"text": "腹膜超微结构中起主要作用的细胞成分是（  ）", "options": ["A.内皮细胞", "B.成纤维细胞", "C.间皮细胞", "D.巨噬细胞", "E.肥大细胞"], "answer": "C", "explanation": "间皮细胞是腹膜超微结构的主要成分，其腔面覆盖微绒毛。"}, {"text": "间皮细胞横切面细胞连接呈斜行瓦片样重叠排列，其深部为（  ）", "options": ["A.紧密连接", "B.缝隙连接", "C.细胞桥粒", "D.半桥粒", "E.中间连接"], "answer": "C", "explanation": "间皮细胞横切面细胞连接呈斜行瓦片样重叠排列，其深部为细胞桥粒。"}, {"text": "腹膜孔是由立方形间皮细胞边缘发出的哪种结构构成的（  ）", "options": ["A.纤毛", "B.微绒毛", "C.指状胞质突起", "D.细胞桥粒", "E.基膜"], "answer": "C", "explanation": "立方形间皮细胞边缘发出数个指状胞质突起，构成腹膜孔。"}, {"text": "从生理特性上看，腹膜属于（  ）", "options": ["A.完全不通透膜", "B.半通透性膜", "C.主动转运膜", "D.无通透性屏障", "E.选择性全通透膜"], "answer": "B", "explanation": "腹膜是一种半通透性膜，腹腔内灌入腹透液后可通过腹膜进行溶质的弥散和渗透。"}, {"text": "腹膜透析时，腹膜血管内血液与腹膜透析液之间产生（  ）", "options": ["A.稳定的单向转运", "B.动态平衡", "C.永久性渗透梯度", "D.完全隔绝状态", "E.滤过停止状态"], "answer": "B", "explanation": "腹膜透析时腹膜血管内血液和腹膜透析液之间产生动态平衡。"}, {"text": "腹膜透析的英文缩写是（  ）", "options": ["A.HD", "B.PD", "C.CRRT", "D.HP", "E.CVVH"], "answer": "B", "explanation": "腹膜透析的英文缩写为PD（peritoneal dialysis）。"}, {"text": "腹膜透析是利用什么作为半透膜进行治疗的技术（  ）", "options": ["A.腹膜", "B.肾小球", "C.透析器", "D.血浆", "E.肠黏膜"], "answer": "A", "explanation": "腹膜透析是利用腹膜作为半透膜，向腹腔内注入腹膜透析液进行治疗的技术。"}, {"text": "腹膜透析清除体内潴留的代谢产物和过多水分所借助的原理是（  ）", "options": ["A.弥散、对流和超滤", "B.滤过和重吸收", "C.主动转运和胞饮", "D.吸附和免疫清除", "E.分泌和排泄"], "answer": "A", "explanation": "腹膜透析借助溶质浓度梯度和渗透梯度，通过弥散、对流和超滤的原理清除代谢产物和过多水分。"}, {"text": "腹膜透析时溶质转运的基本方式是（  ）", "options": ["A.滤过和吸附", "B.弥散和对流", "C.主动转运和胞饮", "D.重吸收和分泌", "E.渗透和超滤"], "answer": "B", "explanation": "腹膜透析时溶质可在毛细血管内血液与腹腔内腹透液之间进行双向转运，基本方式是弥散和对流。"}, {"text": "BUN、CR等代谢废物由血液进入透析液内的作用称为（  ）", "options": ["A.超滤", "B.对流", "C.弥散", "D.吸附", "E.滤过"], "answer": "C", "explanation": "代谢废物从浓度高的血液中弥散至浓度低的透析液内，此作用称为弥散。"}, {"text": "溶质弥散速度主要受腹膜两侧的浓度差及其哪一因素影响（  ）", "options": ["A.分子量", "B.温度", "C.pH", "D.电荷", "E.黏度"], "answer": "A", "explanation": "溶质弥散速度受腹膜两侧的浓度差及其分子量的影响。"}, {"text": "当透析液中某物质的浓度高于血液时，该物质（  ）", "options": ["A.不能进入血液", "B.可通过弥散进入血液", "C.只能被超滤清除", "D.被完全阻止移动", "E.仅通过对流进入血液"], "answer": "B", "explanation": "透析液中浓度高者也可通过弥散进入血内，故腹膜透析时溶质可双向转运。"}, {"text": "经过一定时间透析后，病人血中的可透过溶质会（  ）", "options": ["A.完全消失", "B.显著高于透析液", "C.与透析液内的水平接近", "D.恒定不变", "E.持续升高"], "answer": "C", "explanation": "经过一定时间的透析后，病人血中的可透过溶质会与透析液内的水平接近。"}, {"text": "腹膜透析超滤是指（  ）", "options": ["A.清除血中代谢废物", "B.清除血液内多余水分", "C.补充血中电解质", "D.提高血浆蛋白", "E.降低血糖"], "answer": "B", "explanation": "腹膜透析超滤是指通过在腹透液中添加有渗透性的物质形成跨膜渗透压差，从而清除血液内多余水分的过程。"}, {"text": "腹膜透析超滤主要依靠透析液与血液之间的（  ）", "options": ["A.浓度差", "B.渗透压梯度", "C.电荷差", "D.温度差", "E.pH差"], "answer": "B", "explanation": "腹膜透析超滤主要是依靠透析液和血液的渗透压相差的梯度而将血内的水分抽出来。"}, {"text": "腹膜透析液渗透压的高低主要取决于溶液内的（  ）", "options": ["A.溶质", "B.水分", "C.气体", "D.压力", "E.温度"], "answer": "A", "explanation": "渗透压的高低主要由溶液内的溶质决定，如电解质、葡萄糖和尿素氮等。"}, {"text": "腹膜透析中葡萄糖发挥超滤作用主要受哪两项因素影响（  ）", "options": ["A.葡萄糖浓度和时间", "B.温度和pH", "C.压力与电荷", "D.分子量与电荷", "E.渗透剂颜色与温度"], "answer": "A", "explanation": "葡萄糖能吸引液体使多余水分流进透析液，此即超滤，受葡萄糖浓度和时间影响。"}, {"text": "腹膜透析过程中，通常经过多长时间后代谢废物及多余水分停止向透析液移动（  ）", "options": ["A.1至2小时", "B.2至3小时", "C.4至6小时", "D.8至10小时", "E.12小时以上"], "answer": "C", "explanation": "4至6小时之后，代谢废物及多余的水分会停止移动至透析液中，此时须流出旧透析液并灌入新透析液。"}, {"text": "当透析液中的浓度相当于血液中的浓度时，水分和代谢废物（  ）", "options": ["A.加速移动", "B.反向移动", "C.不会再移动", "D.被全部清除", "E.持续大量移动"], "answer": "C", "explanation": "当透析液中的浓度相当于血液中的浓度时，水分和代谢废物则不会再移动；注入新鲜透析液后废物和多余水分又会再度移动。"}, {"text": "腹膜透析过程中需要流出旧透析液并灌入新透析液，其原因是（  ）", "options": ["A.透析液温度下降", "B.废物与水分已停止移动", "C.腹膜发生破裂", "D.患者血糖升高", "E.腹膜血流量下降"], "answer": "B", "explanation": "4至6小时后代谢废物及多余水分停止移动至透析液中，因此须流出旧透析液并灌入另一袋新透析液。"}, {"text": "腹膜结构和功能改变可引起腹膜超滤下降，当超滤功能下降达到一定程度则出现（  ）", "options": ["A.腹膜硬化", "B.腹膜超滤衰竭", "C.腹膜炎", "D.腹膜渗漏", "E.腹膜疝"], "answer": "B", "explanation": "腹膜结构和功能的改变可引起腹膜超滤下降，当超滤功能下降达到一定程度则出现腹膜超滤衰竭。"}, {"text": "腹膜透析液除要求无菌、无毒、无致热源外，还应与人体有很好的（  ）", "options": ["A.生物相容性", "B.粘稠度", "C.着色度", "D.导电性", "E.挥发性"], "answer": "A", "explanation": "腹膜透析液应与人体有非常好的生物相容性，才能维持腹膜较好的通透性并长期保持良好的透析效能。"}, {"text": "一般腹膜透析液中电解质成分及浓度要求与下列哪一项相似（  ）", "options": ["A.正常人血浆", "B.生理盐水", "C.葡萄糖注射液", "D.血液制品", "E.组织培养液"], "answer": "A", "explanation": "一般腹膜透析液的电解质成分及浓度与正常人血浆相似。"}, {"text": "腹膜透析液中含一定量缓冲剂，其作用是（  ）", "options": ["A.纠正机体代谢性酸中毒", "B.升高血糖", "C.降低血压", "D.提高血红蛋白", "E.降低血钾"], "answer": "A", "explanation": "腹膜透析液含一定量的缓冲剂，可纠正机体代谢性酸中毒。"}, {"text": "对一般腹膜透析液渗透压的要求是（  ）", "options": ["A.低于正常人血浆渗透压", "B.等于或高于正常人血浆渗透压", "C.等于纯水的渗透压", "D.接近尿液渗透压", "E.等于细胞内液渗透压"], "answer": "B", "explanation": "一般腹膜透析液的渗透压等于或高于正常人血浆渗透压。"}, {"text": "关于一般腹膜透析液的含钾情况，正确的是（  ）", "options": ["A.含高浓度钾", "B.一般不含钾，用前可按需添加氯化钾", "C.含固定浓度钾", "D.含钾量与血浆相同", "E.完全禁止添加氯化钾"], "answer": "B", "explanation": "一般腹膜透析液不含钾，用前可根据患者血清钾离子水平添加适量氯化钾。"}, {"text": "理想腹膜透析液要求pH在生理范围内、等渗，并使用哪种缓冲剂（  ）", "options": ["A.盐酸碳酸盐", "B.碳酸盐", "C.氢氧化钠", "D.乳酸钠", "E.柠檬酸盐"], "answer": "B", "explanation": "理想腹膜透析液要求pH在生理范围内、等渗、使用碳酸盐缓冲剂。"}, {"text": "腹膜透析液中晶体渗透剂的特点是（  ）", "options": ["A.分子量大，不易被吸收", "B.分子量小、被吸收快，作用时间短", "C.分子量大，作用时间长", "D.不被吸收，作用持久", "E.分子量小且作用时间长"], "answer": "B", "explanation": "晶体渗透剂分子量小、易被毛细血管吸收，作用时间短。"}, {"text": "腹膜透析液中胶体渗透剂的特点是（  ）", "options": ["A.分子量小，作用时间短", "B.分子量大，不易被吸收，作用时间长", "C.分子量小，易被吸收", "D.不被吸收但作用时间短", "E.与晶体渗透剂作用完全相同"], "answer": "B", "explanation": "胶体渗透剂分子量大、不易被吸收，作用时间长，如艾考糊精。"}, {"text": "腹膜透析液中乳酸盐、碳酸氢盐等缓冲液的主要作用是（  ）", "options": ["A.纠正电解质紊乱", "B.维持患者酸碱平衡", "C.调节腹透液pH", "D.提供渗透梯度", "E.产生超滤作用"], "answer": "B", "explanation": "缓冲液在透析过程中维持患者酸碱平衡；纠正电解质紊乱是电解质的作用，调节pH是pH调节剂的作用。"}, {"text": "葡萄糖作为腹膜透析液渗透剂的分子量约为（  ）", "options": ["A.60道尔顿", "B.180道尔顿", "C.1000道尔顿", "D.13000道尔顿", "E.19000道尔顿"], "answer": "B", "explanation": "葡萄糖渗透剂的分子量为180道尔顿；13000~19000道尔顿是艾考糊精的分子量范围。"}, {"text": "艾考糊精的平均分子量范围约为（  ）", "options": ["A.180~500道尔顿", "B.1000~3000道尔顿", "C.13000~19000道尔顿", "D.30000~50000道尔顿", "E.大于60000道尔顿"], "answer": "C", "explanation": "艾考糊精为葡萄糖聚合物，重均分子量为13000~19000道尔顿。"}, {"text": "1.5%葡萄糖腹膜透析液的渗透压约为（  ）", "options": ["A.296mOsm/L", "B.346mOsm/L", "C.396mOsm/L", "D.485mOsm/L", "E.550mOsm/L"], "answer": "B", "explanation": "每100ml含1.5g葡萄糖的腹膜透析液渗透压为346mOsm/L。"}, {"text": "2.5%葡萄糖腹膜透析液的渗透压约为（  ）", "options": ["A.346mOsm/L", "B.396mOsm/L", "C.446mOsm/L", "D.485mOsm/L", "E.520mOsm/L"], "answer": "B", "explanation": "每100ml含2.5g葡萄糖的腹膜透析液渗透压为396mOsm/L。"}, {"text": "4.25%葡萄糖腹膜透析液的渗透压约为（  ）", "options": ["A.346mOsm/L", "B.396mOsm/L", "C.440mOsm/L", "D.485mOsm/L", "E.560mOsm/L"], "answer": "D", "explanation": "每100ml含4.25g葡萄糖的腹膜透析液渗透压为485mOsm/L。"}, {"text": "每100ml葡萄糖腹膜透析液的pH为（  ）", "options": ["A.4.0", "B.5.2", "C.6.0", "D.7.0", "E.7.4"], "answer": "B", "explanation": "葡萄糖腹膜透析液的pH为5.2，1.5%、2.5%和4.25%三种浓度均如此。"}, {"text": "腹膜透析液中钠离子的浓度范围是（  ）", "options": ["A.95~102mmol/L", "B.132~141mmol/L", "C.1.25~2.5mmol/L", "D.0.25~0.75mmol/L", "E.35~40mmol/L"], "answer": "B", "explanation": "腹膜透析液中钠离子浓度为132~141mmol/L。"}, {"text": "腹膜透析液中钙离子的浓度范围是（  ）", "options": ["A.35~40mmol/L", "B.1.25~2.5mmol/L", "C.132~141mmol/L", "D.95~102mmol/L", "E.0.25~0.75mmol/L"], "answer": "B", "explanation": "腹膜透析液中钙离子浓度为1.25~2.5mmol/L。"}, {"text": "腹膜透析液中 acetate 醋酸根/乳酸根/碳酸氢根的总浓度范围是（  ）", "options": ["A.95~102mmol/L", "B.132~141mmol/L", "C.1.25~2.5mmol/L", "D.35~40mmol/L", "E.0.25~0.75mmol/L"], "answer": "D", "explanation": "腹膜透析液中醋酸根/乳酸根/碳酸氢根的总浓度为35~40mmol/L。"}, {"text": "持续非卧床腹膜透析(CAPD)一般每天交换透析液的次数为（  ）", "options": ["A.6~8次", "B.3~5次", "C.1~2次", "D.8~10次", "E.2~3次"], "answer": "B", "explanation": "CAPD一般常规每天交换透析液3~5次，并保持24h持续透析。"}, {"text": "持续非卧床腹膜透析(CAPD)每次使用的透析液量为（  ）", "options": ["A.0.5~1L", "B.1~1.5L", "C.2~3L", "D.3~4L", "E.1.5~2L"], "answer": "E", "explanation": "CAPD每次使用透析液1.5~2L。"}, {"text": "持续非卧床腹膜透析(CAPD)的透析液白天在腹腔内留置时间为（  ）", "options": ["A.1~2h", "B.2~4h", "C.8~10h", "D.4~6h", "E.10~12h"], "answer": "D", "explanation": "CAPD透析液白天在腹腔内留置4~6h，晚上留置10~12h。"}, {"text": "目前我国腹膜透析治疗的首选模式是（  ）", "options": ["A.间歇性腹膜透析(IPD)", "B.日间非卧床腹膜透析(DAPD)", "C.持续非卧床腹膜透析(CAPD)", "D.夜间间歇性腹膜透析(NIPD)", "E.潮式腹膜透析(TPD)"], "answer": "C", "explanation": "CAPD已作为终末期肾病腹膜透析患者的长期维持治疗模式，也是目前我国腹膜透析治疗首选模式。"}, {"text": "标准间歇性腹膜透析(IPD)每次腹腔内透析液的停留时间为（  ）", "options": ["A.5~10min", "B.1~2h", "C.30~45min", "D.4~6h", "E.8~12h"], "answer": "C", "explanation": "标准IPD每次腹腔内灌入1~2L透析液，腹腔内停留30~45min。"}, {"text": "自动化腹膜透析(APD)的操作过程由什么完成（  ）", "options": ["A.人工手工操作", "B.重力引流袋", "C.血液透析机", "D.一台全自动腹膜透析机", "E.循环泵手工控制"], "answer": "D", "explanation": "APD是一项飞速发展的腹膜透析技术，其操作过程由一台全自动腹膜透析机完成。"}]}, {"type": "multiple", "questions": [{"text": "腹膜毛细血管的三孔模型包括的孔结构有（  ）", "options": ["Ａ.超小孔", "Ｂ.小孔", "Ｃ.大孔", "Ｄ.中孔", "Ｅ.微孔"], "answer": "ABC", "explanation": "腹膜毛细血管三孔模型包括超小孔、小孔和大孔，分别参与水、毒素以及腹透液和葡萄糖等的转运；中孔和微孔不属于该模型。"}, {"text": "腹膜微循环的生理功能包括（  ）", "options": ["Ａ.溶质跨膜转运", "Ｂ.液体动力学调节", "Ｃ.超滤", "Ｄ.免疫防御", "Ｅ.内分泌调节"], "answer": "ABC", "explanation": "腹膜微循环的生理功能包括溶质跨膜转运、液体动力学调节和超滤等；免疫防御和内分泌调节不在其列。"}, {"text": "影响腹膜透析溶质转运的因素有（  ）", "options": ["Ａ.腹膜两侧溶质浓度差", "Ｂ.溶质分子量大小", "Ｃ.患者血型", "Ｄ.腹膜毛细血管血流量", "Ｅ.患者身高"], "answer": "ABD", "explanation": "影响溶质转运的因素包括腹膜两侧溶质浓度差、溶质分子量大小和腹膜毛细血管血流量等；患者血型和身高与溶质转运无关。"}, {"text": "影响腹膜透析超滤的因素有（  ）", "options": ["Ａ.腹膜透析液的渗透剂和透析液量", "Ｂ.透析液留置时间", "Ｃ.患者性别", "Ｄ.有效透析面积", "Ｅ.患者的年龄"], "answer": "ABD", "explanation": "影响超滤的因素包括腹膜透析液的渗透剂和透析液量、透析液留置时间、有效透析面积等；患者性别和年龄不是所列影响因素。"}, {"text": "一般腹膜透析液的要求包括（  ）", "options": ["Ａ.电解质成分及浓度与正常人血浆相似", "Ｂ.含缓冲剂可纠正代谢性酸中毒", "Ｃ.渗透压等于或高于正常血浆", "Ｄ.腹透液中钾浓度应明显高于血浆", "Ｅ.制作质量要求可低于静脉输液"], "answer": "ABC", "explanation": "一般腹膜透析液要求电解质成分与正常人血浆相似、含缓冲剂纠正代谢性酸中毒、渗透压等于或高于正常人血浆渗透压；其一般不含钾，且制作质量要求同静脉输液，故后两项错误。"}, {"text": "理想腹膜透析液的要求包括（  ）", "options": ["Ａ.具有可预测的溶质清除率和超滤率", "Ｂ.渗透剂无毒且很少被吸收", "Ｃ.对腹膜及宿主防御功能无影响", "Ｄ.无致热源、无内毒素、无致敏性、无细菌", "Ｅ.须含高浓度钾以补充钾的丢失"], "answer": "ABCD", "explanation": "理想腹膜透析液应具有可预测的溶质清除率和超滤率、渗透剂无毒且很少被吸收、生物相容性好、无致热源无内毒素无致敏性无细菌；理想腹透液并不要求含高浓度钾。"}, {"text": "腹膜透析液的基本组成成分包括（  ）", "options": ["Ａ.渗透剂", "Ｂ.缓冲液", "Ｃ.电解质", "Ｄ.pH调节剂", "Ｅ.肝素"], "answer": "ABCD", "explanation": "腹膜透析液的基本组成包括渗透剂、缓冲液、电解质以及用于调节pH的其他成分；肝素属于可按病情添加的附加成分，不属于基本组成。"}, {"text": "下列属于腹膜透析晶体渗透剂的有（  ）", "options": ["Ａ.葡萄糖", "Ｂ.氨基酸", "Ｃ.艾考糊精", "Ｄ.甘油", "Ｅ.白蛋白"], "answer": "ABD", "explanation": "晶体渗透剂包括葡萄糖、甘油、木糖醇、山梨醇、果糖、氨基酸等；艾考糊精和白蛋白属于高分子量即胶体渗透剂。"}, {"text": "下列属于腹膜透析胶体渗透剂的有（  ）", "options": ["Ａ.白蛋白", "Ｂ.明胶", "Ｃ.葡萄糖", "Ｄ.葡萄糖聚合体", "Ｅ.氨基酸"], "answer": "ABD", "explanation": "高分子量即胶体渗透剂有白蛋白、合成多聚体、葡萄糖聚合体、肽类、血浆替代品如明胶等；葡萄糖和氨基酸属于低分子量即晶体渗透剂。"}, {"text": "关于艾考糊精腹膜透析液，描述正确的有（  ）", "options": ["Ａ.水溶性葡萄糖聚合物", "Ｂ.重均分子量13000~19000Da", "Ｃ.以艾考糊精为主要渗透剂的等渗液", "Ｄ.主要发挥晶体渗透剂作用", "Ｅ.含高浓度钾"], "answer": "ABC", "explanation": "艾考糊精是水溶性葡萄糖聚合物，重均分子量13000~19000Da，以其为主要渗透剂的等渗腹膜透析溶液；它发挥的是胶体渗透剂作用，且不含高浓度钾。"}, {"text": "氨基酸腹膜透析液的特点有（  ）", "options": ["Ａ.用17种复合氨基酸替代葡萄糖", "Ｂ.渗透压等效于1.5%~2.5%葡萄糖", "Ｃ.约80%氨基酸被腹膜吸收进入血液", "Ｄ.无葡萄糖摄入，不会升高血糖", "Ｅ.会造成胰岛素抵抗"], "answer": "ABCD", "explanation": "氨基酸腹膜透析液以17种复合氨基酸替代葡萄糖产生渗透压，渗透压等效于1.5%~2.5%葡萄糖腹透液，约80%的氨基酸被腹膜毛细血管吸收；因无葡萄糖摄入，不会升高血糖、不会造成胰岛素抵抗，故最后一项错误。"}, {"text": "关于腹膜透析液附加成分的说法，正确的有（  ）", "options": ["Ａ.防止蛋白凝固堵塞管路及肠粘连", "Ｂ.腹膜炎时加适量肝素至控制为止", "Ｃ.抗生素应根据菌种及药敏试验选用", "Ｄ.合并腹痛时加入适量利多卡因", "Ｅ.慢性维持性腹膜透析时应常规加入肝素"], "answer": "ABCD", "explanation": "肝素用于防止透析液中蛋白凝固堵塞管路及肠粘连，腹膜炎时应加适量肝素直至腹膜炎控制；抗生素应根据菌种及药敏试验选用；合并腹痛可加适量利多卡因。慢性维持性腹膜透析时一般不加肝素，故最后一项错误。"}, {"text": "关于腹膜透析液缓冲剂的说法，正确的有（  ）", "options": ["Ａ.最先在腹膜透析液中使用的是碳酸氢盐", "Ｂ.碳酸氢盐易形成碳酸钙沉淀", "Ｃ.乳酸盐其后代替了碳酸氢盐", "Ｄ.目前推荐醋酸盐和乳酸盐为缓冲剂", "Ｅ.碳酸氢盐至今仍是唯一可用的缓冲剂"], "answer": "ABCD", "explanation": "最先使用的是碳酸氢盐，因易形成碳酸钙沉淀而被乳酸盐代替，目前醋酸盐和乳酸盐被推荐作为腹膜透析缓冲剂，故碳酸氢盐并非唯一可用缓冲剂。"}, {"text": "目前常规使用的腹膜透析模式主要有（  ）", "options": ["Ａ.持续非卧床腹膜透析(CAPD)", "Ｂ.日间非卧床腹膜透析(DAPD)", "Ｃ.间歇性腹膜透析(IPD)", "Ｄ.自动化腹膜透析(APD)", "Ｅ.连续性肾脏替代治疗(CRRT)"], "answer": "ABCD", "explanation": "目前常规使用的腹膜透析模式主要有CAPD、DAPD、IPD和APD四种；CRRT属于血液净化治疗方式，不属于所列腹膜透析模式。"}, {"text": "持续非卧床腹膜透析(CAPD)的优点有（  ）", "options": ["Ａ.透析模式成熟，经验积累丰富", "Ｂ.操作模式简单易学，患者易于接受", "Ｃ.对各种分子量的物质清除率高", "Ｄ.患者需仰卧位透析，活动受限制", "Ｅ.为增加超滤效果，高渗腹透液应用较多"], "answer": "ABC", "explanation": "CAPD的优点为透析模式成熟、经验积累丰富，操作模式简单易学、患者易于接受，对各种分子量的物质清除率高；仰卧位透析活动受限是IPD的缺点，高渗腹透液应用较多是CAPD的缺点而非优点。"}, {"text": "关于持续非卧床腹膜透析(CAPD)操作方案的描述，正确的有（  ）", "options": ["Ａ.每天交换透析液3~5次", "Ｂ.每次使用透析液1.5~2L", "Ｃ.透析液白天在腹腔内留置4~6h", "Ｄ.透析液晚上在腹腔内留置6~8h", "Ｅ.患者除更换透析液时间外可自由活动"], "answer": "ABCE", "explanation": "CAPD每天交换透析液3~5次，每次1.5~2L，白天留置4~6h、晚上留置10~12h，患者除更换透析液时间外可自由活动；晚上留置6~8h的说法错误。"}, {"text": "关于日间非卧床腹膜透析(DAPD)的描述，正确的有（  ）", "options": ["Ａ.每天交换透析液3~4次", "Ｂ.每次使用透析液1.5~2L", "Ｃ.透析液白天在腹腔内留置4~6h", "Ｄ.适用于腹膜高转运及超滤不良的患者", "Ｅ.其溶质清除优于CAPD"], "answer": "ABCD", "explanation": "DAPD每天交换透析液3~4次，每次1.5~2L，白天留置4~6h，适用于腹膜高转运及超滤不良的患者；DAPD的缺点是溶质清除差，并非优于CAPD。"}, {"text": "关于间歇性腹膜透析(IPD)的描述，正确的有（  ）", "options": ["Ａ.每次腹腔内灌入1~2L透析液", "Ｂ.腹腔内停留30~45min", "Ｃ.每个透析日透析8~10h", "Ｄ.每周透析7个透析日", "Ｅ.透析间歇期腹腔内一般不留置腹膜透析液"], "answer": "ABCE", "explanation": "标准IPD每次腹腔内灌入1~2L透析液、停留30~45min，每个透析日透析8~10h，每周4~5个透析日；透析间歇期腹腔内一般不留置腹膜透析液，故每周7个透析日的说法错误。"}, {"text": "间歇性腹膜透析(IPD)可用于下列哪些情况（  ）", "options": ["Ａ.有残余肾功能，仅需偶尔透析", "Ｂ.新入患者术后7~12d行小剂量IPD", "Ｃ.腹膜高转运者短期行IPD", "Ｄ.急性肾衰竭及某些药物急性中毒", "Ｅ.因超滤过度导致低血压的患者"], "answer": "ABCD", "explanation": "IPD可用于仍有残余肾功能仅需偶尔透析者、新入腹膜透析患者术后7~12d小剂量IPD以利切口愈合、腹膜高转运者短期IPD、急性肾衰竭及某些药物急性中毒等；超滤过度导致低血压并非IPD的适用情况。"}, {"text": "自动化腹膜透析(APD)的优点有（  ）", "options": ["Ａ.治疗模式更易个体化设置、减轻腹腔压力", "Ｂ.机器使用方便，提高生活质量", "Ｃ.腹膜炎发生率相对低", "Ｄ.APD机器价格昂贵", "Ｅ.患者需要更高的学习能力"], "answer": "ABC", "explanation": "APD的优点包括治疗模式更易个体化设置、减轻腹腔压力，机器使用方便、操作便捷以提高生活质量，腹膜炎发生率相对低；机器价格昂贵和患者需要更高的学习能力是APD的缺点。"}]}, {"type": "short", "questions": [{"text": "简述腹膜的分布及其血液供应特点。", "options": [], "answer": "①腹膜的分布：腹膜被覆于腹壁和盆腔壁的内表面以及腹腔、盆腔脏器的表面，面积达22000cm²，约与人体表面积相等，是人体面积最大、分布最复杂的浆膜囊。②腹膜壁层：血供占腹膜总血供的20%，其血液供应来自腹壁和盆壁的体壁动脉，静脉引流至下腔静脉。③腹膜脏层：血供占腹膜总血供的80%，其血液供应来自各内脏器官的动脉，静脉引流入门静脉。", "explanation": "腹膜是人体面积最大、分布最复杂的浆膜囊。腹膜壁层与脏层在血供比例、动脉来源和静脉回流途径上均不相同，这是理解腹膜透析时溶质转运与液体转运的解剖学基础。"}, {"text": "简述影响腹膜透析溶质转运的因素。", "options": [], "answer": "①溶质方面：腹膜两侧溶质浓度差、溶质分子量大小。②腹膜方面：腹膜有效面积及通透性、腹膜毛细血管血流量、腹膜溶质转运特性。③透析液方面：透析液交换量及频度、透析液腹腔存留时间、透析液的渗透浓度。④患者方面：残余肾功能。", "explanation": "腹膜透析时溶质转运以弥散和对流为基本方式，溶质弥散速度受腹膜两侧浓度差及其分子量的影响。上述因素分属溶质、腹膜、透析液和患者四个方面，共同决定溶质的清除效果。"}, {"text": "简述腹膜透析液的附加成分及其临床应用。", "options": [], "answer": "①肝素：用于防止腹膜透析液中蛋白凝固堵塞管路及肠粘连的发生；慢性维持性腹膜透析时一般不加肝素，但在发生腹膜炎时应加适量肝素，直至腹膜炎控制为止。②抗生素：发生细菌性腹膜炎时应根据菌种及药敏试验选用适当的抗生素加入腹膜透析液中，并根据病情变化调整剂量。③胰岛素：糖尿病患者于腹膜透析液中加入适量胰岛素可控制血糖，但腹膜透析袋及腹膜透析管道均可吸附胰岛素。④利多卡因：如合并腹痛时可在腹膜透析液内加入适量利多卡因；如有蛋白凝块可加入适量尿激酶。", "explanation": "腹膜透析液的基本组成相对固定，附加成分需按患者具体病情个体化添加。应用胰岛素时须注意透析袋和管道对胰岛素的吸附作用，以免剂量不足。"}, {"text": "简述持续非卧床腹膜透析(CAPD)的处方方案及其优缺点。", "options": [], "answer": "①处方方案：一般常规每天交换透析液3~5次，每次使用透析液1.5~2L，透析液白天在腹腔内留置4~6h，晚上留置10~12h；保持24h持续透析，患者除了更换透析液的时间外可自由活动。②优点：透析模式成熟、经验积累丰富，操作模式简单易学、患者易于接受，对各种分子量的物质清除率高。③缺点：为增加超滤效果，高渗腹透液应用较多。④选择指征：CAPD在近30年来已作为终末期肾病(ESRD)腹膜透析患者的长期维持治疗模式，也是目前我国腹膜透析治疗首选模式。", "explanation": "CAPD是持续24h不间断的透析方式，透析日数多、体液状态相对稳定，为终末期肾病腹膜透析患者长期维持治疗和我国腹膜透析治疗的首选模式。"}, {"text": "简述自动化腹膜透析(APD)的常见模式及其适用人群。", "options": [], "answer": "①APD-IPD（间歇性腹膜透析）：为非持续性、存在部分干腹时间的APD治疗模式，通常每次腹腔内灌入1~2L腹透液，留腹30~40min，持续治疗8~10h，每周3~5个透析日；适用于短期过渡性治疗（起始治疗、腰背痛、渗漏、疝气、水肿心衰）、有较好残余肾功能的患者及高转运患者。②APD-NIPD（夜间间歇性腹膜透析）：每日夜间进行的间歇性腹透，通常每次留腹1~3h，持续治疗8~12h，是APD常用治疗模式之一；适用于残余肾功能较好、腹膜高转运或高平均转运患者，尤其适用于需白天正常工作、学习的患者和需要他人照顾的患者（如老人、儿童、盲人等）。③APD-CCPD（持续循环腹膜透析）：患者夜间APD治疗、日间腹透液持续留腹的APD治疗模式，夜间通常进行3~5次交换，日间腹透液留腹12~16h；适用于NIPD以及CAPD不能达到充分透析的患者。④其他模式：TPD（潮式腹膜透析）、可调式自动腹膜透析(a APD)、CFPD（持续流动性腹膜透析）等。", "explanation": "APD的操作过程由一台全自动腹膜透析机完成，治疗模式更易个体化设置并能减轻腹腔压力。各模式在透析时间、留腹时长和适用人群上各有侧重，选择时需结合患者残余肾功能、腹膜转运特点及生活需求。"}]}]}, {"num": 19, "title": "腹透患者的培训与管理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "腹膜透析管伸出体外的一端连接的部件是（  ）", "options": ["A.碘液微型盖", "B.螺旋帽钛接头", "C.腹透管路夹", "D.引流袋", "E.易碎折头"], "answer": "B", "explanation": "腹膜透析管经置管手术置入腹腔，其伸出体外的一端与螺旋帽钛接头连接；连接密闭性越好就越能够减少漏液的发生，从而减少感染的可能。"}, {"text": "腹膜透析外接短管在换液时用于连接（  ）", "options": ["A.废液袋", "B.碘伏帽", "C.腹透液", "D.钛接头", "E.拉环"], "answer": "C", "explanation": "腹膜透析外接短管是换液时与腹透液连接的短管，其内套管与腹透液连接口完好吻合后可形成完全密闭的通路。"}, {"text": "关于腹膜透析外接短管清洁处理的做法，正确的是（  ）", "options": ["A.每次换液后用消毒剂擦拭短管", "B.用消毒剂擦拭蓝色开关", "C.短管任何部位都不需要用消毒剂擦拭", "D.每天用酒精擦拭短管管路", "E.每周用含氯制剂消毒短管"], "answer": "C", "explanation": "外接短管的任何一个部位都不需要用消毒剂擦拭，不恰当的擦拭会使蓝色开关或管路出现裂纹。"}, {"text": "腹膜透析螺旋帽钛接头的材质是（  ）", "options": ["A.不锈钢", "B.纯钛", "C.锌合金", "D.铝合金", "E.医用塑料"], "answer": "B", "explanation": "螺旋帽钛接头为纯钛材质，没有磁性，不会被腐蚀。"}, {"text": "腹膜透析螺旋帽钛接头的作用是（  ）", "options": ["A.加热透析液", "B.过滤废液", "C.将体内的长管和体外的短管密闭连接", "D.夹闭管路", "E.保护外接短管端口"], "answer": "C", "explanation": "钛接头将体内的长管和体外的短管密闭连接，其两端分别和腹膜透析管及外接短管高度匹配，达到完好的密闭性。"}, {"text": "关于碘液微型盖的使用，正确的是（  ）", "options": ["A.每天更换一个", "B.每周更换一个", "C.每次换液结束后使用一个新的", "D.每月更换一个", "E.仅在污染后更换"], "answer": "C", "explanation": "每次换液结束后都要使用一个新的碘液微型盖保护外接短管的端口，最大程度地降低了感染的机率。"}, {"text": "每次换液结束后使用碘液微型盖，其作用是（  ）", "options": ["A.固定腹膜透析管", "B.保护外接短管的端口", "C.封闭钛接头", "D.标记换液时间", "E.加热透析液"], "answer": "B", "explanation": "碘液微型盖用于保护外接短管的端口，最大程度地降低了感染的机率。"}, {"text": "蓝夹子的规范名称是（  ）", "options": ["A.止血钳", "B.螺旋帽", "C.连接端口", "D.腹透管路夹", "E.易折阀门杆"], "answer": "D", "explanation": "腹透管路夹在换液中用来夹闭管路，被习惯性地称为蓝夹子。"}, {"text": "关于蓝夹子的保存和使用，正确的是（  ）", "options": ["A.用完即丢弃", "B.闭合状态保存", "C.打开保存，一直用到弹性消失或断裂", "D.每次换液更换一个", "E.浸泡消毒后保存"], "answer": "C", "explanation": "蓝夹子的弹性非常好，建议将它打开保存，可以一直用到弹性消失或者断裂。"}, {"text": "一次性使用引流袋（废液袋）适用于（  ）", "options": ["A.所有腹膜透析患者", "B.仅白天换液的患者", "C.部分夜间不留腹的病人", "D.仅住院患者", "E.仅机器腹膜透析患者"], "answer": "C", "explanation": "一次性使用引流袋适用于部分夜间不留腹的病人，保证了换液系统的完全密闭性。"}, {"text": "标准的双袋腹透连接系统由哪些部分组成（  ）", "options": ["A.溶液袋、引流袋和管路", "B.钛接头、短管和碘伏帽", "C.蓝夹子、纱布和胶布", "D.透析液袋和秤", "E.引流袋和碘伏帽"], "answer": "A", "explanation": "标准的双袋腹透连接系统由溶液袋、引流袋和管路组成。"}, {"text": "双袋腹透连接系统在设计上尽量减少液体和空气接触，其主要目的是（  ）", "options": ["A.提高超滤量", "B.缩短换液时间", "C.大大降低腹膜炎的发生率", "D.减少蛋白质丢失", "E.降低透析液成本"], "answer": "C", "explanation": "在系统设计上，尽量少地让液体和空气接触可以大大降低腹膜炎的发生率。"}, {"text": "双袋腹透连接系统中，既满足患者易于折断又保持在运输环节不易折碎的部件是（  ）", "options": ["A.易碎折头", "B.Y型接口", "C.连接端口", "D.碘伏帽", "E.废液袋"], "answer": "A", "explanation": "易碎折头的特殊材质和尺寸需要满足患者易于折断的同时还保持在运输环节不易折碎。"}, {"text": "易碎折头在材质和尺寸设计上，除便于患者折断外，还强调（  ）", "options": ["A.最大程度地减少粘合剂的使用", "B.增加管路长度", "C.提高液体流速", "D.便于高压灭菌", "E.增加连接端口数量"], "answer": "A", "explanation": "易碎折头的特殊材质和尺寸既要便于患者折断、运输中不易折碎，还要最大程度地减少粘合剂的使用。"}, {"text": "双袋腹透连接系统中Y型接口的设计要求是（  ）", "options": ["A.增加连接端口数量", "B.最大程度通畅排出废液并减少纤维蛋白团块堵塞风险", "C.提高透析液温度", "D.增加粘合剂使用", "E.缩小管路内径"], "answer": "B", "explanation": "Y型接口需要最大程度通畅地排出废液，并减少纤维蛋白团块堵塞的风险。"}, {"text": "双袋腹透连接系统中连接端口的设计要点是（  ）", "options": ["A.增加连接端口数量", "B.以最少的连接端口降低操作难度", "C.连接端口越大越安全", "D.连接端口需用消毒剂擦拭", "E.连接端口需每日更换"], "answer": "B", "explanation": "双袋腹透连接系统以最少的连接端口降低操作难度，并使腹膜透析液系统与外接短管最大程度吻合，避免与外界接触。"}, {"text": "关于腹膜的描述，正确的是（  ）", "options": ["A.紧贴肠管和胃、肝等脏器表面起保护作用", "B.位于腹膜外", "C.仅覆盖肝脏表面", "D.没有滤过功能", "E.仅包绕膀胱"], "answer": "A", "explanation": "腹腔由腹膜包绕形成，腹膜紧贴在肠管和胃、肝等脏器表面，起保护作用。"}, {"text": "腹膜表面有许多小孔，其功能是（
