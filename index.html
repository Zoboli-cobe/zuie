险因素。"}, {"text": "慢性肾脏病急性加重的危险因素包括（  ）", "options": ["Ａ.有效血容量不足", "Ｂ.严重高血压", "Ｃ.肾毒性药物", "Ｄ.泌尿系梗阻", "Ｅ.年龄增长"], "answer": "ABCD", "explanation": "急性加重的危险因素包括有效血容量不足、肾局部血供急剧减少、累及肾脏的疾病复发或加重、严重高血压、肾毒性药物和泌尿系梗阻；年龄增长属于渐进性发展的危险因素。"}, {"text": "属于慢性肾脏病急性加重中肾前性因素的有（  ）", "options": ["Ａ.低血压", "Ｂ.脱水", "Ｃ.休克", "Ｄ.肾毒性药物使用", "Ｅ.泌尿系梗阻"], "answer": "ABC", "explanation": "肾前性因素包括有效血容量不足（低血压、脱水、休克）以及肾局部血供急剧减少等；肾毒性药物使用属于肾性因素，泌尿系梗阻属于肾后性因素。"}, {"text": "高钾血症的治疗措施包括（  ）", "options": ["Ａ.停止补钾", "Ｂ.葡萄糖酸钙", "Ｃ.降钾树脂", "Ｄ.葡萄糖加胰岛素", "Ｅ.静脉补钾"], "answer": "ABCD", "explanation": "高钾血症的治疗包括停止补钾、给予葡萄糖酸钙、降钾树脂、袢利尿剂、葡萄糖加胰岛素、碳酸氢钠，必要时紧急透析；高钾血症时应停止补钾而非静脉补钾。"}, {"text": "高钾血症需行紧急透析的指征包括（  ）", "options": ["Ａ.血钾≥6.5mmol/L", "Ｂ.恶性心律失常", "Ｃ.血钾5.0mmol/L", "Ｄ.轻度下肢水肿", "Ｅ.血压正常"], "answer": "AB", "explanation": "高钾血症紧急透析的指征为血钾≥6.5mmol/L或出现恶性心律失常；血钾5.0mmol/L属于正常范围，轻度下肢水肿和血压正常均不是紧急透析指征。"}, {"text": "慢性肾脏病贫血的发生机制包括（  ）", "options": ["Ａ.骨髓造血受抑制", "Ｂ.红细胞寿命缩短", "Ｃ.铁摄入减少", "Ｄ.叶酸和维生素B12摄入减少", "Ｅ.血小板生成增多"], "answer": "ABCD", "explanation": "尿毒症毒素可抑制骨髓造血、缩短循环红细胞寿命，加之食欲不振使铁、叶酸、维生素B12及蛋白质等摄入减少，共同导致贫血；血小板生成增多与贫血发生无关。"}, {"text": "慢性肾脏病心血管系统的表现包括（  ）", "options": ["Ａ.高血压", "Ｂ.心力衰竭", "Ｃ.心包积液", "Ｄ.动脉硬化和血管钙化", "Ｅ.支气管哮喘"], "answer": "ABCD", "explanation": "心血管系统表现包括高血压及左心室肥厚、心力衰竭、心包积液、动脉硬化和血管钙化；支气管哮喘属于呼吸系统疾病。"}, {"text": "慢性肾脏病导致矿物质和骨代谢异常的内容包括（  ）", "options": ["Ａ.钙、磷、PTH及维生素D代谢异常", "Ｂ.骨转化、骨矿化和骨量异常", "Ｃ.血管和其他软组织钙化", "Ｄ.肾小球滤过膜通透性增高", "Ｅ.骨髓造血功能亢进"], "answer": "ABC", "explanation": "慢性肾脏病导致的矿物质和骨代谢异常包括钙磷PTH及维生素D代谢异常、骨转化骨矿化骨量及线性生长或骨强度异常、血管和其他软组织钙化三方面；滤过膜通透性增高和骨髓造血功能亢进不属于其内容。"}, {"text": "腹膜透析的特点包括（  ）", "options": ["Ａ.利用患者自身腹膜的半透膜特性", "Ｂ.通过弥散和对流原理清除溶质", "Ｃ.适用于心血管功能不稳定者", "Ｄ.易发生感染", "Ｅ.必须建立血管通路"], "answer": "ABCD", "explanation": "腹膜透析利用患者自身腹膜的半透膜特性，通过弥散和对流的原理规律灌入透析液并排出废液，持续性不卧床腹膜透析适用于老人、心血管功能不稳定、糖尿病、小儿及血管条件较差者，但易感染；腹膜透析是腹腔内操作，不需要建立血管通路。"}, {"text": "家庭自测血压的特点包括（  ）", "options": ["Ａ.接近患者日常生活状态的血压值", "Ｂ.预测价值大于诊所血压", "Ｃ.有利于监测降压治疗的效果", "Ｄ.推荐使用腕式电子血压计", "Ｅ.测得血压通常高于诊所血压"], "answer": "ABC", "explanation": "家庭自测血压是患者尽可能接近日常生活状态的血压值，对靶器官损害及其进展的预测价值大于诊所血压，并有利于监测降压治疗的效果；推荐使用上臂式电子血压计而不推荐腕式，其自测血压值低于诊所血压。"}, {"text": "动态血压监测的优点包括（  ）", "options": ["Ａ.敏感、客观反映实际血压水平", "Ｂ.可反映血压变异", "Ｃ.可反映血压昼夜节律", "Ｄ.与靶器官损害和预后关系密切", "Ｅ.可替代血生化检查"], "answer": "ABCD", "explanation": "动态血压监测的优点为敏感、客观反映实际血压水平，反映血压变异和血压昼夜节律，并与靶器官损害、预后关系密切；它不能替代血生化检查。"}, {"text": "动态血压监测的监测意义包括（  ）", "options": ["Ａ.诊断白大衣高血压", "Ｂ.识别难治性高血压", "Ｃ.了解血压昼夜节律", "Ｄ.选择及评价抗高血压药物疗效", "Ｅ.直接测定肾小球滤过率"], "answer": "ABCD", "explanation": "动态血压监测的意义包括诊断白大衣高血压、识别难治性高血压、了解血压昼夜节律、预报靶器官损害以及选择及评价抗高血压药物疗效；它不能直接测定肾小球滤过率。"}, {"text": "ACEI或ARB除降压外对肾脏的保护作用包括（  ）", "options": ["Ａ.减少蛋白尿", "Ｂ.抗氧化", "Ｃ.抑制肾小球系膜细胞增殖", "Ｄ.减轻肾小球硬化", "Ｅ.升高血钾以保护肾脏"], "answer": "ABCD", "explanation": "当肾功能可接受时降压药物首选ACEI或ARB，因其除降压外还有减少蛋白尿、抗氧化、抑制肾小球系膜细胞增殖和减轻肾小球硬化的作用；ACEI或ARB可使血钾升高，属于需要监测的不良反应，不是肾脏保护机制。"}, {"text": "使用ACEI或ARB的注意事项包括（  ）", "options": ["Ａ.血肌酐＞265umol/L时慎用", "Ｂ.监测血肌酐和血钾", "Ｃ.用药2个月血肌酐升高＞30%时减量", "Ｄ.双肾动脉狭窄患者禁用", "Ｅ.出现血肌酐升高超过50%时继续原量"], "answer": "ABCD", "explanation": "ACEI或ARB在血肌酐&gt;265umol/L时慎用，使用中应监测血肌酐和血钾，用药2个月血肌酐较基础水平升高&gt;30%或eGFR下降30%时应减量，双肾动脉狭窄患者禁用；血肌酐升高超过50%时应停药而不是继续原量。"}, {"text": "肾移植的特点包括（  ）", "options": ["Ａ.滤过更充分", "Ｂ.兼具内分泌功能", "Ｃ.肾源稀缺", "Ｄ.需抗排异治疗", "Ｅ.不需要免疫抑制治疗"], "answer": "ABCD", "explanation": "肾移植的优势是滤过更充分、兼具内分泌功能；其缺点是肾源稀缺、需抗排异治疗，抗排异治疗即免疫抑制治疗，因此不需免疫抑制治疗的说法错误。"}, {"text": "肾脏替代治疗的指征包括（  ）", "options": ["Ａ.限制蛋白摄入不能缓解的尿毒症症状", "Ｂ.难以纠正的高钾血症", "Ｃ.难以控制的进展性代谢性酸中毒", "Ｄ.尿毒症心包炎", "Ｅ.仅有微量蛋白尿且无自觉症状"], "answer": "ABCD", "explanation": "肾脏替代治疗的指征以症状为主，包括限制蛋白摄入不能缓解的尿毒症症状、难以纠正的高钾血症、难以控制的进展性代谢性酸中毒、难以控制的水钠潴留及急性心衰或急性肺水肿、尿毒症心包炎、尿毒症脑病和进展性神经病变；仅有微量蛋白尿而无症状者不属于指征。"}, {"text": "慢性肾脏病矿物质和骨代谢异常的治疗药物包括（  ）", "options": ["Ａ.磷结合剂", "Ｂ.骨化三醇", "Ｃ.西那卡塞", "Ｄ.促红细胞生成素", "Ｅ.碳酸氢钠"], "answer": "ABC", "explanation": "慢性肾脏病矿物质和骨代谢异常的治疗包括磷结合剂（氢氧化铝、碳酸钙、碳酸镧、司维拉姆）、骨化三醇或帕立骨化醇、西那卡塞，必要时手术治疗；促红细胞生成素用于治疗贫血，碳酸氢钠用于纠正酸中毒，均不属于针对矿物质和骨代谢异常的治疗。"}]}, {"type": "short", "questions": [{"text": "简述慢性肾脏病的定义。", "options": [], "answer": "慢性肾脏病是指各种原因引起的肾脏结构和功能障碍超过3个月。具体包括：①肾损害≧3个月，表现为血或尿成分异常、影像学检查异常或病理学检查异常；②肾小球滤过率&lt;60ml/min/1.73m2并持续≧3个月。此外，尿白蛋白&gt;300mg/d（尿ACR&gt;30mg/g）、尿沉渣异常、肾小管功能异常导致的电解质及其他异常、肾移植病史也属于肾损害的范畴。", "explanation": "诊断慢性肾脏病需满足肾损害持续≧3个月或肾小球滤过率&lt;60ml/min/1.73m2持续≧3个月中的任意一条；其病理基础是肾单位进行性破坏、肾小球滤过率下降，导致代谢产物和毒素在体内潴留、水电解质酸碱平衡紊乱并引起全身多系统受累，病程呈进行性、不可逆性。"}, {"text": "简述慢性肾脏病急性加重的危险因素及其处理原则。", "options": [], "answer": "①肾前性因素：有效血容量不足（低血压、脱水、休克）、肾局部血供急剧减少（肾动脉狭窄患者应用ACEI或ARB）、组织创伤、严重感染、其他脏器衰竭等，处理原则为积极改善内环境、提供有效肾血供。②肾性因素：累及肾脏的疾病复发或加重、肾毒性药物使用、严重高血压等，处理原则为积极控制肾脏疾病、慎用肾毒性药物。③肾后性因素：泌尿系梗阻，处理原则为解除梗阻。", "explanation": "慢性肾脏病的危险因素分为渐进性发展与急性加重两类。急性加重的危险因素按肾前性、肾性、肾后性归类，针对不同环节采取改善肾血供、控制肾脏疾病并慎用肾毒性药物、解除梗阻等措施，可去除使肾衰恶化和渐进的因素，延缓慢性肾脏病进展。"}, {"text": "简述慢性肾脏病矿物质和骨代谢异常的靶目标。", "options": [], "answer": "慢性肾脏病矿物质和骨代谢异常的靶目标为：血磷0.87-1.45mmol/L，血钙2.10-2.50mmol/L，iPTH为正常上限的2-9倍。", "explanation": "慢性肾脏病导致矿物质和骨代谢异常，其内容包括钙、磷、PTH及维生素D代谢异常，骨转化、骨矿化、骨量及线性生长或骨强度异常，以及血管和其他软组织钙化三部分；治疗可采用磷结合剂（氢氧化铝、碳酸钙、碳酸镧、司维拉姆）、骨化三醇或帕立骨化醇、西那卡塞，必要时手术。"}, {"text": "简述慢性肾脏病患者高血压与蛋白尿的控制目标。", "options": [], "answer": "①血压目标：尿蛋白＞1.0g/d者血压＜125/75mmHg；尿蛋白＜1.0g/d者血压＜130/80mmHg；CKD5期患者血压宜控制在&lt;140/90mmHg以下，CKD1-4期患者血压目标值&lt;130/80mmHg以下。②蛋白尿目标：使尿蛋白＜0.5g/24hr或明显减轻微量白蛋白尿。", "explanation": "高血压是慢性肾脏病发展至终末期肾病的高危因素，积极降压可延缓肾功能的减退。降压治疗的同时应严格控制蛋白尿；当肾功能可接受时降压药物首选ACEI或ARB，因其除降压外还有减少蛋白尿、抗氧化、抑制肾小球系膜细胞增殖和减轻肾小球硬化的作用。"}, {"text": "简述ACEI或ARB治疗慢性肾脏病的肾脏保护作用及注意事项。", "options": [], "answer": "保护作用：当肾功能可接受时降压药物首选ACEI或ARB，其作用包括减少蛋白尿、抗氧化、抑制肾小球系膜细胞增殖、减轻肾小球硬化；还可减轻肾小球内压力并降低高滤过、高灌注、高跨膜压，非血流动力学作用包括改善肾小球滤过膜选择通透性、减少肾小球内细胞外基质蓄积。注意事项：血肌酐&gt;265umol/L时慎用；使用中应监测血肌酐和血钾；用药2个月血肌酐较基础水平升高&gt;30%或eGFR下降30%时应减量，超过50%时停药；禁止用于双肾动脉狭窄的患者。", "explanation": "ACEI或ARB通过扩张出球小动脉降低球内压，间接通过体循环血压下降发挥作用；非血流动力学方面，阻断AngⅡ可减少尿蛋白尤其大分子蛋白滤过，并减少AngⅡ刺激肾小球系膜细胞增生所致的细胞外基质产生增多、阻断纤溶酶原激活剂抑制物生成从而增加纤溶酶及基质金属蛋白酶产生，使细胞外基质蓄积减少。"}]}]}, {"num": 6, "title": "肾脏的解剖特点和功能评价理论考试题库", "sections": [{"type": "single", "questions": [{"text": "肾脏在体内的位置属于（  ）", "options": ["A.腹膜后位器官", "B.腹膜内位器官", "C.腹腔内器官", "D.盆腔内器官", "E.纵隔内器官"], "answer": "A", "explanation": "肾脏为腹膜后位器官，位于脊柱两侧，血供丰富。"}, {"text": "成人肾脏的大小约为（  ）", "options": ["A.80mm×40mm×30mm", "B.100mm×50mm×40mm", "C.120mm×60mm×50mm", "D.150mm×80mm×50mm", "E.60mm×30mm×20mm"], "answer": "B", "explanation": "肾脏大小约为100mm×50mm×40mm。"}, {"text": "成人肾脏的平均重量约为（  ）", "options": ["A.80-99g", "B.150-180g", "C.134-148g", "D.200-220g", "E.50-70g"], "answer": "C", "explanation": "肾脏平均重量约134-148g。"}, {"text": "关于左右肾位置关系的描述，正确的是（  ）", "options": ["A.左肾较右肾略低", "B.左右肾完全等高", "C.右肾较左肾明显偏高", "D.右肾较左肾略低", "E.左肾位于右肾正后方"], "answer": "D", "explanation": "肾脏位于脊柱两侧，右肾较左肾略低。"}, {"text": "关于男女肾脏大小的比较，正确的是（  ）", "options": ["A.男性肾脏略小于女性", "B.男女肾脏完全相同", "C.女性肾脏明显大于男性", "D.女性仅左肾较小", "E.女性肾脏略小于男性"], "answer": "E", "explanation": "女性肾脏略小于男性。"}, {"text": "肾脏表面三层膜中位于最内层的是（  ）", "options": ["A.纤维膜", "B.脂肪囊", "C.肾筋膜", "D.肾小囊", "E.肾盂"], "answer": "A", "explanation": "肾脏表面由内向外依次为纤维膜、脂肪囊、肾筋膜三层。"}, {"text": "肾脏表面三层膜中位于最外层的是（  ）", "options": ["A.纤维膜", "B.肾筋膜", "C.脂肪囊", "D.肾锥体", "E.肾柱"], "answer": "B", "explanation": "肾脏表面三层膜由内向外为纤维膜、脂肪囊、肾筋膜，肾筋膜位于最外层。"}, {"text": "肾脏表面三层膜的主要作用是（  ）", "options": ["A.生成尿液", "B.浓缩尿液", "C.固定和保护肾脏", "D.分泌肾素", "E.降解胰岛素"], "answer": "C", "explanation": "肾脏表面的纤维膜、脂肪囊和肾筋膜三层膜的作用是固定和保护肾脏。"}, {"text": "肾门位于肾脏的（  ）", "options": ["A.外侧缘中部", "B.上极", "C.下极", "D.内侧中部凹陷处", "E.前面中央"], "answer": "D", "explanation": "肾门为肾脏内侧中部凹陷处。"}, {"text": "从肾门出入肾脏的结构是（  ）", "options": ["A.肾小管和集合管", "B.肾小球和肾小囊", "C.输尿管和膀胱", "D.肾盏和肾乳头", "E.肾盂、血管、神经和淋巴管"], "answer": "E", "explanation": "肾门处有肾盂、血管、神经和淋巴管从这里出入肾脏。"}, {"text": "肾皮质外层的厚度约为（  ）", "options": ["A.1.0cm", "B.2.5cm", "C.0.5cm", "D.3.5cm", "E.5.0cm"], "answer": "A", "explanation": "肾冠状面切开后，皮质外层约厚1.0cm，内含肾小球。"}, {"text": "肾髓质内层的空腔由哪些结构构成（  ）", "options": ["A.肾小球和肾小管", "B.肾小盏、肾大盏和肾盂", "C.肾柱和肾锥体", "D.纤维膜和脂肪囊", "E.肾动脉和肾静脉"], "answer": "B", "explanation": "肾髓质内层为空腔，由肾小盏、肾大盏和肾盂构成，与肾盂和输尿管相连。"}, {"text": "肾单位是（  ）", "options": ["A.肾血液滤过的血管结构", "B.尿液排出的通道", "C.肾尿液形成的结构和功能单位", "D.分泌肾素的内分泌腺", "E.储存尿液的囊腔"], "answer": "C", "explanation": "肾单位包括肾小体和肾小管，是肾尿液形成的结构和功能单位。"}, {"text": "人每侧肾脏约有肾单位（  ）", "options": ["A.10万-20万个", "B.500万-600万个", "C.1000万个以上", "D.100万-200万个", "E.1万-2万个"], "answer": "D", "explanation": "人每侧肾脏约有100万-200万个肾单位。"}, {"text": "每个肾单位由哪些结构组成（  ）", "options": ["A.肾小球和集合管", "B.肾小囊和集合管", "C.肾锥体和肾乳头", "D.肾盂和输尿管", "E.肾小球和肾小管"], "answer": "E", "explanation": "每个肾单位由肾小球和肾小管组成，集合管不包括在肾单位内。"}, {"text": "关于集合管与肾单位关系的描述，正确的是（  ）", "options": ["A.集合管不包括在肾单位内", "B.集合管是肾单位的起始部", "C.集合管属于肾小体", "D.集合管属于肾小囊", "E.集合管就是近曲小管"], "answer": "A", "explanation": "肾单位由肾小球和肾小管组成，集合管不包括在肾单位内。"}, {"text": "浅表肾单位的肾小体位于（  ）", "options": ["A.皮质深部", "B.皮质浅部", "C.髓质外层", "D.髓质内层", "E.肾窦内"], "answer": "B", "explanation": "浅表肾单位的肾小体位于皮质浅部，其肾小体较小、肾小管短。"}, {"text": "髓旁肾单位的肾小体位于（  ）", "options": ["A.皮质浅部", "B.髓质浅层", "C.皮质深部", "D.肾门处", "E.肾盂内"], "answer": "C", "explanation": "髓旁肾单位的肾小体位于皮质深部，其肾小体较大、肾小管长。"}, {"text": "在生成尿液中发挥主要作用的肾单位是（  ）", "options": ["A.髓旁肾单位", "B.集合管", "C.肾大盏", "D.浅表肾单位", "E.肾盂"], "answer": "D", "explanation": "浅表肾单位的肾小体位于皮质浅部，较小、肾小管短，在生成尿液中发挥主要作用。"}, {"text": "在浓缩尿液中发挥主要作用的肾单位是（  ）", "options": ["A.浅表肾单位", "B.集合管", "C.肾小盏", "D.肾盂", "E.髓旁肾单位"], "answer": "E", "explanation": "髓旁肾单位的肾小体位于皮质深部，较大、肾小管长，在浓缩尿液中发挥主要作用。"}, {"text": "肾小囊是（  ）", "options": ["A.肾小管起始膨大凹陷形成的双层杯状囊", "B.肾小管末端膨大形成的球状囊", "C.肾盂向下延续形成的管道", "D.集合管起始部的囊状扩张", "E.肾窦内的脂肪组织"], "answer": "A", "explanation": "肾小囊是肾小管起始膨大凹陷形成的双层杯状囊，两层之间形成肾小囊腔。"}, {"text": "肾小囊壁层由哪种上皮构成（  ）", "options": ["A.单层立方上皮", "B.单层扁平上皮", "C.单层柱状上皮", "D.假复层柱状上皮", "E.变移上皮"], "answer": "B", "explanation": "肾小囊壁层由单层扁平上皮构成，脏层由足细胞构成。"}, {"text": "肾小囊脏层由哪种细胞构成（  ）", "options": ["A.球内系膜细胞", "B.毛细血管内皮细胞", "C.足细胞", "D.肾小管上皮细胞", "E.壁层扁平细胞"], "answer": "C", "explanation": "肾小囊脏层由足细胞构成，足细胞有初级突起、次级突起、裂孔和裂孔膜。"}, {"text": "足细胞的结构不包括（  ）", "options": ["A.初级突起", "B.次级突起", "C.裂孔", "D.窗孔", "E.裂孔膜"], "answer": "D", "explanation": "足细胞由初级突起、次级突起、裂孔和裂孔膜构成；窗孔是毛细血管内皮细胞的结构。"}, {"text": "肾小体的两极分别是（  ）", "options": ["A.入球极和集合极", "B.皮质极和髓质极", "C.动脉极和静脉极", "D.近端极和远端极", "E.血管极和尿极"], "answer": "E", "explanation": "肾小体有血管极和尿极两极，肾小囊壁层与近曲小管分别与之相连。"}, {"text": "血管系膜由哪些结构组成（  ）", "options": ["A.球内系膜细胞和系膜基质", "B.内皮细胞和基底膜", "C.足细胞和裂孔膜", "D.壁层上皮和脏层上皮", "E.肾小囊和肾小管"], "answer": "A", "explanation": "血管系膜由球内系膜细胞和系膜基质组成。"}, {"text": "球内系膜细胞的功能是（  ）", "options": ["A.滤过血浆形成原尿", "B.合成基膜和基质并维持其通透性", "C.重吸收葡萄糖和氨基酸", "D.排泌氢离子", "E.浓缩尿液"], "answer": "B", "explanation": "球内系膜细胞合成基膜和基质，并有吞噬功能，维持基膜的通透性。"}, {"text": "入球微动脉的形态特点是（  ）", "options": ["A.细长", "B.与出球微动脉等粗", "C.粗短", "D.管径最细", "E.缺乏内皮细胞"], "answer": "C", "explanation": "入球微动脉粗短，出球微动脉细长。"}, {"text": "出球微动脉的形态特点是（  ）", "options": ["A.粗短", "B.与入球微动脉等粗", "C.管腔最大", "D.细长", "E.缺乏肌层"], "answer": "D", "explanation": "出球微动脉细长，入球微动脉粗短。"}, {"text": "肾小球毛细血管袢管壁由内向外依次为（  ）", "options": ["A.上皮细胞、基底膜、内皮细胞", "B.基底膜、内皮细胞、上皮细胞", "C.内皮细胞、上皮细胞、基底膜", "D.上皮细胞、内皮细胞、基底膜", "E.内皮细胞、基底膜、上皮细胞"], "answer": "E", "explanation": "肾小球毛细血管袢管壁由三层构成，最里层是毛细血管内皮细胞，中层为基底膜，外层为上皮细胞（即足细胞）。"}, {"text": "滤过膜电荷屏障的物质基础是（  ）", "options": ["A.滤过膜各层表面带负电荷的物质", "B.内皮细胞的窗孔", "C.基底膜的可变凝胶", "D.上皮细胞足突间的裂孔", "E.肾小囊腔内的原尿"], "answer": "A", "explanation": "滤过膜的电荷屏障是内皮细胞、基底膜、上皮细胞表面带负电荷的物质。"}, {"text": "滤过膜孔径屏障的组成部分是（  ）", "options": ["A.内皮细胞表面的负电荷", "B.内皮细胞窗孔、基底膜凝胶与足突裂孔", "C.基底膜表面的负电荷", "D.上皮细胞表面的负电荷", "E.肾小囊腔内的液体"], "answer": "B", "explanation": "滤过膜的孔径屏障包括内皮细胞的窗孔、基底膜的可变凝胶、上皮细胞足突间的裂孔。"}, {"text": "肾小管的近端和远端分别连接（  ）", "options": ["A.近端接集合管，远端接肾小囊", "B.两端均连接肾小囊", "C.近端接肾小囊，远端接集合管", "D.两端均连接集合管", "E.近端接肾盂，远端接输尿管"], "answer": "C", "explanation": "肾小管近端接肾小囊，远端接集合管，有重吸收原尿中大部分成分和排泄的作用。"}, {"text": "肾小管的主要功能是（  ）", "options": ["A.滤过血浆形成原尿", "B.储存原尿", "C.分泌肾素", "D.重吸收原尿中大部分成分和排泄", "E.调节血压"], "answer": "D", "explanation": "肾小管近端接肾小囊，远端接集合管，有重吸收原尿中大部分成分和排泄的作用。"}, {"text": "下列肾小管节段中含有钠泵的是（  ）", "options": ["A.髓袢细段", "B.肾小囊壁层", "C.毛细血管袢", "D.肾盂", "E.近曲小管"], "answer": "E", "explanation": "近端小管的曲部即近曲小管含有钠泵。"}, {"text": "含有丰富钠泵的肾小管节段是（  ）", "options": ["A.远曲小管和远直小管", "B.近曲小管", "C.髓袢细段", "D.肾小囊脏层", "E.集合管"], "answer": "A", "explanation": "远端小管的曲部即远曲小管和直部即远直小管均含有丰富的钠泵。"}, {"text": "肾内前列腺素的主要作用是（  ）", "options": ["A.收缩血管、减少尿量", "B.利钠排水、扩张血管", "C.促进抗利尿激素的作用", "D.升高血压", "E.减少肾血流量"], "answer": "B", "explanation": "肾内前列腺素主要起局部作用，具有利钠排水、扩张血管的作用，并可对抗抗利尿激素、促进水排泄。"}, {"text": "肾小球滤过率（GFR）是指（  ）", "options": ["A.单位时间肾脏排出的终尿量", "B.单位时间肾小管重吸收的液体量", "C.单位时间自血浆经肾小球滤过的液体量", "D.每分钟肾脏分泌的肾素量", "E.每分钟流经肾脏的血量"], "answer": "C", "explanation": "肾小球滤过率指单位时间自血浆经肾小球滤过的液体量，是临床最常用的评估肾功能的参数。"}, {"text": "正常成人的肾小球滤过率约为（  ）", "options": ["A.60ml/min", "B.180ml/min", "C.20ml/min", "D.120ml/min", "E.500ml/min"], "answer": "D", "explanation": "肾小球滤过作用形成原尿，肾小球滤过率约为120ml/min。"}, {"text": "肾小球滤过清除的代谢产物主要是（  ）", "options": ["A.葡萄糖和氨基酸", "B.血浆白蛋白", "C.红细胞", "D.血小板", "E.含氮废物如尿素、肌酐"], "answer": "E", "explanation": "肾小球滤过是代谢产物排泄的主要形式，可清除含氮废物如尿素、肌酐。"}, {"text": "原尿中几乎全部在近端小管被重吸收的电解质是（  ）", "options": ["A.钾离子", "B.钙离子", "C.磷离子", "D.氯离子", "E.镁离子"], "answer": "A", "explanation": "钾的重吸收在近曲小管，原尿中的钾几乎全部在近端小管被重吸收。"}, {"text": "钾的排泌主要发生在（  ）", "options": ["A.近曲小管", "B.远曲小管", "C.肾小囊", "D.髓袢细段", "E.肾盂"], "answer": "B", "explanation": "钾的排泌在远曲小管，体现排钾保钠的调节作用。"}, {"text": "近曲小管对HCO3－的主动重吸收比例约为（  ）", "options": ["A.50%", "B.30%", "C.90%", "D.100%", "E.10%"], "answer": "C", "explanation": "HCO3－的主动重吸收在近曲小管，约占90%。"}, {"text": "H＋的排泌主要发生在（  ）", "options": ["A.近曲小管", "B.肾小囊", "C.肾盂", "D.远曲小管和髓袢", "E.输尿管"], "answer": "D", "explanation": "H＋的排泌在远曲小管和髓袢，参与排酸保碱。"}, {"text": "NH4＋的排泌主要发生在（  ）", "options": ["A.近曲小管", "B.远曲小管", "C.肾小囊", "D.集合管", "E.髓袢"], "answer": "E", "explanation": "NH4＋的排泌在髓袢，参与调节酸碱平衡。"}, {"text": "1α-羟化酶位于（  ）", "options": ["A.近端肾小管上皮细胞线粒体内", "B.肾小球毛细血管内皮细胞内", "C.肾小囊壁层上皮细胞内", "D.集合管上皮细胞内", "E.肝细胞线粒体内"], "answer": "A", "explanation": "1α-羟化酶位于近端肾小管上皮细胞线粒体内，使肝脏合成的25-羟维生素D3转化为活性维生素D3。"}, {"text": "活性维生素D3是指（  ）", "options": ["A.25-羟维生素D3", "B.1,25-二羟维生素D3", "C.维生素D2", "D.维生素D3原", "E.7-脱氢胆固醇"], "answer": "B", "explanation": "1α-羟化酶使肝脏合成的25-羟维生素D3转化为活性的1,25-二羟维生素D3，即活性维生素D3。"}, {"text": "正常人体约90%的促红细胞生成素产生于（  ）", "options": ["A.肝脏", "B.骨髓", "C.肾脏", "D.脾脏", "E.肾上腺"], "answer": "C", "explanation": "90%的促红细胞生成素是在肾脏产生的，可刺激骨髓红系增殖、分化。"}, {"text": "血管紧张素Ⅱ的主要作用是（  ）", "options": ["A.扩张血管并减少钠的重吸收", "B.降低血压", "C.促进水钠大量排泄", "D.收缩血管并增加肾脏钠的重吸收", "E.抑制系膜细胞增生"], "answer": "D", "explanation": "血管紧张素Ⅱ主要作用是收缩血管，增加肾脏钠的重吸收，促使肾小球细胞肥大、系膜细胞及基质增生。"}, {"text": "激肽释放酶-激肽系统的作用不包括（  ）", "options": ["A.降低血压", "B.抑制交感活性", "C.利尿利钠", "D.参与肾血流量的调节", "E.升高血压"], "answer": "E", "explanation": "激肽释放酶-激肽系统具有降压、抑制交感活性及利尿利钠作用，参与肾血流量、水盐代谢和血压的调节。"}]}, {"type": "multiple", "questions": [{"text": "肾脏表面三层膜的名称与位置，正确的有（  ）", "options": ["Ａ.纤维膜位于内层", "Ｂ.脂肪囊位于中层", "Ｃ.肾筋膜位于外层", "Ｄ.肾盂位于外层", "Ｅ.肾小囊位于中层"], "answer": "ABC", "explanation": "肾脏表面由内向外依次为纤维膜、脂肪囊、肾筋膜；肾小囊属于肾小体结构，肾盂属于肾髓质内层的空腔，均不属于肾脏表面的三层膜。"}, {"text": "肾门的特点包括（  ）", "options": ["Ａ.有肾小管从这里出入", "Ｂ.位于肾脏内侧中部凹陷处", "Ｃ.有肾盂从这里出入", "Ｄ.有血管从这里出入", "Ｅ.有神经和淋巴管从这里出入"], "answer": "BCDE", "explanation": "肾门为肾脏内侧中部凹陷处，有肾盂、血管、神经和淋巴管从这里出入肾脏；肾小管位于肾实质内，不从肾门出入。"}, {"text": "肾冠状面切面的结构分层特点有（  ）", "options": ["Ａ.髓质内层约厚2.5cm，内含肾小球", "Ｂ.皮质为外层", "Ｃ.髓质为内层", "Ｄ.皮质外层约厚1.0cm，内含肾小球", "Ｅ.皮质中层约厚2.5cm，内含肾小管"], "answer": "BCDE", "explanation": "肾冠状面切开后分皮质与髓质两层：皮质为外层，其中外层约厚1.0cm含肾小球，中层约厚2.5cm含肾小管；髓质为内层，是空腔结构，并非含肾小球的厚2.5cm层。"}, {"text": "肾髓质内层的空腔包括（  ）", "options": ["Ａ.肾锥体", "Ｂ.肾小盏", "Ｃ.肾大盏", "Ｄ.肾柱", "Ｅ.肾盂"], "answer": "BCE", "explanation": "肾髓质内层为空腔，由肾小盏、肾大盏和肾盂构成，并与肾盂和输尿管相连；肾柱和肾锥体属于肾实质结构，不属于内层空腔。"}, {"text": "关于肾单位的描述，正确的有（  ）", "options": ["Ａ.包括肾小体和肾小管", "Ｂ.是肾尿液形成的结构和功能单位", "Ｃ.每侧肾脏约100万-200万个肾单位", "Ｄ.集合管不包括在肾单位内", "Ｅ.每个肾单位由肾小球和集合管组成"], "answer": "ABCD", "explanation": "肾单位包括肾小体和肾小管，是肾尿液形成的结构和功能单位，人每侧肾脏约有100万-200万个；每个肾单位由肾小球和肾小管组成，集合管不包括在肾单位内。"}, {"text": "浅表肾单位的特点有（  ）", "options": ["Ａ.肾小体位于皮质浅部", "Ｂ.肾小体较小", "Ｃ.肾小管短", "Ｄ.在生成尿液中发挥主要作用", "Ｅ.在浓缩尿液中发挥主要作用"], "answer": "ABCD", "explanation": "浅表肾单位的肾小体位于皮质浅部，较小，肾小管短，在生成尿液中发挥主要作用；在浓缩尿液中发挥主要作用的是髓旁肾单位。"}, {"text": "髓旁肾单位的特点有（  ）", "options": ["Ａ.肾小体位于皮质深部", "Ｂ.肾小体较大", "Ｃ.肾小管长", "Ｄ.肾小管短", "Ｅ.在浓缩尿液中发挥主要作用"], "answer": "ABCE", "explanation": "髓旁肾单位的肾小体位于皮质深部，较大，肾小管长，在浓缩尿液中发挥主要作用；肾小管短是浅表肾单位的特点。"}, {"text": "关于肾小囊结构的描述，正确的有（  ）", "options": ["Ａ.壁层由足细胞构成", "Ｂ.是肾小管起始膨大凹陷形成的双层杯状囊", "Ｃ.壁层由单层扁平上皮构成", "Ｄ.脏层由足细胞构成", "Ｅ.两层之间形成肾小囊腔"], "answer": "BCDE", "explanation": "肾小囊是肾小管起始膨大凹陷形成的双层杯状囊，壁层由单层扁平上皮构成，脏层由足细胞构成，两层之间形成肾小囊腔；足细胞构成的是脏层而非壁层。"}, {"text": "足细胞的结构包括（  ）", "options": ["Ａ.初级突起", "Ｂ.次级突起", "Ｃ.窗孔", "Ｄ.裂孔", "Ｅ.裂孔膜"], "answer": "ABDE", "explanation": "足细胞由初级突起、次级突起、裂孔和裂孔膜构成；窗孔是毛细血管内皮细胞的结构，不属于足细胞。"}, {"text": "关于血管系膜的描述，正确的有（  ）", "options": ["Ａ.由足细胞和裂孔膜组成", "Ｂ.由球内系膜细胞和系膜基质组成", "Ｃ.系膜细胞能合成基膜和基质", "Ｄ.系膜细胞有吞噬功能", "Ｅ.系膜细胞维持基膜的通透性"], "answer": "BCDE", "explanation": "血管系膜由球内系膜细胞和系膜基质组成；系膜细胞合成基膜和基质，并有吞噬功能，维持基膜的通透性。足细胞和裂孔膜属于肾小囊脏层结构，不属于血管系膜。"}, {"text": "肾小球毛细血管袢管壁的构成包括（  ）", "options": ["Ａ.最里层为毛细血管内皮细胞", "Ｂ.外层为系膜细胞", "Ｃ.中层为足细胞", "Ｄ.中层为基底膜", "Ｅ.外层为上皮细胞即足细胞"], "answer": "ADE", "explanation": "肾小球毛细血管袢管壁由三层构成：最里层是毛细血管内皮细胞，中层为基底膜，外层为上皮细胞，即足细胞（肾小球囊的脏层）。"}, {"text": "关于滤过膜屏障的描述，正确的有（  ）", "options": ["Ａ.电荷屏障由内皮细胞的窗孔构成", "Ｂ.孔径屏障包括内皮细胞的窗孔", "Ｃ.孔径屏障包括基底膜的可变凝胶", "Ｄ.孔径屏障包括上皮细胞足突间的裂孔", "Ｅ.电荷屏障为各层表面带负电荷的物质"], "answer": "BCDE", "explanation": "滤过膜的孔径屏障包括内皮细胞的窗孔、基底膜的可变凝胶、上皮细胞足突间的裂孔；电荷屏障是内皮细胞、基底膜、上皮细胞表面带负电荷的物质。窗孔属于孔径屏障而非电荷屏障。"}, {"text": "关于肾小管连接与功能的描述，正确的有（  ）", "options": ["Ａ.近端接肾小囊", "Ｂ.远端接集合管", "Ｃ.有重吸收原尿中大部分成分的作用", "Ｄ.近端接集合管", "Ｅ.有排泄作用"], "answer": "ABCE", "explanation": "肾小管近端接肾小囊，远端接集合管，有重吸收原尿中大部分成分和排泄的作用；近端接的是肾小囊而非集合管。"}, {"text": "含有钠泵的肾小管节段有（  ）", "options": ["Ａ.髓袢细段", "Ｂ.近曲小管", "Ｃ.远曲小管", "Ｄ.远直小管", "Ｅ.肾小囊壁层"], "answer": "BCD", "explanation": "近端小管的曲部即近曲小管含钠泵；远端小管的曲部即远曲小管和直部即远直小管含丰富钠泵。髓袢细段和肾小囊壁层不含钠泵。"}, {"text": "关于肾小管重吸收和排泌的描述，正确的有（  ）", "options": ["Ａ.葡萄糖和氨基酸100%被重吸收", "Ｂ.水和电解质大部分被主动或被动重吸收", "Ｃ.钾的排泌主要在近曲小管", "Ｄ.原尿中的钾几乎全部在近端小管被重吸收", "Ｅ.钾的排泌主要在远曲小管"], "answer": "ABDE", "explanation": "肾小管选择性重吸收中，葡萄糖、氨基酸100%被重吸收，水和电解质大部分被主动或被动重吸收；原尿中的钾几乎全部在近端小管被重吸收，而钾的排泌主要在远曲小管。"}, {"text": "关于肾脏调节酸碱平衡的描述，正确的有（  ）", "options": ["Ａ.HCO3－主要在近曲小管被重吸收", "Ｂ.H＋的排泌主要在远曲小管和髓袢", "Ｃ.HCO3－的重吸收主要在远曲小管", "Ｄ.NH4＋的排泌主要在髓袢", "Ｅ.NH4＋的排泌主要在近曲小管"], "answer": "ABD", "explanation": "肾脏调节酸碱平衡表现为：HCO3－的主动重吸收在近曲小管，约占90%；H＋的排泌在远曲小管和髓袢；NH4＋的排泌在髓袢。HCO3－的重吸收不在远曲小管，NH4＋也不在近曲小管排泌。"}, {"text": "肾脏的生理功能包括（  ）", "options": ["Ａ.分泌消化酶分解食物", "Ｂ.生成尿液", "Ｃ.保持机体内环境稳定", "Ｄ.内分泌功能", "Ｅ.调节细胞外液量和电解质酸碱平衡"], "answer": "BCDE", "explanation": "肾脏的生理功能包括生成尿液、保持机体内环境稳定和内分泌功能；保持内环境稳定体现为调节细胞外液量、细胞外液渗透浓度以及电解质酸碱平衡。肾脏不分泌消化酶分解食物。"}, {"text": "肾脏分泌的激素包括（  ）", "options": ["Ａ.肾素", "Ｂ.前列腺素族", "Ｃ.胰岛素", "Ｄ.促红细胞生成素", "Ｅ.活性维生素D3"], "answer": "ABDE", "explanation": "肾脏可分泌肾素、前列腺素族、促红细胞生成素以及活性维生素D3（1,25-二羟维生素D3）等激素；胰岛素主要在肾脏被降解，不是由肾脏分泌的激素。"}, {"text": "活性维生素D3的生理作用包括（  ）", "options": ["Ａ.促进肠道对钙、磷的吸收", "Ｂ.促进骨中钙、磷吸收", "Ｃ.促进骨盐沉积", "Ｄ.降低血钙和血磷", "Ｅ.促进破骨细胞分化，动员骨钙"], "answer": "ABCE", "explanation": "活性维生素D3促进肠道和肾小管钙磷吸收，促进肠道对钙、磷的吸收，促进骨中钙、磷吸收及骨盐沉积，并促进破骨细胞分化、动员骨钙；其结果是提高而非降低血钙、血磷。"}, {"text": "肾脏既是内分泌器官又参与处理其他激素，下列描述正确的有（  ）", "options": ["Ａ.可降解胰岛素", "Ｂ.肾功能衰竭时这些激素的半衰期明显缩短", "Ｃ.可降解多种胃肠道激素", "Ｄ.是抗利尿激素的靶器官", "Ｅ.是降钙素和胰高血糖素的靶器官"], "answer": "ACDE", "explanation": "胰岛素、多种胃肠道激素均在肾脏降解，肾功能衰竭时这些激素的半衰期明显延长，从而引起代谢失调；抗利尿激素、甲状旁腺素、降钙素、胰高血糖素等作为肾外激素通过肾脏起作用，肾脏是其靶器官。"}]}, {"type": "short", "questions": [{"text": "简述肾脏的解剖位置、大小和重量。", "options": [], "answer": "肾脏为腹膜后位器官，位于脊柱两侧，血供丰富；大小约为100mm×50mm×40mm；平均重量约134-148g；右肾较左肾略低，女性肾脏略小于男性。", "explanation": "肾脏属腹膜后位器官，位于脊柱两侧且血供丰富，大小约100mm×50mm×40mm，平均重量约134-148g；左右肾位置不对称，右肾较左肾略低，女性肾脏略小于男性。"}, {"text": "简述肾脏表面三层膜的名称、位置和作用。", "options": [], "answer": "肾脏表面由内向外依次为纤维膜（内）、脂肪囊（中）和肾筋膜（外）；三层膜的作用是固定和保护肾脏。", "explanation": "肾脏表面三层膜中，纤维膜位于内层，脂肪囊位于中层，肾筋膜位于外层；三层膜共同起到固定和保护肾脏的作用。"}, {"text": "简述肾单位的定义、组成及分类与功能特点。", "options": [], "answer": "肾单位包括肾小体和肾小管，是肾尿液形成的结构和功能单位；人每侧肾脏约有100万-200万个肾单位，每个肾单位由肾小球和肾小管组成，集合管不包括在肾单位内。肾单位分为：①浅表肾单位，肾小体位于皮质浅部，较小，肾小管短，在生成尿液中发挥主要作用；②髓旁肾单位，肾小体位于皮质深部，较大，肾小管长，在浓缩尿液中发挥主要作用。", "explanation": "肾单位是肾尿液形成的结构和功能单位，包括肾小体和肾小管，每个肾单位由肾小球和肾小管组成，人每侧肾脏约有100万-200万个，集合管不包括在肾单位内。按肾小体位置和功能可分为浅表肾单位与髓旁肾单位两类，前者在生成尿液中发挥主要作用，后者在浓缩尿液中发挥主要作用。"}, {"text": "简述肾小球滤过膜的构成及其屏障作用。", "options": [], "answer": "肾小球滤过膜由肾小球毛细血管袢管壁的三层构成：最里层为毛细血管内皮细胞，中层为基底膜，外层为上皮细胞（也称足细胞，即肾小球囊的脏层）。滤过膜的孔径屏障包括内皮细胞的窗孔、基底膜的可变凝胶、上皮细胞足突间的裂孔；滤过膜的电荷屏障为内皮细胞、基底膜、上皮细胞表面带负电荷的物质。", "explanation": "肾小球毛细血管袢管壁三层构成滤过膜，最里层是毛细血管内皮细胞，中层为基底膜，外层为上皮细胞即足细胞。滤过膜通过孔径屏障（内皮细胞窗孔、基底膜可变凝胶、上皮细胞足突间裂孔）和电荷屏障（内皮细胞、基底膜、上皮细胞表面带负电荷的物质）限制物质通过。"}, {"text": "简述肾脏的内分泌功能，包括分泌的激素及其主要作用。", "options": [], "answer": "①活性维生素D3（1,25-二羟维生素D3）：1α-羟化酶位于近端肾小管上皮细胞线粒体内，使肝脏合成的25-羟维生素D3转化为活性维生素D3，促进肠道和肾小管钙磷吸收，促进骨中钙、磷吸收及骨盐沉积，促进破骨细胞分化、动员骨钙。②促红细胞生成素（EPO）：90%在肾脏产生，刺激骨髓红系增殖、分化，促进红细胞增生和血红蛋白合成。③肾素-血管紧张素系统：血管紧张素Ⅱ收缩血管、增加肾脏钠的重吸收，调节循环血量、血压及水、电解质平衡。④激肽释放酶-激肽系统：具有降压、抑制交感活性及利尿利钠作用。⑤前列腺素：主要起局部作用，利钠排水、扩张血管。此外，肾脏还降解部分内分泌激素（如胰岛素、多种胃肠道激素），并作为抗利尿激素、甲状旁腺素、降钙素、胰高血糖素等肾外激素的靶器官。", "explanation": "肾脏的内分泌功能包括分泌激素、降解部分内分泌激素以及作为肾外激素的靶器官：分泌的激素有活性维生素D3、促红细胞生成素、肾素-血管紧张素系统相关物质、激肽释放酶-激肽系统相关物质和前列腺素；肾脏可降解胰岛素和多种胃肠道激素，肾功能衰竭时其半衰期明显延长；抗利尿激素、甲状旁腺素、降钙素、胰高血糖素等均通过肾脏起作用。"}]}]}, {"num": 7, "title": "血液净化的基本原理和临床应用理论考试题库", "sections": [{"type": "single", "questions": [{"text": "肾脏替代治疗的类型不包括（  ）", "options": ["A.肾透析", "B.腹膜透析", "C.血液净化", "D.肾移植", "E.体外膜肺氧合"], "answer": "E", "explanation": "肾脏替代治疗包括肾透析、腹膜透析、血液净化、肾移植，用于急/慢性肾功能衰竭所致水、盐及代谢毒素蓄积。体外膜肺氧合属于器官支持治疗，不属于肾脏替代治疗。"}, {"text": "血液净化清除体内过多的水分及代谢废物、毒物等致病物质，同时补充人体所需的电解质和（  ）", "options": ["A.蛋白质", "B.红细胞", "C.碱基", "D.血小板", "E.凝血因子"], "answer": "C", "explanation": "血液净化的定义是把血液引出体外，在透析机内应用物理和化学的方法清除体内过多的水分及代谢废物、毒物等致病物质，同时补充人体所需的电解质、碱基，以维持机体水、电解质和酸碱平衡。"}, {"text": "血液净化的类型不包括（  ）", "options": ["A.血液透析", "B.血液滤过", "C.血液透析滤过", "D.血液灌流", "E.腹膜透析"], "answer": "E", "explanation": "血液净化的类型包括血液透析、血液滤过、血液透析滤过、血液灌流、血浆置换、免疫吸附。腹膜透析属于肾透析的另一种方式，不属于血液净化。"}, {"text": "血液透析的组成要素不包括（  ）", "options": ["A.血管通路", "B.抗凝方式", "C.透析机", "D.透析器", "E.肾移植供体"], "answer": "E", "explanation": "血液透析的组成要素包括血管通路、抗凝方式、透析机、透析器、水处理系统和透析液。肾移植供体属于肾移植范畴，不参与血液透析的组成。"}, {"text": "血液透析血管通路对血流量的基本要求是（  ）", "options": ["A.流量越大越好", "B.穿刺次数越少越好", "C.仅需满足单次治疗", "D.方便、安全、有效", "E.必须采用中心静脉导管"], "answer": "D", "explanation": "血管通路的要求是方便、安全、有效的血流量。血管通路分为临时性血管通路和永久性血管通路两大类。"}, {"text": "直接穿刺动静脉、中心静脉临时置管属于（  ）", "options": ["A.永久性血管通路", "B.临时性血管通路", "C.隧道型静脉导管", "D.动-静脉内瘘", "E.人工血管内瘘"], "answer": "B", "explanation": "临时性血管通路包括直接穿刺动静脉、中心静脉临时置管；永久性血管通路包括隧道型静脉导管和动-静脉内瘘。"}, {"text": "对急性肾损伤（AKI）病人选择透析导管插管静脉时，第一选择是（  ）", "options": ["A.右侧颈内静脉", "B.股静脉", "C.左侧颈内静脉", "D.优势肢体侧的锁骨下静脉", "E.颈外静脉"], "answer": "A", "explanation": "AKI病人选择透析导管插管静脉的顺序为：第一选择右侧颈内静脉，第二选择股静脉，第三选择左侧颈内静脉，最后选择优势肢体侧的锁骨下静脉。"}, {"text": "动-静脉内瘘包括自体血管内瘘和（  ）", "options": ["A.人工血管内瘘", "B.中心静脉导管", "C.直接动脉穿刺", "D.隧道型静脉导管", "E.外周静脉留置针"], "answer": "A", "explanation": "动-静脉内瘘分为自体血管内瘘（原位血管内瘘）和人工血管内瘘（移植血管内瘘），两者均属于永久性血管通路。"}, {"text": "普通肝素的平均分子量约为（  ）", "options": ["A.4500", "B.1728", "C.15000", "D.35000", "E.50000"], "answer": "C", "explanation": "普通肝素平均分子量15000，有相似的抗Ⅹa与Ⅱa活性；低分子肝素平均分子量4500，抗Ⅹa大于Ⅱa活性；戊糖平均分子量1728，只有抗Ⅹa活性。"}, {"text": "低分子肝素的平均分子量约为（  ）", "options": ["A.15000", "B.12000", "C.4500", "D.1728", "E.500"], "answer": "C", "explanation": "低分子肝素平均分子量4500，其抗Ⅹa活性大于抗Ⅱa活性；普通肝素平均分子量15000，有相似的抗Ⅹa与Ⅱa活性。"}, {"text": "在肝素类抗凝药中，只有抗Ⅹa活性的药物是（  ）", "options": ["A.普通肝素", "B.低分子肝素", "C.戊糖", "D.鱼精蛋白", "E.枸橼酸钠"], "answer": "C", "explanation": "戊糖平均分子量1728，只有抗Ⅹa活性；普通肝素平均分子量15000，有相似的抗Ⅹa与Ⅱa活性；低分子肝素平均分子量4500，抗Ⅹa大于Ⅱa活性。"}, {"text": "肝素的缺点包括出血发生率高、药代动力学多变以及（  ）", "options": ["A.价格高昂", "B.代谢缓慢", "C.受抗凝血酶Ⅲ水平干扰", "D.半衰期过长", "E.不能监测"], "answer": "C", "explanation": "肝素的优点为价格低廉、代谢较快、监测方便、可被鱼精蛋白中和；缺点包括HIT、出血发生率高、药代动力学多变、受抗凝血酶Ⅲ（ATⅢ）水平干扰。"}, {"text": "低分子肝素的缺点包括潜在出血风险、Ⅹa活性不易监测以及（  ）", "options": ["A.价格高昂", "B.半衰期过短", "C.代谢不稳定", "D.拮抗剂不易中和", "E.HIT发生率高"], "answer": "D", "explanation": "低分子肝素的优点为HIT发生率低、药代动力学更稳定、半衰期长；缺点包括潜在出血风险、Ⅹa活性不易监测、拮抗剂不易中和。"}, {"text": "肝素可被下列哪种药物中和（  ）", "options": ["A.枸橼酸钠", "B.维生素K", "C.鱼精蛋白", "D.硫酸镁", "E.葡萄糖酸钙"], "answer": "C", "explanation": "肝素的优点之一是可被鱼精蛋白中和，肝素与鱼精蛋白可发生对抗；血浆置换治疗中肝素过量引起出血倾向时，也可用鱼精蛋白对抗肝素的作用。"}, {"text": "局部肝素化抗凝时，大量输注鱼精蛋白可导致（  ）", "options": ["A.滤器寿命延长", "B.血小板功能异常及低血压", "C.抗凝效果增强", "D.离子钙升高", "E.血流量增加"], "answer": "B", "explanation": "局部肝素化抗凝时，大量的鱼精蛋白输注导致血小板功能异常、炎症反应加重及低血压事件，这是局部肝素化的缺点之一。"}, {"text": "枸橼酸钠的体外抗凝原理是（  ）", "options": ["A.抑制凝血酶", "B.激活抗凝血酶Ⅲ", "C.螯合钙离子", "D.抑制血小板聚集", "E.降解纤维蛋白原"], "answer": "C", "explanation": "枸橼酸钠与钙离子螯合形成枸橼酸螯合钙，降低离子钙浓度从而发挥体外抗凝作用，因此枸橼酸钠的体外抗凝原理与离子钙相关。"}, {"text": "枸橼酸螯合钙主要在下列哪些脏器代谢（  ）", "options": ["A.肝脏、骨骼肌、肾脏皮质", "B.脾脏、胰腺、甲状腺", "C.肺、心脏、脑", "D.骨髓、胸腺、淋巴结", "E.皮肤、脂肪、肾上腺"], "answer": "A", "explanation": "枸橼酸螯合钙主要在肝脏、骨骼肌、肾脏皮质代谢，其代谢与三羧酸循环有关，回到体内后可代谢成碳酸氢根和钙离子。"}, {"text": "1分子枸橼酸在体内可转化为碳酸氢钠的分子数是（  ）", "options": ["A.1", "B.2", "C.3", "D.4", "E.6"], "answer": "C", "explanation": "枸橼酸螯合钙回到体内后会代谢成碳酸氢根和钙离子，1分子枸橼酸可转化为3分子碳酸氢钠，因此200ml/h枸橼酸相当于100ml 5%碳酸氢钠产生的碱基。"}, {"text": "肝素抗凝时血流量为200ml/min时肝素追加量为7ml/h，当血流量为300ml/min时肝素追加量约为（  ）", "options": ["A.7ml/h", "B.7.5ml/h", "C.8ml/h", "D.10.5ml/h", "E.15ml/h"], "answer": "D", "explanation": "肝素抗凝时血流量200ml/min对应肝素追加量7ml/h，实际血流量与200ml/min的差值每增加1ml/min，肝素追加量增加0.035ml/h；血流量300ml/min时追加量为7＋100×0.035＝10.5ml/h。"}, {"text": "枸橼酸钠抗凝时，外周血（A点）采血的最佳部位是（  ）", "options": ["A.动脉血，以桡动脉、足背动脉最佳", "B.静脉血，以肘正中静脉最佳", "C.末梢血，以指尖最佳", "D.动脉血，以肺动脉最佳", "E.静脉血，以颈外静脉最佳"], "answer": "A", "explanation": "监测血气分析的A点为患者外周血，动静脉皆可，以动脉血最佳（桡动脉、足背动脉、股动脉），也可取静脉血（动脉端三通处）。"}, {"text": "枸橼酸钠抗凝时，管路采血点（B点）位于（  ）", "options": ["A.滤器前、补钙后", "B.滤器后、补钙前", "C.滤器前、补钙前", "D.滤器后、补钙后", "E.动脉端三通处"], "answer": "B", "explanation": "管路采血点B点位于滤器后、补钙前；A点则为患者外周血，据此可判断枸橼酸抗凝效果与补钙是否合适。"}, {"text": "枸橼酸钠抗凝时，体内游离钙的正常范围是（  ）", "options": ["A.0.1-0.2mmol/L", "B.0.2-0.4mmol/L", "C.0.8-0.9mmol/L", "D.1.0-1.2mmol/L", "E.1.3-1.5mmol/L"], "answer": "D", "explanation": "体内游离钙的正常范围值为1.0-1.2mmol/L；体外游离钙达到0.2-0.4mmol/L时抗凝效果最佳。"}, {"text": "枸橼酸钠抗凝时，测得体外离子钙&lt;0.2mmol/L，枸橼酸钠输注速度的调整方案是（  ）", "options": ["A.不变", "B.上调5ml/h", "C.上调10ml/h", "D.下调5ml/h", "E.下调10ml/h"], "answer": "D", "explanation": "枸橼酸钠抗凝输注速度调整：体外离子钙&lt;0.2mmol/L时下调5ml/h；0.20-0.40mmol/L时不变；0.41-0.50mmol/L时上调5ml/h；&gt;0.50mmol/L时上调10ml/h。"}, {"text": "枸橼酸钠抗凝时，测得体内离子钙为0.95mmol/L，10%葡萄糖酸钙泵入速度的调整方案是（  ）", "options": ["A.下调6.1ml/h", "B.下调3.1ml/h", "C.不变", "D.上调3.1ml/h", "E.上调6.1ml/h"], "answer": "D", "explanation": "枸橼酸钠抗凝钙泵入速度调整：体内离子钙0.9-1.0mmol/L时上调3.1ml/h；1.0-1.2mmol/L时不变；1.21-1.45mmol/L时下调3.1ml/h；&gt;1.45mmol/L时下调6.1ml/h；&lt;0.9mmol/L时按31mg/kg推注并上调6.1ml/h。"}, {"text": "萘莫司他的抗凝机制是（  ）", "options": ["A.依赖抗凝血酶Ⅲ灭活凝血酶", "B.广谱丝氨酸蛋白酶抑制剂", "C.螯合钙离子", "D.抑制血小板聚集", "E.直接降解纤维蛋白"], "answer": "B", "explanation": "萘莫司他为广谱丝氨酸蛋白酶抑制剂，可作用于凝血酶、活性凝血因子（Ⅶa、Ⅹa、Ⅻa）、激肽释放酶-激肽系统、补体系统及纤维蛋白酶，且不依赖抗凝血酶Ⅲ。"}, {"text": "萘莫司他的血浆半衰期约为（  ）", "options": ["A.2min", "B.8min", "C.30min", "D.2h", "E.8h"], "answer": "B", "explanation": "萘莫司他的药代动力学参数为：血浆半衰期8min，血液透析可清除40%，主要在血液及肝脏中代谢，可由肾脏排泄。"}, {"text": "无肝素模式适用的患者是（  ）", "options": ["A.所有维持性血液透析患者", "B.无出血风险的患者", "C.合并出血或存在出血风险的高危人群", "D.合并严重高钾血症的患者", "E.红细胞增多症患者"], "answer": "C", "explanation": "无肝素模式适用于合并出血或存在出血风险的高危人群，推荐采用前稀释的治疗方式，并推荐给与足够的血流速度（&gt;200ml/min）。"}, {"text": "无肝素抗凝的缺点不包括（  ）", "options": ["A.滤器寿命短", "B.血液丢失多", "C.超滤未达标", "D.护士工作强度大", "E.出血风险高"], "answer": "E", "explanation": "无肝素抗凝的优点是出血风险低；缺点是滤器寿命短、血液丢失多、超滤未达标、护士工作强度大、治疗时间无法保证。出血风险高不是其缺点。"}, {"text": "无肝素模式推荐给与的血流速度要求为（  ）", "options": ["A.&gt;100ml/min", "B.&gt;150ml/min", "C.&gt;200ml/min", "D.&gt;300ml/min", "E.&gt;400ml/min"], "answer": "C", "explanation": "无肝素模式适用于合并出血或存在出血风险的高危人群，推荐采用前稀释的治疗方式，并推荐给与足够的血流速度，要求大于200ml/min。"}, {"text": "扩散是指溶液中所有分子随机运动的结果，其转运方向是（  ）", "options": ["A.从低浓度到高浓度", "B.从高浓度到低浓度", "C.从等渗到高渗", "D.只受压力驱动", "E.只受膜面积决定"], "answer": "B", "explanation": "扩散是溶液中所有分子随机运动的结果（溶质必须能溶解于水中），从高浓度向低浓度进行，受半透膜孔径的截留。"}, {"text": "影响扩散效率的因素不包括（  ）", "options": ["A.血液流速", "B.透析液流速", "C.血液和透析液中溶质的浓度梯度", "D.透析膜的厚度", "E.跨膜压TMP"], "answer": "E", "explanation": "影响扩散效率的因素包括血液流速、透析液流速、血液和透析液中溶质的浓度梯度、溶质的水溶性及分子量、透析膜的特性与厚度、透析膜的面积。跨膜压TMP是影响超滤的因素。"}, {"text": "对流清除溶质的转运方式是（  ）", "options": ["A.主动转运", "B.被动转运", "C.依赖浓度梯度的转运", "D.需消耗ATP的转运", "E.依赖膜表面电荷的转运"], "answer": "B", "explanation": "对流是在半透膜的一侧施以压力导致溶质和水分一起滤过该半透膜，属于被动转运，不依赖于溶质的浓度梯度，前提是溶质的分子大小需小于半透膜孔径。"}, {"text": "吸附清除溶质的作用方式是（  ）", "options": ["A.分子间的物理和化学作用", "B.浓度梯度驱动", "C.压力梯度驱动", "D.渗透压驱动", "E.电荷梯度驱动"], "answer": "A", "explanation": "吸附是通过分子间的物理（正负电荷作用）和化学（化学基团结合）作用，使溶质与透析膜结合而被清除，分子可吸附在膜的表面和深层。"}, {"text": "关于渗透的物理学原理，描述正确的是（  ）", "options": ["A.溶质不能通过半透膜而水分可自由通过", "B.溶质和水分均不能通过半透膜", "C.溶质可自由通过而水分不能通过", "D.属于被动的溶剂拖曳转运", "E.由跨膜压决定水分清除量"], "answer": "A", "explanation": "渗透的原理是溶质不能通过半透膜，而水分可以自由通过，最终导致两侧的浓度趋于平衡；超滤则是在半透膜的一侧施以压力使水分滤过，两者机制不同。"}, {"text": "影响超滤的主要因素是（  ）", "options": ["A.血液流速和透析液流速", "B.溶质分子量和蛋白结合率", "C.血浆置换量和置换液种类", "D.灌流器吸附面积", "E.跨膜压TMP和超滤系数KUf"], "answer": "E", "explanation": "超滤是在半透膜的一侧施以压力导致水分滤过该半透膜，是水分的被动转运（透析脱水的主要原理），影响超滤的因素为跨膜压TMP和超滤系数KUf。"}, {"text": "急性肾损伤紧急透析指征中，严重高钾血症的血钾水平为（  ）", "options": ["A.&gt;5.5mmol/L", "B.&gt;6.0mmol/L", "C.&gt;6.5mmol/L", "D.&gt;7.0mmol/L", "E.&gt;7.2mmol/L"], "answer": "E", "explanation": "急性肾损伤的紧急透析指征为：急性肺水肿（对利尿剂无效）、严重的高钾血症（血钾&gt;7.2mmol/L）、严重的代谢性酸中毒（动脉血PH&lt;7.2）。一般透析指征中血钾指标为&gt;6.5mmol/L。"}, {"text": "急性肾损伤一般透析指征中，血钾的水平为（  ）", "options": ["A.&gt;5.5mmol/L", "B.&gt;6.0mmol/L", "C.&gt;6.5mmol/L", "D.&gt;7.0mmol/L", "E.&gt;7.2mmol/L"], "answer": "C", "explanation": "急性肾损伤一般透析指征中血钾&gt;6.5mmol/L；紧急透析指征中严重高钾血症为血钾&gt;7.2mmol/L。"}, {"text": "急性肾损伤一般透析指征中，血肌酐（Scr）的水平为（  ）", "options": ["A.&gt;177 μmol/L", "B.&gt;265 μmol/L", "C.&gt;354 μmol/L", "D.&gt;442 μmol/L", "E.&gt;707 μmol/L"], "answer": "D", "explanation": "急性肾损伤一般透析指征中BUN&gt;21.4mmol/L或Scr&gt;442μmol/L，另有无尿2天或少尿4天以上、动脉血PH&lt;7.2等指征。"}, {"text": "急性肾损伤高分解代谢状态时，每日血肌酐（Scr）上升超过（  ）", "options": ["A.&gt;88 μmol/L", "B.&gt;133 μmol/L", "C.&gt;177 μmol/L", "D.&gt;265 μmol/L", "E.&gt;442 μmol/L"], "answer": "C", "explanation": "急性肾损伤高分解代谢状态指每日BUN上升&gt;10mmol/L，Scr上升&gt;177μmol/L或血钾上升&gt;1mmol/L，属于一般透析指征之一。"}, {"text": "血液透析清除药物和毒物时，适用于分子体积小于透析膜孔径的溶质，即分子量（  ）", "options": ["A.&lt;5000d", "B.&lt;10000d", "C.&lt;20000d", "D.&lt;35000d", "E.&lt;50000d"], "answer": "D", "explanation": "药物和毒物中毒行血液透析治疗时，适用于分子体积小于透析膜孔径（35000d以下）、水溶性好、蛋白结合率低的药物或毒物。"}, {"text": "CRRT血流动力学稳定的机制是（  ）", "options": ["A.快速、间断、高渗", "B.缓慢、间断、低渗", "C.缓慢、连续、等渗", "D.快速、连续、高渗", "E.与血流速度无关"], "answer": "C", "explanation": "CRRT的优势之一是血液动力学稳定，其机制为缓慢、连续、等渗，可减少治疗过程中的血流动力学波动。"}, {"text": "CRRT对中大分子物质清除作用更强，其滤器半透膜可透过物质的分子量可达（  ）", "options": ["A.1000d", "B.5000d", "C.15000d", "D.20000d", "E.50000d"], "answer": "E", "explanation": "CRRT的优势之一是对中大分子物质清除作用更强，滤器的半透膜直径达50000d，主要通过对流方式清除中大分子物质。"}, {"text": "CRRT对组织水肿消除作用更强，其治疗时间可达（  ）", "options": ["A.4小时", "B.8小时", "C.12小时", "D.24小时", "E.48小时"], "answer": "D", "explanation": "CRRT的优势之一是对组织水肿的消除作用更强，其治疗时间长，可达24小时，有利于缓慢持续清除体内多余水分，并利于营养支持。"}, {"text": "萘莫司他用于肝功能不良患者抗凝时，其首剂和维持剂量为（  ）", "options": ["A.20mg、20mg/h", "B.25mg、25mg/h", "C.20mg、25mg/h", "D.25mg、20mg/h", "E.10mg、10mg/h"], "answer": "A", "explanation": "萘莫司他的参考用量为20mg预充、25mg首剂＋25mg/h维持，根据管路情况及监测指标加减；肝功能不好的患者用量减少，为20mg首剂＋20mg/h维持。萘莫司他通过血液中的羧酯酶及肝脏双通道代谢，代谢产物无活性，故肝衰竭患者可以使用但需减少用量。"}, {"text": "脓毒症体外血液净化治疗中，CytoSorb的作用是吸附（  ）", "options": ["A.内毒素", "B.细胞因子", "C.补体", "D.纤维蛋白原", "E.免疫球蛋白"], "answer": "B", "explanation": "CytoSorb为细胞因子吸附柱，功能是吸附细胞因子；高选择性吸附灌流膜PMX吸附内毒素；AN69 Oxiris吸附内毒素和炎症介质。"}, {"text": "Oxiris滤器的基本结构包括聚阳离子和（  ）", "options": ["A.负电荷", "B.正电荷", "C.中性基团", "D.羧基", "E.巯基"], "answer": "A", "explanation": "高选择性吸附滤器Oxiris的基本结构为聚阳离子（聚乙烯亚胺，可吸附内毒素）和负电荷，其膜材不易造成血栓，可为急性肾衰竭病患进行CRRT。"}, {"text": "血浆置换（PE）的原理是去除血浆中的（  ）", "options": ["A.血细胞", "B.致病抗原、抗体、免疫复合物及其他毒物", "C.电解质", "D.葡萄糖", "E.白蛋白"], "answer": "B", "explanation": "血浆置换（PE）的原理是去除血浆中致病的抗原、抗体、免疫复合物及其他毒物，通过血浆分离和交换实现治疗目的。"}, {"text": "单膜血浆置换疗法（PE）使用的置换液是（  ）", "options": ["A.生理盐水", "B.5%葡萄糖溶液", "C.碳酸氢钠溶液", "D.新鲜冰冻血浆或白蛋白溶液", "E.含钾置换液"], "answer": "D", "explanation": "单膜血浆置换疗法使用膜型血浆分离器将血浆分离出来并全部废弃，同时补充等量的新鲜冰冻血浆（FFP）或白蛋白溶液。"}, {"text": "双重滤过血浆置换疗法（DFPP）治疗中，如果每天或隔日进行治疗，应留意并适当补充（  ）", "options": ["A.白蛋白浓度", "B.血钾浓度", "C.血糖浓度", "D.血红蛋白浓度", "E.血小板计数"], "answer": "A", "explanation": "双重滤过血浆置换疗法治疗中如果每天或隔日进行治疗，应留意白蛋白（Alb）浓度，给予适当补充，以避免白蛋白的过度丢失。"}, {"text": "血浆置换过程中出现感染倾向的原因是免疫球蛋白和补体缺乏，其处理是补充（  ）", "options": ["A.200ml生理盐水", "B.400ml新鲜血浆或免疫球蛋白", "C.5%碳酸氢钠125ml", "D.12%白蛋白溶液20ml", "E.红细胞悬液2U"], "answer": "B", "explanation": "血浆置换过程中出现感染倾向的原因是免疫球蛋白和补体缺乏，处理为补充400ml新鲜血浆或免疫球蛋白；出血倾向由凝血因子缺乏引起时同样需补充400ml新鲜血浆。"}]}, {"type": "multiple", "questions": [{"text": "永久性血管通路包括（  ）", "options": ["Ａ.隧道型静脉导管", "Ｂ.动-静脉内瘘", "Ｃ.自体血管内瘘", "Ｄ.人工血管内瘘", "Ｅ.中心静脉临时置管"], "answer": "ABCD", "explanation": "永久性血管通路包括隧道型静脉导管和动-静脉内瘘；动-静脉内瘘又分为自体血管内瘘（原位血管内瘘）和人工血管内瘘（移植血管内瘘）。中心静脉临时置管属于临时性血管通路，故不选。"}, {"text": "关于中心静脉导管的放置部位，下列说法正确的有（  ）", "options": ["Ａ.可放置在右侧颈内静脉", "Ｂ.可放置在左侧颈内静脉", "Ｃ.可放置在股静脉", "Ｄ.涉及上腔静脉和下腔静脉", "Ｅ.推荐在锁骨下静脉放置透析导管"], "answer": "ABCD", "explanation": "中心静脉导管可放置在右侧颈内静脉、左侧颈内静脉和股静脉，分别涉及上腔静脉和下腔静脉。不推荐在锁骨下静脉放置透析导管，故E错误。"}, {"text": "肝素（普通肝素）的优点包括（  ）", "options": ["Ａ.价格低廉", "Ｂ.代谢较快", "Ｃ.监测方便", "Ｄ.可被鱼精蛋白中和", "Ｅ.HIT发生率低"], "answer": "ABCD", "explanation": "肝素的优点为价格低廉、代谢较快、监测方便、可被鱼精蛋白中和。HIT发生率低是低分子肝素的优点，肝素的缺点之一是HIT，故E错误。"}, {"text": "低分子肝素的优点包括（  ）", "options": ["Ａ.HIT发生率低", "Ｂ.药代动力学更稳定", "Ｃ.半衰期长", "Ｄ.可被鱼精蛋白有效中和", "Ｅ.Ⅹa活性易于监测"], "answer": "ABC", "explanation": "低分子肝素的优点为HIT发生率低、药代动力学更稳定、半衰期长。其拮抗剂不易中和（故D错误），Ⅹa活性不易监测（故E错误）。"}, {"text": "血浆置换治疗的适应症包括（  ）", "options": ["Ａ.重症肌无力", "Ｂ.格林-巴利综合征", "Ｃ.血栓性血小板减少性紫癜", "Ｄ.抗肾小球基底膜病", "Ｅ.急性心肌梗死"], "answer": "ABCD", "explanation": "血浆置换治疗的适应症涉及神经系统疾病（重症肌无力、格林-巴利综合征、慢性炎症性脱髓鞘性多发性神经病、多发性硬化）、血液病（血栓性血小板减少性紫癜、溶血尿毒症综合征等）、肾脏疾病（抗肾小球基底膜病、抗体介导的快速进展性肾小球肾炎等）等多个系统。急性心肌梗死不在其中，故E错误。"}, {"text": "枸橼酸钠抗凝的优点包括（  ）", "options": ["Ａ.出血风险低", "Ｂ.增加生物相容性", "Ｃ.滤器寿命长", "Ｄ.协同抗炎抗氧化", "Ｅ.操作相对简单"], "answer": "ABCD", "explanation": "枸橼酸钠抗凝的优点为出血风险低、增加生物相容性、滤器寿命长、协同抗炎抗氧化；其缺点是操作相对复杂、存在酸碱代谢紊乱的风险，故E错误。"}, {"text": "血液透析清除溶质的原理包括（  ）", "options": ["Ａ.扩散", "Ｂ.对流", "Ｃ.吸附", "Ｄ.渗透", "Ｅ.超滤"], "answer": "ABCD", "explanation": "血液透析清除溶质的原理包括扩散、吸附、对流、渗透；水的清除原理是超滤，故超滤不属于溶质清除原理。"}, {"text": "急性肾损伤一般透析指征中，少尿2天以上并伴有下列哪些情况之一者应透析（  ）", "options": ["Ａ.水钠潴留（明显水肿、胸水）", "Ｂ.持续的呕吐", "Ｃ.中枢神经系统症状（烦躁或嗜睡）", "Ｄ.血钾&gt;6mmol/L、心电图高钾", "Ｅ.单纯尿量减少无其他伴随症状"], "answer": "ABCD", "explanation": "少尿2天以上并伴有水钠潴留（明显水肿、胸水、心包积液、球结膜水肿、心音呈奔马律等）、持续的呕吐、中枢神经系统症状（烦躁或嗜睡）、血钾&gt;6mmol/L且心电图有高钾表现之一者，属于急性肾损伤一般透析指征。单纯尿量减少无其他伴随症状本身不构成该指征，故E错误。"}, {"text": "CRRT的适应症包括（  ）", "options": ["Ａ.横纹肌溶解综合症", "Ｂ.肝性脑病", "Ｃ.重症肌无力", "Ｄ.急性溶血", "Ｅ.急性心肌梗死"], "answer": "ABCD", "explanation": "CRRT适应症包括横纹肌溶解综合症、肝性脑病、重症肌无力、急性溶血、急性重症胰腺炎、急性呼吸窘迫综合征、脓毒血症，以及急性肺水肿、慢性心力衰竭、严重液体超负荷、严重水电解质紊乱、药物中毒、其他毒物中毒、严重乳酸酸中毒等。急性心肌梗死不在其中，故E错误。"}, {"text": "脓毒症体外血液净化治疗中，可用于清除炎症介质的膜材料有（  ）", "options": ["Ａ.Septex", "Ｂ.AN69 ST", "Ｃ.PMMA", "Ｄ.AN69 Oxiris", "Ｅ.PMX"], "answer": "ABCD", "explanation": "Septex（高截留CRRT膜）、AN69 ST和PMMA（非选择性吸附CRRT膜）、AN69 Oxiris（高选择性吸附CRRT膜）均可清除炎症介质。PMX为高选择性吸附灌流膜，功能为吸附内毒素，故E错误。"}, {"text": "脓毒症体外血液净化治疗中，可用于吸附内毒素的膜材料有（  ）", "options": ["Ａ.AN69 Oxiris", "Ｂ.PMX", "Ｃ.Septex", "Ｄ.CytoSorb", "Ｅ.PMMA"], "answer": "AB", "explanation": "AN69 Oxiris可吸附内毒素和炎症介质，PMX可吸附内毒素。Septex、PMMA的功能是清除炎症介质，CytoSorb吸附细胞因子，均不吸附内毒素，故C、D、E错误。"}, {"text": "单膜血浆置换疗法（PE）的缺点包括（  ）", "options": ["Ａ.因使用他人血浆，有感染的可能", "Ｂ.可能会混入微小聚集物而带来不良反应", "Ｃ.需要大量贵重且高价的FFP", "Ｄ.体外循环可能会引起低血压等不良反应", "Ｅ.有少许白蛋白的丢失"], "answer": "ABCD", "explanation": "单膜血浆置换疗法的缺点包括：因使用他人血浆有感染的可能；可能会混入微小聚集物而带来不良反应；需要大量贵重且高价的FFP；体外循环可能会引起低血压等不良反应。有少许白蛋白的丢失是双重滤过血浆置换疗法的缺点，故E错误。"}, {"text": "双重滤过血浆置换疗法（DFPP）的缺点包括（  ）", "options": ["Ａ.有少许白蛋白的丢失", "Ｂ.有用蛋白也可能被清除", "Ｃ.体外循环可能引起低血压", "Ｄ.需要大量贵重且高价的FFP", "Ｅ.过敏反应"], "answer": "ABC", "explanation": "双重滤过血浆置换疗法的缺点包括有少许白蛋白的丢失、因为通过分子筛分离故有用蛋白也有可能被清除、体外循环可能会引起低血压等不良反应。需要大量贵重且高价的FFP和过敏反应是单膜血浆置换疗法的缺点，故D、E错误。"}, {"text": "双重滤过血浆置换疗法（DFPP）的特点包括（  ）", "options": ["Ａ.补液用量少", "Ｂ.感染风险较使用FFP减少", "Ｃ.可清除不同分子量血浆蛋白", "Ｄ.所有血浆成分均被废弃", "Ｅ.可补充凝血因子"], "answer": "ABC", "explanation": "双重滤过血浆置换疗法补液用量少，因为使用白蛋白溶液作为补液故感染风险比使用FFP的血浆置换疗法减少，通过使用不同孔径的血浆成分分离器可以清除不同分子量领域的血浆蛋白。所有血浆成分均被废弃、可补充凝血因子是单膜血浆置换疗法的特点，故D、E错误。"}, {"text": "双重滤过血浆置换疗法（DFPP）所用膜型血浆成分分离器的特点包括（  ）", "options": ["Ａ.中空纤维材料为乙烯-乙烯醇聚合物", "Ｂ.内径175μm", "Ｃ.膜厚40μm", "Ｄ.有效面积2.0m²", "Ｅ.采用高压蒸汽灭菌"], "answer": "ABCD", "explanation": "该膜型血浆成分分离器的中空纤维材料为乙烯-乙烯醇聚合物，内径175μm，膜厚40μm，有效面积2.0m²，血液容量150mL，容器材料为聚碳酸酯树脂，尺寸280mmL×57mmD，采用γ射线灭菌，故高压蒸汽灭菌错误。"}, {"text": "血浆置换治疗的禁忌症包括（  ）", "options": ["Ａ.严重活动性出血或DIC", "Ｂ.对血浆、人血白蛋白等有严重过敏史者", "Ｃ.严重低血压或休克等全身循环衰竭", "Ｄ.不稳定期的心、脑梗死患者", "Ｅ.家族性高胆固醇血症"], "answer": "ABCD", "explanation": "血浆置换的禁忌症包括严重活动性出血或DIC；对血浆、人血白蛋白等有严重过敏史者；严重低血压或休克等全身循环衰竭；不稳定期的心、脑梗死患者；重度脑水肿伴有脑疝等濒危症状；以及临床医生认为不适合血浆置换治疗或不能耐受治疗者。家族性高胆固醇血症属于血浆置换的适应症，故E错误。"}, {"text": "血浆置换的不良反应中，与抗凝相关的有（  ）", "options": ["Ａ.低钙血症、碱中毒", "Ｂ.出血倾向", "Ｃ.过敏和变态反应", "Ｄ.感染倾向", "Ｅ.低血压"], "answer": "AB", "explanation": "血浆置换不良反应中，低钙血症、碱中毒与枸橼酸抗凝相关，出血倾向可与肝素抗凝相关。过敏和变态反应、感染倾向、低血压属于与置换液相关的不良反应，故C、D、E错误。"}, {"text": "血浆置换过程中发生低血压，其常见原因和相应处理包括（  ）", "options": ["Ａ.置换液量不足时补足置换液", "Ｂ.血管活性药物被清除时加量", "Ｃ.低血压由枸橼酸过量引起", "Ｄ.应立即终止治疗不再处理", "Ｅ.出血倾向时应补充新鲜血浆"], "answer": "AB", "explanation": "血浆置换过程中发生低血压，若为置换液量补充不足应正确计算置换液补充量，若为血管活性药物被清除应增加血管活性药物用量。枸橼酸过量引起的是低钙血症、碱中毒而非低血压，故C错误；低血压应先针对原因处理，而不是立即终止治疗且不再处理，故D错误；补充400ml新鲜血浆是出血倾向的处理，故E错误。"}, {"text": "血浆置换治疗开始前及过程中预防过敏反应，可使用的药物有（  ）", "options": ["Ａ.地塞米松", "Ｂ.非那根", "Ｃ.抗组胺药物", "Ｄ.肝素", "Ｅ.枸橼酸钠"], "answer": "ABC", "explanation": "血浆置换开始前给予地塞米松5mg静推、非那根25mg肌肉注射，过程中给予抗过敏处理，预防性使用激素和抗组胺药物可减少过敏和变态反应。肝素、枸橼酸钠为抗凝药物，不用于预防过敏反应，故D、E错误。"}, {"text": "血浆置换治疗中，出血倾向的处理措施包括（  ）", "options": ["Ａ.凝血因子缺乏时补充新鲜血浆", "Ｂ.肝素过量时减量或改用低分子肝素", "Ｃ.肝素过量时用鱼精蛋白对抗", "Ｄ.免疫球蛋白缺乏时补充免疫球蛋白", "Ｅ.枸橼酸过量时补充钙剂"], "answer": "ABC", "explanation": "血浆置换治疗中出血倾向的处理：凝血因子缺乏时补充400ml新鲜血浆；肝素过量时减少肝素用量或使用低分子量肝素，或用鱼精蛋白对抗肝素的作用。补充免疫球蛋白是感染倾向的处理，补充钙剂是枸橼酸过量所致低钙血症、碱中毒的处理，故D、E错误。"}]}, {"type": "short", "questions": [{"text": "简述血液净化的定义及其清除与补充的物质。", "options": [], "answer": "血液净化是指把血液引出体外，在透析机内应用物理和化学的方法清除体内过多的水分及代谢废物、毒物等致病物质，同时补充人体所需的电解质、碱基，以维持机体水、电解质和酸碱平衡，然后再将血液回输至体内的过程。这一过程是通过专门的设备来完成的。", "explanation": "血液净化清除的对象是体内过多的水分、代谢废物和毒物等致病物质；补充的是电解质和碱基；目的是维持机体水、电解质和酸碱平衡；整个过程在透析机内完成并将血液回输体内。血液净化建立在肾透析、腹膜透析、肾移植等肾脏替代治疗体系之中，用于急/慢性肾功能衰竭所致的水、盐及代谢毒素蓄积。"}, {"text": "简述血液透析的组成要素及血液透析流程的主要环节。", "options": [], "answer": "血液透析的组成要素包括血管通路、抗凝方式、透析机、透析器、水处理系统和透析液。血液透析流程的主要环节为：通过血管通路流出病人血液，经抗凝和血泵驱动进入透析器，与清洁透析液进行交换，废透析液排出，处理后的血液输回病人体内。", "explanation": "血管通路的要求是方便、安全、有效的血流量。血液透析流程中，血液经血管通路引出并在抗凝条件下由血泵驱动进入透析器，透析器是溶质和水分交换的核心部件，清洁透析液由水处理系统制备后进入透析器，废透析液排出，净化后的血液回输病人体内。水处理系统和透析液是保证透析质量的重要组成要素。"}, {"text": "简述肝素（普通肝素）与低分子肝素在分子量、活性特点及优缺点方面的区别。", "options": [], "answer": "分子量与活性方面：普通肝素平均分子量15000，有相似的抗Ⅹa与Ⅱa活性；低分子肝素平均分子量4500，抗Ⅹa大于Ⅱa活性。优点方面：肝素价格低廉、代谢较快、监测方便、可被鱼精蛋白中和；低分子肝素HIT发生率低、药代动力学更稳定、半衰期长。缺点方面：肝素存在HIT、出血发生率高、药代动力学多变、受抗凝血酶Ⅲ水平干扰；低分子肝素存在潜在出血风险、Ⅹa活性不易监测、拮抗剂不易中和。", "explanation": "两种抗凝剂同属常规抗凝（全身抗凝）。普通肝素平均分子量15000，抗Ⅹa与Ⅱa活性相似；低分子肝素平均分子量4500，抗Ⅹa活性大于Ⅱa活性；此外戊糖平均分子量1728，只有抗Ⅹa活性。选择时应结合患者出血风险、监测条件和肝肾功能综合判断；重症患者常见的低抗凝血酶Ⅲ水平限制了肝素的抗凝效果，且APTT/ACT并不能准确预测肝素的抗凝效果。"}, {"text": "简述枸橼酸钠体外抗凝的原理和血气分析的采集与监测要点。", "options": [], "answer": "抗凝原理：枸橼酸钠与钙离子螯合形成枸橼酸螯合钙，降低离子钙浓度而发挥体外抗凝作用，其原理与离子钙相关；枸橼酸螯合钙主要在肝脏、骨骼肌、肾脏皮质代谢，回到体内后代谢成碳酸氢根和钙离子，1分子枸橼酸转化为3分子碳酸氢钠。采集与监测要点：采血位置A点为患者外周血（动静脉皆可，以桡动脉、足背动脉、股动脉最佳）或静脉血（动脉端三通处），B点为管路采血点、位于滤器后补钙前；采集时机为上机前2小时内采集A点，上机后2小时、上机后6小时先采集B点后采集A点，若治疗时间大于8小时则之后每4～6小时先后采集B点和A点；体内游离钙正常范围1.0-1.2mmol/L，体外游离钙最佳抗凝效果值0.2-0.4mmol/L，据此调整枸橼酸钠和10%葡萄糖酸钙的输注速度。", "explanation": "枸橼酸钠抗凝的优点为出血风险低、增加生物相容性、滤器寿命长、协同抗炎抗氧化；缺点是操作相对复杂、存在酸碱代谢紊乱的风险。体外离子钙&lt;0.2mmol/L时枸橼酸钠输注速度下调5ml/h，0.20-0.40mmol/L时不变，0.41-0.50mmol/L时上调5ml/h，&gt;0.50mmol/L时上调10ml/h；体内离子钙1.0-1.2mmol/L时10%葡萄糖酸钙速度不变，0.9-1.0mmol/L时上调3.1ml/h，1.21-1.45mmol/L时下调3.1ml/h，&gt;1.45mmol/L时下调6.1ml/h，&lt;0.9mmol/L时按31mg/kg推注并上调6.1ml/h。"}, {"text": "简述单纯血浆置换疗法（PE）与双重滤过血浆置换疗法（DFPP）的原理和比较要点。", "options": [], "answer": "原理方面：单膜血浆置换疗法使用膜型血浆分离器将血浆分离出来并且全部废弃，同时补充等量的新鲜冰冻血浆（FFP）或者白蛋白溶液；双重滤过血浆置换疗法先使用膜型血浆分离器将血浆分离出来，然后将血浆成分通过更小孔径的膜型血浆成分分离器，清除血浆中的高分子量成分，而白蛋白等低分子量成分随着补液（白蛋白溶液）回输患者体内。比较要点：操作难易方面，PE简单、医务人员工作强度低，DFPP相对复杂、工作强度高；血浆处理剂量方面，PE小于3L/次，DFPP为3-10L/次；置换液方面，PE每次需要2-3L新鲜冰冻血浆或白蛋白，DFPP不需要或者仅需要200-400ml白蛋白；治疗时间方面，PE为2-3小时，DFPP为2-5小时；清除溶质方面，PE对大中小分子均无选择性清除，DFPP选择性清除大分子；治疗剂量方面，DFPP为2倍PE；特异性方面，PE差、DFPP优；缺点方面，PE有过敏反应、低钙血症，DFPP有复杂的操作、凝血因子降低。", "explanation": "DFPP所用膜型血浆成分分离器的中空纤维材料为乙烯-乙烯醇聚合物、内径175μm、膜厚40μm、有效面积2.0m²、血液容量150mL、容器材料为聚碳酸酯树脂、采用γ射线灭菌。DFPP的核心理念是通过不同孔径的血浆成分分离器清除不同分子量领域的血浆蛋白，常见型号有EC-20W、EC-30W、EC-40W、EC-50W；如果每天或隔日进行治疗，应留意白蛋白浓度并给予适当补充。PE与DFPP均属血浆置换疗法，可去除血浆中致病的抗原、抗体、免疫复合物及其他毒物，治疗中需注意过敏反应、低血压、感染倾向、出血倾向、低钙血症与碱中毒等不良反应的处理。"}]}]}, {"num": 8, "title": "血液净化中心透析机参数及临床治疗安全理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析中，肾衰竭患者的eGFR低于多少时必须透析？", "options": ["A.eGFR＜5ml/min/1.73m²", "B.eGFR＜10ml/min/1.73m²", "C.eGFR＜15ml/min/1.73m²", "D.eGFR＜20ml/min/1.73m²", "E.eGFR＜25ml/min/1.73m²"], "answer": "A", "explanation": "肾衰竭患者eGFR＜15ml/min/1.73m²时根据临床表现决定透析时机，eGFR＜5ml/min/1.73m²时必须透析。"}, {"text": "肾衰竭患者的eGFR低于多少时，需根据临床表现决定透析时机？", "options": ["A.eGFR＜5ml/min/1.73m²", "B.eGFR＜15ml/min/1.73m²", "C.eGFR＜20ml/min/1.73m²", "D.eGFR＜30ml/min/1.73m²", "E.eGFR＜60ml/min/1.73m²"], "answer": "B", "explanation": "eGFR＜15ml/min/1.73m²时根据临床表现决定透析时机，eGFR＜5ml/min/1.73m²时则必须透析。"}, {"text": "血液透析首次透析的治疗时间一般不超过？", "options": ["A.1—2h", "B.2—3h", "C.3—4h", "D.4—5h", "E.5—6h"], "answer": "B", "explanation": "首次透析时间不超过2—3h，此后逐渐延长，以避免失衡综合征。"}, {"text": "维持性血液透析逐渐延长治疗时间后，常规的频率与单次时长是？", "options": ["A.每周2次、每次3h", "B.每周2次、每次4h", "C.每周3次、每次4h", "D.每周3次、每次3h", "E.每周4次、每次4h"], "answer": "C", "explanation": "透析时间逐渐延长，直到每周3次、每次4h。"}, {"text": "血液透析中失衡综合征的主要发生机制是？", "options": ["A.快速清除溶质致水向脑组织转移、颅内压增高", "B.透析液温度过低致脑血管痉挛", "C.抗凝剂过量致颅内出血", "D.血流量过大致心脏前负荷增加", "E.透析液钠浓度过低致低钠血症"], "answer": "A", "explanation": "失衡综合征是血液透析快速清除溶质，水向脑组织转移，从而引起颅内压增高所致。"}, {"text": "首次血液透析时，血流速度应适当减慢至？", "options": ["A.50—100ml/min", "B.100—150ml/min", "C.150—200ml/min", "D.200—250ml/min", "E.250—300ml/min"], "answer": "C", "explanation": "首次透析血流速度适当减慢，为150—200ml/min。"}, {"text": "血液透析时，血流量一般约为体重的多少倍？", "options": ["A.2倍", "B.3倍", "C.4倍", "D.5倍", "E.6倍"], "answer": "C", "explanation": "血流量一般为体重的4倍。"}, {"text": "血液透析时血流量的一般范围是？", "options": ["A.50—150ml/min", "B.150—300ml/min", "C.300—400ml/min", "D.400—500ml/min", "E.500—600ml/min"], "answer": "B", "explanation": "血流量一般为体重的4倍，即150—300ml/min。"}, {"text": "血液透析中超滤速度不得大于血流量的？", "options": ["A.20%", "B.30%", "C.40%", "D.50%", "E.60%"], "answer": "B", "explanation": "超滤速度不得大于血流量的30%。"}, {"text": "低血流量透析最容易增加哪项风险？", "options": ["A.溶血", "B.凝血", "C.失衡综合征", "D.高钾血症", "E.空气栓塞"], "answer": "B", "explanation": "低血流量会增加凝血风险。"}, {"text": "血液透析液温度一般应控制在？", "options": ["A.35.5℃左右", "B.36.5℃左右", "C.37.5℃左右", "D.38.5℃左右", "E.39.5℃左右"], "answer": "B", "explanation": "透析液温度一般36.5℃左右。"}, {"text": "关于透析液温度异常的影响，正确的一项是？", "options": ["A.低温易凝血，高温易溶血", "B.低温易溶血，高温易凝血", "C.低温和高温均易凝血", "D.低温和高温均易溶血", "E.温度对凝血与溶血均无影响"], "answer": "A", "explanation": "透析液温度过低易凝血，温度过高易溶血。"}, {"text": "血液透析液流量一般为血流量的？", "options": ["A.1倍", "B.1.5倍", "C.2倍", "D.3倍", "E.4倍"], "answer": "C", "explanation": "透析液流量为血流量的2倍。"}, {"text": "血液透析液流量的常用范围是？", "options": ["A.200—300ml/min", "B.300—400ml/min", "C.400—500ml/min", "D.500—600ml/min", "E.600—700ml/min"], "answer": "D", "explanation": "透析液流量为血流量的2倍，常用500—600ml/min；流量越大透析越充分，但越大越易失衡。"}, {"text": "血液透析滤过采用前置换时，置换液流量约为血流量的？", "options": ["A.1/4", "B.1/3", "C.1/2", "D.2/3", "E.3/4"], "answer": "C", "explanation": "前置换为血流量的1/2，约100ml/min。"}, {"text": "血液透析滤过采用后置换时，置换液流量约为血流量的？", "options": ["A.1/4", "B.1/3", "C.1/2", "D.2/3", "E.3/4"], "answer": "B", "explanation": "后置换为血流量的1/3，约60ml/min。"}, {"text": "血液透析滤过采用后置换时，置换液流量约为多少？", "options": ["A.40ml/min", "B.60ml/min", "C.80ml/min", "D.100ml/min", "E.120ml/min"], "answer": "B", "explanation": "后置换为血流的1/3，约60ml/min。"}, {"text": "血液透析液的血钾浓度常设为？", "options": ["A.1mmol/L", "B.2mmol/L", "C.3mmol/L", "D.4mmol/L", "E.5mmol/L"], "answer": "B", "explanation": "透析液血钾浓度为2mmol/L。"}, {"text": "属于低钙透析液的血钙浓度是？", "options": ["A.1.0mmol/L", "B.1.25mmol/L", "C.1.5mmol/L", "D.1.75mmol/L", "E.2.0mmol/L"], "answer": "B", "explanation": "血钙1.25mmol/L为低钙透析液，1.5mmol/L为中间值，1.75mmol/L为高钙透析液。"}, {"text": "属于高钙透析液的血钙浓度是？", "options": ["A.1.0mmol/L", "B.1.25mmol/L", "C.1.5mmol/L", "D.1.75mmol/L", "E.2.0mmol/L"], "answer": "D", "explanation": "血钙1.75mmol/L为高钙透析液，1.25mmol/L为低钙透析液。"}, {"text": "低通量透析膜对物质的截留特点是？", "options": ["A.大于500道尔顿不能通过", "B.大于5000道尔顿不能通过", "C.大于8000道尔顿不能通过", "D.大于50000道尔顿不能通过", "E.任何分子均可自由通过"], "answer": "C", "explanation": "低通量透析膜大于8000道尔顿的物质不能通过膜孔，尿素、肌酐等小分子可自由通过。"}, {"text": "低通量透析器的超滤系数通常为？", "options": ["A.＜8ml/h·mmHg", "B.8—20ml/h·mmHg", "C.＞20ml/h·mmHg", "D.＞30ml/h·mmHg", "E.＞40ml/h·mmHg"], "answer": "A", "explanation": "低通量透析器膜孔相对较小，超滤系数通常＜8ml/h·mmHg。"}, {"text": "高通量透析器的超滤系数通常为？", "options": ["A.＜8ml/h·mmHg", "B.8—20ml/h·mmHg", "C.＞20ml/h·mmHg", "D.＞30ml/h·mmHg", "E.＞40ml/h·mmHg"], "answer": "C", "explanation": "高通量透析器膜孔相对较大，超滤系数通常＞20ml/h·mmHg。"}, {"text": "高效高通量透析器的β2-微球蛋白滤过系数应大于？", "options": ["A.0.2", "B.0.4", "C.0.6", "D.0.8", "E.1.0"], "answer": "C", "explanation": "高效高通量透析器的β2-微球蛋白滤过系数＞0.6。"}, {"text": "血液灌流清除体内毒素的主要机制是？", "options": ["A.弥散", "B.对流", "C.吸附", "D.渗透", "E.超滤"], "answer": "C", "explanation": "血液灌流主要依靠吸附清除毒素。"}, {"text": "血液透析（HD）清除体内毒素的主要机制是？", "options": ["A.吸附", "B.对流", "C.弥散", "D.离心", "E.沉淀"], "answer": "C", "explanation": "血液透析主要依靠弥散清除毒素。"}, {"text": "体内毒素清除机制中，与对流相对应的治疗方式是？", "options": ["A.HD", "B.HF", "C.HP", "D.HF+HP", "E.SF"], "answer": "B", "explanation": "与对流相对应的治疗方式为HF（血液滤过）。"}, {"text": "体内毒素清除机制中，与吸附相对应的治疗方式是？", "options": ["A.HD", "B.SF", "C.HP", "D.HFHD", "E.HDF"], "answer": "C", "explanation": "与吸附相对应的治疗方式为HP（血液灌流）。"}, {"text": "血液透析中抗凝剂选择的主要依据是？", "options": ["A.出血与血栓栓塞风险评估", "B.患者的年龄", "C.透析器的面积", "D.患者的体重", "E.血流量大小"], "answer": "A", "explanation": "抗凝剂选择依据为出血与血栓栓塞风险评估。"}, {"text": "监测抗凝治疗时需关注的主要指标是？", "options": ["A.血小板与凝血象（PT、APTT）", "B.血肌酐与尿素氮", "C.血钾与血钠", "D.血红蛋白与白蛋白", "E.血糖与血脂"], "answer": "A", "explanation": "抗凝治疗的主要监测指标为血小板、凝血象（PT、APTT）以及止血与抗凝药物使用情况。"}, {"text": "已有活动性出血的血液透析患者，应选择的抗凝方式是？", "options": ["A.普通肝素", "B.低分子肝素", "C.无肝素法", "D.枸橼酸抗凝", "E.体外肝素"], "answer": "C", "explanation": "已有活动性出血者采用无肝素法。"}, {"text": "抗凝剂过量最可能导致的不良后果是？", "options": ["A.出血", "B.血栓", "C.溶血", "D.低血压", "E.失衡综合征"], "answer": "A", "explanation": "抗凝剂过量导致出血，抗凝剂不足则导致血栓。"}, {"text": "抗凝剂不足最可能导致的不良后果是？", "options": ["A.出血", "B.血栓", "C.溶血", "D.低血压", "E.空气栓塞"], "answer": "B", "explanation": "抗凝剂不足会导致血栓形成，透析过程中发现血栓应及时与医生沟通。"}, {"text": "血液透析中静脉压过高时应考虑？", "options": ["A.凝血、肿胀", "B.出血", "C.出血不畅", "D.低血压", "E.溶血"], "answer": "A", "explanation": "静脉压过高考虑凝血、肿胀；静脉压过低考虑出血、出血不畅。"}, {"text": "血液透析中静脉压过低时应考虑？", "options": ["A.凝血", "B.肿胀", "C.出血、出血不畅", "D.失衡综合征", "E.溶血"], "answer": "C", "explanation": "静脉压过低考虑出血、出血不畅。"}, {"text": "关于跨膜压（TMP）的影响因素，正确的一项是？", "options": ["A.脱水速度对TMP有直接影响", "B.增加血流量可升高TMP", "C.减少置换液量可升高TMP", "D.血液浓缩时TMP降低", "E.延长治疗时间可升高TMP"], "answer": "A", "explanation": "脱水速度对TMP有直接影响，随着血液浓缩TMP增加。"}, {"text": "透析器凝血时，跨膜压（TMP）的变化是？", "options": ["A.增高", "B.降低", "C.不变", "D.先降低后增高", "E.无规律波动"], "answer": "A", "explanation": "凝血时透析器滤过性能下降，TMP增高，需及时处理。"}, {"text": "为降低跨膜压（TMP），可采取的措施是？", "options": ["A.增加置换液量", "B.增加血流量", "C.加快脱水速度", "D.缩短治疗时间", "E.减少血流量"], "answer": "B", "explanation": "增加血流量、减少置换液量、延长治疗时间（降低脱水速度）均可降低TMP。"}, {"text": "电导度与透析液中哪种离子浓度有对应关系？", "options": ["A.钠", "B.钾", "C.钙", "D.氯", "E.镁"], "answer": "A", "explanation": "电导度与钠浓度有对应关系，且这种关系与配方相关。"}, {"text": "电导度通过对血液渗透压的影响，可以改变的是？", "options": ["A.血浆再充盈率", "B.血红蛋白浓度", "C.血小板计数", "D.凝血酶原时间", "E.血肌酐水平"], "answer": "A", "explanation": "电导度通过对血液渗透压的影响，改变血浆再充盈率。"}, {"text": "长期血液透析患者应多久复查一次乙型、丙型肝炎病毒、梅毒和HIV？", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每12个月1次", "E.每24个月1次"], "answer": "C", "explanation": "长期透析患者应每6个月检查1次乙型和丙型肝炎病毒、梅毒和HIV，保留原始记录并登记。"}, {"text": "血液透析患者透析前应完成的检测项目是？", "options": ["A.乙肝、丙肝、梅毒和HIV血清学指标", "B.甲型肝炎病毒抗体", "C.戊型肝炎病毒抗体", "D.EB病毒抗体", "E.巨细胞病毒抗体"], "answer": "A", "explanation": "透析前需检测乙型和丙型肝炎病毒、梅毒和HIV的血清学指标。"}, {"text": "血液透析患者透析间期的体重增长应控制在多少以内？", "options": ["A.1%", "B.3%", "C.5%", "D.7%", "E.10%"], "answer": "B", "explanation": "透析间期体重增长应控制3%以内。"}, {"text": "血液透析患者透析间期的体重增长最大不超过？", "options": ["A.3%", "B.5%", "C.7%", "D.10%", "E.15%"], "answer": "B", "explanation": "透析间期体重增长应控制3%以内，最大不超过5%。"}, {"text": "干体重的含义是？", "options": ["A.透析病人的理想体重，既无潴留也无脱水", "B.透析前的实际体重", "C.透析后的最低体重", "D.患者入院时的体重", "E.按身高推算的标准体重"], "answer": "A", "explanation": "干体重是血液透析病人的理想体重，既没有水的潴留，也没有脱水，也称目标体重。"}, {"text": "判断干体重时观察病人面容，主要关注的是？", "options": ["A.眼睑、面部和下肢水肿", "B.皮肤颜色深浅", "C.结膜有无出血", "D.瞳孔大小", "E.口唇有无发绀"], "answer": "A", "explanation": "判断干体重需看面容有无眼睑水肿、面部水肿、下肢水肿。"}, {"text": "透析机误差超过多少时，应立刻暂停该透析机使用并做超滤定标？", "options": ["A.100ml", "B.200ml", "C.300ml", "D.500ml", "E.1000ml"], "answer": "D", "explanation": "机器误差＞500ml时需立即暂停该透析机使用，并做超滤定标。"}, {"text": "脱水速度是导致哪种情况的关键参数？", "options": ["A.低血容量", "B.高钾血症", "C.溶血", "D.失衡综合征", "E.空气栓塞"], "answer": "A", "explanation": "脱水速度是导致低血容量的关键参数，应平稳超滤。"}, {"text": "血液透析过程中对通路及管路的巡视要求是？", "options": ["A.每小时必须巡视一次", "B.每2小时巡视一次", "C.每4小时巡视一次", "D.仅在治疗开始时查看", "E.仅在治疗结束时查看"], "answer": "A", "explanation": "每小时必须巡视通路情况、透析器及管路，及时发现出血、肿胀、漏液等情况。"}, {"text": "透析中进食、补液、如厕及回水量，属于未达目标体重的哪类原因？", "options": ["A.未完成治疗", "B.设置错误", "C.透中摄入", "D.称重错误", "E.机器误差"], "answer": "C", "explanation": "透中摄入包括治疗中进食、补液、如厕及回水量，是未达目标体重的常见原因之一。"}]}, {"type": "multiple", "questions": [{"text": "血液透析适应症中，属于「伴有危重情况的肾衰竭」的有？", "options": ["Ａ.药物不能控制的严重高钾血症", "Ｂ.药物不能控制的代谢性酸中毒", "Ｃ.尿毒症性心包炎", "Ｄ.尿毒症性脑病", "Ｅ.单纯性夜尿增多"], "answer": "ABCD", "explanation": "伴有危重情况的肾衰竭包括药物不能控制的严重高钾血症或代谢性酸中毒、水钠潴留（少尿、心力衰竭、高度水肿、高血压）以及尿毒症性心包炎、尿毒症性胸膜炎、尿毒症性脑病；单纯性夜尿增多不属于此类适应症。"}, {"text": "炎症因子介导、需要血液透析治疗的危重疾病包括？", "options": ["Ａ.急性出血坏死性胰腺炎", "Ｂ.急性呼吸窘迫综合征", "Ｃ.脓毒血症", "Ｄ.多脏器功能障碍综合征", "Ｅ.单纯性甲状腺肿"], "answer": "ABCD", "explanation": "炎症因子介导的危重疾病包括急性出血坏死性胰腺炎、急性呼吸窘迫综合征、脓毒血症和多脏器功能障碍综合征；单纯性甲状腺肿不在此列。"}, {"text": "血液透析的相对禁忌症包括？", "options": ["Ａ.药物难以纠正的严重休克", "Ｂ.严重心肌病变并难治性心力衰竭", "Ｃ.活动性出血", "Ｄ.颅内出血或颅内压增高", "Ｅ.轻度高血压"], "answer": "ABCD", "explanation": "相对禁忌症包括药物难以纠正的严重休克、严重心肌病变并难治性心力衰竭、活动性出血（抗凝剂的使用）、颅内出血或颅内压增高以及精神障碍不能配合治疗；轻度高血压不属于禁忌症。"}, {"text": "血液透析上机及监测中需要设置的参数包括？", "options": ["Ａ.血流量", "Ｂ.治疗时间", "Ｃ.目标脱水量和脱水速度", "Ｄ.电导度", "Ｅ.患者家庭住址"], "answer": "ABCD", "explanation": "上机及监测参数包括通路、抗凝剂用量、血流量、目标脱水量和脱水速度、治疗时间、透析器、透析液参数、置换液量与方式、动脉压、静脉压、TMP、电导度等。"}, {"text": "血液透析的血管通路包括？", "options": ["Ａ.直穿", "Ｂ.临时中心静脉置管", "Ｃ.带涤纶鞘管的中心静脉置管", "Ｄ.自体动静脉内瘘", "Ｅ.外周浅静脉留置针"], "answer": "ABCD", "explanation": "通路包括直穿、临时中心静脉置管、带涤纶鞘管的中心静脉置管、自体动静脉内瘘和人工动静脉内瘘；外周浅静脉留置针不能作为透析通路。"}, {"text": "透析通路护理的安全要点包括？", "options": ["Ａ.管路连接紧密", "Ｂ.警惕大出血", "Ｃ.每小时巡视通路情况", "Ｄ.及时发现出血、肿胀、漏液", "Ｅ.每班更换透析器"], "answer": "ABCD", "explanation": "通路安全要求连接紧密、警惕大出血，每小时必须巡视通路情况、透析器及管路，及时发现出血、肿胀、漏液等情况；透析器不需按班次常规更换。"}, {"text": "属于血液透析相关治疗方式的有？", "options": ["Ａ.HD（血液透析）", "Ｂ.SF（单纯超滤）", "Ｃ.HP（血液灌流）", "Ｄ.HDF（血液透析滤过）", "Ｅ.腹膜透析"], "answer": "ABCD", "explanation": "血液透析相关方式包括HD、HFHD（高通量血液透析）、SF（单纯超滤）、HP（血液灌流）、HDF（血液透析滤过，含前置换与后置换）；腹膜透析不属于血液透析治疗方式。"}, {"text": "体内毒素清除的主要机制包括？", "options": ["Ａ.弥散", "Ｂ.对流", "Ｃ.吸附", "Ｄ.渗透", "Ｅ.沉淀"], "answer": "ABC", "explanation": "体内毒素清除机制有弥散、对流和吸附三种；渗透与沉淀不是血液净化清除毒素的机制。"}, {"text": "血液透析常用的抗凝方式包括？", "options": ["Ａ.普通肝素", "Ｂ.低分子肝素", "Ｃ.萘莫司他", "Ｄ.枸橼酸", "Ｅ.华法林"], "answer": "ABCD", "explanation": "抗凝方式包括普通肝素、低分子肝素、体外肝素、萘莫司他、枸橼酸和无肝素；华法林不用于透析中的体外抗凝。"}, {"text": "重度出血倾向的血液透析患者，可选择的抗凝方式是？", "options": ["Ａ.体外肝素", "Ｂ.萘莫司他", "Ｃ.枸橼酸抗凝", "Ｄ.普通肝素", "Ｅ.低分子肝素"], "answer": "ABC", "explanation": "重度出血倾向者可选用体外肝素、萘莫司他、枸橼酸抗凝；普通肝素和低分子肝素出血风险高，不宜选用。"}, {"text": "选择抗凝剂时需参考的主要指标包括？", "options": ["Ａ.血小板计数", "Ｂ.凝血象（PT、APTT）", "Ｃ.止血与抗凝药物使用情况", "Ｄ.血钾水平", "Ｅ.血清白蛋白"], "answer": "ABC", "explanation": "抗凝剂选择的主要指标为血小板、凝血象（PT、APTT）以及止血与抗凝药物情况；血钾和血清白蛋白不作为抗凝剂选择的依据。"}, {"text": "关于血液透析血流量的说法，正确的有？", "options": ["Ａ.血流量越大清除率越高", "Ｂ.低血流量增加凝血风险", "Ｃ.高血流量应使用合适的穿刺针", "Ｄ.通路供血能力不足会导致血流量不足", "Ｅ.血流量越大越好，无需考虑心功能"], "answer": "ABCD", "explanation": "血流量越大清除率越高，但并非越大越好，需考虑心功能能否耐受；低血流量增加凝血风险，高血流量应使用合适的穿刺针，血流量应与通路供血能力相符。"}, {"text": "血液透析的透析液参数包括？", "options": ["Ａ.血钙浓度", "Ｂ.血钾浓度", "Ｃ.透析液温度", "Ｄ.透析液流量", "Ｅ.凝血酶原时间"], "answer": "ABCD", "explanation": "透析液参数包括血钙、血钾、流量和温度；凝血酶原时间属于抗凝监测指标，不是透析液参数。"}, {"text": "关于置换液流量，正确的有？", "options": ["Ａ.前置换为血流量的1/2", "Ｂ.前置换约为100ml/min", "Ｃ.后置换为血流量的1/3", "Ｄ.后置换约为60ml/min", "Ｅ.后置换约为100ml/min"], "answer": "ABCD", "explanation": "前置换为血流量的1/2（约100ml/min），后置换为血流的1/3（约60ml/min）。"}, {"text": "透析器参数包括？", "options": ["Ａ.透析器材料", "Ｂ.膜面积", "Ｃ.透析系数", "Ｄ.价格", "Ｅ.患者体重"], "answer": "ABCD", "explanation": "透析器参数包括材料、面积、透析系数和价格；患者体重不属于透析器参数。"}, {"text": "判断干体重可依据的内容包括？", "options": ["Ａ.面容有无眼睑、面部、下肢水肿", "Ｂ.有无呼吸困难及肺部湿啰音、哮鸣音", "Ｃ.透析后血压能否维持正常范围", "Ｄ.胸片中心脏大小及有无胸水", "Ｅ.患者的身高"], "answer": "ABCD", "explanation": "判断干体重需观察面容水肿、水钠潴留症状、透析后血压，并结合胸片和超声心动图结果；身高不作为判断依据。"}, {"text": "未达目标体重的常见原因包括？", "options": ["Ａ.未完成治疗", "Ｂ.设置错误", "Ｃ.透中摄入", "Ｄ.称重错误", "Ｅ.透析液温度过高"], "answer": "ABCD", "explanation": "未达目标体重的常见原因为未完成治疗、设置错误、透中摄入、称重错误和机器误差（＞500ml）；透析液温度过高不是原因。"}, {"text": "会使跨膜压（TMP）增高的因素包括？", "options": ["Ａ.脱水速度过快", "Ｂ.血液浓缩", "Ｃ.透析器凝血", "Ｄ.增加血流量", "Ｅ.减少置换液量"], "answer": "ABC", "explanation": "脱水速度过快、血液浓缩和透析器凝血均使TMP增高；增加血流量和减少置换液量可降低TMP。"}, {"text": "关于电导度，正确的说法有？", "options": ["Ａ.电导度是医嘱", "Ｂ.电导度与钠浓度有对应关系", "Ｃ.电导度与钠浓度的关系与配方相关", "Ｄ.电导度可影响血浆再充盈率", "Ｅ.电导度与血肌酐水平直接相关"], "answer": "ABCD", "explanation": "电导度是医嘱，与钠浓度有对应关系且与配方相关，通过影响血液渗透压改变血浆再充盈率，并可设置浓度曲线以保障血容量稳定；电导度与血肌酐水平无直接关系。"}, {"text": "血液净化中心感染防控与人员配备的要求包括？", "options": ["Ａ.各隔离透析区之间建立规范的物理隔离", "Ｂ.隔离透析区内物品专区专用", "Ｃ.需隔离的传染病患者在隔离治疗区专机透析", "Ｄ.设置20台以上透析机应配备专职技师1名", "Ｅ.各透析区之间护士和透析机无需相对固定"], "answer": "ABCD", "explanation": "各隔离透析区应建立规范物理隔离、物品专区专用，需隔离患者在隔离透析治疗区专机透析；设置20台以上透析机的血液净化中心应配备1名专职技师，各透析治疗区之间的护士和透析机应相对固定。"}]}, {"type": "short", "questions": [{"text": "简述血液透析的适应症。", "options": [], "answer": "1.伴有危重情况的肾衰竭：药物不能控制的严重高钾血症或代谢性酸中毒；水钠潴留，表现为少尿、心力衰竭、高度水肿、高血压；尿毒症性心包炎、尿毒症性胸膜炎、尿毒症性脑病。2.eGFR＜15ml/min/1.73m²时根据临床表现决定透析时机，eGFR＜5ml/min/1.73m²时必须透析。3.炎症因子介导的危重疾病：急性出血坏死性胰腺炎、急性呼吸窘迫综合征、脓毒血症、多脏器功能障碍综合征。", "explanation": "血液透析适应症分为危重肾衰竭、eGFR达到阈值以及炎症因子介导的危重疾病三类，其中eGFR＜5ml/min/1.73m²为必须透析的界值。"}, {"text": "简述血液透析的相对禁忌症。", "options": [], "answer": "1.药物难以纠正的严重休克；2.严重心肌病变并难治性心力衰竭；3.活动性出血，涉及抗凝剂的使用；4.颅内出血或颅内压增高；5.精神障碍不能配合血液透析治疗。", "explanation": "相对禁忌症包括严重休克、严重心肌病变并难治性心力衰竭、活动性出血、颅内出血或颅内压增高以及精神障碍不能配合治疗，临床需结合患者神志与出血风险综合判断。"}, {"text": "简述干体重的概念及临床判断依据。", "options": [], "answer": "干体重是指血液透析病人的理想体重，既没有水的潴留，也没有脱水，也称目标体重。判断依据：1.看病人面容，有无眼睑水肿、面部水肿、下肢水肿；2.看水钠潴留症状，有无呼吸困难，肺部听诊有无湿啰音、哮鸣音；3.看血压，透析后血压能否维持在正常范围内；4.拍胸片，看心脏大不大、肺部是否清晰、有无胸水；5.看超声心动图，了解心脏大小是否正常。", "explanation": "干体重是判断脱水目标的标准，临床上以干体重为标准决定脱水量，一般认为涨多少脱多少并定期调整，透析间期体重增长应控制3%以内、最大不超过5%。"}, {"text": "简述血液透析抗凝剂的选择依据、常用抗凝方式及特殊情况的处理。", "options": [], "answer": "选择依据是出血与血栓栓塞风险评估，主要参考指标为血小板、凝血象（PT、APTT）以及止血与抗凝药物使用情况。常用抗凝方式有普通肝素、低分子肝素、体外肝素、萘莫司他、枸橼酸和无肝素。特殊情况处理：重度出血倾向者选用体外肝素、萘莫司他、枸橼酸抗凝；已有活动性出血者采用无肝素法。", "explanation": "抗凝剂过量可致出血、不足可致血栓，透析过程中若发现出血或血栓应及时与医生沟通，并避免习惯性使用低分子肝素。"}, {"text": "简述血液透析中静脉压与跨膜压（TMP）异常的临床意义及处理原则。", "options": [], "answer": "静脉压过高考虑凝血、肿胀，过低考虑出血、出血不畅。跨膜压方面：脱水速度对TMP有直接影响，随着血液浓缩TMP增加；凝血时透析器滤过性能下降，TMP增高。降低TMP的措施包括延长治疗时间以降低脱水速度、减少置换液量、增加血流量。TMP高时应考虑滤器凝血并及时处理。", "explanation": "静脉压和跨膜压是透析中反映管路与滤器状态的重要监测参数，静脉压过低提示出血风险，TMP增高提示滤器凝血，均需及时评估和处置。"}]}]}, {"num": 9, "title": "血液净化中心信息化管理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "信息化管理是指采用具备信息获取、信息传递、信息处理、信息再生和信息利用等功能的工具进行管理，其中所用的核心工具是（  ）", "options": ["A.以纸质台账为主的记录工具", "B.以人工统计为主的核算工具", "C.以计算机为主的信息化工具", "D.以电话随访为主的联络工具", "E.以手工签名为主的核对工具"], "answer": "C", "explanation": "信息化管理是指采用具备信息获取、信息传递、信息处理、信息再生和信息利用等功能，以计算机为主的信息化工具进行管理。"}, {"text": "血液净化中心信息化管理是利用现代信息技术和下列哪项技术对血液透析治疗全过程进行管理（  ）", "options": ["A.物联网技术", "B.基因检测技术", "C.影像重建技术", "D.细胞培养技术", "E.激光消融技术"], "answer": "A", "explanation": "血液净化中心信息化管理指利用现代信息技术和物联网技术对血液透析治疗全过程进行数字化、智能化和标准化管理的一种新模式。"}, {"text": "血液净化中心信息化管理从根本上改变的传统医疗流程特点是（  ）", "options": ["A.以电话随访为主", "B.以人工核对为主", "C.以纸质记录和人工操作为主", "D.以电子病历和自动采集为主", "E.以自助服务和实时监控为主"], "answer": "C", "explanation": "血液净化中心信息化管理从根本上改变了传统以纸质记录和人工操作为主的医疗流程，通过集成化的信息管理系统实现全方位数字化管理。"}, {"text": "下列不属于血液净化中心信息化管理作用的是（  ）", "options": ["A.提高医疗质量", "B.减少医疗差错", "C.降低医疗成本", "D.促进医学研究及教育", "E.减少患者必需的透析次数"], "answer": "E", "explanation": "血液净化中心信息化管理的作用包括提高医疗质量、减少医疗差错、降低医疗成本、改善工作流程、提高患者体验和促进医学研究及教育，不会减少患者必需的透析治疗次数。"}, {"text": "信息化系统自动采集记录治疗数据、自动收集质控数据并生成符合国家标准的质控报告，主要体现的作用是（  ）", "options": ["A.减少医疗差错", "B.降低医疗成本", "C.提高医疗质量", "D.改善工作流程", "E.促进医学研究及教育"], "answer": "C", "explanation": "提高医疗质量表现为：信息化系统自动采集和记录治疗数据，减少医护人员手工记录和重复性工作、显著降低工作负荷；系统自动收集质控数据，生成符合国家标准的质控报告，便于科室和医院管理层科学决策。"}, {"text": "通过标准化流程、闭环管理和实时监控减少医疗差错、提高治疗安全性，体现的信息化管理作用是（  ）", "options": ["A.提高医疗质量", "B.减少医疗差错", "C.降低医疗成本", "D.提高患者体验", "E.促进医学研究及教育"], "answer": "B", "explanation": "减少医疗差错表现为：通过标准化流程、闭环管理和实时监控减少医疗差错，提高治疗安全性。"}, {"text": "智能化排队叫号系统、自助报到设备和电子床头屏显示主要提升的是（  ）", "options": ["A.医疗质量", "B.医疗安全", "C.医疗成本控制", "D.患者体验", "E.医学研究能力"], "answer": "D", "explanation": "提高患者体验表现为：智能化排队叫号系统、自助报到设备和电子床头屏显示，使治疗过程更加有序、透明，提升患者满意度。"}, {"text": "传统管理模式下数据记录的特点主要是（  ）", "options": ["A.手工纸质记录，易错难保存", "B.自动采集电子化，准确易查询", "C.实时监控预警，标准化可追溯", "D.智能排班与流程优化，高效有序", "E.自助服务，实时信息，体验良好"], "answer": "A", "explanation": "传统管理模式的数据记录为手工纸质记录，易错难保存；信息化管理模式的数据记录自动采集电子化，准确易查询。"}, {"text": "传统管理模式下流程管理的特点主要是（  ）", "options": ["A.智能排班与流程优化，高效有序", "B.依赖人工安排，效率低下", "C.实时监控预警，标准化可追溯", "D.闭环管理，交叉核对，安全性高", "E.自助服务，实时信息，体验良好"], "answer": "B", "explanation": "传统管理模式的流程管理依赖人工安排，效率低下；信息化管理模式则实现智能排班与流程优化，高效有序。"}, {"text": "传统管理模式下质量控制的特点主要是（  ）", "options": ["A.实时监控预警，标准化可追溯", "B.自动采集电子化，准确易查询", "C.事后手动统计，滞后不全面", "D.闭环管理，交叉核对，安全性高", "E.自助服务，实时信息，体验良好"], "answer": "C", "explanation": "传统管理模式的质量控制为事后手动统计，滞后且不全面；信息化管理模式则实时监控预警，标准化可追溯。"}, {"text": "传统管理模式下医疗安全的特点主要是（  ）", "options": ["A.闭环管理，交叉核对，安全性高", "B.实时监控预警，标准化可追溯", "C.智能排班与流程优化，高效有序", "D.依赖人工核对，风险较高", "E.自助服务，实时信息，体验良好"], "answer": "D", "explanation": "传统管理模式的医疗安全依赖人工核对，风险较高；信息化管理模式通过闭环管理、交叉核对，安全性高。"}, {"text": "传统管理模式下患者体验的特点主要是（  ）", "options": ["A.自助服务，实时信息，体验良好", "B.等待时间长，信息不透明", "C.智能排班与流程优化，高效有序", "D.实时监控预警，标准化可追溯", "E.依赖人工核对，风险较高"], "answer": "E", "explanation": "传统管理模式的患者体验为等待时间长、信息不透明；信息化管理模式则提供自助服务与实时信息，体验良好。"}, {"text": "我国慢性肾脏病的患病率接近（  ）", "options": ["A.5.8%", "B.10.8%", "C.15.8%", "D.18.7%", "E.20.8%"], "answer": "B", "explanation": "我国慢性肾脏病的患病率接近10.8%，40岁以上人群高达18.7%，约300万人需透析。"}, {"text": "我国40岁以上人群慢性肾脏病的患病率高达（  ）", "options": ["A.8.8%", "B.10.8%", "C.15.8%", "D.18.7%", "E.28.7%"], "answer": "D", "explanation": "我国慢性肾脏病患病率接近10.8%，其中40岁以上人群患病率高达18.7%。"}, {"text": "我国需要接受透析治疗的患者约为（  ）", "options": ["A.10万人", "B.100万人", "C.300万人", "D.500万人", "E.1000万人"], "answer": "C", "explanation": "我国慢性肾脏病的患病率接近10.8%，40岁以上人群高达18.7%，约300万人需透析。"}, {"text": "2025年底我国血液透析患者已经超过（  ）", "options": ["A.20万", "B.30万", "C.50万", "D.80万", "E.100万"], "answer": "E", "explanation": "我国慢性肾脏病患病率接近10.8%，40岁以上人群高达18.7%，300万人需透析，2025年底血液透析患者已经超过100万。"}, {"text": "随着透析诊疗量猛增，血液透析设备量增长的速度是（  ）", "options": ["A.10~20%", "B.20~30%", "C.30~40%", "D.40~50%", "E.50~60%"], "answer": "D", "explanation": "透析诊疗患者量逐年猛增，设备量以每年40~50%的速度在增长。"}, {"text": "透析诊疗逐步纳入医保范围、患者诊疗量逐年猛增，始于哪一年启动的新一轮医改政策（  ）", "options": ["A.2002年", "B.2005年", "C.2009年", "D.2012年", "E.2015年"], "answer": "C", "explanation": "在2009年新一轮的医改政策中，透析诊疗逐步纳入医保范围内，患者诊疗量逐年猛增。"}, {"text": "目前血液净化中心信息化建设在市场层面面临的现状是（  ）", "options": ["A.软件繁多，平台建设层次不齐", "B.软件单一，平台水平整齐", "C.无软件可用，全靠手工记录", "D.软件均由医院自研，标准统一", "E.软件仅用于科研，不用于临床"], "answer": "A", "explanation": "目前市场上各种信息化软件繁多，各医院信息化平台建设层次不齐，这是血液净化中心信息化建设面临的市场现状。"}, {"text": "血液透析管理指标要求对血液透析机台数、专职医师和专职护理人员建立电子档案，同时建立血液透析机的（  ）", "options": ["A.纸质排班表", "B.使用维护记录", "C.费用明细表", "D.患者知情同意书", "E.检验申请单"], "answer": "B", "explanation": "血液透析基本指标要求对血液透析机台数、专职医师与专职护理人员建立电子档案，并建立血液透析机档案及使用维护记录。"}, {"text": "年度血透治疗总例次统计中，下列不属于其涵盖治疗方式的是（  ）", "options": ["A.普通血透HD", "B.高通量血液透析HHD", "C.血液透析滤过HDF", "D.腹膜透析", "E.血浆置换例次"], "answer": "D", "explanation": "年度（目标时间段内）血透治疗总例次包括普通血透HD、高通量血液透析HHD、血液透析滤过HDF、血液滤过HF、单纯超滤UF、血液灌流HP和血浆置换例次；腹膜透析例次不在其中。"}, {"text": "年度血透治疗总例次统计中，缩写HDF代表的治疗方式是（  ）", "options": ["A.普通血透", "B.高通量血液透析", "C.血液透析滤过", "D.血液滤过", "E.血液灌流"], "answer": "C", "explanation": "年度血透治疗总例次中的HDF指血液透析滤过；HD为普通血透，HHD为高通量血液透析，HF为血液滤过，HP为血液灌流。"}, {"text": "年度维持性血透患者的死亡例数与透析1年内死亡率属于血液透析管理指标中的（  ）", "options": ["A.血液透析基本指标", "B.维持性血透患者质量监测指标", "C.感染控制管理指标", "D.并发症管理指标", "E.透析充分性管理指标"], "answer": "A", "explanation": "年度（目标时间段内）维持性血透患者的死亡例数与年度维持血透患者透析1年内死亡率属于血液透析基本指标。"}, {"text": "年度血透中严重并发症发生例次的记录要求是（  ）", "options": ["A.由患者自行上报", "B.每月由科室汇总一次", "C.每次透析中记录，发生1次记1例次", "D.每季度由质控中心补录", "E.出院时一次性统计"], "answer": "C", "explanation": "年度血透中严重（可能严重危及患者生命）并发症发生例次，由每次透析过程中护士或医生进行记录，每次透析过程中发生记为1例次。"}, {"text": "下列不属于血透中严重并发症类型的是（  ）", "options": ["A.透析中低血压", "B.肌肉痉挛", "C.体外循环凝血", "D.空气栓塞", "E.高血压控制率"], "answer": "E", "explanation": "血透中严重并发症类型包括透析中低血压、肌肉痉挛、恶心和呕吐、头痛、胸痛和背痛、皮肤骚痒、失衡综合征、透析器反应、心律失常、溶血、空气栓塞、发热、透析器破膜、体外循环凝血、心衰等；高血压控制率属于并发症管理中的控制率指标。"}, {"text": "年度血透患者乙肝病毒表面抗原或E抗原转阳病例数的判定依据是（  ）", "options": ["A.患者自述", "B.护理交班记录", "C.实验室检查", "D.影像学检查", "E.透析机报警记录"], "answer": "C", "explanation": "年度血透患者乙肝病毒表面抗原或E抗原转阳病例数以及丙肝病毒抗体或抗原转阳病例数均依据实验室检查判定。"}, {"text": "血液透析管理指标中，可复用透析器复用率与平均复用次数的处理方式是（  ）", "options": ["A.本单位无复用，但保留报表位置", "B.本单位常规复用，需重点上报", "C.不作统计，直接忽略该项", "D.仅统计复用次数，不统计复用率", "E.由患者自行填报"], "answer": "A", "explanation": "血液透析基本指标要求统计年度（目标时间段内）可复用透析器复用率与平均复用次数，本单位无复用，但保留报表位置。"}, {"text": "维持性血透患者质量监测指标中，尿素下降率URR的达标值是（  ）", "options": ["A.&gt;55%", "B.&gt;60%", "C.&gt;65%", "D.&gt;70%", "E.&gt;75%"], "answer": "C", "explanation": "维持性血透患者质量监测指标要求统计年度（目标时间段内）溶质清除（尿素下降率URR&gt;65%）的例数。"}, {"text": "维持性血透患者质量监测指标中，肾性贫血纠正达标要求血红蛋白达到（  ）", "options": ["A.≥90g/L", "B.≥100g/L", "C.≥120g/L", "D.≥110g/L", "E.≥130g/L"], "answer": "D", "explanation": "维持性血透患者质量监测指标中，肾性贫血的纠正标准为血红蛋白≥110g/L。"}, {"text": "维持性血透患者质量监测指标中，钙磷代谢达标要求钙磷乘积（  ）", "options": ["A.&lt;45mg2/dl2", "B.&lt;55mg2/dl2", "C.&lt;60mg2/dl2", "D.&lt;65mg2/dl2", "E.&lt;75mg2/dl2"], "answer": "B", "explanation": "维持性血透患者质量监测指标中，钙磷代谢达标要求钙磷乘积&lt;55mg2/dl2。"}, {"text": "维持性血透患者质量监测指标中，继发性甲状旁腺功能亢进的血清甲状旁腺素范围是（  ）", "options": ["A.50~150ng/dl", "B.150~350ng/dl", "C.100~300ng/dl", "D.300~500ng/dl", "E.500~800ng/dl"], "answer": "C", "explanation": "维持性血透患者质量监测指标中，继发性甲状旁腺功能亢进指血清甲状旁腺素（iPTH）为100~300ng/dl。"}, {"text": "维持性血透患者质量监测指标中的血管通路统计，中心静脉血透导管包括（  ）", "options": ["A.无隧道无涤纶环及带隧道带涤纶环的导管", "B.仅无隧道无涤纶环的导管", "C.仅带隧道带涤纶环的导管", "D.动静脉直接穿刺通路", "E.人造血管移植通路"], "answer": "A", "explanation": "血管通路统计中，中心静脉血透导管例次包括无隧道无涤纶环的导管与带隧道带涤纶环的导管。"}, {"text": "维持性血透患者质量监测指标中，血管通路的记录方式是（  ）", "options": ["A.每季度由护士长汇总", "B.依据患者自述登记", "C.每次透析记录中体现通路类型", "D.依据手术记录统计", "E.依据医保结算数据统计"], "answer": "C", "explanation": "维持性血透患者质量监测指标中，血管通路通过每次透析记录，记录单上体现通路类型，据此统计动静脉内瘘、中心静脉血透导管、动静脉直接穿刺及其他血管通路例次。"}, {"text": "血液透析治疗室消毒合格率考核的3个项目是（  ）", "options": ["A.空气消毒、物表消毒和医务手卫生", "B.透析液、透析用水和透析器", "C.病历、处方和知情同意书", "D.设备、耗材和药品", "E.健康教育、随访和复诊"], "answer": "A", "explanation": "感染控制管理中，血液透析治疗室消毒合格率的3个项目为空气消毒、物表消毒和医务手卫生。"}, {"text": "透析用水生物污染检验合格率的检验频次是（  ）", "options": ["A.每周一次", "B.每月一次", "C.每季度一次", "D.一年一次", "E.每两年一次"], "answer": "D", "explanation": "感染控制管理中，透析用水生物污染检验合格率的检验频次为一年一次。"}, {"text": "新入透析患者需完成的病毒标志物检测不包括（  ）", "options": ["A.乙肝病毒标志物", "B.丙肝病毒标志物", "C.梅毒螺旋体", "D.艾滋病毒", "E.流感病毒"], "answer": "E", "explanation": "感染控制管理要求新入透析患者完成乙肝病毒标志物、丙肝病毒标志物、梅毒螺旋体和艾滋病毒检测，流感病毒检测不在其列。"}, {"text": "维持性血液透析患者定时乙肝病毒标志物检测完成的频次是（  ）", "options": ["A.每1个月一次", "B.每6个月一次", "C.每12个月一次", "D.每2年一次", "E.每5年一次"], "answer": "B", "explanation": "感染控制管理要求维持性血液透析患者定时乙肝病毒标志物检测完成率，检测频次为6个月一次；丙肝、梅毒螺旋体和艾滋病毒的定时检测同样为6个月一次。"}, {"text": "并发症管理中血常规定时检验的完成频次是（  ）", "options": ["A.每1个月", "B.每6个月", "C.每3个月", "D.每12个月", "E.每2年"], "answer": "C", "explanation": "并发症管理要求血常规定时检验完成率，检验频次为3个月；血液生化定时检验的频次为3个月、1个月。"}, {"text": "并发症管理中血液生化定时检验的完成频次是（  ）", "options": ["A.3个月、1个月", "B.6个月、3个月", "C.12个月、6个月", "D.1个月、2周", "E.2年、1年"], "answer": "A", "explanation": "并发症管理要求血液生化定时检验完成率，检验频次为3个月、1个月。"}, {"text": "并发症管理中血清铁蛋白定时检验的完成频次是（  ）", "options": ["A.每1个月", "B.每6个月", "C.每3个月", "D.每12个月", "E.每2年"], "answer": "B", "explanation": "并发症管理要求血清铁蛋白定时检验完成率，检验频次为6个月；转铁蛋白饱和度、血清甲状旁腺素、血清前白蛋白和C反应蛋白的定时检验同样为6个月。"}, {"text": "下列不属于并发症管理中控制率类指标的是（  ）", "options": ["A.高血压控制率", "B.肾性贫血控制率", "C.血磷控制率", "D.血常规定时检验完成率", "E.透析用水生物污染检验合格率"], "answer": "D", "explanation": "并发症管理中的控制率类指标为高血压控制率、肾性贫血控制率和血磷控制率；血常规定时检验完成率属于定时检验完成率指标，透析用水生物污染检验合格率属于感染控制管理指标。"}, {"text": "维持性血液透析患者的尿素清除率Kt/V记录完成率、尿素下降率URR记录完成率及β2微球蛋白检验完成率，其记录或检验频次均为（  ）", "options": ["A.每1个月", "B.每3个月", "C.每6个月", "D.每12个月", "E.每2年"], "answer": "C", "explanation": "透析充分性管理要求维持性血液透析患者的尿素清除率（Kt/V）记录完成率、尿素下降率（URR）记录完成率和β2微球蛋白检验完成率均为6个月。"}, {"text": "尿素清除率计算公式spKt/V=-Ln（R-0.008t）+（4-3.5R）×（△BW / BW）中，R代表（  ）", "options": ["A.透后血尿素/透前血尿素", "B.透前血尿素/透后血尿素", "C.透后体重/透前体重", "D.超滤量/干体重", "E.透前血肌酐/透后血肌酐"], "answer": "A", "explanation": "尿素清除率计算公式spKt/V=-Ln（R-0.008t）+（4-3.5R）×（△BW / BW）中，R=透后血尿素/透前血尿素，时间单位为h，△BW为透后体重变化值（即超滤量，单位为L），BW为干体重（单位为Kg）。"}, {"text": "尿素下降率计算公式URR(%)=（C0-C）/C0×100%中，C0代表（  ）", "options": ["A.透后血清尿素水平", "B.透前血清肌酐水平", "C.透前血清尿素水平", "D.透前血红蛋白水平", "E.透后血清肌酐水平"], "answer": "C", "explanation": "尿素下降率计算公式URR(%)=（C0-C）/C0×100%中，C0为透前血清尿素水平，C为透后血清尿素水平。"}, {"text": "血液净化中心信息化系统网络架构中，用于与HIS、LIS、PACS等系统对接的接口引擎是（  ）", "options": ["A.HL7接口引擎", "B.SOAP协议引擎", "C.RFID识别引擎", "D.SPSS分析引擎", "E.OCR识别引擎"], "answer": "A", "explanation": "血液净化中心信息化系统网络架构中含有HL7接口引擎，用于与HIS、LIS、PACS等系统对接，同时接入数据采集器、称重器、血压器、透析机及中心服务器等。"}, {"text": "科室管理中的设备管理功能记录水处理维护时需包括的参数是（  ）", "options": ["A.血流量、超滤率", "B.水压、电导度等", "C.床位号、班次", "D.药品批号、效期", "E.患者体重、血压"], "answer": "B", "explanation": "设备管理功能支持透析设备基本信息维护、设备维修记录、水处理维护（水压、电导度等）以及水处理消毒记录（时间、浓度等）。"}, {"text": "血液透析耗材管理功能支持的预警类型是（  ）", "options": ["A.仅库存量预警", "B.仅有效期预警", "C.仅费用预警", "D.耗材有效期预警和库存量预警", "E.仅设备维保预警"], "answer": "D", "explanation": "耗材管理支持血透耗材条码化管理、耗材基本信息记录、耗材出入库查询，并支持耗材有效期预警和库存量预警。"}, {"text": "血液透析科室的数据处理功能支持与下列哪种统计分析软件对接（  ）", "options": ["A.SPSS", "B.LIS", "C.PACS", "D.HIS", "E.RFID"], "answer": "A", "explanation": "血液透析科室信息化系统强大的数据处理功能支持治疗结果对比趋势分析，并与SPSS分析软件对接，支持按项目等统计查询和与上报系统对接。"}, {"text": "专业化血液透析电子病历除传统病历信息外，还应包含的专科特有信息是（  ）", "options": ["A.血型", "B.婚姻状况", "C.联系电话", "D.血管通路史", "E.民族"], "answer": "D", "explanation": "专业化的血液透析电子病历不仅要包含传统的病历信息（现病史、既往史、传染病史等），还要包括专科特有的病历信息，如原发病诊断、病理诊断、原发病合并症、血管通路史等。"}, {"text": "全国血液透析病例信息登记系统与全国腹膜透析病例信息登记系统的主办单位之一是（  ）", "options": ["A.国家肾脏病医疗质量控制中心", "B.国家药品监督管理局", "C.国家医疗保障局", "D.省级卫生监督机构", "E.医院感染管理科"], "answer": "A", "explanation": "全国血液透析病例信息登记系统与全国腹膜透析病例信息登记系统的主办单位为卫生计生委医政医管局和国家肾脏病医疗质量控制中心。"}]}, {"type": "multiple", "questions": [{"text": "信息化管理的功能包括（  ）", "options": ["Ａ.信息获取", "Ｂ.信息虚构", "Ｃ.信息传递", "Ｄ.信息处理", "Ｅ.信息再生和信息利用"], "answer": "ACDE", "explanation": "信息化管理是指采用具备信息获取、信息传递、信息处理、信息再生和信息利用等功能，以计算机为主的信息化工具进行管理；信息虚构不属于信息化管理的功能。"}, {"text": "血液净化中心信息化管理的作用包括（  ）", "options": ["Ａ.提高医疗质量", "Ｂ.减少患者必需的透析治疗次数", "Ｃ.减少医疗差错", "Ｄ.降低医疗成本", "Ｅ.改善工作流程、提高患者体验"], "answer": "ACDE", "explanation": "血液净化中心信息化管理具有提高医疗质量、减少医疗差错、降低医疗成本、改善工作流程、提高患者体验以及促进医学研究及教育等作用，但不会减少患者必需的透析治疗次数。"}, {"text": "信息化管理模式的特点包括（  ）", "options": ["Ａ.自动采集电子化，准确易查询", "Ｂ.智能排班与流程优化，高效有序", "Ｃ.等待时间长，信息不透明", "Ｄ.实时监控预警，标准化可追溯", "Ｅ.闭环管理，交叉核对，安全性高"], "answer": "ABDE", "explanation": "信息化管理模式在数据记录、流程管理、质量控制、医疗安全方面分别表现为自动采集电子化、智能排班与流程优化、实时监控预警可追溯、闭环管理与交叉核对；等待时间长、信息不透明是传统管理模式患者体验的特点。"}, {"text": "血液净化中心信息化建设面临的困难包括（  ）", "options": ["Ａ.记录繁重、排班复杂", "Ｂ.信息孤岛、查询困难", "Ｃ.所有数据已实现自动上报", "Ｄ.设备难管理", "Ｅ.成果难展示"], "answer": "ABDE", "explanation": "血液净化中心信息化建设面临记录繁重、排班复杂、信息孤岛、查询困难、设备难管理、成果难展示等困难，如检查检验数据查询难、设备缺少科学管理、电子设备信息孤立、上报数据难和学术研究难；数据自动上报正是信息化建设要实现的目标，而非已实现的现状。"}, {"text": "血液净化中心智能化排床管理的功能包括（  ）", "options": ["Ａ.支持医护人员交班管理", "Ｂ.取消个性化排床导入", "Ｃ.智能化透析患者排床", "Ｄ.支持患者排床按周复制", "Ｅ.支持修改删除患者排床"], "answer": "ACDE", "explanation": "智能化排床管理支持医护人员交班管理、智能化透析患者排床、患者排床按周复制、修改删除患者排床以及个性化排床导入；个性化排床导入是系统支持的功能，不能被取消。"}, {"text": "专业化血液透析电子病历应包含的专科特有信息有（  ）", "options": ["Ａ.原发病诊断", "Ｂ.病理诊断", "Ｃ.原发病合并症", "Ｄ.患者民族与婚姻状况", "Ｅ.血管通路史"], "answer": "ABCE", "explanation": "专业化的血液透析电子病历除包含现病史、既往史、传染病史等传统病历信息外，还应包括原发病诊断、病理诊断、原发病合并症、血管通路史等专科特有信息；民族与婚姻状况属于患者基本信息，不是专科特有病历信息。"}, {"text": "血液透析管理指标中的血液透析基本指标包括（  ）", "options": ["Ａ.血液透析机台数及专职医护人员数", "Ｂ.维持性血透患者主观舒适度评价", "Ｃ.年度血透总例数与治疗总例次", "Ｄ.患者死亡例数与1年内死亡率", "Ｅ.血透中严重并发症发生例次"], "answer": "ACDE", "explanation": "血液透析基本指标包括透析机台数及专职医护人员数、年度血透总例数、年度血透治疗总例次、维持性血透患者死亡例数与透析1年内死亡率、严重并发症发生例次、乙肝及丙肝转阳病例数、转腹透与转肾移植例数、透析器复用率与平均复用次数；维持性血透患者主观舒适度评价属于维持性血透患者质量监测指标。"}, {"text": "年度血透治疗总例次统计涵盖的治疗方式有（  ）", "options": ["Ａ.普通血透HD", "Ｂ.高通量血液透析HHD", "Ｃ.血液透析滤过HDF", "Ｄ.腹膜透析", "Ｅ.血液灌流HP与血浆置换"], "answer": "ABCE", "explanation": "年度血透治疗总例次包括普通血透HD、高通量血液透析HHD、血液透析滤过HDF、血液滤过HF、单纯超滤UF、血液灌流HP和血浆置换例次；腹膜透析例次属于维持性血透患者质量监测指标。"}, {"text": "血透中严重并发症的类型包括（  ）", "options": ["Ａ.透析中低血压与肌肉痉挛", "Ｂ.高血压控制率", "Ｃ.恶心和呕吐、头痛", "Ｄ.胸痛和背痛、皮肤骚痒", "Ｅ.溶血、空气栓塞"], "answer": "ACDE", "explanation": "血透中严重并发症类型包括透析中低血压、肌肉痉挛、恶心和呕吐、头痛、胸痛和背痛、皮肤骚痒、失衡综合征、透析器反应、心律失常、溶血、空气栓塞、发热、透析器破膜、体外循环凝血、心衰；高血压控制率属于并发症管理中的控制率指标。"}, {"text": "血液透析基本指标中的转归类指标包括（  ）", "options": ["Ａ.年度血透转腹透例数", "Ｂ.年度血透转肾移植例数", "Ｃ.年度维持性血透患者死亡例数", "Ｄ.年度溶质清除例数", "Ｅ.年度钙磷代谢达标例数"], "answer": "ABC", "explanation": "年度血透转腹透例数和血透转肾移植例数均为血液透析基本指标中的转归指标，维持性血透患者死亡例数亦反映转归情况；溶质清除例数和钙磷代谢达标例数属于维持性血透患者质量监测指标。"}, {"text": "维持性血透患者质量监测指标包括（  ）", "options": ["Ａ.溶质清除，URR&gt;65%的例数", "Ｂ.肾性贫血纠正，血红蛋白≥110g/L", "Ｃ.透析用水生物污染检验合格率", "Ｄ.钙磷代谢达标例数", "Ｅ.继发性甲状旁腺功能亢进例数"], "answer": "ABDE", "explanation": "维持性血透患者质量监测指标包括溶质清除、肾性贫血纠正、钙磷代谢、继发性甲状旁腺功能亢进、血管通路、平均每名患者透析时间、患者主观舒适度评价和腹膜透析例次；透析用水生物污染检验合格率属于感染控制管理指标。"}, {"text": "维持性血透患者质量监测指标中的血管通路统计包括（  ）", "options": ["Ａ.动静脉内瘘例次", "Ｂ.中心静脉血透导管例次", "Ｃ.腹膜透析导管例次", "Ｄ.动静脉直接穿刺例次", "Ｅ.其他血管通路例次"], "answer": "ABDE", "explanation": "血管通路统计包括动静脉内瘘例次、中心静脉血透导管例次（无隧道无涤纶环的导管、带隧道带涤纶环的导管）、动静脉直接穿刺例次和其他血管通路例次；腹膜透析例次单独列于维持性血透患者质量监测指标，不属于血管通路类型。"}, {"text": "感染控制管理中的指标包括（  ）", "options": ["Ａ.血液透析治疗室消毒合格率", "Ｂ.透析用水生物污染检验合格率", "Ｃ.血清铁蛋白定时检验完成率", "Ｄ.新入透析患者病毒标志物检测完成率", "Ｅ.维持性血透患者定时检测完成率"], "answer": "ABDE", "explanation": "感染控制管理指标包括血液透析治疗室消毒合格率、透析用水生物污染检验合格率、新入透析患者乙肝与丙肝病毒标志物及梅毒螺旋体和艾滋病毒检测完成率、维持性血透患者定时检测完成率以及乙肝表面抗原阳性率、丙肝表面抗体阳性率和梅毒螺旋体阳性率；血清铁蛋白定时检验完成率属于并发症管理指标。"}, {"text": "维持性血液透析患者定时检测完成率所涉及的病原体有（  ）", "options": ["Ａ.乙肝病毒标志物", "Ｂ.流感病毒", "Ｃ.丙肝病毒标志物", "Ｄ.梅毒螺旋体", "Ｅ.艾滋病毒"], "answer": "ACDE", "explanation": "维持性血液透析患者定时检测完成率涉及乙肝病毒标志物、丙肝病毒标志物、梅毒螺旋体和艾滋病毒的检测，频次均为6个月一次；流感病毒检测不在其列。"}, {"text": "并发症管理中每6个月一次的定时检验项目有（  ）", "options": ["Ａ.血常规", "Ｂ.血清铁蛋白", "Ｃ.转铁蛋白饱和度", "Ｄ.血清甲状旁腺素（iPTH）", "Ｅ.血清前白蛋白与C反应蛋白"], "answer": "BCDE", "explanation": "并发症管理中每6个月一次的定时检验项目包括血清铁蛋白、转铁蛋白饱和度、血清甲状旁腺素（iPTH）、血清前白蛋白和C反应蛋白（CRP）；血常规定时检验的频次为3个月。"}, {"text": "并发症管理中的控制率类指标包括（  ）", "options": ["Ａ.高血压控制率", "Ｂ.肾性贫血控制率", "Ｃ.血磷控制率", "Ｄ.尿素下降率记录完成率", "Ｅ.β2微球蛋白检验完成率"], "answer": "ABC", "explanation": "并发症管理中的控制率类指标包括高血压控制率、肾性贫血控制率和血磷控制率；尿素下降率记录完成率和β2微球蛋白检验完成率属于透析充分性管理指标。"}, {"text": "透析充分性管理指标包括（  ）", "options": ["Ａ.尿素清除率Kt/V记录完成率", "Ｂ.尿素下降率URR记录完成率", "Ｃ.β2微球蛋白检验完成率", "Ｄ.高血压控制率", "Ｅ.血管通路例次统计"], "answer": "ABC", "explanation": "透析充分性管理指标包括维持性血液透析患者尿素清除率（Kt/V）记录完成率、尿素下降率（URR）记录完成率和β2微球蛋白检验完成率，记录或检验频次均为6个月；高血压控制率属于并发症管理指标，血管通路例次统计属于维持性血透患者质量监测指标。"}, {"text": "透析中心信息化管理工具可实现的目标包括（  ）", "options": ["Ａ.数据采集自动化", "Ｂ.取消质控数据上报", "Ｃ.全院信息共享化", "Ｄ.工作流程一致化", "Ｅ.移动应用智能化与质控过程规范化"], "answer": "ACDE", "explanation": "透析中心信息化管理工具可实现数据采集自动化、全院信息共享化、工作流程一致化、移动应用智能化、质控过程规范化、统计决策科学化；其功能是支持质控数据自动上报而非取消失报。"}, {"text": "完善的血液透析科室管理功能包括（  ）", "options": ["Ａ.药品出入库管理与查询", "Ｂ.耗材出入库管理与库存统计", "Ｃ.科室设备管理", "Ｄ.科室工作人员考核", "Ｅ.取消检验项目质控"], "answer": "ABCD", "explanation": "完善的科室管理功能支持药品出入库管理与查询、耗材出入库管理与库存统计查询、科室设备管理和科室工作人员考核；检验项目质控属于质量控制与管理的内容，不能取消。"}, {"text": "血液净化中心移动数据采集与管理平台的特点有（  ）", "options": ["Ａ.平板应用+RFID身份识别技术", "Ｂ.Web service与SOAP协议", "Ｃ.支持主流手机操作系统", "Ｄ.集成HIS、EMR、LIS、PACS", "Ｅ.仅支持单机离线使用"], "answer": "ABCD", "explanation": "移动数据采集与管理平台采用平板应用+RFID身份识别技术、Web service技术和SOAP协议，支持Android、IOS、windows操作系统，可实现信息集成（HIS、EMR、LIS、RIS、PACS）；该平台为联网移动应用，不支持且不局限于单机离线使用。"}]}, {"type": "short", "questions": [{"text": "简述血液净化中心信息化管理的定义及其与传统管理模式相比的主要变化。", "options": [], "answer": "血液净化中心信息化管理是指利用现代信息技术和物联网技术对血液透析治疗全过程进行数字化、智能化和标准化管理的一种新模式。它从根本上改变了传统以纸质记录和人工操作为主的医疗流程，通过集成化的信息管理系统，实现患者数据自动采集、治疗过程监控、医疗质量控制、科室运营管理等全方位数字化管理。与传统管理模式相比的主要变化为：数据记录由手工纸质记录、易错难保存转变为自动采集电子化、准确易查询；流程管理由依赖人工安排、效率低下转变为智能排班与流程优化、高效有序；质量控制由事后手动统计、滞后不全面转变为实时监控预警、标准化可追溯；医疗安全由依赖人工核对、风险较高转变为闭环管理、交叉核对、安全性高；患者体验由等待时间长、信息不透明转变为自助服务、实时信息、体验良好。", "explanation": "信息化管理是以计算机为主的信息化工具进行管理；血液净化中心信息化管理的定义、定位以及与传统管理模式在数据记录、流程管理、质量控制、医疗安全、患者体验五个方面的对比关系，均来自血液净化中心信息化管理的基本概念。"}, {"text": "简述血液净化中心信息化管理的主要作用。", "options": [], "answer": "血液净化中心信息化管理的主要作用有六个方面：一是提高医疗质量，信息化系统可自动采集和记录治疗数据，减少医护人员手工记录和重复性工作，显著降低工作负荷，系统自动收集质控数据并生成符合国家标准的质控报告，便于科室和医院管理层进行科学决策；二是减少医疗差错，通过标准化流程、闭环管理和实时监控减少医疗差错，提高治疗安全性；三是降低医疗成本；四是改善工作流程；五是提高患者体验，智能化排队叫号系统、自助报到设备和电子床头屏显示使治疗过程更加有序、透明，提升患者满意度；六是促进医学研究及教育。", "explanation": "血液净化中心信息化管理的作用包括提高医疗质量、减少医疗差错、降低医疗成本、改善工作流程、提高患者体验和促进医学研究及教育；其中提高医疗质量与提高患者体验的具体实现方式在该作用的阐述中有明确说明。"}, {"text": "简述血液净化中心信息化建设面临的困难与需求。", "options": [], "answer": "血液净化中心信息化建设面临的困难与需求包括三个层面。现状与需求方面：市场上各种信息化软件繁多，各医院信息化平台建设层次不齐；2009年新一轮医改政策中透析诊疗逐步纳入医保范围，患者诊疗量逐年猛增，设备量以每年40~50%的速度增长；我国慢性肾脏病患病率接近10.8%，40岁以上人群高达18.7%，约300万人需透析，2025年底血液透析患者已超过100万，患者基数大；传统的低信息化工作方式使医护人员工作、管理压力大，亟待信息化建设以提升诊疗过程管理、改善工作方式、提高效率。具体困难方面：包括记录繁重、排班复杂、信息孤岛、查询困难、设备难管理、成果难展示，例如检查检验数据查询难、患者诊疗信息查询难、设备缺少科学管理、电子设备信息孤立、上报数据难和学术研究难等。", "explanation": "血液净化中心信息化建设面临的市场现状、政策保障、患者基数大与工作压力大等现实需求，以及记录繁重、排班复杂、信息孤岛、查询困难、设备难管理、成果难展示等具体困难，均来自血液净化中心信息化管理面临的困难与需求部分。"}, {"text": "简述血液透析管理指标中血液透析基本指标与透析充分性管理指标的主要内容。", "options": [], "answer": "血液透析基本指标包括：一是血液透析机台数、专职医师和专职护理人员数，要求建立电子档案、血液透析机档案及使用维护记录；二是年度（目标时间段内）血透总例数；三是年度血透治疗总例次，包括普通血透HD、高通量血液透析HHD、血液透析滤过HDF、血液滤过HF、单纯超滤UF、血液灌流HP和血浆置换例次；四是年度维持性血透患者的死亡例数及透析1年内死亡率；五是年度血透中严重并发症发生例次，由每次透析过程中护士或医生记录，发生记为1例次；六是年度血透患者乙肝病毒表面抗原或E抗原转阳病例数；七是年度血透患者丙肝病毒抗体或抗原转阳病例数；八是年度血透转腹透例数；九是年度血透转肾移植例数；十是可复用透析器复用率与平均复用次数，本单位无复用但保留报表位置。透析充分性管理指标包括：维持性血液透析患者尿素清除率（Kt/V）记录完成率、尿素下降率（URR）记录完成率、β2微球蛋白检验完成率，记录或检验频次均为6个月。其中spKt/V=-Ln（R-0.008t）+（4-3.5R）×（△BW / BW），R为透后血尿素/透前血尿素，时间单位为h，△BW为超滤量（L），BW为干体重（Kg）；URR(%)=（C0-C）/C0×100%，C0为透前血清尿素水平，C为透后血清尿素水平。", "explanation": "血液透析基本指标共10项，透析充分性管理指标共3项，其统计口径均为年度（目标时间段内），记录或检验频次为6个月；尿素清除率和尿素下降率的计算公式及参数含义均来自透析充分性管理部分。"}, {"text": "简述血液透析管理指标中感染控制管理与并发症管理的主要内容及检测频次。", "options": [], "answer": "感染控制管理的内容与频次：血液透析治疗室消毒合格率，考核空气消毒、物表消毒、医务手卫生3个项目；透析用水生物污染检验合格率，一年一次；新入透析患者乙肝病毒标志物、丙肝病毒标志物、梅毒螺旋体和艾滋病毒检测完成率；维持性血液透析患者定时乙肝病毒标志物、丙肝病毒标志物、梅毒螺旋体和艾滋病毒检测完成率，均为6个月一次；维持性血液透析患者乙肝表面抗原阳性率、丙肝表面抗体阳性率和梅毒螺旋体阳性率。并发症管理的内容与频次：血常规定时检验完成率，3个月；血液生化定时检验完成率，3个月、1个月；血清铁蛋白定时检验完成率，6个月；转铁蛋白饱和度定时检验率，6个月；血清甲状旁腺素（iPTH）定时检验完成率，6个月；血清前白蛋白定时检验完成率，6个月；血液透析患者C反应蛋白（CRP）定时检验完成率，6个月；此外还包括高血压控制率、肾性贫血控制率和血磷控制率。", "explanation": "感染控制管理共13项指标，其中透析用水生物污染检验一年一次，维持性血液透析患者乙肝、丙肝、梅毒螺旋体和艾滋病毒的定时检测均为6个月一次；并发症管理共10项指标，血常规与血液生化的定时检验频次分别为3个月和3个月、1个月，血清铁蛋白、转铁蛋白饱和度、血清甲状旁腺素、血清前白蛋白和C反应蛋白均为6个月，控制率类指标为高血压控制率、肾性贫血控制率和血磷控制率。"}]}]}, {"num": 10, "title": "血液净化患者的一体化管理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "我国慢性肾脏病（CKD）的患病率约为", "options": ["A.5.8%", "B.8.9%", "C.10.8%", "D.12.5%", "E.15.2%"], "answer": "C", "explanation": "我国流行病学调查显示CKD患病率已高达10.8%，据此估算我国CKD患者达1.195亿人。"}, {"text": "根据我国CKD患病率估算，我国CKD患者总数约为", "options": ["A.0.5亿人", "B.1.195亿人", "C.1.5亿人", "D.2.0亿人", "E.3.0亿人"], "answer": "B", "explanation": "我国CKD患病率高达10.8%，据此估算我国CKD患者达1.195亿人。"}, {"text": "我国终末期肾病（ESRD）患者人群预估数量为", "options": ["A.30-50万", "B.50-80万", "C.100-180万", "D.200-250万", "E.300-350万"], "answer": "C", "explanation": "我国ESRD患者人群预估为100-180万，预计2030年有300万CKD患者需要肾脏替代治疗。"}, {"text": "预计到2030年，我国需要肾脏替代治疗的CKD患者约为", "options": ["A.100万", "B.150万", "C.200万", "D.300万", "E.500万"], "answer": "D", "explanation": "预计2030年有300万CKD患者需要肾脏替代治疗。"}, {"text": "CKD已成为继心脑血管疾病、糖尿病、肿瘤之后威胁人类健康的慢性疾病，其位次是", "options": ["A.第二位", "B.第三位", "C.第四位", "D.第五位", "E.第六位"], "answer": "C", "explanation": "CKD死亡率高、知晓率低、医疗开支巨大，已跃居第四位威胁人类健康的慢性疾病。"}, {"text": "2024年我国在透患者总例数约为", "options": ["A.15.6万例", "B.91.7万例", "C.102.7万例", "D.156.4万例", "E.118.3万例"], "answer": "E", "explanation": "2024年在透患者118.3万例，其中血液透析102.7万例、腹膜透析15.6万例。"}, {"text": "2024年我国血液透析在透患者例数约为", "options": ["A.15.6万", "B.84.4万", "C.91.7万", "D.102.7万", "E.118.3万"], "answer": "D", "explanation": "2024年在透患者118.3万例，其中血液透析102.7万、腹膜透析15.6万。"}, {"text": "2024年我国腹膜透析在透患者例数约为", "options": ["A.10.2万", "B.15.6万", "C.21.4万", "D.25.5万", "E.36.1万"], "answer": "B", "explanation": "2024年在透患者中腹膜透析为15.6万例，血液透析为102.7万例。"}, {"text": "2024年我国血液透析中心总数为", "options": ["A.4351家", "B.7298家", "C.7512家", "D.8456家", "E.10146家"], "answer": "D", "explanation": "2024年我国共有8456家透析中心，其中二级医院4351家、三级医院2669家。"}, {"text": "2024年我国透析中心中二级医院所占比例约为", "options": ["A.17.0%", "B.26.1%", "C.31.6%", "D.51.5%", "E.58.1%"], "answer": "D", "explanation": "2024年二级医院透析中心4351家，占比51.5%；二级医院比例占半数以上，但逐年减少。"}, {"text": "2024年我国血液透析在透患者中男性所占比例为", "options": ["A.36.1%", "B.38.7%", "C.61.3%", "D.62.9%", "E.63.9%"], "answer": "C", "explanation": "2024年在透患者男性占61.3%，新增患者中男性占63.9%。"}, {"text": "2024年我国血液透析在透患者的平均年龄为", "options": ["A.55.9岁", "B.56.6岁", "C.58.1岁", "D.59.9岁", "E.61.3岁"], "answer": "C", "explanation": "高龄透析患者比例不断攀升，2024年在透患者平均年龄为58.1岁。"}, {"text": "2024年我国血液透析新增患者的平均年龄为", "options": ["A.56.6岁", "B.58.1岁", "C.59.0岁", "D.59.9岁", "E.63.9岁"], "answer": "D", "explanation": "高龄透析患者比例不断攀升，2024年新增患者平均年龄为59.9岁。"}, {"text": "已超越肾小球肾炎成为新增血液透析患者终末期肾病首要病因的是", "options": ["A.高血压肾损害", "B.糖尿病肾病", "C.多囊肾", "D.泌尿系肿瘤", "E.药物性肾损害"], "answer": "B", "explanation": "糖尿病肾病已超越肾小球肾炎，成为新增患者终末期肾病的首要病因；这类患者常合并多种代谢性疾病，治疗难度增加。"}, {"text": "血液透析患者一体化管理包含的内容共有", "options": ["A.三个方面", "B.四个方面", "C.五个方面", "D.六个方面", "E.七个方面"], "answer": "D", "explanation": "血液透析患者一体化管理包括及时和早期诊断、恰当的血液透析治疗时机、完善血液透析前的准备、加强血液透析中的管理及并发症的处理、加强终末期肾病相关并发症的预防和治疗、加强血液透析患者的心理健康指导共六个方面。"}, {"text": "围透析期是指自eGFR低于多少起，直到初始透析后3个月的这段时间", "options": ["A.30 ml/(min·1.73m²)", "B.25 ml/(min·1.73m²)", "C.20 ml/(min·1.73m²)", "D.15 ml/(min·1.73m²)", "E.10 ml/(min·1.73m²)"], "answer": "D", "explanation": "围透析期指eGFR＜15 ml/(min·1.73m²)起，一直到初始透析3个月，包括透析前期和初始透析两个阶段。"}, {"text": "围透析期所持续的时间约为", "options": ["A.3个月", "B.6个月", "C.1-3年", "D.3-5年", "E.5-10年"], "answer": "C", "explanation": "围透析期包括透析前期和初始透析两个阶段，时间约1-3年。"}, {"text": "围透析期的特点概括为三高一低，其中一低指的是", "options": ["A.血红蛋白低", "B.eGFR快速下降", "C.血钙低", "D.白蛋白低", "E.免疫球蛋白低"], "answer": "B", "explanation": "围透析期特点为三高一低，即并发症发生率高、病死率高、治疗费用高，而eGFR快速下降。"}, {"text": "依据KDOQI血液透析充分性临床实践指南，应接受终末期肾脏病管理及治疗方式选择教育的患者为", "options": ["A.CKD2期", "B.CKD3期", "C.CKD4期", "D.CKD5期", "E.CKD5D期"], "answer": "C", "explanation": "对于达到CKD4期即eGFR＜30 ml/(min·1.73m²)的患者，应接受终末期肾脏病管理以及治疗方式选择的教育；患者家属及家庭护理人员也应接受相应教育。"}, {"text": "血液透析的禁忌症是", "options": ["A.腹膜腔闭塞", "B.腹膜功能丧失", "C.无法建立血管通路或心血管功能不稳定", "D.严重肾性贫血", "E.继发性甲状旁腺功能亢进"], "answer": "C", "explanation": "血液透析的禁忌症为无法建立血管通路或心血管功能不稳定；腹膜腔闭塞、腹膜功能丧失是腹膜透析的禁忌症。"}, {"text": "准备接受血液透析的患者，最好在建立动静脉内瘘术后多久开始透析", "options": ["A.1周", "B.2周", "C.1个月", "D.3个月", "E.6个月"], "answer": "C", "explanation": "建立透析通路后，准备血液透析者最好在建立动静脉内瘘术后1个月开始透析。"}, {"text": "透析失衡综合征发生的主要原因是", "options": ["A.透析间期液体超负荷", "B.尿素反向效应使水分向脑内转移", "C.超滤过快", "D.对醋酸盐透析液不适应", "E.低钾血症"], "answer": "B", "explanation": "透析失衡综合征的主要原因是透析间期血尿素下降速度高于脑内下降速度，出现尿素反向效应，血浆渗透压低于脑渗透压，使水分从血浆向脑内转移，引起脑水肿。"}, {"text": "透析失衡综合征的危险因素中，提示高危的血尿素氮水平为", "options": ["A.&gt;100 mg/dl", "B.&gt;125 mg/dl", "C.&gt;150 mg/dl", "D.&gt;175 mg/dl", "E.&gt;200 mg/dl"], "answer": "D", "explanation": "透析失衡综合征的危险因素包括高BUN水平（＞175 mg/dl）和BUN水平快速下降，以及患有基础神经疾病、低钠血症和肝脏疾病。"}, {"text": "血液透析时透析器反应常发生于哪类患者", "options": ["A.初始透析患者", "B.长期规律透析患者", "C.腹膜透析患者", "D.肾移植术后患者", "E.高钾血症患者"], "answer": "A", "explanation": "透析器反应常发生在初始透析患者。"}, {"text": "血液透析中低血压的发生率约为", "options": ["A.5%", "B.10%", "C.15%", "D.25%", "E.33%"], "answer": "D", "explanation": "低血压是血液透析最常见的并发症，其发生率约为25%。"}, {"text": "为避免透析间期液体超负荷，透析患者每日饮水量需控制在", "options": ["A.500mL以下", "B.800mL以下", "C.1000mL以下", "D.1500mL以下", "E.2000mL以下"], "answer": "C", "explanation": "为避免透析间期液体超负荷，透析患者每日饮水量需控制在1000mL以下，并尽量减少盐的摄入。"}, {"text": "透析中发生低血压时，必要时快速补充生理盐水的量为", "options": ["A.20-50ml", "B.50-100ml", "C.100-200ml", "D.200-300ml", "E.300-500ml"], "answer": "C", "explanation": "透析中低血压的治疗可快速补充生理盐水100-200ml，或给予50%葡萄糖20ml，同时输注白蛋白并结合病因治疗。"}, {"text": "透析中发生低血压时，必要时可给予的50%葡萄糖用量为", "options": ["A.10ml", "B.20ml", "C.40ml", "D.50ml", "E.100ml"], "answer": "B", "explanation": "透析中低血压的治疗可快速补充生理盐水100-200ml或50%葡萄糖20ml。"}, {"text": "血液透析患者肌肉痉挛的发病率可高达", "options": ["A.10%-20%", "B.20%-33%", "C.25%", "D.33%-86%", "E.98.2%"], "answer": "D", "explanation": "肌肉痉挛在透析治疗过程中及透析间期均可发生，发病率可高达33%-86%。"}, {"text": "透析相关肌肉痉挛的主要发生部位是", "options": ["A.腓肠肌、足部", "B.腹部肌肉", "C.颈部肌肉", "D.腰部肌肉", "E.面部肌肉"], "answer": "A", "explanation": "肌肉痉挛主要发生部位为腓肠肌、足部，手部、上肢和腹部肌肉亦可受累。"}, {"text": "血液透析患者中贫血的发生率高达", "options": ["A.33%", "B.50%", "C.86%", "D.90.5%", "E.98.2%"], "answer": "E", "explanation": "肾性贫血是血液透析患者最常见的并发症，血液透析患者中贫血发生率高达98.2%。"}, {"text": "肾性贫血应用红细胞生成素治疗时，血红蛋白的目标值为", "options": ["A.≥90 g/L", "B.≥100 g/L", "C.≥115 g/L", "D.≥130 g/L", "E.≥150 g/L"], "answer": "C", "explanation": "血红蛋白治疗目标值为≥115 g/L，但不推荐＞130 g/L。"}, {"text": "肾性贫血应用红细胞生成素治疗时，不推荐的血红蛋白水平为", "options": ["A.&gt;100 g/L", "B.&gt;115 g/L", "C.&gt;120 g/L", "D.&gt;130 g/L", "E.&gt;150 g/L"], "answer": "D", "explanation": "血红蛋白治疗目标值为≥115 g/L，但不推荐＞130 g/L。"}, {"text": "重组人红细胞生成素用于慢性肾脏病患者的初始剂量建议为", "options": ["A.50-100 U/kg/周", "B.100-150 U/kg/周", "C.150-200 U/kg/周", "D.200-250 U/kg/周", "E.300 U/kg/周"], "answer": "B", "explanation": "重组人红细胞生成素的初始剂量建议为100-150 U/kg/周，分2-3次注射，或10000 U每周1次，皮下或静脉给药。"}, {"text": "红细胞生成素初始治疗时，血红蛋白每月增加的合适幅度为", "options": ["A.5-10 g/L", "B.10-20 g/L", "C.20-30 g/L", "D.30-40 g/L", "E.40-50 g/L"], "answer": "B", "explanation": "初始红细胞生成素治疗的目标是血红蛋白每月增加10-20 g/L，应避免1个月内血红蛋白增幅超过20 g/L。"}, {"text": "血液透析合并慢性肾脏病贫血患者需要补铁时，血清铁蛋白的阈值为", "options": ["A.≤50 μg/L", "B.≤100 μg/L", "C.≤150 μg/L", "D.≤200 μg/L", "E.≤300 μg/L"], "answer": "D", "explanation": "血液透析贫血患者转铁蛋白饱和度≤20%或
