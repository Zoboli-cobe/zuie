迅速夹闭导管，这对保留导管尖端肝素盐水存留十分重要；封管前应保证管腔内无血而不是充满血液。"}, {"text": "关于导管相关感染的护理与治疗措施，正确的有？", "options": ["Ａ.教育患者及家属注意对导管的保护和护理", "Ｂ.提高医务人员护理质量", "Ｃ.做到早期发现", "Ｄ.全身和局部同时使用抗生素2周", "Ｅ.导管相关感染均应直接拔管"], "answer": "ABCD", "explanation": "导管相关感染应教育患者及家属注意对导管的保护和护理，提高医务人员护理质量，做到早期发现，治疗上强调全身和局部同时使用抗生素2周；直接拔管而不抗感染的处理不符合材料所述原则。"}, {"text": "低温透析液对血压的影响及使用注意，正确的有？", "options": ["Ａ.通过提高血浆儿茶酚胺水平发挥作用", "Ｂ.使血管收缩和末梢血管阻力增加", "Ｃ.35℃以上一般能耐受", "Ｄ.过低可引起患者发抖而不能耐受", "Ｅ.温度越低患者耐受性越好"], "answer": "ABCD", "explanation": "低温透析液通过提高血浆儿茶酚胺水平，使血管收缩和末梢血管阻力增加；低温透析在35℃以上一般能耐受，但过低可引起患者发抖而不能耐受。"}, {"text": "关于高钠浓度透析液对血压的作用，正确的有？", "options": ["Ａ.补偿小分子物质丢失的渗透压下降", "Ｂ.保持血浆渗透压的稳定", "Ｃ.改善毛细血管再充盈", "Ｄ.起到稳定血压的作用", "Ｅ.透析结束前仍需维持高钠浓度"], "answer": "ABCD", "explanation": "高钠浓度透析液可以补偿由于尿素氮、肌酐等小分子物质丢失造成的血浆晶体渗透压下降，保持血浆渗透压的稳定，改善毛细血管再充盈，起到稳定血压的作用；但高钠血症可引起口渴和透析间期体重增长过多，因此透析结束前必须降低透析液的钠浓度。"}, {"text": "关于血液透析加血液灌流治疗对老年维持性血液透析患者的作用，正确的有？", "options": ["Ａ.可改善睡眠质量", "Ｂ.可改善生活质量", "Ｃ.改善睡眠有助于降低心血管事件发生率", "Ｄ.失眠可增加心血管事件发生率", "Ｅ.可完全替代药物治疗心血管疾病"], "answer": "ABCD", "explanation": "血液透析加血液灌流治疗可改善老年维持性血液透析患者的睡眠质量及生活质量；失眠可增加该类患者的心血管事件发生率，因此改善睡眠有助于提高生活质量、降低心血管事件发生率。"}, {"text": "老年血液透析患者抗凝方法选择的原则包括？", "options": ["Ａ.抗凝方法与其他人群无区别", "Ｂ.建议选用低分子肝素", "Ｃ.合并心脑血管疾病者应予考虑", "Ｄ.高脂血症、消化道出血、骨质疏松者", "Ｅ.所有老年患者均应使用普通肝素"], "answer": "ABCD", "explanation": "老年血液透析患者的抗凝方法与其他人群无区别，建议选用低分子肝素，尤其考虑到合并心脑血管疾病、存在高脂血症、潜在的消化道出血和骨质疏松等情况；并非所有老年患者都应使用普通肝素。"}, {"text": "与普通人群相比，透析患者心脏相关死亡的特点包括？", "options": ["Ａ.透析患者全因死亡风险高", "Ｂ.心脏相关死亡率为普通人群10至20倍", "Ｃ.65%心脏性死亡由心脏骤停与心律失常", "Ｄ.心脏相关死亡风险低于普通人群", "Ｅ.心脏性死亡与电解质变化无关"], "answer": "ABC", "explanation": "透析患者全因死亡风险高，心脏相关死亡的发生率是普通人群的10至20倍，其中65%的心脏性死亡由心脏骤停、原因不明和心律失常导致，与普通人群相比风险明显升高。"}, {"text": "老年血液透析患者猝死的影响因素包括？", "options": ["Ａ.缺血性心脏病", "Ｂ.心肌超微结构和功能异常", "Ｃ.高血压", "Ｄ.左心室肥大和心脏扩大", "Ｅ.心理疾病"], "answer": "ABCD", "explanation": "老年血液透析患者猝死的影响因素包括缺血性心脏病，心肌超微结构和功能异常，高血压，左心室肥大，心脏扩大，以及透析中电解质变化（钾离子转移）等；心理疾病属于老年血液透析患者的合并症，未列为猝死的影响因素。"}, {"text": "老年血液透析患者常见的合并症包括？", "options": ["Ａ.糖尿病与高血压", "Ｂ.冠心病", "Ｃ.充血性心力衰竭", "Ｄ.左心室肥大与心脏扩大", "Ｅ.急性阑尾炎"], "answer": "ABCD", "explanation": "老年血液透析患者合并症多，包括糖尿病、冠心病、高血压、充血性心力衰竭、左心室肥大、心脏扩大、脑血管疾病、外周血管疾病、肿瘤等；急性阑尾炎不属于其常见合并症。"}]}, {"type": "short", "questions": [{"text": "简述老年血液透析患者的四个主要特点。", "options": [], "answer": "老年血液透析患者具有四个主要特点：一是个体差异大；二是开始肾替代治疗晚；三是合并症和并发症多；四是生存率低。由于这些特点，老年患者的透析时机、血管通路、透析方式和抗凝方法等都需要个体化处理。", "explanation": "老年血液透析患者在透析时机、血管通路选择、透析方式、抗凝方法、猝死和合并症等方面均有其特殊性，上述四个特点贯穿于老年患者血液透析治疗的全过程。"}, {"text": "简述老年人血液透析时机的选择要点。", "options": [], "answer": "老年人血液透析时机的选择要点包括：多数老年慢性肾衰竭患者病情进展缓慢，出现严重代谢性酸中毒、电解质紊乱的情况相对较少，进入血液透析后反而容易出现低血压、失衡综合征、血管内瘘闭塞以及出血等并发症，因此过早开始血液透析对生活质量的改善有限；但血液透析时间过晚则可能引起多器官功能失调，导致病死率增加。肾脏专科治疗介入过晚常常是老年血液透析患者预后不良的重要因素，因为老年人血清肌酐水平常低于应有水平，其肾功能需要采用相关公式估算肾小球滤过率等多种手段综合评估。仅根据血肌酐水平选择血液透析时机对老年终末期肾病患者并不合适，应依据C-G公式、MDRD或MDRD简化公式计算肌酐清除率或肾小球滤过率，或通过核素测定肾小球滤过率来选择时机。严重或极度营养不良，反复发生高钾血症、代谢性酸中毒，严重肾性贫血，高度浮肿等临床情况宜尽早血液透析治疗。高龄老人开始血液透析时机的选择还需要根据对患者预后的判定、社会和家庭的支持情况、治疗负担、生活质量以及患者本人的意愿等多方面综合考虑。", "explanation": "老年人血清肌酐水平常低于应有水平，容易被低估肾功能而延误透析时机，因此需要依靠公式估算或核素测定肾小球滤过率来判断。透析时机既不宜过早也不宜过晚，应结合临床情况和患者意愿综合决定。"}, {"text": "简述老年血液透析患者血管通路的选择原则及选择时需考虑的因素。", "options": [], "answer": "老年血液透析患者血管通路的选择主要考虑通路使用时间、并发症发生率和死亡率，从建立到开始使用的时间、患者的意愿和医生的倾向性。自体动静脉内瘘仍为首选，但老年患者建立自体动静脉内瘘血管通路相对困难，与年龄大、合并症多、外周血管病变有关；老年人血管病变多，最常见的是冠状动脉粥样硬化和外周动脉病，导致动脉壁增厚、管腔狭窄、血管弹性差、脆性增加，使内瘘难以建立、失败率高，并有可能增加远端肢体缺血的危险。老年患者容易出现心力衰竭，自体动静脉内瘘或移植血管内瘘的分流可导致心脏的额外负荷，对此类患者不主张选择动静脉内瘘、尤其上臂内瘘。老年患者血管栓塞发生率高，低血压常见，血压通常在90/60 mmHg以下时前臂内瘘经常闭塞、失败率很高，且对血管通路的自我维护能力差、存活期短。临时置管存在感染、栓塞、留置时间短等问题；颈内静脉、锁骨下静脉长期留置导管和人造血管植入可作为选择。移植血管内瘘对于部分年龄相对较轻的老年肥胖患者可以采用，感染机会少于长期导管。", "explanation": "老年患者血管通路决策的核心是在内瘘优势与老年患者血管条件差、心脏负荷大、预期寿命短之间权衡，因此既坚持自体动静脉内瘘首选的原则，也接受长期中心静脉导管和移植血管内瘘作为补充。"}, {"text": "简述老年血液透析患者长期中心静脉导管的常见并发症及其护理要点。", "options": [], "answer": "长期中心静脉导管有许多并发症，包括血栓形成、导管脱出和（或）断裂、出口感染及菌血症等。留置长期带涤纶套双腔导管最常见的并发症是血流不畅，其原因常见是导管内血栓形成、导管贴壁或纤维蛋白鞘形成。高龄老年人时常有意识错失，不自主拔除导管，甚至剪断导管，因此需要加强护理；国内许多老年人的卫生护理差，容易引起导管感染，需要特别关注。在防止导管内血栓形成方面，高浓度枸橼酸盐封管可能好于肝素封管液；肝素封管时，封管前动静脉导管内应分别注入适量生理盐水，以保证管腔内无血后再用浓肝素盐水封管，同时在推注肝素盐水时应迅速夹闭导管，这对保留导管尖端肝素盐水存留十分重要。国外资料表明导管退出使用的最主要原因是导管相关感染，应教育患者及家属注意对导管的保护和护理，提高医务人员护理质量，做到早期发现，治疗上强调全身和局部同时使用抗生素2周；对于局部渗血或血肿形成者，建议术后当天不行透析。", "explanation": "永久性带涤纶套的双腔导管一般长36～40cm，动静脉端开口均在顶端且相距2cm以上，动脉端还有两个侧孔开口，以满足血流量并减少再循环，但导管相关感染仍是其退出使用的最主要原因。"}, {"text": "简述老年血液透析患者的透析方式与抗凝方法选择要点。", "options": [], "answer": "透析方式选择应兼顾适应症和禁忌症，根据患者的治疗条件并尊重个人意愿制定个体化治疗方案。年龄超过75岁的患者一般选择以住院为基础的血液透析治疗，可以和其他肾友交流，建立友情，有助于克服因疾病导致的孤独。不同透析模式对老年血液透析低血压的影响不同，低温可调钠和低温加盐酸米多君模式能显著减少老年患者透析低血压的发生，尤其是低温加盐酸米多君模式效果更好；低温透析液通过提高血浆儿茶酚胺水平，使血管收缩和末梢血管阻力增加，低温透析在35℃以上一般能耐受，但过低可引起患者发抖而不能耐受；高钠浓度透析液可以补偿由于尿素氮、肌酐等小分子物质丢失造成的血浆晶体渗透压下降，保持血浆渗透压的稳定，改善毛细血管再充盈，起到稳定血压的作用，但高钠血症可引起口渴和透析间期体重增长过多，因此透析结束前必须降低透析液的钠浓度。血液透析加血液灌流治疗可改善老年维持性血液透析患者的睡眠质量及生活质量，而失眠可增加该类患者的心血管事件发生率，改善睡眠有助于提高生活质量、降低心血管事件发生率。抗凝方法选择与其他人群无区别，建议选用低分子肝素，尤其是合并心脑血管疾病、存在高脂血症、潜在的消化道出血和骨质疏松的患者。", "explanation": "老年患者透析方式与抗凝方法均强调个体化：透析方式要考虑低血压防治、睡眠与生活质量，抗凝则优先选择低分子肝素以减少出血风险。"}]}]}, {"num": 36, "title": "血液净化病人血管通路：动静脉内瘘的建立及维护理论考试题库", "sections": [{"type": "single", "questions": [{"text": "动静脉内瘘是血液透析最常用的血管通路，被形象地称为血液透析病人的", "options": ["A.生命线", "B.安全阀门", "C.第二心脏", "D.营养通道", "E.监测窗口"], "answer": "A", "explanation": "动静脉内瘘是血液透析最常用血管通路，是血液透析病人的“生命线”。"}, {"text": "关于正确使用及护理内瘘的意义，正确的表述是", "options": ["A.仅能减轻穿刺疼痛", "B.能延长内瘘使用寿命", "C.可替代降压药物治疗", "D.能缩短每次透析的时间", "E.可完全杜绝内瘘并发症"], "answer": "B", "explanation": "正确使用及护理内瘘，能延长内瘘使用寿命，保证透析的顺利进行，提高患者生存质量。"}, {"text": "血液净化血管通路的类型选择中，首选的是", "options": ["A.自体内瘘（AVF）", "B.移植物血管通路（AVG）", "C.中心静脉导管（CVC）", "D.股静脉置管", "E.颈内静脉置管"], "answer": "A", "explanation": "血管通路的类型选择中，自体内瘘（AVF）首选，其次为移植物血管通路（AVG），中心静脉导管（CVC）尽量避免使用。"}, {"text": "中心静脉导管（CVC）适用于下列哪类病人", "options": ["A.内瘘成熟良好的成人", "B.血管条件良好的成人", "C.儿童、心功能不全、生存时间有限者", "D.已有成熟内瘘者", "E.长期规律透析且内瘘良好者"], "answer": "C", "explanation": "中心静脉导管（CVC）用于儿童、心功能不全、生存时间有限和确无条件建立内瘘的病人。"}, {"text": "静脉与动脉吻合的术式不包括", "options": ["A.侧侧吻合", "B.端侧吻合", "C.侧端吻合", "D.端端吻合", "E.端环吻合"], "answer": "E", "explanation": "静脉与动脉吻合的术式包括侧侧吻合、端侧吻合、侧端吻合和端端吻合四种，不包括端环吻合。"}, {"text": "自体动静脉内瘘建立时，常与头静脉进行吻合的动脉是", "options": ["A.桡动脉", "B.尺动脉", "C.肱动脉", "D.腋动脉", "E.掌浅弓"], "answer": "A", "explanation": "自体动静脉内瘘的建立常采用头静脉与桡动脉吻合。"}, {"text": "动静脉端侧或侧侧吻合的优点之一是", "options": ["A.需结扎主要动脉", "B.不影响动脉原有解剖结构", "C.常引起远端静脉高压", "D.内瘘血流量偏少", "E.易发生远端动脉窃血"], "answer": "B", "explanation": "动静脉端侧或侧侧吻合不影响动脉原有解剖结构，不会产生远端静脉高压，内瘘血流量充足，远端动脉窃血情况亦少见。"}, {"text": "动静脉端侧或侧侧吻合时，保证内瘘血流量充足的动脉来源是", "options": ["A.肱动脉及腋动脉", "B.尺动脉腕背支", "C.骨间动脉", "D.桡动脉及尺动脉掌深弓", "E.掌浅弓"], "answer": "D", "explanation": "动静脉端侧或侧侧吻合时内瘘血流量充足，有桡动脉及尺动脉掌深弓供应。"}, {"text": "动静脉内瘘保护中，禁止在内瘘侧肢体进行的操作是", "options": ["A.抽血、输液", "B.测量体温", "C.握力器锻炼", "D.肢体保暖", "E.抬高肢体"], "answer": "A", "explanation": "内瘘保护注意事项包括禁止在内瘘侧肢体抽血、输液，禁止在内瘘侧肢体测血压，禁止内瘘侧肢体持重及其他用力的活动。"}, {"text": "关于内瘘侧肢体的体位保护，正确的做法是", "options": ["A.可取内瘘侧侧卧位", "B.禁止内瘘侧侧卧位", "C.可将内瘘侧肢体压在身体下面", "D.可将内瘘侧肢体放在枕头下面", "E.可长时间下垂内瘘侧肢体"], "answer": "B", "explanation": "内瘘侧禁止侧卧位，不要将内瘘侧肢体放到身体下面或枕头下面，也不要长时间下垂。"}, {"text": "内瘘侧肢体禁止进行的测量操作是", "options": ["A.测量体温", "B.测量血压", "C.测量脉搏", "D.测量体重", "E.测量指脉氧"], "answer": "B", "explanation": "内瘘保护要求禁止在内瘘侧肢体测血压。"}, {"text": "内瘘保护要求中，关于内瘘侧肢体佩戴物品的规定是", "options": ["A.可佩戴手表", "B.可佩戴饰物", "C.不能佩戴手表及饰物", "D.可佩戴手镯", "E.可佩戴戒指"], "answer": "C", "explanation": "内瘘保护要求禁止穿紧袖口上衣，内瘘侧不能佩戴手表及饰物。"}, {"text": "内瘘患者平卧时，内瘘侧肢体的正确摆放是", "options": ["A.放到身体下面", "B.压在枕头下面", "C.下垂于床沿", "D.放到身体侧面，手掌下垫枕头抬高", "E.紧贴胸壁固定"], "answer": "D", "explanation": "平卧时内瘘侧肢体放到身体侧面，可在手掌下垫一枕头，使手部高于上臂，手术切口向上。"}, {"text": "内瘘术后换药的频次为", "options": ["A.每天一次", "B.2~3天一次", "C.每周一次", "D.10天一次", "E.14天一次"], "answer": "B", "explanation": "内瘘术后2~3天换药一次，不要用绷带连续缠绕包扎，不要将胶布粘接成环状。"}, {"text": "内瘘手术后伤口拆线的时间为", "options": ["A.7天", "B.10天", "C.14天", "D.21天", "E.28天"], "answer": "C", "explanation": "手术后伤口14天拆线，拆线前防止伤口沾水。"}, {"text": "内瘘术后拆线前，禁止做剧烈运动的关节是", "options": ["A.肩关节、肘关节", "B.手指关节、腕关节", "C.髋关节、膝关节", "D.踝关节", "E.颈椎"], "answer": "B", "explanation": "拆线前手指关节、腕关节禁止做剧烈运动，以防瘘口出血。"}, {"text": "内瘘进行功能锻炼（如握力器）以促成瘘成熟，应在何时开始", "options": ["A.术后当天", "B.术后3天", "C.术后7天", "D.拆线后", "E.内瘘失功后"], "answer": "D", "explanation": "拆线后进行功能锻炼，促成瘘成熟，如握力器。"}, {"text": "内瘘成熟所需的时间一般为", "options": ["A.1~2周", "B.2~3周", "C.4~6周", "D.8~10周", "E.12周以上"], "answer": "C", "explanation": "内瘘成熟需4~6周，此时静脉明显扩张、动脉化的血管壁增厚。"}, {"text": "过早使用内瘘会导致的后果是", "options": ["A.血管纤维化、管腔狭窄", "B.血管扩张加快", "C.内瘘血流量增大", "D.血管壁增厚明显", "E.内瘘提前成熟"], "answer": "A", "explanation": "过早使用内瘘会导致血管纤维化、管腔狭窄，缩短内瘘使用寿命。"}, {"text": "内瘘血栓形成最主要的原因是", "options": ["A.血管狭窄", "B.低血压", "C.高凝状态", "D.感染", "E.脱水"], "answer": "A", "explanation": "血管狭窄是造成内瘘血栓形成的最主要原因；低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染也是常见原因。"}, {"text": "内瘘血栓形成的溶栓治疗最好在多长时间内进行", "options": ["A.6小时内", "B.12小时内", "C.24小时内", "D.48小时内", "E.72小时内"], "answer": "C", "explanation": "内瘘血栓形成的溶栓治疗最好在24小时内进行，可用尿激酶、肝素；48小时内仍有希望。"}, {"text": "内瘘成熟评估（6个6）中，提前建立内瘘的时间为", "options": ["A.1个月", "B.3个月", "C.6个月", "D.12个月", "E.24个月"], "answer": "C", "explanation": "内瘘成熟评估（6个6）要求提前建立内瘘的时间为6个月。"}, {"text": "内瘘成熟评估（6个6）中，可供穿刺的长度要求为", "options": ["A.&gt;3厘米", "B.&gt;4厘米", "C.&gt;6厘米", "D.&gt;8厘米", "E.&gt;10厘米"], "answer": "C", "explanation": "内瘘成熟评估（6个6）要求可供穿刺长度&gt;6厘米，走行平滑。"}, {"text": "内瘘成熟评估（6个6）中，内瘘血管深度的要求为", "options": ["A.&lt;0.3厘米", "B.&lt;0.4厘米", "C.&lt;0.5厘米", "D.&lt;0.6厘米", "E.&lt;1.0厘米"], "answer": "D", "explanation": "内瘘成熟评估（6个6）要求内瘘深度&lt;0.6厘米。"}, {"text": "内瘘成熟评估（6个6）中，内瘘血管管径的要求为", "options": ["A.&gt;0.3厘米", "B.&gt;0.4厘米", "C.&gt;0.5厘米", "D.&gt;0.6厘米", "E.&gt;1.0厘米"], "answer": "D", "explanation": "内瘘成熟评估（6个6）要求内瘘管径&gt;0.6厘米。"}, {"text": "内瘘成熟评估（6个6）中，内瘘血流量的要求为", "options": ["A.&gt;200毫升/分钟", "B.&gt;300毫升/分钟", "C.&gt;400毫升/分钟", "D.&gt;500毫升/分钟", "E.&gt;600毫升/分钟"], "answer": "E", "explanation": "内瘘成熟评估（6个6）要求内瘘流量&gt;600毫升/分钟。"}, {"text": "新瘘管初次穿刺应由谁进行", "options": ["A.有经验的护士", "B.实习护士", "C.患者本人", "D.患者家属", "E.进修人员"], "answer": "A", "explanation": "新瘘管应由有经验的护士进行穿刺，穿刺前仔细对瘘管进行审视，正确选择有效的穿刺点。"}, {"text": "新瘘管初次使用时，静脉穿刺部位应", "options": ["A.靠近动脉穿刺点", "B.远离动脉穿刺点", "C.与动脉穿刺点重合", "D.位于吻合口处", "E.紧邻吻合口"], "answer": "B", "explanation": "新瘘管初次使用时，静脉穿刺部位应远离动脉穿刺点。"}, {"text": "内瘘穿刺时为固定穿刺针常用的方法是", "options": ["A.两点按压法", "B.四点悬吊法", "C.三点固定法", "D.环形包扎法", "E.胶布粘接成环法"], "answer": "C", "explanation": "内瘘穿刺时可采用三点固定法固定穿刺针；固定时不要将胶布粘接成环状。"}, {"text": "透析穿刺时操作人员应严格遵守的原则是", "options": ["A.严格无菌操作", "B.以速度优先", "C.以患者感觉为准", "D.尽量扩大进针角度", "E.反复试穿寻找血管"], "answer": "A", "explanation": "透析穿刺时，操作人员应严格遵守无菌操作原则，提高穿刺成功率。"}, {"text": "内瘘早期感染常与下列哪项有关", "options": ["A.透析液污染", "B.降压药使用", "C.饮食不当", "D.手术", "E.透析器复用"], "answer": "D", "explanation": "内瘘早期感染和手术有关，而后期感染常与穿刺点污染有关。"}, {"text": "为减少血管壁损伤，对血管穿刺的要求是", "options": ["A.两次内成功即可", "B.可由患者选择进针角度", "C.反复试穿", "D.无需固定穿刺针", "E.一针见血"], "answer": "E", "explanation": "对血管穿刺要求一针见血，避免血管壁的损伤。"}, {"text": "下列不属于透析中穿刺点渗血处理方法的是", "options": ["A.新眼穿刺法", "B.纱线缠绕法", "C.棉签、棉球压迫止血法", "D.拔针后改对侧肢体穿刺", "E.改变针位法"], "answer": "D", "explanation": "透析中穿刺点渗血的处理方法包括新眼穿刺法、纱线缠绕法、棉签棉球压迫止血法、改变针位法和止血药局部止血法。"}, {"text": "内瘘拔针后压迫止血的时间为", "options": ["A.2~5min", "B.5~10min", "C.10~20min", "D.20~30min", "E.30~40min"], "answer": "C", "explanation": "内瘘拔针后压迫10~20min，透析结束后应由护士负责止血。"}, {"text": "内瘘拔针后应使用哪两个手指压迫皮肤进针点及血管进针点", "options": ["A.食指及中指", "B.拇指及食指", "C.中指及无名指", "D.拇指及中指", "E.无名指及小指"], "answer": "A", "explanation": "内瘘拔针后以食指及中指压迫皮肤进针点及血管进针点，以不出血及能扪及震颤或听到血管杂音为宜。"}, {"text": "为预防出血，可在回血前多长时间将冰袋置于动脉处", "options": ["A.回血前1分钟", "B.回血前3分钟", "C.回血前5分钟", "D.回血前10分钟", "E.回血后5分钟"], "answer": "C", "explanation": "为预防出血可在回血前5分钟，将冰袋置于动脉处，使血管收缩加快止血。"}, {"text": "止血时发生血肿，应立即采取的措施是", "options": ["A.热毛巾热敷", "B.冰袋冷敷", "C.局部按摩", "D.涂擦海普林软膏", "E.加压包扎并按摩"], "answer": "B", "explanation": "止血时发生血肿立即予以冰袋冷敷；血透24小时后可在血肿处涂擦海普林软膏等外用药，并可用热毛巾热敷消肿。"}, {"text": "血透后多久可在血肿处涂擦海普林软膏并热敷消肿", "options": ["A.6小时", "B.12小时", "C.24小时", "D.48小时", "E.72小时"], "answer": "C", "explanation": "嘱病人血透24小时后在血肿处涂擦海普林软膏等外用药，并可用热毛巾热敷消肿。"}, {"text": "血肿局部发生感染时，可采取的处理是", "options": ["A.立即热敷并按摩", "B.冷敷并加压包扎", "C.继续在内瘘侧穿刺", "D.口服止痛药", "E.碘酒精湿敷，必要时全身抗菌素治疗"], "answer": "E", "explanation": "如血肿局部感染，可用碘酒精湿敷，必要时配合全身抗菌素治疗。"}, {"text": "下列属于内瘘常见并发症的是", "options": ["A.内瘘血管狭窄", "B.低血糖", "C.低钠血症", "D.肾性贫血", "E.高钾血症"], "answer": "A", "explanation": "内瘘常见并发症包括内瘘血管狭窄、内瘘血栓形成、血管瘤形成、内瘘流量过大、血管径路感染和内瘘窃血综合症。"}, {"text": "内瘘血管狭窄触诊时可发现", "options": ["A.狭窄部位柔软、扩张", "B.狭窄处僵硬变细、远端扩张", "C.近端搏动消失", "D.远端震颤消失", "E.局部皮温降低"], "answer": "B", "explanation": "触诊可见狭窄部位僵硬、变细，远端扩张、搏动增强，近端可及震颤。"}, {"text": "内瘘血管狭窄听诊的典型表现是", "options": ["A.狭窄部位闻及低调连续杂音", "B.全程未闻及杂音", "C.狭窄处高尖非连续杂音", "D.仅远端闻及杂音", "E.闻及双期杂音"], "answer": "C", "explanation": "听诊时狭窄部位可听到高尖非连续杂音，近端可闻及连续杂音。"}, {"text": "内瘘血管狭窄时，提示症状出现的血流量指标为", "options": ["A.≤100ml/min", "B.≤150ml/min", "C.≤180ml/min", "D.≤200ml/min", "E.≤250ml/min"], "answer": "C", "explanation": "内瘘血管狭窄时血流量≤180ml/min，静脉压≥150mmHg或增高≥50mmHg，因重复循环率增加使透析效果下降≥10%。"}, {"text": "内瘘血管狭窄的影像学检查方法包括", "options": ["A.彩超、血管造影", "B.X线平片", "C.心电图", "D.磁共振波谱", "E.PET-CT"], "answer": "A", "explanation": "内瘘血管狭窄的影像学检查包括彩超和血管造影。"}, {"text": "内瘘血管狭窄治疗的指征之一是血管狭窄程度达到", "options": ["A.≥30%", "B.≥40%", "C.≥50%", "D.≥70%", "E.≥90%"], "answer": "C", "explanation": "血管狭窄程度≥50%或内径&lt;2.5mm，并有血流下降并有血管瘤形成、静脉压上升、重复循环率上升或BUN异常增高等情况一项以上者，为内瘘血管狭窄的治疗指征。"}, {"text": "内瘘血管狭窄的治疗中，推荐作为首选的方法是", "options": ["A.溶栓治疗", "B.取栓治疗", "C.外科手术", "D.经皮穿刺腔内血管成形术（PTA）", "E.搭桥手术"], "answer": "D", "explanation": "经皮穿刺腔内血管成形术（PTA）创伤小，可较好地保持血管的解剖完整性，可反复进行，推荐作为首选方法；外科手术用于PTA失败、PTA不适宜者。"}, {"text": "移植血管内瘘血栓形成中，静脉吻合口占的比例为", "options": ["A.55%", "B.65%", "C.75%", "D.85%", "E.95%"], "answer": "D", "explanation": "移植血管内瘘血栓形成中静脉吻合口占85%；自体内瘘血栓形成中内瘘吻合口占75%。"}, {"text": "内瘘血管瘤进行性增大或直径大于多少时可予手术切除", "options": ["A.1厘米", "B.2厘米", "C.3厘米", "D.4厘米", "E.5厘米"], "answer": "C", "explanation": "观察血管瘤的进展，如进行性增大，或直径大于3厘米，可予手术切除。"}, {"text": "下列属于内瘘血管瘤形成原因的是", "options": ["A.血管条件较差", "B.血压过低", "C.内瘘血流量不足", "D.透析液温度过低", "E.抗凝剂用量过大"], "answer": "A", "explanation": "血管瘤形成原因包括血管条件较差、穿刺区域较窄、患者怕疼痛、护士技术不熟练，以及小区域内反复穿刺造成血液外渗、皮下血肿、血管壁损伤，血管弹性差易膨出。"}, {"text": "预防内瘘血管瘤的措施中，关于穿刺技术的要求是", "options": ["A.提高穿刺技术，避免区域穿刺", "B.固定一点反复穿刺", "C.由患者自主穿刺", "D.扩大穿刺范围并加快穿刺", "E.减少穿刺次数即可"], "answer": "A", "explanation": "血管瘤的预防要求严格控制患者血压，提高穿刺技术、避免区域穿刺，重视透析后止血；拔针时动作要快，沿血管方向后抽，避免血管壁及皮肤撕裂。"}]}, {"type": "multiple", "questions": [{"text": "关于血液净化血管通路的类型及选择，正确的有", "options": ["Ａ.自体内瘘（AVF）为首选", "Ｂ.移植物血管通路（AVG）次之", "Ｃ.中心静脉导管（CVC）应作为首选", "Ｄ.用于儿童、心功能不全者", "Ｅ.CVC用于无条件建立内瘘者"], "answer": "ABDE", "explanation": "血管通路选择中自体内瘘（AVF）首选，其次为移植物血管通路（AVG），中心静脉导管（CVC）尽量避免使用；CVC用于儿童、心功能不全、生存时间有限和确无条件建立内瘘的病人。C项与上述选择原则相反，错误。"}, {"text": "动静脉端侧或侧侧吻合的优点包括", "options": ["Ａ.不会产生远端静脉高压", "Ｂ.会增加远端静脉高压", "Ｃ.不影响动脉原有解剖结构", "Ｄ.桡动脉及尺动脉掌深弓供应", "Ｅ.远端动脉窃血情况亦少见"], "answer": "ACDE", "explanation": "端侧或侧侧吻合不影响动脉原有解剖结构，不会产生远端静脉高压，内瘘血流量充足（有桡动脉及尺动脉掌深弓供应），远端动脉窃血情况亦少见。B项与事实相反，错误。"}, {"text": "动静脉内瘘保护注意事项包括", "options": ["Ａ.禁止在内瘘侧肢体抽血、输液", "Ｂ.内瘘侧可佩戴手表及饰物", "Ｃ.禁止内瘘侧侧卧位", "Ｄ.禁止在内瘘侧肢体测血压", "Ｅ.禁止穿紧袖口上衣"], "answer": "ACDE", "explanation": "内瘘保护要求禁止在内瘘侧肢体抽血输液、禁止内瘘侧侧卧位、禁止在内瘘侧肢体测血压、禁止穿紧袖口上衣，且内瘘侧不能佩戴手表及饰物。B项错误。"}, {"text": "关于内瘘侧肢体的体位要求，正确的有", "options": ["Ａ.直立时内瘘侧肢体可自然弯曲放到腹部", "Ｂ.平卧时内瘘侧肢体放到身体侧面", "Ｃ.平卧时手掌下垫枕头抬高", "Ｄ.平卧时手术切口向上", "Ｅ.内瘘侧肢体应长时间下垂"], "answer": "ABCD", "explanation": "直立时内瘘侧肢体可自然弯曲放到腹部；平卧时内瘘侧肢体放到身体侧面，可在手掌下垫一枕头，使手部高于上臂，手术切口向上。内瘘侧肢体不要长时间下垂，E项错误。"}, {"text": "内瘘手术后的护理要求包括", "options": ["Ａ.术后2~3天换药一次", "Ｂ.用绷带连续缠绕包扎伤口", "Ｃ.不要将胶布粘接成环状", "Ｄ.手术后伤口14天拆线", "Ｅ.拆线前手指关节、腕关节禁止做剧烈运动"], "answer": "ACDE", "explanation": "内瘘术后2~3天换药一次，不要用绷带连续缠绕包扎，不要将胶布粘接成环状；手术后伤口14天拆线，拆线前手指关节、腕关节禁止做剧烈运动，以防瘘口出血。B项错误。"}, {"text": "关于内瘘成熟与使用时机，正确的有", "options": ["Ａ.内瘘成熟需4~6周", "Ｂ.静脉扩张、血管壁增厚", "Ｃ.血管纤维化、管腔狭窄", "Ｄ.过早使用会缩短内瘘寿命", "Ｅ.内瘘建立后无需等待即可使用"], "answer": "ABCD", "explanation": "内瘘成熟需4~6周，此时静脉明显扩张、动脉化的血管壁增厚；过早使用内瘘会导致血管纤维化、管腔狭窄，缩短内瘘使用寿命。E项错误。"}, {"text": "内瘘成熟评估（6个6）的内容包括", "options": ["Ａ.提前建立内瘘的时间6个月", "Ｂ.内瘘成熟时间4~6周", "Ｃ.可供穿刺长度&gt;6厘米，走行平滑", "Ｄ.内瘘流量&gt;300毫升/分钟", "Ｅ.深度&lt;0.5厘米、管径&gt;1.0厘米"], "answer": "ABC", "explanation": "内瘘成熟评估（6个6）要求提前建立时间6个月、成熟时间4~6周、可供穿刺长度&gt;6厘米且走行平滑、深度&lt;0.6厘米、管径&gt;0.6厘米、流量&gt;600毫升/分钟。D、E两项数值均不符合要求。"}, {"text": "新瘘管初次使用的注意事项包括", "options": ["Ａ.应由有经验的护士进行穿刺", "Ｂ.认真仔细地进行穿刺", "Ｃ.静脉穿刺部位应远离动脉穿刺点", "Ｄ.静脉穿刺部位应靠近动脉穿刺点", "Ｅ.穿刺前审视瘘管、选准穿刺点"], "answer": "ABCE", "explanation": "新瘘管初次使用应由有经验的护士穿刺，穿刺前仔细对瘘管进行审视，正确选择有效的穿刺点，认真仔细地进行穿刺，静脉穿刺部位应远离动脉穿刺点。D项错误。"}, {"text": "关于透析穿刺的无菌操作与感染，正确的有", "options": ["Ａ.操作人员应严格遵守无菌操作原则", "Ｂ.内瘘早期感染和手术有关", "Ｃ.内瘘后期感染常与穿刺点污染有关", "Ｄ.感染严重者可导致败血症", "Ｅ.血管穿刺允许反复试穿以便找到血管"], "answer": "ABCD", "explanation": "透析穿刺应严格遵守无菌操作原则；内瘘早期感染和手术有关，后期感染常与穿刺点污染有关；感染会使内瘘功能丧失，严重者将导致败血症，是透析死亡的重要原因。血管穿刺要求一针见血，避免血管壁损伤，E项错误。"}, {"text": "透析中穿刺点渗血的处理方法包括", "options": ["Ａ.新眼穿刺法", "Ｂ.纱线缠绕法", "Ｃ.棉签、棉球压迫止血法", "Ｄ.立即拔针终止透析", "Ｅ.局部热敷并按摩"], "answer": "ABC", "explanation": "渗血处理方法包括新眼穿刺法、纱线缠绕法、棉签棉球压迫止血法、改变针位法和止血药局部止血法；立即拔针终止透析、局部热敷并按摩均不是渗血的处理方法，D、E两项错误。"}, {"text": "采用纱线缠绕法处理穿刺点渗血时，正确的做法有", "options": ["Ａ.准备消毒纱布1块、胶布2~3条", "Ｂ.抽出纱丝6~8根捻成一股", "Ｃ.纱线绕过穿刺针后方并交叉", "Ｄ.用手捻纱绳时手勿接触纱丝中间", "Ｅ.纱绳不必拉紧，允许其下滑"], "answer": "ABCD", "explanation": "纱线缠绕法需消毒纱布1块、胶布2~3条，从纱布中抽出纱丝6~8根左右捻成一股，将纱线从穿刺针后方绕过并在穿刺针前方交叉，捻纱绳时手勿接触纱丝中间以防止污染，纱绳一定要拉紧并压紧在穿刺针与皮肤的吻合处。E项错误。"}, {"text": "内瘘使用初期止血的正确做法有", "options": ["Ａ.透析结束后由护士负责止血", "Ｂ.内瘘拔针后压迫10~20min", "Ｃ.食指及中指压迫两个进针点", "Ｄ.回血前10分钟将冰袋置于动脉处", "Ｅ.止血后嘱患者手臂下垂以利止血"], "answer": "ABC", "explanation": "透析结束后应由护士负责止血，内瘘拔针后压迫10~20min，以食指及中指压迫皮肤进针点及血管进针点，以不出血及能扪及震颤或听到血管杂音为宜。预防出血应在回血前5分钟将冰袋置于动脉处，D项错误；止血后应嘱患者手臂抬高，E项错误。"}, {"text": "透后发生血肿、淤血等并发症的处理包括", "options": ["Ａ.止血时发生血肿立即予以冰袋冷敷", "Ｂ.血透24小时后在血肿处涂擦海普林软膏", "Ｃ.24小时后可用热毛巾热敷消肿", "Ｄ.止血时发生血肿立即热敷并按摩", "Ｅ.血肿局部感染时不宜使用碘酒精湿敷"], "answer": "ABC", "explanation": "止血时发生血肿立即予以冰袋冷敷；血透24小时后可在血肿处涂擦海普林软膏等外用药，并可用热毛巾热敷消肿；血肿局部感染可用碘酒精湿敷，必要时配合全身抗菌素治疗。D、E两项错误。"}, {"text": "下列属于内瘘常见并发症的有", "options": ["Ａ.内瘘血管狭窄", "Ｂ.内瘘窃血综合症", "Ｃ.血管瘤形成", "Ｄ.高钾血症", "Ｅ.低血糖"], "answer": "ABC", "explanation": "内瘘常见并发症包括内瘘血管狭窄、内瘘血栓形成、血管瘤形成、内瘘流量过大、血管径路感染和内瘘窃血综合症；高钾血症、低血糖不属于内瘘常见并发症。"}, {"text": "内瘘血管狭窄的诊断方法包括", "options": ["Ａ.望诊观察血管形状、走向并做驱血实验", "Ｂ.触诊狭窄部位僵硬、变细", "Ｃ.听诊狭窄部位可听到高尖非连续杂音", "Ｄ.仅凭患者主诉疼痛即可确诊", "Ｅ.影像学检查对诊断无价值"], "answer": "ABC", "explanation": "内瘘血管狭窄的诊断包括望诊、触诊、听诊、症状指标和影像学检查；仅凭患者主诉疼痛不能确诊，彩超、血管造影等影像学检查是重要的诊断方法，D、E两项错误。"}, {"text": "提示内瘘血管狭窄的症状指标有", "options": ["Ａ.血流量≤180ml/min", "Ｂ.透析液温度升高", "Ｃ.静脉压≥150mmHg", "Ｄ.透析效果下降≥10%", "Ｅ.静脉压增高≥50mmHg"], "answer": "ACDE", "explanation": "内瘘血管狭窄时血流量≤180ml/min，静脉压≥150mmHg或增高≥50mmHg，因重复循环率增加使透析效果下降≥10%。B项不是内瘘血管狭窄的判断指标。"}, {"text": "内瘘血管狭窄的治疗，正确的有", "options": ["Ａ.狭窄程度≥50%或内径&lt;2.5mm", "Ｂ.外科手术推荐作为首选方法", "Ｃ.PTA推荐作为首选方法", "Ｄ.血流下降并有血管瘤形成是治疗指征之一", "Ｅ.重复循环率上升或BUN增高"], "answer": "ACDE", "explanation": "血管狭窄程度≥50%或内径&lt;2.5mm，并有血流下降并有血管瘤形成、静脉压上升、重复循环率上升或BUN异常增高等一项以上者为治疗指征；PTA创伤小、可较好地保持血管的解剖完整性、可反复进行，推荐作为首选方法，外科手术用于PTA失败或PTA不适宜者。B项错误。"}, {"text": "关于内瘘血栓形成，正确的有", "options": ["Ａ.血管狭窄是造成血栓形成的最主要原因", "Ｂ.血栓形成与穿刺压迫不当无关", "Ｃ.低血压、脱水、高凝状态是常见原因", "Ｄ.自体内瘘中内瘘吻合口占75%", "Ｅ.移植血管内瘘中静脉吻合口占85%"], "answer": "ACDE", "explanation": "血管狭窄是造成内瘘血栓形成的最主要原因，低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染也是常见原因；自体内瘘血栓形成中内瘘吻合口占75%，移植血管内瘘血栓形成中静脉吻合口占85%。B项错误。"}, {"text": "内瘘血栓形成的治疗措施包括", "options": ["Ａ.病因治疗及狭窄处理", "Ｂ.溶栓治疗最好在24小时内进行", "Ｃ.48小时内溶栓仍有希望", "Ｄ.可采用导管取栓，取栓后进行PTA", "Ｅ.上述措施失败后不宜行外科手术"], "answer": "ABCD", "explanation": "内瘘血栓形成的治疗包括病因治疗与狭窄处理；溶栓治疗最好在24小时内进行，使用尿激酶、肝素，48小时内仍有希望；可采用导管取栓，取栓后进行PTA；如上述措施失败，可行外科手术再吻合或搭桥。E项错误。"}, {"text": "关于内瘘血管瘤，正确的有", "options": ["Ａ.血管条件较差是其形成原因之一", "Ｂ.小区域内反复穿刺可促进血管瘤形成", "Ｃ.提高穿刺技术、避免区域穿刺有助于预防", "Ｄ.进行性增大或直径&gt;3厘米可切除", "Ｅ.血管瘤不会影响透析"], "answer": "ABCD", "explanation": "血管瘤形成原因包括血管条件较差、穿刺区域较窄、患者怕疼痛、护士技术不熟练以及小区域内反复穿刺；预防措施包括严格控制血压、提高穿刺技术避免区域穿刺、重视透析后止血；血管瘤进行性增大或直径大于3厘米可予手术切除。血管瘤破裂可致大出血、血栓形成并影响透析，E项错误。"}]}, {"type": "short", "questions": [{"text": "简述血液净化血管通路的类型及选择原则。", "options": [], "answer": "1.自体内瘘（AVF）为首选；2.其次为移植物血管通路（AVG）；3.中心静脉导管（CVC）尽量避免使用；4.CVC仅用于儿童、心功能不全、生存时间有限和确无条件建立内瘘的病人。", "explanation": "自体内瘘（AVF）是血液透析最常用血管通路，是血液透析病人的“生命线”，故列为首选；移植物血管通路（AVG）次之；中心静脉导管（CVC）用于儿童、心功能不全、生存时间有限和确无条件建立内瘘的病人，应尽量避免使用。"}, {"text": "简述动静脉内瘘的肢体保护注意事项。", "options": [], "answer": "1.禁止在内瘘侧肢体抽血、输液；2.禁止内瘘侧侧卧位，不要将内瘘侧肢体放到身体下面或枕头下面；3.禁止在内瘘侧肢体测血压；4.禁止穿紧袖口上衣，内瘘侧不能佩戴手表及饰物；5.禁止内瘘侧肢体持重及其他用力的活动；6.不要长时间下垂；7.直立时内瘘侧肢体可自然弯曲放到腹部，平卧时放到身体侧面，可在手掌下垫一枕头，使手部高于上臂，手术切口向上。", "explanation": "上述保护措施可避免内瘘侧肢体受压、静脉回流受阻和血管壁损伤，从而延长内瘘使用寿命，保证透析的顺利进行，提高患者生存质量；此外内瘘侧肢体应注意保暖。"}, {"text": "简述内瘘成熟评估的“6个6”内容。", "options": [], "answer": "1.提前建立内瘘的时间6个月；2.内瘘成熟时间4~6周；3.可供穿刺长度&gt;6厘米，走行平滑；4.内瘘深度&lt;0.6厘米；5.内瘘管径&gt;0.6厘米；6.内瘘流量&gt;600毫升/分钟。", "explanation": "内瘘成熟需4~6周，成熟时静脉明显扩张、动脉化的血管壁增厚；过早使用内瘘会导致血管纤维化、管腔狭窄，缩短内瘘使用寿命，因此应按“6个6”的各项要求评估内瘘是否成熟。"}, {"text": "简述内瘘血管狭窄的诊断依据。", "options": [], "answer": "1.望诊：观察血管形状、走向，做驱血实验；2.触诊：狭窄部位僵硬、变细，远端扩张、搏动增强，近端可及震颤；3.听诊：狭窄部位可听到高尖非连续杂音，近端可闻及连续杂音；4.症状指标：血流量≤180ml/min，静脉压≥150mmHg或增高≥50mmHg，因重复循环率增加使透析效果下降≥10%；5.影像学检查：彩超、血管造影。", "explanation": "内瘘血管狭窄需结合望诊、触诊、听诊、症状指标与影像学检查综合判断；当血管狭窄程度≥50%或内径&lt;2.5mm，并伴有血流下降并有血管瘤形成、静脉压上升、重复循环率上升或BUN异常增高之一项以上时即具备治疗指征，此时经皮穿刺腔内血管成形术（PTA）推荐作为首选方法，PTA失败或PTA不适宜者行外科手术。"}, {"text": "简述内瘘血栓形成的病因与治疗。", "options": [], "answer": "1.病因：血管狭窄是造成血栓形成的最主要原因；低血压、脱水、高凝状态、创伤、穿刺压迫不当和感染也是常见原因。2.血栓部位：自体内瘘中内瘘吻合口占75%，移植血管内瘘中静脉吻合口占85%。3.治疗：病因治疗及狭窄处理；溶栓治疗最好在24小时内进行，可用尿激酶、肝素，48小时内仍有希望；可采用导管取栓，取栓后进行PTA；上述措施失败者行外科手术再吻合或搭桥。", "explanation": "血管狭窄是内瘘血栓形成的最主要原因，故治疗时须同时处理狭窄；溶栓越早效果越好，24小时内最佳、48小时内仍有希望；导管取栓后配合PTA可恢复内瘘通畅，外科再吻合或搭桥是上述措施失败后的治疗手段。"}]}]}, {"num": 37, "title": "血液透析中心静脉导管的临床应用及维护理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析导管中属于长期（半永久性）导管的是", "options": ["A.无隧道的中心静脉导管", "B.颈内静脉临时导管", "C.股静脉临时导管", "D.带Cuff的中心静脉导管", "E.锁骨下静脉临时导管"], "answer": "D", "explanation": "血液透析导管分为临时导管和长期（半永久性）导管。临时导管的置管部位包括颈内静脉、股静脉和锁骨下静脉；长期（半永久性）导管是指带Cuff的中心静脉导管。"}, {"text": "血液透析导管的总体特点可概括为", "options": ["A.复杂、迅速、安全", "B.简单、迅速、安全", "C.简单、缓慢、安全", "D.简单、迅速、风险大", "E.复杂、缓慢、危险"], "answer": "B", "explanation": "血液透析导管的特点是简单、迅速、安全，因此临时留置导管常用于急需血液透析的患者。"}, {"text": "下列不属于血液透析临时留置导管适应证的是", "options": ["A.长期透析患者通路失功", "B.急性肾衰", "C.中毒抢救", "D.血浆置换疗法、人工肝治疗", "E.等待自体内瘘或移植血管内瘘成熟"], "answer": "E", "explanation": "临时留置导管的适应证包括长期透析患者通路失功、急性肾衰、中毒抢救、血浆置换疗法及人工肝治疗，还可用于腹透、单纯超滤；等待自体内瘘或移植血管内瘘成熟是半永久性带Cuff的中心静脉插管的适应证。"}, {"text": "半永久性带Cuff的中心静脉插管的使用寿命，1年时约为", "options": ["A.30%", "B.40%", "C.50%", "D.65%", "E.80%"], "answer": "C", "explanation": "半永久性带Cuff的中心静脉插管的使用寿命为1年约50%，其主要适应证包括等待自体内瘘或移植血管内瘘成熟、不能建立动静脉内瘘且不能进行肾移植等。"}, {"text": "美国维持性血管通路应用趋势中，1993年中心静脉置管所占的比例为", "options": ["A.30%", "B.5%", "C.11%", "D.21%", "E.49%"], "answer": "A", "explanation": "美国维持性血管通路应用趋势显示，中心静脉置管所占比例1980年为5%，1986~1987年为11%，1990年为21%，1993年达到30%。"}, {"text": "美国维持性血管通路应用趋势中，1993年自体内瘘所占的比例为", "options": ["A.19%", "B.26%", "C.30%", "D.45%", "E.49%"], "answer": "A", "explanation": "美国维持性血管通路应用趋势显示，自体内瘘所占比例由1970年的90%逐步下降，1986~1987年为45%，1990年为26%，1993年为19%。"}, {"text": "美国维持性血管通路应用趋势中，1993年PTFE内瘘所占的比例为", "options": ["A.49%", "B.19%", "C.30%", "D.44%", "E.53%"], "answer": "A", "explanation": "美国维持性血管通路应用趋势显示，PTFE内瘘所占比例1986~1987年为44%，1990年为53%，1993年为49%。"}, {"text": "美国FFBI计划2009年A-VF（自体动静脉内瘘）的制作和使用率为", "options": ["A.45%", "B.50%", "C.65%", "D.75%", "E.90%"], "answer": "C", "explanation": "美国FFBI计划2009年A-VF制作和使用率为65%，反映出以自体动静脉内瘘为首选通路的策略。"}, {"text": "美国维持性血管通路应用趋势显示，1980年至1993年中心静脉置管比例的变化为", "options": ["A.由5%升至30%", "B.由30%降至5%", "C.由11%升至49%", "D.由21%升至53%", "E.无明显变化"], "answer": "A", "explanation": "美国维持性血管通路应用趋势显示，中心静脉置管比例1980年为5%，之后持续上升，1993年为30%。"}, {"text": "股静脉、锁骨下静脉、颈内静脉插管比较中，保留时间为2周的置管部位是", "options": ["A.锁骨下静脉", "B.颈内静脉", "C.股静脉", "D.带Cuff的中心静脉导管", "E.无隧道中心静脉导管"], "answer": "C", "explanation": "股静脉、锁骨下静脉、颈内静脉插管比较中，股静脉保留时间为2周，是三者中保留时间最短的置管部位。"}, {"text": "股静脉、锁骨下静脉、颈内静脉插管比较中，技术难度为“难”的置管部位是", "options": ["A.股静脉", "B.颈内静脉", "C.锁骨下静脉", "D.无隧道中心静脉导管", "E.带袖套中心静脉导管"], "answer": "C", "explanation": "股静脉、锁骨下静脉、颈内静脉插管比较中，股静脉技术难度为易，颈内静脉为中等，锁骨下静脉为难。"}, {"text": "股静脉、锁骨下静脉、颈内静脉插管比较中，活动受限、透析需住院完成的是", "options": ["A.锁骨下静脉", "B.股静脉", "C.颈内静脉", "D.颈内静脉与锁骨下静脉", "E.三者均需住院"], "answer": "B", "explanation": "股静脉置管时患者活动受限、透析需住院完成；而锁骨下静脉和颈内静脉置管活动不受限、可门诊透析。"}, {"text": "股静脉、锁骨下静脉、颈内静脉插管比较中，并发症严重、可致血气胸和静脉狭窄的是", "options": ["A.股静脉", "B.颈内静脉", "C.锁骨下静脉", "D.股静脉与颈内静脉", "E.三者相同"], "answer": "C", "explanation": "股静脉置管并发症轻、少；颈内静脉置管并发症较轻，可有血气胸；锁骨下静脉置管并发症严重，可致血气胸和静脉狭窄。"}, {"text": "股静脉、锁骨下静脉、颈内静脉插管比较中，并发症表现为“较轻、血气胸”的是", "options": ["A.股静脉", "B.锁骨下静脉", "C.颈内静脉", "D.股静脉与锁骨下静脉", "E.三者均无血气胸"], "answer": "C", "explanation": "股静脉置管并发症轻、少，颈内静脉置管并发症较轻、可有血气胸，锁骨下静脉置管并发症严重、可致血气胸和静脉狭窄。"}, {"text": "留置导管的即刻并发症中，最常见的并发症是", "options": ["A.心律失常", "B.空气栓塞", "C.气胸", "D.出血", "E.心包填塞"], "answer": "D", "explanation": "出血是留置导管最常见的即刻并发症。股静脉误穿动脉可致腹膜后出血，锁骨下静脉一旦出血很难直接压迫止血，可致血胸，需要外科医师紧急探查以修补损伤血管。"}, {"text": "股静脉置管误穿动脉时，最常导致的出血是", "options": ["A.腹膜后出血", "B.血胸", "C.气胸", "D.心包填塞", "E.喉返神经损伤"], "answer": "A", "explanation": "股静脉置管误穿动脉可导致腹膜后出血；颈内静脉因误伤动脉导致的出血发生率低；锁骨下静脉一旦出血很难直接压迫止血，可致血胸。"}, {"text": "锁骨下静脉置管误穿动脉导致出血时，其处理特点是", "options": ["A.容易直接压迫止血", "B.出血多可自行停止", "C.仅表现为皮下淤血，无需处理", "D.很难直接压迫止血，可致血胸", "E.应立即拔管并加压包扎"], "answer": "D", "explanation": "锁骨下静脉一旦出血很难直接压迫止血，可致血胸，需要外科医师行紧急探查术以修补损伤血管。"}, {"text": "关于置管术中发生的心律失常，正确的描述是", "options": ["A.多由高钾血症引起", "B.均为持续性，需长期服药", "C.多为一过性，极少数需抗心律失常药物或复律治疗", "D.均需立即电复律", "E.由空气栓塞引起"], "answer": "C", "explanation": "在锁骨下静脉或颈内静脉置管术中，插入的导丝或导管可能直接刺激心内膜、压迫颈动脉窦，均可导致心律失常；临床上多为一过性，极少数需要抗心律失常药物或复律治疗。"}, {"text": "中心静脉或心房穿孔的常见原因是", "options": ["A.导管留置时间过长", "B.抗生素封管刺激", "C.多次试探穿刺或将导丝、导管强行推进", "D.抗凝用量不足", "E.透析液污染"], "answer": "C", "explanation": "血管穿孔常因多次试探穿刺或将导丝或导管强行推进引起；心房损伤多因导管置入过深所致。应尽量选用柔软、长度适中的导管，导丝和导管出入时动作应轻柔。"}, {"text": "下列置管部位中，容易发生空气栓塞的是", "options": ["A.股静脉和颈内静脉", "B.股静脉和锁骨下静脉", "C.颈内静脉和锁骨下静脉", "D.股静脉", "E.三者均容易发生"], "answer": "C", "explanation": "颈内静脉和锁骨下静脉导管容易发生空气栓塞。发生气栓时应夹住导管阻止空气继续进入，取头低足高左侧卧位，吸氧或高压氧，并给予升血压、镇静止痉等对症处理。"}, {"text": "带Cuff的中心静脉导管的尖端应放置在", "options": ["A.右心室", "B.上腔静脉中段", "C.颈内静脉内", "D.右心房", "E.锁骨下静脉内"], "answer": "D", "explanation": "带Cuff的中心静脉导管经皮下隧道置入，其导管尖端放置在右心房；Cuff为固定导管的小纤维环，可使导管固定于皮下隧道。"}, {"text": "导管脱出后，正确的处理是", "options": ["A.立即盲目推进复位", "B.在导丝引导下送回导管", "C.直接拔除并压迫止血", "D.经原隧道重新置入", "E.局部消毒后继续使用"], "answer": "B", "explanation": "导管脱出后不能盲目推进，应在导丝引导下送回导管；同时应避免导管尖摩擦血管壁和心房壁，以减少中心静脉或心房穿孔的风险。"}, {"text": "中心静脉导管功能不良的最主要表现是", "options": ["A.发热寒战", "B.出口处红肿", "C.血流量不足", "D.低血糖", "E.嗜睡"], "answer": "C", "explanation": "中心静脉导管功能不良表现为血流量不足，其原因为血栓形成、导管打折、导管贴壁。"}, {"text": "对于导管打折、贴壁导致的功能不良，正确的处理是", "options": ["A.立即拔除导管", "B.全身抗凝治疗", "C.抗生素封管", "D.旋转管路、动静脉互换或改变患者体位", "E.球囊扩张治疗"], "answer": "D", "explanation": "打折、贴壁的处理包括旋转管路、动静脉互换或改变病人的体位；导管栓塞则需溶栓、导管取栓或换管。"}, {"text": "导管表面纤维蛋白鞘形成后，血液透析时的典型表现是", "options": ["A.引血困难，回血无阻力", "B.引血正常，回血困难", "C.引血、回血均困难", "D.引血、回血均正常", "E.仅表现为出口处渗液"], "answer": "A", "explanation": "导管纤维鞘形成后表现为引血困难、回血无阻力，类似贴壁，尿激酶溶栓效果不佳。"}, {"text": "透析间期采用尿激酶静脉滴注溶栓的用法是", "options": ["A.25万单位尿激酶加生理盐水250毫升", "B.5千单位尿激酶加生理盐水10毫升", "C.2万单位尿激酶加生理盐水100毫升", "D.50万单位尿激酶加生理盐水500毫升", "E.10万单位尿激酶加生理盐水250毫升"], "answer": "A", "explanation": "透析间期可用25万单位尿激酶加生理盐水250毫升静脉滴注进行溶栓。"}, {"text": "诊断导管纤维鞘形成的检查方法是", "options": ["A.心电图、胸片", "B.超声、造影", "C.CT、磁共振", "D.PET-CT", "E.外周血培养"], "answer": "B", "explanation": "导管纤维鞘形成的检查方法为超声、造影；其临床表现类似贴壁，尿激酶溶栓效果不佳。"}, {"text": "针对导管纤维鞘形成，尿激酶灌注的用法是", "options": ["A.5千u/h，持续2小时", "B.10万u/h，持续1小时", "C.2万u/h，持续6小时", "D.25万u/h，持续12小时", "E.1万u/h，持续24小时"], "answer": "C", "explanation": "导管纤维鞘形成时可采用尿激酶灌注2万u/h×6h，也可行纤维鞘剥脱术或经导丝引导更换导管。"}, {"text": "纤维鞘剥脱术所使用的器械是", "options": ["A.球囊导管", "B.活检钳", "C.取石网篮", "D.鹅颈样勒除器", "E.导管夹"], "answer": "D", "explanation": "纤维鞘剥脱术使用鹅颈样勒除器剥离；此外还可采用尿激酶灌注或经导丝引导更换导管处理。"}, {"text": "经导丝引导更换导管时，拔管操作的禁忌是", "options": ["A.拔管前消毒", "B.导丝引导", "C.边拔管边压迫止血", "D.拔管后观察有无出血", "E.轻柔操作"], "answer": "C", "explanation": "经导丝引导更换导管时，拔管时忌边拔边压迫止血。"}, {"text": "下列不属于导管血栓形成常见部位的是", "options": ["A.管腔内血栓", "B.导管头部血栓", "C.导管表面纤维蛋白鞘", "D.中心静脉附壁血栓", "E.右心房内血栓"], "answer": "E", "explanation": "导管血栓形成的常见部位包括管腔内血栓、导管头部血栓、导管表面纤维蛋白鞘和中心静脉附壁血栓。"}, {"text": "静脉造影发现导管栓塞后，进一步的处理顺序是", "options": ["A.溶栓、导管取栓、换管", "B.直接换管、溶栓", "C.仅抗凝观察", "D.立即拔管、抗凝", "E.球囊扩张、支架植入"], "answer": "A", "explanation": "导管栓塞经静脉造影发现后，处理顺序为溶栓、导管取栓、换管。"}, {"text": "血液透析患者中，由血管通路感染引起的脓毒血症所占比例为", "options": ["A.12%~25.9%", "B.20%~30%", "C.48%~72%", "D.64.5%~100%", "E.8%~21%"], "answer": "C", "explanation": "血透患者48%~72%的脓毒血症由血管通路感染引起；感染和血栓问题是影响血管通路使用的主要问题。"}, {"text": "不同类型血管通路的感染率比较中，无隧道的中心静脉导管的感染率为", "options": ["A.7.6例/1000导管日", "B.5.6例/1000导管日", "C.5.0例/1000导管日", "D.2.7例/1000导管日", "E.0.05例/患者/年"], "answer": "C", "explanation": "无隧道的中心静脉导管感染率为5.0例/1000导管日，范围3.8~6.5例/1000导管日。"}, {"text": "不同类型血管通路的感染率比较中，股静脉插管的感染率为", "options": ["A.2.7例/1000导管日", "B.5.0例/1000导管日", "C.5.6例/1000导管日", "D.7.6例/1000导管日", "E.0.2例/患者/年"], "answer": "D", "explanation": "股静脉插管感染率为7.6例/1000导管日，留置1周后感染率增加10%。"}, {"text": "不同类型血管通路的感染率比较中，颈内静脉插管的感染率为", "options": ["A.2.7例/1000导管日", "B.3.5例/1000导管日", "C.5.0例/1000导管日", "D.5.6例/1000导管日", "E.7.6例/1000导管日"], "answer": "D", "explanation": "颈内静脉插管感染率为5.6例/1000导管日，留置2~3周后感染率增加10%。"}, {"text": "不同类型血管通路的感染率比较中，自体动静脉内瘘的感染率为", "options": ["A.0.05例/患者/年", "B.0.2例/患者/年", "C.2.7例/1000导管日", "D.3.5例/1000导管日", "E.5.0例/1000导管日"], "answer": "A", "explanation": "自体动静脉内瘘感染率为0.05例/患者/年，聚四氟乙烯血管动静脉内瘘为0.2例/患者/年，内瘘感染率明显低于各种中心静脉导管。"}, {"text": "关于股静脉作为血管通路时的导管相关性血流感染风险，正确的描述是", "options": ["A.风险最低，与留置时间无关", "B.风险最低，与留置时间呈线性关系", "C.风险最高，与留置时间呈线性关系", "D.风险居中，与颈内静脉相同", "E.仅在留置满4周后出现"], "answer": "C", "explanation": "股静脉作为血管通路时，发生CRBSI的风险最高，并且和导管的留置时间呈线性关系。"}, {"text": "有CRBSI的血液透析患者出现严重并发症的比例约为", "options": ["A.5%", "B.15%", "C.20%", "D.50%", "E.70%"], "answer": "C", "explanation": "有CRBSI的血液透析患者，20%出现严重并发症，包括感染性心内膜炎、脓性关节炎、骨髓炎、硬膜外脓肿和败血症。"}, {"text": "导管相关性感染的迁移性感染合并症中，最为严重的是", "options": ["A.骨髓炎", "B.关节脓肿", "C.硬膜外脓肿", "D.感染性心内膜炎", "E.脓毒血症"], "answer": "D", "explanation": "迁移性感染合并症包括脓毒血症、感染性心内膜炎、骨髓炎、关节脓肿、硬膜外脓肿等，其中以感染性心内膜炎最为严重。"}, {"text": "导管相关性感染合并症中，死亡的发生率约为", "options": ["A.1.2%", "B.2.3%", "C.5.8%~9.8%", "D.6.9%~12.0%", "E.12.0%~25.9%"], "answer": "E", "explanation": "导管相关性感染合并症中死亡发生率为12.0%~25.9%；感染是引起终末期肾病患者死亡的第2位原因。"}, {"text": "引起血液透析相关性CRBSI的致病菌中，革兰氏阳性菌所占比例约为", "options": ["A.1/5", "B.1/3", "C.2/3", "D.3/4", "E.4/5"], "answer": "C", "explanation": "引起血液透析相关性CRBSI的致病菌中，2/3是革兰氏阳性菌，主要是表皮葡萄球菌和金黄色葡萄球菌。"}, {"text": "血液透析患者鼻部金黄色葡萄球菌的携带率为", "options": ["A.8.8%~12.6%", "B.21.9%~60.0%", "C.24.0%~26.7%", "D.35%~62%", "E.48%~72%"], "answer": "D", "explanation": "血液透析患者鼻部金黄色葡萄球菌携带率为35%~62%；丹麦的一项研究发现，死于金黄色葡萄球菌导致的CRBSI的血液透析者是非血液透析者的4倍。"}, {"text": "血透导管感染中，导管出口处和隧道感染所占比例为", "options": ["A.8%~21%", "B.20%~30%", "C.35%~62%", "D.48%~72%", "E.64.5%~100%"], "answer": "A", "explanation": "血透导管感染类型包括导管出口感染、隧道感染和导管内感染（导管相关性血流感染），其中导管出口处和隧道感染占8%~21%。"}, {"text": "血透导管相关感染时，全身表现的典型特点是", "options": ["A.透析前持续高热、盗汗", "B.透析1~2h后寒战、发热，血培养阳性", "C.透析后低血糖、嗜睡", "D.仅有乏力、食欲减退", "E.全身皮疹伴瘙痒"], "answer": "B", "explanation": "血透导管相关感染全身表现的典型特点是透析1~2h后寒战、发热，血培养阳性；低热、嗜睡、意识模糊、低血压、低血糖等多见于老年、糖尿病及处于免疫抑制状态的患者。"}, {"text": "保留导管诊断CRBSI时，导管静脉血培养菌落数达到外周静脉血培养菌落数的多少倍以上可认为存在CRBSI", "options": ["A.1倍", "B.2倍", "C.3倍", "D.5~10倍", "E.100倍"], "answer": "D", "explanation": "经外周静脉及导管同时抽血作定量血培养，当导管静脉血培养的菌落数是外周静脉的5~10倍以上时，可认为已经存在CRBSI。"}, {"text": "保留导管诊断CRBSI时，导管端血液培养阳性的时间较外周血液培养阳性时间至少早", "options": ["A.30分钟", "B.2小时", "C.6小时", "D.12小时", "E.24小时"], "answer": "B", "explanation": "比较同时从导管端和外周静脉抽出的血液培养的阳性时间差异，导管端血液培养阳性的时间较外周血液培养阳性时间至少早2h。"}, {"text": "CRBSI的经验性抗生素治疗中，因常见致病菌为葡萄球菌，常选用的药物是", "options": ["A.大环内酯类", "B.一、二代头孢菌素", "C.抗结核药物", "D.抗真菌药物", "E.抗病毒药物"], "answer": "B", "explanation": "CRBSI经验性抗生素治疗中，葡萄球菌是常见的致病菌，常选择一、二代头孢菌素；病原学结果出来后根据血培养选择敏感的抗生素，并根据致病菌和有无迁移性合并症选择治疗疗程。"}, {"text": "隧道感染形成脓肿并切开引流后，在无血流感染的情况下，抗生素治疗的疗程为", "options": ["A.1~2天", "B.3~5天", "C.7~10天", "D.2周", "E.4周"], "answer": "C", "explanation": "隧道感染形成脓肿可切开引流，无血流感染的情况下，予抗生素治疗7~10天；局部感染则需每天1次消毒换药，用碘伏和干纱布，禁用透明薄膜。"}, {"text": "2011年美国血管内导管相关感染防治指南推荐，置管时皮肤消毒应使用", "options": ["A.含氯已定浓度&gt;0.5%的酒精溶液", "B.含氯已定浓度&gt;2%的水溶液", "C.75%酒精", "D.聚维酮碘单独使用", "E.3%过氧化氢溶液"], "answer": "A", "explanation": "2011年美国血管内导管相关感染防治指南推荐置管时使用含氯已定浓度&gt;0.5%的酒精溶液进行皮肤消毒（酒精+聚维酮碘），并使用最高级别的无菌屏障措施。"}]}, {"type": "multiple", "questions": [{"text": "半永久性带Cuff的中心静脉插管的适应证包括", "options": ["Ａ.等待自体内瘘成熟", "Ｂ.不能建立动静脉内瘘", "Ｃ.急性中毒抢救", "Ｄ.单纯超滤治疗", "Ｅ.不能耐受内瘘分流"], "answer": "ABE", "explanation": "半永久性带Cuff的中心静脉插管的适应证包括等待自体内瘘或移植血管内瘘成熟、不能建立动静脉内瘘且不能进行肾移植、行血透等待肾移植、心血管疾病明显不能耐受内瘘分流、严重动脉血管病特别是老年患者、生命期有限的尿毒症患者；急性中毒抢救和单纯超滤是临时留置导管的适用范围，故选项C、D错误。"}, {"text": "留置导管的即刻并发症包括", "options": ["Ａ.误穿动脉", "Ｂ.心律失常", "Ｃ.气胸、血胸", "Ｄ.空气栓塞", "Ｅ.导管纤维鞘形成"], "answer": "ABCD", "explanation": "留置导管的即刻并发症包括误穿动脉、心律失常、血流量不足、气胸与血胸、空气栓塞、中心静脉或心房穿孔、心包填塞、臂丛及气管和喉神经损伤；导管纤维鞘形成属于血管通路远期（使用中）并发症，故选项E错误。"}, {"text": "血管通路远期（使用中）并发症包括", "options": ["Ａ.中心静脉狭窄", "Ｂ.导管功能不良", "Ｃ.感染", "Ｄ.空气栓塞", "Ｅ.误穿动脉"], "answer": "ABC", "explanation": "血管通路远期（使用中）并发症包括中心静脉狭窄、导管功能不良（栓塞、打折、贴壁）和感染；空气栓塞和误穿动脉属于留置导管的即刻并发症，故选项D、E错误。"}, {"text": "影响动静脉内瘘制作的因素包括", "options": ["Ａ.人口老龄化", "Ｂ.糖尿病、高血压", "Ｃ.周围血管破坏或堵塞", "Ｄ.透析液温度", "Ｅ.肥胖"], "answer": "ABCE", "explanation": "影响动静脉内瘘制作的因素包括人口老龄化、糖尿病、高血压、周围血管破坏或堵塞（外周血管疾病、反复输液、反复留置导管、多次制作内瘘）、肥胖以及术者经验与技巧；透析液温度与内瘘制作无关，故选项D错误。"}, {"text": "空气栓塞的紧急处理措施包括", "options": ["Ａ.夹住导管阻止空气进入", "Ｂ.头低足高左侧卧位", "Ｃ.吸氧或高压氧", "Ｄ.对症处理如升血压", "Ｅ.置头高足低位"], "answer": "ABCD", "explanation": "气栓的紧急处理包括夹住导管阻止空气继续进入、取头低足高左侧卧位、吸氧或高压氧、对症处理如升血压和镇静止痉等；置头高足低位不利于处理气栓，故选项E错误。"}, {"text": "中心静脉或心房穿孔的预防措施包括", "options": ["Ａ.选用柔软、长度适中的导管", "Ｂ.导丝与导管出入动作轻柔", "Ｃ.避免导管尖摩擦血管壁", "Ｄ.避免多次试探穿刺", "Ｅ.尽量将导管置入更深位置"], "answer": "ABCD", "explanation": "预防中心静脉或心房穿孔应尽量选用柔软、长度适中的导管，导丝和导管出入时动作轻柔，避免导管尖摩擦血管壁和心房壁，并避免多次试探穿刺或强行推进；导管置入过深是心房损伤的常见原因，故选项E错误。"}, {"text": "关于置管术中发生的血流量不足，正确的有", "options": ["Ａ.多为导管位置不正确、打折", "Ｂ.可适当变动导管位置", "Ｃ.动静脉头反接可改善血流", "Ｄ.反接可减少再循环", "Ｅ.应常规尿激酶溶栓"], "answer": "ABC", "explanation": "血流量不足的原因是导管位置不正确、导管打折，处理上可适当变动导管位置，或将导管的“动静脉”头反向连接以使血流量充足；反向连接会增加而非减少再循环，故选项D错误；血流量不足并非血栓所致，不需常规尿激酶溶栓，故选项E错误。"}, {"text": "气胸及置管并发症的特点包括", "options": ["Ａ.发生率与穿刺经验有关", "Ｂ.颈内静脉插管约0.1%", "Ｃ.锁骨下静脉插管可达1.0%~10%", "Ｄ.锁骨下静脉左侧进路更危险", "Ｅ.股静脉插管发生率最高"], "answer": "ABCD", "explanation": "插管过程中可出现气胸、血胸、心包填塞和邻近组织损伤，发生率均与医生的穿刺经验有关；其中气胸发生率在颈内静脉插管时仅0.1%，而锁骨下静脉插管时可高达1.0%~10%，且左侧进路更危险；气胸发生率最高的是锁骨下静脉插管而非股静脉插管，故选项E错误。"}, {"text": "中心静脉导管功能不良的原因包括", "options": ["Ａ.血栓形成", "Ｂ.导管打折", "Ｃ.导管贴壁", "Ｄ.纤维蛋白鞘形成", "Ｅ.心包填塞"], "answer": "ABCD", "explanation": "中心静脉导管功能不良表现为血流量不足，其原因为血栓形成、导管打折、导管贴壁以及纤维蛋白鞘形成；心包填塞是留置导管的即刻并发症，不是导管功能不良的原因，故选项E错误。"}, {"text": "导管内血栓形成的原因包括", "options": ["Ａ.导管使用时间长", "Ｂ.患者高凝状态", "Ｃ.抗凝用量不足", "Ｄ.导管扭曲、移位", "Ｅ.透析液污染"], "answer": "ABCD", "explanation": "血栓形成的原因包括导管使用时间长、患者高凝状态、抗凝用量不足以及机械性原因如导管扭曲、移位；透析液污染与血栓形成无关，故选项E错误。"}, {"text": "尿激酶溶栓（NKF-DOQI方案）的要点包括", "options": ["Ａ.先抽吸导管腔去除肝素", "Ｂ.尿激酶浓度5000U/ml", "Ｃ.用3ml注射器注入导管腔", "Ｄ.每10分钟追加盐水0.3ml共2次", "Ｅ.尿激酶浓度选用250U/ml"], "answer": "ABCD", "explanation": "NKF-DOQI方案先尝试抽吸堵塞的导管腔、去除肝素，再用3ml注射器把5000U/ml的尿激酶注入堵塞的导管腔，每隔10分钟追加0.3ml生理盐水共2次；尿激酶浓度为5000U/ml，250U/ml浓度过低，故选项E错误。"}, {"text": "导管纤维鞘形成的特点包括", "options": ["Ａ.导管功能不良主因之一", "Ｂ.多见于置管超过3月", "Ｃ.引血困难、回血无阻力", "Ｄ.尿激酶溶栓效果不佳", "Ｅ.多在置管1周内出现"], "answer": "ABCD", "explanation": "导管纤维鞘形成是导管功能不良的主要原因之一，多见于置管时间&gt;3月，表现为引血困难、回血无阻力，类似贴壁，且尿激酶溶栓效果不佳；其发生与置管时间较长有关，多在置管1周内出现不符合该特点，故选项E错误。"}, {"text": "中心静脉狭窄的防治要点包括", "options": ["Ａ.长期置管可致中心静脉狭窄", "Ｂ.锁骨下静脉更易发生", "Ｃ.应避免锁骨下静脉置管", "Ｄ.治疗首选PTA", "Ｅ.弹性再狭窄单用PTA即可"], "answer": "ABCD", "explanation": "长期置管可致中心静脉狭窄，锁骨下静脉更容易发生，并影响同侧建立血管通路，故应避免锁骨下静脉置管；治疗首选PTA，如果术后3月内发生有弹性的中心静脉再狭窄，应当使用支架联合PTA治疗，单用PTA不足，故选项E错误。"}, {"text": "CRBSI决定是否拔除导管时，提示应拔除导管的情况包括", "options": ["Ａ.抗生素治疗72h未控制", "Ｂ.停药后2周内菌血症复发", "Ｃ.短期导管应及早拔除", "Ｄ.免疫力低下、病情危重", "Ｅ.临床症状迅速消失"], "answer": "ABCD", "explanation": "抗生素治疗72h感染未控制，或停用抗生素后2周内菌血症复发，以及短期导管、免疫力低下、病情危重者应及早拔除导管；抗生素治疗后临床症状消失提示可以保留导管，故选项E错误。"}, {"text": "关于抗生素封管，正确的有", "options": ["Ａ.封管容量与导管腔相等", "Ｂ.2~3次/日，长效1次/日", "Ｃ.感染控制后继续3~5天", "Ｄ.氨基甙类可引起耳毒性", "Ｅ.与肝素混合绝无沉淀"], "answer": "ABCD", "explanation": "抗生素封管的封管容量与导管腔相等，频率为2~3次/日、长效抗生素1次/日，疗程为感染控制后继续3~5d、总疗程10~14d；氨基甙类抗生素封管可引起相关的耳毒性；临床实践中发现万古霉素、环丙沙星、庆大霉素与肝素盐水混合后会产生沉淀，故选项E错误。"}, {"text": "关于枸橼酸钠封管，正确的有", "options": ["Ａ.高浓度体外杀菌优于肝素", "Ｂ.螯合钙镁离子防生物膜", "Ｃ.可降低导管感染率", "Ｄ.可代替肝素治疗血流感染", "Ｅ.易引起高钙血症"], "answer": "ABCD", "explanation": "高浓度枸橼酸钠（33%~47%）体外杀菌和抗真菌效果优于肝素，可螯合钙镁离子预防细菌种植和生物膜形成，10%或20%的枸橼酸钠与庆大霉素封管可使感染率由4.5次/100患者月降到1.6次/100患者月，并可在万古霉素、环丙沙星、庆大霉素与肝素盐水混合产生沉淀时代替肝素封管；高浓度枸橼酸钠易引起的是低钙血症而非高钙血症，故选项E错误。"}, {"text": "患者自身因素中，属于导管相关性感染局部因素的有", "options": ["Ａ.卫生习惯差", "Ｂ.使用不透气敷料", "Ｃ.出口周围潮湿", "Ｄ.鼻腔携带金黄色葡萄球菌", "Ｅ.营养不良"], "answer": "ABCD", "explanation": "导管相关性感染的局部因素包括卫生习惯差、使用不透气敷料、出口周围潮湿、鼻腔及皮肤携带金黄色葡萄球菌等；营养不良属于全身因素，故选项E错误。"}, {"text": "导管相关性感染的预防措施中，患者方面包括", "options": ["Ａ.及时治疗鼻腔感染", "Ｂ.导管操作时戴口罩", "Ｃ.保持置管部位清洁干燥", "Ｄ.2%氯已定每日清洁皮肤1次", "Ｅ.常规使用不透气敷料"], "answer": "ABCD", "explanation": "患者方面的预防措施包括及时治疗鼻腔及其他部位致病菌感染、进行导管操作时戴好口罩、保持置管部位的清洁干燥、使用2%的氯已定每日清洁皮肤1次、做好个人卫生并参加导管护理的周期性培训；使用不透气敷料是感染的局部危险因素，故选项E错误。"}, {"text": "导管相关性感染的预防措施中，导管方面包括", "options": ["Ａ.尽量使用自体动静脉内瘘", "Ｂ.锁骨下优于颈内优于股静脉", "Ｃ.带隧道优于不带隧道导管", "Ｄ.选用有抗感染涂层的导管", "Ｅ.必须置管时优先选股静脉"], "answer": "ABCD", "explanation": "导管方面的预防措施为尽量使用自体动静脉内瘘或人造血管、减少深静脉置管；必须使用中心静脉置管时，置管部位选择顺序为锁骨下静脉优于颈内静脉优于股静脉，导管类型为带隧道导管优于不带隧道导管，并可使用带有抗感染或消毒剂涂层的导管；股静脉感染率最高，不能优先选择，故选项E错误。"}, {"text": "导管相关性感染的预防措施中，医疗护理方面包括", "options": ["Ａ.透析用水质量监控", "Ｂ.减少复用，选生物相容性好的透析器", "Ｃ.严格执行无菌操作", "Ｄ.使用一次性肝素帽", "Ｅ.尽量延长非长期导管留置时间"], "answer": "ABCD", "explanation": "医疗护理方面的预防措施包括做好透析用水的质量监控、减少复用并选用生物相容性好的透析器、血透治疗中严格执行无菌操作并做好空气消毒、限制非长期导管的留置时间、每次透析时检查导管出口处有无感染、使用一次性肝素帽、规范肝素封管操作、避免导管开口暴露在空气中、组织患者及家属进行周期性导管护理培训以及枸橼酸钠加抗生素封管；非长期导管的留置时间应限制而非延长，故选项E错误。"}]}, {"type": "short", "questions": [{"text": "简述发生空气栓塞时的紧急处理措施。", "options": [], "answer": "1.立即夹住导管，阻止空气继续进入；2.取头低足高左侧卧位；3.给予吸氧或高压氧治疗；4.对症处理，如升血压、镇静止痉等。", "explanation": "空气栓塞是留置导管的即刻并发症之一，颈内静脉和锁骨下静脉导管容易发生。处理的关键是立即阻断空气继续进入，并通过特殊体位、吸氧或高压氧以及升血压、镇静止痉等对症处理维持循环稳定。"}, {"text": "简述血液透析导管相关性感染的主要临床表现。", "options": [], "answer": "1.局部表现：导管出口处和隧道红肿、压痛、脓性分泌物渗出；2.全身表现：典型表现为透析1~2h后寒战、发热，血培养阳性；3.特殊表现：低热、体温偏低、嗜睡、意识模糊、低血压、低血糖等，多见于老年、糖尿病及处于免疫抑制状态的患者。", "explanation": "血透导管感染的类型包括导管出口感染、隧道感染和导管内感染（导管相关性血流感染），其中导管出口处和隧道感染占8%~21%。感染和血栓问题是影响血管通路使用的主要问题，血透患者48%~72%的脓毒血症由血管通路感染引起。"}, {"text": "简述血透导管相关性感染的相关因素。", "options": [], "answer": "1.患者自身因素：局部因素包括卫生习惯差、使用不透气敷料、出口周围潮湿、鼻腔及皮肤携带金黄色葡萄球菌等；全身因素包括免疫功能低下、营养不良、年龄、合并症如糖尿病，以及免疫抑制剂、补铁过度等药物影响；2.导管因素：置管部位、留置时间、导管感染史、导管表面的细菌黏附和生物膜的形成；3.医源性因素：血管通路、体外循环、透析器的生物相容性及复用、透析液及供液管路的污染、透析过程中的无菌操作，以及置管人员置管操作不熟练、无菌概念不强。", "explanation": "导管表面形成生物膜是CRBSI的发病基础，生物膜的形成是导致抗生素耐药的重要原因，也是CRBSI保留管道治疗失败的重要原因之一。有研究发现置锁骨下静脉导管少于50根的医师，其导管脓毒症的风险比熟练医师高2倍以上。"}, {"text": "简述导管相关性感染的预防措施（医疗护理方面）。", "options": [], "answer": "1.做好透析用水的质量监控，杜绝水源污染；2.减少复用，选用生物相容性好的透析器；3.血透治疗中严格执行无菌操作，做好空气消毒；4.限制非长期导管的留置时间；5.每次透析时检查导管出口处有无感染；6.建议使用一次性肝素帽；7.规范肝素封管操作；8.尽量避免导管开口暴露在空气中；9.组织患者及家属进行周期性导管护理培训；10.采用枸橼酸钠加抗生素封管。", "explanation": "2011年美国血管内导管相关感染防治指南要求使用最高级别的无菌屏障措施，包括佩戴口罩、帽子、无菌手套、无菌手术衣及患者全身覆盖无菌布，置管时使用含氯已定浓度&gt;0.5%的酒精溶液进行皮肤消毒。导管相关性感染的预防需要置管操作者、导管日常护理者、感染控制人员、导管供应商以及自己护理导管的患者共同协作。"}, {"text": "简述导管纤维鞘形成的特点及处理方法。", "options": [], "answer": "特点：1.是导管功能不良的主要原因之一；2.多见于置管时间超过3月；3.临床表现为引血困难、回血无阻力，类似贴壁；4.尿激酶溶栓效果不佳；5.可通过超声、造影检查发现。处理：1.尿激酶灌注2万u/h×6h；2.行纤维鞘剥脱术，用鹅颈样勒除器剥离；3.经导丝引导更换导管，拔管时忌边拔边压迫止血。", "explanation": "导管纤维鞘形成属于血管通路远期（使用中）并发症，与中心静脉狭窄、导管功能不良、感染同属使用中常见的问题，是导致中心静脉导管功能不良的重要原因；功能不良的最主要表现是血流量不足，其原因为血栓形成、导管打折、导管贴壁。"}]}]}, {"num": 38, "title": "血液净化的抗凝方式与注意事项理论考试题库", "sections": [{"type": "single", "questions": [{"text": "正常情况下，小血管受损后引起的出血在几分钟内就会自行停止，这种现象称为（  ）", "options": ["A.生理性止血", "B.血液凝固", "C.纤维蛋白溶解", "D.血栓形成", "E.血细胞凝集"], "answer": "A", "explanation": "正常情况下，小血管受损后引起的出血在几分钟内就会自行停止，这种现象称为生理性止血。它并非单一因子作用，而是血管壁收缩、血小板黏附聚集、凝血因子级联反应以及抗凝纤溶系统动态调控共同协作的结果。"}, {"text": "血小板黏附于受损血管内皮下胶原时，作为\"桥梁\"发挥连接作用的物质是（  ）", "options": ["A.vWF", "B.ADP", "C.血栓素A2", "D.组织因子", "E.纤维蛋白原"], "answer": "A", "explanation": "血管内皮破损暴露内皮下胶原，血小板通过vWF作为\"桥梁\"迅速黏附在受损部位；黏附的血小板被激活后释放ADP、血栓素A2等物质，正反馈招募更多血小板聚集，最终形成血小板栓子（白色血栓）。"}, {"text": "血液凝固的实质是（  ）", "options": ["A.可溶性纤维蛋白原转变为不溶性纤维蛋白", "B.不溶性纤维蛋白转变为可溶性纤维蛋白原", "C.纤维蛋白原转变为白蛋白", "D.球蛋白转变为纤维蛋白", "E.凝血酶原转变为纤维蛋白"], "answer": "A", "explanation": "血液凝固是指血液由流动的液体状态转变为不能流动的凝胶状态的过程，实质是将血浆中可溶性的纤维蛋白原转变为不溶性的纤维蛋白多聚体，凝血的过程离不开凝血因子的参与。"}, {"text": "由组织因子启动、反应迅速，在血管受损后数秒内即可触发的凝血途径是（  ）", "options": ["A.内源性途径", "B.共同通路", "C.纤溶途径", "D.外源性途径", "E.补体途径"], "answer": "D", "explanation": "按启动机制不同分为三条核心通路：外源性途径由组织因子（TF）启动，反应迅速，是凝血的\"快速启动开关\"，数秒内即可触发；内源性途径由接触激活启动，反应较慢；两者最终汇聚于共同通路，生成凝血酶并形成纤维蛋白凝块。"}, {"text": "内源性凝血途径的启动因子是（  ）", "options": ["A.因子Ⅶ", "B.因子Ⅹ", "C.因子Ⅻ", "D.因子Ⅱ", "E.因子ⅩⅢ"], "answer": "C", "explanation": "当血液接触带负电荷的异物表面（如血管受损处的胶原、玻璃等），即刻激活凝血因子Ⅻ，由此开启内源性凝血的级联反应：因子Ⅻ→Ⅻa→Ⅺ→Ⅺa→Ⅸ→Ⅸa，随后Ⅸa与Ⅷa、Ca²⁺及血小板磷脂形成因子Ⅹ酶复合物，高效激活因子Ⅹ。"}, {"text": "次级止血功能异常导致凝血时间显著延长，如甲型血友病患者缺乏的凝血因子是（  ）", "options": ["A.Ⅴ因子", "B.Ⅶ因子", "C.Ⅷ因子", "D.Ⅹ因子", "E.Ⅻ因子"], "answer": "C", "explanation": "凝血因子缺乏或功能异常会导致凝血时间显著延长，临床上常表现为深部组织出血、关节腔出血或肌肉血肿，典型疾病如甲型血友病（缺乏Ⅷ因子）。"}, {"text": "评估外源性凝血途径功能，也是监测口服抗凝药华法林疗效的核心实验室指标是（  ）", "options": ["A.APTT与D-二聚体", "B.PT与INR", "C.ACT与血小板计数", "D.抗Xa因子活性", "E.血乳酸"], "answer": "B", "explanation": "外源性凝血途径主要通过凝血酶原时间（PT）及国际标准化比值（INR）来评估，是监测口服抗凝药（如华法林）疗效的核心实验室指标。"}, {"text": "筛查内源性凝血功能异常及监测肝素抗凝效果的首选实验室指标是（  ）", "options": ["A.PT", "B.INR", "C.APTT", "D.D-二聚体", "E.血小板计数"], "answer": "C", "explanation": "内源性凝血途径通过检测活化部分凝血活酶时间（APTT）来评估其功能状态，是临床上筛查内源性凝血功能异常及监测肝素抗凝效果的首选实验室指标。"}, {"text": "共同通路中形成的凝血酶原酶复合物的组成是（  ）", "options": ["A.TF与Ⅶa", "B.Ⅹa与Va、Ca²⁺及血小板磷脂", "C.Ⅻa与Ⅺa", "D.Ⅷa与Ⅸa", "E.凝血酶与纤维蛋白原"], "answer": "B", "explanation": "共同通路中，激活的因子Ⅹa与Va、钙离子（Ca²⁺）及血小板磷脂（PL）结合，形成高活性的凝血酶原酶复合物，将无活性的凝血酶原（因子Ⅱ）快速转化为凝血酶（因子Ⅱa）。"}, {"text": "使纤维蛋白丝之间形成不可逆共价交联、将软凝块转化为坚固硬凝块的凝血因子是（  ）", "options": ["A.Ⅹa", "B.ⅩⅢa", "C.Ⅱa", "D.Ⅻa", "E.Ⅶa"], "answer": "B", "explanation": "凝血酶激活因子ⅩⅢ为ⅩⅢa，使纤维蛋白丝间形成不可逆的共价交联，将初始形成的软凝块转化为坚固稳定的硬凝块。"}, {"text": "血浆中含量最丰富、约占体内总抗凝活性70%的生理性抗凝物质是（  ）", "options": ["A.蛋白C", "B.抗凝血酶", "C.组织因子途径抑制物", "D.肝素", "E.纤溶酶"], "answer": "B", "explanation": "抗凝血酶（AT）是体内最重要的抗凝物质之一，约占体内总抗凝活性的70%，可抑制凝血酶及多种凝血因子的活性，是凝血瀑布反应的关键负调控因子。"}, {"text": "抗凝血酶主要由哪种细胞合成并分泌入血（  ）", "options": ["A.肝脏实质细胞", "B.肾小管上皮细胞", "C.血小板", "D.中性粒细胞", "E.心肌细胞"], "answer": "A", "explanation": "抗凝血酶主要由肝脏实质细胞合成并分泌入血，血管内皮细胞也可少量产生，是血浆中含量最丰富、最重要的生理性抗凝蛋白，承担了约70%的血浆总抗凝活性。"}, {"text": "蛋白C系统通过灭活哪些凝血因子来阻断凝血过程（  ）", "options": ["A.Ⅹa和Ⅱa", "B.Ⅴa和Ⅷa", "C.Ⅺa和Ⅻa", "D.Ⅶa和Ⅸa", "E.ⅩⅢa和Ⅱa"], "answer": "B", "explanation": "蛋白C（PC）系统是维生素K依赖性抗凝体系，通过灭活凝血因子Ⅴa和Ⅷa阻断凝血过程，并激活纤溶酶原激活物抑制剂的降解，实现抗凝与促纤溶的双重效应。"}, {"text": "组织因子途径抑制物抑制外源性凝血途径的方式是（  ）", "options": ["A.阻断组织因子与凝血因子Ⅶa的结合", "B.灭活凝血因子Ⅴa和Ⅷa", "C.直接降解纤维蛋白", "D.抑制血小板黏附与聚集", "E.激活纤溶酶原"], "answer": "A", "explanation": "组织因子途径抑制物特异性抑制外源性凝血途径的启动阶段，直接阻断组织因子（TF）与凝血因子Ⅶa的结合，从源头精准遏制凝血反应的发生与放大。"}, {"text": "未有效质控时，血液透析的凝血发生率可高达（  ）", "options": ["A.5.00%", "B.10.00%", "C.15.00%", "D.25.00%", "E.50.00%"], "answer": "D", "explanation": "抗凝不足时凝血块直接堵塞透析器纤维与管路，造成透析效率急剧下降；临床数据显示，未有效质控时凝血发生率可高达25.00%。"}, {"text": "血液透析患者重大出血事件的发生率为（  ）", "options": ["A.0.5%/人/年", "B.1.5%/人/年", "C.2.5%/人/年", "D.5.0%/人/年", "E.10.0%/人/年"], "answer": "C", "explanation": "抗凝过度的临床数据警示：血液透析患者重大出血事件发生率为2.5%/人/年，透析人群出血发生频次统计为60.8次/千/年。"}, {"text": "透析人群出血发生频次的统计结果为（  ）", "options": ["A.6.08次/千/年", "B.16.8次/千/年", "C.60.8次/千/年", "D.68.0次/千/年", "E.608次/千/年"], "answer": "C", "explanation": "透析人群出血发生频次统计为60.8次/千/年；同时血液透析患者重大出血事件发生率为2.5%/人/年。"}, {"text": "抗凝治疗最主要的不良反应是（  ）", "options": ["A.出血", "B.过敏反应", "C.溶血", "D.发热", "E.高钾血症"], "answer": "A", "explanation": "出血是抗凝治疗最主要的不良反应，可累及全身多系统。轻者表现为皮肤瘀斑、鼻衄或牙龈渗血；严重时可引发消化道大出血，甚至是死亡率极高的颅内出血。"}, {"text": "抗凝过度时可发生、死亡率极高的最严重出血并发症是（  ）", "options": ["A.皮肤瘀斑", "B.鼻衄", "C.牙龈渗血", "D.颅内出血", "E.穿刺点渗血"], "answer": "D", "explanation": "抗凝过度时轻者表现为皮肤瘀斑、鼻衄或牙龈渗血，严重时可引发消化道大出血，甚至死亡率极高的颅内出血，直接威胁患者生命安全。"}, {"text": "制定抗凝方案评估出血风险时，应重点了解患者近多长时间内的手术或创伤史（  ）", "options": ["A.1周", "B.1个月", "C.3个月", "D.6个月", "E.1年"], "answer": "C", "explanation": "出血风险是抗凝方案选择的前提，重点评估活动性出血、近3个月内手术或创伤史、凝血功能障碍及消化道溃疡等。存在高危出血风险时，应优先选择局部抗凝（如枸橼酸）或无肝素透析方案。"}, {"text": "对于无出血风险、无禁忌证的患者，血液透析抗凝首选（  ）", "options": ["A.枸橼酸钠局部抗凝", "B.无肝素透析", "C.阿加曲班", "D.甲磺酸萘莫司他", "E.普通肝素或低分子肝素"], "answer": "E", "explanation": "无出血风险、无禁忌证的患者首选普通肝素或低分子肝素，这是临床最基础的抗凝方案，具备抗凝效果明确、剂量调整灵活、监测手段成熟的优势，适用于绝大多数非高风险患者。"}, {"text": "对于高出血风险或活动性出血的患者，血液透析抗凝首选（  ）", "options": ["A.普通肝素", "B.低分子肝素", "C.枸橼酸钠局部抗凝或甲磺酸萘莫司他", "D.阿加曲班", "E.华法林"], "answer": "C", "explanation": "高出血风险或活动性出血的患者首选枸橼酸钠局部抗凝（仅作用于体外循环，全身出血风险极低）或甲磺酸萘莫司他；若存在药物禁忌，可选择无肝素透析，治疗中需严密监测管路凝血情况。"}, {"text": "因主要经肝脏代谢，肝功能不全者应慎用的抗凝药物是（  ）", "options": ["A.普通肝素", "B.阿加曲班", "C.枸橼酸钠", "D.甲磺酸萘莫司他", "E.低分子肝素"], "answer": "B", "explanation": "肝肾功能是药物代谢的基础：肝功能不全者慎用依赖肝脏代谢的药物（如阿加曲班）；肾功能衰竭会影响低分子肝素的清除，需根据残余肾功能调整剂量，避免药物蓄积导致出血风险增加。"}, {"text": "抗凝治疗前需要检测的凝血相关指标不包括（  ）", "options": ["A.血小板计数", "B.APTT", "C.PT/INR", "D.D-二聚体", "E.血型鉴定"], "answer": "E", "explanation": "凝血指标是动态监测的核心：术前检测血小板计数、APTT、PT/INR及D-二聚体，透析过程中及间期动态监测，依据指标变化及时调整抗凝方案，确保抗凝效果在安全范围内。"}, {"text": "仅作用于体外循环管路内、对患者体内凝血功能影响极小的抗凝方式属于（  ）", "options": ["A.全身抗凝", "B.局部抗凝", "C.溶栓治疗", "D.口服抗凝", "E.血液灌流"], "answer": "B", "explanation": "局部抗凝仅在体外循环管路内实现抗凝效果，对患者体内凝血功能影响极小，显著降低出血风险，核心药物包括枸橼酸钠（RCA方案）、局部肝素冲洗和奈莫司他。"}, {"text": "存在药物禁忌、无法使用枸橼酸抗凝的高出血风险患者，可选择（  ）", "options": ["A.普通肝素全身抗凝", "B.低分子肝素全身抗凝", "C.无肝素透析", "D.加倍剂量肝素抗凝", "E.口服华法林"], "answer": "C", "explanation": "无肝素透析全程不使用任何抗凝药物，依靠物理手段维持管路通畅，专为高出血风险患者设计，实施要点包括生理盐水定时冲洗管路和密切监测跨膜压（TMP）。"}, {"text": "普通肝素的绝对禁忌证是（  ）", "options": ["A.轻度高血压", "B.活动性出血及确诊或疑似肝素诱导的血小板减少症", "C.单纯贫血", "D.老年患者", "E.2型糖尿病"], "answer": "B", "explanation": "普通肝素的绝对禁忌为活动性出血（如颅内、消化道大出血）以及确诊或疑似肝素诱导的血小板减少症（HIT）；相对禁忌包括严重凝血功能障碍、未控制的重度高血压、近期颅脑或眼部手术史及其他高出血风险状态。"}, {"text": "使用普通肝素抗凝时，APTT应维持在正常值的（  ）", "options": ["A.1.0-1.5倍", "B.1.5-2.5倍", "C.2.5-3.5倍", "D.3.5-5.0倍", "E.5.0-10.0倍"], "answer": "B", "explanation": "普通肝素抗凝效果个体差异大，需监测APTT并维持在正常值1.5-2.5倍；该范围可保障抗凝有效性，同时规避出血风险，是临床调整肝素剂量的核心依据。"}, {"text": "普通肝素用药后需警惕肝素诱导的血小板减少症（HIT），其高发时间为用药后（  ）", "options": ["A.1-2天", "B.3-4天", "C.5-14天", "D.15-20天", "E.1个月以后"], "answer": "C", "explanation": "使用普通肝素时应密切监测血小板计数，警惕用药后5-14天内发生肝素诱导的血小板减少症（HIT），一旦确诊需立即停用。"}, {"text": "普通肝素透析前用肝素生理盐水闭路循环透析器及管路的循环时间是（  ）", "options": ["A.1-5分钟", "B.10-15分钟", "C.20-30分钟", "D.30-45分钟", "E.45-60分钟"], "answer": "B", "explanation": "普通肝素透析的管路预冲准备为：使用肝素生理盐水闭路循环透析器及管路10-15分钟，随后完全排空，确保管路系统充分肝素化，防止凝血。"}, {"text": "普通肝素透析治疗前经静脉端一次性推注的负荷剂量通常为（  ）", "options": ["A.0.1-0.2 mg/kg", "B.0.3-0.5 mg/kg", "C.1.0-2.0 mg/kg", "D.3.0-5.0 mg/kg", "E.5.0-10.0 mg/kg"], "answer": "B", "explanation": "普通肝素治疗前首剂推注在透析开始前5-15分钟经静脉端一次性推注负荷剂量，通常为0.3-0.5 mg/kg，剂量需根据患者体重、基础凝血功能及出血风险个体化调整。"}, {"text": "普通肝素透析过程中从动脉端持续泵入的维持剂量通常为（  ）", "options": ["A.0.5-1 mg/h", "B.1-2 mg/h", "C.5-10 mg/h", "D.10-20 mg/h", "E.20-30 mg/h"], "answer": "C", "explanation": "普通肝素过程中持续输注，从动脉端持续泵入肝素，维持剂量通常为5-10 mg/h，并建议每1-2小时监测活化凝血时间（ACT），根据监测结果动态调整泵入速度。"}, {"text": "为减少透析后出血风险，普通肝素应在治疗结束前多长时间停止追加（  ）", "options": ["A.5-10分钟", "B.15分钟", "C.30-60分钟", "D.2小时", "E.不需要提前停药"], "answer": "C", "explanation": "为减少透析后出血风险，在治疗结束前30-60分钟停止追加肝素，对于出血高危患者可适当提前停药时间。"}, {"text": "透析中使用活化凝血时间（ACT）监测普通肝素抗凝效果，其理想控制范围是（  ）", "options": ["A.60-90秒", "B.90-120秒", "C.120-150秒", "D.180-220秒", "E.250-300秒"], "answer": "D", "explanation": "活化凝血时间（ACT）建议维持在180-220秒，该区间能有效防止透析器及管路凝血，同时减少出血等不良反应；ACT支持床旁快速检测，结果即时可得。"}, {"text": "肝素过量导致严重出血时用于中和的药物及其剂量关系是（  ）", "options": ["A.维生素K 1mg中和100U肝素", "B.鱼精蛋白1mg中和100U肝素", "C.鱼精蛋白10mg中和100U肝素", "D.氨甲环酸1mg中和100U肝素", "E.钙剂1mg中和100U肝素"], "answer": "B", "explanation": "若发生严重出血或肝素过量，立即遵医嘱使用鱼精蛋白进行中和，标准剂量为1mg鱼精蛋白中和100U肝素，需缓慢静脉注射，并持续监测凝血指标。"}, {"text": "透析结束拔针后采用阶梯式压迫法按压穿刺点，其按压时间至少为（  ）", "options": ["A.1-2分钟", "B.3-5分钟", "C.5-10分钟", "D.15-20分钟", "E.30-40分钟"], "answer": "D", "explanation": "透析结束拔针后，采用阶梯式压迫法按压穿刺点至少15-20分钟，力度以能触及血管震颤但不出血为宜，避免过度压迫导致内瘘闭塞或皮下血肿。"}, {"text": "低分子肝素用于严重肾功能不全患者时需慎用或减量，其肌酐清除率界限是（  ）", "options": ["A.小于90 ml/min", "B.小于60 ml/min", "C.小于45 ml/min", "D.小于30 ml/min", "E.小于10 ml/min"], "answer": "D", "explanation": "低分子肝素主要经肾脏排泄，严重肾功能不全者（肌酐清除率＜30 ml/min）需慎用或减量，肾功能异常易导致药物蓄积，显著增加出血风险。"}, {"text": "低分子肝素透析时，依诺肝素的常规剂量为（  ）", "options": ["A.20-40 U/kg", "B.60-80 U/kg", "C.100-200 U/kg", "D.300-500 U/kg", "E.1000 U/kg"], "answer": "B", "explanation": "低分子肝素于透析开始前一次性静脉推注，剂量需个体化调整，常规剂量为依诺肝素60-80 U/kg，或达肝素5000 IU，具体视患者体重及出血风险而定。"}, {"text": "低分子肝素单次足量给药即可维持整个透析过程的抗凝效果，其半衰期约为（  ）", "options": ["A.0.5-1小时", "B.1-2小时", "C.3-5小时", "D.8-12小时", "E.24小时"], "answer": "C", "explanation": "低分子肝素得益于较长的半衰期（约3-5小时），单次足量给药即可稳定维持整个透析过程（通常4小时）的抗凝效果，无需术中追加剂量。"}, {"text": "目前唯一能精准反映低分子肝素抗凝效果的实验室指标是（  ）", "options": ["A.APTT", "B.PT", "C.INR", "D.抗Xa因子活性", "E.ACT"], "answer": "D", "explanation": "抗Xa因子活性是目前唯一能精准反映低分子肝素抗凝效果的实验室指标，是判断药物剂量是否适宜的核心依据；APTT对低分子肝素的抗凝作用缺乏敏感性，严禁作为调整剂量的依据。"}, {"text": "低分子肝素治疗剂量时，抗Xa因子活性的推荐峰值范围是（  ）", "options": ["A.0.1-0.2 IU/ml", "B.0.2-0.5 IU/ml", "C.0.5-1.0 IU/ml", "D.1.0-2.0 IU/ml", "E.2.0-5.0 IU/ml"], "answer": "C", "explanation": "低分子肝素抗Xa因子活性的推荐治疗窗：治疗剂量峰值建议维持在0.5-1.0 IU/ml；预防剂量通常在0.2-0.5 IU/ml之间，以确保安全有效。"}, {"text": "鱼精蛋白对低分子肝素的作用特点是（  ）", "options": ["A.仅能部分中和其抗Xa活性，约60%", "B.可完全逆转其抗凝作用", "C.可增强其抗凝作用", "D.与低分子肝素无相互作用", "E.可中和全部抗Ⅱa活性"], "answer": "A", "explanation": "鱼精蛋白仅能部分中和低分子肝素的抗Xa活性（约60%），无法完全逆转其抗凝作用，目前尚无特效解毒剂，一旦发生严重出血应以支持治疗为主，因此预防是避免此类风险的关键。"}, {"text": "枸橼酸钠在体外循环动脉端泵入后螯合游离钙离子，使管路内Ca²⁺浓度降至（  ）", "options": ["A.0.1 mmol/L以下", "B.0.4 mmol/L以下", "C.1.0 mmol/L以下", "D.1.2 mmol/L以下", "E.2.0 mmol/L以下"], "answer": "B", "explanation": "在体外循环的动脉端泵入枸橼酸钠，其分子结构能特异性螯合血液中的游离钙离子（Ca²⁺），使管路内Ca²⁺浓度迅速降至0.4 mmol/L以下，从而从源头阻断凝血瀑布的启动。"}, {"text": "枸橼酸钠局部抗凝时，滤器后离子钙（iCa）的目标范围是（  ）", "options": ["A.0.1-0.2 mmol/L", "B.0.2-0.4 mmol/L", "C.0.5-0.8 mmol/L", "D.1.0-1.2 mmol/L", "E.1.2-1.5 mmol/L"], "answer": "B", "explanation": "枸橼酸钠抗凝监测要点：滤器后离子钙（iCa）应维持在0.2-0.4 mmol/L，重点在于确保体外循环管路内达到有效抗凝，防止滤器及管路发生凝血。"}, {"text": "枸橼酸钠局部抗凝时，患者体内离子钙（iCa）应维持在（  ）", "options": ["A.0.1-0.2 mmol/L", "B.0.2-0.4 mmol/L", "C.0.5-0.8 mmol/L", "D.1.0-1.2 mmol/L", "E.1.3-1.6 mmol/L"], "answer": "D", "explanation": "枸橼酸钠抗凝中，患者体内离子钙（iCa）应维持在1.0-1.2 mmol/L，以维持体内血钙水平在正常范围，避免因低钙血症引发手足抽搐、心律失常，同时防止高钙血症。"}, {"text": "枸橼酸钠局部抗凝的绝对禁忌证是（  ）", "options": ["A.严重肝功能不全", "B.轻度贫血", "C.单纯性高血压", "D.老年患者", "E.皮肤瘙痒"], "answer": "A", "explanation": "枸橼酸主要经肝脏代谢，存在枸橼酸代谢障碍或严重内环境紊乱时严禁使用：绝对禁忌包括严重肝功能不全、严重低氧血症（抑制三羧酸循环）、严重休克、高钠血症或难以纠正的代谢性碱中毒。"}, {"text": "无肝素透析时将血液流速维持在多少以上，可降低血液在管路内的滞留时间（  ）", "options": ["A.100-150 ml/min", "B.150-200 ml/min", "C.200-250 ml/min", "D.250-300 ml/min", "E.400-500 ml/min"], "answer": "D", "explanation": "无肝素透析应维持高血流量运行，将血液流速维持在250-300 ml/min以上，充足的血流量能降低血液在管路内的滞留时间，减少红细胞聚集，从根本上降低凝血发生的概率。"}, {"text": "无肝素透析时使用生理盐水冲洗管路与透析器的频次和用量是（  ）", "options": ["A.每5-10分钟50 ml", "B.每15-30分钟100-200 ml", "C.每30分钟500 ml", "D.每1小时500 ml", "E.每2小时100 ml"], "answer": "B", "explanation": "无肝素透析需定时生理盐水冲洗，每15-30分钟使用100-200 ml生理盐水快速冲洗管路与透析器，及时清除管路内壁附着的凝血因子和微小血栓，保持管路通畅。"}, {"text": "属于小分子直接凝血酶抑制剂、不依赖体内抗凝血酶即可发挥抗凝作用的药物是（  ）", "options": ["A.阿加曲班", "B.普通肝素", "C.低分子肝素", "D.枸橼酸钠", "E.华法林"], "answer": "A", "explanation": "阿加曲班是合成的精氨酸衍生物，属于小分子直接凝血酶抑制剂，直接与凝血酶的活性位点结合，抑制其将纤维蛋白原转化为纤维蛋白的能力；因其不依赖体内抗凝血酶（AT），在AT缺乏或耗竭时仍能有效抗凝。"}, {"text": "甲磺酸萘莫司他用于抗凝时需重点监测的不良反应是（  ）", "options": ["A.低钾血症", "B.低钠血症", "C.高钾血症", "D.低钙血症", "E.高血糖"], "answer": "C", "explanation": "甲磺酸萘莫司他是广谱丝氨酸蛋白酶抑制剂，可直接抑制凝血酶、Ⅹa因子、Ⅻa因子等活性，无需依赖抗凝血酶；需重点监测高钾血症这一重要不良反应，偶见过敏反应、粒细胞减少等，本品无特异性拮抗剂。"}]}, {"type": "multiple", "questions": [{"text": "生理性止血是多种机制精密联动的复杂协作过程，其参与环节包括（  ）", "options": ["Ａ.血管壁收缩", "Ｂ.血小板黏附与聚集", "Ｃ.凝血因子级联反应", "Ｄ.抗凝与纤溶系统动态调控", "Ｅ.肾小管重吸收"], "answer": "ABCD", "explanation": "生理性止血并非单一因子作用，而是血管壁收缩、血小板黏附聚集、凝血因子级联反应以及抗凝纤溶系统动态调控的复杂协作，各环节环环相扣，共同构建坚固的血凝块并防止凝血过度扩散。肾小管重吸收属于尿液生成过程，与止血无关。"}, {"text": "凝血瀑布是凝血因子相继被激活的酶促级联反应，其包含的基本途径有（  ）", "options": ["Ａ.外源性途径", "Ｂ.内源性途径", "Ｃ.共同通路", "Ｄ.纤溶途径", "Ｅ.补体途径"], "answer": "ABC", "explanation": "凝血瀑布分为三条核心通路：外源性途径负责快速启动，内源性途径负责信号放大与维持，最终汇聚于共同通路，生成凝血酶并形成不溶性纤维蛋白凝块。纤溶途径和补体途径不属于凝血瀑布的组成途径。"}, {"text": "关于外源性凝血途径，下列描述正确的有（  ）", "options": ["Ａ.由组织因子与因子Ⅶ启动", "Ｂ.反应迅速，数秒内即可触发", "Ｃ.通过PT及INR评估其功能", "Ｄ.是体内凝血启动的最主要途径", "Ｅ.由接触激活因子Ⅻ启动"], "answer": "ABCD", "explanation": "外源性途径由组织因子（TF，凝血因子Ⅲ）与因子Ⅶ结合形成TF-Ⅶa复合物启动，反应步骤极少、数秒内即可完成，是体内生理性止血和凝血启动的最主要途径，主要通过凝血酶原时间（PT）及国际标准化比值（INR）评估。由接触激活因子Ⅻ启动的是内源性途径。"}, {"text": "关于内源性凝血途径，下列描述正确的有（  ）", "options": ["Ａ.由凝血因子Ⅻ接触激活启动", "Ｂ.反应较慢，耗时数分钟", "Ｃ.核心作用是放大凝血信号并维持凝血瀑布", "Ｄ.通过APTT评估其功能状态", "Ｅ.是凝血启动的最主要途径"], "answer": "ABCD", "explanation": "内源性途径由凝血因子Ⅻ接触带负电荷异物表面激活启动，反应步骤繁琐、启动较慢，其核心作用在于放大凝血信号并持续维持凝血瀑布的进行，通过活化部分凝血活酶时间（APTT）评估。凝血启动的最主要途径是外源性途径。"}, {"text": "共同通路中纤维蛋白凝块的形成过程包括（  ）", "options": ["Ａ.Ⅹa与Va、Ca²⁺及血小板磷脂形成凝血酶原酶复合物", "Ｂ.凝血酶原转化为凝血酶", "Ｃ.凝血酶切割纤维蛋白原形成纤维蛋白单体", "Ｄ.凝血酶激活因子ⅩⅢ为ⅩⅢa实现共价交联", "Ｅ.纤溶酶降解纤维蛋白网"], "answer": "ABCD", "explanation": "共同通路中，Ⅹa与Va、Ca²⁺及血小板磷脂形成凝血酶原酶复合物，将凝血酶原转化为凝血酶；凝血酶切割纤维蛋白原使其转化为纤维蛋白单体，单体自发聚合形成网状结构；凝血酶再激活因子ⅩⅢ为ⅩⅢa，使纤维蛋白丝间形成不可逆共价交联。纤溶酶降解纤维蛋白网属于纤溶过程，不属于凝块形成环节。"}, {"text": "机体的生理性抗凝系统主要包括（  ）", "options": ["Ａ.抗凝血酶", "Ｂ.蛋白C系统", "Ｃ.组织因子途径抑制物", "Ｄ.凝血因子Ⅶ", "Ｅ.血小板"], "answer": "ABC", "explanation": "为防止凝血过程过度激活导致血栓形成，机体内存在以抗凝血酶、蛋白C系统、组织因子途径抑制物（TFPI）为代表的生理性抗凝网络，与凝血系统动态博弈。凝血因子Ⅶ和血小板均参与促进凝血，不属于抗凝系统。"}, {"text": "关于抗凝血酶（AT）的特点，下列描述正确的有（  ）", "options": ["Ａ.主要由肝脏实质细胞合成", "Ｂ.约占血浆总抗凝活性的70%", "Ｃ.能与凝血酶、Ⅹa、Ⅸa等活化凝血因子结合使其失活", "Ｄ.肝素需通过与AT结合才能发挥抗凝作用", "Ｅ.属于维生素K依赖性抗凝物质"], "answer": "ABCD", "explanation": "抗凝血酶主要由肝脏实质细胞合成并分泌入血，是血浆中含量最丰富的生理性抗凝蛋白，承担约70%的血浆总抗凝活性，能与凝血酶（Ⅱa）、Ⅹa、Ⅸa、Ⅺa、Ⅻa等结合使其活性中心失活；肝素本身无直接抗凝活性，必须通过与AT结合使其抑制效率增强约1000倍。维生素K依赖性抗凝体系是蛋白C系统，不是抗凝血酶。"}, {"text": "抗凝不足可导致的危害包括（  ）", "options": ["Ａ.透析器与管路凝血", "Ｂ.透析效能严重不足", "Ｃ.血液资源丢失", "Ｄ.血栓栓塞并发症", "Ｅ.颅内出血"], "answer": "ABCD", "explanation": "抗凝不足会直接引发体外循环管路凝血，造成透析效率下降、有效透析面积减少致尿素清除率下降、凝血后常需丢弃含血栓的血液造成血液丢失，脱落微血栓还可能引发肺栓塞、脑栓塞或肢体动脉栓塞。颅内出血是抗凝过度的严重并发症，不属于抗凝不足的危害。"}, {"text": "抗凝过度可导致的后果包括（  ）", "options": ["Ａ.皮肤瘀斑、鼻衄等出血表现", "Ｂ.消化道大出血", "Ｃ.颅内出血", "Ｄ.需紧急输血并带来输血相关感染风险", "Ｅ.透析器凝血致尿素清除率下降"], "answer": "ABCD", "explanation": "抗凝过度显著增加出血倾向，轻者皮肤瘀斑、鼻衄或牙龈渗血，严重时可引发消化道大出血甚至死亡率极高的颅内出血；严重出血常需紧急输血干预，加重经济负担并带来输血相关感染（如肝炎、HIV等）风险。透析器凝血致尿素清除率下降是抗凝不足的后果。"}, {"text": "制定血液透析抗凝方案时需综合评估的内容包括（  ）", "options": ["Ａ.出血风险", "Ｂ.血栓风险", "Ｃ.肝肾功能", "Ｄ.凝血指标", "Ｅ.患者身高"], "answer": "ABCD", "explanation": "血液透析抗凝方案的制定需遵循个体化原则，核心在于平衡出血风险与血栓风险，并结合肝肾功能及凝血指标制定精准、安全的抗凝策略。患者身高不属于抗凝方案制定的评估依据。"}, {"text": "评估血液透析患者出血风险时，应重点了解的内容包括（  ）", "options": ["Ａ.活动性出血", "Ｂ.近3个月内手术或创伤史", "Ｃ.凝血功能障碍", "Ｄ.消化道溃疡", "Ｅ.视力状况"], "answer": "ABCD", "explanation": "出血风险是抗凝方案选择的前提，重点评估活动性出血、近3个月内手术或创伤史、凝血功能障碍及消化道溃疡等；存在高危出血风险时应优先选择局部抗凝（如枸橼酸）或无肝素透析方案。视力状况与出血风险评估无关。"}, {"text": "血液透析常用的局部抗凝方式包括（  ）", "options": ["Ａ.枸橼酸钠（RCA方案）", "Ｂ.局部肝素冲洗", "Ｃ.奈莫司他", "Ｄ.普通肝素全身用药", "Ｅ.华法林口服抗凝"], "answer": "ABC", "explanation": "局部抗凝仅在体外循环管路内实现抗凝效果，对患者体内凝血功能影响极小，核心药物包括枸橼酸钠（RCA方案）、局部肝素冲洗和奈莫司他。普通肝素全身用药和口服华法林均作用于整个机体，属于全身抗凝范畴。"}, {"text": "关于无肝素透析的实施要点，下列描述正确的有（  ）", "options": ["Ａ.全程不使用任何抗凝药物", "Ｂ.生理盐水定时冲洗管路", "Ｃ.密切监测跨膜压（TMP）", "Ｄ.适用于高出血风险患者", "Ｅ.依靠口服抗凝药维持管路通畅"], "answer": "ABCD", "explanation": "无肝素透析全程不使用任何抗凝药物，依靠物理手段维持管路通畅，专为高出血风险患者设计，实施要点包括生理盐水定时冲洗管路和密切监测跨膜压（TMP）。该方式完全不使用抗凝药物，依靠口服抗凝药是错误的。"}, {"text": "无肝素透析维持体外循环通畅所采用的物理措施包括（  ）", "options": ["Ａ.维持高血流量以降低血液滞留", "Ｂ.定期用生理盐水冲洗管路与透析器", "Ｃ.保持患者充足血容量", "Ｄ.连续静脉输注肝素", "Ｅ.尽量减少管路内血液停滞与湍流"], "answer": "ABCE", "explanation": "无肝素透析的物理抗凝核心机制为：维持高血流量以降低血液滞留；定期用生理盐水冲洗管路与透析器，清除微血栓与纤维蛋白沉积；保持患者充足血容量，防止血液浓缩加剧凝血；操作中减少管路内血液停滞与湍流，避免不必要的管路断开、反复抽吸或调整。连续静脉输注肝素属于药物抗凝，与无肝素透析相悖。"}, {"text": "关于普通肝素（UFH）的特点，下列描述正确的有（  ）", "options": ["Ａ.作用可被鱼精蛋白中和", "Ｂ.价格低廉", "Ｃ.个体差异大，需监测APTT调整剂量", "Ｄ.半衰期约1-2小时，需持续静脉给药", "Ｅ.主要经肾脏排泄，肾功能不全者必须减量"], "answer": "ABCD", "explanation": "普通肝素价格低廉且作用可被鱼精蛋白中和，分子量为3000-30000道尔顿的混合物，半衰期短（约1-2小时）需持续静脉给药；其个体差异大，出血风险相对较高，需密切监测APTT以调整剂量。普通肝素主要经肝脏代谢、少量经肾脏排泄，主要经肾脏排泄且必须减量的是低分子肝素。"}, {"text": "关于低分子肝素（LMWH）的特点，下列描述正确的有（  ）", "options": ["Ａ.生物利用度高", "Ｂ.抗Xa/抗Ⅱa活性比值高达3-4:1", "Ｃ.主要经肾脏排泄，肾功能不全者需谨慎使用", "Ｄ.出血及HIT发生率显著低于普通肝素", "Ｅ.可被鱼精蛋白完全中和"], "answer": "ABCD", "explanation": "低分子肝素生物利用度高，通过抑制因子Ⅹa发挥作用，抗Xa/抗Ⅱa活性比值高达3-4:1；主要经肾脏排泄，肾功能不全者需谨慎使用以防蓄积；出血及肝素诱导的血小板减少症（HIT）发生率显著低于普通肝素。鱼精蛋白仅能部分中和其抗Xa活性（约60%），不能完全逆转，故可被完全中和是错误的。"}, {"text": "关于枸橼酸钠的抗凝机制与药代动力学，下列描述正确的有（  ）", "options": ["Ａ.通过螯合血液中游离钙离子阻断凝血瀑布", "Ｂ.主要在肝脏、肌肉及肾脏中转化", "Ｃ.最终氧化为碳酸氢钠", "Ｄ.血浆半衰期约5-15分钟", "Ｅ.主要经肾脏以原形排出"], "answer": "ABCD", "explanation": "枸橼酸钠通过强力螯合血液中的游离钙离子使其浓度骤降，从而阻断凝血瀑布的共同通路；它主要在肝脏、肌肉及肾脏中迅速转化，最终氧化为碳酸氢钠，参与机体酸碱平衡调节；血浆半衰期极短，约为5-15分钟，正常生理状态下几乎不产生药物蓄积。其代谢产物为碳酸氢钠而非以原形经肾脏排出。"}, {"text": "枸橼酸钠局部抗凝的绝对禁忌证包括（  ）", "options": ["Ａ.严重肝功能不全", "Ｂ.严重低氧血症", "Ｃ.严重休克", "Ｄ.难以纠正的代谢性碱中毒", "Ｅ.轻度贫血"], "answer": "ABCD", "explanation": "枸橼酸主要经肝脏代谢，存在枸橼酸代谢障碍或严重内环境紊乱时严禁使用：绝对禁忌包括严重肝功能不全、严重低氧血症（抑制三羧酸循环影响代谢）、严重休克、高钠血症或难以纠正的代谢性碱中毒。轻度贫血不属于禁忌证。"}, {"text": "关于阿加曲班，下列描述正确的有（  ）", "options": ["Ａ.属于小分子直接凝血酶抑制剂", "Ｂ.不依赖体内抗凝血酶即可发挥抗凝作用", "Ｃ.主要经肝脏代谢，血浆半衰期约40-50分钟", "Ｄ.肾功能不全或透析患者无需调整剂量", "Ｅ.已有特异性解毒剂可完全逆转其作用"], "answer": "ABCD", "explanation": "阿加曲班是合成的精氨酸衍生物，属于小分子直接凝血酶抑制剂（DTI），直接与凝血酶活性位点结合，不依赖体内抗凝血酶（AT）；主要经肝脏代谢清除，血浆半衰期约40-50分钟，肾功能不全或透析患者无需调整剂量。目前尚无针对阿加曲班的特异性解毒剂，一旦发生严重出血应立即停药并对症支持治疗。"}, {"text": "关于甲磺酸萘莫司他，下列描述正确的有（  ）", "options": ["Ａ.是广谱丝氨酸蛋白酶抑制剂", "Ｂ.可直接抑制凝血酶、Ⅹa、Ⅻa等因子活性", "Ｃ.体内半衰期极短，仅5-8分钟", "Ｄ.需重点监测高钾血症", "Ｅ.可通过鱼精蛋白完全中和"], "answer": "ABCD", "explanation": "甲磺酸萘莫司他是广谱丝氨酸蛋白酶抑制剂，可直接抑制凝血酶、Ⅹa因子、Ⅻa因子等活性，无需依赖体内抗凝血酶；体内半衰期极短（仅5-8分钟），对全身凝血功能影响微弱，呈现\"局部抗凝\"效果；需重点监测高钾血症这一不良反应。本品无特异性拮抗剂，故可通过鱼精蛋白完全中和是错误的。"}]}, {"type": "short", "questions": [{"text": "简述血液透析抗凝方案选择的总体原则。", "options": [], "answer": "血液透析抗凝方案的制定需遵循个体化原则，核心在于平衡患者的出血风险与血栓风险，并结合肝肾功能及凝血指标，制定精准、安全的抗凝策略。具体包括四个方面：①出血风险是方案选择的前提，需重点评估活动性出血、近3个月内手术或创伤史、凝血功能障碍及消化道溃疡等，存在高危出血风险时应优先选择局部抗凝（如枸橼酸）或无肝素透析方案。②血栓风险是抗凝强度的依据，需评估既往血栓栓塞史、高凝状态（如糖尿病、肾病综合征）及血管通路类型，对反复血栓或人工血管通路患者需适当强化抗凝强度。③肝肾功能是药物代谢的基础，肝功能不全者慎用依赖肝脏代谢的药物（如阿加曲班），肾功能衰竭会影响低分子肝素的清除，需根据残余肾功能调整剂量，避免药物蓄积导致出血风险增加。④凝血指标是动态监测的核心，术前检测血小板计数、APTT、PT/INR及D-二聚体，透析过程中及间期动态监测，依据指标变化及时调整抗凝方案。", "explanation": "抗凝方案的制定必须个体化，动态权衡血栓风险与出血风险：无出血风险、无禁忌证者首选普通肝素或低分子肝素；高出血风险或活动性出血者首选枸橼酸钠局部抗凝或甲磺酸萘莫司他，存在药物禁忌时可选择无肝素透析。临床决策还需综合评估经济因素及治疗依从性。"}, {"text": "简述普通肝素用于血液透析时的操作流程要点。", "options": [], "answer": "普通肝素用于血液透析的操作流程包括四个要点：①管路预冲准备：使用肝素生理盐水闭路循环透析器及管路10-15分钟，随后完全排空，确保管路系统充分肝素化，防止凝血。②治疗前首剂推注：透析开始前5-15分钟经静脉端一次性推注负荷剂量，通常为0.3-0.5 mg/kg，剂量需根据患者体重、基础凝血功能及出血风险个体化调整。③过程中持续输注：从动脉端持续泵入肝素，维持剂量通常为5-10 mg/h，建议每1-2小时监测活化凝血时间（ACT），根据监测结果动态调整泵入速度。④结束前提前停药：为减少透析后出血风险，在治疗结束前30-60分钟停止追加肝素，对于出血高危患者可适当提前停药时间。", "explanation": "肝素钠通过增强抗凝血酶Ⅲ的活性来抑制凝血因子，防止体外循环管路凝血。监测方面，APTT需维持在基础值的1.5-2.5倍，于肝素首剂注射后1小时进行首次测定；ACT理想控制范围为180-220秒，支持床旁快速检测，便于透析中及时调整抗凝方案。"}, {"text": "简述枸橼酸钠局部抗凝的原理及临床监测要点。", "options": [], "answer": "原理：在体外循环的动脉端泵入枸橼酸钠，其分子结构能特异性螯合血液中的游离钙离子（Ca²⁺），使管路内Ca²⁺浓度迅速降至0.4 mmol/L以下，从而从源头阻断凝血瀑布的启动，防止体外管路发生凝血；同时在体外循环的静脉端（透析器之后）精准泵入钙剂，补充被螯合的钙离子，使回流至患者体内的血液Ca²⁺浓度恢复至正常生理范围，既保证体外抗凝效果，又维持患者体内凝血功能稳定。监测要点：①滤器后离子钙（iCa）应维持在0.2-0.4 mmol/L，确保体外循环管路内达到有效抗凝；②患者体内离子钙（iCa）应维持在1.0-1.2 mmol/L，避免因低钙血症引发手足抽搐、心律失常，同时防止高钙血症；③每2-4小时监测离子钙、血气分析及电解质水平，重点关注游离钙浓度，根据结果动态调整枸橼酸钠及钙剂的输注速度，警惕并预防枸橼酸代谢引发的代谢性碱中毒及置换液导致的高钠血症。", "explanation": "枸橼酸钠专为高出血风险及特殊凝血障碍患者设计，适用于活动性出血、近期外科手术或颅内出血人群，是肝素诱导的血小板减少症（HIT）患者的抗凝替代方案。绝对禁忌包括严重肝功能不全、严重低氧血症、严重休克、高钠血症及难以纠正的代谢性碱中毒。护理上必须严格区分枸橼酸钠与钙剂的输注通路，严禁将钙剂误注入动脉端，需双人核对确认。"}, {"text": "简述无肝素透析的操作流程要点与护理注意事项。", "options": [], "answer": "操作流程：①优选生物相容性透析器，优先选用聚砜膜或聚醚砜膜材质，这类膜材可有效减少管路凝血风险、降低机体炎症反应；②维持高血流量运行，将血液流速维持在250-300 ml/min以上，降低血液在管路内的滞留时间，减少红细胞聚集；③定时生理盐水冲洗，每15-30分钟使用100-200 ml生理盐水快速冲洗管路与透析器，及时清除管路内壁附着的凝血因子和微小血栓；④规避非必要操作干扰，减少管路内的血液停滞与湍流，避免不必要的管路断开、反复抽吸或调整。护理注意事项：①密切监测体外循环，持续观察透析器颜色是否变暗、动静脉壶及管路内有无血凝块形成；②密切监测压力变化，静脉压、跨膜压的突然升高是凝血的早期信号，需定时记录压力数值；③精确计算超滤量，为预防凝血而使用的生理盐水冲洗液体积必须全部纳入脱水量计算，避免患者出现容量超负荷或脱水不足；④做好应急准备，提前备好备用的透析器、管路及足量生理盐水，若发生严重凝血无法逆转，应立即更换整套体外循环管路。", "explanation": "无肝素透析全程不使用任何抗凝药物，专为存在极高出血风险（如颅内出血、消化道大出血、术后急性期）或处于活动性出血状态、因禁忌证无法使用区域性枸橼酸抗凝（RCA）的患者设计，是保障透析安全的最后防线。该模式对操作与监测要求极高，一旦发现透析器颜色变深或压力异常升高，提示凝血风险，需立即处理，否则可能导致透析不充分或失血风险。"}, {"text": "简述普通肝素与低分子肝素在监测要点上的区别。", "options": [], "answer": "普通肝素：抗凝效果个体差异大，需监测活化部分凝血活酶时间（APTT）并维持在基础值的1.5-2.5倍，于肝素首剂注射后1小时进行首次测定，透析过程中根据凝血状态定期复测；同时建议每1-2小时监测活化凝血时间（ACT），理想控制范围为180-220秒；此外需密切监测血小板计数，警惕用药后5-14天内发生肝素诱导的血小板减少症（HIT），一旦确诊需立即停用。低分子肝素：抗Xa因子活性是目前唯一能精准反映其抗凝效果的实验室指标，治疗剂量峰值建议维持在0.5-1.0 IU/ml，预防剂量通常在0.2-0.5 IU/ml之间；APTT对低分子肝素的抗凝作用缺乏敏感性，严禁将APTT作为调整低分子肝素剂量的依据；临床普遍采用按体重给药方案，针对肥胖、肾功能不全等特殊人群，建议进行抗Xa因子监测以调整剂量。", "explanation": "两种药物监测差异的根源在于作用机制与药代特征不同：普通肝素分子量为3000-30000道尔顿的混合物，半衰期短（约1-2小时），主要抑制凝血酶（Ⅱa）和因子Ⅹa，个体差异大，故需用APTT、ACT动态监测；低分子肝素是普通肝素的解聚产物，分子量4000-6000 Da，主要抑制因子Ⅹa，抗Xa/抗Ⅱa活性比值高达3-4:1，半衰期延长至3-5小时，抗凝效果可预测性强，故以抗Xa因子活性监测为准。另外，鱼精蛋白可中和普通肝素，而仅能部分中和低分子肝素的抗Xa活性（约60%）。"}]}]}];
