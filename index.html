（和）铁蛋白≤200 μg/L时需要补铁，推荐使用静脉铁剂治疗。"}, {"text": "腹膜透析合并慢性肾脏病贫血患者需要补铁时，血清铁蛋白的阈值为", "options": ["A.≤50 μg/L", "B.≤100 μg/L", "C.≤150 μg/L", "D.≤200 μg/L", "E.≤300 μg/L"], "answer": "B", "explanation": "腹膜透析贫血患者转铁蛋白饱和度≤20%或（和）铁蛋白≤100 μg/L时需要补铁。"}, {"text": "口服补铁时每日应给予元素铁的剂量为", "options": ["A.50mg", "B.100mg", "C.150mg", "D.200mg", "E.400mg"], "answer": "D", "explanation": "口服补铁每日应予元素铁200mg，1-3个月后评价铁状态。"}, {"text": "静脉补铁维持治疗阶段，每周平均需要的蔗糖铁或右旋糖酐铁量约为", "options": ["A.20mg", "B.50mg", "C.100mg", "D.150mg", "E.200mg"], "answer": "B", "explanation": "静脉补铁维持治疗阶段每周平均需要蔗糖铁或右旋糖酐铁量约为50mg；初始治疗阶段一个疗程常为1000mg。"}, {"text": "低氧诱导因子（HIF）的活性由下列哪种酶调节", "options": ["A.25-羟化酶", "B.1-α羟化酶", "C.HIF-脯氨酸羟化酶", "D.环氧合酶", "E.血管紧张素转换酶"], "answer": "C", "explanation": "HIF是由a和b两个亚基构成的异源二聚体，其活性受HIF-脯氨酸羟化酶（HIF-PH）的调节。"}, {"text": "血液透析过程中血清钾水平不应低于", "options": ["A.2.5 mmol/L", "B.3.0 mmol/L", "C.3.5 mmol/L", "D.4.0 mmol/L", "E.4.5 mmol/L"], "answer": "C", "explanation": "透析过程中血清钾水平不要低于3.5 mmol/L，以避免诱发心律失常。"}, {"text": "血液透析时透析液钾浓度的最佳范围是", "options": ["A.1.0-2.0 mmol/L", "B.2.0-3.0 mmol/L", "C.3.0-3.5 mmol/L", "D.4.0-4.5 mmol/L", "E.5.0-5.5 mmol/L"], "answer": "C", "explanation": "透析液钾浓度最好为3.0-3.5 mmol/L，可避免透析中血钾出现较大波动。"}, {"text": "血液透析患者房室传导阻滞最常见的诱因是", "options": ["A.低钾血症", "B.高钾血症", "C.低钙血症", "D.高钙血症", "E.低钠血症"], "answer": "B", "explanation": "透析患者窦性心动过缓比较少见，常见的是房室传导阻滞，其常见诱因是高钾血症。"}, {"text": "血液透析过程中发生的室上性心动过速常与下列哪种电解质紊乱有关", "options": ["A.高钾血症", "B.低钾血症", "C.高钙血症", "D.低钙血症", "E.低镁血症"], "answer": "B", "explanation": "透析过程中发生的室上性心动过速常与低钾血症有关，主要为房扑和房颤。"}, {"text": "血液透析患者室上性心动过速的发生率约为", "options": ["A.12.4%", "B.22.4%", "C.27.2%", "D.32.4%", "E.98.2%"], "answer": "D", "explanation": "室上性心动过速的发生率为32.4%，主要为房扑和房颤。"}, {"text": "血液透析患者室性心律失常的发生率约为", "options": ["A.12.4%", "B.22.4%", "C.27.2%", "D.32.4%", "E.98.2%"], "answer": "C", "explanation": "室性心律失常的发生率为27.2%，频发室性期前收缩可导致血流动力学改变。"}, {"text": "CKD 5D期患者建议维持的血清磷水平为", "options": ["A.0.87-1.13 mmol/L", "B.0.87-1.45 mmol/L", "C.1.13-1.78 mmol/L", "D.1.78-2.10 mmol/L", "E.2.10-2.50 mmol/L"], "answer": "C", "explanation": "CKD 5D期建议维持血清磷在1.13-1.78 mmol/L。"}, {"text": "CKD G5D期患者的iPTH水平应维持在正常值上限的", "options": ["A.1-2倍", "B.1-3倍", "C.2-5倍", "D.2-9倍", "E.9-15倍"], "answer": "D", "explanation": "建议CKD G5D期患者的iPTH水平应维持在正常值上限的2-9倍。"}, {"text": "为降低血管钙化风险，CKD患者建议使用的透析液钙浓度为", "options": ["A.1.0-1.25 mmol/L", "B.1.25-1.5 mmol/L", "C.1.5-1.75 mmol/L", "D.1.75-2.0 mmol/L", "E.2.0-2.5 mmol/L"], "answer": "B", "explanation": "建议CKD患者避免发生高钙血症以降低血管钙化风险，建议使用钙浓度为1.25-1.5 mmol/L的透析液。"}, {"text": "血液透析患者血清磷超过目标值时，建议限制饮食磷摄入量为", "options": ["A.300-500mg/d", "B.500-800mg/d", "C.800-1000mg/d", "D.1000-1500mg/d", "E.1500-2000mg/d"], "answer": "C", "explanation": "血液透析患者血清磷超过目标值时，建议限制饮食磷摄入800-1000mg/d。"}]}, {"type": "multiple", "questions": [{"text": "血液透析患者一体化管理的内容包括下列哪些方面", "options": ["Ａ.及时和早期诊断", "Ｂ.恰当的血液透析治疗时机", "Ｃ.完善血液透析前的准备", "Ｄ.加强血液透析患者的心理健康指导", "Ｅ.对所有患者统一采用固定的透析方案"], "answer": "ABCD", "explanation": "一体化管理包含及时和早期诊断、恰当的血液透析治疗时机、完善血液透析前的准备、加强血液透析中的管理及并发症的处理、加强终末期肾病相关并发症的预防和治疗、加强心理健康指导六个方面；对患者应实行个体化管理，不能统一采用固定透析方案。"}, {"text": "围透析期的特点包括", "options": ["Ａ.并发症发生率高", "Ｂ.病死率高", "Ｃ.治疗费用高", "Ｄ.eGFR快速下降", "Ｅ.生活质量显著提高"], "answer": "ABCD", "explanation": "围透析期的特点概括为三高一低，即并发症发生率高、病死率高、治疗费用高，eGFR快速下降；生活质量提高不是围透析期的特点。"}, {"text": "围透析期对患者开展教育的内容包括", "options": ["Ａ.心理准备", "Ｂ.肾脏替代治疗方案选择", "Ｃ.饮食及生活方式", "Ｄ.上肢血管保护", "Ｅ.抗生素的长期预防性使用"], "answer": "ABCD", "explanation": "围透析期患者教育包括心理准备、肾脏替代治疗方案选择、饮食及生活方式以及上肢血管保护等内容；长期预防性使用抗生素不属于围透析期患者教育内容。"}, {"text": "完善血液透析前的准备包括下列哪些措施", "options": ["Ａ.设立血液透析专病门诊", "Ｂ.建立血液透析患者个性化档案", "Ｃ.建立透析通路", "Ｄ.加强肾脏病有关知识宣传和教育", "Ｅ.透析前常规行甲状旁腺切除术"], "answer": "ABCD", "explanation": "完善血液透析前的准备包括设立血液透析专病门诊、加强肾脏病有关知识宣传教育、建立血液透析患者个性化档案和建立透析通路；甲状旁腺切除术是继发性甲状旁腺功能亢进的治疗手段之一，不是透析前的常规准备。"}, {"text": "加强血液透析中的管理，其要点包括", "options": ["Ａ.监测干体重并定期调整透析计划", "Ｂ.保护患者的血管通路", "Ｃ.维护机器正常运转并加强巡视", "Ｄ.预防及处理透析失衡综合征和低血压", "Ｅ.尽量缩短透析时间以减少并发症"], "answer": "ABCD", "explanation": "透析中管理包括做好干体重监测并定期调整透析计划、保护血管通路、维护机器正常运转并加强透析过程巡视、预防及处理透析失衡综合征和低血压等并发症；随意缩短透析时间会降低透析充分性，不属于管理要点。"}, {"text": "透析失衡综合征的临床表现包括", "options": ["Ａ.头痛、乏力", "Ｂ.恶心、呕吐", "Ｃ.抽搐", "Ｄ.昏迷", "Ｅ.皮下出血点"], "answer": "ABCD", "explanation": "透析失衡综合征表现为头痛、乏力、恶心、呕吐，严重者可出现抽搐、昏迷，甚至死亡；皮下出血点不属于其临床表现。"}, {"text": "血液透析透析失衡综合征易发生于下列哪些患者", "options": ["Ａ.首次透析患者", "Ｂ.诱导透析患者", "Ｃ.尿毒症透析间隔时间太长的患者", "Ｄ.使用高效透析器的患者", "Ｅ.长期规律透析且透析充分的患者"], "answer": "ABCD", "explanation": "透析失衡综合征易发生于首次透析、诱导透析以及尿毒症透析间隔时间太长及透析不充分、使用高效透析器的患者；长期规律且透析充分的患者不易发生。"}, {"text": "透析失衡综合征的治疗措施包括", "options": ["Ａ.轻度者可不治疗", "Ｂ.严重者给予高渗性溶液", "Ｃ.必要时输注白蛋白", "Ｄ.必要时使用镇静剂及其他对症治疗", "Ｅ.一旦发生立即终止透析"], "answer": "ABCD", "explanation": "轻度透析失衡综合征可不必治疗；严重者可给予高渗性溶液、白蛋白输注，必要时使用镇静剂及其他对症治疗；更严重者才终止透析，并非一旦发生立即终止透析。"}, {"text": "血液透析中发生低血压的原因包括", "options": ["Ａ.透析间期液体超负荷", "Ｂ.心功能差", "Ｃ.超滤过快", "Ｄ.对醋酸盐透析液不适应", "Ｅ.血磷水平过高"], "answer": "ABCD", "explanation": "透析中低血压的主要原因是透析间期液体超负荷和心功能差，透析中后期的血压下降多由于超滤过快或对醋酸盐透析液不适应所致；血磷水平过高与低血压无直接关系。"}, {"text": "血液透析中低血压的治疗措施包括", "options": ["Ａ.头低脚高位", "Ｂ.停止超滤", "Ｃ.减慢泵流速并吸氧", "Ｄ.必要时快速补充生理盐水或50%葡萄糖", "Ｅ.立即快速大量补液以升高血压"], "answer": "ABCD", "explanation": "低血压治疗包括取头低脚高位、停超滤、减慢泵流速、吸氧，必要时快速补充生理盐水100-200ml或50%葡萄糖20ml，输注白蛋白并结合病因治疗；快速大量补液会加重容量负荷，不是正确处理。"}, {"text": "肾性贫血的发生机制包括", "options": ["Ａ.促红细胞生成素缺乏", "Ｂ.毒素抑制骨髓", "Ｃ.红细胞寿命缩短", "Ｄ.铁和叶酸缺乏", "Ｅ.血钙水平升高"], "answer": "ABCD", "explanation": "肾性贫血的发生机制包括促红细胞生成素缺乏、毒素抑制骨髓、红细胞寿命缩短、铁和叶酸缺乏、慢性炎症、凝血机制紊乱致器官出血或常年透析失血；血钙水平升高不是肾性贫血的发生机制。"}, {"text": "肾性贫血给血液透析患者带来的后果包括", "options": ["Ａ.疲劳、头晕、气促", "Ｂ.生活质量下降", "Ｃ.可能需要频繁输血", "Ｄ.心力衰竭等心血管疾病风险增加", "Ｅ.血磷水平明显下降"], "answer": "ABCD", "explanation": "贫血可导致疲劳、头晕、气促等症状，使患者生活质量下降，可能需要频繁输血，并增加心力衰竭、缺血性心脏病等心血管疾病风险，还会造成免疫功能受损；血磷水平下降不是肾性贫血的后果。"}, {"text": "肾性贫血的治疗措施包括", "options": ["Ａ.补充红细胞生成素", "Ｂ.补充铁剂", "Ｃ.应用低氧诱导因子相关治疗", "Ｄ.改善透析充分性", "Ｅ.常规使用含铝磷结合剂"], "answer": "ABCD", "explanation": "肾性贫血的治疗包括补充红细胞生成素、补充铁剂和低氧诱导因子相关治疗，同时应改善透析充分性；含铝磷结合剂用于降低血磷，不是肾性贫血的常规治疗。"}, {"text": "血液透析患者铁剂缺乏的原因包括", "options": ["Ａ.胃肠道铁吸收障碍", "Ｂ.反复采血及透析过程中失血", "Ｃ.凝血机制异常", "Ｄ.胃肠道的隐性失血", "Ｅ.体内铁摄入绝对过量"], "answer": "ABCD", "explanation": "铁剂缺乏原因包括胃肠道铁吸收障碍、反复采血、透析过程中失血、凝血机制异常和胃肠道的隐性失血；体内铁摄入绝对过量不会导致铁缺乏。"}, {"text": "血液透析过程中心律失常的常见原因包括", "options": ["Ａ.应用洋地黄制剂", "Ｂ.心脏病变", "Ｃ.电解质紊乱", "Ｄ.心肌缺血", "Ｅ.血红蛋白水平过高"], "answer": "ABCD", "explanation": "血液透析过程中心律失常的常见原因包括应用洋地黄制剂、心脏病变和电解质紊乱，心肌缺血可发生低血压并触发心律失常；血红蛋白水平过高不是其常见原因。"}, {"text": "与透析相关的心律失常处理措施包括", "options": ["Ａ.终止透析并缓慢回血", "Ｂ.纠正低血压", "Ｃ.急查电解质并纠正电解质紊乱", "Ｄ.根据情况选用抗心律失常药及转复治疗", "Ｅ.立即快速大量补液"], "answer": "ABCD", "explanation": "与透析相关的心律失常应终止透析，小心将管路及透析器中的血液缓慢返回机体，进一步分析原因、纠正低血压、急查电解质并纠正电解质紊乱，根据情况选用抗心律失常药及转复治疗；立即快速大量补液不是正确处理。"}, {"text": "慢性肾脏疾病-矿物质-骨代谢异常（CKD-MBD）可出现的临床表现包括", "options": ["Ａ.钙磷及甲状旁腺激素代谢异常", "Ｂ.骨转化异常", "Ｃ.骨矿化异常", "Ｄ.血管或其他软组织钙化", "Ｅ.肾小球滤过率恢复正常"], "answer": "ABCD", "explanation": "CKD-MBD可出现钙、磷、甲状旁腺激素或维生素D代谢异常，骨转化、骨矿化、骨量、骨线性生长或骨强度异常，以及血管或其他软组织钙化；肾小球滤过率恢复正常不属于其表现。"}, {"text": "肾性骨营养不良包括下列哪些类型", "options": ["Ａ.纤维性骨炎", "Ｂ.骨软化症", "Ｃ.无动力性骨病", "Ｄ.急性肾小管坏死", "Ｅ.原发性肾小球肾炎"], "answer": "ABC", "explanation": "肾性骨营养不良包括纤维性骨炎、骨软化症和无动力性骨病；急性肾小管坏死和原发性肾小球肾炎均不属于肾性骨营养不良。"}, {"text": "降低高血磷、维持正常血钙的3D治疗原则包括", "options": ["Ａ.低磷饮食（Diet）", "Ｂ.充分透析（Dialysis）", "Ｃ.磷结合剂（Drug）", "Ｄ.增加维生素D用量", "Ｅ.严格限制饮水"], "answer": "ABC", "explanation": "降低高血磷、维持正常血钙遵循3D治疗原则，即低磷饮食、充分透析和磷结合剂；增加维生素D用量和严格限制饮水不属于3D治疗原则。"}, {"text": "CKD患者血管钙化的防治措施包括", "options": ["Ａ.限制饮食磷的摄入", "Ｂ.选择合适的磷结合剂", "Ｃ.充分透析或增加透析对磷的清除", "Ｄ.有效控制继发性甲状旁腺功能亢进", "Ｅ.长期大量使用含钙磷结合剂"], "answer": "ABCD", "explanation": "血管钙化的防治措施包括限制饮食磷的摄入、选择合适的磷结合剂、充分透析或增加透析对磷的清除以及有效控制继发性甲状旁腺功能亢进；需要磷结合剂治疗的CKD G3a-G5D患者应限制含钙磷结合剂的使用，而不是长期大量使用。"}]}, {"type": "short", "questions": [{"text": "简述血液透析患者一体化管理包含的主要内容。", "options": [], "answer": "血液透析患者一体化管理包含六个方面：1）及时和早期诊断；2）恰当的血液透析治疗时机；3）完善血液透析前的准备；4）加强血液透析中的管理及并发症的处理；5）加强终末期肾病相关并发症的预防和治疗；6）加强血液透析患者的心理健康指导。", "explanation": "一体化管理以提高血液透析患者的生存质量为目标，覆盖从早期诊断、治疗时机选择、透析前准备到透析中并发症处理和终末期肾病相关并发症防治的全过程，并要求在透析前、透析中和透析后对患者进行卫生宣教、营养指导与心理沟通，与患者建立良好的医患关系。"}, {"text": "简述透析失衡综合征的临床表现、主要原因、危险因素和治疗原则。", "options": [], "answer": "临床表现：头痛、乏力、恶心、呕吐，严重者可出现抽搐、昏迷，甚至死亡。主要原因：透析间期血尿素下降速度高于脑内下降速度，出现尿素反向效应，血浆渗透压低于脑渗透压，水分从血浆向脑内转移，引起脑水肿。危险因素：高BUN水平（＞175 mg/dl）和BUN水平快速下降，患有基础神经疾病、低钠血症和肝脏疾病，CT或磁共振可显示脑水肿。易发人群：首次透析、诱导透析以及尿毒症透析间隔时间太长及透析不充分、使用高效透析器的患者。治疗：轻度可不必治疗；严重者立即给予高渗性溶液、白蛋白输注，必要时给予镇静剂及其他对症治疗；更严重者终止透析。", "explanation": "透析失衡综合征是透析患者常见的神经系统并发症，其核心环节是尿素反向效应导致的脑水肿，预防上应控制血尿素下降速度、合理安排透析间隔并个体化制定透析方案，处理级别取决于症状严重程度。"}, {"text": "简述肾性贫血的治疗措施以及红细胞生成素治疗的时机与靶目标。", "options": [], "answer": "治疗措施：1）补充红细胞生成素；2）补充铁剂；3）低氧诱导因子相关治疗；4）改善透析充分性，如选择高通量透析器、延长透析时间、选择合适的透析模式。治疗时机：非透析慢性肾脏病患者应在Hb＜100 g/L时启动红细胞生成素治疗；腹膜透析和血液透析患者由于Hb下降速度比非透析患者快，为避免Hb低于90 g/L，也应在Hb＜100 g/L时启动治疗。靶目标：Hb治疗目标值为≥115 g/L，但不推荐＞130 g/L，可依据患者年龄、透析方式及透析时间长短、治疗时间长短以及是否并发其他疾病进行个体化调整，常为110-120 g/L。", "explanation": "肾性贫血是血液透析患者最常见的并发症，贫血发生率高达98.2%；补充红细胞生成素、补铁和改善透析充分性缺一不可，治疗中应关注Hb上升速度并每月至少监测1次，避免Hb升幅过快或过高。"}, {"text": "简述血液透析中低血压的主要原因和治疗措施。", "options": [], "answer": "主要原因：透析间期液体超负荷和心功能差；透析中后期的血压下降多由于超滤过快或对醋酸盐透析液不适应所致。预防：透析患者每日饮水量需控制在1000 mL以下，尽量减少盐的摄入；透析前发现液体负荷过大时应及时调整透析时间。治疗：取头低脚高位，停止超滤，减慢泵流速，吸氧，必要时快速补充生理盐水100-200 ml或50%葡萄糖20 ml，输注白蛋白，并结合病因治疗。", "explanation": "低血压是透析最常见的并发症，发生率约为25%；容量管理与超滤速度控制是预防的关键，处理时应先调整体位并停止超滤，再根据病因补充容量或调整透析液的醋酸盐成分。"}, {"text": "简述降低高血磷、维持正常血钙的3D治疗原则及具体措施。", "options": [], "answer": "3D治疗原则：1）低磷饮食（Diet）；2）充分透析（Dialysis）；3）磷结合剂（Drug）。具体措施：1）饮食控制，限制磷的摄入，血液透析患者血清磷超过目标值时建议限制饮食磷摄入800-1000 mg/d，并限制摄入蛋白质总量，选择磷/蛋白比值低、磷吸收率低的食物，限制含大量磷酸盐添加剂的食物；2）调整透析治疗方案；3）药物治疗，包括含钙磷结合剂、非含钙磷结合剂和含铝磷结合剂。CKD 5D期建议维持血清磷在1.13-1.78 mmol/L。", "explanation": "血磷升高是慢性肾脏病代谢紊乱的中心环节，单纯透析治疗不足以保持血磷平衡，因此需要饮食、透析与药物三方面联合干预，并定期监测血清磷和血清钙水平，避免高磷血症和高钙血症。"}]}]}, {"num": 11, "title": "血液净化灌流器的原理和临床应用理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液净化核心技术中，溶质从高浓度处向低浓度处运动的原理是", "options": ["A.弥散", "B.对流", "C.置换", "D.吸附", "E.超滤"], "answer": "A", "explanation": "弥散是指溶质从高浓度处向低浓度处运动，血液与透析液之间的浓度梯度是弥散的驱动力。"}, {"text": "在跨膜压作用下，通过半透膜等渗排出溶剂和溶质的血液净化原理是", "options": ["A.弥散", "B.对流", "C.置换", "D.吸附", "E.超滤"], "answer": "B", "explanation": "对流是指在跨膜压作用下，通过半透膜等渗排出溶剂和溶质。"}, {"text": "溶质分子通过生物亲和力、静电作用力和分子间力与吸附剂结合的原理是", "options": ["A.弥散", "B.对流", "C.置换", "D.吸附", "E.超滤"], "answer": "D", "explanation": "吸附是指溶质分子通过生物亲和力、静电作用力和分子间力与吸附剂结合。"}, {"text": "经过透析液除去患者血液中液体（脱水）的方法属于", "options": ["A.弥散", "B.对流", "C.置换", "D.吸附", "E.超滤"], "answer": "E", "explanation": "超滤是指经过透析液除去患者血液中液体（脱水）的方法。"}, {"text": "血液灌流技术清除毒物、药物、代谢产物的主要方式是", "options": ["A.通过弥散清除", "B.通过对流清除", "C.通过灌流器中吸附剂的吸附作用清除", "D.通过超滤脱水清除", "E.通过置换液置换清除"], "answer": "C", "explanation": "血液灌流技术是将患者血液从体内引到体外循环系统内，通过灌流器中吸附剂吸附毒物、药物、代谢产物，达到清除这些物质的目的。"}, {"text": "血液灌流技术与其它血液净化方式结合可形成", "options": ["A.单纯弥散疗法", "B.标准血液透析疗法", "C.常规血液滤过疗法", "D.杂合式血液净化疗法", "E.单纯超滤疗法"], "answer": "D", "explanation": "血液灌流技术是将患者血液引到体外循环系统内，通过灌流器中吸附剂吸附毒物、药物、代谢产物的一种血液净化治疗方法，与其它血液净化方式结合可形成不同的杂合式血液净化疗法。"}, {"text": "血液灌流技术的定义出自", "options": ["A.《血液透析器复用规范》", "B.《血液净化标准操作规程》", "C.《连续性血液净化规范》", "D.《人工肝治疗肝衰竭指南》", "E.《蛋白结合毒素管理共识》"], "answer": "B", "explanation": "血液灌流技术的定义出自《血液净化标准操作规程（2010版）》，指将患者血液从体内引到体外循环系统内，通过灌流器中吸附剂吸附毒物、药物、代谢产物，达到清除这些物质的一种血液净化治疗方法或手段。"}, {"text": "1964年首先用活性炭对尿毒症患者进行血液灌流、发现吸附效果尚可但碳粒容易脱落的学者是", "options": ["A.Yatzidis", "B.Steinberg", "C.Rosenbaum", "D.Muirhead", "E.张明瑞"], "answer": "A", "explanation": "1964年Yatzidis首先用活性炭对尿毒症进行血液灌流，发现吸附效果可以，但碳粒容易脱落。"}, {"text": "利用白蛋白火棉胶包裹活性炭制成胶囊式血液灌流器、使血液灌流进入临床实用阶段的学者是", "options": ["A.Steinberg", "B.Yatzidis", "C.张明瑞", "D.Rosenbaum", "E.Muirhead"], "answer": "C", "explanation": "华裔加拿大籍教授张明瑞利用白蛋白火棉胶包裹活性炭制成胶囊血液灌流器，至此开启血液灌流的临床实用阶段。"}, {"text": "首先提出树脂型人工肾并通过动物实验证实可清除肌酐和尿素、但效率较低的是", "options": ["A.Steinberg和Reid", "B.Muirhead和Reid", "C.Yatzidis和Rosenbaum", "D.张明瑞和Reid", "E.Muirhead和Yatzidis"], "answer": "B", "explanation": "Muirhead和Reid首先提出树脂型人工肾，并进行了动物实验，证实可以清除肌酐和尿素，但效率低。"}, {"text": "我国80年代后在一次交联基础上进行二次交联、率先研制出十余种吸附树脂的单位是", "options": ["A.清华大学高分子研究所", "B.北京大学高分子研究所", "C.复旦大学高分子研究所", "D.南开大学高分子研究所", "E.四川大学高分子研究所"], "answer": "D", "explanation": "我国80年代前血液净化研究与生产均为空白；80年代后南开大学高分子研究所率先在一次交联基础上进行二次交联，研制了十余种吸附树脂。"}, {"text": "血液吸附材料中属于天然改性高分子吸附材料的是", "options": ["A.活性炭", "B.吸附树脂", "C.琼脂糖", "D.无机陶瓷材料", "E.金属氧化物吸附剂"], "answer": "C", "explanation": "血液吸附材料按吸附剂载体分为活性炭类吸附剂、高分子吸附剂和无机材料吸附剂；其中高分子吸附剂包括合成高分子吸附剂（吸附树脂）和天然改性高分子吸附材料（琼脂糖、纤维素、壳聚糖）。"}, {"text": "物理吸附中吸附质分子与吸附剂表面原子或分子之间的作用力是", "options": ["A.范德华力", "B.离子键", "C.共价键", "D.金属键", "E.配位键"], "answer": "A", "explanation": "物理吸附是指吸附质分子与吸附剂表面原子或分子间以范德华力进行的吸附作用；化学吸附则是吸附质分子与吸附剂表面原子间发生电子的交换、转移或共有而形成吸附化学键。"}, {"text": "国际纯粹与应用化学联合会(IUPAC)标准中微孔的孔径范围是", "options": ["A.2~50nm", "B.小于2nm", "C.50~100nm", "D.100~200nm", "E.大于200nm"], "answer": "B", "explanation": "按IUPAC标准，微孔孔径小于2nm，中孔（介孔）孔径为2~50nm，大孔孔径大于50nm。"}, {"text": "β2微球蛋白的分子尺寸约为", "options": ["A.0.35nm", "B.1.35nm", "C.3.35nm", "D.13.5nm", "E.35nm"], "answer": "C", "explanation": "β2微球蛋白的分子尺寸约为3.35nm，属于可被中孔吸附剂筛分吸附的中分子物质。"}, {"text": "低密度脂蛋白的分子尺寸约为", "options": ["A.3.35nm", "B.4~14nm", "C.8~15nm", "D.18~25nm", "E.6000nm以上"], "answer": "D", "explanation": "低密度脂蛋白的分子尺寸约为18~25nm，需依靠较大孔径的吸附剂进行吸附清除。"}, {"text": "使用HA280血液灌流治疗过敏性紫癜时，每个患者的使用方案是", "options": ["A.1次即可", "B.2~3次，隔日1次", "C.2~3次，每日1次", "D.5次，每周1次", "E.10次，隔日1次"], "answer": "B", "explanation": "重症过敏性紫癜一旦确诊即可进行HA280血液灌流治疗，每个患者使用2~3次（1个/次），隔日1次，且在内科治疗基础上进行，大多数患者灌流后1天即可有症状和体征的明显好转。"}, {"text": "吸附剂的下列结构参数中，与吸附效率呈正相关的是", "options": ["A.比表面积", "B.颗粒直径", "C.湿态体积", "D.装柱高度", "E.血流速度"], "answer": "A", "explanation": "吸附剂的比表面积越大，吸附效率越大；孔体积、孔隙率也与吸附性能呈正相关。"}, {"text": "尿毒症毒素是指", "options": ["A.尿液中排出的全部代谢产物", "B.体液中浓度增高的全部物质", "C.血液中小于500Da的全部物质", "D.肾小管分泌的全部有机酸", "E.肾衰竭时潴留体内并具毒性作用的物质"], "answer": "E", "explanation": "尿毒症毒素是指因肾功能下降而潴留于患者体内的物质，即所有终末期肾病时循环和（或）组织中潴留并具有毒性作用（导致病理生理改变）的物质。"}, {"text": "游离的小分子水溶性毒素约有", "options": ["A.15种", "B.25种", "C.45种", "D.60种", "E.90种"], "answer": "C", "explanation": "游离的小分子水溶性毒素如尿素、肌酐、尿酸、胍类、酚类，约45种，其相对分子量小于500D。"}, {"text": "中大分子毒素均为多肽或细胞因子，共约", "options": ["A.12种", "B.22种", "C.35种", "D.45种", "E.60种"], "answer": "B", "explanation": "中大分子毒素均为多肽或细胞因子，共22种，分子质量555Da~3.2KDa，在体内呈多室分布。"}, {"text": "中大分子毒素的分子质量范围是", "options": ["A.小于500Da", "B.500~555Da", "C.555Da~1.0KDa", "D.555Da~3.2KDa", "E.3.2~5.0KDa"], "answer": "D", "explanation": "中大分子毒素均为多肽或细胞因子，分子质量555Da~3.2KDa，常规血液透析不能清除。"}, {"text": "甲状旁腺激素PTH潴留主要导致的并发症是", "options": ["A.营养不良", "B.淀粉样变及腕管综合症", "C.肾性骨病、异位钙化", "D.心血管并发症", "E.肝细胞毒性"], "answer": "C", "explanation": "甲状旁腺激素PTH潴留主要导致肾性骨病和异位钙化。"}, {"text": "β2微球蛋白潴留主要导致的并发症是", "options": ["A.肾性骨病、异位钙化", "B.淀粉样变及腕管综合症", "C.营养不良", "D.动脉粥样硬化", "E.肾小球硬化"], "answer": "B", "explanation": "β2微球蛋白潴留主要导致淀粉样变及腕管综合症。"}, {"text": "瘦素潴留主要导致的并发症是", "options": ["A.动脉粥样硬化", "B.心血管并发症", "C.肝细胞毒性", "D.营养不良", "E.肾小球硬化"], "answer": "D", "explanation": "瘦素潴留主要导致营养不良。"}, {"text": "甲酚、对甲酚潴留主要导致的并发症是", "options": ["A.肾小球硬化", "B.顽固性高血压", "C.全身微炎症状态", "D.胰岛素抵抗", "E.肝细胞毒性"], "answer": "E", "explanation": "甲酚、对甲酚潴留主要导致肝细胞毒性。"}, {"text": "马尿酸潴留主要导致的并发症是", "options": ["A.胰岛素抵抗、糖耐量异常", "B.心血管并发症", "C.营养不良", "D.肾小球硬化", "E.肝细胞毒性"], "answer": "A", "explanation": "马尿酸潴留主要导致胰岛素抵抗和糖耐量异常。"}, {"text": "维持性血液透析患者尿毒症瘙痒的患病率约为", "options": ["A.10%~20%", "B.21%~23%", "C.40.60%", "D.56%", "E.60.10%"], "answer": "C", "explanation": "维持性血液透析患者症状普遍存在，其中尿毒症瘙痒患病率约为40.60%，睡眠障碍约为60.10%。"}, {"text": "维持性血液透析患者睡眠障碍的患病率约为", "options": ["A.10%~20%", "B.21%~23%", "C.40.60%", "D.58%", "E.60.10%"], "answer": "E", "explanation": "维持性血液透析患者睡眠障碍患病率约为60.10%，不宁腿综合征约为10%~20%，抑郁约为21%~23%。"}, {"text": "血液滤过（对流）对中大分子毒素的清除效果是", "options": ["A.无清除", "B.低水平", "C.中到高水平", "D.低至无", "E.极高水平"], "answer": "B", "explanation": "血液滤过以对流为清除方式，对蛋白结合毒素和中大分子毒素的清除效果均低。"}, {"text": "组合型人工肾是指", "options": ["A.血液灌流联合血液滤过", "B.血液透析联合HA130血液灌流", "C.血液透析联合血液透析滤过", "D.单纯高通量血液透析", "E.血浆置换联合血液灌流"], "answer": "B", "explanation": "组合型人工肾即血液透析（HD）联合HA130血液灌流（HP），两种治疗方式优势互补，可全面清除代谢产物、毒物和致病因子。"}, {"text": "严重尿毒症相关皮肤瘙痒患者建议开始行血液灌流治疗的改良Duo氏瘙痒评分标准是", "options": ["A.&gt;6分或VAS评分&gt;4分", "B.&gt;8分或VAS评分&gt;6分", "C.&gt;12分或VAS评分&gt;8分", "D.&gt;15分或VAS评分&gt;10分", "E.&gt;20分或VAS评分&gt;12分"], "answer": "C", "explanation": "严重尿毒症相关皮肤瘙痒表现为改良Duo氏瘙痒评分&gt;12分或VAS评分&gt;8分，此时建议开始行血液灌流治疗。"}, {"text": "严重高β2微球蛋白血症患者建议开始行血液灌流治疗时，β2微球蛋白应持续高于", "options": ["A.10mg/L", "B.15mg/L", "C.20mg/L", "D.30mg/L", "E.50mg/L"], "answer": "D", "explanation": "β2微球蛋白持续&gt;30mg/L，或合并腕管综合征等透析淀粉样变时，建议开始行血液灌流治疗。"}, {"text": "难治性高血压患者建议开始行血液灌流治疗时，透析前收缩压仍应持续高于", "options": ["A.120mmHg", "B.130mmHg", "C.140mmHg", "D.150mmHg", "E.160mmHg"], "answer": "E", "explanation": "充分透析、干体重达标的维持性血液透析患者，使用3种或以上不同类型降压药物且每种药物均达到最大剂量或最大耐受量时，透析前收缩压仍持续&gt;160mmHg，建议开始行血液灌流治疗。"}, {"text": "经药物治疗不能控制的严重继发性甲状旁腺功能亢进患者，建议开始行血液灌流治疗时，全段甲状旁腺激素(iPTH)应持续高于", "options": ["A.150pg/ml", "B.300pg/ml", "C.450pg/ml", "D.600pg/ml", "E.800pg/ml"], "answer": "D", "explanation": "经药物治疗不能控制的严重继发性甲状旁腺功能亢进，全段甲状旁腺激素(iPTH)持续&gt;600pg/ml时，建议开始行血液灌流治疗。"}, {"text": "血液灌流治疗中，患者出现血小板计数明显下降时的处理原则是", "options": ["A.评估出血风险，必要时暂停灌流或更换治疗方式", "B.继续灌流并加大抗凝剂量", "C.立即拔除血管通路", "D.提高血流量加快灌流", "E.口服抗血小板药物后继续"], "answer": "A", "explanation": "血液灌流可导致血小板减少，治疗中若出现血小板计数明显下降，应评估出血风险，必要时暂停灌流或更换治疗方式，并密切监测血小板计数变化。"}, {"text": "血液灌流治疗0.5~1小时左右出现寒战、发热、胸闷、呼吸困难，首先应考虑", "options": ["A.灌流器凝血", "B.过敏反应", "C.低血压", "D.失衡综合征", "E.溶血"], "answer": "B", "explanation": "灌流治疗0.5~1小时左右出现寒战、发热、胸闷、呼吸困难等提示过敏反应，可输入地塞米松或苯海拉明并吸氧，一般不需中断灌流。"}, {"text": "析因分析显示，高通量透析对甲状旁腺激素PTH的清除作用为", "options": ["A.有效", "B.无效", "C.相当", "D.优于血液灌流联合治疗", "E.显著优于低通量透析联合灌流"], "answer": "B", "explanation": "析因分析显示，低通量透析联合血液灌流对PTH清除有效，而高通量透析对PTH无效，低通量透析联合血液灌流优于高通量透析。"}, {"text": "血液灌流治疗的禁忌症是", "options": ["A.对灌流器及相关材料过敏者", "B.急性药物或毒物中毒", "C.尿毒症性心包炎", "D.肝性脑病", "E.银屑病或其他自身免疫性疾病"], "answer": "A", "explanation": "血液灌流的禁忌症为对灌流器及相关材料过敏者；其余选项均属于血液灌流的适应证范围。"}, {"text": "我国急性中毒的中毒途径以消化道为主，约占", "options": ["A.14.36%", "B.50.83%", "C.58.42%", "D.80.77%", "E.91.3%"], "answer": "D", "explanation": "我国急性中毒的中毒途径以消化道为主，占80.77%，其次为呼吸道，占14.36%。"}, {"text": "我国药物中毒中最常见的药物类别为镇静催眠药，约占", "options": ["A.14.36%", "B.46%", "C.50.83%", "D.58.42%", "E.80.77%"], "answer": "C", "explanation": "我国药物中毒以治疗性用药为主，最常见的是镇静催眠药，占50.83%。"}, {"text": "我国农药中毒以有机磷农药为主，约占", "options": ["A.14.36%", "B.21%~23%", "C.50.83%", "D.58.42%", "E.80.77%"], "answer": "D", "explanation": "我国农药中毒以有机磷农药为主，占58.42%；杀鼠剂以毒鼠强为主。"}, {"text": "百草枯清除相的血浆半衰期约为", "options": ["A.0.5h", "B.5h", "C.15h", "D.84h", "E.170h"], "answer": "D", "explanation": "百草枯分布相中的血浆半衰期约5h，清除相中的血浆半衰期约84h。"}, {"text": "百草枯自身的肾脏清除率约为", "options": ["A.50mL/min", "B.100mL/min", "C.170mL/min", "D.250mL/min", "E.500mL/min"], "answer": "C", "explanation": "百草枯在肾小管中不被重吸收，以原形从肾脏排出，其自身肾脏清除率约为170mL/min，远大于血液透析的毒物清除作用。"}, {"text": "专家共识推荐口服百草枯中毒后应尽快行血液灌流，效果较好的开展时间是", "options": ["A.1h内", "B.2~4h内", "C.6~8h内", "D.12h内", "E.24h后"], "answer": "B", "explanation": "推荐口服百草枯中毒后应尽快行血液灌流，2~4h内开展者效果较好，可根据血液毒物浓度或口服量决定一次使用一个或多个灌流器。"}, {"text": "急性中毒患者的二次中毒现象是指", "options": ["A.患者再次接触同类毒物", "B.组织中毒物转移入血致浓度反跳", "C.毒物经肝脏代谢毒性增强", "D.两种毒物同时入体产生协同毒性", "E.毒物从灌流器重新释放入血"], "answer": "B", "explanation": "由于毒物贮存库（胃肠粘膜、脂肪组织）储存和毒物再释放的存在，血液中的毒物被清除后组织中的毒物会不断转移到血液中，引起血液中毒物浓度反跳与病情反复，即二次中毒现象。"}, {"text": "脓毒症患者在接受初始Bundle治疗后病情仍未稳定或呈恶化趋势时，考虑实施血液吸附治疗的SOFA评分标准是", "options": ["A.&gt;2分", "B.≥6分", "C.≥8分", "D.≥10分", "E.≥15分"], "answer": "D", "explanation": "脓毒症患者在接受初始Bundle治疗后病情仍未稳定或呈恶化趋势时应考虑血液吸附治疗，器官功能评估需符合SOFA评分≥10分，或SOFA评分在6h内增加≥2分等任一标准。"}, {"text": "双重血浆分子吸附系统(DPMAS)由哪两种吸附剂联合组成", "options": ["A.HA230与HA280", "B.BS330胆红素吸附器与HA330-II", "C.DNA230与HA330", "D.PMX-F与MATISS", "E.HA130与HA330-II"], "answer": "B", "explanation": "DPMAS是指将离子交换树脂（BS330血浆胆红素吸附器）与中性大孔树脂（HA330-II血液灌流器）两种吸附剂联合应用、协同增效的血液净化模式。"}, {"text": "双重血浆分子吸附系统(DPMAS)被纳入的指南是", "options": ["A.《血液净化标准操作规程》", "B.《非生物型人工肝指南（2016版）》", "C.《血液净化专科护理操作共识》", "D.《急性百草枯中毒诊治共识》", "E.《血液净化模式选择专家共识》"], "answer": "B", "explanation": "DPMAS人工肝治疗模式被纳入《非生物型人工肝治疗肝衰竭指南（2016年版）》，该指南发表于《中华临床感染病杂志》2016年4月第9卷第2期。"}, {"text": "下列属于双重血浆吸附治疗优点的是", "options": ["A.需要补充大量血浆", "B.无传播血源性疾病的风险", "C.可补充凝血因子", "D.可调节水电解质酸碱平衡", "E.可充分清除小分子毒素"], "answer": "B", "explanation": "双重血浆吸附治疗无需补充血浆，无传播血源性疾病的风险，并能保存患者本身血浆的有益成分；其不足是不能补充凝血因子和蛋白、不能调节水电解质酸碱平衡，且对小分子毒素清除不足。"}]}, {"type": "multiple", "questions": [{"text": "血液灌流的适应证包括", "options": ["Ａ.原发性肾小球肾炎", "Ｂ.急性药物或毒物中毒", "Ｃ.尿毒症伴顽固瘙痒或难治高血压", "Ｄ.重症肝炎、爆发性肝衰竭导致的肝性脑病", "Ｅ.脓毒症或系统性炎症综合征"], "answer": "BCDE", "explanation": "血液灌流的适应证包括急性药物或毒物中毒、尿毒症尤其是顽固性瘙痒和难治性高血压、重症肝炎特别是爆发性肝衰竭导致的肝性脑病和高胆红素血症、脓毒症或系统性炎症综合征、银屑病或其他自身免疫性疾病等；原发性肾小球肾炎不是其适应证。"}, {"text": "血液灌流适应证对应的灌流器型号，正确的有", "options": ["Ａ.急性药物或毒物中毒—HA230", "Ｂ.顽固瘙痒、难治高血压—HA130", "Ｃ.银屑病等自身免疫病—HA280", "Ｄ.爆发性肝衰竭—BS330", "Ｅ.脓毒症、炎症综合征—HA330"], "answer": "ABCE", "explanation": "急性药物或毒物中毒选用HA230，尿毒症尤其顽固性瘙痒和难治性高血压选用HA130，银屑病或其他自身免疫性疾病选用HA280，脓毒症或系统性炎症综合征选用HA330，重症肝炎特别是爆发性肝衰竭导致的肝性脑病、高胆红素血症选用HA330-II；BS330为血浆胆红素吸附器，不用于爆发性肝衰竭的血液灌流治疗。"}, {"text": "血液吸附材料按吸附剂载体分类包括", "options": ["Ａ.活性炭类吸附剂", "Ｂ.高分子吸附剂", "Ｃ.无机材料吸附剂", "Ｄ.免疫吸附剂", "Ｅ.胆红素吸附材料"], "answer": "ABC", "explanation": "目前大量应用的吸附剂按吸附剂载体分为活性炭类吸附剂、高分子吸附剂（含合成吸附树脂和天然改性高分子材料如琼脂糖、纤维素、壳聚糖）和无机材料吸附剂；免疫吸附剂和胆红素吸附材料是按功能或适应证划分的类别。"}, {"text": "关于免疫吸附(IA)与血浆置换(PE)的比较，描述正确的有", "options": ["Ａ.对致病抗体清除的选择性更高", "Ｂ.需大量置换液且有血源传播风险", "Ｃ.单次清除率为血浆置换的2~3倍", "Ｄ.血浆中有用成分丢失的范围和数量更小", "Ｅ.不需置换液，避免血源危险，简便"], "answer": "ACDE", "explanation": "免疫吸附对致病抗体清除的选择性更高，单次清除率为血浆置换的2~3倍，血浆中有用成分丢失的范围和数量更小，且不需置换液，可避免血源潜在危险，安全简便；需要大量置换液并存在传播血源性疾病风险的是血浆置换，不是免疫吸附。"}, {"text": "维持性血液透析患者中，建议开始行血液灌流治疗的情况包括", "options": ["Ａ.改良Duo氏瘙痒评分&gt;12分", "Ｂ.匹兹堡睡眠指数(PSQI)≥10分", "Ｃ.营养不良炎症评分(MIS)&gt;18分", "Ｄ.iPTH持续&gt;600pg/ml", "Ｅ.β2微球蛋白持续&gt;10mg/L"], "answer": "ABCD", "explanation": "改良Duo氏瘙痒评分&gt;12分或VAS评分&gt;8分、匹兹堡睡眠质量指数≥10分、营养不良炎症评分(MIS)&gt;18分或改良定量主观整体评估评分&gt;20分、iPTH持续&gt;600pg/ml等情况建议开始行血液灌流治疗；严重高β2微球蛋白血症的标准是β2微球蛋白持续&gt;30mg/L，故&gt;10mg/L不正确。"}, {"text": "关于游离的小分子水溶性毒素的描述正确的有", "options": ["Ａ.相对分子量&lt;500D", "Ｂ.代表物质为β2微球蛋白和瘦素", "Ｃ.包括尿素、肌酐、尿酸、胍类、酚类", "Ｄ.约45种", "Ｅ.能被低、高通量透析器清除"], "answer": "ACDE", "explanation": "游离的小分子水溶性毒素相对分子量&lt;500D，包括尿素、肌酐、尿酸、胍类、酚类等约45种，能被低、高通量透析器清除；β2微球蛋白和瘦素属于中大分子毒素，不是小分子水溶性毒素。"}, {"text": "关于中大分子毒素的描述正确的有", "options": ["Ａ.均为多肽或细胞因子", "Ｂ.共22种", "Ｃ.代表物质为尿素和肌酐", "Ｄ.分子质量555Da~3.2KDa", "Ｅ.常规血液透析不能清除"], "answer": "ABDE", "explanation": "中大分子毒素均为多肽或细胞因子，共22种，分子质量555Da~3.2KDa，在体内呈多室分布，常规血液透析不能清除；尿素和肌酐属于小分子水溶性毒素，不是中大分子毒素的代表物质。"}, {"text": "关于蛋白结合类尿毒症毒素的描述正确的有", "options": ["Ａ.共45种", "Ｂ.多数具有疏水/亲脂性", "Ｃ.不能被低通量透析器清除", "Ｄ.代表物质有尿素、肌酐", "Ｅ.高通量透析仅能部分清除该毒素"], "answer": "ABCE", "explanation": "蛋白结合类尿毒症毒素共45种，多数具有疏水/亲脂性，不能被低通量透析器清除，高通量透析能部分清除但仍有如呋喃丙酸等完全不能被清除；尿素、肌酐属于小分子水溶性毒素。"}, {"text": "尿毒症毒素与其主要相关并发症的对应关系正确的有", "options": ["Ａ.PTH—肾性骨病、异位钙化", "Ｂ.β2微球蛋白—淀粉样变及腕管综合症", "Ｃ.瘦素—营养不良", "Ｄ.吲哚—胰岛素抵抗、糖耐量异常", "Ｅ.同型半胱氨酸—心血管并发症"], "answer": "ABCE", "explanation": "PTH潴留导致肾性骨病和异位钙化，β2微球蛋白潴留导致淀粉样变及腕管综合症，瘦素潴留导致营养不良，同型半胱氨酸潴留导致心血管并发症；吲哚潴留导致肾小球硬化，导致胰岛素抵抗和糖耐量异常的是马尿酸。"}, {"text": "关于组合型人工肾的描述正确的有", "options": ["Ａ.血液灌流可完全替代血液透析", "Ｂ.由HD联合HA130血液灌流组成", "Ｃ.血液灌流不能调节水电解质、酸碱平衡", "Ｄ.血液透析不能解决中大分子毒素蓄积", "Ｅ.血液灌流对蛋白结合类毒素清除良好"], "answer": "BCDE", "explanation": "组合型人工肾由血液透析联合HA130血液灌流组成，血液灌流不能调节水电解质和酸碱平衡、而血液透析不能解决中大分子毒素蓄积，血液灌流对中分子毒素及蛋白结合类毒素清除良好，两者优势互补；血液灌流不能完全替代血液透析的功能。"}, {"text": "决定急性重症中毒预后的主要因素包括", "options": ["Ａ.患者的文化程度", "Ｂ.毒物的毒性", "Ｃ.毒物摄入剂量", "Ｄ.是否早期使用特效解毒剂", "Ｅ.就诊时间"], "answer": "BCDE", "explanation": "决定急性重症中毒预后的主要因素有毒物的毒性、毒物摄入剂量、是否早期使用特效解毒剂、就诊时间以及是否早期采取血液净化治疗；患者的文化程度不是影响因素。"}, {"text": "关于血液灌流在危重症患者中应用的描述正确的有", "options": ["Ａ.CRRT可稳定血流动力学和水电平衡", "Ｂ.CRRT的缺点是溶质清除不确切", "Ｃ.血液吸附可清除TNF-α、内毒素等", "Ｄ.血液吸附可清除TG、TC等脂溶性物质", "Ｅ.CVVH清除中大分子毒素优于灌流"], "answer": "ABCD", "explanation": "CRRT的优点是血液动力学稳定、能提供充分的营养支持、保持水电平衡，其缺点是溶质清除不确切；血液吸附可清除IL-1、IL-6、IL-8、IL-10、HMGB、TNF-α、内毒素等中大分子毒素以及TG、TC等脂溶性物质；对中大分子毒素及蛋白结合类毒素清除效果较好的是血液灌流而非CVVH。"}, {"text": "关于百草枯毒代动力学的描述正确的有", "options": ["Ａ.百草枯与血浆蛋白结合率很高", "Ｂ.胃肠道吸收率为5%~15%", "Ｃ.吸收后0.5~4h内达血浆浓度峰值", "Ｄ.分布容积1.2~1.6L/kg", "Ｅ.分布相半衰期约5h，清除相约84h"], "answer": "BCDE", "explanation": "百草枯经口摄入后在胃肠道中的吸收率为5%~15%，大部分经粪便排泄，吸收后0.5~4h内达血浆浓度峰值，体内分布广泛，分布容积1.2~1.6L/kg，分布相血浆半衰期约5h、清除相约84h；百草枯与血浆蛋白结合很少。"}, {"text": "关于百草枯中毒血液净化方式选择的意见正确的有", "options": ["Ａ.HP和HD是清除血循环毒物的常用方法", "Ｂ.百草枯属水溶性、小分子物质", "Ｃ.推荐血浆置换为清除百草枯首选", "Ｄ.百草枯自身肾脏清除率大于HD", "Ｅ.HD只用于合并肾功能损伤的患者"], "answer": "ABDE", "explanation": "血液灌流和血液透析是清除血液循环中毒物的常用方法，百草枯属水溶性、小分子物质，但其自身肾脏清除率(170mL/min)远大于血液透析的毒物清除作用，故建议血液透析只用于合并肾功能损伤的患者；百草枯在血浆中几乎呈游离状态，不建议将血浆置换用于清除血中百草枯。"}, {"text": "脓毒血症血液吸附治疗的要点正确的有", "options": ["Ａ.适应症含SIRS、ARDS等", "Ｂ.治疗频率为每周1次", "Ｃ.常用灌流器为HA330", "Ｄ.内毒素吸附柱可选PMX-F等", "Ｅ.治疗方式为HP+CRRT"], "answer": "ACDE", "explanation": "严重脓毒血症发生系统性炎症反应综合征、ARDS、MODS时可行血液吸附治疗，常用灌流器为HA330，内毒素吸附柱可选用PMX-F、MATISS吸附柱，治疗方式为HP联合CRRT；血液灌流的治疗频率为1~2次/天，治疗2~5次，每次治疗2小时，而非每周1次。"}, {"text": "重症急性胰腺炎血液灌流治疗的要点正确的有", "options": ["Ａ.常用灌流器为HA330", "Ｂ.血液灌流治疗可升高血脂", "Ｃ.优选HP+CRRT，亦可HVHF+HP", "Ｄ.治疗频率为1次/天或隔天1次", "Ｅ.3次一疗程，每次2~2.5h"], "answer": "ACDE", "explanation": "重症急性胰腺炎的血液灌流治疗常用灌流器为HA330，治疗方式优选HP+CRRT、条件有限可选择HVHF+HP，治疗频率为1次/天或隔天1次，3次为一个疗程，每次治疗时间2~2.5h；血液灌流具有调节炎症介质、降低TC和TG及降低死亡率的作用，不会升高血脂。"}, {"text": "灌流过程中出现低血压的可能原因包括", "options": ["Ａ.有效循环血量不足", "Ｂ.容量负荷过重", "Ｃ.心血管病或毒物对心血管的损害", "Ｄ.吸附导致部分血管加压物质丢失", "Ｅ.失衡综合征或首次使用综合征"], "answer": "ACDE", "explanation": "灌流过程中出现低血压的原因包括有效循环血量不足、合并心血管疾病或中毒时毒物本身对心血管系统的损害作用、吸附导致部分血管加压物质丢失以及失衡综合征或首次使用综合征；容量负荷过重是灌流过程中出现高血压的原因之一。"}, {"text": "血液灌流的常见不良反应包括", "options": ["Ａ.微粒栓塞", "Ｂ.免疫抑制", "Ｃ.空气栓塞", "Ｄ.灌流器及体外循环凝血", "Ｅ.溶血"], "answer": "ACDE", "explanation": "血液灌流的不良反应包括微粒栓塞、空气栓塞、灌流器及体外循环凝血、血压下降、血小板减少、寒战高热、出血和溶血；免疫抑制不属于血液灌流的不良反应。"}, {"text": "灌流过程中的常见凝血因素包括", "options": ["Ａ.预冲总量不足", "Ｂ.预冲速度过快", "Ｃ.肝素用量不足", "Ｄ.灌流治疗时间过长超过2.5小时", "Ｅ.灌流时血流速度过快"], "answer": "ABCD", "explanation": "常见凝血因素包括预冲总量不足、预冲速度过快、肝素用量不足、透析加灌流治疗时灌流结束取下灌流器时停泵时间延长、没有肝素用量个体化、灌流时温度设置偏低、灌流时血流速度过慢以及灌流治疗时间过长超过2.5小时；血流速度过快不是凝血因素，血流速度过慢才是。"}, {"text": "关于双重血浆吸附治疗的注意事项，正确的有", "options": ["Ａ.吸附柱必须按箭头方向预冲使用", "Ｂ.选膜面积大、分离率高的分离器", "Ｃ.按分离器、BS330、HA330-II串联", "Ｄ.报警时减少血泵停转时间", "Ｅ.单次治疗即可，无需疗程化"], "answer": "ABCD", "explanation": "双重血浆吸附治疗的注意事项包括胆红素吸附柱必须按箭头方向预冲和使用、尽量选择膜面积较大分离率较高的血浆分离器、按血浆分离器和BS330及HA330-II的顺序依次串联、处理报警时尽量减少血泵停转时间以免凝血；该治疗推荐疗程化方案以巩固疗效，一般2~5次为一疗程。"}]}, {"type": "short", "questions": [{"text": "简述膜材料在血液净化中存在的不足，以及研制高选择性专一性吸附材料的临床意义。", "options": [], "answer": "膜材料的不足：①对血液中的致病物质缺乏选择性；②对于相对分子量较大、脂溶性或与蛋白质结合的毒物，透析和滤过的清除效果不佳；③在血浆滤过后，要向患者体内输入大量新鲜置换血浆，费用较高，且有传染疾病的危险。临床意义：为了弥补膜材料的不足，提高血液净化过程中致病物质的清除率，减少副作用，研制具有较高选择性的专一性吸附材料成为临床治疗的迫切需要。", "explanation": "吸附材料对中大分子毒素、蛋白结合类毒素以及脂溶性物质有良好的清除作用，可弥补膜材料在选择性方面的不足，这也是吸附性血液净化技术成为血液净化领域新热点的重要原因。"}, {"text": "简述大孔吸附树脂的吸附作用原理。", "options": [], "answer": "大孔吸附树脂的吸附作用原理包括三个方面：①吸附树脂与目标物质之间的作用力，即依靠吸附树脂与目标物质之间的相互作用将目标物质吸附于树脂表面；②树脂孔径的筛分作用，即依靠树脂特定的孔径对目标物质进行选择性筛分；③三维网状结构的分子筛作用，使不同分子尺寸的物质在树脂孔道中获得不同的吸附效果。", "explanation": "吸附的作用力包括范德华力、静电力和抗原-抗体反应；其中物理吸附是吸附质分子与吸附剂表面原子或分子间以范德华力进行的吸附，化学吸附则是吸附质分子与吸附剂表面原子间发生电子的交换、转移或共有而形成吸附化学键。吸附剂的结构牢固、孔径均匀并具有适当数量的大孔时，吸附效果和生物相容性更好。"}, {"text": "简述血液灌流治疗急性中毒的指征。", "options": [], "answer": "血液灌流治疗急性中毒的指征包括：①急性药物、毒素中毒，特别是无特效解毒剂的中毒；②服药剂量超过了自身清除能力的30%；③药物或毒物的血浓度已达致死剂量或虽未达到，但估计会继续吸收；④摄入未知成分和数量的药物或毒物；⑤血液净化清除率高于内源性清除者；⑥中毒患者患有肝病或肾病，估计有解毒或排泄功能障碍；⑦药物、毒物对机体内环境有严重影响或有明显延迟效应。", "explanation": "急性重症中毒决定预后的主要因素有毒物的毒性、毒物摄入剂量、是否早期使用特效解毒剂、就诊时间和是否早期采取血液净化治疗，强调时间就是生命，要把握好救治的时效性。中毒后尽快促进毒物从体内排出是中毒抢救的主要方式，血液净化疗法在许多情况下已成为抢救重症及某些毒物中毒的首选方法。"}, {"text": "简述DNA免疫吸附柱治疗系统性红斑狼疮的适用范围。", "options": [], "answer": "DNA免疫吸附柱用于治疗系统性红斑狼疮，尤其适用于以下患者：①重度活动，SLEDAI评分≥15；②自身抗体滴度过高，ANA或抗ds-DNA抗体超出正常值范围20%以上；③合并器官损害，如狼疮性肾炎、狼疮性脑病等；④激素和免疫抑制剂治疗效果欠佳或不能耐受激素和免疫抑制剂治疗的患者。", "explanation": "DNA免疫吸附能显著降低系统性红斑狼疮患者抗双链DNA抗体水平并缓解病情。免疫吸附对致病抗体清除的选择性更高，单次清除率为血浆置换的2~3倍，血浆中有用成分丢失的范围和数量更小，且不需置换液，可避免血源潜在危险，安全简便。"}, {"text": "简述血液灌流过程中发生凝血的常见原因，以及凝血的预防与观察要点。", "options": [], "answer": "常见凝血原因：①预冲总量不足；②预冲速度过快；③肝素用量不足；④透析加灌流治疗时，灌流结束取下灌流器时因操作不熟练停泵时间延长；⑤没有肝素用量个体化；⑥灌流时温度设置偏低；⑦灌流时血流速度过慢；⑧灌流治疗时间过长超过2.5个小时。预防与观察要点：①充分预冲使灌流器肝素化；②观察血流情况及管路张力情况，动脉壶液平面较前升高提示灌流器凝血；③监测血压变化，低血压常是导致血流量不足的主要原因；④监测各项压力变化，动脉压上限报警提示灌流器内阻力增加、可能有凝血倾向，静脉压高限报警提示静脉壶内凝血、管网堵塞；⑤如果血流速慢，治疗中应每30分钟盐水冲管100~200ml，或者动脉端持续输入盐水70~80滴/min，降低血液粘稠度，预防凝血。", "explanation": "出现深静脉导管试通畅时抽血不畅、血液颜色改变、动脉压超下限、血流速无法达到150ml/min、静脉压持续走高等情况，提示凝血倾向大，应请示医生是否追加抗凝剂。灌流过程中还应密切观察患者生命体征，出现低血压时及时补充血容量并改善心功能。"}]}]}, {"num": 12, "title": "血液净化透析器的结构、相关参数及应用理论考试题库", "sections": [{"type": "single", "questions": [{"text": "透析器是进行血液透析时血液和透析液进行溶质交换的管道和容器，其构成中属于主要部分的是（  ）", "options": ["A.支撑结构", "B.透析器外壳", "C.透析膜", "D.密封材料", "E.血路管"], "answer": "C", "explanation": "透析器由透析膜及其支撑结构组成，透析膜是透析器的主要部分。"}, {"text": "血液透析时，血液与透析液在透析膜两侧的流动方式是（  ）", "options": ["A.同向流动", "B.反向流动", "C.垂直交叉流动", "D.间歇交替流动", "E.静止不流动"], "answer": "B", "explanation": "透析时血液和透析液在透析膜的两侧反向流动，水和溶质通过半透膜进行交换，透析器的性能决定透析治疗的效果。"}, {"text": "1854年第一次提出晶体物质通过半透膜弥散并开创渗透学说、被称为现代透析之父的科学家是（  ）", "options": ["A.Willem Kolff", "B.Skeggs", "C.Thomas Graham", "D.Leonards", "E.Lipps"], "answer": "C", "explanation": "1854年，苏格兰的Thomas Graham第一次提出晶体物质通过半透膜弥散并开创了渗透学说，被称为现代透析之父。"}, {"text": "1913年用火棉胶制成管状透析器并进行动物试验、将其命名为“人工肾脏”的是（  ）", "options": ["A.美国的Johons Hopkins医学院", "B.荷兰学者Willem Kolff", "C.苏格兰的Thomas Graham", "D.德国贝朗公司", "E.日本东丽公司"], "answer": "A", "explanation": "1913年，美国的Johons Hopkins医学院展示出他们用火棉胶制成的管状透析器，并进行动物试验，将其命名为“人工肾脏”。"}, {"text": "1943年研制成鼓型透析器、被称为人工器官之父、首例用人工肾救活肾衰患者的学者是（  ）", "options": ["A.Thomas Graham", "B.Watschinger", "C.Skeggs", "D.Willem Kolff", "E.Leonards"], "answer": "D", "explanation": "1943年，荷兰学者、人工器官之父Willem Kolff研制成鼓型透析器，首例用人工肾救活肾衰患者。"}, {"text": "美国人工器官协会宣布人工肾可以正式应用于临床的年份是（  ）", "options": ["A.1854年", "B.1913年", "C.1943年", "D.1955年", "E.1967年"], "answer": "D", "explanation": "1955年，美国人工器官协会宣布人工肾可以正式应用于临床，Kolff转鼓式人工肾在欧美部分医院逐步得到推广，用于急性肾衰竭患者的血液净化治疗。"}, {"text": "1949年发明平板透析器的两位学者是（  ）", "options": ["A.Skeggs和Leonards", "B.Kolff和Watschinger", "C.Lipps和Graham", "D.Kolff和Skeggs", "E.Graham和Leonards"], "answer": "A", "explanation": "1949年Skeggs和Leonards发明了平板透析器；1940年代Willem Kolff和Watschinger研制成第一台蟠管型透析器，1955年制成双蟠管型透析器。"}, {"text": "平板透析器由3块精密制造的聚丙烯平板作为骨架，每2层平板之间放置半透膜的数量是（  ）", "options": ["A.1块", "B.2块", "C.3块", "D.4块", "E.6块"], "answer": "B", "explanation": "平板透析器由3块精密制造的聚丙烯平板作为骨架，每2层平板之间放置2块半透膜，血液在2块薄膜之间流动，透析液在薄膜外逆向流动，20世纪60年代得到大力发展。"}, {"text": "1957年为一例急性肾功能衰竭患者进行血液透析、开启国内血液透析篇章的教授是（  ）", "options": ["A.Kolff", "B.Watschinger", "C.吴阶平", "D.Lipps", "E.Skeggs"], "answer": "C", "explanation": "1957年吴阶平教授为一例急性肾功能衰竭患者进行血液透析，开启了国内血液透析的篇章。"}, {"text": "1967年把醋酸纤维拉成直径200um的空心纤维、并将其装入硬壳内使空心纤维透析器问世的学者是（  ）", "options": ["A.Lipps", "B.Kolff", "C.Skeggs", "D.Watschinger", "E.Leonards"], "answer": "A", "explanation": "1967年Lipps把醋酸纤维拉成直径200um的空心纤维，把8000-10000根纤维装在一个硬壳内，空心纤维透析器问世。"}, {"text": "目前临床使用的透析器以哪一类膜材料为主（  ）", "options": ["A.纤维素膜", "B.改良纤维素膜", "C.合成膜", "D.铜氨纤维素膜", "E.醋酸纤维素膜"], "answer": "C", "explanation": "透析膜材料分为纤维素膜、改良纤维素膜和合成膜，目前临床使用的透析器以合成膜为主。"}, {"text": "纤维素膜生物相容性差，其表面可与血液成分发生反应的结构是（  ）", "options": ["A.极性基团", "B.疏水基团", "C.游离羟基团", "D.生物亲和吸附剂", "E.亲水剂"], "answer": "C", "explanation": "纤维膜生物相容性差，其表面有游离羟基团，可与血液成分反应。"}, {"text": "改良纤维素膜改善生物相容性及性能的原因是（  ）", "options": ["A.在形成膜之前被乙酰化", "B.加入新型亲水剂", "C.孔径增大至8-10nm", "D.表面嫁接疏水性基团", "E.经γ射线辐照改性"], "answer": "A", "explanation": "改良纤维素膜在纤维素形成膜之前被乙酰化，因而改善了生物相容性及性能。"}, {"text": "关于合成膜的表述，下列不正确的是（  ）", "options": ["A.为合成高分子聚合膜", "B.包括聚砜、聚醚砜、聚丙烯腈等", "C.有较高的清除率和超滤系数", "D.生物相容性好，广泛应用于临床", "E.表面有游离羟基团，可与血液成分反应"], "answer": "E", "explanation": "合成膜即合成高分子聚合膜，包括聚砜、聚醚砜、聚丙烯腈、聚甲基丙烯酸甲酯、聚碳酸酯和聚酰胺膜等，有较高的清除率和超滤系数、生物相容性好，目前广泛应用于临床；表面有游离羟基团、可与血液成分反应是纤维素膜的特点。"}, {"text": "不同膜材料透析膜性能比较中，纤维膜的亲水性特点是（  ）", "options": ["A.亲水性弱", "B.亲水性强", "C.较强的疏水性", "D.亲水性中等", "E.与水完全不相容"], "answer": "B", "explanation": "不同膜材料透析膜性能比较：纤维膜亲水性强；改良纤维膜亲水性弱；合成膜为较强的疏水性。"}, {"text": "利用微流控原理、无须血膜接触，将血液与透析液以平行流动方式直接接触的透析方式是（  ）", "options": ["A.无膜透析", "B.血液灌流", "C.血浆置换", "D.免疫吸附", "E.腹膜透析"], "answer": "A", "explanation": "无膜透析利用微流控原理，无须血膜接触，将易混的血液与透析液以平行流动方式进行直接接触，依靠弥散机制完成对流转运，是透析器发展的趋势之一。"}, {"text": "常用透析膜主流产品中，铜氨纤维素膜的制造公司是（  ）", "options": ["A.日本TOYOBO", "B.德国membrana", "C.日本旭化成", "D.日本东丽", "E.德国Fresenius"], "answer": "C", "explanation": "铜氨纤维素膜由日本旭化成制造，代表产品为Asahi AM-BIO-650。"}, {"text": "常用透析膜主流产品中，代表产品B3-1.3A的膜材质是（  ）", "options": ["A.聚甲基丙烯酸甲酯", "B.聚砜", "C.聚醚砜", "D.铜氨纤维素膜", "E.改良醋酸纤维素膜"], "answer": "A", "explanation": "聚甲基丙烯酸甲酯膜由日本东丽制造，代表产品为B3-1.3A。"}, {"text": "透析器按构型划分，不包括下列哪一类型（  ）", "options": ["A.管型", "B.平板型", "C.空心纤维型", "D.鼓型", "E.以上均属于构型划分"], "answer": "D", "explanation": "透析器按构型划分为管型、平板型和空心纤维型；鼓型是透析器发展史上的鼓型透析器，不属于按构型划分的类型。"}, {"text": "目前临床使用的透析器属于哪一构型（  ）", "options": ["A.管型", "B.平板型", "C.空心纤维型", "D.蟠管型", "E.鼓型"], "answer": "C", "explanation": "目前临床使用的透析器为空心纤维型；早期使用的平板型、管型透析器已基本淘汰。"}, {"text": "空心纤维型透析器由多少根空心纤维构成（  ）", "options": ["A.8000-10000根", "B.8000-12000根", "C.10000-15000根", "D.12000-15000根", "E.5000-8000根"], "answer": "B", "explanation": "空心纤维型透析器由8000-12000根空心纤维构成，纤维内径200-300um，壁厚2-30um，空心纤维捆扎成束放入成形的透析器外壳内。"}, {"text": "空心纤维型透析器纤维的内径范围是（  ）", "options": ["A.100-200um", "B.200-300um", "C.300-400um", "D.400-500um", "E.2-30um"], "answer": "B", "explanation": "空心纤维型透析器纤维内径200-300um，壁厚2-30um，空心纤维捆扎成束放入成形的透析器外壳内。"}, {"text": "空心纤维型透析器中，外壳与透析膜之间采用的密封材料是（  ）", "options": ["A.聚丙烯", "B.聚碳酸酯", "C.聚氨脂", "D.活性炭", "E.吸附树脂"], "answer": "C", "explanation": "空心纤维型透析器中空心纤维捆扎成束放入成形的透析器外壳内，外壳与透析膜之间采用聚氨脂进行密封。"}, {"text": "在空心纤维型透析器中，血液与透析液的流动位置关系是（  ）", "options": ["A.血液在纤维内，透析液在纤维外反向流动", "B.血液在纤维内，透析液在纤维内同向流动", "C.血液在纤维外，透析液在纤维内反向流动", "D.血液在纤维外，透析液在纤维外同向流动", "E.血液与透析液均静止在纤维外"], "answer": "A", "explanation": "空心纤维型透析器中血液在空心纤维内流过，透析液在纤维外面以相反方向流动。"}, {"text": "空心纤维型透析器与早期透析器相比的优点不包括（  ）", "options": ["A.预充量小", "B.表面积大，超滤率和清除率高", "C.结构坚固，易于操作", "D.能耐受很高的跨膜压", "E.体外循环容量大"], "answer": "E", "explanation": "空心纤维型透析器的优点是：预充量小；表面积大，超滤率和清除率高；结构坚固，易于操作，能耐受很高的跨膜压。体外循环容量大是使用大面积透析器时的特点，患者可能出现容量性低血压，不是其优点。"}, {"text": "超滤系数（Kuf）是指在单位时间内，跨膜压每变化1mmHg时透析器所能超滤出的液体量，它反映透析器的（  ）", "options": ["A.溶质清除效能", "B.水清除效能", "C.溶质筛选能力", "D.生物相容性高低", "E.膜面积大小"], "answer": "B", "explanation": "超滤系数（Kuf）反映透析器的水清除效能，是衡量透析器排水能力强弱的关键指标；Kuf值越高，相同压力下脱水效率越高。"}, {"text": "透析治疗中超滤量的计算公式是（  ）", "options": ["A.超滤量＝Kuf÷跨膜压×治疗时间", "B.超滤量＝Kuf×跨膜压×治疗时间", "C.超滤量＝Kuf×膜面积×治疗时间", "D.超滤量＝跨膜压×膜面积", "E.超滤量＝Kuf×跨膜压÷治疗时间"], "answer": "B", "explanation": "超滤量＝Kuf×跨膜压×治疗时间，说明超滤量由超滤系数、跨膜压和治疗时间共同决定。"}, {"text": "对透析膜水的通透性影响最大的因素是（  ）", "options": ["A.膜材料种类", "B.膜厚度", "C.膜的孔径大小", "D.膜面积", "E.消毒方式"], "answer": "C", "explanation": "透析膜对水的通透性影响最大的因素是膜的孔径大小，膜孔径大小的轻微变化就会对水的通透性产生巨大影响；Kuf值与膜材料、膜厚度以及最重要的孔径大小密切相关。"}, {"text": "按照超滤系数（Kuf）分类，超滤系数&lt;20ml/(h·mmHg)的透析器属于（  ）", "options": ["A.中通量透析器", "B.低通量透析器", "C.高通量透析器", "D.血液滤过器", "E.血浆分离器"], "answer": "B", "explanation": "低通量透析器（HD）超滤系数&lt;20ml/(h·mmHg)；高通量透析器（HFD）超滤系数≧20ml/(h·mmHg)；血液滤过器（HDF）超滤系数≧50ml/(h·mmHg)。"}, {"text": "按照超滤系数（Kuf）分类，高通量透析器（HFD）的超滤系数标准是（  ）", "options": ["A.&lt;20ml/(h·mmHg)", "B.≧20ml/(h·mmHg)", "C.≧50ml/(h·mmHg)", "D.≧100ml/(h·mmHg)", "E.≧150ml/(h·mmHg)"], "answer": "B", "explanation": "高通量透析器（HFD）超滤系数≧20ml/(h·mmHg)；低通量透析器超滤系数&lt;20ml/(h·mmHg)；血液滤过器超滤系数≧50ml/(h·mmHg)。"}, {"text": "按照超滤系数（Kuf）分类，超滤系数≧50ml/(h·mmHg)的属于（  ）", "options": ["A.低通量透析器", "B.中通量透析器", "C.高通量透析器", "D.血液滤过器", "E.免疫吸附器"], "answer": "D", "explanation": "血液滤过器超滤系数≧50ml/(h·mmHg)；高通量透析器≧20ml/(h·mmHg)；低通量透析器&lt;20ml/(h·mmHg)。超滤系数越大，在相同跨膜压下水的清除量越多。"}, {"text": "筛选系数是指（  ）", "options": ["A.透析器对水的清除效能", "B.半透膜两侧某种物质浓度的比值", "C.单位时间内清除某溶质的血浆容积", "D.透析膜表面的亲水性能", "E.透析器对溶质的吸附能力"], "answer": "B", "explanation": "筛选系数指半透膜两侧某种物质浓度比值，反应了某种溶质通过半透膜的能力。"}, {"text": "筛选系数的取值范围是（  ）", "options": ["A.0-0.5", "B.0-1", "C.0-10", "D.1-2", "E.1-100"], "answer": "B", "explanation": "筛选系数数值从0-1：S=1表示完全通过；S=0表示完全不能通过；0＜S＜1表示部分通过。"}, {"text": "通常用来评估透析器筛选系数的指标是（  ）", "options": ["A.菊粉、β2-微球蛋白、白蛋白、肌红蛋白", "B.尿素、肌酐、钾、磷", "C.血钙、血磷、iPTH", "D.甘油三酯、胆固醇", "E.葡萄糖、乳酸、碳酸氢根"], "answer": "A", "explanation": "通常以菊粉、β2-微球蛋白、白蛋白、肌红蛋白等指标来评估透析器的筛选系数。"}, {"text": "清除率是指（  ）", "options": ["A.透析器在单位时间内超滤出的液体量", "B.半透膜两侧某种物质的浓度比值", "C.单位时间内能清除某溶质的血浆或血清容积", "D.透析器的膜面积与超滤系数的乘积", "E.血液与透析膜接触后产生的反应"], "answer": "C", "explanation": "清除率指单位时间内血液经透析器循环一次，能够将血中某一溶质全部清除的血浆或血清容积，反应透析器的溶质清除效能，清除率是评价透析器质量的关键指标。"}, {"text": "中分子物质的相对分子量范围是（  ）", "options": ["A.＜500", "B.500-5000", "C.5000-25000", "D.25000-50000", "E.＞50000"], "answer": "B", "explanation": "小分子物质相对分子量＜500（如尿素、肌酐）；中分子物质相对分子量500-5000（如维生素B12）；大分子物质相对分子量5000-25000。"}, {"text": "大分子物质的相对分子量范围是（  ）", "options": ["A.＜500", "B.500-5000", "C.5000-25000", "D.25000-100000", "E.＞100000"], "answer": "C", "explanation": "大分子物质相对分子量5000-25000；中分子物质相对分子量为500-5000；小分子物质相对分子量＜500。"}, {"text": "目前常见的透析器消毒剂不包括（  ）", "options": ["A.蒸汽", "B.环氧乙烷", "C.γ-射线", "D.戊二醛", "E.以上均属于常用消毒剂"], "answer": "D", "explanation": "使用不同消毒方法会对透析膜的结构（孔径、表面添加材料等）产生不同的影响，目前常见的透析器消毒剂有蒸汽、环氧乙烷、γ-射线。"}, {"text": "γ-射线消毒透析器的缺点是（  ）", "options": ["A.有消毒残留", "B.材质变色、机械强度降低、成本较高", "C.只适合对高热稳定的材料", "D.消毒成本最高且无消毒残留", "E.易引起首次使用综合征"], "answer": "B", "explanation": "γ射线消毒无消毒残留，缺点是材质变色、导致部分材料机械强度降低、成本相对较高；有残留、可使部分病人发生超敏反应和首次使用综合征是环氧乙烷消毒的缺点；只适合对高热稳定的材料、消毒成本高是蒸汽热消毒的缺点。"}, {"text": "选择透析器时主要考虑的因素不包括（  ）", "options": ["A.膜材料", "B.超滤系数", "C.清除率", "D.生物相容性和膜面积", "E.患者的经济收入"], "answer": "E", "explanation": "透析器的选择是决定血液透析方案的一个基本因素，选择透析器主要考虑膜材料、超滤系数、清除率、生物相容性和膜面积五个方面。"}, {"text": "血液透析（HD）时透析器的选择是（  ）", "options": ["A.高通量透析器，临床多采用纤维素膜", "B.中通量透析器，临床多采用铜氨纤维素膜", "C.低通量透析器，多用聚砜聚醚砜膜", "D.血液滤过器，临床多采用醋酸纤维素膜", "E.血浆分离器，临床多采用聚酰胺膜"], "answer": "C", "explanation": "血液透析是目前最常用的血液净化方式，主要通过弥散方式清除血液中的水及尿毒症毒素（肌酐、尿素、钾、磷等）；目前临床多采用聚砜或聚醚砜膜透析器，主要清除体内多余的小分子代谢毒素及水分，故选用低通量透析器。"}, {"text": "单纯超滤时透析器的选择是（  ）", "options": ["A.仅可选择低通量透析器", "B.选择中、高通量透析器", "C.必须选择血浆分离器", "D.选择活性炭灌流器", "E.选择任何类型的免疫吸附器"], "answer": "B", "explanation": "单纯超滤是通过对流转运机制，采用容量控制或压力控制，经过透析器或血滤器的半透膜等渗地从全血中除去水分的一种治疗方法；主要目的是清除体内多余水分，故选择中、高通量透析器，并根据患者心脏功能、水肿程度等选择适宜的膜面积。"}, {"text": "血液滤过对溶质的清除特点是（  ）", "options": ["A.仅清除小分子毒素，对中大分子无效", "B.清除中、大分子毒素较好，清除小分子较差", "C.各分子量毒素清除效果均优于血液透析", "D.仅通过弥散方式清除溶质", "E.不能清除体内多余水分"], "answer": "B", "explanation": "血液滤过利用对流原理清除血液中的溶质和多余水分，清除中、大分子毒素较好，清除小分子较差；治疗中先通过对流滤出大量液体，再从静脉补充相应的水、电解质、碱基等。"}, {"text": "连续性肾脏替代治疗（CRRT）对透析器（滤器）的选择要求是（  ）", "options": ["A.选择生物相容性高、通透性高的滤器", "B.选择低阻力但生物相容性要求最低的滤器", "C.选择低通量、低生物相容性的滤器", "D.选择膜面积最大的血浆分离器", "E.选择吸附能力强的活性炭灌流器"], "answer": "A", "explanation": "CRRT滤器的膜在治疗中将更大限度地接触外周循环血液，膜材料的生物相容性是最为主要的决定因素；透析器膜对溶质的清除能力以及对水的通透性决定CRRT使用滤器的性能，因此CRRT适合选择生物相容性高、通透性高的滤器。"}, {"text": "诱导透析时应选择的透析器是（  ）", "options": ["A.相对较小膜面积的透析器", "B.最大膜面积的透析器", "C.超高通量透析器", "D.含疏水性基团的透析器", "E.天然材料的透析器"], "answer": "A", "explanation": "诱导透析应选择相对较小膜面积的透析器，以减少透析失衡综合征的发生。"}, {"text": "有透析器过敏的患者应选择（  ）", "options": ["A.含疏水性基团的透析器", "B.天然材料的透析器（改良纤维素膜）", "C.膜面积最大的透析器", "D.超滤系数最高的透析器", "E.高通量合成膜透析器"], "answer": "B", "explanation": "过敏者选天然材料透析器；有出血倾向的患者选择含有疏水性基团的透析器；超滤量大的患者选择超滤系数高的透析器。"}, {"text": "2016年贝朗公司提出的、号称在普通透析模式下即可达到血液透析滤过效果的新治疗模式是（  ）", "options": ["A.血液灌流（HP）", "B.HDx模式", "C.血浆置换（PE）", "D.免疫吸附（IA）", "E.单纯超滤（IU）"], "answer": "B", "explanation": "2016年，贝朗公司提出了一种新的治疗模式Expanded Hemodialysis，简称HDx，号称只需在普通透析模式下就能达到HDF的效果；其原理没有发生变化，只是透析膜孔径更大、分布更均匀。"}, {"text": "高截留量透析膜的膜孔径范围是（  ）", "options": ["A.3-6nm", "B.6-8nm", "C.8-10nm", "D.10-20nm", "E.20-50nm"], "answer": "C", "explanation": "高截留量膜通常指膜孔径8-10nm的透析膜，是高通量膜孔径（3-6nm）的2-3倍；体外实验中分子截留量约为100kD（60-150kD），血液中约为50-60kD（40-100kD）。"}, {"text": "从2000年至今，欧洲各大透析器制造厂商的主要研发重点是（  ）", "options": ["A.透析器外壳材料", "B.血路管材质", "C.膜孔径分布", "D.消毒方式", "E.透析液配方"], "answer": "C", "explanation": "从2000年到现在，欧洲各大透析器制造厂商都主要将研发重点放到膜孔径分布上。"}, {"text": "日本透析器研究的一个重要方向是（  ）", "options": ["A.扩大膜面积", "B.研制抗血栓材料", "C.降低超滤系数", "D.改用纤维素膜", "E.取消透析膜"], "answer": "B", "explanation": "日本透析器的研究，很大一个方向是研制抗血栓材料；透析膜表面疏水部位会吸附蛋白，吸附的蛋白变性容易激活凝血系统，因而透析膜表面水分布成为研究热点。"}]}, {"type": "multiple", "questions": [{"text": "关于透析器的概述，下列表述正确的有（  ）", "options": ["Ａ.是血液与透析液溶质交换的容器", "Ｂ.由透析膜及其支撑结构组成", "Ｃ.透析膜是透析器的主要部分", "Ｄ.透析时血液与透析液同向流动", "Ｅ.透析器的性能与透析方案制定无关"], "answer": "ABC", "explanation": "透析器是进行血液透析时血液和透析液进行溶质交换的管道和容器，是血液透析的关键部分，由透析膜及其支撑结构组成，透析膜是其主要部分；透析时血液和透析液在透析膜两侧反向流动，故D项错误；透析器的性能决定透析治疗的效果，是制定血液透析方案的一个重要参考因素，故E项错误。"}, {"text": "关于透析器的发展史，下列表述正确的有（  ）", "options": ["Ａ.1854年提出晶体物质通过半透膜弥散", "Ｂ.1913年将管状透析器命名人工肾", "Ｃ.1943年研制成鼓型透析器", "Ｄ.1949年发明平板透析器", "Ｅ.1967年研制成第一台蟠管型透析器"], "answer": "ABCD", "explanation": "1854年苏格兰的Thomas Graham第一次提出晶体物质通过半透膜弥散并开创渗透学说；1913年美国的Johons Hopkins医学院将火棉胶制成的管状透析器命名为“人工肾脏”；1943年荷兰学者Willem Kolff研制成鼓型透析器；1949年Skeggs和Leonards发明平板透析器。第一台蟠管型透析器是1940年代由Willem Kolff和Watschinger研制成的，1967年Lipps的贡献是使空心纤维透析器问世，故E项错误。"}, {"text": "空心纤维型透析器与早期透析器相比的优点包括（  ）", "options": ["Ａ.预充量小", "Ｂ.表面积大，超滤率和清除率高", "Ｃ.结构坚固，易于操作", "Ｄ.能耐受很高的跨膜压", "Ｅ.体外循环容量大"], "answer": "ABCD", "explanation": "空心纤维型透析器的优点为：预充量小；表面积大，超滤率和清除率高；结构坚固，易于操作，能耐受很高的跨膜压。体外循环容量大是使用大面积透析器时的特点，患者可能出现容量性低血压，不属于其优点，故E项错误。"}, {"text": "关于透析膜生物相容性，下列表述正确的有（  ）", "options": ["Ａ.血液与透析膜等材料接触后的反应", "Ｂ.包括补体旁路的激活", "Ｃ.包括炎症因子的释放", "Ｄ.包括凝血系统的激活", "Ｅ.与急性及远期并发症无关"], "answer": "ABCD", "explanation": "生物相容性血液与透析膜等材料接触后的反应，包括补体旁路的激活、炎症因子的释放和凝血系统的激活等，与透析过程中的一些急性并发症及长期透析的远期并发症密切相关，故E项错误。"}, {"text": "合成膜包括下列哪些膜材料（  ）", "options": ["Ａ.聚砜", "Ｂ.聚醚砜", "Ｃ.聚丙烯腈", "Ｄ.聚甲基丙烯酸甲酯", "Ｅ.醋酸纤维素"], "answer": "ABCD", "explanation": "合成膜即合成高分子聚合膜，包括聚砜、聚醚砜、聚丙烯腈、聚甲基丙烯酸甲酯、聚碳酸酯和聚酰胺膜等；醋酸纤维素属于改良纤维素膜，故E项错误。合成膜有较高的清除率和超滤系数，生物相容性好，目前广泛应用于临床。"}, {"text": "不同膜材料透析膜性能比较，下列表述正确的有（  ）", "options": ["Ａ.纤维膜超滤系数低", "Ｂ.改良纤维膜超滤系数适中", "Ｃ.合成膜超滤系数高", "Ｄ.合成膜补体激活少", "Ｅ.合成膜补体激活多"], "answer": "ABCD", "explanation": "膜材料性能比较：纤维膜超滤系数低、清除率低、补体激活多；改良纤维膜超滤系数适中、清除率较高、补体激活较多；合成膜超滤系数高、清除率高、补体激活少，故E项错误。"}, {"text": "关于连续性肾脏替代治疗（CRRT）透析器（滤器）的选择，下列表述正确的有（  ）", "options": ["Ａ.滤器膜更大限度接触外周循环血液", "Ｂ.膜材料的生物相容性是最主要的决定因素", "Ｃ.膜清除能力及水通透性决定滤器性能", "Ｄ.适合选择生物相容性高、通透性高的滤器", "Ｅ.应选择生物相容性最差的低阻力滤器"], "answer": "ABCD", "explanation": "CRRT采用低阻力、高效能滤过器，以连续、缓慢清除水及溶质为特点。与其他血液净化方式比，CRRT透析器或滤器的膜在治疗中将更大限度地接触外周循环血液，因此膜材料的生物相容性是最为主要的决定因素；透析器膜对溶质的清除能力以及对水的通透性决定CRRT使用滤器的性能，因此CRRT适合选择生物相容性高、通透性高的滤器，故E项错误。"}, {"text": "常用透析膜主流产品中，膜材质与制造公司对应正确的有（  ）", "options": ["Ａ.铜氨纤维素膜——日本旭化成", "Ｂ.醋酸膜——日本TOYOBO", "Ｃ.聚甲基丙烯酸甲酯——日本东丽", "Ｄ.聚砜——德国Fresenius", "Ｅ.聚砜——美国某医学院"], "answer": "ABCD", "explanation": "铜氨纤维素膜由日本旭化成制造，代表产品Asahi AM-BIO-650；醋酸膜由日本TOYOBO制造，代表产品Nipro系列；聚甲基丙烯酸甲酯由日本东丽制造，代表产品B3-1.3A；聚砜由德国Fresenius和德国Braun制造，代表产品F6/F60HPS、HIPS/LOPS；聚醚砜由德国Membrana制造，代表产品Bellco bls514，故E项错误。"}, {"text": "关于超滤系数（Kuf），下列表述正确的有（  ）", "options": ["Ａ.跨膜压每变化1mmHg时的超滤量", "Ｂ.反映透析器的水清除效能", "Ｃ.与膜材料、膜厚度及孔径大小密切相关", "Ｄ.超滤量＝Kuf×跨膜压×治疗时间", "Ｅ.Kuf值越高，相同压力下脱水效率越低"], "answer": "ABCD", "explanation": "超滤系数（Kuf）指在单位时间内，跨膜压每变化1mmHg时，透析器所能超滤出的液体量，反映了透析器的水清除效能，它与膜材料、膜厚度以及最重要的孔径大小密切相关；超滤量＝Kuf×跨膜压×治疗时间；Kuf值越高，相同压力下脱水效率越高，故E项错误。"}, {"text": "按照超滤系数（Kuf）对透析器分类，下列表述正确的有（  ）", "options": ["Ａ.低通量Kuf&lt;20ml/(h·mmHg)", "Ｂ.高通量Kuf≧20ml/(h·mmHg)", "Ｃ.血滤器Kuf≧50ml/(h·mmHg)", "Ｄ.Kuf越大，相同跨膜压水清除越多", "Ｅ.中通量Kuf≧50ml/(h·mmHg)"], "answer": "ABCD", "explanation": "低通量透析器（HD）超滤系数&lt;20ml/(h·mmHg)；高通量透析器（HFD）超滤系数≧20ml/(h·mmHg)；血液滤过器（HDF）超滤系数≧50ml/(h·mmHg)。超滤系数越大，在相同跨膜压下水的清除量越多。中通量透析器介于低通量与高通量之间，≧50ml/(h·mmHg)对应的是血液滤过器，故E项错误。"}, {"text": "关于筛选系数，下列表述正确的有（  ）", "options": ["Ａ.指半透膜两侧某种物质浓度的比值", "Ｂ.反映某种溶质通过半透膜的能力", "Ｃ.数值范围为0-1", "Ｄ.S=1表示溶质完全通过", "Ｅ.S=1表示溶质完全不能通过"], "answer": "ABCD", "explanation": "筛选系数指半透膜两侧某种物质浓度比值，反应了某种溶质通过半透膜的能力，数值从0-1：S=1，完全通过；S=0，完全不能通过；0＜S＜1，部分通过。故E项错误。"}, {"text": "通常用于评估透析器筛选系数的指标有（  ）", "options": ["Ａ.菊粉", "Ｂ.β2-微球蛋白", "Ｃ.白蛋白", "Ｄ.肌红蛋白", "Ｅ.尿素"], "answer": "ABCD", "explanation": "通常以菊粉、β2-微球蛋白、白蛋白、肌红蛋白等指标来评估透析器的筛选系数；尿素属于小分子物质，是评价清除率的对象，不作为筛选系数的评估指标，故E项错误。"}, {"text": "关于清除率，下列表述正确的有（  ）", "options": ["Ａ.单位时间内清除某溶质的血浆容积", "Ｂ.反应透析器的溶质清除效能", "Ｃ.是评价透析器质量的关键指标", "Ｄ.与透析膜特性及膜面积相关", "Ｅ.与透析方案制定无关"], "answer": "ABCD", "explanation": "清除率指单位时间内血液经透析器循环一次，能够将血中某一溶质全部清除的血浆或血清容积，反应透析器的溶质清除效能，是评价透析器质量的关键指标；清除率与透析膜特性及膜面积相关，是决定透析方案的主要因素之一，故E项错误。"}, {"text": "关于血液灌流器，下列表述正确的有（  ）", "options": ["Ａ.经吸附清除有害代谢产物或毒物药物", "Ｂ.灌流器分为活性炭灌流器和树脂灌流器", "Ｃ.活性炭吸附速度快、吸附量大", "Ｄ.活性炭灌流器易有微粒脱落", "Ｅ.活性炭灌流器装量为80/100/130"], "answer": "ABCD", "explanation": "血液灌流是将患者血液引出体外，经过血液灌流器，通过吸附的方式清除血液中的有害代谢产物或外源性毒物或药物，净化后的血液再输回体内；灌流器根据内装吸附剂的不同分为活性炭灌流器和树脂灌流器；活性炭是一种广谱吸附剂，能吸附多种化合物，其特点为吸附速度快、吸附量大，易有微粒脱落。活性炭灌流器根据装量的不同分为60/100/150的规格，故E项错误。"}, {"text": "关于树脂灌流器，下列表述正确的有（  ）", "options": ["Ａ.吸附剂为吸附树脂", "Ｂ.树脂是高分子聚合物", "Ｃ.带极性基团易吸附极性水溶物质", "Ｄ.带非极性基团时易吸附脂溶性物质", "Ｅ.装量80～130用于中毒毒素吸附"], "answer": "ABCD", "explanation": "树脂灌流器的吸附剂为吸附树脂；树脂是高分子聚合物，聚合物骨架上带有极性基团时易吸附极性大且溶于水的物质，带有非极性基团时易吸附脂溶性物质；目前临床采用树脂灌流器较多，80～130主要应用于透析串联灌流、对尿毒症中分子吸附，150～280应用于中毒毒素的吸附，280～330应用于免疫吸附与肝病领域，故E项错误。"}, {"text": "关于血浆吸附和免疫吸附，下列表述正确的有（  ）", "options": ["Ａ.先分离血浆再以吸附清除致病物质", "Ｂ.采用生物亲和吸附剂时称为免疫吸附法", "Ｃ.血浆与吸附剂间有物理化学吸附", "Ｄ.血浆分离器为空心纤维型滤器", "Ｅ.免疫吸附使用的吸附材料为活性炭"], "answer": "ABCD", "explanation": "血浆吸附是将患者血液引出体外后，首先经血浆分离器分离出血浆，然后血浆与固相的吸附剂接触，以吸附方式清除血浆中某些内源性致病物质或外源性药物或毒物；采用生物亲和吸附剂作为吸附材料进行治疗时称为免疫吸附法；血浆与吸附剂的作用主要有物理吸附、化学吸附、生物亲和吸附及物理化学亲和吸附；血浆分离器为空心纤维型滤器。免疫吸附使用的吸附材料是生物亲和吸附剂，不是活性炭，故E项错误。"}, {"text": "不同透析器消毒方式的比较，下列表述正确的有（  ）", "options": ["Ａ.环氧乙烷适合各种膜材料且消毒成本低", "Ｂ.环氧乙烷有残留，可致超敏反应", "Ｃ.γ射线消毒无消毒残留", "Ｄ.蒸汽热消毒无残留、无毒性", "Ｅ.蒸汽热消毒适合各种膜材料"], "answer": "ABCD", "explanation": "环氧乙烷消毒的优点为适合各种膜材料、消毒成本低，缺点是有残留，部分病人有超敏反应和首次使用综合征；γ射线消毒无消毒残留，缺点是材质变色、导致部分材料机械强度降低、成本相对较高；蒸汽热消毒无残留、无毒性，缺点是只适合对高热稳定的材料、消毒成本高，故E项错误。"}, {"text": "血液透析（HD）的透析器选择，下列表述正确的有（  ）", "options": ["Ａ.血透主要经弥散清除水及毒素", "Ｂ.临床多采用聚砜或聚醚砜膜透析器", "Ｃ.清除小分子及水分，选低通量", "Ｄ.清除大分子物质，须选高通量", "Ｅ.血液透析治疗不需要透析液"], "answer": "ABC", "explanation": "血液透析是目前最常用的血液净化方式，主要通过弥散方式清除血液中的水及尿毒症毒素（肌酐、尿素、钾、磷等）；目前临床多采用聚砜或聚醚砜膜透析器，血液透析主要清除体内多余的小分子代谢毒素及水分，故选用低通量透析器；血液透析需要透析液与血液在透析膜两侧反向流动，故D、E项错误。"}, {"text": "关于血液滤过与血液透析滤过，下列表述正确的有（  ）", "options": ["Ａ.血液滤过利用对流清除溶质和水分", "Ｂ.对中、大分子毒素清除效果较好", "Ｃ.对小分子毒素清除不如血液透析", "Ｄ.经弥散清除小分子、对流清除中分子", "Ｅ.血液透析滤过选低通量滤器"], "answer": "ABCD", "explanation": "血液滤过利用对流原理清除血液中的溶质和多余水分，清除中、大分子毒素较好，清除小分子较差；血液透析滤过综合了血液透析和血液滤过的优点，通过弥散高效清除小分子物质和通过对流高效清除中分子物质，与血液滤过相同，选用高通量、高生物相容性的滤器，并根据患者体表面积选择滤器膜面积，故E项错误。"}, {"text": "几种特殊情况下透析器的选择，下列表述正确的有（  ）", "options": ["Ａ.诱导透析选择相对较小膜面积的透析器", "Ｂ.出血倾向者选含疏水性基团透析器", "Ｃ.过敏者选天然材料透析器", "Ｄ.超滤量大的患者选择超滤系数高的透析器", "Ｅ.诱导透析选择最大膜面积的透析器"], "answer": "ABCD", "explanation": "诱导透析应选择相对较小膜面积的透析器，以减少透析失衡综合征的发生；有出血倾向的患者选择含有疏水性基团的透析器；透析器过敏的选择为天然材料的透析器（改良纤维素膜）；超滤量大的患者选择超滤系数高的透析器。故E项错误。"}]}, {"type": "short", "questions": [{"text": "简述透析器按构型的分类，以及空心纤维型透析器的主要结构参数和优点。", "options": [], "answer": "【构型分类】透析器根据构型划分为：管型、平板型、空心纤维型。目前临床使用的透析器为空心纤维型，早期使用的平板型、管型透析器已基本淘汰。【结构参数】空心纤维型透析器由8000-12000根空心纤维构成，纤维内径200-300um，壁厚2-30um；空心纤维捆扎成束，放入成形的透析器外壳内，外壳与透析膜之间采用聚氨脂进行密封。血液在空心纤维内流过，透析液在纤维外面以相反方向流动。【优点】与早期透析器相比，空心纤维型透析器有三大优点：①预充量小；②表面积大，超滤率和清除率高；③结构坚固，易于操作，能耐受很高的跨膜压。", "explanation": "【要点依据】透析器按构型分为管型、平板型和空心纤维型，空心纤维型为目前临床使用类型。其结构为8000-12000根空心纤维，内径200-300um、壁厚2-30um，捆扎成束置于外壳内，以聚氨脂密封，血液在纤维内流动、透析液在纤维外反向流动。空心纤维型的优点为预充量小、表面积大且超滤率和清除率高、结构坚固易于操作并能耐受很高的跨膜压。"}, {"text": "简述超滤系数（Kuf）、筛选系数和清除率的概念，并说明按超滤系数对透析器的分类标准。", "options": [], "answer": "【超滤系数（Kuf）】在单位时间内，跨膜压每变化1mmHg时，透析器所能超滤出的液体量，反映了透析器的水清除效能，即衡量透析器“排水能力强弱”的关键指标；Kuf值越高，相同压力下脱水效率越高。超滤量＝Kuf×跨膜压×治疗时间。Kuf值与膜材料、膜厚度以及最重要的孔径大小密切相关；对水的通透性影响最大的因素是膜的孔径大小。【筛选系数】指半透膜两侧某种物质浓度的比值，反应了某种溶质通过半透膜的能力，数值从0-1：S=1完全通过，S=0完全不能通过，0＜S＜1部分通过；通常以菊粉、β2-微球蛋白、白蛋白、肌红蛋白等指标来评估透析器的筛选系数。【清除率】单位时间内，血液经透析器循环一次，能够将血中某一溶质全部清除的血浆或血清容积，反应透析器的溶质清除效能，清除率是评价透析器质量的关键指标。【按超滤系数的分类】低通量透析器：Kuf&lt;20ml/(h·mmHg)；高通量透析器（HFD）：Kuf≧20ml/(h·mmHg)；血液滤过器（HDF）：Kuf≧50ml/(h·mmHg)。超滤系数越大，在相同跨膜压下水的清除量越多。", "explanation": "【要点依据】三个参数分别评价水清除效能、溶质通过半透膜的能力和溶质清除效能。Kuf定义为单位时间内跨膜压每变化1mmHg时透析器能超滤出的液体量，超滤量＝Kuf×跨膜压×治疗时间；筛选系数为半透膜两侧某物质浓度比值，取值0-1；清除率为单位时间内血液经透析器循环一次能将某溶质全部清除的血浆或血清容积，是评价透析器质量的关键指标。按Kuf分类：低通量&lt;20ml/(h·mmHg)、高通量≧20ml/(h·mmHg)、血液滤过器≧50ml/(h·mmHg)。"}, {"text": "简述选择透析器时应考虑的主要因素，并说明血液透析、单纯超滤、血液滤过、血液透析滤过和连续性肾脏替代治疗（CRRT）对透析器的选择要求。", "options": [], "answer": "【主要因素】透析器的选择是决定血液透析方案的一个基本因素，选择透析器主要考虑五个方面：膜材料、超滤系数、清除率、生物相容性、膜面积。其中合成膜有较高的清除率和超滤系数、生物相容性好，目前临床多采用聚砜、聚醚砜等合成膜透析器；透析器的生物相容性越高越好，对于合成膜而言，选择合适剂量的γ射线消毒生物相容性比较高。【血液透析（HD）】主要通过弥散方式清除血液中的水及尿毒症毒素（肌酐、尿素、钾、磷等），清除小分子及水分，选低通量。【单纯超滤】通过对流转运机制等渗地从全血中除去水分，主要目的是清除体内多余水分，选择中、高通量透析器，并根据患者心脏功能、水肿程度等选择适宜的膜面积。【血液滤过】利用对流原理清除溶质和多余水分，需选择高通量透析器（滤过膜孔径较大），滤过器对生物相容性要求高，因而由合成膜制成。【血液透析滤过】兼顾弥散与对流，选用高通量、高生物相容性的滤器，并根据患者体表面积选择滤器膜面积。【CRRT】采用低阻力、高效能滤过器，其膜更大限度地接触外周循环血液，膜材料的生物相容性是最主要的决定因素，适合选择生物相容性高、通透性高的滤器。", "explanation": "【要点依据】选择透析器的五个因素为膜材料、超滤系数、清除率、生物相容性和膜面积。血液透析经弥散清除小分子毒素及水分故用低通量透析器、临床多用聚砜或聚醚砜膜；单纯超滤为清除多余水分选中、高通量透析器并按心脏功能与水肿程度选膜面积；血液滤过靠对流清除中、大分子，需高通量合成膜滤器；血液透析滤过用高通量、高生物相容性滤器并按体表面积选膜面积；CRRT以生物相容性为最主要决定因素，选生物相容性高、通透性高的滤器。"}, {"text": "简述透析膜材料的分类及其性能比较，以及透析器常用消毒方式的优缺点。", "options": [], "answer": "【膜材料分类】透析膜材料分为纤维素膜、改良纤维素膜和合成膜；合成膜包括聚砜、聚醚砜、聚丙烯腈、聚甲基丙烯酸甲酯、聚碳酸酯和聚酰胺膜等，目前临床使用的透析器以合成膜为主。【性能比较】纤维膜：原材料为纤维素，亲水性强，超滤系数低，清除率低，补体激活多，生物相容性差（表面有游离羟基团，可与血液成分反应）；改良纤维素膜：原材料为纤维素的衍生物，亲水性弱，超滤系数适中，清除率较高，补体激活较多，其改善生物相容性及性能的原因是在纤维素形成膜之前被乙酰化；合成膜：原材料为高分子聚合物，具有较强的疏水性，超滤系数高，清除率高，补体激活少，有较高的清除率和超滤系数、生物相容性好。【消毒方式优缺点】环氧乙烷：适合各种膜材料、消毒成本低，缺点是有残留，部分病人有超敏反应和首次使用综合征；γ射线：无消毒残留，缺点是材质变色、导致部分材料机械强度降低、成本相对较高；蒸汽热消毒：无消毒残留、无毒性、无过敏反应，缺点是只适合对高热稳定的材料、消毒成本高。", "explanation": "【要点依据】膜材料分为纤维素膜、改良纤维素膜与合成膜，三者在亲水性、超滤系数、清除率、补体激活方面依次改善，合成膜目前临床广泛应用。消毒方式比较：环氧乙烷适合各种膜材料、成本低但有残留并可引起超敏反应和首次使用综合征；γ射线无残留但材质变色、可降低部分材料机械强度、成本相对较高；蒸汽热消毒无残留、无毒性、无过敏反应，但只适合对高热稳定的材料且消毒成本高。"}, {"text": "简述血液透析过程中凝血的主要表现及常见原因。", "options": [], "answer": "【主要表现】①跨膜压（TMP）增高；②体外循环血液颜色发黑；③透析器中有阴影或黑色条纹；④动静脉壶中血凝块形成；⑤血液迅速充满压力保护罩；⑥透析器后静脉管路中的血液不能继续流动。【常见原因】①未使用抗凝剂进行透析治疗；②抗凝剂使用不规范或剂量不足；③血流量过低；④外周血血红蛋白过高；⑤超滤量过高；⑥透析治疗中输入脂肪乳、血液、血制品；⑦血管通路问题：血流量不足、再循环等；⑧各种原因引起的静脉壶气泡增多：预冲不充分、补液口进气等。", "explanation": "【要点依据】凝血的表现为TMP增高、体外循环血液颜色发黑、透析器中有阴影或黑色条纹、动静脉壶中血凝块形成、血液迅速充满压力保护罩、透析器后静脉管路中的血液不能继续流动。原因包括未使用抗凝剂、抗凝剂使用不规范或剂量不足、血流量过低、外周血血红蛋白过高、超滤量过高、透析治疗中输入脂肪乳或血液及血制品、血管通路问题（血流量不足、再循环等）、静脉壶气泡增多（预冲不充分、补液口进气等）。"}]}]}, {"num": 13, "title": "血液净化患者治疗慢性并发症之肾性贫血的治疗与处理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "1836年首次描述肾衰竭患者具有贫血面容的学者是（  ）", "options": ["A.Richard Bright", "B.Brown", "C.Roth", "D.Ludwig", "E.Foley"], "answer": "A", "explanation": "1836年Richard Bright（理查德·布莱特）首次描述了肾衰竭患者具有贫血面容。"}, {"text": "1922年首次提出慢性肾衰竭时贫血是由于骨髓产生红细胞减少的学者是（  ）", "options": ["A.Richard Bright", "B.Brown和Roth", "C.Ludwig", "D.Pisoni", "E.Locatelli"], "answer": "B", "explanation": "1922年Brown和Roth首次提出慢性肾衰竭时贫血是由于骨髓产生红细胞减少的原因；当红细胞比容低于15%-20%时即出现临床症状，常需要输血治疗。"}, {"text": "肾衰竭患者红细胞比容低于多少时即出现临床症状，常需要输血治疗（  ）", "options": ["A.10%-15%", "B.15%-20%", "C.20%-25%", "D.25%-30%", "E.30%-35%"], "answer": "B", "explanation": "当红细胞比容低于15%-20%时，即出现临床症状，常需要输血治疗。"}, {"text": "我国成人慢性肾脏病（CKD）的患病率是（  ）", "options": ["A.8.2%", "B.10.8%", "C.12.5%", "D.15.8%", "E.20.8%"], "answer": "B", "explanation": "我国成人CKD患病率高达10.8%，约有1.32亿成人CKD患者。"}, {"text": "我国成人慢性肾脏病（CKD）患者约有（  ）", "options": ["A.0.32亿", "B.1.32亿", "C.2.32亿", "D.3.32亿", "E.4.32亿"], "answer": "B", "explanation": "我国成人CKD患病率高达10.8%，约有1.32亿成人CKD患者。"}, {"text": "未接受透析的慢性肾脏病患者合并贫血的比例约为（  ）", "options": ["A.8.5%-12.0%", "B.18.5%-32.0%", "C.28.5%-72.0%", "D.58.5%-82.0%", "E.78.5%-92.0%"], "answer": "C", "explanation": "CKD患者贫血患病率随着CKD的进展逐渐升高，其中未接受透析患者约28.5%-72.0%合并贫血。"}, {"text": "接受透析的慢性肾脏病患者贫血患病率约为（  ）", "options": ["A.41.6%-48.2%", "B.61.6%-68.2%", "C.71.6%-78.2%", "D.81.6%-88.2%", "E.91.6%-98.2%"], "answer": "E", "explanation": "接受透析的CKD患者贫血患病率高达91.6%-98.2%。"}, {"text": "我国肾性贫血达标率2022年达到（  ）", "options": ["A.30.0%", "B.36.0%", "C.37.6%", "D.42.7%", "E.46.0%"], "answer": "E", "explanation": "我国肾性贫血达标率持续增加，2018年至2022年依次为37.6%、39.4%、40.0%、42.7%、46.0%，但较发达国家仍有差距。"}, {"text": "透析治疗中血红蛋白每降低10g/L，患者发生左心室肥大（LVH）的风险增高（  ）", "options": ["A.14%", "B.18%", "C.28%", "D.32%", "E.42%"], "answer": "E", "explanation": "透析治疗中Hb每降低10g/L，患者发生左心室肥大（LVH）的风险增高42%。"}, {"text": "透析治疗中血红蛋白每降低10g/L，患者发生充血性心力衰竭（CHF）的风险增高（  ）", "options": ["A.8%", "B.14%", "C.18%", "D.24%", "E.42%"], "answer": "C", "explanation": "透析治疗中Hb每降低10g/L，患者发生充血性心力衰竭（CHF）的风险增高18%。"}, {"text": "透析治疗中血红蛋白每降低10g/L，患者死亡的风险增高（  ）", "options": ["A.6%", "B.10%", "C.14%", "D.18%", "E.42%"], "answer": "C", "explanation": "透析治疗中Hb每降低10g/L，患者死亡的风险增高14%。"}, {"text": "贫血患者血红蛋白每降低1g/dl，住院风险增加（  ）", "options": ["A.3%", "B.6%", "C.9%", "D.12%", "E.18%"], "answer": "B", "explanation": "贫血患者Hb每降低1g/dl，住院风险增加6%。"}, {"text": "健康人红细胞的寿命约为（  ）", "options": ["A.30天", "B.60天", "C.90天", "D.120天", "E.180天"], "answer": "D", "explanation": "健康人红细胞寿命约120天；肾功能不全时，各类刺激会大幅加速红细胞凋亡、寿命缩短，是肾性贫血的重要诱因。"}, {"text": "成人促红细胞生成素（EPO）产生于肾脏的比例约为（  ）", "options": ["A.50%", "B.60%", "C.70%", "D.80%", "E.90%"], "answer": "E", "explanation": "成人EPO约90%由肾脏产生，10%由肝脏产生。"}, {"text": "目前已明确产生促红细胞生成素（EPO）的主要细胞是（  ）", "options": ["A.肾小管上皮细胞", "B.肾脏间质纤维细胞", "C.肝细胞", "D.骨髓基质细胞", "E.血管平滑肌细胞"], "answer": "B", "explanation": "目前已明确肾脏间质纤维细胞为产生EPO的主要细胞，占90%。"}, {"text": "胎儿时期促红细胞生成素（EPO）的产生部位及转至肾脏合成的时间是（  ）", "options": ["A.由肝脏产生，出生约30天后转至肾脏合成", "B.由肝脏产生，出生约130天后转至肾脏合成", "C.由肾脏产生，出生即由肾脏合成", "D.由脾脏产生，出生约130天后转至肾脏合成", "E.由肝脏产生，出生后终身由肝脏合成"], "answer": "B", "explanation": "胎儿是由肝脏产生EPO，出生约130天后转至肾脏合成。"}, {"text": "红细胞生成过程中，铁与珠蛋白用来合成血红蛋白的细胞阶段是（  ）", "options": ["A.红系祖细胞阶段", "B.网织红细胞阶段", "C.早、中、晚幼红细胞阶段", "D.成熟红细胞阶段", "E.多能干细胞阶段"], "answer": "C", "explanation": "铁+珠蛋白在早、中、晚幼红细胞阶段用来合成血红蛋白；EPO作用于BFU-E、CFU-E、原红细胞等红系祖细胞阶段，决定细胞存活与增殖。"}, {"text": "红细胞生成过程中，保障DNA正常复制、防止巨幼变所必需的物质是（  ）", "options": ["A.铁和珠蛋白", "B.维生素C、铜、锌", "C.促红细胞生成素", "D.叶酸和维生素B12", "E.白蛋白和转铁蛋白"], "answer": "D", "explanation": "叶酸和维生素B12在幼红细胞分裂阶段保障DNA正常复制，防止巨幼变。"}, {"text": "肾性贫血最主要的原因是（  ）", "options": ["A.造血物质缺乏", "B.红细胞寿命缩短", "C.透析相关溶血", "D.EPO生成不足或活性降低", "E.尿毒症毒素抑制红细胞生成"], "answer": "D", "explanation": "EPO生成不足或活性降低，导致EPO绝对或相对缺乏，是肾性贫血最主要的原因。"}, {"text": "慢性肾功能不全患者红细胞生存时间约为正常人的（  ）", "options": ["A.1/5", "B.1/4", "C.1/3", "D.1/2", "E.2/3"], "answer": "C", "explanation": "慢性肾功能不全时红细胞对渗透压、氧化损伤、机械刺激的抵抗力下降以及脾功能亢进等，使红细胞生存时间为正常人的1/3。"}, {"text": "严重甲状旁腺功能亢进时，全段甲状旁腺激素（PTH）超过多少可出现骨髓纤维化（  ）", "options": ["A.300pg/ml", "B.500pg/ml", "C.800pg/ml", "D.1000pg/ml", "E.1500pg/ml"], "answer": "D", "explanation": "严重的甲旁亢可直接抑制骨髓造血、下调EPO受体表达，PTH&gt;1000pg/ml时骨髓纤维化，导致红细胞生产减少，也可缩短红细胞寿命。"}, {"text": "铁调素主要由哪种细胞产生，其靶分子是什么（  ）", "options": ["A.肝细胞；膜铁转运蛋白", "B.肾小管上皮细胞；转铁蛋白", "C.巨噬细胞；铁蛋白", "D.骨髓基质细胞；EPO受体", "E.肠上皮细胞；二价金属转运蛋白"], "answer": "A", "explanation": "铁调素主要由肝细胞产生，靶分子为膜铁转运蛋白；铁调素使膜铁转运蛋白内化降解，铁被困于细胞内无法被利用。"}, {"text": "我国成人男性贫血的诊断标准是（  ）", "options": ["A.Hb&lt;100g/L", "B.Hb&lt;110g/L", "C.Hb&lt;120g/L", "D.Hb&lt;130g/L", "E.Hb&lt;140g/L"], "answer": "D", "explanation": "居住在海平面地区的成年人中，成人男性血红蛋白(Hb)＜130g/L诊断为贫血。"}, {"text": "我国成人女性（非妊娠）贫血的诊断标准是（  ）", "options": ["A.Hb&lt;100g/L", "B.Hb&lt;110g/L", "C.Hb&lt;120g/L", "D.Hb&lt;130g/L", "E.Hb&lt;140g/L"], "answer": "C", "explanation": "居住在海平面地区的成年人中，成人女性（非妊娠）血红蛋白(Hb)＜120g/L诊断为贫血。"}, {"text": "我国孕妇贫血的诊断标准是（  ）", "options": ["A.Hb&lt;90g/L", "B.Hb&lt;100g/L", "C.Hb&lt;110g/L", "D.Hb&lt;120g/L", "E.Hb&lt;130g/L"], "answer": "C", "explanation": "孕妇血红蛋白(Hb)＜110g/L即诊断为贫血。"}, {"text": "肾性贫血的临床血象表现多为（  ）", "options": ["A.大细胞、高色素、高增生性贫血", "B.正细胞、正色素、低增生性贫血", "C.小细胞、低色素、高增生性贫血", "D.正细胞、低色素、高增生性贫血", "E.小细胞、正色素、低增生性贫血"], "answer": "B", "explanation": "肾性贫血临床多表现为正细胞、正色素、低增生性贫血。"}, {"text": "一般人群中，估算肾小球滤过率低于多少时开始出现贫血（  ）", "options": ["A.&lt;90ml/min/1.73m²", "B.&lt;75ml/min/1.73m²", "C.&lt;60ml/min/1.73m²", "D.&lt;45ml/min/1.73m²", "E.&lt;30ml/min/1.73m²"], "answer": "C", "explanation": "一般人群中，GFR&lt;60ml/min/1.73m²（CKD3期）出现贫血；晚期CKD（4或5期）贫血发病率增加。"}, {"text": "CKD3期且无贫血的患者，检测血红蛋白的频率是（  ）", "options": ["A.至少每月1次", "B.至少每3个月1次", "C.至少每6个月1次", "D.至少每年1次", "E.至少每2年1次"], "answer": "D", "explanation": "CKD无贫血患者中，CKD3期至少每年检测1次Hb；CKD4-5期（非透析）至少每年检测2次Hb；CKD5期（透析）至少每3个月检测一次Hb。"}, {"text": "CKD3-5期合并贫血的非透析或腹膜透析患者，检测血红蛋白的频率是（  ）", "options": ["A.至少每1个月1次", "B.至少每3个月1次", "C.至少每6个月1次", "D.至少每年1次", "E.至少每年2次"], "answer": "B", "explanation": "CKD贫血患者中，CKD3-5期（非透析或腹透）至少每3个月检测一次Hb。"}, {"text": "CKD5期血液透析合并贫血的患者，检测血红蛋白的频率是（  ）", "options": ["A.至少每1个月1次", "B.至少每2个月1次", "C.至少每3个月1次", "D.至少每6个月1次", "E.至少每年1次"], "answer": "A", "explanation": "CKD贫血患者中，CKD5期血透患者至少每1个月检测一次Hb。"}, {"text": "肾性贫血治疗4个月后的靶目标是（  ）", "options": ["A.Hb≥90g/L，Hct&gt;25%", "B.Hb≥100g/L，Hct&gt;30%", "C.Hb≥110g/L，Hct&gt;33%", "D.Hb≥120g/L，Hct&gt;36%", "E.Hb≥130g/L，Hct&gt;40%"], "answer": "C", "explanation": "肾性贫血治疗的靶目标值为治疗4个月后Hb≥110g/L、Hct&gt;33%。"}, {"text": "肾性贫血维持治疗的指标范围是（  ）", "options": ["A.90g/L≤Hb≤110g/L", "B.100g/L≤Hb≤120g/L", "C.110g/L≤Hb≤130g/L", "D.120g/L≤Hb≤140g/L", "E.100g/L≤Hb≤130g/L"], "answer": "C", "explanation": "肾性贫血的维持标值为110g/L≤Hb≤130g/L（33%&lt;Hct&lt;40%），并个体化调整。"}, {"text": "既往有恶性肿瘤病史或存在活动性肿瘤的肾性贫血患者，血红蛋白靶目标为（  ）", "options": ["A.＜90g/L", "B.＜100g/L", "C.＜110g/L", "D.＜120g/L", "E.＜130g/L"], "answer": "B", "explanation": "既往恶性肿瘤病史或存在活动性肿瘤的患者Hb靶目标＜100g/L。"}, {"text": "第一代红细胞生成刺激剂（短效）皮下注射的半衰期是（  ）", "options": ["A.4.8小时", "B.6.8小时", "C.19.4小时", "D.25.3小时", "E.48.8小时"], "answer": "C", "explanation": "第一代ESAs（短效）皮下注射与静脉注射半衰期分别为19.4H、6.8H，临床常用的为rHuEPO-α、rHuEPO-β。"}, {"text": "第二代红细胞生成刺激剂（长效）的半衰期约是第一代（短效）的（  ）", "options": ["A.1/2", "B.相同", "C.1-2倍", "D.2-3倍", "E.5-10倍"], "answer": "D", "explanation": "第二代ESAs（长效）半衰期是上一代ESAs的2-3倍，皮下注射与静脉注射半衰期分别为48.8H、25.3H，临床常用达依泊定α。"}, {"text": "第三代红细胞生成刺激剂CERA的给药频率是（  ）", "options": ["A.每日1次", "B.每周1-3次", "C.每1-2周1次", "D.每2-4周1次", "E.每3个月1次"], "answer": "D", "explanation": "CERA（甲氧聚二醇重组人EPO）是一种化学合成的持续EPO受体激活剂，每2-4周给药一次。"}, {"text": "慢性肾脏病贫血患者使用红细胞生成刺激剂（ESAs）的时机之一是纠正绝对铁缺乏后血红蛋白（  ）", "options": ["A.＜130g/L", "B.＜120g/L", "C.＜110g/L", "D.＜100g/L", "E.＜90g/L"], "answer": "D", "explanation": "纠正绝对铁缺乏后，血红蛋白＜100g/L可启动ESAs治疗。"}, {"text": "非透析的肾性贫血患者，红细胞生成刺激剂（ESAs）推荐的给药途径是（  ）", "options": ["A.静脉注射", "B.皮下注射", "C.腹腔注射", "D.肌内注射", "E.口服"], "answer": "B", "explanation": "非透析患者推荐皮下注射ESAs；血液透析患者可以静脉给药（减少疼痛）也可皮下注射。"}, {"text": "腹膜透析的肾性贫血患者使用红细胞生成刺激剂（ESAs）时建议的给药途径是（  ）", "options": ["A.皮下注射", "B.静脉注射", "C.腹腔给药", "D.肌内注射", "E.口服"], "answer": "A", "explanation": "腹膜透析患者建议皮下注射ESAs；腹透患者不支持腹腔给药方式。"}, {"text": "红细胞生成刺激剂（ESAs）最常见的不良反应是（  ）", "options": ["A.癫痫", "B.血栓形成", "C.高血压", "D.肌痛", "E.过敏反应"], "answer": "C", "explanation": "高血压是ESAs最常见的不良反应，治疗前应将血压控制在正常或接近正常水平。"}, {"text": "ESAs治疗早期癫痫的发生率约为（  ）", "options": ["A.0.2%-1.7%", "B.1%-5%", "C.2%-17%", "D.20%-27%", "E.30%-37%"], "answer": "C", "explanation": "ESAs治疗早期癫痫发生率2%-17%，多伴有高血压及Hb快速上升。"}, {"text": "红细胞生成刺激剂初始治疗时，血红蛋白的增长速率应控制在每月（  ）", "options": ["A.0.5-1g/dl", "B.1-2g/dl", "C.2-3g/dl", "D.3-4g/dl", "E.4-5g/dl"], "answer": "B", "explanation": "初始治疗Hb增长速率应控制在每月1-2g/dl稳定提高，4个月达到Hb靶目标值。"}, {"text": "rHuEPO剂量调整时，若血红蛋白水平＞130g/L，正确的处理是（  ）", "options": ["A.增加25%", "B.维持原剂量", "C.减少25%-50%", "D.暂停用药，血红蛋白下降后减少25%", "E.无需调整"], "answer": "D", "explanation": "剂量调整原则中，血红蛋白＞130g/L时应暂停用药，血红蛋白下降后减少25%；＞115g/L时减少25%维持。"}, {"text": "评价铁状态最常用的两个指标是（  ）", "options": ["A.血清铁和总铁结合力", "B.血清铁蛋白和转铁蛋白饱和度", "C.叶酸和维生素B12", "D.血清白蛋白和C反应蛋白", "E.网织红细胞计数和红细胞比容"], "answer": "B", "explanation": "常规使用血清铁蛋白(SF)和转铁蛋白饱和度(TSAT)作为铁状态评价指标；有条件的单位可检测网织红细胞血红蛋白含量。"}, {"text": "血液透析的慢性肾脏病贫血患者，处于绝对铁缺乏时血清铁蛋白的水平是（  ）", "options": ["A.SF&lt;50μg/L", "B.SF&lt;100μg/L", "C.SF&lt;200μg/L", "D.SF&lt;300μg/L", "E.SF&lt;500μg/L"], "answer": "C", "explanation": "绝对铁缺乏指TSAT&lt;20%，非透析和腹膜透析患者SF&lt;100μg/L，血液透析患者SF&lt;200μg/L。"}, {"text": "罗沙司他用于体重45-60kg透析患者的起始剂量是（  ）", "options": ["A.40mg，每周三次", "B.50mg，每周三次", "C.70mg，每周三次", "D.100mg，每周三次", "E.150mg，每周三次"], "answer": "D", "explanation": "罗沙司他透析患者起始剂量为每次100mg(45-60kg)或120mg(≥60kg)，口服给药，每周三次(TIW)。"}, {"text": "罗沙司他的最大建议剂量是（  ）", "options": ["A.1.0mg/kg", "B.1.5mg/kg", "C.2.0mg/kg", "D.2.5mg/kg", "E.3.0mg/kg"], "answer": "D", "explanation": "罗沙司他建议根据患者当前Hb水平及过去4周内Hb的变化，每4周进行一次剂量调整，最大建议剂量为2.5mg/kg。"}, {"text": "培莫沙肽注射液的使用起始剂量是（  ）", "options": ["A.0.004mg/kg", "B.0.04mg/kg", "C.0.4mg/kg", "D.4mg/kg", "E.40mg/kg"], "answer": "B", "explanation": "培莫沙肽注射液的使用剂量为起始剂量0.04mg/kg，规格为1mL:4.0mg。"}, {"text": "CKD贫血患者口服补铁时，服用铁剂前2小时或后1小时吃饭会导致铁吸收（  ）", "options": ["A.增加一倍", "B.增加一半", "C.无明显变化", "D.减少一半", "E.减少四分之一"], "answer": "D", "explanation": "口服铁剂在空腹及不与其他药物同服时吸收最好；服用铁剂前2小时或后1小时吃饭，会导致铁吸收减少一半。"}, {"text": "培莫沙肽不因氨甲酰化而失去促红能力，其原因是分子结构中（  ）", "options": ["A.无游离赖氨酸残基", "B.无游离精氨酸残基", "C.无游离组氨酸残基", "D.无游离天冬氨酸残基", "E.无游离半胱氨酸残基"], "answer": "A", "explanation": "培莫沙肽分子结构中不存在游离赖氨酸残基，不会发生氨甲酰化，因此不因氨甲酰化而失去促红能力。"}]}, {"type": "multiple", "questions": [{"text": "关于肾性贫血的流行病学，下列正确的有（  ）", "options": ["Ａ.我国成人CKD患病率高达10.8%", "Ｂ.我国约有1.32亿成人CKD患者", "Ｃ.未接受透析的CKD患者贫血患病率约28.5%-72.0%", "Ｄ.接受透析的CKD患者贫血患病率高达91.6%-98.2%", "Ｅ.我国成人CKD患病率约为5.8%"], "answer": "ABCD", "explanation": "我国成人CKD患病率高达10.8%，约有1.32亿成人CKD患者；未接受透析的CKD患者约28.5%-72.0%合并贫血，接受透析的患者贫血患病率高达91.6%-98.2%。选项E所述5.8%与实际情况不符。"}, {"text": "贫血对人体的影响涉及多个器官系统，下列属于贫血表现的器官系统有（  ）", "options": ["Ａ.心血管系统：心动过速、乏力、左室肥厚", "Ｂ.中枢神经系统：情绪变化、认知功能变化", "Ｃ.呼吸系统：肺纤维化", "Ｄ.消化道：不规律的肠道运动", "Ｅ.免疫系统：免疫缺陷"], "answer": "ABDE", "explanation": "贫血对人体多个器官均有影响，涉及心血管系统（心动过速、乏力、左室肥厚）、中枢神经系统（情绪变化、认知功能变化）、消化道（不规律的肠道运动）、免疫系统（免疫缺陷）、肾脏（灌注减低、液体潴留）、肌肉骨骼系统（肌肉无力）、生殖系统（月经不调、性欲缺乏）。选项C所述肺纤维化不属于贫血的影响范围。"}, {"text": "红细胞生成的必备条件包括（  ）", "options": ["Ａ.EPO作用于BFU-E、CFU-E、原红细胞等红系祖细胞阶段", "Ｂ.铁与珠蛋白在早、中、晚幼红细胞阶段合成血红蛋白", "Ｃ.叶酸与维生素B12在幼红细胞分裂阶段保障DNA正常复制，防止巨幼变", "Ｄ.维生素C、铜、锌辅助铁吸收、血红素合成、稳定红细胞膜", "Ｅ.铝中毒可促进血红蛋白的合成"], "answer": "ABCD", "explanation": "红细胞的生成需要造血原料、EPO、微环境共同参与：EPO作用于红系祖细胞阶段，铁与珠蛋白在早中晚幼红细胞阶段合成血红蛋白，叶酸与维生素B12防止巨幼变，维生素C、铜、锌辅助铁吸收、血红素合成并稳定红细胞膜。选项E错误，铝中毒会干扰铁与血红蛋白结合、抑制合成血红蛋白时的某些酶作用。"}, {"text": "慢性肾脏病患者贫血的发病原因中，属于\"生成减少\"的有（  ）", "options": ["Ａ.EPO生成不足或活性降低", "Ｂ.造血物质缺乏或利用障碍", "Ｃ.肾脏对红细胞抑制因子的排泄减少", "Ｄ.透析管路与取血化验造成的血液丢失", "Ｅ.脾功能亢进导致红细胞破坏增加"], "answer": "ABC", "explanation": "贫血发病原因中\"生成减少\"包括：EPO生成不足或活性降低（最主要原因）、造血物质缺乏或利用障碍（铁及叶酸、维生素B12缺乏、炎症状态导致铁利用障碍、铝中毒等）、肾脏对红细胞抑制因子的排泄减少（精氨酸、胍氨酸、酚类及其衍生物等尿毒症毒素抑制红细胞生成）。选项D属于血液丢失、选项E属于红细胞寿命缩短与破坏增加，均归入\"丢失过多\"。"}, {"text": "慢性肾脏病患者贫血的发病原因中，属于\"丢失过多\"的有（  ）", "options": ["Ａ.透析失血、取血化验等血液丢失", "Ｂ.红细胞寿命缩短，生存时间为正常人的1/3", "Ｃ.透析液污染、低渗或过热透析液导致溶血", "Ｄ.血泵转动导致机械性红细胞损伤", "Ｅ.EPO生成不足或活性降低"], "answer": "ABCD", "explanation": "红细胞丢失增加的原因包括：血液丢失（透析失血、取血化验等）；红细胞寿命缩短（与氮质血症、红细胞对渗透压/氧化损伤/机械刺激的抵抗力下降以及脾功能亢进有关，RBC生存时间为正常人的1/3）；透析相关的溶血（透析液污染、低渗或过热透析液、血泵转动导致机械性红细胞损伤、高血流量通过狭窄导管、甲醛消毒剂产生抗N型红细胞抗体）。选项E属于\"生成减少\"。"}, {"text": "肾性贫血诊断时，用于评估是否存在加重肾性贫血因素的项目包括（  ）", "options": ["Ａ.继发性甲旁亢——IPTH", "Ｂ.左心室射血分数", "Ｃ.炎症状态——CRP", "Ｄ.营养情况——血清白蛋白、人体成分分析", "Ｅ.透析充分性——Kt/V、URR"], "answer": "ACDE", "explanation": "评估加重肾性贫血的因素包括：继发性甲旁亢查IPTH、炎症状态查CRP、营养情况查血清白蛋白及人体成分分析、透析充分性查Kt/V与URR。选项B所述左心室射血分数不属于加重肾性贫血的评估项目。"}, {"text": "关于慢性肾脏病患者血红蛋白的监测频率，下列正确的有（  ）", "options": ["Ａ.CKD3期无贫血患者至少每年检测1次Hb", "Ｂ.CKD4-5期非透析无贫血患者至少每年检测2次Hb", "Ｃ.CKD5期透析无贫血患者至少每3个月检测一次Hb", "Ｄ.CKD5期血透贫血患者至少每6个月检测一次Hb", "Ｅ.CKD3-5期贫血的非透析或腹透患者至少每3个月检测一次Hb"], "answer": "ABCE", "explanation": "CKD无贫血患者：CKD3期至少每年1次、CKD4-5期（非透析）至少每年2次、CKD5期（透析）至少每3个月1次；CKD贫血患者：CKD3-5期（非透析或腹透）至少每3个月1次、CKD5期血透至少每1个月1次。选项D错误，CKD5期血透贫血患者的检测频率是至少每1个月一次。"}, {"text": "关于肾性贫血的治疗目标，下列正确的有（  ）", "options": ["Ａ.治疗4个月后Hb≥110g/L、Hct&gt;33%", "Ｂ.维持标值为110g/L≤Hb≤130g/L", "Ｃ.伴有缺血性心脏病、充血性心力衰竭患者不推荐Hb&gt;120g/L", "Ｄ.合并慢性缺氧性肺疾病患者推荐较高的Hb水平", "Ｅ.既往恶性肿瘤病史患者Hb靶目标应大于130g/L"], "answer": "ABCD", "explanation": "肾性贫血治疗的靶目标值为治疗4个月后Hb≥110g/L、Hct&gt;33%，维持标值110g/L≤Hb≤130g/L并个体化调整；伴有缺血性心脏病、充血性心力衰竭患者不推荐Hb&gt;120g/L，合并慢性缺氧性肺疾病患者推荐较高的Hb水平。选项E错误，既往恶性肿瘤病史或存在活动性肿瘤的患者Hb靶目标＜100g/L。"}, {"text": "关于红细胞生成刺激剂（ESAs）的种类及特点，下列正确的有（  ）", "options": ["Ａ.第一代ESAs（短效）皮下注射半衰期19.4H、静脉注射6.8H", "Ｂ.第二代ESAs（长效）半衰期是上一代的2-3倍", "Ｃ.CERA属于第三代ESAs，皮下注射半衰期113H", "Ｄ.临床常用第一代ESAs为rHuEPO-α、rHuEPO-β", "Ｅ.达依泊定α属于第一代短效ESAs"], "answer": "ABCD", "explanation": "第一代ESAs（短效）皮下注射与静脉注射半衰期分别为19.4H、6.8H，临床常用rHuEPO-α、rHuEPO-β；第二代ESAs（长效）半衰期是上一代的2-3倍，临床常用达依泊定α；第三代ESAs为CERA（甲氧聚二醇重组人EPO），皮下注射与静脉注射半衰期分别为113H、130H。选项E错误，达依泊定α属于第二代长效ESAs。"}, {"text": "关于红细胞生成刺激剂（ESAs）的给药途径，下列正确的有（  ）", "options": ["Ａ.静脉给药和皮下给药同样有效", "Ｂ.皮下注射药代动力学优于静脉注射，可延长有效药物浓度维持时间", "Ｃ.非透析患者推荐皮下注射", "Ｄ.腹膜透析患者建议皮下注射", "Ｅ.血液透析患者必须采用静脉给药"], "answer": "ABCD", "explanation": "ESAs静脉给药和皮下给药同样有效；皮下注射药代动力学优于静脉注射，并可延长有效药物浓度在体内的维持时间、节省治疗费用；非透析患者推荐皮下注射，腹膜透析患者建议皮下注射，血液透析患者可以静脉给药（减少疼痛）也可皮下注射。选项E错误，血透患者并非必须静脉给药。"}, {"text": "关于红细胞生成刺激剂（ESAs）的不良反应，下列正确的有（  ）", "options": ["Ａ.高血压是最常见的不良反应", "Ｂ.癫痫在ESAs治疗早期发生率2%-17%", "Ｃ.EPO可使血液粘稠度增加、血流缓慢而形成血栓", "Ｄ.肌痛及输液样反应通常在使用后1-2h发生，可持续12h", "Ｅ.出现过敏反应、皮疹时应继续用药观察"], "answer": "ABCD", "explanation": "ESAs常见不良反应及处理包括：高血压（最常见，治疗前应将血压控制在正常或接近正常水平）；血栓形成（EPO可使血液粘稠度增加、血流缓慢而形成血栓）；癫痫（治疗早期发生率2%-17%，多伴有高血压及Hb快速上升）；肌痛及输液样反应（通常在使用后1-2h发生、可持续12h、2周后自行消失）。选项E错误，出现过敏反应、皮疹等需立即停药。"}, {"text": "关于抗EPO抗体介导的纯红细胞再生障碍性贫血（PRCA），下列正确的有（  ）", "options": ["Ａ.罕见但严重，血红蛋白可以每周5-10g/L的速度快速下降", "Ｂ.通常发生在ESAs使用6-8月后", "Ｃ.确诊条件为EPO抗体检测阳性加骨髓活检提示不存在或几乎不存在红系细胞", "Ｄ.治疗应立即停止ESAs，并且不能转换为另一种ESAs", "Ｅ.确诊后应立即转换使用另一种ESAs"], "answer": "ABCD", "explanation": "PRCA罕见但严重，血红蛋白可以每周5-10g/L的速度快速下降，至少使用3周后发生，通常发生在ESAs使用6-8月后；确诊条件为EPO抗体检测阳性加骨髓活检提示不存在或几乎不存在红系细胞；治疗上应立即停止ESAs且不能转换为另一种ESAs，可采用肾移植或免疫抑制剂治疗、丙球冲击，新药可选用培莫沙肽。选项E错误，不能转换为另一种ESAs。"}, {"text": "关于EPO抵抗，下列正确的有（  ）", "options": ["Ａ.皮下注射rHuEPO达到300IU/kg/W，治疗4个月后Hb仍不能达到或维持靶目标值", "Ｂ.静脉注射rHuEPO达到500IU/kg/W，治疗4个月后Hb仍不能达到或维持靶目标值", "Ｃ.铁缺乏是EPO抵抗产生的常见原因", "Ｄ.甲状旁腺功能亢进、铝中毒可导致EPO抵抗", "Ｅ.EPO抵抗患者应加大ESAs剂量且不设上限"], "answer": "ABCD", "explanation": "EPO抵抗指皮下注射rHuEPO达到300IU/kg/W（20000IU/W）或静脉注射rHuEPO达到500IU/kg/W（30000IU/W），治疗4个月后Hb仍不能达到或维持(11~13)g/dL靶目标值；产生原因中铁缺乏为常见原因，其他还包括炎症性疾病、慢性失血、甲状旁腺功能亢进、纤维性骨炎、铝中毒、血红蛋白病、多发性骨髓瘤、维生素缺乏、恶性肿瘤、营养不良、溶血、透析不充分、ACEI/ARB和免疫抑制剂等药物的使用、脾功能亢进及PRCA。选项E错误，高剂量ESAs（＞20000iu/周）反而增加心血管事件及死亡风险。"}, {"text": "关于铁状态的评价与监测，下列正确的有（  ）", "options": ["Ａ.常规使用血清铁蛋白和转铁蛋白饱和度作为铁状态评价指标", "Ｂ.转铁蛋白饱和度反映生成红细胞可获得的铁", "Ｃ.血清铁蛋白反映铁储备情况", "Ｄ.ESA治疗初期铁状态检查1次/月", "Ｅ.稳定ESA治疗的血液透析CKD患者铁状态检查至少1次/周"], "answer": "ABCD", "explanation": "常规使用血清铁蛋白(SF)和转铁蛋白饱和度(TSAT)作为铁状态评价指标；TSAT反映生成红细胞可获得的铁，SF反映铁储备情况；ESA治疗初期铁状态检查1次/月，稳定ESA治疗或非ESA治疗的血液透析CKD患者至少1次/3月。选项E错误，稳定期检查频率为至少1次/3月而非1次/周。"}, {"text": "关于肾性贫血铁剂治疗的指征，下列正确的有（  ）", "options": ["Ａ.绝对铁缺乏指TSAT&lt;20%", "Ｂ.非透析和腹膜透析患者绝对铁缺乏指SF&lt;100μg/L", "Ｃ.血液透析患者绝对铁缺乏指SF&lt;200μg/L", "Ｄ.SF在200~500μg/L间和（或）TSAT≤30%时，如血红蛋白有望升高可补铁", "Ｅ.SF&gt;500μg/L时应常规应用静脉补铁治疗"], "answer": "ABCD", "explanation": "铁剂治疗指征：绝对铁缺乏指TSAT&lt;20%，非透析和腹膜透析患者SF&lt;100μg/L、血液透析患者SF&lt;200μg/L；SF在200~500μg/L间和（或）TSAT≤30%时，如果血红蛋白有望升高、ESA用量有望降低，应给予补铁治疗。选项E错误，原则上SF&gt;500μg/L不常规应用静脉补铁治疗。"}, {"text": "关于口服补铁，下列正确的有（  ）", "options": ["Ａ.成人剂量150-200mg/d元素铁，每日2-3次", "Ｂ.空腹及不与其他药物同服时吸收最好", "Ｃ.服用铁剂前2小时或后1小时吃饭会导致铁吸收减少一半", "Ｄ.含铝的磷结合剂减少铁吸收", "Ｅ.维生素C可显著提高亚铁离子吸收"], "answer": "ABCD", "explanation": "口服补铁成人剂量为150-200mg/d元素铁，每日2-3次；口服铁剂在空腹及不与其他药物同服时吸收最好，服用铁剂前2小时或后1小时吃饭会导致铁吸收减少一半；含铝的磷结合剂减少铁吸收。选项E错误，维生素C不能提高亚铁离子吸收。"}, {"text": "关于静脉蔗糖铁的用法，下列正确的有（  ）", "options": ["Ａ.静脉滴注用0.9%生理盐水稀释，最多稀释20倍", "Ｂ.静脉注射不用稀释，推注速度1ml/min", "Ｃ.静脉注射最大剂量为10ml/次（含200mg铁）", "Ｄ.静脉滴注100mg需15min，200mg需30min", "Ｅ.静脉注射的推注速度宜为5ml/min"], "answer": "ABCD", "explanation": "静脉蔗糖铁静脉滴注时用0.9%生理盐水稀释，最多稀释20倍，滴注100mg需15min、200mg需30min、300mg需1.5h、400mg需2.5h、500mg需3.5h；静脉注射不用稀释，推注速度1ml/min（5ml至少注射5min），最大剂量10ml/次（含200mg铁）。选项E错误，推注速度为1ml/min而非5ml/min。"}, {"text": "关于罗沙司他的用法用量，下列正确的有（  ）", "options": ["Ａ.透析患者起始剂量为每次100mg(45-60kg)或120mg(≥60kg)，每周三次", "Ｂ.非透析患者起始剂量为每次70mg(40-60kg)或100mg(≥60kg)，每周三次", "Ｃ.应按Hb水平调整剂量，使Hb达到并维持在100-120g/L", "Ｄ.最大建议剂量为2.5mg/kg", "Ｅ.起始治疗阶段应每3个月监测1次血红蛋白"], "answer": "ABCD", "explanation": "罗沙司他透析患者起始剂量为每次100mg(45-60kg)或120mg(≥60kg)、非透析患者为每次70mg(40-60kg)或100mg(≥60kg)，口服给药每周三次(TIW)；应按Hb水平调整剂量使Hb达到并维持在100-120g/L并最大限度降低对输血的需求；最大建议剂量为2.5mg/kg。选项E错误，起始治疗阶段建议每2周监测1次Hb直至稳定，随后每4周监测1次。"}, {"text": "关于培莫沙肽的特点，下列正确的有（  ）", "options": ["Ａ.是人工合成的聚乙二醇化促红细胞生成素模拟肽", "Ｂ.与EPO无序列同源性，可避免引起PRCA", "Ｃ.分子结构中不存在游离赖氨酸残基，不会发生氨甲酰化", "Ｄ.可促进骨髓红系定向祖细胞BFU-E、CFU-E增殖并促进骨髓释放网织红细胞", "Ｅ.其起始剂量为0.4mg/kg"], "answer": "ABCD", "explanation": "培莫沙肽是人工合成的聚乙二醇化促红细胞生成素模拟肽，是多肽类促红细胞生成素受体激动剂；与EPO无序列同源性，与内源性EPO无免疫交叉反应，可避免引起PRCA并可改善PRCA；分子结构中不存在游离赖氨酸残基，不会发生氨甲酰化；可通过与细胞表面特异性EPO受体结合，促进骨髓红系定向祖细胞（BFU-E、CFU-E）增殖并向形态可识别的前体细胞分化，促进骨髓释放网织红细胞。选项E错误，其起始剂量为0.04mg/kg。"}, {"text": "关于慢性肾脏病贫血发生机制的潜在因素，下列正确的有（  ）", "options": ["Ａ.EPO相对性不足", "Ｂ.铁稳态失衡及铁调素过高", "Ｃ.慢性炎症", "Ｄ.HIF介导的肾脏氧感受功能受损", "Ｅ.肾小球滤过率显著升高"], "answer": "ABCD", "explanation": "CKD贫血发生机制复杂，单纯补充EPO和铁剂不能完全纠正贫血，其潜在机制包括EPO相对性不足、铁稳态失衡及铁调素过高、慢性炎症、HIF介导的肾脏氧感受功能受损，以及溶血、失血、透析、ACEI、甲旁亢等其他因素。选项E错误，CKD患者GFR下降而非显著升高。"}]}, {"type": "short", "questions": [{"text": "简述肾性贫血的定义及其临床血象特点。", "options": [], "answer": "肾性贫血是指各种肾脏疾病造成肾功能减退，肾脏分泌红细胞生成素绝对或相对不足；体内蓄积尿毒症毒素抑制骨髓红系造血、破坏红细胞，缩短红细胞存活时间，由此产生的贫血。其临床多表现为正细胞、正色素、低增生性贫血；营养不良、慢性失血、炎症、重度甲旁亢会进一步加重贫血程度。", "explanation": "肾性贫血的关键机制在于EPO的绝对或相对缺乏，肾小管周围毛细血管内皮细胞与肾脏间质纤维细胞受损导致EPO分泌减少；尿毒症毒素同时抑制红系造血并缩短红细胞寿命，故临床血象呈正细胞、正色素、低增生性贫血。"}, {"text": "简述慢性肾脏病患者发生贫血的原因，从红细胞生成减少与丢失增加两方面说明。", "options": [], "answer": "（1）生成减少：①EPO生成不足或活性降低，肾脏产生EPO减少或患者对EPO反应降低，EPO绝对或相对缺乏，是肾性贫血最主要的原因；②造血物质缺乏或利用障碍，如铁及叶酸、维生素B12缺乏、炎症状态导致铁利用障碍，铝中毒干扰铁与血红蛋白结合并抑制合成血红蛋白时的某些酶作用；③肾脏对红细胞抑制因子的排泄减少，精氨酸、胍氨酸、酚类及其衍生物等尿毒症毒素通过直接或间接抑制EPO和细胞因子的作用抑制红细胞生成。（2）丢失增加：①血液丢失，包括透析失血、取血化验等；②红细胞寿命缩短，与氮质血症、红细胞本身对渗透压/氧化损伤/机械刺激的抵抗力下降以及脾功能亢进有关，红细胞生存时间为正常人的1/3；③透析相关的溶血，如透析液污染、低渗或过热透析液、血泵转动导致机械性红细胞损伤、高血流量通过狭窄导管、甲醛消毒剂产生抗N型红细胞抗体。", "explanation": "除上述原因外，严重的甲旁亢可直接抑制骨髓造血、下调EPO受体表达，PTH&gt;1000pg/ml时骨髓纤维化，还可缩短红细胞寿命，进一步加重贫血。"}, {"text": "简述肾性贫血的诊断评估要点。", "options": [], "answer": "（1）明确贫血是否存在：居住在海平面地区的成年人，成人女性（非妊娠）Hb&lt;120g/L、孕妇Hb&lt;110g/L，成人男性Hb&lt;130g/L即可诊断。（2）明确是否存在肾性贫血之外的贫血：①营养不良性贫血，行全血细胞计数（红细胞数、Hb、MCH、MCV、MCHC、网织红细胞计数）及铁储备和铁利用指标（血清铁蛋白、总铁结合力、转铁蛋白饱和度）、叶酸与维生素B12测定等；②溶血性贫血，查血清总胆红素、直接胆红素、间接胆红素、外周红细胞形态，对可疑患者完善Coombs试验、冷凝集素试验、骨穿等；③出血性疾病，关注有无消化道、阴道、泌尿系等出血，行大便隐血试验、胃肠镜等检查；④血液系统疾病，如地中海贫血、再生障碍性贫血。（3）评估是否存在加重肾性贫血的因素：继发性甲旁亢查IPTH，炎症状态查CRP，营养情况查血清白蛋白及人体成分分析，透析充分性查Kt/V、URR。", "explanation": "肾性贫血多表现为正细胞、正色素、低增生性贫血，评估时需结合血红蛋白水平、血象特点与加重因素综合判断，并排除其他类型贫血。"}, {"text": "简述红细胞生成刺激剂（ESAs）的不良反应及其处理。", "options": [], "answer": "（1）高血压：最常见，治疗前应将血压控制在正常或接近正常水平；对于难治性高血压患者，可将血压控制在160/100mmHg以后以最小剂量使用，控制血红蛋白上升速度不超过每两周10g/L。（2）血栓形成：ESAs可使血液粘稠度增加、血流缓慢而形成血栓，用药期间应注意防止发生血管凝血及心脑血管梗塞。（3）癫痫：多发生在ESAs治疗早期，发生率2%-17%，多伴有高血压及Hb快速上升。（4）肌痛及输液样反应：通常在使用后1-2h发生，可持续12h，2周后自行消失，症状重者可予以非甾体类抗炎药治疗。（5）其他：过敏反应、皮疹等，需立即停药。此外还可发生抗EPO抗体介导的纯红细胞再生障碍性贫血（PRCA）。", "explanation": "ESAs使用中还应注意：合并脑卒中患者慎用；恶性肿瘤患者最小剂量使用且血红蛋白不超过100g/L；高剂量ESAs（＞20000iu/周）增加心血管事件及死亡风险；Hb≥90g/L的心力衰竭患者不建议使用ESAs。PRCA罕见但严重，确诊后应立即停用ESAs且不能转换为另一种ESAs。"}, {"text": "简述肾性贫血铁剂的使用规则，以及静脉蔗糖铁的用法。", "options": [], "answer": "（1）使用规则：①非透析患者及腹膜透析患者可先试用口服途径补铁，或根据铁缺乏状态直接应用静脉铁剂治疗；②血液透析患者起始应优先选择静脉途径补铁；③口服补铁剂量为150-200mg/d，1~3个月后再次评价铁状态，如果SF或TSAT、血红蛋白没有达到目标值（每周ESA 100-150IU/kg治疗下），或口服铁剂不能耐受者，推荐改用静脉途径补铁；④静脉途径铁剂维持性治疗给予的剂量和时间间隔应根据患者对铁剂的反应、铁状态、血红蛋白水平、ESA用量、ESA反应及近期并发症等情况调整。（2）静脉蔗糖铁用法：静脉滴注时用0.9%生理盐水稀释，最多稀释20倍，滴注100mg需15min、200mg需30min、300mg需1.5h、400mg需2.5h、500mg需3.5h；静脉注射时不用稀释，推注速度1ml/min（5ml至少注射5min），最大剂量10ml/次（含200mg铁）；也可直接注射到透析器的静脉端。", "explanation": "补充静脉铁剂需要做过敏试验，尤其是右旋糖酐铁；血透患者比非血透患者需要更大的铁补充量，静脉补铁（蔗糖铁、葡萄糖醛酸铁、右旋糖酐铁）是最佳补铁途径。铁剂的使用应基于对近期ESA治疗的反应、铁参数状态、血红蛋白水平、ESA剂量及病人临床状态，铁蛋白&gt;500ng/dL时不推荐静脉铁治疗。"}]}]}, {"num": 14, "title": "血液净化中心透析机报警的临床意义和处理理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析治疗过程中出现报警，其根本意义是（ ）", "options": ["A.说明治疗必须立即终止", "B.是保证治疗绝对安全所必须的", "C.提示机器已彻底损坏", "D.说明操作者技术不合格", "E.提示透析器必须全部更换"], "answer": "B", "explanation": "透析治疗过程中，参数设置、操作失误、机器故障等原因都会引起报警，报警是保证治疗的绝对安全所必须的，并不等于必须终止治疗或机器彻底损坏。"}, {"text": "透析机报警按性质可分为哪两大类（ ）", "options": ["A.提示性报警和机器故障报警", "B.声音报警和灯光报警", "C.黄色报警和红色报警", "D.电路报警和水路报警", "E.设备报警和患者报警"], "answer": "A", "explanation": "透析机报警可以分成提示性报警和机器故障报警两大类，同时会通过各种不同的现象和表现形式反映出来。"}, {"text": "对透析治疗安全产生影响的报警，其灯光颜色为（ ）", "options": ["A.黄色", "B.绿色", "C.蓝色", "D.红色", "E.白色"], "answer": "D", "explanation": "对透析治疗安全产生影响的报警为红色，必须有操作人员处理。"}, {"text": "血透机操作报警对应的灯光颜色是（ ）", "options": ["A.红灯", "B.绿灯", "C.黄灯", "D.蓝灯", "E.白灯"], "answer": "C", "explanation": "血透机操作报警为黄灯，透析参数报警为红灯，机器故障报警为红灯（扳手、红手等）。"}, {"text": "血透机的报警器声压要求不得小于（ ）", "options": ["A.45dB", "B.55dB", "C.65dB", "D.75dB", "E.85dB"], "answer": "C", "explanation": "血透机的报警器声压不得小于65dB，以保证操作人员在治疗区能及时听到报警。"}, {"text": "发生报警后的正确处理流程是（ ）", "options": ["A.按复位键—查找原因—按消音键—正确处理—继续透析", "B.按消音键—查找原因—正确处理—按复位键—继续透析治疗", "C.查找原因—按复位键—按消音键—继续透析治疗", "D.按消音键—按复位键—查找原因—继续透析治疗", "E.立即回血下机—查找原因—重新上机"], "answer": "B", "explanation": "发生报警的处理流程为：按消音键—查找原因—正确处理—按复位键—继续透析治疗。"}, {"text": "关于报警处理原则，下列做法正确的是（ ）", "options": ["A.报警可长期废除以免影响治疗", "B.报警参数可根据方便随意改变", "C.报警装置应按要求定期校准精度", "D.报警时先继续透析再查原因", "E.报警参数由患者自行设定"], "answer": "C", "explanation": "透析机报警处理的原则包括：报警装置应按要求定期校准精度，发现问题及时处理；不得废除报警装置或随意改变报警参数。"}, {"text": "原因不明或报警原因未解决时，正确的处理是（ ）", "options": ["A.可先进入透析治疗状态继续观察", "B.不得进入透析治疗状态", "C.降低血流量后继续治疗", "D.更换透析器后继续治疗", "E.由患者家属决定是否继续"], "answer": "B", "explanation": "原因不明或报警原因未解决的，不得进入透析治疗状态；透析治疗中如果透析机故障，原则上下机回血，由工程师维修。"}, {"text": "透析治疗中如果透析机发生故障，原则上应（ ）", "options": ["A.继续透析并观察", "B.上机回血后工程师维修", "C.下机回血后工程师维修", "D.仅更换透析器即可", "E.由护士自行拆机修理"], "answer": "C", "explanation": "透析治疗中如果透析机故障，原则上下机回血，由工程师维修。"}, {"text": "提示性报警的特点是（ ）", "options": ["A.由机器自身故障引发", "B.往往由外界相关因素引发，正确处理后警报即可消失", "C.必须返厂维修才能消除", "D.只见于机器自检阶段", "E.提示患者生命受到即时威胁"], "answer": "B", "explanation": "提示性报警往往由外界相关因素引发，正确处理后警报即可消失，分为警告性、警示性和建议性报警。"}, {"text": "提示性报警包括的三种类型是（ ）", "options": ["A.警告性、警示性、建议性报警", "B.声音性、灯光性、文字性报警", "C.水路性、电路性、血路性报警", "D.高温性、低温性、流量性报警", "E.设备性、操作者性、患者性报警"], "answer": "A", "explanation": "提示性报警分为警告性报警、警示性报警和建议性报警三种类型。"}, {"text": "血液透析机按其结构可划分为（ ）", "options": ["A.水路系统、电路系统、血路系统", "B.进水层、配液层、超滤层", "C.供液、血泵、超滤三部分", "D.管路、透析器、传感器三部分", "E.高、中、低三层"], "answer": "A", "explanation": "血液透析机按其结构可划分为水路系统、电路系统和血路系统三大部分。"}, {"text": "血液透析机按其功能可划分为（ ）", "options": ["A.水路、电路、血路三部分", "B.透析液供给系统、血循环控制系统、超滤控制系统", "C.进水层、配液层、超滤层", "D.压力监测、温度监测、电导监测", "E.血泵、肝素泵、空气探测器"], "answer": "B", "explanation": "血液透析机按其功能可划分为透析液供给系统、血循环控制系统和超滤控制系统三大部分，辅助功能包括血压、血容量监测、Kt/V在线监测等。"}, {"text": "透析液供给系统中，透析液流量一般为（ ）", "options": ["A.200 ml/min", "B.300 ml/min", "C.500 ml/min", "D.800 ml/min", "E.1000 ml/min"], "answer": "C", "explanation": "透析液配比完成后，透析液流量一般为500 ml/min，是血液透析治疗中的一个重要参数。"}, {"text": "透析液温度正常应设置在（ ）", "options": ["A.30~31℃", "B.32~33℃", "C.34~35℃", "D.36~37℃", "E.38~39℃"], "answer": "D", "explanation": "透析液供给系统对透析液温度的监控要求，透析液温度正常设置在36~37℃。"}, {"text": "透析液pH值的正常范围是（ ）", "options": ["A.4.0-6.0", "B.5.0-7.0", "C.6.0-8.0", "D.7.0-9.0", "E.8.0-10.0"], "answer": "C", "explanation": "透析液pH值受透析液成分及浓度的影响，正常范围是6.0-8.0。"}, {"text": "透析液供给系统中用于防止不合格透析液进入透析器的部件是（ ）", "options": ["A.内毒素过滤器", "B.旁路阀（安全阀）", "C.除气室", "D.热交换器", "E.比例泵"], "answer": "B", "explanation": "透析液供给系统设有旁路阀（安全阀），与电导度测量装置配合，用来防止错误的透析液成份通过透析器。"}, {"text": "几乎所有型号透析机为透析液加温采用的部件是（ ）", "options": ["A.加热器", "B.除气室", "C.热交换器", "D.比例泵", "E.内毒素过滤器"], "answer": "A", "explanation": "几乎所有型号的机器都是用加热器来为透析液加温的，用温度传感器控制使之保持恒温。"}, {"text": "透析液温度设置一般可在什么范围之间调整（ ）", "options": ["A.30℃-33℃", "B.32℃-35℃", "C.34℃-39℃", "D.38℃-42℃", "E.40℃-45℃"], "answer": "C", "explanation": "透析液温度设置一般为34℃-39℃之间可调整。"}, {"text": "当显示温度与透析液温度相差大于多少摄氏度时应进行校准（ ）", "options": ["A.正负0.5摄氏度", "B.正负1摄氏度", "C.正负2摄氏度", "D.正负5摄氏度", "E.正负10摄氏度"], "answer": "D", "explanation": "当显示温度与透析液温度相差大于正负5摄氏度时，就应进行校准。"}, {"text": "病人主诉冷热感受程度与机器温度设置不符时，排查线索是（ ）", "options": ["A.进水温度", "B.供水不足、流量不稳", "C.传感器灵敏度", "D.加热控制电路", "E.供电电压偏低"], "answer": "C", "explanation": "病人主诉冷热感受程度与机器温度设置不符时，排查线索为传感器灵敏度；多台机器同时出现高低温警报时排查线索为进水温度。"}, {"text": "透析治疗时透析液电导率常用监测范围是（ ）", "options": ["A.8.8-10.7ms/cm", "B.10.8-12.7ms/cm", "C.12.8-15.7ms/cm", "D.16.8-18.7ms/cm", "E.6.0-8.0ms/cm"], "answer": "C", "explanation": "透析治疗时透析液电导率常用监测范围12.8-15.7ms/cm（贝朗机是14.3ms/cm），超出此范围发生绝对报警。"}, {"text": "B液电导率监测范围是（ ）", "options": ["A.0.5-1.5ms/cm", "B.1-2ms/cm", "C.2-4ms/cm", "D.4-6ms/cm", "E.6-8ms/cm"], "answer": "C", "explanation": "B液电导率监测范围2-4ms/cm（贝朗机是2.8ms/cm），超出此范围发生绝对报警。"}, {"text": "电导度实际上是测量什么的一个参数（ ）", "options": ["A.导体的导电能力", "B.液体的透光强度", "C.液体的温度", "D.液体的流速", "E.液体的压力"], "answer": "A", "explanation": "电导度实际上是测量导体导电能力的一个参数，应用在血液透析机上时透析液就是导体，通过电导度传感器间接测量透析液的离子浓度。"}, {"text": "电导度间歇式警报的排查线索是（ ）", "options": ["A.反渗水供水压力不足", "B.报警窗口设置错误", "C.A、B液管接口处漏气、O型圈磨损、机器轻微堵塞", "D.浓缩液泵注入设定错误", "E.传感器灵敏度漂移"], "answer": "C", "explanation": "电导度间歇式警报的排查线索为A、B液管接口处漏气，O型圈磨损，机器轻微堵塞。"}, {"text": "多台机器同时出现电导警报并伴随水或流量警报时，应首先检查（ ）", "options": ["A.浓缩液是否用完", "B.反渗水供水压力", "C.温度传感器", "D.漏血探测器", "E.肝素泵"], "answer": "B", "explanation": "多台机器同时电导警报伴随水或流量警报时，应检查反渗水供水压力。"}, {"text": "供水不足报警的原因不包括（ ）", "options": ["A.反渗水供应异常", "B.滤网已经堵塞", "C.机器出现异常", "D.静脉压过高", "E.进水电磁阀故障"], "answer": "D", "explanation": "供水不足报警的原因为反渗水供应异常、滤网已经堵塞、机器出现异常；静脉压过高属于血路监测系统报警的相关因素。"}, {"text": "供水不足报警处理中，水压过低时应采取的措施是（ ）", "options": ["A.更换细菌滤器", "B.清洗过滤网", "C.调整报警范围", "D.校正电导度传感器", "E.更换透析器"], "answer": "B", "explanation": "供水不足报警处理包括检查供水或反渗机是否正常、检查供水和排水水管是否有打结扭曲受压、水压过低时清洗过滤网，否则检查机器进水电磁阀、流量开关、除气泵等。"}, {"text": "细菌滤器报警的原因不包括（ ）", "options": ["A.使用时间到期", "B.滤器破膜", "C.滤器堵塞", "D.超滤率过大", "E.滤器压力检测不通过"], "answer": "D", "explanation": "细菌滤器报警的原因为使用时间到期、滤器破膜和滤器堵塞；超滤率过大是漏血报警的常见诱因，与细菌滤器报警无关。"}, {"text": "血泵的工作是提供一个体外循环的动力，其实现方式是（ ）", "options": ["A.泵头转动带动滚轮挤压泵管", "B.负压吸引血液", "C.蠕动膜片抽吸血液", "D.重力引流血液", "E.离心泵叶轮推动血液"], "answer": "A", "explanation": "所有型号的血透机几乎都是通过泵头的转动带动滚轮挤压泵管，推动动脉血流向透析器，实现体外循环。"}, {"text": "漏血报警监测一般漏血达到多少时机器发出声光报警并关断血泵（ ）", "options": ["A.大于0.05ml/min", "B.大于0.1ml/min", "C.大于0.2ml/min", "D.大于0.5ml/min", "E.大于1.0ml/min"], "answer": "D", "explanation": "一般漏血大于0.5ml/min时，机器将发出声光报警，同时关闭血泵；漏血监测是利用测量透析液管路里的透光强度来实现的。"}, {"text": "漏血检测的实现原理是（ ）", "options": ["A.测量透析液管路里的透光强度", "B.测量超声波的传播时间", "C.测量透析液的电导率", "D.测量静脉压力变化", "E.测量透析液的温度变化"], "answer": "A", "explanation": "漏血检测是利用测量透析液管路里的透光强度来实现的，光束穿过透析废液照射到光敏管上，废液里混有血液则透光减弱，光电效应改变后引发报警。"}, {"text": "漏血监测采用红绿双光源的目的是（ ）", "options": ["A.提高透析液加热效率", "B.抗干扰", "C.降低报警音量", "D.增加超滤量", "E.延长探测器寿命"], "answer": "B", "explanation": "漏血监测采用红绿双光源抗干扰措施，以保证漏血报警的准确性。"}, {"text": "造成漏血报警的因素不包括（ ）", "options": ["A.透析器破膜", "B.漏血传感器进入空气", "C.漏血报警传感器污染", "D.漏血传感器工作点漂移", "E.静脉壶液面过低"], "answer": "E", "explanation": "造成漏血报警的因素包括透析器破膜、漏血传感器进入空气、漏血报警传感器污染、漏血传感器工作点漂移；静脉壶液面过低是空气报警的相关条件。"}, {"text": "透析器破膜的紧急处理中，发现后应立即（ ）", "options": ["A.夹闭透析管路的动脉端和静脉端，丢弃体外循环中血液", "B.降低血流量后继续透析", "C.仅更换透析器不更换管路", "D.加大超滤量冲洗滤器", "E.调整跨膜压报警范围"], "answer": "A", "explanation": "透析器破膜的紧急处理为：一旦发现应立即夹闭透析管路的动脉端和静脉端，丢弃体外循环中血液，更换新的透析器和透析管路进行透析，并严密监测患者生命体征。"}, {"text": "漏血后要重新开始新的透析治疗，正确的消毒要求是（ ）", "options": ["A.直接冲洗后即可使用", "B.尽量选用化学消毒，然后再柠檬酸脱钙", "C.仅用生理盐水冲洗即可", "D.仅柠檬酸脱钙即可", "E.热水冲洗即可"], "answer": "B", "explanation": "漏血后一定要充分消毒后才重新开始新的透析治疗，尽量选用化学消毒，然后再柠檬酸脱钙。"}, {"text": "空气监测是建立在什么原理基础上的防护系统（ ）", "options": ["A.超声波传递原理", "B.光电透射原理", "C.电导率变化原理", "D.压力变化原理", "E.温度变化原理"], "answer": "A", "explanation": "空气监测是建立在超声波传递原理基础上的防止空气进入血液的防护系统，超声波在液体和固体内传播速度比在气体内快，因此在静脉血液管路两侧分别装超声波发射器和接收器捕捉气泡。"}, {"text": "静脉管路出现超过多少气泡时空气监测应发出报警（ ）", "options": ["A.0.01ml", "B.0.05ml", "C.0.1ml", "D.0.5ml", "E.1.0ml"], "answer": "B", "explanation": "当静脉管路出现超过0.05ml气泡时，应发出报警；当静脉壶液面低于检测器下端时，也应发出报警。"}, {"text": "影响空气监测的因素不包括（ ）", "options": ["A.血路管安装位置不妥或变形", "B.管路与空气探测器不匹配", "C.传感器污染", "D.透析器内部除气不足", "E.透析液电导度过低"], "answer": "E", "explanation": "影响空气监测的因素包括血路管安装位置不妥或变形、管路与空气探测器不匹配、传感器污染、透析器内部除气不足、血流提速过快或高血流速使动脉压过低、动脉穿刺针的位置欠佳、传感器故障。"}, {"text": "空气报警处理中，如少量空气可采取的措施是（ ）", "options": ["A.减慢血流速并用手将空气弹回静脉壶，用空针抽出", "B.立即停止治疗并更换机器", "C.加大血流量冲出气泡", "D.关闭血泵后继续治疗", "E.调整空气传感器报警范围"], "answer": "A", "explanation": "如果少量空气可减慢血流速并用手将空气弹回静脉壶，用空针抽出即可；如果检查空气是从透析液区进入，应该停止治疗，对机器进行维修。"}, {"text": "静脉压高报警的原因不包括（ ）", "options": ["A.静脉回路管路受阻", "B.患者体位变化，静脉受压", "C.静脉壶滤网凝血阻塞", "D.患者静脉狭窄、血栓形成", "E.血泵间隙过小"], "answer": "E", "explanation": "静脉压高报警的原因为静脉回路管路受阻、患者体位变化致静脉受压、静脉壶滤网凝血阻塞、患者静脉狭窄或血栓形成、报警设定；血泵间隙异常影响血泵工作，不是静脉压高报警的原因。"}, {"text": "静脉压低报警的原因不包括（ ）", "options": ["A.血流量不足", "B.静脉压测压口阻塞", "C.血液回路管路连接脱落或静脉针脱落", "D.血路管动脉端折", "E.患者体位变化致静脉受压"], "answer": "E", "explanation": "静脉压低报警原因为血流量不足、静脉压测压口阻塞、血液回路及透析器凝血阻塞、血液回路管路连接脱落或静脉针脱落、血路管动脉端折、报警设定；体位变化致静脉受压属于静脉压高报警的原因。"}, {"text": "动脉压低报警处理中，应首先考虑测量的指标是（ ）", "options": ["A.患者血压", "B.患者体温", "C.透析液电导度", "D.跨膜压", "E.机器进水温度"], "answer": "A", "explanation": "动脉压低报警处理包括患者血压下降时测量血压、体位改变时检查血液管路是否有打结扭曲受压、检查动脉夹子是否打开、调整血流量及报警范围。"}, {"text": "跨膜压是指（ ）", "options": ["A.透析液进出的压力差", "B.透析器半透膜血液侧和透析液侧的压力差", "C.动静脉压力的差值", "D.静脉壶内外的压力差", "E.透析液泵出口的压力"], "answer": "B", "explanation": "跨膜压是指透析器半透膜血液侧和透析液侧的压力差，是用压力传感器测量静脉压力和透析压力的方法经过计算而来。"}, {"text": "跨膜压的计算公式为（ ）", "options": ["A.TMP=（Bi+Bo）/2-（Di+Do）/2", "B.TMP=（Bi+Di）/2-（Bo+Do）/2", "C.TMP=Bo-Di", "D.TMP=Bi-Do", "E.TMP=静脉压-动脉压"], "answer": "A", "explanation": "跨膜压TMP=（Bi+Bo）/2-（Di+Do）/2；在实际应用当中近似地认为TMP=Bo-Do+补偿值，其中Bo为透析器血液出口处压力，Do为透析液出口处压力。"}, {"text": "TMP高报警的原因不包括（ ）", "options": ["A.除水速度大", "B.透析器膜面积及超滤系数较小", "C.静脉压太高", "D.透析器及回路管堵塞", "E.静脉压太低"], "answer": "E", "explanation": "TMP高报警原因为除水速度大、透析器膜面积及超滤系数较小、静脉压太高、透析器及回路管堵塞、报警设定；静脉压太低是TMP低报警的相关原因。"}, {"text": "TMP低报警的原因之一是（ ）", "options": ["A.压力传感器前静脉回路受阻", "B.除水速度过大", "C.透析器膜面积过小", "D.静脉压太高", "E.抗凝不足"], "answer": "A", "explanation": "TMP低报警原因为静脉压没监测或不准致静脉压太低、压力传感器前静脉回路受阻、报警设定有误、透析液侧压力太高如机器排水管堵塞。"}, {"text": "超滤的目的是（ ）", "options": ["A.使透析后体重减少量与预期相一致", "B.降低透析液温度", "C.提高透析液电导度", "D.延长透析器使用寿命", "E.减少肝素用量"], "answer": "A", "explanation": "超滤的目的是使透析后体重减少量与预期相一致，由容量控制原理来实现；现代血透机都具备平衡系统，最终实现进出透析器的新鲜透析液和废液的量相等。"}, {"text": "影响准确超滤的因素不包括（ ）", "options": ["A.透前体重及治疗中摄入的水、食物以及排泄物", "B.预冲量、回水量、治疗中的补液量", "C.回路受阻，机器强制脱水", "D.透析回路中较多的空气", "E.透析液pH值的波动"], "answer": "E", "explanation": "影响准确超滤的因素包括透前体重及治疗中摄入的水、食物以及排泄物等，预冲量、回水量、治疗中的补液量等，回路受阻及机器强制脱水，透析回路中较多的空气，超滤控制系统元件或超滤泵损坏。"}, {"text": "超滤误差的处理中，首要步骤是（ ）", "options": ["A.准确评估患者的干体重", "B.更换透析器", "C.调整报警范围", "D.降低血流量", "E.更换超滤泵"], "answer": "A", "explanation": "超滤误差的处理包括准确评估患者的干体重，设置超滤量应考虑患者的病情、补液和回水量，正确预冲透析器排尽空气，若为机器故障及时联系维修人员校正超滤单元或更换元件。"}]}, {"type": "multiple", "questions": [{"text": "透析机报警处理的原则包括（ ）", "options": ["Ａ.报警装置应按要求定期校准精度，发现问题及时处理", "Ｂ.不得废除报警装置或随意改变报警参数", "Ｃ.对透析治疗安全产生影响的报警为红色，必须有操作人员处理", "Ｄ.报警出现后可先加大血流量继续治疗", "Ｅ.报警原因不明时可自行拆机检修"], "answer": "ABC", "explanation": "报警处理原则包括报警装置应按要求定期校准精度并及时处理问题，不得废除报警装置或随意改变报警参数，对治疗安全产生影响的报警为红色且必须有操作人员处理；报警后不得盲目加大血流量继续治疗，也不得自行拆机检修。"}, {"text": "发生报警的处理流程包含的步骤有（ ）", "options": ["Ａ.按消音键", "Ｂ.查找原因", "Ｃ.正确处理", "Ｄ.按复位键后继续透析治疗", "Ｅ.立即回血下机更换机器"], "answer": "ABCD", "explanation": "发生报警的处理流程为按消音键、查找原因、正确处理、按复位键、继续透析治疗；只有当原因不明或原因未解决时才不得进入透析治疗状态，并非报警后一律回血下机更换机器。"}, {"text": "下列属于警告性报警情形的有（ ）", "options": ["Ａ.回输管路出现气泡", "Ｂ.回输端极端正值", "Ｃ.跨膜压急剧升高", "Ｄ.滤器破膜漏血", "Ｅ.超净滤器到期"], "answer": "ABCD", "explanation": "警告性报警在出现可能造成病人危害、需要操作员立即干预的情况时发出，如回输管路出现气泡、回输端极端正值、跨膜压急剧升高
