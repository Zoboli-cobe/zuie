  ）", "options": ["A.分泌消化液", "B.滤过血液中的代谢产物和生化成分", "C.储存尿液", "D.分泌胰岛素", "E.生成红细胞"], "answer": "B", "explanation": "腹膜表面有许多小孔，可以滤过血液中的代谢产物和生化成分；透析时腹膜就像个筛子，把有用的东西留在身体里，把有害的东西排出去。"}, {"text": "在腹膜透析中，将每一次引流和灌注称为（  ）", "options": ["A.置换", "B.冲洗", "C.换液", "D.超滤", "E.封管"], "answer": "C", "explanation": "腹膜透析中每一次引流和灌注称为“换液”，包括引流、灌入和存腹等环节。"}, {"text": "腹膜透析换液操作的目的表述为（  ）", "options": ["A.提高超滤量", "B.缩短住院时间", "C.降低医疗费用", "D.提高患者依从性", "E.规范腹透析换液操作流程，确保患者换液安全"], "answer": "E", "explanation": "腹膜透析换液操作的目的为规范腹透析换液操作流程，确保患者换液安全。"}, {"text": "腹膜透析室环境准备中，地面清洁的方式是（  ）", "options": ["A.清水干式清扫", "B.予0.5%含氯制剂湿式拖地", "C.予1%含氯制剂喷雾", "D.仅用酒精擦拭", "E.用紫外线照射地面"], "answer": "B", "explanation": "腹膜透析室环境准备要求予0.5%含氯制剂湿式拖地。"}, {"text": "配制用于拖地的0.5%含氯制剂的要求是（  ）", "options": ["A.1L水加50mg含氯制剂1片", "B.1L水加500mg含氯制剂1片", "C.1L水加5g含氯制剂1片", "D.500ml水加500mg含氯制剂1片", "E.2L水加500mg含氯制剂1片"], "answer": "B", "explanation": "0.5%含氯制剂即1L水加500mg含氯制剂1片。"}, {"text": "腹膜透析室使用紫外线灯照射消毒的时间为（  ）", "options": ["A.15分钟", "B.30分钟", "C.1小时", "D.2小时", "E.4小时"], "answer": "C", "explanation": "腹膜透析室环境准备要求紫外线灯照射消毒1小时。"}, {"text": "腹膜透析换液前擦拭操作台面应使用（  ）", "options": ["A.0.5%含氯制剂", "B.75%酒精", "C.95%酒精", "D.碘伏", "E.清水"], "answer": "B", "explanation": "腹膜透析室环境准备要求在操作前使用75%酒精擦拭操作台面。"}, {"text": "腹膜透析换液所用透析液应加热至（  ）", "options": ["A.25℃", "B.32℃", "C.37℃", "D.42℃", "E.45℃"], "answer": "C", "explanation": "物品准备要求使用已加热至37℃的透析液。"}, {"text": "腹膜透析换液操作者准备的要求是（  ）", "options": ["A.修剪指甲，整理头发，必要时戴帽", "B.必须戴无菌手套", "C.必须穿隔离衣", "D.必须戴防护面罩", "E.必须更换专用鞋"], "answer": "A", "explanation": "操作者准备包括修剪指甲、整理头发，必要时戴帽；衣服保持干净整洁。"}, {"text": "腹膜透析换液前对导管的评估内容包括（  ）", "options": ["A.导管有无破损、漏液、打折，cuff有无牵拉、脱出", "B.测量导管长度是否达标", "C.导管内径是否与短管匹配", "D.导管流量是否达到150ml/min", "E.导管顶端位置是否在盆腔"], "answer": "A", "explanation": "导管评估需观察导管有无破损、漏液、打折，cuff有无牵拉、脱出。"}, {"text": "腹膜透析换液前对患者的嘱托是（  ）", "options": ["A.排尿、排便后到腹透室取坐位", "B.空腹到腹透室取平卧位", "C.憋尿到腹透室取站立位", "D.饮水后立即取坐位", "E.运动后立即到腹透室"], "answer": "A", "explanation": "换液前评估环节嘱患者排尿、排便后到腹透室取坐位。"}, {"text": "腹膜透析换液前的评估中，对患者体征的评估内容包括（  ）", "options": ["A.有无头晕、发热、腹痛等症状及程度", "B.有无糖尿病家族史", "C.有无吸烟饮酒史", "D.有无药物过敏史", "E.有无手术外伤史"], "answer": "A", "explanation": "患者体征评估包括有无头晕、发热、腹痛等症状及程度，有无其他不适主诉。"}, {"text": "腹膜透析个案管理按时间顺序分为（  ）", "options": ["A.院前管理、院中管理、院后管理", "B.门诊管理、病房管理、居家管理", "C.术前管理、术中管理、术后管理", "D.早期管理、中期管理、晚期管理", "E.急诊管理、住院管理、随访管理"], "answer": "A", "explanation": "腹膜透析个案管理按时间顺序分为院前管理、院中管理、院后管理三部分。"}, {"text": "腹膜透析个案管理院前管理的内容包括（  ）", "options": ["A.随访管理", "B.早期适时介入、选择透析模式、综合评估、院前准备", "C.围手术期管理", "D.非计划入院患者管理", "E.APD-RPM远程患者管理"], "answer": "B", "explanation": "院前管理包括早期适时介入、选择透析模式、综合评估、院前准备。"}, {"text": "腹膜透析个案管理院中管理的内容包括（  ）", "options": ["A.早期适时介入", "B.选择透析模式", "C.围手术期管理、规律复查患者管理、非计划入院患者管理", "D.随访管理", "E.APD-RPM远程患者管理"], "answer": "C", "explanation": "院中管理包括围手术期管理、规律复查患者管理、非计划入院患者管理。"}, {"text": "腹膜透析个案管理院后管理的内容包括（  ）", "options": ["A.综合评估和院前准备", "B.围手术期管理", "C.建立个案管理档案", "D.随访管理和APD-RPM远程患者管理", "E.早期适时介入"], "answer": "D", "explanation": "院后管理包括随访管理和APD-RPM远程患者管理。"}, {"text": "腹膜透析个案管理中，个案结案的情形是（  ）", "options": ["A.转为门诊随访", "B.更换透析液品牌", "C.肾移植或死亡", "D.外出旅行", "E.短期住院"], "answer": "C", "explanation": "腹膜透析个案管理档案的结案情形为肾移植、死亡。"}, {"text": "腹膜透析个案管理院前管理中，向患者提供的资料包括腹膜透析术前评估表、患者随诊知情同意书和（  ）", "options": ["A.腹膜透析患者须知", "B.腹膜透析考核评价表", "C.住院随访表格", "D.出口处评分表", "E.标本留取记录单"], "answer": "A", "explanation": "院前管理提供的资料包括腹膜透析术前评估表、患者随诊知情同意书和腹膜透析患者须知。"}, {"text": "腹膜透析规范化培训中，属于操作培训的内容是（  ）", "options": ["A.《开始腹透-基础》", "B.《了解你使用的腹透产品》", "C.腹膜透析换液、出口处换药、淋浴方法和步骤", "D.《遵循无菌技术原则》", "E.《解决居家透析的问题》"], "answer": "C", "explanation": "规范化培训的操作内容包括腹膜透析换液、出口处换药、淋浴方法和步骤。"}, {"text": "腹膜透析个案管理建立电子档案所使用的系统是（  ）", "options": ["A.肾尚慢病管理系统", "B.电子病历系统", "C.检验信息系统", "D.影像归档系统", "E.医院信息系统"], "answer": "A", "explanation": "腹膜透析个案管理建立电子档案使用肾尚慢病管理系统，纸质档案则文件成册。"}, {"text": "腹膜透析个案管理建立纸质档案的方式是（  ）", "options": ["A.单页存放", "B.文件成册", "C.仅扫描存储", "D.录入系统", "E.定期销毁"], "answer": "B", "explanation": "纸质档案的建立方式为文件成册，电子档案则录入肾尚慢病管理系统。"}, {"text": "腹膜透析患者再培训的主要依据是（  ）", "options": ["A.患者的年龄", "B.患者理论掌握的薄弱环节和操作考核出现的问题", "C.患者的经济状况", "D.患者的居住地", "E.患者的职业"], "answer": "B", "explanation": "再培训针对患者理论掌握的薄弱环节和操作考核出现的问题开展。"}, {"text": "腹膜透析规范化培训中，理论及操作考核的内容包括患者理论考试、患者操作考试和（  ）", "options": ["A.患者居家环境评估", "B.家属访谈记录", "C.病历质量检查", "D.用药核对记录", "E.营养评估量表"], "answer": "A", "explanation": "理论及操作考核包括患者理论考试、患者操作考试和患者居家环境评估。"}, {"text": "血液透析的透析地点是（  ）", "options": ["A.家中", "B.工作单位", "C.社区卫生服务站", "D.医院", "E.任何干净地方"], "answer": "D", "explanation": "血液透析在医院进行，由医务人员操作；腹膜透析则在家庭、工作单位等干净地方进行。"}, {"text": "血液透析每周的透析次数为（  ）", "options": ["A.每日", "B.每周3次", "C.每周2次", "D.每晚", "E.每周5次"], "answer": "B", "explanation": "血液透析每周透析3次，每周治疗时间12小时（白天）。"}, {"text": "手工腹膜透析每周的透析次数为（  ）", "options": ["A.每周3次", "B.每日", "C.每晚", "D.每周5次", "E.隔日一次"], "answer": "B", "explanation": "手工腹膜透析每周透析次数为每日，每周治疗时间为7天（白天或晚上）。"}, {"text": "机器腹膜透析的每周治疗时间为（  ）", "options": ["A.12小时（白天）", "B.7天（白天或晚上）", "C.7天（晚上）", "D.每日白天6小时", "E.每周3次共12小时"], "answer": "C", "explanation": "机器腹膜透析每晚透析，每周治疗时间为7天（晚上）。"}, {"text": "腹膜透析的操作者是（  ）", "options": ["A.仅医务人员", "B.仅患者家属", "C.受过培训的人", "D.仅护工", "E.任何成年人"], "answer": "C", "explanation": "腹膜透析由受过培训的人操作，血液透析则由医务人员操作。"}, {"text": "腹膜透析患者健康管理的长期目标中，营养状况良好要求血清白蛋白（  ）", "options": ["A.≥28g/L", "B.≥32g/L", "C.≥38g/L", "D.≥45g/L", "E.≥50g/L"], "answer": "C", "explanation": "长期目标中营养状况良好要求血清白蛋白≥38g/L，SGA正常，食欲良好。"}, {"text": "腹膜透析患者健康管理的长期目标中，贫血纠正要求血红蛋白（  ）", "options": ["A.≥90g/L", "B.90-110g/L", "C.110-130g/L", "D.130-150g/L", "E.150g/L以上"], "answer": "C", "explanation": "长期目标中贫血纠正要求血红蛋白110-130g/L。"}, {"text": "腹膜透析患者健康管理的长期目标中，小分子溶质清除达标要求总尿素清除率（Kt/V值）（  ）", "options": ["A.＞1.2/周", "B.＞1.4/周", "C.＞1.7/周", "D.＞2.0/周", "E.＞2.5/周"], "answer": "C", "explanation": "长期目标中小分子溶质清除达标要求总尿素清除率（Kt/V值）＞1.7/周。"}, {"text": "腹膜透析规律复查中，全段甲状旁腺激素的检测频度是（  ）", "options": ["A.每月1次", "B.每1～3个月1次", "C.每3～6个月1次", "D.每6个月1次", "E.每年1次"], "answer": "C", "explanation": "规律复查中全段甲状旁腺激素每3～6个月检测1次；血钙、血磷、钙磷乘积则为每1～3个月检测1次。"}, {"text": "APD-RPM远程患者管理中，自动记录患者每日真实治疗数据并在治疗结束后主动传输至医护端，属于（  ）", "options": ["A.数据真实性管理", "B.依从准确性管理", "C.干预及时性管理", "D.管理高效性管理", "E.营养指导管理"], "answer": "A", "explanation": "APD-RPM远程患者管理中的APD腹透数据真实性管理，可自动记录患者每日真实治疗数据，并在治疗结束后主动传输至医护端，以获得患者真实治疗情况，为高质量PD管理提供基础信息。"}]}, {"type": "multiple", "questions": [{"text": "关于腹膜透析管与螺旋帽钛接头的描述，正确的有（  ）", "options": ["Ａ.腹膜透析管经置管手术置入腹腔", "Ｂ.腹膜透析管伸出体外的一端与钛接头连接", "Ｃ.钛接头为纯钛材质", "Ｄ.钛接头没有磁性、不会被腐蚀", "Ｅ.钛接头具有磁性、易被腐蚀"], "answer": "ABCD", "explanation": "腹膜透析管经置管手术放置到腹腔内，伸出体外的一端与钛接头连接；钛接头为纯钛材质，没有磁性，不会被腐蚀；故“钛接头具有磁性、易被腐蚀”错误。"}, {"text": "关于腹膜透析外接短管的描述，正确的有（  ）", "options": ["Ａ.换液时与腹透液连接的短管", "Ｂ.内套管与腹透液连接口完好吻合后形成完全密闭通路", "Ｃ.短管的任何一个部位都不需要用消毒剂擦拭", "Ｄ.不恰当的擦拭会使蓝色开关或管路出现裂纹", "Ｅ.每次换液前必须用消毒剂擦拭短管"], "answer": "ABCD", "explanation": "外接短管换液时与腹透液连接，内套管与腹透液连接口完好吻合后形成完全密闭的通路；短管任何部位都不需要用消毒剂擦拭，不恰当擦拭会使蓝色开关或管路出现裂纹，故“每次换液前必须用消毒剂擦拭短管”错误。"}, {"text": "关于碘液微型盖、蓝夹子和废液袋的描述，正确的有（  ）", "options": ["Ａ.每次换液结束后都要使用一个新的碘液微型盖", "Ｂ.碘液微型盖用于保护外接短管的端口", "Ｃ.蓝夹子即腹透管路夹，用于换液中夹闭管路", "Ｄ.蓝夹子建议闭合保存", "Ｅ.一次性使用引流袋适用于部分夜间不留腹的病人"], "answer": "ABCE", "explanation": "碘液微型盖每次换液结束后更换一个新的，用于保护外接短管的端口；蓝夹子即腹透管路夹，用于换液中夹闭管路，其弹性非常好，建议打开保存，故“蓝夹子建议闭合保存”错误；一次性使用引流袋适用于部分夜间不留腹的病人。"}, {"text": "标准双袋腹透连接系统的管路组成包括（  ）", "options": ["Ａ.易碎折头", "Ｂ.Y型接口", "Ｃ.连接端口", "Ｄ.碘伏帽", "Ｅ.钛接头"], "answer": "ABC", "explanation": "标准双袋腹透连接系统的管路组成主要包括易碎折头、Y型接口和连接端口；碘伏帽和钛接头不属于双袋腹透连接系统的管路组成。"}, {"text": "关于标准双袋腹透连接系统的描述，正确的有（  ）", "options": ["Ａ.由溶液袋、引流袋和管路组成", "Ｂ.设计上尽量减少液体和空气接触", "Ｃ.可大大降低腹膜炎的发生率", "Ｄ.易碎折头可最大程度减少粘合剂的使用", "Ｅ.连接端口越多越能降低操作难度"], "answer": "ABCD", "explanation": "标准双袋腹透连接系统由溶液袋、引流袋和管路组成，设计上尽量减少液体和空气接触以大大降低腹膜炎的发生率；易碎折头最大程度减少粘合剂的使用；连接端口应尽可能少以降低操作难度，故“连接端口越多越能降低操作难度”错误。"}, {"text": "关于腹膜的描述，正确的有（  ）", "options": ["Ａ.腹腔由腹膜包绕形成", "Ｂ.腹膜紧贴在肠管和胃、肝等脏器表面", "Ｃ.腹膜起保护作用", "Ｄ.腹膜表面有许多小孔", "Ｅ.腹膜不能滤过血液中的代谢产物"], "answer": "ABCD", "explanation": "腹腔由腹膜包绕形成，腹膜紧贴在肠管和胃、肝等脏器表面起保护作用，其表面有许多小孔，可滤过血液中的代谢产物和生化成分，故“腹膜不能滤过血液中的代谢产物”错误。"}, {"text": "腹膜透析换液的环境准备要求包括（  ）", "options": ["Ａ.单独的腹膜透析室，室内保持安静、光线充足", "Ｂ.予0.5%含氯制剂湿式拖地", "Ｃ.紫外线灯照射消毒1小时", "Ｄ.操作前使用75%酒精擦拭操作台面", "Ｅ.地面用清水冲洗后即可操作"], "answer": "ABCD", "explanation": "环境准备要求有单独的腹膜透析室且室内安静、光线充足，予0.5%含氯制剂湿式拖地，紫外线灯照射消毒1小时，操作前使用75%酒精擦拭操作台面；故“地面用清水冲洗后即可操作”错误。"}, {"text": "腹膜透析换液的物品准备包括（  ）", "options": ["Ａ.口罩、碘伏帽、胶布、纱布", "Ｂ.秤、蓝夹子、治疗巾、碘伏、桶", "Ｃ.已加热至37℃的透析液", "Ｄ.检查所需物品有效期和包装完好性", "Ｅ.无菌手术器械包"], "answer": "ABCD", "explanation": "物品准备包括口罩、碘伏帽、胶布、纱布、秤、蓝夹子、治疗巾、碘伏、桶等，使用已加热至37℃的透析液，并检查所需物品有效期和包装完好性；无菌手术器械包不属于换液物品准备内容。"}, {"text": "腹膜透析换液前的评估内容包括（  ）", "options": ["Ａ.观察导管有无破损", "Ｂ.观察导管有无漏液、打折", "Ｃ.观察cuff有无牵拉、脱出", "Ｄ.评估有无头晕、发热、腹痛等症状及程度", "Ｅ.评估患者的血型"], "answer": "ABCD", "explanation": "换液前评估包括导管评估（有无破损、漏液、打折，cuff有无牵拉、脱出）和患者体征评估（有无头晕、发热、腹痛等症状及程度）；血型不属于换液前评估内容。"}, {"text": "关于腹膜透析换液的操作者准备，正确的有（  ）", "options": ["Ａ.修剪指甲", "Ｂ.整理头发", "Ｃ.必要时戴帽", "Ｄ.衣服干净整洁", "Ｅ.保留长指甲以便于操作"], "answer": "ABCD", "explanation": "操作者准备包括修剪指甲、整理头发，必要时戴帽，衣服保持干净整洁；保留长指甲会增加污染风险，不符合操作者准备要求。"}, {"text": "腹膜透析规律住院复查患者定期检测指标及其频度，正确的有（  ）", "options": ["Ａ.血常规、肝肾功能、血电解质  每1~3个月1次", "Ｂ.全段甲状旁腺激素  每3~6个月1次", "Ｃ.白蛋白、前白蛋白等  每6个月1次", "Ｄ.高敏C-反应蛋白  每3个月1次", "Ｅ.体重指数、SGA评分  每1个月1次"], "answer": "ABCD", "explanation": "规律住院复查患者的检测指标及频度为：血常规、肝肾功能、血电解质每1~3个月1次，全段甲状旁腺激素每3~6个月1次，白蛋白、前白蛋白等每6个月1次，高敏C-反应蛋白每3个月1次；体重指数与SGA评分应为每6个月1次，故E项频度错误。"}, {"text": "腹膜透析个体化培训方式包括（  ）", "options": ["Ａ.视频宣教", "Ｂ.现场教学", "Ｃ.演示", "Ｄ.一对一指导", "Ｅ.仅发放文字手册自行阅读"], "answer": "ABCD", "explanation": "个体化培训方式包括视频宣教、现场教学、演示和一对一指导；仅发放文字手册自行阅读不属于个体化培训方式。"}, {"text": "腹膜透析院后管理中的APD-RPM远程患者管理，其特点包括（  ）", "options": ["Ａ.自动记录患者每日真实治疗数据", "Ｂ.治疗结束后主动传输至医护端", "Ｃ.便于医护及时掌握居家治疗情况", "Ｄ.属于院后管理的内容", "Ｅ.由患者手写记录后定期邮寄"], "answer": "ABCD", "explanation": "APD-RPM远程患者管理可自动记录患者每日真实治疗数据并在治疗结束后主动传输至医护端，便于医护及时掌握居家治疗情况，属于院后管理内容；手工记录邮寄不属于其特点。"}, {"text": "腹膜透析规范化培训的理论内容有（  ）", "options": ["Ａ.《开始腹透-基础》", "Ｂ.《了解你使用的腹透产品》", "Ｃ.《遵循无菌技术原则》", "Ｄ.《居家腹透环境物品准备》", "Ｅ.出口处换药"], "answer": "ABCD", "explanation": "规范化培训的理论内容包括《开始腹透-基础》《了解你使用的腹透产品》《遵循无菌技术原则》《居家腹透环境物品准备》《腹透相关物品订购储存》《解决居家透析的问题》；出口处换药属于操作培训内容。"}, {"text": "腹膜透析院后随访管理开展的随访方式有（  ）", "options": ["Ａ.门诊随访", "Ｂ.电话随访", "Ｃ.微信随访", "Ｄ.家庭随访", "Ｅ.住院随访"], "answer": "ABCD", "explanation": "院后随访管理开展门诊随访、电话随访、微信随访、家庭随访等多种方式；住院随访不属于院后随访管理的方式。"}, {"text": "为预防腹膜炎，腹膜透析患者应严格做到（  ）", "options": ["Ａ.做好环境准备，按正规的操作步骤进行换液", "Ｂ.换液前必须先洗手、戴口罩", "Ｃ.预防呼吸道等其他系统的感染", "Ｄ.发现导管出口红、肿、痛、渗液及时报告腹透中心", "Ｅ.每日盆浴以保持导管出口清洁"], "answer": "ABCD", "explanation": "预防腹膜炎需做好环境准备并按正规操作步骤换液，换液前先洗手、戴口罩，预防呼吸道等其他系统的感染，发现导管出口红、肿、痛、渗液及时报告腹透中心并在指导下处理；导管出口应保持干燥、避免盆浴，故“每日盆浴”错误。"}, {"text": "腹膜透析患者健康管理的长期目标包括（  ）", "options": ["Ａ.无毒素蓄积症状，如恶心、呕吐、失眠、不安腿", "Ｂ.无液体蓄积症状，如高血压、心衰、浮肿", "Ｃ.营养状况良好，血清白蛋白≥38g/L", "Ｄ.骨矿代谢平衡，血磷≤1.78mmol/L", "Ｅ.血红蛋白越高越好"], "answer": "ABCD", "explanation": "长期目标包括无毒素蓄积症状、无液体蓄积症状、营养状况良好（血清白蛋白≥38g/L，SGA正常，食欲良好）、骨矿代谢平衡（血磷≤1.78mmol/L、iPTH≤300pg/ml）等；贫血纠正的目标是血红蛋白110-130g/L，并非越高越好，故“血红蛋白越高越好”错误。"}, {"text": "关于腹膜透析患者运动指导的描述，正确的有（  ）", "options": ["Ａ.适当运动能够改善骨骼肌纤维萎缩", "Ｂ.宜选择低到中度的运动，如散步、太极拳等", "Ｃ.运动强度为预计最大心率的60%-80%", "Ｄ.每周运动3次", "Ｅ.宜选择举重、仰卧起坐等运动"], "answer": "ABCD", "explanation": "腹膜透析患者适当运动能够改善骨骼肌纤维萎缩、心理健康状况、心血管功能和代谢紊乱，提高生活质量；宜选择低到中度的运动如散步、太极拳等，运动强度为预计最大心率的60%-80%，每周运动3次；举重、仰卧起坐等增加腹压及腰部的运动属于忌选择的运动。"}, {"text": "关于腹膜透析患者限制盐摄入的指导，正确的有（  ）", "options": ["Ａ.每天盐的摄入量＜6g", "Ｂ.建议使用控盐勺或者控盐壶", "Ｃ.避免食用咸菜、卤肉、咸鸭蛋等含盐高的食物", "Ｄ.5ml酱油=5g味精=10g鸡精=1g盐", "Ｅ.用酱菜、罐头替代新鲜蔬菜"], "answer": "ABCD", "explanation": "限制盐摄入要求每天盐的摄入量＜6g，使用控盐勺或者控盐壶，避免食用含盐高的食物（如咸菜、卤肉、咸鸭蛋、罐头、酱菜等），并注意含盐高调味品的替换，即5ml酱油=5g味精=10g鸡精=1g盐；酱菜、罐头属于含盐高的食物，不宜替代新鲜蔬菜。"}, {"text": "关于腹膜透析患者肾性贫血相关用药的指导，正确的有（  ）", "options": ["Ａ.铁剂宜饭后服用", "Ｂ.服用铁剂期间应多食用富含维生素C的水果、蔬菜", "Ｃ.铁剂应与牛奶、浓茶、咖啡同服以促进吸收", "Ｄ.促红细胞生成素按需皮下注射，冰箱保存", "Ｅ.罗沙司他可空腹或与食物同服"], "answer": "ABDE", "explanation": "铁剂宜饭后服用，服用期间应多食用富含维生素C的水果、蔬菜以促进铁的吸收；铁剂应避免与牛奶、浓茶、咖啡同服，因其妨碍铁的吸收，故“铁剂应与牛奶、浓茶、咖啡同服以促进吸收”错误；促红细胞生成素按需皮下注射、冰箱保存；罗沙司他可空腹或与食物同服，避免与其他药物同时服用。"}]}, {"type": "short", "questions": [{"text": "简述腹膜透析管、外接短管及螺旋帽钛接头各自的连接关系与要点。", "options": [], "answer": "腹膜透析管由医生通过置管手术放置到腹腔内，其伸出体外的一端与钛接头连接，连接密闭性越好就越能够减少漏液的发生，从而减少感染的可能；外接短管是换液时与腹透液连接的短管，其内套管与腹透液连接口完好吻合后可形成完全密闭的通路，短管的任何一个部位都不需要用消毒剂擦拭，不恰当的擦拭会使蓝色开关或管路出现裂纹；螺旋帽钛接头将体内的长管和体外的短管密闭连接，为纯钛材质，没有磁性，不会被腐蚀，其两端分别和腹膜透析管及外接短管高度匹配，达到完好的密闭性。", "explanation": "三者的连接关系为体内长管—钛接头—体外短管，共同构成密闭的腹透通路。外接短管无需用消毒剂擦拭，螺旋帽钛接头为纯钛材质、没有磁性、不会被腐蚀，均为保证密闭性、减少漏液和感染的关键。"}, {"text": "简述腹膜透析换液操作前准备的内容。", "options": [], "answer": "①环境准备：单独的腹膜透析室，室内保持安静、光线充足；予0.5%含氯制剂（即1L水加500mg含氯制剂1片）湿式拖地；紫外线灯照射消毒1小时；操作前使用75%酒精擦拭操作台面。②物品准备：备齐口罩、碘伏帽、胶布、纱布、秤、蓝夹子、治疗巾、碘伏、桶等物品，使用已加热至37℃的透析液，并检查所需物品有效期和包装完好性。③操作者准备：修剪指甲、整理头发，必要时戴帽，衣服干净整洁。", "explanation": "换液操作前准备分为环境、物品、操作者三方面：环境需用0.5%含氯制剂湿式拖地、紫外线灯照射消毒1小时、75%酒精擦拭台面；透析液需加热至37℃；操作者需做好个人清洁。上述措施的目的是降低污染风险、确保换液安全。"}, {"text": "简述腹膜透析换液的目的和评估内容。", "options": [], "answer": "目的：规范腹透析换液操作流程，确保患者换液安全。评估内容包括：①导管评估，观察导管有无破损、漏液、打折，cuff有无牵拉、脱出；②患者体征评估，有无头晕、发热、腹痛等症状及程度，有无其他不适主诉；③嘱患者排尿、排便后到腹透室取坐位。", "explanation": "腹膜透析换液的目的是规范操作流程、保障患者换液安全。评估围绕导管、患者体征以及对患者的嘱托三方面进行，导管评估重点为破损、漏液、打折及cuff牵拉脱出，体征评估重点为头晕、发热、腹痛等症状及程度。"}, {"text": "简述腹膜透析个案管理的管理阶段及各阶段的主要内容。", "options": [], "answer": "腹膜透析个案管理按时间顺序分为三个阶段：①院前管理，包括早期适时介入、选择透析模式、综合评估、院前准备；②院中管理，包括围手术期管理、规律复查患者管理、非计划入院患者管理；③院后管理，包括随访管理、APD-RPM远程患者管理。个案管理档案在肾移植或死亡时结案。", "explanation": "个案管理分为院前、院中、院后三个阶段：院前侧重早期适时介入、选择透析模式、综合评估与院前准备；院中侧重围手术期患者及规律复查、非计划入院患者的规范化管理；院后侧重随访管理与APD-RPM远程患者管理。个案管理档案的结案情形为肾移植和死亡。"}, {"text": "简述腹膜透析患者预防腹膜炎应严格做到的措施。", "options": [], "answer": "细菌常常通过腹透管进入体内引起腹膜炎，表现为发热、透出液浑浊、持续性腹痛。预防腹膜炎应严格做到：①做好环境准备，按正规的操作步骤进行换液；②换液前必须先洗手、戴口罩；③预防呼吸道等其他系统的感染；④做好导管出口的护理，保持干燥，避免牵拉和损伤，避免盆浴；⑤发现导管出口红、肿、痛、渗液，及时报告腹透中心并在指导下处理；⑥做好肠道护理，合理饮食改善机体营养状态，提高抵抗力，预防便秘、腹泻。", "explanation": "腹膜炎多由细菌经腹透管进入体内引起，典型表现为发热、透出液浑浊和持续性腹痛。预防措施涵盖规范换液操作、换液前洗手戴口罩、预防其他系统感染、导管出口护理以及肠道护理等多个环节，核心是减少污染、增强机体抵抗力。"}]}]}, {"num": 20, "title": "腹膜透析护理常规理论考试题库", "sections": [{"type": "single", "questions": [{"text": "腹膜透析导管被称为腹膜透析患者的（  ）", "options": ["A.警戒线", "B.备用通道", "C.辅助器械", "D.生命线", "E.一次性耗材"], "answer": "D", "explanation": "腹膜透析导管是腹膜透析患者的生命线，选择合适置管位置、使用正确置管方式并建立流畅透析通路，是保证腹膜透析成功的关键。"}, {"text": "保证腹膜透析成功的关键在于选择合适的置管位置、使用正确的置管方式以及（  ）", "options": ["A.缩短手术时间", "B.建立流畅的透析通路", "C.减少麻醉用量", "D.增加透析液浓度", "E.延长住院时间"], "answer": "B", "explanation": "腹膜透析导管是患者的生命线，选择合适置管位置、使用正确置管方式、建立流畅透析通路，是保证腹膜透析成功的关键所在。"}, {"text": "下列属于腹膜置管附件的是（  ）", "options": ["A.透析器", "B.血泵", "C.内瘘穿刺针", "D.血管鞘", "E.隧道针"], "answer": "E", "explanation": "腹膜置管附件包括钛接头、外接短管、隧道针和导丝。透析器和血泵是血液净化设备部件，内瘘穿刺针和血管鞘用于血管通路操作，均不属于腹膜置管附件。"}, {"text": "腹膜透析置管术皮肤消毒范围的上界是（  ）", "options": ["A.剑突下", "B.脐上2cm", "C.双侧肋缘", "D.胸骨角", "E.剑突上3cm"], "answer": "A", "explanation": "腹膜透析置管术消毒范围上至剑突下，下至双侧腹股沟，两侧至腋中线，并注意脐的消毒。"}, {"text": "腹膜透析置管术消毒时应特别注意（  ）", "options": ["A.阴毛剃除", "B.脐周注射", "C.皮肤缝合", "D.脐的消毒", "E.加压包扎"], "answer": "D", "explanation": "腹膜透析置管术消毒范围为上至剑突下、下至双侧腹股沟、两侧至腋中线，消毒时需注意脐的消毒。"}, {"text": "腹膜透析置管术切开皮肤时采用的麻醉方式是（  ）", "options": ["A.全身麻醉", "B.局部麻醉", "C.椎管内麻醉", "D.硬膜外麻醉", "E.静脉麻醉"], "answer": "B", "explanation": "腹膜透析置管术在局部麻醉下切开皮肤，属置管术步骤中的第二步。"}, {"text": "腹膜透析置管术中浸泡两个cuff并挤出空气的目的是（  ）", "options": ["A.易于组织与cuff粘连", "B.便于导管滑动", "C.便于缝合皮肤", "D.防止导管折断", "E.加快手术进程"], "answer": "A", "explanation": "置管术中浸泡两个cuff并挤出空气，是为了易于组织与cuff粘连，从而固定导管。"}, {"text": "放置导丝时，应注意导丝远端留出（  ）", "options": ["A.2cm", "B.1cm", "C.3cm", "D.4cm", "E.5cm"], "answer": "A", "explanation": "腹膜透析置管术中放置导丝时，注意远端留出2cm。"}, {"text": "腹膜透析置管术中经腹透管内注入的加肝素生理盐水量为（  ）", "options": ["A.20ml", "B.50ml", "C.200ml", "D.500ml", "E.100ml"], "answer": "E", "explanation": "置管术中经腹透管内注入加肝素的生理盐水100ml放水成线，试水成功后缝合。"}, {"text": "腹膜透析置管术中建立皮下隧道依靠（  ）", "options": ["A.导丝牵引", "B.外接短管支撑", "C.钛接头导向", "D.缝线提拉", "E.隧道针牵引"], "answer": "E", "explanation": "置管术第9步为在隧道针牵引下建立皮下隧道，常用的导管有Swan-Neck管和Tenckhoff管。"}, {"text": "腹膜透析置管术缝合皮下脂肪及皮肤时，应注意（  ）", "options": ["A.缝住导管以固定", "B.使用可吸收缝线", "C.不要缝到腹透管", "D.缝合后加压包扎", "E.留出引流口"], "answer": "C", "explanation": "置管术缝合皮下脂肪及皮肤时，注意不要缝到腹透管，以免损伤导管。"}, {"text": "腹膜透析置管术常用的导管类型为Swan-Neck管和（  ）", "options": ["A.Swan-Ganz管", "B.Foley管", "C.猪尾管", "D.双腔管", "E.Tenckhoff管"], "answer": "E", "explanation": "腹膜透析置管术中常用Swan-Neck管和Tenckhoff管两种导管。"}, {"text": "腹透置管术前患者评估中，除评估认知能力和自主操作能力外，还应评估（  ）", "options": ["A.肺功能", "B.听力水平", "C.血型", "D.视力", "E.精神状态"], "answer": "E", "explanation": "术前应评估患者的认知能力、自主操作能力及精神状态。"}, {"text": "腹透置管术前应向患者讲解血液透析和腹膜透析各自的优缺点，以及（  ）", "options": ["A.手术医生的资历", "B.病房的床位安排", "C.透析机的品牌", "D.护理人员排班", "E.选择腹膜透析的依据"], "answer": "E", "explanation": "术前需讲解血液透析和腹膜透析各自的优缺点，以及患者选择腹膜透析的依据，并讲明腹膜透析费用及手术方式。"}, {"text": "腹透置管术前除了解患者意愿外，还应了解其（  ）", "options": ["A.家庭住址", "B.身高体重", "C.饮食习惯", "D.治疗依从性", "E.睡眠时间"], "answer": "D", "explanation": "术前需了解患者意愿及治疗依从性，为制定护理方案提供依据。"}, {"text": "下列不属于腹透置管术前患者宣教内容的是（  ）", "options": ["A.讲解腹膜透原理", "B.介绍常见腹透方式", "C.居家治疗物品准备", "D.透析机维修技术", "E.腹透液存储方法"], "answer": "D", "explanation": "术前患者宣教内容包括讲解腹膜透原理、介绍常见腹透方式、居家治疗物品准备、居家治疗环境要求以及腹透液的存储方法及注意事项。透析机维修技术不属于患者宣教内容。"}, {"text": "腹透置管术前完善实验室检查时，尤其应了解有无（  ）", "options": ["A.糖尿病", "B.出血性疾病", "C.高血压", "D.贫血", "E.骨质疏松"], "answer": "B", "explanation": "术前完善实验室检查，尤其了解有无出血性疾病，以避免手术出血风险。"}, {"text": "腹透置管术前备皮范围为剑突下至大腿上三分之一并包括会阴部，两侧到（  ）", "options": ["A.腋中线", "B.腋后线", "C.腋前线", "D.锁骨中线", "E.肩胛线"], "answer": "C", "explanation": "术前备皮范围为剑突下至大腿上三分之一，包括会阴部，两侧到腋前线。"}, {"text": "腹透置管术前的禁食禁饮时间是（  ）", "options": ["A.2小时", "B.4小时", "C.8小时", "D.12小时", "E.6小时"], "answer": "E", "explanation": "腹透置管术前6小时禁食禁饮，以防止术中因麻药引起恶心呕吐。"}, {"text": "腹透置管术前6小时禁食禁饮的主要目的是防止术中因麻药引起恶心呕吐而（  ）", "options": ["A.引起低血糖", "B.导致脱水", "C.影响麻醉效果", "D.增加腹部张力", "E.引起血压下降"], "answer": "D", "explanation": "术前6小时禁食禁饮，是为了防止术中因麻药引起恶心呕吐而增加腹部张力。"}, {"text": "腹透置管术前要求患者进入手术室前（  ）", "options": ["A.排空膀胱", "B.沐浴更衣", "C.灌肠两次", "D.口服泻药", "E.留置导尿管"], "answer": "A", "explanation": "术前要求患者进入手术室前排空膀胱，必要时可进行灌肠。"}, {"text": "腹透置管术后常规护理中，测量生命体征并记录的同时应给予心电监护和（  ）", "options": ["A.按需吸氧", "B.持续机械通气", "C.血液灌流", "D.无创呼吸机支持", "E.高压氧治疗"], "answer": "A", "explanation": "术后常规护理包括测量生命体征并记录，给予心电监护、按需吸氧。"}, {"text": "腹透置管术后应评估出口及切口处敷料是否渗血渗液，并保持敷料（  ）", "options": ["A.持续潮湿", "B.加压包扎", "C.清洁干燥", "D.密闭不透气", "E.每日更换两次"], "answer": "C", "explanation": "术后应评估出口及切口处敷料是否渗血渗液，保持敷料清洁干燥。"}, {"text": "腹透置管术后评估腹透管路连接情况，需确保钛接头与长期管和外接短管（  ）", "options": ["A.留有空隙", "B.紧密连接", "C.单向连接", "D.定时断开", "E.缝线固定于皮肤"], "answer": "B", "explanation": "术后应评估腹透管路连接情况，确保钛接头与长期管和外接短管紧密连接，并妥善固定。"}, {"text": "腹透置管术后早期冲洗腹腔时，除评估出入量、灌入及引流速度外，还应评估引流液的（  ）", "options": ["A.温度、比重", "B.气味、酸碱度", "C.渗透压、糖浓度", "D.颜色、性状", "E.蛋白含量、细胞数"], "answer": "D", "explanation": "术后早期冲洗治疗应评估出入量、灌入及引流速度、引流液的颜色和性状。"}, {"text": "腹透置管术后的饮食护理要求肛门排气后进食易消化食物，并保持（  ）", "options": ["A.绝对卧床", "B.高脂饮食", "C.大便通畅", "D.大量饮水", "E.持续禁食"], "answer": "C", "explanation": "术后饮食护理为肛门排气后进食易消化食物，并保持大便通畅。"}, {"text": "腹透置管术后在活动方面应（  ）", "options": ["A.要求绝对卧床一周", "B.鼓励早期活动", "C.限制下床活动", "D.仅允许床上翻身", "E.24小时内禁止活动"], "answer": "B", "explanation": "术后在活动方面鼓励患者早期活动，有利于恢复并减少并发症。"}, {"text": "腹膜透析切口处换药应在（  ）进行", "options": ["A.普通病房", "B.换药室", "C.走廊", "D.手术间", "E.患者床旁开放环境"], "answer": "B", "explanation": "切口处换药应在换药室进行，关闭门窗和风扇，保持换药环境干燥清洁。"}, {"text": "腹膜透析切口处换药前（  ）应避免清扫房间，以减少走动", "options": ["A.30min", "B.10min", "C.20min", "D.60min", "E.120min"], "answer": "A", "explanation": "切口处换药前30min避免清扫房间、减少走动，保持换药环境干燥清洁。"}, {"text": "腹膜透析切口处换药时，操作者洗手应采用（  ）", "options": ["A.两遍清水冲洗", "B.六步洗手法", "C.快速手消毒代替", "D.戴手套代替洗手", "E.仅用乙醇擦拭双手"], "answer": "B", "explanation": "切口处换药的操作者准备包括戴口罩、帽子，并按六步洗手法洗手。"}, {"text": "腹膜透析切口处换药时，患者应取的体位是（  ）", "options": ["A.侧卧位", "B.半坐位", "C.俯卧位", "D.仰卧位", "E.头低足高位"], "answer": "D", "explanation": "切口处换药时患者取仰卧位，便于充分暴露切口并保持无菌操作。"}, {"text": "腹膜透析出口处护理中，患者自己换药时应取（  ）", "options": ["A.仰卧位", "B.坐位", "C.站立位", "D.侧卧位", "E.俯卧位"], "answer": "B", "explanation": "出口处换药体位为：他人换药时患者取仰卧位，患者自己换药时取坐位。"}, {"text": "腹膜透析出口处换药时评估出口的正常表现是（  ）", "options": ["A.干燥、无红肿、无脓性分泌物", "B.潮湿、渗液较多", "C.红肿、有脓性分泌物", "D.结痂每日1次", "E.皮肤明显变硬"], "answer": "A", "explanation": "出口处换药时评估出口的标准为干燥、无红肿、无脓性分泌物。"}, {"text": "腹膜透析出口处换药取下旧纱布时，若纱布与出口皮肤粘在一起，正确做法是（  ）", "options": ["A.用力快速撕下", "B.剪除粘连部分后撕下", "C.用无菌棉签蘸消毒液浸润纱布后取下", "D.持续冲洗后强行撕下", "E.保留旧纱布不予更换"], "answer": "C", "explanation": "纱布可用手直接取下；若纱布和出口的皮粘在一起，不要使劲拉扯，应用无菌棉签蘸消毒液浸润纱布，稍后便可取下。"}, {"text": "腹膜透析良好出口的结痂频次为（  ）", "options": ["A.每日结痂1次", "B.每周结痂1次", "C.2天以上结痂1次", "D.每月结痂1次", "E.从不结痂"], "answer": "C", "explanation": "良好出口表现为窦道内潮湿、无渗液，窦道内可见肉芽组织并有部分上皮覆盖，引流物粘稠，2天以上结痂1次，外口颜色淡桔红色。"}, {"text": "腹膜透析可疑感染出口的结痂频次为（  ）", "options": ["A.2天以上结痂1次", "B.每日结痂1次", "C.每周1次", "D.每周2次", "E.从不结痂"], "answer": "B", "explanation": "可疑感染出口表现为窦道内渗液，外口周围和窦道内肉芽组织轻度增生，引流物粘稠，每日结痂1次，常无疼痛和皮肤变硬。"}, {"text": "腹膜透析可疑感染出口的皮肤充血部位直径应大于腹透管直径（  ）", "options": ["A.1倍以上", "B.3倍以上", "C.2倍以上", "D.4倍以上", "E.5倍以上"], "answer": "C", "explanation": "可疑感染出口的皮肤充血部位直径大于腹透管直径2倍以上，常无疼痛和皮肤变硬。"}, {"text": "诊断腹膜透析并发胸腔积液时，将亚甲蓝通过腹膜透析管注入腹腔后，抽取胸腔积液的试验结果为（  ）", "options": ["A.亚甲蓝试验阴性", "B.无亚甲蓝显色", "C.痰亚甲蓝阳性", "D.亚甲蓝试验阳性", "E.尿亚甲蓝阴性"], "answer": "D", "explanation": "将亚甲蓝通过腹膜透析管注入腹腔后，抽取胸腔积液发现亚甲蓝试验阳性，即可明确诊断胸腔积液。"}, {"text": "腹膜透析腹壁渗漏的诊断依据之一是腹透液流出量减少伴（  ）", "options": ["A.体重下降", "B.血压升高", "C.尿量增加", "D.体重增加", "E.腹围缩小"], "answer": "D", "explanation": "腹壁渗漏的诊断依据包括腹透液流出量减少伴体重增加、腹壁局限性隆起水肿或皮下积液、站立时体检发现腹壁不对称，腹部CT、MRI可明确渗漏部位。"}, {"text": "腹膜透析导管腹腔外固定时应使用（  ）", "options": ["A.橡皮膏", "B.弹力绷带", "C.纸胶带", "D.缝线", "E.纱布条"], "answer": "C", "explanation": "腹膜透析导管腹外段固定应使用纸胶带，避免使用橡皮膏，以免损坏管路。"}, {"text": "腹膜透析导管固定时，用胶带将短管固定于皮肤上的位置距出口（  ）", "options": ["A.1cm", "B.2cm", "C.5cm", "D.3cm", "E.10cm"], "answer": "C", "explanation": "距离出口5cm处，用胶带将短管固定于皮肤上，并将胶带两端反折、胶面向上交叉固定短管。"}, {"text": "在非灌入腹膜透析液及放液时，应将腹膜透析导管（  ）", "options": ["A.悬挂于床边", "B.夹闭后弃置", "C.暴露于衣物外", "D.装入腹袋中", "E.固定于床头"], "answer": "D", "explanation": "在非灌入腹膜透析液及放液时将导管装入腹袋中，可防止牵拉、扭曲导管。"}, {"text": "腹膜透析置管术后手术切口疼痛多见于术后（  ）", "options": ["A.6h内", "B.24h内", "C.12h内", "D.48h内", "E.72h内"], "answer": "B", "explanation": "手术切口疼痛一般较轻，局限在手术切口，咳嗽或腹肌用力时加重，多见于术后24h内，一般无需处理。"}, {"text": "腹膜透析入液时因速度过快导致压力性疼痛不适，通常发生在使用（  ）的患者", "options": ["A.直管", "B.曲管", "C.两个cuff的导管", "D.Swan-Neck管", "E.卷曲型Tenckhoff管"], "answer": "A", "explanation": "入液过快导致的压力性疼痛不适通常发生在使用直管的患者，曲管较少出现这种并发症，疼痛位于导管尖端附近，主要发生在灌入透析液时。"}, {"text": "腹膜透析置管术后出血的临床表现与出血部位有关，可表现为（  ）", "options": ["A.剧烈腹痛伴反跳痛", "B.腹腔引流液清亮", "C.血尿伴尿量增多", "D.皮肤黄染", "E.腹壁血肿或血性透出液"], "answer": "E", "explanation": "腹透术后出血的临床表现与出血部位有关，可出现腹壁血肿或血性透出液。"}, {"text": "腹膜透析导管移位后，腹部立位X线平片显示导管末端移位至（  ）", "options": ["A.腹腔最低处", "B.盆腔内", "C.腹膜后间隙", "D.胸腔内", "E.上腹部或其他部位"], "answer": "E", "explanation": "正常腹透管末端应在腹腔最低处，移位后腹部立位X线平片显示导管末端移位至上腹部或其他部位。"}, {"text": "腹膜透析导管堵塞时，腹腔造影的典型表现是（  ）", "options": ["A.造影剂显示腹腔局部浓聚", "B.造影剂进入整个腹腔", "C.造影剂进入胸腔", "D.造影剂进入膀胱", "E.造影剂显示管腔全程通畅"], "answer": "A", "explanation": "导管堵塞时腹腔造影可见造影剂不能进入整个腹腔，而是显示腹腔局部造影剂浓聚，容易作出诊断。"}, {"text": "腹膜透析并发胸腔积液时，积液绝大多数出现在（  ）", "options": ["A.左侧", "B.双侧对称", "C.先左侧后右侧", "D.仅纵隔内", "E.右侧"], "answer": "E", "explanation": "胸腔积液绝大多数出现在右侧，重者呈现大量积液、肺不张，患者喜卧向患侧。"}, {"text": "腹膜透析并发会阴部水肿时，腹部CT检查可见（  ）", "options": ["A.造影剂于胸腔聚集", "B.造影剂于腹腔均匀分布", "C.造影剂于会阴区聚集", "D.肠系膜血管显影", "E.膈肌缺损影像"], "answer": "C", "explanation": "会阴部水肿的临床表现是腹透液注入后出现会阴部疼痛伴肿胀，腹部CT检查可发现造影剂于会阴区聚集，并可明确病因，有助于治疗。"}, {"text": "腹膜透析术后疝的主要临床表现是（  ）", "options": ["A.腹壁局部膨隆，灌液时更明显", "B.腹壁局部凹陷", "C.持续性剧烈腹痛", "D.血性透出液", "E.会阴部肿胀"], "answer": "A", "explanation": "疝的主要临床表现为腹壁局部出现膨隆，当腹膜透析液灌入时腹腔压力增加，局部膨隆会更加明显，大多数疝可以回纳，少数出现嵌顿需紧急外科处理。"}]}, {"type": "multiple", "questions": [{"text": "腹膜透析置管术的皮肤消毒范围包括（  ）", "options": ["Ａ.上至剑突下", "Ｂ.下至双侧腹股沟", "Ｃ.两侧至腋中线", "Ｄ.注意脐的消毒", "Ｅ.两侧至腋后线"], "answer": "ABCD", "explanation": "腹膜透析置管术消毒范围上至剑突下、下至双侧腹股沟、两侧至腋中线，并注意脐的消毒。两侧至腋后线超出实际消毒范围，故不选。"}, {"text": "腹膜置管附件包括（  ）", "options": ["Ａ.钛接头", "Ｂ.外接短管", "Ｃ.隧道针", "Ｄ.导丝", "Ｅ.透析器"], "answer": "ABCD", "explanation": "腹膜置管附件包括钛接头、外接短管、隧道针和导丝。透析器是血液透析时血液与透析液进行溶质交换的装置，不属于腹膜置管附件。"}, {"text": "腹膜透析置管术的置管步骤包括（  ）", "options": ["Ａ.消毒", "Ｂ.局麻切开皮肤", "Ｃ.分离皮下脂肪至前鞘并钝性分离肌肉", "Ｄ.隧道针牵引下建立皮下隧道", "Ｅ.术前6小时禁食禁饮"], "answer": "ABCD", "explanation": "置管步骤包括消毒、局麻切开皮肤、分离皮下脂肪至前鞘并提起前鞘、钝性分离肌肉、切开腹膜置入腹透导管、建立皮下隧道、缝合皮下脂肪及皮肤等。术前6小时禁食禁饮属于术前准备，不属于置管术中的操作步骤。"}, {"text": "腹透置管术前患者评估需了解的一般情况包括（  ）", "options": ["Ａ.教育水平", "Ｂ.工作环境与生活环境", "Ｃ.卫生习惯", "Ｄ.医保类型与家庭情况", "Ｅ.血肌酐清除率"], "answer": "ABCD", "explanation": "术前需了解患者年龄、教育水平、工作环境、生活环境、卫生习惯、经济条件、医保类型、家庭情况以及周边医疗条件等，并评估认知能力、自主操作能力及精神状态。血肌酐清除率属于实验室指标，不在一般情况评估范围内。"}, {"text": "腹透置管术前患者宣教的内容包括（  ）", "options": ["Ａ.讲解腹膜透原理", "Ｂ.介绍常见腹透方式", "Ｃ.居家治疗物品准备", "Ｄ.居家治疗环境要求", "Ｅ.血液透析血管通路穿刺技术"], "answer": "ABCD", "explanation": "术前宣教内容包括讲解腹膜透原理、介绍常见腹透方式、居家治疗物品准备、居家治疗环境要求以及腹透液的存储方法及注意事项。血液透析血管通路穿刺技术不属于腹透置管术前宣教内容。"}, {"text": "腹透置管术前准备包括（  ）", "options": ["Ａ.完善实验室检查，了解有无出血性疾病", "Ｂ.术前备皮", "Ｃ.术前6小时禁食禁饮", "Ｄ.进入手术室前排空膀胱", "Ｅ.术前常规留置导尿管"], "answer": "ABCD", "explanation": "术前准备包括完善实验室检查（尤其了解有无出血性疾病）、术前备皮、术前6小时禁食禁饮、进入手术室前排空膀胱（必要时可灌肠），以及遵医嘱术前预防性使用抗生素。术前常规留置导尿管不属于腹透置管术前准备内容。"}, {"text": "腹透置管术前备皮范围包括（  ）", "options": ["Ａ.上至剑突下", "Ｂ.下至大腿上三分之一", "Ｃ.包括会阴部", "Ｄ.两侧到腋前线", "Ｅ.两侧到腋后线"], "answer": "ABCD", "explanation": "术前备皮范围为剑突下至大腿上三分之一，包括会阴部，两侧到腋前线。两侧到腋后线超出实际备皮范围，故不选。"}, {"text": "腹透置管术后的常规护理内容包括（  ）", "options": ["Ａ.测量生命体征并记录，心电监护", "Ｂ.评估敷料渗血渗液并保持清洁干燥", "Ｃ.评估腹透管路连接情况并妥善固定", "Ｄ.早期冲洗腹腔并评估引流液情况", "Ｅ.术后24小时内禁止翻身"], "answer": "ABCD", "explanation": "术后常规护理包括测量生命体征并记录、心电监护、按需吸氧；评估出口及切口处敷料有无渗血渗液并保持清洁干燥；评估腹透管路连接情况，确保钛接头与长期管和外接短管紧密连接并妥善固定；早期冲洗腹腔，评估出入量、灌入及引流速度、引流液颜色和性状。术后鼓励患者早期活动，故术后24小时内禁止翻身是错误的。"}, {"text": "腹膜透析切口处换药的环境与操作者准备包括（  ）", "options": ["Ａ.在换药室进行", "Ｂ.关闭门窗和风扇", "Ｃ.换药前30min避免清扫房间", "Ｄ.戴口罩、帽子并按六步洗手法洗手", "Ｅ.在开放的病房床旁进行"], "answer": "ABCD", "explanation": "切口处换药应在换药室进行，关闭门窗和风扇，换药前30min避免清扫房间、减少走动，保持换药环境干燥清洁；操作者需戴口罩、帽子，并按六步洗手法洗手。在开放的病房床旁换药不符合环境要求。"}, {"text": "腹膜透析切口处换药的操作内容包括（  ）", "options": ["Ａ.浸湿纱布", "Ｂ.消毒切口", "Ｃ.蘸干消毒剂", "Ｄ.覆盖新纱布", "Ｅ.用力撕除粘连的纱布"], "answer": "ABCD", "explanation": "切口处换药的操作依次为浸湿纱布、消毒切口、蘸干消毒剂、覆盖新纱布。纱布若与皮肤粘连不可用力拉扯，故用力撕除粘连纱布是错误的。"}, {"text": "腹膜透析出口处换药前的准备包括（  ）", "options": ["Ａ.关闭门窗和风扇", "Ｂ.换药前30min避免整理房间", "Ｃ.戴口罩", "Ｄ.按六步洗手法洗手", "Ｅ.用乙醇消毒瓶颈4次"], "answer": "ABCD", "explanation": "出口处换药前需关闭门窗和风扇，换药前30min避免整理房间、减少走动，保持换药环境干燥清洁；操作者戴口罩并按六步洗手法洗手。生理盐水备用时用砂轮划玻璃安瓶颈并用乙醇消毒瓶颈2次，故消毒4次是错误的。"}, {"text": "腹膜透析出口处换药的体位要求包括（  ）", "options": ["Ａ.他人换药时患者取仰卧位", "Ｂ.患者自己换药时取坐位", "Ｃ.患者自己换药必须取仰卧位", "Ｄ.他人换药时患者取站立位", "Ｅ.换药体位无特殊要求"], "answer": "AB", "explanation": "出口处换药体位为：他人换药时患者取仰卧位，患者自己换药时取坐位。患者自己换药必须取仰卧位、他人换药取站立位以及体位无特殊要求的说法均与操作规范不符。"}, {"text": "腹膜透析可疑感染出口的表现包括（  ）", "options": ["Ａ.窦道内渗液", "Ｂ.外口周围和窦道内肉芽组织轻度增生", "Ｃ.引流物粘稠，每日结痂1次", "Ｄ.常无疼痛和皮肤变硬", "Ｅ.炎症持续时间大于4周"], "answer": "ABCD", "explanation": "可疑感染出口表现为窦道内渗液，外口周围和窦道内肉芽组织轻度增生，引流物粘稠，每日结痂1次，常无疼痛和皮肤变硬，皮肤充血部位直径大于腹透管直径2倍以上。炎症持续时间大于4周是感染出口（慢性）的特点。"}, {"text": "腹膜透析感染出口（急性）的表现包括（  ）", "options": ["Ａ.出口处疼痛、红肿", "Ｂ.皮肤充血部位直径大于腹透管直径2倍以上", "Ｃ.皮肤变硬并有脓性或血性引流物", "Ｄ.炎症持续时间小于4周", "Ｅ.肉芽组织异常生长且炎症持续大于4周"], "answer": "ABCD", "explanation": "感染出口（急性）表现为出口处疼痛、红肿，皮肤充血部位直径大于腹透管直径2倍以上，皮肤变硬，有脓性或血性引流物和外生的肉芽组织，窦道表皮收缩，炎症持续时间小于4周。肉芽组织异常生长且炎症持续大于4周是感染出口（慢性）的特点。"}, {"text": "腹膜透析感染出口（慢性）的特点包括（  ）", "options": ["Ａ.窦道内渗液", "Ｂ.肉芽组织长出外口或异常生长", "Ｃ.外口肉芽组织覆盖硬壳或血痂", "Ｄ.可无疼痛、红肿和皮肤变硬", "Ｅ.炎症持续时间小于4周"], "answer": "ABCD", "explanation": "感染出口（慢性）表现为窦道内渗液，肉芽组织长出外口或在窦道内异常生长，外口肉芽组织可覆盖较大的硬壳或血痂，可无疼痛、红肿和皮肤变硬，炎症持续时间大于4周。故炎症持续时间小于4周是错误的。"}, {"text": "腹膜透析隧道炎的临床表现包括（  ）", "options": ["Ａ.出口上方2.5cm以上沿导管方向红肿热痛", "Ｂ.沿导管方向出现分泌物", "Ｃ.分泌物培养阳性", "Ｄ.炎症持续时间小于4周", "Ｅ.外口颜色淡桔红色"], "answer": "ABC", "explanation": "隧道炎表现为导管出口上方2.5cm以上、沿导管方向的皮肤出现红、肿、热、痛及分泌物，分泌物培养阳性。炎症持续时间小于4周是急性感染出口的特点，外口颜色淡桔红色是良好出口的表现。"}, {"text": "腹膜透析导管腹腔外固定的要点包括（  ）", "options": ["Ａ.时刻固定在皮肤上、防止牵拉扭曲", "Ｂ.使用纸胶带，避免橡皮膏", "Ｃ.胶带两端反折、胶面向上交叉固定", "Ｄ.距出口5cm处固定短管", "Ｅ.用橡皮膏缠绕导管加强固定"], "answer": "ABCD", "explanation": "导管腹外段固定需时刻将导管固定在皮肤上，防止牵拉、扭曲；固定时使用纸胶带，避免使用橡皮膏以免损坏管路；将胶带两端反折以避免撕开时损伤出口，胶面向上交叉固定短管；距出口5cm处用胶带将短管固定于皮肤上。用橡皮膏缠绕导管会损坏管路。"}, {"text": "腹膜透析置管术后疼痛的原因包括（  ）", "options": ["Ａ.手术切口疼痛", "Ｂ.导管尖端液体冲击及虹吸作用", "Ｃ.腹透液pH过低或温度过高", "Ｄ.透析管周围有网膜或其他组织包裹", "Ｅ.腹透液葡萄糖浓度过低"], "answer": "ABCD", "explanation": "术后疼痛原因包括手术切口疼痛；透析导管尖端液体冲击、导管周围组织张力增加及虹吸作用；腹透液pH过低或温度过高；透析管周围有网膜或其他组织包裹；以及手术损伤腹腔脏器和腹压增高等。腹透液葡萄糖浓度过低不是其疼痛原因。"}, {"text": "腹膜透析导管移位的相关因素包括（  ）", "options": ["Ａ.便秘、腹泻、低钾等肠蠕动异常", "Ｂ.伤口愈合前反复牵拉腹透管", "Ｃ.术中导管末端未置入腹腔最低处", "Ｄ.皮下隧道未成弧形、引出方向不当", "Ｅ.腹透液葡萄糖浓度过低"], "answer": "ABCD", "explanation": "导管移位相关因素包括肠蠕动异常（如便秘、腹泻、低钾）、伤口愈合前反复牵拉腹透管，以及与手术相关的因素：术中放置导管时未将导管末端置入腹腔最低处、建立皮下隧道时未成弧形导致导管引出方向不当。腹透液葡萄糖浓度过低与导管移位无关。"}, {"text": "腹膜透析导管堵塞的原因包括（  ）", "options": ["Ａ.血块、纤维蛋白凝块或脂肪球堵塞", "Ｂ.导管在腹腔内被网膜包裹", "Ｃ.腹腔粘连", "Ｄ.导管受压扭曲", "Ｅ.透析液温度过低"], "answer": "ABCD", "explanation": "导管堵塞原因包括导管内腔或侧孔被血块、纤维蛋白凝块、脂肪球堵塞，以及腹腔内因素如导管被网膜包裹、腹腔粘连或导管受压扭曲。透析液温度过低不是导管堵塞的原因。"}]}, {"type": "short", "questions": [{"text": "简述腹膜透析置管术的置管步骤要点。", "options": [], "answer": "腹膜透析置管术的置管步骤共十步：①消毒，范围上至剑突下、下至双侧腹股沟、两侧至腋中线，注意脐的消毒；②局麻切开皮肤；③分离皮下脂肪至前鞘，提起前鞘，钝性分离肌肉；④检查腹透管，看清有侧孔端；⑤浸泡两个cuff，挤出空气，以易于组织与cuff粘连；⑥放置导丝，注意远端留出2cm；⑦切开腹膜、缝合腹膜、置入腹透导管；⑧经腹透管内注入加肝素的生理盐水100ml放水成线，试水成功后缝合；⑨在隧道针牵引下建立皮下隧道，常用Swan-Neck管和Tenckhoff管；⑩缝合皮下脂肪及皮肤，注意不要缝到腹透管。", "explanation": "腹膜透析导管是腹膜透析患者的生命线，选择合适置管位置、使用正确置管方式、建立流畅透析通路是腹膜透析成功的关键。置管步骤依次为消毒、局麻切开皮肤、分离皮下脂肪及肌肉、检查腹透管、处理cuff、放置导丝、置入导管并试水、建立皮下隧道和缝合，各步操作均需保护导管、避免损伤周围组织。"}, {"text": "简述腹透置管术前护理中患者评估、患者宣教与术前准备的主要内容。", "options": [], "answer": "①患者评估：了解患者年龄、教育水平、工作环境、生活环境、卫生习惯、经济条件、医保类型、家庭情况以及周边医疗条件等；评估患者认知能力、自主操作能力及精神状态；讲解血液透析和腹膜透析各自的优缺点以及患者选择腹膜透析的依据；讲明腹膜透析费用及手术方式；了解患者意愿及治疗依从性。②患者宣教：讲解腹膜透原理，介绍常见腹透方式，做好居家治疗物品准备及居家治疗环境要求，告知腹透液的存储方法及注意事项。③术前准备：完善实验室检查，尤其了解有无出血性疾病；术前备皮，范围为剑突下至大腿上三分之一，包括会阴部，两侧到腋前线；术前6小时禁食禁饮，防止术中因麻药引起恶心呕吐而增加腹部张力；进入手术室前排空膀胱，必要时可灌肠；遵医嘱术前预防性使用抗生素。", "explanation": "术前护理的重点是全面评估患者的身心状态与家庭支持条件、做好知识宣教以提高治疗依从性，并完成实验室检查、备皮、禁食禁饮、排空膀胱及预防性用药等术前准备，为置管术安全实施创造条件。"}, {"text": "简述腹膜透析置管术后的常规护理内容。", "options": [], "answer": "腹膜透析置管术后的常规护理包括六个方面：①测量生命体征并记录，给予心电监护、按需吸氧；②评估出口及切口处敷料是否渗血渗液，保持敷料清洁干燥；③评估腹透管路连接情况，确保钛接头与长期管和外接短管紧密连接，妥善固定；④冲洗腹腔，早期冲洗治疗，评估出入量、灌入及引流速度、引流液颜色和性状；⑤饮食护理，肛门排气后进食易消化食物，保持大便通畅；⑥活动护理，鼓励患者术后早期活动。", "explanation": "术后常规护理围绕生命体征监测、导管与切口观察、腹腔冲洗、饮食和活动展开，核心是保持导管通畅与连接牢固、保证敷料清洁干燥、及早发现渗血渗液和引流异常，同时通过饮食与活动管理促进患者恢复。"}, {"text": "简述腹膜透析出口处的分型表现，包括良好出口、可疑感染出口、感染出口（急性与慢性）及隧道炎。", "options": [], "answer": "①良好出口：窦道内潮湿，无渗液，窦道内可见肉芽组织并有部分上皮覆盖，引流物粘稠，2天以上结痂1次，外口颜色淡桔红色。②可疑感染出口：窦道内渗液，外口周围和窦道内肉芽组织轻度增生，引流物粘稠，每日结痂1次，常无疼痛和皮肤变硬，皮肤充血部位直径大于腹透管直径2倍以上。③感染出口（急性）：出口处出现疼痛、红肿，皮肤充血部位直径大于腹透管直径2倍以上，皮肤变硬，有脓性或血性引流物和外生的肉芽组织，窦道表皮收缩，炎症持续时间小于4周。④感染出口（慢性）：窦道内渗液，肉芽组织长出外口或在窦道内异常生长，外口的肉芽组织可覆盖较大的硬壳或血痂，可无疼痛、红肿和皮肤变硬，炎症持续时间大于4周。⑤隧道炎：导管出口上方2.5cm以上、沿导管方向的皮肤出现红、肿、热、痛及分泌物，分泌物培养阳性。", "explanation": "出口处护理需根据局部表现进行分型判断：良好出口无渗液、结痂缓慢且外口呈淡桔红色；可疑感染出口渗液增多、每日结痂且无疼痛；急性感染出口以疼痛、红肿、脓性或血性引流物为特征，炎症持续小于4周；慢性感染出口以肉芽组织异常生长和炎症持续大于4周为特征；隧道炎则以出口上方2.5cm以上沿导管方向的红肿热痛及培养阳性分泌物为特点。分型明确有助于及时采取相应护理或抗感染措施。"}, {"text": "简述腹膜透析置管术后疼痛的常见原因及相应的评估与处理。", "options": [], "answer": "腹膜透析置管术后疼痛的常见原因及处理如下：①手术切口疼痛：疼痛一般较轻，局限在手术切口，咳嗽或腹肌用力时加重，多见于术后24h内，一般无需处理，如患者不能耐受可酌情使用镇痛药。②透析导管尖端液体冲击、导管周围组织张力增加及虹吸作用：放慢进液或放液速度、适当提高腹透液的残余量有利于缓解症状；持续性疼痛、长期得不到缓解可能与导管置入位置过低相关，往往需要拔管重置。③腹透液pH过低或温度过高：疼痛较轻，一般不需特殊处理，可通过碳酸氢钠碱化透析液、适当降低透析液预热温度，或减慢透析液灌入和引流速度逐渐缓解。④透析管周围有网膜或其他组织包裹：可引起腹透液引流时腹腔局部疼痛且逐渐加重，常导致引流不畅，需手术解决。⑤手术损伤腹腔脏器：疼痛剧烈，腹透液浑浊，腹透液细胞数剧增，可伴腹肌紧张、压痛、反跳痛、高热、寒战、血压下降，术后短期内出现，需剖腹探查。⑥腹压增高：应注意肠道状况和透析液出入情况，必要时酌情灌肠或使用缓泻药；轻度疼痛无需处理，严重疼痛在排除腹膜炎后可在腹膜透析液内加入适量利多卡因或普鲁卡因缓解疼痛。", "explanation": "术后疼痛需按原因分类评估与处理：切口疼痛和腹压增高等轻度疼痛多可自行缓解或对症处理；腹透液pH过低或温度过高者以碱化透析液、降低预热温度和减慢灌入引流速度缓解；导管尖端冲击所致者通过放慢速度和提高残余量缓解，长期不缓解需考虑拔管重置；网膜包裹致引流不畅者需手术解决；若疼痛剧烈伴腹透液浑浊、细胞数剧增及腹膜刺激征，提示手术损伤腹腔脏器，需剖腹探查。"}]}]}, {"num": 21, "title": "HD与PD的优势对比理论考试题库", "sections": [{"type": "single", "questions": [{"text": "我国成人慢性肾脏病患者约有多少（  ）", "options": ["A.820万", "B.5200万", "C.8200万", "D.1.2亿", "E.350万"], "answer": "C", "explanation": "我国成人CKD患者约8200万。"}, {"text": "我国成人慢性肾脏病患者中年龄低于60岁者所占比例超过（  ）", "options": ["A.50%", "B.60%", "C.70%", "D.80%", "E.90%"], "answer": "D", "explanation": "我国成人CKD患者约8200万，其中超过80%年龄低于60岁。"}, {"text": "2020年全球终末期肾病患者人数已突破（  ）", "options": ["A.120万", "B.350万", "C.1200万", "D.1450万", "E.8200万"], "answer": "C", "explanation": "2020年全球ESRD患者人数已突破1200万人。"}, {"text": "预计至2030年全球终末期肾病患者人数将达（  ）", "options": ["A.120万", "B.350万", "C.1200万", "D.1450万", "E.8200万"], "answer": "D", "explanation": "预计至2030年全球ESRD患者人数将达1450万。"}, {"text": "中国终末期肾病患者数量位居全球首位，占比接近（  ）", "options": ["A.10%", "B.14%", "C.20%", "D.30%", "E.86%"], "answer": "D", "explanation": "中国ESRD患者数量位居全球首位，占比接近30%。"}, {"text": "中国终末期肾病患者折合现有患者人数达（  ）", "options": ["A.14万", "B.86万", "C.120万", "D.250万", "E.350万"], "answer": "E", "explanation": "中国ESRD占比接近30%，折合现有患者人数达350万。"}, {"text": "2018—2019年我国成人慢性肾脏病患病率为（  ）", "options": ["A.2.3%", "B.4.1%", "C.17.3%", "D.82.7%", "E.8.2%"], "answer": "E", "explanation": "2018—2019年我国成人CKD患病率为8.2%。"}, {"text": "2023年全国在透腹膜透析人数是2012年的（  ）", "options": ["A.1.2倍", "B.2.3倍", "C.4.1倍", "D.8.2倍", "E.14倍"], "answer": "C", "explanation": "根据全国血液净化病例信息登记系统数据，2023年全国在透腹膜透析人数是2012年的4.1倍。"}, {"text": "2023年全国新增腹膜透析人数是2012年的（  ）", "options": ["A.1.2倍", "B.2.3倍", "C.4.1倍", "D.8.2倍", "E.14倍"], "answer": "B", "explanation": "根据全国血液净化病例信息登记系统数据，2023年全国新增腹膜透析人数是2012年的2.3倍。"}, {"text": "2023年中国大陆地区在透腹膜透析患者人数为（  ）", "options": ["A.36605人", "B.61583人", "C.103348人", "D.152745人", "E.736001人"], "answer": "D", "explanation": "中国大陆地区在透腹膜透析患者人数2012年为36605人，2023年增至152745人。"}, {"text": "2019年全国血液净化病例信息登记系统中登记接受透析治疗的患者为（  ）", "options": ["A.261877例", "B.36605例", "C.152745例", "D.736001例", "E.1200万例"], "answer": "D", "explanation": "2019年登记接受透析治疗的患者为736001例；2011年为261877例。"}, {"text": "2019年接受透析治疗的患者中血液透析患者占（  ）", "options": ["A.14%", "B.30%", "C.50%", "D.86%", "E.100%"], "answer": "D", "explanation": "2019年登记接受透析的患者中以血透治疗为主，血液透析患者达86%。"}, {"text": "2019年接受透析治疗的患者中腹膜透析患者占（  ）", "options": ["A.14%", "B.30%", "C.50%", "D.86%", "E.100%"], "answer": "A", "explanation": "2019年登记接受透析的患者中，接受腹膜透析治疗的患者为14%。"}, {"text": "我国透析治疗供需不足问题突出的表现不包括（  ）", "options": ["A.需要更多的床位", "B.需要更大的空间", "C.需要更多的医护人员", "D.需要更多的资金", "E.需要更少的透析中心"], "answer": "E", "explanation": "我国以血透为主，但有限的医疗资源不能满足庞大患者的需求，突出表现为需要更多的床位、更大的空间、更多的医护人员和更多的资金。"}, {"text": "血液透析进行物质交换所借助的半透膜属于（  ）", "options": ["A.化学性半透膜", "B.生物性半透膜", "C.自体腹膜", "D.肾小球滤过膜", "E.肠黏膜"], "answer": "A", "explanation": "血液透析通过化学性半透膜两侧血液和透析液的物质交换，清除血液中的有害物质，调节水、电解质平衡。"}, {"text": "腹膜透析进行溶质交换所借助的半透膜是（  ）", "options": ["A.人工合成膜", "B.铜仿膜", "C.自体腹膜（生物性半透膜）", "D.透析器膜", "E.滤过膜"], "answer": "C", "explanation": "腹膜为生物性半透膜，腹膜透析时腹膜毛细血管内血液和腹腔内腹透液进行广泛溶质交换。"}, {"text": "影响血液透析物质清除效果的主要因素是（  ）", "options": ["A.腹膜的表面积与通透性", "B.透析器的透析面积、透析膜的特性与通透性", "C.弥散、对流与超滤", "D.血压与血钾水平", "E.蛋白质与氨基酸的丢失"], "answer": "B", "explanation": "影响血液透析的主要因素是透析器的透析面积、透析膜的特性和透析膜通透性。"}, {"text": "影响腹膜透析物质清除效果的主要因素是（  ）", "options": ["A.透析器的透析面积与透析膜特性", "B.腹膜的表面积与腹膜的通透性", "C.弥散、对流与超滤", "D.血压与血钾水平", "E.维生素与微量元素的丢失"], "answer": "B", "explanation": "影响腹膜透析的主要因素是腹膜的表面积和腹膜的通透性。"}, {"text": "血液透析的物质清除方式为（  ）", "options": ["A.弥散、对流、超滤", "B.弥散、重吸收、分泌", "C.滤过、重吸收、排泄", "D.吸附、分泌、重吸收", "E.超滤、渗透、重吸收"], "answer": "A", "explanation": "血液透析的清除方式为弥散、对流和超滤。"}, {"text": "关于血液透析与腹膜透析对溶质清除的比较，正确的是（  ）", "options": ["A.血透对中、大分子物质清除优于腹透", "B.血透对小分子物质清除优于腹透", "C.腹透对小分子物质清除优于血透", "D.两者对各类物质清除完全相同", "E.腹透不能清除中分子物质"], "answer": "B", "explanation": "血透对小分子物质的清除优于腹透，对中、大分子物质的清除不及腹透。"}, {"text": "血液透析对中、大分子物质的清除与腹膜透析相比（  ）", "options": ["A.不及腹透", "B.优于腹透", "C.与腹透相同", "D.高效透析时明显优于腹透", "E.完全不能清除"], "answer": "A", "explanation": "血透对小分子物质的清除优于腹透，对中、大分子物质的清除不及腹透。"}, {"text": "分子量为0.06kD的尿素在标准血液透析中的清除值为（  ）", "options": ["A.70", "B.130", "C.250", "D.300", "E.750"], "answer": "B", "explanation": "尿素分子量为0.06kD，其在标准HD的清除值为130，正常肾为750，CAPD为70。"}, {"text": "分子量为0.06kD的尿素在CAPD中的清除值为（  ）", "options": ["A.70", "B.130", "C.250", "D.300", "E.750"], "answer": "A", "explanation": "尿素分子量为0.06kD，其在CAPD的清除值为70，标准HD和高效HD均为130。"}, {"text": "分子量为1.355kD的维生素B12在标准血液透析中的清除值为（  ）", "options": ["A.10", "B.30", "C.40", "D.60", "E.1200"], "answer": "B", "explanation": "维生素B12分子量为1.355kD，其在标准HD的清除值为30，高效HD为60，CAPD为40。"}, {"text": "分子量为5.2kD的菊粉在标准血液透析中的清除值为（  ）", "options": ["A.10", "B.20", "C.40", "D.60", "E.1200"], "answer": "A", "explanation": "菊粉分子量为5.2kD，其在标准HD的清除值为10，高效HD为40，CAPD为20。"}, {"text": "分子量为5.2kD的菊粉在CAPD中的清除值为（  ）", "options": ["A.10", "B.20", "C.40", "D.60", "E.1200"], "answer": "B", "explanation": "菊粉分子量为5.2kD，其在CAPD的清除值为20，标准HD为10，高效HD为40。"}, {"text": "分子量为11.8kD的β2微球蛋白在标准血液透析中的清除值为（  ）", "options": ["A.0", "B.30", "C.60", "D.250", "E.300"], "answer": "A", "explanation": "β2微球蛋白分子量为11.8kD，其在标准HD的清除值为0，高效HD为300，CAPD为250。"}, {"text": "分子量为11.8kD的β2微球蛋白在高效血液透析中的清除值为（  ）", "options": ["A.0", "B.30", "C.60", "D.250", "E.300"], "answer": "E", "explanation": "β2微球蛋白分子量为11.8kD，其在高效HD的清除值为300，标准HD为0，CAPD为250。"}, {"text": "在实施透析治疗后，患者残余肾功能下降最快的时期是血液透析开始后的（  ）", "options": ["A.最初1周", "B.最初1个月", "C.最初6个月", "D.第1年", "E.最初3个月"], "answer": "E", "explanation": "在实施透析治疗后大多数患者的残余肾功能呈下降趋势，血透开始后的最初3个月下降最快。"}, {"text": "血液透析患者共享洗肾机时可能发生的交互感染是（  ）", "options": ["A.乙型、丙型肝炎及艾滋病", "B.结核与梅毒", "C.流感与麻疹", "D.破伤风与狂犬病", "E.单纯疱疹"], "answer": "A", "explanation": "血液透析患者共享洗肾机，有可能交互感染乙型、丙型肝炎、艾滋病等。"}, {"text": "腹膜透析患者每日从腹透液中丢失的蛋白质约为（  ）", "options": ["A.3g", "B.5g", "C.9g", "D.10g", "E.20g"], "answer": "C", "explanation": "腹膜透析患者每日从腹透液中丢失大量蛋白质，约9g。"}, {"text": "腹膜透析患者每日从腹透液中丢失的氨基酸及肽类约为（  ）", "options": ["A.3g", "B.5g", "C.9g", "D.10g", "E.20g"], "answer": "D", "explanation": "腹膜透析患者每日从腹透液中丢失氨基酸及肽类约10g，另丢失各种维生素和微量元素。"}, {"text": "腹膜透析患者应予以高蛋白饮食，每日蛋白质摄入量约为（  ）", "options": ["A.0.6g/kg", "B.0.8g/kg", "C.1.0g/kg", "D.1.2g/kg", "E.1.5g/kg"], "answer": "D", "explanation": "腹膜透析营养不良发生率比血液透析高，因此PD患者应予以高蛋白饮食，约1.2g/kg·d。"}, {"text": "关于腹膜透析与血液透析患者营养不良发生率的比较，正确的是（  ）", "options": ["A.腹膜透析高于血液透析", "B.血液透析高于腹膜透析", "C.两者完全相同", "D.腹膜透析患者不发生营养不良", "E.血液透析患者不发生营养不良"], "answer": "A", "explanation": "腹膜透析营养不良发生率比血液透析高。"}, {"text": "手工腹膜透析的每月费用约为（  ）", "options": ["A.600元", "B.1000元", "C.1500元", "D.2000元", "E.2100元"], "answer": "A", "explanation": "手工腹透约600元/月。"}, {"text": "腹膜透析机（APD）治疗的每月费用约为（  ）", "options": ["A.600元", "B.1000元", "C.1500元", "D.2000元", "E.2100元"], "answer": "E", "explanation": "APD治疗约2100元/月。"}, {"text": "血液透析的每月费用约为（  ）", "options": ["A.600元", "B.1000—2000元", "C.2100元", "D.3000—4000元", "E.5000元以上"], "answer": "B", "explanation": "血透费用约1000—2000元/月。"}, {"text": "非糖尿病肾病患者开始透析治疗的肾小球滤过率指征为（  ）", "options": ["A.＜5ml/min/1.73m²", "B.＜10ml/min/1.73m²", "C.＜15ml/min/1.73m²", "D.＜20ml/min/1.73m²", "E.＜25ml/min/1.73m²"], "answer": "B", "explanation": "慢性肾功能衰竭透析指征中，非糖尿病肾病GFR＜10ml/min/1.73m²。"}, {"text": "糖尿病肾病患者开始透析治疗的肾小球滤过率指征为（  ）", "options": ["A.＜5ml/min/1.73m²", "B.＜10ml/min/1.73m²", "C.＜15ml/min/1.73m²", "D.＜20ml/min/1.73m²", "E.＜25ml/min/1.73m²"], "answer": "C", "explanation": "慢性肾功能衰竭透析指征中，糖尿病肾病GFR＜15ml/min/1.73m²。"}, {"text": "慢性肾衰竭患者可酌情提前开始透析治疗的情况是（  ）", "options": ["A.肾小球滤过率＜5ml/min/1.73m²", "B.容量过多包括急性心力衰竭", "C.腹膜广泛粘连或纤维化", "D.肠梗阻", "E.晚期妊娠"], "answer": "B", "explanation": "当出现严重并发症、经药物治疗等不能有效控制者，如容量过多包括急性心力衰竭、顽固性高血压，可酌情提前开始透析治疗。"}, {"text": "下列属于腹膜透析绝对禁忌证的是（  ）", "options": ["A.肠梗阻", "B.腹部手术三天内", "C.腹膜广泛粘连或纤维化", "D.腹部疝未修补", "E.不合作或精神病患者"], "answer": "C", "explanation": "腹膜广泛粘连或纤维化、腹部或腹膜后手术导致严重腹膜缺损、外科无法修补的疝，均为腹膜透析绝对禁忌证。"}, {"text": "外科无法修补的疝在腹膜透析禁忌证中属于（  ）", "options": ["A.绝对禁忌证", "B.相对禁忌证", "C.非禁忌证", "D.慎用情况", "E.适应证"], "answer": "A", "explanation": "腹膜透析绝对禁忌证包括腹膜广泛粘连或纤维化、腹部或腹膜后手术导致严重腹膜缺损、外科无法修补的疝。"}, {"text": "肠梗阻在腹膜透析禁忌证中属于（  ）", "options": ["A.绝对禁忌证", "B.相对禁忌证", "C.非禁忌证", "D.慎用情况", "E.适应证"], "answer": "B", "explanation": "腹膜透析相对禁忌证包括肠梗阻、腹部疝未修补、腹腔有局限性炎性病灶、腹部手术三天内腹腔置有外科引流管等。"}, {"text": "关于血液透析禁忌证的描述，正确的是（  ）", "options": ["A.血液透析有绝对禁忌证", "B.血液透析无绝对禁忌证，颅内出血等情况应慎用", "C.腹膜广泛粘连者禁忌血液透析", "D.肠梗阻者禁忌血液透析", "E.所有患者均可无限制进行血液透析"], "answer": "B", "explanation": "血液透析无绝对禁忌症，但颅内出血或颅内压增高、药物难以纠正的严重休克等情况应慎用。"}, {"text": "腹膜透析的优点不包括（  ）", "options": ["A.利用自身腹膜，生物相容性好", "B.持续透析，内环境相对稳定", "C.无需血管通路及穿刺", "D.中分子物质清除好", "E.每次治疗均须扎针"], "answer": "E", "explanation": "腹膜透析的优点包括利用自身腹膜、生物相容性好，持续透析、内环境相对稳定、心血管负荷小，无需血管通路及穿刺、无需肝素化，血压血钾控制好、中分子物质清除好，保护残余肾功能等；每次治疗均须扎针是血液透析的特点。"}, {"text": "下列属于血液透析缺点的是（  ）", "options": ["A.快速有效地清除废物和水份", "B.每周需前往洗肾中心2～3次", "C.家中不必准备透析用品", "D.由医疗人员在透析中心执行", "E.便于与医护进行病情交流"], "answer": "B", "explanation": "血液透析的缺点之一是每周需前往洗肾中心2～3次，且须配合医疗院所的透析时间表。"}, {"text": "失衡综合征是哪一种透析方式的常见并发症（  ）", "options": ["A.腹膜透析", "B.血液透析", "C.两者均常见", "D.两者均不发生", "E.仅见于肾移植后"], "answer": "B", "explanation": "血液透析的常见并发症包括血压异常（高/低）、失衡综合征、肾性骨病、营养不良、心血管并发症和透析不充分。"}, {"text": "腹膜炎是哪一种透析方式的常见并发症（  ）", "options": ["A.腹膜透析", "B.血液透析", "C.两者均常见", "D.两者均不发生", "E.仅见于肾移植后"], "answer": "A", "explanation": "腹膜透析的常见并发症包括腹膜炎、营养不良、高血糖、腹疝、腹膜功能衰竭和透析不充分。"}, {"text": "关于腹膜透析与血液透析对肾移植的影响，正确的是（  ）", "options": ["A.腹膜透析明显优于血液透析", "B.血液透析明显优于腹膜透析", "C.两者作为肾移植前准备及移植后效果无明显差距", "D.腹膜透析患者不能接受肾移植", "E.血液透析患者不能接受肾移植"], "answer": "C", "explanation": "腹膜透析与血液透析作为肾移植前准备及移植后的效果无明显差距，肾移植后病人及肾脏的存活与术前透析方式无关。"}, {"text": "终末期肾病患者主要依靠透析治疗维持生命，肾移植难以大规模应用于临床的原因是（  ）", "options": ["A.缺乏有效免疫抑制剂", "B.肾源的困扰", "C.手术费用过高", "D.透析效果优于肾移植", "E.患者不能耐受手术"], "answer": "B", "explanation": "肾移植由于肾源的困扰很难大规模应用于临床，因此绝大多数晚期尿毒症病人还是依靠透析治疗维持生命。"}]}, {"type": "multiple", "questions": [{"text": "我国成人慢性肾脏病的流行病学特点包括（  ）", "options": ["Ａ.患病率为8.2%", "Ｂ.60岁及以上占17.3%", "Ｃ.患者约8200万", "Ｄ.超过80%的患者年龄低于60岁", "Ｅ.患者约350万"], "answer": "ABCD", "explanation": "2018—2019年我国成人CKD患病率为8.2%，60岁及以上占17.3%，患者约8200万，其中超过80%年龄低于60岁；约350万是中国ESRD折合的现有患者人数，不是CKD患者数。"}, {"text": "关于2019年我国透析治疗情况，正确的有（  ）", "options": ["Ａ.登记接受透析的患者为736001例", "Ｂ.血液透析患者达86%", "Ｃ.腹膜透析患者为14%", "Ｄ.2011年接受透析治疗的患者为261877例", "Ｅ.2019年血液透析患者占14%"], "answer": "ABCD", "explanation": "2011年接受透析治疗的患者为261877例；2019年登记接受透析的患者736001例，其中以血透治疗为主、HD患者达86%，接受PD治疗的患者为14%。"}, {"text": "我国透析治疗供需不足问题突出的表现有（  ）", "options": ["Ａ.需要更多的床位", "Ｂ.需要更少的透析中心", "Ｃ.需要更大的空间", "Ｄ.需要更多的医护人员", "Ｅ.需要更多的资金"], "answer": "ACDE", "explanation": "我国以血透为主，有限的医疗资源不能满足庞大患者的需求，主要表现为需要更多的床位、更大的空间、更多的医护人员和更多的资金；减少透析中心不能解决供需不足问题。"}, {"text": "影响血液透析物质清除的因素有（  ）", "options": ["Ａ.透析器的透析面积", "Ｂ.透析膜的特性", "Ｃ.透析膜通透性", "Ｄ.腹膜的表面积", "Ｅ.腹膜的通透性"], "answer": "ABC", "explanation": "影响血液透析的主要因素是透析器的透析面积、透析膜的特性和透析膜通透性；腹膜的表面积和腹膜的通透性是影响腹膜透析的主要因素。"}, {"text": "影响腹膜透析物质清除的因素有（  ）", "options": ["Ａ.透析器的透析面积", "Ｂ.腹膜的表面积", "Ｃ.腹膜的通透性", "Ｄ.透析膜的特性", "Ｅ.透析膜通透性"], "answer": "BC", "explanation": "影响腹膜透析的主要因素是腹膜的表面积和腹膜的通透性；透析器的透析面积、透析膜的特性和透析膜通透性是影响血液透析的主要因素。"}, {"text": "关于血液透析与腹膜透析溶质清除的比较，正确的有（  ）", "options": ["Ａ.血透对小分子物质的清除优于腹透", "Ｂ.血透对中分子物质的清除优于腹透", "Ｃ.腹透对中分子物质的清除优于血透", "Ｄ.腹透对大分子物质的清除优于血透", "Ｅ.两者对各类溶质清除能力完全相同"], "answer": "ACD", "explanation": "血透对小分子物质的清除优于腹透，对中、大分子物质的清除不及腹透，因此腹透对中、大分子物质的清除优于血透；血透对中分子物质的清除并不优于腹透，两者清除能力也不相同。"}, {"text": "关于腹膜透析与血液透析对设备和技术要求的比较，正确的有（  ）", "options": ["Ａ.腹膜透析不需要复杂的设备，技术要求不复杂", "Ｂ.腹膜透析操作容易掌握，可居家行透析治疗", "Ｃ.腹膜透析患者能正常参加工作和社交活动", "Ｄ.血液透析需要特定的专用透析设备，由专门技术的医护人员操作", "Ｅ.血液透析患者参加正常工作完全不受影响"], "answer": "ABCD", "explanation": "腹膜透析不需要复杂的设备、技术要求不复杂、操作容易掌握，可居家行透析治疗并能正常参加工作和社交活动；血液透析需要特定的专用透析设备、由专门技术的医护人员操作并在医院透析中心进行，对参加正常工作有一定影响，故血液透析患者参加正常工作完全不受影响的说法不正确。"}, {"text": "腹膜透析对营养状态的影响包括（  ）", "options": ["Ａ.每日从腹透液中丢失蛋白质约9g", "Ｂ.每日从腹透液中丢失氨基酸及肽类约10g", "Ｃ.每日从腹透液中丢失各种维生素和微量元素", "Ｄ.腹膜透析营养不良发生率比血液透析高", "Ｅ.腹膜透析患者应限制蛋白饮食"], "answer": "ABCD", "explanation": "腹膜透析患者每日从腹透液中丢失大量蛋白质（约9g/d）、氨基酸及肽类（约10g/d）以及各种维生素、微量元素，故腹膜透析营养不良发生率比血液透析高；此类患者应予以高蛋白饮食，而不是限制蛋白饮食。"}, {"text": "腹膜透析的优点包括（  ）", "options": ["Ａ.利用自身腹膜，生物相容性好", "Ｂ.持续透析，内环境相对稳定，心血管负荷小", "Ｃ.无需血管通路及穿刺，无需肝素化，不影响凝血功能", "Ｄ.血压、血钾控制好，中分子物质清除好", "Ｅ.每次治疗均须扎针，需频繁前往医院"], "answer": "ABCD", "explanation": "腹膜透析的优点是利用自身腹膜、生物相容性好，持续透析、内环境相对稳定、心血管负荷小，无需血管通路及穿刺、无需肝素化、不影响凝血功能，血压血钾控制好、中分子物质清除好，生化指标波动小、不发生失衡综合征，操作简单易学、时间地点活动限制少，并保护残余肾功能；每次治疗均须扎针、须前往医院是血液透析的特点。"}, {"text": "腹膜透析的缺点包括（  ）", "options": ["Ａ.清除量有限，超滤量不易控制", "Ｂ.手术放置腹透管并需长期携带", "Ｃ.有感染可能，易发生腹膜炎", "Ｄ.每日均需透析，无休息日", "Ｅ.不需要任何设备，适用于所有患者"], "answer": "ABCD", "explanation": "腹膜透析清除量有限、超滤量不易控制，有时不能达到预期目标；需手术放置腹透管并长期携带；有感染可能、易发生腹膜炎；经透析液丢失蛋白质、氨基酸、维生素，有高血糖、高血脂可能；每日均需透析、无休息日；居家卫生条件要求较高，需存放腹膜透析用品。因此腹膜透析并非不需要设备，也不适用于所有患者。"}, {"text": "血液透析的优点包括（  ）", "options": ["Ａ.快速有效地清除废物和水份", "Ｂ.由医疗人员在透析中心执行", "Ｃ.家中不必准备透析用品", "Ｄ.与其它病人或医护人员接触较频繁，便于进行病情交流", "Ｅ.每次治疗均须扎针"], "answer": "ABCD", "explanation": "血液透析的优点是快速有效地清除废物和水份、由医疗人员在透析中心执行、家中不必准备透析用品、与其它病人或医护人员接触较频繁便于病情交流；每次治疗都须扎针是血液透析的缺点。"}, {"text": "血液透析的缺点包括（  ）", "options": ["Ａ.每周需前往洗肾中心2～3次，须配合透析时间表", "Ｂ.每次治疗都须扎针", "Ｃ.治疗中及治疗后可有抽筋、头晕、恶心等不适及疲倦感", "Ｄ.两次透析之间体内会累积大量毒素和水份", "Ｅ.快速有效地清除体内废物和水份"], "answer": "ABCD", "explanation": "血液透析的缺点包括每周需前往洗肾中心2～3次且须配合透析时间表、每次治疗都须扎针、治疗中及治疗后可有抽筋、头晕、恶心等不适及透析后疲倦感、两次透析之间体内会累积大量毒素和水份、因间歇性清除故饮食限制较严格、透析中水份及血压变化大不利于心肺血管系统、每次治疗均有血液流失使贫血较严重、共享洗肾机有可能交互感染乙型及丙型肝炎和艾滋病等；快速有效地清除废物和水份是其优点。"}, {"text": "血液透析的常见并发症包括（  ）", "options": ["Ａ.血压异常（高/低）", "Ｂ.失衡综合征", "Ｃ.肾性骨病", "Ｄ.腹膜炎", "Ｅ.腹疝"], "answer": "ABC", "explanation": "血液透析的常见并发症包括血压异常（高/低）、失衡综合征、肾性骨病、营养不良、心血管并发症和透析不充分；腹膜炎和腹疝是腹膜透析的常见并发症。"}, {"text": "腹膜透析的常见并发症包括（  ）", "options": ["Ａ.腹膜炎", "Ｂ.失衡综合征", "Ｃ.腹疝", "Ｄ.腹膜功能衰竭", "Ｅ.肾性骨病"], "answer": "ACD", "explanation": "腹膜透析的常见并发症包括腹膜炎、营养不良、高血糖、腹疝、腹膜功能衰竭和透析不充分；失衡综合征和肾性骨病是血液透析的常见并发症。"}, {"text": "腹膜透析的绝对禁忌证包括（  ）", "options": ["Ａ.腹膜广泛粘连或纤维化", "Ｂ.肠梗阻", "Ｃ.腹部或腹膜后手术导致严重腹膜缺损", "Ｄ.外科无法修补的疝", "Ｅ.腹部疝未修补"], "answer": "ACD", "explanation": "腹膜透析绝对禁忌证包括腹膜广泛粘连或纤维化、腹部或腹膜后手术导致严重腹膜缺损、外科无法修补的疝；肠梗阻和腹部疝未修补属于相对禁忌证。"}, {"text": "腹膜透析的相对禁忌证包括（  ）", "options": ["Ａ.腹部手术三天内，腹腔置有外科引流管", "Ｂ.腹腔有局限性炎性病灶", "Ｃ.外科无法修补的疝", "Ｄ.肠梗阻", "Ｅ.严重高分解代谢者"], "answer": "ABDE", "explanation": "腹膜透析相对禁忌证包括腹部手术三天内且腹腔置有外科引流管、腹腔有局限性炎性病灶、肠梗阻、腹部疝未修补、严重炎症性或缺血性肠病、晚期妊娠及腹内巨大肿瘤及巨大多囊肾、严重肺功能不全、严重腹部皮肤感染、长期蛋白质及热量摄入不足所致严重营养不良、严重高分解代谢者、硬化性腹膜炎、不合作或精神病患者；外科无法修补的疝属于绝对禁忌证。"}, {"text": "血液透析无绝对禁忌症，但下列情况应慎用（  ）", "options": ["Ａ.颅内出血或颅内压增高", "Ｂ.药物难以纠正的严重休克", "Ｃ.腹膜广泛粘连或纤维化", "Ｄ.严重心肌病变并有难治性心力衰竭", "Ｅ.活动性出血"], "answer": "ABDE", "explanation": "血液透析无绝对禁忌症，但颅内出血或颅内压增高、药物难以纠正的严重休克、严重心肌病变并有难治性心力衰竭、活动性出血、精神障碍不能配合血液透析治疗等情况应慎用；腹膜广泛粘连或纤维化是腹膜透析的绝对禁忌证。"}, {"text": "关于腹膜透析与血液透析的经济消耗，正确的有（  ）", "options": ["Ａ.血液透析约1000—2000元/月", "Ｂ.手工腹透约600元/月", "Ｃ.APD约2100元/月", "Ｄ.腹膜透析不产生任何费用", "Ｅ.血液透析费用低于手工腹透"], "answer": "ABC", "explanation": "经济消耗比较中，血透约1000—2000元/月，手工腹透约600元/月，APD约2100元/月；腹膜透析同样产生费用，且血液透析费用高于手工腹透。"}, {"text": "慢性肾衰竭肾脏替代治疗的目的包括（  ）", "options": ["Ａ.维持患者生命，恢复工作", "Ｂ.帮助有可逆性因素的慢性肾衰竭急性加重患者渡过危险期", "Ｃ.为肾移植创造条件", "Ｄ.彻底治愈慢性肾衰竭", "Ｅ.替代肾移植成为终末期肾病的首选治疗"], "answer": "ABC", "explanation": "慢性肾衰竭肾脏替代治疗的目的为维持患者生命、恢复工作，帮助有可逆性因素的慢性肾衰竭急性加重患者渡过危险期，以及为肾移植创造条件；透析治疗不能彻底治愈慢性肾衰竭，也不能替代肾移植成为首选治疗。"}, {"text": "关于慢性肾功能衰竭的透析指征，正确的有（  ）", "options": ["Ａ.非糖尿病肾病GFR＜10ml/min/1.73m²", "Ｂ.糖尿病肾病GFR＜15ml/min/1.73m²", "Ｃ.容量过多包括急性心力衰竭者可酌情提前透析", "Ｄ.顽固性高血压经药物治疗不能有效控制者可酌情提前透析", "Ｅ.非糖尿病肾病GFR＜15ml/min/1.73m²时开始透析"], "answer": "ABCD", "explanation": "慢性肾功能衰竭透析指征为非糖尿病肾病GFR＜10ml/min/1.73m²、糖尿病肾病GFR＜15ml/min/1.73m²；当有严重并发症、经药物治疗等不能有效控制者，如容量过多包括急性心力衰竭、顽固性高血压，可酌情提前开始透析治疗。非糖尿病肾病＜15ml/min/1.73m²并非其透析指征。"}]}, {"type": "short", "questions": [{"text": "简述血液透析与腹膜透析在溶质清除方面的比较。", "options": [], "answer": "①物质交换的半透膜：血液透析通过化学性半透膜两侧血液和透析液的物质交换，清除血液中的有害物质，调节水、电解质的平衡，稳定内环境；腹膜为生物性半透膜，腹膜透析时腹膜毛细血管内血液和腹腔内腹透液进行广泛溶质交换。②影响因素：影响血液透析的主要因素是透析器的透析面积、透析膜的特性、透析膜通透性；影响腹膜透析的主要因素是腹膜的表面积、腹膜的通透性。③清除方式：两者均为弥散、对流和超滤。④清除效果：血透对小分子物质的清除优于腹透，对中、大分子物质的清除不及腹透。", "explanation": "血液透析以化学性半透膜为交换界面，腹膜透析以生物性半透膜（腹膜）为交换界面，两者的清除方式均为弥散、对流和超滤。血透清除效果受透析器透析面积、透析膜特性及通透性影响，腹透清除效果受腹膜表面积及通透性影响。就溶质分子量而言，血透清除小分子优于腹透，清除中、大分子则不及腹透。"}, {"text": "简述腹膜透析的优点与缺点。", "options": [], "answer": "①优点：利用自身腹膜，生物相容性好；持续透析，内环境相对稳定，心血管负荷小；无需血管通路及穿刺，无需肝素化，不影响凝血功能；血压、血钾控制好；中分子物质清除好；生化指标波动小，不发生失衡综合征；操作简单易学，时间、地点、活动限制少；保护残余肾功能。②缺点：腹膜透析清除量有限，超滤量不易控制，有时不能达到预期目标；手术放置腹透管并需长期携带；有感染可能性，易发生腹膜炎；经透析液丢失蛋白质、氨基酸、维生素，有高血糖、高血脂的可能；每日均需透析，无休息日；居家卫生条件要求较高，需存放腹膜透析用品。", "explanation": "腹膜透析的优点集中在生物相容性好、内环境稳定、无需血管通路和肝素化、中分子清除好、操作简便并保护残余肾功能；缺点集中在清除量有限、需长期携带腹透管、易发生腹膜炎、营养成分丢失、每日均需透析以及居家卫生与用品存放要求较高。"}, {"text": "简述血液透析的优点与缺点。", "options": [], "answer": "①优点：快速有效地清除废物和水份；由医疗人员在透析中心执行；家中不必准备透析用品；与其它病人或医护人员间的接触较为频繁，便于进行病情交流。②缺点：每周需前往洗肾中心2～3次，且须配合医疗院所的透析时间表；每次治疗都须扎针；透析治疗中及治疗后可能会有抽筋、头晕、恶心等不适及透析后的疲倦感；两次透析之间体内会累积大量毒素和水份；由于是间歇性清除体内废物及水份，饮食限制较为严格；透析当中体内水份及血压变化大，长期下来较不利于心肺血管系统；每次治疗均有血液流失，贫血情形较严重；共享洗肾机，有可能交互感染乙型、丙型肝炎、艾滋病等。", "explanation": "血液透析的优点是清除废物和水份快速有效、由医护人员在透析中心执行、家中不必准备透析用品并与医护接触频繁；缺点是需每周前往洗肾中心2～3次并受时间表限制、每次均须扎针、治疗中及治疗后可有抽筋、头晕、恶心及疲倦感、透析间期毒素与水份累积、饮食限制严格、水份及血压变化大不利于心肺血管系统、每次治疗均有血液流失使贫血较重、共享洗肾机可能交互感染乙型及丙型肝炎和艾滋病等。"}, {"text": "简述腹膜透析的绝对禁忌证和相对禁忌证。", "options": [], "answer": "①绝对禁忌证：腹膜广泛粘连或纤维化；腹部或腹膜后手术导致严重腹膜缺损；外科无法修补的疝。②相对禁忌证：腹部手术三天内，腹腔置有外科引流管；腹腔有局限性炎性病灶；肠梗阻；腹部疝未修补；严重炎症性或缺血性肠病；晚期妊娠、腹内巨大肿瘤及巨大多囊肾；严重肺功能不全；严重腹部皮肤感染；长期蛋白质及热量摄入不足所致严重营养不良者；严重高分解代谢者；硬化性腹膜炎；不合作或精神病患者。", "explanation": "腹膜透析绝对禁忌证为腹膜广泛粘连或纤维化、腹部或腹膜后手术导致严重腹膜缺损、外科无法修补的疝；相对禁忌证共12项，涉及腹腔引流、腹腔局限性炎性病灶、肠梗阻、未修补腹部疝、严重炎症性或缺血性肠病、晚期妊娠及腹内巨大肿瘤和巨大多囊肾、严重肺功能不全、严重腹部皮肤感染、严重营养不良、严重高分解代谢、硬化性腹膜炎以及不合作或精神病患者。血液透析无绝对禁忌症，仅部分情况慎用。"}, {"text": "简述慢性肾衰竭肾脏替代治疗的目的、透析指征及一体化治疗理念。", "options": [], "answer": "①治疗目的：维持患者生命，恢复工作；对有可逆性因素的慢性肾衰竭急性加重患者帮助其渡过危险期；为肾移植创造条件。②透析指征：非糖尿病肾病GFR＜10ml/min/1.73m²；糖尿病肾病GFR＜15ml/min/1.73m²；当有严重并发症、经药物治疗等不能有效控制者，如容量过多包括急性心力衰竭、顽固性高血压，可酌情提前开始透析治疗。③一体化治疗理念：尽早专科治疗，适时透析；了解透析有不同方式以及其优缺点，让患者知情后自由选择；随着残余肾功能逐步减退，逐渐增加透析剂量以替代残余肾功能不足；随着透析时间延长，选择合适的透析方法，腹透与血透相互转换；有条件进行肾移植；移植失败或移植肾功能不全时再行透析。", "explanation": "慢性肾衰竭肾脏替代治疗以维持生命、恢复工作、帮助有可逆因素的急性加重患者渡过危险期并为肾移植创造条件为目的。透析指征按是否为糖尿病肾病区分为GFR＜10ml/min/1.73m²和＜15ml/min/1.73m²，出现容量过多包括急性心力衰竭、顽固性高血压等药物难以控制的情况时可酌情提前透析。一体化治疗强调适时透析、患者知情选择、按残余肾功能调整透析剂量、腹透与血透相互转换以及为肾移植创造条件。"}]}]}, {"num": 22, "title": "移植物血管通路相关知识理论考试题库", "sections": [{"type": "single", "questions": [{"text": "维持性血液透析患者的生命线是", "options": ["A.血管通路", "B.血管通路隧道", "C.人工血管移植物", "D.动静脉内瘘吻合口", "E.透析穿刺针"], "answer": "A", "explanation": "血管通路是维持性血液透析患者的生命线，良好的血管通路是血液透析顺利进行的基础。血液净化是终末期肾脏病及其它重症疾病的主要治疗方法。"}, {"text": "人工血管（AVG）成熟时间较短，但至少需要多长时间以保证伤口愈合及移植物与周围组织粘连", "options": ["A.7天", "B.10天", "C.14天", "D.21天", "E.28天"], "answer": "C", "explanation": "人工血管（AVG）成熟时间短，但至少需要14天以保证伤口愈合及移植物与周围组织粘连。"}, {"text": "下列属于人工血管（AVG）优点的是", "options": ["A.潜在的血栓发生率", "B.成熟时间短", "C.使用寿命较自体动静脉内瘘短", "D.排异反应", "E.费用高"], "answer": "B", "explanation": "人工血管的优点包括提供的穿刺面积大、成熟时间短（至少需要14天）、穿刺部位多；其缺点包括潜在的血栓发生率、潜在的感染发生率、使用寿命较自体动静脉内瘘短、排异反应和费用高。"}, {"text": "人工血管的研究大致经历了几个发展阶段", "options": ["A.2个", "B.3个", "C.4个", "D.5个", "E.6个"], "answer": "C", "explanation": "人工血管的研究大致经历4个发展阶段，即生物组织型、合成型、生物混合型和组织工程型人工血管。"}, {"text": "1952年首先研究将维纶制成人造血管、改变以往人工血管管壁无通透性的学者是", "options": ["A.Voorhees", "B.William Gore", "C.Herring", "D.Wesolow", "E.Blakemore"], "answer": "A", "explanation": "1952年Voorhees首先研究将维纶制成人造血管，改变了以往人工血管管壁的无通透性。"}, {"text": "1970年首次尝试种植内皮细胞实验、为临床内皮细胞种植开创先河的学者是", "options": ["A.Voorhees", "B.Herring", "C.Wesolow", "D.Mansifield", "E.Jaretzki"], "answer": "D", "explanation": "1970年Mansifield等首次尝试了种植内皮细胞实验，为临床内皮细胞的种植开创了先河。"}, {"text": "涤纶人工血管在使用前需要进行下列哪项处理", "options": ["A.预凝", "B.肝素盐水浸泡", "C.高压蒸汽灭菌", "D.酒精消毒", "E.无需任何处理"], "answer": "A", "explanation": "涤纶与周围组织反应较强，血小板凝集的范围大，抗血栓形成性较低，生物相容性差，炎性反应重，因此常用作大、中口径的动脉移植，使用前需要预凝。"}, {"text": "关于膨体聚四氟乙烯（ePTFE）人工血管，下列说法正确的是", "options": ["A.使用前必须预凝", "B.使用前不必预凝", "C.抗血栓性低于涤纶", "D.顺应性良好", "E.生物相容性差"], "answer": "B", "explanation": "膨体聚四氟乙烯（ePTFE）人工血管使用前不必预凝，比其他血管具有更大的抗血栓性，与周围组织反应较轻，能承受压力、血管通畅、能耐受反复穿刺、使用时间长，但顺应性较差、通畅率较低。"}, {"text": "ePTFE材料可承受的温度变化范围是", "options": ["A.-40℃至+80℃", "B.-100℃至+150℃", "C.-240℃至+270℃", "D.-180℃至+200℃", "E.0℃至+100℃"], "answer": "C", "explanation": "ePTFE材料具有极好的可弯曲性，便于手术操作，可承受-240℃至+270℃的温度变化。"}, {"text": "ePTFE材料的平均纤维间隙为", "options": ["A.5～10微米", "B.10～15微米", "C.16～20微米", "D.22～25微米", "E.30～40微米"], "answer": "D", "explanation": "ePTFE为惰性化合物，安全、无排异反应，其平均纤维间隙为22～25微米。"}, {"text": "人工血管类型中，普通型标准壁血管的代号是", "options": ["A.V", "B.T", "C.S", "D.RR", "E.IR"], "answer": "A", "explanation": "人工血管类型代号中，普通型标准壁血管为V，薄壁血管为T，延展性血管为S，外环血管为RR，内环血管INTERING为IR。"}, {"text": "人工血管类型中，肝素化血管（PROPATEN）的代号是", "options": ["A.V", "B.S", "C.RR", "D.H", "E.ECH"], "answer": "D", "explanation": "人工血管类型代号中，肝素化血管PROPATEN的代号为H，硅胶血管ACUSEAL的代号为ECH，外环血管的代号为RR。"}, {"text": "AVG的使用寿命是", "options": ["A.≥6个月", "B.≥1年", "C.≥2年", "D.≥3年", "E.≥5年"], "answer": "C", "explanation": "AVG并发症及通畅性控制情况为：血栓＜0.5次/患者年，感染发生率≤10%，使用寿命≥2年，PTA术后使用寿命≥4个月。"}, {"text": "硅胶人工血管采用三层设计，其血管中层为", "options": ["A.硅胶层", "B.膨体聚四氟乙烯层", "C.涤纶层", "D.肝素涂层", "E.胶原层"], "answer": "A", "explanation": "硅胶人工血管为三层设计：血管外层为膨体聚四氟乙烯（ePTFE），血管中层为硅胶层，血管内层为膨体聚四氟乙烯（ePTFE）并采用CBAS肝素绑定技术。"}, {"text": "人工血管通路的手术建立时机之一是预计多久内需进入血液透析治疗", "options": ["A.1个月内", "B.3个月内", "C.半年内", "D.1年内", "E.2年内"], "answer": "C", "explanation": "人工血管通路的手术建立时机包括：当预计半年内需进入血液透析治疗；人工血管可在透析前3～6周建立；即穿型人工血管则可推迟至需要接受透析治疗前数小时至数天。"}, {"text": "前臂直型AVG初始建立的失败率是", "options": ["A.＜5%", "B.＜10%", "C.＜15%", "D.＜20%", "E.＜25%"], "answer": "C", "explanation": "初始建立AVG的失败率为：前臂直型AVG＜15%，前臂袢型AVG＜10%，上臂AVG＜5%。"}, {"text": "前臂袢型AVG初始建立的失败率是", "options": ["A.＜5%", "B.＜10%", "C.＜15%", "D.＜20%", "E.＜25%"], "answer": "B", "explanation": "初始建立AVG的失败率为：前臂直型AVG＜15%，前臂袢型AVG＜10%，上臂AVG＜5%。"}, {"text": "上臂AVG初始建立的失败率是", "options": ["A.＜3%", "B.＜5%", "C.＜10%", "D.＜15%", "E.＜20%"], "answer": "B", "explanation": "初始建立AVG的失败率为：前臂直型AVG＜15%，前臂袢型AVG＜10%，上臂AVG＜5%。"}, {"text": "AVG并发症中血栓的发生率为", "options": ["A.＜0.5次/患者年", "B.＜1次/患者年", "C.1～2次/患者年", "D.2～3次/患者年", "E.＜0.1次/患者年"], "answer": "A", "explanation": "AVG并发症及通畅性控制情况为：血栓＜0.5次/患者年，感染发生率≤10%，使用寿命≥2年，PTA术后使用寿命≥4个月。"}, {"text": "AVG感染的发生率是", "options": ["A.≤5%", "B.≤10%", "C.≤15%", "D.≤20%", "E.≤30%"], "answer": "B", "explanation": "AVG并发症及通畅性控制情况为：血栓＜0.5次/患者年，感染发生率≤10%，使用寿命≥2年，PTA术后使用寿命≥4个月。"}, {"text": "AVG行PTA术后的使用寿命为", "options": ["A.≥1个月", "B.≥2个月", "C.≥4个月", "D.≥6个月", "E.≥12个月"], "answer": "C", "explanation": "AVG并发症及通畅性控制情况为：血栓＜0.5次/患者年，感染发生率≤10%，使用寿命≥2年，PTA术后使用寿命≥4个月。"}, {"text": "人工血管内瘘穿刺前评估中，判断成熟一般指手术后多长时间且水肿、红肿消退", "options": ["A.1～2周", "B.2～4周", "C.4～6周", "D.6～8周", "E.8～12周"], "answer": "B", "explanation": "人工血管内瘘穿刺前评估的成熟标准为手术后2～4周、水肿和红肿消退；即穿型AVG可在术后数小时至数天进行穿刺。"}, {"text": "评估人工血管内瘘走向时，阻断血流后搏动较强的一端是", "options": ["A.动脉端", "B.静脉端", "C.静脉分支", "D.U形转弯处", "E.吻合口"], "answer": "A", "explanation": "判断人工血管内瘘走向时可依据手术图、B超和听诊血管杂音；阻断血流后搏动较强的一端为动脉端（A端）。"}, {"text": "人工血管成熟之后触诊的特点是", "options": ["A.搏动明显增强", "B.很难感觉搏动，应注重听诊器的使用", "C.触诊结果与自体动静脉内瘘一致", "D.完全不能触及", "E.只需触诊即可判断"], "answer": "B", "explanation": "在人工血管成熟之后触摸很难感觉搏动，应注重听诊器的使用，及时判断血管的状况是维护内瘘正常使用或及时修复的关键；吻合口更为关键，护士和患者应更关心吻合口处的搏动。"}, {"text": "若无法获得人工血管内瘘的解剖图，判断动脉端的方法是", "options": ["A.在移植物中段暂时阻断血流，仍有脉搏的一段为动脉端", "B.在移植物中段暂时阻断血流，无脉搏的一段为动脉端", "C.按压静脉端观察回血", "D.听诊杂音最弱处为动脉端", "E.观察皮肤颜色变化"], "answer": "A", "explanation": "穿刺方向判断应请建立血管通路的外科医生或超声医生画出内瘘的结构图，了解血管的走向和深度；如果得不到解剖图，可以在移植物中段暂时阻断血流，仍然有脉搏的一段是动脉端。"}, {"text": "人工血管内瘘初次穿刺时间一般在术后", "options": ["A.数小时", "B.1周", "C.2～4周", "D.6～8周", "E.3个月"], "answer": "C", "explanation": "人工血管内瘘初次穿刺时间取决于医生的判断力，一般在术后2～4周之后开始初次穿刺。"}, {"text": "人工血管（移植物AV内瘘）的穿刺角度一般为", "options": ["A.15度", "B.25度", "C.30度", "D.45度", "E.90度"], "answer": "D", "explanation": "穿刺时以45度角穿刺血管移植物AV内瘘，以25度角穿刺自体AV内瘘；小角度导致血管损伤明显，而大角度可能穿透血管或移植物。"}, {"text": "人工血管内瘘同一血管两针穿刺，两针应相距", "options": ["A.2cm以上", "B.3cm以上", "C.5cm以上", "D.8cm以上", "E.10cm以上"], "answer": "C", "explanation": "穿刺点要求同一血管两针相距＞5cm；穿刺部位采用阶梯式、距吻合口＞5cm，避开U形转弯部位，每次穿刺点距上次1cm。"}, {"text": "以45度角进针穿刺人工血管的主要好处是", "options": ["A.产生皮瓣效应，减少穿刺点出血", "B.减少再循环", "C.降低感染发生率", "D.增加血流量", "E.减轻穿刺疼痛"], "answer": "A", "explanation": "以45度角进针能够产生一种皮瓣效应，当穿刺针拔出后，发挥类似瓣膜的功能，以减少穿刺点的出血。"}, {"text": "不建议以直角进针穿刺人工血管的原因是", "options": ["A.不能形成有效皮瓣，有可能损伤血管后壁", "B.容易损伤人造血管前壁", "C.穿刺时疼痛明显", "D.容易造成感染", "E.影响透析血流量"], "answer": "A", "explanation": "穿刺时不建议角度过于平行，容易损伤人造血管前壁；也不建议直角进针，因为不能形成有效皮瓣，有可能损伤血管后壁。"}, {"text": "人工血管内瘘的静脉穿刺针应如何置入", "options": ["A.与静脉血流相同方向，指向心脏", "B.与静脉血流相反方向", "C.与动脉穿刺针方向相同", "D.垂直于血管壁", "E.任意方向均可"], "answer": "A", "explanation": "静脉穿刺针应该置入与静脉血流相同的方向、指向心脏，一方面可以防止血液回流，另一方面可以按正常方式引导静脉血流；动脉穿刺针头可以同血流方向一致，也可以相反置入。"}, {"text": "目前被认为最安全、使用时间最长的穿刺方法是", "options": ["A.绳梯式", "B.纽扣眼式", "C.区域式", "D.单点反复穿刺", "E.任意式"], "answer": "A", "explanation": "绳梯式穿刺对血管长度和管径要求较高，是目前最安全、使用时间最长的穿刺方法；纽扣眼穿刺法穿刺点固定，对无菌技术及术后压迫要求高。"}, {"text": "人工血管内瘘穿刺时，靠近动、静脉吻合口多少距离内不宜穿刺", "options": ["A.1厘米", "B.2厘米", "C.3厘米", "D.5厘米", "E.7厘米"], "answer": "C", "explanation": "不断改换穿刺点是永恒不变的法则：靠近动、静脉吻合口3厘米不宜穿刺，瘘管弧形转弯部位不宜穿刺，每次穿刺点的选择相距1cm为宜，往复循环使用。"}, {"text": "人工血管内瘘透析结束后，用棉球或纱布轻压至出血完全消失，所需时间通常为", "options": ["A.5～10分钟", "B.10～15分钟", "C.20～30分钟", "D.30～40分钟", "E.1小时以上"], "answer": "C", "explanation": "血液透析完成之后应小心地将穿刺针拔出，用手指压住伤口止血，用棉球或纱布轻压直至出血情况完全消失，通常需要20到30分钟。"}, {"text": "人工血管内瘘透析结束后拔针按压止血，正确的按压部位是", "options": ["A.轻压人工血管的位置而非皮肤的位置", "B.只压皮肤穿刺点", "C.按压静脉吻合口", "D.按压动脉端搏动处", "E.用力压紧皮肤即可"], "answer": "A", "explanation": "拔针后用手指压住伤口止血，用柔和的压力轻压人工血管的位置而非皮肤的位置，将能有效地止血；压力的大小极为关键，既要使皮肤穿刺点不出血，又不至于用力过大压迫血管造成血栓。"}, {"text": "人工血管动静脉内瘘失功的主要原因（约占80%）是", "options": ["A.血栓形成及狭窄", "B.感染", "C.假性动脉瘤形成", "D.肿胀手综合征", "E.心力衰竭"], "answer": "A", "explanation": "血栓形成及狭窄是人工血管动静脉内瘘失功的主要原因，约占80%；其中90%是静脉吻合口内膜增生和吻合口近端静脉狭窄导致。"}, {"text": "人工血管动静脉内瘘失功中，静脉吻合口内膜增生和吻合口近端静脉狭窄约占", "options": ["A.50%", "B.70%", "C.80%", "D.90%", "E.100%"], "answer": "D", "explanation": "血栓形成及狭窄是人工血管动静脉内瘘失功的主要原因，约占80%，其中90%是静脉吻合口内膜增生和吻合口近端静脉狭窄导致。"}, {"text": "人工血管内瘘狭窄的处理指征之一是狭窄超过内瘘内径的", "options": ["A.20%", "B.30%", "C.50%", "D.70%", "E.80%"], "answer": "C", "explanation": "狭窄超过内瘘内径的50%并伴物理检查异常（同AVF）、自然血流量减少（＜600ml/min）、内瘘静脉压升高等异常时应处理。"}, {"text": "人工血管内瘘狭窄处理指征中，自然血流量减少的判断值是", "options": ["A.＜200ml/min", "B.＜400ml/min", "C.＜600ml/min", "D.＜800ml/min", "E.＜1000ml/min"], "answer": "C", "explanation": "人工血管内瘘狭窄的处理指征包括自然血流量减少（＜600ml/min）、内瘘静脉压升高以及物理检查异常（同AVF）。"}, {"text": "AVG闭塞分期中，急性期指闭塞时间在", "options": ["A.6h以内", "B.12h以内", "C.24h以内", "D.48h以内", "E.72h以内"], "answer": "C", "explanation": "根据闭塞原因、时间及处理方法特点，将AVG闭塞分为急性期、早期、晚期，其中急性期为24h以内，早期为7d以内，晚期为7d以上。"}, {"text": "尿激酶溶栓治疗人工血管内瘘血栓的成功率可达", "options": ["A.50%～60%", "B.60%～70%", "C.70%～78.57%", "D.80%～90%", "E.90%以上"], "answer": "C", "explanation": "尿激酶溶栓治疗目前是药物溶栓的常用方法，成功率可达70%～78.57%；24h以内的新鲜血栓首选局部应用尿激酶溶栓治疗，溶栓效果较好，操作简便、迅速，可床旁随时进行。"}, {"text": "人工血管内瘘药物溶栓时，尿激酶的用量及稀释后体积为", "options": ["A.10万U稀释至50ml", "B.20万U稀释至50ml", "C.30万U稀释至50ml", "D.20万U稀释至100ml", "E.50万U稀释至100ml"], "answer": "B", "explanation": "药物溶栓操作方法为：选择人工血管近动脉吻合口端，超声引导下用穿刺针以30°～45°角穿刺，针尖斜面向上，逆血流方向进针；用尿激酶20万U加入0.9%NaCl注射液稀释至50ml，经静脉推注泵缓慢推注。"}, {"text": "人工血管内瘘溶栓过程中，出现下列哪种情况应停用尿激酶", "options": ["A.血浆纤维蛋白原＜1.0g/L", "B.血浆纤维蛋白原＞3.0g/L", "C.血小板计数升高", "D.血清钾升高", "E.体温升高"], "answer": "A", "explanation": "出现以下情况应停用尿激酶：穿刺点出血或血肿、全身出血如牙龈出血、皮肤淤血淤斑、消化道出血、血浆纤维蛋白原＜1.0g/L等。"}, {"text": "人工血管内瘘假性动脉瘤的发生率是", "options": ["A.1%～2%", "B.2%～10%", "C.10%～15%", "D.15%～20%", "E.20%～30%"], "answer": "B", "explanation": "假性动脉瘤是在同一部位反复穿刺导致管壁变薄形成的，发生率为2%～10%，也可由手术吻合口出血引起。"}, {"text": "人工血管动静脉内瘘最难处理的并发症是", "options": ["A.感染", "B.血栓形成", "C.狭窄", "D.假性动脉瘤", "E.血清肿"], "answer": "A", "explanation": "感染是人工血管动静脉内瘘最难处理的并发症，一般为严重的混合致病菌感染；发生感染时全用抗生素并局部加强引流，感染控制后继续使用，感染无法控制时需要取出人工血管。"}, {"text": "血浆通过人工血管壁超滤、在人工血管周围非分泌性假膜内集聚的无菌性清亮液体，呈“果冻样”，称为", "options": ["A.血清肿", "B.假性动脉瘤", "C.血肿", "D.淋巴囊肿", "E.脓肿"], "answer": "A", "explanation": "血清肿是血浆通过人工血管壁超滤，在人工血管周围非分泌性假膜内的无菌性清亮液体的集聚，呈“果冻样”。"}, {"text": "人工血管内瘘肿胀手综合征的原因包括回流障碍、静脉分支和", "options": ["A.近心端狭窄", "B.低血压", "C.自然血流量减少", "D.感染", "E.血栓形成"], "answer": "A", "explanation": "肿胀手综合征的原因分析包括回流障碍、静脉分支和近心端狭窄；处理方式包括观察、球囊扩张、支架和重新建立通路。"}, {"text": "人工血管内瘘导致心力衰竭时，正确的处理方式是", "options": ["A.换用其他的透析方式，如腹透、半永久深静脉置管透析", "B.加大透析血流量", "C.继续使用并定期观察", "D.局部加压包扎", "E.口服降压药"], "answer": "A", "explanation": "人工血管内瘘可使回心血量增加、前负荷增加，从而导致心力衰竭；处理方式是换用其他的透析方式，如腹透、半永久深静脉置管透析。"}, {"text": "下列属于人工血管内瘘血栓形成、闭塞原因的是", "options": ["A.透析后穿刺点压迫用力过度过久", "B.穿刺点相距1cm", "C.采用绳梯式穿刺", "D.透析前用肥皂清洗皮肤", "E.每天触摸通路震颤"], "answer": "A", "explanation": "人工血管内瘘血栓形成、闭塞的原因包括压迫（透析后穿刺点压迫用力过度过久）、低血压、感染和内膜增生。"}, {"text": "人工血管内瘘患者教育中，关于穿刺部位皮肤护理正确的是", "options": ["A.每天透析前用肥皂清洗穿刺部位皮肤", "B.每周透析前清洗一次皮肤", "C.穿刺前用酒精长时间浸泡", "D.穿刺前不必清洁皮肤", "E.穿刺后立即用肥皂清洗"], "answer": "A", "explanation": "人工血管内瘘患者教育基础包括透析结束后如何压迫穿刺点、每天透析前用肥皂清洗穿刺部位皮肤、了解通路感染的症状和体征等。"}]}, {"type": "multiple", "questions": [{"text": "人工血管（AVG）的优点包括", "options": ["Ａ.提供的穿刺面积大", "Ｂ.成熟时间短", "Ｃ.穿刺部位多", "Ｄ.潜在的血栓发生率", "Ｅ.潜在的感染发生率"], "answer": "ABC", "explanation": "人工血管的优点包括提供的穿刺面积大、成熟时间短（但至少需要14天保证伤口愈合及移植物与周围组织粘连）和穿刺部位多；潜在的血栓发生率和潜在的感染发生率属于人工血管的缺点。"}, {"text": "人工血管（AVG）的缺点包括", "options": ["Ａ.潜在的血栓发生率", "Ｂ.潜在的感染发生率", "Ｃ.提供的穿刺面积大", "Ｄ.排异反应", "Ｅ.成熟时间短"], "answer": "ABD", "explanation": "人工血管的缺点包括潜在的血栓发生率、潜在的感染发生率、使用寿命较自体动静内瘘短、排异反应和费用高；提供的穿刺面积大和成熟时间短属于其优点。"}, {"text": "自体透析通路（内瘘）面临的问题包括", "options": ["Ａ.透析龄增长，可用的自体透析通路无法满足穿刺的需要", "Ｂ.老年人血管条件差", "Ｃ.血管钙化、内膜增生狭窄、静脉瘤等并发症", "Ｄ.人工血管费用高", "Ｅ.人工血管存在排异反应"], "answer": "ABC", "explanation": "内瘘面临的问题包括透析龄增长使可用的自体透析通路无法满足穿刺的需要、老年人血管条件差以及血管钙化、内膜增生狭窄、静脉瘤等并发症；费用高和排异反应是人工血管自身的缺点，不属于内瘘面临的问题。"}, {"text": "人工血管研究的背景及意义包括", "options": ["Ａ.心血管疾病是世界三大杀手之一", "Ｂ.外伤、动脉硬化和心脑血管疾病等引起的血管损伤单纯药物无法痊愈", "Ｃ.自身的血管很难成为移植替代血管，与血管大小、自带病症、数量限制有关", "Ｄ.同种异体或异种血管排异反应强烈", "Ｅ.人工血管不会发生血栓和感染"], "answer": "ABCD", "explanation": "人工血管研究的背景为心血管疾病是世界三大杀手之一，外伤、动脉硬化和心脑血管疾病等原因引起的血管损伤单纯药物无法痊愈，自身血管因血管大小、自带病症和数量限制很难成为移植替代血管，同种异体或异种血管排异反应强烈，因此通过人工手段构建血管是目前主要的解决方法；人工血管存在潜在的血栓发生率和潜在的感染发生率，不会发生血栓和感染这一说法错误。"}, {"text": "人工血管的研究大致经历的发展阶段包括", "options": ["Ａ.生物组织型", "Ｂ.合成型", "Ｃ.生物混合型", "Ｄ.组织工程型", "Ｅ.金属管型"], "answer": "ABCD", "explanation": "人工血管的研究大致经历4个发展阶段，即生物组织型、合成型、生物混合型和组织工程型人工血管；20世纪初各国学者曾首先采用金属、玻璃、聚乙烯、硅橡胶等材料制成管状物，但金属管型并不是人工血管研究的发展阶段。"}, {"text": "关于涤纶人工血管的特点，下列描述正确的是", "options": ["Ａ.与周围组织反应较强", "Ｂ.血小板凝集的范围大", "Ｃ.抗血栓形成性较低", "Ｄ.生物相容性好", "Ｅ.使用前需要预凝"], "answer": "ABCE", "explanation": "涤纶与周围组织反应较强，血小板凝集的范围大，抗血栓形成性较低，生物相容性差，炎性反应重，因此常用作大、中口径的动脉移植，使用前需要预凝；涤纶的生物相容性差，生物相容性好这一描述错误。"}, {"text": "关于膨体聚四氟乙烯（ePTFE）人工血管的特点，下列描述正确的是", "options": ["Ａ.使用前不必预凝", "Ｂ.比其他血管具有更大的抗血栓性", "Ｃ.与周围组织反应较轻", "Ｄ.能耐受反复穿刺，使用时间长", "Ｅ.顺应性好，通畅率高"], "answer": "ABCD", "explanation": "膨体聚四氟乙烯人工血管使用前不必预凝，比其他血管具有更大的抗血栓性，与周围组织反应较轻，能承受压力、血管通畅、能耐受反复穿刺、使用时间长，但顺应性较差、通畅率较低；顺应性好且通畅率高这一描述错误。"}, {"text": "ePTFE材料的理化特性和显微结构包括", "options": ["Ａ.高强度，植入安全可靠", "Ｂ.带负电性，具有无沾粘特性", "Ｃ.极好的可弯曲性，便于手术操作", "Ｄ.可承受-240℃至+270℃的温度变化", "Ｅ.表面粗糙，以增加血栓附着"], "answer": "ABCD", "explanation": "ePTFE材料具有高强度、带负电性（无沾粘特性，抵抗血栓的形成）、极好的可弯曲性、可承受-240℃至+270℃温度变化、平整光滑的表面（减少血栓附着）和良好的生物相容性；其表面平整光滑以减少血栓附着，表面粗糙以增加血栓附着这一说法错误。"}, {"text": "理想的人造血管应具备的条件包括", "options": ["Ａ.具备良好的组织相容性和血液相容性", "Ｂ.与宿主健康血管相近似的动力学性能", "Ｃ.不易形成血栓，长期保持通畅", "Ｄ.耐受血管内压力，不易形成动脉瘤", "Ｅ.受压后容易变形或扭折成角"], "answer": "ABCD", "explanation": "理想的人造血管应具备良好的组织相容性和血液相容性、与宿主健康血管相近似的动力学性能、能与所替代的血管愈合成一体并有血管内膜长入、不易形成血栓而长期保持通畅、不易发生退行性改变、耐受血管内压力而不易形成动脉瘤、受压后不易变形或扭折成角、不引起异物反应或排斥反应、抗感染、缝合容易且不易撕裂、能选择不同的口径和长度；受压后容易变形或扭折成角与其要求相反。"}, {"text": "人工血管通路手术建立时应注意的事项包括", "options": ["Ａ.无菌观念，可预防性使用抗生素", "Ｂ.路径的设计", "Ｃ.血管的选择", "Ｄ.隧道的建立", "Ｅ.无须用自体组织覆盖"], "answer": "ABCD", "explanation": "人工血管通路手术注意事项包括无菌观念（可预防性使用抗生素）、路径的设计、血管的选择、隧道的建立和自体组织的覆盖；需要自体组织覆盖人工血管，无须用自体组织覆盖这一说法错误。"}, {"text": "人工血管内瘘穿刺前评估的内容包括", "options": ["Ａ.成熟程度", "Ｂ.通畅情况", "Ｃ.血管走向", "Ｄ.肢体情况", "Ｅ.患者的婚姻状况"], "answer": "ABCD", "explanation": "人工血管内瘘穿刺前评估包括成熟（手术后2～4周、水肿和红肿消退；即穿型AVG可在术后数小时至数天穿刺）、通畅（触及震颤、听诊明显血管杂音、B超血流量）、走向、肢体情况（红、肿、热、疼）和心理接受度；患者的婚姻状况不属于穿刺前评估的内容。"}, {"text": "人工血管内瘘穿刺前对成熟的评估内容包括", "options": ["Ａ.手术后2～4周", "Ｂ.水肿消退", "Ｃ.红肿消退", "Ｄ.即穿型AVG可在术后数小时至数天进行穿刺", "Ｅ.必须等待3个月以上"], "answer": "ABCD", "explanation": "穿刺前评估的成熟标准为手术后2～4周、水肿和红肿消退；即穿型AVG可在术后数小时至数天进行穿刺。人工血管成熟时间短，但至少需要14天保证伤口愈合及移植物与周围组织粘连，必须等待3个月以上这一说法错误。"}, {"text": "判断人工血管内瘘是否通畅，可依据的指标包括", "options": ["Ａ.触及震颤", "Ｂ.听诊明显血管杂音", "Ｃ.B超测量血流量", "Ｄ.皮肤颜色苍白", "Ｅ.患者主诉穿刺部位疼痛"], "answer": "ABC", "explanation": "判断人工血管内瘘通畅可依据触及震颤、听诊明显血管杂音和B超测量血流量；皮肤颜色苍白和穿刺部位疼痛不是判断内瘘通畅的指标，穿刺前肢体情况评估的是红、肿、热、疼等表现。"}, {"text": "人工血管内瘘透析结束后拔针按压的要点包括", "options": ["Ａ.用柔和的压力轻压人工血管的位置而非皮肤的位置", "Ｂ.用棉球或纱布轻压直至出血情况完全消失，通常需要20到30分钟", "Ｃ.压力越大止血效果越好", "Ｄ.将病人的穿刺点和日期记录下来，作为下次穿刺的参考", "Ｅ.使用手臂止血夹依据病人的具体情况而定"], "answer": "ABDE", "explanation": "透析结束后应小心地将穿刺针拔出，用手指压住伤口止血，用柔和的压力轻压人工血管的位置而非皮肤的位置，用棉球或纱布轻压直至出血情况完全消失（通常20到30分钟），并将穿刺点和日期记录下来作为下次穿刺的参考，是否使用手臂止血夹依据病人的具体情况而定；压力的大小极为关键，既要使皮肤穿刺点不出血，又不至于用力过大压迫血管造成血栓，压力越大止血效果越好这一说法错误。"}, {"text": "人工血管内瘘血栓形成、闭塞的常见原因包括", "options": ["Ａ.透析后穿刺点压迫用力过度过久", "Ｂ.低血压", "Ｃ.感染", "Ｄ.内膜增生", "Ｅ.高钾血症"], "answer": "ABCD", "explanation": "人工血管内瘘血栓形成、闭塞的原因包括压迫（透析后穿刺点压迫用力过度过久）、低血压、感染和内膜增生；高钾血症不是人工血管内瘘血栓形成、闭塞的原因。"}, {"text": "人工血管内瘘狭窄的处理指征包括", "options": ["Ａ.狭窄超过内瘘内径的50%并伴物理检查异常（同AVF）", "Ｂ.自然血流量减少（＜600ml/min）", "Ｃ.内瘘静脉压升高", "Ｄ.狭窄超过内瘘内径的20%", "Ｅ.内瘘杂音明显增强"], "answer": "ABC", "explanation": "狭窄超过内瘘内径的50%并伴物理检查异常（同AVF）、自然血流量减少（＜600ml/min）、内瘘静脉压升高等异常时应处理；处理阈值是狭窄超过内瘘内径的50%而不是20%，内瘘杂音明显增强也不是处理指征。"}, {"text": "根据闭塞原因、时间及处理方法特点，AVG闭塞的分期包括", "options": ["Ａ.急性期为24h以内", "Ｂ.早期为7d以内", "Ｃ.晚期为7d以上", "Ｄ.慢性期为1个月以上", "Ｅ.复发性为反复发作"], "answer": "ABC", "explanation": "根据闭塞原因、时间及处理方法特点，将AVG闭塞分为急性期（24h以内）、早期（7d以内）和晚期（7d以上）；慢性期和复发性不属于该分期的内容。"}, {"text": "使用尿激酶溶栓过程中，出现下列哪些情况应停用尿激酶", "options": ["Ａ.穿刺点出血或血肿", "Ｂ.全身出血如牙龈出血", "Ｃ.消化道出血", "Ｄ.血浆纤维蛋白原＜1.0g/L", "Ｅ.血浆纤维蛋白原＞3.0g/L"], "answer": "ABCD", "explanation": "应停用尿激酶的情况包括穿刺点出血或血肿、全身出血如牙龈出血、皮肤淤血淤斑、消化道出血、血浆纤维蛋白原＜1.0g/L等；血浆纤维蛋白原＞3.0g/L不是停用尿激酶的指征。"}, {"text": "人工血管内瘘的并发症包括", "options": ["Ａ.血栓形成", "Ｂ.假性动脉瘤形成", "Ｃ.感染", "Ｄ.肿胀手综合征", "Ｅ.高钾血症"], "answer": "ABCD", "explanation": "人工血管内瘘的并发症包括血栓形成、假性动脉瘤形成、感染、狭窄、肿胀手综合征等；高钾血症不属于人工血管内瘘的并发症。"}, {"text": "人工血管内瘘肿胀手综合征的原因分析包括", "options": ["Ａ.回流障碍", "Ｂ.静脉分支", "Ｃ.近心端狭窄", "Ｄ.低血压", "Ｅ.自然血流量减少"], "answer": "ABC", "explanation": "肿胀手综合征的原因分析包括回流障碍、静脉分支和近心端狭窄，处理方式包括观察、球囊扩张、支架和重新建立通路；低血压是内瘘血栓形成的原因，自然血流量减少是内瘘狭窄的处理指征，均不是肿胀手综合征的原因。"}]}, {"type": "short", "questions": [{"text": "简述人工血管（AVG）与自体动静脉内瘘相比的优点和缺点。", "options": [], "answer": "优点：①提供的穿刺面积大；②成熟时间短，但至少需要14天以保证伤口愈合及移植物与周围组织粘连；③穿刺部位多。缺点：①潜在的血栓发生率；②潜在的感染发生率；③使用寿命较自体动静内瘘短；④排异反应；⑤费用高。", "explanation": "自体透析通路随透析龄增长无法满足穿刺的需要，老年人血管条件差，且存在血管钙化、内膜增生狭窄、静脉瘤等并发症，人工血管可作为一种替代方式。人工血管并发症及通畅性控制情况为：血栓＜0.5次/患者年、感染发生率≤10%、使用寿命≥2年、PTA术后使用寿命≥4个月。"}, {"text": "简述人工血管内瘘穿刺前评估的内容。", "options": [], "answer": "（1）成熟：手术后2～4周、水肿和红肿消退；即穿型AVG可在术后数小时至数天进行穿刺。（2）通畅：触及震颤、听诊明显血管杂音、B超测量血流量。（3）走向：依据手术图、B超、听诊血管杂音；阻断血流，搏动较强的一端为动脉端（A端）。（4）肢体情况：有无红、肿、热、疼。（5）心理接受度：患者能否接受穿刺风险。", "explanation": "人工血管内瘘的使用流程为评估、选择操作者、确定穿刺部位、确定穿刺方式、实施穿刺、拔针后的按压及评估。触觉检查对保持良好血管通路至关重要，应感觉造瘘部位周围的皮肤温度，并注意造瘘部位及其周围皮肤是否有发硬或类似过敏的症状；人工血管成熟之后触摸很难感觉搏动，应注重听诊器的使用，吻合口处的搏动更应关注。"}, {"text": "简述人工血管内瘘的穿刺技术要点。", "options": [], "answer": "（1）穿刺角度：以45度角进针穿刺血管移植物AV内瘘；角度过于平行容易损伤人造血管前壁，直角进针不能形成有效皮瓣并可能损伤血管后壁。（2）进针方法：一手提住穿刺段的皮肤，穿刺针斜角向上以45度角进针，刺入皮肤后仍保持45度进入人工血管；当确认回血情况良好后，将穿刺针旋转180度使针头斜面向下，再将针头完全推入人造血管。（3）固定与拔针：固定穿刺针在穿刺时的角度或与穿刺时接近的角度，拔除穿刺针的角度要与穿刺时的角度类似。（4）穿刺点选择：不断改换穿刺点是永恒不变的法则，同一血管两针相距＞5cm，距吻合口＞5cm，避开U形转弯部位，每次穿刺点距上次1cm，并至少给同一穿刺点2～3周的愈合时间。", "explanation": "以45度角进针能够产生一种皮瓣效应，当穿刺针拔出后发挥类似瓣膜的功能，以减少穿刺点的出血。静脉穿刺针应置入与静脉血流相同的方向并指向心脏，为减少再循环动静脉穿刺针要相距5cm以上；靠近动、静脉吻合口3厘米以及瘘管弧形转弯部位不宜穿刺。穿刺针完全置入并固定后应询问病人有无不适感，持续性疼痛可能表示针头穿透了人工血管的后壁，此时会出现回血缓慢及不规律的情况。"}, {"text": "简述人工血管内瘘血栓形成时尿激酶药物溶栓的操作方法。", "options": [], "answer": "（1）适用对象：24h以内的新鲜血栓首选局部应用尿激酶溶栓治疗，溶栓效果较好，操作简便、迅速，可床旁随时进行，成功率可达70%～78.57%。（2）穿刺：选择人工血管近动脉吻合口端，超声引导下用穿刺针以30°～45°角穿刺，针尖斜面向上，逆血流方向进针。（3）用药：用尿激酶20万U加入0.9%NaCl注射液稀释至50ml（0.5万U/ml），经静脉推注泵缓慢每小时推注2万～6万U（5ml/小时～15ml/小时）；皮下应用低分子肝素4000u。（4）监测：动脉端人工血管穿刺注入溶栓药物，首先溶解动脉端血栓，继而在动脉血流的冲击下溶解人工血管内血栓直至静脉吻合口；每隔1h检查人工血管有无震颤及杂音，同时检查人工血管静脉端有无震颤及杂音。（5）停药指征：穿刺点出血或血肿、全身出血如牙龈出血、皮肤淤血淤斑、消化道出血、血浆纤维蛋白原＜1.0g/L等。", "explanation": "人工血管内瘘血栓形成时，临床听诊内瘘杂音消失、触诊未触及震颤、超声见血流中断、内瘘静脉端有血栓形成。根据闭塞原因、时间及处理方法特点，将AVG闭塞分为急性期（24h以内）、早期（7d以内）、晚期（7d以上）。除药物溶栓外，治疗方法还包括PTA、切开取栓、再次建瘘等。"}, {"text": "简述人工血管内瘘的常见并发症及其处理原则。", "options": [], "answer": "（1）血栓形成及狭窄：二者是人工血管动静脉内瘘失功的主要原因（80%），其中90%是静脉吻合口内膜增生和吻合口近端静脉狭窄导致；处理包括PTA、切开取栓、再次建瘘等。狭窄超过内瘘内径的50%并伴物理检查异常（同AVF）、自然血流量减少（＜600ml/min）、内瘘静脉压升高等情况时应处理。（2）假性动脉瘤：由同一部位反复穿刺导致管壁变薄形成，发生率为2%～10%，也可由手术吻合口出血引起；治疗为假性动脉瘤切除术+吻合术。（3）感染：是人工血管动静脉内瘘最难处理的并发症，一般为严重的混合致病菌感染；发生感染时全用抗生素、局部加强引流，感染控制后继续使用，感染无法控制时需要取出人工血管；应严格无菌操作、术后合理换药、局部使用抗菌药物软膏。（4）血清肿：以保守治疗（局部持续加压包扎等）为主，不建议单纯穿刺放液、包膜切除；保守治疗无效者需同时处理发生血清肿段人工血管，方法可采用生物蛋白胶或医用胶局部涂抹、跨越血清肿段人工血管搭桥。（5）肿胀手综合征：原因为回流障碍、静脉分支和近心端狭窄，处理包括观察、球囊扩张、支架、重新建立通路。（6）心力衰竭：回心血量增加、前负荷增加导致心力衰竭，处理为换用其他的透析方式，如腹透、半永久深静脉置管透析。", "explanation": "人工血管内瘘的并发症主要包括血栓形成、假性动脉瘤形成、感染、狭窄、肿胀手综合征等；正确识别相关并发症并及时处置，是挽救内瘘的关键。手术取栓时患者上肢外展外旋，利多卡因局部浸润麻醉，于近心端静脉缓慢推入肝素盐水30mg达全身肝素化，选用4F-6F Fogarty导管取栓，术后予低分子肝素抗凝7天；亦可在超声或DSA引导下选用经皮穿刺取栓。"}]}]}, {"num": 23, "title": "血液净化设备的原理、使用标准理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液透析机机箱自上而下分为四个层，其顺序是？", "options": ["A.高层、超滤层、配液层、进水层", "B.高层、配液层、超滤层、进水层", "C.进水层、配液层、超滤层、高层", "D.超滤层、高层、进水层、配液层", "E.配液层、进水层、高层、超滤层"], "answer": "A", "explanation": "血透机的机箱总览自上而下依次为机箱高层、机箱超滤层、机箱配液层和机箱进水层。"}, {"text": "血透机实现用户与机器之间通信的是哪个系统？", "options": ["A.低层系统", "B.数字板DB", "C.模拟板AB", "D.高层系统", "E.阀门电源板PBV"], "answer": "D", "explanation": "高层系统由通信模块、高层控制单元TLC（主板）、小型闪存卡CFC和选配件组成，通过高层系统可实现用户与机器之间的通信。"}, {"text": "血透机高层控制单元（主板）的英文缩写是？", "options": ["A.TLC", "B.LLD", "C.LLA", "D.PBM", "E.PBV"], "answer": "A", "explanation": "高层控制单元TLC即主板，属于高层系统；LLD为数字板DB，LLA为模拟板AB，PBM为马达电源板，PBV为阀门电源板，四者均属低层系统。"}, {"text": "下列部件中不属于血透机低层系统组成的是？", "options": ["A.数字板DB(LLD)", "B.通信模块", "C.模拟板AB(LLA)", "D.马达电源板PBM", "E.阀门电源板PBV"], "answer": "B", "explanation": "低层系统由数字板DB(LLD)、模拟板AB(LLA)、马达电源板PBM和阀门电源板PBV组成；通信模块属于高层系统。"}, {"text": "血透机所有传感器数据经模拟板送到数字板后，通过几个串行总线系统分别发送至监测单元和控制单元？", "options": ["A.1个", "B.2个", "C.3个", "D.4个", "E.5个"], "answer": "B", "explanation": "所有传感器数据均通过模拟板到数字板，经过两个串行总线系统单独发送至监测单元和控制单元。"}, {"text": "血透机的执行机构、监控器和阀门由哪组电路板驱动？", "options": ["A.数字板DB和模拟板AB", "B.主板TLC和闪存卡CFC", "C.基础板BB和温度开关TS", "D.在线式HDF电源板HOB", "E.阀门电源板PBV和马达电源板PBM"], "answer": "E", "explanation": "执行机构、监控器和阀门通过阀门电源板PBV和马达电源板PBM驱动。"}, {"text": "血透机进水压力要求为？", "options": ["A.0.5～6bar", "B.0.9±0.1bar", "C.1.0～1.5bar", "D.5～30bar", "E.0.5～6MPa"], "answer": "A", "explanation": "血透机进水要求压力0.5～6bar，其中减压阀DMV出口压力为0.9±0.1bar。"}, {"text": "血透机进水流量要求为？", "options": ["A.≥200ml/min", "B.≥300ml/min", "C.≥500ml/min", "D.≥800ml/min", "E.≥1200ml/min"], "answer": "D", "explanation": "血透机进水流量要求≥800ml/min。"}, {"text": "血透机进水温度要求为？", "options": ["A.5～30℃", "B.10～30℃", "C.10～40℃", "D.20～30℃", "E.30～40℃"], "answer": "B", "explanation": "血透机进水温度要求为10～30℃。"}, {"text": "血透机进水减压阀DMV的出口压力为？", "options": ["A.0.5～6bar", "B.0.9±0.1bar", "C.1.5±0.1bar", "D.2.8±0.5bar", "E.6bar"], "answer": "B", "explanation": "DMV为进水减压阀，出口压力为0.9±0.1bar；进水总体压力范围为0.5～6bar。"}, {"text": "血透机进水电磁阀VVBE的开启由什么反馈控制？", "options": ["A.温度传感器", "B.液位传感器", "C.电导度传感器", "D.压力传感器", "E.流量传感器"], "answer": "B", "explanation": "进水电磁阀VVBE控制进水，由水箱液位传感器NSVB反馈控制。"}, {"text": "血透机除气旁路阀VEB在治疗和消毒时的状态是？", "options": ["A.治疗时打开，消毒时关闭", "B.治疗和消毒时均打开", "C.治疗和消毒时均关闭", "D.治疗时关闭，消毒时打开", "E.仅在消毒结束后打开"], "answer": "D", "explanation": "除气旁路阀VEB带有节流孔，治疗时关闭，消毒时打开。"}, {"text": "血透机除气压力传感器PE的作用是？", "options": ["A.监测水温", "B.监测透析液电导度", "C.检测管路漏血", "D.控制进水电磁阀", "E.监测除气压并反馈调节除气泵速"], "answer": "E", "explanation": "PE为除气压力传感器，用于监测除气压并反馈调节EP除气泵的转速。"}, {"text": "血透机除气室EK的作用是？", "options": ["A.加热透析液", "B.收集负压分离的微小气泡", "C.储存A液浓缩液", "D.过滤颗粒杂质", "E.调节透析液流量"], "answer": "B", "explanation": "除气室EK用于收集负压分离的微小气泡，使气泡在颗粒表面形成大气泡而便于排出。"}, {"text": "血透机加热棒H的加热功率受哪些温度传感器反馈调节？", "options": ["A.TSE、TSD、TSDE", "B.TS、TSE、TSH", "C.TSBIC、TSD、ENDLF", "D.TSE、TSDE、TSH", "E.TSD、TSDE、ENDLF"], "answer": "A", "explanation": "加热棒H的加热功率受TSE、TSD和TSDE反馈调节；TSH为高温保险，熔断点为152℃。"}, {"text": "血透机加热器高温保险TSH的熔断点是？", "options": ["A.100℃", "B.120℃", "C.152℃", "D.180℃", "E.200℃"], "answer": "C", "explanation": "TSH为高温保险，熔断点为152℃，加热异常时可切断加热。"}, {"text": "血透机透析液配制采用的方式是？", "options": ["A.先A液后B液，独立反馈控制", "B.先B液后A液，独立反馈控制", "C.先B液后A液，无反馈控制", "D.先A液后B液，统一开环控制", "E.A液与B液同时加入"], "answer": "B", "explanation": "透析液配制控制为先B液后A液，两种浓缩液分别独立反馈控制。"}, {"text": "B液电导度传感器BICLF反馈控制的是什么？", "options": ["A.A液泵转速", "B.B液泵转速", "C.废液泵转速", "D.超滤泵转速", "E.除气泵转速"], "answer": "B", "explanation": "B液路径中TSBIC监测B液温度、BICLF监测B液电导度，BICLF反馈控制BICP B液泵的转速。"}, {"text": "A液电导度传感器ENDLF反馈控制的是什么？", "options": ["A.A液泵转速", "B.B液泵转速", "C.透析液泵转速", "D.加热棒功率", "E.进水电磁阀开度"], "answer": "A", "explanation": "A液路径中TSD监测透析液温度、ENDLF监测透析液电导度，ENDLF反馈控制KP A液泵的转速。"}, {"text": "干粉筒支架单向阀DBK可保证填充干粉筒期间的压力恒定为？", "options": ["A.1.3bar", "B.0.9bar", "C.2.8ms/cm", "D.152℃", "E.500mmHg"], "answer": "E", "explanation": "DBK为B液干粉桶支架单向阀，可保证填充干粉筒期间压力保持恒定在500mmHg。"}, {"text": "血透机干粉筒进水阀门是？", "options": ["A.VEB", "B.VBKO", "C.VBKS", "D.VBICP", "E.VDE"], "answer": "B", "explanation": "VBKO为干粉筒进水阀门；VBKS在使用B液吸杆或者干粉筒进水排气时打开。"}, {"text": "使用B液吸杆或者干粉筒进水排气时应打开哪个阀门？", "options": ["A.VBKO", "B.VVB", "C.VBKS", "D.VBICP", "E.VBP"], "answer": "C", "explanation": "VBKS在使用B液吸杆或者干粉筒进水排气时打开。"}, {"text": "血透机VVB阀门常开的条件是？", "options": ["A.VBKO关闭时", "B.VBKS关闭时", "C.VBICP关闭时", "D.VDE关闭时", "E.VDA关闭时"], "answer": "C", "explanation": "VVB在VBICP关闭时常开。"}, {"text": "干粉筒排空或者冲洗干粉筒时应打开的阀门是？", "options": ["A.VVB", "B.VBKO", "C.VBKS", "D.VBICP", "E.VEB"], "answer": "D", "explanation": "VBICP在干粉筒排空时打开，或者在冲洗干粉筒时打开。"}, {"text": "透析液流量堵塞导致齿轮泵处压力升高时，通过哪两个阀释放超压？", "options": ["A.RVFPE和RVFPA", "B.RVDA和RVUFP", "C.RVB和RVK", "D.VEBK和VDEBK", "E.VABK和VDABK"], "answer": "A", "explanation": "流量堵塞时齿轮泵处压力升高，通过RVFPE和RVFPA释放超压，并通过节流阀形成循环，从而起到高压保护作用。"}, {"text": "血透机平衡腔系统中平衡腔电磁阀的数量是？", "options": ["A.2个", "B.4个", "C.6个", "D.8个", "E.10个"], "answer": "D", "explanation": "平衡腔系统由1对平衡腔BK1/BK2、8个平衡腔电磁阀和1对平衡腔膜片位置传感器组成。"}, {"text": "平衡腔膜片位移传感器MSBK1/2通过反馈作用调节什么？", "options": ["A.加热棒功率", "B.除气泵转速", "C.透析液泵和废液泵泵速", "D.进水阀开度", "E.消毒阀开度"], "answer": "C", "explanation": "MSBK1/2为膜片位移传感器，反馈控制FPE透析液泵和FPA废液泵的泵速，从而调节流速。"}, {"text": "平衡腔一备一用运行时，BK1准备透析液的同时BK2处于什么状态？", "options": ["A.使用透析液", "B.反冲状态", "C.消毒状态", "D.排空状态", "E.停用状态"], "answer": "A", "explanation": "平衡腔一用一备，BK1准备透析液的同时BK2使用透析液，两者交替进行。"}, {"text": "血透机平衡腔的作用之一是？", "options": ["A.加热透析液", "B.检测管路漏血", "C.排出管路空气", "D.储存浓缩液", "E.保证进出透析器液体流量平衡"], "answer": "E", "explanation": "平衡腔的作用包括一用一备提供连续稳定的透析液、保证进出平衡腔液体流量平衡以及保证进出透析器液体流量平衡。"}, {"text": "冲洗桥部分漏血检测器BL的作用是？", "options": ["A.检测透析液温度", "B.检测是否有血流入循环管路", "C.检测透析液电导度", "D.检测管路压力", "E.检测空气含量"], "answer": "B", "explanation": "漏血探测器BL用于检测是否有血流入循环管路。"}, {"text": "血透机进入旁路状态时，透析液的流向是？", "options": ["A.经VDE进入透析器", "B.经VBP旁路阀流入LA", "C.经VDA返回机器", "D.经VDE进入平衡腔", "E.经PDA流入透析器"], "answer": "B", "explanation": "旁路时超净滤器出来的液体经VBP旁路阀流入LA，此时VDE和VDA关闭，避免不安全的透析液进入透析器。"}, {"text": "血透机负压泵高压保护阀在压力超过多少时打开以保护回路？", "options": ["A.0.5bar", "B.0.9bar", "C.1.3bar", "D.2.8bar", "E.6bar"], "answer": "C", "explanation": "超过1.3bar时负压泵高压保护阀会打开以保护回路。"}, {"text": "血透机水路图可分为几个节段？", "options": ["A.3个", "B.4个", "C.5个", "D.6个", "E.7个"], "answer": "D", "explanation": "水路图可分成六个节段：进水节段、除气和加热节段、配比透析液节段、平衡腔容量控制节段、超滤控制节段和冲洗桥节段。"}, {"text": "TFT液晶屏的背光逆变电路板缩写是？", "options": ["A.TCB", "B.OSDB", "C.FPB", "D.BIB", "E.SMPS-MC"], "answer": "D", "explanation": "TFT液晶屏部分包括背光逆变电路板BIB、前面板FPB、TFT液晶屏、状态灯电路板OSDB和触摸屏控制板TCB。"}, {"text": "血透机前门中静脉管夹（无电关闭）的缩写是？", "options": ["A.SAKA", "B.SAKV-SG", "C.SAD", "D.RDV", "E.HP"], "answer": "B", "explanation": "前门静脉管夹为无电关闭的SAKV-SG；动脉管夹为SAKA，SAD为安全空气检测器，RDV为静脉红色检测器，HP为肝素泵。"}, {"text": "血液透析用水处理设备的核心部分是？", "options": ["A.活性炭过滤器", "B.树脂软化器", "C.精密保安过滤器", "D.多介质过滤器", "E.反渗透装置"], "answer": "E", "explanation": "血液透析用水处理设备以反渗透为核心，结合辅助系统对原水中的污染物脱除，使系统的产水满足血液透析的要求。"}, {"text": "常规血液透析患者每周约接触多少升透析用水？", "options": ["A.约14升", "B.约120升", "C.约360升", "D.约500升", "E.约800升"], "answer": "C", "explanation": "普通人每周饮用水仅约14升，而常规血液透析患者每周约接触透析用水360升。"}, {"text": "在线HDF模式每次治疗直接进入病人血液内的透析用水量为？", "options": ["A.5～10L", "B.12～28L", "C.30～50L", "D.60～80L", "E.100～120L"], "answer": "B", "explanation": "在线HDF模式每次治疗除接触透析用水120升外，更有12～28L透析用水直接进入病人血液内。"}, {"text": "血液透析治疗模式（HD）下，水与血液通过半透膜接触，对小于多少道尔顿的物质没有选择性？", "options": ["A.100道尔顿", "B.300道尔顿", "C.500道尔顿", "D.1000道尔顿", "E.5000道尔顿"], "answer": "C", "explanation": "HD治疗模式下水与血液的接触通过半透膜来实现，对小于500道尔顿的物质没有选择性。"}, {"text": "血透水处理前置过滤器采用的PP过滤芯规格是？", "options": ["A.7支30英寸，20-50微米", "B.2支20英寸，1-5微米", "C.7支20英寸，1-5微米", "D.2支30英寸，20-50微米", "E.5支30英寸，5-10微米"], "answer": "A", "explanation": "前置过滤器主要过滤自来水中的固体杂质，采用7支30英寸、孔径20-50微米的PP过滤芯。"}, {"text": "血透水处理前置过滤器需要强制更换的条件是前后压力差值大于？", "options": ["A.0.1bar", "B.0.3bar", "C.0.5bar", "D.0.9bar", "E.1.3bar"], "answer": "C", "explanation": "前置过滤器滤芯更换频率需根据自来水水质确定，一般1-3个月更换，或者前后压力差值大于0.5bar时强制更换。"}, {"text": "多介质过滤器（砂罐）的滤料成分是？", "options": ["A.树脂", "B.活性炭", "C.石英砂、无烟煤和锰砂", "D.石英砂和树脂", "E.锰砂和活性炭"], "answer": "C", "explanation": "砂罐的滤料中含有石英砂、无烟煤和锰砂，用于除去水中的铁，避免交换树脂失效和反渗透膜污染。"}, {"text": "天然锰砂的主要成分是？", "options": ["A.二氧化硅", "B.二氧化锰", "C.氯化钠", "D.碳酸氢钠", "E.氢氧化铁"], "answer": "B", "explanation": "天然锰砂的主要成分是二氧化锰（MnO2），铁离子与锰砂接触即可将Fe2+氧化成Fe3+。"}, {"text": "树脂软化器使用的交换剂是？", "options": ["A.钠型阳离子交换树脂", "B.氢型阳离子交换树脂", "C.阴离子交换树脂", "D.锰砂", "E.活性炭"], "answer": "A", "explanation": "树脂软化器的交换剂是钠型阳离子交换树脂，水中的钙离子、镁离子与交换剂中的钠离子进行交换而实现软化。"}, {"text": "树脂再生常用的再生液是？", "options": ["A.次氯酸钠溶液", "B.过氧乙酸溶液", "C.甲醛溶液", "D.盐酸溶液", "E.饱和盐溶液"], "answer": "E", "explanation": "交换达到一定值时交换剂失效，为恢复交换能力可用再生液进行再生，常用的再生液为饱和盐溶液。"}, {"text": "氯胺与活性炭的接触时间要求为？", "options": ["A.1分钟以上", "B.3分钟以上", "C.6分钟以上", "D.10分钟以上", "E.15分钟以上"], "answer": "D", "explanation": "游离氯与活性炭的接触时间要求在6分钟以上，氯胺的反应速度较慢，接触时间要求在10分钟以上。"}, {"text": "精密保安过滤器主要过滤水中大于多少微米的固体杂质？", "options": ["A.0.5微米", "B.1微米", "C.5微米", "D.10微米", "E.50微米"], "answer": "C", "explanation": "精密保安过滤器主要过滤水中大于5微米的固体杂质，是保护反渗装置的最后一道物理防线，采用2支20英寸、孔径1-5微米的PP过滤芯。"}, {"text": "反渗膜可清除水中单价离子的比例是？", "options": ["A.50-60%", "B.70-80%", "C.90-98%", "D.95-99%", "E.99%以上"], "answer": "C", "explanation": "反渗膜可清除水中90-98%的单价离子、95-99%的二价离子，还可以清除90-95%的有机和无机污染物、细菌和致热源（&gt;300Da）。"}, {"text": "水处理间面积应为水处理装置占地面积的多少倍以上？", "options": ["A.0.5倍", "B.1倍", "C.1.5倍", "D.2倍", "E.3倍"], "answer": "C", "explanation": "水处理间面积应为水处理装置占地面积的1.5倍以上，地面承重应符合设备要求，地面应进行防水处理并设置地漏。"}, {"text": "反渗水的送水管路应采取何种形式供水？", "options": ["A.开放式单向供水", "B.闭合回路供水", "C.分支串联供水", "D.独立单管供水", "E.间断式供水"], "answer": "B", "explanation": "反渗水的送水管路需采取闭合回路的形式供水，以避免管路内有死腔滋生细菌和内毒素。"}]}, {"type": "multiple", "questions": [{"text": "血透机高层系统由下列哪些部件组成？", "options": ["Ａ.通信模块", "Ｂ.高层控制单元TLC", "Ｃ.小型闪存卡CFC", "Ｄ.选配件", "Ｅ.数字板DB(LLD)"], "answer": "ABCD", "explanation": "高层系统由通信模块、高层控制单元TLC（主板）、小型闪存卡CFC和选配件组成；数字板DB(LLD)属于低层系统，故第五项不对。"}, {"text": "血透机低层系统由下列哪些部件组成？", "options": ["Ａ.数字板DB(LLD)", "Ｂ.模拟板AB(LLA)", "Ｃ.马达电源板PBM", "Ｄ.阀门电源板PBV", "Ｅ.通信模块"], "answer": "ABCD", "explanation": "低层系统由数字板DB(LLD)、模拟板AB(LLA)、马达电源板PBM和阀门电源板PBV组成；通信模块属于高层系统，故第五项不对。"}, {"text": "关于血透机进水层的进水控制，说法正确的有？", "options": ["Ａ.DMV进水调压", "Ｂ.VVBE进水阀", "Ｃ.NSVB液位传感器反馈", "Ｄ.VEB治疗时打开", "Ｅ.进水压力0.5～6bar"], "answer": "ABCE", "explanation": "进水控制路径为DMV进水调压→VVBE进水阀→NSVB水箱液位传感器反馈控制→冷水箱，进水压力要求0.5～6bar；VEB是除气旁路阀，治疗时关闭、消毒时打开，故第四项不对。"}, {"text": "关于血透机除气与加热环节，说法正确的有？", "options": ["Ａ.冷水箱→VEB→PE→EK→EP", "Ｂ.EK收集负压分离气泡", "Ｃ.EP转速受PE反馈调节", "Ｄ.H功率受TSE等反馈调节", "Ｅ.TSH熔断点为100℃"], "answer": "ABCD", "explanation": "除气控制为冷水箱→VEB旁路阀→PE除气压力传感器→EK除气室→EP除气泵；EK收集负压分离的微小气泡使其在颗粒表面形成大气泡；EP转速受PE反馈调节；加热棒H功率受TSE、TSD、TSDE反馈调节；TSH熔断点为152℃，故第五项不对。"}, {"text": "关于血透机配液层的透析液配制，说法正确的有？", "options": ["Ａ.先B液后A液配制", "Ｂ.B液泵受BICLF控制", "Ｃ.A液泵受ENDLF控制", "Ｄ.KE为B液吸杆", "Ｅ.混合后温度由TSBIC监测"], "answer": "ABC", "explanation": "透析液配制为先B液后A液、独立反馈控制，BICLF反馈控制B液泵转速，ENDLF反馈控制A液泵转速；KE为A液吸杆，TSBIC监测的是B液温度，混合后透析液温度由TSD监测，故后两项不对。"}, {"text": "关于血透机干粉筒相关部件与阀门，说法正确的有？", "options": ["Ａ.DBK为干粉桶单向阀", "Ｂ.VBKO为干粉筒进水阀", "Ｃ.VBKS排气时打开", "Ｄ.VVB在VBICP关闭时常开", "Ｅ.VBICP治疗时持续打开"], "answer": "ABCD", "explanation": "DBK为B液干粉桶支架单向阀，可保证填充干粉筒期间压力恒定；VBKO为干粉筒进水阀门；VBKS在使用B液吸杆或者干粉筒进水排气时打开；VVB在VBICP关闭时常开；VBICP在干粉筒排空或者冲洗干粉筒时打开，并非治疗时持续打开，故第五项不对。"}, {"text": "血透机平衡腔系统由下列哪些部件组成？", "options": ["Ａ.1对平衡腔BK1/BK2", "Ｂ.8个平衡腔电磁阀", "Ｃ.1对膜片位置传感器", "Ｄ.除气泵EP", "Ｅ.加热棒H"], "answer": "ABC", "explanation": "平衡腔系统由1对平衡腔BK1/BK2、8个平衡腔电磁阀和1对平衡腔膜片位置传感器组成；除气泵EP和加热棒H属于进水层部件，故后两项不对。"}, {"text": "血透机平衡腔的电磁阀包括下列哪些？", "options": ["Ａ.VEBK1/VEBK2", "Ｂ.VDEBK1/VDEBK2", "Ｃ.VABK1/VABK2", "Ｄ.VDABK1/VDABK2", "Ｅ.VBP旁路阀"], "answer": "ABCD", "explanation": "平衡腔的8个电磁阀为VEBK1/VEBK2、VDEBK1/VDEBK2、VABK1/VABK2、VDABK1/VDABK2；VBP为旁路阀，属于冲洗桥部分，故第五项不对。"}, {"text": "关于血透机平衡腔的作用，说法正确的有？", "options": ["Ａ.一用一备提供稳定透析液", "Ｂ.保证进出平衡腔流量平衡", "Ｃ.保证进出透析器流量平衡", "Ｄ.对透析液进行加热", "Ｅ.清除透析液中的细菌"], "answer": "ABC", "explanation": "平衡腔一用一备提供连续稳定的透析液，并保证进出平衡腔、进出透析器的液体流量平衡；加热由加热棒完成，清除细菌依靠超净滤器等部件，故后两项不对。"}, {"text": "血透机透析液废液流向经过下列哪些部件？", "options": ["Ａ.VDA废液回机器阀", "Ｂ.LA空气分离室", "Ｃ.FPA废液泵", "Ｄ.FBK2过滤网", "Ｅ.VDE进透析器阀门"], "answer": "ABCD", "explanation": "废液流向为VDA废液回机器阀→LA空气分离室→FPA废液泵→FBK2过滤网→VDABK1/2进平衡腔阀→平衡腔；VDE是透析液进透析器阀门，属于新鲜透析液通路，故第五项不对。"}, {"text": "血透机冲洗桥部分包括下列哪些组成部件？", "options": ["Ａ.消毒阀VD", "Ｂ.透析液压力传感器PDA", "Ｃ.透析液进透析器阀门VDE", "Ｄ.透析液进透析器温度传感器TSDE", "Ｅ.进水电磁阀VVBE"], "answer": "ABCD", "explanation": "冲洗桥部分由消毒阀VD、透析液压力传感器PDA、透析液进透析器阀门VDE、透析液进透析器温度传感器TSDE和漏血检测器BL组成；VVBE为进水层进水阀，故第五项不对。"}, {"text": "血透机水路图的六个节段包括下列哪些？", "options": ["Ａ.进水节段", "Ｂ.除气和加热节段", "Ｃ.配比透析液节段", "Ｄ.平衡腔容量控制节段", "Ｅ.水处理预处理节段"], "answer": "ABCD", "explanation": "水路图六个节段为进水节段、除气和加热节段、配比透析液节段、平衡腔容量控制节段、超滤控制节段和冲洗桥节段；水处理预处理节段属于水处理系统的组成部分，故第五项不对。"}, {"text": "血透用水设备一般由下列哪些部分构成？", "options": ["Ａ.原水增压与多介质过滤器", "Ｂ.活性炭过滤器与软化器", "Ｃ.精密过滤器与原水平衡器", "Ｄ.一级、二级反渗透系统", "Ｅ.血细胞分析系统"], "answer": "ABCD", "explanation": "血透用水设备一般由原水增压、多介质过滤器、活性炭过滤器、软化器、精密过滤器、原水平衡器、一级高压泵、一级反渗透系统、二级高压泵、二级反渗透系统、消毒系统、供水分配管路和电控系统组成；血细胞分析系统不属于水处理设备，故第五项不对。"}, {"text": "关于血透水处理的过滤组件，说法正确的有？", "options": ["Ａ.前置过滤器过滤固体杂质", "Ｂ.前置过滤器用7支30英寸滤芯", "Ｃ.精密过滤器过滤大于5微米", "Ｄ.精密过滤器为最后物理防线", "Ｅ.精密过滤器用7支30英寸滤芯"], "answer": "ABCD", "explanation": "前置过滤器过滤自来水中的固体杂质，采用7支30英寸、20-50微米孔径的PP过滤芯；精密保安过滤器是保护反渗装置的最后一道物理防线，过滤大于5微米的固体杂质，采用2支20英寸、1-5微米孔径的PP过滤芯，故第五项不对。"}, {"text": "关于活性炭过滤器，说法正确的有？", "options": ["Ａ.微孔多、物理吸附能力强", "Ｂ.去除有机物与残余氯", "Ｃ.不可再生，需定期更换", "Ｄ.游离氯接触要求6分钟以上", "Ｅ.活性炭罐无需反冲"], "answer": "ABCD", "explanation": "活性炭有非常多的微孔和巨大的表面积，物理吸附能力强，可除去水中的有机物、致热源、残余氯和色素，且不可再生、一般要定期更换；游离氯与活性炭接触时间要求在6分钟以上；活性炭罐需要定期反冲，以确保最大接触面积同时减少水的阻力，故第五项不对。"}, {"text": "关于游离氯与氯胺的清除，说法正确的有？", "options": ["Ａ.活性炭除氯为唯一有效法", "Ｂ.两个活性炭罐串联使用", "Ｃ.每个炭罐接触5分钟以上", "Ｄ.两罐合计接触10分钟以上", "Ｅ.每周监测余氯一次即可"], "answer": "ABCD", "explanation": "活性炭与氯的化学反应是目前祛除氯和氯胺唯一有效的方法；推荐将两个活性炭过滤器串联使用，流经每个炭罐的水必须与活性炭接触5分钟以上、合计10分钟以上；余氯应在每天透析前监测，故第五项不对。"}, {"text": "关于反渗透装置，说法正确的有？", "options": ["Ａ.水处理系统的核心", "Ｂ.清除90-98%单价离子", "Ｃ.清除95-99%二价离子", "Ｄ.清除细菌与致热源", "Ｅ.甲醛脱除率高于99%"], "answer": "ABCD", "explanation": "反渗透装置是水处理系统的核心部分，反渗膜可清除水中90-98%的单价离子、95-99%的二价离子，还可清除90-95%的有机和无机污染物、细菌和致热源（&gt;300Da）；反渗膜对甲醛的脱除率约为40%，故第五项不对。"}, {"text": "关于氯胺对血液透析的影响，说法正确的有？", "options": ["Ａ.氧化为高铁血红蛋白", "Ｂ.抑止抗氧化途径", "Ｃ.引起溶血和溶血性贫血", "Ｄ.出现胸痛、心律失常", "Ｅ.延长反渗膜使用寿命"], "answer": "ABCD", "explanation": "氯胺对血液透析的影响包括氧化血红蛋白成
