院血透转入患者）首次接受血液透析治疗前应进行HCV、HBV、梅毒、艾滋等传染病实验室检查，至少3个月内重复检查一次，之后至少每六个月检查一次。2.传染病人专机专区治疗，物品专用、标识明确、定位放置，护理人员相对固定，禁止同时段照顾阴性患者。3.严格执行标准预防，做好个人防护，配置有效便捷的手卫生设备和设施，落实手卫生管理制度。4.有医院及血液透析专科感染管理的相关制度、流程，科室检查制度、流程落实情况、对存在问题与缺陷有改进措施，落实血透机的外部和内部消毒，并做好应急预案的演练和培训。", "explanation": "落实感控制度是防止交叉感染的关键，其院感注意事项包括血液透析室人力资源配置、A液与B液的相关清洗消毒、手卫生的实施、标准预防、一次性使用物品的规范使用等。血透室院感防控不力可造成严重后果，如2019年5月27日江苏省盐城市东台市人民医院的血透患者感染事故，经对所有血透患者筛查检测，共诊断确认丙肝病毒感染69例，专家组调查认定该事件是一起因医院院内感染管理制度落实不到位等原因造成的院内感染事件。"}, {"text": "简述血透室十大安全目标中的目标六“防范患者跌倒事件的发生”的具体措施，并说明透析患者跌倒风险的评估与复评要求。", "options": [], "answer": "【具体措施】①建立跌倒报告和伤情认定制度和程序；②对所有透析患者进行跌倒风险评估并告知；③有明显的防跌倒安全警示；④认真实施有效的跌倒防范制度和措施；⑤护理人力与服务对象配比合理。【评估要求】下肢肌力评估为“×”，危险因子评估无论多少分均为高危；下肢肌力评估为“√”，危险因子评估≥3分亦为高危；下肢肌力评估为“√”，危险因子评估&lt;3分为非高危。【复评要求】所有患者入科时均需评估；高危患者每周复评一次，非高危患者每两周复评一次；如遇病情变化，跌倒危险因子部分发生改变时随时复评。高危患者需填写防范措施表并在相应措施栏内打“√”，宣教方式包括口头、发放材料和多媒体。", "explanation": "跌倒风险危险因子评估内容包括：半年内曾发生过跌倒（1分）；意识不清、躁动不安（3分）；视觉不佳、影响生活（1分）；入厕次数≥10次/日（1分）；病人移位与活动分数（2/3/4记1分，0/1/5/6记0分）；使用多重药物（≥4种，1分）。下肢肌力评估为独立单脚稳定站立&gt;5秒钟者记“√”，不能者记“×”。防范措施包括指导患者采取渐进式下床方式、穿防滑鞋、保持地面干燥与走道通畅、夜间留夜灯、移去地面多余杂物、必要时提供辅助用具并使用床栏、床脚轮固定等。"}, {"text": "简述血液透析护理专业医疗质量控制指标（试用版）中“护患比”与“体外循环凝血发生率”的定义、计算要点。", "options": [], "answer": "【护患比】1.定义：统计周期内，责任护士人数与其负责照护的血液透析患者数量的比例。不包括行连续性肾脏替代治疗（CRRT）的责任护士人数及患者数。根据监测时限不同，可分为平均每天护患比和时点调查护患比：平均每天护患比为统计周期内每天白班、夜班责任护士数之和与其负责照护的血液透析患者数之和的比；时点调查护患比为某时点责任护士数之和与其该时点负责照护的血液透析患者数的比。2.说明：责任护士指直接照护血透患者的执业护士；计算责任护士人力时应包含所有直接服务血透患者的班次及辅助护理岗位护士人力，排除治疗护士（配药护士）、办公班护士（主班）、护士长等其它岗位护士，当护士长承担责任护士的工作时需计算在内；责任护士每工作8小时计为1名责任护士人力。【体外循环凝血发生率】1.定义：统计周期内血液透析发生Ⅱ级及以上凝血例次数与同期血液透析患者总例次数的百分比。2.说明：凝血例次数指统计周期内血液透析发生Ⅱ级及以上凝血例次数之和；患者血液透析例次数指统计周期内患者血透治疗例次数之和，每位患者独立的1次血液透析治疗记为患者1个血液透析例次数。", "explanation": "护患比与体外循环凝血发生率均属血液透析护理专业医疗质量控制指标（试用版），血液透析护理专业医疗质量控制指标（试用版）由全国护理质量促进联盟于二零二三年十月发布，共5项指标：护患比、体外循环凝血发生率、体外循环漏血发生率、动静脉内瘘穿刺损伤发生率、血液净化用中心静脉导管相关血流感染发生率。凝血程度分级参照《血液透析护理实践指导手册》，分为0级、Ⅰ级、Ⅱ级、Ⅲ级共4级；同一患者在一次治疗过程中发生的内瘘穿刺损伤记为1个动静脉内瘘穿刺损伤例次数。"}]}]}, {"num": 2, "title": "血液专科培训理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液净化技术是指各种连续或间断清除体内过多水分、溶质方法的（  ）", "options": ["A.总称", "B.单一种方法", "C.操作流程", "D.特定技术", "E.护理常规"], "answer": "A", "explanation": "血液净化技术是各种连续或间断清除体内过多水分、溶质方法的总称，应用于各种常见危重症患者的救治。"}, {"text": "血液净化技术是在下列哪种技术的基础上逐步发展而来的（  ）", "options": ["A.肾脏替代治疗技术", "B.体外循环技术", "C.呼吸支持技术", "D.人工肝技术", "E.腹膜透析技术"], "answer": "A", "explanation": "血液净化技术是在肾脏替代治疗技术的基础上逐步发展而来，应用于各种常见危重症患者的救治。"}, {"text": "连续性肾脏替代治疗的英文全称是（  ）", "options": ["A.Continuous Renal Replacement Therapy", "B.Continuous Blood Purification", "C.Hemoperfusion", "D.Plasma Exchange", "E.Hemodialysis"], "answer": "A", "explanation": "连续性肾脏替代治疗（CRRT）英文全称为Continuous Renal Replacement Therapy，也称持续性血液净化。"}, {"text": "CRRT每次治疗的时间通常为（  ）", "options": ["A.4～6小时", "B.8～12小时", "C.每天24小时或接近24小时", "D.每次2小时", "E.每次30分钟"], "answer": "C", "explanation": "CRRT治疗时间为每天24小时或接近24小时，可根据患者治疗需求灵活调整。"}, {"text": "连续性肾脏替代治疗也称持续性血液净化，其英文缩写是（  ）", "options": ["A.CBP", "B.HP", "C.PE", "D.DFPP", "E.PD"], "answer": "A", "explanation": "连续性肾脏替代治疗（CRRT）也称持续性血液净化（continue blood purification，CBP）。"}, {"text": "下列不属于CRRT常用治疗模式的是（  ）", "options": ["A.CVVH", "B.CVVHD", "C.CVVHDF", "D.SCUF", "E.HP"], "answer": "E", "explanation": "CRRT常用治疗模式为CVVH（连续性静脉血液滤过）、CVVHD（连续性静脉血液透析）、CVVHDF（连续性静脉血液透析滤过）、SCUF（缓慢连续性超滤）；HP为血液灌流，不属于CRRT治疗模式。"}, {"text": "CRRT常用治疗模式中，CVVH是指（  ）", "options": ["A.连续性静脉血液滤过", "B.连续性静脉血液透析", "C.连续性静脉血液透析滤过", "D.缓慢连续性超滤", "E.单纯超滤"], "answer": "A", "explanation": "CVVH为连续性静脉血液滤过；CVVHD为连续性静脉血液透析，CVVHDF为连续性静脉血液透析滤过，SCUF为缓慢连续性超滤。"}, {"text": "CRRT常用治疗模式中，CVVHDF是指（  ）", "options": ["A.连续性静脉血液滤过", "B.连续性静脉血液透析", "C.连续性静脉血液透析滤过", "D.缓慢连续性超滤", "E.单纯超滤"], "answer": "C", "explanation": "CVVHDF为连续性静脉血液透析滤过，兼具弥散与对流两种清除作用；CVVH为连续性静脉血液滤过，CVVHD为连续性静脉血液透析。"}, {"text": "超滤的原理是液体在压力梯度的作用下穿过半透膜，其移动方向是（  ）", "options": ["A.从低压侧到达高压侧", "B.从高压侧到达低压侧", "C.从浓度高侧到达浓度低侧", "D.从浓度低侧到达浓度高侧", "E.从低温侧到达高温侧"], "answer": "B", "explanation": "超滤是液体在压力梯度的作用下穿过半透膜，从高压的一侧到达低压的一侧，用于移除体内多余的水分。"}, {"text": "按照超滤的原理，其主要作用是（  ）", "options": ["A.清除小分子溶质", "B.移除体内多余的水分", "C.吸附炎症介质", "D.补充凝血因子", "E.清除与蛋白结合的毒素"], "answer": "B", "explanation": "超滤依靠压力梯度使液体穿过半透膜，从高压侧到达低压侧，主要作用是移除体内多余的水分。"}, {"text": "对流的驱动力是（  ）", "options": ["A.浓度梯度", "B.压力梯度", "C.温度梯度", "D.电荷梯度", "E.渗透压梯度"], "answer": "B", "explanation": "对流的驱动力是压力梯度，水和溶质一同运动，溶质随着水流一起运动即溶剂牵引作用。"}, {"text": "对流可有效去除的中分子毒素，其分子量范围是（  ）", "options": ["A.小于500D", "B.500～5000D", "C.5000～50000D", "D.大于50000D", "E.小于100D"], "answer": "B", "explanation": "对流依靠压力梯度使水和溶质一同运动，可有效去除中分子毒素，其分子量范围为500～5000D。"}, {"text": "弥散的驱动力是（  ）", "options": ["A.压力梯度", "B.浓度梯度", "C.温度梯度", "D.电荷梯度", "E.重力"], "answer": "B", "explanation": "弥散是溶质穿过半透膜，从浓度高的一侧移动到浓度低的一侧，驱动力为浓度梯度。"}, {"text": "弥散能有效去除的溶质是（  ）", "options": ["A.中分子毒素", "B.大分子毒素", "C.小分子溶质如电解质（小于500D）", "D.与蛋白结合的毒素", "E.细胞因子"], "answer": "C", "explanation": "弥散能有效去除小分子溶质，例如电解质等（小于500D）；中分子毒素主要通过对流清除。"}, {"text": "血液净化原理中，吸附的主要作用是（  ）", "options": ["A.清除多余水分", "B.去除小分子电解质", "C.吸附与蛋白结合的毒素、炎症介质", "D.清除血细胞", "E.补充白蛋白"], "answer": "C", "explanation": "吸附可吸附与蛋白结合的毒素、炎症介质，主要清除中大分子物质。"}, {"text": "血液净化的基本清除原理不包括（  ）", "options": ["A.弥散", "B.对流", "C.吸附", "D.超滤", "E.滤过除菌"], "answer": "E", "explanation": "血液净化的基本原理包括弥散、对流、吸附与超滤等，滤过除菌不属于血液净化的清除原理。"}, {"text": "CRRT的紧急适应症中，血钾应大于（  ）", "options": ["A.5.0mmol/L", "B.5.5mmol/L", "C.6.0mmol/L", "D.6.5mmol/L", "E.7.0mmol/L"], "answer": "D", "explanation": "CRRT的紧急适应症中血钾大于6.5mmol/L，需紧急行血液净化治疗。"}, {"text": "CRRT的紧急适应症中，严重酸中毒的pH标准是（  ）", "options": ["A.pH小于7.2", "B.pH小于7.35", "C.pH小于7.0", "D.pH大于7.45", "E.pH小于7.3"], "answer": "A", "explanation": "CRRT的紧急适应症中，严重酸中毒指pH小于7.2。"}, {"text": "血液净化在危重症使用的共识中，重症患者合并ARF时CVVH的治疗剂量不应低于（  ）", "options": ["A.25ml/kg/h", "B.35ml/kg/h", "C.45ml/kg/h", "D.55ml/kg/h", "E.15ml/kg/h"], "answer": "B", "explanation": "血液净化在危重症使用的共识推荐：重症患者合并ARF时，CVVH的治疗剂量不应低于35ml/kg/h（B级）；HVHF用于感染性休克的辅助治疗时，建议剂量不低于45ml/kg/h（D级）。"}, {"text": "CRRT的紧急适应症中，血肌酐的标准是（  ）", "options": ["A.大于100μmol/L", "B.大于200μmol/L", "C.大于300μmol/L", "D.大于400μmol/L", "E.大于500μmol/L"], "answer": "C", "explanation": "CRRT的紧急适应症中血肌酐大于300μmol/L，或血清尿素氮大于25mmol/L。"}, {"text": "容量复苏后尿量仍然在6小时内少于多少毫升属于CRRT的紧急适应症（  ）", "options": ["A.200ml", "B.150ml", "C.100ml", "D.50ml", "E.300ml"], "answer": "C", "explanation": "CRRT的紧急适应症包括容量复苏后尿量仍然6小时内小于100ml。"}, {"text": "行CRRT治疗的重症急性肾损伤需伴血流动力学不稳定和持续清除过多水或毒性物质，下列不属于其常见合并情况的是（  ）", "options": ["A.严重电解质紊乱", "B.酸碱代谢失衡", "C.心力衰竭、肺水肿", "D.脑水肿、急性呼吸窘迫综合征", "E.单纯性甲状腺肿"], "answer": "E", "explanation": "重症急性肾损伤行CRRT的合并情况包括严重电解质紊乱、酸碱代谢失衡、心力衰竭、肺水肿、脑水肿、急性呼吸窘迫综合征、外科手术后、严重感染等，不包括单纯性甲状腺肿。"}, {"text": "属于CRRT肾性适应症的慢性肾脏病并发症是（  ）", "options": ["A.合并急性肺水肿、尿毒症脑病、心力衰竭", "B.单纯性肾囊肿", "C.无症状性血尿", "D.轻度蛋白尿", "E.单纯肾结石"], "answer": "A", "explanation": "CRRT的肾性适应症中，慢性肾脏病并发症包括合并急性肺水肿、尿毒症脑病、心力衰竭、血流动力学不稳定等。"}, {"text": "下列不属于CRRT非肾脏疾病适应症的是（  ）", "options": ["A.多器官功能障碍综合征", "B.脓毒血症或感染性休克", "C.药物或毒物中毒", "D.热射病", "E.无症状胆结石"], "answer": "E", "explanation": "CRRT的非肾脏疾病适应症包括多器官功能障碍综合征、心肺体外循环手术、慢性心力衰竭、肝性脑病、脓毒血症或感染性休克、药物或毒物中毒、急性呼吸窘迫综合征、挤压综合征、肿瘤溶解综合征、急性重症胰腺炎、热射病等，不包括无症状胆结石。"}, {"text": "下列属于CRRT非肾脏疾病适应症的是（  ）", "options": ["A.肿瘤溶解综合征", "B.轻度贫血", "C.单纯性肥胖", "D.无症状胆囊息肉", "E.慢性胃炎"], "answer": "A", "explanation": "肿瘤溶解综合征是CRRT的非肾脏疾病适应症之一，其他还包括挤压综合征、急性重症胰腺炎、热射病等。"}, {"text": "下列属于CRRT相对禁忌症的是（  ）", "options": ["A.重症急性胰腺炎", "B.颅内出血等严重活动性出血", "C.脓毒症", "D.肝性脑病", "E.药物中毒"], "answer": "B", "explanation": "CRRT相对禁忌症包括严重的活动性出血特别是颅内出血、严重的凝血功能障碍、无法建立合适的血管通路；脓毒症、肝性脑病、药物中毒、重症急性胰腺炎均属于CRRT的适应症。"}, {"text": "下列不属于CRRT相对禁忌症的是（  ）", "options": ["A.无法建立合适的血管通路", "B.严重的凝血功能障碍", "C.严重的活动性出血，特别是颅内出血", "D.重症急性胰腺炎", "E.以上均属于相对禁忌症"], "answer": "D", "explanation": "CRRT相对禁忌症包括无法建立合适的血管通路、严重的凝血功能障碍、严重的活动性出血特别是颅内出血；重症急性胰腺炎属于CRRT的非肾脏疾病适应症。"}, {"text": "肝素诱导的血小板减少症的英文缩写是（  ）", "options": ["A.HIT", "B.ITP", "C.TTP", "D.DIC", "E.SIRS"], "answer": "A", "explanation": "HIT即肝素诱导的血小板减少症，是CRRT抗凝相关并发症之一。"}, {"text": "CRRT的抗凝相关并发症主要有（  ）", "options": ["A.出血和肝素诱导的血小板减少", "B.低磷血症和低钾血症", "C.气胸和栓塞", "D.低温与贫血", "E.脂质代谢异常"], "answer": "A", "explanation": "CRRT抗凝相关并发症包括出血和肝素诱导的血小板减少症（HIT）；低磷血症、低钾血症属于酸碱电解质异常，气胸、栓塞属于血管导管相关并发症。"}, {"text": "管道连接、取样、置换液和血滤器更换是哪类并发症的主要原因（  ）", "options": ["A.外源性污染", "B.低血压", "C.出血", "D.气体栓塞", "E.低温"], "answer": "A", "explanation": "管道连接、取样、置换液和血滤器更换是外源性污染的主要原因；透析液或置换液被污染可引起严重的血流感染。"}, {"text": "透析中低血压（IDH）的原因不包括（  ）", "options": ["A.透析过程中患者心搏出量降低", "B.超滤过多、过快", "C.透析前服用降压药物", "D.严格无菌操作", "E.以上均不属于其病因"], "answer": "D", "explanation": "透析中低血压的原因包括透析过程中患者心搏出量降低、超滤过多过快、透析前服用降压药物等；严格无菌操作是预防感染的措施，与低血压无关。"}, {"text": "透析中低血压的表现不包括（  ）", "options": ["A.心率增快、烦躁、打哈欠", "B.恶心、呕吐、出汗、面色苍白", "C.呼吸困难和肌肉痉挛性疼痛", "D.一过性意识丧失", "E.血压明显升高伴剧烈头痛"], "answer": "E", "explanation": "透析中低血压表现为心率增快、烦躁、打哈欠、无意识运动，继而恶心、呕吐、出汗、面色苍白、呼吸困难和肌肉痉挛性疼痛，甚至一过性意识丧失，冠心病患者可诱发心律失常及心绞痛。"}, {"text": "透析中发生低血压时，应嘱患者采取的体位是（  ）", "options": ["A.半坐卧位", "B.头低脚高仰卧位", "C.右侧卧位", "D.俯卧位", "E.端坐位"], "answer": "B", "explanation": "透析中发生低血压时应嘱患者采取头低脚高仰卧位，并降低超滤率或停止超滤。"}, {"text": "透析中发生低血压时，快速补充血容量的措施不包括（  ）", "options": ["A.50%葡萄糖", "B.生理盐水100～250ml", "C.甘露醇", "D.代血浆、白蛋白", "E.大量快速输注冷开水"], "answer": "E", "explanation": "透析中低血压时可快速补充血容量，如50%葡萄糖、生理盐水100～250ml，或甘露醇、代血浆、白蛋白等。"}, {"text": "关于透析中低血压时减慢血流量的做法，正确的说法是（  ）", "options": ["A.是首选的有效措施", "B.经常使用且能增加外周血管阻力", "C.经常使用但并不能增加外周血管阻力", "D.可完全替代补液治疗", "E.可迅速升高血压"], "answer": "C", "explanation": "减慢血流量虽然经常使用，但并不能增加外周血管阻力，通常是无效的。"}, {"text": "透析中低血压经体位调整、停止超滤、快速补液及氧疗后血压好转，下一步应（  ）", "options": ["A.立即结束治疗并下机", "B.逐步恢复超滤，密切监测血压变化", "C.立即加大超滤量", "D.停用所有药物", "E.立即更换透析器"], "answer": "B", "explanation": "透析中低血压经处理血压好转后，可逐步恢复超滤，密切监测血压变化，并评估患者是否有潜在严重病因。"}, {"text": "CRRT并发感染的主要原因中，外源性污染主要来自（  ）", "options": ["A.患者饮水过多", "B.管道连接、取样、置换液和血滤器更换", "C.超滤过快", "D.抗凝剂不足", "E.置换液温度过低"], "answer": "B", "explanation": "管道连接、取样、置换液和血滤器更换是外源性污染的主要原因，透析液或置换液被污染可引起严重的血流感染。"}, {"text": "防止CRRT感染的主要措施是（  ）", "options": ["A.严格无菌操作", "B.加大抗凝剂量", "C.提高置换液温度", "D.减少超滤量", "E.缩短治疗时间"], "answer": "A", "explanation": "防止CRRT感染的主要措施是严格无菌操作，因为透析液或置换液被污染可引起严重的血流感染。"}, {"text": "CRRT患者出血的原因主要与下列哪项有关（  ）", "options": ["A.血小板粘附与凝血功能障碍及抗凝剂使用", "B.置换液温度过低", "C.超滤量过大", "D.血流量过大", "E.中心静脉导管过短"], "answer": "A", "explanation": "CRRT患者出血主要与自身血小板粘附功能和凝血功能障碍及透析过程中抗凝剂的使用有关。"}, {"text": "血液灌流（HP）的英文全称是（  ）", "options": ["A.Hemoperfusion", "B.Hemodialysis", "C.Hemofiltration", "D.Plasma Exchange", "E.Immunoadsorption"], "answer": "A", "explanation": "HP即Hemoperfusion（血液灌流），是将患者血液引到体外循环系统，通过灌流器中吸附剂清除代谢产物、毒性物质及药物的治疗方法。"}, {"text": "血液灌流主要通过灌流器中的哪类物质发挥清除作用（  ）", "options": ["A.半透膜", "B.吸附剂", "C.血浆分离器", "D.滤过器", "E.离子交换柱"], "answer": "B", "explanation": "血液灌流通过灌流器中吸附剂（如活性炭、树脂等材料）与体内待清除的代谢产物、毒性物质及药物间的吸附结合达到清除目的。"}, {"text": "目前血液灌流多用于下列哪类情况的治疗（  ）", "options": ["A.慢性肾衰竭", "B.药物过量或中毒", "C.心力衰竭", "D.急性胰腺炎", "E.脓毒症"], "answer": "B", "explanation": "目前血液灌流多用于药物过量或中毒的治疗。"}, {"text": "HP禁忌证中，血小板低于多少时禁止进行HP治疗（  ）", "options": ["A.50×10^9/L", "B.70×10^9/L", "C.90×10^9/L", "D.100×10^9/L", "E.30×10^9/L"], "answer": "B", "explanation": "HP禁忌证包括对灌流器及相关材料过敏者、血小板低于70×10^9/L禁止进行HP治疗。"}, {"text": "阿加曲班用于活动性出血或高危出血风险、肝素类药物过敏或既往发生HIT的患者时，一般首剂量为（  ）", "options": ["A.25μg/kg", "B.250μg/kg", "C.500μg/kg", "D.2.5mg/kg", "E.250mg/kg"], "answer": "B", "explanation": "阿加曲班一般首剂量250μg/kg、追加剂量2μg/（kg·min），或2μg/（kg·min）持续滤器前给药，并依据患者血浆APTT的监测调整剂量。"}, {"text": "HA树脂血液灌流器的比表面积可达（  ）", "options": ["A.130㎡/g", "B.1300㎡/g", "C.500㎡/g", "D.50㎡/g", "E.13000㎡/g"], "answer": "B", "explanation": "HA树脂血液灌流器比表面积达1300㎡/g，具有吸附相对特异性、生物相容性好、机械强度高不易脱颗粒等特点。"}, {"text": "HA树脂血液灌流器不包括下列哪一型号（  ）", "options": ["A.HA130", "B.HA230", "C.HA280", "D.HA330", "E.HA1300"], "answer": "E", "explanation": "HA树脂血液灌流器的常用型号为HA130、HA230、HA280、HA330、HA330-Ⅱ，不包括HA1300。"}, {"text": "关于活性炭吸附剂的特点，正确的是（  ）", "options": ["A.微粒不易脱落", "B.以小孔为主，只能吸附小分子物质", "C.吸附具有高度选择性", "D.生物相容性极好", "E.机械强度高不易脱颗粒"], "answer": "B", "explanation": "活性炭吸附剂微粒易脱落，以小孔为主只能吸附小分子物质，表面化学基团复杂、吸附无选择性。"}, {"text": "树脂吸附剂的特点不包括（  ）", "options": ["A.比表面积大", "B.吸附具有相对特异性", "C.生物相容性好", "D.机械强度高，不易脱颗粒", "E.微粒易脱落"], "answer": "E", "explanation": "树脂吸附剂比表面积大（1300㎡/g）、吸附具有相对特异性、生物相容性好、机械强度高不易脱颗粒；微粒易脱落是活性炭吸附剂的缺点。"}, {"text": "血液灌流使用普通肝素抗凝时，一般首剂量为（  ）", "options": ["A.0.1～0.2mg/kg", "B.0.5～1.0mg/kg", "C.2.0～3.0mg/kg", "D.4.0mg/kg", "E.10mg/kg"], "answer": "B", "explanation": "血液灌流普通肝素抗凝一般首剂量0.5～1.0mg/kg，肝素剂量应依据患者的凝血状态个体化调整。"}, {"text": "血液灌流使用普通肝素抗凝时，追加剂量为（  ）", "options": ["A.1～5mg/h", "B.10～20mg/h", "C.20～30mg/h", "D.50～100mg/h", "E.不需要追加剂量"], "answer": "B", "explanation": "血液灌流普通肝素抗凝追加剂量为10～20mg/h，可采用间歇性静脉注射或持续性静脉输注（常用）。"}, {"text": "血液灌流使用普通肝素抗凝时，应在预期结束前多久停止追加（  ）", "options": ["A.结束前10分钟", "B.结束前20分钟", "C.结束前30分钟", "D.结束前60分钟", "E.无需停止追加"], "answer": "C", "explanation": "血液灌流使用普通肝素抗凝时，预期结束前30分钟停止追加肝素。"}, {"text": "血液灌流使用低分子肝素抗凝时，一般选择的剂量为（  ）", "options": ["A.20～40IU/kg", "B.60～80IU/kg", "C.100～120IU/kg", "D.150IU/kg", "E.200IU/kg"], "answer": "B", "explanation": "血液灌流低分子肝素抗凝一般选择60～80IU/kg，推荐在治疗前20～30分钟静脉注射，无需追加剂量。"}, {"text": "血液灌流使用低分子肝素抗凝时，推荐的给药时间是（  ）", "options": ["A.治疗前即刻", "B.治疗前20～30分钟静脉注射", "C.治疗结束后", "D.治疗开始后30分钟", "E.治疗前2小时"], "answer": "B", "explanation": "血液灌流低分子肝素抗凝一般选择60～80IU/kg，推荐在治疗前20～30分钟静脉注射，无需追加剂量。"}, {"text": "血液灌流预冲时，肝素生理盐水的浓度和保留灌注时间是（  ）", "options": ["A.2mg/dl，10分钟", "B.4mg/dl，20分钟", "C.4mg/dl，60分钟", "D.8mg/dl，20分钟", "E.10mg/dl，30分钟"], "answer": "B", "explanation": "血液灌流抗凝实施前给予4mg/dl的肝素生理盐水预冲、保留灌注20分钟，有助于增强抗凝效果。"}, {"text": "血液灌流抗凝预处理后，再给予生理盐水冲洗的量是（  ）", "options": ["A.100ml", "B.200ml", "C.300ml", "D.500ml", "E.1000ml"], "answer": "D", "explanation": "血液灌流抗凝实施前给予4mg/dl肝素生理盐水预冲、保留灌注20分钟后，再给予生理盐水500ml冲洗，有助于增强抗凝效果。"}, {"text": "HP适应证中，尿毒症患者尤为适用的情况是（  ）", "options": ["A.顽固性瘙痒、难治性高血压", "B.单纯性贫血", "C.无症状性血尿", "D.轻度水肿", "E.低钾血症"], "answer": "A", "explanation": "HP适应证中尿毒症患者尤其是顽固性瘙痒、难治性高血压适用。"}, {"text": "在肾内科临床应用中，用于药物中毒、蜂蛰伤、食物中毒且效果显著的灌流器型号是（  ）", "options": ["A.HA230、HA330", "B.HA130、HA280", "C.HA330-Ⅱ", "D.活性炭灌流器", "E.内毒素吸附柱"], "answer": "A", "explanation": "在药物中毒（如有机磷农药中毒）、蜂蛰伤、食物中毒（如野生菌中毒）方面，大量开展了HA230、HA330的临床应用且效果显著。"}, {"text": "HA330-Ⅱ树脂血液灌流器主要适用于（  ）", "options": ["A.各种重症肝病、急慢性肝功能衰竭", "B.单纯性贫血", "C.无症状性蛋白尿", "D.轻度高血压", "E.慢性胃炎"], "answer": "A", "explanation": "HA330-Ⅱ树脂血液灌流器用于各种重症肝病、急慢性肝功能衰竭、药物性肝炎、肝性脑病。"}, {"text": "血浆吸附（PA）的操作过程是血液引出后先进入血浆分离器，随后（  ）", "options": ["A.血浆直接丢弃", "B.血浆再进入吸附柱进行吸附清除特定物质", "C.血浆与置换液等量交换", "D.血浆回输给他人", "E.血浆经高温灭活后回输"], "answer": "B", "explanation": "血浆吸附是血液引出后先进入血浆分离器，将血液的有形成分与血浆分开，血浆再进入吸附柱进行吸附、清除血浆中特定物质，吸附后血浆与分离的有形成分再回输至体内。"}, {"text": "免疫吸附柱的分类包括（  ）", "options": ["A.生物亲和吸附柱和物理化学亲和吸附柱", "B.阳离子与阴离子交换柱", "C.大孔与中孔吸附柱", "D.活性炭与树脂吸附柱", "E.膜式与柱式吸附柱"], "answer": "A", "explanation": "免疫吸附柱可分为两大类，即生物亲和吸附柱和物理化学亲和吸附柱。"}, {"text": "葡萄球菌A蛋白（SPA）吸附柱属于（  ）", "options": ["A.物理化学亲和吸附柱中的疏水结合型", "B.生物亲和吸附柱", "C.物理化学亲和吸附柱中的静电结合型", "D.活性炭吸附柱", "E.离子交换柱"], "answer": "B", "explanation": "葡萄球菌A蛋白（SPA）吸附柱属于生物亲和吸附柱；生物亲和吸附柱包括抗原抗体结合型、补体结合型、Fe结合型三种。"}, {"text": "双重滤过血浆置换治疗时根据致病物质分子量不同选择不同膜孔径血浆滤过器，其目的是（  ）", "options": ["A.完全清除致病物质并减少白蛋白丢失", "B.减少置换液用量", "C.缩短治疗时间", "D.降低治疗费用", "E.避免使用抗凝剂"], "answer": "A", "explanation": "治疗时应根据致病物质分子量的不同选择不同膜孔径的血浆滤过器，使之既能保证完全清除致病物质，又可最大限度地减少白蛋白的丢失。"}, {"text": "双重滤过血浆置换（DFPP）所利用的滤过器是（  ）", "options": ["A.一个血浆分离器", "B.血浆分离器和血浆滤过器", "C.三个滤过器", "D.四个滤过器", "E.一个内毒素吸附柱"], "answer": "B", "explanation": "DFPP利用两个不同孔径的滤过器，其一为血浆分离器，其二为血浆滤过器。"}, {"text": "DFPP每次分离血浆3～4L，仅丢弃的致病血浆量为（  ）", "options": ["A.300～400ml", "B.500～600ml", "C.800～1000ml", "D.1500ml", "E.2000ml"], "answer": "B", "explanation": "DFPP每次分离血浆3～4L，仅丢弃500～600ml致病血浆，保留了大部分白蛋白。"}, {"text": "关于双重滤过血浆置换的局限性，下列说法正确的是（  ）", "options": ["A.对致病物质分子量有要求，选择性稍差", "B.白蛋白完全没有损失", "C.属于病因治疗", "D.可完全替代免疫抑制剂", "E.没有任何局限性"], "answer": "A", "explanation": "DFPP对致病物质的分子量有一定要求、选择性仍相对稍差、存在少量白蛋白损失，且并非病因治疗，不能完全替代免疫抑制剂。"}, {"text": "血浆置换置换液选择的基本原则是（  ）", "options": ["A.缺什么，补什么；补足所需量", "B.一律使用生理盐水", "C.一律使用白蛋白", "D.一律用新鲜冰冻血浆", "E.晶体与胶体按1:1使用"], "answer": "A", "explanation": "血浆置换置换液选择的基本原则是缺什么、补什么，补足所需量，并针对各种置换液的优缺点互相弥补。"}, {"text": "单纯血浆置换疗法中，晶体和胶体的容积比以多少为妥（  ）", "options": ["A.1:1", "B.1:2", "C.2:1", "D.3:1", "E.1:3"], "answer": "B", "explanation": "单纯血浆置换疗法晶体和胶体的容积比以1:2为妥，即前1/3用晶体，后2/3用5%白蛋白。"}, {"text": "单纯血浆置换疗法中，5%白蛋白位于置换液总量的（  ）", "options": ["A.前1/3", "B.后2/3", "C.全程等量", "D.仅在治疗开始阶段", "E.仅在治疗结束阶段"], "answer": "B", "explanation": "单纯血浆置换疗法晶体和胶体的容积比以1:2为妥，即前1/3用晶体，后2/3用5%白蛋白。"}, {"text": "推荐置换液全部使用新鲜冰冻血浆的患者是（  ）", "options": ["A.血栓性血小板减少性紫癜、重症肝炎患者", "B.所有血浆置换患者", "C.单纯高血压患者", "D.糖尿病肾病患者", "E.甲状腺功能亢进患者"], "answer": "A", "explanation": "并非每个患者都必须补充新鲜冰冻血浆，但血栓性血小板减少性紫癜、溶血性尿毒症综合征以及重症肝炎等患者推荐置换液全部用新鲜冰冻血浆。"}, {"text": "血浆置换时，血浆代用品最大补充量只能占置换液的（  ）", "options": ["A.10%", "B.20%", "C.30%", "D.50%", "E.80%"], "answer": "B", "explanation": "血浆代用品最大补充量只能占置换液的20%，且多于刚开始置换时使用。"}, {"text": "单纯血浆置换疗法的缺点是（  ）", "options": ["A.选择性差，白蛋白、凝血因子等成分丢失", "B.对致病物质清除相对彻底", "C.操作相对简单", "D.适应证广泛", "E.无需补充血浆"], "answer": "A", "explanation": "单纯血浆置换疗法的缺点是选择性差，白蛋白、凝血因子以及其他非致病性血液成分丢失，且需要大量的血浆，增加输血风险和感染几率。"}, {"text": "血浆置换治疗的禁忌症不包括（  ）", "options": ["A.活动性出血或出血倾向十分明显", "B.弥漫性血管内凝血", "C.休克及血流动力学不稳定", "D.对肝素、鱼精蛋白、血浆过敏", "E.格林巴利综合征"], "answer": "E", "explanation": "血浆置换的禁忌症包括活动性出血或出血倾向十分明显、弥漫性血管内凝血、休克及血流动力学不稳定、对肝素、鱼精蛋白、血浆过敏、严重全身及局部感染、非稳定期的心脑梗死、颅内出血或重度脑水肿伴有脑疝、存在精神障碍而不能配合治疗者；格林巴利综合征属于其适应证。"}, {"text": "双重滤过血浆置换的SOP推荐治疗频率是（  ）", "options": ["A.每天1次，共3次", "B.间隔1～2天，5～7次为一个疗程", "C.每周1次，共10次", "D.间隔3～5天，2次为一疗程", "E.每月1次，共6次"], "answer": "B", "explanation": "双重滤过血浆置换SOP推荐间隔1～2天，5～7次为一个疗程，或直到致病抗体转阴。"}, {"text": "血浆置换单次置换剂量以患者血容量的多少倍为宜（  ）", "options": ["A.0.5倍", "B.1～1.5倍", "C.2倍", "D.3倍", "E.4倍"], "answer": "B", "explanation": "血浆置换单次置换剂量以患者血容量的1～1.5倍为宜，不建议超过2倍。"}, {"text": "血液灌流的治疗时间一般为（  ）", "options": ["A.2～3小时/次", "B.5.5小时/次", "C.1小时/次", "D.8小时/次", "E.12小时/次"], "answer": "A", "explanation": "血液灌流的治疗时间一般为2～3小时/次，血浆吸附为5.5小时/次。"}, {"text": "关于血液灌流与血浆吸附的比较，正确的是（  ）", "options": ["A.血浆吸附无需血浆分离、操作简单", "B.血液灌流血小板破坏少、生物相容性好", "C.血液灌流无需分离血浆，但血小板破坏多", "D.血浆吸附的治疗时间比血液灌流短", "E.血浆吸附时灌流器容易饱和"], "answer": "C", "explanation": "血液灌流无需血浆分离、操作简单，但血小板破坏多、生物相容性差、灌流器容易饱和；血浆吸附需先行血浆分离、操作相对复杂，但血小板破坏少、生物相容性好，可充分发挥灌流器的吸附效果。"}, {"text": "理想抗凝剂应具备的特点不包括（  ）", "options": ["A.抗血栓作用强，而抗凝作用弱", "B.药物抗凝作用最好只局限于滤器中", "C.药物监测简便易行，适于床边使用", "D.药物过量有拮抗剂", "E.价格昂贵且代谢缓慢"], "answer": "E", "explanation": "理想抗凝剂应具备：抗血栓作用强而抗凝作用弱、药物抗凝作用最好只局限于滤器中、药物监测简便易行适于床边使用、药物过量有拮抗剂。"}, {"text": "常用抗凝剂分类中，通过使抗凝血酶Ⅲ活化发挥抗凝作用的是（  ）", "options": ["A.枸橼酸", "B.肝素", "C.阿加曲班", "D.萘莫司他", "E.维生素K拮抗剂"], "answer": "B", "explanation": "常用抗凝剂分类中，肝素通过使抗凝血酶Ⅲ活化发挥抗凝作用；枸橼酸通过与钙形成复合物发挥抗凝作用，阿加曲班属于凝血酶拮抗剂，萘莫司他属于蛋白酶抑制剂。"}, {"text": "甲磺酸萘莫司他属于下列哪一类药物（  ）", "options": ["A.广谱强效的丝氨酸蛋白酶抑制药", "B.凝血酶拮抗剂", "C.钙螯合剂", "D.抗血小板聚集药", "E.维生素K拮抗剂"], "answer": "A", "explanation": "甲磺酸萘莫司他为广谱强效的丝氨酸蛋白酶抑制药，对胰蛋白酶、凝血酶、纤溶酶和补体成分等多种丝氨酸蛋白酶有较强的抑制作用。"}, {"text": "枸橼酸钠抗凝的常用规格为200ml含8g，其浓度是（  ）", "options": ["A.2%", "B.4%", "C.8%", "D.10%", "E.0.4%"], "answer": "B", "explanation": "枸橼酸钠抗凝常用规格为200ml含8g，即浓度为4%，为体外抗凝剂。"}]}, {"type": "multiple", "questions": [{"text": "关于血液净化技术，下列描述正确的有（  ）", "options": ["Ａ.清除体内过多水分与溶质方法的总称", "Ｂ.在肾脏替代治疗技术基础上发展而来", "Ｃ.应用于各种常见危重症患者的救治", "Ｄ.各方式特点与适用疾病状态不同", "Ｅ.所有方式的清除物质范围完全相同"], "answer": "ABCD", "explanation": "血液净化技术是各种连续或间断清除体内过多水分、溶质方法的总称，是在肾脏替代治疗技术基础上逐步发展而来，应用于各种常见危重症患者的救治；每一种血液净化方式都各有特点且各适用于不同疾病或不同疾病状态，故E错误。"}, {"text": "血液净化技术包括下列哪些方式（  ）", "options": ["Ａ.血液透析（HD）", "Ｂ.血液滤过（HF）", "Ｃ.连续性血液净化（CBP）", "Ｄ.单重血浆置换（PE）", "Ｅ.胃镜活检"], "answer": "ABCD", "explanation": "血液净化技术包括血液透析（HD）、血液滤过（HF）、血液透析滤过（HDF）、连续性血液净化（CBP）、血液灌流（HP）、免疫吸附、血浆吸附、单重血浆置换（PE）、双重血浆置换（DFPP）、腹膜透析（PD）、人工肝支持系统（ALSS）等，不包括胃镜活检。"}, {"text": "关于连续性肾脏替代治疗（CRRT），正确的有（  ）", "options": ["Ａ.把患者血液引至体外，通过净化装置连续清除溶质", "Ｂ.治疗时间为每天24小时或接近24小时", "Ｃ.治疗时间固定为每次4小时且不能调整", "Ｄ.已广泛应用于急危重症患者的抢救治疗", "Ｅ.仅用于治疗慢性肾衰竭患者"], "answer": "ABD", "explanation": "CRRT把患者血液引至体外，通过净化装置连续清除溶质，治疗时间为每天24小时或接近24小时，可根据患者治疗需求灵活调整；目前血液净化疗法已不单纯用于治疗急、慢性肾衰竭患者，在急危重症患者的抢救治疗中也已得到广泛应用，故C、E错误。"}, {"text": "CRRT的常用治疗模式包括（  ）", "options": ["Ａ.CVVH（连续性静脉血液滤过）", "Ｂ.CVVHD（连续性静脉血液透析）", "Ｃ.CVVHDF（连续性静脉血液透析滤过）", "Ｄ.SCUF（缓慢连续性超滤）", "Ｅ.PE（血浆置换）"], "answer": "ABCD", "explanation": "CRRT常用治疗模式包括CVVH、CVVHD、CVVHDF和SCUF；PE为血浆置换，不属于CRRT的常用治疗模式。"}, {"text": "血浆置换治疗可应用于下列哪些系统疾病（  ）", "options": ["Ａ.肝脏疾病", "Ｂ.血液系统疾病（如血栓性血小板减少性紫癜）", "Ｃ.神经系统疾病（如格林巴利综合征）", "Ｄ.代谢性疾病（如家族性高胆固醇血症）", "Ｅ.单纯性近视"], "answer": "ABCD", "explanation": "血浆置换治疗可应用于肝脏疾病、血液系统疾病、神经系统疾病、代谢性疾病、重症中毒、产科、肾脏疾病、风湿性疾病等，不包括单纯性近视。"}, {"text": "CRRT的肾性适应症包括（  ）", "options": ["Ａ.重症急性肾损伤伴血流动力学不稳定", "Ｂ.慢性肾脏病合并急性肺水肿", "Ｃ.尿毒症脑病", "Ｄ.慢性肾脏病合并心力衰竭、血流动力学不稳定", "Ｅ.无症状性单纯蛋白尿"], "answer": "ABCD", "explanation": "CRRT的肾性适应症包括重症急性肾损伤伴血流动力学不稳定和需要持续清除过多水或毒性物质，以及慢性肾脏病并发症如合并急性肺水肿、尿毒症脑病、心力衰竭、血流动力学不稳定等；无症状性单纯蛋白尿不属于其适应证。"}, {"text": "CRRT的紧急适应症包括（  ）", "options": ["Ａ.血钾大于6.5mmol/L", "Ｂ.严重酸中毒（pH小于7.2）", "Ｃ.严重的器官组织水肿（如肺水肿）", "Ｄ.血肌酐大于300μmol/L", "Ｅ.容量复苏后尿量6小时内大于500ml"], "answer": "ABCD", "explanation": "CRRT的紧急适应症为血钾大于6.5mmol/L、严重酸中毒（pH小于7.2）、严重的器官组织水肿（如肺水肿）、血清尿素氮大于25mmol/L或血肌酐大于300μmol/L，以及容量复苏后尿量仍然6小时内小于100ml，故E错误。"}, {"text": "下列属于CRRT相对禁忌症的有（  ）", "options": ["Ａ.无法建立合适的血管通路", "Ｂ.严重的凝血功能障碍", "Ｃ.严重的活动性出血，特别是颅内出血", "Ｄ.脓毒血症或感染性休克", "Ｅ.药物或毒物中毒"], "answer": "ABC", "explanation": "CRRT相对禁忌症为无法建立合适的血管通路、严重的凝血功能障碍、严重的活动性出血特别是颅内出血；脓毒血症或感染性休克、药物或毒物中毒均为CRRT的适应症。"}, {"text": "CRRT的非肾脏疾病适应症包括（  ）", "options": ["Ａ.多器官功能障碍综合征", "Ｂ.心肺体外循环手术", "Ｃ.挤压综合征", "Ｄ.肿瘤溶解综合征", "Ｅ.慢性支气管炎"], "answer": "ABCD", "explanation": "CRRT的非肾脏疾病适应症包括多器官功能障碍综合征、心肺体外循环手术、慢性心力衰竭、肝性脑病、脓毒血症或感染性休克、药物或毒物中毒、急性呼吸窘迫综合征、乳酸酸中毒及严重的电解质和酸碱代谢紊乱、挤压综合征、肿瘤溶解综合征、急性重症胰腺炎、热射病等，不包括慢性支气管炎。"}, {"text": "CRRT的血管导管相关并发症包括（  ）", "options": ["Ａ.全身感染、栓塞", "Ｂ.动静脉漏、心律失常", "Ｃ.气胸、疼痛", "Ｄ.管路脱开、血管撕裂", "Ｅ.低磷血症、低钾血症"], "answer": "ABCD", "explanation": "血管导管相关并发症包括全身感染、栓塞、动静脉漏、心律失常、气胸、疼痛、管路脱开、血管撕裂等；低磷血症、低钾血症属于酸碱电解质异常类并发症。"}, {"text": "CRRT的治疗相关并发症包括（  ）", "options": ["Ａ.低温", "Ｂ.贫血", "Ｃ.低血容量、低血压", "Ｄ.低磷血症、低钾血症", "Ｅ.肝素诱导的血小板减少症（HIT）"], "answer": "ABCD", "explanation": "CRRT治疗相关并发症包括低温、贫血、低血容量、低血压，以及酸碱电解质异常如低磷血症、低钾血症、酸中毒、碱中毒等；HIT属于抗凝相关并发症。"}, {"text": "透析中低血压的处理措施包括（  ）", "options": ["Ａ.采取头低脚高仰卧位", "Ｂ.降低超滤率或停止超滤", "Ｃ.快速补充血容量，如生理盐水100～250ml", "Ｄ.给予患者氧疗", "Ｅ.立即加快血流量以升高血压"], "answer": "ABCD", "explanation": "透析中低血压的处理包括采取头低脚高仰卧位、降低超滤率或停止超滤、快速补充血容量（50%葡萄糖、生理盐水100～250ml，或甘露醇、代血浆、白蛋白等）、氧疗，血压好转后逐步恢复超滤并密切监测血压；减慢或加快血流量并不能增加外周血管阻力，通常是无效的，故E错误。"}, {"text": "关于CRRT并发感染的防治，正确的有（  ）", "options": ["Ａ.外源性污染主要来自管道连接、取样、置换液和血滤器更换", "Ｂ.透析液或置换液被污染可引起严重的血流感染", "Ｃ.严格无菌操作是防止感染的主要措施", "Ｄ.置换液被污染与感染无关", "Ｅ.感染仅由患者自身因素引起"], "answer": "ABC", "explanation": "管道连接、取样、置换液和血滤器更换是外源性污染的主要原因，透析液或置换液被污染可引起严重的血流感染，因此严格无菌操作是防止感染的主要措施；D、E说法错误。"}, {"text": "CRRT患者出血的处理措施包括（  ）", "options": ["Ａ.确定合适的抗凝方式和抗凝剂量", "Ｂ.观察穿刺点有无渗血及鼻腔、牙龈有无出血", "Ｃ.观察全身皮肤有无瘀斑瘀点以及有无呕血、黑便", "Ｄ.遵医嘱降低或暂停抗凝剂，必要时更换抗凝方式", "Ｅ.出血时加大抗凝剂剂量以维持治疗"], "answer": "ABCD", "explanation": "CRRT患者出血的处理包括确定合适的抗凝方式和抗凝剂量，观察穿刺点有无渗血、鼻腔牙龈有无出血、全身皮肤有无瘀斑瘀点以及有无呕血黑便、有无神志改变，根据出血情况遵医嘱降低或暂停抗凝剂、必要时更换抗凝方式；出血时加大抗凝剂量是错误的，故E错误。"}, {"text": "血液灌流（HP）的适应证包括（  ）", "options": ["Ａ.急性药物或毒物中毒", "Ｂ.尿毒症，尤其是顽固性瘙痒、难治性高血压", "Ｃ.暴发性肝衰竭导致的肝性脑病、高胆红素血症", "Ｄ.脓毒症或系统性炎症综合征", "Ｅ.对灌流器及相关材料过敏者"], "answer": "ABCD", "explanation": "HP的适应证包括急性药物或毒物中毒，尿毒症尤其是顽固性瘙痒、难治性高血压，重症肝炎特别是暴发性肝衰竭导致的肝性脑病、高胆红素血症，脓毒症或系统性炎症综合征，银屑病或其它自身免疫性疾病等；对灌流器及相关材料过敏者属于HP禁忌证。"}, {"text": "HP的禁忌证包括（  ）", "options": ["Ａ.对灌流器及相关材料过敏者", "Ｂ.血小板低于70×10^9/L", "Ｃ.急性药物或毒物中毒", "Ｄ.尿毒症伴顽固性瘙痒", "Ｅ.脓毒症或系统性炎症综合征"], "answer": "AB", "explanation": "HP的禁忌证为对灌流器及相关材料过敏者、血小板低于70×10^9/L（白细胞减少或其他凝血障碍者慎用）；急性药物或毒物中毒、尿毒症伴顽固性瘙痒、脓毒症或系统性炎症综合征均为HP的适应证。"}, {"text": "血液灌流中普通肝素抗凝的要点包括（  ）", "options": ["Ａ.一般首剂量0.5～1.0mg/kg", "Ｂ.追加剂量10～20mg/h", "Ｃ.肝素剂量应依据患者的凝血状态个体化调整", "Ｄ.实施前用4mg/dl肝素生理盐水预冲并保留灌注20分钟", "Ｅ.预期结束前2小时停止追加"], "answer": "ABCD", "explanation": "血液灌流普通肝素抗凝一般首剂量0.5～1.0mg/kg、追加剂量10～20mg/h，采用间歇性静脉注射或持续性静脉输注（常用），肝素剂量应依据患者凝血状态个体化调整；实施前给予4mg/dl的肝素生理盐水预冲、保留灌注20分钟，再给予生理盐水500ml冲洗；预期结束前30分钟停止追加，故E错误。"}, {"text": "关于树脂吸附剂的特点，正确的有（  ）", "options": ["Ａ.比表面积达1300㎡/g", "Ｂ.吸附具有相对特异性", "Ｃ.生物相容性好", "Ｄ.机械强度高，不易脱颗粒", "Ｅ.以小孔为主，只能吸附小分子物质"], "answer": "ABCD", "explanation": "树脂吸附剂的特点是比表面积大（1300㎡/g）、吸附具有相对特异性、生物相容性好、机械强度高不易脱颗粒；以小孔为主只能吸附小分子物质是活性炭吸附剂的特点，故E错误。"}, {"text": "血液灌流治疗中毒的原则包括（  ）", "options": ["Ａ.在积极内科治疗的基础上早期、足量进行", "Ｂ.接触毒物6小时内进行效果最佳", "Ｃ.有条件时联合透析、CRRT等其他血液净化方式", "Ｄ.普通毒物中毒每天治疗1次、每次120～150分钟、3次为一个疗程", "Ｅ.中毒后应等待24小时以上再行血液灌流"], "answer": "ABCD", "explanation": "血液灌流的治疗原则是在积极内科治疗基础上早期、足量进行，接触毒物6小时内进行血液灌流效果最佳，有条件时联合透析、CRRT等方式效果更佳；普通毒物中毒每天治疗1次、每次120～150分钟、3次为一个疗程，故E错误。"}, {"text": "关于血液灌流的并发症，正确的有（  ）", "options": ["Ａ.生物不相容性表现为寒战、发热、胸闷、呼吸困难", "Ｂ.生物不相容性时血小板可一过性下降至灌流前的30%～40%", "Ｃ.吸附颗粒栓塞表现为进行性呼吸困难、胸闷、血压下降", "Ｄ.空气栓塞诊断成立必须立即停止灌流治疗", "Ｅ.灌流治疗过程不会引起体温下降"], "answer": "ABCD", "explanation": "生物不相容性多发生在灌流治疗开始后0.5～1.0小时，表现为寒战、发热、胸闷、呼吸困难及白细胞或血小板一过性下降（可低至灌流前的30%～40%）；吸附颗粒栓塞表现为治疗开始后出现进行性呼吸困难、胸闷、血压下降；空气栓塞一旦诊断成立必须立即停止灌流治疗并吸入高浓度氧气；灌流过程可因体外循环没有加温设备等原因引起体温下降，故E错误。"}, {"text": "预防血液灌流凝血的关键措施包括（  ）", "options": ["Ａ.预冲充分，预冲液量保证3000毫升以上", "Ｂ.灌流器的充分肝素化", "Ｃ.肝素用量个体化并监测凝血功能指标", "Ｄ.血容量不足者可在HP前补液500～700毫升", "Ｅ.保持较高环境温度以利于凝血"], "answer": "ABCD", "explanation": "预防凝血的首要步骤是预冲充分，预冲液量保证3000毫升以上并保证灌流器的充分肝素化；肝素用量强调个体化、监测凝血功能指标；血容量不足的病人可考虑HP前补液500～700毫升，病情允许时尽快将血流量调至150～200毫升/分；无保温装置时应保持环境温度低，故E错误。"}, {"text": "预防血液灌流出血的注意事项包括（  ）", "options": ["Ａ.个体化的肝素用量", "Ｂ.实施凝血功能的监测", "Ｃ.拔针后应按压半小时以上，确定不出血后才能放松", "Ｄ.治疗后如有出血倾向，可用鱼精蛋白中和残余肝素", "Ｅ.自行加大肝素剂量以延长灌流器寿命"], "answer": "ABCD", "explanation": "预防出血应注意个体化的肝素用量、实施凝血功能的监测、拔针后按压半小时以上确定不出血后才能放松，治疗后如有出血倾向可用鱼精蛋白中和残余肝素；加大肝素剂量会增加出血风险，故E错误。"}, {"text": "关于鱼精蛋白的使用，正确的有（  ）", "options": ["Ａ.注入速度不宜过快，以防引起急性低血压、呼吸困难等反应", "Ｂ.鱼精蛋白本身无止血作用", "Ｃ.1mg鱼精蛋白在体内约中和100U肝素", "Ｄ.一般中和一次HP治疗用肝素不应超过50mg", "Ｅ.鱼精蛋白可完全中和低分子肝素的抗Xa活性"], "answer": "ABCD", "explanation": "注入鱼精蛋白时速度不宜过快，以防发生反应引起急性低血压、呼吸困难、心跳过速及过敏，使用时应准备治疗休克的药物及设备；鱼精蛋白本身无止血作用，1mg鱼精蛋白在体内约中和100U肝素，一般中和一次HP治疗用肝素不应超过50mg；鱼精蛋白不能完全中和低分子量肝素的抗Xa活性，约中和60%，故E错误。"}, {"text": "关于枸橼酸钠抗凝，正确的有（  ）", "options": ["Ａ.枸橼酸钠为体外抗凝剂", "Ｂ.枸橼酸根与血中钙离子生成难解离的枸橼酸钙", "Ｃ.血液进入体外循环后即加入枸橼酸，进入体内前补充游离钙", "Ｄ.通过测定游离钙监测抗凝", "Ｅ.枸橼酸钠抗凝时患者体内血液也处于抗凝状态"], "answer": "ABCD", "explanation": "枸橼酸钠为体外抗凝剂，其根离子与血中钙离子生成难解离的可溶性螯合物枸橼酸钙，凝血过程受到抑制；血液进入体外循环后即加入枸橼酸，进入体内前补充游离钙，通过测定游离钙监测抗凝，即体外循环血液被抗凝而体内血液正常，故E错误。"}, {"text": "关于无肝素抗凝治疗，正确的有（  ）", "options": ["Ａ.将5000～20000U普通肝素预冲并保留一段时间后丢弃预冲液", "Ｂ.治疗时定期生理盐水冲管，0.5～1小时冲100～200ml", "Ｃ.适用于有活动性出血、高危出血或有肝素使用禁忌证的患者", "Ｄ.缺点是滤器寿命短、血液丢失多、治疗时间无法保证", "Ｅ.无肝素抗凝时凝血几乎不会发生"], "answer": "ABCD", "explanation": "无肝素治疗将5000～20000U的普通肝素预冲并保留一段时间后丢弃管路中的预冲液，治疗时定期生理盐水冲管，0.5～1小时冲100～200ml，适用于有活动性出血、高危出血或有肝素使用禁忌证的患者；其出血风险虽低，但滤器寿命短、血液丢失多、超滤未达标、治疗时间无法保证、护士工作强度大，凝血几乎是必然要发生的事情，故E错误。"}, {"text": "关于低分子肝素抗凝的特点，正确的有（  ）", "options": ["Ａ.HIT发生率低", "Ｂ.药代动力学更稳定", "Ｃ.半衰期长", "Ｄ.Xa活性不易监测，拮抗剂不易中和", "Ｅ.CRRT结束后抗凝效果立即消失"], "answer": "ABCD", "explanation": "低分子肝素的优点是HIT发生率低、药代动力学稳定、半衰期长；缺点是存在潜在出血风险、Xa活性不易监测、拮抗剂不易中和，且CRRT结束后滞后的抗凝效果可长达4小时，故E错误。"}, {"text": "关于血浆置换治疗的特点，正确的有（  ）", "options": ["Ａ.使用血浆分离器将血浆与血细胞分离", "Ｂ.分离的血浆直接丢弃，用健康人血浆或人血白蛋白替代回输", "Ｃ.及时、快速地清除体内的致病因子是其主要机制", "Ｄ.可调节免疫系统功能并补充血浆、恢复血浆因子的功能", "Ｅ.选择性高，不会丢失白蛋白和凝血因子"], "answer": "ABCD", "explanation": "血浆置换使用血浆分离器将血浆与血细胞分离，将分离的血浆直接丢弃，使用健康人血浆或人血白蛋白替代血浆回输体内；其机理包括及时、快速地清除体内的致病因子（主要机制）、调节免疫系统的功能、补充血浆并恢复血浆因子的功能；单纯血浆置换选择性差，白蛋白、凝血因子以及其他非致病性血液成分会丢失，故E错误。"}, {"text": "关于不同中心静脉导管置管部位的比较，正确的有（  ）", "options": ["Ａ.股静脉置管操作简单、成功率高，可直接压迫止血", "Ｂ.股静脉近会阴区易感染，患者活动受限，留置时间较短", "Ｃ.颈内静脉成功率高、血流量充足，留置时间较长", "Ｄ.锁骨下静脉舒适、易固定，置管后活动不受限", "Ｅ.锁骨下静脉置管技术要求低且静脉狭窄发生率低"], "answer": "ABCD", "explanation": "股静脉置管操作简单、成功率高，致命性并发症罕见，可直接压迫止血，但近会阴区易感染、患者活动受限、留置时间较短；颈内静脉成功率高、血流量充足，留置时间较长，致命性并发症罕见，静脉狭窄发生率较低；锁骨下静脉舒适、易固定、留置时间较长、置管后活动不受限，但置管技术要求高、可发生致命性并发症、静脉狭窄发生率高，凝血机制障碍者禁忌，故E错误。"}, {"text": "CRRT压力报警中，动脉压（PA）报警的常见原因有（  ）", "options": ["Ａ.流量不足", "Ｂ.导管贴壁", "Ｃ.血栓形成", "Ｄ.中心静脉导管位置欠佳致管路扭曲或受压", "Ｅ.跨膜压持续接近说明书要求"], "answer": "ABCD", "explanation": "动脉压报警的原因包括流量不足、导管贴壁、血栓形成等，以及体外循环血液管路扭曲或受压、凝血及传感器监测异常等；处理时调整患者体位及中心静脉导管位置、解除管路受压、检查传感器，必要时调整血流速或等比例调整治疗参数，或者更换透析用中心静脉导管；跨膜压持续接近或大于说明书要求属于跨膜压报警的处理指征，故E错误。"}, {"text": "CRRT压力报警中，跨膜压（TMP）报警的常见原因有（  ）", "options": ["Ａ.滤器有效膜面积减少", "Ｂ.滤器或透析通路受压、扭曲", "Ｃ.治疗参数不匹配", "Ｄ.血泵后至血滤器前血管路扭曲受压", "Ｅ.患者透析用中心静脉导管不畅"], "answer": "ABC", "explanation": "跨膜压报警的原因为滤器有效膜面积减少、滤器或透析通路受压或扭曲、治疗参数不匹配；血泵后至血滤器前血管路扭曲受压是滤器前压（PBE）报警的原因，患者透析用中心静脉导管不畅是静脉压（PV）报警的原因，故D、E错误。"}]}, {"type": "short", "questions": [{"text": "简述血液净化的定义及其所包含的主要技术方式。", "options": [], "answer": "血液净化技术是指各种连续或间断清除体内过多水分、溶质方法的总称，该技术在肾脏替代治疗技术的基础上逐步发展而来，应用于各种常见危重症患者的救治。主要技术方式包括：①血液透析（HD）；②血液滤过（HF）；③血液透析滤过（HDF）；④连续性血液净化（CBP）；⑤血液灌流（HP）；⑥免疫吸附；⑦血浆吸附；⑧单重血浆置换（PE）；⑨双重血浆置换（DFPP）；⑩腹膜透析（PD）；⑪人工肝支持系统（ALSS）。每一种血液净化方式都各有特点，且各适用于不同疾病或不同疾病状态。", "explanation": "答题要点：血液净化是各种连续或间断清除体内过多水分、溶质方法的总称，是在肾脏替代治疗技术基础上发展而来，现已广泛应用于各种常见危重症患者的救治；不同方式清除物质的范围和原理不同，应按疾病及疾病状态个体化选择。"}, {"text": "简述血液净化的三种基本原理及其分别适合清除的物质。", "options": [], "answer": "①弥散：溶质穿过半透膜，从浓度高的一侧移动到浓度低的一侧，驱动力为浓度梯度，能有效去除小分子溶质，例如电解质（小于500D）；②对流：水和溶质一同运动，驱动力为压力梯度，溶质随着水流一起运动穿过渗透膜即溶剂牵引作用，可有效去除中分子毒素（500～5000D）；③吸附：吸附与蛋白结合的毒素、炎症介质，主要清除中大分子物质。此外，超滤是液体在压力梯度的作用下穿过半透膜，从高压的一侧到达低压的一侧，用于移除体内多余的水分。", "explanation": "答题要点：弥散依靠浓度梯度清除小分子溶质（小于500D），对流依靠压力梯度清除中分子毒素（500～5000D），吸附清除与蛋白结合的毒素及炎症介质；超滤主要移除多余水分，临床常将几种原理组合应用。"}, {"text": "简述CRRT的常用治疗模式及其英文缩写。", "options": [], "answer": "CRRT的常用治疗模式有四种：①连续性静脉血液滤过（CVVH）；②连续性静脉血液透析（CVVHD）；③连续性静脉血液透析滤过（CVVHDF）；④缓慢连续性超滤（SCUF）。", "explanation": "答题要点：CVVH以对流清除为主，CVVHD以弥散清除为主，CVVHDF兼具弥散与对流两种清除作用，SCUF主要用于缓慢清除体内多余的水分。"}, {"text": "简述CRRT的紧急适应症。", "options": [], "answer": "CRRT的紧急适应症包括：①血钾大于6.5mmol/L；②严重酸中毒（pH小于7.2）；③严重的器官组织水肿（如肺水肿）；④血清尿素氮大于25mmol/L或血肌酐大于300μmol/L；⑤容量复苏后尿量仍然6小时内小于100ml。", "explanation": "答题要点：上述指标提示存在危及生命的电解质紊乱、酸碱失衡或容量超负荷，需紧急行连续性血液净化治疗，以维持水、电解质、酸碱平衡并清除代谢废物。"}, {"text": "简述透析中低血压的原因、临床表现及处理措施。", "options": [], "answer": "原因：①透析过程中患者心搏出量降低；②超滤过多、过快；③透析前服用降压药物等。临床表现：心率增快，烦躁，打哈欠、无意识运动，继而出现恶心、呕吐、出汗、面色苍白、呼吸困难和肌肉痉挛性疼痛等，甚至一过性意识丧失，冠心病患者可诱发心律失常及心绞痛。处理措施：①嘱患者采取头低脚高仰卧位；②降低超滤率或停止超滤；③快速补充血容量，可用50%葡萄糖、生理盐水100～250ml，或甘露醇、代血浆、白蛋白等；④给予患者氧疗；⑤经处理血压好转后可逐步恢复超滤，密切监测血压变化，并评估患者是否有潜在严重病因。减慢血流量虽然经常使用，但并不能增加外周血管阻力，通常是无效的。", "explanation": "答题要点：透析中低血压与心搏出量降低、超滤过多过快及透析前服用降压药物有关；处理核心是体位、减少超滤、快速补充血容量与氧疗，血压好转后逐步恢复超滤并寻找潜在病因，减慢血流量并非有效措施。"}, {"text": "简述血液灌流的适应证和禁忌证。", "options": [], "answer": "适应证：①急性药物或毒物中毒；②尿毒症，尤其是顽固性瘙痒、难治性高血压；③重症肝炎，特别是暴发性肝衰竭导致的肝性脑病、高胆红素血症；④脓毒症或系统性炎症综合征；⑤银屑病或其它自身免疫性疾病；⑥其它疾病，如精神分裂症、甲状腺危象、肿瘤化疗等。禁忌证：①对灌流器及相关材料过敏者；②血小板低于70×10^9/L禁止进行HP治疗；③白细胞减少或其他凝血障碍者慎用。", "explanation": "答题要点：血液灌流主要清除与蛋白结合率高的毒素及大中分子物质，故适用于急性药物或毒物中毒、尿毒症并发症、重症肝炎及炎症免疫相关疾病；对灌流器及相关材料过敏者禁用，血小板低于70×10^9/L禁止治疗，白细胞减少或其他凝血障碍者慎用。"}, {"text": "简述血液灌流器预冲、抗凝及预防凝血的操作要点。", "options": [], "answer": "①普通肝素抗凝：实施前给予4mg/dl的肝素生理盐水预冲、保留灌注20分钟，再给予生理盐水500ml冲洗，有助于增强抗凝效果；一般首剂量0.5～1.0mg/kg，追加剂量10～20mg/h，采用间歇性静脉注射或持续性静脉输注（常用），预期结束前30分钟停止追加。②低分子肝素抗凝：一般选择60～80IU/kg，推荐在治疗前20～30分钟静脉注射，无需追加剂量；同样先给予4mg/dl肝素生理盐水预冲、保留灌注20分钟，再给予生理盐水500ml冲洗。③预防凝血：预冲充分是防止凝血的首要步骤，预冲液量保证3000毫升以上，并保证灌流器的充分肝素化；肝素用量强调个体化并监测凝血功能指标；血容量不足的病人可考虑HP前补液500～700毫升；病情允许时尽快将血流量调至150～200毫升/分，注意血路的建立以保证血流量；选择生物相容性好的器材；无保温装置时保持环境温度低。", "explanation": "答题要点：灌流器肝素化预冲与足量预冲液是防止凝血的首要步骤，预冲液量应保证3000毫升以上；肝素剂量必须个体化并监测凝血功能指标；保证充足血容量与血流量、选择生物相容性好的器材同样重要，操作中应严密观察并及时处理凝血先兆。"}, {"text": "简述双重滤过血浆置换（DFPP）的优点与局限性。", "options": [], "answer": "优点：①蛋白丢失少，每次分离血浆3～4L，仅丢弃500～600ml致病血浆，保留了大部分白蛋白；②不受血荒制约，可减少临床申请用血的困难；③减少交叉感染，使用白蛋白置换液，感染等并发症较之单纯血浆置换少。局限性：①对致病物质的分子量有一定要求，选择性仍相对稍差；②血浆滤过器对白蛋白有一定的阻遏率，白蛋白不可避免也有少量的损失；③并非病因治疗，可迅速减少致病因子在血浆中的浓度，却不能阻止它的产生，不能完全替代免疫抑制剂，必须配合免疫抑制剂以及其他治疗方能取得更好的效果。", "explanation": "答题要点：DFPP利用两个不同孔径的滤过器（血浆分离器和血浆滤过器），根据致病物质分子量选择不同膜孔径，既能完全清除致病物质又可最大限度减少白蛋白丢失；但其特异性不如免疫吸附，且只是清除而非阻断致病因子产生，不能完全替代免疫抑制剂。"}]}]}, {"num": 3, "title": "血液净化患者慢性并发症的诊治理论考试题库", "sections": [{"type": "single", "questions": [{"text": "成人体内EPO的生成来自肾脏的比例约为（ ）", "options": ["A.30%", "B.50%", "C.70%", "D.90%", "E.100%"], "answer": "D", "explanation": "肾脏是EPO的主要生理来源，成人体内EPO的生成90%来自肾脏、10%来自肝脏。"}, {"text": "CKD患者EPO生成细胞（EPC）受损后的转归是（ ）", "options": ["A.转化为红细胞", "B.转化为成纤维细胞", "C.转化为巨核细胞", "D.转化为肾小管上皮细胞", "E.转化为EPO储备细胞"], "answer": "B", "explanation": "CKD患者EPO生成细胞（EPC）转化为成纤维细胞，丧失生成EPO的能力，导致EPO缺乏、红细胞生成减少。"}, {"text": "下列不属于肾性贫血红细胞生成减少原因的是（ ）", "options": ["A.EPO不足", "B.绝对性铁缺乏", "C.功能性铁缺乏", "D.炎症因素", "E.溶血"], "answer": "E", "explanation": "肾性贫血患者红细胞生成减少的原因包括EPO不足、绝对性铁缺乏、功能性铁缺乏、炎症因素、尿毒症毒素、ACEI和ARB应用、甲状旁腺功能亢进、骨髓纤维化或浸润等；溶血属于红细胞存活期缩短的机制。"}, {"text": "按照2001年WHO的贫血定义，男性和女性的血红蛋白界值分别是（ ）", "options": ["A.男性Hb≤12g/dL，女性Hb≤13g/dL", "B.男性Hb≤13g/dL，女性Hb≤12g/dL", "C.男性Hb≤11g/dL，女性Hb≤12g/dL", "D.男性Hb≤12g/dL，女性Hb≤12g/dL", "E.男性Hb≤13g/dL，女性Hb≤13g/dL"], "answer": "B", "explanation": "2001年WHO标准将贫血定义为女性Hb≤12g/dL、男性Hb≤13g/dL，该标准常用于CKD患者贫血的评估。"}, {"text": "中国维持性血液透析患者血红蛋白≥110g/L的达标率为（ ）", "options": ["A.19.6%", "B.21.3%", "C.23.0%", "D.82.6%", "E.91.1%"], "answer": "B", "explanation": "中国维持性血液透析患者Hb≥110g/L的达标率为21.3%，其中3级医院为23.0%、2级医院为19.6%，而EPO使用率已达82.6%。"}, {"text": "2012年KDIGO指南推荐未透析CKD患者启动EPO治疗的时机是（ ）", "options": ["A.Hb&lt;8g/dl", "B.Hb&lt;9g/dl", "C.Hb&lt;10g/dl", "D.Hb&lt;11g/dl", "E.Hb&lt;12g/dl"], "answer": "C", "explanation": "2012年KDIGO指南推荐未透析CKD患者在Hb&lt;10g/dl时起始EPO治疗，CKD5期患者在Hb 9-10g/dl时起始。"}, {"text": "2012年KDIGO指南建议成人CKD患者维持血红蛋白不超过（ ）", "options": ["A.10g/dl", "B.10.5g/dl", "C.11g/dl", "D.11.5g/dl", "E.13g/dl"], "answer": "D", "explanation": "2012年KDIGO指南不建议成人CKD患者维持Hb超过11.5g/dl，也不建议所有成人患者刻意将Hb升高至13g/dl。"}, {"text": "接受ESAs治疗前，应优先处理的可逆因素主要是（ ）", "options": ["A.铁缺乏和炎症状态", "B.高钾血症和酸中毒", "C.高血压和水肿", "D.贫血和出血", "E.低钙和高磷"], "answer": "A", "explanation": "接受ESAs治疗前应权衡减少输血和缓解贫血相关症状带来的利与弊，并处理好各种导致贫血的可逆因素，包括铁缺乏和炎症状态等。"}, {"text": "肾性贫血对免疫系统的影响表现为（ ）", "options": ["A.骨髓纤维化", "B.T细胞和巨噬细胞功能受损", "C.心脏肥大", "D.月经紊乱", "E.食欲不振"], "answer": "B", "explanation": "肾性贫血可致免疫系统T细胞和巨噬细胞功能受损；骨髓纤维化属于红细胞生成减少的机制，心脏肥大属于心肺系统表现，月经紊乱属于生殖系统表现，食欲不振属于胃肠道表现。"}, {"text": "在常氧环境下，VHL蛋白对低氧诱导因子HIF-α的作用是（ ）", "options": ["A.促进其合成", "B.促使其泛素化与降解", "C.使其磷酸化激活", "D.促使其核转位", "E.促使其二聚化"], "answer": "B", "explanation": "常氧环境下VHL蛋白促进HIF-α泛素化并被蛋白酶体降解，从而使HIF-α维持低水平；低氧时该降解受阻，HIF-α蓄积入核，启动促红细胞生成素等靶基因转录。"}, {"text": "启动HIF通路后，肾脏和肝脏发挥的作用是（ ）", "options": ["A.促进内源性生理浓度EPO生成", "B.增加骨髓前红细胞表面EPO受体", "C.增加铁的吸收和再利用", "D.直接升高血红蛋白", "E.抑制红细胞生成"], "answer": "A", "explanation": "启动HIF通路后，肾脏和肝脏促进内源性生理浓度EPO生成，有效升高血浆EPO水平；增加骨髓前红细胞表面EPO受体的是骨髓，促进铁吸收和再利用的是胃肠道、网状内皮系统和肝脏。"}, {"text": "启动HIF通路后，胃肠道、网状内皮系统和肝脏通过增加下列哪种物质的表达促进铁的吸收和再利用（ ）", "options": ["A.DMT1和Dcyte B", "B.EPO受体", "C.转铁蛋白受体2", "D.HIF-β", "E.VHL蛋白"], "answer": "A", "explanation": "启动HIF通路后，胃肠道、网状内皮系统和肝脏增加DMT1、Dcyte B表达，促进铁的吸收和再利用。"}, {"text": "培莫沙肽促进红细胞生成的作用机制是（ ）", "options": ["A.与EPO受体特异性结合", "B.抑制铁调素", "C.直接刺激骨髓造血", "D.抑制HIF降解", "E.促进叶酸吸收"], "answer": "A", "explanation": "培莫沙肽是一种EPO模拟肽（EMP），与细胞表面的EPO受体（EPOR）特异性结合，发挥与EPO相似的生物学效应，促进红细胞生成。"}, {"text": "最早的红系祖细胞是（ ）", "options": ["A.多能干细胞", "B.爆式红系集落形成单位", "C.原红细胞", "D.网织红细胞", "E.巨核细胞"], "answer": "B", "explanation": "最早的红系祖细胞为爆式红系集落形成单位（BFU-E），其上调EPO受体表达水平；EPO与EPOR结合可促进红系祖细胞存活、增殖和分化为含有血红蛋白的红细胞。"}, {"text": "肾性高血压的发生机制中，升血压物质产生增多主要是指（ ）", "options": ["A.肾素等", "B.PGE等", "C.缓激肽等", "D.一氧化氮等", "E.心房钠尿肽等"], "answer": "A", "explanation": "肾性高血压的发生机制包括水、钠潴留，降血压物质（PGE等）产生减少，以及升血压物质（肾素等）产生增多。"}, {"text": "肾性高血压的发生机制中，降血压物质产生减少主要是指（ ）", "options": ["A.肾素等", "B.血管紧张素Ⅱ等", "C.醛固酮等", "D.PGE等", "E.内皮素等"], "answer": "D", "explanation": "肾性高血压的发生与降血压物质（PGE等）产生减少有关，同时升血压物质（肾素等）产生增多。"}, {"text": "透析中低血压防治时，采用可调钠透析（钠超滤梯度透析法）的钠浓度设置方法是（ ）", "options": ["A.透析液钠浓度由150～160mmol/L逐渐降低至透析结束时的140mmol/L", "B.透析液钠浓度由140mmol/L逐渐升高至160mmol/L", "C.全程维持透析液钠浓度150mmol/L不变", "D.全程维持透析液钠浓度140mmol/L不变", "E.透析液钠浓度固定为130mmol/L"], "answer": "A", "explanation": "可调钠透析即钠超滤梯度透析法，透析液钠浓度由150～160mmol/L逐渐降低至透析结束时的140mmol/L，以维持血浆渗透压稳定、减少低血压发生；同时应选用碳酸盐透析液。"}, {"text": "超过一半合并高血压的CKD患者死于心血管疾病，其比例约为（ ）", "options": ["A.19%", "B.28.8%", "C.58%", "D.71.2%", "E.91%"], "answer": "C", "explanation": "心血管事件是CKD患者首位死亡原因，超过一半合并高血压的CKD患者死于心血管疾病，比例约为58%，死于肾衰竭者约占19%。"}, {"text": "透析患者血压每降低4.5/2.3mmHg，其全因死亡风险降低（ ）", "options": ["A.10%", "B.20%", "C.29%", "D.38%", "E.50%"], "answer": "B", "explanation": "透析患者血压每降低4.5/2.3mmHg，心血管事件、全因死亡和心血管死亡风险分别显著降低29%、20%和29%。"}, {"text": "K/DOQI指南指出，透析患者高血压的首要病理机制是（ ）", "options": ["A.水钠容量超负荷", "B.交感神经过度兴奋", "C.动脉粥样硬化", "D.甲状旁腺功能亢进", "E.肾素分泌过多"], "answer": "A", "explanation": "K/DOQI指南指出，水钠容量超负荷是透析患者高血压的首要病理机制，故RASI可同时降低水钠负荷、阻断RAAS以实现血压控制。"}, {"text": "指南推荐用于透析患者、且不被血液透析清除的优选一线降压药物是（ ）", "options": ["A.卡托普利", "B.阿替洛尔", "C.美托洛尔", "D.ARB", "E.米诺地尔"], "answer": "D", "explanation": "ARB和ACEI被证实可预防左室肥厚，是优选的一线降压药物；其中ARB主要经胆汁排泄，不被透析清除，且不良反应发生率低。卡托普利、阿替洛尔、美托洛尔、米诺地尔均可被血液透析广泛清除。"}, {"text": "下列降压药物中，被血液透析清除较少的是（ ）", "options": ["A.甲基多巴", "B.卡托普利", "C.依那普利", "D.美托洛尔", "E.CCB"], "answer": "E", "explanation": "α、α/β-受体阻滞剂、ARB、CCB被血液透析清除较少；甲基多巴、卡托普利、依那普利、赖诺普利、美托洛尔、阿替洛尔、米诺地尔等可被血液透析广泛清除。"}, {"text": "透析患者控制血压时，透析前血压低于多少适合大多数血液透析患者（ ）", "options": ["A.&lt;130/80mmHg", "B.&lt;140/90mmHg", "C.&lt;150/90mmHg", "D.&lt;160/90mmHg", "E.&lt;170/100mmHg"], "answer": "D", "explanation": "透析前血压&lt;160/90mmHg适合大多数血液透析患者；透析前血压&lt;140/90mmHg适合年轻或预期存活&gt;3年的患者。"}, {"text": "对年轻或预期存活超过3年的血液透析患者，透析前血压应低于（ ）", "options": ["A.&lt;130/80mmHg", "B.&lt;140/90mmHg", "C.&lt;150/90mmHg", "D.&lt;160/90mmHg", "E.&lt;170/100mmHg"], "answer": "B", "explanation": "透析前血压&lt;140/90mmHg适合年轻或预期存活超过3年的患者；&lt;160/90mmHg适合大多数血液透析患者。"}, {"text": "透析患者更理想的透析前血压区间是（ ）", "options": ["A.120-140/60-80mmHg", "B.130-150/70-90mmHg", "C.140-160/70-90mmHg", "D.140-160/80-100mmHg", "E.135-154/70-90mmHg"], "answer": "C", "explanation": "透析患者更理想的血压区间为透析前140-160/70-90mmHg、透析后135-154/70-90mmHg。"}, {"text": "透析患者更理想的透析后血压区间是（ ）", "options": ["A.120-140/60-80mmHg", "B.130-150/70-90mmHg", "C.140-160/70-90mmHg", "D.135-154/70-90mmHg", "E.150-170/80-100mmHg"], "answer": "D", "explanation": "透析患者更理想的血压区间为透析前140-160/70-90mmHg、透析后135-154/70-90mmHg。"}, {"text": "透析中低血压目前多采用的标准是透析中收缩压下降超过多少mmHg且伴有低血压症状（ ）", "options": ["A.10mmHg", "B.15mmHg", "C.20mmHg", "D.25mmHg", "E.30mmHg"], "answer": "C", "explanation": "透析中低血压（IDH）是指透析中收缩压下降&gt;20mmHg或平均动脉压降低10mmHg以上，并伴有低血压症状，是血液透析过程中常见的并发症。"}, {"text": "发作性低血压指透析过程中收缩压下降超过基础血压的（ ）", "options": ["A.10%", "B.15%", "C.20%", "D.25%", "E.30%"], "answer": "D", "explanation": "发作性低血压也称症状性低血压，指基础血压正常或增高，在透析过程中收缩压下降超过基础血压的25%，舒张压&lt;60mmHg或平均动脉压下降超过30mmHg。"}, {"text": "发作性低血压的发生率约为（ ）", "options": ["A.5%-10%", "B.10%-20%", "C.20%-30%", "D.30%-40%", "E.40%-50%"], "answer": "D", "explanation": "发作性低血压在透析患者中的发生率约30%-40%，多于开始透析2小时后出现头晕、无力、面色苍白、出汗、打呵欠等症状。"}, {"text": "慢性持续性低血压在透析患者中的发生率为（ ）", "options": ["A.1%-3%", "B.3%-5%", "C.5%-10%", "D.10%-15%", "E.15%-20%"], "answer": "C", "explanation": "慢性持续性低血压常发生于透析多年的患者，透析过程中收缩压通常不超过100mmHg，发生率为5%-10%。"}, {"text": "慢性持续性低血压患者透析过程中收缩压通常不超过（ ）", "options": ["A.80mmHg", "B.90mmHg", "C.100mmHg", "D.110mmHg", "E.120mmHg"], "answer": "C", "explanation": "慢性持续性低血压常发生于透析多年的患者，透析过程中收缩压通常不超过100mmHg，发生率为5%-10%。"}, {"text": "透析中低血压最常见的原因是（ ）", "options": ["A.容量相关性因素", "B.血管收缩功能障碍", "C.心脏因素", "D.醋酸盐透析液", "E.透析膜生物相容性差"], "answer": "A", "explanation": "透析中低血压的原因包括血容量相关因素、血管收缩功能障碍、心脏因素及其他原因，其中容量相关性因素是最常见的原因。"}, {"text": "可导致透析中血管收缩功能障碍、进而诱发低血压的透析液因素是（ ）", "options": ["A.碳酸盐透析液", "B.低温透析液", "C.醋酸盐透析液", "D.低钙透析液", "E.高镁透析液"], "answer": "C", "explanation": "透析液的影响是引起血管收缩功能障碍的原因之一，包括使用醋酸盐透析液和透析液温度升高；使用碳酸盐透析液、进行低温透析则是防治透析低血压的措施。"}, {"text": "透析低血压的心脏因素不包括（ ）", "options": ["A.收缩性心功能减退", "B.舒张性心功能减退", "C.心律失常", "D.心包积液", "E.高钾血症"], "answer": "E", "explanation": "透析中低血压的心脏因素包括收缩性心功能减退、舒张性心功能减退、心律失常和心包积液。"}, {"text": "为预防透析低血压，应教育患者使透析间期体重增长小于（ ）", "options": ["A.0.5kg/d", "B.1kg/d", "C.1.5kg/d", "D.2kg/d", "E.2.5kg/d"], "answer": "B", "explanation": "透析低血压防治要求准确设定干体重，通过患者教育使透析间期体重增长小于1kg/d，或小于干体重的3%-5%；若体重增长过多，可增加透析频度或时数、减慢血流速度、缓慢除水。"}, {"text": "为预防透析低血压，可调钠透析的透析液钠浓度设置是（ ）", "options": ["A.140mmol/L逐渐降至130mmol/L", "B.145mmol/L逐渐降至135mmol/L", "C.150-160mmol/L逐渐降至140mmol/L", "D.160-170mmol/L逐渐降至145mmol/L", "E.135mmol/L逐渐降至125mmol/L"], "answer": "C", "explanation": "可调钠透析即钠超滤梯度透析法，透析液钠浓度由150-160mmol/L逐渐降低至透析结束时的140mmol/L；同时应选用碳酸盐透析液。"}, {"text": "为预防透析低血压，低温透析的透析液温度一般维持在（ ）", "options": ["A.33.0-34.0℃", "B.34.0-35.0℃", "C.35.5-36.5℃", "D.36.5-37.0℃", "E.37.0-38.0℃"], "answer": "C", "explanation": "低温透析时透析液温度一般维持在35.5℃-36.5℃左右，其机理是通过刺激交感神经系统、增加外周血管阻力和心肌收缩力。"}, {"text": "透析中低血压药物干预时，米多君的作用机制是（ ）", "options": ["A.选择性α1肾上腺素能激动剂", "B.选择性β受体激动剂", "C.钙通道阻滞剂", "D.血管紧张素转换酶抑制剂", "E.磷酸二酯酶抑制剂"], "answer": "A", "explanation": "米多君是选择性α1肾上腺素能激动剂，通过收缩静脉和动脉升高血压，改善自主神经特别是交感神经功能。"}, {"text": "血磷升高可导致的后果不包括（ ）", "options": ["A.皮肤瘙痒", "B.骨代谢异常与骨折", "C.继发性甲状旁腺功能亢进", "D.血管钙化与心血管事件", "E.高钾血症"], "answer": "E", "explanation": "血磷升高可导致皮肤瘙痒、骨代谢异常与骨折、继发性甲状旁腺功能亢进、CKD进展、血管钙化、心血管事件甚至死亡，控制高磷血症是CKD-MBD治疗的关键。"}, {"text": "有效降磷需遵循指南的3D原则，3D是指（ ）", "options": ["A.饮食控磷、充分透析、使用磷结合剂", "B.补钙、补维生素D、补铁", "C.限水、限盐、限磷", "D.抗凝、降压、降磷", "E.透析、滤过、吸附"], "answer": "A", "explanation": "KDOQI、KDIGO和中国CSN指南均推荐磷管理的重要三种途径：Diet（严格控制饮食、摄入低磷食物）、Dialysis（充分透析）、Drug（使用磷结合剂）。"}, {"text": "食品添加剂中的无机磷的吸收率为（ ）", "options": ["A.30%-50%", "B.40%-60%", "C.60%-70%", "D.70%-80%", "E.大于90%"], "answer": "E", "explanation": "食品添加剂属于无机磷，大于90%的磷被吸收；动物蛋白（肉类、蛋类及乳制品）中40%-60%的磷被吸收，植物蛋白（豆类）吸收率较低，为30%-50%。"}, {"text": "2018年中国慢性肾脏病矿物质和骨异常诊治指南对含钙磷结合剂使用的建议是（ ）", "options": ["A.应限制含钙磷结合剂的使用", "B.应首选含钙磷结合剂", "C.应禁用所有磷结合剂", "D.仅非透析患者可使用", "E.无需考虑血钙水平"], "answer": "A", "explanation": "该指南要求CKD G3a-G5D期患者应限制含钙磷结合剂的使用（2B）；若高钙血症持续存在或反复发生，不推荐使用含钙磷结合剂。"}, {"text": "在新版中国慢性肾脏病矿物质和骨异常诊治指南中，司维拉姆、碳酸镧等非钙磷结合剂的地位是（ ）", "options": ["A.仅作为含钙磷结合剂的替代或补充", "B.可作为一线磷结合剂", "C.仅用于非透析患者", "D.不再推荐使用", "E.仅用于血钙降低的患者"], "answer": "B", "explanation": "新版指南建议不再将含钙磷结合剂作为降磷药物首选，也不再将司维拉姆或碳酸镧等非钙磷结合剂作为含钙磷结合剂的替代或补充，而是可以作为一线磷结合剂。"}, {"text": "继发性甲状旁腺功能亢进局部药物注射治疗常用的药物是（ ）", "options": ["A.帕立骨化醇", "B.米多君", "C.左旋肉碱", "D.罗沙司他", "E.培莫沙肽"], "answer": "A", "explanation": "甲状旁腺局部药物注射可采用帕立骨化醇，注射后甲状旁腺结节可逐渐缩小，是继发性甲旁亢的微创治疗方式之一。"}, {"text": "透析三年以上的患者中，顽固性皮肤瘙痒的发生率约为（ ）", "options": ["A.20%", "B.30%", "C.40%", "D.50%", "E.60%"], "answer": "E", "explanation": "继发性甲旁亢患者可出现顽固性皮肤瘙痒，透析三年以上有60%的患者会出现，可累及全身皮肤，严重影响生活质量。"}, {"text": "动静脉内瘘的并发症不包括（ ）", "options": ["A.狭窄", "B.血栓", "C.窃血", "D.血管钙化", "E.高钾血症"], "answer": "E", "explanation": "动静脉内瘘的并发症包括狭窄、血栓、闭塞、窃血、静脉瘤样扩张、血肿、动脉瘤和血管钙化。"}, {"text": "肾脏排泄代谢产物、调节水电解质酸碱平衡之外的另一大类生理功能是（ ）", "options": ["A.造血功能", "B.内分泌功能", "C.呼吸功能", "D.体温调节功能", "E.凝血功能"], "answer": "B", "explanation": "肾脏的生理功能包括排泄代谢产物、调节水与电解质及酸碱平衡，以及内分泌功能；肾功能受损后可出现尿毒症毒素聚集、水电解质及酸碱平衡紊乱、激素产生及代谢障碍。"}, {"text": "随慢性肾脏病病程进展，血清钙、磷和全段甲状旁腺激素异常患者比例的变化趋势是（ ）", "options": ["A.随病程进展逐渐升高", "B.随病程进展逐渐降低", "C.始终无明显变化", "D.仅在肾小球滤过率极低时升高", "E.仅全段甲状旁腺激素异常而钙磷正常"], "answer": "A", "explanation": "钙磷代谢紊乱和继发性甲状旁腺功能亢进是晚期慢性肾脏病患者的重要特征，随着患者病程的进展，血清钙、磷和全段甲状旁腺激素（iPTH）异常患者的比例逐渐升高。"}, {"text": "射频消融治疗甲状旁腺功能亢进时，射频的生物热能对组织的主要效应是（ ）", "options": ["A.细胞蛋白质凝固坏死并脱水变硬", "B.细胞快速增殖", "C.局部血管新生", "D.组织水肿软化", "E.神经末梢兴奋"], "answer": "A", "explanation": "射频的生物热能可使生物细胞蛋白质发生凝固坏死，脱水效应令组织变硬，坏死的组织通过机体免疫吞噬而逐渐萎缩至消失。"}, {"text": "中国CKD-MBD指南针对磷结合剂个体化使用提出的分层要求是（ ）", "options": ["A.CKD 1期患者即应常规使用磷结合剂", "B.CKD G3a-G5D期患者应强调磷结合剂使用的个体化", "C.仅CKD 5D期患者需要个体化选择", "D.所有患者一律首选含钙磷结合剂", "E.磷结合剂剂量无需随血钙调整"], "answer": "B", "explanation": "中国CKD-MBD指南3.1.9条明确提出，CKD G3a-G5D期患者应强调磷结合剂使用的个体化，以兼顾降磷效果与血钙、血管钙化及骨转运状态。"}]}, {"type": "multiple", "questions": [{"text": "肾性贫血的发生机制包括（ ）", "options": ["Ａ.红细胞生成减少", "Ｂ.红细胞存活期缩短", "Ｃ.失血", "Ｄ.红细胞生成增多", "Ｅ.铁利用过度"], "answer": "ABC", "explanation": "肾性贫血的发生与红细胞生成减少、红细胞存活期缩短和失血等多种机制相关。D项红细胞生成增多与贫血的发生不符；E项肾性贫血患者存在绝对性或功能性铁缺乏，而非铁利用过度。"}, {"text": "肾性贫血患者红细胞生成减少的原因包括（ ）", "options": ["Ａ.EPO不足", "Ｂ.绝对性铁缺乏", "Ｃ.功能性铁缺乏", "Ｄ.炎症因素", "Ｅ.溶血"], "answer": "ABCD", "explanation": "红细胞生成减少的原因包括EPO不足、绝对性铁缺乏、功能性铁缺乏、炎症因素、尿毒症毒素、ACEI和ARB应用、甲状旁腺功能亢进、骨髓纤维化或浸润等；E项溶血属于红细胞存活期缩短的机制。"}, {"text": "关于磷结合剂的选择与使用，下列符合中国指南要求的有（ ）", "options": ["Ａ.CKD G3a-G5D期患者应限制含钙磷结合剂的使用", "Ｂ.非钙磷结合剂可作为一线磷结合剂", "Ｃ.血清校正钙＞2.5mmol/L时建议选择非含钙磷结合剂", "Ｄ.血清校正钙＜2.5mmol/L时，足量含钙磷结合剂后血磷仍高于目标值，可加用或换用非含钙磷结合剂", "Ｅ.所有CKD患者均应首选含钙磷结合剂"], "answer": "ABCD", "explanation": "2018年中国指南要求CKD G3a-G5D期患者限制含钙磷结合剂的使用，并强调磷结合剂使用的个体化；司维拉姆、碳酸镧等非钙磷结合剂可作为一线磷结合剂（A、B项）。CKD 5D期伴高磷血症、血清校正钙＞2.5mmol/L时建议选择非含钙磷结合剂（C项）；血清校正钙＜2.5mmol/L时给予足量含钙磷结合剂（钙元素量1500mg）后血磷仍高于目标值，可根据血钙水平加用或换用非含钙磷结合剂（D项）。E项错误，新版指南不再将含钙磷结合剂作为降磷药物首选。"}, {"text": "关于EPO起始治疗时机，下列指南推荐正确的有（ ）", "options": ["Ａ.2012年KDIGO指南推荐未透析CKD患者Hb&lt;10g/dl时起始", "Ｂ.2012年KDIGO指南推荐CKD5期患者Hb 9-10g/dl时起始", "Ｃ.2013年加拿大肾脏协会推荐Hb&lt;10g/dl时起始", "Ｄ.2013年KDOQI指南推荐Hb 9-10g/dl时起始", "Ｅ.各指南均推荐Hb≥13g/dl时起始"], "answer": "ABCD", "explanation": "2012年KDIGO指南推荐未透析CKD患者Hb&lt;10g/dl、CKD5期患者Hb 9-10g/dl时起始EPO治疗；2013年加拿大肾脏协会推荐Hb&lt;10g/dl起始；2013年KDOQI指南推荐Hb 9-10g/dl起始。E项与各指南推荐不符。"}, {"text": "关于EPO治疗的Hb目标值，下列指南推荐正确的有（ ）", "options": ["Ａ.KDOQI 2007指南推荐CKD患者一般维持在11-12g/dl", "Ｂ.KDOQI 2007指南推荐不超过13g/dl", "Ｃ.ERBP 2008指南不建议刻意超过13g/dl", "Ｄ.KDIGO 2012指南建议成人CKD患者维持Hb不超过11.5g/dl", "Ｅ.KDIGO 2012指南建议所有成人患者刻意将Hb升高至13g/dl以上"], "answer": "ABCD", "explanation": "KDOQI 2007指南推荐CKD患者Hb一般维持在11-12g/dl、不超过13g/dl；ERBP 2008指南推荐一般11-12g/dl且不建议刻意超过13g/dl；KDIGO 2012指南不建议成人CKD患者维持Hb超过11.5g/dl，也不建议所有成人患者刻意将Hb升高至13g/dl。E项与KDIGO 2012指南的推荐相反。"}, {"text": "外源性注射rHuEPO治疗肾性贫血存在的局限性包括（ ）", "options": ["Ａ.注射给药，患者依从性较差", "Ｂ.运输保存需冷藏", "Ｃ.铁缺乏、炎症等原因易导致低反应性", "Ｄ.存在10%-15%的EPO抵抗现象", "Ｅ.可完全替代内源性EPO的生理性分泌"], "answer": "ABCD", "explanation": "外源性注射rHuEPO存在依从性较差、运输保存需冷藏、易因铁缺乏和炎症等原因出现低反应性、EPO抵抗现象10%-15%等局限性；注射后血浆EPO浓度快速上升又迅速下降，属非生理性刺激，长期可导致心室重构。E项错误，外源性rHuEPO与内源性EPO存在较大差别，不能完全替代其生理性分泌。"}, {"text": "启动HIF通路促进红细胞生成的途径包括（ ）", "options": ["Ａ.肾脏和肝脏促进内源性生理浓度EPO生成", "Ｂ.有效升高血浆EPO水平", "Ｃ.骨髓增加骨髓前红细胞表面EPO受体", "Ｄ.胃肠道、网状内皮系统和肝脏增加DMT1、Dcyte B表达以促进铁的吸收和再利用", "Ｅ.直接抑制骨髓造血"], "answer": "ABCD", "explanation": "启动HIF通路可通过多个途径高效促进红细胞生成：在肾脏和肝脏促进内源性生理浓度EPO生成并有效升高血浆EPO水平（A、B项）；在骨髓增加骨髓前红细胞表面EPO受体（C项）；在胃肠道、网状内皮系统和肝脏增加DMT1、Dcyte B表达，促进铁的吸收和再利用（D项）。E项与HIF通路的作用相反。"}, {"text": "关于培莫沙肽，下列描述正确的有（ ）", "options": ["Ａ.属于EPO模拟肽", "Ｂ.与细胞表面的EPO受体特异性结合", "Ｃ.发挥与EPO相似的生物学效应，促进红细胞生成", "Ｄ.通过抑制EPO受体发挥作用", "Ｅ.最早的红系祖细胞为爆式红系集落形成单位，其上调EPO受体表达水平"], "answer": "ABCE", "explanation": "培莫沙肽是EPO模拟肽（EMP），与细胞表面的EPO受体（EPOR）特异性结合，发挥与EPO相似的生物学效应，促进红细胞生成；最早的红系祖细胞为爆式红系集落形成单位（BFU-E），其上调EPOR表达水平，EPO与EPOR结合可促进红系祖细胞存活、增殖和分化。D项作用机制描述错误。"}, {"text": "肾性高血压的发生机制包括（ ）", "options": ["Ａ.水、钠潴留", "Ｂ.降血压物质（PGE等）产生减少", "Ｃ.升血压物质（肾素等）产生增多", "Ｄ.红细胞生成减少", "Ｅ.骨代谢异常"], "answer": "ABC", "explanation": "肾性高血压的发生机制包括水、钠潴留，降血压物质（PGE等）产生减少，以及升血压物质（肾素等）产生增多。D项属于肾性贫血的发生机制，E项属于CKD-MBD的表现。"}, {"text": "透析患者在选用降压药物时，下列描述正确的有（ ）", "options": ["Ａ.ARB和ACEI被证实可预防左室肥厚，是优选的一线降压药物", "Ｂ.ARB主要经胆汁排泄，不被透析清除", "Ｃ.α、α/β-受体阻滞剂、ARB、CCB被血液透析清除较少", "Ｄ.甲基多巴可被血液透析广泛清除", "Ｅ.应优先选用被血液透析广泛清除的降压药物"], "answer": "ABCD", "explanation": "ARB和ACEI可预防左室肥厚，是优选的一线降压药物，其中ARB主要经胆汁排泄、不被透析清除且不良反应发生率低；α、α/β-受体阻滞剂、ARB、CCB被血液透析清除较少；甲基多巴等交感神经抑制剂可被血液透析广泛清除。E项错误，降压药因透析清除可出现透析后高血压，是血压不达标的原因之一，应选择经透析清除较少的药物。"}, {"text": "关于透析患者控制血压的目标，下列描述正确的有（ ）", "options": ["Ａ.透析前血压&lt;160/90mmHg适合大多数血液透析患者", "Ｂ.透析前血压&lt;140/90mmHg适合年轻或预期存活超过3年的患者", "Ｃ.更理想的透析前血压区间为140-160/70-90mmHg", "Ｄ.更理想的透析后血压区间为135-154/70-90mmHg", "Ｅ.透析前血压应一律控制在100/60mmHg以下"], "answer": "ABCD", "explanation": "透析前血压&lt;160/90mmHg适合大多数血液透析患者，&lt;140/90mmHg适合年轻或预期存活&gt;3年的患者；更理想的区间为透析前140-160/70-90mmHg、透析后135-154/70-90mmHg。E项缺乏依据且不符合上述目标值。"}, {"text": "关于透析中低血压的概念与分型，下列描述正确的有（ ）", "options": ["Ａ.指透析中收缩压下降&gt;20mmHg或平均动脉压降低10mmHg以上，并伴有低血压症状", "Ｂ.发作性低血压指透析过程中收缩压下降超过基础血压的25%", "Ｃ.发作性低血压的发生率约30%-40%", "Ｄ.慢性持续性低血压的发生率为5%-10%", "Ｅ.慢性持续性低血压患者透析过程中收缩压通常超过150mmHg"], "answer": "ABCD", "explanation": "透析中低血压是指透析中收缩压下降&gt;20mmHg或平均动脉压降低10mmHg以上，并伴有低血压症状；发作性低血压指透析过程中收缩压下降超过基础血压的25%，舒张压&lt;60mmHg或平均动脉压下降超过30mmHg，发生率约30%-40%；慢性持续性低血压常发生于透析多年的患者，收缩压通常不超过100mmHg，发生率为5%-10%。E项与慢性持续性低血压的特点相反。"}, {"text": "透析中低血压的原因包括（ ）", "options": ["Ａ.血容量相关因素", "Ｂ.血管收缩功能障碍", "Ｃ.心脏因素", "Ｄ.其他原因", "Ｅ.血磷控制良好"], "answer": "ABCD", "explanation": "透析中低血压的原因主要有四类：血容量相关因素、血管收缩功能障碍、心脏因素和其他原因。E项与透析中低血压的原因无关。"}, {"text": "影响血浆再充盈速率、可导致透析中低血压的因素包括（ ）", "options": ["Ａ.透析中脱水过多、除水速度过快", "Ｂ.血泵速度过快", "Ｃ.透析过程中进餐", "Ｄ.血浆胶体渗透压下降，如营养不良、肝硬化", "Ｅ.血浆胶体渗透压显著升高"], "answer": "ABCD", "explanation": "影响血浆再充盈速率的因素包括有效血容量下降（透析中脱水过多、除水速度过快、血泵速度过快、透析过程中进餐）、血浆胶体渗透压下降（营养不良、肝硬化等）、大量腹水、充血性心衰。E项与该机制相反。"}, {"text": "透析低血压的防治措施包括（ ）", "options": ["Ａ.准确设定干体重，使透析间期体重增长小于1kg/d或小于干体重的3%-5%", "Ｂ.采用可调钠透析", "Ｃ.采用低温透析", "Ｄ.选择生物相容性好的透析膜", "Ｅ.透析中鼓励患者多进食"], "answer": "ABCD", "explanation": "透析低血压的防治包括透析处方个体化（准确设定干体重、选用合适的透析液配方如可调钠透析和碳酸盐透析液、低温透析、选择生物相容性好的透析膜），以及透析中避免进食、加强肌肉运动、纠正贫血改善营养、避免透析日服用降压药。E项与防治要求相反。"}, {"text": "用于干预透析中低血压的药物及其作用，下列描述正确的有（ ）", "options": ["Ａ.米多君是选择性α1肾上腺素能激动剂", "Ｂ.米多君通过收缩静脉和动脉升高血压", "Ｃ.米多君可改善自主神经特别是交感神经功能", "Ｄ.左旋肉碱可转运脂肪酸至心肌、为平滑肌细胞线粒体提供能量", "Ｅ.左旋肉碱通过扩张血管降低血压"], "answer": "ABCD", "explanation": "米多君为选择性α1肾上腺素能激动剂，通过收缩静脉和动脉升高血压，改善自主神经特别是交感神经功能；左旋肉碱可转运脂肪酸至心肌、为平滑肌细胞线粒体提供能量，促进正常细胞功能。E项作用方向错误。"}, {"text": "血磷升高可导致的后果包括（ ）", "options": ["Ａ.皮肤瘙痒", "Ｂ.骨代谢异常、骨折", "Ｃ.继发性甲状旁腺功能亢进", "Ｄ.血管钙化、心血管事件", "Ｅ.死亡风险降低"], "answer": "ABCD", "explanation": "血磷是控制CKD-MBD的关键环节，血磷升高可导致皮肤瘙痒、骨代谢异常和骨折、继发性甲状旁腺功能亢进、CKD进展、血管钙化、心血管事件，甚至死亡。E项与血磷升高的危害相反。"}, {"text": "关于食物磷的管理与烹饪，下列描述正确的有（ ）", "options": ["Ａ.食品添加剂中的无机磷大于90%被吸收", "Ｂ.动物蛋白中40%-60%的磷被吸收", "Ｃ.植物蛋白中30%-50%的磷被吸收", "Ｄ.水煮可降低食物磷含量且有效保留蛋白质", "Ｅ.水煮时间越长，汤中磷含量越低"], "answer": "ABCD", "explanation": "日常饮食中磷分为有机磷和无机磷：动物蛋白中40%-60%的磷被吸收，植物蛋白吸收较低、为30%-50%，食品添加剂中的无机磷大于90%被吸收；水煮可降低食物磷含量且有效保留蛋白质，但会使汤中含有大量的磷，水煮时间越长汤中磷含量越高。E项与事实相反。"}, {"text": "长期血液透析患者常见的远期并发症包括（ ）", "options": ["Ａ.心脑血管并发症", "Ｂ.肾性骨营养不良", "Ｃ.透析相关性淀粉样变性", "Ｄ.感染并发症", "Ｅ.甲状腺功能减退"], "answer": "ABCD", "explanation": "长期血液透析患者的远期并发症包括心脑血管并发症、血液系统并发症、肾性骨营养不良、透析相关性淀粉样变性、感染并发症、消化系统异常、呼吸系统改变和神经精神问题；甲状腺功能减退不属于上述远期并发症范畴。"}, {"text": "慢性肾脏病矿物质和骨异常患者血磷升高，可导致的后果包括（ ）", "options": ["Ａ.皮肤瘙痒", "Ｂ.骨代谢异常、骨折", "Ｃ.继发性甲状旁腺功能亢进", "Ｄ.CKD进展、血管钙化及心血管事件", "Ｅ.血磷升高对肾功能具有保护作用"], "answer": "ABCD", "explanation": "血磷升高可导致皮肤瘙痒、骨代谢异常和骨折、继发性甲状旁腺功能亢进、CKD进展、血管钙化、心血管事件甚至死亡；血磷升高是CKD-MBD的关键致病环节，对肾功能具有损害作用而非保护作用。"}]}, {"type": "short", "questions": [{"text": "简述肾性贫血的发生机制。", "options": [], "answer": "肾性贫血的发生与多种机制相关，主要包括三个方面：一、红细胞生成减少：EPO不足、绝对性铁缺乏、功能性铁缺乏、炎症因素、尿毒症毒素、ACEI和ARB应用、甲状旁腺功能亢进、骨髓纤维化或浸润。二、红细胞存活期缩短：尿毒症毒素、溶血、网状内皮细胞过早清除。三、失血。此外，肾脏是EPO的主要生理来源，成人体内EPO的生成90%来自肾脏、10%来自肝脏；CKD患者EPO生成细胞（EPC）转化为成纤维细胞，丧失生成EPO的能力，导致EPO缺乏、红细胞生成减少。", "explanation": "【要点依据】肾性贫血的发生与红细胞生成减少、红细胞存活期缩短和失血等多种机制相关。红细胞生成减少的原因包括EPO不足、绝对性铁缺乏、功能性铁缺乏、炎症因素、尿毒症毒素、ACEI和ARB应用、甲状旁腺功能亢进、骨髓纤维化或浸润；红细胞存活期缩短的原因包括尿毒症毒素、溶血和网状内皮细胞过早清除；失血亦是重要机制。【补充】EPC转化为成纤维细胞、丧失生成EPO的能力是EPO缺乏的关键环节，因此补充外源性EPO或启动HIF通路促进内源性EPO生成是重要治疗思路。"}, {"text": "简述透析中低血压的防治对策。", "options": [], "answer": "一、透析处方个体化：1.准确设定干体重：通过患者教育使透析间期体重增长小于1kg/d，或小于干体重的3%-5%；若体重增长过多，可增加透析频度或时数、减慢透析血流速度、缓慢除水。2.选用合适的透析液配方：采用可调钠透析，透析液钠浓度由150-160mmol/L逐渐降低至透析结束时的140mmol/L；使用碳酸盐透析液。3.低温透析：透析液温度一般维持在35.5℃-36.5℃左右，通过刺激交感神经系统增加外周血管阻力和心肌收缩力。4.选择生物相容性好的透析膜。二、透析中避免进食。三、加强肌肉运动，加强下肢肌肉紧张性练习以利于在直立或坐位时保持静脉回流。四、纠正贫血、改善营养，增加蛋白质、必需氨基酸及维生素的摄入量以改善心肌功能。五、避免透析日服用降压药。六、药物干预：米多君为选择性α1肾上腺素能激动剂，通过收缩静脉和动脉升高血压，改善自主神经特别是交感神经功能；左旋肉碱转运脂肪酸至心肌、为平滑肌细胞线粒体提供能量。", "explanation": "【要点依据】透析中低血压（IDH）是指透析中收缩压下降&gt;20mmHg或平均动脉压降低10mmHg以上并伴有低血压症状；其发生与血容量相关因素、血管收缩功能障碍、心脏因素等有关，其中容量相关性因素最常见，故防治以个体化透析处方、稳定血浆再充盈为核心。【补充】发作性低血压发生率约30%-40%，慢性持续性低血压发生率5%-10%；透析中低血压是患者死亡的不良预后指标。"}, {"text": "简述控制高磷血症的3D原则及各项要点。", "options": [], "answer": "控制高磷血症是CKD-MBD治疗的关键，指南推荐的3D原则包括：一、Diet（饮食）：严格控制饮食，摄入低磷食物；避免含磷添加剂，因食品添加剂中的无机磷大于90%被吸收，而动物蛋白中40%-60%、植物蛋白中30%-50%的磷被吸收；推荐水煮，水煮可降低食物磷含量且有效保留蛋白质，但会使汤中含有大量的磷，烹饪水煮后应倒掉汤。二、Dialysis（透析）：充分透析，增加磷的清除。三、Drug（药物）：使用磷结合剂；CKD G3a-G5D期患者应限制含钙磷结合剂的使用，司维拉姆、碳酸镧等非钙磷结合剂可作为一线磷结合剂，并强调个体化选择。", "explanation": "【要点依据】KDOQI、KDIGO和中国CSN指南均推荐磷管理的重要三种途径，即Diet（严格控制饮食、摄入低磷食物）、Dialysis（充分透析）、Drug（使用磷结合剂）。血磷是控制CKD-MBD的关键环节，血磷升高可导致皮肤瘙痒、骨代谢异常与骨折、继发性甲状旁腺功能亢进、CKD进展、血管钙化、心血管事件甚至死亡。【补充】血液透析患者血磷为4.4mg/dL（1.42mmol/L）时死亡风险最低，故透析患者也应尽量降磷至正常范围。"}, {"text": "简述透析患者控制血压的目标值及降压药物选择的注意事项。", "options": [], "answer": "一、控制目标：1.透析前血压&lt;160/90mmHg适合大多数血液透析患者；2.透析前血压&lt;140/90mmHg适合年轻或预期存活超过3年的患者；3.更理想的区间为透析前血压140-160/70-90mmHg，透析后血压135-154/70-90mmHg。二、降压药物选择的注意事项：1.水钠容量超负荷是透析患者高血压的首要病理机制，RASI可同时降低水钠负荷、阻断RAAS以实现血压控制；2.ARB和ACEI被证实可预防左室肥厚，是优选的一线降压药物，其中ARB主要经胆汁排泄、不被透析清除且不良反应发生率低；3.所有每日排尿量&gt;100ml的腹膜透析患者，均应积极考虑使用ACEI或ARB（除非有禁忌）；对伴明显残余肾功能且需降压药物治疗的血液透析患者，推荐使用ACEI和/或ARB；4.应选择经透析清除较少的药物，α、α/β-受体阻滞剂、ARB、CCB被血液透析清除较少；甲基多巴、卡托普利、美托洛尔、米诺地尔等可被血液透析广泛清除，降压药因透析清除出现透析后高血压是血压不达标的原因之一。三、其他措施：坚持长期服用降压药物及靶器官保护降压药、控制入量（限盐限水）、尽快达到干体重、生活有规律。", "explanation": "【要点依据】透析患者控制血压的目标为透析前&lt;160/90mmHg适合大多数患者，&lt;140/90mmHg适合年轻或预期存活&gt;3年的患者，更理想区间为透析前140-160/70-90mmHg、透析后135-154/70-90mmHg。K/DOQI指南指出水钠容量超负荷是透析患者高血压的首要病理机制；指南推荐ACEI/ARB作为透析患者的降压药物，ARB和ACEI可预防左室肥厚。【补充】透析患者血压管理存在病理机制复杂、控制目标难明确、监测存在现实困难等现实难点，需结合容量管理、个体化用药与规律随访综合施策。"}, {"text": "简述动静脉内瘘的常见并发症及动静脉内瘘狭窄的处理方式。", "options": [], "answer": "一、动静脉内瘘的常见并发症包括：狭窄、血栓、闭塞、窃血、静脉瘤样扩张、血肿、动脉瘤、血管钙化。二、动静脉内瘘狭窄的处理：1.术前可通过体表定位及超声评估动静脉内瘘狭窄，区分正常段与狭窄段；2.可在超声介导下行球囊扩张治疗动静脉内瘘狭窄。三、长期血液透析患者还可出现心脑血管并发症、血液系统并发症、肾性骨营养不良、透析相关性淀粉样变性、感染并发症、消化系统异常、呼吸系统改变、神经精神问题等远期并发症。", "explanation": "【要点依据】动静脉内瘘的并发症包括狭窄、血栓、闭塞、窃血、静脉瘤样扩张、血肿、动脉瘤和血管钙化；动静脉内瘘狭窄可进行体表定位和术前超声评估，并在超声介导下行球囊扩张治疗。【补充】长期透析患者的远期并发症包括心脑血管并发症、血液系统并发症、肾性骨营养不良、透析相关性淀粉样变性、感染并发症、消化系统异常、呼吸系统改变和神经精神问题。"}]}]}, {"num": 4, "title": "血液净化中心工程师职责理论考试题库", "sections": [{"type": "single", "questions": [{"text": "血液净化中心工程师对软水器加盐的每次加盐量约为多少？", "options": ["A.约5 kg", "B.约10 kg", "C.约15 kg", "D.约20 kg", "E.约25 kg"], "answer": "C", "explanation": "血透室工程师对水处理设备保养时，软水器加盐每次约15 kg，加盐次数可根据实际使用情况而定。"}, {"text": "软水器加盐的次数应该如何确定？", "options": ["A.固定每周一次", "B.固定每月一次", "C.按实际使用情况而定", "D.按机器型号固定", "E.每日一次"], "answer": "C", "explanation": "软水器每次加盐约15 kg，加盐次数可以根据实际使用情况而定，并非固定频次。"}, {"text": "水处理设备前级滤芯的更换周期是？", "options": ["A.1～2天", "B.5～7天", "C.约1个月", "D.约3个月", "E.约6个月"], "answer": "B", "explanation": "水处理设备保养中，前级滤芯的更换周期为5～7天，或压力差大于0.06 mpa时更换。"}, {"text": "水处理设备前级滤芯除按时间更换外，压力差达到多少时应更换？", "options": ["A.＞0.02 mpa", "B.＞0.04 mpa", "C.＞0.06 mpa", "D.＞0.08 mpa", "E.＞0.10 mpa"], "answer": "C", "explanation": "前级滤芯一般在5～7天更换，若其压力差＞0.06 mpa，也应进行更换。"}, {"text": "水处理设备后级滤芯的更换周期约为？", "options": ["A.5～7天", "B.约1个月", "C.＜3个月一次", "D.约6个月", "E.约1年"], "answer": "C", "explanation": "后级滤芯约＜3个月更换一次，与前级滤芯5～7天的更换周期不同。"}, {"text": "反渗机和管道的消毒应依据什么进行？", "options": ["A.工程师个人经验", "B.厂家要求", "C.科室自行规定", "D.患者人数", "E.每月固定日期"], "answer": "B", "explanation": "反渗机加管道消毒应根据厂家要求进行消毒，而不由个人经验或科室随意决定。"}, {"text": "水处理设备保养中需要做好记录的项目不包括下列哪一项？", "options": ["A.砂罐、碳罐反冲清洁", "B.树脂罐再生", "C.两级滤芯更换", "D.软水器加盐", "E.患者透析处方调整"], "answer": "E", "explanation": "需要记录的水处理保养项目包括砂罐、碳罐反冲清洁，树脂罐再生，两级滤芯更换，软水器加盐，反渗机和管路清洁、消毒等；患者透析处方调整不属于水处理设备保养记录范围。"}, {"text": "水处理设备保养时，树脂罐需要进行的操作是？", "options": ["A.反冲清洁", "B.再生", "C.更换滤芯", "D.加盐", "E.消毒"], "answer": "B", "explanation": "水处理设备保养记录中，砂罐、碳罐需反冲清洁，树脂罐需再生，两级滤芯需更换，软水器需加盐。"}, {"text": "水处理设备保养时，需要反冲清洁的是？", "options": ["A.树脂罐", "B.软水器", "C.砂罐、碳罐", "D.反渗膜", "E.后级滤芯"], "answer": "C", "explanation": "砂罐、碳罐需要做好反冲清洁，树脂罐是再生，软水器是加盐，两级滤芯是更换。"}, {"text": "对反渗机和管道清洁情况进行检测时，需要记录清洁前后哪一项水质指标？", "options": ["A.二级反渗水的pH值", "B.二级反渗水的电导率", "C.反渗水的余氯", "D.自来水的硬度", "E.纯水的温度"], "answer": "B", "explanation": "对反渗机和管道的清洁情况进行检测，包括使用的消毒剂、清洁前后二级反渗水的电导率、清洁后反渗水检测等，并做好检测结果的记录。"}, {"text": "对反渗机和管道清洁情况检测时，应记录使用的什么东西？", "options": ["A.消毒剂", "B.清洗剂", "C.润滑剂", "D.除锈剂", "E.缓蚀剂"], "answer": "A", "explanation": "反渗机和管道清洁情况检测内容包括使用的消毒剂、清洁前后二级反渗水的电导率、清洁后反渗水检测等。"}, {"text": "水处理设备运行压力记录中，预处理压力不包括下列哪一项？", "options": ["A.自来水供水压力", "B.两级滤芯压力", "C.砂罐压力", "D.碳罐和树脂罐压力", "E.二级反渗膜出水压力"], "answer": "E", "explanation": "预处理压力记录包括自来水供水压力、两级滤芯压力、砂罐、碳罐和树脂罐压力；二级反渗膜出水压力属于反渗机压力记录内容。"}, {"text": "水处理设备运行压力记录中，反渗机压力记录不包括下列哪一项？", "options": ["A.一级反渗膜入水压力", "B.一级反渗膜出水压力", "C.二级反渗膜入水压力", "D.二级反渗膜出水压力", "E.自来水供水压力"], "answer": "E", "explanation": "反渗机压力记录包括一级反渗膜的入水压力和出水压力、二级反渗膜的入水压力和出水压力、一级反渗水的纯水流量和电导率、二级反渗水的纯水流量和电导率；自来水供水压力属于预处理压力记录内容。"}, {"text": "反渗机压力记录中，需要记录的纯水流量包括？", "options": ["A.仅一级反渗水的纯水流量", "B.仅二级反渗水的纯水流量", "C.一级、二级反渗水的纯水流量", "D.反渗水总流量", "E.自来水供水流量"], "answer": "C", "explanation": "反渗机压力记录包括一级反渗膜和二级反渗膜的入水压力、出水压力，以及一级反渗水的纯水流量和电导率、二级反渗水的纯水流量和电导率。"}, {"text": "水处理设备和血透机的化学污染物抽样、检测频次要求是？", "options": ["A.至少每周检测一次", "B.至少每月检测一次", "C.至少每3个月检测一次", "D.至少每半年检测一次", "E.至少1年检测一次"], "answer": "E", "explanation": "水处理设备和血透机的化学污染物抽样、检测应至少1年检测一次。"}, {"text": "水处理设备和血透机的内毒素抽样、检测频次要求是？", "options": ["A.至少每周检测一次", "B.至少每1个月检测一次", "C.至少每3个月检测一次", "D.至少每半年检测一次", "E.至少1年检测一次"], "answer": "C", "explanation": "水处理设备和血透机的内毒素抽样、检测应至少每3个月检测一次。"}, {"text": "水处理设备和血透机的细菌抽样、检测频次要求是？", "options": ["A.至少每周检测一次", "B.至少每1个月检测一次", "C.至少每3个月检测一次", "D.至少1年检测一次", "E.至少每半年检测一次"], "answer": "B", "explanation": "水处理设备和血透机的细菌抽样、检测应至少每1个月检测一次。"}, {"text": "水硬度、余氯、pH值检测的频次要求是？", "options": ["A.至少每日检测一次", "B.至少每周检测一次", "C.至少每月检测一次", "D.至少每3个月检测一次", "E.至少1年检测一次"], "answer": "B", "explanation": "水处理设备和血透机的水硬度、余氯、pH值检测应至少每周检测一次，并做好以上检测结果的记录。"}, {"text": "血透机使用记录的内容不包括下列哪一项？", "options": ["A.设备信息", "B.运行情况", "C.故障维修记录", "D.设备使用人员姓名", "E.保养费用明细"], "answer": "E", "explanation": "血透机使用记录包括设备信息、运行情况、故障维修记录等，水处理使用记录同样包括这三方面，保养费用明细不在其列。"}, {"text": "水处理设备和血透机使用记录中应包含的共同内容是？", "options": ["A.设备信息、运行情况、故障维修记录", "B.水质检测报告", "C.患者登记信息", "D.设备采购合同", "E.操作规程文本"], "answer": "A", "explanation": "血透机使用记录和水处理使用记录均包括设备信息、运行情况、故障维修记录等。"}, {"text": "血透机运行参数校验的项目是？", "options": ["A.温度、电导度、漏血、超滤等", "B.温度、脱盐率、回收率、产水量等", "C.电导率、硬度、余氯等", "D.细菌、内毒素、化学污染物等", "E.血压、心率、血流量等"], "answer": "A", "explanation": "血透机运行参数校验包括温度、电导度、漏血、超滤等；温度、脱盐率、回收率、产水量等属于水处理设备运行参数校验内容。"}, {"text": "水处理设备运行参数校验的项目是？", "options": ["A.温度、电导度、漏血、超滤等", "B.温度、脱盐率、回收率、产水量等", "C.血压、心率、血流量等", "D.细菌、内毒素等", "E.硬度、余氯、pH值等"], "answer": "B", "explanation": "水处理设备运行参数校验包括温度、脱盐率、回收率、产水量等；温度、电导度、漏血、超滤等属于血透机运行参数校验内容。"}, {"text": "关于设备校验结果的处理，要求是？", "options": ["A.无需记录", "B.口头交接即可", "C.做好校验结果记录", "D.仅报告科室主任", "E.录入患者病历"], "answer": "C", "explanation": "血透机运行参数校验和水处理设备运行参数校验均要求做好校验结果记录。"}, {"text": "血液净化中心工程师需要定期联系相关检测机构对设备进行哪类检测？", "options": ["A.血压和心率检测", "B.化学污染物和内毒素检测", "C.血液生化检测", "D.水质pH值快速检测", "E.设备外观检测"], "answer": "B", "explanation": "工程师应定期联系相关的检测机构，对相关设备进行化学污染物和内毒素检测。"}, {"text": "血液净化中心工程师对水处理设备保养时，与软水器相关的操作是？", "options": ["A.反冲清洁", "B.再生", "C.加盐", "D.更换滤芯", "E.消毒"], "answer": "C", "explanation": "软水器需要加盐，每次约15 kg，次数按实际使用情况而定；反冲清洁针对砂罐、碳罐，再生针对树脂罐，更换针对两级滤芯。"}, {"text": "水处理设备两级滤芯中，更换周期较短的是？", "options": ["A.前级滤芯", "B.后级滤芯", "C.两级相同", "D.视患者人数而定", "E.视透析液流量而定"], "answer": "A", "explanation": "前级滤芯5～7天更换一次，或压力差＞0.06 mpa时更换；后级滤芯约＜3个月更换一次，因此前级滤芯更换周期较短。"}, {"text": "水处理设备保养记录涉及滤芯的内容是？", "options": ["A.反冲清洁", "B.再生", "C.更换", "D.加盐", "E.消毒"], "answer": "C", "explanation": "两级滤芯需要进行更换并记录，而砂罐、碳罐是反冲清洁，树脂罐是再生，软水器是加盐。"}, {"text": "工程师对水处理设备进行保养时，反渗机和管路需要进行的操作是？", "options": ["A.反冲清洁", "B.再生", "C.加盐", "D.更换滤芯", "E.清洁、消毒"], "answer": "E", "explanation": "反渗机和管路需要进行清洁、消毒并做好记录，反渗机加管道消毒应根据厂家要求进行。"}, {"text": "反渗水相关电导率的记录要求是？", "options": ["A.仅记录清洁前电导率", "B.仅记录清洁后电导率", "C.记录清洁前后二级反渗水的电导率", "D.记录自来水的电导率", "E.记录患者透析液的电导率"], "answer": "C", "explanation": "对反渗机和管道清洁情况检测时，需记录清洁前后二级反渗水的电导率，同时记录使用的消毒剂和清洁后反渗水检测结果。"}, {"text": "血液净化中心工程师对水处理设备运行压力的记录分为哪两类？", "options": ["A.预处理压力记录和反渗机压力记录", "B.血透机压力记录和反渗机压力记录", "C.动脉压和静脉压记录", "D.跨膜压和超滤压记录", "E.供水压力和排水压力记录"], "answer": "A", "explanation": "水处理设备运行压力记录包括预处理压力记录和反渗机压力记录两类。"}, {"text": "自来水供水压力应记录在下列哪一类记录中？", "options": ["A.反渗机压力记录", "B.预处理压力记录", "C.血透机使用记录", "D.水质检测记录", "E.设备校验记录"], "answer": "B", "explanation": "预处理压力记录包括自来水供水压力、两级滤芯压力、砂罐、碳罐和树脂罐压力。"}, {"text": "一级反渗水的电导率属于下列哪类记录内容？", "options": ["A.预处理压力记录", "B.反渗机压力记录", "C.血透机使用记录", "D.设备校验记录", "E.水处理设备保养记录"], "answer": "B", "explanation": "反渗机压力记录包括一级、二级反渗膜的入水压力和出水压力，以及一级反渗水的纯水流量和电导率、二级反渗水的纯水流量和电导率。"}, {"text": "水处理设备运行参数校验中，脱盐率属于校验项目，同时还需要校验的是？", "options": ["A.回收率、产水量", "B.漏血、超滤", "C.电导度、温度", "D.血压、心率", "E.余氯、硬度"], "answer": "A", "explanation": "水处理设备运行参数校验包括温度、脱盐率、回收率、产水量等；漏血、超滤属于血透机运行参数校验内容。"}, {"text": "血液净化中心工程师职责中，化学污染物检测的机构来源是？", "options": ["A.医院检验科", "B.相关检测机构", "C.科室内部工程师", "D.患者家属", "E.设备生产车间"], "answer": "B", "explanation": "工程师应定期联系相关的检测机构，对相关设备进行化学污染物和内毒素检测。"}, {"text": "关于水处理设备保养的次数安排，正确的是？", "options": ["A.软水器加盐次数按厂家统一规定", "B.软水器加盐次数可按实际使用情况而定", "C.前级滤芯每日更换", "D.后级滤芯每周更换", "E.反渗机每月消毒一次"], "answer": "B", "explanation": "软水器加盐每次约15 kg，次数可根据实际使用情况而定；前级滤芯5～7天更换，后级滤芯约＜3个月更换，反渗机加管道消毒根据厂家要求进行。"}, {"text": "工程师进行水处理设备保养时，需要做好的记录不包括？", "options": ["A.砂罐、碳罐反冲清洁记录", "B.树脂罐再生记录", "C.两级滤芯更换记录", "D.反渗机和管路清洁、消毒记录", "E.患者透析充分性评估记录"], "answer": "E", "explanation": "水处理设备保养记录包括砂罐、碳罐反冲清洁，树脂罐再生，两级滤芯更换，软水器加盐，反渗机和管路清洁、消毒等；患者透析充分性评估不属于该记录范围。"}, {"text": "关于反渗机和管道清洁后反渗水的检测，要求是？", "options": ["A.无需检测", "B.仅检测细菌", "C.进行清洁后反渗水检测并记录", "D.仅检测内毒素", "E.由患者自行检测"], "answer": "C", "explanation": "检测内容包括使用的消毒剂、清洁前后二级反渗水的电导率、清洁后反渗水检测等，并做好检测结果的记录。"}, {"text": "水处理设备和血透机的水质检测结果的处理要求是？", "options": ["A.无需记录", "B.口头汇报即可", "C.做好检测结果的记录", "D.仅异常时记录", "E.仅上报医院感染科"], "answer": "C", "explanation": "对化学污染物、内毒素、细菌以及水硬度、余氯、pH值等检测结果，都要求做好检测结果记录。"}, {"text": "血液净化中心工程师职责中，细菌检测与内毒素检测的频次关系是？", "options": ["A.细菌检测频次低于内毒素检测", "B.细菌检测频次高于内毒素检测", "C.两者频次相同", "D.两者均无频次要求", "E.两者均为每半年一次"], "answer": "B", "explanation": "细菌抽样、检测至少每1个月检测一次，内毒素抽样、检测至少每3个月检测一次，因此细菌检测频次高于内毒素检测。"}, {"text": "水硬度检测属于下列哪项工程师工作内容？", "options": ["A.水处理设备和血透机的水质检测", "B.水处理设备运行压力记录", "C.设备校验", "D.血透机使用记录", "E.水处理设备保养"], "answer": "A", "explanation": "水硬度、余氯、pH值检测属于水处理设备和血透机的水质检测内容，应至少每周检测一次。"}, {"text": "关于后级滤芯的更换，下列说法正确的是？", "options": ["A.约＜3个月更换一次", "B.5～7天更换一次", "C.压力差＞0.06 mpa时更换", "D.每年更换一次", "E.每周检查后更换"], "answer": "A", "explanation": "后级滤芯约＜3个月更换一次；5～7天更换和压力差＞0.06 mpa时更换是针对前级滤芯的要求。"}, {"text": "工程师对血透机进行参数校验时，需要校验的项目是？", "options": ["A.脱盐率、回收率", "B.产水量、脱盐率", "C.漏血、超滤", "D.余氯、硬度", "E.细菌、内毒素"], "answer": "C", "explanation": "血透机运行参数校验包括温度、电导度、漏血、超滤等；脱盐率、回收率、产水量属于水处理设备运行参数校验内容。"}, {"text": "二级反渗膜的入水压力和出水压力应记录在？", "options": ["A.预处理压力记录", "B.反渗机压力记录", "C.水质检测记录", "D.设备校验记录", "E.水处理设备使用记录"], "answer": "B", "explanation": "反渗机压力记录包括一级反渗膜的入水压力和出水压力、二级反渗膜的入水压力和出水压力，以及一级、二级反渗水的纯水流量和电导率。"}, {"text": "对水处理设备进行保养，以下属于记录内容的是？", "options": ["A.树脂罐再生", "B.血透机超滤参数", "C.患者血流量", "D.透析器型号", "E.抗凝剂用量"], "answer": "A", "explanation": "水处理设备保养记录内容包括砂罐、碳罐反冲清洁，树脂罐再生，两级滤芯更换，软水器加盐，反渗机和管路清洁、消毒等。"}, {"text": "下列哪项属于工程师职责中的水质检测项目？", "options": ["A.电压和电流", "B.流量和压力", "C.余氯和pH值", "D.温度和脱盐率", "E.漏血和超滤"], "answer": "C", "explanation": "水硬度、余氯、pH值检测属于水处理设备和血透机的水质检测项目，至少每周检测一次。"}, {"text": "工程师对血透机运行参数进行校验，其校验对象是？", "options": ["A.水处理设备", "B.血透机", "C.透析器", "D.水处理管路", "E.软水器"], "answer": "B", "explanation": "血透机运行参数校验的对象是血透机，项目包括温度、电导度、漏血、超滤等；水处理设备运行参数校验对象是水处理设备。"}, {"text": "关于设备使用记录，下列说法正确的是？", "options": ["A.只记录血透机使用情况", "B.只记录水处理设备使用情况", "C.血透机和水处理设备均需记录使用情况", "D.使用记录中不含故障维修记录", "E.使用记录无需包含设备信息"], "answer": "C", "explanation": "血透机使用记录和水处理使用记录均包括设备信息、运行情况、故障维修记录等。"}, {"text": "血液净化中心工程师定期联系检测机构进行检测的目的不包括？", "options": ["A.化学污染物检测", "B.内毒素检测", "C.保障透析用水安全", "D.保障透析液安全", "E.进行患者血管通路评估"], "answer": "E", "explanation": "工程师定期联系相关检测机构，对相关设备进行化学污染物和内毒素检测，以保障透析用水和透析液安全；患者血管通路评估不属于工程师该项工作内容。"}, {"text": "关于前级滤芯更换条件，下列表述正确的是？", "options": ["A.仅按5～7天更换", "B.仅按压力差＞0.06 mpa更换", "C.5～7天或压力差＞0.06 mpa时更换", "D.仅按＜3个月更换", "E.仅按厂家通知更换"], "answer": "C", "explanation": "前级滤芯5～7天更换，或者压力差＞0.06 mpa时更换，两个条件满足其一即应更换。"}, {"text": "血液净化中心工程师对水处理设备和血透机进行水质检测时，检测频次最高的是？", "options": ["A.化学污染物检测", "B.内毒素检测", "C.细菌检测", "D.水硬度、余氯、pH值检测", "E.脱盐率校验"], "answer": "D", "explanation": "水硬度、余氯、pH值检测至少每周一次，细菌检测至少每月一次，内毒素检测至少每3个月一次，化学污染物检测至少1年一次，故水硬度、余氯、pH值检测频次最高。"}]}, {"type": "multiple", "questions": [{"text": "血液净化中心工程师对水处理设备进行保养时，下列属于保养内容的有？", "options": ["Ａ.软水器加盐", "Ｂ.前级滤芯更换", "Ｃ.后级滤芯更换", "Ｄ.反渗机和管路清洁、消毒", "Ｅ.患者血管通路穿刺"], "answer": "ABCD", "explanation": "水处理设备保养内容包括软水器加盐，前级、后级滤芯更换，反渗机和管路清洁、消毒，砂罐、碳罐反冲清洁，树脂罐再生等；患者血管通路穿刺属临床护理操作，不属于设备保养内容。"}, {"text": "关于软水器加盐，下列表述正确的有？", "options": ["Ａ.每次约15 kg", "Ｂ.次数可按实际使用情况而定", "Ｃ.每次约5 kg", "Ｄ.次数固定为每周一次", "Ｅ.加盐属于水处理设备保养内容"], "answer": "ABE", "explanation": "软水器加盐每次约15 kg，次数可根据实际使用情况而定，属于水处理设备保养内容；每次约5 kg和固定每周一次均与材料不符。"}, {"text": "关于水处理设备滤芯更换，下列表述正确的有？", "options": ["Ａ.前级滤芯5～7天更换", "Ｂ.前级滤芯压力差＞0.06 mpa时更换", "Ｃ.后级滤芯约＜3个月更换一次", "Ｄ.后级滤芯每周更换", "Ｅ.前级滤芯压力差＞0.60 mpa时更换"], "answer": "ABC", "explanation": "前级滤芯5～7天更换，或压力差＞0.06 mpa时更换；后级滤芯约＜3个月更换一次。后级滤芯每周更换、前级压力差＞0.60 mpa均与材料不符。"}, {"text": "关于水处理设备保养记录的内容，下列表述正确的有？", "options": ["Ａ.砂罐、碳罐反冲清洁", "Ｂ.树脂罐再生", "Ｃ.两级滤芯更换", "Ｄ.软水器加盐", "Ｅ.血透机超滤参数校验记录"], "answer": "ABCD", "explanation": "水处理设备保养记录包括砂罐、碳罐反冲清洁，树脂罐再生，两级滤芯更换，软水器加盐，反渗机和管路清洁、消毒等；血透机超滤参数属于血透机运行参数校验内容，不属于水处理设备保养记录项目。"}, {"text": "对反渗机和管道清洁情况进行检测时，检测内容包括？", "options": ["Ａ.使用的消毒剂", "Ｂ.清洁前后二级反渗水的电导率", "Ｃ.清洁后反渗水检测", "Ｄ.透析患者血流量", "Ｅ.透析器跨膜压"], "answer": "ABC", "explanation": "反渗机和管道清洁情况检测包括使用的消毒剂、清洁前后二级反渗水的电导率、清洁后反渗水检测等，并做好记录；透析患者血流量、透析器跨膜压不属于该项检测内容。"}, {"text": "水处理设备运行压力记录中，属于预处理压力记录的有？", "options": ["Ａ.自来水供水压力", "Ｂ.两级滤芯压力", "Ｃ.砂罐压力", "Ｄ.碳罐和树脂罐压力", "Ｅ.一级反渗膜出水压力"], "answer": "ABCD", "explanation": "预处理压力记录包括自来水供水压力、两级滤芯压力、砂罐、碳罐和树脂罐压力；一级反渗膜出水压力属于反渗机压力记录内容。"}, {"text": "水处理设备运行压力记录中，属于反渗机压力记录的有？", "options": ["Ａ.一级反渗膜入水压力", "Ｂ.一级反渗膜出水压力", "Ｃ.二级反渗膜入水压力", "Ｄ.二级反渗膜出水压力", "Ｅ.自来水供水压力"], "answer": "ABCD", "explanation": "反渗机压力记录包括一级反渗膜和二级反渗膜的入水压力、出水压力以及各级反渗水的纯水流量和电导率；自来水供水压力属于预处理压力记录。"}, {"text": "反渗机压力记录中需要记录纯水流量和电导率的对象有？", "options": ["Ａ.一级反渗水", "Ｂ.二级反渗水", "Ｃ.自来水", "Ｄ.软水器出水", "Ｅ.透析液"], "answer": "AB", "explanation": "反渗机压力记录包括一级反渗水和二级反渗水的纯水流量和电导率；自来水和软水器出水不在该项记录中，透析液不属于该记录范围。"}, {"text": "水处理设备和血透机的水质检测项目及其频次，下列配对正确的有？", "options": ["Ａ.化学污染物：至少1年检测一次", "Ｂ.内毒素：至少每3个月检测一次", "Ｃ.细菌：至少每1个月检测一次", "Ｄ.水硬度、余氯、pH值：至少每周检测一次", "Ｅ.细菌：至少每3个月检测一次"], "answer": "ABCD", "explanation": "化学污染物至少1年一次，内毒素至少每3个月一次，细菌至少每1个月一次，水硬度、余氯、pH值至少每周一次；细菌检测频次为至少每1个月一次，而非每3个月一次。"}, {"text": "水处理设备和血透机水质检测的项目有？", "options": ["Ａ.化学污染物", "Ｂ.内毒素", "Ｃ.细菌", "Ｄ.水硬度和余氯", "Ｅ.透析液温度"], "answer": "ABCD", "explanation": "水处理设备和血透机的水质检测项目包括化学污染物、内毒素、细菌以及水硬度、余氯、pH值；透析液温度属于血透机运行参数校验内容，不属于水质检测项目。"}, {"text": "关于血透机和水处理设备使用记录，下列表述正确的有？", "options": ["Ａ.血透机使用记录包括设备信息", "Ｂ.血透机使用记录包括运行情况", "Ｃ.血透机使用记录包括故障维修记录", "Ｄ.水处理使用记录也包括故障维修记录", "Ｅ.使用记录只记录故障情况"], "answer": "ABCD", "explanation": "血透机使用记录和水处理使用记录均包括设备信息、运行情况、故障维修记录等；使用记录只记录故障情况的说法不全面，与材料不符。"}, {"text": "血液净化中心工程师进行设备校验时，水处理设备运行参数校验的项目有？", "options": ["Ａ.温度", "Ｂ.脱盐率", "Ｃ.回收率", "Ｄ.产水量", "Ｅ.漏血"], "answer": "ABCD", "explanation": "水处理设备运行参数校验包括温度、脱盐率、回收率、产水量等；漏血属于血透机运行参数校验内容。"}, {"text": "血液净化中心工程师进行设备校验时，血透机运行参数校验的项目有？", "options": ["Ａ.温度", "Ｂ.电导度", "Ｃ.漏血", "Ｄ.超滤", "Ｅ.产水量"], "answer": "ABCD", "explanation": "血透机运行参数校验包括温度、电导度、漏血、超滤等；产水量属于水处理设备运行参数校验内容。"}, {"text": "关于设备校验结果的处理，下列表述正确的有？", "options": ["Ａ.血透机校验结果需要记录", "Ｂ.水处理设备校验结果需要记录", "Ｃ.校验结果无需记录", "Ｄ.校验结果只需口头交接", "Ｅ.校验结果记录属于工程师职责内容"], "answer": "ABE", "explanation": "血透机运行参数校验和水处理设备运行参数校验都要求做好校验结果记录，该记录属于工程师职责内容；校验结果无需记录、只需口头交接的说法均不正确。"}, {"text": "血液净化中心工程师需要定期联系相关检测机构对设备进行的检测有？", "options": ["Ａ.化学污染物检测", "Ｂ.内毒素检测", "Ｃ.水质pH值快速检测", "Ｄ.患者血液生化检测", "Ｅ.设备外观检测"], "answer": "AB", "explanation": "工程师应定期联系相关的检测机构，对相关设备进行化学污染物和内毒素检测；水质pH值快速检测由日常水质检测完成，不以送检机构方式进行，患者血液生化检测和设备外观检测不属于该项内容。"}, {"text": "关于反渗机和管道消毒，下列表述正确的有？", "options": ["Ａ.根据厂家要求进行消毒", "Ｂ.属于水处理设备保养内容", "Ｃ.需做好清洁、消毒记录", "Ｄ.可完全凭个人经验消毒", "Ｅ.无需进行消毒"], "answer": "ABC", "explanation": "反渗机加管道消毒应根据厂家要求进行，属于水处理设备保养内容并需做好记录；凭个人经验消毒和无需消毒的说法均与材料不符。"}, {"text": "水处理设备保养中，关于各罐体操作配对正确的有？", "options": ["Ａ.砂罐、碳罐：反冲清洁", "Ｂ.树脂罐：再生", "Ｃ.软水器：加盐", "Ｄ.两级滤芯：更换", "Ｅ.反渗机：再生"], "answer": "ABCD", "explanation": "砂罐、碳罐反冲清洁，树脂罐再生，软水器加盐，两级滤芯更换；反渗机是清洁、消毒而非再生。"}, {"text": "关于水质检测的频次，下列表述正确的有？", "options": ["Ａ.化学污染物至少1年检测一次", "Ｂ.内毒素至少每3个月检测一次", "Ｃ.细菌至少每1个月检测一次", "Ｄ.水硬度、余氯、pH值至少每周检测一次", "Ｅ.水质检测无需记录结果"], "answer": "ABCD", "explanation": "化学污染物至少1年一次，内毒素至少每3个月一次，细菌至少每1个月一次，水硬度、余氯、pH值至少每周一次；所有水质检测结果均应做好记录，故水质检测无需记录结果的说法错误。"}, {"text": "关于前级滤芯的更换，下列表述正确的有？", "options": ["Ａ.更换周期为5～7天", "Ｂ.压力差＞0.06 mpa时应更换", "Ｃ.更换属于水处理设备保养内容", "Ｄ.更换周期约＜3个月", "Ｅ.更换后无需记录"], "answer": "ABC", "explanation": "前级滤芯5～7天更换，或压力差＞0.06 mpa时更换，更换属于水处理设备保养内容并需记录；约＜3个月是后级滤芯的更换周期，更换后也需记录。"}, {"text": "血液净化中心工程师对水处理设备运行进行记录时，涉及的内容有？", "options": ["Ａ.预处理压力记录", "Ｂ.反渗机压力记录", "Ｃ.一级反渗水纯水流量和电导率", "Ｄ.二级反渗水纯水流量和电导率", "Ｅ.患者透析处方"], "answer": "ABCD", "explanation": "水处理设备运行记录包括预处理压力记录和反渗机压力记录，后者含一级、二级反渗水的纯水流量和电导率；患者透析处方不属于水处理设备运行记录内容。"}]}, {"type": "short", "questions": [{"text": "简述血液净化中心工程师对水处理设备进行保养的主要内容和记录要求。", "options": [], "answer": "水处理设备保养的主要内容包括：1. 软水器加盐，每次约15 kg，次数可根据实际使用情况而定；2. 滤芯更换，前级滤芯5～7天更换，或压力差＞0.06 mpa时更换，后级滤芯约＜3个月更换一次；3. 反渗机加管道消毒，根据厂家要求进行消毒；4. 做好砂罐、碳罐反冲清洁，树脂罐再生，两级滤芯更换，软水器加盐，反渗机和管路清洁、消毒等记录。", "explanation": "水处理设备保养围绕加盐、滤芯更换和消毒展开，各项操作均需留有记录。软水器加盐每次约15 kg、次数按实际使用情况而定；前级滤芯5～7天或压力差＞0.06 mpa时更换，后级滤芯约＜3个月更换一次；反渗机和管道消毒按厂家要求进行。"}, {"text": "简述血液净化中心工程师对反渗机和管道清洁水质的检测与记录要点。", "options": [], "answer": "检测要点包括：1. 对反渗机和管道的清洁情况进行检测；2. 检测内容包括使用的消毒剂、清洁前后二级反渗水的电导率、清洁后反渗水检测等；3. 做好检测结果的记录。", "explanation": "反渗机和管道清洁水质检测的目的是确认清洁消毒效果。检测内容涵盖所用消毒剂、清洁前后二级反渗水的电导率以及清洁后的反渗水检测，所有检测结果均需记录存档。"}, {"text": "简述血液净化中心工程师对水处理设备运行压力记录的内容。", "options": [], "answer": "水处理设备运行压力记录分为两部分：1. 预处理压力记录，包括自来水供水压力、两级滤芯压力、砂罐、碳罐和树脂罐压力；2. 反渗机压力记录，包括一级反渗膜的入水压力和出水压力、二级反渗膜的入水压力和出水压力，以及一级反渗水的纯水流量和电导率、二级反渗水的纯水流量和电导率。", "explanation": "运行压力记录分为预处理压力记录和反渗机压力记录两类。预处理部分关注供水及各级罐体、滤芯压力；反渗机部分关注两级反渗膜的进出水压力以及各级反渗水的纯水流量和电导率。"}, {"text": "简述血液净化中心工程师对水处理设备和血透机开展水质检测的项目及其频次要求。", "options": [], "answer": "水质检测项目及频次为：1. 化学污染物抽样、检测，至少1年检测一次；2. 内毒素抽样、检测，至少每3个月检测一次；3. 细菌抽样、检测，至少每1个月检测一次；4. 水硬度、余氯、pH值检测，至少每周检测一次；5. 做好以上检测结果的记录。", "explanation": "水处理设备和血透机的水质检测项目按频次由低到高依次为化学污染物至少1年一次、内毒素至少每3个月一次、细菌至少每1个月一次、水硬度、余氯、pH值至少每周一次，所有检测结果均需记录。"}, {"text": "简述血液净化中心工程师对水处理设备和血透机进行设备校验的内容及使用记录要求。", "options": [], "answer": "设备校验内容包括：1. 血透机运行参数校验，包括温度、电导度、漏血、超滤等；2. 水处理设备运行参数校验，包括温度、脱盐率、回收率、产水量等；3. 做好校验结果记录。使用记录要求包括：血透机使用记录和水处理使用记录均要记录设备信息、运行情况、故障维修记录等，并定期联系相关检测机构对相关设备进行化学污染物和内毒素检测。", "explanation": "设备校验分为血透机运行参数校验和水处理设备运行参数校验两类，校验结果均需记录。使用记录方面，血透机和水处理设备都需记录设备信息、运行情况、故障维修记录，同时工程师应定期联系相关检测机构开展化学污染物和内毒素检测。"}]}]}, {"num": 5, "title": "肾脏疾病相关因素理论考试题库", "sections": [{"type": "single", "questions": [{"text": "成人肾脏长径的正常范围是（  ）", "options": ["A.8.5-9.5cm", "B.9.5-10.5cm", "C.10.5-11.5cm", "D.11.5-12.5cm", "E.12.5-13.5cm"], "answer": "C", "explanation": "成人肾脏长10.5-11.5cm、宽5-7.2cm、厚2-3cm。肾脏的功能是形成和排泄尿液、排泄人体代谢废物、调节水电解质及酸碱平衡，并具有内分泌功能。"}, {"text": "成人肾脏宽度的正常范围是（  ）", "options": ["A.3-4cm", "B.4-5cm", "C.5-7.2cm", "D.6-8cm", "E.7-9cm"], "answer": "C", "explanation": "成人肾脏宽5-7.2cm，长10.5-11.5cm，厚2-3cm。"}, {"text": "肾脏替代治疗的方式包括血液透析、腹膜透析和（  ）", "options": ["A.血液灌流", "B.血浆置换", "C.肾移植", "D.免疫吸附", "E.体外膜肺氧合"], "answer": "C", "explanation": "肾脏替代治疗包括血液透析、腹膜透析和肾移植三种方式；血液灌流、血浆置换、免疫吸附属于血液净化技术，体外膜肺氧合属于器官支持治疗。"}, {"text": "肾脏的功能不包括（  ）", "options": ["A.形成和排泄尿液", "B.排泄人体代谢废物", "C.调节水电解质及酸碱平衡", "D.内分泌功能", "E.分泌胆汁"], "answer": "E", "explanation": "肾脏具有形成和排泄尿液、排泄人体代谢废物、调节水电解质及酸碱平衡以及内分泌功能；分泌胆汁是肝脏的功能。"}, {"text": "慢性肾脏病定义中要求肾损害持续的时间是（  ）", "options": ["A.≥1周", "B.≥1个月", "C.≥2个月", "D.≥3个月", "E.≥6个月"], "answer": "D", "explanation": "慢性肾脏病是指各种原因引起的肾脏结构和功能障碍超过3个月，即肾损害≧3个月，或肾小球滤过率&lt;60ml/min/1.73m2持续≧3个月。"}, {"text": "慢性肾脏病定义中，肾小球滤过率低于下列哪一数值并持续一定时间即可诊断（  ）", "options": ["A.30ml/min/1.73m2", "B.45ml/min/1.73m2", "C.60ml/min/1.73m2", "D.75ml/min/1.73m2", "E.90ml/min/1.73m2"], "answer": "C", "explanation": "肾小球滤过率&lt;60ml/min/1.73m2并持续≧3个月是慢性肾脏病的诊断依据之一；另一依据为肾损害≧3个月。"}, {"text": "慢性肾脏病肾损害指标中，尿白蛋白定量超过（  ）", "options": ["A.30mg/d", "B.100mg/d", "C.150mg/d", "D.300mg/d", "E.500mg/d"], "answer": "D", "explanation": "尿白蛋白&gt;300mg/d（相当于尿ACR&gt;30mg/g）属于慢性肾脏病肾损害的范畴，与尿沉渣异常、肾小管功能异常导致的电解质及其他异常、肾移植病史等同列。"}, {"text": "慢性肾脏病肾损害指标中，尿白蛋白肌酐比值超过（  ）", "options": ["A.10mg/g", "B.20mg/g", "C.30mg/g", "D.50mg/g", "E.100mg/g"], "answer": "C", "explanation": "尿白蛋白&gt;300mg/d相当于尿ACR&gt;30mg/g，是慢性肾脏病肾损害的判定指标之一。"}, {"text": "下列疾病的病因分类中，属于肾小管间质病变的是（  ）", "options": ["A.慢性肾小球肾炎", "B.糖尿病肾病", "C.慢性肾盂肾炎", "D.多囊肾", "E.肾动脉狭窄"], "answer": "C", "explanation": "慢性肾脏病病因中肾小管间质病变以慢性肾盂肾炎为代表；慢性肾小球肾炎、糖尿病肾病属于肾小球疾病，多囊肾属于肾囊性病变，肾动脉狭窄属于血管病变。"}, {"text": "下列疾病中属于肾囊性病变的是（  ）", "options": ["A.狼疮性肾炎", "B.慢性肾盂肾炎", "C.多囊肾", "D.肾动脉狭窄", "E.高血压肾小动脉硬化"], "answer": "C", "explanation": "肾囊性病变的代表疾病是多囊肾；狼疮性肾炎、高血压肾小动脉硬化属于肾小球疾病，慢性肾盂肾炎属于肾小管间质病变，肾动脉狭窄属于血管病变。"}, {"text": "下列疾病中属于血管病变所致肾脏病的是（  ）", "options": ["A.糖尿病肾病", "B.多囊肾", "C.慢性肾盂肾炎", "D.肾动脉狭窄", "E.慢性肾小球肾炎"], "answer": "D", "explanation": "血管病变所致肾脏病以肾动脉狭窄为代表；糖尿病肾病、慢性肾小球肾炎属于肾小球疾病，多囊肾属于肾囊性病变，慢性肾盂肾炎属于肾小管间质病变。"}, {"text": "下列属于慢性肾脏病渐进性发展危险因素的是（  ）", "options": ["A.有效血容量不足", "B.泌尿系梗阻", "C.肾毒性药物", "D.高水平的蛋白尿", "E.肾局部血供急剧减少"], "answer": "D", "explanation": "渐进性发展的危险因素包括年龄、种族、性别、肾脏疾病的类型和肾功能水平、高水平的蛋白尿、低血清白蛋白、高血压、血糖控制不良、吸烟等；有效血容量不足、泌尿系梗阻、肾毒性药物、肾局部血供急剧减少属于急性加重的危险因素。"}, {"text": "下列属于慢性肾脏病急性加重危险因素的是（  ）", "options": ["A.年龄增长", "B.吸烟", "C.低血清白蛋白", "D.泌尿系梗阻", "E.高水平的蛋白尿"], "answer": "D", "explanation": "急性加重的危险因素包括有效血容量不足、肾局部血供急剧减少、累及肾脏的疾病复发或加重、严重高血压、肾毒性药物、泌尿系梗阻；年龄增长、吸烟、低血清白蛋白、高水平的蛋白尿属于渐进性发展的危险因素。"}, {"text": "高钾血症是指血钾达到（  ）", "options": ["A.≥4.5mmol/L", "B.≥5.0mmol/L", "C.≥5.5mmol/L", "D.≥6.0mmol/L", "E.≥6.5mmol/L"], "answer": "C", "explanation": "高钾血症指血钾≥5.5mmol/L；高钾血症需紧急透析的指征为血钾≥6.5mmol/L或出现恶性心律失常。"}, {"text": "慢性肾脏病患者当eGFR降至下列哪一水平以下时容易出现高钾血症（  ）", "options": ["A.40ml/min", "B.35ml/min", "C.30ml/min", "D.25ml/min", "E.15ml/min"], "answer": "D", "explanation": "当eGFR降至25ml/min以下时易出现高钾血症，其诱因包括钾摄入增多、药物影响、代谢性酸中毒、感染、创伤等。"}, {"text": "慢性肾脏病代谢性酸中毒的血气特点是（  ）", "options": ["A.血浆碳酸氢根升高，阴离子间隙减小", "B.血浆碳酸氢根下降，阴离子间隙正常或增加", "C.血浆碳酸氢根正常，阴离子间隙正常", "D.血浆碳酸氢根升高，阴离子间隙增加", "E.血浆碳酸氢根下降，二氧化碳结合力升高"], "answer": "B", "explanation": "代谢性酸中毒的特点是血浆碳酸氢根离子浓度下降，阴离子间隙正常或增加；其原因为肾小管重吸收碳酸氢根离子减少或泌氢产氨减少、血磷酸和硫酸排泄减少。"}, {"text": "尿毒症患者最常见的死因是（  ）", "options": ["A.心力衰竭", "B.尿毒症脑病", "C.消化道出血", "D.感染", "E.恶性肿瘤"], "answer": "A", "explanation": "心力衰竭是尿毒症最常见的死因，与贫血、毒素潴留引起的尿毒症心肌病、高血压、水钠潴留及内瘘等因素有关。"}, {"text": "尿毒症性心包积液多为血性，其主要原因是（  ）", "options": ["A.毛细血管破裂", "B.结核感染", "C.肿瘤浸润", "D.病毒性心包炎", "E.低血糖"], "answer": "A", "explanation": "尿毒症心包积液多为血性，与毛细血管破裂有关，其发生与尿毒症毒素蓄积、低蛋白血症、心力衰竭等有关。"}, {"text": "慢性肾脏病矿物质和骨代谢异常中，血磷的靶目标是（  ）", "options": ["A.0.5-0.8mmol/L", "B.0.87-1.45mmol/L", "C.1.5-2.0mmol/L", "D.2.1-2.5mmol/L", "E.2.5-3.0mmol/L"], "answer": "B", "explanation": "慢性肾脏病导致矿物质和骨代谢异常的靶目标为血磷0.87-1.45mmol/L、血钙2.10-2.50mmol/L，iPTH为正常上限的2-9倍。"}, {"text": "慢性肾脏病矿物质和骨代谢异常中，血钙的靶目标是（  ）", "options": ["A.1.80-2.00mmol/L", "B.2.00-2.10mmol/L", "C.2.10-2.50mmol/L", "D.2.50-2.80mmol/L", "E.2.80-3.00mmol/L"], "answer": "C", "explanation": "慢性肾脏病导致矿物质和骨代谢异常的血钙靶目标为2.10-2.50mmol/L，同时血磷靶目标为0.87-1.45mmol/L，iPTH为正常上限的2-9倍。"}, {"text": "慢性肾脏病矿物质和骨代谢异常中，iPTH的靶目标是（  ）", "options": ["A.正常上限的1倍以内", "B.正常上限的2-9倍", "C.正常上限的10-15倍", "D.正常上限的15-20倍", "E.低于正常下限"], "answer": "B", "explanation": "iPTH的靶目标为正常上限的2-9倍，血磷靶目标0.87-1.45mmol/L，血钙靶目标2.10-2.50mmol/L。"}, {"text": "慢性肾脏病矿物质和骨代谢异常导致的骨骼改变，重度患者可以出现的是（  ）", "options": ["A.完全无任何症状", "B.仅有骨骼触痛", "C.退缩人综合征", "D.仅血磷升高", "E.仅尿量减少"], "answer": "C", "explanation": "重度骨骼改变可出现退缩人综合征、面部畸形、骨痛、关节不适、瘙痒、骨骼畸形以及骨溶解、骨折；轻中度骨骼改变可没有症状，体征可有骨骼触痛。"}, {"text": "钙化防御又称（  ）", "options": ["A.钙化性尿毒症动脉病变", "B.肾性骨营养不良", "C.纤维性骨炎", "D.骨质疏松症", "E.骨软化症"], "answer": "A", "explanation": "钙化防御即钙化性尿毒症动脉病变，属于软组织钙化的严重表现。"}, {"text": "除血管和心脏瓣膜外，软组织钙化还可以发生于（  ）", "options": ["A.肾、肺、肌肉", "B.肝、脾、胰腺", "C.甲状腺、胸腺", "D.骨髓、淋巴结", "E.皮肤、毛发"], "answer": "A", "explanation": "软组织钙化除发生在血管和心脏瓣膜外，还可以发生于肾、肺、肌肉等部位，并可导致关节变形。"}, {"text": "慢性肾脏病患者尿蛋白＞1.0g/d时，血压控制目标是（  ）", "options": ["A.＜120/70mmHg", "B.＜125/75mmHg", "C.＜130/80mmHg", "D.＜135/85mmHg", "E.＜140/90mmHg"], "answer": "B", "explanation": "慢性肾脏病严格控制高血压与蛋白尿时，尿蛋白＞1.0g/d者血压应＜125/75mmHg；尿蛋白＜1.0g/d者血压应＜130/80mmHg。"}, {"text": "CKD5期患者的血压宜控制在（  ）", "options": ["A.＜125/75mmHg以下", "B.＜130/80mmHg以下", "C.＜135/85mmHg以下", "D.＜140/90mmHg以下", "E.＜150/95mmHg以下"], "answer": "D", "explanation": "CKD5期患者血压宜控制在&lt;140/90mmHg以下；CKD1-4期患者的血压目标值为&lt;130/80mmHg以下。"}, {"text": "慢性肾脏病患者控制蛋白尿的目标是使尿蛋白（  ）", "options": ["A.＜0.5g/24hr", "B.＜1.0g/24hr", "C.＜1.5g/24hr", "D.＜2.0g/24hr", "E.＜3.0g/24hr"], "answer": "A", "explanation": "慢性肾脏病的治疗目标是使尿蛋白＜0.5g/24hr或明显减轻微量白蛋白尿，同时应严格控制高血压。"}, {"text": "家庭自测血压推荐的正常上限参考值是（  ）", "options": ["A.125/75mmHg", "B.130/80mmHg", "C.135/85mmHg", "D.140/90mmHg", "E.145/95mmHg"], "answer": "C", "explanation": "家庭自测血压目前尚无正常值，其自测值低于诊所血压，推荐135/85mmHg作为正常上限参考值，在家测量的平均血压达到该水平应考虑为高血压。"}, {"text": "测量血压时，患者应在有靠背的椅子上静坐（  ）", "options": ["A.至少1分钟", "B.至少3分钟", "C.至少5分钟", "D.至少10分钟", "E.至少15分钟"], "answer": "C", "explanation": "正确测量血压要求病人在有靠背的椅子上静坐至少5分钟，上臂置于心脏水平，血压至少测定2次。"}, {"text": "测量血压时，确定舒张压采用的听诊音是（  ）", "options": ["A.第一音", "B.第二音", "C.第三音", "D.第四音", "E.消失音"], "answer": "E", "explanation": "测量血压时血压至少测定2次，采用消失音确定舒张压；测量以水银柱血压计为准，并应用标准袖带和气囊。"}, {"text": "家庭自测血压推荐使用的电子血压计类型是（  ）", "options": ["A.腕式电子血压计", "B.指套式电子血压计", "C.上臂式电子血压计", "D.耳夹式血压计", "E.任何类型均可"], "answer": "C", "explanation": "家庭自测血压推荐使用符合国际标准的上臂式电子血压计，不推荐腕式、指套式电子血压计；使用水银柱血压计时应培训柯氏音听诊法。"}, {"text": "慢性肾脏病患者的血压控制目标中，CKD1-4期患者与CKD5期患者的目标值分别是（  ）", "options": ["A.&lt;130/80mmHg和&lt;140/90mmHg", "B.&lt;140/90mmHg和&lt;130/80mmHg", "C.&lt;125/75mmHg和&lt;130/80mmHg", "D.&lt;130/80mmHg和&lt;125/75mmHg", "E.&lt;120/80mmHg和&lt;130/80mmHg"], "answer": "A", "explanation": "CKD1-4期患者血压目标值应&lt;130/80mmHg；CKD5期患者血压宜控制在&lt;140/90mmHg以下。尿蛋白&gt;1.0g/d者血压应&lt;125/75mmHg，尿蛋白&lt;1.0g/d者血压应&lt;130/80mmHg。"}, {"text": "动态血压监测24小时平均血压的正常参考值是（  ）", "options": ["A.＜125/75mmHg", "B.＜130/80mmHg", "C.＜135/85mmHg", "D.＜140/90mmHg", "E.＜145/95mmHg"], "answer": "B", "explanation": "动态血压监测的正常参考值为24小时&lt;130/80mmHg、白昼&lt;135/85mmHg、夜间&lt;125/75mmHg，夜间血压较白昼下降10～20%。"}, {"text": "动态血压监测夜间平均血压的正常参考值是（  ）", "options": ["A.＜120/70mmHg", "B.＜125/75mmHg", "C.＜130/80mmHg", "D.＜135/85mmHg", "E.＜140/90mmHg"], "answer": "B", "explanation": "动态血压监测的正常参考值为夜间&lt;125/75mmHg、白昼&lt;135/85mmHg、24小时&lt;130/80mmHg，夜间血压较白昼下降10～20%。"}, {"text": "动态血压监测中，正常夜间血压较白昼下降的幅度是（  ）", "options": ["A.5%～10%", "B.10%～20%", "C.20%～30%", "D.30%～40%", "E.40%～50%"], "answer": "B", "explanation": "动态血压监测要求夜间血压较白昼下降10～20%，据此可将血压分为杓型、非杓型、超杓型和反杓型。"}, {"text": "动态血压监测可用于诊断的高血压类型是（  ）", "options": ["A.白大衣高血压", "B.恶性高血压", "C.妊娠期高血压", "D.肾血管性高血压", "E.内分泌性高血压"], "answer": "A", "explanation": "动态血压监测的意义包括诊断白大衣高血压、识别难治性高血压、了解血压昼夜节律、预报靶器官损害以及选择及评价抗高血压药物疗效。"}, {"text": "血压监测手段对心血管事件预测的重要性由大到小依次为（  ）", "options": ["A.Clinic BP＞ABPM＞Home BP", "B.Home BP＞ABPM＞Clinic BP", "C.ABPM＞Home BP＞Clinic BP", "D.Home BP＞Clinic BP＞ABPM", "E.Clinic BP＞Home BP＞ABPM"], "answer": "B", "explanation": "血压监测手段的重要性排序为家庭自测血压（Home BP）＞动态血压监测（ABPM）＞诊所血压（Clinic BP）；家庭自测血压对靶器官损害及其进展的预测价值大于诊所血压。"}, {"text": "慢性肾脏病患者当肾功能可接受时，降压药物首选（  ）", "options": ["A.α受体阻滞剂", "B.β受体阻滞剂", "C.ACEI或ARB", "D.噻嗪类利尿剂", "E.钙通道阻滞剂"], "answer": "C", "explanation": "当肾功能可接受时降压药物首选ACEI或ARB，因其除降压外还有减少蛋白尿、抗氧化、抑制肾小球系膜细胞增殖以及减轻肾小球硬化的作用。"}, {"text": "使用ACEI或ARB时应慎用的血肌酐水平是（  ）", "options": ["A.＞133umol/L", "B.＞177umol/L", "C.＞221umol/L", "D.＞265umol/L", "E.＞442umol/L"], "answer": "D", "explanation": "ACEI或ARB可减轻肾小球内压力，但血肌酐&gt;265umol/L时应慎用；使用时还应监测血肌酐和血钾。"}, {"text": "使用ACEI或ARB后2个月，血肌酐较基础水平升高超过多少时应减量（  ）", "options": ["A.10%", "B.20%", "C.30%", "D.40%", "E.50%"], "answer": "C", "explanation": "使用ACEI或ARB后2个月血肌酐较基础水平升高&gt;30%或eGFR下降30%时应减量，超过50%时应停药。"}, {"text": "ACEI或ARB禁止用于下列哪种患者（  ）", "options": ["A.双肾动脉狭窄", "B.糖尿病肾病", "C.高血压肾小动脉硬化", "D.慢性肾小球肾炎", "E.狼疮性肾炎"], "answer": "A", "explanation": "ACEI或ARB禁止用于双肾动脉狭窄的患者；肾动脉狭窄患者应用ACEI或ARB还可导致肾局部血供急剧减少，成为慢性肾脏病急性加重的危险因素。"}, {"text": "为预防和延缓伴有慢性肾脏病的糖尿病微血管并发症，推荐的HbA1c目标值是（  ）", "options": ["A.＜6.0%", "B.＜6.5%", "C.7%", "D.8%", "E.9%"], "answer": "C", "explanation": "推荐HbA1c目标值为7%，以预防和延缓伴有慢性肾脏病的糖尿病微血管并发症；对2型糖尿病合并慢性肾脏病患者，血糖控制目标应个体化，HbA1c可适当放宽在7％～9％。"}, {"text": "慢性肾脏病酸中毒患者二氧化碳结合力低于多少时给予5%碳酸氢钠治疗（  ）", "options": ["A.15.1mmol/L", "B.16.1mmol/L", "C.17.1mmol/L", "D.18.1mmol/L", "E.20.0mmol/L"], "answer": "C", "explanation": "轻者口服碳酸氢钠，当二氧化碳结合力低于17.1mmol/L时给予5%碳酸氢钠治疗。"}, {"text": "纠正慢性肾脏病酸中毒时，每提高1mmol/L二氧化碳结合力需5%碳酸氢钠（  ）", "options": ["A.0.1ml/kg", "B.0.3ml/kg", "C.0.5ml/kg", "D.1.0ml/kg", "E.2.0ml/kg"], "answer": "C", "explanation": "当二氧化碳结合力低于17.1mmol/L时给予5%碳酸氢钠治疗，每提高1mmol/L需5%碳酸氢钠0.5ml/kg体重。"}, {"text": "慢性肾脏病明显水肿、高血压者的钠摄入量应为（  ）", "options": ["A.1g/day以下", "B.1-2g/day", "C.2-3g/day", "D.4-5g/day", "E.6-7g/day"], "answer": "C", "explanation": "明显水肿、高血压者钠摄入2-3g/day（相当于NaCl摄入量5-7g/day）；严重病例可限制为1-2g/day，必要时选用袢利尿剂。"}, {"text": "慢性肾脏病高钾血症需紧急透析的指征是血钾达到（  ）", "options": ["A.≥5.5mmol/L", "B.≥6.0mmol/L", "C.≥6.5mmol/L", "D.≥7.0mmol/L", "E.≥7.5mmol/L"], "answer": "C", "explanation": "高钾血症的治疗包括停止补钾、葡萄糖酸钙、降钾树脂、袢利尿剂、葡萄糖加胰岛素、碳酸氢钠等；紧急透析的指征为血钾≥6.5mmol/L或出现恶性心律失常。"}, {"text": "慢性肾脏病贫血使用促红细胞生成素治疗，起始每周用量为（  ）", "options": ["A.20～50单位/公斤体重", "B.50～80单位/公斤体重", "C.80～120单位/公斤体重", "D.150～200单位/公斤体重", "E.200～300单位/公斤体重"], "answer": "C", "explanation": "促红细胞生成素每周用量开始为80～120单位/公斤体重，分2～3次静注或皮下注射，同时补充铁剂、叶酸和维生素B12。"}, {"text": "慢性肾脏病贫血治疗中血红蛋白的达标范围是（  ）", "options": ["A.80～100g/L", "B.100～110g/L", "C.110～130g/L", "D.130～150g/L", "E.150～170g/L"], "answer": "C", "explanation": "贫血治疗的达标指标为血红蛋白110～130g/L或红细胞压积0.33～0.36，治疗中还应观察副作用。"}, {"text": "慢性肾脏病高磷血症时，分泌增多并继发甲状旁腺功能亢进的物质是（  ）", "options": ["A.促红细胞生成素", "B.FGF-23", "C.降钾树脂", "D.碳酸氢钠", "E.西那卡塞"], "answer": "B", "explanation": "慢性肾脏病高磷血症时FGF-23分泌增多，继发甲状旁腺功能亢进，形成肾性骨病；西那卡塞和降钾树脂属于药物，促红细胞生成素用于治疗贫血，碳酸氢钠用于纠正酸中毒。"}, {"text": "血液透析清除溶质和水分的原理是（  ）", "options": ["A.弥散、超滤及吸附", "B.弥散和对流", "C.仅超滤", "D.仅吸附", "E.仅弥散"], "answer": "A", "explanation": "血液透析的治疗机理是弥散、超滤及吸附；其指征为出现尿毒症表现、血肌酐&gt;707umol/L、肾小球滤过率&lt;15ml/min，且血液透析不能替代内分泌功能。"}]}, {"type": "multiple", "questions": [{"text": "慢性肾脏病的病因类别包括（  ）", "options": ["Ａ.肾小球疾病", "Ｂ.肾小管间质病变", "Ｃ.血管病变", "Ｄ.肾囊性病变", "Ｅ.肾外伤"], "answer": "ABCD", "explanation": "慢性肾脏病的病因包括肾小球疾病、肾小管间质病变、血管病变和肾囊性病变四大类；肾外伤是急性损伤因素，不属于慢性肾脏病的病因分类。"}, {"text": "下列属于肾小球疾病的有（  ）", "options": ["Ａ.慢性肾小球肾炎", "Ｂ.糖尿病肾病", "Ｃ.高血压肾小动脉硬化", "Ｄ.狼疮性肾炎", "Ｅ.慢性肾盂肾炎"], "answer": "ABCD", "explanation": "肾小球疾病包括慢性肾小球肾炎、糖尿病肾病、高血压肾小动脉硬化和狼疮性肾炎；慢性肾盂肾炎属于肾小管间质病变。"}, {"text": "慢性肾脏病的诊断依据包括（  ）", "options": ["Ａ.血或尿成分异常", "Ｂ.影像学检查异常", "Ｃ.病理学检查异常", "Ｄ.血肌酐正常即可排除", "Ｅ.不需要持续时间的限制"], "answer": "ABC", "explanation": "肾损害持续≧3个月的证据包括血或尿成分异常、影像学检查异常、病理学检查异常；血肌酐正常不能排除慢性肾脏病，肾损害或肾小球滤过率下降均要求持续≧3个月。"}, {"text": "慢性肾脏病渐进性发展的危险因素包括（  ）", "options": ["Ａ.高水平的蛋白尿", "Ｂ.低血清白蛋白", "Ｃ.高血压", "Ｄ.血糖控制不良", "Ｅ.泌尿系梗阻"], "answer": "ABCD", "explanation": "渐进性发展的危险因素包括年龄、种族、性别、肾脏疾病的类型和肾功能水平、高水平的蛋白尿、低血清白蛋白、高血压、血糖控制不良、吸烟；泌尿系梗阻属于急性加重的危
