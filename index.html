<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>血液净化理论考试题库</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e5e8ee; --txt:#1a1d24;
  --muted:#8a8f9c; --pri:#3b82f6; --pri-d:#2563eb; --pri-bg:#eff6ff;
  --ok:#16a34a; --bad:#dc2626; --okbg:#ecfdf5; --badbg:#fef2f2;
  --chip:#eef1f6;
}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;}
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px 10px;}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;}
.brand .count{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 10px;border-radius:999px;}
.tabs{display:flex;gap:4px;background:#f0f2f6;border-radius:12px;padding:4px;}
.tab{flex:1;text-align:center;padding:9px 0;font-size:14px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-radius:9px;transition:.15s;}
.tab.active{color:var(--pri);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.body{padding:14px;padding-bottom:60px;max-width:640px;margin:0 auto;}
/* home / sub-menu cards */
.menu{display:flex;flex-direction:column;gap:10px;}
.menucard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.menucard:active{transform:scale(.98);background:#fafbfd;}
.menucard .ico{flex:none;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--pri-bg);}
.menucard .ttl{font-size:15px;font-weight:600;}
.menucard .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.menucard .arrow{margin-left:auto;color:#c3c8d4;font-size:16px;}
/* chapter grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chipbtn{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:left;cursor:pointer;font:inherit;line-height:1.35;}
.chipbtn .n{font-size:11px;color:var(--muted);font-weight:600;}
.chipbtn .t{font-size:13px;font-weight:600;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.chipbtn:active{transform:scale(.98);background:var(--pri-bg);border-color:var(--pri);}
/* question card */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
.qmeta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px;}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;color:var(--pri);background:var(--pri-bg);}
.badge.multi{color:#9333ea;background:#f5f3ff;}
.badge.short{color:#0891b2;background:#ecfeff;}
.qtext{font-size:16px;line-height:1.65;font-weight:600;margin-bottom:14px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;cursor:pointer;line-height:1.5;font-size:15px;transition:.12s;}
.opt .key{flex:none;font-weight:700;min-width:22px;color:var(--muted);}
.opt:hover{border-color:var(--line);}
.opt.selected{background:#f7f8fa;}
.opt.correct{background:var(--okbg);border-color:var(--ok);}
.opt.wrong{background:var(--badbg);border-color:var(--bad);}
.opt .mark{margin-left:auto;flex:none;font-weight:700;}
.opt .mark.ok{color:var(--ok);}
.opt .mark.bad{color:var(--bad);}
.answer{display:none;margin-top:14px;padding:14px;border-radius:12px;line-height:1.7;font-size:14px;}
.answer.show{display:block;}
.answer.correct{background:var(--okbg);border:1px solid var(--ok);}
.answer.wrong{background:var(--badbg);border:1px solid var(--bad);}
.answer .lbl{font-weight:700;display:block;margin-bottom:5px;}
.expl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.expl b{color:#ea580c;}
.study-answerbox{background:#f0f7ff;border:1px solid #c7ddfb;margin-top:14px;padding:14px;border-radius:12px;line-height:1.7;font-size:14px;}
.study-answerbox .lbl{font-weight:700;color:var(--pri-d);display:block;margin-bottom:5px;}
.opt.study-correct{background:var(--okbg);border-color:var(--ok);font-weight:600;}
.opt.study-correct .key{color:var(--ok);}
/* pager */
.pager{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:40;max-width:640px;margin:0 auto;}
.pager .info{font-size:13px;color:var(--muted);}
.pager button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;}
.pager button.prim{background:var(--pri);color:#fff;border-color:var(--pri);}
.pager button:disabled{opacity:.4;cursor:default;}
.pager button:active{transform:scale(.97);}
/* back bar */
.backbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:14px;cursor:pointer;}
.backbar .bk{font-size:16px;color:var(--pri);}
/* mark buttons */
.markbar{display:flex;gap:8px;margin-top:14px;}
.markbar button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.markbar button.got{color:var(--ok);border-color:var(--ok);background:var(--okbg);}
.markbar button.notgot{color:var(--bad);border-color:var(--bad);background:var(--badbg);}
.markbar button.star-on{color:#d97706;border-color:#f59e0b;background:#fffbeb;}
.markbar button:active{transform:scale(.97);}
.hint{color:var(--muted);font-size:13px;margin-bottom:10px;}
.primary-btn{width:100%;padding:12px;border-radius:11px;border:none;background:var(--pri);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.short-ans{white-space:pre-wrap;}
.mt{margin-top:12px;}
.empty{padding:40px;text-align:center;color:var(--muted);}
/* 答题对错计数条 */
.stat-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:12px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.stat-bar .sb-ok{color:var(--ok);font-weight:700;flex:none;}
.stat-bar .sb-bad{color:var(--bad);font-weight:700;flex:none;}
.stat-bar .sb-total{color:var(--muted);flex:none;}
.stat-bar .sb-track{flex:1;height:6px;border-radius:3px;background:#eef0f4;overflow:hidden;display:flex;}
.stat-bar .sb-track .ok-fill{background:var(--ok);height:100%;transition:width .25s;}
.stat-bar .sb-track .bad-fill{background:var(--bad);height:100%;transition:width .25s;}
/* 错题练习信息条 */
.mistake-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.mistake-bar .mt-ico{flex:none;width:26px;height:26px;border-radius:8px;background:var(--badbg);color:var(--bad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.mistake-bar .mt-txt{flex:1;font-size:13px;font-weight:600;color:var(--txt);}
.mistake-bar .mt-clear{border:1px solid #fecaca;background:#fff;color:var(--bad);font-size:12px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer;}
.mistake-bar .mt-clear:active{background:var(--badbg);transform:scale(.97);}
/* 小号对错计数（错题条内） */
.sb-mini{font-size:12px;font-weight:700;flex:none;}
.sb-mini.ok{color:var(--ok);}
.sb-mini.bad{color:var(--bad);}
/* 模拟考试 */
.exam-info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.7;}
.exam-info b{color:var(--txt);}
.exam-fillinput{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:15px;box-sizing:border-box;}
.exam-fillinput:focus{outline:none;border-color:var(--pri);}
.exam-judge{display:flex;gap:10px;margin-top:10px;}
.exam-judge button{flex:1;padding:13px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.exam-judge button.sel-true{background:var(--okbg);border-color:var(--ok);color:var(--ok);}
.exam-judge button.sel-false{background:var(--badbg);border-color:var(--bad);color:var(--bad);}
.exam-judge button:active{transform:scale(.97);}
.exam-score{text-align:center;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;}
.exam-score .big{font-size:44px;font-weight:800;color:var(--pri);line-height:1;}
.exam-score .lbl{color:var(--muted);font-size:13px;margin-top:8px;}
.exam-review .qcard{border-left:4px solid var(--ok);}
.exam-review .qcard.iscorrect{border-left-color:var(--ok);}
.exam-review .qcard.iswrong{border-left-color:var(--bad);}
.exam-review .qcard.isblank{border-left-color:#cbd5e1;}
.exam-review .verdict{font-weight:700;font-size:13px;margin-bottom:6px;}
.exam-review .verdict.ok{color:var(--ok);}
.exam-review .verdict.bad{color:var(--bad);}
.exam-review .verdict.blank{color:var(--muted);}
.exam-fillans{font-size:14px;color:var(--ok);margin-top:4px;}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <h1>血液净化理论考试题库</h1>
    <span class="count">38 讲 · 3065 题</span>
  </div>
  <div class="tabs">
    <button id="tabPractice" class="tab active">答题模式</button>
    <button id="tabStudy" class="tab">背题模式</button>
  </div>
</div>
<div class="body" id="content"></div>
<div class="pager" id="pager" style="display:none"></div>

<script>
// 禁止网页缩放（捏合/DoubleTap）
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('gesturechange',function(e){e.preventDefault();});
document.addEventListener('gestureend',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
let _lastTouchEnd=0;
document.addEventListener('touchend',function(e){
  const now=Date.now();
  if(now-_lastTouchEnd<=300){ e.preventDefault(); }
  _lastTouchEnd=now;
},{passive:false});
document.addEventListener('touchmove',function(e){ if(e.touches.length>1){ e.preventDefault(); } },{passive:false});
let DATA=null;
let MODE='practice';
let pool=[], poolIdx=0;

// 会话内题目状态缓存：key=题目标识 -> {opts(打乱后), ansSet, answer, explain, chosen(已选下标数组), ok, answered}
let sessionState={};
function qStateKey(q){ return `${q.ch.num}:${q.type}:${q.text}`; }

// 错题本
const MISTAKE_KEY='quiz_mistakes_v1'; // {qKey: {text, chNum, type, answer, explain, ts}}
let mistakes={};
try{ mistakes=JSON.parse(localStorage.getItem(MISTAKE_KEY)||'{}'); }catch(e){ mistakes={}; }
function saveMistakes(){ try{ localStorage.setItem(MISTAKE_KEY, JSON.stringify(mistakes)); }catch(e){} }
function addMistake(q, explain){
  const k=qStateKey(q);
  mistakes[k]={text:q.text, chNum:q.ch.num, type:q.type, answer:q.answer, explain:explain||q.explanation, ts:Date.now()};
  saveMistakes();
}
function removeMistake(k){ delete mistakes[k]; saveMistakes(); }

const LSKEY='quiz_marks_v1';
let marks={};
try{ marks=JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch(e){ marks={}; }
function saveMarks(){ try{ localStorage.setItem(LSKEY, JSON.stringify(marks)); }catch(e){} }
function qkey(q){ return qStateKey(q); }
function isMarked(q){ return !!marks[qkey(q)]; }
function toggleMark(q){ const k=qkey(q); if(marks[k]) delete marks[k]; else marks[k]=1; saveMarks(); }

// 打星收藏（重要知识点）
const STAR_KEY='quiz_stars_v1'; // {qKey: {text,chNum,type,answer,explain,ts}}
let stars={};
try{ stars=JSON.parse(localStorage.getItem(STAR_KEY)||'{}'); }catch(e){ stars={}; }
function saveStars(){ try{ localStorage.setItem(STAR_KEY, JSON.stringify(stars)); }catch(e){} }
function isStarred(q){ return !!stars[qStateKey(q)]; }
function toggleStar(q){
  const k=qStateKey(q);
  if(stars[k]) delete stars[k];
  else stars[k]={text:q.text, chNum:q.ch.num, type:q.type, answer:q.answer, explain:q.explanation, ts:Date.now()};
  saveStars();
}

// --- 进度记忆 ---
const PROGKEY='quiz_progress_v1'; // {sessionId: {idx, total, ts, label}}
let progress={};
try{ progress=JSON.parse(localStorage.getItem(PROGKEY)||'{}'); }catch(e){ progress={}; }
function saveProgress(){ try{ localStorage.setItem(PROGKEY, JSON.stringify(progress)); }catch(e){} }
let curSession=null; // 当前来源标识，如 'practice:chapter:3' / 'practice:random' / 'study:type:single'

function typeName(t){ return {single:'单选题',multiple:'多选题',short:'简答题'}[t]||t; }
function typeBadge(t){ return {single:'',multiple:' multi',short:' short'}[t]||''; }
function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// flatten all questions of the whole bank
function allQuestions(){
  let out=[];
  DATA.forEach(ch=>{
    ch.sections.forEach(s=>{
      s.questions.forEach(q=>out.push({...q,type:s.type,ch:ch}));
    });
  });
  return out;
}

function showHome(){
  const c=document.getElementById('content');
  document.getElementById('pager').style.display='none';
  c.innerHTML=
    `<div class="menu">
      ${
        MODE==='practice' ? `
        <div class="menucard" onclick="showChapters()">
          <div class="ico">📚</div><div><div class="ttl">章节分类</div><div class="sub">按 38 讲逐章练习</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="showTypes()">
          <div class="ico">🔤</div><div><div class="ttl">题型分类</div><div class="sub">单选 / 多选 / 简答</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="startRandom()">
          <div class="ico">🎲</div><div><div class="ttl">随机模式</div><div class="sub">所有章节题型随机抽 1000 题${progLabel('practice:random',1000)?' · '+progLabel('practice:random',1000):''}</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="showMistakes()">
          <div class="ico">📝</div><div><div class="ttl">错题本</div><div class="sub">${Object.keys(mistakes).length} 道错题 · 按章节分类</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="showStars()">
          <div class="ico">⭐</div><div><div class="ttl">重要知识点</div><div class="sub">${Object.keys(stars).length} 个已收藏</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="showExamStart()">
          <div class="ico">🏆</div><div><div class="ttl">模拟考试</div><div class="sub">32 题 · 满分 108 分</div></div><div class="arrow">›</div>
        </div>`
        : `
        <div class="menucard" onclick="showChapters()">
          <div class="ico">📚</div><div><div class="ttl">章节分类</div><div class="sub">按 38 讲逐章背诵</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="showTypes()">
          <div class="ico">🔤</div><div><div class="ttl">题型分类</div><div class="sub">单选 / 多选 / 简答</div></div><div class="arrow">›</div>
        </div>
        <div class="menucard" onclick="showStars()">
          <div class="ico">⭐</div><div><div class="ttl">重要知识点</div><div class="sub">${Object.keys(stars).length} 个已收藏</div></div><div class="arrow">›</div>
        </div>`
      }
    </div>`;
}

function progLabel(sid, total){
  const p=progress[sid];
  if(p && p.idx>0 && p.total===total) return `上次到第 ${p.idx+1} 题`;
  if(p && p.total===total && p.idx===0) return total+' 题';
  return '';
}
function showChapters(){
  const c=document.getElementById('content');
  document.getElementById('pager').style.display='none';
  let grid='<div class="backbar" onclick="showHome()"><span class="bk">‹</span>返回</div><div class="grid">';
  DATA.forEach(ch=>{
    const total=ch.sections.reduce((a,s)=>a+s.questions.length,0);
    const pl=progLabel(`${MODE}:chapter:${ch.num}`, total);
    grid+=`<button class="chipbtn" onclick="startChapter(${ch.num})"><span class="n">第${ch.num}讲 · ${total}题${pl?' · '+pl:''}</span><br><span class="t">${esc(ch.title)}</span></button>`;
  });
  grid+='</div>';
  c.innerHTML=grid;
}

function showTypes(){
  const c=document.getElementById('content');
  document.getElementById('pager').style.display='none';
  const types=[['single','单选题','A'],['multiple','多选题','AB'],['short','简答题','答']];
  let html='<div class="backbar" onclick="showHome()"><span class="bk">‹</span>返回</div><div class="menu">';
  types.forEach(([k,name,ico])=>{
    const cnt=allQuestions().filter(q=>q.type===k).length;
    const pl=progLabel(`${MODE}:type:${k}`, cnt);
    html+=`<div class="menucard" onclick="startType('${k}')"><div class="ico">${ico}</div><div><div class="ttl">${name}</div><div class="sub">共 ${cnt} 题${pl?' · '+pl:''}</div></div><div class="arrow">›</div></div>`;
  });
  html+='</div>';
  c.innerHTML=html;
}

function showMistakes(){
  const keys=Object.keys(mistakes);
  if(!keys.length){
    const c=document.getElementById('content');
    document.getElementById('pager').style.display='none';
    c.innerHTML=`<div class="backbar" onclick="showHome()"><span class="bk">‹</span>返回</div><div style="padding:60px 20px;text-align:center;">
      <div style="font-size:48px;margin-bottom:12px;">📝</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px;">暂无错题</div>
      <div style="font-size:13px;color:var(--muted);">答题时答错的题会自动收录到这里</div>
    </div>`;
    return;
  }
  startMistakePractice('');
}
function viewMistake(k){
  const m=mistakes[k];
  const c=document.getElementById('content');
  document.getElementById('pager').style.display='none';
  const q=allQuestions().find(qq=>qStateKey(qq)===k);
  let html=`<div class="backbar" onclick="showMistakes()"><span class="bk">‹</span>返回错题本</div><div class="qcard">`;
  html+=`<div class="qmeta"><span>${m.chNum}讲</span><span class="badge${typeBadge(m.type)}">${typeName(m.type)}</span></div>`;
  html+=`<div class="qtext">${esc(m.text)}</div>`;
  if(q && q.options && q.options.length){
    const opts=q.options.map(o=>{ const mm=o.match(/^([Ａ-ＺA-Z])[.．]?(.*)$/); if(mm){const l=mm[1].replace(/[Ａ-Ｚ]/g,cc=>String.fromCharCode(cc.charCodeAt(0)-0xFEE0)); return {label:l.toUpperCase(),text:mm[2].trim()};} return {label:'',text:o}; });
    const ansSet=new Set(m.answer.replace(/[^A-Z]/g,'').split(''));
    let ob='<div class="opts">';
    opts.forEach(o=>{
      const lbl=o.label;
      ob+=`<div class="opt${ansSet.has(lbl)?' correct':''}"><span class="key">${esc(lbl)}</span><span>${esc(o.text)}</span>${ansSet.has(lbl)?'<span class="mark ok">✔</span>':''}</div>`;
    });
    ob+='</div>';
    html+=ob;
  }
  html+=`<div class="study-answerbox"><span class="lbl">答案：<b>${esc(m.answer)}</b></span>`;
  if(m.explain){ html+=`<div class="expl"><b>解析：</b>${esc(m.explain)}</div>`; }
  html+=`</div><div class="markbar"><button class="markbar-btn notgot" onclick="removeMistake('${k}');showMistakes();">移出错题本</button><button class="markbar-btn${isStarred(q)?' notgot':''}" onclick="toggleStarFromMistake('${k}');showMistakes();">${isStarred(q)?'★ 已收藏':'☆ 加入重要知识点'}</button></div></div>`;
  c.innerHTML=html;
}
function toggleStarFromMistake(k){
  const m=mistakes[k];
  const q={text:m.text, ch:{num:m.chNum}, type:m.type, answer:m.answer, explanation:m.explain};
  const key=qStateKey(q);
  toggleStar(q);
}
function clearMistakes(){
  if(confirm('确定清空全部错题？')){ mistakes={}; saveMistakes(); showMistakes(); }
}

// ============ 模拟考试 ============
let exam=null; // {papers:[{...}], idx, answers:{idx:...}}
const EXAM_CFG=[
  {type:'single',  count:11, score:3,  label:'单选'},
  {type:'multiple',count:5,  score:4,  label:'多选'},
  {type:'fill',    count:10, score:2,  label:'填空'},

];

    <button class="primary-btn" onclick="startExam()">开始考试</button>`;

function startExam(){
  const all=allQuestions();
  const papers=[];
  let qid=0;
  EXAM_CFG.forEach(cfg=>{
    let src=[];
    if(cfg.type==='single') src=all.filter(q=>q.type==='single');
    else if(cfg.type==='multiple') src=all.filter(q=>q.type==='multiple');
    else if(cfg.type==='short') src=all.filter(q=>q.type==='short');
    else if(cfg.type==='judge') src=all.filter(q=>q.type==='single' && /[（(]\s*[）)]/.test(q.text));
    else if(cfg.type==='fill') src=all.filter(q=>(q.type==='single'||q.type==='multiple') && /[（(]\s*[）)]/.test(q.text));
    const picked=shuffle(src).slice(0,cfg.count);
    picked.forEach(srcQ=>{
      papers.push(makePaper(cfg.type, srcQ, qid++, cfg.score));
    });
  });
  exam={papers:shuffle(papers), idx:0, answers:{}, judged:{}};
  renderExamPaper();
  window.scrollTo(0,0);
}
function makePaper(etype, srcQ, qid, score){
  const opts=(srcQ.options||[]).map(o=>{ const m=o.match(/^([Ａ-ＺA-Z])[.．]?(.*)$/); if(m){const l=m[1].replace(/[Ａ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); return {label:l.toUpperCase(),text:m[2].trim()};} return {label:'',text:o}; });
  const ansSet=new Set(srcQ.answer.replace(/[^A-Z]/g,'').split(''));
  const correctOpts=opts.filter(o=>ansSet.has(o.label)).map(o=>o.text);
  const base={id:qid, etype, score, src:srcQ, chNum:srcQ.ch.num, text:srcQ.text, answer:srcQ.answer, explanation:srcQ.explanation, correctTexts:correctOpts, optsText:opts.map(o=>o.text)};
  if(etype==='single'||etype==='multiple'){
    const perm=shuffle(opts.map((_,i)=>i));
    base.opts=perm.map((oldIdx,newPos)=>({label:String.fromCharCode(65+newPos),text:opts[oldIdx].text, isAns:ansSet.has(opts[oldIdx].label)}));
  } else if(etype==='fill'){
    if(srcQ.type==='multiple'){
      base.isMulti=true;
      base.stdAns=correctOpts.join('、');
      base.text=srcQ.text.replace(/[（(]\s*[）)]/,'都有哪些？');
      base.stdAnswers=correctOpts;
    } else {
      base.isMulti=false;
      base.stdAns=(correctOpts[0]||srcQ.answer).trim();
    }
  } else if(etype==='judge'){
    const isTrue=Math.random()<0.5;
    const fillText = isTrue ? (correctOpts[0]||'') : pickWrongOption(opts, ansSet);
    base.statement=fillStatement(srcQ.text, fillText);
    base.isTrue=isTrue;
  } else if(etype==='short'){
    base.stdAns=srcQ.answer;
  }
  return base;
}
function pickWrongOption(opts, ansSet){
  const wrong=opts.filter(o=>!ansSet.has(o.label));
  return wrong.length ? wrong[Math.floor(Math.random()*wrong.length)].text : (opts[0]?opts[0].text:'');
}
function fillStatement(text, fillText){
  if(text.includes('（')||text.includes('(')){
    return text.replace(/[（(]\s*[）)]/,''+fillText);
  }
  // 无空位：直接拼接末尾；若末尾已有标点则去掉
  const t=text.replace(/[，,、；;：:。]\s*$/,'');
  return t+'：'+fillText;
}
function normalizeAns(s){
  return (s||'').replace(/\s+/g,'').replace(/[～~]/g,'-').replace(/[％%]/g,'%').replace(/[。．.]/g,'.').replace(/[：:]/g,':');
}
// 简答题关键词提取 + 匹配（命中率≥80%判对）
const STOP_WORDS=['进行','包括','其中','主要','例如','以及','以及','等等','所谓','属于','关于','由于','根据','按照','通过','对于','作为','具有','含有','是指','指的','一个','一种','就是','可以','需要','应当','应该','必须','如果','但是','因为','所以','因此','用户','我们','他们','这些','那些','什么','怎样','如何','是否','没有','不是','不可','可以','可','需','应','要','会','能','并','且','或','与','和','及','的','之','其','等','这','那','在','中','下','上','由','从','对','将','把','被','所','向','于','起','过' ];
function extractKeywords(answer){
  let s=(answer||'');
  s=s.replace(/【[^】]*】/g,'');
  s=s.replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫]/g,'');
  s=s.replace(/[（(][^（）()]*[）)]/g,'');
  s=s.replace(/[0-9０-９]+[、.．\)\)、]/g,'');
  s=s.replace(/[《〈][^》〉]*[》〉]/g,'');
  const parts=s.split(/[。；;、，,：:！!？?\n\r]+/).map(x=>x.trim()).filter(x=>x.length>=2);
  const kws=[];
  parts.forEach(p=>{
    let t=p;
    // 去开头虚词
    for(let k=0;k<3;k++){
      let changed=false;
      for(const w of STOP_WORDS){
        if(t.startsWith(w) && t.length>w.length+1){ t=t.slice(w.length); changed=true; }
      }
      if(!changed) break;
    }
    t=t.slice(0,6);
    if(t.length>=2) kws.push(t);
  });
  return [...new Set(kws)].filter(k=>k.length>=2);
}
function checkShortMatch(userAns, stdAns){
  const u=(userAns||'').trim();
  if(!u) return false;
  const kws=extractKeywords(stdAns);
  if(kws.length===0) return true;
  if(kws.length<3){ // 关键词太少，至少命中1个即算对（避免误判）
    return kws.some(k=>u.includes(k));
  }
  let hit=0;
  kws.forEach(k=>{ if(u.includes(k)) hit++; });
  return (hit/kws.length)>=0.8;
}
function checkFillEqual(user, std){
  let u=normalizeAns(user), s=normalizeAns(std);
  if(!u||!s) return false;
  if(u===s) return true;
  const strip=t=>t.replace(/万人|万|人次|家|人|%|ml|min|L|h|mmHg|次|天|周|月|年|g|mg|mmol|'/g,'');
  return strip(u)===strip(s) && strip(u).length>0;
}
// 多选填空题判分：标准答案的每个正确选项文字都要被用户命中
function checkFillMulti(user, stdAnswers){
  const u=normalizeAns(user);
  if(!u || !stdAnswers || !stdAnswers.length) return false;
  if(u===normalizeAns(stdAnswers.join('、'))) return true;
  let hit=0;
  stdAnswers.forEach(a=>{
    const core=normalizeAns(a).replace(/^[（(]|[）)]$/g,'');
    if(core && u.includes(core.slice(0, Math.min(core.length, 8)))) hit++;
  });
  return (hit/stdAnswers.length)>=1;
}
function renderExamPaper(){

  pager.style.display='none';

  const saved=exam.answers[p.id];
  const judged=exam.judged[p.id]; // undefined | true | false
  const qtext = p.etype==='judge' ? p.statement : p.text;
  // 实时对错计数
  let correctCnt=0, wrongCnt=0;
  exam.papers.forEach(pp=>{ const j=exam.judged[pp.id]; if(j===true) correctCnt++; else if(j===false) wrongCnt++; });
  const tj=correctCnt+wrongCnt;
  const pctj=tj>0?Math.round(correctCnt/tj*100):0;
  const scorebar=`<div class="stat-bar"><span class="sb-ok">✓ 答对 ${correctCnt}</span><span class="sb-bad">✗ 答错 ${wrongCnt}</span><span class="sb-total">共 ${exam.papers.length} 题</span><div class="sb-track"><div class="ok-fill" style="width:${pctj}%"></div><div class="bad-fill" style="width:${tj>0?100-pctj:0}%"></div></div></div>`;
  let interact='';
  let verdictHtml='';
  if(judged!==undefined){
    verdictHtml=`<div class="verdict ${judged?'ok':'bad'}" style="margin-top:10px;">${judged?'✓ 回答正确':'✗ 回答错误'}</div>`;
  }
  if(p.etype==='single'||p.etype==='multiple'){
    const multi=p.etype==='multiple';
    let ob='<div class="opts">';
    p.opts.forEach((o,idx)=>{
      const sel = saved!==undefined && (multi? (saved.indexOf(idx)>=0) : saved===idx);
      // 已评判时显示对错标色
      let mark='';
      if(judged!==undefined){

        else if(sel){ mark='<span class="mark bad">✘</span>'; }
      }
      const cls = sel?' selected':'';
      ob+=`<div class="opt${cls}${judged!==undefined&&o.isAns?' correct':''}${judged!==undefined&&sel&&!o.isAns?' wrong':''}" data-eidx="${idx}"><span class="key">${esc(o.label)}</span><span>${esc(o.text)}</span>${mark}</div>`;
    });
    ob+='</div>';
    const confirm = multi && judged===undefined ? `<button class="primary-btn mt" id="examConfirm">确认本题</button>` : '';
    interact=ob+confirm;
  } else if(p.etype==='fill'){
    if(judged!==undefined){
      interact=`<div class="exam-fillans">你的答案：${esc(saved||'（未答）')} ｜ 标准答案：${esc(p.stdAns)}</div>`;
    } else {
      interact=`<input class="exam-fillinput" id="examFill" type="text" placeholder="请输入答案" value="${esc(saved||'')}"><button class="primary-btn mt" id="examFillSubmit">提交</button>`;
    }
  } else if(p.etype==='judge'){
    if(judged!==undefined){
      interact=`<div style="font-size:14px;margin-top:8px;">你的判断：${saved?'对':'错'} ｜ 正解：${p.isTrue?'对':'错'}</div>`;
    } else {
      const sel=saved;
      interact=`<div class="exam-judge"><button id="ejTrue" class="${sel===true?'sel-true':''}">✓ 对</button><button id="ejFalse" class="${sel===false?'sel-false':''}">✗ 错</button></div>`;
    }
  } else if(p.etype==='short'){
    if(judged!==undefined){
      interact=`<div style="font-size:13px;color:var(--muted);margin-top:6px;">你的答案：<div style="white-space:pre-wrap;color:var(--txt);">${esc(saved||'（未答）')}</div></div><div class="study-answerbox"><span class="lbl">参考答案</span><div class="short-ans">${esc(p.stdAns)}</div></div>`;
    } else {
      interact=`<textarea class="exam-fillinput" id="examShort" rows="5" placeholder="请输入答案，系统将自动评判"></textarea><button class="primary-btn mt" id="examShortSubmit">提交并评判</button>`;
    }
  }
  const badge=p.etype==='single'?'':p.etype==='multiple'?' multi':' short';
  const body=scorebar+`<div class="qcard">
    <div class="qmeta"><span>第 ${exam.idx+1} / ${exam.papers.length} 题 · ${p.chNum}讲</span><span class="badge${badge}">${typeCn[p.etype]} · ${p.score}分</span></div>
    <div class="qtext">${esc(qtext)}</div>
    ${interact}${verdictHtml}
  </div>`;
  c.innerHTML=body;
  pager.style.display='flex';
  pager.innerHTML=`<button onclick="examStep(-1)">‹ 上一题</button><span class="info">${exam.idx+1}/${exam.papers.length}</span>${exam.idx===exam.papers.length-1?`<button class="prim" onclick="examSubmit()">交卷</button>`:`<button class="prim" onclick="examStep(1)">下一题 ›</button>`}`;
  bindExamInteract(p);
}
function bindExamInteract(p){
  const multi=p.etype==='multiple';
  // 统一评判函数：计算对错，记录 judged，答对跳/答错停
  function judgeAndProceed(ok){
    exam.judged[p.id]=ok;
    if(ok){ // 答对自动跳下一题（交卷题除外）
      if(exam.idx < exam.papers.length-1) examStep(1);
      else renderExamPaper();
    } else {
      renderExamPaper(); // 答错停留
    }
  }
  if(p.etype==='single'){
    document.querySelectorAll('.opt[data-eidx]').forEach(el=>{
      el.onclick=()=>{ const idx=+el.dataset.eidx; exam.answers[p.id]=idx; const ok=p.opts[idx] && p.opts[idx].isAns; judgeAndProceed(ok); };
    });
  } else if(p.etype==='multiple'){
    if(!exam.answers[p.id]) exam.answers[p.id]=[];
    const cur=exam.answers[p.id];
    document.querySelectorAll('.opt[data-eidx]').forEach(el=>{
      el.onclick=()=>{
        const idx=+el.dataset.eidx;
        const i=cur.indexOf(idx); if(i>=0) cur.splice(i,1); else cur.push(idx);
        renderExamPaper();
      };
    });
    const conf=document.getElementById('examConfirm');
    if(conf) conf.onclick=()=>{
      const chosen=new Set(exam.answers[p.id].map(i=>p.opts[i].label));
      const correct=new Set(p.opts.filter(o=>o.isAns).map(o=>o.label));
      const ok=chosen.size===correct.size && [...correct].every(x=>chosen.has(x));
      judgeAndProceed(ok);
    };
  } else if(p.etype==='fill'){
    const inp=document.getElementById('examFill');
    const sub=document.getElementById('examFillSubmit');
    if(inp) inp.oninput=()=>{ exam.answers[p.id]=inp.value; };
    if(sub) sub.onclick=()=>{ const v=(document.getElementById('examFill').value||'').trim(); exam.answers[p.id]=v; if(!v){alert('请先输入答案');return;} const ok=p.isMulti?checkFillMulti(v, p.stdAnswers):checkFillEqual(v, p.stdAns); judgeAndProceed(ok); };
  } else if(p.etype==='judge'){
    const bt=document.getElementById('ejTrue'), bf=document.getElementById('ejFalse');
    if(bt) bt.onclick=()=>{ exam.answers[p.id]=true; judgeAndProceed(p.isTrue===true); };
    if(bf) bf.onclick=()=>{ exam.answers[p.id]=false; judgeAndProceed(p.isTrue===false); };
  } else if(p.etype==='short'){
    const sub=document.getElementById('examShortSubmit');
    if(sub) sub.onclick=()=>{ const v=(document.getElementById('examShort').value||'').trim(); exam.answers[p.id]=v; if(!v){alert('请先输入答案');return;} judgeAndProceed(checkShortMatch(v, p.stdAns)); };
  }
}
function examStep(d){
  exam.idx=(exam.idx+d+exam.papers.length)%exam.papers.length;
  renderExamPaper();
  window.scrollTo(0,0);
}
function examSubmit(){
  if(!confirm('确定交卷吗？')) return;
  let totalScore=0;
  const review=[];
  exam.papers.forEach(p=>{
    const ans=exam.answers[p.id];
    let ok=false, userText='';
    if(p.etype==='single'){
      if(ans!==undefined){ ok=p.opts[ans] && p.opts[ans].isAns; userText=p.opts[ans]?p.opts[ans].text:''; }
    } else if(p.etype==='multiple'){
      if(ans && ans.length){ const chosen=new Set(ans.map(i=>p.opts[i].label)); const correct=new Set(p.opts.filter(o=>o.isAns).map(o=>o.label)); ok=chosen.size===correct.size && [...correct].every(x=>chosen.has(x)); userText=ans.map(i=>p.opts[i].text).join('、'); }
    } else if(p.etype==='fill'){
      userText=ans||''; ok = p.isMulti ? checkFillMulti(userText, p.stdAnswers) : checkFillEqual(userText, p.stdAns);
    } else if(p.etype==='judge'){
      if(ans!==undefined){ ok=(ans===p.isTrue); userText=ans?'对':'错'; }
    } else if(p.etype==='short'){
      if(ans!==undefined && ans!==''){ ok=checkShortMatch(ans, p.stdAns); userText=ans; }
    }
    if(ok) totalScore+=p.score;
    review.push({p, ok, answered:(ans!==undefined && (p.etype!=='fill'||ans!=='') && (p.etype!=='multiple'||ans.length>0)), userText});
  });
  renderExamResult(totalScore, review);
  window.scrollTo(0,0);
}
function renderExamResult(totalScore, review){
  const c=document.getElementById('content');
  const pager=document.getElementById('pager');
  pager.style.display='none';
  const full=108;
  let html=`<div class="backbar" onclick="showExamStart()"><span class="bk">‹</span>返回</div>
    <div class="exam-score"><div class="big">${totalScore}</div><div class="lbl">满分 ${full} 分 · ${review.filter(r=>r.ok).length}/${review.length} 题答对</div></div>
    <div class="exam-review">`;
  review.forEach((r,i)=>{
    const typeCn={single:'单选',multiple:'多选',fill:'填空',judge:'判断',short:'简答'};
    const cls=r.ok?'iscorrect':'iswrong';
    const vcls=r.ok?'ok':'bad';
    const verdict=r.ok?'✓ 正确':'✗ 错误';
    const 真名=r.p.etype==='judge'?r.p.statement:r.p.text;
    html+=`<div class="qcard ${cls}"><div class="verdict ${vcls}">${i+1}. [${typeCn[r.p.etype]} · ${r.p.score}分] ${verdict}</div>
      <div class="qtext">${esc(真名)}</div>`;
    if(r.p.etype==='fill'){ html+=`<div class="exam-fillans">你的答案：${esc(r.userText||'（未答）')} ｜ 标准答案：${esc(r.p.stdAns)}</div>`; }
    else if(r.p.etype==='judge'){ html+=`<div style="font-size:13px;color:var(--muted);margin-top:4px;">你的判断：${esc(r.userText||'（未答）')} ｜ 正解：${r.p.isTrue?'对':'错'}</div>`; }
    else if(r.p.etype==='short'){ html+=`<div style="font-size:13px;color:var(--muted);margin-top:6px;">你的答案：<div style="white-space:pre-wrap;color:var(--txt);">${esc(r.userText||'（未答）')}</div></div><div class="short-ans" style="white-space:pre-wrap;color:var(--muted);">参考答案：${esc(r.p.stdAns||'')}</div>`; }
    else { html+=`<div style="font-size:13px;color:var(--ok);margin-top:4px;">正确答案：${esc(r.p.answer)}</div>`; }
    if(r.p.explanation){ html+=`<div class="expl"><b>解析：</b>${esc(r.p.explanation)}</div>`; }
    html+=`</div>`;
  });
  html+=`</div><button class="primary-btn mt" onclick="startExam()">再考一次</button>`;
  c.innerHTML=html;
}

class QuestionWidget{
  constructor(root,q){ this.root=root; this.q=q; this.key=qStateKey(q); this.selected=[]; this.answered=false; this.study=(MODE==='study'); const body=document.createElement('div'); this.build(body); root.appendChild(body); }
  build(body){
    const q=this.q;
    const opts=this.parseOpts();
    const ansSet=new Set(q.answer.replace(/[^A-Z]/g,'').split(''));
    if(this.study){ this.buildStudy(body,opts,ansSet); return; }
    // 若已有会话状态（翻回旧题），复用打乱结果与答题状态，不重新打乱
    let st=sessionState[this.key];
    let opts2, ansSet2, answer2, explain2;
    if(st && st.opts){
      opts2=st.opts; ansSet2=new Set(st.ansSet); answer2=st.answer; explain2=st.explain;
    } else {
      const shuffled=this.shuffleOpts(opts, ansSet);
      opts2=shuffled.opts; ansSet2=shuffled.ansSet; answer2=shuffled.answer; explain2=shuffled.explain;
      st={opts:opts2, ansSet:[...ansSet2], answer:answer2, explain:explain2, chosen:[], ok:null, answered:false};
      sessionState[this.key]=st;
    }
    this.answerDisplay=answer2; this.explainDisplay=explain2;
    this.state=st;
    if(q.type==='short'){
      const d=document.createElement('div');
      body.appendChild(d);
      if(st.answered){
        d.innerHTML=`<div class="hint">简答题 · 你的作答已保存</div>`;
        this.showShortAns(d, st, true);
      } else {
        d.innerHTML=`<div class="hint">简答题 · 请在下方输入你的答案，系统将自动评判</div>
          <textarea class="exam-fillinput" id="shortAnswer" rows="5" placeholder="请输入答案…" style="resize:vertical;"></textarea>
          <button class="primary-btn mt" id="shortSubmit">提交并评判</button>`;
        const ta=d.querySelector('#shortAnswer');
        const btn=d.querySelector('#shortSubmit');
        btn.onclick=()=>{
          const val=ta.value.trim();
          if(!val){ alert('请先输入答案'); return; }
          const ok=checkShortMatch(val, this.q.answer);
          st.userAnswer=val; st.answered=true; st.ok=ok;
          sessionState[this.key]=st;
          if(!ok) addMistake(this.q, this.q.explanation);
          this.showShortAns(d, st, true, ok);
          updateStatBars();
          this.autoAdvance(ok);
        };
      }
      return;
    }
    const multi=q.type==='multiple';
    const hint=document.createElement('div');
    hint.className='hint';
    hint.textContent=multi?'多选题：点击选项即时判断（全选对即通过）':'单选题：点击选择答案';
    body.appendChild(hint);
    const box=document.createElement('div'); box.className='opts';
    opts2.forEach((o,idx)=>{
      const lbl=o.label||String.fromCharCode(65+idx);
      const div=document.createElement('div'); div.className='opt'; div.dataset.idx=idx;
      div.innerHTML=`<span class="key">${esc(lbl)}</span><span>${esc(o.text)}</span><span class="mark"></span>`;
      if(st.answered){
        const isAns=ansSet2.has(lbl);
        const wasChosen=st.chosen.includes(idx);
        if(isAns){ div.classList.add('correct'); div.querySelector('.mark').textContent='✔'; div.querySelector('.mark').className='mark ok'; }
        else if(wasChosen){ div.classList.add('wrong'); div.querySelector('.mark').textContent='✘'; div.querySelector('.mark').className='mark bad'; }
      } else if(st.chosen.includes(idx)){
        div.classList.add('selected');
      }
      if(!st.answered) div.onclick=()=>this.onSelect(idx,multi,box,opts2,ansSet2,body);
      box.appendChild(div);
    });
    body.appendChild(box);
    if(st.answered){
      this.appendAnswerBox(body, st);
    }
  }
  appendAnswerBox(body, st){
    const ok=st.ok;
    const box2=document.createElement('div');
    box2.className='answer show '+(ok?'correct':'wrong');
    const ansDisplay=this.answerDisplay||this.q.answer;
    box2.innerHTML=`<span class="lbl">${ok?'✓ 回答正确':'✗ 回答错误'} · 正确答案：<b style="color:var(--ok)">${esc(ansDisplay)}</b></span>`;
    const expText=this.explainDisplay||this.q.explanation;
    if(expText){ const e=document.createElement('div'); e.className='expl'; e.innerHTML='<b>解析：</b>'+esc(expText); box2.appendChild(e); }
    const sb=document.createElement('button');
    const starred=isStarred(this.q);
    sb.className='markbar-btn mt'+(starred?' star-on':'');
    sb.textContent=starred?'★ 已收藏':'☆ 设为重要知识点';
    sb.style.cssText='padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;cursor:pointer;';
    sb.onclick=()=>{ toggleStar(this.q); const s2=isStarred(this.q); sb.className='markbar-btn mt'+(s2?' star-on':''); sb.textContent=s2?'★ 已收藏':'☆ 设为重要知识点'; };
    box2.appendChild(sb);
    body.appendChild(box2);
  }
  showShortAns(container, st, showUser, ok){
    const d=document.createElement('div');
    d.className='answer show '+(ok===false?'wrong':'correct');
    let html='';
    if(ok===true) html+=`<span class="lbl">✓ 回答正确</span>`;
    else if(ok===false) html+=`<span class="lbl">✗ 回答错误</span>`;
    if(showUser && st.userAnswer){
      html+=`<div style="font-size:13px;color:var(--muted);margin:6px 0 8px;">你的答案：<div style="white-space:pre-wrap;color:var(--txt);">${esc(st.userAnswer)}</div></div>`;
    }
    html+=`<span class="lbl">参考答案</span><div class="short-ans">${esc(this.q.answer)}</div>`;
    if(this.q.explanation){ html+=`<div class="expl"><b>解析：</b>${esc(this.q.explanation)}</div>`; }
    d.innerHTML=html;
    container.appendChild(d);
    st.answered=true; sessionState[this.key]=st;
  }
  // 随机打乱选项，返回 {opts, ansSet, answer, explain}；answer 为打乱后的正确字母串
  shuffleOpts(opts, ansSet){
    const perm=shuffle(opts.map((_,i)=>i)); // perm[newPos] = oldIdx
    const newOpts=perm.map((oldIdx,newPos)=>{
      const o=opts[oldIdx];
      return {...o, label:String.fromCharCode(65+newPos)};
    });
    // 旧字母 -> 新字母 映射
    const oldToNew={};
    opts.forEach((o,oldIdx)=>{
      const oldLbl=o.label||String.fromCharCode(65+oldIdx);
      const newPos=perm.indexOf(oldIdx);
      oldToNew[oldLbl]=String.fromCharCode(65+newPos);
    });
    const newAnsSet=new Set([...ansSet].map(x=>oldToNew[x]||x));
    const answer=[...newAnsSet].sort().join('');
    // 重写解析中「X项 / X、Y项」这类选项字母引用，避免打乱后误导
    let explain=this.q.explanation;
    if(explain){
      explain=explain.replace(/[Ａ-ＥA-E]([、,，][Ａ-ＥA-E])*项/g,(m)=>{
        return m.replace(/[Ａ-ＥA-E]/g,x=>{
          const half=x.replace(/[Ａ-Ｅ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
          return oldToNew[half]||x;
        });
      });
    }
    return {opts:newOpts, ansSet:newAnsSet, answer, explain};
  }
  parseOpts(){
    const q=this.q;
    if(!q.options||!q.options.length) return [];
    return q.options.map(o=>{ const m=o.match(/^([Ａ-ＺA-Z])[.．]?(.*)$/); if(m){ const l=m[1].replace(/[Ａ-Ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); return {label:l.toUpperCase(),text:m[2].trim()}; } return {label:'',text:o}; });
  }
  onSelect(idx,multi,box,opts,ansSet,body){
    if(this.state.answered) return;
    if(!multi){
      this.state.chosen=[idx];
      this.check(box,opts,ansSet,body,this.answerDisplay,this.explainDisplay);
      return;
    }
    // 多选题：点击即判断
    const lbl=opts[idx].label||String.fromCharCode(65+idx);
    const isAns=ansSet.has(lbl);
    if(!isAns){
      // 点了错误项 → 立即判错
      if(!this.state.chosen.includes(idx)) this.state.chosen.push(idx);
      this.check(box,opts,ansSet,body,this.answerDisplay,this.explainDisplay);
      return;
    }
    // 正确项：标记勾选
    if(!this.state.chosen.includes(idx)) this.state.chosen.push(idx);
    sessionState[this.key]=this.state;
    Array.from(box.children).forEach((el,j)=>el.classList.toggle('selected',this.state.chosen.includes(j)));
    // 所有正确项都选中 → 判对
    const allSelected=[...ansSet].every(l=>this.state.chosen.some(i=>(opts[i].label||String.fromCharCode(65+i))===l));
    if(allSelected){
      this.check(box,opts,ansSet,body,this.answerDisplay,this.explainDisplay);
    }
  }
  check(box,opts,ansSet,body,answerStr,explainStr){
    if(this.state.answered) return;
    const multi=this.q.type==='multiple';
    const chosen=new Set(this.state.chosen.map(i=>opts[i].label||String.fromCharCode(65+i)));
    const correctLbls=ansSet;
    let ok;
    if(multi){ ok=chosen.size===correctLbls.size&&[...correctLbls].every(x=>chosen.has(x)); }
    else { const c=this.state.chosen[0]; ok=(c!==undefined)&&correctLbls.has(opts[c].label||String.fromCharCode(65+c)); }
    this.state.answered=true; this.state.ok=ok; this.state.chosen=this.state.chosen.slice();
    sessionState[this.key]=this.state;
    if(!ok) addMistake(this.q, this.explainDisplay);
    else if(curSession==='practice:mistakes'){
      removeMistake(this.key);
      const mt=document.querySelector('.mistake-bar .mt-txt');
      if(mt){
        const left=Object.keys(mistakes).length;
        mt.textContent = left>0 ? `错题练习 · 剩余 ${left} 题` : '🎉 全部完成，错题已清空';
      }
    }
    Array.from(box.children).forEach((el,j)=>{
      const lbl=opts[j].label||String.fromCharCode(65+j);
      const isAns=correctLbls.has(lbl);
      el.classList.remove('selected');
      if(isAns) el.classList.add('correct'); else if(chosen.has(lbl)) el.classList.add('wrong');
      const mk=el.querySelector('.mark');
      if(isAns){mk.textContent='✔';mk.className='mark ok';} else if(chosen.has(lbl)){mk.textContent='✘';mk.className='mark bad';}
    });
    this.appendAnswerBox(body, this.state);
    if(this.confirmBtn) this.confirmBtn.style.display='none';
    updateStatBars();
    this.autoAdvance(this.state.ok);
  }
  autoAdvance(ok){
    // 答题模式：答对立即跳下一题，答错停住（需手动点「下一题」）
    if(MODE==='study') return;
    if(!ok) return; // 答错不自动跳，留在当前题查看解析
    if(poolIdx>=pool.length-1) return;
    step(1);
  }
  buildStudy(body,opts,ansSet){
    const q=this.q;
    if(q.type==='short'){
      const d=document.createElement('div');
      d.className='study-answerbox';
      d.innerHTML=`<span class="lbl">参考答案</span><div class="short-ans">${esc(q.answer)}</div>`;
      if(q.explanation){ const e=document.createElement('div'); e.className='expl'; e.innerHTML='<b>解析：</b>'+esc(q.explanation); d.appendChild(e); }
      body.appendChild(d); body.appendChild(this.makeMarkBar());
      return;
    }
    const box=document.createElement('div'); box.className='opts';
    opts.forEach((o,idx)=>{
      const lbl=o.label||String.fromCharCode(65+idx);
      const div=document.createElement('div'); div.className='opt';
      if(ansSet.has(lbl)) div.classList.add('study-correct');
      div.innerHTML=`<span class="key">${esc(lbl)}</span><span>${esc(o.text)}</span>${ansSet.has(lbl)?'<span class="mark ok">✔</span>':''}`;
      box.appendChild(div);
    });
    body.appendChild(box);
    const b=document.createElement('div'); b.className='study-answerbox';
    b.innerHTML=`<span class="lbl">答案：<b>${esc(q.answer)}</b></span>`;
    if(q.explanation){ const e=document.createElement('div'); e.className='expl'; e.innerHTML='<b>解析：</b>'+esc(q.explanation); b.appendChild(e); }
    body.appendChild(b); body.appendChild(this.makeMarkBar());
  }
  makeMarkBar(){
    const bar=document.createElement('div'); bar.className='markbar';
    const marked=isMarked(this.q);
    const got=document.createElement('button'); const ngot=document.createElement('button');
    this.refreshMarkBtns(marked,got,ngot);
    got.onclick=()=>this.setMark(false,got,ngot);
    ngot.onclick=()=>this.setMark(true,got,ngot);
    bar.appendChild(got); bar.appendChild(ngot);
    // 打星按钮
    const star=document.createElement('button');
    const starred=isStarred(this.q);
    star.className='markbar-btn'+(starred?' star-on':'');
    star.textContent=starred?'★ 已收藏':'☆ 重要知识点';
    star.onclick=()=>{ toggleStar(this.q); const s=isStarred(this.q); star.className='markbar-btn'+(s?' star-on':''); star.textContent=s?'★ 已收藏':'☆ 重要知识点'; };
    bar.appendChild(star);
    return bar;
  }
  refreshMarkBtns(marked,got,ngot){
    got.className='markbar-btn'+(marked?'':' got'); got.textContent=marked?'会了 ✓':'标记：会了';
    ngot.className='markbar-btn'+(marked?' notgot':''); ngot.textContent=marked?'不会 ✗ (已收藏)':'标记：不会';
  }
  setMark(wantNotGot,got,ngot){
    const prev=isMarked(this.q);
    if(wantNotGot){ if(!prev) toggleMark(this.q); } else { if(prev) toggleMark(this.q); }
    this.refreshMarkBtns(isMarked(this.q),got,ngot);
  }
}

DATA=[{"num": 1, "title": "血透室质量与安全理论考试题库", "sections": [{"type": "single", "questions": [{"text": "截止2025年，我国在透血液透析患者人数为（  ）", "options": ["A.16.2万人", "B.113.7万人", "C.130万人", "D.8941万人", "E.1137万人"], "answer": "B", "explanation": "截止2025年，在透血液透析患者113.7万人；腹膜透析患者16.2万人；透析总人数130万人；我国血透中心数8941家。"}, {"text": "截止2025年，我国血液透析中心数量为（  ）", "options": ["A.1137家", "B.8941家", "C.1300家", "D.4520家", "E.1.3万家"], "answer": "B", "explanation": "截止2025年，我国血透中心数8941家。"}, {"text": "截止2025年，我国血液透析患者与腹膜透析患者的透析总人数为（  ）", "options": ["A.113.7万人", "B.130万人", "C.16.2万人", "D.200万人", "E.8941万人"], "answer": "B", "explanation": "截止2025年，在透血液透析患者113.7万人，腹膜透析患者16.2万人，透析总人数130万人。"}, {"text": "血液透析患者治疗总例数中，严重（可能严重危及患者生命）并发症的统计要求是（  ）", "options": ["A.严重并发症例次应单独统计并记录", "B.无需单独统计，合并计入总例次", "C.仅统计死亡病例", "D.仅在发生医疗纠纷时统计", "E.由患者家属自行登记"], "answer": "A", "explanation": "血透室质控基础数据中，对血透中严重（可能严重危及患者生命）并发症例次应单独统计记录，与治疗总例次、新增患者数、维持性血透患者死亡例数等一并纳入月度质控数据。"}, {"text": "1911年首先提出标准化管理的是（  ）", "options": ["A.泰勒", "B.戴明", "C.南丁格尔", "D.希波克拉底", "E.韦伯"], "answer": "A", "explanation": "1911年，泰勒（科学管理之父）首先提出了标准化管理；上世纪80年代初，西方发达国家开始探索医院标准化管理，建立医院评审标准。"}, {"text": "上世纪80年代初，开始探索医院标准化管理、建立医院评审标准的是（  ）", "options": ["A.西方发达国家", "B.我国卫生行政部门", "C.国际护理学会", "D.世界卫生组织", "E.日本厚生省"], "answer": "A", "explanation": "上世纪80年代初，西方发达国家开始探索医院标准化管理，建立医院评审标准。"}, {"text": "按照“标准”的定义，其目的是（  ）", "options": ["A.由公认机构批准", "B.在一定范围内获得最佳次序", "C.协商一致", "D.共同使用和重复", "E.科学、技术和经验的结晶"], "answer": "B", "explanation": "标准的目的是在一定范围内获得最佳次序；其特点为共同使用和重复，原则为协商一致，程序为由公认机构批准，基础为科学、技术和经验的结晶。"}, {"text": "按照“标准”的定义，其特点是（  ）", "options": ["A.共同使用和重复", "B.协商一致", "C.由公认机构批准", "D.在一定范围内获得最佳次序", "E.盈利性"], "answer": "A", "explanation": "标准的特点为共同使用和重复。"}, {"text": "按照“标准”的定义，其原则是（  ）", "options": ["A.协商一致", "B.共同使用和重复", "C.由公认机构批准", "D.强制推行", "E.等价交换"], "answer": "A", "explanation": "标准的原则为协商一致。"}, {"text": "按照“标准”的定义，其程序是（  ）", "options": ["A.由公认机构批准", "B.协商一致", "C.共同使用和重复", "D.随机抽查", "E.企业自定"], "answer": "A", "explanation": "标准的程序为由公认机构批准。"}, {"text": "下列不属于“标准”所强调的特性的是（  ）", "options": ["A.一致性", "B.约束性", "C.操作性", "D.共同遵守性", "E.盈利性"], "answer": "E", "explanation": "标准强调一致性、约束性、操作性、共同遵守性，不含“盈利性”。"}, {"text": "血透室急救器材管理中，中心吸痰装置的要求是（  ）", "options": ["A.符合要求，性能良好，贮液瓶干燥保存", "B.贮液瓶保持湿润以利吸引", "C.无需定期检查性能", "D.可与其他器材共用一个贮液瓶", "E.仅在抢救时临时安装"], "answer": "A", "explanation": "血透室急救器材管理中，中心吸痰装置要求符合要求、性能良好，贮液瓶干燥保存。"}, {"text": "血透室对锐器的处理要求是（  ）", "options": ["A.用后放入锐器盒内，严禁针帽回套，满3/4封口后交接转出", "B.用后针头回套针帽再丢弃", "C.可与其他生活垃圾一并丢弃", "D.锐器盒装满后自行带出科室丢弃", "E.用后暂放治疗车台面集中处理"], "answer": "A", "explanation": "血透室医疗废物管理要求锐器物（针头、穿刺针）用后放入锐器盒内，严禁针帽回套，满3/4封口交接转出。"}, {"text": "血透室水处理间对A液、B粉及消毒液的存放要求是（  ）", "options": ["A.放置规范，与标识一致", "B.可与清洁物品混放", "C.可放在治疗室台面随取随用", "D.无需标识，按颜色区分即可", "E.可置于患者候诊区方便取用"], "answer": "A", "explanation": "按照血透室库房耗材管理要求，库房内A液、B粉以及消毒液应放置规范、与标识一致。"}, {"text": "血透室库房耗材的出库核对要求是（  ）", "options": ["A.每周清点出入库是否匹配，并有每月、每年清点", "B.仅在每年年底清点一次", "C.无需清点，按需领取即可", "D.仅在新购入库时清点", "E.由患者自行登记领取数量"], "answer": "A", "explanation": "库房耗材要求每周清点出入库是否匹配，同时每月、每年清点出入库是否匹配，有问题及时提出。"}, {"text": "血透室对库房温湿度的管理要求是（  ）", "options": ["A.温湿度符合要求，并查看记录是否完整", "B.仅需登记温度，不记录湿度", "C.无需监测温湿度", "D.只需夏季监测", "E.由患者家属协助记录"], "answer": "A", "explanation": "血透室库房管理要求温湿度符合要求，并查看记录是否完整。"}, {"text": "血透室对无菌物品储物框的消毒要求是（  ）", "options": ["A.每月擦拭消毒并有记录", "B.每周擦拭消毒并有记录", "C.每季度擦拭消毒并有记录", "D.每年擦拭消毒并有记录", "E.无需擦拭消毒"], "answer": "A", "explanation": "血透室常用物品管理中，每月对物品储物框进行擦拭消毒并做好记录。"}, {"text": "血透室对冰箱药品的清点要求是（  ）", "options": ["A.每月清点一次", "B.每周清点一次", "C.每季度清点一次", "D.每半年清点一次", "E.每年清点一次"], "answer": "A", "explanation": "血透室设置冰箱药品目录，冰箱内药品每月清点一次，要求无过期变质，且无不属于冰箱药品的其余药品或物品放置。"}, {"text": "血透室对治疗车、治疗区台面及床单位的清洁要求是（  ）", "options": ["A.每班擦拭", "B.每日擦拭一次", "C.每周擦拭一次", "D.每月擦拭一次", "E.仅污染时擦拭"], "answer": "A", "explanation": "血透室环境管理要求治疗车、治疗区台面、床单位每班擦拭，保持清洁。"}, {"text": "血透室对科室仪器设备物表的清洁消毒要求是（  ）", "options": ["A.每周清洁消毒一次，患者使用后及时清洁消毒并有记录", "B.每月清洁消毒一次即可", "C.每季度清洁消毒一次即可", "D.仅在明显污染时清洁消毒", "E.无需记录清洁消毒情况"], "answer": "A", "explanation": "血透室要求科室仪器设备物表每周清洁消毒一次，患者使用后及时清洁消毒，并做好记录。"}, {"text": "血液净化中心质控会（质量安全小组会议）的召开频次是（  ）", "options": ["A.每周一次", "B.每两周一次", "C.每月一次", "D.每季度一次", "E.每半年一次"], "answer": "C", "explanation": "血液净化中心质控会频次为每月一次。"}, {"text": "血透室质控会的特殊之处在于（  ）", "options": ["A.仅医生参加", "B.仅护士参加", "C.医护一体，质控会共同参与", "D.由院感科单独主持", "E.由患者家属参加"], "answer": "C", "explanation": "血透室的特殊之处是医护一体、质控会共同参与：患者透析质量由医生调整各医嘱及透析处方、护士执行；患者治疗安全由护士执行、医护观察、医生医嘱、护士再执行；院感安全由医护共同遵循、共同守护。"}, {"text": "血液净化中心质控会的内容不包括（  ）", "options": ["A.基础数据", "B.透析并发症", "C.血管通路情况", "D.环境监测情况", "E.患者家庭经济状况"], "answer": "E", "explanation": "质控会内容包括六个方面：一、基础数据；二、透析并发症；三、血管通路情况；四、环境监测情况；五、维持性透析患者质量检测指标；六、护理各质控小组检查。"}, {"text": "关于血透室环境检测，下列不属于每月一次的项目是（  ）", "options": ["A.透析液、置换液、透析用水细菌学监测", "B.空气监测", "C.物表、手、消毒液细菌学监测", "D.透析用水、置换液、透析液内毒素监测", "E.以上均为每月一次"], "answer": "D", "explanation": "每月一次的项目为透析液、置换液、透析用水细菌学监测，空气监测，物表、手、消毒液细菌学监测；透析用水、置换液、透析液内毒素监测为每三月一次。"}, {"text": "血透室环境检测中，化学污染物检查的频次是（  ）", "options": ["A.每月至少一次", "B.每季度至少一次", "C.每年至少一次", "D.每三年至少一次", "E.仅新装机器时一次"], "answer": "C", "explanation": "环境检测情况中，化学污染物检查为每年至少一次。"}, {"text": "新机器或者新更换水路管道后，对细菌、内毒素的检测要求是（  ）", "options": ["A.无需检测", "B.随时查细菌、内毒素等", "C.使用满一年后检测", "D.仅做外观检查", "E.仅登记不检测"], "answer": "B", "explanation": "新机器或者新更换水路管道等，随时查细菌、内毒素等；细菌监测和内毒素监测每年每台机器至少进行一次。"}, {"text": "透析室空气平均细菌菌落总数的标准是（  ）", "options": ["A.≤4CFU/（5min·9cm直径平皿）", "B.≤10CFU/（5min·9cm直径平皿）", "C.≤100CFU/ml", "D.≤0.5EU/ml", "E.≤50CFU/ml"], "answer": "A", "explanation": "每月对透析室空气、物体、机器表面及部分医务人员手抽样进行病原微生物的培养监测，保留原始记录并建立登记表。空气平均细菌菌落总数应≤4CFU/（5min·9cm直径平皿）。"}, {"text": "透析室物体表面平均细菌菌落总数与医务人员卫生手消毒后手表面细菌菌落总数的标准分别是（  ）", "options": ["A.均≤10CFU/cm²", "B.均≤4CFU/cm²", "C.≤10CFU/cm²、≤4CFU/cm²", "D.≤100CFU/cm²、≤10CFU/cm²", "E.均≤100CFU/cm²"], "answer": "A", "explanation": "物体表面平均细菌菌落总数应≤10CFU/cm²；医务人员卫生手消毒后手表面细菌菌落总数应≤10CFU/cm²。"}, {"text": "每月1次进行透析用水和透析液的细菌检测，应保持的细菌数量是（  ）", "options": ["A.≤10CFU/ml", "B.≤50CFU/ml", "C.≤100CFU/ml", "D.≤200CFU/ml", "E.≤500CFU/ml"], "answer": "C", "explanation": "每月1次进行透析用水和透析液的细菌检测，保持细菌数量≤100CFU/ml；细菌数量&gt;50CFU/ml应进行干预。"}, {"text": "透析用水和透析液细菌数量达到多少时应进行干预（  ）", "options": ["A.&gt;10CFU/ml", "B.&gt;50CFU/ml", "C.&gt;100CFU/ml", "D.&gt;200CFU/ml", "E.&gt;0.5CFU/ml"], "answer": "B", "explanation": "透析用水和透析液细菌数量应保持≤100CFU/ml，细菌数量&gt;50CFU/ml应进行干预。"}, {"text": "透析用水内毒素应保持的水平是（  ）", "options": ["A.≤0.03EU/ml", "B.≤0.25EU/ml", "C.≤0.5EU/ml", "D.≤1.0EU/ml", "E.≤2.0EU/ml"], "answer": "B", "explanation": "至少每3个月进行1次内毒素检测，保持透析用水内毒素≤0.25EU/ml及透析液内毒素≤0.5EU/ml。"}, {"text": "透析液内毒素应保持的水平是（  ）", "options": ["A.≤0.25EU/ml", "B.≤0.5EU/ml", "C.≤1.0EU/ml", "D.≤0.05EU/ml", "E.≤2.0EU/ml"], "answer": "B", "explanation": "至少每3个月进行1次内毒素检测，保持透析液内毒素≤0.5EU/ml。"}, {"text": "透析用水、透析液内毒素水平超过最大允许水平的多少时应进行干预（  ）", "options": ["A.10%", "B.25%", "C.50%", "D.80%", "E.100%"], "answer": "C", "explanation": "透析用水内毒素≤0.25EU/ml及透析液内毒素≤0.5EU/ml，超过最大允许水平的50%应进行干预。"}, {"text": "透析患者跌倒风险危险因子评估中，“意识不清、躁动不安”应记为（  ）", "options": ["A.1分", "B.2分", "C.3分", "D.4分", "E.0分"], "answer": "C", "explanation": "跌倒风险危险因子评估中：半年内曾发生过跌倒记1分；意识不清、躁动不安记3分；视觉不佳、影响生活记1分；入厕次数≥10次/日记1分；使用多重药物（≥4种）记1分。"}, {"text": "透析用水的细菌或内毒素水平达到干预水平时，应（  ）", "options": ["A.继续使用并加强观察", "B.对水处理系统进行消毒", "C.更换全部透析器", "D.提高透析液流量", "E.增加透析频次"], "answer": "B", "explanation": "透析用水的细菌或内毒素水平达到干预水平，应对水处理系统进行消毒。"}, {"text": "透析用水的细菌和内毒素水平合格，而透析液的细菌或内毒素水平超标时，应（  ）", "options": ["A.仅更换透析液", "B.对所有同型号透析机进行透析液细菌和内毒素检测，并校验透析机消毒程序", "C.停止全部透析治疗", "D.仅记录不处理", "E.提高消毒液浓度后继续使用"], "answer": "B", "explanation": "透析用水的细菌和内毒素水平合格而透析液超标时，应对所有同型号透析机进行透析液细菌和内毒素检测，并校验透析机消毒程序；对于不符合或达到干预标准的水处理系统和/或透析机，必须重新消毒且符合标准后方可使用。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，长期透析患者乙型肝炎、丙型肝炎、梅毒和艾滋病标志物的检测频率是（  ）", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每年1次", "E.每2年1次"], "answer": "C", "explanation": "血液透析患者医疗质量管理指标及检测频率中，长期透析患者乙型肝炎、丙型肝炎、梅毒和艾滋病标志物检测频率为每6个月1次。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，新导入或新转入患者血源性传染病标志物的检测要求是（  ）", "options": ["A.即时检测，3个月内复检", "B.6个月后检测", "C.每3个月1次", "D.每半年1次", "E.无需检测"], "answer": "A", "explanation": "新导入或新转入患者即时检测，3个月内复检；长期透析患者每6个月1次；阳性转阴患者前6个月每月1次、后6个月每3个月1次；新发患者的密切接触者即时检测。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，血源性传染病标志物阳性转阴患者的检测频率是（  ）", "options": ["A.前3个月每月1次，后6个月每3个月1次", "B.前6个月每月1次，后6个月每3个月1次", "C.每月1次，共12个月", "D.每3个月1次", "E.每6个月1次"], "answer": "B", "explanation": "血源性传染病标志物阳性转阴患者：前6个月每月1次，后6个月每3个月1次。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，血常规的检测频率是（  ）", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每年1次", "E.每2周1次"], "answer": "B", "explanation": "血液透析患者血常规检测频率为每3个月1次。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，血液生化（肝肾功能、电解质、血脂等）的检测频率是（  ）", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每年1次", "E.每2周1次"], "answer": "B", "explanation": "血液透析患者血液生化（肝肾功能、电解质、血脂等）检测频率为每3个月1次，与血常规相同。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，血清铁蛋白和转铁蛋白饱和度的检测频率是（  ）", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每年1次", "E.每两年1次"], "answer": "C", "explanation": "血清铁蛋白和转铁蛋白饱和度检测频率为每6个月1次。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，全段甲状旁腺激素的检测频率是（  ）", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每年1次", "E.每两年1次"], "answer": "C", "explanation": "全段甲状旁腺激素检测频率为每6个月1次，与血清铁蛋白和转铁蛋白饱和度、血清前白蛋白、C反应蛋白、β2微球蛋白、Kt/V和URR相同。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，Kt/V和URR的检测频率是（  ）", "options": ["A.每月1次", "B.每3个月1次", "C.每6个月1次", "D.每年1次", "E.每周1次"], "answer": "C", "explanation": "Kt/V和URR检测频率为每6个月1次。Kt/V为尿素清除指数，URR为尿素下降率。"}, {"text": "维持性血液透析患者肾性贫血控制率的血红蛋白标准是（  ）", "options": ["A.≥90g/l", "B.≥100g/l", "C.≥110g/l", "D.≥120g/l", "E.≥130g/l"], "answer": "C", "explanation": "每季度统计维持性血液透析患者肾性贫血控制率，以血红蛋白≥110g/l为控制标准。"}, {"text": "维持性血液透析患者慢性肾脏病-矿物质与骨异常指标控制中，血钙达标范围是（  ）", "options": ["A.1.8mmol/l～2.1mmol/l", "B.2.1mmol/l～2.55mmol/l", "C.2.55mmol/l～3.0mmol/l", "D.1.5mmol/l～2.0mmol/l", "E.2.0mmol/l～2.5mmol/l"], "answer": "B", "explanation": "慢性肾脏病-矿物质与骨异常（CKD-MBD）指标控制率中，钙达标范围为2.1mmol/l～2.55mmol/l。"}, {"text": "维持性血液透析患者慢性肾脏病-矿物质与骨异常指标控制中，磷达标率的标准是（  ）", "options": ["A.&lt;1.45mmol/l", "B.&lt;1.78mmol/l", "C.&lt;2.0mmol/l", "D.&lt;1.0mmol/l", "E.&lt;2.5mmol/l"], "answer": "B", "explanation": "慢性肾脏病-矿物质与骨异常指标控制率中，磷达标率为&lt;1.78mmol/l。"}, {"text": "维持性血液透析患者慢性肾脏病-矿物质与骨异常指标控制中，全段甲状旁腺素（iPTH）达标范围是（  ）", "options": ["A.50≤iPTH≤300pg/ml", "B.100≤iPTH≤500pg/ml", "C.150≤iPTH≤600pg/ml", "D.200≤iPTH≤800pg/ml", "E.300≤iPTH≤1000pg/ml"], "answer": "C", "explanation": "慢性肾脏病-矿物质与骨异常指标控制率中，IPTH达标率为150≤iPTH≤600pg/ml，并统计钙、磷、iPTH同时达标率。"}, {"text": "维持性血液透析患者血压控制中，透析间期血压控制范围是（  ）", "options": ["A.80/50～140/80mmHg", "B.90/60～150/90mmHg", "C.100/60～160/100mmHg", "D.90/60～140/90mmHg", "E.100/70～150/95mmHg"], "answer": "B", "explanation": "每季度统计血压控制（透析间期血压90/60～150/90mmHg）例数。"}, {"text": "血液净化中心质控基础数据中，血液透析机台数为（  ）", "options": ["A.12台", "B.16台", "C.20台", "D.22台", "E.26台"], "answer": "D", "explanation": "血液净化中心质控基础数据中，血液透析机22台。"}, {"text": "血液净化中心质控基础数据中，专职医师与专职护理人员的人数分别是（  ）", "options": ["A.2名、14名", "B.4名、14名", "C.2名、22名", "D.3名、16名", "E.2名、9名"], "answer": "A", "explanation": "血液净化中心质控基础数据中，专职医师2名，专职护理人员14名。"}, {"text": "每月血液透析患者透析间期体重增长控制率是（  ）", "options": ["A.65.09%", "B.70.09%", "C.75.09%", "D.80.09%", "E.85.09%"], "answer": "C", "explanation": "每月血液透析患者透析间期体重增长控制率为75.09%。"}, {"text": "每月维持性血液透析患者的动静脉内瘘长期使用率是（  ）", "options": ["A.85%", "B.90%", "C.95%", "D.100%", "E.75%"], "answer": "D", "explanation": "每月维持性血液透析患者的动静脉内瘘长期使用率为100%。"}, {"text": "维持性血液透析患者的乙型肝炎和丙型肝炎发病率分别是（  ）", "options": ["A.0%、4.25%", "B.4.25%、0%", "C.4.25%、4.25%", "D.0%、0%", "E.2.5%、0%"], "answer": "B", "explanation": "维持性血液透析患者的乙型肝炎发病率为4.25%，丙型肝炎发病率为0%。"}, {"text": "每月进行患者满意度调查时，应至少完成长期规律透析人数的（  ）", "options": ["A.5%～6%", "B.7%～8%", "C.9%～10%", "D.15%～20%", "E.20%～30%"], "answer": "B", "explanation": "病历及患者管理组每月进行满意度调查，根据患者总数，每月至少完成长期规律透析人数7%～8%的满意度调查，收集患者意见并汇总、汇报，每月月底前完成。"}, {"text": "每月进行病历检查和督导时，抽查当月病历数量不少于（  ）", "options": ["A.10份", "B.15份", "C.20份", "D.30份", "E.50份"], "answer": "C", "explanation": "病历及患者管理组每月进行病历检查和督导，抽查当月病历不少于20份，将问题汇总、汇报并提醒整改。"}, {"text": "病历及患者管理组每月至少检查责任护士的比例是（  ）", "options": ["A.5%", "B.10%", "C.15%", "D.20%", "E.30%"], "answer": "C", "explanation": "病历及患者管理组每月至少检查15%责任护士，并每月抽查至少15%责任护士健康宣教情况，将问题汇总、汇报、提醒整改。"}, {"text": "血液净化室护理质量考核评价标准（2024版试行）的标准值是（  ）", "options": ["A.≥80%", "B.≥85%", "C.≥90%", "D.≥95%", "E.≥100%"], "answer": "D", "explanation": "血液净化室护理质量考核评价标准（2024版试行）的标准值为≥95%，考核内容包括护理管理、环境管理、物品药品管理等项目。"}, {"text": "按照血液透析护理专业医疗质量控制指标的要求，计算“护患比”时不包括（  ）", "options": ["A.白班责任护士数", "B.夜班责任护士数", "C.行连续性肾脏替代治疗（CRRT）的责任护士人数及患者数", "D.直接照护血透患者的执业护士", "E.承担责任护士工作的护士长"], "answer": "C", "explanation": "护患比指统计周期内责任护士人数与其负责照护的血液透析患者数量的比例，不包括行连续性肾脏替代治疗（CRRT）的责任护士人数及患者数。"}, {"text": "按照血液透析护理专业医疗质量控制指标的要求，责任护士每工作多少小时计为1名责任护士人力（  ）", "options": ["A.4小时", "B.6小时", "C.8小时", "D.10小时", "E.12小时"], "answer": "C", "explanation": "责任护士人数指统计周期内所有在岗直接照护血透患者的责任护士人力之和，责任护士每工作8小时计为1名责任护士人力。"}, {"text": "按照血液透析护理专业医疗质量控制指标的要求，计算护患比时应排除的岗位是（  ）", "options": ["A.责任护士", "B.治疗护士（配药护士）、办公班护士（主班）、护士长等其它岗位护士", "C.夜班责任护士", "D.辅助护理岗位护士", "E.直接照护血透患者的执业护士"], "answer": "B", "explanation": "计算责任护士人力时应包含所有直接服务血透患者的班次及辅助护理岗位护士人力，排除非直接护理血透患者的治疗护士（配药护士）、办公班护士（主班）、护士长等其它岗位护士；当护士长承担责任护士的工作时需计算在内。"}, {"text": "按照血液透析护理专业医疗质量控制指标的定义，体外循环凝血发生率统计的是（  ）", "options": ["A.0级凝血", "B.Ⅰ级及以上凝血", "C.Ⅱ级及以上凝血", "D.Ⅲ级凝血", "E.所有凝血"], "answer": "C", "explanation": "体外循环凝血发生率指统计周期内血液透析发生Ⅱ级及以上凝血例次数与同期血液透析患者总例次数的百分比。"}, {"text": "血液透析体外循环凝血程度分级中，透析器回血后整个透析器全部被残留血液阻塞、血路管回血后血凝块充满动脉壶或静脉壶内，属于（  ）", "options": ["A.0级", "B.Ⅰ级", "C.Ⅱ级", "D.Ⅲ级", "E.Ⅳ级"], "answer": "D", "explanation": "体外循环凝血程度分为4级：0级为透析器及血路管回血后无残留血液和血凝块；Ⅰ级为透析器回血后残留血液占透析器面积约1/3；Ⅱ级为残留血液占透析器面积1/2以上但没有全部阻塞；Ⅲ级为整个透析器全部被残留血液阻塞、血凝块充满动脉壶或静脉壶内。"}, {"text": "按照血液透析护理专业医疗质量控制指标，动静脉内瘘穿刺损伤发生率的分母是（  ）", "options": ["A.患者血液透析总例次数", "B.患者经动静脉内瘘血液透析总例次数", "C.血液净化用中心静脉导管留置总日数", "D.动静脉内瘘穿刺损伤例次数", "E.血液透析患者总人数"], "answer": "B", "explanation": "动静脉内瘘穿刺损伤发生率＝同期动静脉内瘘穿刺损伤例次数÷统计周期内患者经动静脉内瘘血液透析总例次数×100%，其分母为患者经动静脉内瘘血液透析总例次数。"}, {"text": "血液透析室不良事件是指（  ）", "options": ["A.仅指医疗事故", "B.仅指护理差错和缺陷", "C.仅指设备故障", "D.可能影响患者诊疗结果、增加痛苦及经济负担并可能引发医疗纠纷或医疗事故的因素及事件，也包括影响医务人员人身安全和医疗工作正常运行的因素和事件", "E.仅指患者投诉"], "answer": "D", "explanation": "不良事件是指医院运行和各类人员的医疗活动中，任何可能影响患者的诊疗结果，导致增加痛苦、经济负担和可能引发医疗纠纷或医疗事故的因素及事件；或者是影响医务人员人身安全和医疗工作正常运行的因素和事件。"}, {"text": "不良护理事件的发生机率，对于护理人员可能是（  ）", "options": ["A.0.1%", "B.1%", "C.10%", "D.50%", "E.100%"], "answer": "B", "explanation": "不良护理事件的发生机率：对于护理人员可能是1%，但对于发生的患者将是100%。当一件不良事件发生时，重点不是要归咎与谁，而是要看工作流程是否缺失、如何失效、培训是否到位。"}, {"text": "血透室风险分析采用的5M1E中，“1E”是指（  ）", "options": ["A.环境（Environment）", "B.设备（Equipment）", "C.能量（Energy）", "D.评价（Evaluation）", "E.教育（Education）"], "answer": "A", "explanation": "5M1E为：人（Man）——患者、医生、护士、工勤人员；机器（Machine）——仪器设备；材料（Material）——药品、物品、耗材；方法（Method）——规章制度、流程、护理常规、操作规范；测量（Measurement）——对制度、流程、规范等培训考核、执行情况的评价、检查；环境（Environment）——环境、布局。"}, {"text": "血透室管理因素中所称的“五常法”管理不包括（  ）", "options": ["A.常整理", "B.常整顿", "C.常清扫", "D.常自律", "E.常加班"], "answer": "E", "explanation": "管理因素中的“五常法”指常整理、常整顿、常清扫、常清洁、常自律。"}, {"text": "下列属于血透室患者因素（安全问题）的是（  ）", "options": ["A.人员配置不足", "B.查对不认真", "C.患者的违医行为", "D.设备物资管理不善", "E.不执行“五常法”管理"], "answer": "C", "explanation": "患者因素主要指治疗护理过程中，由于患者不遵守医疗行为造成的安全问题，包括患者的违医行为、病人价值观的改变和提高、病人期望值过高。"}, {"text": "按照血透室人员配置要求，血透室至少有2名执业医师，其中至少1名应具有（  ）", "options": ["A.肾脏病学中级以上专业技术职称", "B.肾脏病学副高以上职称", "C.护理学中级以上职称", "D.重症医学中级以上职称", "E.技师职业资格"], "answer": "A", "explanation": "血透室至少有2名执业医师，其中至少1名具有肾脏病学中级以上专业技术职称。"}, {"text": "按照血透室人员配置要求，20台血液透析机以上的，每新增10台血液透析机至少新增（  ）", "options": ["A.1名执业医师", "B.1名护士", "C.1名技师", "D.2名执业医师", "E.1名护师"], "answer": "A", "explanation": "20台血液透析机以上的，每新增10台血液透析机至少新增1名执业医师。"}, {"text": "按照血透室人员配置要求，血透室负责人应由（  ）担任", "options": ["A.肾脏病学副高以上职称执业医师", "B.肾脏病学中级以上职称执业医师", "C.副主任护师", "D.技师", "E.院感科负责人"], "answer": "A", "explanation": "血透室负责人应由肾脏病学副高以上职称执业医师担任。"}, {"text": "按照血透室人员配置要求，每台血透机至少配备护士（  ）", "options": ["A.0.2名", "B.0.3名", "C.0.4名", "D.0.5名", "E.1名"], "answer": "C", "explanation": "每台血透机至少配备0.4名护士；护士配备数量不足时，分成三班后可能无法满足每人护理不超过5张床的要求。"}, {"text": "按照血透室人员配置要求，血透室护士长或护理组长应由（  ）担任", "options": ["A.具备透析护理工作经验的中级以上职称的注册护士", "B.具备透析护理工作经验的初级职称护士", "C.护理学本科以上学历者", "D.具备5年以上工龄的主管护师", "E.科室投票产生的人员"], "answer": "A", "explanation": "血透室护士长或护理组长由具备透析护理工作经验的中级以上职称的注册护士担任。"}, {"text": "按照血透室人员配置要求，血透室至少配备1名熟悉血液透析机和水处理设备性能结构、工作原理和维修技术的（  ）", "options": ["A.技师", "B.执业医师", "C.责任护士", "D.设备工程师", "E.工勤人员"], "answer": "A", "explanation": "血透室至少配备1名熟悉血液透析机和水处理设备性能结构、工作原理和维修技术的技师；重庆绝大部分血液透析中心无专职技师，兼职技师的业务能力及水平有待提高。"}, {"text": "血透室十大安全目标中的目标一“确保透析用水和透析液的安全”的措施不包括（  ）", "options": ["A.制定和落实水处理系统的维护制度", "B.透析液的配制遵循透析液配置规程", "C.定期对透析用水、透析液进行质量监测", "D.定期对透析用水处理、透析液配置系统消毒", "E.每月更换全部透析器"], "answer": "E", "explanation": "目标一包括4项措施：制定和落实水处理系统的维护制度；透析液的配制遵循透析液配置规程；定期对透析用水、透析液进行质量监测；定期对透析用水处理、透析液配置系统消毒。"}, {"text": "血透室十大安全目标中的目标五“规范用药及设备耗材的管理”的要求不包括（  ）", "options": ["A.减少使用外购药品，需用时有告知程序", "B.规范药品保存、提取、使用流程管理", "C.注射剂、口服药严格分开放置", "D.用药医嘱有核对、签字程序", "E.药品可由患者自行携带并在透析中使用"], "answer": "E", "explanation": "目标五要求减少使用外购药品（需用时有告知程序）、规范药品保存提取使用流程管理、医护人员对药品有一定识别技能、注射剂与口服药严格分开放置、用药医嘱有核对签字程序、关注配伍禁忌与输液速度及输液反应、建立药物使用后不良反应的观察制度和程序、加强高危与冰箱药物管理、建立设备档案及设备维护、做好透析耗材的管理。"}, {"text": "血透室十大安全目标中的目标七“危急值”报告制度中，需根据医院情况认定的“危急值”项目不包括（  ）", "options": ["A.血钙", "B.血钾", "C.血糖", "D.血气", "E.身高体重"], "answer": "E", "explanation": "目标七内容包括：制定“危急值”报告制度，建立“危急值”报告登记；根据医院情况认定如血钙、血钾、血糖、血气、白细胞、血小板、凝血酶原时间等；做好标本采集、储存、运送、交接、处理等质量控制。"}, {"text": "下列不属于血液透析中需紧急处理的事件是（  ）", "options": ["A.首次使用综合征", "B.致热原反应", "C.空气栓塞", "D.电源中断", "E.每季度更换透析器品牌"], "answer": "E", "explanation": "血液透析中需提高紧急事件处理能力的事件包括首次使用综合征、致热原反应、空气栓塞、留置导管感染、凝血、血肿、血栓、休克、渗血、溶血、破膜、空气报警、电源中断、水源中断、水质异常等。"}, {"text": "血透室十大安全目标中的目标六“防范患者跌倒事件的发生”，对所有透析患者应（  ）", "options": ["A.进行跌倒风险评估并告知", "B.限制其下床活动", "C.安排专人24小时看护", "D.每日测量步态", "E.一律使用约束具"], "answer": "A", "explanation": "目标六要求对所有透析患者进行跌倒风险评估并告知，同时建立跌倒报告和伤情认定制度和程序、设有明显的防跌倒安全警示、认真实施有效的跌倒防范制度和措施、护理人力与服务对象配比合理。"}]}, {"type": "multiple", "questions": [{"text": "关于血透室不良事件的界定与报告，下列表述正确的有（  ）", "options": ["Ａ.不良事件是指可能影响患者诊疗结果、增加痛苦和经济负担并可能引发医疗纠纷或医疗事故的因素及事件", "Ｂ.不良事件也包括影响医务人员人身安全和医疗工作正常运行的因素和事件", "Ｃ.提倡和鼓励医护人员主动报告威胁病人安全的不良事件", "Ｄ.对主动上报的不良事件采取不处罚或减轻处罚的方式", "Ｅ.一件不良事件发生时，重点是追究责任到个人"], "answer": "ABCD", "explanation": "不良事件的界定包括A、B两项所述内容。鼓励主动报告不良事件的措施包括：提倡和鼓励医护人员主动报告威胁病人安全的不良事件的制度和机制；对主动上报的不良事件采取不处罚或减轻处罚的方式；安全信息与医院实际情况结合，持续改进医疗护理安全；主动邀请患者参与安全管理，教育患者提供真实病情信息；科室有接待患者投诉的方式和途径；对护理不良事件及病人反映的信息，有原因分析和防范改进措施。不良护理事件的发生机率对于护理人员可能是1%，对于发生的患者将是100%；一件不良事件发生时，重点不是要归咎与谁，而是要看工作流程是否缺失、如何失效、培训是否到位，故E错误。"}, {"text": "关于渝中血透室护理质控小组的设置，下列正确的有（  ）", "options": ["Ａ.设有耗材库房、急救车和药品管理组", "Ｂ.设有院感管理组", "Ｃ.设有6S及礼仪管理组", "Ｄ.设有设备、后勤及消防管理组", "Ｅ.各质控小组无需设置管理组长，也无需定期修订质控标准"], "answer": "ABCD", "explanation": "渝中血透室护理质控小组按职责划分为：耗材库房、急救车和药品管理组；院感管理组；6S及礼仪管理组；设备、后勤及消防管理组；病历及患者管理组；人力资源、教学培训管理组。管理组长负责分配组内成员职责，各管理小组需根据科室具体情况制定、定期修订各小组质控标准，质控项目有记录，故E错误。"}, {"text": "关于血透室护理质控小组的质控要求，下列正确的有（  ）", "options": ["Ａ.急救车定期（每周）质控，并做好急救设备、仪器的培训和记录", "Ｂ.各种临床并发症应急预案的培训、记录，每季度不低于一次", "Ｃ.院感问题持续改进每年至少2次", "Ｄ.水处理每日监测总氯（余氯）和硬度", "Ｅ.设备管理持续改进每年至少1次"], "answer": "ABCD", "explanation": "耗材库房、急救车和药品管理组要求急救车定期（每周）质控并做好急救设备、仪器的培训和记录；人力资源、教学培训管理组要求各种临床并发症应急预案的培训、记录每季度不低于一次；院感管理组要求院感问题持续改进每年至少2次；设备、后勤及消防管理组要求水处理每日监测总氯（余氯）和硬度，设备管理持续改进每年至少2次，故“设备管理持续改进每年至少1次”错误。"}, {"text": "关于血液净化中心环境检测的频次，下列表述正确的有（  ）", "options": ["Ａ.每月一次进行透析液、置换液、透析用水细菌学监测、空气监测及物表、手、消毒液细菌学监测", "Ｂ.每三月一次进行透析用水、置换液、透析液内毒素监测", "Ｃ.每年至少一次进行化学污染物检查", "Ｄ.新机器或者新更换水路管道等，随时查细菌、内毒素等", "Ｅ.透析用水、透析液内毒素监测每月一次"], "answer": "ABCD", "explanation": "每月一次的项目为透析液、置换液、透析用水细菌学监测，空气监测，物表、手、消毒液细菌学监测；每三月一次的项目为透析用水、置换液、透析液内毒素监测；每年至少一次的项目为化学污染物检查；新机器或者新更换水路管道等随时查细菌、内毒素等；细菌监测和内毒素监测每年每台机器至少进行一次，故E错误。"}, {"text": "关于透析用水和透析液细菌培养可使用的培养基，下列正确的有（  ）", "options": ["Ａ.胰化蛋白胨葡萄糖（TGEA）培养基", "Ｂ.R2A营养琼脂培养基", "Ｃ.血琼脂培养基", "Ｄ.巧克力琼脂培养基", "Ｅ.其他确认能提供相同结果的培养基"], "answer": "ABE", "explanation": "透析用水和透析液培养方法参照《血液透析及相关治疗用水》（YY 0572-2015）标准规范执行，可选择胰化蛋白胨葡萄糖（TGEA）培养基、R2A营养琼脂培养基或其他确认能提供相同结果的培养基，不能使用血琼脂培养基和巧克力琼脂培养基，故C、D错误。"}, {"text": "关于透析用水和透析液细菌与内毒素的控制要求，下列正确的有（  ）", "options": ["Ａ.每月1次进行透析用水和透析液的细菌检测，保持细菌数量≤100CFU/ml", "Ｂ.细菌数量&gt;50CFU/ml应进行干预", "Ｃ.透析用水内毒素≤0.25EU/ml", "Ｄ.内毒素超过最大允许水平的50%应进行干预", "Ｅ.透析液内毒素≤0.05EU/ml"], "answer": "ABCD", "explanation": "透析用水和透析液的细菌检测每月1次，保持细菌数量≤100CFU/ml，细菌数量&gt;50CFU/ml应进行干预；至少每3个月进行1次内毒素检测，保持透析用水内毒素≤0.25EU/ml及透析液内毒素≤0.5EU/ml，超过最大允许水平的50%应进行干预，故“透析液内毒素≤0.05EU/ml”错误。"}, {"text": "关于透析用水和透析液的培养与内毒素检测方法，下列正确的有（  ）", "options": ["Ａ.培养方法参照《血液透析及相关治疗用水》（YY 0572-2015）执行", "Ｂ.推荐17～23℃的培养温度", "Ｃ.推荐7d的培养时间", "Ｄ.应使用试剂法测定内毒素", "Ｅ.推荐35～37℃的培养温度"], "answer": "ABCD", "explanation": "透析用水和透析液培养方法参照《血液透析及相关治疗用水》（YY 0572-2015）标准规范执行，推荐17～23℃的培养温度和7d的培养时间；内毒素应使用试剂法测定，或其他确认能提供相同结果的检测方法，故“推荐35～37℃的培养温度”错误。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，检测频率为每6个月1次的项目有（  ）", "options": ["Ａ.血清铁蛋白和转铁蛋白饱和度", "Ｂ.全段甲状旁腺激素", "Ｃ.血清前白蛋白", "Ｄ.血常规", "Ｅ.血液生化（肝肾功能、电解质、血脂等）"], "answer": "ABC", "explanation": "血清铁蛋白和转铁蛋白饱和度、全段甲状旁腺激素、血清前白蛋白、C反应蛋白、β2微球蛋白、Kt/V和URR均为每6个月1次；血常规和血液生化（肝肾功能、电解质、血脂等）为每3个月1次，故D、E错误。"}, {"text": "按照血液透析患者医疗质量管理指标及检测频率的要求，关于乙型肝炎、丙型肝炎、梅毒和艾滋病标志物的检测，下列正确的有（  ）", "options": ["Ａ.新导入或新转入患者即时检测，3个月内复检", "Ｂ.长期透析患者每6个月1次", "Ｃ.阳性转阴患者前6个月每月1次", "Ｄ.阳性转阴患者后6个月每3个月1次", "Ｅ.新发患者的密切接触者无需检测"], "answer": "ABCD", "explanation": "血源性传染病标志物检测要求：新导入或新转入患者即时检测，3个月内复检；长期透析患者每6个月1次；阳性转阴患者前6个月每月1次、后6个月每3个月1次；新发患者的密切接触者即时检测，故E错误。"}, {"text": "维持性血液透析患者慢性肾脏病-矿物质与骨异常（CKD-MBD）指标控制要求中，下列正确的有（  ）", "options": ["Ａ.钙达标范围2.1mmol/l～2.55mmol/l", "Ｂ.磷达标率为&lt;1.78mmol/l", "Ｃ.iPTH达标率为150≤iPTH≤600pg/ml", "Ｄ.需统计钙、磷、iPTH同时达标率", "Ｅ.血红蛋白达标为≥130g/l"], "answer": "ABCD", "explanation": "CKD-MBD指标控制率中，钙达标（2.1mmol/l～2.55mmol/l）、磷达标率（&lt;1.78mmol/l）、IPTH达标率（150≤iPTH≤600pg/ml），并统计钙、磷、iPTH同时达标率；血红蛋白≥110g/l为肾性贫血控制率的标准，故E错误。"}, {"text": "血液透析护理专业医疗质量控制指标（试用版）包括（  ）", "options": ["Ａ.护患比", "Ｂ.体外循环凝血发生率", "Ｃ.体外循环漏血发生率", "Ｄ.动静脉内瘘穿刺损伤发生率", "Ｅ.患者满意度"], "answer": "ABCD", "explanation": "血液透析护理专业医疗质量控制指标（试用版）共5项：指标一护患比、指标二体外循环凝血发生率、指标三体外循环漏血发生率、指标四动静脉内瘘穿刺损伤发生率、指标五血液净化用中心静脉导管相关血流感染发生率，不包括患者满意度，故E错误。"}, {"text": "按照血液透析护理专业医疗质量控制指标的要求，关于责任护士与护患比，下列正确的有（  ）", "options": ["Ａ.责任护士指直接照护血透患者的执业护士", "Ｂ.计算责任护士人力时应包含辅助护理岗位护士人力", "Ｃ.排除治疗护士（配药护士）、办公班护士（主班）、护士长等其它岗位护士", "Ｄ.责任护士每工作8小时计为1名责任护士人力", "Ｅ.护患比统计包括行连续性肾脏替代治疗（CRRT）的责任护士人数及患者数"], "answer": "ABCD", "explanation": "责任护士指直接照护血透患者的执业护士；计算责任护士人力时应包含所有直接服务血透患者的班次及辅助护理岗位护士人力，排除非直接护理血透患者的治疗护士（配药护士）、办公班护士（主班）、护士长等其它岗位护士（护士长承担责任护士的工作时需计算在内）；责任护士每工作8小时计为1名责任护士人力；护患比不包括行连续性肾脏替代治疗（CRRT）的责任护士人数及患者数，故E错误。"}, {"text": "关于血液透析体外循环凝血程度分级，下列描述正确的有（  ）", "options": ["Ａ.0级：透析器及血路管回血后无残留血液和血凝块", "Ｂ.Ⅰ级：透析器回血后残留血液占透析器面积约1/3，血路管动脉壶或静脉壶内可见一端有血凝块", "Ｃ.Ⅱ级：透析器回血后残留血液占透析器面积1/2以上，但没有全部阻塞", "Ｄ.Ⅲ级：透析器回血后整个透析器全部被残留血液阻塞，血凝块充满动脉壶或静脉壶内", "Ｅ.凝血程度共分为3级"], "answer": "ABCD", "explanation": "参照《血液透析护理实践指导手册》，血液透析体外循环凝血程度分为4级：0级、Ⅰ级、Ⅱ级、Ⅲ级，故E错误。Ⅱ级的另一表现为血路管回血后管路动脉壶或静脉壶内两端均可见有血凝块。"}, {"text": "关于体外循环漏血的界定，下列情形属于漏血的有（  ）", "options": ["Ａ.动静脉穿刺针脱离血管", "Ｂ.透析器与血路管连接不严密", "Ｃ.血液管路侧枝夹子未夹闭或者保护帽脱落", "Ｄ.动静脉内瘘穿刺失败导致的局部皮下血肿", "Ｅ.透析后动静脉内瘘出血肿胀、堵塞"], "answer": "ABC", "explanation": "参照《实用血液净化护理（第2版）》，体外循环漏血是指动静脉穿刺针脱离血管、透析器与血路管、血路管与穿刺针或中心静脉导管连接不严密，血液管路侧枝夹子未夹闭或者保护帽脱落等所造成的漏血。动静脉内瘘穿刺失败造成的皮下出血、淤血、血肿属于动静脉内瘘穿刺损伤；透析后动静脉内瘘出血肿胀、堵塞属于透析后风险，故D、E错误。"}, {"text": "关于血液净化用中心静脉导管相关血流感染，下列正确的有（  ）", "options": ["Ａ.指血管导管留置期间及拔除血管导管后48小时内发生的原发性感染", "Ｂ.该感染与其他部位感染无关", "Ｃ.同一患者在统计周期内发生导管相关感染例次数按感染实际发生频次计算", "Ｄ.导管出口处无红肿热痛即可排除该感染", "Ｅ.透析结束后低热不能作为怀疑该感染的依据"], "answer": "ABC", "explanation": "血液净化用中心静脉导管相关血流感染是指血管导管留置期间及拔除血管导管后48小时内发生的原发性、且与其他部位感染无关的感染；同一患者在统计周期内发生导管相关感染例次数以感染实际发生频次计算。患者经中心静脉导管行血液透析数分钟至数十分钟，若出现畏寒、寒颤、发热、不明原因的低血压、呕吐等全身症状，也有少数患者表现为血液透析结束后低热，无论其导管出口处和隧道是否出现红、肿、热、痛、有脓液等异常，都疑似发生血管内导管相关血流感染，故D、E错误。"}, {"text": "血透室风险分析采用的5M1E包括（  ）", "options": ["Ａ.人（Man）", "Ｂ.机器（Machine）", "Ｃ.材料（Material）", "Ｄ.方法（Method）", "Ｅ.收入（Money）"], "answer": "ABCD", "explanation": "血透室风险分析采用5M1E：人（Man）——患者、医生、护士、工勤人员；机器（Machine）——仪器设备；材料（Material）——药品、物品、耗材；方法（Method）——规章制度、流程、护理常规、操作规范；测量（Measurement）——对制度、流程、规范等培训考核、执行情况的评价、检查；环境（Environment）——环境、布局。5M1E中不含“收入（Money）”，故E错误。"}, {"text": "血透室风险分析中，属于管理因素的有（  ）", "options": ["Ａ.不注重岗前培训", "Ｂ.业务培训不到位", "Ｃ.管理制度不健全", "Ｄ.有制度不执行", "Ｅ.患者的违医行为"], "answer": "ABCD", "explanation": "管理因素包括不注重岗前培训、业务培训不到位、管理制度不健全、有制度不执行、设备物资管理不善、不执行“五常法”（常整理、常整顿、常清扫、常清洁、常自律）管理、管理监督不得力、流于形式；患者的违医行为属于患者因素，故E错误。"}, {"text": "血液透析室存在的特有风险包括（  ）", "options": ["Ａ.操作", "Ｂ.并发症", "Ｃ.设备", "Ｄ.后期并发症", "Ｅ.医疗费用纠纷"], "answer": "ABCD", "explanation": "血液透析室存在的特有风险：一、操作——护理操作中的风险；二、并发症——透析过程中发生并发症的风险；三、设备——透析机操作不当或者运转不良的风险；四、后期并发症——透析后期发生感染等并发症的风险。医疗费用纠纷不属于这四类特有风险，故E错误。"}, {"text": "属于透析过程中发生的并发症有（  ）", "options": ["Ａ.透析中发生休克", "Ｂ.首次使用综合征", "Ｃ.透析中发生溶血", "Ｄ.无肝素透析发生凝血", "Ｅ.动静脉内瘘出血肿胀、堵塞"], "answer": "ABCD", "explanation": "透析过程中发生的并发症包括：透析中发生休克、首次使用综合征、透析中致热原反应、透析中发生溶血、透析过程中静脉血肿、透析中发生空气栓塞、无肝素透析发生凝血。动静脉内瘘出血肿胀、堵塞属于透析后风险，故E错误。"}, {"text": "属于透析后风险的有（  ）", "options": ["Ａ.动静脉内瘘出血肿胀、堵塞", "Ｂ.深静脉留置导管血栓、感染", "Ｃ.透析后感染血液传染病", "Ｄ.透析后低血压", "Ｅ.首次使用综合征"], "answer": "ABCD", "explanation": "透析后风险包括动静脉内瘘出血肿胀、堵塞；深静脉留置导管血栓、感染；透析后感染血液传染病；透析后低血压。首次使用综合征属于透析过程中发生的并发症，故E错误。"}, {"text": "透析机器运转及操作中的风险包括（  ）", "options": ["Ａ.透析机器运转不良", "Ｂ.透析机出现空气报警", "Ｃ.透析时电源中断", "Ｄ.透析时水源中断", "Ｅ.动静脉穿刺失败"], "answer": "ABCD", "explanation": "透析机器运转及操作中的风险包括：透析机器运转不良、透析机出现空气报警、透析时电源中断、透析时水源中断、管路破裂、设备故障引起多脱或少脱水份、水质异常。动静脉穿刺失败属于护理操作风险，故E错误。"}, {"text": "血透室十大安全目标中的目标二“提高对患者身份识别的准确性”的措施包括（  ）", "options": ["Ａ.严格执行查对制度", "Ｂ.至少同时使用两种患者识别方法", "Ｃ.严格执行输血核查制度", "Ｄ.使用门诊透析卡或腕带做为身份识别的信息载体", "Ｅ.每月更换一次腕带颜色"], "answer": "ABCD", "explanation": "目标二措施包括：严格执行查对制度；健全完善患者身份识别制度（标本采集、给药、输血等）；至少同时使用两种患者识别方法；严格执行输血核查制度；使用门诊透析卡或腕带做为身份识别的信息载体，故E错误。"}, {"text": "血透室十大安全目标中的目标三“落实感控制度”的措施包括（  ）", "options": ["Ａ.新入科病人首次接受血液透析治疗前应进行HCV、HBV、梅毒、艾滋等传染病实验室检查", "Ｂ.传染病人专机专区治疗，物品专用、标识明确、定位放置，护理人员相对固定", "Ｃ.严格执行标准预防，配置有效便捷的手卫生设备和设施", "Ｄ.有医院及血液透析专科感染管理的相关制度、流程，落实血透机的外部和内部消毒", "Ｅ.传染病人在更换透析器后可与阴性患者同时段治疗"], "answer": "ABCD", "explanation": "目标三要求：完善血液传染病实验室检查，新入科病人（包括外院血透转入患者）首次接受血液透析治疗前应进行HCV、HBV、梅毒、艾滋等传染病实验室检查，至少3个月内重复检查一次，之后至少每六个月检查一次；传染病人专机专区治疗，物品专用、标识明确、定位放置，护理人员相对固定，禁止同时段照顾阴性患者；严格执行标准预防，做好个人防护，配置有效便捷的手卫生设备和设施，落实手卫生管理制度；有医院及血液透析专科感染管理的相关制度、流程，科室检查制度、流程落实情况、对存在问题与缺陷有改进措施，落实血透机的外部和内部消毒，并有应急预案的演练和培训。故E错误。"}, {"text": "血透室十大安全目标中的目标四“保证透析过程中体外循环安全”的主要安全隐患有（  ）", "options": ["Ａ.空气栓塞", "Ｂ.意外失血", "Ｃ.管路凝血", "Ｄ.透析液内毒素超标", "Ｅ.透析液配方错误"], "answer": "ABC", "explanation": "目标四的安全隐患包括空气栓塞、意外失血、管路凝血。空气栓塞可由动脉管路连接不紧或有裂缝、输液输血时液体滴空未夹闭、回血操作失误或血泵失控、静脉壶液面低等导致；意外失血可由循环血路开放（管路与透析器、内瘘针连接处未拧紧）、各侧管夹子忘夹、测压器连接不紧、穿刺针或导管脱出、透析器破膜等导致；患者高凝倾向、血流量不足、无抗凝剂透析、透中输注脂肪乳及血制品等粘稠液体是管路凝血的主要原因。透析液内毒素超标与配方错误不属于目标四的安全隐患，故D、E错误。"}, {"text": "血透室十大安全目标中的目标四“保证透析过程中体外循环安全”的措施包括（  ）", "options": ["Ａ.规范统一的操作，如预充、回血、内瘘针的固定方法、无肝素透析等", "Ｂ.上机时须有上级护士再次核对治疗参数、抗凝剂使用，检查管路的密闭性，双人签字", "Ｃ.落实体外循环风险检查措施，及时发现并解决问题，不可过于依赖机器报警", "Ｄ.设置巡回护士，负责血液透析全过程的安全质量监控", "Ｅ.发现凝血先兆时应等待机器报警后再处理"], "answer": "ABCD", "explanation": "目标四措施共6条：规范统一的操作（如预充、回血、内瘘针的固定方法、无肝素透析等）；准确执行医嘱（上机时须有上级护士再次核对治疗参数、抗凝剂使用，检查管路的密闭性，双人签字）；落实体外循环风险检查措施（重点巡查导管及内瘘针固定是否妥当、有无凝血先兆、管路密闭系统，及时发现并解决问题，不可过于依赖机器报警）；设置巡回护士，负责血液透析全过程的安全质量监控；加强对重点病人的巡视检查（如输液输血患者、脱水量相对较多患者、老年患者、神志不清或躁动患者、经常低血压患者等）；透中输液根据具体情况使用输液泵。发现凝血先兆应立即处理而不能等待机器报警，故E错误。"}, {"text": "血透室十大安全目标中的目标六“防范患者跌倒事件的发生”的措施包括（  ）", "options": ["Ａ.建立跌倒报告和伤情认定制度和程序", "Ｂ.对所有透析患者进行跌倒风险评估并告知", "Ｃ.有明显的防跌倒安全警示", "Ｄ.认真实施有效的跌倒防范制度和措施", "Ｅ.限制患者一切下床活动"], "answer": "ABCD", "explanation": "目标六的措施共5项：建立跌倒报告和伤情认定制度和程序；对所有透析患者进行跌倒风险评估并告知；有明显的防跌倒安全警示；认真实施有效的跌倒防范制度和措施；护理人力与服务对象配比合理。限制患者一切下床活动并非目标六的措施，故E错误。"}, {"text": "关于透析患者的跌倒风险评估，下列表述正确的有（  ）", "options": ["Ａ.下肢肌力评估为“×”，危险因子评估无论多少分均为高危", "Ｂ.下肢肌力评估为“√”，危险因子评估≥3分亦为高危", "Ｃ.所有患者入科时均需评估", "Ｄ.高危患者每周复评一次，非高危患者每两周复评一次", "Ｅ.患者病情变化时无需复评"], "answer": "ABCD", "explanation": "跌倒风险评估表使用说明：下肢肌力评估为“×”者，危险因子评估无论多少分均为高危；下肢肌力评估为“√”且危险因子评估≥3分亦为高危；下肢肌力评估为“√”且危险因子评估&lt;3分为非高危。所有患者入科时均需评估，高危患者每周复评一次，非高危患者每两周复评一次；如遇病情变化，跌倒危险因子部分发生改变时随时复评，故E错误。"}, {"text": "血透室十大安全目标中的目标九“落实血液透析患者的液体及通路管理”的措施包括（  ）", "options": ["Ａ.定时进行干体重评估", "Ｂ.评估该患者上月的体液增长情况及其余情况", "Ｃ.根据评估情况进行个体化宣教", "Ｄ.每月一次的质控会分析记录血管通路的情况", "Ｅ.干体重一旦确定不再调整"], "answer": "ABCD", "explanation": "目标九要求定时进行干体重评估；患者评估单评估该患者上月的体液增长情况及其余情况；根据评估情况进行个体化宣教。血管通路管理内容包括血管通路的保护和宣教、血管通路的评估及变化观察记录、肾内科血管超声的使用与肾内科血管通路门诊、每月一次的质控会分析记录血管通路的情况、每季度责任护士评估患者通路情况。干体重机是比较直观的判断患者干体重的方式，但不是金标准，干体重需结合体液增长情况动态评估，故E错误。"}, {"text": "血透室十大安全目标中的目标十“合理使用和培训血液净化专业护士”的措施包括（  ）", "options": ["Ａ.新入科护士必须接受至少12周的岗前培训", "Ｂ.透析过程中每名护士同时管理的患者数量为4～5名", "Ｃ.护士和分管病人相对固定", "Ｄ.设立护理组，组长对本区域的护理安全和质控负责", "Ｅ.新入科护士可独立上岗，无需岗前培训"], "answer": "ABCD", "explanation": "目标十措施包括：新入科护士必须接受至少12周的岗前培训；制定并落实培训考核制度，统一理论授课，跟班操作实践；透析过程中每名护士同时管理的患者数量为4～5名，护士和分管病人相对固定；有效利用护理人力资源，设立护理组，组长对本区域的护理安全和质控负责；开展专业护士核心能力培训计划；根据护士层级合理进行排班。故E错误。"}, {"text": "关于血透室高警示药品（氯化钾注射液）的管理，下列做法正确的有（  ）", "options": ["Ａ.由药房发回科室后，当班护士做好患者床号及姓名显著标识并登记在药品交接本上", "Ｂ.单独定位存放于高危警示药品柜并上锁，严禁与其他药物混放", "Ｃ.由医嘱执行护士于高危警示药品柜取药，经双人查对后于治疗室遵医嘱加药", "Ｄ.现配现用，使用后配药空针立即丢弃", "Ｅ.可将药品带出治疗室，方便随时取用"], "answer": "ABCD", "explanation": "高警示药品是指少数特定的使用不当会对患者造成严重伤害或死亡的药物，具有药理作用显著、毒性大、治疗窗窄、风险高等特点，管理目标为防范与减少意外伤害、保障患者用药安全，管理责任人为护士长。血透室科室无氯化钾注射液的基础药储备，需用药时开医嘱由门诊药房拿药至科室储存；药品发回科室后当班护士做好患者床号及姓名显著标识并登记在药品交接本上，单独定位存放于高危示药品柜并上锁，严禁与其他药物混放；医嘱执行护士于高危警示药品柜取药，经双人查对后于治疗室遵医嘱加药，现配现用，使用后配药空针立即丢弃，严禁将药品带出治疗室，故E错误。"}]}, {"type": "short", "questions": [{"text": "简述血液净化中心质控会（质量安全小组会议）的召开频次与主要内容，并说明血透室质控中医护如何分工协作。", "options": [], "answer": "【频次】每月一次。【主要内容】包括六个方面：一、基础数据；二、透析并发症；三、血管通路情况；四、环境监测情况；五、维持性透析患者质量检测指标；六、护理各质控小组检查。【医护分工协作】血透室的特殊之处是医护一体、质控会共同参与。患者透析质量方面：医生调整各医嘱及透析处方，护士执行；护士反馈，医生调整，护士再执行。患者治疗安全方面：护士执行，医护观察，医生医嘱，护士再执行。院感安全方面：医护共同遵循，共同守护。", "explanation": "质控会是评价血透室医疗质量水平、发现有无出现影响医疗质量和患者安全各种问题的途径，频次为每月一次。各护理质控小组的质控项目有记录，每月由组长在质控会上进行工作汇报；带*者为管理组长，负责分配组内成员职责，各管理小组需根据科室具体情况制定、定期修订各小组质控标准。基础数据包括血透机台数、专职医护人员数、治疗总例次、维持性血透患者死亡例数、血透中严重并发症例次、血源性传染病转阳例数与检验完成率等；每月还需统计透析间期体重增长控制率、动静脉内瘘长期使用率等指标。"}, {"text": "简述血透室对透析用水和透析液质量监测的频次、控制标准、干预水平、结果处理及检测方法。", "options": [], "answer": "【监测频次】每月一次：透析液、置换液、透析用水细菌学监测，空气监测，物表、手、消毒液细菌学监测；每三月一次：透析用水、置换液、透析液内毒素监测；每年至少一次：化学污染物检查；随时：新机器或者新更换水路管道等，查细菌、内毒素等。细菌监测和内毒素监测每年每台机器至少进行一次。【控制标准】空气平均细菌菌落总数≤4CFU/（5min·9cm直径平皿）；物体表面平均细菌菌落总数≤10CFU/cm²；医务人员卫生手消毒后手表面细菌菌落总数≤10CFU/cm²；透析用水和透析液细菌数量≤100CFU/ml；透析用水内毒素≤0.25EU/ml，透析液内毒素≤0.5EU/ml。【干预水平】细菌数量&gt;50CFU/ml应进行干预；内毒素超过最大允许水平的50%应进行干预。【结果处理】透析用水的细菌或内毒素水平达到干预水平，应对水处理系统进行消毒；透析用水的细菌和内毒素水平合格而透析液的细菌或内毒素水平超标，应对所有同型号透析机进行透析液细菌和内毒素检测，并校验透析机消毒程序；对于不符合或达到干预标准的水处理系统和/或透析机，必须重新消毒且符合标准后方可使用。【检测方法】透析用水和透析液培养方法参照《血液透析及相关治疗用水》（YY 0572-2015）标准规范执行，可选择胰化蛋白胨葡萄糖（TGEA）培养基、R2A营养琼脂培养基或其他确认能提供相同结果的培养基，不能使用血琼脂培养基和巧克力琼脂培养基，推荐17～23℃的培养温度和7d的培养时间；内毒素应使用试剂法测定，或其他确认能提供相同结果的检测方法。", "explanation": "监测频次属于血透室质控会六项内容中的“环境监测情况”。每月1次进行透析用水和透析液的细菌检测、至少每3个月进行1次内毒素检测是最低频次要求，同时对透析室的空气、物体、机器表面及部分医务人员手每月抽样进行病原微生物培养监测，保留原始记录、建立登记表。空气、物表、手、细菌、内毒素的标准值与干预值均须对照标准执行；达到干预水平时的处理重点是水处理系统与透析机消毒后复测合格，方可用于透析治疗。"}, {"text": "请列出并简述血透室十大安全目标。", "options": [], "answer": "1.确保透析用水、透析液的安全管理；2.提高对患者身份识别的准确性；3.落实感控制度，防止交叉感染；4.保证透析过程中体外循环安全；5.规范用药设备耗材的管理；6.防范患者跌倒事件的发生；7.“危急值”报告制度；8.提高血液透析中紧急事件的处理能力；9.落实血液透析患者的液体及通路管理；10.合理使用和培训血液净化专业护士。", "explanation": "十条安全目标依次展开即为血透室十大安全目标中的目标一至目标十：目标一确保透析用水和透析液的安全（制定并落实水处理系统维护制度、按规程配制透析液、定期监测透析用水和透析液质量、定期消毒水处理和透析液配置系统）；目标二提高对患者身份识别的准确性；目标三落实感控制度；目标四保证透析过程中体外循环安全；目标五规范用药及设备耗材管理；目标六防范患者跌倒事件的发生；目标七“危急值”报告制度；目标八提高血液透析中紧急事件的处理能力；目标九落实血液透析患者的液体及通路管理；目标十合理使用和培训血液净化专业护士。"}, {"text": "简述血透室十大安全目标中的目标四“保证透析过程中体外循环安全”的主要安全隐患及应对措施。", "options": [], "answer": "【主要安全隐患】①空气栓塞：动脉管路连接不紧或有裂缝，输液输血时液体滴空未夹闭，回血操作时失误或血泵失控，静脉壶液面低等都可导致空气进入。②意外失血：循环血路开放，如管路与透析器、内瘘针连接处未拧紧；各侧管夹子忘夹，测压器连接不紧、静脉压力大；穿刺针或导管全部或部分脱出；透析器破膜等均可导致大量失血。③管路凝血：患者存在高凝倾向，血流量不足，无抗凝剂透析，透中输注脂肪乳、血制品等粘稠液体是管路凝血的主要原因。【应对措施】①规范统一的操作，如预充、回血、内瘘针的固定方法、无肝素透析等；②准确执行医嘱：上机时须有上级护士再次核对治疗参数、抗凝剂使用，检查管路的密闭性，双人签字；③落实体外循环风险检查措施：重点巡查导管及内瘘针固定是否妥当、有无凝血先兆、管路密闭系统，及时发现并解决问题，不可过于依赖机器报警；④设置巡回护士，负责血液透析全过程的安全质量监控；⑤加强对重点病人的巡视检查，如输液输血患者、脱水量相对较多患者、老年患者、神志不清或躁动患者、经常低血压患者等；⑥透中输液根据具体情况使用输液泵。", "explanation": "目标四的落脚点是把体外循环的隐患控制在“可发现、可处理”的范围内：预充、回血、内瘘针固定、无肝素透析等操作要求规范统一；治疗参数与抗凝剂使用须由上级护士再次核对并双人签字；导管及内瘘针固定、凝血先兆、管路密闭系统是重点巡查内容；对重点病人（输液输血、脱水量相对较多、老年、神志不清或躁动、经常低血压患者）要加强巡视；透中输液根据具体情况使用输液泵，以降低因液体滴空等因素导致空气进入的风险。"}, {"text": "简述标准预防的定义与主要内容，并说明手卫生的5个时机。", "options": [], "answer": "【定义】标准预防：将所有患者视为具有潜在感染性患者，即认为患者的血液、体液、分泌物、排泄物均具有传染性，不论是否有明显的血液或是否接触非完整的皮肤与粘膜，必须采取防护措施。特点是既要防止血源性疾病的传播，也要防止非血源性疾病的传播；强调双向防护，既要预防疾病由患者传至医务人员，又要防止疾病从医务人员传给患者。【主要内容】手卫生是医疗机构内预防控制疾病传播的重要措施之一，也是标准预防的主要组成部分；标准预防还包括根据预期可能的暴露选择合适的个人防护用品、呼吸卫生（咳嗽）礼仪、仪器（设备）和环境清洁消毒、织物清洁消毒、安全注射、职业防护等多项预防感染措施。不要因为分区产生虚假的安全感。【手卫生5个时机】时机1：接触患者前，保护患者不受工作人员手上的细菌侵害；时机2：执行清洁、无菌操作前，保护患者不受有害细菌的侵害；时机3：体液暴露风险后，摘除手套立即洗手；时机4：接触患者后，保护自己和环境不受有害细菌的侵害；时机5：接触患者周围环境后，接触任何患者周围环境或其中的物品、器具后应洗手。", "explanation": "标准预防强调双向防护，是血液透析室院感防控的基础，院感注意事项还包括血液透析室人力资源配置、A液与B液的相关清洗消毒、手卫生的实施、标准预防、一次性使用物品的规范使用等。手卫生时机与操作行为相对应：接触患者前、执行清洁与无菌操作前属于保护患者的时机，体液暴露风险后、接触患者后、接触患者周围环境后属于保护自己和环境的时机。重复利用AB液桶按照要求每周消毒1次，B液未用完24小时内废弃。"}, {"text": "简述血透室十大安全目标中的目标三“落实感控制度”的具体措施。", "options": [], "answer": "1.完善血液传染病实验室检查：新入科病人（包括外
